const KEY='bem_g4_practice_v1';

function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let state={view:'home',mode:(store.mode||'practice'),size:(store.size||'base'),ch:null,part:null,i:0,sel:null,checked:false,answers:[],revealed:false};
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function setSize(s){state.size=s;store.size=s;save();document.body.className=s==='base'?'':s}
setSize(state.size);
function bestKey(ch,part){return `best_${ch}_${part}`}
function topbar(){
  return `<div class="top"><div class="brand">Bright EngMath<span style="font-family:Nunito;font-weight:600;font-size:.7em;color:var(--ink2)">Grade 4 Math Practice</span></div><div class="spacer"></div>

function progress(ch){const parts=['mc','sa','wp','pt'];let done=0;parts.forEach(p=>{if(store[bestKey(ch.n,p)]!=null)done++});return Math.round(done/4*100)}
function home(){
  const tiles=DATA.map(ch=>{const b=store[bestKey(ch.n,'mc')];return `<button class="ch" style="--c:${ch.color}" data-act="open" data-ch="${ch.n}"><span class="num">CHAPTER ${ch.n}</span><span class="t">${esc(ch.title)}</span><span class="meta"><span>${ch.lessons.length} lessons</span>${b!=null?`<span class="pill">Quiz best ${b}/12</span>`:''}</span><span class="bar"><i style="width:${progress(ch)}%"></i></span></button>`}).join('');

function chapter(){

  <div class="parts">
  ${partCard('Part A','Quick Check','12 multiple-choice questions with instant feedback and explanations.','mc',B('mc')!=null?`Best score: ${B('mc')}/12`:'Not started')}
  ${partCard('Part B','Short Answer','10 open questions. Work it out, then reveal the answer and self-check.','sa',B('sa')!=null?`Self-check: ${B('sa')}/10 got it`:'Not started')}
  ${partCard('Part C','Problem Solving','5 word problems using the four-step plan. Great for whole-class discussion.','wp',B('wp')!=null?`Self-check: ${B('wp')}/5 got it`:'Not started')}
  ${partCard('Part D','Performance Task','One scenario, three connected questions. Reveal step by step.','pt',B('pt')!=null?`Self-check: ${B('pt')}/3 got it`:'Not started')}
  </div>
  <div class="lessons"><h3>Lessons in this chapter</h3><ol>${ch.lessons.map(l=>`<li>${esc(l)}</li>`).join('')}</ol></div>`;
}
function items(ch,part){
  if(part==='mc')return ch.mc.map((q,i)=>({kind:'mc',q:q.q,o:q.o,a:q.a,e:q.e,n:i+1}));
  if(part==='sa')return ch.sa.map((q,i)=>({kind:'open',q:q.q,a:q.a,n:i+13,pts:q.pts}));
  if(part==='wp')return ch.wp.map((q,i)=>({kind:'open',q:q.q,a:q.a,n:i+23,pts:3}));
  return ch.pt.items.map((q,i)=>({kind:'open',q:q.q,a:q.a,n:i+28,pts:q.pts,scen:ch.pt}));
}
function start(part){state.part=part;state.i=0;state.sel=null;state.checked=false;state.revealed=false;state.answers=[];state.view='quiz';render()}
function quiz(){
  const ch=DATA[state.ch-1],list=items(ch,state.part),it=list[state.i],teach=state.mode==='teach';
  const partName={mc:'Quick Check',sa:'Short Answer',wp:'Problem Solving',pt:'Performance Task'}[state.part];
  let body='';
  if(it.kind==='mc'){
    const long=it.o.some(o=>o.replace(/<[^>]+>/g,'').length>28||o.includes('<svg'));
    body=`<div class="stem">${it.q}</div><div class="opts ${long?'':'two'}" role="group" aria-label="Answer choices">${it.o.map((o,k)=>{let cls='opt';if(state.checked){if(k===it.a)cls+=' ok';else if(k===state.sel)cls+=' bad'}else if(k===state.sel)cls+=' sel';return `<button class="${cls}" data-act="pick" data-k="${k}" ${state.checked?'disabled':''}><span class="l">${'ABCD'[k]}</span><span>${o}</span></button>`}).join('')}</div>`;
    if(state.checked){const ok=state.sel===it.a;body+=`<div class="fb show ${ok?'ok':'bad'}"><div class="h"><span class="ic">${ok?'✓':'✗'}</span>${ok?'Correct!':'Not quite — the answer is '+'ABCD'[it.a]+'.'}</div><div>${it.e}</div></div>`}
    else if(teach&&state.revealed){body+=`<div class="fb show info"><div class="h"><span class="ic">✓</span>Answer: ${'ABCD'[it.a]} — ${it.o[it.a]}</div><div>${it.e}</div></div>`}
  }else{
    body=(it.scen&&state.i===0||it.scen&&teach?`<div class="scen" style="--c:${ch.color};--cl:${ch.light}"><h4>${esc(it.scen.title)}</h4>${it.scen.intro}</div>`:it.scen?`<details class="scen" style="--c:${ch.color};--cl:${ch.light}"><summary style="cursor:pointer;font-weight:800">Show the scenario again</summary>${it.scen.intro}</details>`:'')+
      `<div class="stem">${it.q}</div><div class="ans ${state.revealed?'show':''}"><div class="h">Answer${it.pts?` · ${it.pts} pt${it.pts>1?'s':''}`:''}</div><div>${it.a}</div></div>`;
  }
  let acts='';
  if(it.kind==='mc'){
    if(teach){acts=`<button class="btn-ghost left" data-act="prev" ${state.i===0?'disabled':''}>← Back</button>${state.revealed?'':'<button data-act="reveal">Reveal answer</button>'}<button class="btn-p" data-act="next">${state.i===list.length-1?'Finish':'Next →'}</button>`}
    else if(!state.checked)acts=`<button class="btn-p" data-act="check" ${state.sel==null?'disabled':''}>Check answer</button>`;
    else acts=`<button class="btn-p" data-act="next">${state.i===list.length-1?'See results':'Next →'}</button>`;
  }else{
    if(!state.revealed)acts=`<button class="btn-ghost left" data-act="prev" ${state.i===0?'disabled':''}>← Back</button><button class="btn-p" data-act="reveal">Reveal answer</button>`;
    else if(teach)acts=`<button class="btn-ghost left" data-act="prev" ${state.i===0?'disabled':''}>← Back</button><button class="btn-p" data-act="next">${state.i===list.length-1?'Finish':'Next →'}</button>`;
    else acts=`<span class="left" style="font-weight:700;align-self:center">Did you get it?</span><button data-act="mark" data-v="0">Not yet</button><button class="btn-p" data-act="mark" data-v="1">I got it ✓</button>`;
  }
  app.innerHTML=topbar()+`<div class="crumb"><button class="btn-ghost" data-act="chapter">← Chapter ${ch.n}: ${esc(ch.title)}</button><span>·</span><span>${partName}</span>${teach?'<span class="pill" style="background:var(--hi);color:#7a5a00">Teach mode</span>':''}</div>
  <div class="qtop"><span class="cnt">Question ${state.i+1} of ${list.length}</span><div class="bar"><i style="width:${(state.i+(state.checked||state.revealed?1:0))/list.length*100}%;background:${ch.color}"></i></div></div>
  <div class="card" style="--c:${ch.color};--cl:${ch.light}"><span class="qnum">#${it.n}</span>${body}<div class="actions">${acts}</div></div>
  ${teach?'<p class="kbd" style="text-align:right;margin-top:8px">Keys: <b>Space</b> reveal · <b>→</b> next · <b>←</b> back</p>':''}`;
  window.scrollTo({top:0});
}
function finish(){
  const ch=DATA[state.ch-1],list=items(ch,state.part);
  const score=state.answers.filter(a=>a.ok).length,total=list.length;
  const k=bestKey(ch.n,state.part);if(store[k]==null||score>store[k]){store[k]=score;save()}
  const pct=Math.round(score/total*100);const msg=pct===100?'Perfect! Every question correct.':pct>=80?'Great work — you have got this chapter.':pct>=60?'Good effort. Review the ones you missed and try again.':'Keep going — look at the explanations and try again.';
  const review=state.part==='mc'?`<div class="review">${state.answers.map((a,i)=>{const it=list[i];return `<div class="rv ${a.ok?'ok':'bad'}"><span class="n">${it.n}</span><div class="body"><div>${it.q}</div><div style="margin-top:4px"><b>Answer: ${'ABCD'[it.a]}</b> — ${it.o[it.a]}</div>${a.ok?'':`<div style="color:var(--ink2);margin-top:3px">${it.e}</div>`}</div></div>`}).join('')}</div>`:'';
  app.innerHTML=topbar()+`<div class="crumb"><button class="btn-ghost" data-act="chapter">← Chapter ${ch.n}: ${esc(ch.title)}</button></div>
  <div class="card result" style="--c:${ch.color}"><div class="hand">${state.part==='mc'?'Quick Check complete':'Self-check complete'}</div><div class="score">${score}<span style="font-size:.45em;color:var(--muted)">/${total}</span></div><p style="font-size:1.1em;max-width:40ch;margin:8px auto 0">${msg}</p>
  <div class="actions" style="justify-content:center"><button data-act="start" data-part="${state.part}">Try again</button><button class="btn-p" data-act="chapter">Back to chapter</button></div>${review}</div>`;
  window.scrollTo({top:0});
}
function render(){if(state.view==='home')home();else if(state.view==='chapter')chapter();else if(state.view==='quiz')quiz();else if(state.view==='result')finish()}
app.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='mode'){state.mode=b.dataset.v;store.mode=state.mode;save();state.sel=null;state.checked=false;state.revealed=false;render()}
  else if(a==='size')setSize(b.dataset.v);
  else if(a==='reset'){if(confirm('Clear all saved scores on this device?')){const m=store.mode,s=store.size;store={mode:m,size:s};save();render()}}
  else if(a==='home'){state.view='home';render()}
  else if(a==='open'){state.ch=+b.dataset.ch;state.view='chapter';render()}
  else if(a==='chapter'){state.view='chapter';render()}
  else if(a==='start')start(b.dataset.part);
  else if(a==='pick'){if(state.checked)return;state.sel=+b.dataset.k;if(state.mode==='teach'){state.revealed=true}render()}
  else if(a==='check'){const it=items(DATA[state.ch-1],state.part)[state.i];state.checked=true;state.answers[state.i]={ok:state.sel===it.a};render()}
  else if(a==='reveal'){state.revealed=true;render()}
  else if(a==='mark'){state.answers[state.i]={ok:b.dataset.v==='1'};next()}
  else if(a==='next')next();
  else if(a==='prev'){if(state.i>0){state.i--;state.sel=null;state.checked=false;state.revealed=false;render()}}
});
function next(){const list=items(DATA[state.ch-1],state.part);if(state.i<list.length-1){state.i++;state.sel=null;state.checked=false;state.revealed=false;render()}else{if(state.mode==='teach'){state.view='chapter';render()}else{state.view='result';render()}}}
document.addEventListener('keydown',e=>{if(state.view!=='quiz')return;if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();if(state.mode==='teach'||state.checked||state.revealed)next()}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(state.i>0){state.i--;state.sel=null;state.checked=false;state.revealed=false;render()}}
  else if(e.key===' '&&state.mode==='teach'){e.preventDefault();state.revealed=true;render()}});
render();
</script>
</body>
</html>

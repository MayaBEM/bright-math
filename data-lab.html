us`,skill:`data-types`,type:`multiple-choice`,prompt:`The Riverside Running Club also records each member's t-shirt size (S, M, L, XL). What type of data is this?`,options:[`Categorical data`,`Discrete data`,`Continuous data`],answer:`Categorical data`,hints:[`Ask whether t-shirt size is a number or a label.`,`Categorical data is sorted into named groups, not measured or counted.`,`S, M, L, and XL are group names, not numbers you could count or measure.`],explanation:`T-shirt size is categorical data because S, M, L, and XL are named groups, not numbers.`},checkUnderstanding:[{id:`l1-check1`,difficulty:`practice`,skill:`data-types`,type:`classify`,prompt:`Sort each piece of data from a school chess club into the correct category.`,classify:{categories:[`Categorical`,`Discrete`,`Continuous`],items:[{label:`Favourite chess piece (King, Queen, Knight...)`,category:`Categorical`},{label:`Number of games won this term`,category:`Discrete`},{label:`Time taken to finish a match (minutes)`,category:`Continuous`},{label:`Club member's home town`,category:`Categorical`}]},hints:[`Decide first whether each item is a label, a count, or a measurement.`,`Counts of whole things, like games or matches, are discrete; labels and names are categorical.`,`Anything measured with a stopwatch or ruler, which could include decimals, is continuous.`],explanation:`Favourite piece and home town are labels (categorical); games won is a whole-number count (discrete); match time is measured and can include decimals (continuous).`},{id:`l1-check2`,difficulty:`practice`,skill:`data-types`,type:`multiple-choice`,prompt:`A bakery records the number of loaves of bread sold each day. What type of data is this?`,options:[`Categorical data`,`Discrete data`,`Continuous data`],answer:`Discrete data`,hints:[`Think about whether loaves are counted in whole numbers.`,`You can't sell a fraction of a loaf as a separate countable unit in this record — it's counted exactly.`,`Numbers like 0, 1, 2, 3 loaves with nothing in between are a sign of this data type.`],explanation:`Number of loaves sold is discrete data because it is counted in exact whole numbers.`}],miniChallenge:{id:`l1-mini`,difficulty:`challenge`,skill:`data-types`,type:`select-all`,prompt:`A weather station records data every day. Select ALL the continuous data types from the list below.`,options:[`Temperature at noon (°C)`,`Number of rainy days this month`,`Wind speed (km/h)`,`Weather category (Sunny, Cloudy, Rainy)`],answer:[`Temperature at noon (°C)`,`Wind speed (km/h)`],hints:[`Continuous data is measured, not counted or named.`,`Cross off anything that's a count of whole events or a named category first.`,`Temperature and wind speed can both take decimal values on a measuring instrument.`],explanation:`Temperature and wind speed are continuous because they are measured and can take any value including decimals; rainy days is discrete (counted) and weather category is categorical (named).`}},{id:`l2-planning-an-investigation`,module:1,number:2,title:`Planning an Investigation`,summary:`Plan a data investigation: prediction, variables, sample, and method.`,keyIdea:`A good investigation starts with a clear question and a prediction, then decides what data to collect, who to collect it from (the sample), and how to collect it (the method). Planning first stops you from collecting the wrong data.`,vocabIds:[`prediction`,`sample`,`survey`,`data`],workedExample:{prompt:`Priya wants to investigate: 'Would students use a bike-share scheme at school?' Plan her investigation.`,steps:[{label:`Write a prediction`,detail:`Priya predicts that most students would use a free bike-share scheme.`},{label:`Decide what data is needed`,detail:`She needs to know whether each student would use the scheme (yes/no) and how often.`},{label:`Choose a sample`,detail:`She will ask 40 students, a mix from every year group, instead of all 600 students.`},{label:`Choose a method`,detail:`She will hand out a short paper questionnaire during morning registration.`}],answer:`Priya predicts high interest, then collects yes/no and frequency data from a 40-student sample using a questionnaire.`},tryIt:{id:`l2-tryit`,difficulty:`focus`,skill:`reasoning`,type:`multiple-choice`,prompt:`Jake wants to investigate: 'Do students who cycle to school do more exercise per week?' What should Jake write BEFORE he collects any data?`,options:[`A prediction about what he expects to find`,`The final conclusion`,`A bar chart of the results`,`The mean of the results`],answer:`A prediction about what he expects to find`,hints:[`Think about the order of steps in an investigation.`,`You can't draw a chart or calculate an average before you have any data.`,`This step is a sensible guess made at the very start, before any data is collected.`],explanation:`A prediction is written first, as a sensible guess about what the investigation will show, before any data is collected.`},checkUnderstanding:[{id:`l2-check1`,difficulty:`practice`,skill:`reasoning`,type:`multiple-choice`,prompt:`Amara is investigating whether students who bring a packed lunch also bring fruit. Which sample would be most useful?`,options:[`50 students chosen from different classes and year groups`,`Only the 10 students in Amara's own class`,`Only students who buy school lunch`,`Only her 5 closest friends`],answer:`50 students chosen from different classes and year groups`,hints:[`Think about which sample best represents the whole school.`,`A sample that only includes one class or one friend group may not reflect everyone.`,`The best option spreads students across several classes and year groups.`],explanation:`Choosing students from different classes and year groups gives a fairer, more representative picture than a small, narrow group.`},{id:`l2-check2`,difficulty:`practice`,skill:`reasoning`,type:`multiple-choice`,prompt:`Before starting her investigation into bike-share use, what should Priya decide, other than her prediction?`,options:[`What data to collect and how to collect it`,`The final bar chart colours`,`How to spend the school's budget`,`The mode of the results`],answer:`What data to collect and how to collect it`,hints:[`Think about what needs planning before any data collection can start.`,`This isn't about chart design or budgets — it's about the investigation itself.`,`Planning includes deciding exactly what information to gather and the method for gathering it.`],explanation:`Planning an investigation means deciding what data is needed and how (and from whom) it will be collected.`}],miniChallenge:{id:`l2-mini`,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`Leo predicts: 'Students who play a musical instrument read more books.' Which plan best tests this prediction?`,options:[`Ask a sample of students whether they play an instrument AND how many books they read last month`,`Ask only students in the school orchestra how many books they read`,`Count how many books are in the school library`,`Ask students their favourite instrument only`],answer:`Ask a sample of students whether they play an instrument AND how many books they read last month`,hints:[`The plan must collect data on both parts of the prediction: instrument-playing and reading.`,`Asking only musicians would leave out the comparison group who don't play an instrument.`,`You need both pieces of information, from a mixed sample, to properly test the link.`],explanation:`To test a prediction linking two things, you must collect data on both variables from a sample that includes students both with and without the habit being tested.`}},{id:`l3-questionnaire-design`,module:1,number:3,title:`Questionnaire Design`,summary:`Spot and fix leading, ambiguous, and incomplete questions.`,keyIdea:`A good questionnaire question is clear, fair, and gives everyone a sensible way to answer. Leading questions push people toward one answer, ambiguous questions confuse people, and questions with missing options leave some answers out.`,vocabIds:[`questionnaire`,`leading-question`,`survey`,`bias`],tool:`questionnaire-designer`,workedExample:{prompt:`The school café is testing a new questionnaire question: 'Don't you agree our new veggie wrap is delicious?' What's wrong, and how can it be fixed?`,steps:[{label:`Spot the problem`,detail:`The words 'Don't you agree' push people to say yes, so it's a leading question.`},{label:`Think about fairness`,detail:`A fair question should not hint at the expected answer.`},{label:`Rewrite the question`,detail:`A better version is: 'How would you rate the new veggie wrap?' with options from Poor to Excellent.`},{label:`Check response options`,detail:`Adding a rating scale gives everyone a clear way to answer, not just yes or no.`}],answer:`The original question is leading; rewriting it as a neutral rating-scale question fixes the bias.`},tryIt:{id:`l3-tryit`,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`Which of these questionnaire questions is a leading question?`,options:[`Our amazing new app is so much fun, don't you think?`,`How often do you use the app each week?`,`What is your favourite feature of the app?`,`Which device do you use the app on?`],answer:`Our amazing new app is so much fun, don't you think?`,hints:[`Look for a question that already suggests what the answer should be.`,`Words like 'amazing' and 'don't you think?' hint at the expected answer.`,`A leading question pushes people toward agreeing with a positive opinion already in the question.`],explanation:`This question includes opinion words ('amazing') and 'don't you think?', which pushes people toward agreeing — that makes it a leading question.`},checkUnderstanding:[{id:`l3-check1`,difficulty:`practice`,skill:`questionnaires`,type:`classify`,prompt:`Sort each questionnaire question into the correct problem category.`,classify:{categories:[`Leading question`,`Ambiguous question`,`Missing options`],items:[{label:`Isn't our new sports hall fantastic?`,category:`Leading question`},{label:`Do you exercise often?`,category:`Ambiguous question`},{label:`How do you travel to school? (Bus / Walk)`,category:`Missing options`}]},hints:[`Leading questions include opinion words that hint at an answer.`,`Ambiguous questions use vague words like 'often' with no clear meaning.`,`Questions with missing options leave out possible real answers, such as cycling or car.`],explanation:`'Isn't ... fantastic?' is leading; 'often' is vague and ambiguous; the travel question is missing options like cycling or car.`},{id:`l3-check2`,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A questionnaire asks: 'How many hours of homework do you do?' with tick-box options '0-1' and '1-2' only. What is the main problem?`,options:[`The options don't cover students who do more than 2 hours`,`The question is a leading question`,`The question uses opinion words`,`There are too many options to choose from`],answer:`The options don't cover students who do more than 2 hours`,hints:[`Check whether every possible answer has a matching option.`,`Think about a student who does 3 hours of homework — which box would they tick?`,`The options stop at '1-2', leaving higher amounts with nowhere to go.`],explanation:`The options are missing a category for students doing more than 2 hours of homework, so some answers have no box to tick.`}],miniChallenge:{id:`l3-mini`,difficulty:`challenge`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A gaming club wants to find out which game genre students like best. Which question is best designed?`,options:[`Which genre of game do you enjoy most: Puzzle, Sports, Strategy, Adventure, or Other?`,`Don't you think puzzle games are the best genre?`,`Do you like games?`,`How many games do you own?`],answer:`Which genre of game do you enjoy most: Puzzle, Sports, Strategy, Adventure, or Other?`,hints:[`Look for a question that is neutral and offers a full set of clear options.`,`Rule out any question with opinion words or a yes/no answer that doesn't match the goal.`,`The best option lists several genres plus an 'Other' choice, so nobody is left without an answer.`],explanation:`This question is neutral (no leading words), specific to genre, and includes enough options plus 'Other' so every student can answer.`}},{id:`l4-rating-scales`,module:1,number:4,title:`Rating Scales`,summary:`Use 1-5 rating scales to measure opinions clearly.`,keyIdea:`A rating scale gives people a fixed range of ordered options, often 1 to 5, to measure opinions such as agreement or enjoyment. Rating scales are quick to answer and easy to compare, but they cannot capture the reasons behind someone's answer.`,vocabIds:[`rating-scale`,`questionnaire`,`survey`],workedExample:{prompt:`A drama club wants to know how much students enjoyed the school play. Design and evaluate a rating-scale question.`,steps:[{label:`Write the statement`,detail:`'How much did you enjoy the school play?'`},{label:`Add scale labels`,detail:`1 = Not at all, 2 = A little, 3 = Somewhat, 4 = A lot, 5 = Extremely.`},{label:`Check it's neutral`,detail:`The statement doesn't hint at an answer, so it isn't a leading question.`},{label:`Consider a limitation`,detail:`The scale shows how much students enjoyed it, but not why, so a follow-up question could help.`}],answer:`A neutral 1-5 rating scale measures enjoyment level, though it doesn't explain the reasons behind the rating.`},tryIt:{id:`l4-tryit`,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A rating scale asks students to rate a new lunch menu from 1 (Dislike a lot) to 5 (Like a lot). What is the MAIN advantage of this type of question?`,options:[`It is quick to answer and easy to compare between students`,`It explains exactly why each student feels that way`,`It always gives a completely unbiased sample`,`It removes the need for any other questions`],answer:`It is quick to answer and easy to compare between students`,hints:[`Think about what makes a rating scale easier to use than a written answer.`,`Rule out anything about sampling or bias — this is about the question type itself.`,`A fixed number scale is fast to fill in and easy to line up side by side.`],explanation:`Rating scales are quick to answer and produce numbers that are easy to compare, though they don't reveal the reasons behind a rating.`},checkUnderstanding:[{id:`l4-check1`,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`Which is a LIMITATION of using a 1-5 rating scale instead of an open written question?`,options:[`It doesn't explain the reasons behind a student's rating`,`It takes much longer for students to answer`,`It cannot be used to compare different students' answers`,`It always contains a leading question`],answer:`It doesn't explain the reasons behind a student's rating`,hints:[`Think about what information a number from 1 to 5 does NOT tell you.`,`A rating scale is fast, so ruling out 'takes longer' makes sense.`,`A number alone can't tell you the story behind why someone chose it.`],explanation:`A rating scale gives a quick number but doesn't explain why a student chose that rating — an open question would be needed for that.`},{id:`l4-check2`,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`Which statement is best suited to a 1-5 rating scale question?`,options:[`How confident do you feel about your maths test?`,`What is your favourite maths topic?`,`Which class are you in?`,`How many maths lessons do you have per week?`],answer:`How confident do you feel about your maths test?`,hints:[`A rating scale measures the strength or amount of a feeling or opinion.`,`Rule out questions asking for a name, category, or exact count.`,`Confidence is a feeling that can range from low to high, which fits a 1-5 scale well.`],explanation:`Confidence is a feeling with a range of strength, which is exactly what a 1-5 rating scale is designed to measure.`}],miniChallenge:{id:`l4-mini`,difficulty:`challenge`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A student designs this rating scale: 'Rate how amazing our incredible new gym equipment is, from 1 to 5.' What is the problem?`,options:[`The wording (amazing, incredible) makes it a leading question, even though it uses a rating scale`,`Rating scales can never include the number 5`,`The scale should only go from 1 to 3`,`There is no problem with this question`],answer:`The wording (amazing, incredible) makes it a leading question, even though it uses a rating scale`,hints:[`A rating scale format doesn't automatically make a question fair.`,`Look closely at the describing words used before "gym equipment".`,`Positive opinion words built into the statement can bias answers upward, even on a numbered scale.`],explanation:`Using opinion words like 'amazing' and 'incredible' in the statement biases students toward a high rating, so the question is still leading despite the numbered scale.`}},{id:`l5-frequency-tables`,module:1,number:5,title:`Frequency Tables`,summary:`Turn a raw list of data into a clear frequency table.`,keyIdea:`A frequency table organises raw data by listing each value once alongside a count of how many times it appears. This makes patterns in the data much easier to see than in a long list.`,vocabIds:[`frequency`,`frequency-table`,`data`],tool:`frequency-table-builder`,workedExample:{prompt:`15 students were asked how many pets they own: 0, 1, 1, 2, 0, 3, 1, 2, 2, 0, 1, 1, 2, 3, 1. Build a frequency table.`,steps:[{label:`List the possible values`,detail:`The values that appear are 0, 1, 2, and 3 pets.`},{label:`Count each value`,detail:`Count how many times each number appears in the list.`},{label:`Record the frequencies`,detail:`0 pets: 3 students, 1 pet: 6 students, 2 pets: 4 students, 3 pets: 2 students.`},{label:`Check the total`,detail:`3 + 6 + 4 + 2 = 15, which matches the number of students, so the table is correct.`}],answer:`0 pets: 3, 1 pet: 6, 2 pets: 4, 3 pets: 2 (total 15).`},tryIt:{id:`l5-tryit`,difficulty:`focus`,skill:`frequency-tables`,type:`complete-table`,prompt:`12 students were asked how many siblings they have: 1, 0, 2, 1, 1, 0, 3, 1, 2, 0, 1, 2. Complete the frequency table.`,completeTable:{headers:[`Siblings`,`Frequency`],rows:[[`0`,``],[`1`,``],[`2`,``],[`3`,``]],blanks:[{row:0,col:1,value:`3`},{row:1,col:1,value:`5`},{row:2,col:1,value:`3`},{row:3,col:1,value:`1`}]},hints:[`Go through the list once for each number of siblings and tally as you go.`,`Count how many times '0' appears, then '1', then '2', then '3'.`,`Check your four frequencies add up to 12, the total number of students.`],explanation:`Counting each value gives 0 siblings: 3, 1 sibling: 5, 2 siblings: 3, 3 siblings: 1, which totals 12 students.`},checkUnderstanding:[{id:`l5-check1`,difficulty:`practice`,skill:`frequency-tables`,type:`numerical`,prompt:`A frequency table for shoe sizes worn by 18 students: size 3 (2 students), size 4 (5 students), size 5 (7 students), size 6 (4 students). What is the total frequency (total number of students)?`,numericAnswer:18,numericUnit:`students`,verify:{frequencyRows:[{value:3,frequency:2},{value:4,frequency:5},{value:5,frequency:7},{value:6,frequency:4}],statistic:`frequency-total`},hints:[`Add up all four frequencies in the table.`,`2 + 5 + 7 + 4 is the calculation you need.`,`The total should equal the number of students who gave a shoe size.`],explanation:`Adding the frequencies 2 + 5 + 7 + 4 = 18 gives the total number of students.`},{id:`l5-check2`,difficulty:`practice`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`In a frequency table showing favourite school subjects, Maths has a frequency of 9, Art has 6, Science has 11, and PE has 4. Which subject is the most popular?`,options:[`Science`,`Maths`,`Art`,`PE`],answer:`Science`,hints:[`The most popular subject has the highest frequency.`,`Compare 9, 6, 11, and 4 to find the largest number.`,`The highest frequency among the four subjects belongs to one particular subject.`],explanation:`Science has the highest frequency (11), so it is the most popular subject.`}],miniChallenge:{id:`l5-mini`,difficulty:`challenge`,skill:`frequency-tables`,type:`complete-table`,prompt:`22 customers at a juice bar chose a flavour: Mango, Mango, Berry, Apple, Mango, Berry, Apple, Apple, Mango, Berry, Apple, Mango, Berry, Berry, Apple, Mango, Apple, Berry, Mango, Apple, Berry, Mango. Complete the frequency table.`,completeTable:{headers:[`Flavour`,`Frequency`],rows:[[`Mango`,``],[`Berry`,``],[`Apple`,``]],blanks:[{row:0,col:1,value:`8`},{row:1,col:1,value:`7`},{row:2,col:1,value:`7`}]},hints:[`Go through the list three times, once per flavour, and keep a tally.`,`Mango appears the most — count carefully how many times.`,`Check your three frequencies add up to 22 customers in total.`],explanation:`Counting each flavour gives Mango: 8, Berry: 7, Apple: 7, which totals 22 customers.`}},{id:`l6-grouped-frequency-tables`,module:1,number:6,title:`Grouped Frequency Tables`,summary:`Group numerical data into class intervals and find the modal group.`,keyIdea:`When data has many different values, grouping it into equal-width class intervals makes a frequency table easier to read. The modal group is the interval with the highest frequency — it doesn't give one exact value, just the most common range.`,vocabIds:[`grouped-data`,`grouped-frequency-table`,`modal-group`],workedExample:{prompt:`24 parcels at a delivery depot are grouped by weight: 0-2kg, 2-4kg, 4-6kg, 6-8kg with frequencies 5, 9, 7, 3. Find the modal group.`,steps:[{label:`List the groups`,detail:`The weight groups are 0-2kg, 2-4kg, 4-6kg, and 6-8kg.`},{label:`Compare frequencies`,detail:`The frequencies are 5, 9, 7, and 3 parcels.`},{label:`Find the highest frequency`,detail:`9 is the highest frequency, belonging to the 2-4kg group.`},{label:`State the modal group`,detail:`The modal group is 2-4kg, since more parcels fall in this range than any other.`}],answer:`The modal group is 2-4kg (frequency 9).`},tryIt:{id:`l6-tryit`,difficulty:`focus`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`A grouped frequency table shows the ages of 30 people at a coding workshop: 10-12 years (8 people), 13-15 years (14 people), 16-18 years (8 people). What is the modal group?`,options:[`13-15 years`,`10-12 years`,`16-18 years`,`There is no modal group`],answer:`13-15 years`,hints:[`The modal group has the highest frequency.`,`Compare 8, 14, and 8 to find the largest.`,`The middle group has more people than either of the other two.`],explanation:`13-15 years has the highest frequency (14), so it is the modal group.`},checkUnderstanding:[{id:`l6-check1`,difficulty:`practice`,skill:`frequency-tables`,type:`complete-table`,prompt:`20 phone-charging times (minutes) were grouped: 0-20 min (4 phones), 20-40 min (9 phones), 40-60 min (?), 60-80 min (2 phones). The frequencies must total 20. Complete the missing frequency.`,completeTable:{headers:[`Time (min)`,`Frequency`],rows:[[`0-20`,`4`],[`20-40`,`9`],[`40-60`,``],[`60-80`,`2`]],blanks:[{row:2,col:1,value:`5`}]},hints:[`Add the three known frequencies and subtract from the total of 20.`,`4 + 9 + 2 = 15, so work out what is left.`,`20 minus 15 gives the missing frequency for the 40-60 minute group.`],explanation:`4 + 9 + 2 = 15, and 20 - 15 = 5, so the missing frequency for 40-60 minutes is 5.`},{id:`l6-check2`,difficulty:`practice`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`Why might a scientist group continuous data, like plant heights, into class intervals such as 0-10cm, 10-20cm, instead of listing every exact height?`,options:[`Because listing every different exact height would make the table too long and hard to read`,`Because continuous data cannot be shown in any table`,`Because grouping always makes the data more accurate`,`Because a frequency table can only show categorical data`],answer:`Because listing every different exact height would make the table too long and hard to read`,hints:[`Think about how many different exact heights there could be with continuous data.`,`Continuous measurements can all be slightly different, making a long ungrouped list unhelpful.`,`Grouping combines similar values into ranges so the table stays short and readable.`],explanation:`Continuous data can have many different exact values, so grouping into class intervals keeps the table short and easy to read.`}],miniChallenge:{id:`l6-mini`,difficulty:`challenge`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`A grouped frequency table for the number of minutes 40 students spent reading yesterday: 0-15 min (6 students), 15-30 min (11 students), 30-45 min (17 students), 45-60 min (6 students). What is the modal group?`,options:[`30-45 min`,`15-30 min`,`0-15 min`,`45-60 min`],answer:`30-45 min`,hints:[`The modal group is the interval with the highest frequency.`,`Compare 6, 11, 17, and 6 to find the largest frequency.`,`One interval clearly has more students than the other three.`],explanation:`30-45 min has the highest frequency (17 students), so it is the modal group.`}},{id:`l7-bar-charts`,module:1,number:7,title:`Bar Charts`,summary:`Build correctly labelled bar charts from a frequency table.`,keyIdea:`A good bar chart has a title, labelled axes, an even scale, and bars of equal width with gaps between them. Reading a bar chart means using the height of each bar and the scale to find its frequency.`,vocabIds:[`bar-chart`,`frequency-table`,`categorical-data`],tool:`graph-builder`,workedExample:{prompt:`A frequency table shows how 20 students travel to school: Walk (8), Bus (6), Car (4), Bike (2). Describe how to build a correct bar chart.`,steps:[{label:`Add a title`,detail:`Title the chart 'How Students Travel to School'.`},{label:`Label the axes`,detail:`The horizontal axis shows travel method; the vertical axis shows frequency.`},{label:`Choose a scale`,detail:`Use an even scale on the frequency axis, such as steps of 2, from 0 up to at least 8.`},{label:`Draw equal-width bars`,detail:`Draw four bars of the same width with equal gaps between them, with heights 8, 6, 4, and 2.`}],answer:`A titled chart with labelled axes, an even scale, and four equal-width bars at heights 8, 6, 4, and 2.`},tryIt:{id:`l7-tryit`,difficulty:`focus`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`In a bar chart titled 'Favourite Ice Cream Flavour', the bar for Chocolate reaches the line for 12 on the frequency axis. What does this tell you?`,options:[`12 people chose chocolate as their favourite flavour`,`Chocolate is the least popular flavour`,`There are 12 different flavours in total`,`12% of people chose chocolate`],answer:`12 people chose chocolate as their favourite flavour`,hints:[`The height of a bar shows a frequency, read off the vertical axis.`,`This isn't about percentages or the number of categories — just what the height means.`,`A bar reaching a certain height means that many people or items are counted in that category.`],explanation:`The height of a bar on a frequency axis shows how many people or items fall into that category — here, 12 people chose chocolate.`},checkUnderstanding:[{id:`l7-check1`,difficulty:`practice`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`Which of these is essential for a correctly drawn bar chart?`,options:[`Bars of equal width with an even scale on the frequency axis`,`Bars of different widths to show which is most popular`,`No title, so the reader can guess the topic`,`A scale that skips numbers unevenly`],answer:`Bars of equal width with an even scale on the frequency axis`,hints:[`Think about what makes bar heights fairly comparable to each other.`,`Uneven scales or bar widths would make the chart misleading.`,`Consistency in width and scale is what allows a fair comparison between bars.`],explanation:`Bars must be equal width with an even scale so that their heights can be fairly compared — an uneven scale or width would be misleading.`},{id:`l7-check2`,difficulty:`practice`,skill:`frequency-tables`,type:`numerical`,prompt:`A bar chart shows the number of books borrowed each day from a class library: Monday 5, Tuesday 8, Wednesday 3, Thursday 6. What is the total number of books borrowed over these four days?`,numericAnswer:22,numericUnit:`books`,verify:{values:[5,8,3,6],statistic:`sum`},hints:[`Add together the frequency shown by each of the four bars.`,`5 + 8 + 3 + 6 is the calculation.`,`Adding all four values gives the total for the whole week shown.`],explanation:`Adding the four daily totals, 5 + 8 + 3 + 6 = 22 books borrowed in total.`}],miniChallenge:{id:`l7-mini`,difficulty:`challenge`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`A student draws a bar chart but starts the frequency axis at 10 instead of 0, making small differences between bars look huge. What is the main problem with this chart?`,options:[`It can mislead readers by exaggerating the differences between bars`,`It is impossible to read any values from it`,`It has too many bars`,`It cannot include a title`],answer:`It can mislead readers by exaggerating the differences between bars`,hints:[`Think about what happens to the visual size of differences when the axis doesn't start at 0.`,`Cutting off the bottom of the axis makes small gaps between bars look bigger than they really are.`,`This makes the chart look more dramatic than the real data actually is — that's the issue.`],explanation:`Starting the frequency axis above 0 exaggerates the visual differences between bars, which can mislead readers about how different the values really are.`}},{id:`l8-mean-median-mode`,module:1,number:8,title:`Mean, Median and Mode`,summary:`Calculate the mean, median, and mode from a data set.`,keyIdea:`The mean, median, and mode are three ways to describe a 'typical' value in a data set. The mean is the total divided by the count, the median is the middle value once sorted, and the mode is the most frequent value. Each can give a different picture of the same data.`,vocabIds:[`mean`,`median`,`mode`],workedExample:{prompt:`A basketball player's points scored in 5 matches were: 12, 18, 12, 20, 8. Find the mean, median, and mode.`,steps:[{label:`Find the mean`,detail:`Add the scores: 12 + 18 + 12 + 20 + 8 = 70, then divide by 5 matches: 70 ÷ 5 = 14.`},{label:`Sort the data`,detail:`In order: 8, 12, 12, 18, 20.`},{label:`Find the median`,detail:`With 5 values, the middle one is the 3rd: 12.`},{label:`Find the mode`,detail:`12 appears twice, more than any other score, so the mode is 12.`}],answer:`Mean = 14, median = 12, mode = 12.`},tryIt:{id:`l8-tryit`,difficulty:`focus`,skill:`averages`,type:`numerical`,prompt:`Five friends' weekly pocket money (in £): 5, 7, 5, 9, 4. Find the mean.`,numericAnswer:6,numericUnit:`£`,verify:{values:[5,7,5,9,4],statistic:`mean`},hints:[`Add all five amounts together first.`,`5 + 7 + 5 + 9 + 4 = 30.`,`Divide the total by 5, the number of friends.`],explanation:`The total is 5 + 7 + 5 + 9 + 4 = 30, and 30 ÷ 5 = 6, so the mean is £6.`},checkUnderstanding:[{id:`l8-check1`,difficulty:`practice`,skill:`averages`,type:`numerical`,prompt:`Seven students' spelling test scores out of 20: 14, 18, 12, 14, 16, 20, 14. Find the median score.`,numericAnswer:14,verify:{values:[14,18,12,14,16,20,14],statistic:`median`},hints:[`First put all seven scores in order from smallest to largest.`,`Sorted: 12, 14, 14, 14, 16, 18, 20.`,`With 7 values, the median is the 4th value in the sorted list.`],explanation:`Sorted, the scores are 12, 14, 14, 14, 16, 18, 20; with 7 values the median is the 4th one, which is 14.`},{id:`l8-check2`,difficulty:`practice`,skill:`averages`,type:`multiple-choice`,prompt:`A shop records shoe sizes sold in one day: 4, 6, 6, 7, 6, 8, 5. Which average best describes the MOST COMMONLY sold size?`,options:[`Mode`,`Mean`,`Median`,`Range`],answer:`Mode`,hints:[`Think about which average specifically means 'the most frequent value'.`,`The mean and median both involve calculation, not simply counting repeats.`,`The average that directly answers 'most common' is found by counting repeats.`],explanation:`The mode is the most frequently occurring value, which is exactly what "most commonly sold size" is asking for.`}],miniChallenge:{id:`l8-mini`,difficulty:`challenge`,skill:`averages`,type:`numerical`,prompt:`Six friends' game scores were: 22, 30, 22, 45, 22, 39. The mean of these six scores is one of the friends' actual scores. What is the mean?`,numericAnswer:30,verify:{values:[22,30,22,45,22,39],statistic:`mean`},hints:[`Add all six scores together first.`,`22 + 30 + 22 + 45 + 22 + 39 = 180.`,`Divide the total by 6, the number of friends, to find the mean.`],explanation:`The total is 180, and 180 ÷ 6 = 30, which matches one friend's actual score of 30.`}},{id:`l9-testing-a-prediction`,module:1,number:9,title:`Testing a Prediction`,summary:`Compare collected data against a prediction to see if it is supported.`,keyIdea:`After collecting data, compare the results with your original prediction. If the data matches what you predicted, the prediction is supported; if not, it is not supported. Either way, explain your conclusion using the actual numbers.`,vocabIds:[`prediction`,`conclusion`,`frequency-table`],tool:`prediction-lab`,workedExample:{prompt:`Zara predicted: 'Most students prefer texting over calling friends.' She surveyed 25 students: 18 said texting, 7 said calling. Test her prediction.`,steps:[{label:`Restate the prediction`,detail:`Zara predicted texting would be more popular than calling.`},{label:`Look at the data`,detail:`18 out of 25 students chose texting; 7 chose calling.`},{label:`Compare to the prediction`,detail:`Since 18 is much more than 7, texting is clearly preferred.`},{label:`Write a conclusion`,detail:`The data supports Zara's prediction: most students (18 out of 25) prefer texting.`}],answer:`The prediction is supported: 18 out of 25 students prefer texting.`},tryIt:{id:`l9-tryit`,difficulty:`focus`,skill:`reasoning`,type:`multiple-choice`,prompt:`Marco predicted: 'More students will choose the science club than the art club.' A survey of 30 students found 12 chose science and 18 chose art. Is Marco's prediction supported?`,options:[`No, because more students actually chose art than science`,`Yes, because 12 and 18 are both large numbers`,`Yes, because science was mentioned first`,`It cannot be decided from this data`],answer:`No, because more students actually chose art than science`,hints:[`Compare the two numbers directly against what Marco predicted.`,`Marco predicted science would beat art — check which number is actually bigger.`,`One club clearly has more votes than the other, and it is the opposite of what was predicted.`],explanation:`Marco predicted science would be more popular, but the data shows art (18) was chosen more than science (12), so the prediction is not supported.`},checkUnderstanding:[{id:`l9-check1`,difficulty:`practice`,skill:`reasoning`,type:`multiple-choice`,prompt:`A gardening club predicted: 'Sunflowers will grow taller than marigolds.' After measuring, the mean sunflower height was 142cm and the mean marigold height was 38cm. What is the best conclusion?`,options:[`The prediction is supported, since sunflowers had a much higher mean height`,`The prediction is not supported`,`No conclusion can be made from mean heights`,`The prediction is only about marigolds, not sunflowers`],answer:`The prediction is supported, since sunflowers had a much higher mean height`,hints:[`Compare the two mean heights to the original prediction.`,`The prediction was that sunflowers grow taller than marigolds.`,`One mean height is far greater than the other, matching the direction predicted.`],explanation:`The mean sunflower height (142cm) is much greater than the mean marigold height (38cm), which supports the prediction that sunflowers grow taller.`},{id:`l9-check2`,difficulty:`practice`,skill:`reasoning`,type:`multiple-choice`,prompt:`A prediction says 'Most students walk to school.' A survey of 40 students finds: Walk 15, Bus 14, Car 11. Is this prediction supported?`,options:[`No, because 15 out of 40 is not a majority — most students did not walk`,`Yes, because walking has the highest single frequency`,`Yes, because 15 is more than 11`,`It cannot be tested with this data`],answer:`No, because 15 out of 40 is not a majority — most students did not walk`,hints:[`'Most' means more than half of the total, not just the highest single category.`,`Check whether 15 is more than half of 40.`,`Half of 40 is 20 — compare that to the walking total.`],explanation:`Although walking has the highest frequency (15), that is less than half of the 40 students, so "most students walk" is not actually supported — walking is only the most common option, not a majority.`}],miniChallenge:{id:`l9-mini`,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A prediction says: 'Older students spend more time on homework than younger students.' Data: Year 5 mean = 35 minutes (sample of 8), Year 9 mean = 50 minutes (sample of 30). What is the most careful conclusion?`,options:[`The prediction is supported by this data, but the small Year 5 sample makes the result less reliable`,`The prediction is definitely false`,`The prediction is definitely true with no doubt at all`,`The sample sizes make this data completely useless`],answer:`The prediction is supported by this data, but the small Year 5 sample makes the result less reliable`,hints:[`Compare the two means to the prediction first, then think about the sample sizes.`,`One mean is clearly higher than the other, matching the prediction's direction.`,`One of the two samples is quite small, which should make you cautious about that part of the result.`],explanation:`The means (50 vs 35 minutes) support the prediction, but the very small Year 5 sample of 8 makes that part of the result less reliable, so the conclusion should be stated carefully.`}},{id:`l10-evaluating-claims`,module:1,number:10,title:`Evaluating Claims`,summary:`Question misleading survey and advert claims using sample size and bias.`,keyIdea:`Before accepting a claim based on data, ask: how big was the sample, who was asked, and could the method have caused bias? A claim from a tiny or unfairly chosen sample can sound impressive but not be trustworthy.`,vocabIds:[`bias`,`sample`,`conclusion`],workedExample:{prompt:`A phone app's advert claims '95% of users love our app!' based on reviews left by 20 users out of 50,000 downloads. Evaluate this claim.`,steps:[{label:`Look at the sample size`,detail:`Only 20 users left reviews, out of 50,000 downloads — a tiny fraction.`},{label:`Think about who responded`,detail:`People who choose to leave a review are often those with strong opinions, not a random cross-section of users.`},{label:`Identify the bias`,detail:`This is a biased sample because it isn't representative of all 50,000 users.`},{label:`Write a careful conclusion`,detail:`The 95% figure is based on a very small, self-selected group, so it may not reflect what most users actually think.`}],answer:`The claim is unreliable: 20 reviewers out of 50,000 users is a tiny, self-selected sample, not representative of everyone.`},tryIt:{id:`l10-tryit`,difficulty:`focus`,skill:`reasoning`,type:`multiple-choice`,prompt:`A cereal advert says '9 out of 10 people prefer our cereal!' In small print it says this is based on 10 people surveyed outside the company's own office. What is the main problem?`,options:[`The sample is far too small and not representative of all cereal buyers`,`9 out of 10 is not a high proportion`,`Cereal adverts are not allowed to use surveys`,`There is no problem with this claim`],answer:`The sample is far too small and not representative of all cereal buyers`,hints:[`Look at how many people were actually surveyed.`,`Think about whether people outside a company's own office represent all cereal buyers fairly.`,`A very small sample, likely linked to the company, raises two separate concerns at once.`],explanation:`A sample of only 10 people, surveyed near the company's own office, is too small and likely biased, so it doesn't reliably represent all cereal buyers.`},checkUnderstanding:[{id:`l10-check1`,difficulty:`practice`,skill:`reasoning`,type:`multiple-choice`,prompt:`A skate park charity claims 'Everyone wants a new skate park!' after surveying 50 people at the local skateboarding club. What question should you ask about this claim?`,options:[`Were people outside the skateboarding club also asked?`,`How many wheels does a skateboard have?`,`What colour is the skate park?`,`Did the survey use a rating scale?`],answer:`Were people outside the skateboarding club also asked?`,hints:[`Think about who was actually included in this sample.`,`Skateboarding club members are likely to already be very interested in skate parks.`,`A fair claim about 'everyone' should check whether people beyond just club members were included.`],explanation:`Only surveying skateboard club members creates a biased sample, since they are already interested — asking whether others outside the club were surveyed checks for this bias.`},{id:`l10-check2`,difficulty:`practice`,skill:`reasoning`,type:`multiple-choice`,prompt:`A headline says 'Chocolate boosts memory!' based on a study of 6 people. What is the best response to this claim?`,options:[`Be cautious — a sample of only 6 people is too small to draw a reliable general conclusion`,`Accept the claim completely, since it was published as a headline`,`The claim must be false because it involves chocolate`,`Sample size does not matter for this type of claim`],answer:`Be cautious — a sample of only 6 people is too small to draw a reliable general conclusion`,hints:[`Think about how many people were actually involved in the study.`,`A sample of 6 is very small compared to the whole population the headline seems to be about.`,`Small samples can produce results by chance, so a middle-ground response makes sense.`],explanation:`A sample of only 6 people is too small to reliably support a general claim, so the results should be treated with caution rather than fully accepted.`}],miniChallenge:{id:`l10-mini`,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A gym claims '90% of members achieve their fitness goals!' based on a survey handed only to members as they left after a workout. Which explanation best identifies the flaw?`,options:[`Members who show up and stay long enough to complete a workout are more likely to already be succeeding, so the sample is biased toward satisfied members`,`90% is too low a number to be impressive`,`Surveys handed out in person are always inaccurate`,`Fitness goals cannot be measured with data`],answer:`Members who show up and stay long enough to complete a workout are more likely to already be succeeding, so the sample is biased toward satisfied members`,hints:[`Think about which members are actually present and able to answer this survey.`,`Members who have stopped coming to the gym would not be included at all.`,`The method leaves out one particular group of members, which skews the result.`],explanation:`Surveying only members who show up and finish a workout leaves out those who struggled or stopped attending, biasing the sample toward people who are already succeeding.`}},{id:`l11-population-and-sample`,module:2,number:11,title:`Population and Sample`,summary:`Tell the difference between a population and a sample.`,keyIdea:`The population is the entire group an investigation is about, while a sample is a smaller part of that population chosen to represent it. Researchers usually study a sample because surveying an entire population is often too slow, expensive, or impossible.`,vocabIds:[`population`,`sample`,`representative-sample`],workedExample:{prompt:`A phone company wants to know how satisfied its 2,000 customers in one town are with its service. It surveys 80 of them. Identify the population and sample.`,steps:[{label:`Identify the population`,detail:`The population is all 2,000 customers in the town.`},{label:`Identify the sample`,detail:`The sample is the 80 customers who were actually surveyed.`},{label:`Think about why a sample was used`,detail:`Surveying all 2,000 customers would take far too long, so a smaller sample is used instead.`},{label:`Consider representativeness`,detail:`For the sample to be useful, the 80 customers should reflect the wider group of 2,000.`}],answer:`Population = 2,000 customers; sample = the 80 customers surveyed.`},tryIt:{id:`l11-tryit`,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A school has 480 students. A teacher surveys 30 students about the new library layout. What is the population in this investigation?`,options:[`All 480 students in the school`,`The 30 students surveyed`,`The teacher`,`The library layout`],answer:`All 480 students in the school`,hints:[`The population is the whole group the investigation is about, not just who was asked.`,`Think about who the results are meant to represent — the whole school, not just those surveyed.`,`The population here is every student in the school.`],explanation:`The population is the entire group being investigated — here, all 480 students in the school, not just the smaller group who were surveyed.`},checkUnderstanding:[{id:`l11-check1`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A farmer has 3,000 apple trees and wants to check how many apples are healthy. She checks 60 trees. What is the sample?`,options:[`The 60 trees she checks`,`All 3,000 apple trees`,`The farm itself`,`The apples that are unhealthy`],answer:`The 60 trees she checks`,hints:[`The sample is the smaller group actually studied, not the whole orchard.`,`Think about which number represents 'part of the population', not 'all of it'.`,`The sample is the smaller group chosen to represent the full 3,000 trees.`],explanation:`The sample is the smaller part of the population that is actually studied — here, the 60 trees the farmer checks.`},{id:`l11-check2`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`Why do researchers usually study a sample instead of the whole population?`,options:[`Because studying the entire population is often too slow, costly, or impractical`,`Because samples are always more accurate than populations`,`Because populations do not contain useful data`,`Because a sample must always be bigger than the population`],answer:`Because studying the entire population is often too slow, costly, or impractical`,hints:[`Think about the practical challenges of surveying an enormous group.`,`Rule out any option that claims samples are automatically more accurate — that is not generally true.`,`Time, cost, and practicality are usually the reasons a smaller sample is chosen instead.`],explanation:`Surveying an entire population can take too much time and money, so researchers usually study a smaller, practical sample instead.`}],miniChallenge:{id:`l11-mini`,difficulty:`challenge`,skill:`sampling`,type:`multiple-choice`,prompt:`A council wants to know how all 15,000 residents of a town feel about a new park. It surveys 200 residents chosen from every neighbourhood. Which statement is correct?`,options:[`The population is 15,000 residents, and the 200 residents form the sample`,`The population is 200 residents, and the 15,000 residents form the sample`,`There is no population in this investigation, only a sample`,`The sample and population are exactly the same group`],answer:`The population is 15,000 residents, and the 200 residents form the sample`,hints:[`The population is always the larger, complete group the investigation is about.`,`The sample is the smaller group that was actually surveyed.`,`One number represents the whole town; the other represents a smaller group chosen from it.`],explanation:`The population is the entire town of 15,000 residents, while the 200 residents actually surveyed form the sample.`}},{id:`l12-sample-size`,module:2,number:12,title:`Sample Size`,summary:`See why small samples give unreliable, unpredictable results.`,keyIdea:`A larger sample size usually gives more reliable, stable results because it is less affected by chance and unusual individual results. A very small sample can easily give a misleading picture of the whole population.`,vocabIds:[`sample-size`,`sample`,`representative-sample`],tool:`sample-simulator`,workedExample:{prompt:`A toy shop wants to know how many customers prefer board games over video games. Comparing a sample of 5 customers with a sample of 200 customers, explain which is more reliable.`,steps:[{label:`Consider the small sample`,detail:`With only 5 customers, if 3 happen to prefer board games, that looks like 60% — but this could easily happen by chance.`},{label:`Consider the large sample`,detail:`With 200 customers, one or two unusual answers barely change the overall percentage.`},{label:`Compare reliability`,detail:`The larger sample of 200 is far less affected by chance results from just a few people.`},{label:`State the conclusion`,detail:`A sample of 200 gives a more reliable picture of all customers than a sample of 5.`}],answer:`The sample of 200 is more reliable because it is much less affected by chance than the sample of 5.`},tryIt:{id:`l12-tryit`,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`Two students investigate favourite football teams. Priya asks 4 friends; Oliver asks 100 students across the school. Whose result is likely to be more reliable?`,options:[`Oliver's, because a larger sample is less affected by chance`,`Priya's, because asking friends is quicker`,`Both are equally reliable`,`Priya's, because smaller samples are always more accurate`],answer:`Oliver's, because a larger sample is less affected by chance`,hints:[`Think about how easily a few unusual answers can skew a very small sample.`,`A sample of 4 could easily be unrepresentative just by chance.`,`The much larger sample spreads the chance of unusual answers more thinly.`],explanation:`Oliver's larger sample of 100 is less likely to be skewed by chance results from just a few people, making it more reliable than Priya's sample of 4.`},checkUnderstanding:[{id:`l12-check1`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A researcher tests 3 light bulbs from a factory that makes 10,000 bulbs a day and finds all 3 last exactly 1,000 hours. What is the main problem with concluding 'every bulb lasts 1,000 hours'?`,options:[`A sample of only 3 bulbs is far too small to represent 10,000 bulbs reliably`,`Light bulbs cannot be tested for how long they last`,`1,000 hours is an impossible result`,`There is no problem — 3 bulbs is a perfectly reliable sample`],answer:`A sample of only 3 bulbs is far too small to represent 10,000 bulbs reliably`,hints:[`Compare the sample size to the total number of bulbs made each day.`,`3 out of 10,000 is an extremely small fraction.`,`Such a tiny sample could easily happen to give a similar result by chance, without reflecting all the bulbs.`],explanation:`A sample of only 3 bulbs out of 10,000 made daily is far too small to reliably represent how all the bulbs perform.`},{id:`l12-check2`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`Which sample size is likely to give the MOST reliable estimate of how a whole school of 900 students feels about school lunches?`,options:[`150 students`,`5 students`,`15 students`,`1 student`],answer:`150 students`,hints:[`Generally, a bigger sample size (up to a sensible limit) gives more reliable results.`,`Compare the four options and pick the largest one.`,`The largest sample among the choices is likely to be the most reliable here.`],explanation:`Of the options given, 150 students is the largest sample, and larger samples are generally less affected by chance, making them more reliable.`}],miniChallenge:{id:`l12-mini`,difficulty:`challenge`,skill:`sampling`,type:`multiple-choice`,prompt:`A magazine tests 4 different phone batteries and claims 'This phone brand lasts longest!' A rival magazine tests 300 phones of the same brands. Whose conclusion should be trusted more, and why?`,options:[`The rival magazine's, because a sample of 300 is far less likely to be skewed by a few unusual results`,`The first magazine's, because it published its result first`,`Both should be trusted equally, since sample size does not matter for batteries`,`Neither can be trusted because phone batteries cannot be tested`],answer:`The rival magazine's, because a sample of 300 is far less likely to be skewed by a few unusual results`,hints:[`Think about how much a handful of odd results can distort a very small sample.`,`A far larger number of tested phones spreads out any unusual individual results much more.`,`A much bigger sample size generally leads to a more trustworthy overall conclusion.`],explanation:`A sample of 300 phones is far less likely to be distorted by a few unusual results than a sample of just 4, so the rival magazine's conclusion is more trustworthy.`}},{id:`l13-representative-samples`,module:2,number:13,title:`Representative Samples`,summary:`Spot biased sampling and identify fairer, representative alternatives.`,keyIdea:`A representative sample reflects the population fairly, including a mix of the different groups within it. A sample can be biased if it only includes people who are easy to reach, already interested, or all from one group, even if the sample size is large.`,vocabIds:[`representative-sample`,`bias`,`population`],workedExample:{prompt:`A school wants to know if students support a new healthy-eating menu. It surveys 100 students, but only from the school's cooking club. Is this sample representative?`,steps:[{label:`Identify the population`,detail:`The population is all students in the school.`},{label:`Look at who was sampled`,detail:`Only cooking club members were asked, not a mix of all students.`},{label:`Check for bias`,detail:`Cooking club members are likely to already be interested in food and healthy eating, so their views may not match everyone else's.`},{label:`State the conclusion`,detail:`Even with 100 responses, this sample is biased and not representative of the whole school.`}],answer:`The sample is biased because it only includes cooking club members, not a fair mix of the whole school.`},tryIt:{id:`l13-tryit`,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A council wants residents' views on a new cycling lane, so it only surveys people leaving the cycling shop. What is the problem with this sample?`,options:[`It only includes people who already cycle, so it is not representative of all residents`,`The sample is too large to be useful`,`There is no problem with this sample`,`Cycling shops are not allowed to be surveyed`],answer:`It only includes people who already cycle, so it is not representative of all residents`,hints:[`Think about who is likely to be near a cycling shop in the first place.`,`People at a cycling shop are probably more interested in cycling than the average resident.`,`This over-represents one group and leaves out residents who do not cycle.`],explanation:`Surveying only people at a cycling shop over-represents cyclists and excludes other residents, making the sample biased rather than representative.`},checkUnderstanding:[{id:`l13-check1`,difficulty:`practice`,skill:`sampling`,type:`classify`,prompt:`Sort each sampling method for investigating "What is the most popular school lunch option?" into whether it is likely representative or biased.`,classify:{categories:[`Likely representative`,`Likely biased`],items:[{label:`Randomly selecting 60 students from across all year groups`,category:`Likely representative`},{label:`Only asking students who buy lunch from the vegetarian counter`,category:`Likely biased`},{label:`Selecting students proportionally from each class`,category:`Likely representative`},{label:`Only asking the students in the lunch queue at 12:00 on one day`,category:`Likely biased`}]},hints:[`Look for methods that include a broad mix of the population.`,`Methods that only include one small, specific group tend to be biased.`,`Random or proportional selection across the whole population is usually the fairer choice.`],explanation:`Random or proportional selection across all groups tends to be representative, while methods that only reach one narrow group (like one counter or one time slot) tend to be biased.`},{id:`l13-check2`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A gym app wants to know how satisfied "people in the area" are with gyms, so it only surveys its own paying app users. Why might this sample be biased?`,options:[`It only includes people already using the gym app, leaving out people who do not use gyms at all`,`App users always give false answers`,`The sample size is too large`,`This is a perfectly representative sample`],answer:`It only includes people already using the gym app, leaving out people who do not use gyms at all`,hints:[`Think about who is excluded when you only survey existing app users.`,`People who do not use gyms or this particular app have no chance of being included.`,`This over-represents people who are already engaged with gym culture.`],explanation:`Only surveying existing app users excludes everyone who does not use gyms or this app, so the sample is biased toward people already engaged with gym culture.`}],miniChallenge:{id:`l13-mini`,difficulty:`challenge`,skill:`sampling`,type:`multiple-choice`,prompt:`A company wants to find out if "people in the city" like their new fizzy drink. Which sampling method would give the MOST representative sample?`,options:[`Randomly stopping people at several different locations across the city, at different times of day`,`Only asking people at the company's own launch party`,`Only asking people who already follow the company on social media`,`Only asking people queuing outside a rival drink company's store`],answer:`Randomly stopping people at several different locations across the city, at different times of day`,hints:[`Look for the method that reaches the widest, most varied group of city residents.`,`The other options all involve people already connected to the company or drink culture in some way.`,`Sampling from multiple locations and times spreads the sample fairly across many different kinds of people.`],explanation:`Randomly sampling across several locations and times reaches a broad, varied mix of city residents, rather than a narrow group already connected to the company.`}},{id:`l14-choosing-a-sample`,module:2,number:14,title:`Choosing a Sample`,summary:`Decide a suitable sample size, who to ask, and how to ask them.`,keyIdea:`Choosing a good sample means deciding a sensible size (big enough to be reliable, small enough to be practical), a fair mix of people from the population, and a practical method for collecting the data. All three choices affect how trustworthy the results will be.`,vocabIds:[`sample`,`sample-size`,`representative-sample`],workedExample:{prompt:`A shoe company is designing a new trainer and wants feedback from teenagers across the country before launching it. Plan a suitable sample.`,steps:[{label:`Choose a sensible size`,detail:`A sample of around 500 teenagers is large enough to be reliable, but still practical to survey.`},{label:`Choose who to ask`,detail:`Include teenagers from different regions, genders, and shoe-size ranges, not just one group.`},{label:`Choose a method`,detail:`Use an online questionnaire that teenagers across the country can access easily.`},{label:`Check it's fit for purpose`,detail:`This plan balances reliability (a decent size) with practicality (an online method) and fairness (a varied group).`}],answer:`A sample of about 500 teenagers from different regions, contacted through an online questionnaire.`},tryIt:{id:`l14-tryit`,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A local newspaper wants to know what 30,000 town residents think about a new library. Which sample plan is most suitable?`,options:[`Survey 300 residents chosen from different streets and age groups across the town`,`Survey 3 residents who live next to the newspaper office`,`Survey every single one of the 30,000 residents`,`Survey only residents who already visit the library every day`],answer:`Survey 300 residents chosen from different streets and age groups across the town`,hints:[`Look for a sample that is a sensible size and includes a fair mix of residents.`,`Surveying everyone would take too long; surveying very few people, or only one narrow group, causes other problems.`,`A moderate-sized sample from different streets and ages balances reliability with practicality.`],explanation:`300 residents from different streets and age groups is large enough to be reliable and varied enough to be fair, unlike the other options which are too small, too narrow, or impractically large.`},checkUnderstanding:[{id:`l14-check1`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A sports brand wants opinions on a new football boot from players of all ages and abilities. Which method is most suitable for reaching a fair, varied sample?`,options:[`Surveying players at several different clubs, covering a range of ages and skill levels`,`Surveying only professional players at one elite club`,`Surveying only the brand's own staff`,`Surveying only players under the age of 10`],answer:`Surveying players at several different clubs, covering a range of ages and skill levels`,hints:[`Think about which option covers the widest range of the people the brand actually wants to reach.`,`The other options are all narrow, single groups rather than a varied mix.`,`Multiple clubs, ages, and skill levels give a fair spread across the whole target group.`],explanation:`Surveying players from several clubs across a range of ages and skill levels gives a fair, varied sample, rather than one narrow group.`},{id:`l14-check2`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A school council wants feedback on the canteen menu from all 700 students. Which sample size and method combination is most sensible?`,options:[`About 80 students, selected across all year groups, filling in a short paper form`,`2 students, chosen by the council members themselves`,`All 700 students interviewed one at a time by the council`,`700 students, but only counting the ones who happen to reply first`],answer:`About 80 students, selected across all year groups, filling in a short paper form`,hints:[`Look for a sample size that's large enough to be reliable but still practical to collect.`,`Rule out options that are too small, too slow, or likely to be biased toward whoever replies fastest.`,`A sample spread across year groups, of a manageable size, with a quick method, fits best.`],explanation:`About 80 students spread across all year groups, using a quick paper form, is large enough to be reliable and practical to collect, unlike the other options.`}],miniChallenge:{id:`l14-mini`,difficulty:`challenge`,skill:`sampling`,type:`multiple-choice`,prompt:`A city wants to find out how residents feel about extending bus routes at night. Which sampling plan best balances reliability, fairness, and practicality?`,options:[`Survey 400 residents selected from different neighbourhoods, age groups, and times of day`,`Survey 5 residents who are waiting at one bus stop at 3am`,`Survey every resident in the city individually, over several months`,`Survey only residents who have written complaints about buses before`],answer:`Survey 400 residents selected from different neighbourhoods, age groups, and times of day`,hints:[`Weigh up sample size, who is included, and how practical each method is.`,`Very small or narrow samples, and surveying an entire city, all cause problems for reliability or practicality.`,`One option spreads its sample across neighbourhoods, ages, and times, balancing every concern well.`],explanation:`400 residents spread across neighbourhoods, ages, and times of day gives a reliable, fair, and practical sample, unlike options that are too small, too narrow, or too slow.`}},{id:`l15-small-vs-large-samples`,module:2,number:15,title:`Small vs Large Samples`,summary:`Compare how much sample means vary at different sample sizes.`,keyIdea:`When you take several small samples from the same population, their means can vary a lot from one sample to the next. Larger samples tend to give means that are more consistent and closer to the true population mean, because chance has less effect.`,vocabIds:[`sample-size`,`mean`,`representative-sample`],tool:`sample-simulator`,workedExample:{prompt:`A sweet factory checks bags of sweets. Three samples of 5 bags had means of 42, 51, and 36 sweets. Three samples of 50 bags had means of 44, 45, and 43 sweets. Compare the variability.`,steps:[{label:`Look at the small-sample means`,detail:`The samples of 5 bags gave means of 42, 51, and 36 — a spread of 15 sweets between the highest and lowest.`},{label:`Look at the large-sample means`,detail:`The samples of 50 bags gave means of 44, 45, and 43 — a spread of only 2 sweets.`},{label:`Compare the spreads`,detail:`The small samples' means vary far more than the large samples' means.`},{label:`State the conclusion`,detail:`Larger samples give more consistent, reliable estimates of the true average number of sweets per bag.`}],answer:`The means from samples of 50 vary much less (spread of 2) than means from samples of 5 (spread of 15), so larger samples are more reliable.`},tryIt:{id:`l15-tryit`,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A farmer weighs eggs. Small samples of 4 eggs give means of 58g, 70g, and 52g. Large samples of 60 eggs give means of 61g, 62g, and 60g. Which sample size gives more consistent means?`,options:[`Samples of 60 eggs`,`Samples of 4 eggs`,`Both are equally consistent`,`Neither sample size gives consistent results`],answer:`Samples of 60 eggs`,hints:[`Compare how much the three means differ from each other within each group.`,`One group of means is spread much wider apart than the other.`,`The group with the smaller spread between its means is the more consistent one.`],explanation:`The means from samples of 60 eggs (61, 62, 60) are much closer together than the means from samples of 4 eggs (58, 70, 52), so the larger samples are more consistent.`},checkUnderstanding:[{id:`l15-check1`,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`Why do sample means from small samples tend to vary more than means from large samples, when both are taken from the same population?`,options:[`In a small sample, one or two unusual values have a bigger effect on the mean`,`Small samples always contain incorrect data`,`Large samples are calculated differently from small samples`,`There is no real difference between small and large sample means`],answer:`In a small sample, one or two unusual values have a bigger effect on the mean`,hints:[`Think about how much one unusually high or low value changes a mean, depending on how many values there are.`,`In a small sample, one unusual value makes up a large fraction of the data; in a big sample it barely matters.`,`The bigger relative effect of unusual values in small samples causes their means to swing around more.`],explanation:`In a small sample, a single unusual value makes up a larger fraction of the data, so it has a bigger effect on the mean, causing more variation between different small samples.`},{id:`l15-check2`,difficulty:`practice`,skill:`sampling`,type:`numerical`,prompt:`Four separate samples of 10 fish from a lake had mean lengths (cm): 24, 27, 22, 23. What is the mean of these four sample means?`,numericAnswer:24,numericUnit:`cm`,verify:{values:[24,27,22,23],statistic:`mean`},hints:[`Add the four sample means together first.`,`24 + 27 + 22 + 23 = 96.`,`Divide the total by 4, the number of samples, to find the mean of the means.`],explanation:`Adding the four means gives 96, and 96 ÷ 4 = 24, so the mean of the sample means is 24cm.`}],miniChallenge:{id:`l15-mini`,difficulty:`challenge`,skill:`sampling`,type:`multiple-choice`,prompt:`A juice company tests the volume of juice in cartons. Five samples of 3 cartons give means (ml): 245, 260, 230, 255, 238. Five samples of 40 cartons give means (ml): 249, 251, 248, 250, 250. What can be concluded?`,options:[`The samples of 40 cartons give much more consistent means, so they are more reliable for estimating the true average`,`The samples of 3 cartons are more reliable because they were measured first`,`Both sample sizes are equally reliable since the numbers are all close to 250`,`Sample size has no effect on how consistent the means are`],answer:`The samples of 40 cartons give much more consistent means, so they are more reliable for estimating the true average`,hints:[`Compare how spread out each group of five means is.`,`One group of means ranges much more widely than the other.`,`The tighter, more consistent group of means comes from the larger sample size.`],explanation:`The means from samples of 40 cartons (248-251) are much closer together than the means from samples of 3 cartons (230-260), showing that larger samples give more consistent, reliable estimates.`}}];function ni(e,t){return t<3?`beginning`:e>=90?`mastered`:e>=70?`secure`:e>=40?`developing`:`beginning`}function ri(e,t){let n=new Map,r=new Map(t.map(e=>[e.id,e]));for(let t of Object.values(e.questionAttempts)){var i;let e=r.get(t.questionId);if(!e)continue;let a=(i=n.get(e.skill))==null?{correct:0,total:0}:i;a.total+=1,t.correctOnFirstTry&&(a.correct+=1),n.set(e.skill,a)}return[`data-types`,`frequency-tables`,`averages`,`questionnaires`,`sampling`,`reasoning`].map(e=>{var t;let r=(t=n.get(e))==null?{correct:0,total:0}:t,i=r.total===0?0:Math.round(r.correct/r.total*100);return{skill:e,correct:r.correct,total:r.total,pct:i,level:ni(i,r.total)}} ,{id:`prediction`,word:`Prediction`,definition:`A sensible guess about what data collection will show, made before collecting the data.`,example:`Example: "I predict most students will choose the science club."`},{id:`questionnaire`,word:`Questionnaire`,definition:`A set of written questions used to collect data from people.`,example:`Example: A 5-question form asking students about their reading habits.`},{id:`survey`,word:`Survey`,definition:`The activity of collecting data from a group of people, often using a questionnaire.`,example:`Example: Asking 30 shoppers which snack they prefer.`},{id:`population`,word:`Population`,definition:`The entire group that a data investigation is about.`,example:`Example: Every student in a school, when investigating lunch preferences.`},{id:`sample`,word:`Sample`,definition:`A smaller part of the population chosen to represent the whole group.`,example:`Example: 25 students picked from a school of 500 to answer a survey.`},{id:`sample-size`,word:`Sample size`,definition:`The number of people or items included in a sample.`,example:`Example: A sample size of 40 customers out of 2,000.`},{id:`representative-sample`,word:`Representative sample`,definition:`A sample that reflects the population fairly, with no group left out or overcounted.`,example:`Example: Choosing students from every year group, not just Year 6.`},{id:`bias`,word:`Bias`,definition:`An unfair influence in data collection that makes results misleading or one-sided.`,example:`Example: Only surveying skateboard club members about a new skate park.`},{id:`mean`,word:`Mean`,definition:`The average found by adding all the values and dividing by how many there are.`,example:`Example: Scores 4, 6, 8 have a mean of 6.`},{id:`median`,word:`Median`,definition:`The middle value when a data set is arranged in order.`,example:`Example: In 3, 5, 9, the median is 5.`},{id:`mode`,word:`Mode`,definition:`The value that appears most often in a data set.`,example:`Example: In 2, 2, =ii(e,t.id);return(0,M.jsxs)(j,{to:`/practice/${t.id}`,className:`dl-module-card`,children:[(0,M.jsx)(`span`,{className:`dl-module-icon`,style:{background:`var(--sage)`},children:(0,M.jsx)(Tr,{size:20})}),(0,M.jsxs)(`div`,{style:{fontWeight:800,fontSize:15},children:[`Set `,t.id,` · `,t.title]}),(0,M.jsx)(`div`,{className:`dl-muted`,style:{fontSize:13,marginTop:4,marginBottom:10},children:t.desc}),(0,M.jsx)(`span`,{className:`dl-pill dl-pill-neutral`,style:{fontSize:11},children:n===null?`Not attempted`:`Best: ${n}%`})]},t.id)})})]})}var la=[{id:`set1-q01`,set:1,difficulty:`focus`,skill:`data-types`,type:`multiple-choice`,prompt:`A photography club keeps a record of how many photos each member submits to the monthly contest. What type of data is this?`,options:[`Categorical`,`Discrete`,`Continuous`,`Not data at all`],answer:`Discrete`,hints:[`Think about whether the answer is a number or a named group.`,`Ask yourself: can you count this in whole numbers, like 1, 2, 3 photos?`,`A number of photos can only be a whole number — you cannot submit half a photo.`],explanation:`The number of photos submitted is discrete data, because it is a count of whole items — you can only submit 0, 1, 2, 3... photos, never a fraction of one.`},{id:`set1-q02`,set:1,difficulty:`focus`,skill:`data-types`,type:`multiple-choice`,prompt:`A bakery asks customers to pick their favourite pastry from a list. What type of data is the customer's answer?`,options:[`Categorical`,`Discrete`,`Continuous`,`Numerical`],answer:`Categorical`,hints:[`Look at whether the answer is a number or the name of a group.`,`A favourite pastry is a label, like "croissant" or "muffin", not a number.`,`Data made of named groups, rather than numbers, has a special name.`],explanation:`A favourite pastry (such as 'croissant' or 'muffin') is a category, not a number, so this is categorical data.`},{id:`set1-q03`,set:1,difficulty:`focus`,skill:`data-types`,type:`multiple-choice`,prompt:`A gardening club measures the height of each sunflower in centimetres. What type of data is this?`,options:[`Categorical`,`Discrete`,`Continuous`,`Ordinal`],answer:`Continuous`,hints:[`Think about whether this is measured or counted.`,`Height is measured with a ruler or tape measure, not counted one at a time.`,`A measurement that could be any value, including decimals like 34.6 cm, is continuous.`],explanation:`Height is measured, not counted, and can take any value in a range (such as 34.6 cm), so it is continuous data.`},{id:`set1-q04`,set:1,difficulty:`focus`,skill:`data-types`,type:`multiple-choice`,prompt:`An esports team records how many matches each player wins in a season. What type of data is this?`,options:[`Categorical`,`Discrete`,`Continuous`,`Not data at all`],answer:`Discrete`,hints:[`Decide whether the values are counted or measured.`,`The number of wins is always a whole number.`,`You cannot win 2.5 matches, so this can be counted exactly.`],explanation:`The number of matches won is a count of whole matches, so it is discrete data.`},{id:`set1-q05`,set:1,difficulty:`focus`,skill:`data-types`,type:`multiple-choice`,prompt:`A bus company records how long, in minutes, each journey takes. What type of data is this?`,options:[`Categorical`,`Discrete`,`Continuous`,`Ordinal`],answer:`Continuous`,hints:[`Think about whether journey time is counted or measured.`,`Time is measured with a clock or stopwatch.`,`A journey could take 14.3 minutes, not just whole minutes.`],explanation:`Journey time is measured and can take any value, including fractions of a minute, so it is continuous data.`},{id:`set1-q06`,set:1,difficulty:`focus`,skill:`data-types`,type:`multiple-choice`,prompt:`A music app records which genre each user listens to most. What type of data is this?`,options:[`Categorical`,`Discrete`,`Continuous`,`Numerical`],answer:`Categorical`,hints:[`Check whether the answer is a number or the name of a group.`,`Genres like "pop" or "jazz" are labels, not numbers.`,`Data sorted into named groups rather than numbers is categorical.`],explanation:`A music genre is a named group, like 'pop' or 'jazz', so it is categorical data.`},{id:`set1-q07`,set:1,difficulty:`focus`,skill:`data-types`,type:`select-all`,prompt:`Select all that apply. Which of these are examples of discrete data?`,options:[`The number of goals scored in a hockey match`,`The time taken to finish a race`,`The number of books on a shelf`,`The weight of a suitcase`,`The number of emails received in a day`],answer:[`The number of goals scored in a hockey match`,`The number of books on a shelf`,`The number of emails received in a day`],hints:[`Discrete data is always a count of whole, separate items.`,`Ask which of these you count one at a time — 1, 2, 3...`,`Time and weight are measured, not counted, so rule those out.`],explanation:`Goals scored, books on a shelf, and emails received are all whole-number counts, so they are discrete. Race time and suitcase weight are measurements, so they are continuous.`},{id:`set1-q08`,set:1,difficulty:`focus`,skill:`data-types`,type:`classify`,prompt:`Sort each variable about a student's pet into the correct data type.`,classify:{categories:[`Categorical`,`Discrete`,`Continuous`],items:[{label:`The type of pet a student owns`,category:`Categorical`},{label:`The number of pets a student owns`,category:`Discrete`},{label:`The weight of a student's pet, in kilograms`,category:`Continuous`},{label:`The colour of a student's pet's fur`,category:`Categorical`},{label:`The number of vet visits the pet had last year`,category:`Discrete`},{label:`The length of the pet's daily walk, in minutes`,category:`Continuous`}]},hints:[`For each item, first decide if the answer is a name/label or a number.`,`If it is a number, decide if it is counted (whole numbers only) or measured (any value).`,`Colours and types are always categorical; counts are discrete; measurements are continuous.`],explanation:`Type and colour are named categories (categorical). Number of pets and number of vet visits are whole-number counts (discrete). Weight and walk length are measurements that can take any value (continuous).`},{id:`set1-q09`,set:1,difficulty:`practice`,skill:`data-types`,type:`multiple-choice`,prompt:`A drama club counts how many students audition for the school play each year. Which type of data is this, and why?`,options:[`Discrete — you can count a whole number of students`,`Continuous — the number could be any value`,`Categorical — auditioning is a category`,`Discrete — because it's about students`],answer:`Discrete — you can count a whole number of students`,hints:[`Focus on what is actually being recorded: a number of people.`,`Can the number of students be a fraction, like 12.5 students?`,`Whole-number counts of people or objects are discrete.`],explanation:`The number of students auditioning is a whole-number count, so it is discrete data — you can never have half a student auditioning.`},{id:`set1-q10`,set:1,difficulty:`practice`,skill:`data-types`,type:`multiple-choice`,prompt:`A café measures the temperature of its coffee, in degrees Celsius, when it is served. What type of data is this?`,options:[`Continuous, because temperature can take any value, including decimals`,`Discrete, because temperature is usually written as a whole number`,`Categorical, because 'hot' and 'cold' are categories`,`Continuous, because it is always measured in Celsius`],answer:`Continuous, because temperature can take any value, including decimals`,hints:[`Ignore how the number is usually written down and think about what is really possible.`,`Could the true temperature be something like 68.4°C?`,`A quantity that can take any value in a range, not just whole numbers, is continuous.`],explanation:`Temperature is a measurement that can take any value, such as 68.4°C, so it is continuous data — even if it is often rounded to a whole number.`},{id:`set1-q11`,set:1,difficulty:`practice`,skill:`data-types`,type:`multiple-choice`,prompt:`A shop sells trainers in

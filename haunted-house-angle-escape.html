<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunted House Angle Escape</title>
<meta name="description" content="A friendly Halloween angles escape room for Grade 4: classify, turn, measure, draw and find missing angles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1d1127; --night-2:#281734; --panel:#311f40; --panel-2:#3b2750; --line:#4f3766;
  --text:#fff6e8; --muted:#cdbcd6; --orange:#ff8c2e; --orange-dark:#c95f12; --candle:#ffd166;
  --slime:#8fdc7c; --teal:#8fe3ee; --coral:#ff7b6b; --ink:#140a1b; --paper:#fff6e8;
  --wood:#9b6a3f; --wood-dark:#5e3d22; --straw:#e9c46a; --green:#5aa04a; --green-dark:#2f6b2a;
  --radius:14px; --head:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%, #3a2148 0%, transparent 60%), var(--night)}
button,input{font:inherit}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.15;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 48px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600;font-size:18px}
.brand svg{width:34px;height:34px}
.lockmini{display:flex;gap:6px}
.lockmini span{width:28px;height:36px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--head);font-weight:700;color:var(--candle);background:var(--night-2)}
.btn{appearance:none;border:2px solid transparent;border-radius:12px;padding:12px 20px;min-height:48px;cursor:pointer;font-weight:700;background:var(--orange);color:#24110a;transition:transform .12s ease, background .15s}
.btn:hover{background:#ffa04f}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.card:focus-visible,.bin:focus-visible,.room:focus-visible{outline:3px solid var(--candle);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.small{padding:8px 14px;min-height:42px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
/* intro */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:20px 0}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:700;letter-spacing:.2px}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p.lead{font-size:19px;color:var(--muted);max-width:52ch}
.goals{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start}
.goals li b{color:var(--candle);font-family:var(--head);min-width:24px}
.namebox{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.namebox input{flex:1 1 220px;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--night-2);color:var(--text);padding:10px 14px}
.hero-art svg{width:100%;height:auto;display:block}
/* map */
.mapgrid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.house svg{width:100%;height:auto;display:block}
.room{cursor:pointer}
.room .win{transition:fill .2s}
.room.locked{cursor:not-allowed}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.side h2{font-size:22px;margin-bottom:6px}
.roomlist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.roomlist button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--night-2);color:var(--text);cursor:pointer;min-height:56px}
.roomlist button[disabled]{opacity:.5;cursor:not-allowed}
.roomlist .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-family:var(--head);font-weight:700;flex:none}
.roomlist .done .num{background:var(--slime);color:var(--ink)}
.roomlist small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.digit{margin-left:auto;font-family:var(--head);font-weight:700;color:var(--candle);font-size:20px}
/* room */
.roomhead{display:flex;gap:16px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.roomhead .ic{width:60px;height:60px;flex:none;background:#fff6e8;border-radius:50%;padding:6px}
.roomhead h1{font-size:clamp(26px,4vw,36px)}
.roomhead .std{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.story{color:var(--muted);margin:4px 0 14px;max-width:70ch}
.steps{display:flex;gap:8px;margin:10px 0 16px}
.steps span{flex:1;height:8px;border-radius:99px;background:var(--panel-2)}
.steps span.on{background:var(--orange)}
.steps span.ok{background:var(--slime)}
.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.task .q{font-size:19px;font-weight:700;margin-bottom:12px}
.task .q small{display:block;font-weight:400;color:var(--muted);font-size:15px}
.stage{background:var(--night-2);border-radius:12px;border:1px solid var(--line);overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.readout{font-family:var(--head);font-size:26px;font-weight:700;color:var(--candle);min-width:110px}
.answer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.answer label{font-weight:700}
.answer input{width:120px;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--night);color:var(--text);padding:8px 12px;font-size:22px;font-family:var(--head);text-align:center}
.answer .unit{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.actions .spacer{flex:1}
.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;display:none}
.feedback.show{display:block}
.feedback.good{background:rgba(143,220,124,.14);border:1px solid var(--slime)}
.feedback.bad{background:rgba(255,123,107,.12);border:1px solid var(--coral)}
.feedback.hint{background:rgba(255,209,102,.1);border:1px solid var(--candle)}
.feedback.sol{background:rgba(143,227,238,.1);border:1px solid var(--teal)}
.feedback b.tag{font-family:var(--head);display:block;margin-bottom:2px}
/* classify */
.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:120px}
.card{appearance:none;border:2px solid var(--line);background:var(--night-2);border-radius:12px;padding:6px;cursor:pointer;color:var(--text);position:relative;min-height:100px}
.card svg{width:100%;height:auto;display:block}
.card .id{position:absolute;left:8px;top:4px;font-family:var(--head);font-weight:700;color:var(--candle)}
.card.sel{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,140,46,.35)}
.card.wrong{border-color:var(--coral)}
.card.wrong::after{content:"✗";position:absolute;right:8px;top:2px;color:var(--coral);font-weight:700}
.card.right{border-color:var(--slime)}
.card.right::after{content:"✓";position:absolute;right:8px;top:2px;color:var(--slime);font-weight:700}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.bin{appearance:none;text-align:left;border:2px dashed var(--line);border-radius:12px;padding:10px;background:transparent;color:var(--text);cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:6px}
.bin.ready{border-color:var(--orange);background:rgba(255,140,46,.06)}
.bin h3{font-size:18px}
.binbtn{appearance:none;background:none;border:none;color:inherit;padding:0;text-align:left;cursor:pointer;min-height:32px}
.binbtn:focus-visible{outline:3px solid var(--candle);outline-offset:3px;border-radius:6px}
.bin small{color:var(--muted);font-size:13px;line-height:1.25}
.bin .held{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bin .held .card{min-height:0;padding:2px}
.bin .held .card .id{font-size:13px;left:5px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.choice{appearance:none;border:2px solid var(--line);background:var(--night-2);color:var(--text);border-radius:12px;padding:14px;min-height:56px;cursor:pointer;font-weight:700;text-align:left}
.choice.sel{border-color:var(--orange);background:rgba(255,140,46,.1)}
/* modal & cert */
.modal{position:fixed;inset:0;background:rgba(10,4,14,.72);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:24px;text-align:center}
.modal .big{font-family:var(--head);font-size:72px;font-weight:700;color:var(--candle);line-height:1;margin:8px 0}
.lockpad{display:flex;gap:8px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.lockpad input{width:52px;height:64px;border-radius:12px;border:2px solid var(--line);background:var(--night-2);color:var(--candle);text-align:center;font-size:30px;font-family:var(--head);font-weight:700}
.cert{background:var(--paper);color:#2a1630;border-radius:16px;padding:32px;text-align:center;max-width:820px;margin:0 auto;border:10px double var(--orange)}
.cert h1{font-size:40px;color:#3b1d4a}
.cert .who{font-family:var(--head);font-size:40px;color:var(--orange-dark);border-bottom:2px solid #3b1d4a;display:inline-block;padding:0 24px;margin:12px 0}
.cert .art{display:flex;justify-content:center;gap:18px;margin:12px 0}
.cert .art svg{width:60px;height:60px}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero-art{max-width:420px}
  .mapgrid{grid-template-columns:1fr}
  .pool,.bins{grid-template-columns:repeat(2,1fr)}
  .choices{grid-template-columns:1fr}
}
@media (max-width:420px){
  html,body{font-size:16px}
  .task{padding:12px}
  .lockmini span{width:22px;height:30px;font-size:14px}
  .brand span{display:none}
  .lockpad input{width:42px;height:56px;font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .cert{border-color:#c95f12}
}
</style>
</head>

<script>
const C = {"title": "Haunted House Angle Escape", "subtitle": "A Halloween angles escape room", "grade": "Grade 4 · Primary 4–5 · Cambridge Stage 4–5", "standards": ["4.MD.5", "4.MD.6", "4.MD.7", "4.G.1"], "lockCode": "547286", "rooms": [{"id": "gate", "name": "Front Gate", "icon": "cat", "skill": "Identify acute, right, obtuse and straight angles", "standard": "4.G.1, 4.MD.5", "story": "The creaky front gate swings open to different angles. Sort each gate angle into the right group to get past the black cat on guard.", "digitRule": "Lock digit = the number of OBTUSE angles in all three tasks.", "digit": 5, "tasks": [{"type": "classify", "prompt": "Sort the four gate angles. Tap a card, then tap the group it belongs to.", "items": [{"id": "A", "deg": 25, "rot": 0}, {"id": "B", "deg": 90, "rot": 0}, {"id": "C", "deg": 125, "rot": 0}, {"id": "D", "deg": 180, "rot": 0}], "hint1": "Compare each angle with a right angle (a square corner, 90°). Smaller than a square corner = acute. Bigger than a square corner but less than a flat line = obtuse. A flat line = straight (180°).", "hint2": "Look for the little square: it marks a right angle. Hold the corner of a sheet of paper on each angle in your mind.", "solution": "A = 25° is smaller than a right angle, so it is acute. B has a square corner, so it is right (90°). C = 125° opens wider than a square corner, so it is obtuse. D is a flat line, so it is straight (180°). Obtuse angles so far: 1."}, {"type": "classify", "prompt": "The gate is spinning around! The angles are turned, but their size has not changed. Sort them.", "items": [{"id": "E", "deg": 60, "rot": 35}, {"id": "F", "deg": 160, "rot": 200}, {"id": "G", "deg": 90, "rot": 120}, {"id": "H", "deg": 140, "rot": 290}], "hint1": "Turning an angle does not change its size. Only look at how far apart the two rays open.", "hint2": "Imagine turning the page until one ray is flat along the bottom. Then compare with a square corner.", "solution": "E = 60° is acute. F = 160° is obtuse (nearly flat, but not quite). G = 90° is right — see the square marker. H = 140° is obtuse. Obtuse angles in this task: 2."}, {"type": "classify", "prompt": "Tricky gate! These angles are labelled. Read each measure carefully before you sort.", "items": [{"id": "I", "deg": 89, "rot": 0, "label": true}, {"id": "J", "deg": 91, "rot": 0, "label": true}, {"id": "K", "deg": 179, "rot": 0, "label": true}, {"id": "L", "deg": 90, "rot": 0, "label": true}], "hint1": "Acute: less than 90°. Right: exactly 90°. Obtuse: more than 90° but less than 180°. Straight: exactly 180°.", "hint2": "89° is just under 90°. 91° is just over 90°. 179° is just under 180°, so it is not a straight angle.", "solution": "I = 89° is acute. J = 91° is obtuse. K = 179° is obtuse (straight needs exactly 180°). L = 90° is right. Obtuse in this task: 2. Total obtuse angles: 1 + 2 + 2 = 5, so the lock digit is 5."}]}, {"id": "pumpkin", "name": "Pumpkin Patch", "icon": "pumpkin", "skill": "Angles as turns: 1/4, 1/2, 3/4 and full turns", "standard": "4.MD.5", "story": "The giant pumpkin spins on its stem. Watch the stem to see how far it turns.", "digitRule": "Lock digit = your answer to Task 3.", "digit": 4, "tasks": [{"type": "choice", "prompt": "The pumpkin's stem started pointing up (to 12). It turned clockwise and now points down (to 6). What turn did it make?", "diagram": {"kind": "pumpkin", "from": 0, "turn": 180}, "options": ["1/4 turn (90°)", "1/2 turn (180°)", "3/4 turn (270°)", "Full turn (360°)"], "answer": 1, "hint1": "A full turn is 360°. Each quarter turn is 90° — like going from 12 to 3 on a clock.", "hint2": "Count the quarter turns from 12: 12 → 3 is one, 3 → 6 is two. Two quarters make a half.", "solution": "From 12 to 6 is two quarter turns: 90° + 90° = 180°. That is a 1/2 turn."}, {"type": "spin", "prompt": "Spin the pumpkin a 3/4 turn clockwise. Then tell the witch how many degrees it turned.", "target": 270, "answer": 270, "hint1": "A 3/4 turn is three quarter turns. Each quarter turn is 90°.", "hint2": "Stem path: 12 → 3 → 6 → 9. Stop when the stem points to 9.", "solution": "Three quarter turns: 90° + 90° + 90° = 270°. The stem ends pointing at 9."}, {"type": "number", "prompt": "A bat hops around the pumpkin. Each hop is a 1/4 turn (90°). After its last hop, the bat has made one full turn (360°). How many hops did it make?", "diagram": {"kind": "hops", "hop": 90, "count": 4}, "answer": 4, "unit": "hops", "wrong": {"3": "Three hops is only 270° — a 3/4 turn. The bat needs to get all the way back to the start.", "90": "90° is the size of one hop. The question asks how many hops."}, "hint1": "A full turn is 360°. How many 90° pieces fit into 360°?", "hint2": "Count by 90s: 90, 180, 270, 360. Count how many numbers you said.", "solution": "90 + 90 + 90 + 90 = 360, so the bat made 4 hops. The lock digit is 4."}]}, {"id": "kitchen", "name": "Witch's Kitchen", "icon": "cauldron", "skill": "Measure angles with a protractor", "standard": "4.MD.6", "story": "The witch left her broomsticks and spoon at odd angles. Use the magic protractor to measure them.", "digitRule": "Lock digit = the TENS digit of your answer to Task 3.", "digit": 7, "tasks": [{"type": "measure", "prompt": "Measure the angle between the two broomsticks. Drag the protractor so its centre dot sits on the vertex and its 0 line lies along one broomstick.", "diagram": {"kind": "angle", "deg": 35, "rot": 0, "theme": "broom"}, "answer": 35, "tolerance": 1, "hint1": "Line up the centre dot with the vertex (the corner point). Line up the 0° line with one ray. Then read where the other ray crosses the scale.", "hint2": "This angle is smaller than a right angle, so the answer must be less than 90°. Use the scale that starts at 0 on the bottom ray.", "solution": "With the protractor centred on the vertex and the bottom ray on 0°, the top broomstick crosses 35° on the inner scale. The angle is acute, so 35° (not 145°) makes sense."}, {"type": "measure", "prompt": "This broomstick point function parseNum(id){ const v=(document.getElementById(id)||{}).value; if(v==null) return NaN; const m=String(v).replace(/[°\s]/g,"").match(/^-?\d+$/); return m?parseInt(m[0],10):NaN; }

document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target && e.target.id==="ans"){ check(); } });

/* ---------- task types ---------- */
const TYPES=["acute","right","obtuse","straight"];
const TYPE_INFO={acute:"less than 90°",right:"exactly 90°",obtuse:"between 90° and 180°",straight:"exactly 180°"};
const typeOf=d=>d<90?"acute":d===90?"right":d<180?"obtuse":"straight";
const TASKS={
  classify:{
    mount(task){ T.place={}; T.sel=null; this.draw(task); },
    draw(task){
      const items=task.items, g=T.hint>=2;
      const card=(it,small)=>`<button class="card ${T.sel===it.id?"sel":""} ${T.marks&&T.marks[it.id]||""}" data-id="${it.id}" aria-pressed="${T.sel===it.id}"><span class="id">${it.id}</span>${cardAngle(it,g)}</button>`;
      const pool=items.filter(it=>!T.place[it.id]);
      document.getElementById("body").innerHTML=`<div class="pool" aria-label="Angle cards">${pool.map(it=>card(it)).join("")||`<p class="muted" style="grid-column:1/-1;margin:auto">All cards sorted — press <b>Check answer</b>.</p>`}</div>
       <div class="bins">${TYPES.map(t=>`<div class="bin ${T.sel?"ready":""}" data-bin="${t}" role="group" aria-label="${t} angles, ${TYPE_INFO[t]}"><button class="binbtn" data-bin="${t}"><h3>${t[0].toUpperCase()+t.slice(1)}</h3></button><small>${TYPE_INFO[t]}</small><div class="held">${items.filter(it=>T.place[it.id]===t).map(it=>card(it,true)).join("")}</div></div>`).join("")}</div>`;
      document.querySelectorAll(".card").forEach(el=>el.onclick=e=>{ e.stopPropagation(); if(T.solved) return; T.sel=T.sel===el.dataset.id?null:el.dataset.id; this.draw(task); });
      document.querySelectorAll(".bin").forEach(el=>el.onclick=()=>{ if(T.solved||!T.sel) return; T.place[T.sel]=el.dataset.bin; if(T.marks) delete T.marks[T.sel]; T.sel=null; this.draw(task); });
    },
    hintVisual(task){ this.draw(task); },
    check(task){
      const left=task.items.filter(it=>!T.place[it.id]);
      if(left.length){ fb("bad","Keep sorting",`Put every card in a group first (${left.length} left).`); return null; }
      T.marks={}; const wrong=[];
      task.items.forEach(it=>{ const ok=T.place[it.id]===typeOf(it.deg); T.marks[it.id]=ok?"right":"wrong"; if(!ok) wrong.push(it); });
      this.draw(task);
      if(!wrong.length) return {ok:true};
      const w=wrong[0], t=typeOf(w.deg);
      let msg=`${wrong.length} card${wrong.length>1?"s are":" is"} in the wrong group (marked ✗). Tap a card to move it.`;
      if(w.label && (w.deg===89||w.deg===91)) msg+=` Look closely at ${w.id}: ${w.deg}° is ${w.deg<90?"just under":"just over"} 90°.`;
      else if(w.deg===179) msg+=` ${w.id} is 179° — a straight angle must be exactly 180°.`;
      else msg+=` Hint: card ${w.id} is ${TYPE_INFO[t]}.`;
      return {ok:false,msg};
    },
    lock(){ document.querySelectorAll(".card,.binbtn").forEach(b=>b.disabled=true); }
  },
  choice:{
    mount(task){ T.pick=null; this.draw(task); },
    draw(task){ document.getElementById("body").innerHTML=`<div class="stage">${diagram(task.diagram,T.hint)}</div><div class="choices" role="radiogroup">${task.options.map((o,k)=>`<button class="choice ${T.pick===k?"sel":""}" role="radio" aria-checked="${T.pick===k}" data-k="${k}">${o}</button>`).join("")}</div>`;
      document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ if(T.solved) return; T.pick=+b.dataset.k; this.draw(task); }); },
    hintVisual(task){ this.draw(task); },
    check(task){ if(T.pick===null){ fb("bad","Choose one","Tap the turn you think is right."); return null; }
      if(T.pick===task.answer) return {ok:true};
      const m={0:"A 1/4 turn would stop at 3. The stem went further.",2:"A 3/4 turn would stop at 9. Count the quarter turns again.",3:"A full turn goes all the way back to 12."};
      return {ok:false,msg:m[T.pick]||"Count the quarter turns."}; },
    lock(){ document.querySelectorAll(".choice").forEach(b=>b.disabled=true); }
  },
  spin:{
    mount(task){ T.turn=0; this.draw(task); },
    svg(task){ const cx=320,cy=210; let s=`<svg viewBox="0 0 640 420" id="spinsvg" role="img" aria-label="Pumpkin you can spin. Turned ${T.turn} degrees">`;
      s+=`<circle cx="${cx}" cy="${cy}" r="150" fill="none" stroke="#4f3766" stroke-width="2"/>`+clockMarks(cx,cy,175);
      if(T.turn>0) s+=`<path d="${T.turn>=360?`M${cx} ${cy-125} A125 125 0 1 1 ${cx-0.01} ${cy-125}`:arc(cx,cy,125,90-T.turn,90)}" fill="none" stroke="${ARC}" stroke-width="6" stroke-linecap="round"/>`;
      if(T.hint>=2) [0,270,180].forEach(a=>{ const [x,y]=P(cx,cy,150,a); s+=dot(x,y,9,"#8fe3ee"); });
      s+=`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-150}" stroke="#cdbcd6" stroke-width="2" stroke-dasharray="6 6"/>`;
      s+=`<g id="pk" transform="rotate(${T.turn} ${cx} ${cy})" style="cursor:grab">${icon("pumpkin",cx-100,cy-114,200)}<circle cx="${cx+8}" cy="${cy-84}" r="22" fill="none" stroke="${LBL}" stroke-width="4"/></g>`;
      return s+"</svg>"; },
    draw(task){
      document.getElementById("body").innerHTML=`<div class="stage">${this.svg(task)}</div>
      <div class="tools"><span class="readout" id="ro">${T.turn}°</span><span class="muted" id="rofrac">${fracName(T.turn)}</span>
      <span class="spacer" style="flex:1"></span><button class="btn small" id="q">¼ turn clockwise ⟳</button><button class="btn ghost small" id="rs">Reset</button></div>
      ${numberBox("How many degrees did it turn?","°")}`;
      const self=this; document.getElementById("q").onclick=()=>{ if(T.solved) return; T.turn=Math.min(360,T.turn+90); self.refresh(task); };
      document.getElementById("rs").onclick=()=>{ if(T.solved) return; T.turn=0; self.refresh(task); };
      this.bindDrag(task);
    },
    refresh(task){ const st=document.querySelector(".stage"); st.innerHTML=this.svg(task); document.getElementById("ro").textContent=T.turn+"°"; document.getElementById("rofrac").textContent=fracName(T.turn); this.bindDrag(task); },
    bindDrag(task){ const svg=document.getElementById("spinsvg"); let last=null; const self=this;
      const ang=e=>{ const p=svgPt(svg,e); return (Math.atan2(p.x-320,-(p.y-210))*180/Math.PI+360)%360; };
      svg.onpointerdown=e=>{ if(T.solved) return; svg.setPointerCapture(e.pointerId); last=ang(e); T.raw=T.turn; };
      svg.onpointermove=e=>{ if(last===null) return; const a=ang(e); let d=a-last; if(d>180) d-=360; if(d<-180) d+=360; last=a; T.raw=Math.max(0,Math.min(360,T.raw+d)); const snapped=Math.round(T.raw/15)*15; if(snapped!==T.turn){ T.turn=snapped; const g=svg.querySelector("#pk"); g.setAttribute("transform",`rotate(${T.turn} 320 210)`); document.getElementById("ro").textContent=T.turn+"°"; document.getElementById("rofrac").textContent=fracName(T.turn);} };
      svg.onpointerup=svg.onpointercancel=()=>{ if(last===null) return; last=null; T.turn=Math.round(T.turn/90)*90; self.refresh(task); };
    },
    hintVisual(task){ this.refresh(task); },
    check(task){ const n=parseNum("ans");
      if(T.turn!==task.target) return {ok:false,msg:T.turn===0?"Spin the pumpkin first: drag it round, or tap ¼ turn.":`Your pumpkin turned ${T.turn}° (${fracName(T.turn)}). A 3/4 turn stops with the stem at 9.`};
      if(isNaN(n)) return needNum();
      if(n!==task.answer) return {ok:false,msg:`The pumpkin is in the right place! Now count the degrees: each quarter turn is 90°.`};
      return {ok:true}; },
    lock(){ document.getElementById("q").disabled=true; document.getElementById("rs").disabled=true; document.getElementById("ans").disabled=true; }
  },
  number:{
    mount(task){ this.draw(task); },
    draw(task){ const v=(document.getElementById("ans")||{}).value||""; document.getElementById("body").innerHTML=`<div class="stage">${diagram(task.diagram,T.hint)}</div>${numberBox(task.unit==="hops"?"Number of hops:":"x =",task.unit==="°"?"°":task.unit)}`; document.getElementById("ans").value=v; },
    hintVisual(task){ this.draw(task); },
    check(task){ const n=parseNum("ans"); if(isNaN(n)) return needNum(); if(n===task.answer) return {ok:true};
      return {ok:false,msg:(task.wrong&&task.wrong[String(n)])||"Check your adding and subtracting, then try again. Hint 1 can help."}; },
    lock(){ document.getElementById("ans").disabled=true; }
  },
  measure:{
    mount(task){ const d=task.diagram; T.dir=d.dir||1; T.lo=T.dir>0?d.rot:d.rot-d.deg; T.hi=T.lo+d.deg;
      T.v=d.rot===180?{x:400,y:320}:d.rot===0?{x:210,y:320}:{x:240,y:345};
      T.pr={x:T.v.x+60,y:T.v.y+75,r:0}; T.zoom=window.innerWidth<640; this.draw(task); },
    svgBody(task){ const d=task.diagram, v=T.v; const W=640,H=480;
      const vb=T.zoom?`${v.x-215} ${v.y-255} 430 340`:`0 0 ${W} ${H}`;
      let s=`<svg viewBox="${vb}" id="msvg" role="img" aria-label="Angle to measure with a draggable protractor">`;
      s+=`<rect x="-400" y="-400" width="1440" height="1300" fill="transparent"/>`;
      if(d.theme==="spoon") s+=icon("cauldron",v.x-120,v.y-60,240,'opacity=".35"');
      const len=270; const dec=(a)=>{ const [x,y]=P(v.x,v.y,len,a); return d.theme==="broom"?`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(-a)})"><path d="M0 -12 L34 -18 L40 0 L34 18 L0 12 Z" fill="#e9c46a" stroke="#5e3d22" stroke-width="2"/></g>`:""; };
      s+=angleMark(v.x,v.y,T.lo,d.deg,34,{w:3});
      s+=rayLine(v.x,v.y,len,T.lo,6,d.theme==="broom"?"#c9915d":RAY)+rayLine(v.x,v.y,len,T.hi,6,d.theme==="broom"?"#c9915d":RAY)+dec(T.lo)+dec(T.hi)+dot(v.x,v.y,7,"#ff8c2e");
      s+=this.protractor(task);
      return s+"</svg>"; },
    protractor(task){ const R=190, p=T.pr; const scale=T.hint>=2?this.scaleFor(task):null;
      let g=`<g id="prot" transform="translate(${f(p.x)} ${f(p.y)}) rotate(${f(-p.r)})">`;
      g+=`<path d="M${-R} 0 A${R} ${R} 0 0 1 ${R} 0 Z" fill="rgba(143,227,238,.16)" stroke="#8fe3ee" stroke-width="2.5" style="cursor:move" data-drag="move"/>`;
      g+=`<path d="M${-R+62} 0 A${R-62} ${R-62} 0 0 1 ${R-62} 0" fill="none" stroke="#8fe3ee" stroke-width="1" opacity=".6" pointer-events="none"/>`;
      if(scale) g+=`<path d="${scale==="outer"?`M${-R+16} 0 A${R-16} ${R-16} 0 0 1 ${R-16} 0`:`M${-R+44} 0 A${R-44} ${R-44} 0 0 1 ${R-44} 0`}" fill="none" stroke="#ff8c2e" stroke-width="22" opacity=".35" pointer-events="none"/>`;
      for(let a=0;a<=180;a++){ const L=a%10===0?16:a%5===0?10:5; const c=Math.cos(rad(a)), s2=-Math.sin(rad(a));
        g+=`<line x1="${f(R*c)}" y1="${f(R*s2)}" x2="${f((R-L)*c)}" y2="${f((R-L)*s2)}" stroke="#fff6e8" stroke-width="${a%10===0?1.6:1}" pointer-events="none"/>`;
        if(a%10===0){ const ot=180-a, it=a; const [ox,oy]=[(R-28)*c,(R-28)*s2], [ix,iy]=[(R-50)*c,(R-50)*s2];
          const dimO=scale==="inner"?.35:1, dimI=scale==="outer"?.35:1;
          g+=`<text x="${f(ox)}" y="${f(oy)}" transform="rotate(${90-a} ${f(ox)} ${f(oy)})" font-size="17" font-weight="700" fill="#ffd166" opacity="${dimO}" text-anchor="middle" dominant-baseline="central" font-family="Atkinson Hyperlegible,system-ui" pointer-events="none" ${ot>=100?'textLength="23" lengthAdjust="spacingAndGlyphs"':''}>${ot}</text>`;
          g+=`<text x="${f(ix)}" y="${f(iy)}" transform="rotate(${90-a} ${f(ix)} ${f(iy)})" font-size="14" fill="#8fe3ee" opacity="${dimI}" text-anchor="middle" dominant-baseline="central" font-family="Atkinson Hyperlegible,system-ui" pointer-events="none" ${it>=100?'textLength="19" lengthAdjust="spacingAndGlyphs"':''}>${it}</text>`; } }
      g+=`<line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="#8fe3ee" stroke-width="2" pointer-events="none"/>`;
      g+=`<line x1="0" y1="-14" x2="0" y2="0" stroke="#fff6e8" stroke-width="2" pointer-events="none"/><circle r="5" fill="none" stroke="#fff6e8" stroke-width="2" pointer-events="none"/>`;
      [[R+24,0],[-R-24,0],[0,-R-26]].forEach(([x,y])=>{ g+=`<g data-drag="rot" style="cursor:grab"><circle cx="${x}" cy="${y}" r="22" fill="#ff8c2e" stroke="#140a1b" stroke-width="3"/><text x="${x}" y="${y+1}" font-size="22" text-anchor="middle" dominant-baseline="central" fill="#140a1b" pointer-events="none">⟳</text></g>`; });
      return g+"</g>"; },
    scaleFor(task){ return (task.diagram.rot===180)?"outer":"inner"; },
    draw(task){
      document.getElementById("body").innerHTML=`<div class="stage" id="mstage">${this.svgBody(task)}</div>
       <div class="tools"><button class="btn ghost small" id="rl" aria-label="Rotate protractor anticlockwise 1 degree">⟲ 1°</button><button class="btn ghost small" id="rr" aria-label="Rotate protractor clockwise 1 degree">⟳ 1°</button>
       <button class="btn ghost small" id="zm" aria-pressed="${T.zoom}">${T.zoom?"Zoom out":"Zoom in"}</button><span class="muted" id="snapmsg" style="font-size:14px"></span></div>
       ${numberBox("The angle measures","°")}`;
      const self=this;
      document.getElementById("rl").onclick=()=>{ T.pr.r+=1; self.snap(); self.refresh(task); };
      document.getElementById("rr").onclick=()=>{ T.pr.r-=1; self.snap(); self.refresh(task); };
      document.getElementById("zm").onclick=()=>{ T.zoom=!T.zoom; const v=document.getElementById("ans").value; self.draw(task); document.getElementById("ans").value=v; };
      this.bind(task);
    },
    refresh(task){ document.getElementById("mstage").innerHTML=this.svgBody(task); this.bind(task); this.status(); },
    status(){ const el=document.getElementById("snapmsg"); if(!el) return; const onV=Math.hypot(T.pr.x-T.v.x,T.pr.y-T.v.y)<0.5; const al=this.aligned(); el.textContent=(onV?"✓ centre on vertex":"")+(onV&&al?" · ":"")+(al?"✓ 0 line on a ray":""); },
    aligned(){ const n=a=>((a%360)+360)%360; return [T.lo, T.hi-180].some(c=>Math.abs(n(T.pr.r)-n(c))<0.01); },
    snap(){ if(Math.hypot(T.pr.x-T.v.x,T.pr.y-T.v.y)<16){ T.pr.x=T.v.x; T.pr.y=T.v.y; }
      const n=a=>((a%360)+360)%360; for(const c of [T.lo,T.hi-180]){ let d=n(T.pr.r)-n(c); if(d>180) d-=360; if(d<-180) d+=360; if(Math.abs(d)<=3){ T.pr.r=c; break; } } },
    bind(task){ const svg=document.getElementById("msvg"); let mode=null, off=null, a0=0, r0=0; const self=this;
      svg.onpointerdown=e=>{ if(T.solved) return; const t=e.target.closest("[data-drag]"); if(!t) return; mode=t.dataset.drag; svg.setPointerCapture(e.pointerId); const p=svgPt(svg,e);
        if(mode==="move") off={x:p.x-T.pr.x,y:p.y-T.pr.y}; else { a0=Math.atan2(-(p.y-T.pr.y),p.x-T.pr.x)*180/Math.PI; r0=T.pr.r; } e.preventDefault(); };
      svg.onpointermove=e=>{ if(!mode) return; const p=svgPt(svg,e);
        if(mode==="move"){ T.pr.x=p.x-off.x; T.pr.y=p.y-off.y; } else { const a=Math.atan2(-(p.y-T.pr.y),p.x-T.pr.x)*180/Math.PI; T.pr.r=Math.round(r0+(a-a0)); }
        self.snap(); svg.querySelector("#prot").setAttribute("transform",`translate(${f(T.pr.x)} ${f(T.pr.y)}) rotate(${f(-T.pr.r)})`); self.status(); };
      svg.onpointerup=svg.onpointercancel=()=>{ mode=null; };
    },
    hintVisual(task){ T.pr={x:T.v.x,y:T.v.y,r:T.lo}; if(task.diagram.rot===180) T.pr.r=T.hi-180; this.refresh(task);
      document.getElementById("snapmsg").textContent="The protractor is now lined up. The orange band shows which scale to read."; },
    check(task){ const n=parseNum("ans"); if(isNaN(n)) return needNum(); const d=task.diagram.deg;
      if(Math.abs(n-d)<=task.tolerance) return {ok:true};
      if(Math.abs(n-(180-d))<=task.tolerance) return {ok:false,msg:`Which scale? ${n}° is the reading on the other scale. This angle is ${d<90?"acute, so it must be less than 90°":"obtuse, so it must be more than 90°"}. Use the scale that starts at 0 on the ray you lined up.`};
      return {ok:false,msg:"Not quite. Check that the centre dot is exactly on the vertex and the 0 line lies along one ray."}; },
    lock(){ document.getElementById("ans").disabled=true; }
  },
  construct:{
    mount(task){ T.ang=0; T.guide=true; this.draw(task); },
    vx:320, vy:350, R:250,
    dirAt(task,a){ return task.rot+task.dir*a; },
    svgBody(task){ return `<svg viewBox="30 62 580 322" id="csvg" role="img" aria-label="Turn the ray to draw an angle">${this.svgInner(task)}</svg>`; },
    svgInner(task){ const vx=this.vx,vy=this.vy; let s=`<rect x="0" y="${vy+4}" width="640" height="80" fill="#24142f"/>`;
      s+=`<rect width="640" height="430" fill="transparent"/>`;
      if(T.guide){ const R=190; s+=`<path d="M${vx-R} ${vy} A${R} ${R} 0 0 1 ${vx+R} ${vy} Z" fill="rgba(143,227,238,.08)" stroke="#8fe3ee" stroke-width="1.5" opacity=".8"/>`;
        for(let a=0;a<=180;a+=10){ const [x1,y1]=P(vx,vy,R,a),[x2,y2]=P(vx,vy,R-12,a); s+=`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#8fe3ee"/>`;
          const val=task.rot===180?180-a:a; const [lx,ly]=P(vx,vy,R-28,a); s+=`<text x="${f(lx)}" y="${f(ly)}" font-size="17" font-weight="700" fill="#8fe3ee" transform="rotate(${90-a} ${f(lx)} ${f(ly)})" ${val>=100?'textLength="25" lengthAdjust="spacingAndGlyphs"':""} text-anchor="middle" dominant-baseline="central">${val}</text>`; } }
      task.books.forEach(b=>{ const [x,y]=P(vx,vy,this.R,this.dirAt(task,b.deg)); const hit=T.solved&&b.deg===task.target;
        s+=`<g transform="translate(${f(x)} ${f(y)})"><rect x="-21" y="-29" width="42" height="58" rx="4" fill="${hit?"#8fdc7c":"#ff8c2e"}" stroke="#140a1b" stroke-width="3"/><rect x="-21" y="-29" width="8" height="58" fill="#c95f12"/>${label(4,1,b.n,28,"#140a1b")}</g>`; });
      if(T.hint>=2){ s+=rayLine(vx,vy,220,90,3,"#8fe3ee").replace("/>",' stroke-dasharray="8 6"/>')+label(vx+(task.dir>0?-34:34),vy-200,"90°",16,"#8fe3ee"); }
      s+=rayLine(vx,vy,280,task.rot,6);
      const lo=task.dir>0?task.rot:task.rot-T.ang; if(T.ang>0) s+=angleMark(vx,vy,lo,T.ang,46,{w:4});
      const a=this.dirAt(task,T.ang); s+=rayLine(vx,vy,230,a,6,"#ffd166");
      const [hx,hy]=P(vx,vy,200,a); s+=`<circle cx="${f(hx)}" cy="${f(hy)}" r="20" fill="#ffd166" stroke="#140a1b" stroke-width="3" style="cursor:grab"/>`;
      s+=dot(vx,vy,7,"#ff8c2e");
      return s; },
    draw(task){
      document.getElementById("body").innerHTML=`<div class="stage" id="cstage">${this.svgBody(task)}</div>
       <div class="tools"><span class="readout" id="cro" aria-live="polite">${T.ang}°</span>
       <button class="btn ghost small" id="m1" aria-label="Decrease 1 degree">−1°</button><button class="btn ghost small" id="p1" aria-label="Increase 1 degree">+1°</button>
       <label style="display:flex;gap:6px;align-items:center;margin-left:auto"><input type="checkbox" id="gd" ${T.guide?"checked":""} style="width:22px;height:22px"> Protractor guide</label></div>`;
      const self=this; const step=d=>{ if(T.solved) return; T.ang=Math.max(0,Math.min(180,T.ang+d)); self.refresh(task); };
      document.getElementById("m1").onclick=()=>step(-1); document.getElementById("p1").onclick=()=>step(1);
      document.getElementById("gd").onchange=e=>{ T.guide=e.target.checked; self.refresh(task); };
      this.bind(task);
    },
    refresh(task){ document.getElementById("csvg").innerHTML=this.svgInner(task); document.getElementById("cro").textContent=T.ang+"°"; },
    bind(task){ const svg=document.getElementById("csvg"); let on=false; const self=this;
      const upd=e=>{ const p=svgPt(svg,e); let a=Math.atan2(-(p.y-self.vy),p.x-self.vx)*180/Math.PI; let m=task.dir*(a-task.rot); m=((m%360)+360)%360; if(m>270) m=0; else if(m>180) m=180; m=Math.round(m); if(m!==T.ang){ T.ang=m; self.refresh(task); } };
      svg.onpointerdown=e=>{ if(T.solved) return; on=true; svg.setPointerCapture(e.pointerId); upd(e); };
      svg.onpointermove=e=>{ if(on) upd(e); };
      svg.onpointerup=svg.onpointercancel=()=>{ on=false; };
    },
    hintVisual(task){ this.refresh(task); },
    check(task){ if(T.ang===task.target){ return {ok:true}; }
      if(T.ang===180-task.target) return {ok:false,msg:`Your ray makes ${T.ang}° — that is the reading on the wrong scale. Measure from the floor ray: ${task.target}° is ${task.target<90?"acute":"obtuse"}.`};
      const b=task.books.reduce((best,b)=>Math.abs(b.deg-T.ang)<Math.abs(best.deg-T.ang)?b:best);
      return {ok:false,msg:`Your angle is ${T.ang}°. You need ${task.target}°. ${T.ang<task.target?"Turn further.":"Turn back a little."}`}; },
    lock(task){ this.refresh(task); document.querySelectorAll("#m1,#p1").forEach(b=>b.disabled=true);
      const b=task.books.find(b=>b.deg===task.target); document.getElementById("fb").insertAdjacentHTML("beforeend",`<br><b>The ray points to book ${b.n}.</b>`); }
  }
};
function fracName(t){ return {0:"no turn",90:"¼ turn",180:"½ turn",270:"¾ turn",360:"full turn"}[t]||"between quarter turns"; }
function svgPt(svg,e){ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }

/* ---------- lock + certificate ---------- */
function renderLock(){
  app.innerHTML=topbar()+`<section class="task" style="max-width:640px;margin:0 auto;text-align:center">${iconSvg("key")}
   <h1 style="font-size:32px">The Lock</h1><p class="muted">Type the six digits you collected, in room order (Room 1 → Room 6).</p>
   <div class="lockpad">${C.rooms.map((_,i)=>`<input maxlength="1" inputmode="numeric" aria-label="Digit ${i+1}" data-i="${i}">`).join("")}</div>
   <div class="actions" style="justify-content:center"><button class="btn" id="open">Unlock the door</button><button class="btn ghost" id="bk">← Map</button></div>
   <div id="fb" class="feedback" role="status"></div></section>`;
  const ins=[...document.querySelectorAll(".lockpad input")];
  ins.forEach((el,i)=>{ el.oninput=()=>{ el.value=el.value.replace(/\D/g,"").slice(-1); if(el.value&&ins[i+1]) ins[i+1].focus(); }; el.onkeydown=e=>{ if(e.key==="Backspace"&&!el.value&&ins[i-1]) ins[i-1].focus(); if(e.key==="Enter") open(); }; });
  ins[0].focus();
  const open=()=>{ const code=ins.map(i=>i.value).join(""); if(code===C.lockCode){ S.escaped=S.escaped||new Date().toISOString(); save(); go({name:"cert"}); } else fb("bad","The lock stays shut",code.length<6?"Fill in all six boxes.":"Check each digit against your rooms on the map, in order."); };
  document.getElementById("open").onclick=open; document.getElementById("bk").onclick=()=>go({name:"map"});
}
function renderCert(){
  const d=new Date(S.escaped||Date.now()); const stars=totalStars();
  app.innerHTML=topbar()+`<div class="cert"><div class="art">${["bat","jack","cat","cauldron","ghost"].map(n=>iconSvg(n)).join("")}</div>
   <p style="letter-spacing:3px;text-transform:uppercase;margin:0;font-weight:700">Certificate of Escape</p><h1>Haunted House Angle Escape</h1>
   <p style="margin:10px 0 0">This certifies that</p><div class="who">${esc(S.name)||"Angle Expert"}</div>
   <p>escaped all six rooms by classifying, turning, measuring, drawing and solving angles.</p>
   <p style="font-family:var(--head);font-size:22px;color:#c95f12">Lock code ${C.lockCode} · ${stars} / 54 ★</p>
   <p style="color:#6b4a72">${d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}</p></div>
   <div class="actions noprint" style="justify-content:center"><input id="cn" placeholder="Name on certificate" value="${esc(S.name)}" style="min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--night-2);color:var(--text);padding:8px 12px">
   <button class="btn ghost" id="upd">Update name</button><button class="btn" id="pr">Print certificate</button><button class="btn ghost" id="mp">← Map</button></div>`;
  document.getElementById("pr").onclick=()=>window.print();
  document.getElementById("upd").onclick=()=>{ S.name=document.getElementById("cn").value.trim(); save(); render(); };
  document.getElementById("mp").onclick=()=>go({name:"map"});
}
window.HHAE={go,state:()=>S,C};
render();
/* demo links for screenshots / teacher projection, e.g. #demo=2-1-2 (room 3, task 2, hint 2) */
(function(){ const m=location.hash.match(/demo=(\d)-(\d)(?:-(\d))?/); if(!m) return; S.teacher=true; if(!S.name) S.name="Alex";
  const i=+m[1], t=+m[2]; if(m[1]==="9"){ C.rooms.forEach((r,k)=>{ if(k<4){ const st=roomState(r.id); st.done=true; st.tasks=[{solved:true,stars:3},{solved:true,stars:3},{solved:true,stars:2}]; } }); return go({name:"map"}); }
  go({name:"room",i,t}); if(m[3]) showHint(+m[3]); })();

12 different brands. For each customer, the shop records which brand they bought. What type of data is "which brand a customer bought"?`,options:[`Categorical — the answer is a named group, not a number`,`Discrete — there are only 12 possible brands, so you can count them`,`Continuous — the brand could be anything`,`Categorical — because trainers are physical objects`],answer:`Categorical — the answer is a named group, not a number`,hints:[`Notice that the number of possible brands (12) is not the same as the data itself.`,`The recorded value for each customer is a brand name, not a number.`,`Data made of names or labels is categorical, no matter how many labels there are.`],explanation:`Each recorded value is a brand name, which is a category. Having 12 possible brands does not make the data discrete — it is still categorical, because the values are labels, not counts.`},{id:`set1-q12`,set:1,difficulty:`practice`,skill:`data-types`,type:`multiple-choice`,prompt:`A recycling scheme records the number of bottles collected at each school, rounded to the nearest ten. What type of data is this?`,options:[`Discrete — it is still a count of bottles, even though it is rounded`,`Continuous — rounding to the nearest ten means it could be any value`,`Categorical — the number is grouped`,`Continuous — because ten is used as a unit`],answer:`Discrete — it is still a count of bottles, even though it is rounded`,hints:[`Think about what is being measured underneath the rounding: bottles, which are countable objects.`,`Rounding a number does not change what kind of quantity it originally was.`,`A count of objects is discrete, whether or not it gets rounded afterwards.`],explanation:`The underlying quantity is a count of bottles, which is always a whole number. Rounding it to the nearest ten does not turn it into continuous data — it is still discrete.`},{id:`set1-q13`,set:1,difficulty:`practice`,skill:`data-types`,type:`select-all`,prompt:`Select all that apply. Which of these describe continuous data?`,options:[`The mass of a school bag, in kilograms`,`The number of school bags a shop sells in a day`,`The time taken to walk to school, in minutes`,`The number of straps on a school bag`,`The length of a school bag, in centimetres`],answer:[`The mass of a school bag, in kilograms`,`The time taken to walk to school, in minutes`,`The length of a school bag, in centimetres`],hints:[`Continuous data comes from measuring, not counting.`,`Mass, time, and length can all take decimal values.`,`Anything you count one at a time, like bags sold or straps, is not continuous.`],explanation:`Mass, time, and length are all measured quantities that can take any value, so they are continuous. Number of bags sold and number of straps are whole-number counts, so they are discrete.`},{id:`set1-q14`,set:1,difficulty:`practice`,skill:`data-types`,type:`classify`,prompt:`A bike shop is sorting the information it collects about the bikes it sells. Sort each variable into the correct data type.`,classify:{categories:[`Categorical`,`Discrete`,`Continuous`],items:[{label:`The colour of each bike sold`,category:`Categorical`},{label:`The number of bikes sold each month`,category:`Discrete`},{label:`The weight of each bike, in kilograms`,category:`Continuous`},{label:`The type of brake fitted (disc or rim)`,category:`Categorical`},{label:`The number of gears on each bike`,category:`Discrete`}]},hints:[`Start with colour and brake type — are these numbers or labels?`,`For the number of bikes and gears, ask if these are whole-number counts.`,`Weight is the only one that is measured rather than counted or labelled.`],explanation:`Colour and brake type are labels, so they are categorical. Number of bikes sold and number of gears are whole-number counts, so they are discrete. Weight is a measurement, so it is continuous.`},{id:`set1-q15`,set:1,difficulty:`practice`,skill:`data-types`,type:`multiple-choice`,prompt:`A tutor wants to find out how students prefer to submit homework: online or on paper. Which method collects categorical data directly?`,options:[`Ask each student to choose one option from a list: 'online' or 'on paper'`,`Ask each student how many homework tasks they did last month`,`Measure how long each student spends on homework`,`Ask each student to rate their preference from 1 to 10`],answer:`Ask each student to choose one option from a list: 'online' or 'on paper'`,hints:[`Categorical data means the answer is a named group, not a number.`,`Look for the option where the response is simply a word, like 'online'.`,`A count, a measurement, or a rating out of 10 would all produce numbers instead.`],explanation:`Choosing between 'online' and 'on paper' gives a named category as the answer, so it directly collects categorical data. The other methods all produce numbers.`},{id:`set1-q16`,set:1,difficulty:`practice`,skill:`data-types`,type:`classify`,prompt:`A swimming squad is sorting the information it collects about its swimmers. Sort each variable into the correct data type.`,classify:{categories:[`Categorical`,`Discrete`,`Continuous`],items:[{label:`The stroke style each swimmer specialises in (e.g. front crawl)`,category:`Categorical`},{label:`The number of lengths a swimmer completes in training`,category:`Discrete`},{label:`The time each swimmer takes to complete 100 m, in seconds`,category:`Continuous`},{label:`The lane number each swimmer is assigned`,category:`Categorical`},{label:`The number of training sessions attended each week`,category:`Discrete`},{label:`The distance each swimmer swims in a session, in metres`,category:`Continuous`}]},hints:[`Watch out — not every number in this list is actually numerical data.`,`A lane number identifies a lane; it is not used for counting or measuring anything.`,`Ask whether each variable is a label, a whole-number count, or a measurement.`],explanation:`Stroke style is a label, so it is categorical. A lane number is also just a label used to identify a lane, not a count or measurement, so it is categorical too, even though it looks like a number. Lengths and sessions attended are counted (discrete), while time and distance are measured (continuous).`},{id:`set1-q17`,set:1,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A running club member says: 'Shoe size is continuous data because it includes half sizes like 7.5.' Evaluate this claim.`,options:[`Not correct — shoe sizes only take fixed values like 6, 6.5, 7, so they are discrete, even though half sizes exist`,`Correct — since decimals like 7.5 appear, the data must be continuous`,`Not correct — shoe size is categorical because it is written on a label inside the shoe`,`Correct — continuous data must always include half numbers`],answer:`Not correct — shoe sizes only take fixed values like 6, 6.5, 7, so they are discrete, even though half sizes exist`,hints:[`Continuous data means a value could be anything in a range, not just some fixed steps.`,`List the possible shoe sizes between size 7 and size 8. Is every value in between possible?`,`A size of 7.3 or 7.8 does not exist — only 7 and 7.5 do, so the values jump in fixed steps.`],explanation:`Shoe sizes only take a limited set of fixed values (6, 6.5, 7, 7.5...), with no possible values in between them, so they are discrete, not continuous. Having a half-size step does not make data continuous.`},{id:`set1-q18`,set:1,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A science fair judge records each project's score out of 20 marks, but only whole-number scores are allowed. A student claims: 'This must be continuous data because marks measure how good the project is.' Evaluate this claim.`,options:[`Not supported — only whole-number scores are allowed, so the marks can be counted, making the data discrete`,`Supported — marks measure quality, so they are always continuous`,`Not supported — marks are categorical because they compare projects`,`Supported — because the score is out of 20, a fairly large range`],answer:`Not supported — only whole-number scores are allowed, so the marks can be counted, making the data discrete`,hints:[`Do not judge the data type just from what the number represents — check what values are actually allowed.`,`Ask: can a project score 14.5 marks under these rules?`,`If only whole numbers are possible, the data can be counted, which is the definition of discrete.`],explanation:`Even though marks reflect project quality, only whole numbers 0 to 20 are allowed, so the scores can be counted rather than measured on a continuous scale — this makes the data discrete, not continuous.`},{id:`set1-q19`,set:1,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A café manager records the number of cups of tea sold each day, and separately records the volume of milk used, in litres. A trainee claims: 'Both variables are continuous because they both involve amounts.' Evaluate this claim.`,options:[`No — the number of cups sold is a count, so it is discrete, but the volume of milk in litres is continuous, so the two variables are different types`,`Yes — both variables involve quantities, so both must be continuous`,`No — both variables are actually categorical because they describe drinks`,`Yes — because litres and cups are both units of measurement`],answer:`No — the number of cups sold is a count, so it is discrete, but the volume of milk in litres is continuous, so the two variables are different types`,hints:[`Check each variable separately instead of assuming they must match.`,`Cups of tea sold is something you count one at a time; litres of milk is something you measure.`,`A count of whole cups is different from a measured volume that could be any value.`],explanation:`The number of cups sold is a whole-number count (discrete), while the volume of milk in litres is a measurement that can take any value (continuous). "Involving an amount" does not automatically make a variable continuous.`},{id:`set1-q20`,set:1,difficulty:`challenge`,skill:`data-types`,type:`select-all`,prompt:`A community centre collects data about its members. Select all that apply. Which of these variables are continuous?`,options:[`The exact time it takes a member to complete a fun-run, in seconds`,`The number of fun-runs a member has completed`,`A member's reaction time in a test, measured in milliseconds`,`The number of stars a member rates the event, out of 5`,`The distance a member can throw a ball, measured in metres`],answer:[`The exact time it takes a member to complete a fun-run, in seconds`,`A member's reaction time in a test, measured in milliseconds`,`The distance a member can throw a ball, measured in metres`],hints:[`Continuous data comes from measurements that could take any value, not from counting or rating.`,`Time, reaction time, and distance are all measured with instruments like stopwatches and tape measures.`,`A number of fun-runs and a star rating out of 5 are both counted in fixed whole-number steps.`],explanation:`Time, reaction time, and throwing distance are all measurements that can take any value, so they are continuous. Number of fun-runs completed and a star rating are both whole-number counts, so they are discrete, not continuous.`}],L=[{id:`set2-q01`,set:2,difficulty:`focus`,skill:`frequency-tables`,type:`complete-table`,prompt:`Complete the frequency table for the data above.`,context:`A board game café recorded how many games each of 10 customers played in one evening: 2, 3, 2, 4, 3, 2, 3, 4, 2, 3.`,completeTable:{headers:[`Number of games`,`Frequency`],rows:[[`2`,`4`],[`3`,``],[`4`,`2`],[`Total`,``]],blanks:[{row:1,col:1,value:`4`},{row:3,col:1,value:`10`}]},hints:[`Go through the list of 10 values and tally how many times each number appears.`,`Count how many customers played 3 games — this fills the first blank.`,`The Total should equal the number of customers altogether: add up all the frequencies.`],explanation:`3 games were played by 4 customers (positions 2, 5, 7 and 10 in the list), and the total number of customers is 4 + 4 + 2 = 10.`,verify:{values:[2,3,2,4,3,2,3,4,2,3],statistic:`frequency-total`}},{id:`set2-q02`,set:2,difficulty:`focus`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`How many players won exactly 2 games?`,context:`An after-school chess club recorded the number of games won by each of 12 players in a tournament.`,table:{headers:[`Games won`,`Frequency`],rows:[[`0`,`3`],[`1`,`4`],[`2`,`3`],[`3`,`2`]]},options:[`3`,`4`,`2`,`12`],answer:`3`,hints:[`Look down the "Games won" column to find the row for 2.`,`Read across that row to the Frequency column.`,`The frequency tells you directly how many players are in that row.`],explanation:`The row for "2 games won" shows a frequency of 3, meaning 3 players won exactly 2 games.`},{id:`set2-q03`,set:2,difficulty:`focus`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`Which drink size was ordered the most often?`,context:`A coffee shop recorded the size of drink ordered by 35 customers one morning.`,table:{headers:[`Size`,`Frequency`],rows:[[`Small`,`10`],[`Medium`,`18`],[`Large`,`7`]]},options:[`Small`,`Medium`,`Large`,`They were all ordered equally`],answer:`Medium`,hints:[`The size ordered "the most often" is the one with the highest frequency.`,`Compare the three frequency values: 10, 18, and 7.`,`Find which of those three numbers is the largest.`],explanation:`Medium has the highest frequency (18), so it was ordered more often than Small (10) or Large (7).`},{id:`set2-q04`,set:2,difficulty:`focus`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`How many customers are represented in the table altogether?`,context:`A coffee shop recorded the size of drink ordered by its customers one morning.`,table:{headers:[`Size`,`Frequency`],rows:[[`Small`,`10`],[`Medium`,`18`],[`Large`,`7`]]},options:[`35`,`18`,`3`,`10`],answer:`35`,hints:[`The total number of customers is not shown directly in the table — you need to work it out.`,`Add together every frequency in the Frequency column.`,`10 + 18 + 7 = ?`],explanation:`Adding all the frequencies gives 10 + 18 + 7 = 35 customers in total, not just the number of rows (3) or the highest frequency (18).`},{id:`set2-q05`,set:2,difficulty:`focus`,skill:`averages`,type:`numerical`,prompt:`Calculate the mean score for the trivia team over the 8 rounds.`,context:`A trivia team recorded its score in each of 8 rounds: 6, 7, 5, 8, 7, 6, 9, 8.`,numericAnswer:7,numericTolerance:.01,numericUnit:`points`,hints:[`The mean is the total of all the scores divided by how many rounds there were.`,`Add up all 8 scores first.`,`Divide the total by 8.`],explanation:`The 8 scores add up to 56, and 56 ÷ 8 = 7, so the mean score is 7 points.`,verify:{values:[6,7,5,8,7,6,9,8],statistic:`mean`}},{id:`set2-q06`,set:2,difficulty:`focus`,skill:`averages`,type:`numerical`,prompt:`Find the median age of the 9 members.`,context:`A coding club recorded the ages, in years, of its 9 members: 10, 11, 9, 12, 10, 13, 9, 11, 10.`,numericAnswer:10,numericTolerance:.01,numericUnit:`years`,hints:[`First, put all 9 ages in order from smallest to largest.`,`The median is the middle value once the list is sorted.`,`With 9 values, the middle one is the 5th value.`],explanation:`Sorted, the ages are 9, 9, 10, 10, 10, 11, 11, 12, 13. The middle (5th) value is 10, so the median age is 10 years.`,verify:{values:[10,11,9,12,10,13,9,11,10],statistic:`median`}},{id:`set2-q07`,set:2,difficulty:`focus`,skill:`averages`,type:`numerical`,prompt:`Find the mode of the number of stickers collected.`,context:`A craft club recorded how many stickers each of 10 children collected: 3, 5, 3, 4, 3, 6, 5, 3, 4, 3.`,numericAnswer:3,numericTolerance:.01,numericUnit:`stickers`,hints:[`The mode is the value that appears most often in the list.`,`Count how many times each different number (3, 4, 5, and 6) appears.`,`One number appears more times than any of the others — that is the mode.`],explanation:`The number 3 appears 5 times, more often than 4, 5, or 6, so the mode is 3 stickers.`,verify:{values:[3,5,3,4,3,6,5,3,4,3],statistic:`mode`}},{id:`set2-q08`,set:2,difficulty:`focus`,skill:`frequency-tables`,type:`complete-table`,prompt:`Complete the frequency table for the data above.`,context:`A weekend market stall recorded how many jars of honey each of 12 customers bought: 1, 2, 1, 1, 3, 2, 1, 2, 1, 3, 2, 1.`,completeTable:{headers:[`Jars bought`,`Frequency`],rows:[[`1`,`6`],[`2`,``],[`3`,`2`],[`Total`,``]],blanks:[{row:1,col:1,value:`4`},{row:3,col:1,value:`12`}]},hints:[`Tally the list to count how many customers bought exactly 2 jars.`,`There are 12 customers in total — use this to check your tally.`,`Add up all the frequencies you have so far, then find what is missing to reach 12.`],explanation:`2 jars were bought by 4 customers, and the total is 6 + 4 + 2 = 12 customers.`,verify:{values:[1,2,1,1,3,2,1,2,1,3,2,1],statistic:`frequency-total`}},{id:`set2-q09`,set:2,difficulty:`practice`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`Which class interval is the modal group?`,context:`A cycling club recorded the distance ridden, in kilometres, by each of its 15 members last weekend, grouped into class intervals.`,table:{headers:[`Distance (km)`,`Frequency`],rows:[[`0 up to 5`,`3`],[`5 up to 10`,`6`],[`10 up to 15`,`4`],[`15 up to 20`,`2`]]},options:[`0 up to 5`,`5 up to 10`,`10 up to 15`,`15 up to 20`],answer:`5 up to 10`,hints:[`The modal group is the class interval with the highest frequency.`,`Compare the four frequencies: 3, 6, 4, and 2.`,`Find which frequency is the largest, then read off its interval.`],explanation:`The interval "5 up to 10" has the highest frequency (6 members), so it is the modal group.`,verify:{frequencyRows:[{value:2.5,frequency:3},{value:7.5,frequency:6},{value:12.5,frequency:4},{value:17.5,frequency:2}],statistic:`modal-group`}},{id:`set2-q10`,set:2,difficulty:`practice`,skill:`frequency-tables`,type:`complete-table`,prompt:`Complete the frequency table for the data above.`,context:`A book club recorded how many books each of its 14 members read last month: 1, 2, 1, 3, 2, 1, 2, 4, 1, 2, 3, 1, 2, 1.`,completeTable:{headers:[`Books read`,`Frequency`],rows:[[`1`,`6`],[`2`,`5`],[`3`,``],[`4`,`1`],[`Total`,``]],blanks:[{row:2,col:1,value:`2`},{row:4,col:1,value:`14`}]},hints:[`Tally how many members read exactly 3 books.`,`Check your tally: the frequencies already given are 6, 5, and 1.`,`Add every frequency together to find the Total.`],explanation:`3 books were read by 2 members, and the total is 6 + 5 + 2 + 1 = 14 members.`,verify:{values:[1,2,1,3,2,1,2,4,1,2,3,1,2,1],statistic:`frequency-total`}},{id:`set2-q11`,set:2,difficulty:`practice`,skill:`averages`,type:`numerical`,prompt:`Calculate the mean number of push-ups. Give your answer to 2 decimal places.`,context:`A fitness club member recorded how many push-ups they did each day for 12 days: 15, 18, 20, 15, 22, 18, 19, 15, 20, 18, 21, 19.`,numericAnswer:18.33,numericTolerance:.05,numericUnit:`push-ups`,hints:[`Add all 12 daily totals together first.`,`Divide the total by 12, the number of days.`,`Your answer will not be a whole number — round it to 2 decimal places.`],explanation:`The 12 values add up to 220, and 220 ÷ 12 = 18.33 (to 2 decimal places).`,verify:{values:[15,18,20,15,22,18,19,15,20,18,21,19],statistic:`mean`}},{id:`set2-q12`,set:2,difficulty:`practice`,skill:`averages`,type:`numerical`,prompt:`Find the median number of minutes spent on homework.`,context:`A teacher recorded how many minutes each of 10 students spent on homework: 40, 35, 50, 45, 60, 55, 40, 45, 50, 45.`,numericAnswer:45,numericTolerance:.01,numericUnit:`minutes`,hints:[`Sort all 10 values from smallest to largest before doing anything else.`,`With an even number of values, the median is the mean of the two middle values.`,`Find the 5th and 6th values in your sorted list, then average them.`],explanation:`Sorted, the values are 35, 40, 40, 45, 45, 45, 50, 50, 55, 60. The 5th and 6th values are both 45, so the median is 45 minutes.`,verify:{values:[40,35,50,45,60,55,40,45,50,45],statistic:`median`}},{id:`set2-q13`,set:2,difficulty:`practice`,skill:`averages`,type:`numerical`,prompt:`Find the mode of the number of emails received.`,context:`A small business recorded how many emails it received each day over 9 days: 12, 15, 12, 14, 12, 16, 15, 12, 14.`,numericAnswer:12,numericTolerance:.01,numericUnit:`emails`,hints:[`The mode is whichever value occurs most frequently in the list.`,`Count how many times 12, 14, 15, and 16 each appear.`,`One value appears 4 times — more than any other.`],explanation:`The value 12 appears 4 times, more than 14 or 15 (twice each) or 16 (once), so the mode is 12 emails.`,verify:{values:[12,15,12,14,12,16,15,12,14],statistic:`mode`}},{id:`set2-q14`,set:2,difficulty:`practice`,skill:`averages`,type:`numerical`,prompt:`Calculate the mean number of correct answers per player, using the frequency table above. Give your answer to 2 decimal places.`,context:`A trivia league recorded how many correct answers each of 20 players gave in the final round.`,table:{headers:[`Correct answers`,`Frequency`],rows:[[`3`,`4`],[`4`,`6`],[`5`,`7`],[`6`,`3`]]},numericAnswer:4.45,numericTolerance:.01,hints:[`For a weighted mean, multiply each value by its frequency before adding.`,`Add up all of the value × frequency results, then divide — but by what?`,`Divide by the total number of players (the sum of the frequencies), not by the number of rows.`],explanation:`The weighted total is (3×4) + (4×6) + (5×7) + (6×3) = 12 + 24 + 35 + 18 = 89. Dividing by the total number of players, 20, gives 89 ÷ 20 = 4.45.`,verify:{frequencyRows:[{value:3,frequency:4},{value:4,frequency:6},{value:5,frequency:7},{value:6,frequency:3}],statistic:`mean`}},{id:`set2-q15`,set:2,difficulty:`practice`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`How many customers are represented in this table in total?`,context:`A shop recorded the number of loyalty stamps collected by each customer in a frequency table.`,table:{headers:[`Stamps collected`,`Frequency`],rows:[[`1`,`5`],[`2`,`8`],[`3`,`4`],[`4`,`3`]]},options:[`20 — the sum of all the frequencies`,`4 — the number of rows in the table`,`3 — the highest number of stamps`,`8 — the highest frequency shown`],answer:`20 — the sum of all the frequencies`,hints:[`The total number of customers is not the same as the number of rows in the table.`,`Each row tells you how many customers had that particular number of stamps — you need every customer, not just one row.`,`Add every frequency in the table together: 5 + 8 + 4 + 3.`],explanation:`The total number of customers is the sum of every frequency: 5 + 8 + 4 + 3 = 20. The number of rows (4) or the highest frequency (8) alone does not tell you the total.`,verify:{frequencyRows:[{value:1,frequency:5},{value:2,frequency:8},{value:3,frequency:4},{value:4,frequency:3}],statistic:`frequency-total`}},{id:`set2-q16`,set:2,difficulty:`practice`,skill:`frequency-tables`,type:`select-all`,prompt:`Select all that apply. Which of these statements about the table above are true?`,context:`A bakery recorded the number of cupcakes sold in each hour of a day's trading, grouped into class intervals.`,table:{headers:[`Cupcakes sold`,`Hours (frequency)`],rows:[[`0 up to 10`,`2`],[`10 up to 20`,`5`],[`20 up to 30`,`9`],[`30 up to 40`,`4`]]},options:[`The modal class is '20 up to 30', because it has the highest frequency`,`Exactly 9 hours had precisely 20 cupcakes sold`,`The total number of hours recorded is 20`,`We can find the exact mean number of cupcakes sold per hour without any estimation`,`More hours had between 20 and 30 cupcakes sold than any other interval`],answer:[`The modal class is '20 up to 30', because it has the highest frequency`,`The total number of hours recorded is 20`,`More hours had between 20 and 30 cupcakes sold than any other interval`],hints:[`Add up the frequencies to check the total number of hours recorded.`,`Remember that a class interval like "20 up to 30" is a range, not one exact value.`,`With grouped data, you only know the interval each value falls in, so any mean you calculate is an estimate.`],explanation:`The frequencies sum to 2 + 5 + 9 + 4 = 20 hours, and "20 up to 30" has the highest frequency (9), so it is the modal class. You cannot say exactly 9 hours had precisely 20 cupcakes sold, because the interval covers a range of values, and grouped data only allows an estimated mean, not an exact one.`},{id:`set2-q17`,set:2,difficulty:`challenge`,skill:`averages`,type:`numerical`,prompt:`Calculate the mean number of flashcards reviewed. Give your answer to 1 decimal place.`,context:`A study group recorded how many flashcards each of its 14 members reviewed in one evening: 22, 19, 25, 21, 23, 20, 18, 24, 22, 19, 21, 23, 20, 25.`,numericAnswer:21.6,numericTolerance:.05,numericUnit:`flashcards`,hints:[`Add up all 14 values carefully — it helps to add them a few at a time.`,`Divide your total by 14.`,`Round your answer to 1 decimal place, as the prompt asks.`],explanation:`The 14 values add up to 302, and 302 ÷ 14 = 21.5714..., which rounds to 21.6 (1 decimal place).`,verify:{values:[22,19,25,21,23,20,18,24,22,19,21,23,20,25],statistic:`mean`}},{id:`set2-q18`,set:2,difficulty:`challenge`,skill:`averages`,type:`numerical`,prompt:`Find the median time taken to complete the training set.`,context:`A swimming coach recorded how many minutes each of 13 swimmers took to complete a training set: 34, 29, 41, 36, 38, 30, 45, 33, 37, 39, 31, 40, 35.`,numericAnswer:36,numericTolerance:.01,numericUnit:`minutes`,hints:[`Sort all 13 values from smallest to largest.`,`With an odd number of values, the median is a single middle value, not an average of two.`,`With 13 values, the middle one is the 7th value in your sorted list.`],explanation:`Sorted, the times are 29, 30, 31, 33, 34, 35, 36, 37, 38, 39, 40, 41, 45. The 7th value is 36, so the median is 36 minutes.`,verify:{values:[34,29,41,36,38,30,45,33,37,39,31,40,35],statistic:`median`}},{id:`set2-q19`,set:2,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A shop manager wants to know the 'typical' number of items in a customer's basket. He picks the value with the highest frequency in the table above and calls it 'the average'. Evaluate his method.`,context:`The table below shows the number of items bought by each of 25 customers.`,table:{headers:[`Items bought`,`Frequency`],rows:[[`1`,`3`],[`2`,`5`],[`3`,`10`],[`4`,`4`],[`5`,`3`]]},options:[`The manager found the mode, not the mean — to find the mean, you must multiply each value by its frequency, add the results, then divide by the total number of customers`,`The manager is correct — the highest frequency is always the same as the mean`,`The manager should have just divided the highest frequency by the number of rows`,`The manager is correct, because most customers had that number of items`],answer:`The manager found the mode, not the mean — to find the mean, you must multiply each value by its frequency, add the results, then divide by the total number of customers`,hints:[`The value with the highest frequency has a specific name — it is not automatically the mean.`,`To find the mean from a frequency table, every value must be multiplied by its own frequency first.`,`Try calculating (1×3) + (2×5) + (3×10) + (4×4) + (5×3), then divide by 25, and compare it to the manager's answer.`],explanation:`The manager actually found the mode (3 items, the highest frequency), not the mean. The true mean is (1×3 + 2×5 + 3×10 + 4×4 + 5×3) ÷ 25 = 74 ÷ 25 = 2.96 items, which is different from the mode.`},{id:`set2-q20`,set:2,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A trainer claims the modal group is '30 up to 45' because it has an odd number of members. Evaluate this claim.`,context:`A gym recorded how long, in minutes, each of 30 members spent on the treadmill, grouped into class intervals: 0 up to 15 (6 members), 15 up to 30 (11 members), 30 up to 45 (9 members), 45 up to 60 (4 members).`,options:[`Not correct — the modal group is the one with the highest frequency, which is '15 up to 30' with 11 members, not '30 up to 45'`,`Correct — an odd frequency always marks the modal group`,`Not correct — the modal group is '0 up to 15' because it is listed first`,`Correct — '30 up to 45' has more members than '0 up to 15', so it must be the modal group`],answer:`Not correct — the modal group is the one with the highest frequency, which is '15 up to 30' with 11 members, not '30 up to 45'`,hints:[`The modal group is defined only by frequency, not by whether the frequency is odd or even.`,`Compare all four frequencies: 6, 11, 9, and 4.`,`Find the single largest frequency among those four numbers.`],explanation:`The modal group is whichever interval has the highest frequency. Here, '15 up to 30' has 11 members, which is higher than '30 up to 45' (9 members), so '15 up to 30' is the true modal group. Whether a frequency is odd or even has nothing to do with it.`}],ua=[{id:`set3-q01`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A skate park survey asks: 'Don't you agree that the new ramps are amazing?' What is wrong with this question?`,options:[`It is a leading question that pushes people toward a positive answer`,`It has overlapping answer categories`,`It does not give a time period`,`It asks something too personal`],answer:`It is a leading question that pushes people toward a positive answer`,hints:[`Read the question as if you were a skater who did not like the new ramps — would you feel comfortable disagreeing?`,`Notice the phrase "Don't you agree" at the start of the question.`,`A question that hints at the "correct" answer before the respondent even thinks about it is a specific type of flawed question.`],explanation:`Starting with "Don't you agree" pushes respondents toward saying yes, so this is a leading question, not a fair, neutral one.`},{id:`set3-q02`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A gaming club survey asks: 'Do you play games often?' What is wrong with this question?`,options:[`'Often' is not defined, so people will interpret it differently`,`It is asking for personal financial information`,`The answer categories overlap`,`It only allows one answer`],answer:`'Often' is not defined, so people will interpret it differently`,hints:[`Imagine two people are asked this question: one plays games once a week, the other every day.`,`Would both of those people agree on what "often" means?`,`A word without a clear, shared meaning makes answers hard to compare.`],explanation:`The word "often" means different things to different people, so answers cannot be compared fairly — the question is too vague, or ambiguous.`},{id:`set3-q03`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A cinema survey asks: 'Which snack did you buy? Popcorn / Nachos' with no other options given. What is the problem with this question?`,options:[`The list of answers is not complete, so some customers cannot give an honest answer`,`The question is too personal`,`The question has overlapping categories`,`The question does not give a time frame`],answer:`The list of answers is not complete, so some customers cannot give an honest answer`,hints:[`Think about a customer who bought a hot dog, or bought nothing at all.`,`Can that customer choose an answer that is actually true for them?`,`A good list of options should cover every possible answer, often including "Other" or "None".`],explanation:`A customer who bought a hot dog, or no snack at all, has no honest option to choose, because the list is missing choices like "Other" or "None".`},{id:`set3-q04`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A survey about age asks: 'How old are you? 10–15 / 15–20 / 20–25.' What is the problem with these categories?`,options:[`The categories overlap, so someone aged 15 or 20 could tick two different boxes`,`The categories are missing a time period`,`The question is a leading question`,`The categories are too personal`],answer:`The categories overlap, so someone aged 15 or 20 could tick two different boxes`,hints:[`Pick a specific age, like 15, and see which box it fits into.`,`Notice that 15 appears at the end of one range and the start of the next.`,`Good categories should never share a boundary number like this.`],explanation:`Someone who is exactly 15 fits into both "10–15" and "15–20", so the categories overlap and are not clear.`},{id:`set3-q05`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A survey asks: 'How many times have you visited the school library?' What is missing from this question?`,options:[`A time period — it does not say over what period of time`,`A rating scale`,`A definition of "library"`,`A list of possible snacks`],answer:`A time period — it does not say over what period of time`,hints:[`Think about whether this question means "ever", "this week", or "this year".`,`Two students could both answer honestly but mean completely different things.`,`A good frequency question should state a clear period, like "in the last month".`],explanation:`Without a stated time period, one student might count every visit ever made while another only counts this week, making the answers impossible to compare fairly.`},{id:`set3-q06`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A survey for a running club asks: 'What is your exact home address?' when the goal is only to find out how members travel to training. What is the problem?`,options:[`It asks for personal information that is not needed to answer the research question`,`It does not give a time period`,`It has overlapping categories`,`It is a leading question`],answer:`It asks for personal information that is not needed to answer the research question`,hints:[`Think about what the club actually needs to find out: how members travel to training.`,`Does a full home address help answer that question, or go further than needed?`,`Asking for more personal detail than a question requires is a specific kind of flaw.`],explanation:`The club only needs to know how members travel, so asking for an exact home address is unnecessarily personal and not required to answer the research question.`},{id:`set3-q07`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`select-all`,prompt:`Select all that apply. Which of these questions have a problem?`,options:[`Do you agree that our new app is the best on the market?`,`How many hours did you spend on the app last week?`,`How often do you use the app: never / sometimes / often?`,`What is your favourite feature of the app?`,`Which age group are you in: 13–18 / 18–23 / 23–28?`],answer:[`Do you agree that our new app is the best on the market?`,`How often do you use the app: never / sometimes / often?`,`Which age group are you in: 13–18 / 18–23 / 23–28?`],hints:[`Look for a question that pushes people toward a particular answer.`,`Look for a question with undefined words like "sometimes" or "often".`,`Look for an age question where the same age could fit into two boxes.`],explanation:`"Do you agree..." is leading, "never / sometimes / often" is undefined and ambiguous, and the age ranges overlap at 18 and 23. The other two questions are clear and well written.`},{id:`set3-q08`,set:3,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A café wants to find out how satisfied customers are with the service using a rating scale. Which design is best?`,options:[`A 1–5 scale from 'Very unsatisfied' to 'Very satisfied', with every point labelled`,`A scale from 1–5 with no labels at all`,`A yes/no question only`,`An open box where anyone can write anything`],answer:`A 1–5 scale from 'Very unsatisfied' to 'Very satisfied', with every point labelled`,hints:[`A good rating scale should be easy for everyone to interpret in the same way.`,`Compare a scale where every number is labelled to one where the numbers have no meaning attached.`,`A rating scale should also capture more detail than a simple yes/no answer.`],explanation:`A 1–5 scale with every point clearly labelled gives useful, comparable detail, and everyone understands the numbers the same way. An unlabelled scale or a plain yes/no question loses that detail.`},{id:`set3-q09`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A youth theatre group wants to know how many rehearsals members attended last term. Their first draft was: 'Do you go to rehearsals a lot?' Which rewritten question is best?`,options:[`In the last term (12 weeks), how many rehearsals did you attend? 0-3 / 4-7 / 8-12`,`Don't you think you should attend more rehearsals?`,`How many rehearsals did you attend: 0-4 / 4-8 / 8-12`,`Do you attend rehearsals?`],answer:`In the last term (12 weeks), how many rehearsals did you attend? 0-3 / 4-7 / 8-12`,hints:[`Look for the option with a clear, stated time period.`,`Check each set of categories for any shared boundary numbers.`,`Rule out any option that pushes the respondent toward a particular opinion.`],explanation:`The first option states a clear time period (last term, 12 weeks) and uses non-overlapping categories. The others are leading, have overlapping ranges (4 appears twice), or are too vague to collect useful data.`},{id:`set3-q10`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A bookshop's original question was: 'How much do you read?' Which rewritten version collects the clearest data?`,options:[`In the last month, how many books did you finish reading? 0 / 1-2 / 3-4 / 5 or more`,`Do you read loads of books?`,`How many books did you read: 0-2 / 2-4 / 4-6`,`Isn't reading every day important?`],answer:`In the last month, how many books did you finish reading? 0 / 1-2 / 3-4 / 5 or more`,hints:[`Look for a question with a stated time period and non-overlapping number ranges.`,`Rule out any option that uses vague words instead of a real question.`,`Rule out any option that seems to push respondents toward one particular opinion.`],explanation:`The first option gives a clear time frame (last month) and clean, non-overlapping categories. The others are vague, have overlapping ranges (2 and 4 each appear twice), or are leading rather than neutral.`},{id:`set3-q11`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`The canteen's original question was: 'Don't you think the canteen menu is great?' Choose the best rewritten version.`,options:[`How would you rate the canteen menu? Poor / Okay / Good / Excellent`,`Don't you agree the menu should stay the same?`,`Do you like the canteen menu, yes or no, even though most students do?`,`The canteen menu is great, isn't it?`],answer:`How would you rate the canteen menu? Poor / Okay / Good / Excellent`,hints:[`Rule out any option that starts by assuming the respondent already agrees with something.`,`Rule out any option that mentions what "most students" think, since this could influence the answer.`,`Look for the neutral option that offers a fair range of labelled choices.`],explanation:`A labelled rating scale (Poor to Excellent) lets students give an honest, neutral opinion. The other options are all leading, either by assuming agreement or by mentioning what other people think.`},{id:`set3-q12`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`select-all`,prompt:`A gym is designing a satisfaction scale for its new class. Select all that apply. Which of these are good practices for a rating scale?`,options:[`Label every point on the scale so respondents know exactly what each number means`,`Make sure the scale runs in a logical order, from most negative to most positive`,`Use vague labels like 'good' and 'bad' at only the two ends, leaving the middle numbers unlabelled`,`Keep the scale short and consistent, such as always using 1-5 across the whole survey`,`Ask a leading question just before the scale to guide people toward a high rating`],answer:[`Label every point on the scale so respondents know exactly what each number means`,`Make sure the scale runs in a logical order, from most negative to most positive`,`Keep the scale short and consistent, such as always using 1-5 across the whole survey`],hints:[`Good practice means every part of the scale is clear and every point has meaning.`,`Watch out for an option that leaves some numbers on the scale without any labels.`,`Watch out for an option that tries to influence the answer before the respondent even sees the scale.`],explanation:`Labelling every point, keeping a logical order, and staying consistent are all good practices. Leaving middle numbers unlabelled makes the scale unclear, and adding a leading question beforehand biases the results.`},{id:`set3-q13`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A pet shop asked 10 customers who visited on a Monday morning: 'What is the best pet food brand?' 8 out of 10 said Brand X. The shop owner claims: 'Brand X is clearly the most popular pet food among all our customers.' What is the main weakness in this claim?`,options:[`The sample is small and was only taken at one time on one day, so it may not represent all customers`,`The claim is fully justified because most people chose Brand X`,`The claim is wrong because 8 out of 10 is not a majority`,`The claim is justified because customers always tell the truth in surveys`],answer:`The sample is small and was only taken at one time on one day, so it may not represent all customers`,hints:[`Think about how many customers were actually asked, and when.`,`Consider whether Monday morning shoppers are likely to represent every kind of customer the shop has.`,`A claim about "all our customers" needs evidence from more than just one small group at one time.`],explanation:`Only 10 customers, all visiting at one specific time, were asked. This small, narrow sample cannot reliably represent the opinions of all the shop's customers, even though 8 out of 10 (a majority) preferred Brand X within that small group.`},{id:`set3-q14`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A survey asks: 'Do you find the new sports hall clean and comfortable?' What is the problem with this question?`,options:[`It asks two different things in one question, so a 'no' answer doesn't say which part is the problem`,`It is missing a time period`,`It has overlapping categories`,`It is too personal`],answer:`It asks two different things in one question, so a 'no' answer doesn't say which part is the problem`,hints:[`Count how many separate ideas are packed into this one question.`,`Imagine someone thinks the hall is clean but uncomfortable — how would they answer "no" or "yes"?`,`A question that combines two separate topics makes the results hard to interpret.`],explanation:`This question combines two separate ideas (clean and comfortable) into one. If someone answers 'no', it is impossible to tell whether they mean the hall is not clean, not comfortable, or neither.`},{id:`set3-q15`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`select-all`,prompt:`Select all that apply. Which of these are examples of well-written questionnaire questions?`,options:[`In the past week, how many times did you use the school bus? 0 / 1-2 / 3-4 / 5 or more`,`You think the bus service is good, right?`,`How old are you? Under 12 / 12-15 / 15-18 / 18 and over`,`What's your opinion on buses?`,`In the last month, how many late arrivals have you had? 0 / 1-3 / 4 or more`],answer:[`In the past week, how many times did you use the school bus? 0 / 1-2 / 3-4 / 5 or more`,`How old are you? Under 12 / 12-15 / 15-18 / 18 and over`,`In the last month, how many late arrivals have you had? 0 / 1-3 / 4 or more`],hints:[`Look for questions that state a clear time period and use non-overlapping categories.`,`Watch out for a question that assumes the respondent already agrees with something.`,`Watch out for a question so open and vague that answers cannot be compared or counted.`],explanation:`The bus-use, age, and late-arrivals questions all have clear time periods (or clean boundaries) and non-overlapping categories. 'You think the bus service is good, right?' is leading, and 'What's your opinion on buses?' is too vague to produce comparable data.`},{id:`set3-q16`,set:3,difficulty:`practice`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A researcher only needs to know how much people spend on music streaming, but drafted: 'What is your monthly income, and how much do you spend on music streaming?' Choose the best rewritten version.`,options:[`How much do you spend on music streaming each month? Under 5 / 5-10 / 10-20 / Over 20`,`What is your exact salary and bank balance?`,`Do you spend money on music, yes or no, and if yes, tell us your full financial details?`,`Isn't music streaming too expensive nowadays?`],answer:`How much do you spend on music streaming each month? Under 5 / 5-10 / 10-20 / Over 20`,hints:[`Think about exactly what information the researcher actually needs to answer their question.`,`Rule out any option that asks for more personal financial detail than necessary.`,`Rule out any option that pushes the respondent toward a particular opinion.`],explanation:`Since the researcher only needs streaming spending, the best question asks for that directly, with clear spending ranges, and drops the unnecessary and overly personal income question.`},{id:`set3-q17`,set:3,difficulty:`challenge`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A neighbourhood app asks: 'Most people love our new update, don't you?' with only 'Yes' and 'No' as answer options. What are the problems with this question?`,options:[`It is a leading question, and it does not allow for a neutral opinion`,`It is missing a time period only`,`It has overlapping categories only`,`It is too personal only`],answer:`It is a leading question, and it does not allow for a neutral opinion`,hints:[`Look for more than one flaw — this question has two separate problems.`,`First, notice how mentioning "most people" tries to influence the answer.`,`Second, check whether someone with a mixed or neutral opinion has any way to express that with only two options.`],explanation:`Mentioning that "most people love" the update is a leading statement that pressures respondents to agree, and offering only "Yes" or "No" gives no way to express a neutral or mixed opinion.`},{id:`set3-q18`,set:3,difficulty:`challenge`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A swimming club's original question was: 'Don't you think our pool is way too crowded most of the time?' with only 'Yes' and 'No' as options. Choose the best rewritten version.`,options:[`In the last month, how would you rate how crowded the pool felt during your visits? Not crowded / A little crowded / Very crowded`,`Isn't the pool crowded?`,`How crowded is the pool: Not crowded / A little crowded / A little crowded`,`Do you think the pool needs to be bigger, yes or no?`],answer:`In the last month, how would you rate how crowded the pool felt during your visits? Not crowded / A little crowded / Very crowded`,hints:[`Rule out any option that repeats a phrase like "isn't it" that suggests an answer.`,`Check the answer categories carefully for a duplicated or overlapping label.`,`Rule out any option that changes the topic away from crowding.`],explanation:`The first option removes the leading phrasing, adds a clear time period, and offers three distinct, non-overlapping categories. The other options are leading, contain a duplicated category, or ask about a different topic altogether.`},{id:`set3-q19`,set:3,difficulty:`challenge`,skill:`questionnaires`,type:`multiple-choice`,prompt:`An online form for a coding club asked only members who attended the final showcase event: 'Was this term enjoyable?' 95% said yes. The club leader claims: 'Almost everyone in the club had an enjoyable term.' What is the strongest criticism of this claim?`,options:[`Only members who attended the showcase were asked, so members who stopped coming, who might feel differently, were not included`,`95% is not a high enough number to draw any conclusion`,`The question should have used a rating scale instead of yes/no, and that is the only issue`,`The claim is completely justified because 95% is a large majority`],answer:`Only members who attended the showcase were asked, so members who stopped coming, who might feel differently, were not included`,hints:[`Think carefully about who was actually asked this question — was it every club member, or only some of them?`,`Consider why a member who had a bad experience might not show up to the final showcase at all.`,`A conclusion about the whole club needs evidence from a group that represents the whole club.`],explanation:`Only members who still attended the showcase were surveyed. Members who left the club, or stopped attending because they were unhappy, were never asked, so the 95% figure only reflects the more satisfied, still-attending members, not the whole club.`},{id:`set3-q20`,set:3,difficulty:`challenge`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A dance studio wants to find out how often students practise at home and how satisfied they are with online classes. Which single pair of questions best achieves this?`,options:[`1) In the last 7 days, how many times did you practise at home? 0 / 1-2 / 3-4 / 5 or more. 2) How satisfied are you with the online classes? Very unsatisfied / Unsatisfied / Neutral / Satisfied / Very satisfied`,`1) Do you practise at home? 2) Are online classes good?`,`1) In the last 7 days, how many times did you practise at home? 0-2 / 2-4 / 4 or more. 2) Don't you love the online classes?`,`1) How many times do you practise? 2) Rate the classes.`],answer:`1) In the last 7 days, how many times did you practise at home? 0 / 1-2 / 3-4 / 5 or more. 2) How satisfied are you with the online classes? Very unsatisfied / Unsatisfied / Neutral / Satisfied / Very satisfied`,hints:[`This is a trick — read the answer options in the third choice very carefully for a hidden flaw.`,`Check both questions in each pair for a clear time period and non-overlapping categories.`,`Rule out any pair where one of the two questions is leading or missing a labelled scale.`],explanation:`The third option looks similar, but its practice ranges (0-2 / 2-4) overlap at 2, and its second question is leading ("Don't you love..."). The first option has a clear time period, clean non-overlapping ranges, and a fully labelled, neutral satisfaction scale, making it the best pair.`}],da=[{id:`set4-q01`,set:4,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A researcher wants to find the favourite sport of all 800 students at a school. She asks 50 students chosen at random. What is the population in this investigation?`,options:[`All 800 students at the school`,`The 50 students who were asked`,`Only the students who like football`,`The researcher herself`],answer:`All 800 students at the school`,hints:[`The population is the whole group the researcher wants to find out about.`,`The 50 students are only a small part of a much bigger group.`,`Look for the largest, complete group mentioned in the question.`],explanation:`The population is the entire group being studied — here, all 800 students. The 50 students who were actually asked form the sample, not the population.`},{id:`set4-q02`,set:4,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A phone company has 5,000 customers. To test satisfaction, it emails a survey to 200 randomly chosen customers. What is the sample?`,options:[`The 200 customers who were emailed`,`All 5,000 customers`,`The phone company staff`,`The customers who did not reply`],answer:`The 200 customers who were emailed`,hints:[`The sample is the smaller group that is actually selected to take part.`,`All 5,000 customers together form the population, not the sample.`,`Look for the specific number of customers chosen for the survey.`],explanation:`The sample is the group of 200 customers selected to be surveyed. All 5,000 customers together make up the population.`},{id:`set4-q03`,set:4,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A gym wants to know how often people exercise. It only surveys people leaving the gym at 6 a.m. What is the problem with this sample?`,options:[`It only includes people who already go to the gym early, so it is biased and not representative of everyone`,`The sample is too large`,`The sample is a population, not a sample`,`There is no problem with this method`],answer:`It only includes people who already go to the gym early, so it is biased and not representative of everyone`,hints:[`Think about who is likely to be at a gym at 6 a.m.`,`Would this group include people who never exercise, or exercise at other times?`,`A sample that only reaches one type of person is called a biased sample.`],explanation:`Only people who already exercise early are included, so the sample leaves out everyone who exercises at other times or not at all. This makes it a biased, unrepresentative sample.`},{id:`set4-q04`,set:4,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A school has 1,200 students. A researcher wants to estimate how many minutes students spend on homework. Which sample size is likely to give the most reliable estimate?`,options:[`120 students, chosen randomly from the whole school`,`5 students from one class`,`60 students, but all from the same year group`,`2 students`],answer:`120 students, chosen randomly from the whole school`,hints:[`A more reliable sample is usually both larger and drawn from across the whole population.`,`Rule out any option where the sample only comes from one small part of the school.`,`Compare the sample sizes: which one is the largest?`],explanation:`120 students, randomly chosen from across the whole school, is both a reasonably large sample and spread across every year group, making it the most likely to give a reliable estimate.`},{id:`set4-q05`,set:4,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A town council wants a sample that represents residents of all ages. Which method is most likely to give a representative sample?`,options:[`Randomly select residents from the full electoral register, covering all ages`,`Survey people at a retirement club`,`Survey students at the local secondary school`,`Survey people at a toddler playgroup`],answer:`Randomly select residents from the full electoral register, covering all ages`,hints:[`A representative sample needs to include people of every age, not just one group.`,`Rule out any location that would only reach one particular age group.`,`Look for the method that draws from the whole population of residents.`],explanation:`Selecting randomly from the full electoral register reaches residents of all ages. Surveying at a retirement club, a school, or a playgroup would each only reach one narrow age group.`},{id:`set4-q06`,set:4,difficulty:`focus`,skill:`sampling`,type:`select-all`,prompt:`Select all that apply. Which of these are examples of a biased sample?`,options:[`Surveying only people who visit a vegan café about their eating habits`,`Randomly selecting 100 names from the full school register`,`Surveying people queuing outside a football stadium about their favourite sport`,`Randomly selecting every 10th customer from a full list of all customers`,`Surveying only your own friends about a class trip`],answer:[`Surveying only people who visit a vegan café about their eating habits`,`Surveying people queuing outside a football stadium about their favourite sport`,`Surveying only your own friends about a class trip`],hints:[`A biased sample only reaches one particular type of person, not a fair mix.`,`Ask whether the people being surveyed were likely already interested in the topic before being asked.`,`Methods that use a full list and select names at random are not biased in this way.`],explanation:`Surveying vegan café visitors, football queue attendees, or only your own friends all reach a narrow, self-selected group connected to the topic. Randomly selecting from a full register or a full customer list gives everyone a fair chance of being chosen.`},{id:`set4-q07`,set:4,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A teacher puts all 30 students' names in a hat and draws 10 out without looking. What sampling method is this?`,options:[`Simple random sampling`,`Convenience sampling`,`Self-selected sampling`,`Systematic sampling`],answer:`Simple random sampling`,hints:[`Think about whether every student has an equal chance of being picked.`,`Drawing names from a hat, without looking, gives no student an advantage.`,`This method has a specific name that describes picking purely by chance.`],explanation:`Because every student has an equal chance of being drawn, and the selection is made purely by chance, this is simple random sampling.`},{id:`set4-q08`,set:4,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A quality inspector checks every 20th item that comes off a factory line. What sampling method is this?`,options:[`Systematic sampling`,`Random sampling`,`Convenience sampling`,`Voluntary response sampling`],answer:`Systematic sampling`,hints:[`Notice that items are chosen using a fixed, regular pattern (every 20th one).`,`This is different from picking completely at random, because the gap between choices is always the same.`,`A method that selects at a fixed, regular interval has a specific name.`],explanation:`Selecting every 20th item follows a fixed, regular pattern, which is the defining feature of systematic sampling.`},{id:`set4-q09`,set:4,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`Two students investigate how many books people in the town read last year. Amara asks 15 people outside one bookshop. Ben asks 150 people at random across the whole town, using the town's resident list. Whose method is likely to give more reliable results, and why?`,options:[`Ben's, because his sample is larger and drawn randomly from the whole town, not just people already at a bookshop`,`Amara's, because a bookshop is a good place to find readers`,`Both are equally reliable because they are surveys`,`Amara's, because a smaller sample is always easier to trust`],answer:`Ben's, because his sample is larger and drawn randomly from the whole town, not just people already at a bookshop`,hints:[`Compare both the size of each sample and where each person was chosen from.`,`Think about whether people outside a bookshop are likely to represent everyone in town, including non-readers.`,`A larger, randomly selected sample from the whole population usually gives more reliable results.`],explanation:`Ben's sample is larger and drawn randomly from across the whole town, so it is more likely to represent everyone. Amara's sample only reaches people already visiting a bookshop, who are likely to read more than average.`},{id:`set4-q10`,set:4,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A council wants feedback on a new park from all residents. Plan A: survey every 25th name on the full resident list. Plan B: survey people who happen to be in the park on a sunny Saturday. Which plan is more representative, and why?`,options:[`Plan A — it covers the whole resident list evenly, including people who might never visit the park, while Plan B only reaches people who already use the park`,`Plan B — because people in the park care more about the topic`,`Both plans are equally representative because both are random`,`Plan A — because it takes less time to carry out`],answer:`Plan A — it covers the whole resident list evenly, including people who might never visit the park, while Plan B only reaches people who already use the park`,hints:[`Think about who Plan B would completely miss: residents who never visit the park.`,`Plan A draws from a list of every resident, not just park users.`,`A representative sample should include people with a range of different opinions, not just current users.`],explanation:`Plan A systematically samples from the full resident list, reaching people regardless of whether they use the park. Plan B only reaches people already in the park, missing residents who might have very different opinions.`},{id:`set4-q11`,set:4,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A small company has only 18 employees. The HR manager decides to ask every single employee about their commute. Is this a sample or a population survey?`,options:[`It is a population survey (a census), because every member of the group was asked`,`It is a sample, because 18 is a small number`,`It is neither, because no data was collected`,`It is a sample, because not everyone always answers`],answer:`It is a population survey (a census), because every member of the group was asked`,hints:[`The difference between a sample and a census depends on how many people were asked, not how big the group is.`,`Check whether any employees were left out of the survey.`,`If every single member of the group is asked, this has a special name.`],explanation:`Since every one of the 18 employees was asked, this is a census (a survey of the whole population), not a sample, regardless of how small the total group is.`},{id:`set4-q12`,set:4,difficulty:`practice`,skill:`sampling`,type:`numerical`,prompt:`A market researcher surveyed 50 shoppers at a mall about their preferred shopping method. 32 shoppers said they prefer online shopping, and the rest said in-store. What proportion of the shoppers surveyed prefer online shopping? Give your answer as a decimal to 2 decimal places.`,numericAnswer:.64,numericTolerance:.01,hints:[`A proportion compares part of a group to the whole group.`,`Divide the number who prefer online shopping by the total number surveyed.`,`Work out 32 ÷ 50, then write your answer as a decimal.`],explanation:`32 out of 50 shoppers prefer online shopping, and 32 ÷ 50 = 0.64.`,verify:{frequencyRows:[{value:1,frequency:32},{value:0,frequency:18}],statistic:`mean`}},{id:`set4-q13`,set:4,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A radio station asks listeners to call in and vote for their favourite song. 300 people call in. What is the main weakness of this sample?`,options:[`It is a voluntary response sample — only people who feel strongly enough to call in are included, so it may not represent all listeners`,`300 is always too small a sample`,`Radio listeners cannot give opinions`,`The sample is a population, not a sample`],answer:`It is a voluntary response sample — only people who feel strongly enough to call in are included, so it may not represent all listeners`,hints:[`Think about who is likely to bother calling in to vote.`,`Compare people with a strong opinion (very keen or very unhappy) to people who feel neutral.`,`A sample made up only of people who chose to take part themselves has a specific name.`],explanation:`Only listeners who felt strongly enough to call in were counted. This is a voluntary response sample, and it tends to over-represent people with strong opinions rather than typical listeners.`},{id:`set4-q14`,set:4,difficulty:`practice`,skill:`sampling`,type:`select-all`,prompt:`Select all that apply. Which of these sampling methods are likely to produce a representative sample of all students in a large school?`,options:[`Randomly selecting 100 students from the full school register, across all year groups`,`Asking every student in one specific class`,`Using a random number generator to pick student ID numbers from the whole school list`,`Asking only students who join the debate club`,`Selecting every 15th name from an alphabetical list of all students`],answer:[`Randomly selecting 100 students from the full school register, across all year groups`,`Using a random number generator to pick student ID numbers from the whole school list`,`Selecting every 15th name from an alphabetical list of all students`],hints:[`A representative method should give every student in the whole school a fair chance of being chosen.`,`Rule out any method that only reaches students from one class or one club.`,`Random selection and systematic selection from a full list both give a fair spread across the school.`],explanation:`Randomly selecting from the full register, using a random number generator over the whole list, and selecting every 15th name from a full list all give students across the whole school a fair chance. Asking one class or one club only reaches a narrow group.`},{id:`set4-q15`,set:4,difficulty:`practice`,skill:`sampling`,type:`numerical`,prompt:`A survey of 80 café customers found that 17 ordered a decaf drink. What proportion of the customers surveyed ordered a decaf drink? Give your answer as a decimal to 2 decimal places.`,numericAnswer:.21,numericTolerance:.01,hints:[`A proportion is the part of the group divided by the whole group.`,`Divide the number who ordered decaf by the total number surveyed.`,`Work out 17 ÷ 80, then round your decimal answer to 2 decimal places.`],explanation:`17 out of 80 customers ordered decaf, and 17 ÷ 80 = 0.2125, which rounds to 0.21 (2 decimal places).`,verify:{frequencyRows:[{value:1,frequency:17},{value:0,frequency:63}],statistic:`mean`}},{id:`set4-q16`,set:4,difficulty:`practice`,skill:`sampling`,type:`multiple-choice`,prompt:`A quality control team wants to check the strength of matches in a box, but testing a match involves burning it, which destroys it. Should they test every match (a census) or a sample?`,options:[`A sample — testing every match would destroy the whole batch, so a sample is more practical`,`A census — because testing is quick and free`,`A census — because you must test every single item to get any data at all`,`A sample — because samples always give more accurate results than a census`],answer:`A sample — testing every match would destroy the whole batch, so a sample is more practical`,hints:[`Think about what would happen to the whole batch of matches if every single one were tested.`,`Testing this way destroys each match, so testing everything would leave nothing left to sell.`,`When testing destroys the item, a sample is usually the only practical choice.`],explanation:`Since testing a match destroys it, testing every match (a census) would destroy the entire batch. A sample lets the team estimate the strength of the matches without destroying all of them.`},{id:`set4-q17`,set:4,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A theme park surveys 500 visitors who bought a premium fast-pass ticket, out of 10,000 total visitors that day. The manager claims: 'With 500 responses, this is a large and reliable sample.' What is the strongest criticism of this claim?`,options:[`The sample size is reasonably large, but it only includes fast-pass ticket holders, who may have a different experience from other visitors, so it is still biased`,`500 is too small a number to ever be useful`,`The claim is fully correct because 500 is more than most surveys use`,`The sample is a census because it includes hundreds of people`],answer:`The sample size is reasonably large, but it only includes fast-pass ticket holders, who may have a different experience from other visitors, so it is still biased`,hints:[`A large sample size does not automatically make a sample representative.`,`Think about how a fast-pass ticket might change a visitor's experience of queues and waiting times.`,`Check whether every type of visitor, not just fast-pass holders, had a chance of being included.`],explanation:`Even though 500 is a fairly large number, the sample only includes premium fast-pass holders, who likely have shorter queue times and a different experience than regular visitors. Size alone does not fix this bias.`},{id:`set4-q18`,set:4,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A city wants to estimate average commute time for its 40,000 workers. Plan A surveys 40 workers from one office building downtown. Plan B surveys 400 workers randomly selected from payroll records across the whole city. Which plan is better, and why?`,options:[`Plan B — a bigger, randomly selected sample drawn from across the whole city is more likely to represent all workers than a small sample from one location`,`Plan A — because a smaller sample is quicker to analyse and is just as accurate`,`Both plans are equally good because both involve surveys`,`Plan A — because everyone downtown commutes the same way`],answer:`Plan B — a bigger, randomly selected sample drawn from across the whole city is more likely to represent all workers than a small sample from one location`,hints:[`Compare both the size of each sample and how spread out each one is across the city.`,`Think about whether workers at one downtown office are likely to have similar commutes to workers everywhere else in the city.`,`A random sample drawn from the whole population is generally more reliable than a small sample from a single location.`],explanation:`Plan B uses a bigger sample, randomly selected from across the whole city, so it is far more likely to reflect the range of commutes for all 40,000 workers. Plan A only reflects one office location, which may not be typical.`},{id:`set4-q19`,set:4,difficulty:`challenge`,skill:`sampling`,type:`numerical`,prompt:`A random sample of 60 members of a hiking club were asked whether they had hiked in the last month. 45 said yes. What proportion of the sample had hiked in the last month? Give your answer as a decimal to 2 decimal places.`,numericAnswer:.75,numericTolerance:.01,hints:[`A proportion is the part of the sample divided by the whole sample.`,`Divide the number who had hiked by the total number in the sample.`,`Work out 45 ÷ 60, then write your answer as a decimal to 2 decimal places.`],explanation:`45 out of 60 members had hiked in the last month, and 45 ÷ 60 = 0.75.`,verify:{frequencyRows:[{value:1,frequency:45},{value:0,frequency:15}],statistic:`mean`}},{id:`set4-q20`,set:4,difficulty:`challenge`,skill:`reasoning`,type:`multiple-choice`,prompt:`A researcher wants to estimate the average weight of apples in a 2,000-apple harvest. Plan A weighs 8 apples taken from the top of one crate. Plan B weighs 80 apples taken randomly from crates all across the harvest. Which plan will most likely give a more reliable estimate, and why?`,options:[`Plan B — a bigger, randomly spread-out sample is more likely to reflect the variety of apples in the whole harvest`,`Plan A — because 8 apples is a manageable number to carry`,`Both plans are equally reliable since apples do not vary much`,`Plan A — because apples from one crate are always identical`],answer:`Plan B — a bigger, randomly spread-out sample is more likely to reflect the variety of apples in the whole harvest`,hints:[`Think about whether apples from just the top of one crate are likely to be typical of the whole 2,000-apple harvest.`,`A sample spread across many different crates is more likely to capture natural variation in apple size and weight.`,`Compare both the sample size and how widely each sample is spread across the harvest.`],explanation:`Plan B uses a bigger sample spread randomly across the whole harvest, so it is more likely to capture the natural variety in apple weight. Plan A only samples from the top of one crate, which may not be typical of the whole harvest.`}],fa=`A skate park manager wants to understand who uses the park and how satisfied they are. She designs a form that asks visitors to describe how often they visit as 'a lot' or 'a little', and hands it to 40 visitors on one busy Saturday afternoon. Only 12 forms also included an exact number of visits, written in the margin: 3, 5, 2, 4, 3, 6, 3, 4, 5, 3, 2, 4.`,pa=`A school recycling club wants to find out how many items each of 15 classmates recycled in one week. They collect this data: 4, 6, 5, 4, 7, 5, 4, 6, 5, 8, 4, 6, 5, 4, 7.`,ma=`A bus company wants to check if its 7:45 a.m. route is on time. An inspector rides the bus every day for one week and records the number of minutes it arrived late (0 means on time): 0, 2, 0, 5, 1, 0, 3.`,ha=`A chess club wants to know how long members spend practising at home each week. They first ask: 'Do you practise a lot?' Later, they switch to asking for exact hours and collect this data from 14 members: 3, 5, 2, 4, 6, 3, 4, 5, 2, 3, 4, 6, 3, 5.`,ga=[{id:`set5-q01`,set:5,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,context:fa,prompt:`What is the main weakness of the manager's sampling method?`,options:[`She only surveyed visitors on one busy Saturday afternoon, so the sample may not represent visitors on quieter days or weekdays`,`40 visitors is too small a number for any survey`,`She should have surveyed staff instead of visitors`,`There is no weakness — one afternoon is always enough`],answer:`She only surveyed visitors on one busy Saturday afternoon, so the sample may not represent visitors on quieter days or weekdays`,hints:[`Think about when the survey took place, not just how many people answered.`,`Consider whether a busy Saturday attracts the same kind of visitor as a quiet Tuesday.`,`A sample taken at only one time can miss out on other types of visitors.`],explanation:`Surveying only on one busy Saturday afternoon may miss visitors who come at quieter times, such as weekday evenings, so the sample may not represent everyone who uses the park.`},{id:`set5-q02`,set:5,difficulty:`focus`,skill:`data-types`,type:`multiple-choice`,context:fa,prompt:`The form asks visitors to describe their visit frequency as 'a lot' or 'a little' instead of writing an exact number. What type of data does this produce, and what is the problem with it?`,options:[`Categorical data — 'a lot' and 'a little' are vague labels, not exact counts, so results are hard to compare precisely`,`Discrete data — because 'a lot' and 'a little' can be counted`,`Continuous data — because visiting can happen at any time`,`There is no problem — categories are always as useful as exact numbers`],answer:`Categorical data — 'a lot' and 'a little' are vague labels, not exact counts, so results are hard to compare precisely`,hints:[`Decide whether the answers "a lot" and "a little" are numbers or named labels.`,`Data made of labels rather than numbers has a specific name.`,`Think about whether two visitors would agree on what "a lot" means.`],explanation:`'A lot' and 'a little' are labels, not numbers, so this is categorical data. Because the labels are vague, results are much harder to compare precisely than exact counts would be.`},{id:`set5-q03`,set:5,difficulty:`focus`,skill:`frequency-tables`,type:`complete-table`,context:pa,prompt:`Complete the frequency table for the data above.`,completeTable:{headers:[`Items recycled`,`Frequency`],rows:[[`4`,`5`],[`5`,``],[`6`,`3`],[`7`,`2`],[`8`,`1`],[`Total`,``]],blanks:[{row:1,col:1,value:`4`},{row:5,col:1,value:`15`}]},hints:[`Tally how many classmates recycled exactly 5 items.`,`The frequencies for 4, 6, 7, and 8 items are already given — use these to check your tally.`,`Add up every frequency in the table to find the Total.`],explanation:`5 items were recycled by 4 classmates, and the total is 5 + 4 + 3 + 2 + 1 = 15 classmates.`,verify:{values:[4,6,5,4,7,5,4,6,5,8,4,6,5,4,7],statistic:`frequency-total`}},{id:`set5-q04`,set:5,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,context:ha,prompt:`What is wrong with the club's original question, 'Do you practise a lot?'`,options:[`'A lot' is not defined, so members will interpret it differently, and there are no exact numbers to compare`,`It is a leading question`,`It has overlapping answer categories`,`It does not ask about chess at all`],answer:`'A lot' is not defined, so members will interpret it differently, and there are no exact numbers to compare`,hints:[`Imagine two members are asked this question: one practises 1 hour a week, the other 6 hours.`,`Would both members agree on whether 1 hour counts as "a lot"?`,`A question without a clear, shared meaning for its key word is called ambiguous.`],explanation:`'A lot' means different things to different people, so the answers cannot be compared fairly. This is why the club later switched to asking for exact hours.`},{id:`set5-q05`,set:5,difficulty:`focus`,skill:`data-types`,type:`classify`,prompt:`A board game café is sorting the information it collects. Sort each variable into the correct data type.`,classify:{categories:[`Categorical`,`Discrete`,`Continuous`],items:[{label:`The type of board game played`,category:`Categorical`},{label:`The number of players at a table`,category:`Discrete`},{label:`The length of a game session, in minutes`,category:`Continuous`},{label:`The table number a group is seated at`,category:`Categorical`},{label:`The number of games owned by the café`,category:`Discrete`}]},hints:[`For each item, first decide if the answer is a name/label or a number.`,`Watch out — a table number identifies a table; it is not used to count or measure anything.`,`Numbers you count one at a time are discrete; numbers you measure are continuous.`],explanation:`Game type and table number are both labels (a table number identifies a table rather than counting or measuring anything), so both are categorical. Number of players and number of games owned are counted (discrete), while session length is measured (continuous).`},{id:`set5-q06`,set:5,difficulty:`focus`,skill:`frequency-tables`,type:`multiple-choice`,prompt:`How many orders are represented in the table in total?`,context:`A bakery recorded which item each customer ordered one morning.`,table:{headers:[`Item`,`Frequency`],rows:[[`Croissant`,`6`],[`Muffin`,`9`],[`Bagel`,`5`]]},options:[`20`,`9`,`3`,`6`],answer:`20`,hints:[`The total is not shown directly — you must work it out from the table.`,`Add together every frequency in the Frequency column.`,`6 + 9 + 5 = ?`],explanation:`Adding all the frequencies gives 6 + 9 + 5 = 20 orders in total.`,verify:{frequencyRows:[{value:1,frequency:6},{value:2,frequency:9},{value:3,frequency:5}],statistic:`frequency-total`}},{id:`set5-q07`,set:5,difficulty:`focus`,skill:`sampling`,type:`multiple-choice`,prompt:`A gym has 900 members. To check satisfaction, staff survey 30 members chosen at random. What is the sample in this investigation?`,options:[`The 30 members chosen at random`,`All 900 members`,`The gym staff`,`The members who did not respond`],answer:`The 30 members chosen at random`,hints:[`The sample is the smaller group that is actually asked to take part.`,`All 900 members together make up the population, not the sample.`,`Look for the specific number of members selected for the survey.`],explanation:`The sample is the group of 30 members chosen to take part. All 900 members together make up the population.`},{id:`set5-q08`,set:5,difficulty:`focus`,skill:`questionnaires`,type:`multiple-choice`,prompt:`A cinema loyalty app asks: 'Don't you love our rewards program?' What is wrong with this question?`,options:[`It is a leading question that pushes people toward a positive answer`,`It has overlapping categories`,`It does not give a time period`,`It is too personal`],answer:`It is a leading question that pushes people toward a positive answer`,hints:[`Read the question as if you disliked the rewards program — would you feel comfortable disagreeing?`,`Notice the phrase "Don't you love" at the start of the question.`,`A question that hints at the expected answer before the respondent thinks about it is a specific type of flaw.`],explanation:`Starting with "Don't you love" pushes respondents toward a positive answer, so this is a leading question rather than a fai

able outcomes has the right count before writing the chance.`,marks:5},{id:`mock-04-q19`,testId:4,number:19,topic:`Challenge Problems`,subtopic:`Permutations (arranging letters)`,difficulty:`Challenging`,question:`How many different ways can the letters in DOG be arranged?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`DOG has 3 different letters, all different from each other.`,`The number of arrangements is 3 x 2 x 1 = 6.`],commonMistake:`Choosing A) 3 by counting the number of letters in DOG instead of calculating the number of ways to arrange them (3! = 6).`,quickTip:`For a word with all different letters, multiply the number of letters down to 1 (like 3 x 2 x 1).`,marks:5},{id:`mock-04-q20`,testId:4,number:20,topic:`Challenge Problems`,subtopic:`Permutations with repeated letters`,difficulty:`Challenging`,question:`How many different ways can the letters in MOON be arranged if the two O's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`12`},{id:`C`,text:`18`},{id:`D`,text:`24`}],correctAnswer:`B`,explanationSteps:[`If all 4 letters were different, there would be 4 x 3 x 2 x 1 = 24 arrangements.`,`Since the two O's are the same, swapping them doesn't make a new arrangement, so divide by 2: 24 / 2 = 12.`],commonMistake:`Choosing D) 24 by using 4! = 24 and forgetting to divide by 2 for the repeated letter O.`,quickTip:`When a word has repeated letters, divide the total arrangements by the number of ways the repeated letters can swap.`,marks:5},{id:`mock-04-q21`,testId:4,number:21,topic:`Challenge Problems`,subtopic:`Permutations with repeated letters`,difficulty:`Challenging`,question:`How many different ways can the letters in BALL be arranged if the two L's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`12`},{id:`C`,text:`18`},{id:`D`,text:`24`}],correctAnswer:`B`,explanationSteps:[`If all 4 letters were different, there would be 4 x 3 x 2 x 1 = 24 arrangements.`,`Since the two L's are the same, divide by 2 to remove the repeats: 24 / 2 = 12.`],commonMistake:`Choosing D) 24 by forgetting to divide by 2 for the repeated letter L.`,quickTip:`Always check a word for repeated letters before finishing a permutation problem.`,marks:5},{id:`mock-04-q22`,testId:4,number:22,topic:`Challenge Problems`,subtopic:`Combinations (choosing groups)`,difficulty:`Challenging`,question:`You have 4 flavors of ice cream: chocolate, vanilla, strawberry, and mango. How many different ways can you choose 2 flavors?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`8`}],correctAnswer:`C`,explanationSteps:[`List every pair without repeating: chocolate-vanilla, chocolate-strawberry, chocolate-mango, vanilla-strawberry, vanilla-mango, strawberry-mango.`,`That gives 6 different pairs of flavors.`],commonMistake:`Choosing D) 8 by counting ordered pairs (treating chocolate-vanilla and vanilla-chocolate as different) instead of counting each pair only once.`,quickTip:`When choosing a group, the order doesn't matter - apple and orange is the same pair as orange and apple.`,marks:5},{id:`mock-04-q23`,testId:4,number:23,topic:`Challenge Problems`,subtopic:`Combinations (choosing groups)`,difficulty:`Challenging`,question:`You have 5 flavors of ice cream: chocolate, vanilla, strawberry, mango, and lemon. How many different ways can you choose 2 flavors?`,diagram:null,choices:[{id:`A`,text:`8`},{id:`B`,text:`9`},{id:`C`,text:`10`},{id:`D`,text:`12`}],correctAnswer:`C`,explanationSteps:[`Pair each flavor with every other flavor once: chocolate has 4 partners, vanilla has 3 new partners, strawberry has 2 new partners, mango has 1 new partner.`,`Add them up: 4 + 3 + 2 + 1 = 10 different pairs.`],commonMistake:`Choosing B) 9 by forgetting to count one of the possible pairs when listing all the flavor combinations.`,quickTip:`List pairs systematically, starting with one flavor and pairing it with each flavor that comes after it, to avoid missing or repeating any.`,marks:5},{id:`mock-04-q24`,testId:4,number:24,topic:`Challenge Problems`,subtopic:`Combinations (choosing groups)`,difficulty:`Challenging`,question:`You have 5 toys: car, train, robot, ball, and kite. How many different ways can you choose 3 toys?`,diagram:null,choices:[{id:`A`,text:`8`},{id:`B`,text:`10`},{id:`C`,text:`12`},{id:`D`,text:`15`}],correctAnswer:`B`,explanationSteps:[`Choosing 3 toys to keep is the same as choosing 2 toys to leave out of the 5.`,`The number of ways to choose 2 out of 5 is 10, so there are also 10 ways to choose 3 out of 5.`],commonMistake:`Choosing D) 15 by multiplying 5 x 3 instead of correctly counting the combinations, where the order of choosing doesn't matter.`,quickTip:`Choosing 3 items to keep from 5 gives the same count as choosing the 2 items to leave out.`,marks:5},{id:`mock-04-q25`,testId:4,number:25,topic:`Challenge Problems`,subtopic:`Permutations (arranging digits)`,difficulty:`Challenging`,question:`How many different 3-digit codes can be made using 4, 5, and 6 exactly once?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`For the first digit, there are 3 choices. For the second digit, there are 2 digits left. For the third digit, there is 1 digit left.`,`Multiply: 3 x 2 x 1 = 6 different codes.`],commonMistake:`Choosing A) 3 by counting the number of digits instead of calculating the number of ways to arrange them.`,quickTip:`For arranging different digits, multiply the number of choices at each position (3, then 2, then 1).`,marks:5},{id:`mock-04-q26`,testId:4,number:26,topic:`Challenge Problems`,subtopic:`Permutations (arranging digits)`,difficulty:`Challenging`,question:`How many different 4-digit codes can be made using 1, 2, 3, and 4 exactly once?`,diagram:null,choices:[{id:`A`,text:`12`},{id:`B`,text:`16`},{id:`C`,text:`24`},{id:`D`,text:`48`}],correctAnswer:`C`,explanationSteps:[`For the first digit, there are 4 choices, then 3, then 2, then 1 for the last position.`,`Multiply: 4 x 3 x 2 x 1 = 24 different codes.`],commonMistake:`Choosing B) 16 by calculating 4 x 4 instead of 4 x 3 x 2 x 1 for the number of arrangements.`,quickTip:`The number of choices goes down by one at each position because a digit already used cannot be used again.`,marks:5},{id:`mock-04-q27`,testId:4,number:27,topic:`Word Problems and Reasoning`,subtopic:`Multi-step addition and subtraction`,difficulty:`Olympiad`,question:`Ben has 35 stickers. He gives away 12 stickers, gets 8 more stickers, and then loses 9 stickers. How many stickers does he have now?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`21`},{id:`C`,text:`22`},{id:`D`,text:`23`}],correctAnswer:`C`,explanationSteps:[`Start with 35 stickers. Subtract the 12 given away: 35 - 12 = 23.`,`Add the 8 he gets: 23 + 8 = 31.`,`Subtract the 9 he loses: 31 - 9 = 22.`],commonMistake:`Choosing D) 23 by stopping after only the first step (giving away stickers) and forgetting to apply the later gain and loss.`,quickTip:`Work through every step in order and make sure you use all the information given, not just the first part.`,marks:5},{id:`mock-04-q28`,testId:4,number:28,topic:`Geometry and Measurement`,subtopic:`Perimeter and repeated distance`,difficulty:`Olympiad`,question:`A rectangle has length 12 cm and width 4 cm. Sam walks around it twice. How far does he walk?`,diagram:null,choices:[{id:`A`,text:`16 cm`},{id:`B`,text:`24 cm`},{id:`C`,text:`32 cm`},{id:`D`,text:`64 cm`}],correctAnswer:`D`,explanationSteps:[`Find the perimeter of the rectangle: 2 x (12 + 4) = 2 x 16 = 32 cm.`,`Sam walks around it twice, so multiply by 2: 32 x 2 = 64 cm.`],commonMistake:`Choosing C) 32 cm by calculating the perimeter for only one lap around the rectangle instead of two.`,quickTip:`Read carefully to see if the question asks for one trip around a shape or more than one.`,marks:5},{id:`mock-04-q29`,testId:4,number:29,topic:`Word Problems and Reasoning`,subtopic:`Heads and legs problems`,difficulty:`Olympiad`,question:`There are 12 heads and 34 legs in a farmyard with only chickens and rabbits. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`B`,explanationSteps:[`If all 12 animals were chickens, there would be 12 x 2 = 24 legs.`,`There are 34 - 24 = 10 extra legs, so there are 10 / 2 = 5 rabbits.`,`Check: 5 rabbits and 7 chickens give 20 + 14 = 34 legs and 12 heads.`],commonMistake:`Choosing D) 7 by giving the number of chickens (7) instead of the number of rabbits (5) - the two values got swapped.`,quickTip:`After solving, always check your answer works for both the total heads and the total legs.`,marks:5},{id:`mock-04-q30`,testId:4,number:30,topic:`Patterns and Operations`,subtopic:`Number patterns (double and add 2)`,difficulty:`Olympiad`,question:`Look at the pattern. 1, 4, 10, 22, ____`,diagram:null,choices:[{id:`A`,text:`34`},{id:`B`,text:`40`},{id:`C`,text:`46`},{id:`D`,text:`52`}],correctAnswer:`C`,explanationSteps:[`Check the rule: 1 x 2 + 2 = 4, 4 x 2 + 2 = 10, 10 x 2 + 2 = 22.`,`Apply the same rule to 22: 22 x 2 + 2 = 46.`],commonMistake:`Choosing A) 34 by adding the same gap as before (12) again instead of doubling the gap to 24.`,quickTip:`In this kind of pattern, work out the rule (double and add the same number) using at least two steps before trusting it.`,marks:5}],5:[{id:`mock-05-q01`,testId:5,number:1,topic:`Word Problems and Reasoning`,subtopic:`Multi-step addition and subtraction`,difficulty:`Accessible`,question:`Nara has 36 beads. She uses 9 beads for a bracelet, then buys 14 more beads, and later gives 8 beads to her sister. How many beads does she have now?`,diagram:null,choices:[{id:`A`,text:`31`},{id:`B`,text:`32`},{id:`C`,text:`33`},{id:`D`,text:`34`}],correctAnswer:`C`,explanationSteps:[`Start with 36 beads and take away the 9 used for the bracelet: 36 − 9 = 27.`,`Add the 14 beads she buys: 27 + 14 = 41.`,`Take away the 8 beads she gives to her sister: 41 − 8 = 33.`],commonMistake:`Choosing B) 32 by making a small subtraction slip in an early step, such as computing 36 − 9 as 26 instead of 27.`,quickTip:`Work through multi-step problems one step at a time, and write down the running total after each step.`,marks:5},{id:`mock-05-q02`,testId:5,number:2,topic:`Patterns and Operations`,subtopic:`Arithmetic sequences (constant difference)`,difficulty:`Accessible`,question:`Which number should replace the question mark? 8, 11, 14, 17, ?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`19`},{id:`C`,text:`20`},{id:`D`,text:`21`}],correctAnswer:`C`,explanationSteps:[`Find the gap between each number: 11 − 8 = 3, 14 − 11 = 3, 17 − 14 = 3.`,`The pattern always adds 3.`,`Add 3 to the last number: 17 + 3 = 20.`],commonMistake:`Choosing B) 19 by adding only 2 instead of checking the real gap of 3 between each pair of numbers.`,quickTip:`Always check the gap between at least two pairs of numbers before continuing a pattern.`,marks:5},{id:`mock-05-q03`,testId:5,number:3,topic:`Patterns and Operations`,subtopic:`Growing number patterns`,difficulty:`Accessible`,question:`Look at the pattern. 2, 6, 12, 20, ?`,diagram:null,choices:[{id:`A`,text:`28`},{id:`B`,text:`30`},{id:`C`,text:`32`},{id:`D`,text:`34`}],correctAnswer:`B`,explanationSteps:[`Find the gaps: 6 − 2 = 4, 12 − 6 = 6, 20 − 12 = 8.`,`The gap grows by 2 each time, so the next gap is 8 + 2 = 10.`,`Add 10 to 20: 20 + 10 = 30.`],commonMistake:`Choosing A) 28 by assuming the gap stays at 8 instead of noticing the gap itself increases by 2 each time.`,quickTip:`In a growing pattern, look at how the gaps between numbers change, not just the numbers themselves.`,marks:5},{id:`mock-05-q04`,testId:5,number:4,topic:`Number Skills`,subtopic:`Comparing 4-digit numbers`,difficulty:`Accessible`,question:`Which number is the greatest?`,diagram:null,choices:[{id:`A`,text:`4,205`},{id:`B`,text:`4,250`},{id:`C`,text:`4,025`},{id:`D`,text:`4,252`}],correctAnswer:`D`,explanationSteps:[`All numbers start with 4, so compare the hundreds digit: 4,205 and 4,025 have smaller hundreds digits.`,`Compare 4,250 and 4,252 - they share the same thousands, hundreds, and tens digits.`,`Look at the ones digit: 4,252 has 2, which is bigger than 4,250's 0, so 4,252 is greatest.`],commonMistake:`Choosing B) 4,250 by stopping the comparison after the tens digit and forgetting to check the ones digit.`,quickTip:`When numbers look similar, compare digit by digit from left to right until you find a difference.`,marks:5},{id:`mock-05-q05`,testId:5,number:5,topic:`Number Skills`,subtopic:`Comparing 4-digit numbers`,difficulty:`Accessible`,question:`Which number is the smallest?`,diagram:null,choices:[{id:`A`,text:`3,901`},{id:`B`,text:`3,190`},{id:`C`,text:`3,109`},{id:`D`,text:`3,910`}],correctAnswer:`C`,explanationSteps:[`All numbers start with 3, so compare the hundreds digit next.`,`3,190 and 3,109 both have a smaller hundreds digit (1) than 3,901 and 3,910 (9).`,`Compare the tens digit of 3,190 and 3,109: 3,109 has 0 tens, which is smaller than 9 tens, so 3,109 is smallest.`],commonMistake:`Choosing B) 3,190 by comparing only the first two digits and not checking the tens digit carefully.`,quickTip:`Line up the digits by place value (thousands, hundreds, tens, ones) to compare numbers accurately.`,marks:5},{id:`mock-05-q06`,testId:5,number:6,topic:`Geometry and Measurement`,subtopic:`Perimeter of a square`,difficulty:`Accessible`,question:`A square has side length 9 cm. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`18 cm`},{id:`B`,text:`27 cm`},{id:`C`,text:`36 cm`},{id:`D`,text:`81 cm`}],correctAnswer:`C`,explanationSteps:[`A square has 4 equal sides.`,`Perimeter = 4 × side length = 4 × 9 cm.`,`4 × 9 = 36 cm.`],commonMistake:`Choosing D) 81 cm by multiplying the side length by itself (9 × 9) instead of by 4.`,quickTip:`Perimeter of a square is always 4 times one side - don't confuse it with area, which is side times side.`,marks:5},{id:`mock-05-q07`,testId:5,number:7,topic:`Geometry and Measurement`,subtopic:`Perimeter of a rectangle`,difficulty:`Accessible`,question:`A rectangle has length 11 cm and width 3 cm. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`14 cm`},{id:`B`,text:`22 cm`},{id:`C`,text:`28 cm`},{id:`D`,text:`33 cm`}],correctAnswer:`C`,explanationSteps:[`A rectangle has two lengths and two widths.`,`Add one length and one width: 11 + 3 = 14.`,`Double this sum for the perimeter: 2 × 14 = 28 cm.`],commonMistake:`Choosing A) 14 cm by adding the length and width once but forgetting to double it for all four sides.`,quickTip:`Remember the rule: perimeter of a rectangle = 2 × (length + width).`,marks:5},{id:`mock-05-q08`,testId:5,number:8,topic:`Word Problems and Reasoning`,subtopic:`Subtraction in context`,difficulty:`Accessible`,question:`A ribbon is 25 cm long. Mina cuts off 8 cm and then 7 cm. How much ribbon is left?`,diagram:null,choices:[{id:`A`,text:`9 cm`},{id:`B`,text:`10 cm`},{id:`C`,text:`11 cm`},{id:`D`,text:`12 cm`}],correctAnswer:`B`,explanationSteps:[`Start with 25 cm of ribbon.`,`Cut off 8 cm: 25 − 8 = 17 cm left.`,`Cut off another 7 cm: 17 − 7 = 10 cm left.`],commonMistake:`Choosing C) 11 cm by subtracting only one of the two cuts, such as forgetting the second 7 cm cut.`,quickTip:`When ribbon or rope is cut more than once, subtract each cut one at a time to avoid missing a step.`,marks:5},{id:`mock-05-q09`,testId:5,number:9,topic:`Word Problems and Reasoning`,subtopic:`Heads-and-legs problems`,difficulty:`Moderate`,question:`There are chickens and rabbits in a pen. There are 8 heads and 22 legs in total. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`2`},{id:`B`,text:`3`},{id:`C`,text:`4`},{id:`D`,text:`5`}],correctAnswer:`B`,explanationSteps:[`If all 8 animals were chickens (2 legs each), there would be 8 × 2 = 16 legs.`,`There are 22 − 16 = 6 extra legs, and each rabbit adds 2 extra legs (4 − 2).`,`Number of rabbits = 6 ÷ 2 = 3.`],commonMistake:`Choosing C) 4 by dividing the total legs by 4 (22 ÷ 4 ≈ 5) instead of using the extra-legs method to find rabbits.`,quickTip:`For heads-and-legs puzzles, first imagine every animal is the one with fewer legs, then share out the extra legs.`,marks:5},{id:`mock-05-q10`,testId:5,number:10,topic:`Word Problems and Reasoning`,subtopic:`Heads-and-legs problems`,difficulty:`Moderate`,question:`There are 10 heads and 26 legs in a farmyard with only chickens and rabbits. How many chickens are there?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`D`,explanationSteps:[`If all 10 animals were chickens, there would be 10 × 2 = 20 legs.`,`There are 26 − 20 = 6 extra legs, and each rabbit adds 2 extra legs.`,`Number of rabbits = 6 ÷ 2 = 3, so chickens = 10 − 3 = 7.`],commonMistake:`Choosing C) 6 by finding the number of rabbits (3) correctly but subtracting it from the wrong total or miscounting the remaining heads.`,quickTip:`After finding one type of animal, always subtract from the total heads to find the other type.`,marks:5},{id:`mock-05-q11`,testId:5,number:11,topic:`Number Skills`,subtopic:`Equal sharing (division)`,difficulty:`Moderate`,question:`A teacher puts 24 pencils equally into 6 boxes. How many pencils are in each box?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`B`,explanationSteps:[`24 pencils are shared equally into 6 boxes.`,`Divide: 24 ÷ 6 = 4.`,`Each box gets 4 pencils.`],commonMistake:`Choosing A) 3 by mixing up the multiplication fact and using 6 × 3 = 18 instead of checking 6 × 4 = 24.`,quickTip:`Check your division answer by multiplying it back: number in each group × number of groups should equal the total.`,marks:5},{id:`mock-05-q12`,testId:5,number:12,topic:`Number Skills`,subtopic:`Division with remainder`,difficulty:`Moderate`,question:`29 candies are shared equally among 4 children. How many candies are left over?`,diagram:null,choices:[{id:`A`,text:`0`},{id:`B`,text:`1`},{id:`C`,text:`2`},{id:`D`,text:`3`}],correctAnswer:`B`,explanationSteps:[`Share 29 candies among 4 children.`,`4 × 7 = 28, which is the closest multiple of 4 without going over 29.`,`29 − 28 = 1 candy left over.`],commonMistake:`Choosing C) 2 by using 4 × 6 = 24 for a rough estimate and miscalculating the leftover as 29 − 24 = 5, then guessing incorrectly.`,quickTip:`Find the largest multiple of the divisor that does not exceed the total, then subtract to find the remainder.`,marks:5},{id:`mock-05-q13`,testId:5,number:13,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Moderate`,question:`What is 3,476 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`3,400`},{id:`B`,text:`3,500`},{id:`C`,text:`3,480`},{id:`D`,text:`3,600`}],correctAnswer:`B`,explanationSteps:[`3,476 is between 3,400 and 3,500.`,`Look at the tens digit: 7, which is 5 or more, so round up.`,`3,476 rounds to 3,500.`],commonMistake:`Choosing A) 3,400 by rounding down without checking whether the tens digit is 5 or greater.`,quickTip:`To round to the nearest hundred, look only at the tens digit: 5 or more rounds up, less than 5 rounds down.`,marks:5},{id:`mock-05-q14`,testId:5,number:14,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Moderate`,question:`What is 6,249 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`6,200`},{id:`B`,text:`6,250`},{id:`C`,text:`6,300`},{id:`D`,text:`6,400`}],correctAnswer:`A`,explanationSteps:[`6,249 is between 6,200 and 6,300.`,`Look at the tens digit: 4, which is less than 5, so round down.`,`6,249 rounds to 6,200.`],commonMistake:`Choosing C) 6,300 by mistakenly rounding up even though the tens digit (4) is less than 5.`,quickTip:`Remember: a tens digit of 4 or below always rounds down to the lower hundred.`,marks:5},{id:`mock-05-q15`,testId:5,number:15,topic:`Number Skills`,subtopic:`Divisibility rules`,difficulty:`Moderate`,question:`Which number is divisible by both 2 and 5?`,diagram:null,choices:[{id:`A`,text:`24`},{id:`B`,text:`35`},{id:`C`,text:`40`},{id:`D`,text:`45`}],correctAnswer:`C`,explanationSteps:[`A number divisible by 2 must be even (end in 0, 2, 4, 6, 8).`,`A number divisible by 5 must end in 0 or 5.`,`Only 40 ends in 0, so it is divisible by both 2 and 5.`],commonMistake:`Choosing D) 45 by remembering it ends in 5 but forgetting that odd numbers ending in 5 are not divisible by 2.`,quickTip:`A number divisible by both 2 and 5 must always end in 0.`,marks:5},{id:`mock-05-q16`,testId:5,number:16,topic:`Number Skills`,subtopic:`Divisibility rules`,difficulty:`Moderate`,question:`Which number is divisible by 5 but not divisible by 2?`,diagram:null,choices:[{id:`A`,text:`30`},{id:`B`,text:`50`},{id:`C`,text:`65`},{id:`D`,text:`80`}],correctAnswer:`C`,explanationSteps:[`Divisible by 5 means the number ends in 0 or 5.`,`Divisible by 2 means the number is even.`,`65 ends in 5 and is odd, so it is divisible by 5 but not by 2.`],commonMistake:`Choosing A) 30 by only checking that it ends in 0, without noticing 30 is also even and divisible by 2.`,quickTip:`Numbers ending in 5 (not 0) are divisible by 5 but never by 2, since they are odd.`,marks:5},{id:`mock-05-q17`,testId:5,number:17,topic:`Geometry and Measurement`,subtopic:`Reading and adding time`,difficulty:`Moderate`,question:`A clock shows 2:35. What time will it be 30 minutes later?`,diagram:null,choices:[{id:`A`,text:`2:55`},{id:`B`,text:`3:00`},{id:`C`,text:`3:05`},{id:`D`,text:`3:15`}],correctAnswer:`C`,explanationSteps:[`Start at 2:35.`,`Add 30 minutes: 35 minutes + 30 minutes = 65 minutes, which is 1 hour and 5 minutes.`,`2:00 + 1 hour 5 minutes = 3:05.`],commonMistake:`Choosing B) 3:00 by rounding 2:35 up to 3:00 first and then forgetting to add the full 30 minutes correctly.`,quickTip:`When adding minutes past 60, carry the extra hour forward just like carrying in addition.`,marks:5},{id:`mock-05-q18`,testId:5,number:18,topic:`Geometry and Measurement`,subtopic:`Elapsed time`,difficulty:`Moderate`,question:`A movie starts at 4:20 PM and ends at 5:05 PM. How long is the movie?`,diagram:null,choices:[{id:`A`,text:`35 minutes`},{id:`B`,text:`40 minutes`},{id:`C`,text:`45 minutes`},{id:`D`,text:`50 minutes`}],correctAnswer:`C`,explanationSteps:[`From 4:20 PM to 5:00 PM is 40 minutes.`,`From 5:00 PM to 5:05 PM is another 5 minutes.`,`Add them together: 40 + 5 = 45 minutes.`],commonMistake:`Choosing B) 40 minutes by counting only up to 5:00 PM and forgetting the extra 5 minutes to 5:05 PM.`,quickTip:`Break elapsed time problems into two parts: up to the next full hour, then the rest.`,marks:5},{id:`mock-05-q19`,testId:5,number:19,topic:`Word Problems and Reasoning`,subtopic:`Multiplication in money problems`,difficulty:`Challenging`,question:`A notebook costs 12 baht. How much do 3 notebooks cost?`,diagram:null,choices:[{id:`A`,text:`24 baht`},{id:`B`,text:`30 baht`},{id:`C`,text:`36 baht`},{id:`D`,text:`42 baht`}],correctAnswer:`C`,explanationSteps:[`Each notebook costs 12 baht.`,`For 3 notebooks, multiply: 12 × 3.`,`12 × 3 = 36 baht.`],commonMistake:`Choosing A) 24 baht by mistakenly multiplying 12 by 2 instead of 3.`,quickTip:`For 'cost of several items', multiply the price of one item by how many items are bought.`,marks:5},{id:`mock-05-q20`,testId:5,number:20,topic:`Word Problems and Reasoning`,subtopic:`Money problems (comparison)`,difficulty:`Challenging`,question:`A toy costs 47 baht. Ben has 3 coins of 10 baht and 4 coins of 5 baht. Does he have enough money?`,diagram:null,choices:[{id:`A`,text:`No, he has 45 baht`},{id:`B`,text:`No, he has 46 baht`},{id:`C`,text:`Yes, he has 47 baht`},{id:`D`,text:`Yes, he has 50 baht`}],correctAnswer:`D`,explanationSteps:[`Ben has 3 coins of 10 baht: 3 × 10 = 30 baht.`,`He also has 4 coins of 5 baht: 4 × 5 = 20 baht.`,`Total = 30 + 20 = 50 baht, which is more than the 47 baht needed, so he has enough.`],commonMistake:`Choosing C) by assuming he has exactly 47 baht rather than actually adding the coin values to get 50 baht.`,quickTip:`Always add up all the coins carefully before comparing the total to the price.`,marks:5},{id:`mock-05-q21`,testId:5,number:21,topic:`Challenge Problems`,subtopic:`Permutations of distinct letters`,difficulty:`Challenging`,question:`How many different ways can the letters in BOX be arranged?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`BOX has 3 different letters.`,`The first letter can be any of 3, the second any of the remaining 2, the last is the 1 left.`,`Multiply: 3 × 2 × 1 = 6 arrangements.`],commonMistake:`Choosing A) 3 by only counting the number of letters instead of the number of ways to arrange them.`,quickTip:`For arranging n different items in a row, multiply n × (n−1) × (n−2) × ... down to 1.`,marks:5},{id:`mock-05-q22`,testId:5,number:22,topic:`Challenge Problems`,subtopic:`Permutations with repeated letters`,difficulty:`Challenging`,question:`How many different ways can the letters in BOOK be arranged if the two O's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`12`},{id:`D`,text:`24`}],correctAnswer:`C`,explanationSteps:[`BOOK has 4 letters, so if all were different there would be 4 × 3 × 2 × 1 = 24 arrangements.`,`But the two O's are the same, so every arrangement is counted twice.`,`Divide by 2: 24 ÷ 2 = 12 different arrangements.`],commonMistake:`Choosing D) 24 by treating the two O's as different letters and forgetting to divide by 2 for the repeat.`,quickTip:`When letters repeat, always divide the total arrangements by the number of ways the repeated letters can swap.`,marks:5},{id:`mock-05-q23`,testId:5,number:23,topic:`Challenge Problems`,subtopic:`Combinations (choosing groups)`,difficulty:`Challenging`,question:`You have 4 flavors of juice: apple, grape, orange, and lemon. How many different ways can you choose 2 flavors?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`8`}],correctAnswer:`C`,explanationSteps:[`List the pairs: apple-grape, apple-orange, apple-lemon, grape-orange, grape-lemon, orange-lemon.`,`Count the pairs listed: 6 different pairs.`,`Order does not matter when choosing flavors, so each pair is counted once.`],commonMistake:`Choosing D) 8 by counting apple-grape and grape-apple as two different choices, when choosing flavors does not depend on order.`,quickTip:`When picking a group where order doesn't matter, try listing all the pairs carefully to avoid counting the same pair twice.`,marks:5},{id:`mock-05-q24`,testId:5,number:24,topic:`Challenge Problems`,subtopic:`Combinations (choosing groups)`,difficulty:`Challenging`,question:`You have 5 toys: robot, kite, ball, train, and car. How many different ways can you choose 3 toys?`,diagram:null,choices:[{id:`A`,text:`8`},{id:`B`,text:`10`},{id:`C`,text:`12`},{id:`D`,text:`15`}],correctAnswer:`B`,explanationSteps:[`List the toy groups of 3 carefully, such as robot-kite-ball, robot-kite-train, robot-kite-car, and so on, without repeating a group.`,`Since the order of choosing does not matter, each group of 3 toys is counted only once.`,`Counting all the unique groups gives 10 combinations.`],commonMistake:`Choosing C) 12 by missing that some sets of 3 toys were counted more than once or listed in a different order as if they were new groups.`,quickTip:`When listing combinations, write them in the same order each time (like alphabetical) so you don't repeat or miss any group.`,marks:5},{id:`mock-05-q25`,testId:5,number:25,topic:`Challenge Problems`,subtopic:`Basic probability`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number less than 3?`,diagram:null,choices:[{id:`A`,text:`1 out of 2`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 6`},{id:`D`,text:`2 out of 3`}],correctAnswer:`B`,explanationSteps:[`Numbers less than 3 on a die are 1 and 2, so there are 2 favorable outcomes.`,`There are 6 possible outcomes in total (1 to 6).`,`Chance = 2 out of 6, which simplifies to 1 out of 3.`],commonMistake:`Choosing C) '1 out of 6' by counting only one favorable number instead of both 1 and 2.`,quickTip:`Always count every favorable outcome first, then compare it to the total number of possible outcomes, simplifying if you can.`,marks:5},{id:`mock-05-q26`,testId:5,number:26,topic:`Challenge Problems`,subtopic:`Basic probability`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number that is odd and less than 5?`,diagram:null,choices:[{id:`A`,text:`1 out of 6`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 2`},{id:`D`,text:`2 out of 3`}],correctAnswer:`B`,explanationSteps:[`Odd numbers on the die are 1, 3, and 5.`,`Of these, the ones less than 5 are 1 and 3 — that's 2 numbers.`,`2 out of 6 possible numbers simplifies to 1 out of 3.`],commonMistake:`Choosing C) '1 out of 2' by counting all odd numbers (1, 3, 5 = 3 out of 6) and forgetting to remove 5, which is not less than 5.`,quickTip:`When a question has two conditions ('odd AND less than 5'), check both conditions together, not separately.`,marks:5},{id:`mock-05-q27`,testId:5,number:27,topic:`Word Problems and Reasoning`,subtopic:`Adding grouped totals`,difficulty:`Olympiad`,question:`In a class, 14 students like apples, 9 like bananas, and 6 like oranges. How many students like fruit altogether, if no one is counted twice?`,diagram:null,choices:[{id:`A`,text:`27`},{id:`B`,text:`28`},{id:`C`,text:`29`},{id:`D`,text:`30`}],correctAnswer:`C`,explanationSteps:[`Add the students who like apples, bananas, and oranges: 14 + 9 + 6.`,`14 + 9 = 23, then 23 + 6 = 29.`,`Since no student is counted twice, the total is 29 students.`],commonMistake:`Choosing A) 27 by making a small addition error, such as computing 14 + 9 as 22 instead of 23.`,quickTip:`When adding three numbers, add two of them first, then add the third to the sum, checking each step.`,marks:5},{id:`mock-05-q28`,testId:5,number:28,topic:`Patterns and Operations`,subtopic:`Function machines (order of operations)`,difficulty:`Olympiad`,question:`A number machine adds 5 first, then doubles the answer. If the input is 7, what is the output?`,diagram:null,choices:[{id:`A`,text:`19`},{id:`B`,text:`22`},{id:`C`,text:`24`},{id:`D`,text:`26`}],correctAnswer:`C`,explanationSteps:[`The input is 7.`,`First add 5: 7 + 5 = 12.`,`Then double the answer: 12 × 2 = 24.`],commonMistake:`Choosing B) 22 by doubling the input first (7 × 2 = 14) and then adding 5, instead of following the machine's order: add first, then double.`,quickTip:`Follow the exact order given in a number machine - doing steps out of order can change the answer.`,marks:5},{id:`mock-05-q29`,testId:5,number:29,topic:`Number Skills`,subtopic:`True/false number statements`,difficulty:`Olympiad`,question:`Which statement is true?`,diagram:null,choices:[{id:`A`,text:`345 is greater than 354`},{id:`B`,text:`2,999 is less than 2,909`},{id:`C`,text:`1,005 is greater than 1,050`},{id:`D`,text:`4,321 is greater than 4,312`}],correctAnswer:`D`,explanationSteps:[`Check each statement by comparing digit by digit.`,`A, B, and C are all false: 345 < 354, 2,999 > 2,909, and 1,005 < 1,050.`,`Only D is true: 4,321 has more tens (2 tens) than 4,312 (1 ten), so 4,321 is greater.`],commonMistake:`Choosing C) by misreading which number has more hundreds, thinking 1,050 looks bigger because of the extra digit in the tens place without comparing hundreds first.`,quickTip:`Test each statement one at a time instead of guessing - compare the numbers place value by place value.`,marks:5},{id:`mock-05-q30`,testId:5,number:30,topic:`Challenge Problems`,subtopic:`Comparing likelihood`,difficulty:`Olympiad`,question:`Amy has 3 red cards, 4 blue cards, and 5 yellow cards. She picks one card without looking. Which color is she most likely to pick?`,diagram:null,choices:[{id:`A`,text:`Red`},{id:`B`,text:`Blue`},{id:`C`,text:`Yellow`},{id:`D`,text:`All are equally likely`}],correctAnswer:`C`,explanationSteps:[`Count the cards: 3 red, 4 blue, 5 yellow, so 12 cards in total.`,`Yellow has the most cards (5), so picking a yellow card is more likely than picking red or blue.`,`Since the amounts are different, the colors are not equally likely.`],commonMistake:`Choosing D) 'All are equally likely' by assuming each color has an equal chance without comparing how many cards of each color there are.`,quickTip:`The color or item with the greatest quantity is always the most likely to be picked in a simple draw.`,marks:5}],6:[{id:`mock-06-q01`,testId:6,number:1,topic:`Word Problems and Reasoning`,subtopic:`Multi-step word problems`,difficulty:`Accessible`,question:`Mila has 28 beads. She uses 9 beads to make a bracelet, buys 7 more beads, and then gives 6 beads to her friend. How many beads does she have now?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`19`},{id:`C`,text:`20`},{id:`D`,text:`21`}],correctAnswer:`C`,explanationSteps:[`Start with 28 beads and subtract the 9 used for the bracelet: 28 - 9 = 19.`,`Add the 7 beads she buys: 19 + 7 = 26.`,`Subtract the 6 beads she gives away: 26 - 6 = 20.`],commonMistake:`Choosing D) 21 by adding the numbers 9, 7, and 6 together instead of following the story in order (subtract, then add, then subtract).`,quickTip:`Work through word problems one action at a time, in the order they happen.`,marks:5},{id:`mock-06-q02`,testId:6,number:2,topic:`Patterns and Operations`,subtopic:`Number patterns (addition)`,difficulty:`Accessible`,question:`Which number should come next? 7, 12, 17, 22, ____`,diagram:null,choices:[{id:`A`,text:`25`},{id:`B`,text:`26`},{id:`C`,text:`27`},{id:`D`,text:`28`}],correctAnswer:`C`,explanationSteps:[`Find the difference between the numbers: 12-7=5, 17-12=5, 22-17=5.`,`The pattern adds 5 each time.`,`22 + 5 = 27.`],commonMistake:`Choosing B) 26 by assuming the gap is only 4 instead of checking that each number actually goes up by 5.`,quickTip:`Check the difference between at least two pairs of numbers before continuing a pattern.`,marks:5},{id:`mock-06-q03`,testId:6,number:3,topic:`Patterns and Operations`,subtopic:`Number patterns (multiply and add)`,difficulty:`Accessible`,question:`Look at the pattern. 2, 5, 11, 23, ____`,diagram:null,choices:[{id:`A`,text:`35`},{id:`B`,text:`41`},{id:`C`,text:`47`},{id:`D`,text:`51`}],correctAnswer:`C`,explanationSteps:[`Check the rule: 2x2+1=5, 5x2+1=11, 11x2+1=23.`,`Apply the same rule to 23: 23x2=46, 46+1=47.`],commonMistake:`Choosing A) 35 by treating this as a simple addition pattern (adding about 12 each time) instead of checking that each number is doubled and then increased by 1.`,quickTip:`For number patterns, test a rule like 'double and add' on two pairs before using it to find the next number.`,marks:5},{id:`mock-06-q04`,testId:6,number:4,topic:`Number Skills`,subtopic:`Comparing numbers`,difficulty:`Accessible`,question:`Which number is the greatest?`,diagram:null,choices:[{id:`A`,text:`4,290`},{id:`B`,text:`4,209`},{id:`C`,text:`4,920`},{id:`D`,text:`4,902`}],correctAnswer:`C`,explanationSteps:[`All the numbers have 4 thousands, so compare the hundreds digit next.`,`4,290 and 4,209 have 2 hundreds, but 4,920 and 4,902 both have 9 hundreds.`,`Compare 4,920 and 4,902 by the tens digit: 2 tens is more than 0 tens, so 4,920 is greatest.`],commonMistake:`Choosing D) 4,902 by seeing the '9' in the hundreds place and stopping without checking the tens digit against 4,920.`,quickTip:`Compare numbers digit by digit from the left until you find a difference.`,marks:5},{id:`mock-06-q05`,testId:6,number:5,topic:`Number Skills`,subtopic:`Estimation`,difficulty:`Accessible`,question:`Which number is closest to 600?`,diagram:null,choices:[{id:`A`,text:`586`},{id:`B`,text:`593`},{id:`C`,text:`608`},{id:`D`,text:`617`}],correctAnswer:`B`,explanationSteps:[`Find how far each number is from 600: 600-586=14, 600-593=7, 608-600=8, 617-600=17.`,`The smallest distance is 7, which belongs to 593.`],commonMistake:`Choosing C) 608 because it is just above 600, without actually calculating the distance from 600 for every choice.`,quickTip:`To find the number 'closest to' a target, subtract to find the distance, then compare the distances.`,marks:5},{id:`mock-06-q06`,testId:6,number:6,topic:`Geometry and Measurement`,subtopic:`Perimeter of squares`,difficulty:`Accessible`,question:`A square has side length 8 cm. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`24 cm`},{id:`B`,text:`28 cm`},{id:`C`,text:`32 cm`},{id:`D`,text:`36 cm`}],correctAnswer:`C`,explanationSteps:[`A square has 4 equal sides.`,`Perimeter = 4 x side length = 4 x 8 cm = 32 cm.`],commonMistake:`Choosing A) 24 cm by multiplying 8 x 3 instead of 8 x 4, forgetting a square has 4 sides.`,quickTip:`For a square, multiply the side length by 4 to get the perimeter.`,marks:5},{id:`mock-06-q07`,testId:6,number:7,topic:`Geometry and Measurement`,subtopic:`Perimeter of rectangles`,difficulty:`Accessible`,question:`A rectangle has length 10 cm and width 4 cm. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`14 cm`},{id:`B`,text:`24 cm`},{id:`C`,text:`28 cm`},{id:`D`,text:`40 cm`}],correctAnswer:`C`,explanationSteps:[`A rectangle has 2 lengths and 2 widths.`,`Perimeter = 2 x (length + width) = 2 x (10 + 4) = 2 x 14 = 28 cm.`],commonMistake:`Choosing A) 14 cm by adding the length and width once (10+4=14) and forgetting to double it.`,quickTip:`Remember the rectangle perimeter formula: 2 x (length + width).`,marks:5},{id:`mock-06-q08`,testId:6,number:8,topic:`Geometry and Measurement`,subtopic:`Equal perimeters`,difficulty:`Accessible`,question:`A square and a rectangle have the same perimeter. The square has side length 5 cm. The rectangle has width 3 cm. What is the length of the rectangle?`,diagram:null,choices:[{id:`A`,text:`6 cm`},{id:`B`,text:`7 cm`},{id:`C`,text:`8 cm`},{id:`D`,text:`9 cm`}],correctAnswer:`B`,explanationSteps:[`Find the square's perimeter: 4 x 5 = 20 cm.`,`The rectangle has the same perimeter, so 2 x (length + 3) = 20.`,`Length + 3 = 10, so length = 7 cm.`],commonMistake:`Choosing A) 6 cm by using the square's side length (5) instead of correctly finding the rectangle's half-perimeter (10) and subtracting the width (3).`,quickTip:`When two shapes share a perimeter, set the perimeters equal first, then solve for the unknown side.`,marks:5},{id:`mock-06-q09`,testId:6,number:9,topic:`Word Problems and Reasoning`,subtopic:`Division word problems`,difficulty:`Moderate`,question:`A rope is 36 cm long. It is cut into 6 equal pieces. How long is each piece?`,diagram:null,choices:[{id:`A`,text:`5 cm`},{id:`B`,text:`6 cm`},{id:`C`,text:`7 cm`},{id:`D`,text:`8 cm`}],correctAnswer:`B`,explanationSteps:[`Divide the total length by the number of pieces: 36 ÷ 6.`,`36 ÷ 6 = 6, so each piece is 6 cm long.`],commonMistake:`Choosing C) 7 cm by confusing this with a different division fact, like 35÷5, instead of calculating 36÷6.`,quickTip:`Divide the whole length by the number of equal pieces to find the length of one piece.`,marks:5},{id:`mock-06-q10`,testId:6,number:10,topic:`Challenge Problems`,subtopic:`Heads and legs problems`,difficulty:`Moderate`,question:`There are chickens and rabbits in a yard. There are 8 heads and 24 legs in total. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`2`},{id:`B`,text:`3`},{id:`C`,text:`4`},{id:`D`,text:`5`}],correctAnswer:`C`,explanationSteps:[`If all 8 animals were chickens (2 legs each), there would be 8 x 2 = 16 legs.`,`There are 24 - 16 = 8 extra legs. Each rabbit adds 2 extra legs, so there are 8 ÷ 2 = 4 rabbits.`,`Check: 4 rabbits (16 legs) + 4 chickens (8 legs) = 24 legs and 8 heads.`],commonMistake:`Choosing A) 2 by guessing a small number of rabbits without checking that the legs actually add up to 24.`,quickTip:`Assume all animals are the 2-legged kind first, then share the extra legs among the 4-legged animals.`,marks:5},{id:`mock-06-q11`,testId:6,number:11,topic:`Challenge Problems`,subtopic:`Heads and legs problems`,difficulty:`Moderate`,question:`There are chickens and rabbits in a pen. There are 9 heads and 22 legs in total. How many chickens are there?`,diagram:null,choices:[{id:`A`,text:`5`},{id:`B`,text:`6`},{id:`C`,text:`7`},{id:`D`,text:`8`}],correctAnswer:`C`,explanationSteps:[`If all 9 animals were rabbits (4 legs each), there would be 9 x 4 = 36 legs.`,`There are 36 - 22 = 14 too many legs, so 14 ÷ 2 = 7 chickens (each chicken removes 2 legs from the rabbit total).`,`Check: 7 chickens (14 legs) + 2 rabbits (8 legs) = 22 legs and 9 heads.`],commonMistake:`Choosing A) 5 by miscounting the legs and not checking the answer against both the head count and the leg count.`,quickTip:`Try assuming all animals are one type first, then adjust using the leg difference.`,marks:5},{id:`mock-06-q12`,testId:6,number:12,topic:`Number Skills`,subtopic:`Division with remainders`,difficulty:`Moderate`,question:`27 cookies are shared equally among 4 children. How many cookies are left over?`,diagram:null,choices:[{id:`A`,text:`1`},{id:`B`,text:`2`},{id:`C`,text:`3`},{id:`D`,text:`4`}],correctAnswer:`C`,explanationSteps:[`Find the largest multiple of 4 that is not more than 27: 4 x 6 = 24.`,`Subtract: 27 - 24 = 3 cookies left over.`],commonMistake:`Choosing A) 1 by using 4 x 6 = 24 correctly but then subtracting incorrectly (like 27-26) instead of 27-24.`,quickTip:`After dividing, multiply the whole-number answer back and subtract from the total to check the remainder.`,marks:5},{id:`mock-06-q13`,testId:6,number:13,topic:`Number Skills`,subtopic:`Division`,difficulty:`Moderate`,question:`35 toy cars are packed equally into 5 boxes. How many toy cars are in each box?`,diagram:null,choices:[{id:`A`,text:`5`},{id:`B`,text:`6`},{id:`C`,text:`7`},{id:`D`,text:`8`}],correctAnswer:`C`,explanationSteps:[`Divide 35 by 5.`,`5 x 7 = 35, so each box has 7 toy cars.`],commonMistake:`Choosing B) 6 by mixing up the multiplication fact 5x6=30 instead of the correct fact 5x7=35.`,quickTip:`Use known multiplication facts to check your division answer.`,marks:5},{id:`mock-06-q14`,testId:6,number:14,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Moderate`,question:`What is 3,451 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`3,400`},{id:`B`,text:`3,500`},{id:`C`,text:`3,450`},{id:`D`,text:`3,600`}],correctAnswer:`B`,explanationSteps:[`Look at the last two digits of 3,451, which are 51.`,`Since 51 is 50 or more, round the hundreds digit up.`,`3,451 rounds to 3,500.`],commonMistake:`Choosing A) 3,400 by rounding down instead of noticing that 51 is 50 or more, which means rounding up.`,quickTip:`To round to the nearest hundred, check the tens digit: 5 or more rounds up, less than 5 rounds down.`,marks:5},{id:`mock-06-q15`,testId:6,number:15,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Moderate`,question:`What is 7,249 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`7,200`},{id:`B`,text:`7,250`},{id:`C`,text:`7,300`},{id:`D`,text:`7,400`}],correctAnswer:`A`,explanationSteps:[`Look at the last two digits of 7,249, which are 49.`,`Since 49 is less than 50, round the hundreds digit down.`,`7,249 rounds to 7,200.`],commonMistake:`Choosing C) 7,300 by rounding up even though the tens digit (4) means the number should round down.`,quickTip:`If the last two digits are less than 50, keep the hundreds digit the same and round down.`,marks:5},{id:`mock-06-q16`,testId:6,number:16,topic:`Number Skills`,subtopic:`Divisibility rules`,difficulty:`Moderate`,question:`Which number is divisible by both 2 and 5?`,diagram:null,choices:[{id:`A`,text:`24`},{id:`B`,text:`35`},{id:`C`,text:`50`},{id:`D`,text:`65`}],correctAnswer:`C`,explanationSteps:[`A number divisible by both 2 and 5 must end in 0.`,`Check the choices: only 50 ends in 0.`],commonMistake:`Choosing B) 35 by only checking divisibility by 5 (it ends in 5) and forgetting to also check divisibility by 2.`,quickTip:`A number divisible by both 2 and 5 always ends in 0.`,marks:5},{id:`mock-06-q17`,testId:6,number:17,topic:`Number Skills`,subtopic:`Divisibility rules`,difficulty:`Moderate`,question:`Which number is divisible by 5 but not divisible by 2?`,diagram:null,choices:[{id:`A`,text:`30`},{id:`B`,text:`40`},{id:`C`,text:`45`},{id:`D`,text:`60`}],correctAnswer:`C`,explanationSteps:[`Numbers divisible by 5 end in 0 or 5.`,`Numbers divisible by 2 are even.`,`45 ends in 5 and is odd, so it is divisible by 5 but not by 2.`],commonMistake:`Choosing A) 30 by checking that it is divisible by 5 but not noticing it also ends in 0, which makes it divisible by 2 as well.`,quickTip:`Numbers ending in 5 (not 0) are divisible by 5 but not by 2.`,marks:5},{id:`mock-06-q18`,testId:6,number:18,topic:`Word Problems and Reasoning`,subtopic:`Elapsed time`,difficulty:`Moderate`,question:`A movie starts at 2:40 PM and ends at 3:15 PM. How long is the movie?`,diagram:null,choices:[{id:`A`,text:`25 minutes`},{id:`B`,text:`30 minutes`},{id:`C`,text:`35 minutes`},{id:`D`,text:`40 minutes`}],correctAnswer:`C`,explanationSteps:[`From 2:40 PM to 3:00 PM is 20 minutes.`,`From 3:00 PM to 3:15 PM is 15 minutes.`,`Total time: 20 + 15 = 35 minutes.`],commonMistake:`Choosing A) 25 minutes by counting only part of the time (like stopping at 3:05) instead of going all the way to 3:15.`,quickTip:`Break elapsed time into 'up to the next hour' plus 'the rest of the time' to avoid mistakes.`,marks:5},{id:`mock-06-q19`,testId:6,number:19,topic:`Word Problems and Reasoning`,subtopic:`Elapsed time`,difficulty:`Challenging`,question:`A train leaves at 4:25 PM and arrives 40 minutes later. What time does it arrive?`,diagram:null,choices:[{id:`A`,text:`4:55 PM`},{id:`B`,text:`5:00 PM`},{id:`C`,text:`5:05 PM`},{id:`D`,text:`5:15 PM`}],correctAnswer:`C`,explanationSteps:[`From 4:25 PM, add 35 minutes to reach 5:00 PM.`,`There are 40 - 35 = 5 minutes left to add.`,`5:00 PM + 5 minutes = 5:05 PM.`],commonMistake:`Choosing B) 5:00 PM by adding only 35 minutes instead of the full 40 minutes.`,quickTip:`Add minutes in two steps: first reach the next full hour, then add what's left.`,marks:5},{id:`mock-06-q20`,testId:6,number:20,topic:`Word Problems and Reasoning`,subtopic:`Multiplication word problems`,difficulty:`Challenging`,question:`One notebook costs 16 baht. How much do 3 notebooks cost?`,diagram:null,choices:[{id:`A`,text:`42 baht`},{id:`B`,text:`46 baht`},{id:`C`,text:`48 baht`},{id:`D`,text:`52 baht`}],correctAnswer:`C`,explanationSteps:[`Multiply the cost of one notebook by 3: 16 x 3.`,`16 x 3 = 48 baht.`],commonMistake:`Choosing A) 42 baht by adding the numbers incorrectly (like 16+16+10) instead of multiplying correctly.`,quickTip:`For the cost of several identical items, multiply the price of one by the number of items.`,marks:5},{id:`mock-06-q21`,testId:6,number:21,topic:`Word Problems and Reasoning`,subtopic:`Money and change`,difficulty:`Challenging`,question:`Nita has 3 coins of 10 baht and 2 coins of 5 baht. She wants to buy a pen that costs 37 baht. How much money will she have left?`,diagram:null,choices:[{id:`A`,text:`1 baht`},{id:`B`,text:`2 baht`},{id:`C`,text:`3 baht`},{id:`D`,text:`4 baht`}],correctAnswer:`C`,explanationSteps:[`Add up Nita's money: 3 x 10 = 30 baht, and 2 x 5 = 10 baht, so total = 40 baht.`,`Subtract the cost of the pen: 40 - 37 = 3 baht.`],commonMistake:`Choosing A) 1 baht by miscounting the coins (for example forgetting one of the 10-baht coins) before subtracting.`,quickTip:`Add up all the coins first to find the total money, then subtract the cost.`,marks:5},{id:`mock-06-q22`,testId:6,number:22,topic:`Challenge Problems`,subtopic:`Permutations`,difficulty:`Challenging`,question:`How many different ways can the letters in SUN be arranged?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`SUN has 3 different letters.`,`The number of arrangements is 3! = 3 x 2 x 1 = 6.`],commonMistake:`Choosing A) 3 by thinking there are only as many arrangements as there are letters, instead of multiplying the choices for each position.`,quickTip:`For arranging n different items, multiply n x (n-1) x (n-2) x ... down to 1.`,marks:5},{id:`mock-06-q23`,testId:6,number:23,topic:`Challenge Problems`,subtopic:`Permutations with repeated items`,difficulty:`Challenging`,question:`How many different ways can the letters in SEED be arranged if the two E's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`12`},{id:`D`,text:`24`}],correctAnswer:`C`,explanationSteps:[`SEED has 4 letters, so if all were different there would be 4! = 24 arrangements.`,`Since the two E's are the same, divide by 2! = 2 to remove the repeats that look identical.`,`24 ÷ 2 = 12 arrangements.`],commonMistake:`Choosing D) 24 by treating both E's as different letters and forgetting to divide by 2 for the repeated letter.`,quickTip:`When a word has repeated letters, divide the total arrangements by the factorial of how many times a letter repeats.`,marks:5},{id:`mock-06-q24`,testId:6,number:24,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Challenging`,question:`You have 4 juice flavors: apple, orange, grape, and lemon. How many different ways can you choose 2 flavors?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`8`}],correctAnswer:`C`,explanationSteps:[`List the pairs: apple-orange, apple-grape, apple-lemon, orange-grape, orange-lemon, grape-lemon.`,`Count the pairs: there are 6 different ways.`],commonMistake:`Choosing A) 4 by counting only the flavors themselves instead of counting the pairs you can make from them.`,quickTip:`When order doesn't matter, list out the pairs carefully to count all the combinations.`,marks:5},{id:`mock-06-q25`,testId:6,number:25,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Challenging`,question:`You have 5 toys: car, robot, train, kite, and ball. How many different ways can you choose 3 toys?`,diagram:null,choices:[{id:`A`,text:`8`},{id:`B`,text:`10`},{id:`C`,text:`12`},{id:`D`,text:`15`}],correctAnswer:`B`,explanationSteps:[`Choosing 3 toys to keep is the same as choosing 2 toys to leave out.`,`There are 10 ways to pick 2 toys to leave out from 5 (car&robot, car&train, car&kite, car&ball, robot&train, robot&kite, robot&ball, train&kite, train&ball, kite&ball).`,`So there are also 10 ways to choose 3 toys.`],commonMistake:`Choosing C) 12 by miscounting the pairs or accidentally counting some combinations more than once.`,quickTip:`Choosing 3 items to keep from 5 is the same as choosing 2 items to leave out — count whichever is easier.`,marks:5},{id:`mock-06-q26`,testId:6,number:26,topic:`Challenge Problems`,subtopic:`Basic probability`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number greater than 4?`,diagram:null,choices:[{id:`A`,text:`1 out of 2`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 6`},{id:`D`,text:`2 out of 3`}],correctAnswer:`B`,explanationSteps:[`Numbers greater than 4 on a die are 5 and 6, so there are 2 favorable outcomes out of 6.`,`Simplify 2 out of 6 to 1 out of 3.`],commonMistake:`Choosing D) '2 out of 3' by mistakenly including 4 as a favorable outcome, even though 4 is not greater than 4.`,quickTip:`List the favorable outcomes first, then write them as a fraction of all 6 possible outcomes and simplify.`,marks:5},{id:`mock-06-q27`,testId:6,number:27,topic:`Challenge Problems`,subtopic:`Basic probability`,difficulty:`Olympiad`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a multiple of 3?`,diagram:null,choices:[{id:`A`,text:`1 out of 6`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 2`},{id:`D`,text:`2 out of 3`}],correctAnswer:`B`,explanationSteps:[`Multiples of 3 on a die are 3 and 6, so there are 2 favorable outcomes out of 6.`,`Simplify 2 out of 6 to 1 out of 3.`],commonMistake:`Choosing C) 1 out of 2 by counting numbers that are just close to a multiple of 3 instead of only the true multiples (3 and 6).`,quickTip:`List the multiples of the given number that fall between 1 and 6 before counting.`,marks:5},{id:`mock-06-q28`,testId:6,number:28,topic:`Patterns and Operations`,subtopic:`Function machines`,difficulty:`Olympiad`,question:`A number machine adds 4 first and then doubles the answer. What is the output when the input is 6?`,diagram:null,choices:[{id:`A`,text:`16`},{id:`B`,text:`18`},{id:`C`,text:`20`},{id:`D`,text:`24`}],correctAnswer:`C`,explanationSteps:[`First add 4 to the input: 6 + 4 = 10.`,`Then double the result: 10 x 2 = 20.`],commonMistake:`Choosing A) 16 by doing the steps in the wrong order — doubling first (6x2=12) and then adding 4 (12+4=16) instead of adding first.`,quickTip:`Follow the number machine steps in the exact order given: first add, then double.`,marks:5},{id:`mock-06-q29`,testId:6,number:29,topic:`Number Skills`,subtopic:`Comparing numbers`,difficulty:`Olympiad`,question:`Which statement is true?`,diagram:null,choices:[{id:`A`,text:`2,999 is less than 2,909`},{id:`B`,text:`4,312 is greater than 4,321`},{id:`C`,text:`5,040 is greater than 5,004`},{id:`D`,text:`3,150 is less than 3,105`}],correctAnswer:`C`,explanationSteps:[`Check statement A: 2,999 is actually greater than 2,909, so A is false.`,`Check statements B and D the same way: 4,312 is less than 4,321 (B is false), and 3,150 is greater than 3,105 (D is false).`,`Compare 5,040 and 5,004: the tens digit shows 5,040 is greater than 5,004, so C is true.`],commonMistake:`Choosing A) by only comparing the first two digits (29) of 2,999 and 2,909 without checking the ones digit.`,quickTip:`Test each statement by comparing digit by digit from the left before deciding which one is true.`,marks:5},{id:`mock-06-q30`,testId:6,number:30,topic:`Number Skills`,subtopic:`Number properties`,difficulty:`Olympiad`,question:`A number is greater than 400, less than 450, and divisible by 5. Which number could it be?`,diagram:null,choices:[{id:`A`,text:`412`},{id:`B`,text:`425`},{id:`C`,text:`443`},{id:`D`,text:`448`}],correctAnswer:`B`,explanationSteps:[`All four choices are between 400 and 450, so check which one is divisible by 5.`,`A number divisible by 5 ends in 0 or 5. Only 425 ends in 5.`,`So 425 is the number that fits all three clues.`],commonMistake:`Choosing D) 448 by only checking that it fits between 400 and 450 and forgetting to check whether it is divisible by 5.`,quickTip:`When a question gives a range AND a divisibility rule, check both conditions before picking an answer.`,marks:5}],7:[{id:`mock-07-q01`,testId:7,number:1,topic:`Word Problems and Reasoning`,subtopic:`Multi-step addition and subtraction`,difficulty:`Accessible`,question:`Arin has 47 shells. He gives 15 shells to his cousin, finds 9 more shells, and then uses 8 shells for an art project. How many shells does he have now?`,diagram:null,choices:[{id:`A`,text:`31`},{id:`B`,text:`32`},{id:`C`,text:`33`},{id:`D`,text:`34`}],correctAnswer:`C`,explanationSteps:[`Start with 47 shells and give away 15: 47 − 15 = 32.`,`He finds 9 more shells: 32 + 9 = 41.`,`He uses 8 shells for art: 41 − 8 = 33.`],commonMistake:`Choosing B) 32 by stopping after the first step (47 − 15 = 32) and forgetting to add the 9 shells he found and subtract the 8 he used.`,quickTip:`Work through each event in the story one at a time, in the order it happens.`,marks:5},{id:`mock-07-q02`,testId:7,number:2,topic:`Patterns and Operations`,subtopic:`Number sequences with growing gaps`,difficulty:`Accessible`,question:`Which number should come next? 4, 7, 11, 16, 22, ____`,diagram:null,choices:[{id:`A`,text:`27`},{id:`B`,text:`28`},{id:`C`,text:`29`},{id:`D`,text:`30`}],correctAnswer:`C`,explanationSteps:[`Find the gaps between the numbers: +3, +4, +5, +6.`,`The gap grows by 1 each time, so the next gap is +7.`,`22 + 7 = 29.`],commonMistake:`Choosing B) 28 by adding 6 again (the last gap used) instead of noticing the gap should increase to 7.`,quickTip:`Always write out the gaps between numbers before guessing the next term.`,marks:5},{id:`mock-07-q03`,testId:7,number:3,topic:`Patterns and Operations`,subtopic:`Function (number) machines`,difficulty:`Accessible`,question:`A number machine doubles the input, then adds 5. What is the output when the input is 9?`,diagram:null,choices:[{id:`A`,text:`21`},{id:`B`,text:`22`},{id:`C`,text:`23`},{id:`D`,text:`24`}],correctAnswer:`C`,explanationSteps:[`Double the input first: 9 × 2 = 18.`,`Then add 5: 18 + 5 = 23.`,`Do the steps in the order the machine says: double, then add.`],commonMistake:`Choosing B) 22 by adding 5 to 9 first and then not doubling correctly, instead of doubling 9 before adding 5.`,quickTip:`Follow the machine's steps in the exact order given — order matters!`,marks:5},{id:`mock-07-q04`,testId:7,number:4,topic:`Number Skills`,subtopic:`Rounding and estimation`,difficulty:`Accessible`,question:`Which number is closest to 1,000?`,diagram:null,choices:[{id:`A`,text:`982`},{id:`B`,text:`994`},{id:`C`,text:`1,008`},{id:`D`,text:`1,017`}],correctAnswer:`B`,explanationSteps:[`Find how far each number is from 1,000: 982 is 18 away, 994 is 6 away, 1,008 is 8 away, 1,017 is 17 away.`,`994 has the smallest distance from 1,000.`,`So 994 is closest to 1,000.`],commonMistake:`Choosing C) 1,008 by only looking at numbers above 1,000, without checking that 994 is even closer.`,quickTip:`Closest means smallest distance — check numbers both above and below the target.`,marks:5},{id:`mock-07-q05`,testId:7,number:5,topic:`Number Skills`,subtopic:`Comparing 4-digit numbers`,difficulty:`Accessible`,question:`Which number is the smallest?`,diagram:null,choices:[{id:`A`,text:`6,305`},{id:`B`,text:`6,350`},{id:`C`,text:`6,053`},{id:`D`,text:`6,530`}],correctAnswer:`C`,explanationSteps:[`All numbers start with 6 thousands, so compare the hundreds digit.`,`6,305 and 6,350 and 6,530 have 3 or 5 hundreds, but 6,053 has 0 hundreds.`,`6,053 has the smallest hundreds digit, so it is the smallest number.`],commonMistake:`Choosing A) 6,305 by only comparing the last two digits and missing that 6,053 has 0 in the hundreds place.`,quickTip:`Compare digits from left to right: thousands, then hundreds, then tens, then ones.`,marks:5},{id:`mock-07-q06`,testId:7,number:6,topic:`Geometry and Measurement`,subtopic:`Perimeter of squares and rectangles`,difficulty:`Accessible`,question:`A square has side length 9 cm. A rectangle has the same perimeter and width 5 cm. What is the length of the rectangle?`,diagram:null,choices:[{id:`A`,text:`11 cm`},{id:`B`,text:`12 cm`},{id:`C`,text:`13 cm`},{id:`D`,text:`14 cm`}],correctAnswer:`C`,explanationSteps:[`Perimeter of the square = 4 × 9 = 36 cm.`,`The rectangle has the same perimeter: 2 × (length + 5) = 36, so length + 5 = 18.`,`Length = 18 − 5 = 13 cm.`],commonMistake:`Choosing B) 12 cm by dividing 36 by 3 instead of by 2, mixing up the perimeter formula.`,quickTip:`For a rectangle, perimeter = 2 × (length + width) — always divide by 2 first to get length + width.`,marks:5},{id:`mock-07-q07`,testId:7,number:7,topic:`Geometry and Measurement`,subtopic:`Perimeter word problems`,difficulty:`Accessible`,question:`A rectangle has length 12 cm and width 7 cm. Pavin walks around it twice. How far does he walk?`,diagram:null,choices:[{id:`A`,text:`19 cm`},{id:`B`,text:`38 cm`},{id:`C`,text:`76 cm`},{id:`D`,text:`84 cm`}],correctAnswer:`C`,explanationSteps:[`Perimeter of the rectangle = 2 × (12 + 7) = 2 × 19 = 38 cm.`,`Walking around it once covers 38 cm.`,`Walking around it twice: 38 × 2 = 76 cm.`],commonMistake:`Choosing B) 38 cm by finding the perimeter for one lap only and forgetting Pavin walks around it twice.`,quickTip:`Read carefully for words like 'twice' or 'twice around' — they mean you must multiply the perimeter.`,marks:5},{id:`mock-07-q08`,testId:7,number:8,topic:`Word Problems and Reasoning`,subtopic:`Division with leftovers`,difficulty:`Accessible`,question:`A ribbon is 38 cm long. It is cut into pieces of 5 cm each. How many full pieces can be made?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`7`},{id:`C`,text:`8`},{id:`D`,text:`9`}],correctAnswer:`B`,explanationSteps:[`Divide 38 by 5: 38 ÷ 5 = 7 remainder 3.`,`This means 7 full pieces of 5 cm can be cut, using 35 cm.`,`The leftover 3 cm is not enough for another full piece, so the answer is 7.`],commonMistake:`Choosing C) 8 by rounding 38 ÷ 5 up instead of down, forgetting that the leftover 3 cm cannot make a full piece.`,quickTip:`When cutting into equal 'full' pieces, always round the division answer down, not up.`,marks:5},{id:`mock-07-q09`,testId:7,number:9,topic:`Word Problems and Reasoning`,subtopic:`Sharing equally with remainders`,difficulty:`Moderate`,question:`43 stickers are shared equally among 6 children. How many stickers are left over?`,diagram:null,choices:[{id:`A`,text:`1`},{id:`B`,text:`2`},{id:`C`,text:`3`},{id:`D`,text:`4`}],correctAnswer:`A`,explanationSteps:[`Divide 43 by 6: 6 × 7 = 42.`,`43 − 42 = 1, so there is a remainder of 1.`,`Each child gets 7 stickers, and 1 sticker is left over.`],commonMistake:`Choosing B) 2 by miscounting the multiples of 6, thinking 6 × 7 = 41 instead of 42.`,quickTip:`Find the largest multiple of the group size that is still less than or equal to the total — the gap is the remainder.`,marks:5},{id:`mock-07-q10`,testId:7,number:10,topic:`Challenge Problems`,subtopic:`Heads-and-legs logic puzzles`,difficulty:`Moderate`,question:`There are chickens and rabbits in a yard. There are 10 heads and 30 legs in total. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`B`,explanationSteps:[`If all 10 animals were chickens, there would be 10 × 2 = 20 legs.`,`There are 30 − 20 = 10 extra legs. Each rabbit adds 2 extra legs compared to a chicken.`,`10 ÷ 2 = 5 rabbits (and 5 chickens: 5×4 + 5×2 = 20+10 = 30 legs, 10 heads — it checks out).`],commonMistake:`Choosing A) 4 by guessing without checking that the legs total still adds up to 30 with 10 heads.`,quickTip:`Try assuming all animals are the type with fewer legs first, then share out the 'extra' legs among the other type.`,marks:5},{id:`mock-07-q11`,testId:7,number:11,topic:`Number Skills`,subtopic:`Number ranges`,difficulty:`Moderate`,question:`Which number is greater than 4,500 but less than 4,550?`,diagram:null,choices:[{id:`A`,text:`4,495`},{id:`B`,text:`4,505`},{id:`C`,text:`4,560`},{id:`D`,text:`4,590`}],correctAnswer:`B`,explanationSteps:[`The number must be more than 4,500 and less than 4,550.`,`4,495 is too small (below 4,500), and 4,560 and 4,590 are too big (above 4,550).`,`Only 4,505 fits between 4,500 and 4,550.`],commonMistake:`Choosing C) 4,560 by only checking that it is greater than 4,500 and forgetting the upper limit of 4,550.`,quickTip:`When a question gives two limits, check both — 'greater than' AND 'less than'.`,marks:5},{id:`mock-07-q12`,testId:7,number:12,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Moderate`,question:`What is 5,649 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`5,600`},{id:`B`,text:`5,650`},{id:`C`,text:`5,700`},{id:`D`,text:`5,800`}],correctAnswer:`A`,explanationSteps:[`The nearest hundreds to 5,649 are 5,600 and 5,700.`,`5,649 − 5,600 = 49, and 5,700 − 5,649 = 51.`,`49 is smaller than 51, so 5,649 rounds to 5,600.`],commonMistake:`Choosing C) 5,700 by assuming a number in the high 40s always rounds up, without checking the tens digit rule (round up only at 50 or more).`,quickTip:`Look at the tens digit: if it's 5 or more, round up; if it's 4 or less, round down. Here the tens digit is 4.`,marks:5},{id:`mock-07-q13`,testId:7,number:13,topic:`Number Skills`,subtopic:`Number clues and divisibility`,difficulty:`Moderate`,question:`Which number fits all the clues? It is greater than 300, less than 350, and divisible by both 2 and 5.`,diagram:null,choices:[{id:`A`,text:`315`},{id:`B`,text:`320`},{id:`C`,text:`333`},{id:`D`,text:`347`}],correctAnswer:`B`,explanationSteps:[`Divisible by both 2 and 5 means the number must end in 0.`,`Only 320 ends in 0 among the choices.`,`Check: 320 is greater than 300 and less than 350, so it fits all the clues.`],commonMistake:`Choosing A) 315 by thinking a number ending in 5 is divisible by both 2 and 5, forgetting that it must also be even to be divisible by 2.`,quickTip:`A number divisible by both 2 and 5 must end in 0, not just 5.`,marks:5},{id:`mock-07-q14`,testId:7,number:14,topic:`Geometry and Measurement`,subtopic:`Time durations`,difficulty:`Moderate`,question:`Lina starts homework at 3:35 PM and finishes at 4:20 PM. How long does she work?`,diagram:null,choices:[{id:`A`,text:`35 minutes`},{id:`B`,text:`40 minutes`},{id:`C`,text:`45 minutes`},{id:`D`,text:`50 minutes`}],correctAnswer:`C`,explanationSteps:[`From 3:35 PM to 4:00 PM is 25 minutes.`,`From 4:00 PM to 4:20 PM is 20 minutes more.`,`25 + 20 = 45 minutes in total.`],commonMistake:`Choosing B) 40 minutes by subtracting the minute parts directly (35 from 20 crossing the hour) without carrying over the hour correctly.`,quickTip:`Split the time into 'up to the hour' and 'after the hour' to avoid mistakes when the minutes cross an hour mark.`,marks:5},{id:`mock-07-q15`,testId:7,number:15,topic:`Geometry and Measurement`,subtopic:`Finding a start time`,difficulty:`Moderate`,question:`A bus arrives at 5:10 PM. The trip takes 35 minutes. What time did the bus leave?`,diagram:null,choices:[{id:`A`,text:`4:25 PM`},{id:`B`,text:`4:35 PM`},{id:`C`,text:`4:45 PM`},{id:`D`,text:`4:50 PM`}],correctAnswer:`B`,explanationSteps:[`Count back 10 minutes from 5:10 PM to reach 5:00 PM.`,`Then count back the remaining 25 minutes from 5:00 PM to reach 4:35 PM.`,`10 + 25 = 35 minutes total, so the bus left at 4:35 PM.`],commonMistake:`Choosing A) 4:25 PM by subtracting 45 minutes instead of 35 minutes.`,quickTip:`When counting back across the hour, split the subtraction at the hour mark to keep track easily.`,marks:5},{id:`mock-07-q16`,testId:7,number:16,topic:`Word Problems and Reasoning`,subtopic:`Money calculations`,difficulty:`Moderate`,question:`A pencil costs 14 baht and an eraser costs 9 baht. How much do 2 pencils and 1 eraser cost?`,diagram:null,choices:[{id:`A`,text:`35 baht`},{id:`B`,text:`36 baht`},{id:`C`,text:`37 baht`},{id:`D`,text:`38 baht`}],correctAnswer:`C`,explanationSteps:[`2 pencils cost 2 × 14 = 28 baht.`,`Add 1 eraser: 28 + 9 = 37 baht.`,`So 2 pencils and 1 eraser cost 37 baht.`],commonMistake:`Choosing A) 35 baht by only buying 1 pencil (14) plus 1 eraser (9) and adding an extra amount incorrectly, instead of doubling the pencil cost.`,quickTip:`Read carefully how many of each item are needed before adding the costs together.`,marks:5},{id:`mock-07-q17`,testId:7,number:17,topic:`Challenge Problems`,subtopic:`Arranging letters (permutations)`,difficulty:`Moderate`,question:`How many different ways can the letters in STAR be arranged?`,diagram:null,choices:[{id:`A`,text:`12`},{id:`B`,text:`18`},{id:`C`,text:`24`},{id:`D`,text:`36`}],correctAnswer:`C`,explanationSteps:[`STAR has 4 different letters: S, T, A, R.`,`For the first spot there are 4 choices, then 3, then 2, then 1.`,`Multiply: 4 × 3 × 2 × 1 = 24 arrangements.`],commonMistake:`Choosing A) 12 by multiplying only 4 × 3 and stopping early, instead of continuing to multiply by 2 and 1.`,quickTip:`When all letters are different, multiply the counting numbers down from the total number of letters (4 × 3 × 2 × 1).`,marks:5},{id:`mock-07-q18`,testId:7,number:18,topic:`Challenge Problems`,subtopic:`Arranging letters with repeats`,difficulty:`Moderate`,question:`How many different ways can the letters in MOON be arranged if the two O's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`10`},{id:`D`,text:`12`}],correctAnswer:`D`,explanationSteps:[`If all 4 letters were different, there would be 4 × 3 × 2 × 1 = 24 arrangements.`,`But the two O's are identical, so each arrangement is counted twice.`,`Divide by 2: 24 ÷ 2 = 12 different arrangements.`],commonMistake:`Choosing A) 6 comes from dividing the 24 total arrangements by 4 instead of by 2, the correct number of repeated letters.`,quickTip:`When letters repeat, first find the total as if all letters were different, then divide by the number of ways the repeated letters can swap.`,marks:5},{id:`mock-07-q19`,testId:7,number:19,topic:`Challenge Problems`,subtopic:`Choosing groups (combinations)`,difficulty:`Challenging`,question:`You have 6 juice flavors. How many different ways can you choose 2 flavors?`,diagram:null,choices:[{id:`A`,text:`12`},{id:`B`,text:`15`},{id:`C`,text:`18`},{id:`D`,text:`20`}],correctAnswer:`B`,explanationSteps:[`List pairs systematically: flavor 1 can pair with 5 others, flavor 2 with 4 new ones, and so on: 5+4+3+2+1 = 15.`,`This counts every pair exactly once, since choosing flavor A and B is the same as choosing B and A.`,`So there are 15 different ways to choose 2 flavors from 6.`],commonMistake:`Choosing A) 12 by multiplying 6 × 2 instead of counting all the possible pairs systematically.`,quickTip:`When order doesn't matter (choosing, not arranging), count pairs by listing 5+4+3+2+1 rather than multiplying.`,marks:5},{id:`mock-07-q20`,testId:7,number:20,topic:`Challenge Problems`,subtopic:`Choosing groups (combinations)`,difficulty:`Challenging`,question:`You have 5 books. How many different ways can you choose 3 books?`,diagram:null,choices:[{id:`A`,text:`8`},{id:`B`,text:`9`},{id:`C`,text:`10`},{id:`D`,text:`12`}],correctAnswer:`C`,explanationSteps:[`Choosing 3 books to take is the same as choosing 2 books to leave behind.`,`Choosing 2 from 5 gives 4+3+2+1 = 10 ways (using the pairing method).`,`So there are 10 different ways to choose 3 books from 5.`],commonMistake:`Choosing B) 9 by miscounting the pairs when listing possibilities, missing one combination.`,quickTip:`Choosing 3 out of 5 gives the same count as choosing 2 out of 5 (the ones left out) — pick whichever is easier to count.`,marks:5},{id:`mock-07-q21`,testId:7,number:21,topic:`Word Problems and Reasoning`,subtopic:`Likelihood and chance`,difficulty:`Challenging`,question:`A bag has 2 red balls, 5 blue balls, and 3 green balls. Which color is most likely to be picked?`,diagram:null,choices:[{id:`A`,text:`Red`},{id:`B`,text:`Blue`},{id:`C`,text:`Green`},{id:`D`,text:`Red and green are equally likely`}],correctAnswer:`B`,explanationSteps:[`Count the balls of each color: 2 red, 5 blue, 3 green.`,`The color with the most balls is the most likely to be picked.`,`Blue has the most balls (5), so blue is most likely.`],commonMistake:`Choosing D) by noticing red and green are different numbers (2 and 3) but incorrectly assuming they are equally likely, or forgetting to compare against blue at all.`,quickTip:`The color that appears the most times in the bag is always the most likely to be picked.`,marks:5},{id:`mock-07-q22`,testId:7,number:22,topic:`Word Problems and Reasoning`,subtopic:`Probability with dice`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a prime number?`,diagram:null,choices:[{id:`A`,text:`1 out of 6`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 2`},{id:`D`,text:`2 out of 3`}],correctAnswer:`C`,explanationSteps:[`The prime numbers between 1 and 6 are 2, 3, and 5 — that's 3 numbers.`,`3 out of 6 possible numbers simplifies to 1 out of 2.`],commonMistake:`Choosing B) 1 out of 3 by forgetting that 2 counts as a prime number, or missing one of the primes when listing them.`,quickTip:`Remember: 1 is not a prime number, but 2, 3, and 5 are — list the primes carefully before counting.`,marks:5},{id:`mock-07-q23`,testId:7,number:23,topic:`Number Skills`,subtopic:`Comparing numbers (true or false)`,difficulty:`Challenging`,question:`Which statement is true?`,diagram:null,choices:[{id:`A`,text:`3,809 is greater than 3,890`},{id:`B`,text:`5,040 is less than 5,004`},{id:`C`,text:`2,999 is greater than 2,909`},{id:`D`,text:`4,120 is less than 4,102`}],correctAnswer:`C`,explanationSteps:[`Check each statement by comparing digit by digit.`,`3,809 is less than 3,890 (A is false); 5,040 is greater than 5,004 (B is false); 4,120 is greater than 4,102 (D is false).`,`2,999 is greater than 2,909, since the hundreds digit 9 is bigger than 9... compare tens digit: 2,999 has 9 tens, 2,909 has 0 tens, so C is true.`],commonMistake:`Choosing A) by assuming a number with more digits appearing 'later' in writing order is automatically greater, without comparing digit by digit.`,quickTip:`Compare numbers place by place from the left (thousands, hundreds, tens, ones) — do not guess from appearance.`,marks:5},{id:`mock-07-q24`,testId:7,number:24,topic:`Word Problems and Reasoning`,subtopic:`Working backwards`,difficulty:`Challenging`,question:`Kira has some marbles. After buying 8 more marbles, she has 27 marbles. How many marbles did she have at first?`,diagram:null,choices:[{id:`A`,text:`17`},{id:`B`,text:`18`},{id:`C`,text:`19`},{id:`D`,text:`20`}],correctAnswer:`C`,explanationSteps:[`She ends with 27 marbles after buying 8 more.`,`To find the starting amount, undo the addition: 27 − 8 = 19.`,`So Kira had 19 marbles at first.`],commonMistake:`Choosing A) 17 by subtracting 10 instead of 8 by mistake.`,quickTip:`To work backwards from a final total, undo the last action — if marbles were added, subtract them back out.`,marks:5},{id:`mock-07-q25`,testId:7,number:25,topic:`Patterns and Operations`,subtopic:`Doubling sequences`,difficulty:`Challenging`,question:`Look at the pattern. 3, 6, 12, 24, 48, ____`,diagram:null,choices:[{id:`A`,text:`72`},{id:`B`,text:`84`},{id:`C`,text:`96`},{id:`D`,text:`100`}],correctAnswer:`C`,explanationSteps:[`Check how each number changes: 3→6 is ×2, 6→12 is ×2, 12→24 is ×2, 24→48 is ×2.`,`Each number doubles the one before it.`,`48 × 2 = 96.`],commonMistake:`Choosing A) 72 by adding 24 (the previous gap) instead of doubling 48.`,quickTip:`Check whether a pattern grows by adding the same amount or by multiplying — try both before picking an answer.`,marks:5},{id:`mock-07-q26`,testId:7,number:26,topic:`Patterns and Operations`,subtopic:`Sequences with an increasing decrease`,difficulty:`Challenging`,question:`Which number should replace the question mark? 50, 46, 41, 35, 28, ?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`21`},{id:`C`,text:`22`},{id:`D`,text:`23`}],correctAnswer:`A`,explanationSteps:[`Find the gaps between the numbers: −4, −5, −6, −7.`,`The amount subtracted increases by 1 each time, so the next gap is −8.`,`28 − 8 = 20.`],commonMistake:`Choosing D) 23 by subtracting 5 again instead of continuing the pattern of the gap growing by 1 each time.`,quickTip:`When a sequence decreases, check whether the amount being subtracted is also changing — write out the gaps to see the pattern clearly.`,marks:5},{id:`mock-07-q27`,testId:7,number:27,topic:`Geometry and Measurement`,subtopic:`Comparing perimeters`,difficulty:`Olympiad`,question:`A square has side length 8 cm. A rectangle has length 10 cm and width 6 cm. How much greater is the perimeter of the rectangle than the perimeter of the square?`,diagram:null,choices:[{id:`A`,text:`0 cm`},{id:`B`,text:`2 cm`},{id:`C`,text:`4 cm`},{id:`D`,text:`6 cm`}],correctAnswer:`A`,explanationSteps:[`Perimeter of the square: 4 × 8 = 32 cm.`,`Perimeter of the rectangle: 2 × (10 + 6) = 2 × 16 = 32 cm.`,`Both perimeters are 32 cm, so the difference is 0 cm.`],commonMistake:`Choosing C) 4 cm by comparing only the side lengths (10 − 8 = 2, or similar) instead of correctly calculating both full perimeters first.`,quickTip:`Always calculate both perimeters completely before comparing them — don't assume a bigger rectangle side means a bigger perimeter.`,marks:5},{id:`mock-07-q28`,testId:7,number:28,topic:`Number Skills`,subtopic:`Number clues (odd numbers and divisibility)`,difficulty:`Olympiad`,question:`Which number fits all the clues? It is an odd number, greater than 200, less than 220, and divisible by 5.`,diagram:null,choices:[{id:`A`,text:`205`},{id:`B`,text:`210`},{id:`C`,text:`214`},{id:`D`,text:`218`}],correctAnswer:`A`,explanationSteps:[`A number divisible by 5 ends in 0 or 5, but an odd number cannot end in 0, so it must end in 5.`,`Only 205 ends in 5 among the choices.`,`Check: 205 is greater than 200, less than 220, odd, and divisible by 5 — it fits every clue.`],commonMistake:`Choosing B) 210 by only checking that it is divisible by 5 and forgetting that it must also be odd (210 is even).`,quickTip:`When a number must be odd AND divisible by 5, it must end in 5, not 0.`,marks:5},{id:`mock-07-q29`,testId:7,number:29,topic:`Patterns and Operations`,subtopic:`Alternating patterns`,difficulty:`Olympiad`,question:`Look at the pattern. 2, 5, 4, 7, 6, 9, 8, ____`,diagram:null,choices:[{id:`A`,text:`9`},{id:`B`,text:`10`},{id:`C`,text:`11`},{id:`D`,text:`12`}],correctAnswer:`C`,explanationSteps:[`Look at the gaps between the numbers: +3, −1, +3, −1, +3, −1.`,`The pattern repeats: add 3, then subtract 1, over and over.`,`After 8, the next step is +3, so 8 + 3 = 11.`],commonMistake:`Choosing B) 10 by expecting a subtract-1 step next instead of recognizing the repeating pattern is back at the +3 step.`,quickTip:`For patterns that go up and down, write out the repeating rule (like +3, −1, +3, −1) so you know exactly which step comes next.`,marks:5},{id:`mock-07-q30`,testId:7,number:30,topic:`Word Problems and Reasoning`,subtopic:`Money and change`,difficulty:`Olympiad`,question:`Mali has 3 ten-baht coins, 4 five-baht coins, and 6 one-baht coins. She buys a toy for 47 baht. How much money does she have left?`,diagram:null,choices:[{id:`A`,text:`7 baht`},{id:`B`,text:`8 baht`},{id:`C`,text:`9 baht`},{id:`D`,text:`10 baht`}],correctAnswer:`C`,explanationSteps:[`Find the total money: 3 × 10 = 30 baht, 4 × 5 = 20 baht, 6 × 1 = 6 baht.`,`Add them together: 30 + 20 + 6 = 56 baht.`,`Subtract the cost of the toy: 56 − 47 = 9 baht left.`],commonMistake:`Choosing D) 10 baht by miscounting the coin total as 57 baht instead of correctly adding to 56 baht.`,quickTip:`Add up each type of coin separately first (tens, fives, ones), then combine before subtracting the cost.`,marks:5}],8:[{id:`mock-08-q01`,testId:8,number:1,topic:`Word Problems and Reasoning`,subtopic:`Multi-step Addition and Subtraction`,difficulty:`Accessible`,question:`Kian has 56 buttons. He uses 18 buttons for a craft project, buys 9 more buttons, and then gives 11 buttons to his friend. How many buttons does he have now?`,diagram:null,choices:[{id:`A`,text:`34`},{id:`B`,text:`35`},{id:`C`,text:`36`},{id:`D`,text:`37`}],correctAnswer:`C`,explanationSteps:[`Start with 56 buttons and take away the 18 used: 56 - 18 = 38.`,`He buys 9 more: 38 + 9 = 47.`,`He gives away 11: 47 - 11 = 36 buttons left.`],commonMistake:`Choice D (37) comes from subtracting only 10 instead of 11 in the last step (47 - 10 = 37).`,quickTip:`Do one step at a time and write down each new total before moving to the next step.`,marks:5},{id:`mock-08-q02`,testId:8,number:2,topic:`Patterns and Operations`,subtopic:`Number Patterns`,difficulty:`Accessible`,question:`Which number should come next? 3, 8, 15, 24, 35, ____`,diagram:null,choices:[{id:`A`,text:`44`},{id:`B`,text:`46`},{id:`C`,text:`47`},{id:`D`,text:`48`}],correctAnswer:`D`,explanationSteps:[`Find the gaps between the numbers: 5, 7, 9, 11.`,`The gaps go up by 2 each time, so the next gap is 13.`,`Add 13 to 35: 35 + 13 = 48.`],commonMistake:`Choice C (47) comes from assuming the gap stays at 11 instead of growing to 13.`,quickTip:`Look at how much the gap itself grows each time - it follows its own patt

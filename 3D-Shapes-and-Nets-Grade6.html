/* ===== 3D Shapes and Nets: "box workshop" theme ===== */
:root {
  --ink: #1C2230; --paper: #FFF4E0; --card: #FFFDF7; --yellow: #FFC933; --blue: #2F86DE; --tomato: #F0543C;
  --kraft: #E9C48C; --green: #1E9E4A; --crimson: #B0172E; --mat: #2F5E9E; --line: 2.5px;
  --f: "Lexend", "Segoe UI", Roboto, Arial, sans-serif; --h: "Poppins", "Lexend", "Segoe UI", Arial, sans-serif; --th: "Sarabun", "Lexend", sans-serif;
}
* { box-sizing: border-box; border-radius: 0 !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 17px; line-height: 1.5; font-weight: 400; -webkit-font-smoothing: antialiased; }
body { background-image: linear-gradient(rgba(28,34,48,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(28,34,48,.055) 1px, transparent 1px); background-size: 34px 34px; }
button { font-family: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0 0 .35em; line-height: 1.15; font-family: var(--h); font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 3.6vw, 50px); }
h2 { font-size: clamp(21px, 2.2vw, 30px); }
h3 { font-size: 21px; }
h4 { font-size: 17px; text-transform: none; }
p { margin: 0 0 .6em; }
.small { font-size: 15px; color: #444a58; }
.lead { font-size: 19px; font-weight: 600; }
.kicker { font-family: var(--h); font-weight: 600; font-size: 17px; color: var(--tomato); margin-bottom: .2em; }
.warn { color: var(--crimson); font-weight: 800; }
.okt { color: var(--green); font-weight: 800; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
[hidden] { display: none !important; }

/* ---- display font for buttons, numbers and labels ---- */
.btn, .chip, .segb, .tnum, .qn, .qs, #crumb, .olet, .fbh, .score, .numdisp, .key, .dot, .mchip, .tapcount, .pct, .stv, .choice b, .rvm, .pindisp, .tile h3, .vcount b, .steptag, .tr .tn, .nb-tl, .slab { font-family: var(--h); }
.btn, .chip, .segb, .mchip { font-weight: 600; letter-spacing: 0; }
.ltext b, .words dt, .rule ul, .vcount b { font-weight: 600; }
strong, b { font-weight: 600; }
.qprompt { font-weight: 600; }
.opt { font-weight: 400; }
.tip .th { font-family: var(--th); font-weight: 500; font-size: 18px; }

/* ---- app shell ---- */
#app { display: flex; flex-direction: column; }
#bar { display: flex; align-items: center; gap: 12px; padding: 7px 14px; background: var(--card); border-bottom: var(--line) solid var(--ink); min-height: 60px; flex: none; }
.logo-s { height: 44px; width: auto; display: block; }
#crumb { flex: 1; min-width: 0; font-weight: 800; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barbtns { display: flex; gap: 8px; align-items: center; }
#timer { font-weight: 800; font-size: 20px; padding: 4px 10px; border: var(--line) solid var(--ink); background: #fff; font-variant-numeric: tabular-nums; }
#timer.low { background: var(--crimson); color: #fff; }
#main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#main > * { height: 100%; }

/* ---- buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; padding: 8px 16px; font-size: 17px; font-weight: 800; background: #fff; border: var(--line) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--ink); }
.btn.go { background: var(--yellow); }
.btn.big { font-size: 21px; min-height: 58px; padding: 10px 28px; box-shadow: 5px 5px 0 var(--ink); }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 16px; }
.btn.tool { min-height: 42px; padding: 6px 12px; font-size: 15.5px; box-shadow: 2px 2px 0 var(--ink); }
.btn.tool.on, .btn.on { background: var(--blue); color: #fff; }
.btn.sq { width: 44px; padding: 0; }
.btn.mini { min-height: 36px; width: 36px; padding: 0; box-shadow: 2px 2px 0 var(--ink); font-size: 20px; }
.btn.danger { background: #fff; color: var(--crimson); border-color: var(--crimson); box-shadow: 3px 3px 0 var(--crimson); }
.ico { width: 20px; height: 20px; flex: none; }
#bar .btn { min-height: 42px; padding: 6px 11px; font-size: 15px; }

/* ---- start ---- */
.start { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 24px; padding: clamp(16px, 3vw, 44px); align-items: center; }
.start-l { max-width: 600px; }
.logo-big { width: min(300px, 58%); height: auto; display: block; margin-bottom: 18px; }
.start h1 { font-size: clamp(38px, 5.4vw, 76px); margin-bottom: .2em; }
.start .lead { margin-bottom: 1.1em; max-width: 30em; }
.start-vis { height: min(78vh, 640px); min-height: 280px; background: var(--card); border: var(--line) solid var(--ink); box-shadow: 7px 7px 0 var(--ink); position: relative; display: flex; }
.start-vis .viewer { border: 0; box-shadow: none; flex: 1; }
.start .topbtns { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }

/* ---- pages ---- */
.page { overflow-y: auto; padding: clamp(14px, 2.4vw, 30px); }
.hello { margin: 0 0 16px; }
.hello h1 { margin-bottom: .15em; }
.card { background: var(--card); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.card.pad { padding: 16px 18px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; padding-bottom: 26px; }
.tile { display: flex; background: var(--card); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink); min-height: 150px; }
.tnum { width: 66px; flex: none; background: var(--tc); color: #fff; font-weight: 800; font-size: 34px; display: flex; align-items: flex-start; justify-content: center; padding-top: 14px; border-right: var(--line) solid var(--ink); }
.tile.test .tnum { color: var(--yellow); }
.tbody { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; }
.tbody h3 { font-size: 20px; margin-bottom: .15em; }
.tsub { font-size: 15px; color: #4a5060; margin-bottom: .35em; }
.tstat { font-size: 14.5px; font-weight: 700; color: #4a5060; margin-top: auto; }
.tstat .done { color: var(--green); }
.tile .row { margin-top: 6px; }

/* ---- learn ---- */
.learn { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(340px, 1fr); gap: 16px; padding: 14px; }
.lvis { min-height: 0; display: flex; flex-direction: column; }
.lside { min-height: 0; overflow-y: auto; background: var(--card); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 16px 18px; }
.ltext { font-size: 18px; margin-bottom: 12px; }
.ltext b { background: #FFE7A3; padding: 0 3px; }
.lextra:empty { display: none; }
.lextra { margin-bottom: 12px; }
.nav { margin: 6px 0 12px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.dot { width: 34px; height: 34px; border: 2px solid var(--ink); background: #fff; font-weight: 800; font-size: 14px; cursor: pointer; }
.dot.on { background: var(--ink); color: #fff; }
.words, .rule { padding: 12px 14px; margin-bottom: 12px; box-shadow: 3px 3px 0 var(--ink); }
.words { background: #EAF4FF; }
.rule { background: #FFF1C2; }
.words dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 15.5px; }
.words dt { font-weight: 800; }
.words dd { margin: 0; }
.rule ul { margin: 0; padding-left: 20px; font-size: 16px; }
.objs { margin-top: 10px; font-size: 16.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0; }
.chip { border: 2px solid var(--ink); background: #fff; font-weight: 800; font-size: 15px; padding: 7px 11px; min-height: 40px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); touch-action: manipulation; }
.chip.on { background: var(--ink); color: #fff; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; min-height: 0; }
.thumbs4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0; }
.thumbs4 figure { margin: 0; text-align: center; border: 2px solid var(--ink); background: #fff; padding: 6px; }
.thumbs4 figcaption { font-weight: 800; font-size: 14px; }
.thumb { width: 100%; height: auto; display: block; aspect-ratio: 11 / 9; object-fit: contain; }
.ctable { border-collapse: collapse; width: 100%; font-size: 14.5px; background: #fff; }
.ctable th, .ctable td { border: 1.5px solid var(--ink); padding: 4px 6px; text-align: center; }
.ctable th { background: var(--ink); color: #fff; font-size: 13px; }
.ctable td:first-child { text-align: left; font-weight: 800; }
.ctable tr.cur td { background: #FFE7A3; }
.tscroll { max-height: 330px; overflow: auto; margin-top: 8px; }
.netgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 8px; max-height: 360px; overflow-y: auto; padding: 2px 4px 6px 2px; }
.netbtn { background: #fff; border: 2px solid var(--ink); padding: 6px; cursor: pointer; position: relative; box-shadow: 2px 2px 0 var(--ink); touch-action: manipulation; }
.netbtn svg { width: 100%; height: 70px; display: block; }
.netbtn span { position: absolute; top: 2px; left: 4px; font-weight: 800; font-size: 13px; }
.netbtn.on { background: #FFE7A3; }
.netbtn.bad { border-color: var(--crimson); }
.opps { margin-top: 10px; font-size: 17px; }
.svgcard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; padding: 14px; overflow: hidden; }
.svgcard svg { width: 100%; height: 100%; max-height: 100%; min-height: 0; flex: 1; }
.svgcard .cap { font-size: 15px; font-weight: 700; margin: 8px 0 0; flex: none; }
.netsvg text { font-family: var(--f); fill: var(--ink); }
.netsvg .nlet { font-weight: 800; }
.netsvg .ntxt { font-weight: 800; }

/* ---- viewer ---- */
.viewer { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--card); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.vcount { padding: 8px 12px; border-bottom: 2px solid var(--ink); font-size: 17px; min-height: 44px; background: #fff; }
.vcount b { font-weight: 800; }
.vcount .cv { color: #9A4A00; }
.vcount .sep { color: #888; margin: 0 4px; }
.vcount .small { display: block; font-size: 14.5px; }
.vstage { flex: 1; min-height: 180px; position: relative; overflow: hidden; background: #FFFBF2; }
.stage-cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
.stage-cv:active { cursor: grabbing; }
.vtools { display: flex; flex-wrap: wrap; gap: 7px; padding: 8px 10px; border-top: 2px solid var(--ink); background: var(--card); }
.vtools:empty { display: none; }
.srow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 2px solid var(--ink); background: #fff; }
.slab { font-weight: 800; font-size: 15px; white-space: nowrap; }
.pct { font-weight: 800; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
.slider { flex: 1; min-width: 80px; height: 36px; accent-color: var(--blue); touch-action: none; }
.viewer.bare .srow, .viewer.bare .vtools { background: var(--card); }
.buildrow { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 10px; border-top: 2px solid var(--ink); align-items: center; background: #fff; }
.stepper { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; }
.stv { min-width: 22px; text-align: center; font-size: 19px; }
.mvis { height: 100%; display: flex; flex-direction: column; }

/* ---- net builder ---- */
.nb { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--card); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.nb-board { flex: 1; min-height: 170px; display: flex; padding: 8px; background: #FFFBF2; }
.nb-svg { width: 100%; height: 100%; touch-action: none; display: block; }
.nb-svg .mat { fill: var(--mat); }
.nb-svg .matgrid { stroke: #6E95CE; stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; opacity: .6; }
.pc { stroke: var(--ink); stroke-width: 2.4; vector-effect: non-scaling-stroke; stroke-linejoin: round; cursor: grab; }
.pc.ghost { opacity: .6; pointer-events: none; }
.pc.snap { fill: #fff !important; opacity: .45; stroke-dasharray: 5 4; pointer-events: none; }
.nb-fold { flex: 1; min-height: 170px; display: flex; }
.nb-fold .viewer { border: 0; box-shadow: none; }
.nb-traywrap { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 2px solid var(--ink); background: #fff; }
.nb-tl { font-weight: 800; font-size: 15px; }
.nb-tray { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.tr-it { width: 70px; height: 56px; border: 2px solid var(--ink); background: #FFFBF2; display: flex; align-items: center; justify-content: center; padding: 4px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.tr-it.used { opacity: .25; cursor: default; }
.trsvg { width: 100%; height: 100%; pointer-events: none; }

/* ---- quiz ---- */
.quiz { display: flex; flex-direction: column; }
.qhead { display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex: none; }
.qn { font-weight: 800; font-size: 18px; white-space: nowrap; }
.qs { font-weight: 800; white-space: nowrap; }
.pbar { flex: 1; height: 14px; border: 2px solid var(--ink); background: #fff; min-width: 60px; }
.pbar i { display: block; height: 100%; background: var(--yellow); transition: width .3s; }
.qbody { flex: 1; min-height: 0; padding: 0 14px 14px; }
.qprompt { font-size: 21px; font-weight: 800; margin-bottom: 14px; line-height: 1.35; }
.hint { background: #FFF1C2; border: 2px solid var(--ink); padding: 8px 12px; font-weight: 700; margin: 10px 0 0; }
.opts { display: grid; gap: 10px; }
.opts.grid { grid-template-columns: 1fr 1fr; }
.opts.tf { grid-template-columns: 1fr 1fr; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: var(--line) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 10px 12px; min-height: 56px; font-size: 18px; font-weight: 700; cursor: pointer; position: relative; touch-action: manipulation; }
.opt:hover:not(:disabled) { background: #FFF8E1; }
.opt:disabled { cursor: default; }
.opts.grid .opt { flex-direction: column; align-items: stretch; padding: 8px; }
.olet { flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: #fff; font-weight: 800; font-size: 16px; }
.olet:empty { display: none; }
.opts.grid .olet { position: absolute; top: 6px; left: 6px; }
.otx { flex: 1; }
.netwrap { display: block; }
.netwrap svg { width: 100%; height: 130px; display: block; }
.omark { font-weight: 800; font-size: 14.5px; white-space: nowrap; }
.omark:empty { display: none; }
.opt.sel { background: #DCEBFF; box-shadow: 0 0 0 var(--ink); transform: translate(3px, 3px); }
.opt.right { background: #E3F6EA; border-color: var(--green); box-shadow: 3px 3px 0 var(--green); transform: none; }
.opt.right .omark { color: var(--green); }
.opt.right .olet { background: var(--green); }
.opt.wrong { background: #FBE7EA; border-color: var(--crimson); box-shadow: 3px 3px 0 var(--crimson); transform: none; }
.opt.wrong .omark { color: var(--crimson); }
.opt.wrong .olet { background: var(--crimson); }
.opts.grid .omark { text-align: center; }
.numdisp { display: flex; align-items: center; gap: 10px; border: var(--line) solid var(--ink); background: #fff; padding: 8px 14px; min-height: 60px; font-size: 30px; font-weight: 800; margin-bottom: 10px; flex-wrap: wrap; }
.numdisp .nv { min-width: 40px; font-variant-numeric: tabular-nums; }
.numdisp .nu { font-size: 22px; color: #4a5060; }
.numdisp .nmark { font-size: 15px; margin-left: auto; }
.numdisp.right { border-color: var(--green); background: #E3F6EA; color: #0F5E2C; }
.numdisp.wrong { border-color: var(--crimson); background: #FBE7EA; color: #7A0F20; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 340px; margin-bottom: 10px; }
.keypad .key { min-height: 52px; font-size: 22px; box-shadow: 2px 2px 0 var(--ink); }
.keypad.off { opacity: .4; pointer-events: none; }
.keypad.pin { margin: 12px auto; }
.check { min-width: 160px; }
.qfb:empty { display: none; }
.qfb { margin-top: 14px; padding: 12px 14px; border: var(--line) solid var(--ink); background: #fff; }
.qfb.ok { border-color: var(--green); border-left-width: 10px; background: #EEF9F2; }
.qfb.no { border-color: var(--crimson); border-left-width: 10px; background: #FDF0F2; }
.qfb.saved { font-weight: 700; color: #2c3240; background: #EAF4FF; border-color: var(--blue); }
.fbh { font-weight: 800; font-size: 21px; margin-bottom: 4px; }
.qfb.ok .fbh { color: var(--green); }
.qfb.no .fbh { color: var(--crimson); }
.fba { font-size: 17px; }
.steps { margin: 6px 0 0; padding-left: 0; list-style: none; font-size: 16.5px; }
.steps li { margin: 3px 0; }
.tapcount { font-weight: 800; font-size: 19px; }
.mrows { display: grid; gap: 8px; margin-bottom: 12px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) auto; gap: 8px; align-items: center; }
.mleft { font-weight: 800; font-size: 17px; }
.mslot { min-height: 46px; border: 2.5px dashed var(--ink); background: #fff; font-weight: 800; font-size: 15.5px; padding: 4px 8px; cursor: pointer; color: #777; touch-action: manipulation; }
.mslot.full { border-style: solid; color: var(--ink); background: #FFF1C2; }
.mrow.right .mslot { background: #E3F6EA; border-color: var(--green); }
.mrow.wrong .mslot { background: #FBE7EA; border-color: var(--crimson); }
.mmark { font-weight: 800; font-size: 14.5px; }
.mrow.right .mmark { color: var(--green); }
.mrow.wrong .mmark { color: var(--crimson); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 50px; margin-bottom: 12px; padding: 8px; border: 2px solid var(--ink); background: #FFFBF2; }
.mchip { border: 2px solid var(--ink); background: var(--yellow); font-weight: 800; font-size: 16px; padding: 8px 12px; min-height: 44px; cursor: grab; touch-action: none; box-shadow: 2px 2px 0 var(--ink); user-select: none; -webkit-user-select: none; }
.mchip.sel { background: var(--blue); color: #fff; }
.ghostchip { position: fixed; z-index: 99; pointer-events: none; transform: translate(-50%, -50%); }
.done { height: 100%; overflow-y: auto; padding: 4px 2px 30px; max-width: 980px; margin: 0 auto; }
.big-score { padding: 22px; text-align: center; margin-bottom: 20px; }
.big-score .score { font-size: clamp(48px, 7vw, 84px); font-weight: 800; line-height: 1; margin: 6px 0 10px; }
.big-score .row { justify-content: center; }
.review { display: grid; gap: 12px; }
.rv { padding: 12px 14px; box-shadow: 3px 3px 0 var(--ink); }
.rv.ok { border-left: 10px solid var(--green); }
.rv.no { border-left: 10px solid var(--crimson); }
.rvh { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
.rvt { color: #4a5060; font-size: 14.5px; font-weight: 700; flex: 1; }
.rvm { font-weight: 800; }
.rv.ok .rvm { color: var(--green); }
.rv.no .rvm { color: var(--crimson); }
.rvq { font-weight: 800; }
.setup { max-width: 760px; margin: 0 auto; padding: 22px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.choice { border: var(--line) solid var(--ink); background: #fff; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font-size: 16px; box-shadow: 3px 3px 0 var(--ink); }
.choice b { font-size: 19px; }
.choice.on { background: #FFF1C2; outline: 3px solid var(--ink); }
.trow { display: grid; grid-template-columns: minmax(150px, 1.4fr) minmax(80px, 2fr) 54px auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1.5px solid #ddd; }
.trow .tn { font-weight: 800; }
.tbar { height: 18px; border: 2px solid var(--ink); background: #fff; }
.tbar i { display: block; height: 100%; }

/* ---- modal ---- */
#modal { position: fixed; inset: 0; background: rgba(28, 34, 48, .55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 14px; }
.mbox { background: var(--card); border: var(--line) solid var(--ink); box-shadow: 7px 7px 0 var(--ink); width: min(520px, 100%); max-height: 100%; display: flex; flex-direction: column; }
.mbox.wide { width: min(1100px, 100%); height: min(860px, 100%); }
.mhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: var(--line) solid var(--ink); }
.mhead h2 { flex: 1; margin: 0; font-size: 22px; }
.mbody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
.mbody.noscroll { overflow: hidden; display: flex; flex-direction: column; }
.pindisp { font-size: 34px; font-weight: 800; text-align: center; letter-spacing: .2em; }

/* ---- teacher ---- */
.teacher { display: flex; flex-direction: column; }
.ttabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px 8px; flex: none; }
.tab.on { background: var(--ink); color: #fff; }
.tbody2 { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px 20px; }
.tbody2.board { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 14px; overflow: hidden; padding-bottom: 14px; }
.bside { overflow-y: auto; background: var(--card); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 14px; min-height: 0; }
.bside .srow { border: 2px solid var(--ink); margin: 10px 0; }
.bstage { display: flex; min-height: 0; }
.modes { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.tog { display: flex; gap: 10px; align-items: center; font-weight: 700; border: 2px solid var(--ink); padding: 8px 10px; background: #fff; cursor: pointer; }
.tog input { width: 24px; height: 24px; accent-color: var(--blue); flex: none; }
.setrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1.5px solid #e3dccb; }
.setl { font-weight: 800; min-width: 250px; }
.seg { display: flex; flex-wrap: wrap; }
.segb { border: 2px solid var(--ink); background: #fff; font-weight: 800; font-size: 15.5px; padding: 8px 14px; min-height: 42px; cursor: pointer; margin-right: -2px; touch-action: manipulation; }
.segb.on { background: var(--ink); color: #fff; }
.pinin { font-family: var(--f); font-size: 18px; padding: 8px 10px; border: 2px solid var(--ink); width: 130px; }
.rtable { border-collapse: collapse; width: 100%; font-size: 15px; }
.rtable th, .rtable td { border: 1.5px solid var(--ink); padding: 5px 7px; text-align: left; vertical-align: top; }
.rtable th { background: var(--ink); color: #fff; }
.rtable tr.no td:last-child { color: var(--crimson); font-weight: 800; }
.rtable tr.ok td:last-child { color: var(--green); font-weight: 800; }
.tip .th { font-size: 17px; line-height: 1.7; }

/* ---- smaller screens: tablet portrait, phone ---- */
@media (max-width: 900px), (orientation: portrait) and (max-width: 1100px) {
  .learn { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.08fr) minmax(0, 1fr); padding: 10px; gap: 10px; }
  .tbody2.board { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .bside { max-height: 34vh; }
  .start { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); overflow-y: auto; gap: 16px; }
  .start-vis { height: auto; min-height: 260px; }
  .logo-big { width: 210px; margin-bottom: 8px; }
}
@media (max-width: 640px) {
  html, body { font-size: 16px; }
  #bar { padding: 5px 8px; gap: 6px; min-height: 52px; }
  .logo-s { height: 34px; }
  #crumb { font-size: 15px; }
  #bar .btn span { display: none; }
  #bar .btn { width: 42px; padding: 0; }
  .tiles { grid-template-columns: 1fr; gap: 12px; }
  .tnum { width: 52px; font-size: 28px; }
  .qprompt { font-size: 18px; }
  .opt { font-size: 16.5px; min-height: 50px; }

html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;touch-action:manipulation}

/* ---- livelier look ---- */
.parade { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 20px; }
.parade .thumb { width: 74px; background: #fff; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 2px; }
.parade .thumb:nth-child(3n+1) { background: #FFF1C2; } .parade .thumb:nth-child(3n+2) { background: #E3F1FF; } .parade .thumb:nth-child(3n) { background: #FFE3DC; }

.thead { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }

.tprog i { display: block; height: 100%; background: var(--tc); }
.tile { transition: transform .12s, box-shadow .12s; }
.tile:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.steptag { display: inline-flex; align-items: center; gap: 8px; background: var(--tc); color: #fff; font-weight: 600; font-size: 15px; padding: 4px 12px; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); margin-bottom: 10px; }

@media (max-width: 640px) { .parade .thumb { width: 58px; } .tpic, .tpic svg { width: 58px; } .hero { padding: 14px; } }

/* ===== question screen: two balanced panels and a fixed footer, all on one screen ===== */
.qhead { display: flex; align-items: center; gap: 12px; padding: 10px 14px 8px; }
.qhead .qn { white-space: nowrap; font-size: 16px; }
.qhead .qs { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 15px; }
.qhead .fin { flex: none; }
.qstrip { flex: 1; min-width: 0; display: flex; gap: 5px; overflow-x: auto; padding: 3px 3px 6px; scrollbar-width: thin; touch-action: pan-x; overscroll-behavior: contain; justify-content: safe center; }
.qnum { flex: none; width: 36px; height: 36px; border: 2px solid var(--ink); background: #fff; font-family: var(--h); font-weight: 600; font-size: 15px; cursor: pointer; touch-action: manipulation; padding: 0; }
.qnum:hover { background: #FFF8E1; }
.qnum.cur { outline: 3px solid var(--blue); outline-offset: 1px; }

.qbody { flex: 1; min-height: 0; padding: 0 14px 12px; overflow: hidden; }

.qfoot { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; background: var(--card); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 8px 12px; }
.qfoot .grow { flex: 1; }
.qfoot .row { flex-wrap: nowrap; }
.qfoot .navb { min-width: 128px; }
.qfoot .nextb.skip { background: #fff; }
.qprompt { display: flex; gap: 12px; align-items: flex-start; font-size: calc(21px * var(--k)); margin-bottom: calc(14px * var(--k)); line-height: 1.35; }
.qno { flex: none; min-width: calc(40px * var(--k)); height: calc(40px * var(--k)); display: flex; align-items: center; justify-content: center; background: var(--ink); color: #fff; font-family: var(--h); font-weight: 700; font-size: calc(18px * var(--k)); padding: 0 6px; margin-top: -2px; }

.qwrap .netwrap svg { height: calc(128px * var(--k)); }
.qwrap .numdisp { min-height: calc(58px * var(--k)); font-size: calc(30px * var(--k)); padding: calc(6px * var(--k)) 14px; margin-bottom: calc(10px * var(--k)); }
.qwrap .keypad { gap: calc(8px * var(--k)); margin-bottom: calc(10px * var(--k)); }

    let t = (rp ? 'rectangular prism' : 'cuboid') + (pl ? 's' : '');
    if (c === 'C') t = t[0].toUpperCase() + t.slice(1);

function h(tag, attrs, ...kids) {

    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = W(v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) e.style.setProperty(sk, v[sk]); else e.style[sk] = v[sk]; } }

    e.append(c.nodeType ? c : document.createTextNode(W(String(c))));

}

const Snd = {

/* ===== 3D geometry: vectors, solid models, shape catalogue ===== */
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]
};
function newell(P) {
  const n = [0, 0, 0];
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    n[0] += (a[1] - b[1]) * (a[2] + b[2]); n[1] += (a[2] - b[2]) * (a[0] + b[0]); n[2] += (a[0] - b[0]) * (a[1] + b[1]);
  }

}
function cen(P) { const c = [0, 0, 0]; P.forEach(p => { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; }); return v3.mul(c, 1 / P.length); }
/* rigid transforms {R:[9], t:[3]} */
const IDENT = { R: [1, 0, 0, 0, 1, 0, 0, 0, 1], t: [0, 0, 0] };
function mulRv(R, p) { return [R[0] * p[0] + R[1] * p[1] + R[2] * p[2], R[3] * p[0] + R[4] * p[1] + R[5] * p[2], R[6] * p[0] + R[7] * p[1] + R[8] * p[2]]; }

/* ---- model building ---- */
function buildModel(o) {
  const m = Object.assign({ convex: true, labels: [] }, o);
  // centre on bounding box
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  m.verts.forEach(p => { for (let k = 0; k < 3; k++) { mn[k] = Math.min(mn[k], p[k]); mx[k] = Math.max(mx[k], p[k]); } });
  const c0 = v3.mul(v3.add(mn, mx), 0.5);
  m.verts = m.verts.map(p => v3.sub(p, c0));
  m.labels = (m.labels || []).map(L => Object.assign({}, L, { a: v3.sub(L.a, c0), b: v3.sub(L.b, c0) }));
  m.size = v3.sub(mx, mn);
  m.radius = Math.max(...m.verts.map(v3.len));
  const avg = cen(m.verts);
  m.faces.forEach(f => {
    const P = f.v.map(i => m.verts[i]);
    let n = newell(P); const fc = cen(P);
    if (f.n) { if (v3.dot(n, f.n) < 0) { f.v.reverse(); n = v3.mul(n, -1); } }
    else if (m.convex && v3.dot(n, v3.sub(fc, avg)) < 0) { f.v.reverse(); n = v3.mul(n, -1); }
    f.n = n; f.c = fc;
  });
  // edges
  const E = new Map();
  m.faces.forEach((f, fi) => f.v.forEach((a, k) => {
    const b = f.v[(k + 1) % f.v.length], key = a < b ? a + '_' + b : b + '_' + a;
    if (!E.has(key)) E.set(key, { a: Math.min(a, b), b: Math.max(a, b), f: [] });
    E.get(key).f.push(fi);
  }));
  m.edges = [...E.values()];
  const G = m.groups;
  m.groupFaces = {}; m.faces.forEach((f, i) => (m.groupFaces[f.g] = m.groupFaces[f.g] || []).push(i));
  m.feature = []; m.silh = []; m.countEdges = []; const rims = {};
  m.edges.forEach(e => {
    if (e.f.length < 2) { m.feature.push(e); return; }
    const g1 = m.faces[e.f[0]].g, g2 = m.faces[e.f[1]].g;
    if (g1 !== g2) {
      m.feature.push(e);
      if (G[g1].kind === 'flat' && G[g2].kind === 'flat') m.countEdges.push(e);
      else { const k = [g1, g2].sort().join('|'); (rims[k] = rims[k] || []).push(e); }
    } else if (G[g1].kind === 'curved') m.silh.push(e);
  });
  m.rims = Object.values(rims);
  // countable vertices: where 3 or more flat faces meet, plus an apex given by the shape
  const vg = m.verts.map(() => new Set());
  m.faces.forEach(f => { if (G[f.g].kind === 'flat') f.v.forEach(i => vg[i].add(f.g)); });
  m.countVerts = [];
  vg.forEach((s, i) => { if (s.size >= 3) m.countVerts.push(i); });
  (m.apex || []).forEach(i => { if (!m.countVerts.includes(i)) m.countVerts.push(i); });
  const ang = p => Math.atan2(p[2], p[0]);
  m.countVerts.sort((i, j) => (m.verts[j][1] - m.verts[i][1]) || (ang(m.verts[i]) - ang(m.verts[j])));
  const mid = e => v3.mul(v3.add(m.verts[e.a], m.verts[e.b]), 0.5);
  m.countEdges.sort((e1, e2) => { const a = mid(e1), b = mid(e2); return (Math.round((b[1] - a[1]) * 100)) || (ang(a) - ang(b)); });
  m.flatGroups = m.groupOrder.filter(g => G[g].kind === 'flat');
  m.curvedGroups = m.groupOrder.filter(g => G[g].kind === 'curved');
  m.groupNormal = {};
  m.groupOrder.forEach(g => { const n = (m.groupFaces[g] || []).reduce((s, fi) => v3.add(s, m.faces[fi].n), [0, 0, 0]); m.groupNormal[g] = v3.len(n) > 0.3 ? v3.norm(n) : null; });
  return m;
}

/* axis-aligned box with shared vertices */
function boxModel(l, hgt, w, o = {}) {
  const x = l / 2, y = hgt / 2, z = w / 2;
  const verts = [[-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [-x, y, -z], [x, y, -z], [x, y, z], [-x, y, z]];
  const faces = [
    { v: [0, 1, 2, 3], g: 'bottom' }, { v: [4, 5, 6, 7], g: 'top' }, { v: [3, 2, 6, 7], g: 'front' },
    { v: [0, 1, 5, 4], g: 'back' }, { v: [0, 3, 7, 4], g: 'left' }, { v: [1, 2, 6, 5], g: 'right' }];
  const groups = {}; ['bottom', 'top', 'front', 'back', 'left', 'right'].forEach(g => groups[g] = { kind: 'flat', role: (g === 'top' || g === 'bottom') ? 'base' : 'face' });
  return buildModel(Object.assign({
    verts, faces, groups, groupOrder: ['top', 'front', 'right', 'back', 'left', 'bottom'],
    lat: [2, 5, 3, 4], bases: [0, 1], baseGroups: ['bottom', 'top'], kind: 'box'
  }, o));
}

/* prism from a 2D polygon, standing up (axis 'y') or lying (axis 'z') */
function prismModel(poly, depth, axis, o = {}) {
  const n = poly.length, verts = [];
  const P = (p, s) => axis === 'y' ? [p[0], s, p[1]] : [p[0], p[1], s];
  poly.forEach(p => verts.push(P(p, -depth / 2)));
  poly.forEach(p => verts.push(P(p, depth / 2)));
  const curved = !!o.curved, faces = [], groups = {}, order = [];
  const lat = [];
  for (let k = 0; k < n; k++) {
    const g = curved ? 'curved' : 'side' + k;
    faces.push({ v: [k, (k + 1) % n, n + (k + 1) % n, n + k], g }); lat.push(faces.length - 1);
    if (!groups[g]) { groups[g] = { kind: curved ? 'curved' : 'flat', role: curved ? 'curved' : 'face' }; }
  }
  faces.push({ v: [...Array(n).keys()], g: 'base1' });
  faces.push({ v: [...Array(n).keys()].map(i => n + i), g: 'base2' });
  groups.base1 = { kind: 'flat', role: 'base' }; groups.base2 = { kind: 'flat', role: 'base' };
  if (axis === 'y') order.push('base2'); else order.push('base1');
  if (curved) order.push('curved'); else for (let k = 0; k < n; k++) order.push('side' + k);
  order.push(axis === 'y' ? 'base1' : 'base2');
  return buildModel(Object.assign({ verts, faces, groups, groupOrder: order, lat, bases: [n, n + 1], baseGroups: ['base1', 'base2'], kind: curved ? 'cyl' : 'prism' }, o));
}
function regPoly(n, r, rot = 0) { const P = []; for (let k = 0; k < n; k++) { const a = rot + 2 * Math.PI * k / n; P.push([r * Math.cos(a), r * Math.sin(a)]); } return P; }

function pyramidModel(n, r, hgt, rot = 0, o = {}) {
  const verts = regPoly(n, r, rot).map(p => [p[0], -hgt / 2, p[1]]);
  verts.push([0, hgt / 2, 0]);
  const curved = !!o.curved, faces = [], groups = {}, order = [], lat = [];
  for (let k = 0; k < n; k++) {
    const g = curved ? 'curved' : 'side' + k;
    faces.push({ v: [k, (k + 1) % n, n], g }); lat.push(faces.length - 1);
    if (!groups[g]) { groups[g] = { kind: curved ? 'curved' : 'flat', role: curved ? 'curved' : 'face' }; order.push(g); }
  }
  faces.push({ v: [...Array(n).keys()], g: 'base' });
  groups.base = { kind: 'flat', role: 'base' }; order.push('base');
  return buildModel(Object.assign({ verts, faces, groups, groupOrder: order, lat, bases: [n], baseGroups: ['base'], apex: [n], kind: curved ? 'cone' : 'pyr' }, o));
}

function sphereModel(r, seg = 30, rings = 18) {
  const verts = [[0, r, 0]];
  for (let i = 1; i < rings; i++) { const ph = Math.PI * i / rings; for (let j = 0; j < seg; j++) { const th = 2 * Math.PI * j / seg; verts.push([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)]); } }
  verts.push([0, -r, 0]);
  const S0 = 1, last = verts.length - 1, faces = [];
  const id = (i, j) => S0 + (i - 1) * seg + ((j + seg) % seg);
  for (let j = 0; j < seg; j++) faces.push({ v: [0, id(1, j + 1), id(1, j)], g: 'curved' });
  for (let i = 1; i < rings - 1; i++) for (let j = 0; j < seg; j++) faces.push({ v: [id(i, j), id(i, j + 1), id(i + 1, j + 1), id(i + 1, j)], g: 'curved' });
  for (let j = 0; j < seg; j++) faces.push({ v: [last, id(rings - 1, j), id(rings - 1, j + 1)], g: 'curved' });
  return buildModel({ verts, faces, groups: { curved: { kind: 'curved', role: 'curved' } }, groupOrder: ['curved'], kind: 'sphere', baseGroups: [] });
}

/* composite: two cuboids side by side (an L-shaped step), non-convex */
function lModel(a, b, w, hA, hB, o = {}) {
  const verts = [], faces = [];
  const rect = (corners, g, n) => { const i0 = verts.length; corners.forEach(p => verts.push(p)); faces.push({ v: [i0, i0 + 1, i0 + 2, i0 + 3], g, n }); };
  const X0 = 0, X1 = a, X2 = a + b;
  const box = (x0, x1, hh, g, skipSide, upFrom) => {
    rect([[x0, 0, 0], [x1, 0, 0], [x1, 0, w], [x0, 0, w]], g, [0, -1, 0]);
    rect([[x0, hh, 0], [x1, hh, 0], [x1, hh, w], [x0, hh, w]], g, [0, 1, 0]);
    rect([[x0, 0, w], [x1, 0, w], [x1, hh, w], [x0, hh, w]], g, [0, 0, 1]);
    rect([[x0, 0, 0], [x1, 0, 0], [x1, hh, 0], [x0, hh, 0]], g, [0, 0, -1]);
    if (skipSide !== 'left') rect([[x0, 0, 0], [x0, 0, w], [x0, hh, w], [x0, hh, 0]], g, [-1, 0, 0]);
    else if (upFrom < hh) rect([[x0, upFrom, 0], [x0, upFrom, w], [x0, hh, w], [x0, hh, 0]], g, [-1, 0, 0]);
    if (skipSide !== 'right') rect([[x1, 0, 0], [x1, 0, w], [x1, hh, w], [x1, hh, 0]], g, [1, 0, 0]);
    else if (upFrom < hh) rect([[x1, upFrom, 0], [x1, upFrom, w], [x1, hh, w], [x1, hh, 0]], g, [1, 0, 0]);
  };
  box(X0, X1, hA, 'A', 'right', hB);
  box(X1, X2, hB, 'B', 'left', hA);
  const labels = [
    { a: [X0, 0, w], b: [X1, 0, w], text: o.la || '' }, { a: [X1, 0, w], b: [X2, 0, w], text: o.lb || '' },
    { a: [X0, hA, 0], b: [X0, hA, w], text: o.lw || '' }, { a: [X0, 0, w], b: [X0, hA, w], text: o.lhA || '' },
    { a: [X2, hB, w], b: [X2, 0, w], text: o.lhB || '' }].filter(L => L.text);
  return buildModel({
    verts, faces, convex: false, labels, kind: 'lshape',
    groups: { A: { kind: 'flat', role: 'face' }, B: { kind: 'flat', role: 'face' } }, groupOrder: ['A', 'B'],
    colors: { A: '#FFC933', B: '#5CB8F0' }
  });
}

class FoldView {

    net.faces.forEach((f, i) => f.pts.forEach((p, k) => { const q = f.pts[(k + 1) % f.pts.length], a = key(p), b = key(q), kk = a < b ? a + '|' + b : b + '|' + a; if (!E.has(kk)) E.set(kk, []); E.get(kk).push(i); }));

      const q = f.pts[(k + 1) % f.pts.length], a = key(p), b = key(q), L = E.get(a < b ? a + '|' + b : b + '|' + a);
      if (L.length < 2) return true; const o2 = net.faces[L[0] === i ? L[1] : L[0]];

  }
  attach(st) {

    st.radius = this.r * 1.02; st.center = [0, 0, 0];
  }

  play(to, ms = 1700) { this.anim = { a: this.t, b: to, t0: performance.now(), ms: ms * Math.abs(to - this.t) + 1 }; Snd.fold(); this.st.draw(); }
  busy() { return !!this.anim; }

    const W3 = p => [p[0] - c[0], p[2] - c[2], p[1] - c[1]]; // net plane -> floor, fold goes up

/* ---- surface-area nets with true proportions and labels ---- */
function saCuboidNet(l, w, hh, o = {}) {
  const m = boxModel(l, hh, w); m.color = o.color || '#F08A4B';
  const net = unfoldSolid(m, crossTree());
  const dims = { 0: [l, w], 1: [l, w], 2: [l, hh], 3: [l, hh], 4: [w, hh], 5: [w, hh] };
  const span = Math.max(...net.faces.flatMap(f => f.pts.flat()));
  const ft = net.faces.map((f, i) => { const d = dims[i], minSide = Math.min(...f.pts.map((p, k) => Math.hypot(p[0] - f.pts[(k + 1) % 4][0], p[1] - f.pts[(k + 1) % 4][1]))); return { i, lines: o.areas ? [`${d[0]} × ${d[1]}`, `= ${d[0] * d[1]}`] : [`${d[0]} × ${d[1]}`], scale: clamp(minSide / span * 7, 0.55, 1.15) }; });
  return { net, svg: netSVG(net, { faceText: ft, fills: o.fills, fs: 0.07 }) + `<p class="cap">All lengths are in ${o.unit || 'cm'}.</p>` };
}
function saPrismNet(a, b, c, L, o = {}) {
  const m = prismModel([[0, 0], [a, 0], [0, b]], L, 'z'); m.color = '#4FB0E8';
  const net = unfoldSolid(m, chainTree(m, 1, [1, 1]));
  const sideLen = [a, c, b];
  const span = Math.max(...net.faces.flatMap(f => f.pts.flat()));
  const ft = net.faces.map((f, i) => {
    if (i < 3) return { i, lines: [`${sideLen[i]} × ${L}`], scale: 0.95 };
    return { i, lines: [`b = ${a}`, `h = ${b}`], scale: 0.55 };
  });
  void span;
  return { net, svg: netSVG(net, { faceText: ft, fills: o.fills, fs: 0.06 }) + `<p class="cap">All lengths are in ${o.unit || 'cm'}. Each triangle has a right angle: base (b) and height (h).</p>` };
}
function saPyrNet(s, t, o = {}) {
  // build a net in 2D directly: square base with 4 isosceles triangles of height t
  const sq = [[0, 0], [s, 0], [s, s], [0, s]];
  const faces = [{ pts: sq, g: 'base' }];
  const tri = (a, b) => { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = -(b[1] - a[1]) / s, ny = (b[0] - a[0]) / s; return [a, [mx + nx * t, my + ny * t], b]; };
  faces.push({ pts: tri([s, 0], [0, 0]), g: 't1' }, { pts: tri([s, s], [s, 0]), g: 't2' }, { pts: tri([0, s], [s, s]), g: 't3' }, { pts: tri([0, 0], [0, s]), g: 't4' });
  const net = normNet({ faces, hinges: [], root: 0, groups: { base: { kind: 'flat' }, t1: { kind: 'flat' }, t2: { kind: 'flat' }, t3: { kind: 'flat' }, t4: { kind: 'flat' } }, color: '#F2C14E' });
  const ft = [{ i: 0, lines: [`${s} × ${s}`] }];
  for (let i = 1; i < 5; i++) { const P = net.faces[i].pts, c = cen2(P); ft.push({ i, at: c, lines: [`h = ${t}`], scale: 0.8 }); }
  const lines = [1, 2, 3, 4].map(i => { const P = net.faces[i].pts; return { a: [(P[0][0] + P[2][0]) / 2, (P[0][1] + P[2][1]) / 2], b: P[1] }; });
  return { net, svg: netSVG(net, { faceText: ft, fills: o.fills, lines, fs: 0.07 }) + `<p class="cap">All lengths are in ${o.unit || 'cm'}. h is the height of each triangle.</p>` };
}

/* ===== Question bank: generators give new numbers and shapes every time ===== */
function mcq(topic, o) {
  const c = typeof o.correct === 'string' ? { text: o.correct } : o.correct;
  const ws = o.wrong.map(x => typeof x === 'string' ? { text: x } : x);
  const options = o.keep ? [c, ...ws] : R.shuffle([c, ...ws]);
  return Object.assign({ type: 'mcq', topic }, o, { options, answer: options.indexOf(c), correctText: c.text || c.alt });
}

const GENS = { t1: G1, t2: G2, t3: G3, t4: G4, t5: G5, t6: G6, t7: G7, t8: G8, word: GW };
/* make n questions for a topic, with a good mix of question types and no repeats */
function makeSet(topic, n) {
  const out = [], keys = new Set();
  if (topic === 't9') {
    const pool = ['word', 'word', 'word'].concat(enabledTopics().map(t => t.id).filter(t => t !== 't9' && t !== 't5' && (t !== 't8' || S().topics.t8)));
    let guard = 0;
    while (out.length < n && guard++ < 400) {
      const t = R.pick(pool);
      const q = oneFrom(t, keys); if (q) { q.topic = 't9'; q.srcTopic = t; out.push(q); }
    }
    return out;
  }
  const g = GENS[topic], names = Object.keys(g);
  let order = [], guard = 0;
  while (out.length < n && guard++ < 400) {
    if (!order.length) order = R.shuffle(names);
    const q = g[order.pop()](); if (!keys.has(q.key)) { keys.add(q.key); out.push(q); }
  }
  return out;
}
function oneFrom(t, keys) {
  const g = GENS[t], names = Object.keys(g);
  for (let i = 0; i < 30; i++) { const q = g[R.pick(names)](); if (!keys.has(q.key)) { keys.add(q.key); return q; } }
  return null;
}
function makeTest(len) {
  const topics = enabledTopics().map(t => t.id).filter(t => t !== 't9' && (t !== 't8' || S().testSA));
  const slots = topics.concat(S().topics.t9 ? ['word'] : []);
  const per = {}; slots.forEach(t => per[t] = 0);
  for (let i = 0; i < len; i++) per[slots[i % slots.length]]++;
  const keys = new Set(), out = [];
  slots.forEach(t => {
    const g = GENS[t], names = R.shuffle(Object.keys(g).filter(nm => !(t === 't5' && nm === 'build' && per[t] < 3)));
    for (let i = 0; i < per[t]; i++) {
      let q = null;
      for (let k = 0; k < 30 && !q; k++) { const c = g[names[(i + k) % names.length]](); if (!keys.has(c.key)) { keys.add(c.key); q = c; } }
      if (q) { if (t === 'word') { q.topic = 't9'; } out.push(q); }
    }
  });
  return out;
}

/* ---- why a wrong answer is wrong ---- */
function NAME2KEY(text) { const t = W(String(text || '')).toLowerCase(); return SHAPE_KEYS.find(k => W(SHAPES[k].name).toLowerCase() === t) || null; }
function shapeWhy(k) {
  const s = SHAPES[k], A = cap(an(s.name));
  if (k === 'cube') return `${A} has 6 square faces that are all the same size.`;
  if (k === 'cuboid') return `${A} has 6 rectangle faces, and they are not all squares.`;
  if (s.fam === 'prism') return `${A} has 2 ${s.base} bases joined by ${s.n} rectangles.`;
  if (s.fam === 'pyr') return `${A} has 1 ${s.base} base and ${s.n} triangles that meet at an apex.`;
  if (k === 'cylinder') return `${A} has 2 flat circles, a curved surface and no apex.`;
  if (k === 'cone') return `${A} has 1 flat circle, a curved surface and an apex.`;
  return `${A} has no flat faces. It is round all over.`;
}
function countsWhy(k) {
  const c = counts(k), A = cap(an(SHAPES[k].name));
  return c.curved ? `${A} has ${c.faces} flat face${c.faces === 1 ? '' : 's'}, ${c.curved} curved surface, ${c.edges} edges and ${c.verts} vert${c.verts === 1 ? 'ex' : 'ices'}.` : `${A} has ${c.faces} faces, ${c.edges} edges and ${c.verts} vertices.`;
}
function whyWrong(q, g) {
  if (q.ok || g == null) return null;
  if (q.type === 'mcq') {
    const o = q.options[g]; if (!o) return null;
    if (o.why) return o.why;
    if (q.whyFn) { const r = q.whyFn(o); if (r) return r; }
    const k = o.img || NAME2KEY(o.text);
    if (k) return (q.srcTopic || q.topic) === 't2' ? countsWhy(k) : shapeWhy(k);
    const obj = Object.keys(SHAPE_OF_OBJ).find(x => cap(x) === o.text);
    if (obj) return `${OBJ_DESC[obj]} That is the shape of ${an(SHAPES[SHAPE_OF_OBJ[obj]].name)}.`;
    return null;
  }
  if (q.type === 'num') { const m = (q.mistakes || []).find(x => Math.abs(x.v - g) < 1e-9 && Math.abs(x.v - q.answer) > 1e-9); return m ? m.why : `${fmt(g)} is not right. Follow the steps to see how to get ${fmt(q.answer)}.`; }
  if (q.type === 'match') return g.map((x, i) => x === q.pairs[i].right ? null : `${q.pairs[i].left} is shaped like ${an(q.pairs[i].right.toLowerCase())}, not ${an((x || '?').toLowerCase())}.`).filter(Boolean).join(' ');
  if (q.type === 'tap') return 'The correct part is shown in colour on the shape.';
  if (q.type === 'build') return 'Your shape does not match. Check the length, width and height, and make every layer full.';
  if (q.type === 'netbuild') return 'When it folded, faces overlapped or left a gap. Look at where each shape joins.';
  return null;
}

/* ===== Questions: balanced two-panel layout, fixed footer, jump to any question ===== */
/* ctx: {feedback, help, index, total, onAnswer(q), onPrev, onNext, onFinish} */
function renderQuestion(q, host, ctx) {
  if (q.type === 'num' && !q.visual && q.show) q.visual = q.show;
  const tool = ['build', 'netbuild'].includes(q.type);
  const hasVis = !!q.visual || tool;
  window.__q = q; window.__qctx = {};
  const wrap = h('div', { class: 'qwrap' + (hasVis ? ' has-vis' : ' no-vis') + (tool ? ' tool-q' : '') + (q.wideVis ? ' wide-vis' : '') + ' t-' + q.type });
  const left = h('div', { class: 'qleft' }), right = h('div', { class: 'qright' });
  const vis = h('div', { class: 'qvis' });
  const qpanel = h('div', { class: 'qpanel card' });
  const prompt = h('div', { class: 'qprompt' }, h('span', { class: 'qno' }, String(ctx.index + 1)), h('span', null, q.prompt));
  const ans = h('div', { class: 'qans' });
  const hintBox = h('p', { class: 'hint', hidden: true }, 'Hint: ' + (q.hint || 'Read the question again slowly.'));
  const fb = h('div', { class: 'qfb', 'aria-live': 'polite' });
  qpanel.append(prompt, ans, hintBox);
  let solPanel;
  if (hasVis) { left.append(vis); qpanel.append(fb); right.append(qpanel); }

    left.append(qpanel);
    solPanel = h('div', { class: 'qpanel card sol' }, fb);
    right.append(solPanel);
  }

  if (!hasVis) placeholder();
  const foot = h('div', { class: 'qfoot' });
  wrap.append(left, right, foot); host.append(wrap);
  const panels = () => [qpanel, solPanel].filter(Boolean);
  /* everything stays on one screen: the text shrinks a little if needed, never scrolls */
  const fit = () => {
    if (!wrap.isConnected) return;
    let k = 1; wrap.style.setProperty('--k', k);
    const over = () => panels().some(p => p.scrollHeight > p.clientHeight + 1);
    while (over() && k > 0.66) { k = Math.round((k - 0.04) * 100) / 100; wrap.style.setProperty('--k', k); }
  };
  const refit = () => requestAnimationFrame(fit);
  if (window.ResizeObserver) { const ro = new ResizeObserver(refit); panels().forEach(p => ro.observe(p)); }
  /* footer: help on the left, moving between questions on the right (always in the same place) */
  let hintBtn = null;
  const fl = h('div', { class: 'row fl' }), fr = h('div', { class: 'row fr' });
  if (ctx.help) {
    hintBtn = btn('Hint', () => { hintBox.hidden = !hintBox.hidden; Snd.click(); refit(); }, 'sm');
    fl.append(hintBtn);
    if (q.show || (q.visual && q.visual.kind !== 'svgnet')) fl.append(btn('Show in 3D', () => show3D(q), 'sm'));
  }
  const last = ctx.index === ctx.total - 1;
  const bBack = btn('Back', () => ctx.onPrev(), 'navb'); bBack.disabled = ctx.index === 0;
  const bNext = btn('Next', () => (last ? ctx.onFinish() : ctx.onNext()), 'go navb nextb');
  const setNext = () => { bNext.textContent = last ? 'Finish' : (q.answered ? 'Next' : 'Skip'); bNext.classList.toggle('skip', !q.answered && !last); };
  fr.append(bBack, bNext); foot.append(fl, h('span', { class: 'grow' }), fr); setNext();
  const check = g => {
    if (q.type === 'mcq') return g === q.answer;
    if (q.type === 'num') return Math.abs(g - q.answer) < 1e-9;
    if (q.type === 'tap') return g.length === q.target.length && q.target.every(x => g.includes(x));
    if (q.type === 'match') return g.every((x, i) => x === q.pairs[i].right);
    if (q.type === 'build') return !!q._ok;
    if (q.type === 'netbuild') return !!g;

  };
  let locked = false, given = null;
  const showResult = () => {

    if (ctx.feedback) { showResult(); if (!restoring) { if (q.ok) Snd.correct(); else Snd.wrong(); } }
    else { fb.className = 'qfb saved'; fb.innerHTML = ''; fb.append(h('p', null, h('b', null, 'Answer saved. '), 'You can change it, or go to any question using the numbers at the top.')); refit(); }

  };
  let markUI = () => { }, restore = () => { };
  if (q.type === 'mcq') {
    const imgs = q.options.some(o => o.img || o.net);
    const list = h('div', { class: 'opts' + (imgs ? ' grid' : '') + (q.tf ? ' tf' : '') + (q.long ? ' long' : '') });
    const bs = q.options.map((op, i) => {
      const inner = op.img ? [h('span', { class: 'olet' }, 'ABCD'[i]), thumbImg(op.img, op.alt)] : op.net ? [h('span', { class: 'olet' }, 'ABCD'[i]), h('span', { class: 'netwrap', html: op.net })] : [h('span', { class: 'olet' }, q.tf ? '' : 'ABCD'[i]), h('span', { class: 'otx' }, op.text)];
      const b = h('button', { class: 'opt', type: 'button', 'aria-label': op.alt || op.text }, inner, h('span', { class: 'omark' }));
      b.addEventListener('click', () => { if (locked) return; Snd.click(); bs.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); finish(i); });

        rows.append(h('div', { class: 'mrow' }, h('span', { class: 'mleft' }, p.left), slot, h('span', { class: 'mmark' })));

}

/* a quiz (practice or test): numbers at the top to jump to any question, skip, finish */
function runQuiz(o) {
  const qs = o.qs;
  let i = 0, left = (o.timer || 0) * 60;
  const strip = h('div', { class: 'qstrip', role: 'navigation', 'aria-label': 'Questions' });
  const status = h('span', { class: 'qs' });
  const head = h('div', { class: 'qhead' }, h('span', { class: 'qn' }), strip, status, btn('Finish', () => finishAsk(), 'sm fin'));
  const body = h('div', { class: 'qbody' });
  main().append(h('div', { class: 'quiz' }, head, body));
  const nums = qs.map((q, k) => { const b = h('button', { class: 'qnum', type: 'button', 'aria-label': 'Question ' + (k + 1), onclick: () => { Snd.click(); show(k); } }, String(k + 1)); strip.append(b); return b; });
  const upd = () => {
    const done = qs.filter(q => q.answered).length, right = qs.filter(q => q.ok).length;
    $('.qn', head).textContent = `Question ${i + 1} of ${qs.length}`;
    status.textContent = o.feedback ? `Correct: ${right}  ·  Done: ${done}/${qs.length}` : `Answered: ${done}/${qs.length}`;
    nums.forEach((b, k) => {
      const q = qs[k];
      b.className = 'qnum' + (k === i ? ' cur' : '') + (q.answered ? (o.feedback ? (q.ok ? ' ok' : ' no') : ' done') : '');
    });
    const cur = nums[i]; if (cur && cur.scrollIntoView) { const sr = strip.getBoundingClientRect(), br = cur.getBoundingClientRect(); if (br.left < sr.left || br.right > sr.right) strip.scrollLeft += br.left - sr.left - sr.width / 2 + br.width / 2; }
  };
  const show = k => {
    i = k; Live.clear(); body.innerHTML = ''; App.keyHandler = null;
    setBar(o.title); if (o.timer) $('#timer').hidden = false;
    renderQuestion(qs[i], body, { feedback: o.feedback, help: o.help, index: i, total: qs.length, onAnswer: upd, onPrev: () => show(Math.max(0, i - 1)), onNext: () => show(Math.min(qs.length - 1, i + 1)), onFinish: () => finishAsk() });
    upd();
  };
  const end = () => { clearInterval(App.timer); o.onFinish(qs); };
  const finishAsk = () => {
    const left2 = qs.filter(q => !q.answered).length;
    if (!left2) { end(); return; }
    openModal('Finish now?', bd => {
      bd.append(h('p', { class: 'lead' }, `You have ${left2} question${left2 > 1 ? 's' : ''} with no answer. ${left2 > 1 ? 'They' : 'It'} will be marked wrong.`),
        h('div', { class: 'row' }, btn('Keep going', () => { closeModal(); const k = qs.findIndex(q => !q.answered); show(k); }, 'go'), btn('Finish now', () => { closeModal(); end(); })));
    });
  };
  if (o.timer) {
    const tm = $('#timer');
    const tick = () => { const m = Math.floor(left / 60), s2 = left % 60; tm.textContent = `${m}:${String(s2).padStart(2, '0')}`; tm.classList.toggle('low', left <= 60); if (left <= 0) { end(); return; } left--; };
    tick(); App.timer = setInterval(tick, 1000);
  }
  show(0);
}

/* ---------- practice ---------- */
function practice(tid) {
  const t = topicById(tid);
  runQuiz({ qs: makeSet(tid, S().nq), title: `${t.n}. ${t.title}: Practice`, feedback: true, help: true, onFinish: qs => go(practiceEnd, tid, qs) });
}
function practiceEnd(tid, qs) {
  const t = topicById(tid), score = qs.filter(q => q.ok).length;

  const P = Store.data.progress, old = P[tid];
  P[tid] = { best: Math.max(score, old ? old.best : 0), total: qs.length, last: score }; Store.save();

/* ---------- tests: 4 fixed sets and a random one ---------- */
const TEST_SETS = [{ id: 's1', name: 'Test 1', seed: 1101 }, { id: 's2', name: 'Test 2', seed: 2202 }, { id: 's3', name: 'Test 3', seed: 3303 }, { id: 's4', name: 'Test 4', seed: 4404 }, { id: 'rnd', name: 'Random test', seed: 0 }];
function withSeed(seed, fn) {

  try { return fn(); } finally { Math.random = orig; }
}
function testSetup() {

  const mb = (v, l, d) => h('button', { class: 'choice' + (mode === v ? ' on' : ''), type: 'button', onclick: e => { mode = v; $$('.choice', e.currentTarget.parentNode).forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); Snd.click(); } }, h('b', null, l), h('span', null, d));
  const tl = S().timer;
  const cards = TEST_SETS.map((t, k) => {
    const r = sets[t.id];
    return h('div', { class: 'tcard' + (t.id === 'rnd' ? ' rnd' : ''), style: { '--tc': ['#F0543C', '#2F86DE', '#1FA35B', '#FF8C42', INK][k] } },
      h('div', { class: 'tch' }, t.id === 'rnd' ? '?' : String(k + 1)),
      h('div', { class: 'tcb' }, h('h3', null, t.name), h('p', { class: 'tsub' }, t.id === 'rnd' ? `${S().testLen} new questions every time` : `${S().testLen} questions, the same set every time`),
        h('p', { class: 'tstat' }, r ? `Best: ${r.best}/${r.total} · Last: ${r.last}/${r.total}` : 'Not taken yet'),
        btn('Start', () => go(testRun, t.id, mode), 'go sm')));
  });

    h('div', { class: 'card hero' }, h('div', null, h('h1', null, 'Tests'), h('p', null, `Questions from every topic. ${tl ? `You have ${tl} minutes.` : 'There is no time limit.'} Tap a question number to jump to it, or skip and come back later.`))),
    h('div', { class: 'card pad' }, h('h3', null, 'Choose a mode'), h('div', { class: 'choices' }, mb('practice', 'Practice mode', 'See the right answer and the steps straight after each question.'), mb('exam', 'Exam mode', 'Answers and steps are shown at the end.'))),

}

  runQuiz({ qs, title: `${T.name} (${mode === 'exam' ? 'exam mode' : 'practice mode'})`, feedback: mode !== 'exam', help: false, timer: S().timer, onFinish: qs2 => go(testResults, qs2, mode, T.id) });
}

  setBar(`${T.name}: results`);

  Store.data.lastTest = { date: new Date().toISOString(), set: T.name, score, total: qs.length, mode, per, items: qs.map(q => ({ t: q.topic, p: W(q.prompt), a: answerText(q, q.answered ? q.given : null), r: rightText(q), ok: !!q.ok })) };

  Store.save();

    const [a, b] = per[k], t = topicById(k), p = a / b;
    return h('div', { class: 'trow' }, h('span', { class: 'tn' }, `${t.n}. ${t.title}`), h('div', { class: 'tbar' }, h('i', { style: { width: (p * 100) + '%', background: p >= 0.7 ? '#1FA35B' : p >= 0.5 ? '#F7B500' : '#B0172E' } })), h('b', null, `${a}/${b}`), p < 0.7 ? btn('Practise', () => go(practice, k), 'sm go') : h('span', { class: 'okt' }, 'Good'));

/* Touch lock for tablets: the page never zooms, slides left or right, or bounces.

  if (meta) meta.setAttribute('content', LOCK);
  const SCROLLERS = '.scroll,.page,.lside,.qside,.bside,.tbody2,.mbody,.netgrid,.tscroll,.done,.start,.learn,.qbody,.qstrip,textarea';
  const inScroller = el => !!(el && el.closest && el.closest(SCROLLERS));
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if ((e.touches && e.touches.length > 1) || !inScroller(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('textarea,input'))) e.preventDefault(); });
  const home = () => {
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    const se = document.scrollingElement; if (se) { se.scrollLeft = 0; se.scrollTop = 0; }
    document.body.scrollLeft = 0; document.body.scrollTop = 0; const app = document.getElementById('app'); if (app) { app.scrollLeft = 0; app.scrollTop = 0; }
  };
  window.addEventListener('scroll', home, { passive: true });

  const vv = window.visualViewport;
  if (vv) {
    const fix = () => { if (vv.scale > 1.001 && meta) { meta.setAttribute('content', LOCK + ', shrink-to-fit=no'); meta.setAttribute('content', LOCK); } home(); };
    vv.addEventListener('resize', fix); vv.addEventListener('scroll', fix);
  }
  window.__touchLock = { home, LOCK };
})();

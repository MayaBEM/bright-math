<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Circle Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: a workshop table. Left-aligned title, four station tiles of different sizes, one wide drawing board. */
:root{
  --bg:#D9ECF6; --paper:#FFFFFF; --ink:#17283A; --muted:#41566B; --line:#C4D9E6; --edge:#7C9DB5;
  --coral:#E4482F; --coral-soft:#FBDDD5; --butter:#FFC72C; --butter-soft:#FFF0BD;
  --sage:#1B9A70; --sage-soft:#D2F0E3; --sky:#1769C5; --sky-soft:#D6E8F8; --bad:#B3361D; --bad-soft:#FBE1DA;
  --desk:#DCE7E0; --shadow:#B7CFDD; --brand:#1769C5; --brand-text:#FFFFFF; --grid:#C3DDEB;
  --display:'Poppins','Trebuchet MS',system-ui,sans-serif; --body:'Lexend','Segoe UI',system-ui,sans-serif; --hand:'Caveat','Segoe Print',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A26; --paper:#192A3B; --ink:#EAF2F9; --muted:#A9BCCD; --line:#2B4155; --edge:#4F6E88;
  --coral:#FF7A63; --coral-soft:#47261F; --butter:#FFC72C; --butter-soft:#40371A;
  --sage:#4CD0A2; --sage-soft:#1B3A30; --sky:#6DB4F0; --sky-soft:#1D3447; --bad:#FF9279; --bad-soft:#47261F;
  --desk:#1B2622; --shadow:#08101A; --brand:#5AA9F0; --brand-text:#0B1824; --grid:#16293A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A26; --paper:#192A3B; --ink:#EAF2F9; --muted:#A9BCCD; --line:#2B4155; --edge:#4F6E88;
  --coral:#FF7A63; --coral-soft:#47261F; --butter:#FFC72C; --butter-soft:#40371A;
  --sage:#4CD0A2; --sage-soft:#1B3A30; --sky:#6DB4F0; --sky-soft:#1D3447; --bad:#FF9279; --bad-soft:#47261F;
  --desk:#1B2622; --shadow:#08101A; --brand:#5AA9F0; --brand-text:#0B1824; --grid:#16293A; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.7px,transparent 1.8px);background-size:26px 26px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px}
.back{border:1.5px solid var(--edge);background:transparent;border-radius:2px;padding:8px 14px;font-weight:500;text-decoration:none;color:var(--ink);min-height:44px;display:inline-flex;align-items:center}
.back:hover{background:var(--butter-soft)}
.btn{border:1.5px solid var(--edge);background:var(--paper);border-radius:2px;padding:10px 18px;min-height:46px;font-weight:600;box-shadow:none;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:hover:not(:disabled){filter:brightness(.95)}
.btn.primary{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
.btn.primary:hover:not(:disabled){box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.a.btn{}
a.btn{color:var(--ink)}
a.btn.primary{color:var(--brand-text)}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px}
/* home */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;padding:8px 0 24px}
.hero h1{font-size:clamp(40px,6vw,68px);font-weight:800;letter-spacing:-.02em}
.hero p{max-width:46ch;color:var(--muted);font-size:18px;margin:14px 0 0}
.hero svg{width:100%;max-width:340px;justify-self:end}
.stations{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.st{grid-column:span 2;background:var(--paper);border:1.5px solid var(--edge);border-radius:2px;padding:18px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;box-shadow:none;min-width:0;transition:transform .1s,box-shadow .1s}
.st:hover{border-color:var(--brand)}
.st.wide{grid-column:span 3}
.st.board{grid-column:span 6;flex-direction:row;align-items:center;gap:24px;background:var(--sage-soft)}
.st .tag{font-size:13px;font-weight:600;color:var(--muted)}
.st h2{font-size:26px}
.st p{margin:0;color:var(--muted);font-size:15px}
.st .go{margin-top:auto;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--edge);border-radius:2px;padding:2px 12px;font-size:13px;font-weight:600;background:var(--butter-soft)}
.chip.done{background:var(--sage-soft)}
.st .pic{height:96px;border-radius:2px;background:var(--butter-soft);display:flex;align-items:center;justify-content:center}
.st .pic svg{height:84px;width:auto;max-width:100%}
.st.board .pic{flex:0 0 280px;height:150px;background:var(--paper)}
.st.board .pic svg{height:130px}
.st.board .info{display:flex;flex-direction:column;gap:10px;min-width:0}
.foot{margin-top:28px;color:var(--muted);font-size:13px}
/* activity shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.titlebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.titlebar h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.titlebar span{color:var(--muted)}
.card{background:var(--paper);border:1.5px solid var(--edge);border-radius:2px;padding:16px;min-width:0}
.msg{border-radius:2px;padding:12px 14px;border:2px solid var(--line);background:var(--butter-soft);min-height:52px;font-weight:500}
.msg.ok{background:var(--sage-soft);border-color:var(--sage)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)}
.msg b.mark{margin-right:6px}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{border:1.5px solid var(--edge);background:var(--paper);border-radius:2px;padding:8px 14px;min-height:44px;font-weight:600;font-size:16px;box-shadow:none}
.word[aria-pressed="true"]{background:var(--butter);transform:translateY(2px);box-shadow:none}
.word:disabled{background:var(--sage-soft);box-shadow:none;border-color:var(--sage);color:var(--muted);text-decoration:line-through;cursor:default}
.stars{display:inline-flex;gap:4px;vertical-align:middle}
.stars svg{width:28px;height:28px}
.progress{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--edge);border-radius:2px;padding:2px 12px;font-size:14px;font-weight:600;background:var(--paper)}
.pill.on{background:var(--butter)}
.pill.done{background:var(--sage-soft)}
/* label lab */
.lab-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.scene{background:var(--paper);border:1.5px solid var(--edge);border-radius:2px;padding:8px}
.scene svg{display:block;width:100%;height:auto}
.badge{cursor:pointer}
.badge circle{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.badge text{font:700 15px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.badge.sel circle{fill:var(--butter)}
.badge.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tag-ok rect{fill:var(--sage-soft);stroke:var(--sage);stroke-width:2.5}
.tag-ok text{font:600 18px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.tag-ok path{stroke:var(--sage);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hl{stroke:var(--coral);stroke-width:7;fill:none;stroke-linecap:round;opacity:.95}
.hl.fill{fill:var(--coral);fill-opacity:.35;stroke-width:4}
.how{margin:0;padding-left:22px;color:var(--muted)}
.how li{margin:4px 0}
/* quiz */
.q{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center}
.q svg{width:100%;height:auto}
.q h2{font-size:24px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--edge);background:var(--paper);border-radius:2px;padding:12px;min-height:50px;font-weight:600;text-align:left;box-shadow:none}
.opt:hover:not(:disabled){background:var(--butter-soft)}
.opt.right{background:var(--sage-soft);border-color:var(--sage)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;box-shadow:none}
.bar{height:12px;border:1.5px solid var(--edge);border-radius:2px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--butter);transition:width .25s}
.numq{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:center}
.numq .qt{font-size:20px;font-weight:500;margin:0 0 14px}
.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ans label{font-weight:600}
.num{width:130px;font:600 22px var(--body);padding:8px 12px;border:1.5px solid var(--edge);border-radius:2px;background:var(--paper);color:var(--ink);min-height:48px}
.unit{font-weight:600}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lvl{text-align:left;padding:14px;border:1.5px solid var(--edge);border-radius:2px;background:var(--paper);box-shadow:none}
.lvl:hover{background:var(--butter-soft)}
.lvl b{font-family:var(--display);font-size:22px;display:block}
.lvl span{color:var(--muted);font-size:14px;display:block;margin-top:4px}
.end{text-align:center;display:grid;gap:14px;justify-items:center;padding:12px}
.end h2{font-size:34px}
/* board */
.board-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.tasks{display:flex;flex-direction:column;gap:6px}
.tasks button{display:flex;gap:8px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:2px;padding:8px 10px;min-height:44px;font-weight:500;font-size:14px}
.tasks button[aria-current="true"]{border-color:var(--ink);background:var(--butter);font-weight:600}
.tasks .n{flex:0 0 24px;height:24px;border-radius:2px;border:1.5px solid var(--edge);display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--paper)}
.tasks .done .n{background:var(--sage);color:#fff;border-color:var(--sage)}
.tasks .done .n svg{width:14px;height:14px}
.brief{font-size:19px;font-weight:500;margin:0}
.desk{background:#24493F;border:1.5px solid var(--edge);border-radius:2px;padding:6px;box-shadow:none}
.desk svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:2px}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:2px;padding:3px 12px 3px 4px;font-weight:600;font-size:14px;background:var(--paper)}
.steps li i{font-style:normal;width:24px;height:24px;border-radius:2px;display:grid;place-items:center;border:2px solid var(--line);font-size:12px}
.steps li.on{border-color:var(--ink);background:var(--butter)}
.steps li.on i{border-color:var(--ink);background:var(--paper)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tool{border:2px solid var(--line);border-radius:2px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:6px;min-width:0}
.tool.active{border-color:var(--ink);background:var(--sky-soft)}
.tool h3{font-size:17px;display:flex;align-items:center;gap:8px}
.tool h3 svg{width:34px;height:20px;flex:none}
.tool p{margin:0;font-size:14px;color:var(--muted)}
.read{font:700 28px var(--display);display:flex;align-items:center;gap:8px}
.read output{min-width:3.6em;text-align:center;border:1.5px solid var(--edge);border-radius:2px;background:var(--paper);padding:0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sweep{display:flex;gap:10px;align-items:center;flex:1;min-width:220px}
.sweep input{flex:1;accent-color:var(--coral);min-height:32px}
.win{border:2px solid var(--sage);background:var(--sage-soft);border-radius:2px;padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.win p{margin:0;flex:1;min-width:200px}
.todo{display:flex;gap:14px;align-items:flex-start;background:var(--butter-soft);border:1.5px solid var(--edge);border-radius:2px;padding:14px;box-shadow:none}
.todo .num{flex:none;width:44px;height:44px;border-radius:2px;background:var(--brand);color:var(--brand-text);border:1.5px solid var(--edge);display:grid;place-items:center;font:800 24px var(--display)}
.todo h2{font-size:22px;margin-bottom:4px}
.todo p{margin:0 0 10px;font-size:16px}
.todo .row{gap:12px}
.todolist{border:2px solid var(--line);border-radius:2px;background:var(--paper);padding:10px 14px}
.todolist ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px}
.todolist li{display:flex;align-items:center;gap:8px;font-weight:600}
.todolist .bx{width:22px;height:22px;border:1.5px solid var(--edge);border-radius:2px;display:grid;place-items:center;background:var(--paper)}
.todolist li.dn .bx{background:var(--sage);border-color:var(--sage);color:#fff}
.todolist li.dn{color:var(--muted)}
.todolist .bx svg{width:14px;height:14px}
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.3}}
.wm{font:800 24px/1 var(--display);letter-spacing:-.02em;display:inline-flex;gap:6px;align-items:baseline}
.wm b{color:#FF914D;font-weight:800}
.wm i{font-style:normal;color:var(--ink);font-weight:800}
.pbar{height:16px;border:1.5px solid var(--edge);border-radius:2px;background:var(--paper);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.prog{display:grid;gap:8px;margin-top:18px;max-width:420px;background:var(--paper);border:1.5px solid var(--edge);border-radius:2px;padding:12px 14px;box-shadow:none}
.prog b{font-family:var(--display);font-size:18px}
.hero .lede{display:block;font-weight:600;color:var(--muted);border-left:4px solid var(--butter);padding-left:10px;font-size:15px;margin-bottom:14px}
.st .pic{height:128px}
.st .pic svg{height:112px}
.st.c1 .pic{background:var(--butter-soft)}.st.c2 .pic{background:var(--coral-soft)}.st.c3 .pic{background:var(--sky-soft)}
.end{position:relative;overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti span{position:absolute;top:-12px;left:var(--x);width:10px;height:14px;background:var(--c);border-radius:2px;transform:rotate(var(--r));animation:fall 1.6s ease-in var(--d) 1 both}
@keyframes fall{from{transform:translateY(-10px) rotate(var(--r));opacity:1}to{transform:translateY(340px) rotate(calc(var(--r) + 300deg));opacity:0}}
.tag-ok{animation:pop .28s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.7);opacity:.2}to{transform:scale(1);opacity:1}}
.sec{display:flex;align-items:center;gap:12px;font-size:26px;margin:34px 0 14px}
.sec .n{width:36px;height:36px;background:var(--brand);color:var(--brand-text);display:grid;place-items:center;font:800 20px var(--display);border-radius:2px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card2{background:var(--paper);border-radius:2px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-width:0}
.card2:hover{border-color:var(--brand)}
.card2 .pic{height:110px;background:var(--sky-soft);display:flex;align-items:center;justify-content:center}
.card2 .pic svg{height:96px;width:auto;max-width:100%}
.card2 h3{font-size:22px}.card2 p{margin:0;color:var(--muted);font-size:15px}
.card2 .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:8px}
.testband{background:#1F4A3D;box-shadow:inset 0 0 40px rgba(0,0,0,.4);border:10px solid #8F5B2B;color:#F3F7F4;padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;border-radius:2px}
.testband .t{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;text-decoration:none;color:#F3F7F4;border:1.5px solid #5E8579;padding:16px;border-radius:2px}
.testband .t:hover{background:#2C574B}
.testband h3{font-size:24px;margin-bottom:4px}.testband p{margin:0 0 8px;font-size:15px;color:#D5E5DD}
.testband .chip{background:#F7EDCB;color:#1D2A27;border-color:#F7EDCB}
.testband .t svg{width:100%;height:auto}
.stamps{display:flex;flex-wrap:wrap;gap:8px;overflow-x:clip;padding:4px 6px 4px 0}
.stamp{min-width:44px;padding:0 5px;box-sizing:border-box;height:44px;border:1.5px dashed var(--edge);display:grid;place-items:center;font:700 11px var(--body);color:var(--muted);text-align:center;line-height:1.05;border-radius:2px}
.stamp.on{border:2px solid var(--brand);background:var(--sage-soft);color:var(--ink);transform:rotate(-3deg)}
.stamp.on:nth-child(even){transform:rotate(3deg)}
.learn{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.partbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.partbtns button{border:1.5px solid var(--edge);background:var(--paper);padding:9px 10px;min-height:44px;font-weight:600;text-align:left;border-radius:2px}
.partbtns button[aria-pressed="true"]{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
.defbox{border-left:5px solid var(--butter);background:var(--butter-soft);padding:12px 14px;border-radius:2px;min-height:96px}
.defbox h3{font-size:22px;margin-bottom:4px}.defbox p{margin:0}
.slide{display:grid;gap:8px}
.slide input[type=range]{width:100%;accent-color:var(--brand);min-height:34px}
.eq{font:700 22px var(--display);display:flex;flex-wrap:wrap;gap:6px 14px}
.eq span{background:var(--sky-soft);padding:2px 10px;border-radius:2px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stepper button{border:1.5px solid var(--edge);background:var(--paper);padding:8px 10px;min-height:46px;font-weight:600;text-align:left;border-radius:2px;display:flex;gap:8px;align-items:center}
.stepper button b{width:26px;height:26px;display:grid;place-items:center;background:var(--line);border-radius:2px;flex:none}
.stepper button[aria-current="true"]{border-color:var(--brand);background:var(--sage-soft)}
.stepper button[aria-current="true"] b{background:var(--brand);color:var(--brand-text)}
.tip{border:1.5px solid var(--edge);background:var(--paper);padding:12px 14px;border-radius:2px}
.tip ul{margin:6px 0 0;padding-left:20px}.tip li{margin:3px 0}
.nav20{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.nav20 button{min-height:38px;border:1.5px solid var(--edge);background:var(--paper);font-weight:600;border-radius:2px}
.nav20 button.ans{background:var(--sage-soft);border-color:var(--sage)}
.nav20 button.cur{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
.qcard{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px;align-items:center}
.qcard.nofig{grid-template-columns:minmax(0,1fr)}
.qcard svg{width:100%;height:auto}
.qcard .qt{font-size:20px;font-weight:500;margin:0 0 14px}
.secname{font-weight:600;color:var(--muted);font-size:14px;margin-bottom:6px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt.sel{background:var(--butter-soft);border-color:var(--ink)}
.rev{display:grid;gap:10px}

function leg(A,B,w0,w1,fill,stroke){
  var dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  var pts=[[A[0]+nx*w0/2,A[1]+ny*w0/2],[B[0]+nx*w1/2,B[1]+ny*w1/2],[B[0]-nx*w1/2,B[1]-ny*w1/2],[A[0]-nx*w0/2,A[1]-ny*w0/2]];
  return '<polygon points="'+pts.map(function(q){return q[0].toFixed(2)+','+q[1].toFixed(2)}).join(' ')+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width=".25"':'')+' stroke-linejoin="round"/>';

  o+=leg(H,q1,2.4*k,2.2*k,'url(#steel)','#5d646b');

  o+=leg(H,hx,1.3*k,1.3*k,'url(#steel)','#5d646b');
  o+='<circle cx="'+hx[0].toFixed(2)+'" cy="'+hx[1].toFixed(2)+'" r="'+(2.1*k).toFixed(2)+'" fill="url(#brass)" stroke="#7a5214" stroke-width=".25"/>';
  o+='<circle cx="'+H[0].toFixed(2)+'" cy="'+H[1].toFixed(2)+'" r="'+(2.7*k).toFixed(2)+'" fill="url(#brass)" stroke="#7a5214" stroke-width=".3" data-hit="body"/>';

  if(word===partId){
    LL.placed[partId]=true;LL.selChip=null;LL.selPart=null;LL.kind='ok';setTimeout(celebrate,30);
    LL.msg='<b class="mark">Correct.</b>'+cap(word)+': '+DEF[word];
    if(sc.parts.every(function(p){return LL.placed[p.id]})){
      LL.done=true;var n=LL.mistakes<=1?3:LL.mistakes<=3?2:1;store.label=store.label||{};
      store.label[sc.id]=Math.max(store.label[sc.id]||0,n);save();
    }
  }else{
    LL.mistakes++;LL.attempts[partId]=(LL.attempts[partId]||0)+1;LL.kind='bad';LL.shake=partId;
    var more=LL.attempts[partId]>=2?' Hint: this part is '+DEF[partId]:' Look at the highlighted part again.';
    LL.msg='<b class="mark">Not yet.</b>'+cap(word)+' means '+DEF[word]+more;
    LL.selChip=null;buddyOops('Not yet. Look at the hint.');
  }
  labRender();LL.shake=null;
}
views.label=function(){
  var saved=store.label||{};var first=0;for(var k=0;k<3;k++){if(!saved['r'+(k+1)]){first=k;break}first=k}
  labStart(first===undefined?0:first);
};
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-part],[data-word],[data-round],[data-act]');if(!t)return;
  var h=(location.hash||'#home').slice(1);
  if(h==='label'&&LL){
    if(t.dataset.round!==undefined){labStart(+t.dataset.round);return}
    if(t.dataset.act==='again'){labStart(LL.i);return}
    if(t.dataset.act==='next'){labStart(LL.i+1);return}
    if(LL.done)return;
    if(t.dataset.word){
      var w=t.dataset.word;
      if(LL.selPart){labPlace(LL.selPart,w);return}
      LL.selChip=(LL.selChip===w?null:w);LL.msg=LL.selChip?'Now tap the number for '+LL.selChip+'.':'Tap a word, then tap the number it belongs to.';LL.kind='';labRender();return}
    if(t.dataset.part){
      var p=t.dataset.part;
      if(LL.selChip){LL.selPart=p;labPlace(p,LL.selChip);return}
      LL.selPart=(LL.selPart===p?null:p);LL.msg=LL.selPart?'The highlighted part is selected. Tap the word that names it.':'Tap a word, then tap the number it belongs to.';LL.kind='';labRender();return}
  }
});

function detDiagram(kind,a){
  var cx=110,cy=100,r=80,g='<circle cx="110" cy="100" r="80" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>';
  function p(ang,rr){return pol(ang,rr===undefined?r:rr,cx,cy)}
  var hl='stroke="var(--coral)" stroke-width="6" fill="none" stroke-linecap="round"';
  function ln(x,y){return '<path '+hl+' d="M'+P2(x)+' L'+P2(y)+'"/>'}
  var dot='<circle cx="110" cy="100" r="4.5" fill="var(--ink)"/>';
  if(kind==='radius')g+=ln([cx,cy],p(a));
  if(kind==='diameter')g+=ln(p(a),p(a+180));
  if(kind==='chord')g+=ln(p(a),p(a+110));
  if(kind==='arc'){var s=p(a),e=p(a+80);g+='<path '+hl+' d="M'+P2(s)+' A'+r+' '+r+' 0 0 0 '+P2(e)+'"/>'}
  if(kind==='sector'){var s2=p(a),e2=p(a+70);g+='<path fill="var(--coral)" fill-opacity=".4" stroke="var(--coral)" stroke-width="3" d="M'+cx+' '+cy+' L'+P2(s2)+' A'+r+' '+r+' 0 0 0 '+P2(e2)+' Z"/>'}
  if(kind==='semicircle'){var s3=p(a),e3=p(a+180);g+='<path fill="var(--coral)" fill-opacity=".4" stroke="var(--coral)" stroke-width="3" d="M'+P2(s3)+' A'+r+' '+r+' 0 0 0 '+P2(e3)+' Z"/>'}
  return '<svg viewBox="0 0 220 200" role="img" aria-label="A circle with one part highlighted">'+g+dot+'</svg>';
}
var DET_KINDS=['radius','diameter','chord','arc','sector','semicircle'];
var DET_DEF=[
 ['Which word means “the distance around the circle”?','circumference'],
 ['Which line passes through the center and is the longest chord?','diameter'],
 ['Which part is a slice of a circle, like a slice of pizza?','sector'],
 ['Which part is half a circle?','semicircle'],
 ['Which line goes from the center to the edge?','radius'],
 ['Which line joins two points on the circle but may miss the center?','chord']];
var ALLW=['radius','diameter','chord','arc','sector','semicircle','circumference','center'];
var DT=null;
function detStart(){
  var items=[];
  shuffle(DET_KINDS).forEach(function(k){items.push({t:'d',kind:k,a:ri(0,359)})});
  shuffle(DET_DEF).slice(0,4).forEach(function(q){items.push({t:'w',q:q[0],ans:q[1]})});
  DT={items:shuffle(items),i:0,score:0,answered:null};detRender();
}
function detRender(){
  if(DT.i>=DT.items.length){
    var best=Math.max(store.detective||0,DT.score);store.detective=best;save();
    var n=DT.score>=9?3:DT.score>=7?2:1;
    app.innerHTML='<div class="shell"><div class="titlebar"><h1>Part Detective</h1></div><div class="end card">'+(DT.score>=7?confetti():'')+'<h2>You scored '+DT.score+' out of '+DT.items.length+'</h2>'+stars(n)+'<p>'+(DT.score===10?'Perfect round.':DT.score>=7?'Strong work. Play again to get every one.':'Review the Label Lab, then try again.')+'</p><div class="row"><button class="btn primary" data-dact="again">Play again</button><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#home">All activities</a></div></div></div>';
    return;
  }
  var it=DT.items[DT.i],ans=it.t==='d'?it.kind:it.ans;
  if(!it.opts){var pool=ALLW.filter(function(w){return w!==ans});it.opts=shuffle([ans].concat(shuffle(pool).slice(0,3)))}
  var picked=DT.answered;
  var opts=it.opts.map(function(o){var cls='opt';if(picked){if(o===ans)cls+=' right';else if(o===picked)cls+=' wrong'}
    return '<button class="'+cls+'" data-opt="'+o+'"'+(picked?' disabled':'')+'>'+(picked&&o===ans?'✓ ':picked&&o===picked?'✗ ':'')+o+'</button>'}).join('');
  var fb='';
  if(picked){var ok=picked===ans;fb='<div class="msg '+(ok?'ok':'bad')+'" role="status"><b class="mark">'+(ok?'Correct.':'Not quite.')+'</b>'+(ok?'':'The answer is '+ans+'. ')+cap(ans)+': '+DEF[ans]+'</div><div class="row" style="margin-top:12px"><button class="btn primary" data-dact="next">'+(DT.i===DT.items.length-1?'Finish':'Next question')+'</button></div>'}
  var pct=(DT.i/DT.items.length*100);
  app.innerHTML='<div class="shell"><div class="titlebar"><h1>Part Detective</h1><span>Question '+(DT.i+1)+' of '+DT.items.length+', score '+DT.score+'</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+DT.items.length+'" aria-valuenow="'+DT.i+'"><i style="width:'+pct+'%"></i></div>'+
   '<div class="card q">'+(it.t==='d'?detDiagram(it.kind,it.a):'<svg viewBox="0 0 220 200" aria-hidden="true"><circle cx="110" cy="100" r="80" fill="var(--butter-soft)" stroke="var(--ink)" stroke-width="3"/><text x="110" y="118" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="64" fill="var(--ink)">?</text></svg>')+
   '<div><h2>'+(it.t==='d'?'Which part is shown in color?':it.q)+'</h2><div class="opts">'+opts+'</div><div style="margin-top:14px">'+fb+'</div></div></div></div>';
}

/* ---------- Radius and Diameter Machine ---------- */
var NM=null;
var LEVELS=[{id:'l1',name:'Level 1',desc:'Whole numbers. Double or halve.'},{id:'l2',name:'Level 2',desc:'Decimals and different units.'},{id:'l3',name:'Level 3',desc:'Word problems with two steps.'}];
function mkQ(level){
  var kind=Math.random()<.5?'r2d':'d2r',u=pick(['cm','cm','m','mm']);
  if(level===1){
    if(kind==='r2d'){var r=ri(2,15);return {kind:kind,given:r,ans:r*2,unit:u,diag:true,work:'d = 2 × r = 2 × '+r+' = '+r*2+' '+u}}
    var d=ri(2,15)*2;return {kind:kind,given:d,ans:d/2,unit:u,diag:true,work:'r = d ÷ 2 = '+d+' ÷ 2 = '+d/2+' '+u}
  }
  if(level===2){
    if(kind==='r2d'){var rr=pick([0.5,1.5,2.5,3.5,4.5,7.5,0.8,1.2,2.4,3.6,6.5,12.5]);return {kind:kind,given:rr,ans:fmtN(rr*2),unit:u,diag:true,work:'d = 2 × r = 2 × '+rr+' = '+fmtN(rr*2)+' '+u}}
    var dd=pick([5,7,9,11,13,3.6,4.8,7.2,9.4,1.5,2.5,0.6,15]);return {kind:kind,given:dd,ans:fmtN(dd/2),unit:u,diag:true,work:'r = d ÷ 2 = '+dd+' ÷ 2 = '+fmtN(dd/2)+' '+u}
  }
  var T=[
   function(){var d=pick([60,66,70,74,80]);return {text:'A bicycle wheel has a diameter of '+d+' cm. How far is the hub (the center) from the tire?',given:d,ans:d/2,unit:'cm',work:'The hub to the tire is a radius. r = '+d+' ÷ 2 = '+d/2+' cm',kind:'d2r'}},
   function(){var r=pick([0.6,0.75,0.9,1.2]);return {text:'A round table has a radius of '+r+' m. How wide is the table across its middle?',given:r,ans:fmtN(r*2),unit:'m',work:'Across the middle is the diameter. d = 2 × '+r+' = '+fmtN(r*2)+' m',kind:'r2d'}},
   function(){var d=pick([24,30,36,40]);return {text:'A clock face has a diameter of '+d+' cm. The minute hand reaches from the center to the edge. How long is the hand?',given:d,ans:d/2,unit:'cm',work:'The hand is a radius. r = '+d+' ÷ 2 = '+d/2+' cm',kind:'d2r'}},
   function(){var r=pick([3,4,5,6]);return {text:'Two circles each have a radius of '+r+' cm. They touch at one point. How far apart are their centers?',given:r,ans:r*2,unit:'cm',work:'Radius + radius = '+r+' + '+r+' = '+r*2+' cm',kind:'r2d'}},
   function(){var r=pick([2,3,4,5]);return {text:'Three circles with a radius of '+r+' cm touch in a row. How long is the row?',given:r,ans:r*6,unit:'cm',work:'One diameter is 2 × '+r+' = '+r*2+' cm. Three diameters: 3 × '+r*2+' = '+r*6+' cm',kind:'r2d'}},
   function(){var d=pick([1.2,1.6,2]);var o=pick([10,15,20]);var res=fmtN(d+2*o/100);return {text:'A round table has a diameter of '+d+' m. A tablecloth hangs '+o+' cm over the edge all the way round. What is the diameter of the cloth in meters?',given:d,ans:res,unit:'m',work:o+' cm = '+o/100+' m. Add it twice: '+d+' + 2 × '+o/100+' = '+res+' m',kind:'r2d'}}
  ];
  return pick(T)();
}
function fmtN(n){return Math.round(n*1000)/1000}
function numStart(level){
  var qs=[],seen={};
  while(qs.length<10){var q=mkQ(level);var key=q.text||(q.kind+q.given+q.unit);if(seen[key])continue;seen[key]=1;qs.push(q)}
  NM={level:level,qs:qs,i:0,score:0,res:null};numRender();
}
function qDiagram(q){
  var s='<svg viewBox="0 0 200 180" role="img" aria-label="Circle with '+(q.kind==='r2d'?'radius':'diameter')+' '+q.given+' '+q.unit+'"><circle cx="100" cy="90" r="70" fill="var(--butter-soft)" stroke="var(--ink)" stroke-width="3"/><circle cx="100" cy="90" r="4.5" fill="var(--ink)"/>';
  if(q.kind==='r2d'){s+='<path d="M100 90 L'+P2(pol(35,70,100,90))+'" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/><rect x="118" y="38" width="'+(String(q.given+' '+q.unit).length*9+14)+'" height="26" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><text x="'+(118+(String(q.given+' '+q.unit).length*9+14)/2)+'" y="52" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="700" font-size="15" fill="var(--ink)">'+q.given+' '+q.unit+'</text>'}
  else{s+='<path d="M30 90 H170" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/><rect x="'+(100-(String(q.given+' '+q.unit).length*9+14)/2)+'" y="100" width="'+(String(q.given+' '+q.unit).length*9+14)+'" height="26" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><text x="100" y="114" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="700" font-size="15" fill="var(--ink)">'+q.given+' '+q.unit+'</text>'}
  return s+'</svg>';
}
function numRender(){
  if(!NM){return}
  if(NM.level===0){
    app.innerHTML='<div class="shell"><div class="titlebar"><h1>Radius and Diameter Machine</h1><span>Choose a level. Each level has 10 questions.</span></div><div class="levels">'+LEVELS.map(function(l,k){var b=(store.numbers||{})[l.id];return '<button class="lvl" data-lvl="'+(k+1)+'"><b>'+l.name+'</b><span>'+l.desc+'</span><span style="margin-top:8px"><span class="chip '+(b!==undefined?'done':'')+'">'+(b!==undefined?'Best '+b+' of 10':'Not played yet')+'</span></span></button>'}).join('')+'</div>'+
      '<div class="card"><b>Remember:</b> the diameter is twice the radius, so <b>d = 2 × r</b>. The radius is half the diameter, so <b>r = d ÷ 2</b>.</div></div>';
    return;
  }
  if(NM.i>=NM.qs.length){
    var id=LEVELS[NM.level-1].id;store.numbers=store.numbers||{};store.numbers[id]=Math.max(store.numbers[id]||0,NM.score);save();
    var n=NM.score>=9?3:NM.score>=7?2:1;
    app.innerHTML='<div class="shell"><div class="titlebar"><h1>Radius and Diameter Machine</h1></div><div class="end card">'+(NM.score>=7?confetti():'')+'<h2>'+NM.score+' out of 10 on '+LEVELS[NM.level-1].name+'</h2>'+stars(n)+'<div class="row"><button class="btn" data-nact="retry">Try this level again</button>'+(NM.level<3?'<button class="btn primary" data-lvl="'+(NM.level+1)+'">Go to Level '+(NM.level+1)+'</button>':'<a class="btn primary" style="text-decoration:none;display:inline-flex;align-items:center" href="#board">Open the Construction Board</a>')+'</div></div></div>';
    return;
  }
  var q=NM.qs[NM.i];var res=NM.res;
  var text=q.text||(q.kind==='r2d'?'The radius is '+q.given+' '+q.unit+'. Find the diameter.':'The diameter is '+q.given+' '+q.unit+'. Find the radius.');
  var label=q.kind==='r2d'?(q.text&&/across|apart|long|cloth/.test(q.text)?'Answer':'d ='):(q.text?'r =':'r =');
  var fb='';
  if(NM.bad&&!res){fb='<div class="msg bad" role="status"><b class="mark">Check your answer.</b>Type a number only, like 4.5 or 12. You can add the unit, like 12 cm.</div>';NM.bad=false}
  if(res){fb='<div class="msg '+(res.ok?'ok':'bad')+'" role="status"><b class="mark">'+(res.ok?'Correct.':'Not quite.')+'</b>'+(res.ok?'':(res.tip?res.tip+' ':''))+q.work+'</div><div class="row" style="margin-top:12px"><button class="btn primary" data-nact="next">'+(NM.i===9?'Finish':'Next question')+'</button></div>'}
  app.innerHTML='<div class="shell"><div class="titlebar"><h1>Radius and Diameter Machine</h1><span>'+LEVELS[NM.level-1].name+', question '+(NM.i+1)+' of 10, score '+NM.score+'</span></div><div class="bar"><i style="width:'+(NM.i*10)+'%"></i></div>'+
   '<div class="card numq">'+(q.diag?qDiagram(q):'<svg viewBox="0 0 200 180" aria-hidden="true"><circle cx="100" cy="90" r="70" fill="var(--sky-soft)" stroke="var(--ink)" stroke-width="3"/><path d="M100 90 L'+P2(pol(40,70,100,90))+'" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/><path d="M30 90 H170" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 5"/><circle cx="100" cy="90" r="4.5" fill="var(--ink)"/></svg>')+
   '<div><p class="qt">'+text+'</p><form class="ans" id="nform"><label for="nin">'+label+'</label><input class="num" id="nin" inputmode="decimal" autocomplete="off" '+(res?'disabled value="'+res.val+'"':'')+'><span class="unit">'+q.unit+'</span>'+(res?'':'<button class="btn primary" type="submit">Check answer</button>')+'</form><div style="margin-top:14px">'+fb+'</div></div></div></div>';
  if(!res){var inp=$('#nin');if(inp)inp.focus({preventScroll:true})}
}
function parseAnswer(raw){var m=String(raw).trim().match(/^(\d+(?:[.,]\d+)?|[.,]\d+)\s*(?:cm|m|degrees|degree|°)?$/i);return m?parseFloat(m[1].replace(',','.').replace(/^\./,'0.')):NaN}
function numCheck(raw){
  var q=NM.qs[NM.i];var v=parseAnswer(raw);
  if(isNaN(v)){NM.bad=true;numRender();return false}
  var ok=Math.abs(v-q.ans)<1e-9,tip='';
  if(!ok&&!q.text){
    if(Math.abs(v-q.given)<1e-9)tip=q.kind==='d2r'?'That is the diameter you were given. The radius is half of it.':'That is the radius you were given. The diameter is twice it.';
    else if(q.kind==='r2d'&&Math.abs(v-q.given/2)<1e-9)tip='You halved it. To find the diameter, double the radius.';
    else if(q.kind==='d2r'&&Math.abs(v-q.given*2)<1e-9)tip='You doubled it. To find the radius, halve the diameter.';
  }
  if(ok){NM.score++;setTimeout(celebrate,30)}else buddyOops('Not quite. See the steps.');NM.res={ok:ok,tip:tip,val:raw};numRender();return true;
}
views.numbers=function(){NM={level:0};numRender()};

});

var BD=null;
function bdStart(ti){
  BD={ti:ti,drawn:[],c:{mode:'ruler',d:0,N:[RX0,RY],th:0,st:'idle',cov:{},live:[],val:0},msg:'',kind:'',drag:null,lastCol:0};
  bdRender();
}
function geom(){
  var c=BD.c,d=c.d,N=c.N,P=[N[0]+d*Math.cos(c.th),N[1]+d*Math.sin(c.th)];
  var h=Math.sqrt(Math.max(LEG*LEG-(d/2)*(d/2),4));
  var mid=[(N[0]+P[0])/2,(N[1]+P[1])/2],nx=Math.sin(c.th),ny=-Math.cos(c.th);
  var H=[mid[0]+nx*h,mid[1]+ny*h];if(H[1]<10){H=[mid[0]-nx*h,mid[1]-ny*h]}

};
function quizRender(){
  if(QS.i>=QS.qs.length){
    store.quiz=Math.max(store.quiz||0,QS.score);save();
    var n=QS.score>=9?3:QS.score>=7?2:1;
    app.innerHTML='<div class="shell"><div class="titlebar"><h1>Quiz Time</h1></div><div class="end card"><h2>You scored '+QS.score+' out of '+QS.qs.length+'</h2>'+stars(n)+'<p>'+(QS.score===10?'Perfect quiz.':QS.score>=7?'Strong work. Take it again for new questions.':'Visit Learn first, then try again.')+'</p><p style="margin:0;color:var(--muted)">Longest streak: '+QS.best+' in a row</p><div class="row"><button class="btn primary" data-qa="again">New quiz</button><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#exam">Take the Unit Exam</a></div></div></div>';
    return;
  }
  var q=QS.qs[QS.i],v=QS.ans[QS.i],locked=QS.checked;
  var pips=QS.qs.map(function(x,i){var st=i<QS.i||(i===QS.i&&locked)?(qIsRight(x,QS.ans[i])?'ok':'no'):(i===QS.i?'cur':'');return '<i class="'+st+'">'+(st==='ok'?CHECK:'')+'</i>'}).join('');
  var fig=q.fig?q.fig():'';
  var art=fig?'<div class="qzpaper">'+fig+'</div>':'<svg class="qzdoodle" viewBox="0 0 220 200" aria-hidden="true"><circle class="ch" cx="110" cy="100" r="74"/><path class="ch y" d="M110 100L184 100" style="stroke-width:4.5"/><path class="ch" d="M36 100H110" stroke-dasharray="2 10" style="stroke-width:3"/><circle class="ch" cx="110" cy="100" r="3" style="stroke-width:7"/><text class="ch-txt y" x="138" y="90" style="font-size:34px">r</text><text class="ch-txt" x="110" y="150" text-anchor="middle" style="font-size:44px">?</text></svg>';
  var fb;
  if(locked){var ok=qIsRight(q,v);fb='<div class="qzfb '+(ok?'ok':'bad')+'" role="status"><div class="qzmsg"><span class="qzbuddy">'+buddySvg(ok?'cheer':'oops',58)+'</span><div><b class="mark">'+(ok?'Correct.':'Not quite.')+'</b> '+(ok?'':'The answer is '+q.ans+(q.unit?' '+q.unit:'')+'. ')+q.exp+'</div></div><button class="btn primary" data-qa="next">'+(QS.i===QS.qs.length-1?'Finish':'Next question')+'</button></div>'}
  else fb='<div class="qzfb idle"><span class="hand">'+(q.t==='num'?'Type your answer, then press Check answer.':'Tap an answer. It is checked right away.')+'</span></div>';
  app.innerHTML='<div class="qz"><div class="qzhead"><h1>Quiz Time</h1><div class="pips" role="img" aria-label="Question '+(QS.i+1)+' of '+QS.qs.length+'">'+pips+'</div><div class="qzstats"><span>Score <b>'+QS.score+'</b></span><span class="streak'+(QS.streak>=3?' hot':'')+'">Streak '+QS.streak+'</span></div></div>'+
   '<div class="qzcard"><div class="qzart">'+art+'</div><div class="qzmain"><div class="secname">Question '+(QS.i+1)+' of '+QS.qs.length+'</div><p class="qt">'+q.q+'</p>'+qInput(q,v,locked)+'</div>'+fb+'</div></div>';
  if(!locked&&q.t==='num'){var el=$('#qin');if(el)el.focus({preventScroll:true})}
}
function quizCheck(val){
  var q=QS.qs[QS.i];QS.ans[QS.i]=val;QS.checked=true;
  if(qIsRight(q,val)){QS.score++;QS.streak++;QS.best=Math.max(QS.best,QS.streak);if(QS.streak===3)BUD.once='Three in a row!';if(QS.streak===5)BUD.once='Five in a row! On fire!';setTimeout(celebrate,30)}else{QS.streak=0;buddyOops('Not quite. Read the answer.')}
  quizRender();
}

/* ---------- Unit Exam ---------- */
views.exam=function(){QS={mode:'exam',qs:EXAM_Q,i:0,ans:{},stage:'intro',confirm:false};examRender()};
function examRender(){
  if(QS.stage==='intro'){
    app.innerHTML='<div class="shell"><div class="titlebar"><h1>Unit Exam</h1><span>Circles, Lessons 4 and 5</span></div><div class="card" style="display:grid;gap:12px"><h2 style="font-size:26px">Before you start</h2><ul class="how" style="color:var(--ink)"><li>There are 20 questions in 4 sections. Each question is worth 1 point.</li><li>You will not see the answers until you finish. You can go back and change an answer.</li><li>Use a pencil and paper for working. Decimals are fine, for example 4.5.</li><li>When you are ready, press Submit exam.</li></ul><div class="row"><button class="btn primary" data-ea="start">Start the exam</button>'+(store.exam!==undefined?'<span class="chip done">Best score '+store.exam+' of 20</span>':'')+'</div></div></div>';
    return;
  }
  if(QS.stage==='result'){examResult();return}
  var q=QS.qs[QS.i],v=QS.ans[QS.i];
  var nav='<div class="nav20" role="group" aria-label="Question navigator">'+QS.qs.map(function(x,i){var has=QS.ans[i]!==undefined&&String(QS.ans[i]).trim()!=='';return '<button data-eg="'+i+'" class="'+(i===QS.i?'cur':has?'ans':'')+'" aria-label="Question '+(i+1)+(has?', answered':', not answered')+'">'+(i+1)+'</button>'}).join('')+'</div>';
  var blanks=QS.qs.filter(function(x,i){return QS.ans[i]===undefined||String(QS.ans[i]).trim()===''}).length;
  var conf=QS.confirm?'<div class="msg bad" role="status">You left '+blanks+' question'+(blanks===1?'':'s')+' blank. Submit anyway?<div class="row" style="margin-top:10px"><button class="btn primary" data-ea="submit2">Yes, submit</button><button class="btn" data-ea="cancel">Keep working</button></div></div>':'';
  app.innerHTML='<div class="shell"><div class="titlebar"><h1>Unit Exam</h1><span>Question '+(QS.i+1)+' of 20</span></div>'+nav+qCard(q,v,false,SEC[q.sec])+
   '<div class="row"><button class="btn" data-ea="prev"'+(QS.i===0?' disabled':'')+'>Back</button><button class="btn" data-ea="next"'+(QS.i===19?' disabled':'')+'>Next</button><span style="flex:1"></span><button class="btn primary" data-ea="submit">Submit exam</button></div>'+conf+'</div>';
}
function examResult(){
  var sc=0,secs={A:[0,0],B:[0,0],C:[0,0],D:[0,0]};
  var rows=QS.qs.map(function(q,i){var ok=qIsRight(q,QS.ans[i]);secs[q.sec][1]++;if(ok){sc++;secs[q.sec][0]++}
    var yours=(QS.ans[i]===undefined||String(QS.ans[i]).trim()==='')?'No answer':QS.ans[i]+(q.t==='num'?' '+q.unit:'');
    return '<div class="r '+(ok?'ok':'no')+'"><div class="no-n">'+(i+1)+'</div><div><p><b>'+q.q+'</b></p><p>Your answer: '+yours+(ok?' (correct)':' (not correct)')+'</p>'+(ok?'':'<p>Correct answer: <b>'+q.ans+(q.t==='num'?' '+q.unit:'')+'</b></p>')+'<p style="color:var(--muted)">'+q.exp+'</p></div></div>'}).join('');
  store.exam=Math.max(store.exam||0,sc);save();
  var band=sc>=18?'Excellent. You are ready for the next unit.':sc>=14?'Good work. Review the questions you missed.':sc>=10?'Keep practicing. Visit Learn and the practice activities again.':'Go back to Learn first, then try the exam again.';
  var bands=['A','B','C','D'].map(function(k){return '<div><span style="font-size:13px;color:var(--muted)">'+SEC[k].replace(/^Section .: /,'')+'</span><b>'+secs[k][0]+' / '+secs[k][1]+'</b></div>'}).join('');
  app.innerHTML='<div class="shell"><div class="titlebar"><h1>Unit Exam results</h1></div><div class="end card"><h2>'+sc+' out of 20</h2>'+stars(sc>=18?3:sc>=14?2:1)+'<p>'+band+'</p><div class="bands" style="width:100%">'+bands+'</div><div class="row"><button class="btn primary" data-ea="retake">Retake the exam</button><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#home">All activities</a></div></div><h2 style="font-size:24px">Review every question</h2><div class="rev">'+rows+'</div></div>';
}
app.addEventListener('click',function(e){
  var h=(location.hash||'').slice(1);
  if(h==='quiz'&&QS&&QS.mode==='quiz'){
    var o=e.target.closest('[data-qo]');if(o&&!QS.checked){quizCheck(QS.qs[QS.i].opts[+o.dataset.qo]);return}
    var a=e.target.closest('[data-qa]');if(a){if(a.dataset.qa==='again')views.quiz();else{QS.i++;QS.checked=false;quizRender()}}
  }
  if(h==='exam'&&QS&&QS.mode==='exam'){
    var oo=e.target.closest('[data-qo]');if(oo&&QS.stage==='q'){QS.ans[QS.i]=QS.qs[QS.i].opts[+oo.dataset.qo];examRender();return}
    var g=e.target.closest('[data-eg]');if(g){QS.i=+g.dataset.eg;QS.confirm=false;examRender();return}
    var b=e.target.closest('[data-ea]');if(!b)return;var k=b.dataset.ea;
    if(k==='start'){QS.stage='q';examRender()}
    else if(k==='prev'){QS.i=Math.max(0,QS.i-1);QS.confirm=false;examRender()}
    else if(k==='next'){QS.i=Math.min(19,QS.i+1);QS.confirm=false;examRender()}
    else if(k==='submit'){var bl=QS.qs.filter(function(x,i){return QS.ans[i]===undefined||String(QS.ans[i]).trim()===''}).length;if(bl>0){QS.confirm=true;examRender()}else{QS.stage='result';examRender()}}
    else if(k==='submit2'){QS.stage='result';examRender();window.scrollTo(0,0)}
    else if(k==='cancel'){QS.confirm=false;examRender()}
    else if(k==='retake'){views.exam();QS.stage='q';examRender();window.scrollTo(0,0)}
  }
});
app.addEventListener('submit',function(e){
  if(e.target.id!=='qform')return;e.preventDefault();
  var h=(location.hash||'').slice(1),v=$('#qin').value.trim();
  if(h==='quiz'&&QS&&!QS.checked){if(v==='')return;quizCheck(v)}
});
app.addEventListener('input',function(e){
  if(e.target.id!=='qin'||!QS||QS.mode!=='exam')return;
  QS.ans[QS.i]=e.target.value;
});


route();
})();
</script>

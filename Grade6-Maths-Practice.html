on points=\"0,85.0 140,85.0 140,130 0,130\" fill=\"#bae6fd\" fill-opacity=\"0.85\" stroke=\"none\"/><polygon points=\"140,85.0 180,45.0 180,90 140,130\" fill=\"#7dd3fc\" fill-opacity=\"0.85\" stroke=\"none\"/><polygon points=\"0,85.0 40,45.0 180,45.0 140,85.0\" fill=\"#38bdf8\" fill-opacity=\"0.6\" stroke=\"#1f2937\" stroke-width=\"1.2\"/><polygon points=\"0,40 140,40 140,130 0,130\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,130 40,90 180,90\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"70.0\" y=\"148.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">30 cm</text><text x=\"-14.0\" y=\"85.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text><text x=\"190.0\" y=\"22.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">25 cm</text></svg>","sol":"Capacity = 30 × 25 × 20 = 15 000 cm<sup>3</sup> = 15 litres. Half of that is 7.5 litres.","scheme":[],"watch":"Giving the capacity of the whole tank (15 litres) instead of half of it.","opts":["3.75 litres","7.5 litres","15 litres","75 litres"],"ans":1,"check":{"type":"mcq"}},{"n":17,"s":"A","m":1,"text":"Here is a number pattern.<br><b>2, &nbsp;6, &nbsp;12, &nbsp;20, &nbsp;30, &nbsp;___</b><br>Which number comes next?","fig":"","sol":"The differences are 4, 6, 8, 10 — they go up by 2 each time. The next difference is 12, so the next number is 30 + 12 = 42.","scheme":[],"watch":"Adding the same difference as last time (30 + 10 = 40).","opts":["38","40","42","44"],"ans":2,"check":{"type":"mcq"}},{"n":18,"s":"A","m":1,"text":"Each figure in the pattern below is built from matchsticks.<br>How many matchsticks are needed to build <b>Figure 15</b>?","fig":"<svg class=\"fig\" viewBox=\"-14.0 -14.0 282.4 82.0\" style=\"width:104mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,24 24.0,24 12.0,0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"52.8,24 76.8,24 64.8,0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"64.8,0 88.8,0 76.8,24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"117.6,24 141.6,24 129.6,0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"129.6,0 153.6,0 141.6,24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"141.6,24 165.6,24 153.6,0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"194.39999999999998,24 218.39999999999998,24 206.39999999999998,0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"206.39999999999998,0 230.39999999999998,0 218.39999999999998,24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"218.39999999999998,24 242.39999999999998,24 230.39999999999998,0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><polygon points=\"230.39999999999998,0 254.39999999999998,0 242.39999999999998,24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><text x=\"12.0\" y=\"46.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 1</text><text x=\"70.8\" y=\"46.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 2</text><text x=\"141.6\" y=\"46.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 3</text><text x=\"224.4\" y=\"46.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 4</text></svg>","sol":"Figure 1 uses 3 matchsticks and each new triangle needs 2 more: 3, 5, 7, 9, … So Figure 15 uses 3 + 2 × 14 = 31 matchsticks.","scheme":[],"watch":"Doubling the figure number and forgetting the extra matchstick (30).","opts":["15","16","30","31"],"ans":3,"check":{"type":"mcq"}},{"n":19,"s":"A","m":1,"text":"The pie chart shows the <b>200 books</b> sold at a book fair. How many <b>more</b> story books than puzzle books were sold?","fig":"<div class=\"figbox\"><svg class=\"fig\" viewBox=\"-82.0 -82.0 164.0 164.0\" style=\"width:50mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L0.00,-70.00 A70,70 0 0 1 41.14,56.63 Z\" fill=\"#4338ca\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"41.3\" y=\"-13.4\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">144°</text><path d=\"M0,0 L41.14,56.63 A70,70 0 0 1 -56.63,41.14 Z\" fill=\"#0d9488\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-6.8\" y=\"42.9\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">90°</text><path d=\"M0,0 L-56.63,41.14 A70,70 0 0 1 -56.63,-41.14 Z\" fill=\"#c2410c\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-43.4\" y=\"0.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">72°</text><path d=\"M0,0 L-56.63,-41.14 A70,70 0 0 1 -0.00,-70.00 Z\" fill=\"#a21caf\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-19.7\" y=\"-38.7\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">54°</text><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.6\"/></svg><div class=\"legend\"><span class=\"lgi\"><i style=\"background:#4338ca\"></i>Story</span><span class=\"lgi\"><i style=\"background:#0d9488\"></i>Comic</span><span class=\"lgi\"><i style=\"background:#c2410c\"></i>Puzzle</span><span class=\"lgi\"><i style=\"background:#a21caf\"></i>Craft</span></div></div>","sol":"Story = <sup>144</sup>⁄<sub>360</sub> × 200 = 80 books. Puzzle = <sup>72</sup>⁄<sub>360</sub> × 200 = 40 books. 80 − 40 = 40 books.","scheme":[],"watch":"Subtracting the two angles (144° − 72° = 72°) and giving 72 as a number of books.","opts":["30","40","50","72"],"ans":1,"check":{"type":"mcq"}},{"n":20,"s":"A","m":1,"text":"The table shows the favourite colour of <b>90 pupils</b>. Malee is drawing a pie chart of the data. Find the <b>angle</b> of the sector for <b>green</b>.","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:left\">Colour</th><th style=\"text-align:center\">Blue</th><th style=\"text-align:center\">Green</th><th style=\"text-align:center\">Red</th><th style=\"text-align:center\">Yellow</th></tr></thead><tbody><tr><td style=\"text-align:left\">Number of pupils</td><td style=\"text-align:center\">30</td><td style=\"text-align:center\">20</td><td style=\"text-align:center\">25</td><td style=\"text-align:center\">15</td></tr></tbody></table></div>","sol":"Green = 20 out of 90 pupils. Angle = <sup>20</sup>⁄<sub>90</sub> × 360° = 80°.","scheme":[],"watch":"Reading the wrong row and giving the angle for blue (120°).","opts":["20°","72°","80°","120°"],"ans":2,"check":{"type":"mcq"}},{"n":21,"s":"B","m":2,"text":"In triangle <i>KLM</i>, ∠<i>KML</i> = 84° and ∠<i>MKL</i> is <b>3 times</b> ∠<i>KLM</i>. Find ∠<i>KLM</i>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 30.9 248.0 133.1\" style=\"width:56mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,140.0 200.0,140.0 191.0,54.9\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"176.0,140.0 176.1,138.0 176.3,136.1 176.7,134.2 177.3,132.3 178.0,130.5 178.8,128.7 179.8,127.1 180.9,125.5 182.2,123.9 183.5,122.5 185.0,121.3 186.6,120.1 188.2,119.1 190.0,118.2 191.8,117.5 193.6,116.9 195.5,116.4 197.5,116.1\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"170.3\" y=\"114.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">84°</text><text x=\"-14.7\" y=\"143.2\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">L</text><text x=\"213.9\" y=\"145.7\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">M</text><text x=\"202.0\" y=\"44.7\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">K</text></svg>","sol":"∠MKL + ∠KLM = 180° − 84° = 96°. If ∠KLM is 1 part then ∠MKL is 3 parts, so 4 parts = 96°. One part = 96° ÷ 4 = 24°, so ∠KLM = 24°.","scheme":["M1 180° − 84° = 96° shared between the two angles","A1 96° ÷ 4 = 24°"],"watch":"Dividing 96° by 3 instead of by 4 (32°).","ans":"24°","check":{"type":"numeric","nums":[24.0],"unit":"deg","display":"24°"}},{"n":22,"s":"B","m":2,"text":"The diagram shows a circle with centre <i>O</i>. The radius of the circle is <b>10 cm</b>. The straight line drawn across the circle is <b>16 cm</b> long. Sofia says, “That line is a diameter of the circle.” <b>Explain why Sofia is wrong.</b>","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"-58.5\" y1=\"-38.5\" x2=\"58.5\" y2=\"-38.5\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"-51.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">16 cm</text></svg>","sol":"The diameter of the circle is 2 × 10 = 20 cm. The line is only 16 cm long, and it does not pass through the centre <i>O</i>, so it is a chord, not a diameter.","scheme":["B1 diameter = 2 × 10 = 20 cm","C1 16 cm ≠ 20 cm (and the line misses the centre), so it is a chord"],"watch":"Comparing the 16 cm line with the radius (10 cm) instead of with the diameter.","ans":"It is a chord, not a diameter","check":{"type":"self"}},{"n":23,"s":"B","m":2,"text":"Malee's solid has <b>8 faces</b>, <b>18 edges</b> and <b>12 vertices</b>. Ben's solid has <b>8 faces</b>, <b>14 edges</b> and <b>8 vertices</b>. Every face of each solid is flat. Write down the <b>name</b> of each solid.","fig":"","sol":"A prism on an <i>n</i>-sided base has <i>n</i> + 2 faces, 3<i>n</i> edges and 2<i>n</i> vertices. Here 3<i>n</i> = 18, so <i>n</i> = 6 — a hexagonal prism. A pyramid on an <i>n</i>-sided base has <i>n</i> + 1 faces, 2<i>n</i> edges and <i>n</i> + 1 vertices. Here 2<i>n</i> = 14, so <i>n</i> = 7 — a pyramid on a 7-sided base.","scheme":["B1 hexagonal prism","B1 heptagonal (7-sided) pyramid"],"watch":"Calling Ben's solid an octagonal pyramid because it has 8 faces — the base has only 7 sides.","ans":"Malee: hexagonal prism; Ben: heptagonal pyramid","check":{"type":"self"}},{"n":24,"s":"B","m":2,"text":"Anong has drawn the six squares below. She says they will fold up to make a cube. <b>Explain why she is wrong</b>, and describe <b>one</b> square she could move to put it right.","fig":"<svg class=\"fig\" viewBox=\"-16.0 -16.0 176.0 104.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"36\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"72\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"108\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"36\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg>","sol":"Folding the row of four gives the four side faces. Both of the lower squares then fold underneath, landing on the same face, so one face is doubled and the top of the cube is left open. Moving either one of the two lower squares so that it sits <b>above</b> the row gives one square for the base and one for the top, and the net then folds into a cube.","scheme":["C1 says two squares land on the same face, leaving one face open","C1 describes moving one lower square to the top of the row"],"watch":"Saying there are too many squares — there are exactly six, so the number is not the problem.","ans":"Two squares fold on top of each other; move one of the two lower squares above the row","check":{"type":"self"}},{"n":25,"s":"B","m":2,"text":"The triangle below has an area of <b>84 cm<sup>2</sup></b>. The dashed line shows its height, which is 8 cm. Find the length of the <b>base</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 216.0 112.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,64.0 168.0,64.0 120.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"108.0\" y1=\"64.0\" x2=\"108.0\" y2=\"52.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"108.0\" y1=\"52.0\" x2=\"120.0\" y2=\"52.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"120.0\" y1=\"64.0\" x2=\"120.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"84.0\" y=\"82.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"114.0\" y=\"32.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text></svg>","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × base × height, so 84 = <sup>1</sup>⁄<sub>2</sub> × base × 8 = 4 × base. Base = 84 ÷ 4 = 21 cm.","scheme":["M1 84 ÷ 8 × 2, or 84 = 4 × base","A1 21 cm"],"watch":"Dividing 84 by 8 and stopping there (10.5 cm) — the halving has not been undone.","ans":"21 cm","check":{"type":"numeric","nums":[21.0],"unit":"cm","display":"21 cm"}},{"n":26,"s":"B","m":2,"text":"A triangular banner has two sides of <b>65 cm</b> and one side of <b>0.9 m</b>. Find its <b>perimeter</b>. Give your answer in <b>metres</b>.","fig":"","sol":"Change to the same unit: 65 cm = 0.65 m. Perimeter = 0.65 + 0.65 + 0.9 = 2.2 m. (Or 65 + 65 + 90 = 220 cm = 2.2 m.)","scheme":["M1 65 cm = 0.65 m, or 0.9 m = 90 cm","A1 2.2 m"],"watch":"Adding 65 + 65 + 0.9 without changing to the same unit first.","ans":"2.2 m","check":{"type":"numeric","nums":[2.2],"unit":"m","display":"2.2 m"}},{"n":27,"s":"B","m":2,"text":"Triangle <b>A</b> and triangle <b>B</b> have the <b>same area</b>. Find the <b>height</b> of triangle B.","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:center\">Triangle</th><th style=\"text-align:center\">Base</th><th style=\"text-align:center\">Height</th></tr></thead><tbody><tr><td style=\"text-align:center\">A</td><td style=\"text-align:center\">24 cm</td><td style=\"text-align:center\">15 cm</td></tr><tr><td style=\"text-align:center\">B</td><td style=\"text-align:center\">18 cm</td><td style=\"text-align:center\">?</td></tr></tbody></table></div>","sol":"Area of A = <sup>1</sup>⁄<sub>2</sub> × 24 × 15 = 180 cm<sup>2</sup>. For B: 180 = <sup>1</sup>⁄<sub>2</sub> × 18 × height = 9 × height, so height = 180 ÷ 9 = 20 cm.","scheme":["M1 area of A = 180 cm²","A1 20 cm"],"watch":"Assuming the height must also shrink, because B's base is smaller than A's.","ans":"20 cm","check":{"type":"numeric","nums":[20.0],"unit":"cm","display":"20 cm"}},{"n":28,"s":"B","m":2,"text":"The diagram shows a step shape. The <b>heights</b> of the three steps are <b>not</b> marked. Find the <b>perimeter</b> of the shape.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 248.0 208.0\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,160.0 200.0,160.0 200.0,100.0 140.0,100.0 140.0,60.0 80.0,60.0 80.0,0.0 0.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"100.0\" y=\"177.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text><text x=\"170.0\" y=\"117.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">3 cm</text><text x=\"110.0\" y=\"43.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">3 cm</text><text x=\"40.0\" y=\"-17.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 cm</text><text x=\"-17.0\" y=\"80.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text></svg>","sol":"The three step heights together must equal the left-hand side, 8 cm. The three top pieces are 4 + 3 + 3 = 10 cm, which matches the bottom. Perimeter = 10 (bottom) + 8 (left) + 10 (steps across) + 8 (steps up) = 36 cm. This is the same as the perimeter of a 10 cm by 8 cm rectangle.","scheme":["M1 the three step heights add up to 8 cm (or 2 × (10 + 8))","A1 36 cm"],"watch":"Adding only the five marked lengths and giving 28 cm.","ans":"36 cm","check":{"type":"numeric","nums":[36.0],"unit":"cm","display":"36 cm"}},{"n":29,"s":"B","m":2,"text":"A rectangular sheet of card is 24 cm long and 15 cm wide. A square of side <b>4 cm</b> is cut from <b>each of the four corners</b>, leaving the shape below. Find the <b>area</b> of the shape that is left.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -42.0 208.0 156.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"24.0,0.0 120.0,0.0 120.0,24.0 144.0,24.0 144.0,66.0 120.0,66.0 120.0,90.0 24.0,90.0 24.0,66.0 0.0,66.0 0.0,24.0 24.0,24.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"144.0\" y2=\"0.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><line x1=\"144.0\" y1=\"0.0\" x2=\"144.0\" y2=\"90.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><line x1=\"144.0\" y1=\"90.0\" x2=\"0.0\" y2=\"90.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><line x1=\"0.0\" y1=\"90.0\" x2=\"0.0\" y2=\"0.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"72.0\" y=\"-18.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">24 cm</text><text x=\"160.0\" y=\"45.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 cm</text></svg>","sol":"Area of the whole sheet = 24 × 15 = 360 cm<sup>2</sup>. Each cut-off square is 4 × 4 = 16 cm<sup>2</sup>, and there are four of them: 4 × 16 = 64 cm<sup>2</sup>. Area left = 360 − 64 = 296 cm<sup>2</sup>.","scheme":["M1 360 − 4 × 16","A1 296 cm²"],"watch":"Subtracting only one 16 cm² square and giving 344 cm².","ans":"296 cm<sup>2</sup>","check":{"type":"numeric","nums":[296.0],"unit":"cm2","display":"296 cm²"}},{"n":30,"s":"B","m":2,"text":"A rectangular field is 60 m long and 45 m wide. Krit jogs <b>5 times</b> all the way round the edge of the field. How far does he jog? Give your answer in <b>kilometres</b>.","fig":"","sol":"Perimeter = 2 × (60 + 45) = 210 m. Five laps = 5 × 210 = 1 050 m = 1.05 km.","scheme":["M1 perimeter = 210 m and 5 × 210 = 1 050 m","A1 1.05 km"],"watch":"Working out the area (2 700 m²) instead of the perimeter.","ans":"1.05 km","check":{"type":"numeric","nums":[1.05],"unit":"km","display":"1.05 km"}},{"n":31,"s":"B","m":2,"text":"A circular fountain has a radius of <b>3.5 m</b>. Sofia walks all the way round the edge of the fountain <b>4 times</b>. How far does she walk? (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"","sol":"Circumference = 2 × <sup>22</sup>⁄<sub>7</sub> × 3.5 = 22 m. Four times round = 4 × 22 = 88 m.","scheme":["M1 circumference = 22 m","A1 88 m"],"watch":"Using the radius as the diameter, which halves every answer (44 m).","ans":"88 m","check":{"type":"numeric","nums":[88.0],"unit":"m","display":"88 m"}},{"n":32,"s":"B","m":2,"text":"The shaded shape below is a <b>ring</b> between two circles that have the same centre. The outer radius is 10 cm and the inner radius is 6 cm. Find the <b>shaded area</b>. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-92.0 -92.0 184.0 184.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M-70,0 A70,70 0 1 0 70,0 A70,70 0 1 0 -70,0 Z M-38.5,0 A38.5,38.5 0 1 1 38.5,0 A38.5,38.5 0 1 1 -38.5,0 Z\" fill=\"#c7d2fe\" fill-rule=\"evenodd\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/></svg>","sol":"Outer circle = 3.14 × 10 × 10 = 314 cm<sup>2</sup>. Inner circle = 3.14 × 6 × 6 = 113.04 cm<sup>2</sup>. Shaded area = 314 − 113.04 = 200.96 cm<sup>2</sup>.","scheme":["M1 314 − 113.04","A1 200.96 cm²"],"watch":"Subtracting the radii first and working out 3.14 × 4 × 4 = 50.24 cm².","ans":"200.96 cm<sup>2</sup>","check":{"type":"numeric","nums":[200.96],"unit":"cm2","display":"200.96 cm²"}},{"n":33,"s":"B","m":2,"text":"The face of a round clock has an area of <b>78.5 cm<sup>2</sup></b>. Find its <b>diameter</b>. (Take π = 3.14)","fig":"","sol":"78.5 ÷ 3.14 = 25, so radius × radius = 25 and the radius is 5 cm. Diameter = 2 × 5 = 10 cm.","scheme":["M1 78.5 ÷ 3.14 = 25 so r = 5 cm","A1 10 cm"],"watch":"Stopping at the radius (5 cm) when the question asks for the diameter.","ans":"10 cm","check":{"type":"numeric","nums":[10.0],"unit":"cm","display":"10 cm"}},{"n":34,"s":"B","m":2,"text":"A cuboid has a volume of <b>648 cm<sup>3</sup></b> and a height of <b>9 cm</b>. Its length is <b>twice</b> its width. Find its <b>length</b>.","fig":"","sol":"Area of the base = 648 ÷ 9 = 72 cm<sup>2</sup>. If the width is <i>w</i> then the length is 2<i>w</i>, so 2 × <i>w</i> × <i>w</i> = 72 and <i>w</i> × <i>w</i> = 36, giving <i>w</i> = 6 cm. Length = 2 × 6 = 12 cm.","scheme":["M1 base area = 648 ÷ 9 = 72 cm² and w × w = 36","A1 12 cm"],"watch":"Giving the width (6 cm) instead of the length.","ans":"12 cm","check":{"type":"numeric","nums":[12.0],"unit":"cm","display":"12 cm"}},{"n":35,"s":"B","m":2,"text":"The wooden block below is a cuboid. A square hole of side <b>3 cm</b> is cut right through the block from the front face to the back face. Find the volume of the wood that is left.","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 304.0 188.0\" style=\"width:60mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,36 130,36 130,114 0,114\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,36 36,0 166,0 130,36\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"130,36 166,0 166,78 130,114\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,114 36,78 166,78\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"36\" y1=\"0\" x2=\"36\" y2=\"78\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"65.0\" y=\"132.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"-14.0\" y=\"75.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 cm</text><text x=\"176.0\" y=\"20.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text></svg>","sol":"Volume of the block = 12 × 5 × 8 = 480 cm<sup>3</sup>. The hole is a cuboid 3 cm by 3 cm by 8 cm, so its volume is 3 × 3 × 8 = 72 cm<sup>3</sup>. Wood left = 480 − 72 = 408 cm<sup>3</sup>.","scheme":["M1 480 − (3 × 3 × 8)","A1 408 cm³"],"watch":"Using 3 × 3 × 5 for the hole — the hole goes through the 8 cm depth, not the 5 cm height.","ans":"408 cm<sup>3</sup>","check":{"type":"numeric","nums":[408.0],"unit":"cm3","display":"408 cm³"}},{"n":36,"s":"B","m":2,"text":"The tank below is empty. A tap fills it at <b>10 litres per minute</b>. How <b>deep</b> is the water after 4 minutes?","fig":"<svg class=\"fig\" viewBox=\"-52.0 -14.0 302.0 180.0\" style=\"width:60mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,40 140,40 140,130 0,130\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,40 40,0 180,0 140,40\" fill=\"#f8fafc\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"140,40 180,0 180,90 140,130\" fill=\"#f1f5f9\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,130 40,90 180,90\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"70.0\" y=\"148.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">80 cm</text><text x=\"-14.0\" y=\"85.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">45 cm</text><text x=\"190.0\" y=\"22.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">25 cm</text></svg>","sol":"Water poured in = 4 × 10 = 40 litres = 40 000 cm<sup>3</sup>. Area of the base = 80 × 25 = 2 000 cm<sup>2</sup>. Depth = 40 000 ÷ 2 000 = 20 cm.","scheme":["M1 40 litres = 40 000 cm³ and base = 2 000 cm²","A1 20 cm"],"watch":"Dividing by the volume of the whole tank instead of by the area of the base.","ans":"20 cm","check":{"type":"numeric","nums":[20.0],"unit":"cm","display":"20 cm"}},{"n":37,"s":"B","m":2,"text":"A growing pattern is built from small triangles. The table shows how many triangles each figure uses. How many small triangles will <b>Figure 12</b> use?","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:center\">Figure</th><th style=\"text-align:center\">1</th><th style=\"text-align:center\">2</th><th style=\"text-align:center\">3</th><th style=\"text-align:center\">4</th></tr></thead><tbody><tr><td style=\"text-align:center\">Number of small triangles</td><td style=\"text-align:center\">1</td><td style=\"text-align:center\">4</td><td style=\"text-align:center\">9</td><td style=\"text-align:center\">16</td></tr></tbody></table></div>","sol":"The numbers are 1, 4, 9, 16 — these are the square numbers, so Figure <i>n</i> has <i>n</i> × <i>n</i> triangles. Figure 12 has 12 × 12 = 144 small triangles.","scheme":["M1 recognises the rule figure number × figure number","A1 144"],"watch":"Treating the pattern as “add 7 each time” from Figure 4 and giving 72.","ans":"144 small triangles","check":{"type":"numeric","nums":[144.0],"unit":"","display":"144 small triangles"}},{"n":38,"s":"B","m":2,"text":"Sofia starts at 4 and <b>doubles</b> each time:<br><b>4, &nbsp;8, &nbsp;16, &nbsp;32, &nbsp;…</b><br>Which is the <b>first</b> number in Sofia's pattern that is greater than <b>1 000</b>?","fig":"","sol":"4, 8, 16, 32, 64, 128, 256, 512, 1 024. The first number over 1 000 is 1 024.","scheme":["M1 continues correctly as far as 512","A1 1 024"],"watch":"Stopping at 512 because it is the closest to 1 000, rather than the first one over it.","ans":"1 024","check":{"type":"numeric","nums":[1024.0],"unit":"","display":"1 024"}},{"n":39,"s":"B","m":2,"text":"The pie chart shows the drinks sold in the school canteen one lunchtime. <b>24 cups</b> of lemon were sold. How many cups of <b>orange</b> were sold?","fig":"<div class=\"figbox\"><svg class=\"fig\" viewBox=\"-84.0 -84.0 168.0 168.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L0.00,-72.00 A72,72 0 0 1 50.91,-50.91 Z\" fill=\"#4338ca\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"17.1\" y=\"-41.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">45°</text><path d=\"M0,0 L50.91,-50.91 A72,72 0 0 1 18.63,69.55 Z\" fill=\"#0d9488\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"43.1\" y=\"11.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">120°</text><path d=\"M0,0 L18.63,69.55 A72,72 0 0 1 -72.00,0.00 Z\" fill=\"#c2410c\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-27.2\" y=\"35.4\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">105°</text><path d=\"M0,0 L-72.00,0.00 A72,72 0 0 1 -0.00,-72.00 Z\" fill=\"#a21caf\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-31.6\" y=\"-31.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">90°</text><circle cx=\"0\" cy=\"0\" r=\"72\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.6\"/></svg><div class=\"legend\"><span class=\"lgi\"><i style=\"background:#4338ca\"></i>Lemon</span><span class=\"lgi\"><i style=\"background:#0d9488\"></i>Orange</span><span class=\"lgi\"><i style=\"background:#c2410c\"></i>Guava</span><span class=\"lgi\"><i style=\"background:#a21caf\"></i>Soda</span></div></div>","sol":"The lemon sector is 45°, so 45° stands for 24 cups and 1° stands for 24 ÷ 45 cups. The orange sector is 120°, so orange = <sup>120</sup>⁄<sub>45</sub> × 24 = 64 cups. (In total 360° stands for 192 cups.)","scheme":["M1 total = <sup>360</sup>⁄<sub>45</sub> × 24 = 192 cups, or 120 ÷ 45 × 24","A1 64 cups"],"watch":"Adding 120 − 45 = 75 to 24 instead of scaling.","ans":"64 cups","check":{"type":"numeric","nums":[64.0],"unit":"","display":"64 cups"}},{"n":40,"s":"B","m":2,"text":"The pie chart shows the <b>480 fruit trees</b> on a farm. How many <b>more</b> durian trees are there than mangosteen and rambutan trees <b>together</b>?","fig":"<div class=\"figbox\"><svg class=\"fig\" viewBox=\"-84.0 -84.0 168.0 168.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L0.00,-72.00 A72,72 0 0 1 36.00,62.35 Z\" fill=\"#4338ca\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"43.1\" y=\"-11.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">150°</text><path d=\"M0,0 L36.00,62.35 A72,72 0 0 1 -50.91,50.91 Z\" fill=\"#0d9488\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-5.8\" y=\"44.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">75°</text><path d=\"M0,0 L-50.91,50.91 A72,72 0 0 1 -72.00,0.00 Z\" fill=\"#c2410c\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-41.2\" y=\"17.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">45°</text><path d=\"M0,0 L-72.00,0.00 A72,72 0 0 1 -0.00,-72.00 Z\" fill=\"#a21caf\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-31.6\" y=\"-31.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">90°</text><circle cx=\"0\" cy=\"0\" r=\"72\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.6\"/></svg><div class=\"legend\"><span class=\"lgi\"><i style=\"background:#4338ca\"></i>Durian</span><span class=\"lgi\"><i style=\"background:#0d9488\"></i>Mangosteen</span><span class=\"lgi\"><i style=\"background:#c2410c\"></i>Rambutan</span><span class=\"lgi\"><i style=\"background:#a21caf\"></i>Longan</span></div></div>","sol":"Durian = <sup>150</sup>⁄<sub>360</sub> × 480 = 200 trees. Mangosteen + rambutan = <sup>75 + 45</sup>⁄<sub>360</sub> × 480 = <sup>120</sup>⁄<sub>360</sub> × 480 = 160 trees. 200 − 160 = 40 trees.","scheme":["M1 durian = 200 and mangosteen + rambutan = 160","A1 40 trees"],"watch":"Comparing durian with only one of the other two sectors.","ans":"40 trees","check":{"type":"numeric","nums":[40.0],"unit":"","display":"40 trees"}},{"n":41,"s":"C","m":4,"text":"In the diagram, <i>D</i> is a point on <i>BC</i>. ∠<i>BAD</i> = 90°, ∠<i>ABD</i> = 52° and <i>AD</i> = <i>DC</i>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 57.8 262.5 124.2\" style=\"width:68mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"45.5,81.8 0.0,140.0 214.5,140.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"45.5\" y1=\"81.8\" x2=\"120.0\" y2=\"140.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"38.7\" y1=\"90.5\" x2=\"47.4\" y2=\"97.2\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"47.4\" y1=\"97.2\" x2=\"54.2\" y2=\"88.6\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"14.8,121.1 15.7,121.9 16.6,122.7 17.5,123.5 18.3,124.4 19.0,125.4 19.7,126.4 20.4,127.4 21.0,128.4 21.6,129.5 22.1,130.6 22.5,131.7 22.9,132.9 23.2,134.0 23.5,135.2 23.7,136.4 23.9,137.6 24.0,138.8 24.0,140.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"36.0\" y=\"123.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">52°</text><text x=\"34.6\" y=\"71.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><text x=\"-14.6\" y=\"143.3\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"229.3\" y=\"142.3\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><text x=\"120.0\" y=\"158.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">D</text></svg>","sol":"","scheme":["M1 180° − 90° − 52°","A1 38°","M1 ∠ADC = 180° − 38° = 142° and the base angles are equal","A1 19°"],"watch":"Using 38° as ∠ADC in part (b) instead of the angle next to it on the straight line.","parts":[{"label":"(a)","text":"Find ∠<i>ADB</i>.","fig":"","m":2,"ans":"38°","sol":"The angles of triangle ABD add to 180°. ∠ADB = 180° − 90° − 52° = 38°.","check":{"type":"numeric","nums":[38.0],"unit":"deg","display":"38°"}},{"label":"(b)","text":"Find ∠<i>ACD</i>.","fig":"","m":2,"ans":"19°","sol":"BDC is a straight line, so ∠ADC = 180° − 38° = 142°. Triangle ADC is isosceles because AD = DC, so its two base angles are equal: ∠ACD = (180° − 142°) ÷ 2 = 19°.","check":{"type":"numeric","nums":[19.0],"unit":"deg","display":"19°"}}]},{"n":42,"s":"C","m":4,"text":"Somchai has a solid with <b>6 faces</b>. Every one of its faces is a rectangle, and its edges are 14 cm, 6 cm and 9 cm.","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 304.0 188.0\" style=\"width:60mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,36 130,36 130,114 0,114\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,36 36,0 166,0 130,36\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"130,36 166,0 166,78 130,114\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,114 36,78 166,78\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"36\" y1=\"0\" x2=\"36\" y2=\"78\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"65.0\" y=\"132.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text><text x=\"-14.0\" y=\"75.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 cm</text><text x=\"176.0\" y=\"20.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text></svg>","sol":"","scheme":["M1 4 × (14 + 6 + 9)","A1 116 cm","C1 says No, counting 6 faces is not enough","B1 names a pentagonal pyramid (or another correct 6-faced solid)"],"watch":"Adding 14 + 6 + 9 only once, forgetting that a cuboid has four edges of each length.","parts":[{"label":"(a)","text":"Somchai makes a skeleton model of the solid, using one straw for each edge. Find the <b>total length of straw</b> he needs.","fig":"","m":2,"ans":"116 cm","sol":"The solid is a cuboid. It has 12 edges: four of 14 cm, four of 6 cm and four of 9 cm. Total = 4 × (14 + 6 + 9) = 4 × 29 = 116 cm.","check":{"type":"numeric","nums":[116.0],"unit":"cm","display":"116 cm"}},{"label":"(b)","text":"Mei says, “Every solid with 6 faces must be a cuboid.” Is Mei correct? <b>Explain your answer</b>, naming a solid that helps you decide.","fig":"","m":2,"ans":"No","sol":"Mei is wrong. A pentagonal pyramid also has 6 faces — 5 triangles round the sides and one pentagon for the base — but it is not a cuboid. Counting faces alone does not name a solid.","check":{"type":"yesno","value":"no"}}]},{"n":43,"s":"C","m":4,"text":"A triangular corn field has an area of <b>96 m<sup>2</sup></b>. Its height, measured from the base, is <b>12 m</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 192.0 156.0\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,108.0 144.0,108.0 99.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"81.0\" y1=\"108.0\" x2=\"81.0\" y2=\"90.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"81.0\" y1=\"90.0\" x2=\"99.0\" y2=\"90.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"99.0\" y1=\"108.0\" x2=\"99.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"72.0\" y=\"128.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"92.0\" y=\"62.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 m</text></svg>","sol":"","scheme":["M1 96 ÷ 12 × 2","A1 16 m","C1 explains that doubling both lengths multiplies the area by 4","A1 384 m²"],"watch":"In (b), giving 192 m² by simply doubling the original area.","parts":[{"label":"(a)","text":"Find the length of the <b>base</b> of the field.","fig":"","m":2,"ans":"16 m","sol":"96 = <sup>1</sup>⁄<sub>2</sub> × base × 12 = 6 × base, so base = 96 ÷ 6 = 16 m.","check":{"type":"numeric","nums":[16.0],"unit":"m","display":"16 m"}},{"label":"(b)","text":"Krit says, “If I double the base <b>and</b> double the height, the area will double as well.” Explain why Krit is <b>wrong</b>, and work out the correct new area.","fig":"","m":2,"ans":"384 m<sup>2</sup>","sol":"Doubling the base doubles the area, and doubling the height doubles it again, so the area is multiplied by 2 × 2 = 4, not by 2. New area = <sup>1</sup>⁄<sub>2</sub> × 32 × 24 = 384 m<sup>2</sup>, which is 4 × 96 m<sup>2</sup>.","check":{"type":"numeric","nums":[384.0],"unit":"m2","display":"384 m²"}}]},{"n":44,"s":"C","m":4,"text":"The diagram shows pentagon <i>ABCDE</i>. ∠<i>D</i> is a right angle.","fig":"<svg class=\"fig\" viewBox=\"-77.1 -24.0 198.4 209.4\" style=\"width:50mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 90.0,0.0 97.3,104.7 3.0,161.4 -53.1,68.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"-14.8,18.9 -12.3,20.6 -9.7,22.0 -6.9,23.0 -4.0,23.7 -1.0,24.0 2.0,23.9 4.9,23.5 7.8,22.7 10.5,21.6 13.1,20.1 15.5,18.3 17.6,16.3 19.5,14.0 21.1,11.4 22.4,8.7 23.3,5.9 23.8,3.0 24.0,-0.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"17.5\" y=\"34.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">128°</text><polyline points=\"66.0,0.0 66.1,2.2 66.4,4.4 66.9,6.5 67.6,8.6 68.4,10.6 69.5,12.5 70.7,14.3 72.1,16.0 73.6,17.6 75.3,19.0 77.1,20.2 79.0,21.3 81.0,22.2 83.0,23.0 85.1,23.5 87.3,23.8 89.5,24.0 91.7,23.9\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"62.7\" y=\"27.8\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">94°</text><polyline points=\"95.6,80.8 92.9,81.1 90.3,81.7 87.7,82.7 85.3,83.9 83.0,85.4 80.9,87.1 79.1,89.1 77.4,91.3 76.0,93.6 74.9,96.1 74.1,98.7 73.5,101.4 73.3,104.1 73.4,106.8 73.8,109.5 74.5,112.1 75.5,114.7 76.7,117.1\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"61.8\" y=\"87.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">117°</text><polyline points=\"-40.7,88.6 -38.6,87.1 -36.6,85.5 -34.9,83.6 -33.3,81.5 -31.9,79.3 -30.8,77.0 -30.0,74.5 -29.4,72.0 -29.1,69.5 -29.1,66.9 -29.4,64.3 -29.9,61.8 -30.7,59.3 -31.8,57.0 -33.1,54.7 -34.6,52.7 -36.4,50.8 -38.3,49.1\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"-13.2\" y=\"70.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text><polyline points=\"12.4,155.7 6.8,146.3 -2.7,152.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"-5.7\" y=\"-13.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><text x=\"100.3\" y=\"-10.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"110.5\" y=\"111.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><text x=\"-0.8\" y=\"175.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">D</text><text x=\"-68.1\" y=\"68.2\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">E</text></svg>","sol":"","scheme":["M1 angle sum of a pentagon = 540°","A1 111°","M1 three right angles use 270°, leaving 270° for two angles","C1 says No and gives a possible pair such as 135° and 135°"],"watch":"Using 360° for the angle sum of a pentagon instead of 540°.","parts":[{"label":"(a)","text":"Find the size of the angle marked <b>x</b>.","fig":"","m":2,"ans":"111°","sol":"The interior angles of a pentagon add up to (5 − 2) × 180° = 540°. The four known angles add up to 128° + 94° + 117° + 90° = 429°. x = 540° − 429° = 111°.","check":{"type":"numeric","nums":[111.0],"unit":"deg","display":"111°"}},{"label":"(b)","text":"Mei says, “A pentagon cannot have <b>three</b> right angles.” Is Mei correct? <b>Explain your answer</b>.","fig":"","m":2,"ans":"No","sol":"Mei is wrong. Three right angles use 3 × 90° = 270°, and the angles of a pentagon add up to 540°, so the other two angles must add up to 540° − 270° = 270°. That is possible, for example 135° and 135°, so a pentagon with three right angles can be drawn.","check":{"type":"yesno","value":"no"}}]},{"n":45,"s":"C","m":4,"text":"A circular lawn in a park has a diameter of <b>35 m</b>. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">35 m</text></svg>","sol":"","scheme":["M1 <sup>22</sup>⁄<sub>7</sub> × 35","A1 110 m","M1 radius = 17.5 m used in π × r × r","A1 962.5 m²"],"watch":"Using the diameter of 35 m in the area formula and giving 3 850 m².","parts":[{"label":"(a)","text":"Malee walks once all the way round the edge of the lawn. How far does she walk?","fig":"","m":2,"ans":"110 m","sol":"Circumference = π × d = <sup>22</sup>⁄<sub>7</sub> × 35 = 110 m.","check":{"type":"numeric","nums":[110.0],"unit":"m","display":"110 m"}},{"label":"(b)","text":"Find the <b>area</b> of the lawn.","fig":"","m":2,"ans":"962.5 m<sup>2</sup>","sol":"Radius = 35 ÷ 2 = 17.5 m. Area = <sup>22</sup>⁄<sub>7</sub> × 17.5 × 17.5 = 55 × 17.5 = 962.5 m<sup>2</sup>.","check":{"type":"numeric","nums":[962.5],"unit":"m2","display":"962.5 m²"}}]},{"n":46,"s":"C","m":4,"text":"The round tabletop below has a diameter of <b>24 cm</b>. Ben works out its area. He writes:<br><b>Area = 3.14 × 24 × 24 = 1 808.64 cm<sup>2</sup></b> (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">24 cm</text></svg>","sol":"","scheme":["C1 says he used the diameter instead of the radius","A1 452.16 cm²","M1 3.14 × 24","A1 75.36 cm"],"watc /* ------------------------------------------------------------ answer maths */
const UNITS = {
  cm2:['cm2','cm²','sqcm','squarecm','cmsquared','cm^2'],
  m2:['m2','m²','sqm','squarem','msquared','m^2'],
  km2:['km2','km²','sqkm'],
  cm3:['cm3','cm³','cubiccm','cmcubed','cm^3'],
  m3:['m3','m³','cubicm','mcubed','m^3'],
  cm:['cm','centimetre','centimetres','centimeter','centimeters'],
  mm:['mm','millimetre','millimetres','millimeter','millimeters'],
  m:['m','metre','metres','meter','meters'],
  km:['km','kilometre','kilometres','kilometer','kilometers'],
  deg:['deg','degree','degrees','°','o'],
  l:['l','litre','litres','liter','liters'],
  ml:['ml','millilitre','millilitres','milliliter','milliliters'],
  kg:['kg','kilogram','kilograms'], g:['g','gram','grams'],
  baht:['baht','thb','฿'], pct:['%','percent','percentage']
};
function canonUnit(raw) {
  const t = (raw || '').toLowerCase().replace(/[^a-z0-9°²³%฿^]/g, '')
                       .replace(/²/g, '2').replace(/³/g, '3');
  if (!t) return '';
  for (const k in UNITS) if (UNITS[k].some(a => a.replace(/²/g,'2').replace(/³/g,'3') === t)) return k;
  return t;
}
const NUMRE = /\d{1,3}(?:[ \u00a0\u2009,]\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/g;
function scan(s) {
  /* numbers in s, ignoring digits glued to letters (the 2 in "cm2") */
  const t = (s || '').replace(/[\u00a0\u2009]/g, ' ');
  const out = []; let m; NUMRE.lastIndex = 0;
  while ((m = NUMRE.exec(t)) !== null) {
    if (m.index > 0 && /[A-Za-z]/.test(t[m.index - 1])) continue;
    const v = parseFloat(m[0].replace(/[\s,]/g, ''));
    if (!isNaN(v)) out.push({ v: Math.round(v * 1e6) / 1e6, end: m.index + m[0].length });
  }
  return { t, hits: out };
}
function numsOf(s) { return scan(s).hits.map(h => h.v); }
function unitIn(s) {
  const { t, hits } = scan(s);
  if (!hits.length) return canonUnit(t);
  let tail = t.slice(hits[hits.length - 1].end).trim();
  tail = tail.split(',')[0].split(' and ')[0].trim();
  return canonUnit(tail);
}
/* 'right' | 'unit' | 'wrong' */
function gradeNumeric(input, check) {
  const got = numsOf(input), exp = check.nums;
  if (got.length !== exp.length || !exp.every((v, i) => Math.abs(v - got[i]) < 1e-6)) return 'wrong';
  if (!check.unit) return 'right';
  const u = unitIn(input);
  if (!u) return 'unit';
  if (u === check.unit) return 'right';
  if (check.unit === 'deg' && /°|deg/i.test(input)) return 'right';
  return 'wrong';
}

/* ------------------------------------------------------------------- quiz */
function slotsOf(q) {
  return q.parts ? q.parts.map((pt, i) => ({ i, marks: pt.m, check: pt.check, ans: pt.ans, sol: pt.sol }))
                 : [{ i: 0, marks: q.m, check: q.check, ans: q.ans, sol: q.sol }];
}

  const p = S.paper, qi = S.order[S.pos], q = p.qs[qi];

  }
  el.innerHTML = `<div style="--c:${p.colour}">

        ${answerUI}
        <div id="qfb"></div>
        <div class="actions" id="acts">
          <button class="btn accent wide" id="check">Check ${q.parts ? 'answers' : 'answer'}</button>
        </div>
      </div>
    </div></div>`;
  document.getElementById('back').onclick = () => { S.view = 'home'; renderHome(); };
  wireQuestion(q, qi);
  window.scrollTo(0, 0);
}

function slotInput(check, i) {
  if (check.type === 'yesno') {
    return `<div class="yn" data-slot="${i}">
      <button data-v="yes">Yes</button><button data-v="no">No</button></div>`;
  }
  if (check.type === 'self') {
    return `<div class="ansrow"><label class="lab" for="in${i}">Your answer</label>
      <textarea class="ans" id="in${i}" data-slot="${i}"
        placeholder="Write your answer, then check it against the model answer."></textarea></div>`;
  }
  return `<div class="ansrow"><label class="lab" for="in${i}">Your answer</label>
    <input class="ans" id="in${i}" data-slot="${i}" type="text" autocomplete="off"
      autocapitalize="off" spellcheck="false" placeholder="Type your answer">
    <div class="hint">Include the unit if the answer needs one.</div></div>`;
}

function wireQuestion(q, qi) {
  const checkBtn = document.getElementById('check');
  let chosen = null, ynPick = {};

  if (q.s === 'A') {
    const opts = [...document.querySelectorAll('.opt')];
    opts.forEach(o => o.onclick = () => {
      opts.forEach(x => x.classList.remove('sel'));
      o.classList.add('sel'); chosen = +o.dataset.i; checkBtn.disabled = false;
    });
    checkBtn.disabled = true;
  }
  document.querySelectorAll('.yn').forEach(g => {
    g.querySelectorAll('button').forEach(b => b.onclick = () => {
      g.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); ynPick[g.dataset.slot] = b.dataset.v;
    });
  });
  document.querySelectorAll('input.ans').forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); }
  }));

  checkBtn.onclick = () => {
    const slots = slotsOf(q);
    let earned = 0, pending = 0;
    slots.forEach(sl => {
      const box = q.parts ? document.querySelector(`#part${sl.i} .fbslot`) : document.getElementById('qfb');
      const t = sl.check.type;
      let verdict, gain = 0;
      if (t === 'mcq') {
        const opts = [...document.querySelectorAll('.opt')];
        opts.forEach((o, i) => {
          o.disabled = true;
          if (i === q.ans) { o.classList.add('right'); o.querySelector('.res').textContent = '✓'; }
          else if (i === chosen) { o.classList.add('wrong'); o.querySelector('.res').textContent = '✗'; }
          o.classList.remove('sel');
        });
        verdict = chosen === q.ans ? 'right' : 'wrong';
        gain = verdict === 'right' ? sl.marks : 0;
      } else if (t === 'yesno') {
        const g = q.parts ? document.querySelector(`#part${sl.i} .yn`) : document.querySelector('.yn');
        const pick = ynPick[sl.i];
        g.querySelectorAll('button').forEach(b => {
          b.disabled = true; b.classList.remove('sel');
          if (b.dataset.v === sl.check.value) b.classList.add('right');
          else if (b.dataset.v === pick) b.classList.add('wrong');
        });
        verdict = pick === sl.check.value ? 'right' : 'wrong';
        gain = verdict === 'right' ? sl.marks : 0;
      } else if (t === 'numeric') {
        const inp = document.getElementById('in' + sl.i);
        inp.disabled = true;
        verdict = gradeNumeric(inp.value, sl.check);
        gain = verdict === 'right' ? sl.marks : verdict === 'unit' ? Math.max(1, Math.floor(sl.marks / 2)) : 0;
      } else {
        const inp = document.getElementById('in' + sl.i);
        if (inp) inp.disabled = true;
        verdict = 'self'; pending++;
      }
      earned += gain;
      box.innerHTML = feedbackHTML(q, sl, verdict, gain);
      if (verdict === 'self') wireSelfMark(box, q, qi, sl);
    });
    S.res[qi] = { earned, max: q.m, pending };
    document.getElementById('acts').innerHTML =
      `<button class="btn wide" id="next" ${pending ? 'disabled' : ''}>${
        S.pos + 1 < S.order.length ? 'Next question →' : 'See my results'}</button>`;
    document.getElementById('next').onclick = advance;
    if (!pending) document.getElementById('next').focus({ preventScroll: true });
  };
}

function feedbackHTML(q, sl, verdict, gain) {
  const cls = verdict === 'right' ? 'ok' : verdict === 'unit' ? 'part' : verdict === 'self' ? 'part' : 'no';
  const icon = verdict === 'right' ? '✓' : verdict === 'unit' ? '!' : verdict === 'self' ? '?' : '✗';
  const head = verdict === 'right' ? 'Correct'
    : verdict === 'unit' ? 'Almost — the number is right, but write the unit'
    : verdict === 'self' ? 'Compare with the answer' : 'Not quite';
  const gainTxt = verdict === 'self' ? '' :
    `<span class="gain">+${gain} of ${sl.marks}</span>`;
  const showAns = verdict !== 'right';
  const sol = sl.sol || q.sol;
  return `<div class="fb ${cls}">
    <div class="head"><span class="icon">${icon}</span>${head}${gainTxt}</div>
    ${showAns && sl.ans !== undefined && q.s !== 'A'
      ? `<div class="correct">Answer: <b>${sl.ans}</b></div>` : ''}
    ${showAns && q.s === 'A' ? `<div class="correct">Answer: <b>${'ABCD'[q.ans]}</b> — ${q.opts[q.ans]}</div>` : ''}
    ${sol ? `<div class="expl"><div class="h">How to work it out</div><p>${sol}</p></div>` : ''}
    ${(q.scheme && q.scheme.length && !q.parts) || (q.scheme && q.scheme.length && sl.i === (q.parts ? q.parts.length - 1 : 0))
      ? `<div class="scheme">${q.scheme.map(x => {
            const sp = x.indexOf(' ');
            return sp > 0 ? `<span><b>${x.slice(0, sp)}</b>${x.slice(sp)}</span>` : `<span>${x}</span>`;
          }).join('')}</div>` : ''}
    ${q.watch && (!q.parts || sl.i === q.parts.length - 1)
      ? `<div class="watch"><b>Watch out for:</b> ${q.watch}</div>` : ''}
    ${verdict === 'self' ? `<div class="selfmark"><div class="q">How did you do?</div>
      <div class="selfrow">
        <button data-g="${sl.marks}">I got it right</button>
        ${sl.marks >= 2 ? `<button data-g="${Math.floor(sl.marks / 2)}">Partly right</button>` : ''}
        <button data-g="0">Not right</button></div></div>` : ''}
  </div>`;
}

function wireSelfMark(box, q, qi, sl) {
  box.querySelectorAll('.selfrow button').forEach(b => b.onclick = () => {
    box.querySelectorAll('.selfrow button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const g = +b.dataset.g;
    const r = S.res[qi];
    if (sl.awarded === undefined) { r.pending--; } else { r.earned -= sl.awarded; }
    sl.awarded = g; r.earned += g;
    const fb = box.querySelector('.fb');
    fb.className = 'fb ' + (g === sl.marks ? 'ok' : g === 0 ? 'no' : 'part');
    fb.querySelector('.head .icon').textContent = g === sl.marks ? '✓' : g === 0 ? '✗' : '!';
    const nx = document.getElementById('next');
    if (nx && !r.pending) { nx.disabled = false; }
  });
}

function advance() {
  if (S.pos + 1 < S.order.length) { S.pos++; renderQuiz(); }
  else renderResults();
}

/* ---------------------------------------------------------------- results */
function renderResults() {
  const p = S.paper;
  const total = S.order.reduce((a, i) => a + (S.res[i] ? S.res[i].earned : 0), 0);
  const max = S.order.reduce((a, i) => a + p.qs[i].m, 0);
  const pct = Math.round(total / max * 100);
  const [bandName, bandCol, bandBg] = bandOf(pct);
  const secs = ['A', 'B', 'C'].map(s => {
    const ids = S.order.filter(i => p.qs[i].s === s);
    const got = ids.reduce((a, i) => a + (S.res[i] ? S.res[i].earned : 0), 0);
    const mx = ids.reduce((a, i) => a + p.qs[i].m, 0);
    return { s, got, mx, n: ids.length };
  }).filter(x => x.n);
  const missed = S.order.filter(i => S.res[i] && S.res[i].earned < p.qs[i].m);
  if (!S.reviewing) {
    const saved = store.read();
    const prev = saved[p.id] || { best: 0, attempts: 0 };
    saved[p.id] = { best: Math.max(prev.best, total), attempts: prev.attempts + 1,
                    last: total, date: new Date().toISOString().slice(0, 10) };
    store.write(saved);
  }
  const names = { A: 'Section A · Fluency', B: 'Section B · Using and applying', C: 'Section C · Problem solving' };
  el.innerHTML = `<div style="--c:${p.colour}"><div class="wrap">
    <div class="res-top">
      <div style="font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">
        ${p.code} · ${p.title}</div>
      <div class="score" style="margin-top:10px">${total}<small> / ${max}</small></div>
      <div class="band" style="color:${bandCol};background:${bandBg}">${bandName} · ${pct}%</div>
      <p class="res-sub">${missed.length === 0 ? 'Every question correct. Excellent work.'
        : `${missed.length} question${missed.length > 1 ? 's' : ''} to look at again.`}</p>
    </div>
    <div class="brk"><h3>How each section went</h3>
      ${secs.map(x => `<div class="srow">
        <span class="nm">${names[x.s]}</span><span class="vl">${x.got} / ${x.mx}</span>
        <span class="track"><i style="width:${x.mx ? x.got / x.mx * 100 : 0}%"></i></span></div>`).join('')}
    </div>
    ${missed.length ? `<div class="brk"><h3>Questions to review</h3>
      <div class="missed">${missed.map(i => `<button data-q="${i}">Q${p.qs[i].n}</button>`).join('')}</div>
      <p class="hint" style="margin-top:12px">Tap a number to see that question, the method and the answer again.</p>
      </div>` : ''}
    <div class="actions">
      ${missed.length ? `<button class="btn accent wide" id="redo">Practise the ${missed.length} I missed</button>` : ''}
      <button class="btn ghost wide" id="again">Try the whole paper again</button>
      <button class="btn ghost wide" id="home">Back to papers</button>
    </div>
  </div></div>`;
  const redo = document.getElementById('redo');
  if (redo) redo.onclick = () => startPaper(p, missed);
  document.getElementById('again').onclick = () => startPaper(p);
  document.getElementById('home').onclick = () => { S.view = 'home'; renderHome(); };
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => startPaper(p, [+b.dataset.q]));
  window.scrollTo(0, 0);
}

renderHome();

</script>
</body>
</html>

/* ===== Sandwich and Lunchbox Maker : paper craft table ===== */
:root{
  --ink:#2E2A27; --paper:#FFFDF6; --kraft:#F3E6CF; --kraft2:#EADBC0;
  --orange:#FF9450; --coral:#F26B5B; --mustard:#F4B63D; --teal:#3FA7A0; --pink:#F7A8B8; --blue:#6FB2EA; --green:#86CB4E;
  --mat:#A9DCBE; --matline:rgba(255,255,255,.7);
  --f-ui:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif; --f-head:'Poppins','Lexend',sans-serif; --f-hand:'Patrick Hand',cursive;
  --hard:3px 3px 0 rgba(46,42,39,.9); --soft:0 3px 0 rgba(46,42,39,.16),0 8px 18px rgba(74,45,18,.18);
  --barh:56px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:500 16px/1.3 var(--f-ui);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;width:100%;overflow:hidden}
#bar,#screen{min-width:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#overlay{position:fixed;inset:0;z-index:100;pointer-events:none}
#overlay>*{pointer-events:auto}
.stk{width:100%;height:100%;overflow:visible}

/* ---- washi tape ---- */
.w-coral{background:repeating-linear-gradient(45deg,#F26B5B 0 7px,#F68A7C 7px 14px);color:#fff}
.w-mustard{background:radial-gradient(circle,rgba(255,255,255,.75) 1.8px,transparent 2.4px) 0 0/10px 10px,#F4B63D;color:var(--ink)}
.w-teal{background:repeating-linear-gradient(90deg,#3FA7A0 0 9px,#5BBAB3 9px 18px);color:#fff}
.w-pink{background:repeating-linear-gradient(-45deg,#F7A8B8 0 8px,#FAC1CC 8px 16px);color:var(--ink)}
.w-blue{background:repeating-linear-gradient(0deg,#6FB2EA 0 6px,#8EC5F0 6px 12px);color:var(--ink)}
.w-green{background:radial-gradient(circle,rgba(255,255,255,.6) 2px,transparent 2.6px) 3px 3px/12px 12px,#86CB4E;color:var(--ink)}
.w-coral,.w-mustard,.w-teal,.w-pink,.w-blue,.w-green{clip-path:polygon(0 0,100% 0,98.5% 25%,100% 50%,98.5% 75%,100% 100%,0 100%,1.5% 75%,0 50%,1.5% 25%)}

/* ---- buttons ---- */
.btn{font:600 15px var(--f-ui);padding:9px 16px;min-height:44px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--hard);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s,background .12s;text-decoration:none;touch-action:manipulation}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(46,42,39,.9)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(46,42,39,.9)}
.btn.primary{background:var(--orange)}
.btn.on{background:var(--mustard)}
.btn.small{padding:5px 10px;min-height:36px;font-size:13px}
.btn.big{font-size:18px;padding:13px 24px;min-height:54px}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default;transform:none}
.btn:focus-visible,.pc:focus-visible,.tab:focus-visible,.chipw:focus-visible,.slotw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ico-btn{padding:0;width:44px}
.ico{flex:none}
.btn.off{background:#ddd}

/* ---- header ---- */
#bar{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:var(--barh);background:var(--paper);border-bottom:2px solid var(--ink);box-shadow:0 3px 0 rgba(46,42,39,.12);position:relative;z-index:5;
  background-image:repeating-linear-gradient(90deg,transparent 0 12px,rgba(46,42,39,.07) 12px 13px)}
#bar::after{content:'';position:absolute;left:0;right:0;bottom:-7px;height:5px;background:repeating-linear-gradient(90deg,var(--coral) 0 14px,var(--mustard) 14px 28px,var(--teal) 28px 42px);opacity:.9}
.logo-s{height:50px;width:auto;flex:none}
.steps{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:nowrap;min-width:0;overflow:hidden}
.step{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;font:600 13px var(--f-ui);opacity:.5;transform:rotate(-1deg);white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--paper);color:var(--ink);font-size:12px}
.step.on{opacity:1;transform:rotate(0) scale(1.08);filter:drop-shadow(0 2px 0 rgba(46,42,39,.5))}
.step.done{opacity:.85}
.bar-right{display:flex;gap:8px;margin-left:auto}
body[data-screen=home] .logo-s,body[data-screen=home] #btnHome{visibility:hidden}
body[data-screen=home] #btnWords{display:none}
.bar-btn{min-height:40px;padding:6px 12px}

/* ---- screen + layout ---- */
#screen{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:8px;padding:10px 14px 10px;overflow:hidden}
.screen.s-home,.screen.s-wordbank,.screen.s-order,.screen.s-recipes,.screen.s-cu,.screen.s-howto,.screen.s-describe{grid-template-rows:minmax(0,1fr) auto}
.screen.s-finish{grid-template-rows:minmax(0,1fr) auto}
.work{display:grid;grid-template-columns:minmax(0,1fr) clamp(290px,35vw,560px);gap:14px;min-height:0}
.work.notray{grid-template-columns:minmax(0,1fr)}
.stage{position:relative;min-height:0;overflow:hidden;border:2px solid var(--ink);box-shadow:var(--soft)}
.mat{background:linear-gradient(var(--matline) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,var(--matline) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px) 0 0/9px 9px,linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px) 0 0/9px 9px,var(--mat)}
.mat::before{content:'';position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.85);pointer-events:none}
.mat::after{content:'';position:absolute;left:12px;top:12px;width:34px;height:34px;border-left:3px solid #5FA37F;border-top:3px solid #5FA37F;opacity:.5;pointer-events:none}

/* ---- tray: the printable sheet ---- */
.tray{display:flex;flex-direction:column;min-height:0;position:relative}
.tray-head{display:flex;gap:6px;position:relative;z-index:2;margin-bottom:-2px;padding-left:8px}
.tab{padding:7px 16px;font:700 13px var(--f-head);border:none;min-height:38px;transform:rotate(-1deg);filter:drop-shadow(0 2px 0 rgba(46,42,39,.4));opacity:.8}
.tab.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 2px 0 rgba(46,42,39,.9))}
.tray-title{align-self:flex-start;padding:6px 18px;font:700 14px var(--f-head);margin-left:8px;margin-bottom:-2px;position:relative;z-index:2;filter:drop-shadow(0 2px 0 rgba(46,42,39,.7))}
.sheet{flex:1;min-height:0;overflow:auto;background:#FFFEFA;border:2px solid var(--ink);box-shadow:var(--soft);padding:14px;position:relative;
  background-image:linear-gradient(rgba(60,90,120,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,120,.05) 1px,transparent 1px);background-size:20px 20px}
.sheet::before{content:'';position:absolute;inset:5px;border:1.5px dashed rgba(107,90,74,.35);pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px 8px;position:relative;align-content:start}
.tray-foot{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.tray-foot:empty{display:none}
.foot-note{margin:0;font-size:13px;color:#5b4e44;text-align:center}
.tray-msg{grid-column:1/-1;text-align:center;padding:10px;font-size:15px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 2px 4px;background:transparent;border:none;touch-action:none;-webkit-touch-callout:none;min-width:0}
.pc-art{display:block;position:relative;width:min(100%,clamp(90px,8.2vw,176px));aspect-ratio:1/1;transition:transform .16s}
.pc-art svg{width:100%;height:100%}
.pc:hover .pc-art{transform:translateY(-3px) rotate(-2deg)}
.pc:active .pc-art{transform:scale(.96)}
.pc-cap{font:600 12.5px/1.15 var(--f-ui);text-align:center;background:#FFF3CF;border:1px solid #D9C79B;padding:2px 6px;max-width:100%;word-break:break-word}
.pc.sel .pc-cap,.pc.cutopt.sel .pc-cap{background:var(--mustard);border-color:var(--ink)}
.pc.sel::after{content:'';position:absolute;inset:0;border:2px solid var(--ink);pointer-events:none}
.pc.dragging{opacity:.35}
.sheet.scrolls .pc{touch-action:pan-y}
.pc.off{opacity:.45}
.pc .badge{position:absolute;left:2px;top:2px;background:var(--mustard);border:2px solid var(--ink);font:700 12px var(--f-ui);padding:0 5px;z-index:2}
.pc .mark{position:absolute;right:2px;top:2px;background:var(--green);border:2px solid var(--ink);width:24px;height:24px;display:grid;place-items:center;z-index:2;color:var(--ink)}
.pc.peel .pc-art{animation:peelpc .52s ease-out}
.pc.peel .pc-art::after{content:'';position:absolute;right:3%;top:3%;width:34%;aspect-ratio:1;background:linear-gradient(225deg,#fffdf6 0 50%,#cdbfa6 50% 100%);clip-path:polygon(0 0,100% 0,100% 100%);box-shadow:-2px 2px 3px rgba(0,0,0,.2);animation:curl .52s ease-out forwards;transform-origin:100% 0}
@keyframes peelpc{0%{transform:rotate(0)}28%{transform:rotate(-5deg) translateY(-5px) scale(1.07)}100%{transform:rotate(0)}}
@keyframes curl{0%{transform:scale(0)}35%{transform:scale(1) rotate(-6deg)}100%{transform:scale(.2);opacity:0}}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:80;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.ghost svg{width:100%;height:100%}
.fly{position:fixed;pointer-events:none;z-index:75;filter:drop-shadow(0 6px 5px rgba(0,0,0,.22))}
.fly svg{width:100%;height:100%}
.conf{position:fixed;display:block;pointer-events:none;z-index:90}
.flash{position:fixed;inset:0;background:#fff;z-index:95;pointer-events:none}
.seg2{display:flex;gap:6px}

/* ---- say it strip ---- */
.sayit{display:flex;align-items:center;gap:12px;padding:6px 10px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--soft);min-height:54px}
.say-lab{padding:5px 14px;font:800 14px var(--f-head);flex:none;transform:rotate(-2deg)}
.say-txt{flex:1;font:600 clamp(18px,2.3vw,28px)/1.15 var(--f-head);min-width:0;overflow-wrap:anywhere}
.say-txt.empty{font-weight:500;font-size:clamp(14px,1.6vw,18px);color:#6b5a4a}
.lvl{display:flex;gap:4px;flex:none}
.lvl-b{min-width:40px;min-height:38px;border:2px solid var(--ink);background:var(--paper);font:700 13px var(--f-ui);cursor:pointer}
.lvl-b.on{background:var(--mustard);box-shadow:2px 2px 0 var(--ink)}

/* ---- action bar ---- */
.actions{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-height:50px}
.act-m{text-align:center;min-width:0}
.hint{font:500 15px var(--f-ui);color:#4b3f36}
.act-l,.act-r{display:flex;gap:8px;align-items:center}
.act-r{justify-content:flex-end}

/* ---- paper tags ---- */
.tags{position:absolute;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:7px;z-index:6;pointer-events:none}
.ptag{position:relative;filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)) drop-shadow(3px 5px 3px rgba(0,0,0,.2))}
.ptag .t{display:block;background:#FFF1C2;padding:7px 18px 7px 34px;font:700 clamp(15px,1.7vw,20px) var(--f-ui);clip-path:polygon(18px 0,100% 0,100% 100%,18px 100%,0 50%)}
.ptag .hole{position:absolute;left:14px;top:50%;margin-top:-5px;width:10px;height:10px;border-radius:50%;background:var(--mat);border:2px solid var(--ink);z-index:2}
.ptag.bad .t{background:#FFC9C0}

/* ---- modal ---- */
.backdrop{position:fixed;inset:0;background:rgba(46,42,39,.5);display:grid;place-items:center;padding:18px;overflow:auto}
.modal{position:relative;background:var(--paper);border:2px solid var(--ink);box-shadow:7px 7px 0 rgba(0,0,0,.28);width:min(92vw,520px);max-height:92vh;overflow:auto;padding:20px 22px 20px;margin:auto}
.modal.wide{width:min(94vw,860px)}
.modal-title{display:inline-block;margin:0 0 14px -6px;padding:6px 20px;font:800 clamp(15px,1.8vw,19px) var(--f-head);transform:rotate(-1.5deg);filter:drop-shadow(0 2px 0 rgba(46,42,39,.6))}
.modal-x{position:absolute;right:8px;top:8px;width:40px;height:40px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.paper{background:var(--paper);border:2px solid var(--ink);box-shadow:var(--soft)}
.stars{display:flex;justify-content:center;gap:6px}
.star{color:#cfc4b4}
.star.on{color:var(--mustard)}
.star .ico{stroke:var(--ink);fill:currentColor}
.stars.big .star.on{animation:starpop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.stars.big .star:nth-child(2).on{animation-delay:.15s}.stars.big .star:nth-child(3).on{animation-delay:.3s}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.result .say{text-align:center;font:700 20px var(--f-head);margin:8px 0}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:16px}
.checks li{display:flex;gap:8px;align-items:center;padding:6px 10px;border:2px solid var(--ink);background:#EAF7DA}
.checks li.no{background:#FFE1DB}
.checks .mk{display:grid;place-items:center;width:26px;height:26px;background:var(--green);border:2px solid var(--ink);flex:none}
.checks li.no .mk{background:var(--coral);color:#fff}
.checks em{color:#6a3c33;font-style:normal;font-size:14px}

/* ================= HOME ================= */
.home{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,2vh,18px);padding:4px clamp(8px,2vw,28px);height:100%;min-height:0;overflow:auto}
.hero{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,40px);flex-wrap:wrap}
.logo-big{height:clamp(90px,19vh,190px);width:auto}
.hero-t h1{margin:0;font:800 clamp(26px,4.4vw,56px)/1.05 var(--f-head);letter-spacing:-.5px}
.hero-t p{margin:6px 0 0;font:500 clamp(15px,1.8vw,22px) var(--f-ui);color:#5b4e44}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,26px);min-height:0}
.part-card{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:4px;padding:26px 14px 12px;text-align:center;min-height:0;transition:transform .15s,box-shadow .15s}
.part-card:nth-child(1){transform:rotate(-1deg)}.part-card:nth-child(2){transform:rotate(.8deg)}.part-card:nth-child(3){transform:rotate(-.6deg)}
.part-card:hover{transform:translateY(-4px) rotate(0)}
.part-card:active{transform:translateY(1px)}
.part-tape{position:absolute;left:50%;top:-12px;transform:translateX(-50%) rotate(-2deg);padding:4px 22px;font:800 15px var(--f-head);filter:drop-shadow(0 2px 0 rgba(46,42,39,.6))}
.part-art{display:block;min-height:0;height:100%}
.part-art svg{width:100%;height:100%;max-height:100%}
.part-card b{font:800 clamp(17px,2.2vw,26px) var(--f-head)}
.part-card i{font:500 clamp(12px,1.3vw,15px) var(--f-ui);font-style:normal;color:#5b4e44}
.minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,1.4vw,16px)}
.mini-card{display:grid;grid-template-rows:auto auto;gap:4px;padding:8px 6px 8px;text-align:center;justify-items:center;transition:transform .12s}
.mini-card:hover{transform:translateY(-3px) rotate(-1deg)}
.mini-art{display:block;width:clamp(44px,6.5vw,76px);height:clamp(36px,5.2vw,60px)}
.mini-art svg{width:100%;height:100%}
.mini-card b{font:700 clamp(12px,1.25vw,15px)/1.15 var(--f-head)}

/* ================= STEP 0 : bread + toaster ================= */
.bread-scene,.toast-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-evenly;gap:16px;padding:44px 18px 16px;flex-wrap:wrap;align-content:center}
.board-paper{position:relative;background:#FFFEFA;border:2px solid var(--ink);box-shadow:var(--soft);padding:22px 22px 34px;display:grid;place-items:center;min-width:0}
.board-paper::before{content:'';position:absolute;inset:6px;border:1.5px dashed rgba(107,90,74,.4)}
.board-paper.wood{background:repeating-linear-gradient(94deg,#DFB178 0 16px,#D8A76C 16px 18px,#E4B97F 18px 34px)}
.board-paper.wood::before{border-color:rgba(255,255,255,.55)}
.bread-pair{position:relative;width:clamp(130px,min(27vw,52vh),330px);aspect-ratio:1.25/1}
.bp{position:absolute;width:62%}
.bp0{left:0;top:6%;transform:rotate(-5deg)}.bp1{right:0;bottom:0;transform:rotate(4deg)}
.bp svg{width:100%;height:auto}
.empty-note{font:500 15px var(--f-ui);color:#6b5a4a;text-align:center;padding:20px;max-width:220px}
.name-tape{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%) rotate(-1deg);padding:3px 18px;font:700 14px var(--f-head);white-space:nowrap;filter:drop-shadow(0 2px 0 rgba(46,42,39,.7));min-height:0}
.name-tape:empty{display:none}
.toaster-box{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(130px,min(26vw,38vh),290px)}
.toaster{position:relative;width:100%;aspect-ratio:240/200}
.tslots{position:absolute;left:0;right:0;bottom:44%;height:60%}
.ts{position:absolute;bottom:0;width:36%}
.ts1{left:12%}.ts2{left:52%}
.ts svg{width:100%;height:auto}
.tfront{position:absolute;left:0;right:0;bottom:0;height:65%;z-index:2}
.tfront svg{width:100%;height:100%}
.toaster.hot .tfront{filter:drop-shadow(0 0 10px #ff7a2a)}
.smoke{position:absolute;bottom:60%;width:34px;height:34px;border-radius:50%;background:#6a6a6a;opacity:0;z-index:3}
.tmeter{position:relative;display:flex;width:100%;border:2px solid var(--ink);background:#eee}
.seg{flex:1;text-align:center;font:600 11px var(--f-ui);padding:3px 0;opacity:.55}
.seg.s1{background:#F1D08A}.seg.s2{background:#E2A44B}.seg.s3{background:#9A5A2B;color:#fff}.seg.s4{background:#2b1b12;color:#fff}
.seg.on{opacity:1;box-shadow:inset 0 0 0 3px var(--ink)}
.tmark{position:absolute;top:-5px;bottom:-5px;width:4px;background:var(--ink);left:0;transition:left .1s linear;transform:translateX(-2px)}
.tbtn{width:100%}

/* ---- spread step ---- */
.slices{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,50px);padding:40px 14px 14px}
.slice{position:relative;background:transparent;border:2px dashed transparent;padding:12px 12px 28px}
.slice.sel{border-color:var(--ink);background:rgba(255,255,255,.4)}
.sl-art{display:block;position:relative;width:clamp(96px,min(21vw,40vh),270px)}
.sl-art svg{width:100%;height:auto}
.knife{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.knife svg{width:100%;height:100%}

/* ---- slice veg step ---- */
.chop-scene{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:44px 16px 16px;gap:10px}
.chop-spot{display:grid;place-items:center;min-height:0}
.whole svg{width:clamp(80px,min(17vw,28vh),200px);height:auto}
.slices-out{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.slices-out .s svg{width:clamp(36px,min(8vw,12vh),92px);height:auto}
.chop-knife{position:absolute;display:none;width:150px;z-index:4;pointer-events:none}
.shelf{background:rgba(255,255,255,.6);border:2px dashed var(--ink);padding:14px 10px 8px;position:relative}
.shelf-title{position:absolute;left:12px;top:-14px;padding:2px 14px;font:700 12px var(--f-head)}
.shelf-row{display:flex;gap:14px;flex-wrap:wrap;min-height:60px;align-items:center}
.grp{display:flex;flex-direction:column;align-items:center;gap:2px}
.grp-art{position:relative;width:76px;height:54px}
.grp-art span{position:absolute;left:calc(var(--i)*14px);top:calc(var(--i)*3px);width:46px}
.grp-cap{font:600 12px var(--f-ui)}

/* ---- stack ---- */
.stack-scene{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:44px 12px 12px}
.plate-under{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:min(84%,560px);height:clamp(30px,6vh,52px);background:#fff;border:2px solid #AEBDC8;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.12),inset 0 -5px 0 #E4ECF1}
.stack-wrap{position:relative;height:100%;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.stackSvg{height:100%;max-height:100%;width:auto;max-width:100%;overflow:visible}
.stackSvg.wobble{animation:sway 1.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(calc(var(--lean)*-1.8deg))}50%{transform:rotate(calc(var(--lean)*1.8deg))}}
.ly .in{transform-box:fill-box;transform-origin:50% 50%}
.undo{position:absolute;right:12px;top:12px;z-index:7}
.undo2{position:absolute;right:98px;top:12px;z-index:7}
.cutline-fx{position:fixed;width:0;border-left:3px dashed var(--coral);transform-origin:top;z-index:72;pointer-events:none}
.scissors-fx{position:fixed;width:72px;height:72px;z-index:73;pointer-events:none}
.scissors-fx svg{width:100%;height:100%}
.cutopt .pc-art{width:min(100%,86px)}

/* ---- toast ---- */
.toast-view{position:relative;width:clamp(110px,min(28vw,52vh),360px);aspect-ratio:1}
.toast-view.big{width:clamp(120px,min(33vw,58vh),430px)}
.toastSvg{width:100%;height:100%;overflow:visible}
.tp{transform-box:fill-box;transform-origin:50% 50%}
.bottle-fx{position:absolute;right:6%;top:2%;width:26%;z-index:4;pointer-events:none}
.seed{position:fixed;width:9px;height:5px;z-index:71;pointer-events:none;background:#FFF3D2;border:1px solid #C9AE66}
.seed.herbs{background:#4FB04A;border-color:#2F7A2A;width:12px;height:6px}
.menu-board{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:34px 14px 12px;background:#2F5D4E;box-shadow:inset 0 0 0 6px #D9A86C}
.menu-title{align-self:flex-start;margin-left:8px;padding:4px 26px;font:800 20px var(--f-head);transform:rotate(-1deg)}
.menu-grid{max-width:900px;width:100%;margin:0 auto;flex:1;min-height:0;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));gap:8px;padding:0 6px}
.menu-cell{background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;padding:4px;min-height:0;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.menu-cell.empty{background:transparent;border:2px dashed rgba(255,255,255,.55);justify-content:center;box-shadow:none}
.mc-plus{font:700 32px var(--f-head);color:rgba(255,255,255,.6)}
.mc-art{flex:1;min-height:0;position:relative;width:100%;display:block}
.mc-art svg{position:absolute;inset:0;width:100%;height:100%}
.mc-name{font:600 clamp(10px,1.2vw,13px)/1.1 var(--f-ui);text-align:center}

/* ---- lunch ---- */
.lunch-stage{display:grid;grid-template-rows:minmax(0,1fr) auto;align-items:center;gap:6px;padding:40px 10px 10px}
.scene-wrap{position:relative;width:100%;aspect-ratio:1000/540;max-height:100%;margin:auto;perspective:1100px}
.scene,.scene svg{width:100%;height:100%}
.lunchSvg{overflow:visible}
.lid{position:absolute;left:17%;top:7.4%;width:64%;height:81.5%;transform-origin:50% 0%;transform:rotateX(-100deg);pointer-events:none;filter:drop-shadow(3px 6px 4px rgba(0,0,0,.25))}
.lid svg{width:100%;height:100%}
.meter{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;align-self:end;position:relative}
.meter-title{padding:3px 12px;font:700 12px var(--f-head)}
.mrow{display:flex;align-items:center;gap:6px;font:600 12px var(--f-ui)}
.mb{display:flex;gap:3px}
.mb i{display:block;width:16px;height:16px;border:2px solid var(--ink);background:#fff}
.g-grains .mb i.on{background:#F4B63D}.g-protein .mb i.on{background:#F26B5B}.g-fruit .mb i.on{background:#E24B3B}.g-veg .mb i.on{background:#86CB4E}.g-dairy .mb i.on{background:#6FB2EA}.g-treat .mb i.on{background:#B58CE0}
.mtip{font:500 12.5px/1.25 var(--f-ui);color:#4b3f36;flex:1;min-width:160px}
.badge-healthy{display:flex;align-items:center;gap:8px;background:var(--mustard);border:2px solid var(--ink);padding:3px 8px;animation:starpop .5s cubic-bezier(.3,1.6,.5,1)}
.badge-healthy b{font:800 14px var(--f-head)}
.rosette{display:grid;place-items:center;width:30px;height:30px;background:var(--coral);color:#fff;border:2px solid var(--ink);transform:rotate(45deg)}
.rosette svg{transform:rotate(-45deg);fill:#fff;stroke:var(--ink)}
.prep-fx{position:absolute;left:50%;top:50%;width:min(34%,220px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:8;pointer-events:none}
.prep-art svg{width:100%;height:100%}
.prep-knife{position:absolute;left:30%;top:20%;width:90%;height:30%}
.prep-knife svg{width:100%;height:100%}
.drop{position:absolute;top:0;width:12px;height:16px;background:#6FB1D3;border:2px solid #fff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.notes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn.on{background:var(--mustard)}

/* ---- pinned card ---- */
.pinned{position:absolute;left:10px;top:10px;z-index:8;max-width:min(58%,420px)}
.pin-card{padding:0}
.pin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:none;border-bottom:2px solid var(--ink);padding:5px 10px;font:700 13px var(--f-head);text-align:left}
.pin-card.closed .ordercard,.pin-card.closed .rc-pic,.pin-card.closed .rc-txt{display:none}
.ordercard{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;flex-wrap:wrap}
.cust{width:58px;flex:none}
.cust svg{width:100%;height:auto}
.bubble{background:#fff;border:2px solid var(--ink);padding:6px 10px;position:relative;flex:1;min-width:140px}
.bubble::before{content:'';position:absolute;left:-9px;top:14px;border:7px solid transparent;border-right-color:var(--ink);border-left:0}
.who{font:700 11px var(--f-ui);color:#6b5a4a}
.otext{margin:2px 0 0;font:600 clamp(13px,1.4vw,16px)/1.3 var(--f-ui)}
.ordercard.big{padding:6px 4px}
.ordercard.big .cust{width:86px}
.ordercard.big .otext{font-size:clamp(17px,2.1vw,24px)}
.clues{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px}
.clue{display:flex;flex-direction:column;align-items:center;width:62px;font:600 10px/1.1 var(--f-ui);text-align:center}
.clue .ca{display:block;width:44px;height:44px}
.clue .ca svg{width:100%;height:100%}
.clue.no .ca{opacity:.45;position:relative}
.clue.no .ca::after{content:'';position:absolute;left:-4px;right:-4px;top:50%;border-top:4px solid var(--coral);transform:rotate(-30deg)}
.read-note{text-align:center;color:#5b4e44;margin:8px 0}
.recipe.pin-card{width:min(300px,52%)}
.rc-pic svg{width:100%;height:auto;max-height:160px}
.rc-pic.big svg{max-height:260px}
.rc-pic.small svg{max-height:130px}
.rc-txt{margin:2px 8px 8px;font:500 13px/1.3 var(--f-ui)}
.rc-txt.big{font-size:18px;text-align:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin-bottom:6px}

/* ================= generic pages ================= */
.page{padding:6px clamp(6px,2vw,24px) 6px;overflow:auto;height:100%;min-height:0}
.page.wide{max-width:900px;margin:0 auto;width:100%}
.page.center{display:flex;flex-direction:column;justify-content:center}
.bc-cust{display:block;width:clamp(64px,10vh,96px);height:clamp(64px,10vh,96px)}
.bc-cust svg{width:100%;height:100%}
.bc-bubble{background:#fff;border:2px solid var(--ink);padding:8px 10px;font:600 clamp(13px,1.4vw,16px)/1.3 var(--f-ui);text-align:center;width:100%;flex:1;display:grid;align-items:center}
.page-title{margin:4px 0 2px;font:800 clamp(22px,3.2vw,38px) var(--f-head);text-align:center}
.page-title.small{font-size:clamp(18px,2.4vw,28px);text-align:left;margin:0}
.lead{text-align:center;margin:0 0 12px;font:500 clamp(14px,1.6vw,18px) var(--f-ui);color:#5b4e44}
.lead.small{text-align:left;font-size:14px;margin:2px 0 10px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;max-width:1040px;margin:22px auto 14px;width:100%}
.bigcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 12px 22px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard);font:inherit;position:relative}
.bc-tape{position:absolute;left:50%;top:-13px;transform:translateX(-50%) rotate(-2deg);padding:4px 26px;font:800 18px var(--f-head);filter:drop-shadow(0 2px 0 rgba(46,42,39,.6))}
.bigcard b{font:800 22px var(--f-head)}
.bigcard i{font-style:normal;font-size:15px}
.bigcard em{font-style:normal;font-size:12px;background:#fff8;padding:2px 6px}
.bigcard.off{opacity:.5}
.bigcard:hover:not(.off){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.bc-stars .ico{fill:var(--mustard);stroke:var(--ink)}
.bc-stars{display:flex;gap:4px;margin-top:6px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:15px}
.chk input{width:22px;height:22px}
.order-intro .read-note{font-size:16px}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;max-width:1000px;margin:0 auto}
.rcard{display:flex;flex-direction:column;gap:4px;padding:10px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard);text-align:center}
.rcard:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.rcard .rc-pic svg{max-height:120px}
.rcard b{font:700 14px var(--f-head)}
.rcard i{font-style:normal;font-size:12px;color:#5b4e44}

/* ---- word bank ---- */
.wb{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:16px;height:100%;min-height:0}
.wb-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start;overflow:auto;padding:4px 6px}
.wb-side .tab{transform:rotate(-1deg);text-align:left;width:100%}
.wb-main{overflow:auto;min-height:0;padding:0 8px 10px 2px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 10px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard);text-align:center}
.wcard:hover{transform:translate(-1px,-2px) rotate(-.6deg)}
.wc-art{display:block;width:84px;height:70px}
.wc-art svg{width:100%;height:100%}
.wc-word{font:700 17px var(--f-head)}
.wc-sub{font-style:normal;font-size:12.5px;color:#5b4e44}
.wc-tag{position:absolute;left:4px;top:4px;font:600 10px var(--f-ui);font-style:normal;padding:1px 5px;border:1px solid var(--ink)}
.wc-tag.countable{background:#FFE08A}.wc-tag.uncountable{background:#BFE6F5}

/* ---- countable game ---- */
.cu-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px;max-width:820px;margin:0 auto;width:100%}
.cu-prog{font:600 14px var(--f-ui);color:#5b4e44}
.cu-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 40px;touch-action:none;cursor:grab}
.cu-art{display:block;width:clamp(90px,14vh,130px);height:clamp(90px,14vh,130px)}
.cu-art svg{width:100%;height:100%}
.cu-word{font:800 clamp(22px,3vw,34px) var(--f-head)}
.cu-q{font-style:normal;font-size:13px;color:#5b4e44}
.cu-baskets{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.cu-basket{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center;padding:18px 10px 10px;border:2px solid var(--ink);box-shadow:var(--hard);min-height:96px}
.cu-basket.c{background:#FFEBB5}.cu-basket.u{background:#CFEAF8}
.cu-basket b{font:800 20px var(--f-head)}
.cu-basket i{font-style:normal;font-size:13px}
.cu-n{position:absolute;right:8px;top:6px;font:800 18px var(--f-head)}
.cu-fb{min-height:48px;font:600 15px/1.35 var(--f-ui);text-align:center;padding:6px 10px;width:100%}
.cu-fb.good{background:#EAF7DA;border:2px solid var(--ink)}.cu-fb.bad{background:#FFE1DB;border:2px solid var(--ink)}

/* ---- how-to ---- */
.howto-list{display:grid;gap:10px;margin:10px 0}
.hrow{display:flex;align-items:center;gap:12px;padding:8px 12px}
.hnum{display:grid;place-items:center;width:34px;height:34px;font:800 18px var(--f-head);flex:none}
.hpic{display:block;width:84px;height:62px;flex:none}
.hpic svg{width:100%;height:100%}
.hframe{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font:600 clamp(14px,1.7vw,19px)/1.3 var(--f-ui)}
.slotw{min-width:112px;min-height:40px;border:2px dashed var(--ink);background:#fff;font:700 16px var(--f-head);padding:2px 10px}
.slotw.filled{border-style:solid;background:#FFF1C2}
.slotw.ok{background:#CDEFA9;border-style:solid}
.slotw.bad{background:#FFC9C0}
.howto-bank{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px;border:2px dashed var(--ink);background:rgba(255,255,255,.5);margin:8px 0;position:relative}
.bank-lab{position:absolute;left:10px;top:-13px;padding:2px 12px;font:700 12px var(--f-head)}
.chipw{min-height:46px;padding:6px 16px;border:2px solid var(--ink);background:var(--paper);box-shadow:var(--hard);font:700 18px var(--f-head)}
.chipw.sel{background:var(--mustard);transform:translateY(-3px)}
.chipw.used{opacity:.35;box-shadow:none}
.howto-card{padding:30px 18px 14px;position:relative;margin-top:8px}
.ht-title{position:absolute;left:14px;top:-12px;padding:3px 16px;font:800 14px var(--f-head);transform:rotate(-1deg)}
.ht-text{font:400 clamp(20px,2.4vw,28px)/1.45 var(--f-hand);margin:4px 0}
.hint-big{text-align:center;font:600 16px var(--f-ui);color:#6a3c33}

/* ---- describe ---- */
.desc-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;min-height:0;height:100%;overflow:auto;padding:4px}
.desc-left{display:flex;flex-direction:column;gap:12px;min-width:0}
.desc-pic{background:var(--mat);border:2px solid var(--ink);padding:10px;display:grid;place-items:center;box-shadow:var(--soft)}
.desc-pic svg{max-height:230px;width:100%}
.mini-board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.mini-board span{display:block}
.desc-card{padding:34px 16px 14px;position:relative}
.lvl-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font:600 14px var(--f-ui)}
.lvl-row i{font-style:normal;color:#5b4e44;font-size:13px}
.frames{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.frames li{display:flex;align-items:center;gap:10px;padding:6px 8px;background:#fff;border:2px solid var(--ink)}
.fp{display:block;width:48px;height:48px;flex:none}
.fp svg{width:100%;height:100%}
.ft{font:600 clamp(15px,1.8vw,20px)/1.25 var(--f-ui)}
.qa{padding:30px 14px 12px;position:relative}
.qrow{display:flex;align-items:center;gap:10px}
.qtext{font:700 clamp(17px,2vw,22px) var(--f-head);margin:0}
.qfb{min-height:26px;font:600 16px var(--f-ui);text-align:center;margin:8px 0 0}
.qfb.good{color:#2d6a1c}.qfb.bad{color:#9a2e1f}

/* ---- finish ---- */
.finish-stage{display:flex;align-items:center;justify-content:center;padding:6px;background:var(--kraft2)}
.photo-holder{height:100%;max-width:100%;aspect-ratio:1200/720}
.photoSvg{width:100%;height:100%}
.finish-bar{display:flex;flex-direction:column;gap:6px;align-items:center}
.finish-bar .row-btns{margin:0}
.chips{display:flex;gap:6px}
.photo-modal img{width:100%;height:auto;border:2px solid var(--ink)}
.photo-modal p{text-align:center;margin:8px 0 0}

/* ---- teacher ---- */
.pinbox{display:grid;gap:10px;justify-items:center}
.lockico{color:var(--teal)}
.pin-msg{margin:0;font-weight:600}
.pin-dots{display:flex;gap:10px}
.pin-dots i{display:block;width:22px;height:22px;border:2px solid var(--ink);background:#fff}
.pin-dots i.on{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.pk{min-height:56px;font-size:22px;padding:0}
.pk:last-child{grid-column:2}
.tpanel{display:grid;gap:8px}
input[type=checkbox]{accent-color:var(--teal)}
.tgrp{border:2px solid var(--ink);padding:7px 12px;background:#fff}
.tgrp h4{margin:0 0 6px;font:800 15px var(--f-head)}
.tg{display:flex;gap:8px;align-items:center;font-size:15px;min-height:36px}
.tg input{width:22px;height:22px}
.tg-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pin-in{font:600 16px var(--f-ui);padding:8px;border:2px solid var(--ink);width:150px}

/* ---- responsive ---- */
@media (max-width:1100px){.minis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-aspect-ratio:1/1){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr)}
  .home{grid-template-rows:auto auto auto}
  .part-card{min-height:230px;grid-template-rows:minmax(110px,1fr) auto auto}
  .minis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wb{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.wb-side{flex-direction:row;flex-wrap:wrap}
  .wb-side .tab{width:auto}
  .desc-layout{grid-template-columns:1fr}
  .cards3{grid-template-columns:1fr}
  .steps .step i{display:none}.step.on i{display:inline}
  .pinned{max-width:80%}
}
@media (max-width:640px){
  .home{display:flex;flex-direction:column;overflow:auto}.parts,.minis,.hero{flex:none}
  .parts{grid-template-columns:1fr}.part-card{min-height:170px;grid-template-rows:minmax(80px,1fr) auto auto}
  .steps .step:not(.on){display:none}
  .bread-scene,.toast-scene{flex-wrap:nowrap;gap:8px;padding:34px 8px 8px}
  .toaster-box{width:clamp(104px,34vw,160px)}
  .board-paper{padding:10px 8px 24px}
  .bread-pair{width:clamp(96px,30vw,170px)}
  .toast-view,.toast-view.big{width:clamp(110px,min(60vw,40vh),300px)}
  .sl-art{width:clamp(80px,min(34vw,30vh),200px)}
  .hero-t h1{font-size:26px}
}
@media (max-width:900px){
  #btnHome,#btnWords{font-size:0;gap:0;padding:0;width:42px;min-width:42px}
  .steps .step{padding:4px 8px}.steps .step i{display:none}.steps .step.on i{display:inline}
}
@media (max-width:760px){
  #bar{gap:6px;padding:4px 8px}.bar-btn{padding:4px 8px;font-size:13px}.logo-s{height:34px}
  .btn{padding:7px 12px}
  #btnWords{font-size:0}#btnWords .ico{margin:0}
}
@media (max-height:560px){
  :root{--barh:44px}
  #screen{padding:6px 10px 6px;gap:6px}
  .logo-s{height:36px}.btn{min-height:40px}.sayit{min-height:40px;padding:3px 8px}.say-txt{font-size:clamp(15px,2vw,20px)}
  .work{gap:10px;grid-template-columns:minmax(0,1fr) clamp(230px,38vw,360px)}
  .pc-art{width:min(100%,72px)}.grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px 6px}
  .hero{display:none}.home{grid-template-rows:minmax(0,1fr) auto}
  .minis{grid-template-columns:repeat(6,minmax(0,1fr))}.mini-art{height:34px}
  .part-card{padding-top:20px}
  .tab{min-height:32px;padding:4px 12px}
  .toaster-box{width:clamp(150px,20vw,210px)}
  .lunch-stage{padding-top:28px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

@media (max-height:480px){
  :root{--barh:40px}
  #bar{padding:2px 8px;gap:6px}.logo-s{height:32px}.btn{min-height:36px;padding:4px 10px;font-size:13px}.bar-btn{min-height:34px}.ico-btn{width:38px}
  #screen{padding:4px 8px;gap:4px}
  .sayit{min-height:32px;padding:2px 8px;gap:8px}.say-lab{padding:2px 8px;font-size:11px}.say-txt{font-size:16px}.lvl-b{min-height:28px;min-width:32px}
  .actions{min-height:38px;gap:6px}.hint{display:none}
  .steps .step{padding:2px 8px}.steps .step i{display:none}.steps .step.on i{display:inline}
  .work{grid-template-columns:minmax(0,1fr) clamp(200px,40vw,320px);gap:8px}
  .tab{min-height:26px;padding:2px 10px;font-size:12px}.sheet{padding:8px}.sheet::before{inset:3px}
  .pc-cap{font-size:11px;padding:1px 4px}
  .tags{top:6px}.ptag .t{font-size:13px;padding:4px 12px 4px 26px}
  .lunch-stage{padding-top:22px}.meter{padding:4px 8px}
  .bread-scene,.toast-scene{padding:30px 8px 8px}
  .stack-scene{padding-top:30px}
  .modal{padding:12px 14px}
  .wb{grid-template-columns:130px minmax(0,1fr)}
  .meter-title,.mtip{display:none}.meter{padding:3px 8px;gap:2px 12px}.badge-healthy{padding:1px 6px}.rosette{width:22px;height:22px}.badge-healthy b{font-size:12px}
  .toaster-box{width:clamp(110px,24vw,150px);gap:4px}.tmeter .seg{font-size:9px;padding:1px 0}.tbtn{min-height:34px;padding:2px 6px;font-size:12px}
  .pinned{max-width:46%}.ordercard{padding:4px 6px}.cust{width:38px}.otext{font-size:12px}
}

/* =====================================================================
   THEME v2 : "Little Sandwich Shop"  (2026-11-21 redesign)
   bright mint tiled wall, striped shop awning, wooden counter, glossy
   pill buttons, price-tag labels, soft rounded cards. Sticker art keeps
   its white border + dashed cut lines.
   ===================================================================== */
:root{
  --ink:#2B2A33; --paper:#FFFFFF; --kraft:#BFE9E1; --kraft2:#CDEFE8;
  --orange:#FF8A3D; --coral:#FF5E6C; --mustard:#FFC83D; --teal:#17B3A3; --pink:#FF8FB1; --blue:#4DA3FF; --green:#5FCF5F;
  --mat:#E8BE86; --aw:16px; --r:18px; --rs:12px;
  --card:0 2px 0 rgba(255,255,255,.9) inset,0 10px 24px -6px rgba(54,78,86,.28),0 2px 4px rgba(54,78,86,.12);
  --edge:1.5px solid rgba(43,42,51,.1);
  --hard:0 4px 0 rgba(43,42,51,.16),0 8px 14px -4px rgba(43,42,51,.22);
  --soft:var(--card);
}
body{
  background:
    radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.65),transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='48'><rect width='72' height='48' fill='%23C4ECE4'/><g fill='none' stroke='%23A9DDD3' stroke-width='2'><path d='M0 1H72M0 25H72M0 1V25M36 25V49M36 -23V1M72 1V25'/></g><g fill='%23ffffff' fill-opacity='.35'><rect x='3' y='3' width='30' height='4' rx='2'/><rect x='39' y='27' width='30' height='4' rx='2'/></g></svg>") 0 0/72px 48px,
    #C4ECE4;
}
#app{row-gap:var(--aw)}
/* --- shop sign header + awning --- */
#bar{background:linear-gradient(#FFFFFF,#FFF9EE);border-bottom:none;box-shadow:0 2px 0 rgba(255,255,255,.8) inset,0 6px 14px -6px rgba(54,78,86,.35);background-image:none;border-radius:0 0 22px 22px;margin:0 8px;padding:6px 14px}
#bar::after{content:'';position:absolute;left:-8px;right:-8px;top:calc(100% - 4px);height:calc(var(--aw) + 6px);bottom:auto;opacity:1;z-index:-1;
  background:repeating-linear-gradient(90deg,#F0525E 0 28px,#FFF7EA 28px 56px);
  -webkit-mask:linear-gradient(#000,#000) 0 0/100% 7px no-repeat,radial-gradient(circle at 14px 7px,#000 13.4px,transparent 14px) 0 0/28px 100% repeat-x;
  mask:linear-gradient(#000,#000) 0 0/100% 7px no-repeat,radial-gradient(circle at 14px 7px,#000 13.4px,transparent 14px) 0 0/28px 100% repeat-x}
/* second awning layer shadow strip */
#bar::before{content:'';position:absolute;left:-8px;right:-8px;top:calc(100% + 8px);height:10px;background:linear-gradient(rgba(54,78,86,.18),transparent);pointer-events:none;z-index:-2}
.logo-s{filter:none}
/* --- buttons: glossy pills --- */
.btn{border:none;border-radius:999px;background:linear-gradient(#FFFFFF,#F3F1EC);box-shadow:0 4px 0 #CFCABF,0 8px 12px -4px rgba(43,42,51,.25);padding:9px 18px;font-weight:600;color:var(--ink)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #CFCABF,0 10px 14px -4px rgba(43,42,51,.28)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #CFCABF}
.btn.primary{background:linear-gradient(#FFA55E,#FF7A2E);color:#fff;box-shadow:0 4px 0 #D85F14,0 8px 14px -4px rgba(216,95,20,.5);text-shadow:0 1px 0 rgba(150,60,0,.35)}
.btn.primary:hover{box-shadow:0 5px 0 #D85F14,0 10px 16px -4px rgba(216,95,20,.55)}
.btn.primary:active{box-shadow:0 1px 0 #D85F14}
.btn.on{background:linear-gradient(#FFD863,#FFC02B);box-shadow:0 4px 0 #D49A0C,0 8px 12px -4px rgba(212,154,12,.4)}
.btn:disabled{box-shadow:0 3px 0 rgba(0,0,0,.08);filter:saturate(.5)}
.btn.off{background:#E5E5E5}
.ico-btn{width:46px;padding:0}
/* --- tags (formerly washi tape): bright pills --- */
.w-coral,.w-mustard,.w-teal,.w-pink,.w-blue,.w-green{clip-path:none;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.w-coral{background:linear-gradient(#FF7B86,#F04C5C);color:#fff;text-shadow:0 1px 0 rgba(120,0,20,.3)}
.w-mustard{background:linear-gradient(#FFD863,#FFBE2A);color:#4a3200}
.w-teal{background:linear-gradient(#37CDBD,#12A394);color:#fff;text-shadow:0 1px 0 rgba(0,80,70,.3)}
.w-pink{background:linear-gradient(#FFB0C9,#FF86AB);color:#5c1230}
.w-blue{background:linear-gradient(#7DBBFF,#3F95F2);color:#fff;text-shadow:0 1px 0 rgba(0,40,110,.3)}
.w-green{background:linear-gradient(#86E486,#4CC24C);color:#0e3b0e}
.step,.tab,.tray-title,.part-tape,.name-tape,.modal-title,.bc-tape,.ht-title,.say-lab,.bank-lab,.shelf-title,.meter-title,.menu-title{filter:none!important;transform:none}
.step{padding:5px 14px 5px 6px;font-weight:700;opacity:.55}
.step b{border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.step.on{opacity:1;transform:scale(1.08);box-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 14px -4px rgba(0,0,0,.3)}
.step.done{opacity:.9}
.say-lab,.tray-title,.modal-title,.part-tape,.bc-tape,.ht-title,.bank-lab,.shelf-title,.meter-title,.menu-title,.name-tape{border-radius:999px}
.tab{border-radius:14px 14px 0 0;opacity:.85;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tab.on{opacity:1;transform:translateY(-2px)}
/* --- stage = wooden shop counter --- */
.stage{border:none;border-radius:var(--r);box-shadow:0 0 0 5px #fff,0 0 0 7px rgba(43,42,51,.06),0 14px 28px -8px rgba(40,60,70,.4)}
.mat{background:
    radial-gradient(130% 100% at 50% 40%,rgba(255,244,222,.55),rgba(255,244,222,0) 60%),
    linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,0) 14%,rgba(0,0,0,0) 86%,rgba(70,35,5,.18)),
    repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 86px,rgba(100,55,15,.22) 86px 88px,rgba(255,255,255,.14) 88px 90px),
    repeating-linear-gradient(90deg,rgba(110,60,15,.05) 0 3px,rgba(255,235,200,.07) 3px 7px,rgba(110,60,15,.04) 7px 14px),
    linear-gradient(#F0CB96,#E5B676)}
.mat::before{inset:0;border:none;background:linear-gradient(rgba(255,255,255,.45),transparent 4px);border-radius:var(--r)}
.mat::after{display:none}
/* --- recipe-card tray --- */
.sheet{border:none;border-radius:var(--r);background:#fff linear-gradient(rgba(23,179,163,.05) 1px,transparent 1px) 0 0/100% 26px;box-shadow:var(--card);padding:16px}
.sheet::before{inset:6px;border:2px dashed rgba(23,179,163,.28);border-radius:calc(var(--r) - 5px)}
.pc-cap{background:#FFF1BF;border:none;border-radius:999px;padding:2px 10px;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.pc.sel .pc-cap,.pc.cutopt.sel .pc-cap{background:var(--mustard);border:none}
.pc.sel::after{border:3px solid var(--teal);border-radius:var(--rs);inset:-2px}
.pc .badge{border:none;border-radius:999px;background:linear-gradient(#FFD863,#FFBE2A);box-shadow:0 2px 0 rgba(0,0,0,.18);padding:0 7px}
.pc .mark{border:none;border-radius:50%;background:linear-gradient(#86E486,#4CC24C);box-shadow:0 2px 0 rgba(0,0,0,.18);color:#fff}
.pc:hover .pc-art{transform:translateY(-4px) rotate(-2deg) scale(1.04)}
/* --- speech strip, cards, modals --- */
.sayit{border:none;border-radius:var(--r);background:#fff;box-shadow:var(--card)}
.lvl-b{border:none;border-radius:999px;background:#EFEDE6;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.lvl-b.on{background:linear-gradient(#FFD863,#FFBE2A);box-shadow:0 2px 0 #D49A0C}
.say-txt.empty,.hint,.foot-note{color:#4D5B63}
.hint{font-weight:600}
.paper,.bigcard,.rcard,.wcard,.cu-basket,.modal,.pin-card,.bc-bubble,.bubble,.desc-pic,.tgrp{border:none;border-radius:var(--r);box-shadow:var(--card)}
.modal{box-shadow:0 20px 50px -10px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.7)}
.modal-x{border:none;border-radius:50%;box-shadow:0 3px 0 #CFCABF;background:linear-gradient(#fff,#F3F1EC)}
.backdrop{background:rgba(24,54,62,.55);backdrop-filter:blur(3px)}
.bigcard:hover:not(.off),.rcard:hover,.wcard:hover{transform:translateY(-4px);box-shadow:0 2px 0 rgba(255,255,255,.9) inset,0 16px 28px -8px rgba(54,78,86,.4)}
.bigcard{padding-top:30px}
.bubble::before{border-right-color:#fff}
.bubble{box-shadow:0 2px 6px rgba(0,0,0,.12)}
.checks li{border:none;border-radius:var(--rs);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.checks .mk{border:none;border-radius:50%;color:#fff}
.cu-fb.good,.cu-fb.bad{border:none;border-radius:var(--rs)}
.cu-basket.c{background:linear-gradient(#FFF1BF,#FFE18A)}.cu-basket.u{background:linear-gradient(#DDF2FF,#B8E1FA)}
.slotw,.chipw,.pin-in,.howto-bank,.frames li,.shelf,.board-paper{border-radius:var(--rs)}
.slotw{border:2px dashed #9AA8AE}
.chipw{border:none;box-shadow:0 4px 0 #CFCABF;background:linear-gradient(#fff,#F3F1EC)}
.chipw.sel{background:linear-gradient(#FFD863,#FFBE2A);box-shadow:0 4px 0 #D49A0C}
.howto-bank{border-color:rgba(43,42,51,.25)}
.frames li{border:none;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.tgrp{background:#fff}
.pin-in{border:2px solid #C9D3D7}
.pin-dots i{border:2px solid var(--teal);border-radius:50%}.pin-dots i.on{background:var(--teal)}
.mb i{border:none;border-radius:50%;background:#E6EDEF;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.meter{background:rgba(255,255,255,.95);border-radius:var(--rs);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.badge-healthy{border:none;border-radius:999px;background:linear-gradient(#FFD863,#FFBE2A);box-shadow:0 3px 0 #D49A0C}
.rosette{border:none;border-radius:50%;transform:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}.rosette svg{transform:none}
.tmeter{border:none;border-radius:999px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tmark{background:#fff;box-shadow:0 0 0 2px var(--ink);border-radius:2px}
.seg.on{box-shadow:inset 0 0 0 3px #fff}
/* --- price tags --- */
.ptag{filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
.ptag .t{background:linear-gradient(#FFFBE6,#FFF0B8);border-radius:0 10px 10px 0}
.ptag .hole{background:#BFE9E1;border:2px solid #E9CF84;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.ptag.bad .t{background:linear-gradient(#FFE1DB,#FFC2B8)}
/* --- plate: real china plate --- */
.plate-under{border:none;background:radial-gradient(ellipse at 50% 40%,#FFFFFF 0,#FFFFFF 52%,#E9EFF3 64%,#FFFFFF 66%,#F4F8FA 100%);box-shadow:0 10px 14px -4px rgba(60,35,10,.4),inset 0 -4px 6px rgba(120,150,170,.25)}
.board-paper{border:none;box-shadow:var(--card);background:#fff}.board-paper::before{border-color:rgba(23,179,163,.3);border-radius:8px}
.board-paper.wood{background:repeating-linear-gradient(94deg,#E8B97C 0 16px,#DEA96B 16px 18px,#EDC48C 18px 34px);box-shadow:0 10px 16px -6px rgba(70,40,10,.5),inset 0 2px 0 rgba(255,255,255,.4)}
.slice.sel{border-color:var(--teal);border-radius:var(--rs);background:rgba(255,255,255,.45)}
.menu-board{background:radial-gradient(120% 100% at 50% 0,#2F6B5C,#214D42);box-shadow:inset 0 0 0 8px #D9A86C,inset 0 0 0 10px rgba(255,255,255,.25);border-radius:var(--r)}
.menu-cell{border:none;border-radius:var(--rs);box-shadow:0 4px 8px rgba(0,0,0,.3)}
.menu-cell.empty{border:2px dashed rgba(255,255,255,.5)}
.finish-stage{background:transparent}
.photo-modal img{border:none;border-radius:var(--rs)}
.cutline-fx{border-left-color:var(--coral)}
/* --- HOME: shop front --- */
.hero-t h1{color:#14515C;text-shadow:0 3px 0 rgba(255,255,255,.85)}
.hero-t p{color:#2D6F78;font-weight:600}
.part-card{background:linear-gradient(#fff,#FFFAF0);border:none;border-radius:26px;box-shadow:0 0 0 5px #fff,0 18px 30px -10px rgba(30,70,80,.45);transform:none!important;padding-top:30px}
.part-card:hover{transform:translateY(-6px)!important}
.part-card:active{transform:translateY(1px)!important}
.part-card::after{content:'';position:absolute;left:12px;right:12px;bottom:70px;height:10px;border-radius:50%;background:radial-gradient(ellipse,rgba(70,40,10,.18),transparent 70%);z-index:0}
.part-tape{padding:5px 24px;font-size:15px}
.part-card b{color:#14515C}
.mini-card{background:linear-gradient(#fff,#FFFAF0);border:none;border-radius:20px;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 12px 20px -8px rgba(30,70,80,.4)}
.mini-card:hover{transform:translateY(-4px)}
.bar-btn{padding:6px 14px}
body[data-screen=home] #bar{background:transparent;box-shadow:none}
body[data-screen=home] #bar::before{display:none}
/* shop floor strip at bottom of home */
body[data-screen=home] #screen::after{content:'';position:absolute;left:0;right:0;bottom:0;height:0}
@media (max-height:560px){:root{--aw:10px;--r:14px}#bar{padding:3px 10px}}
@media (max-height:480px){:root{--aw:8px}}
.finish-stage{box-shadow:none!important;background:transparent!important;padding:12px 10px}
.photo-holder{border-radius:22px;overflow:hidden;box-shadow:0 0 0 7px #fff,0 20px 34px -10px rgba(30,60,70,.5)}
.photoSvg{border-radius:22px}
.board-paper.wood{background:linear-gradient(135deg,#FBE9C6,#F1D29B 60%,#EBC688);border-radius:28px;box-shadow:0 0 0 4px #fff,0 14px 22px -6px rgba(70,40,10,.5)}
.board-paper.wood::before{border:2px solid rgba(255,255,255,.55);border-radius:22px}
.board-paper{border-radius:22px}
.wb-side .tab{transform:none;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35);padding:8px 16px}
.bc-cust{width:clamp(80px,15vh,128px);height:clamp(80px,15vh,128px)}
.ordercard.big .cust{width:100px}.cust{width:64px}
.hero-t{position:relative;background:linear-gradient(#1F7A80,#14565F);padding:14px 32px 16px;border-radius:24px;box-shadow:0 0 0 5px #fff,0 6px 0 5px rgba(0,0,0,.12),0 18px 28px -8px rgba(10,50,60,.5);text-align:center}
.hero-t::before,.hero-t::after{content:'';position:absolute;top:-22px;width:3px;height:20px;background:#8A6A44;border-radius:2px}
.hero-t::before{left:14%}.hero-t::after{right:14%}
.hero-t h1{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero-t p{color:#FFE9A8;margin-top:4px}
@media (max-height:560px){.hero-t{padding:8px 18px}}
/* ---- pro scene backgrounds ---- */
body[data-screen=sandwich] .mat{background:var(--bg-kitchen) center bottom/cover no-repeat,#D9A86C}
body[data-screen=toast] .mat{background:var(--bg-bakery) center bottom/cover no-repeat,#D9A86C}
body[data-screen=lunch] .mat{background:var(--bg-table) center/cover no-repeat,#D9A86C}
.mat::before{display:none}
.plate-under{box-shadow:0 12px 16px -4px rgba(50,25,0,.5),inset 0 -5px 6px rgba(120,150,170,.25)}
.lidSvg{overflow:visible}
/* ---- colourful icons ---- */
.ico{stroke:none;fill:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.star .ico,.bc-stars .ico,.rosette svg{stroke:none;fill:none}
.btn.primary .ico{filter:brightness(0) invert(1) drop-shadow(0 1px 0 rgba(150,60,0,.4))}
.bar-btn .ico,.ico-btn .ico{width:26px;height:26px}
.rosette svg{width:20px;height:20px}
/* ---- home mini cards: app-icon tiles ---- */
.mini-card{padding:10px 6px 10px;gap:8px}
.mini-art{width:clamp(70px,8.4vw,104px);height:clamp(56px,6.6vw,82px);border-radius:22px;padding:4px;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.12),0 6px 10px -3px rgba(0,0,0,.3)}
.tone-coral .mini-art{background:linear-gradient(#FF8A92,#F0525E)}
.tone-mustard .mini-art{background:linear-gradient(#FFDE75,#FFB92A)}
.tone-teal .mini-art{background:linear-gradient(#55D9CB,#12A394)}
.tone-pink .mini-art{background:linear-gradient(#FFB8D1,#FF86AB)}
.tone-blue .mini-art{background:linear-gradient(#8CC6FF,#3F95F2)}
.tone-green .mini-art{background:linear-gradient(#9CE79C,#4CC24C)}
@media (max-height:560px){.mini-art{height:42px;width:56px;border-radius:14px}}
@media (max-width:640px){.pinned .cust{width:44px}.pinned .clue{width:50px}.pinned .clue .ca{width:34px;height:34px}.pinned .ordercard{gap:6px;padding:6px}}
.plate-under{display:none}

/* =====================================================================
   THEME v3 : realistic + clean (no paper/craft, no 3D bevels, no text shadows)
   ===================================================================== */
*{text-shadow:none!important}
:root{--card:0 1px 2px rgba(20,40,50,.12),0 10px 26px -10px rgba(20,40,50,.30);--hard:0 1px 2px rgba(20,40,50,.18),0 4px 12px -4px rgba(20,40,50,.22);--soft:var(--card);--r:16px}
/* buttons: flat, modern */
.btn{background:#fff;border:1px solid rgba(20,40,50,.08);box-shadow:0 1px 2px rgba(20,40,50,.14),0 6px 14px -8px rgba(20,40,50,.3);font-weight:600}
.btn:hover{transform:none;background:#F5F8F9;box-shadow:0 1px 2px rgba(20,40,50,.16),0 8px 16px -8px rgba(20,40,50,.35)}
.btn:active{transform:scale(.97);box-shadow:0 1px 2px rgba(20,40,50,.18)}
.btn.primary{background:#EE7A2B;border-color:#D96A1E;color:#fff;box-shadow:0 1px 2px rgba(150,60,0,.3),0 8px 16px -8px rgba(216,95,20,.6)}
.btn.primary:hover{background:#F58334;box-shadow:0 1px 2px rgba(150,60,0,.3),0 10px 18px -8px rgba(216,95,20,.7)}
.btn.primary:active{box-shadow:0 1px 2px rgba(150,60,0,.3)}
.btn.on{background:#FFC93D;border-color:#E6AE20;box-shadow:0 1px 2px rgba(150,100,0,.25)}
.btn:disabled{box-shadow:none;filter:none;opacity:.45}
.btn.off{background:#E8ECEE}
.chipw,.modal-x,.lvl-b{box-shadow:0 1px 2px rgba(20,40,50,.16)!important;border:1px solid rgba(20,40,50,.08)!important;background:#fff}
.lvl-b.on,.chipw.sel{background:#FFC93D!important;border-color:#E6AE20!important}
/* labels: flat colour chips */
.w-coral,.w-mustard,.w-teal,.w-pink,.w-blue,.w-green{box-shadow:none;border-radius:999px;font-weight:700}
.w-coral{background:#E8505B;color:#fff}.w-mustard{background:#F7B928;color:#3b2a00}.w-teal{background:#12A394;color:#fff}.w-pink{background:#F58AAE;color:#4a1028}.w-blue{background:#3F8FE0;color:#fff}.w-green{background:#4CB84C;color:#0b330b}
.step.on{box-shadow:0 2px 8px -2px rgba(20,40,50,.35);transform:scale(1.05)}
.step b{box-shadow:none}
.tab{box-shadow:none;border-radius:12px 12px 0 0}
.tab.on{transform:none}
/* surfaces: clean, no ring outlines, no dashes */
.stage{box-shadow:0 1px 2px rgba(20,40,50,.2),0 16px 32px -12px rgba(20,40,50,.45)}
.sheet{background:#fff;box-shadow:var(--card)}
.sheet::before{display:none}
.pc-cap{background:#fff;color:#2B2A33;font-weight:600;border:1px solid rgba(20,40,50,.1);box-shadow:none;border-radius:999px}
.pc.sel .pc-cap,.pc.cutopt.sel .pc-cap{background:#FFC93D;border-color:#E6AE20}
.pc.sel::after{border:2px solid #12A394;inset:-3px}
.pc .badge,.pc .mark{box-shadow:none}
.paper,.bigcard,.rcard,.wcard,.cu-basket,.pin-card,.bc-bubble,.bubble,.desc-pic,.tgrp,.sayit,.meter{box-shadow:var(--card)}
.modal{box-shadow:0 24px 60px -14px rgba(0,0,0,.55)}
.part-card{box-shadow:0 1px 2px rgba(20,40,50,.14),0 18px 34px -14px rgba(20,40,50,.5);background:#fff}
.part-card::after{display:none}
.part-tape{box-shadow:none}
.mini-card{box-shadow:0 1px 2px rgba(20,40,50,.14),0 12px 24px -12px rgba(20,40,50,.45);background:#fff}
.mini-art{box-shadow:none}
.tone-coral .mini-art{background:#E8505B}.tone-mustard .mini-art{background:#F7B928}.tone-teal .mini-art{background:#12A394}.tone-pink .mini-art{background:#F58AAE}.tone-blue .mini-art{background:#3F8FE0}.tone-green .mini-art{background:#4CB84C}
.hero-t{background:#14565F;box-shadow:0 1px 2px rgba(0,0,0,.2),0 16px 30px -12px rgba(10,50,60,.55)}
.hero-t::before,.hero-t::after{display:none}
.hero-t h1{letter-spacing:-.3px}
.photo-holder{box-shadow:0 1px 2px rgba(0,0,0,.2),0 24px 40px -14px rgba(20,40,50,.6)}
.board-paper,.board-paper.wood{box-shadow:var(--card)}
.board-paper::before{display:none}
.mb i{box-shadow:none;border:1px solid rgba(20,40,50,.15)}
.badge-healthy,.rosette{box-shadow:none}
.tmeter{box-shadow:none;border:1px solid rgba(20,40,50,.15)}
.ico{filter:none}
.btn.primary .ico{filter:brightness(0) invert(1)}
/* notifications: clean toast, no price tag */
.ptag{filter:drop-shadow(0 6px 12px rgba(20,40,50,.3))}
.ptag .t{clip-path:none;border-radius:12px;background:#fff;padding:9px 20px;border-left:5px solid #12A394}
.ptag .hole{display:none}
.ptag.bad .t{background:#fff;border-left-color:#E8505B}
.menu-board{box-shadow:inset 0 0 0 6px #B98B55}
.menu-cell{box-shadow:0 2px 6px rgba(0,0,0,.3)}
@media (max-width:640px){.sheet{padding:8px}.pc-cap{padding:1px 8px;font-size:12px}}
@media (max-height:480px){.sheet{padding:6px}}
/* ---- brand logo is the Home button (no background) ---- */
.logo-btn{background:none;border:none;box-shadow:none;padding:2px 6px;margin:0;cursor:pointer;display:inline-flex;align-items:center;flex:none;border-radius:12px;transition:transform .15s}
.logo-btn:hover{transform:scale(1.05)}.logo-btn:active{transform:scale(.97)}
.logo-btn:focus-visible{outline:3px solid #3F8FE0;outline-offset:2px}
#btnHome{width:auto!important;min-width:0!important;padding:2px 6px!important}
body[data-screen=home] #btnHome{visibility:hidden}

/* ---- two-tone line icons ---- */
.ico{color:#1F4E5A;stroke:none;fill:none;filter:none}
.btn.primary .ico,.mark .ico,.mk .ico,.tone-coral .ico{color:#fff;filter:none}
.btn.primary .ico path{fill-opacity:.0}
.star .ico,.bc-stars .ico{width:26px;height:26px}
.bar-btn .ico,.ico-btn .ico{width:24px;height:24px}
.rosette svg{width:18px;height:18px}
/* home small cards: realistic objects, no coloured tiles */
.mini-art,.tone-coral .mini-art,.tone-mustard .mini-art,.tone-teal .mini-art,.tone-pink .mini-art,.tone-blue .mini-art,.tone-green .mini-art{background:none;border-radius:0;padding:0;width:clamp(84px,9.4vw,120px);height:clamp(70px,7.8vw,100px)}
.mini-card{gap:6px}
@media (max-height:560px){.mini-art{width:64px;height:52px}}
.mini-art{position:relative}
.mini-art::before{content:'';position:absolute;left:6%;right:6%;top:2%;bottom:2%;border-radius:50%;background:var(--tn,#12A394);opacity:.2}
.mini-art svg{position:relative}
.tone-coral{--tn:#E8505B}.tone-mustard{--tn:#F7B928}.tone-teal{--tn:#12A394}.tone-pink{--tn:#F58AAE}.tone-blue{--tn:#3F8FE0}.tone-green{--tn:#4CB84C}

</style>

'use strict';
/* Small helpers used everywhere */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const raf = () => new Promise((r) => requestAnimationFrame(r));
function rng(seed) { let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr, r) { const a = arr.slice(); const f = r || Math.random; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let _uid = 0; const uid = (p) => (p || 'u') + (++_uid);
/* colours */
function hex2rgb(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map((x) => x + x).join(''); return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)]; }
function rgb2hex(r) { return '#' + r.map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v + (y[i] - v) * t)); }
const dk = (c, f) => mix(c, '#2a1608', f == null ? 0.35 : f);
const lt = (c, f) => mix(c, '#ffffff', f == null ? 0.4 : f);
/* store (never throws) */
const Store = {
  get(k, d) { try { const v = localStorage.getItem('slm.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('slm.' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
  del(k) { try { localStorage.removeItem('slm.' + k); } catch (e) { /* ignore */ } }
};
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

/* ---- 03a-art-core.js ---- */
'use strict';
/* =========================================================
   ART: every picture is drawn in code (SVG strings).
   Paper-sticker look: flat colours, thin darker outline, white border, soft paper shadow.
   ========================================================= */
const Art = (() => {
  const P = {};
  const f1 = (n) => +(+n).toFixed(1);
  const C = (x, y, r, fill, ex) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${fill}" ${ex || ''}/>`;
  const EL = (x, y, rx, ry, fill, ex, rot) => `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${fill}" ${rot ? `transform="rotate(${f1(rot)} ${f1(x)} ${f1(y)})"` : ''} ${ex || ''}/>`;
  const PA = (d, fill, ex) => `<path d="${d}" fill="${fill}" ${ex || ''}/>`;
  const RE = (x, y, w, hh, fill, ex, rx) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(hh)}" rx="${rx || 0}" fill="${fill}" ${ex || ''}/>`;
  const ST = (c, w) => `stroke="${c}" stroke-width="${w == null ? 2.2 : w}" stroke-linejoin="round" stroke-linecap="round"`;
  const LN = (d, c, w, ex) => `<path d="${d}" fill="none" ${ST(c, w)} ${ex || ''}/>`;
  /* smooth closed blob / ruffle paths */
  function smooth(pts) {
    const n = pts.length; let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
    }
    return d + 'Z';
  }
  function blob(cx, cy, rx, ry, n, amp, seed) {
    const r = rng(seed || 3), pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + (r() * 2 - 1) * amp; pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    return smooth(pts);
  }
  function ruffle(cx, cy, rx, ry, n, amp) {
    const pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + (i % 2 ? amp : -amp); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    return smooth(pts);
  }
  /* ---------- automatic "soft 3D" shading ----------
     Every flat colour fill becomes a gentle gradient (light from the top-left),
     round shapes become little domes, and the dark outlines are softened.
     Works on any svg string, so all the art gets the same realistic, juicy look. */
  const SHADE_SKIP = { '#ffffff': 1 };
  function shade(str, opt) {
    if (!str || str.indexOf('<') < 0) return str;
    opt = opt || {};
    const defs = {};
    const hexOk = (c) => { const [r, g, b] = hex2rgb(c); const l = (r * .3 + g * .59 + b * .11); return l > 18; };
    const out = str.replace(/<(circle|ellipse|path|rect|polygon)\b([^>]*?)(\/?)>/g, (m, tag, attrs, sl) => {
      let a = attrs, changed = false;
      const fm = a.match(/\sfill="(#[0-9a-fA-F]{6})"/);
      if (fm && !SHADE_SKIP[fm[1].toLowerCase()] && hexOk(fm[1]) && a.indexOf('fill-opacity') < 0) {
        const hex = fm[1].toLowerCase(), round = tag === 'circle' || tag === 'ellipse';
        const id = (round ? 'sr' : 'sl') + hex.slice(1) + (opt.flat ? 'f' : '');
        if (!defs[id]) {
          const [r0, g0, b0] = hex2rgb(hex), lum = r0 * .3 + g0 * .59 + b0 * .11, pale = lum > 225 ? .3 : 1;
          const hi = lt(hex, (opt.flat ? .1 : .3) * (lum > 225 ? .4 : 1)), lo = dk(hex, (opt.flat ? .1 : .2) * pale), md = lt(hex, .04 * pale);
          defs[id] = round
            ? `<radialGradient id="${id}" cx=".36" cy=".3" r=".82" fx=".3" fy=".24"><stop offset="0" stop-color="${hi}"/><stop offset=".55" stop-color="${md}"/><stop offset="1" stop-color="${lo}"/></radialGradient>`
            : `<linearGradient id="${id}" x1=".15" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${hi}"/><stop offset=".55" stop-color="${md}"/><stop offset="1" stop-color="${lo}"/></linearGradient>`;
        }
        a = a.replace(fm[0], ` fill="url(#${id})"`); changed = true;
      }
      if (/\sstroke="#/.test(a) && !/\sfill="none"/.test(a) && a.indexOf('stroke-opacity') < 0) { const wm = a.match(/stroke-width="([\d.]+)"/); const wv = wm ? +wm[1] : 2; a += wv >= 3.5 ? ' stroke-opacity=".7"' : ' stroke-opacity=".16"'; changed = true; }
      return changed ? `<${tag}${a}${sl}>` : m;
    });
    const d = Object.keys(defs).map((k) => defs[k]).join('');
    if (!d) return out;
    if (/^<svg/.test(out)) { const i = out.indexOf('>') + 1; return out.slice(0, i) + `<defs>${d}</defs>` + out.slice(i); }
    return `<defs>${d}</defs>` + out;
  }
  function def(id, w, hh, sil, body, extra) { P[id] = Object.assign({ id, w, h: hh, sil, body: shade(body) }, extra || {}); }
  /* realistic object: soft contact shadow + body (no sticker border). cut ring only for printable cut sheets */
  const softShadow = (sil, sw, dx, dy) => `<g transform="translate(${dx} ${dy})" fill="#2a1500" stroke="#2a1500" stroke-linejoin="round"><g fill-opacity=".05" stroke-opacity=".05" stroke-width="${f1(sw * 1.7)}">${sil}</g><g fill-opacity=".07" stroke-opacity=".07" stroke-width="${f1(sw)}">${sil}</g><g fill-opacity=".12" stroke-opacity=".12" stroke-width="${f1(sw * .35)}">${sil}</g></g>`;
  function S(src, o) {
    o = o || {};
    const p = typeof src === 'string' ? P[src] : src;
    if (!p) throw new Error('no art for ' + src);
    const pad = 12, sw = 6 + (p.sw || 0);
    const cut = o.cut ? `<g fill="none" stroke="#6a6a6a" stroke-width="3.6" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="butt" class="cutline">${p.sil}</g>` : '';
    const shadow = (o.noshadow || o.cut) ? '' : softShadow(p.sil, sw, 1.2, 3.4);
    return `<svg class="stk${o.cls ? ' ' + o.cls : ''}" viewBox="${-pad} ${-pad} ${p.w + pad * 2} ${p.h + pad * 2 + 2}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${shadow}${cut}${p.body}</svg>`;
  }
  /* body only (for composing in bigger scenes) */
  function G(src, x, y, scale, rot) {
    const p = typeof src === 'string' ? P[src] : src;
    const sw = 5 + (p.sw || 0);
    return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${rot || 0}) scale(${scale || 1}) translate(${-p.w / 2} ${-p.h / 2})">${softShadow(p.sil, sw, 1.2, 3)}${p.body}</g>`;
  }

  /* ---------------- breads ---------------- */
  const BREAD = {
    white: { crumb: '#FFEFC6', crust: '#D99A45' },
    brown: { crumb: '#D3A168', crust: '#8A5527' },
    seeded: { crumb: '#E7BF82', crust: '#A8692C' },
    sourdough: { crumb: '#F7E4B8', crust: '#BA7630' },
    bun: { crumb: '#F6CF86', crust: '#D68B34' },
    wrap: { crumb: '#F8E8C6', crust: '#E2C28E' },
    croissant: { crumb: '#F5BE62', crust: '#CB7724' }
  };
  const TOAST_T = [null, ['#F1BD6A', .5, '#C98A3C', .45], ['#D98C34', .72, '#A85F1F', .75], ['#7C4420', .86, '#4A2610', .85], ['#1F1511', .97, '#120C09', .95]];
  function breadCols(id, lvl) {
    const b = BREAD[id]; lvl = lvl || 0;
    if (!lvl) return { crumb: b.crumb, crust: b.crust, line: dk(b.crust, .4) };
    const t = TOAST_T[lvl];
    const crumb = mix(b.crumb, t[0], t[1]), crust = mix(b.crust, t[2], t[3]);
    return { crumb, crust, line: dk(crust, .4) };
  }
  const SL = 'M16 44Q4 42 6 26Q8 9 26 8L74 8Q92 9 94 26Q96 42 84 44L84 94Q84 98 80 98L20 98Q16 98 16 94Z';
  const CR = 'M5 76C-4 40 26 8 50 8C74 8 104 40 95 76C93 85 84 86 80 79C72 60 62 46 50 46C38 46 28 60 20 79C16 86 7 85 5 76Z';
  /* inner (crumb / spread) region transform for each bread */
  const INNER = { slice: 'translate(6.5 7.5) scale(.87)', spread: 'translate(11.5 13) scale(.77)' };
  function breadGeom(id) {
    if (id === 'bun') return { sil: '<ellipse cx="50" cy="52" rx="46" ry="43"/>', outer: (c) => EL(50, 52, 46, 43, c.crust, ST(c.line, 2.4)), inner: (c) => EL(50, 53, 40, 37, c.crumb), spread: EL(50, 53, 34, 31, '#000'), kind: 'bun' };
    if (id === 'wrap') return { sil: '<circle cx="50" cy="50" r="46"/>', outer: (c) => C(50, 50, 46, c.crust, ST(c.line, 2.4)), inner: (c) => C(50, 50, 41, c.crumb), spread: C(50, 50, 35, '#000'), kind: 'wrap' };
    if (id === 'croissant') return { sil: `<path d="${CR}"/>`, outer: (c) => PA(CR, c.crust, ST(c.line, 2.4)), inner: (c) => PA(CR, c.crumb, `transform="translate(6 6.6) scale(.88)"`), spread: PA(CR, '#000', `transform="translate(13 14.3) scale(.74)"`), kind: 'croissant' };
    return { sil: `<path d="${SL}"/>`, outer: (c) => PA(SL, c.crust, ST(c.line, 2.4)), inner: (c) => PA(SL, c.crumb, `transform="${INNER.slice}"`), spread: PA(SL, '#000', `transform="${INNER.spread}"`), kind: 'slice' };
  }
  /* top view of one bread (100x100 box). returns body string */
  function breadTopBody(id, lvl, o) {
    o = o || {};
    const g = breadGeom(id), c = breadCols(id, lvl), r = rng(11);
    let s = g.outer(c) + g.inner(c);
    const dots = (n, col, rx, ry, cx0, cy0, w, hh) => { let t = ''; for (let i = 0; i < n; i++) t += EL(cx0 + r() * w, cy0 + r() * hh, rx, ry, col, '', r() * 180); return t; };
    const hole = mix(c.crumb, c.crust, .35);
    if (g.kind === 'slice') {
      s += dots(10, hole, 1.6, 1.1, 24, 26, 52, 50);
      if (id === 'seeded') s += dots(14, '#6B4A22', 1.9, 1.1, 24, 26, 52, 50) + dots(8, '#F4E2B0', 1.8, 1, 24, 26, 52, 50);
      if (id === 'sourdough') s += LN('M34 40C44 34 56 34 66 40', mix(c.crust, '#fff', .2), 2.2) + LN('M30 54C44 48 58 48 72 54', mix(c.crust, '#fff', .2), 2.2) + LN('M34 68C46 62 58 62 68 68', mix(c.crust, '#fff', .2), 2.2);
    } else if (g.kind === 'bun') {
      for (let i = 0; i < 11; i++) { const a = r() * 6.28, d = r() * 28; s += EL(50 + Math.cos(a) * d, 50 + Math.sin(a) * d * .9, 3.3, 1.8, '#FFF6DC', ST('#C9A25A', .8), r() * 180); }
    } else if (g.kind === 'wrap') {
      s += dots(14, mix(c.crust, '#7a4b1c', .45), 2, 1.5, 18, 18, 64, 64) + LN('M20 62C36 52 62 52 80 62', mix(c.crust, '#fff', .25), 1.8);
    } else {
      for (let k = 0; k < 7; k++) { const a = (-165 + k * 25) * Math.PI / 180; s += LN(`M${f1(50 + Math.cos(a) * 22)} ${f1(80 + Math.sin(a) * 33)}L${f1(50 + Math.cos(a) * 38)} ${f1(80 + Math.sin(a) * 62)}`, c.line, 2.2); }
      s += LN('M16 56C24 36 38 24 50 22', mix(c.crumb, '#fff', .5), 2.4);
    }
    if (lvl === 4) s += dots(10, '#000', 3.5, 2.4, 22, 22, 56, 56).replace(/fill="#000"/g, 'fill="#000" fill-opacity=".45"');
    else if (lvl === 3) s += dots(7, '#3b1d0c', 3, 2, 24, 24, 52, 52).replace(/fill="#3b1d0c"/g, 'fill="#3b1d0c" fill-opacity=".3"');
    if (o.spread && o.spreadId) s += spreadFill(id, null, o.spreadId);
    return s;
  }
  /* spread paint on top of a bread (fills inner region) */
  const SPREAD_COL = { butter: '#FFE57A', mayo: '#FFF6D6', peanut: '#D9A25C', jam: '#C9283D', cream: '#FFFDF2', choc: '#6B3A21', avocado: '#A9D45A' };
  function spreadFill(id, col, spreadId) {
    const g = breadGeom(id), col2 = col || SPREAD_COL[spreadId];
    const shape = g.spread.replace('fill="#000"', `fill="${col2}" ${ST(dk(col2, .25), 1.6)}`);
    let tex = '';
    const r = rng(7);
    if (spreadId === 'jam') for (let i = 0; i < 12; i++) tex += C(26 + r() * 48, 26 + r() * 48, 1.6, '#F0586B');
    if (spreadId === 'peanut') for (let i = 0; i < 10; i++) tex += C(26 + r() * 48, 26 + r() * 48, 1.6, '#B9803F');
    if (spreadId === 'avocado') for (let i = 0; i < 9; i++) tex += C(26 + r() * 48, 26 + r() * 48, 1.5, '#7EA83C');
    if (spreadId === 'butter') tex = LN('M30 40C42 34 58 34 70 40', '#FFF3B5', 3) + LN('M28 54C42 48 60 48 72 54', '#FFF3B5', 3);
    return shape + tex;
  }

  /* register a sticker for each bread (not toasted) */
  Object.keys(BREAD).forEach((id) => { const g = breadGeom(id); def('b_' + id, 100, 100, g.sil, breadTopBody(id, 0)); });
  const bread = (id, lvl, o) => { const g = breadGeom(id); return { id: 'b_' + id, w: 100, h: 100, sil: g.sil, body: shade(breadTopBody(id, lvl, o)) }; };

'use strict';
/* sandwich cross-section stack, cut shapes, toast top view */
(() => {
  const { C, EL, PA, RE, ST, LN, P, f1, blob, ruffle, BREAD, shade } = Art;
  const CX = 210, BW = 300;
  const f = f1;
  const rrect = (w, hh, fill, stroke, r, y0) => RE(CX - w / 2, y0 || 0, w, hh, fill, ST(stroke, 1.8), r);

  /* ---- crumb texture ---- */
  function crumbs(x0, x1, y0, y1, col, seed) {
    const r = rng(seed); let s = '';
    for (let i = 0; i < Math.max(4, (x1 - x0) / 22); i++) s += EL(x0 + 10 + r() * (x1 - x0 - 20), y0 + 5 + r() * Math.max(1, y1 - y0 - 10), 2.6 + r() * 1.5, 1.4, col, '', r() * 40 - 20);
    return s;
  }
  /* bread band. pos: 'bottom' | 'top'.  returns {h, svg} */
  function breadBand(id, pos, lvl, crusts, seed) {
    const c = Art.breadCols(id, lvl), g = Art.breadGeom(id), kind = g.kind;
    const w = crusts ? BW : BW - 18, x0 = CX - w / 2, x1 = CX + w / 2;
    const crumbHole = mix(c.crumb, c.crust, .3);
    const strokeCol = crusts ? c.crust : mix(c.crumb, '#c7a064', .35), sw = crusts ? 6 : 1.8;
    const outline = crusts ? `<path d="@@" fill="none" stroke="${c.line}" stroke-width="${sw + 3.2}" stroke-linejoin="round"/>` : '';
    const mk = (d, hh) => {
      const body = outline.replace('@@', d) + `<path d="${d}" fill="${c.crumb}" stroke="${strokeCol}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      return body;
    };
    let hh, d, extra = '';
    if (kind === 'slice') {
      if (pos === 'bottom') { hh = 44; d = `M${x0 + 4} 5Q${x0 + 4} 3 ${x0 + 8} 3L${x1 - 8} 3Q${x1 - 4} 3 ${x1 - 4} 5L${x1 - 4} ${hh - 9}Q${x1 - 4} ${hh - 4} ${x1 - 9} ${hh - 4}L${x0 + 9} ${hh - 4}Q${x0 + 4} ${hh - 4} ${x0 + 4} ${hh - 9}Z`; }
      else { hh = 58; d = `M${x0 + 4} ${hh - 4}L${x0 + 4} 22Q${x0 + 4} 8 ${x0 + 16} 7Q${CX} 2 ${x1 - 16} 7Q${x1 - 4} 8 ${x1 - 4} 22L${x1 - 4} ${hh - 4}Z`; }
      extra = crumbs(x0 + 14, x1 - 14, 8, hh - 8, crumbHole, seed || 3);
      if (id === 'seeded') extra += crumbs(x0 + 14, x1 - 14, 8, hh - 8, '#6B4A22', (seed || 3) + 5);
      if (lvl >= 3) extra += crumbs(x0 + 14, x1 - 14, 8, hh - 8, 'rgba(0,0,0,.25)', (seed || 3) + 2);
    } else if (kind === 'bun') {
      if (pos === 'bottom') { hh = 34; d = `M${x0 + 6} 4L${x1 - 6} 4L${x1 - 4} ${hh - 14}Q${x1 - 4} ${hh - 3} ${x1 - 24} ${hh - 3}L${x0 + 24} ${hh - 3}Q${x0 + 4} ${hh - 3} ${x0 + 4} ${hh - 14}Z`; }
      else { hh = 58; d = `M${x0 + 4} ${hh - 4}L${x0 + 4} 40Q${x0 + 4} 4 ${CX} 4Q${x1 - 4} 4 ${x1 - 4} 40L${x1 - 4} ${hh - 4}Z`; extra = [[-60, 22], [-30, 14], [0, 11], [30, 14], [60, 22], [-45, 34], [-14, 28], [18, 28], [48, 34]].map(([dx, dy], i) => EL(CX + dx, dy + 6, 5.5, 2.8, '#FFF6DC', ST('#C9A25A', 1), (i * 37) % 60 - 30)).join(''); }
      extra += crumbs(x0 + 14, x1 - 14, 12, hh - 8, crumbHole, 4);
    } else if (kind === 'wrap') {
      hh = pos === 'bottom' ? 16 : 20;
      d = pos === 'bottom' ? `M${x0 - 6} 4Q${CX} 8 ${x1 + 6} 4L${x1 + 8} 12Q${CX} 16 ${x0 - 8} 12Z` : `M${x0 - 8} 14Q${x0 - 6} 4 ${x0 + 30} 4Q${CX} 8 ${x1 - 30} 4Q${x1 + 6} 4 ${x1 + 8} 14Q${CX} 18 ${x0 - 8} 14Z`;
      extra = [[-100, 9], [-50, 8], [10, 9], [70, 8], [110, 9]].map(([dx, dy]) => EL(CX + dx, dy, 4, 1.6, mix(c.crust, '#7a4b1c', .5), '', 0)).join('');
    } else {
      if (pos === 'bottom') { hh = 30; d = `M${x0 - 4} 6Q${x0 + 40} ${hh} ${CX} ${hh}Q${x1 - 40} ${hh} ${x1 + 4} 6Q${CX} 16 ${x0 - 4} 6Z`; extra = ''; }
      else { hh = 48; d = `M${x0 - 4} ${hh - 6}Q${x0 + 8} 6 ${CX} 6Q${x1 - 8} 6 ${x1 + 4} ${hh - 6}Q${CX} ${hh - 22} ${x0 - 4} ${hh - 6}Z`; extra = [-110, -70, -30, 10, 50, 90].map((dx) => LN(`M${CX + dx} ${hh - 20}Q${CX + dx + 6} 22 ${CX + dx * .9 + 8} 10`, c.line, 2.4)).join(''); }
    }
    return { h: hh, svg: mk(d, hh) + extra, w: w };
  }

  /* ---- fillings: one unit each ---- */
  const wave = (x0, x1, y, amp, n, ph) => { let d = ''; const st = (x1 - x0) / n; for (let i = 0; i <= n; i++) d += (i ? 'L' : 'M') + f(x0 + i * st) + ' ' + f(y + Math.sin(i * 1.9 + ph) * amp * (i % 2 ? 1 : -1)); return d; };
  /* quadratic zig-zag edge from x0 to x1 (works backwards too) */
  const qw = (x0, x1, y, amp, n) => { const st = (x1 - x0) / n; let d = ''; for (let i = 0; i < n; i++) { const a = x0 + i * st, b = x0 + (i + 1) * st; d += `Q${f((a + b) / 2)} ${f(y + (i % 2 ? -amp : amp) * 2)} ${f(b)} ${f(y)}`; } return d; };
  const gloss = (cx, y, w, op) => EL(cx, y, w, 1.8, '#fff', `fill-opacity="${op || .5}"`);

      let veins = ''; [-110, -20, 70, 130].forEach((dx) => { veins += LN(`M${CX + dx} 11Q${CX + dx + 8} 15 ${CX + dx + 4} 20`, '#E9F9C2', 1.6, 'stroke-opacity=".7"'); });
      return { h: 27, svg: PA(back, '#6CC63A', ST('#3C8A28', 1.8)) + PA(front, '#9FE665', 'fill-opacity=".9"') + veins };
    },
    tomato: () => {
      let seeds = ''; [-72, -36, 0, 36, 72].forEach((dx, i) => { seeds += EL(CX + dx, 10, 9, 3.6, '#FFB8A0', '', 0) + EL(CX + dx - 2, 10, 1.6, 1, '#FFE9A8') + EL(CX + dx + 3, 10.5, 1.6, 1, '#FFE9A8'); });
      return { h: 21, svg: rrect(216, 21, '#E23A2A', '#A8261A', 10.5) + RE(CX - 100, 4, 200, 13, '#FF6A54', '', 6.5) + seeds + gloss(CX - 56, 3.2, 44, .6) };

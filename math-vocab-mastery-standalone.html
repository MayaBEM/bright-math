`,sentence:`The remainder is 3 when n is divided by 5.`,keywords:[`remainder is 3`,`divided by 5`],question:`What does this sentence tell you about the number n?`,options:[`n is exactly 3`,`n splits evenly into 5 groups with nothing left over`,`When n is divided by 5, 3 is left over after the division`,`n multiplied by 5 equals 3`],correctIndex:2,explanation:`"Remainder" refers to the amount left over after division, so "remainder is 3 when n is divided by 5" means n = 5k + 3 for some whole number k.`,category:`numbers`},{id:`rs4`,sentence:`The sum of two consecutive even numbers is 46.`,keywords:[`sum`,`two consecutive even numbers`],question:`What kind of numbers does this sentence describe?`,options:[`Two odd numbers chosen at random`,`Two even numbers that follow one another in order, like 8 and 10`,`Any two numbers that are multiples of 46`,`Two numbers that are exactly equal`],correctIndex:1,explanation:`"Consecutive even numbers" means even numbers that come one after another with a difference of 2 (such as 22 and 24), and "sum" tells you they are added together to total 46.`,category:`numbers`},{id:`rs5`,sentence:`A number decreased by 12 is equal to twice the number increased by 3.`,keywords:[`decreased by 12`,`twice the number`,`increased by 3`],question:`What does the phrase "decreased by 12" tell you to do to the number?`,options:[`Add 12 to the number`,`Subtract 12 from the number`,`Multiply the number by 12`,`Divide the number by 12`],correctIndex:1,explanation:`"Decreased by" always signals subtraction, just as "increased by" signals addition; together with "twice the number," this sentence describes the equation x − 12 = 2x + 3.`,category:`numbers`},{id:`rs6`,sentence:`The perimeter of the rectangle is 48 cm, and its length is twice its width.`,keywords:[`perimeter`,`48 cm`,`twice its width`],question:`What does "perimeter" measure in this sentence?`,options:[`The space enclosed inside the rectangle`,`The total distance around the outside edges of the rectangle`,`The length of the diagonal`,`The area of one side only`],correctIndex:1,explanation:`"Perimeter" always refers to the total boundary distance around a shape, not the space it encloses (that would be "area"), and the sentence gives that total as 48 cm.`,category:`geometry`},{id:`rs7`,sentence:`Two sides of the triangle are equal in length, forming an isosceles triangle.`,keywords:[`equal in length`,`isosceles triangle`],question:`What does the word "isosceles" describe about this triangle?`,options:[`All three sides are different lengths`,`Exactly two sides are the same length`,`All three angles are right angles`,`The triangle has no equal sides or angles`],correctIndex:1,explanation:`"Isosceles" specifically names a triangle with exactly two equal sides, matching the clue "two sides ... are equal in length."`,category:`geometry`},{id:`rs8`,sentence:`The shaded region is the area inside the circle but outside the square.`,keywords:[`shaded region`,`inside the circle but outside the square`],question:`What part of the figure does the shaded region represent?`,options:[`The part where the circle and square overlap`,`The part of the circle that does not overlap with the square`,`The entire square only`,`The perimeter of the circle`],correctIndex:1,explanation:`"Inside the circle but outside the square" describes the portion of the circle's area that is not shared with the square, which is exactly what is shaded.`,category:`geometry`},{id:`rs9`,sentence:`Each term in the sequence is 3 more than twice the previous term.`,keywords:[`Each term`,`3 more than twice`,`previous term`],question:`How is each new term in this sequence found?`,options:[`By adding 3 to the term before it`,`By doubling the term before it and then adding 3`,`By dividing the term before it by 3`,`By subtracting the term before it from 3`],correctIndex:1,explanation:`"Twice the previous term" means multiply the term before it by 2, and "3 more than" means add 3 after that multiplication.`,category:`patterns`},{id:`rs10`,sentence:`The numbers follow the rule: multiply by 2, then subtract 1.`,keywords:[`follow the rule`,`multiply by 2`,`subtract 1`],question:`What two operations does this rule describe, in order?`,options:[`Subtract 1, then multiply by 2`,`Multiply by 2, then subtract 1`,`Add 2, then divide by 1`,`Multiply by 1, then subtract 2`],correctIndex:1,explanation:`The order word "then" shows that multiplication happens first ("multiply by 2") and subtraction happens second ("subtract 1"), and reversing that order would give a different result.`,category:`patterns`},{id:`rs11`,sentence:`In this pattern, every third shape is shaded gray.`,keywords:[`every third shape`,`shaded gray`],question:`Which shapes in the pattern are gray?`,options:[`Every shape in the pattern`,`Only the 1st and 2nd shapes`,`The 3rd, 6th, 9th shape, and so on`,`Only the very last shape in the pattern`],correctIndex:2,explanation:`"Every third" means positions that are multiples of 3 in the sequence (3rd, 6th, 9th, ...), so those specific shapes are shaded gray.`,category:`patterns`},{id:`rs12`,sentence:`There are 35 chickens and rabbits altogether, with 94 legs in total.`,keywords:[`altogether`,`94 legs in total`],question:`What does the word "altogether" tell you in this sentence?`,options:[`The 35 refers only to chickens`,`35 is the combined total of chickens and rabbits added together`,`There are 35 more rabbits than chickens`,`94 is the number of animals`],correctIndex:1,explanation:`"Altogether" signals that the two groups (chickens and rabbits) have already been combined into one total of 35, while "94 legs in total" gives a second combined total to set up a system of equations.`,category:`wordProblems`},{id:`rs13`,sentence:`After giving away 15 stickers, Somchai has 27 stickers remaining.`,keywords:[`giving away`,`stickers remaining`],question:`What does "remaining" tell you about the 27 stickers?`,options:[`27 is the number Somchai gave away`,`27 is what is left after the 15 stickers were given away`,`27 is the total Somchai started with`,`27 is the number of stickers Somchai wants to buy`],correctIndex:1,explanation:`"Remaining" means what is left after an action is subtracted, so 27 is the result after 15 stickers were removed from Somchai's original amount.`,category:`wordProblems`},{id:`rs14`,sentence:`A basket contains red and blue marbles in the ratio 3 to 5.`,keywords:[`ratio 3 to 5`],question:`What does "ratio 3 to 5" tell you about the marbles?`,options:[`There are exactly 3 red marbles and 5 blue marbles`,`For every 3 red marbles, there are 5 blue marbles, in that same proportion`,`The basket holds only 8 marbles total`,`Red marbles weigh 3 times as much as blue marbles`],correctIndex:1,explanation:`A ratio expresses a proportional relationship, not exact counts — "3 to 5" means the red and blue marbles occur in groups of 3 and 5 that can scale up together (e.g., 6 and 10, 9 and 15).`,category:`wordProblems`},{id:`rs15`,sentence:`A cinema sold adult and child tickets at $8 and $5 respectively, collecting $940 in total.`,keywords:[`respectively`,`$940 in total`],question:`What does the word "respectively" tell you here?`,options:[`Both adult and child tickets cost the same price`,`Adult tickets cost $8 and child tickets cost $5, matching the order they were listed`,`Adult tickets cost $5 and child tickets cost $8`,`The prices refer to a single combined ticket type`],correctIndex:1,explanation:`"Respectively" pairs each price with the item listed in the same position and order — since "adult and child" came first, "$8 and $5" apply to adult and child in that same order.`,category:`wordProblems`},{id:`rs16`,sentence:`How many shortest paths are there from A to B without passing through C?`,keywords:[`shortest paths`,`without passing through C`],question:`What restriction does this question place on the paths being counted?`,options:[`The paths must pass through point C`,`The paths must avoid point C entirely`,`The paths must start at C`,`There is no restriction on the route`],correctIndex:1,explanation:`"Without passing through C" is an exclusion condition — any path that touches point C must not be counted among the shortest paths from A to B.`,category:`logic`},{id:`rs17`,sentence:`If the statement is false, then exactly one of the other three statements must be true.`,keywords:[`is false`,`exactly one`,`must be true`],question:`What does "exactly one" specify about the other three statements?`,options:[`All three of them are true`,`None of them are true`,`Precisely one of the three is true and the other two are false`,`It cannot be determined how many are true`],correctIndex:2,explanation:`"Exactly one" is a precise quantity word meaning the count is neither zero nor more than one — of the three remaining statements, one and only one must be true.`,category:`logic`},{id:`rs18`,sentence:`Among the five students, only one is telling the truth, and the rest are lying.`,keywords:[`only one`,`telling the truth`,`the rest are lying`],question:`How many of the five students are telling the truth?`,options:[`All five`,`Exactly one`,`Four of them`,`None of them`],correctIndex:1,explanation:`"Only one" restricts the truth-teller to a single student, and "the rest are lying" confirms the remaining four students' statements are false.`,category:`logic`},{id:`rs19`,sentence:`The container holds 2.5 liters of water when it is exactly half full.`,keywords:[`holds 2.5 liters`,`exactly half full`],question:`What does this sentence tell you about the container's total capacity?`,options:[`The container's full capacity is 2.5 liters`,`The container's full capacity is 5 liters, since 2.5 liters is only half of it`,`The container is completely empty`,`The container can never be filled more than 2.5 liters`],correctIndex:1,explanation:`Since 2.5 liters corresponds to "half full," the full capacity must be double that amount, or 5 liters.`,category:`measurement`},{id:`rs20`,sentence:`The temperature dropped by 15 degrees Celsius between noon and midnight.`,keywords:[`dropped by 15 degrees`,`between noon and midnight`],question:`What does "dropped by" indicate about the temperature change?`,options:[`The temperature increased by 15 degrees`,`The temperature decreased by 15 degrees`,`The temperature stayed the same`,`The temperature was measured only once`],correctIndex:1,explanation:`"Dropped by" is a decrease phrase, the opposite of "rose by" or "increased by," showing the temperature became 15 degrees lower over that time period.`,category:`measurement`},{id:`rs21`,sentence:`When the cube is unfolded into a net, six squares are arranged in a cross shape.`,keywords:[`unfolded into a net`,`cross shape`],question:`What is a "net" in this context?`,options:[`A 3D solid shape`,`A flat, 2D arrangement of shapes that can be folded to form a 3D solid`,`A grid used for graphing`,`A type of triangle`],correctIndex:1,explanation:`"Unfolded into a net" describes flattening a 3D shape like a cube into its 2D pattern of faces, which can be folded back up to recreate the solid.`,category:`spatial`},{id:`rs22`,sentence:`The shape is rotated 90 degrees clockwise about its center.`,keywords:[`rotated 90 degrees clockwise`,`about its center`],question:`What transformation is being described?`,options:[`The shape is flipped over like a mirror image`,`The shape is turned a quarter-turn in the clockwise direction around a fixed point`,`The shape is made larger`,`The shape is moved to a new location without turning`],correctIndex:1,explanation:`"Rotated ... clockwise about its center" describes a turn (not a flip or a slide), and 90 degrees is one quarter of a full 360-degree turn.`,category:`spatial`}];function di(e,t){if(t.length===0)return e;let n=[...t].sort((e,t)=>t.length-e.length).map(e=>e.replace(/[.*+?^${}()|[\]\\]/g,`\\$&`)),r=RegExp(`(${n.join(`|`)})`,`g`),i=e.split(r),a=new Set(t.map(e=>e.toLowerCase()));return i.map((e,t)=>a.has(e.toLowerCase())?(0,A.jsx)(`mark`,{cla hree boxes`,meaningThai:`เป้าหมายคือต้องระบุป้ายที่ถูกต้องของกล่องทั้ง 3 ใบให้ได้`}],known:[{label:`Given`,value:`All three labels are known to be incorrect`},{label:`Condition`,value:`Only one fruit may be drawn, from only one box`},{label:`Strategy`,value:`Pick from the box labeled 'Mixed' — it cannot truly be mixed`},{label:`Goal`,value:`Correct label for every box`}],category:`logic`},{id:`de3`,question:`In a room of 30 people, everyone shakes hands with everyone else exactly once. If two people refuse to shake hands with each other, how many handshakes take place in total?`,chunks:[{phrase:`In a room of 30 people`,meaningThai:`จำนวนคนทั้งหมดในห้องคือ 30 คน`},{phrase:`everyone shakes hands with everyone else exactly once`,meaningThai:`ปกติทุกคนจับมือกับคนอื่นทุกคนคนละหนึ่งครั้ง (จับมือกันเป็นคู่ๆ)`},{phrase:`If two people refuse to shake hands with each other`,meaningThai:`มีคน 2 คนที่ปฏิเสธไม่จับมือกัน ต้องหักคู่นี้ออกจากคำตอบ`},{phrase:`how many handshakes take place in total`,meaningThai:`โจทย์ถามหาจำนวนการจับมือทั้งหมดที่เกิดขึ้นจริง`}],known:[{label:`Given`,value:`30 people, each pair normally shakes hands once`},{label:`Exception`,value:`One specific pair does not shake hands`},{label:`Goal`,value:`Total number of handshakes`}],category:`logic`},{id:`de4`,question:`A code consists of 4 different digits chosen from 0 to 9, and the first digit cannot be 0. How many such codes are possible?`,chunks:[{phrase:`A code consists of 4 different digits`,meaningThai:`รหัสประกอบด้วยตัวเลข 4 หลัก และห้ามมีตัวเลขซ้ำกัน`},{phrase:`chosen from 0 to 9`,meaningThai:`เลือกตัวเลขจาก 0 ถึง 9`},{phrase:`the first digit cannot be 0`,meaningThai:`หลักแรกของรหัสห้ามเป็นเลข 0`},{phrase:`How many such codes are possible`,meaningThai:`โจทย์ถามหาจำนวนรหัสทั้งหมดที่เป็นไปได้`}],known:[{label:`Given`,value:`4-digit code, digits 0–9, no digit repeats`},{label:`Restriction`,value:`First digit cannot be 0`},{label:`Goal`,value:`Total number of possible codes`}],category:`logic`},{id:`de5`, ,prompt:`In word problems, what does 'altogether' usually signal you should do?`,options:[`Subtract the numbers given`,`Add the numbers together to find a combined total`,`Multiply the numbers given`,`Divide the numbers given`],correctIndex:1,explanation:`'Altogether' is a total-indicating word — it tells you that separate amounts should be combined through addition to reach one overall total.`},{id:`mtq4`,type:`meaning`,category:`logic`,prompt:`What does it mean if a statement is described as 'false'?`,options:[`It is definitely true`,`It does not match reality — it is not true`,`It is partly true and partly untrue`,`It cannot be evaluated at all`],correctIndex:1,explanation:`In logic problems, a statement is either 'true' or 'false' with no in-between; 'false' means the claim being made does not hold.`},{id:`mtq5`,type:`meaning`,category:`measurement`,prompt:`What does 'capacity' refer to when describing a container?`,options:[`The weight of the container itself`,`The amount of liquid or space the container can hold`,`The height of the container`,`The material the container is made from`],correctIndex:1,explanation:`'Capacity' measures how much a container can hold (usually in liters or milliliters), not its size, weight, or material.`},{id:`mtq6`,type:`meaning`,category:`spatial`,prompt:`What does it mean for two shapes to be 'congruent'?`,options:[`They are the same color`,`They are exactly the same size and shape`,`They overlap each other partly`,`They are placed on opposite sides of a line`],correctIndex:1,explanation:`'Congruent' shapes match exactly in both size and shape, so one could be placed perfectly on top of the other — color and position do not matter.`},{id:`mtq7`,type:`meaning`,category:`patterns`,prompt:`What does 'consecutive' mean when describing numbers?`,options:[`Numbers that are all even`,`Numbers that follow one another in order without gaps, like 5, 6, 7`,`Numbers that add up to 100`,`Numbers arranged from largest to smallest`],correctIndex:1,explanation:`'Consecutive' numbers come one immediately after another in counting order, such as 5, 6, 7 — 'consecutive even numbers' would instead skip by 2, like 6, 8, 10.`},{id:`mtq8`,type:`meaning`,category:`instructions`,prompt:`In test instructions, what does 'show your work' require you to do?`,options:[`Erase your answer if it is wrong`,`Write out the steps you used to reach your answer, not just the final answer`,`Skip the question if it seems too hard`,`Ask the teacher for help`],correctIndex:1,explanation:`'Show your work' is an instruction to record your method or calculations, since some tests award partial credit for correct steps even if the final answer is wrong.`},{id:`mtq9`,type:`visual`,category:`geometry`,visualType:`perimeter`,prompt:`A diagram shows a rectangle with all four side lengths labeled and an arrow tracing all the way around its outer boundary. Which concept is being illustrated?`,options:[`The area covered inside the rectangle`,`The total distance traced around all four sides — the perimeter`,`The length of the rectangle's diagonal`,`The number of right angles in the rectangle`],correctIndex:1,explanation:`An arrow tracing the full outer boundary of a shape represents 'perimeter', since perimeter is the total distance walked if you went all the way around the outside edge.`},{id:`mtq10`,type:`visual`,category:`geometry`,visualType:`shadedRegion`,prompt:`A square is drawn with a circle inside it, and the part of the square that is not covered by the circle is colored gray. What does the gray region represent?`,options:[`The overlapping area shared by both shapes`,`The shaded region — the part of the square outside the circle`,`The full area of the circle`,`The perimeter of the square`],correctIndex:1,explanation:`A 'shaded region' is whatever part of a figure is colored in to mark it as the answer area — here, it is the square's area minus the circle's area.`},{id:`mtq11`,type:`visual`,category:`spatial`,visualType:`opposite`,prompt:`On a standard die, the faces showing '2' and '5' never appear next to each other and are never visible at the same time from any single viewing angle. What relationship do these two faces have?`,options:[`Adjacent faces`,`Opposite faces`,`Overlapping faces`,`Vertex faces`],correctIndex:1,explanation:`'Opposite' faces sit on completely different sides of a solid and can never be seen together; on a standard die, opposite faces always add up to 7 (2 and 5 included).`},{id:`mtq12`,type:`visual`,category:`spatial`,visualType:`path`,prompt:`A diagram shows dots connected by grid lines, with one continuous route highlighted from the top-left dot to the bottom-right dot, moving only along the lines. What is being shown?`,options:[`A single shortest path between two points on the grid`,`The total area enclosed by the grid`,`The perimeter of the entire grid`,`The intersection point of two different paths`],correctIndex:0,explanation:`A single highlighted route following the grid lines from one point to another represents a 'path' — one of possibly many ways to travel between the two points.`},{id:`mtq13`,type:`visual`,category:`measurement`,visualType:`angle`,prompt:`A diagram shows two straight lines crossing, with a curved arc drawn in the space between them and a number of degrees labeled inside that arc. What is being measured?`,options:[`The length of the two lines`,`The angle formed between the two lines`,`The area between the lines`,`The perimeter of the shape formed`],correctIndex:1,explanation:`A curved arc between two lines with a degree measurement inside it is the standard way to mark an 'angle' — the amount of turn between the two lines.`},{id:`mtq14`,type:`listening`,category:`numbers`,prompt:`Listen and choose the word you hear.`,spokenWord:`quotient`,options:[`product`,`quotient`,`quota`,`coefficient`],correctIndex:1,explanation:`'Quotient' is the result of division, and it sounds similar to 'quota' — but only 'quotient' names the answer to a division problem.`},{id:`mtq15`,type:`listening`,category:`instructions`,prompt:`Listen and choose the word you hear.`,spokenWord:`circle`,options:[`circle`,`cycle`,`circus`,`cereal`],correctIndex:0,explanation:`'Circle' as an instruction verb means to draw a ring around your chosen answer; it can be confused with the similar-sounding word 'cycle'.`},{id:`mtq16`,type:`listening`,category:`patterns`,prompt:`Listen and choose the word you hear.`,spokenWord:`sequence`,options:[`sequence`,`sentence`,`essence`,`frequency`],correctIndex:0,explanation:`A 'sequence' is an ordered list of numbers or shapes following a rule; it is easily mixed up with the similar-sounding word 'sentence'.`},{id:`mtq17`,type:`listening`,category:`wordProblems`,prompt:`Listen and choose the word you hear.`,spokenWord:`altogether`,options:[`altogether`,`already`,`together`,`all ready`],correctIndex:0,explanation:`'Altogether' (one word) signals a combined total in word problems, and it is often confused with the similar-sounding phrases 'already' or 'together'.`},{id:`mtq18`,type:`listening`,category:`logic`,prompt:`Listen and choose the word you hear.`,spokenWord:`statement`,options:[`statement`,`settlement`,`statue`,`statistic`],correctIndex:0,explanation:`A 'statement' is a claim or sentence that can be judged true or false, which is the foundation of most logic puzzles.`},{id:`mtq19`,type:`sentence`,category:`numbers`,prompt:`What does this sentence mean? 'The product of two numbers is 48, and one of the numbers is 6.'`,options:[`The two numbers add up to 48`,`When the two numbers are multiplied together, the result is 48`,`The difference between the two numbers is 48`,`One number divided by the other equals 48`],correctIndex:1,explanation:`'Product' specifically names the result of multiplication, so this sentence gives a multiplication equation (6 × the other number = 48), not addition or subtraction.`},{id:`mtq20`,type:`sentence`,category:`numbers`,prompt:`What condition does this sentence describe? 'A number is divisible by 4 if its last two digits form a number divisible by 4.'`,options:[`A test to check whether a number can be evenly divided by 4`,`A rule for rounding numbers to the nearest 4`,`A method for finding the remainder after dividing by 4`,`A way to multiply any number by 4`],correctIndex:0,explanation:`'Divisible by' means dividing evenly with no remainder; this sentence states a shortcut test you can use to check that property without doing the full division.`},{id:`mtq21`,type:`sentence`,category:`wordProblems`,prompt:`What does this sentence tell you? 'Anong shared her 40 candies equally among herself and 3 friends.'`,options:[`Each of the 4 people receives an equal share of the 40 candies`,`Anong kept all 40 candies for herself`,`The candies were divided unevenly among the friends`,`Only the 3 friends received candies, not Anong`],correctIndex:0,explanation:`'Shared ... equally among herself and 3 friends' means the group includes Anong, making 4 people total, and 'equally' means each person receives the same amount (10 candies each).`},{id:`mtq22`,type:`sentence`,category:`wordProblems`,prompt:`What does this sentence describe? 'The price of the shirt was reduced by 20%, and it now costs 480 baht.'`,options:[`The shirt's original price before any discount`,`The shirt's price after a 20% discount has already been applied, now 480 baht`,`The shirt costs 20% of 480 baht`,`The shirt's price increased by 20% to reach 480 baht`],correctIndex:1,explanation:`'Reduced by' signals a decrease that has already happened, so 480 baht is the discounted final price, not the original price before the 20% was taken off.`},{id:`mtq23`,type:`sentence`,category:`logic`,prompt:`What does this sentence describe? 'If it rains, then the match will be postponed, but the match was not postponed.'`,options:[`It rained and the match was postponed`,`It did not rain, since the match was not postponed`,`It rained, but the match still happened as planned`,`There is not enough information to conclude anything`],correctIndex:1,explanation:`This follows the logical pattern 'if P then Q, but not Q, therefore not P' — since the match was not postponed (not Q), it must be true that it did not rain (not P).`},{id:`mtq24`,type:`sentence`,category:`measurement`,prompt:`What does this sentence describe? 'The width of the pool is one-half its length, and the length is 30 meters.'`,options:[`The pool's width and length are equal`,`The width is half of the 30-meter length, making it 15 meters`,`The width is 30 meters longer than the length`,`The length is half of the width`],correctIndex:1,explanation:`'One-half its length' defines the width as a fraction of the given length, so the width is calculated as half of 30 meters, or 15 meters.`},{id:`mtq25`,type:`reading`,category:`instructions`,prompt:`Read the passage: 'Read each question carefully before answering. You have 45 minutes to complete this section, and calculators are not permitted.' What is NOT allowed during this test section?`,options:[`Reading the questions carefully`,`Taking more than 45 minutes`,`Using a calculator`,`Answering every question`],correctIndex:2,explanation:`'Calculators are not permitted' directly states the prohibition — the other options either restate what students should do or are unrelated to what is disallowed.`},{id:`mtq26`,type:`reading`,category:`numbers`,prompt:`Read: 'A two-digit number has digits that add up to 9. If the digits are reversed, the new number is 27 more than the original number.' What does 'the digits are reversed' mean here?`,options:[`The number is multiplied by 27`,`The tens digit and ones digit swap places to form a new number`,`The number is split into two separate one-digit numbers`,`Both digits are increased by 27`],correctIndex:1,explanation:`'Reversed' means the order of the two digits is flipped — for example, 36 becomes 63 — creating a new two-digit number that can be compared to the original.`},{id:`mtq27`,type:`reading`,category:`geometry`,prompt:`Read: 'A regular hexagon has all six sides equal in length and all six interior angles equal in measure.' What makes this hexagon 'regular'?`,options:[`It has six sides of any length`,`All of its sides and all of its angles are equal to each other`,`It is shaded a particular color`,`It has exactly one right angle`],correctIndex:1,explanation:`'Regular' in geometry means every side and every angle in the shape is congruent, exactly as stated by 'all six sides equal' and 'all six interior angles equal'.`},{id:`mtq28`,type:`reading`,category:`patterns`,prompt:`Read: 'The pattern begins at 2 and each following term is found by adding the two previous terms together, like 2, 2, 4, 6, 10.' What kind of rule generates this sequence?`,options:[`Each term is double the one before it`,`Each term is the sum of the two terms immediately before it`,`Each term is 2 more than the one before it`,`Each term is found by subtracting the previous term from 10`],correctIndex:1,explanation:`'Adding the two previous terms together' describes a Fibonacci-style rule where each new number depends on the two before it, not a fixed constant difference or a doubling rule.`},{id:`mtq29`,type:`reading`,category:`wordProblems`,prompt:`Read: 'A vendor bought oranges at 5 baht each and sold them at 8 baht each, making a total profit of 150 baht.' What does 'profit' refer to in this passage?`,options:[`The total amount the vendor spent buying oranges`,`The total amount the vendor earned from selling oranges`,`The difference between the selling price and buying price, multiplied by the number sold`,`The price of a single orange`],correctIndex:2,explanation:`'Profit' is the extra money made after costs are covered — here, it is the per-orange gain (8 − 5 = 3 baht) multiplied by the number of oranges sold, totaling 150 baht.`},{id:`mtq30`,type:`reading`,category:`logic`,prompt:`Read: 'Five runners finished a race with no ties. Ben finished before Ann but after Cody. Cody did not finish

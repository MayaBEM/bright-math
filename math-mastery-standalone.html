 (รวมสี่เหลี่ยมใหญ่ด้วย) กี่รูป ในตารางสี่เหลี่ยมจัตุรัสหน่วยขนาด 4×4`,options:[`16`,`20`,`30`,`25`,`36`],hint1:`นับอย่างเป็นระบบตามขนาด: สี่เหลี่ยม 1×1 มีกี่รูป, 2×2 มีกี่รูป ไปเรื่อยๆ`,hint2:`สำหรับสี่เหลี่ยมขนาด k×k ในตาราง 4×4 นับว่าวางในตำแหน่งต่างๆ ได้กี่แบบ`,quickIdea:`จำนวนสี่เหลี่ยมขนาด k×k ที่วางได้ในตาราง n×n คือ (n−k+1)² สำหรับแต่ละขนาด k ตั้งแต่ 1 ถึง n`,steps:[`สี่เหลี่ยม 1×1: (4−1+1)² = 4² = 16`,`สี่เหลี่ยม 2×2: (4−2+1)² = 3² = 9`,`สี่เหลี่ยม 3×3: (4−3+1)² = 2² = 4`,`สี่เหลี่ยม 4×4: (4−4+1)² = 1² = 1`,`รวมทั้งหมด = 16 + 9 + 4 + 1 = 30`],whyOthersFail:`การนับเฉพาะสี่เหลี่ยมหน่วยเล็กที่สุด 16 รูป พลาดสี่เหลี่ยมขนาดใหญ่กว่าทั้งหมด (2×2, 3×3 และตาราง 4×4 เอง)`,competitionTip:`รูปแบบ (n−k+1)² อธิบายว่าทำไมผลรวมของตาราง n×n จึงเป็นผลบวกของจำนวนกำลังสองติดต่อกันเสมอ ใช้ตรวจคำตอบได้`,commonMistake:`หยุดนับหลังจากนับเฉพาะสี่เหลี่ยม 1×1 ลืมนับ 2×2, 3×3 และ 4×4 ด้วย`},correctAnswer:`C`,diagram:{kind:`grid-path`,props:{cols:4,rows:4}},verificationStatus:`verified`},{id:`M2-B-18`,mockSet:2,section:`B`,questionNumber:18,marks:4,difficulty:`competition`,topic:`Angles & Triangles`,subskill:`angle chasing with an exterior angle`,type:`mc`,en:{question:`In triangle XYZ, XY = XZ, and the exterior angle at Z (formed by extending side XZ beyond Z) measures 116°. What is the measure of angle X (the angle at the apex)?`,options:[`44`,`48`,`56`,`64`,`52`],hint1:`An exterior angle and its adjacent interior angle always add up to 180°.`,hint2:`Since XY = XZ, the two base angles Y and Z are equal — use that to find angle X.`,quickIdea:`First convert the exterior angle to its interior angle, then use the isosceles property and the triangle angle sum.`,steps:[`Interior angle at Z = 180° − 116° = 64°.`,`Since XY = XZ, angle Y = angle Z = 64°.`,`Angle X = 180° − 64° − 64° = 52°.`],competitionTip:`Exterior-angle questions almost always start with "180° − exterior angle" to unlock the adjacent interior angle first.`,commonMistake:`Using the exterior angle (116°) directly as one of the triangle’s interior angles.`},th:{question:`ในรูปสามเหลี่ยม XYZ ซึ่ง XY = XZ และมุมภายนอกที่ Z (เกิดจากการต่อด้าน XZ ออกไปเลย Z) มีขนาด 116° มุม X (มุมยอด) มีขนาดเท่าไร`,options:[`44`,`48`,`56`,`64`,`52`],hint1:`มุมภายนอกกับมุมภายในที่ติดกันรวมกันได้ 180° เสมอ`,hint2:`เนื่องจาก XY = XZ มุมฐานทั้งสอง Y และ Z เท่ากัน ใช้สิ่งนี้หามุม X`,quickIdea:`แปลงมุมภายนอกเป็นมุมภายในก่อน แล้วใช้สมบัติหน้าจั่วและผลรวมมุมสามเหลี่ยม`,steps:[`มุมภายในที่ Z = 180° − 116° = 64°`,`เนื่องจาก XY = XZ มุม Y = มุม Z = 64°`,`มุม X = 180° − 64° − 64° = 52°`],competitionTip:`โจทย์มุมภายนอกมักเริ่มด้วย "180° − มุมภายนอก" เพื่อหามุมภายในที่ติดกันก่อนเสมอ`,commonMistake:`ใช้มุมภายนอก (116°) เป็นมุมภายในของสามเหลี่ยมโดยตรง`},correctAnswer:`E`,diagram:{kind:`triangle-exterior`,props:{exteriorAngle:116}},verificationStatus:`verified`},{id:`M2-B-19`,mockSet:2,section:`B`,questionNumber:19,marks:4,difficulty:`competition`,topic:`Number Patterns`,subskill:`linear growth in a geometric figure sequence`,type:`mc`,en:{question:`A pattern of squares is built from matchsticks: 1 square uses 4 matchsticks, 2 squares joined in a row use 7 matchsticks, 3 squares joined in a row use 10 matchsticks, and so on (each new square shares one side with the previous square). How many matchsticks are needed for 15 squares joined in a row?`,options:[`43`,`44`,`46`,`48`,`49`],hint1:`Find how many matchsticks are added each time a new square joins the row.`,hint2:`Write a formula: (matchsticks for 1 square) + (extra per square) × (number of extra squares).`,quickIdea:`For a "start value + constant increase" pattern, write a formula rather than counting term by term.`,steps:[`The first square uses 4; each additional square adds 3 (since one side is shared).`,`Formula for n squares: 4 + 3×(n−1) = 3n + 1.`,`For n = 15: 3×15 + 1 = 45 + 1 = 46.`],competitionTip:`Always test your formula on the given small cases first (n=1 gives 4, n=2 gives 7) before trusting it for a large n.`,commonMistake:`Using 4×15 = 60 (multiplying instead of using the correct "shared side" growth rate), or using 4+3×15 instead of 4+3×(15−1).`},th:{question:`รูปแบบสี่เหลี่ยมจัตุรัสสร้างจากไม้ขีดไฟ: 1 รูปใช้ 4 ก้าน, 2 รูปต่อกันในแถวใช้ 7 ก้าน, 3 รูปต่อกันในแถวใช้ 10 ก้าน ไปเรื่อยๆ (แต่ละรูปใหม่ใช้ด้านร่วมกับรูปก่อนหน้าหนึ่งด้าน) ต้องใช้ไม้ขีดกี่ก้านสำหรับ 15 รูปต่อกันในแถว`,options:[`43`,`44`,`46`,`48`,`49`],hint1:`หาว่าแต่ละครั้งที่เพิ่มรูปใหม่ในแถว ใช้ไม้ขีดเพิ่มกี่ก้าน`,hint2:`เขียนสูตร: (ไม้ขีดสำหรับ 1 รูป) + (ที่เพิ่มต่อรูป) × (จำนวนรูปที่เพิ่ม)`,quickIdea:`สำหรับรูปแบบ "ค่าเริ่มต้น + เพิ่มคงที่" ให้เขียนสูตรแทนการนับทีละพจน์`,steps:[`รูปแรกใช้ 4 ก้าน แต่ละรูปที่เพิ่มใช้เพิ่ม 3 ก้าน (เพราะใช้ด้านร่วมกันหนึ่งด้าน)`,`สูตรสำหรับ n รูป: 4 + 3×(n−1) = 3n + 1`,`เมื่อ n = 15: 3×15 + 1 = 45 + 1 = 46`],competitionTip:`ทดสอบสูตรกับกรณีเล็กที่โจทย์ให้มาก่อนเสมอ (n=1 ได้ 4, n=2 ได้ 7) ก่อนนำไปใช้กับ n ที่ใหญ่`,commonMistake:`ใช้ 4×15 = 60 (คูณแทนที่จะใช้อัตราเพิ่มแบบ "ใช้ด้านร่วม" ที่ถูกต้อง) หรือใช้ 4+3×15 แทน 4+3×(15−1)`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M2-B-20`,mockSet:2,section:`B`,questionNumber:20,marks:4,difficulty:`competition`,topic:`Number Sense`,subskill:`digit sum divisibility rule`,type:`mc`,en:{question:`A 4-digit number has the form 3_45, where the blank is a single missing digit. For the number to be divisible by 9, what digit must go in the blank?`,options:[`3`,`4`,`5`,`6`,`9`],hint1:`A number is divisible by 9 exactly when the sum of its digits is divisible by 9.`,hint2:`Add up the known digits, then find what single digit (0–9) makes the total a multiple of 9.`,quickIdea:`Use the divisibility-by-9 rule: digit sum must be a multiple of 9.`,steps:[`Known digits: 3, _, 4, 5. Their sum (without the blank) = 3+4+5 = 12.`,`Adding the missing digit d: 12 + d must be a multiple of 9.`,`The only digit 0–9 that works is d = 6, since 12+6 = 18, and 18 ÷ 9 = 2.`],competitionTip:`For a missing-digit divisibility question, always find the sum of the KNOWN digits first, then solve for the digit that completes a multiple of the divisor.`,commonMistake:`Forgetting that the missing digit must be a single digit from 0 to 9, and picking a total (like 12+9=21) that isn’t actually a multiple of 9.`},th:{question:`เลขสี่หลักมีรูปแบบ 3_45 โดยช่องว่างเป็นเลขหลักเดียวที่หายไป ถ้าต้องการให้เลขนี้หารด้วย 9 ลงตัว เลขในช่องว่างต้องเป็นอะไร`,options:[`3`,`4`,`5`,`6`,`9`],hint1:`เลขหารด้วย 9 ลงตัวก็ต่อเมื่อผลบวกของหลักทั้งหมดหารด้วย 9 ลงตัว`,hint2:`บวกหลักที่รู้ค่าก่อน แล้วหาว่าเลขหลักเดียว (0–9) ใดทำให้ผลรวมเป็นพหุคูณของ 9`,quickIdea:`ใช้กฎหาร 9 ลงตัว: ผลบวกของหลักต้องเป็นพหุคูณของ 9`,steps:[`หลักที่รู้ค่า: 3, _, 4, 5 ผลรวม (ไม่รวมช่องว่าง) = 3+4+5 = 12`,`บวกเลขที่หายไป d: 12 + d ต้องเป็นพหุคูณของ 9`,`มีเพียง d = 6 เท่านั้นที่ใช้ได้ในช่วง 0–9 เพราะ 12+6 = 18 และ 18 ÷ 9 = 2`],competitionTip:`สำหรับโจทย์หาเลขหลักที่หายไปเพื่อให้หารลงตัว ให้หาผลบวกของหลักที่รู้ค่าก่อนเสมอ แล้วแก้หาหลักที่ทำให้ครบพหุคูณของตัวหาร`,commonMistake:`ลืมว่าหลักที่หายไปต้องเป็นเลขหลักเดียวตั้งแต่ 0 ถึง 9 แล้วเลือกผลรวม (เช่น 12+9=21) ที่ไม่ใช่พหุคูณของ 9 จริงๆ`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M2-C-21`,mockSet:2,section:`C`,questionNumber:21,marks:6,difficulty:`challenge`,topic:`Custom Operations`,subskill:`evaluating and comparing a custom operation`,type:`free-response`,en:{question:`For positive integers a and b, define a ▲ b = a² − b² + a×b. Find the value of (4 ▲ 3) − (3 ▲ 4). (Enter a whole number; it may be negative.)`,hint1:`Compute 4 ▲ 3 and 3 ▲ 4 completely and separately using the definition, then subtract.`,hint2:`Be careful with the order of a and b in each application — swapping them changes the a² − b² part.`,quickIdea:`Translate the symbol into ordinary arithmetic using the definition, substituting very carefully for each order.`,steps:[`4 ▲ 3 = 4² − 3² + 4×3 = 16 − 9 + 12 = 19.`,`3 ▲ 4 = 3² − 4² + 3×4 = 9 − 16 + 12 = 5.`,`(4 ▲ 3) − (3 ▲ 4) = 19 − 5 = 14.`],whyOthersFail:`A useful check: a▲b − b▲a = 2(a²−b²) always, since the a×b term is the same both ways. For a=4,b=3: 2×(16−9) = 2×7 = 14, matching the direct computation.`,competitionTip:`When a custom operation is not symmetric (swapping a and b changes the result), compute both orders completely and separately — never assume they are equal.`,commonMistake:`Assuming a▲b = b▲a because multiplication commutes, forgetting the a²−b² part does not.`},th:{question:`สำหรับจำนวนเต็มบวก a และ b ใดๆ กำหนดให้ a ▲ b = a² − b² + a×b จงหาค่าของ (4 ▲ 3) − (3 ▲ 4) (ตอบเป็นจำนวนเต็ม อาจเป็นลบได้)`,hint1:`คำนวณ 4 ▲ 3 และ 3 ▲ 4 ให้เสร็จสมบูรณ์แยกกันตามนิยาม แล้วค่อยลบ`,hint2:`ระวังลำดับของ a และ b ในแต่ละครั้ง การสลับตำแหน่งเปลี่ยนค่า a² − b²`,quickIdea:`แปลงสัญลักษณ์เป็นเลขคณิตปกติตามนิยาม แทนค่าอย่างระมัดระวังในแต่ละลำดับ`,steps:[`4 ▲ 3 = 4² − 3² + 4×3 = 16 − 9 + 12 = 19`,`3 ▲ 4 = 3² − 4² + 3×4 = 9 − 16 + 12 = 5`,`(4 ▲ 3) − (3 ▲ 4) = 19 − 5 = 14`],whyOthersFail:`ตรวจสอบที่มีประโยชน์: a▲b − b▲a = 2(a²−b²) เสมอ เพราะพจน์ a×b เท่ากันทั้งสองแบบ สำหรับ a=4,b=3: 2×(16−9) = 2×7 = 14 ตรงกับการคำนวณโดยตรง`,competitionTip:`เมื่อการดำเนินการที่คิดขึ้นใหม่ไม่สมมาตร (สลับ a กับ b แล้วผลลัพธ์เปลี่ยน) ให้คำนวณทั้งสองลำดับแยกกันให้ครบ อย่าสมมติว่าเท่ากัน`,commonMistake:`สมมติว่า a▲b = b▲a เพราะการคูณสลับที่ได้ แต่ลืมว่าส่วน a²−b² สลับที่ไม่ได้`},correctAnswer:`14`,acceptedAnswers:[`14`,`14.0`],verificationStatus:`verified`},{id:`M2-C-22`,mockSet:2,section:`C`,questionNumber:22,marks:6,difficulty:`challenge`,topic:`Strategy Games`,subskill:`winning position in a two-move subtraction game`,type:`free-response`,en:{question:`Two players take turns. There is a pile of 24 stones. On each turn, a player must remove either 2 or 5 stones. A player who faces a pile of 0 or 1 stones (and so cannot make either move) loses. If Player A goes first and both play perfectly, how many stones should Player A remove on the first move to guarantee a win — 2 or 5? (Enter 2 or 5.)`,hint1:`Work out, for small pile sizes starting from 0, whether the player about to move wins (W) or loses (L).`,hint2:`A pile size is a Losing position if EVERY move from it leads to a Winning position for the opponent.`,quickIdea:`Build up a W/L table from 0 upward: a position is Losing only if both of its moves lead to Winning positions.`,steps:[`Working up from 0: L-positions (losing for the player to move) occur at 0, 1, 4, 7, 8, 11, 14, 15, 18, 21, 22 — following the pattern "remainder 0, 1, or 4 when divided by 7."`,`24 ÷ 7 = 3 remainder 3, so 24 is a Winning position (not in the losing list).`,`From 24, removing 2 leaves 22 (a Losing position — remainder 1 mod 7) — a good move. Removing 5 leaves 19 (remainder 5 mod 7, a Winning position for the opponent — a bad move).`,`So Player A should remove 2 stones, leaving 22 for the opponent.`],competitionTip:`For a two-move subtraction game, build the W/L table by hand for the first 10–15 positions — the repeating pattern almost always appears quickly.`,commonMistake:`Assuming the position pattern repeats every (2+5)=7 without checking that BOTH moves from each losing position lead to winning positions.`},th:{question:`ผู้เล่นสองคนผลัดกันเดิน มีกองหิน 24 ก้อน แต่ละตาต้องหยิบหิน 2 หรือ 5 ก้อน ผู้เล่นที่เจอกองที่มี 0 หรือ 1 ก้อน (จึงหยิบไม่ได้ทั้งสองแบบ) เป็นผู้แพ้ ถ้า A เริ่มก่อนและทั้งสองเล่นสมบูรณ์แบบ A ควรหยิบกี่ก้อนในตาแรกเพื่อรับประกันชัยชนะ — 2 หรือ 5 (ตอบ 2 หรือ 5)`,hint1:`หาสำหรับกองขนาดเล็กเริ่มจาก 0 ว่าผู้ที่กำลังจะเดินชนะ (W) หรือแพ้ (L)`,hint2:`ขนาดกองเป็นสถานะแพ้ก็ต่อเมื่อทุกการเดินจากกองนั้นนำไปสู่สถานะชนะของคู่ต่อสู้`,quickIdea:`สร้างตาราง W/L จาก 0 ขึ้นไป: สถานะจะแพ้ก็ต่อเมื่อทั้งสองการเดินนำไปสู่สถานะชนะ`,steps:[`ไล่จาก 0 ขึ้นไป: สถานะแพ้ (สำหรับผู้ที่ต้องเดิน) เกิดที่ 0, 1, 4, 7, 8, 11, 14, 15, 18, 21, 22 ตามรูปแบบ "เศษ 0, 1 หรือ 4 เมื่อหารด้วย 7"`,`24 ÷ 7 = 3 เศษ 3 ดังนั้น 24 เป็นสถานะชนะ (ไม่อยู่ในรายการแพ้)`,`จาก 24 หยิบ 2 เหลือ 22 (สถานะแพ้ เศษ1 mod7) เป็นการเดินที่ดี หยิบ 5 เหลือ 19 (เศษ5 mod7 เป็นสถานะชนะของคู่ต่อสู้ เป็นการเดินที่ไม่ดี)`,`ดังนั้น A ควรหยิบ 2 ก้อน เหลือ 22 ให้คู่ต่อสู้`],competitionTip:`สำหรับเกมลบเลขสองแบบ ให้สร้างตาราง W/L ด้วยมือสำหรับ 10-15 ตำแหน่งแรก รูปแบบที่วนซ้ำมักปรากฏเร็ว`,commonMistake:`สมมติว่ารูปแบบวนซ้ำทุก (2+5)=7 โดยไม่ตรวจว่าทั้งสองการเดินจากแต่ละสถานะแพ้นำไปสู่สถานะชนะจริงหรือไม่`},correctAnswer:`2`,acceptedAnswers:[`2`,`2.0`],verificationStatus:`verified`},{id:`M2-C-23`,mockSet:2,section:`C`,questionNumber:23,marks:6,difficulty:`challenge`,topic:`Intersections`,subskill:`maximum intersections of circles and lines`,type:`free-response`,en:{question:`What is the maximum number of intersection points formed by 3 distinct circles and 2 distinct straight lines, all together? (Count circle–circle, circle–line, and line–line intersections. Do not count a curve crossing itself.)`,hint1:`Handle each pair TYPE separately: circle–circle pairs, circle–line pairs, and line–line pairs.`,hint2:`Two distinct circles can cross at most 2 points; a line and a circle can cross at most 2 points; two lines cross at most 1 point.`,quickIdea:`Split into pair types, find the maximum for each type, then add all three totals.`,steps:[`Circle–circle: C(3,2) = 3 pairs, each crossing at most 2 points → 3 × 2 = 6.`,`Circle–line: 3 circles × 2 lines = 6 pairs, each crossing at most 2 points → 6 × 2 = 12.`,`Line–line: C(2,2) = 1 pair, crossing at most 1 point → 1.`,`Maximum total = 6 + 12 + 1 = 19.`],competitionTip:`Always list every pair TYPE before counting (circle-circle, circle-line, line-line) — it is easy to forget one type when there is more than one curve.`,commonMistake:`Forgetting the circle–circle intersections entirely, since there is "only" 3 circles, and undercounting the total.`},th:{question:`จำนวนจุดตัดที่มากที่สุดที่เกิดจากวงกลม 3 วงที่แตกต่างกันและเส้นตรง 2 เส้นที่แตกต่างกัน ทั้งหมดรวมกัน คือเท่าไร (นับจุดตัดวงกลม-วงกลม, วงกลม-เส้น, และเส้น-เส้น ไม่นับเส้นโค้งตัดตัวเอง)`,hint1:`จัดการแต่ละ "ประเภทคู่" แยกกัน: คู่วงกลม-วงกลม, คู่วงกลม-เส้น, และคู่เส้น-เส้น`,hint2:`วงกลมสองวงตัดกันได้มากที่สุด 2 จุด เส้นตรงกับวงกลมตัดกันได้มากที่สุด 2 จุด เส้นตรงสองเส้นตัดกันได้มากที่สุด 1 จุด`,quickIdea:`แบ่งเป็นประเภทคู่ หาค่าสูงสุดของแต่ละประเภท แล้วบวกทั้งสามผลรวม`,steps:[`วงกลม-วงกลม: C(3,2) = 3 คู่ แต่ละคู่ตัดกันได้มากที่สุด 2 จุด → 3 × 2 = 6`,`วงกลม-เส้น: วงกลม 3 × เส้น 2 = 6 คู่ แต่ละคู่ตัดกันได้มากที่สุด 2 จุด → 6 × 2 = 12`,`เส้น-เส้น: C(2,2) = 1 คู่ ตัดกันได้มากที่สุด 1 จุด → 1`,`ผลรวมสูงสุด = 6 + 12 + 1 = 19`],competitionTip:`ให้ลิสต์ทุก "ประเภทคู่" ก่อนนับเสมอ (วงกลม-วงกลม, วงกลม-เส้น, เส้น-เส้น) ง่ายที่จะลืมประเภทใดประเภทหนึ่งเมื่อมีเส้นโค้งมากกว่าหนึ่งชนิด`,commonMistake:`ลืมจุดตัดวงกลม-วงกลมไปเลย เพราะคิดว่ามีวงกลม "แค่" 3 วง ทำให้นับผลรวมต่ำกว่าความเป็นจริง`},correctAnswer:`19`,acceptedAnswers:[`19`,`19.0`],verificationStatus:`verified`},{id:`M2-C-24`,mockSet:2,section:`C`,questionNumber:24,marks:6,difficulty:`challenge`,topic:`Cube & Spatial Reasoning`,subskill:`painted cube: counting pieces with exactly one painted face`,type:`free-response`,en:{question:`A large cube is built from 64 unit cubes arranged in a 4×4×4 arrangement. The outside of the large cube is completely painted, then it is taken apart into the 64 unit cubes. How many unit cubes have paint on EXACTLY ONE face? (Enter a whole number.)`,hint1:`Cubes with exactly one painted face sit in the middle of a FACE of the big cube, away from every edge.`,hint2:`On each face of the big cube, the painted-once cubes form a smaller square with a 1-cube-wide border removed all around.`,quickIdea:`Face-centre cubes (1 face painted) form an (n−2)×(n−2) square on each of the 6 faces.`,steps:[`Each face of the 4×4×4 cube is a 4×4 grid of unit-cube faces.`,`Removing the 1-unit border around the edge of that 4×4 face leaves a (4−2)×(4−2) = 2×2 square of "face-centre" cubes: 4 per face.`,`There are 6 faces: 6 × 4 = 24 cubes with exactly one painted face.`,`Check with all categories: corners 8, edges 12×(4−2)=24, face-centres 24, interior (4−2)³=8. Total 8+24+24+8=64 ✓.`],competitionTip:`For an n×n×n painted cube, the "exactly 1 face" count is always 6×(n−2)² — memorise the four formulas (corners=8, edges=12(n−2), faces=6(n−2)², interior=(n−2)³) as a set.`,commonMistake:`Using the 3×3×3 formula (6×1²=6) without adjusting for n=4, since the "(n−2)" part changes with the cube size.`},th:{question:`ลูกบาศก์ขนาดใหญ่สร้างจากลูกบาศก์เล็ก 64 ก้อน จัดเรียงเป็น 4×4×4 ผิวด้านนอกของลูกบาศก์ใหญ่ถูกทาสีทั้งหมด แล้วแยกออกเป็นลูกบาศก์เล็ก 64 ก้อน มีลูกบาศก์เล็กกี่ก้อนที่มีสีทาอยู่พอดี 1 หน้า (ตอบเป็นจำนวนเต็ม)`,hint1:`ลูกบาศก์ที่มีสีพอดี 1 หน้าอยู่กลาง "หน้า" ของลูกบาศก์ใหญ่ ห่างจากทุกขอบ`,hint2:`บนแต่ละหน้าของลูกบาศก์ใหญ่ ลูกบาศก์ที่ทาสี 1 หน้าจะเป็นสี่เหลี่ยมเล็กที่เหลือหลังตัดขอบกว้าง 1 หน่วยออกรอบด้าน`,quickIdea:`ลูกบาศก์กลางหน้า (สี 1 หน้า) เป็นสี่เหลี่ยมขนาด (n−2)×(n−2) บนแต่ละหน้าจาก 6 หน้า`,steps:[`แต่ละหน้าของลูกบาศก์ 4×4×4 เป็นตาราง 4×4 ของหน้าลูกบาศก์เล็ก`,`ตัดขอบกว้าง 1 หน่วยรอบหน้า 4×4 ออก เหลือสี่เหลี่ยม (4−2)×(4−2) = 2×2 ของลูกบาศก์ "กลางหน้า": 4 ก้อนต่อหน้า`,`มี 6 หน้า: 6 × 4 = 24 ก้อนที่มีสีพอดี 1 หน้า`,`ตรวจกับทุกประเภท: มุม 8, ขอบ 12×(4−2)=24, กลางหน้า 24, ตรงกลาง (4−2)³=8 รวม 8+24+24+8=64 ✓`],competitionTip:`สำหรับลูกบาศก์ทาสี n×n×n จำนวนที่มีสีพอดี 1 หน้าเท่ากับ 6×(n−2)² เสมอ จำสูตรทั้งสี่ไว้เป็นชุด (มุม=8, ขอบ=12(n−2), หน้า=6(n−2)², ตรงกลาง=(n−2)³)`,commonMistake:`ใช้สูตรของลูกบาศก์ 3×3×3 (6×1²=6) โดยไม่ปรับให้ n=4 เพราะส่วน "(n−2)" เปลี่ยนตามขนาดลูกบาศก์`},correctAnswer:`24`,acceptedAnswers:[`24`,`24.0`],verificationStatus:`verified`},{id:`M2-C-25`,mockSet:2,section:`C`,questionNumber:25,marks:6,difficulty:`challenge`,topic:`Word Problems`,subskill:`speed-time-distance system with two conditions`,type:`free-response`,en:{question:`A cyclist rides from town P to town Q at a constant speed. If she had ridden 5 km/h faster, the trip would have taken 2 hours less. If she had ridden 5 km/h slower, the trip would have taken 3 hours more. What is the distance between P and Q, in km? (Enter a whole number.)`,hint1:`Let her actual speed be v km/h and actual time be t hours, so distance d = v×t. Write an equation for each "what if" scenario using the SAME distance d.`,hint2:`Each scenario gives you (v±5)(t∓ the time change) = d. Expand both and use d = vt to simplify.`,quickIdea:`Set up two equations from the two "what if" scenarios (same distance each time), then solve them together.`,steps:[`Faster scenario: (v+5)(t−2) = vt. Expanding: vt − 2v + 5t − 10 = vt, so 5t = 2v + 10.`,`Slower scenario: (v−5)(t+3) = vt. Expanding: vt + 3v − 5t − 15 = vt, so 3v = 5t + 15.`,`Substitute 5t = 2v+10 into 3v = 5t+15: 3v = (2v+10) + 15 = 2v + 25, so v = 25.`,`Then 5t = 2(25)+10 = 60, so t = 12. Distance = v×t = 25 × 12 = 300 km.`],whyOthersFail:`Check: at 30 km/h the trip takes 10 hours (300÷30=10, which is 2 less than 12) ✓. At 20 km/h it takes 15 hours (300÷20=15, which is 3 more than 12) ✓.`,competitionTip:`For "what if speed changed" problems, always keep the distance d = v×t fixed across every scenario — that shared distance is what links your two equations together.`,commonMistake:`Setting up only one equation from one "what if" scenario and guessing the answer, instead of using both conditions together to solve for v and t.`},th:{question:`นักปั่นจักรยานคนหนึ่งปั่นจากเมือง P ไปเมือง Q ด้วยความเร็วคงที่ ถ้าเธอปั่นเร็วขึ้น 5 กม./ชม. การเดินทางจะใช้เวลาน้อยลง 2 ชั่วโมง ถ้าเธอปั่นช้าลง 5 กม./ชม. การเดินทางจะใช้เวลามากขึ้น 3 ชั่วโมง ระยะทางระหว่าง P กับ Q คือกี่กิโลเมตร (ตอบเป็นจำนวนเต็ม)`,hint1:`ให้ความเร็วจริงเป็น v กม./ชม. และเวลาจริงเป็น t ชั่วโมง ดังนั้นระยะทาง d = v×t เขียนสมการสำหรับแต่ละสถานการณ์สมมติโดยใช้ระยะทาง d เดียวกัน`,hint2:`แต่ละสถานการณ์ให้ (v±5)(t∓การเปลี่ยนแปลงเวลา) = d ขยายทั้งสองสมการแล้วใช้ d = vt เพื่อลดรูป`,quickIdea:`ตั้งสองสมการจากสองสถานการณ์สมมติ (ระยะทางเท่ากันทุกครั้ง) แล้วแก้ไปพร้อมกัน`,steps:[`สถานการณ์เร็วขึ้น: (v+5)(t−2) = vt ขยาย: vt − 2v + 5t − 10 = vt ดังนั้น 5t = 2v + 10`,`สถานการณ์ช้าลง: (v−5)(t+3) = vt ขยาย: vt + 3v − 5t − 15 = vt ดังนั้น 3v = 5t + 15`,`แทน 5t = 2v+10 ลงใน 3v = 5t+15: 3v = (2v+10) + 15 = 2v + 25 ดังนั้น v = 25`,`จากนั้น 5t = 2(25)+10 = 60 ดังนั้น t = 12 ระยะทาง = v×t = 25 × 12 = 300 กม.`],whyOthersFail:`ตรวจสอบ: ที่ 30 กม./ชม. ใช้เวลา 10 ชม. (300÷30=10 ซึ่งน้อยกว่า 12 อยู่ 2) ✓ ที่ 20 กม./ชม. ใช้เวลา 15 ชม. (300÷20=15 ซึ่งมากกว่า 12 อยู่ 3) ✓`,competitionTip:`สำหรับโจทย์ "ถ้าความเร็วเปลี่ยน" ให้คงระยะทาง d = v×t เท่ากันทุกสถานการณ์เสมอ ระยะทางที่ใช้ร่วมกันนี้คือตัวเชื่อมสองสมการเข้าด้วยกัน`,commonMistake:`ตั้งสมการจากสถานการณ์สมมติเพียงข้อเดียวแล้วเดาคำตอบ แทนที่จะใช้ทั้งสองเงื่อนไขร่วมกันแก้หา v และ t`},correctAnswer:`300`,acceptedAnswers:[`300`,`300.0`],verificationStatus:`verified`}],Fr={set:2,title:{en:`Mock Test 2`,th:`ข้อสอบจำลองชุดที่ 2`},estimatedMinutes:60},Ir=[{id:`M3-A-01`,mockSet:3,section:`A`,questionNumber:1,marks:3,difficulty:`foundation`,topic:`Number Sense`,subskill:`order of operations`,type:`mc`,en:{question:`A student computes 6 + 4 × 3 − 2 and gets 28 by adding 6 and 4 first. What is the CORRECT value, following the proper order of operations?`,options:[`16`,`28`,`22`,`20`,`14`],hint1:`Multiplication must be done before addition or subtraction, regardless of the order they are written.`,hint2:`Compute 4 × 3 first, then work left to right through the addition and subtraction.`,quickIdea:`Order of operations always does multiplication and division before addition and subtraction.`,steps:[`4 × 3 = 12 first.`,`Then 6 + 12 = 18.`,`Then 18 − 2 = 16.`],whyOthersFail:`Adding 6 + 4 first (getting 10), then multiplying by 3 (30), then subtracting 2 gives the wrong value of 28 — multiplication was applied too late.`,competitionTip:`When a expression mixes operations, mark the multiplication/division parts first before doing anything else.`,commonMistake:`Working strictly left to right instead of applying multiplication before addition.`},th:{question:`นักเรียนคนหนึ่งคำนวณ 6 + 4 × 3 − 2 และได้ 28 โดยบวก 6 กับ 4 ก่อน ค่าที่ถูกต้องตามลำดับการดำเนินการคือเท่าไร`,options:[`16`,`28`,`22`,`20`,`14`],hint1:`ต้องทำการคูณก่อนการบวกหรือลบ ไม่ว่าจะเขียนในลำดับใด`,hint2:`คำนวณ 4 × 3 ก่อน แล้วจึงทำการบวกลบจากซ้ายไปขวา`,quickIdea:`ลำดับการดำเนินการต้องทำการคูณและหารก่อนการบวกและลบเสมอ`,steps:[`4 × 3 = 12 ก่อน`,`จากนั้น 6 + 12 = 18`,`จากนั้น 18 − 2 = 16`],whyOthersFail:`การบวก 6+4 ก่อน (ได้10) แล้วคูณ3 (ได้30) แล้วลบ2 จะได้ค่าผิดคือ 28 เพราะทำการคูณช้าเกินไป`,competitionTip:`เมื่อนิพจน์ผสมการดำเนินการ ให้ทำเครื่องหมายส่วนที่คูณ/หารก่อนทำอย่างอื่น`,commonMistake:`คำนวณจากซ้ายไปขวาตรงๆ แทนที่จะทำการคูณก่อนการบวก`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M3-A-02`,mockSet:3,section:`A`,questionNumber:2,marks:3,difficulty:`foundation`,topic:`Remainders`,subskill:`digit-sum shortcut for mod 9`,type:`mc`,en:{question:`What is the remainder when 457 is divided by 9?`,options:[`5`,`8`,`2`,`7`,`4`],hint1:`There is a shortcut: the remainder when dividing by 9 equals the remainder when you divide the DIGIT SUM by 9.`,hint2:`Add the digits of 457 together first.`,quickIdea:`A number and its digit sum always leave the same remainder when divided by 9.`,steps:[`Digit sum of 457 = 4 + 5 + 7 = 16.`,`16 ÷ 9 = 1 remainder 7.`,`So 457 ÷ 9 also leaves remainder 7.`],whyOthersFail:`Direct check: 9 × 50 = 450, and 457 − 450 = 7, confirming the digit-sum shortcut.`,competitionTip:`The digit-sum shortcut works for remainders mod 9 (and mod 3) — memorise it to skip long division.`,commonMistake:`Applying the digit-sum shortcut but forgetting to reduce the digit sum itself if it is still bigger than 9.`},th:{question:`เศษที่เหลือเมื่อหาร 457 ด้วย 9 คือเท่าไร`,options:[`5`,`8`,`2`,`7`,`4`],hint1:`มีทางลัด: เศษจากการหารด้วย 9 เท่ากับเศษจากการหาร "ผลบวกของหลัก" ด้วย 9`,hint2:`บวกหลักของ 457 เข้าด้วยกันก่อน`,quickIdea:`จำนวนและผลบวกของหลักจะมีเศษเท่ากันเสมอเมื่อหารด้วย 9`,steps:[`ผลบวกหลักของ 457 = 4 + 5 + 7 = 16`,`16 ÷ 9 = 1 เศษ 7`,`ดังนั้น 457 ÷ 9 ก็เหลือเศษ 7 เช่นกัน`],whyOthersFail:`ตรวจสอบตรง: 9 × 50 = 450 และ 457 − 450 = 7 ยืนยันทางลัดผลบวกหลัก`,competitionTip:`ทางลัดผลบวกหลักใช้ได้กับเศษหาร 9 (และหาร 3) จำไว้เพื่อข้ามการหารยาว`,commonMistake:`ใช้ทางลัดผลบวกหลักแต่ลืมลดผลบวกหลักอีกครั้งถ้ายังมากกว่า 9`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M3-A-03`,mockSet:3,section:`A`,questionNumber:3,marks:3,difficulty:`foundation`,topic:`Word Problems`,subskill:`comparison model (difference and total)`,type:`mc`,en:{question:`Box A has some marbles. Box B has 15 more marbles than Box A. Together they have 53 marbles. How many marbles are in Box A?`,options:[`17`,`19`,`21`,`23`,`25`],hint1:`Draw two bars: a bar for Box A, and a longer bar for Box B that is Box A’s bar plus an extra 15-marble piece.`,hint2:`If you removed the extra 15 from Box B, both boxes would be equal — figure out what that equal total would be first.`,quickIdea:`For a "total and difference" problem, subtract the difference, share the rest equally, then adjust.`,steps:[`Total = 53. Extra in Box B = 15.`,`If Box B had 15 fewer, both boxes would be equal: 53 − 15 = 38.`,`Each equal share = 38 ÷ 2 = 19. That is Box A’s amount.`,`Check: Box A = 19, Box B = 19+15 = 34, total = 19+34 = 53. ✓`],competitionTip:`The "total and difference" bar-model trick works for any two-quantity comparison problem — remove the extra, halve, then add back where needed.`,commonMistake:`Dividing the total (53) by 2 directly, ignoring the 15-marble difference.`},th:{question:`กล่อง A มีลูกแก้วอยู่จำนวนหนึ่ง กล่อง B มีลูกแก้วมากกว่ากล่อง A อยู่ 15 เม็ด รวมกันมี 53 เม็ด กล่อง A มีลูกแก้วกี่เม็ด`,options:[`17`,`19`,`21`,`23`,`25`],hint1:`วาดแท่งสองแท่ง: แท่งของกล่อง A และแท่งที่ยาวกว่าของกล่อง B ซึ่งเท่ากับแท่ง A บวกส่วนเกิน 15 เม็ด`,hint2:`ถ้าเอาส่วนเกิน 15 ออกจากกล่อง B ทั้งสองกล่องจะเท่ากัน ลองหาผลรวมที่เท่ากันนั้นก่อน`,quickIdea:`สำหรับโจทย์ "ผลรวมและผลต่าง" ให้ลบผลต่างออก แบ่งที่เหลือเท่าๆ กัน แล้วปรับ`,steps:[`ผลรวม = 53 ส่วนเกินในกล่อง B = 15`,`ถ้ากล่อง B มีน้อยกว่า 15 ทั้งสองกล่องจะเท่ากัน: 53 − 15 = 38`,`แต่ละส่วนที่เท่ากัน = 38 ÷ 2 = 19 นั่นคือจำนวนของกล่อง A`,`ตรวจสอบ: กล่อง A = 19, กล่อง B = 19+15 = 34, รวม = 19+34 = 53 ✓`],competitionTip:`เทคนิคแท่งโมเดล "ผลรวมและผลต่าง" ใช้ได้กับโจทย์เปรียบเทียบสองปริมาณใดๆ ตัดส่วนเกินออก แบ่งครึ่ง แล้วบวกกลับ`,commonMistake:`นำผลรวม (53) หารด้วย 2 ตรงๆ โดยไม่สนใจผลต่าง 15 เม็ด`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M3-A-04`,mockSet:3,section:`A`,questionNumber:4,marks:3,difficulty:`foundation`,topic:`Perimeter`,subskill:`rectangle from a bent wire`,type:`mc`,en:{question:`A piece of wire 48 cm long is bent to form a rectangle whose length is twice its width. What is the width of the rectangle?`,options:[`6`,`8`,`10`,`12`,`16`],hint1:`The whole wire becomes the perimeter of the rectangle.`,hint2:`Write the length in terms of the width, then use the perimeter formula.`,quickIdea:`Half the perimeter equals length + width — combine that with the length–width relationship.`,steps:[`Perimeter = 48, so length + width = 24.`,`Let width = w, so length = 2w.`,`w + 2w = 24 → 3w = 24 → w = 8.`],competitionTip:`Whenever a shape is "bent from a wire" or "made from a string," the total length given is the perimeter.`,commonMistake:`Using 48 directly as length + width instead of first halving it.`},th:{question:`ลวดยาว 48 ซม. ถูกดัดเป็นสี่เหลี่ยมผืนผ้าที่มีความยาวเป็นสองเท่าของความกว้าง ความกว้างของสี่เหลี่ยมผืนผ้าคือเท่าไร`,options:[`6`,`8`,`10`,`12`,`16`],hint1:`ลวดทั้งเส้นกลายเป็นเส้นรอบรูปของสี่เหลี่ยมผืนผ้า`,hint2:`เขียนความยาวในรูปของความกว้าง แล้วใช้สูตรเส้นรอบรูป`,quickIdea:`ครึ่งหนึ่งของเส้นรอบรูปเท่ากับความยาว+ความกว้าง ใช้ร่วมกับความสัมพันธ์ของด้าน`,steps:[`เส้นรอบรูป = 48 ดังนั้นความยาว + ความกว้าง = 24`,`ให้ความกว้าง = w ดังนั้นความยาว = 2w`,`w + 2w = 24 → 3w = 24 → w = 8`],competitionTip:`เมื่อรูปทรง "ดัดจากลวด" หรือ "ทำจากเชือก" ความยาวที่ให้มาคือเส้นรอบรูป`,commonMistake:`ใช้ 48 เป็นความยาว+ความกว้างตรงๆ โดยไม่แบ่งครึ่งก่อน`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M3-A-05`,mockSet:3,section:`A`,questionNumber:5,marks:3,difficulty:`foundation`,topic:`Area`,subskill:`area from a given perimeter`,type:`mc`,en:{question:`A square has a perimeter of 28 cm. What is its area?`,options:[`36`,`42`,`49`,`56`,`64`],hint1:`Find the side length from the perimeter first.`,hint2:`A square has 4 equal sides.`,quickIdea:`Side = perimeter ÷ 4, then area = side².`,steps:[`Side = 28 ÷ 4 = 7 cm.`,`Area = 7 × 7 = 49 cm².`],competitionTip:`Always find the side length first when converting between a square’s perimeter and area — don’t try to skip straight to area.`,commonMistake:`Squaring the perimeter itself (28²) instead of the side length.`},th:{question:`สี่เหลี่ยมจัตุรัสมีเส้นรอบรูป 28 ซม. พื้นที่ของมันคือเท่าไร`,options:[`36`,`42`,`49`,`56`,`64`],hint1:`หาความยาวด้านจากเส้นรอบรูปก่อน`,hint2:`สี่เหลี่ยมจัตุรัสมี 4 ด้านเท่ากัน`,quickIdea:`ด้าน = เส้นรอบรูป ÷ 4 แล้วพื้นที่ = ด้าน²`,steps:[`ด้าน = 28 ÷ 4 = 7 ซม.`,`พื้นที่ = 7 × 7 = 49 ตร.ซม.`],competitionTip:`หาความยาวด้านก่อนเสมอเมื่อแปลงระหว่างเส้นรอบรูปและพื้นที่ของสี่เหลี่ยมจัตุรัส อย่าข้ามไปหาพื้นที่ตรงๆ`,commonMistake:`ยกกำลังสองเส้นรอบรูปเอง (28²) แทนที่จะยกกำลังสองความยาวด้าน`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M3-A-06`,mockSet:3,section:`A`,questionNumber:6,marks:3,difficulty:`foundation`,topic:`Angles & Triangles`,subskill:`angles on a straight line with a ratio`,type:`mc`,en:{question:`Two angles lie on a straight line. One angle is 3 times the other. Find the smaller angle.`,options:[`45`,`30`,`36`,`40`,`60`],hint1:`Angles on a straight line add up to a fixed total.`,hint2:`Let the smaller angle be x, and write the larger one in terms of x.`,quickIdea:`Angles on a straight line sum to 180°.`,steps:[`Let the smaller angle = x, so the larger = 3x.`,`x + 3x = 180° → 4x = 180°.`,`x = 45°.`],competitionTip:`For ratio-based angle problems, add the ratio parts (here 1+3=4) and divide the total by that sum.`,commonMistake:`Dividing 180° by 3 instead of by the sum of the ratio parts (4).`},th:{question:`มุมสองมุมอยู่บนเส้นตรง มุมหนึ่งมีขนาดเป็น 3 เท่าของอีกมุม จงหามุมที่เล็กกว่า`,options:[`45`,`30`,`36`,`40`,`60`],hint1:`มุมบนเส้นตรงรวมกันได้ผลรวมคงที่`,hint2:`ให้มุมที่เล็กกว่าเป็น x แล้วเขียนมุมที่ใหญ่กว่าในรูปของ x`,quickIdea:`มุมบนเส้นตรงรวมกันได้ 180°`,steps:[`ให้มุมเล็ก = x ดังนั้นมุมใหญ่ = 3x`,`x + 3x = 180° → 4x = 180°`,`x = 45°`],competitionTip:`สำหรับโจทย์มุมแบบอัตราส่วน ให้บวกส่วนของอัตราส่วน (ที่นี่ 1+3=4) แล้วนำผลรวมไปหารด้วยผลบวกนั้น`,commonMistake:`นำ 180° ไปหารด้วย 3 แทนที่จะหารด้วยผลบวกของอัตราส่วน (4)`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M3-A-07`,mockSet:3,section:`A`,questionNumber:7,marks:3,difficulty:`foundation`,topic:`Cube & Spatial Reasoning`,subskill:`consistent opposite-face totals`,type:`mc`,en:{question:`A cube has faces numbered 1 to 6, arranged so every pair of opposite faces has the same total. Two pairs are known: (2, 5) and (1, 6). What is that common total (including for the third, unknown pair)?`,options:[`6`,`8`,`9`,`7`,`10`],hint1:`Add up one of the known pairs — every pair must share this same total.`,hint2:`Check your total against the OTHER known pair too, as a confirmation.`,quickIdea:`If every opposite pair shares one common total, any known pair reveals it.`,steps:[`2 + 5 = 7.`,`Check with the other known pair: 1 + 6 = 7. ✓`,`So the common total is 7 (and the remaining pair, 3 and 4, must also add to 7).`],competitionTip:`Once you find the common total from one pair, you can find any missing face by subtracting from that total.`,commonMistake:`Assuming the common total must always be 7 from memory (like a standard die) without checking it against the given pairs.`},th:{question:`ลูกบาศก์มีหน้ากำกับเลข 1 ถึง 6 โดยคู่หน้าตรงข้ามทุกคู่มีผลรวมเท่ากัน สองคู่ที่ทราบคือ (2, 5) และ (1, 6) ผลรวมร่วมนั้นคือเท่าไร (รวมถึงคู่ที่สามที่ยังไม่ทราบด้วย)`,options:[`6`,`8`,`9`,`7`,`10`],hint1:`บวกคู่ที่ทราบคู่หนึ่งดู ทุกคู่ต้องมีผลรวมเท่ากันนี้`,hint2:`ตรวจผลรวมกับอีกคู่ที่ทราบด้วยเพื่อยืนยัน`,quickIdea:`ถ้าทุกคู่ตรงข้ามมีผลรวมร่วมกันหนึ่งค่า คู่ที่ทราบคู่ใดก็เผยค่านั้นได้`,steps:[`2 + 5 = 7`,`ตรวจกับอีกคู่ที่ทราบ: 1 + 6 = 7 ✓`,`ดังนั้นผลรวมร่วมคือ 7 (และคู่ที่เหลือ 3 กับ 4 ก็ต้องรวมกันได้ 7 เช่นกัน)`],competitionTip:`เมื่อหาผลรวมร่วมจากคู่หนึ่งได้แล้ว สามารถหาหน้าที่หายไปได้โดยลบออกจากผลรวมนั้น`,commonMistake:`สมมติว่าผลรวมร่วมต้องเป็น 7 เสมอจากความจำ (เหมือนลูกเต๋ามาตรฐาน) โดยไม่ตรวจกับคู่ที่ให้มา`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M3-A-08`,mockSet:3,section:`A`,questionNumber:8,marks:3,difficulty:`foundation`,topic:`Visual Patterns`,subskill:`growing square-number dot pattern`,type:`mc`,en:{question:`A pattern of dots forms squares: a 1×1 square uses 1 dot, a 2×2 square uses 4 dots, a 3×3 square uses 9 dots, and so on. How many dots are needed for a 6×6 square pattern?`,options:[`25`,`30`,`36`,`42`,`49`],hint1:`Each square pattern uses (side length)² dots.`,hint2:`What is 6 × 6?`,quickIdea:`A square pattern of side n always uses n² dots.`,steps:[`A 6×6 square pattern uses 6² dots.`,`6² = 36.`],competitionTip:`Square-number patterns like this connect directly to the "sum of first n odd numbers = n²" identity — both describe growing squares.`,commonMistake:`Multiplying 6 × 4 (mistaking it for a perimeter-style count) instead of 6 × 6.`},th:{question:`รูปแบบจุดที่เรียงเป็นสี่เหลี่ยมจัตุรัส: สี่เหลี่ยม 1×1 ใช้ 1 จุด, 2×2 ใช้ 4 จุด, 3×3 ใช้ 9 จุด ไปเรื่อยๆ ต้องใช้กี่จุดสำหรับรูปแบบสี่เหลี่ยม 6×6`,options:[`25`,`30`,`36`,`42`,`49`],hint1:`รูปแบบสี่เหลี่ยมแต่ละแบบใช้จุด (ความยาวด้าน)²`,hint2:`6 × 6 เท่ากับเท่าไร`,quickIdea:`รูปแบบสี่เหลี่ยมด้าน n ใช้จุด n² เสมอ`,steps:[`รูปแบบสี่เหลี่ยม 6×6 ใช้จุด 6²`,`6² = 36`],competitionTip:`รูปแบบจำนวนกำลังสองแบบนี้เชื่อมโยงกับเอกลักษณ์ "ผลบวกเลขคี่ n ตัวแรก = n²" โดยตรง ทั้งคู่อธิบายสี่เหลี่ยมที่เติบโต`,commonMistake:`คูณ 6 × 4 (เข้าใจผิดว่าเป็นการนับแบบเส้นรอบรูป) แทนที่จะเป็น 6 × 6`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M3-A-09`,mockSet:3,section:`A`,questionNumber:9,marks:3,difficulty:`foundation`,topic:`Counting Shapes`,subskill:`counting rectangles in a 1-row strip`,type:`mc`,en:{question:`A strip is made of 3 unit squares in a single row. How many rectangles of ALL sizes (including the 3 individual squares) are in the strip?`,options:[`3`,`4`,`5`,`6`,`7`],hint1:`A strip of 3 unit squares has 4 vertical grid lines (including both ends).`,hint2:`Every rectangle in the strip is formed by choosing any 2 of those 4 lines.`,quickIdea:`For a 1-row strip of n squares, count rectangles by choosing 2 of the (n+1) dividing lines.`,steps:[`A strip of 3 squares has 4 vertical lines.`,`Choosing any 2 of the 4 lines makes one rectangle: C(4,2) = 6.`,`So there are 6 rectangles in total (three 1×1, two 1×2, and one 1×3).`],competitionTip:`This "choose 2 lines" idea generalises directly to full grids — a 2D grid uses this method separately for rows and columns, then multiplies.`,commonMistake:`Counting only the 3 individual unit squares and forgetting the larger combined rectangles (1×2 and 1×3).`},th:{question:`แถบหนึ่งประกอบด้วยสี่เหลี่ยมหน่วย 3 รูปเรียงเป็นแถวเดียว มีสี่เหลี่ยมผืนผ้าทุกขนาด (รวมสี่เหลี่ยมเดี่ยว 3 รูป) กี่รูปในแถบนี้`,options:[`3`,`4`,`5`,`6`,`7`],hint1:`แถบสี่เหลี่ยมหน่วย 3 รูปมีเส้นตารางแนวตั้ง 4 เส้น (รวมสองปลาย)`,hint2:`สี่เหลี่ยมผืนผ้าทุกรูปในแถบเกิดจากการเลือก 2 เส้นจาก 4 เส้นนั้น`,quickIdea:`สำหรับแถบแถวเดียวที่มี n สี่เหลี่ยม นับสี่เหลี่ยมผืนผ้าโดยเลือก 2 จาก (n+1) เส้นแบ่ง`,steps:[`แถบ 3 สี่เหลี่ยมมีเส้นแนวตั้ง 4 เส้น`,`การเลือก 2 จาก 4 เส้นใดๆ สร้างสี่เหลี่ยมผืนผ้าหนึ่งรูป: C(4,2) = 6`,`ดังนั้นมีสี่เหลี่ยมผืนผ้าทั้งหมด 6 รูป (1×1 สามรูป, 1×2 สองรูป, และ 1×3 หนึ่งรูป)`],competitionTip:`แนวคิด "เลือก 2 เส้น" นี้ขยายไปยังตารางเต็มรูปแบบได้โดยตรง ตาราง 2 มิติใช้วิธีนี้แยกกันสำหรับแถวและคอลัมน์แล้วคูณกัน`,commonMistake:`นับเฉพาะสี่เหลี่ยมเดี่ยว 3 รูป ลืมสี่เหลี่ยมผืนผ้าขนาดใหญ่ที่รวมกัน (1×2 และ 1×3)`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M3-A-10`,mockSet:3,section:`A`,questionNumber:10,marks:3,difficulty:`foundation`,topic:`Grid Paths`,subskill:`basic shortest-path count`,type:`mc`,en:{question:`On a grid, moving only RIGHT or UP, how many shortest paths are there from (0,0) to (2,3)?`,options:[`6`,`8`,`10`,`12`,`15`],hint1:`You need exactly 2 right-moves and 3 up-moves, in some order.`,hint2:`Choose which of the 5 total moves are the "up" moves.`,quickIdea:`The number of shortest grid paths is a combination: choose the positions of one move type among all moves.`,steps:[`Total moves needed: 2 right + 3 up = 5 moves.`,`Choose 2 of the 5 moves to be "right": C(5,2) = 10.`],competitionTip:`C(5,2) and C(5,3) give the same value — you can choose either the "right" or the "up" positions, whichever is easier to count.`,commonMistake:`Simply adding 2 + 3 = 5 instead of computing the number of arrangements.`},th:{question:`บนตาราง เคลื่อนที่ได้เฉพาะขวาหรือขึ้น มีเส้นทางสั้นที่สุดจาก (0,0) ไป (2,3) กี่เส้นทาง`,options:[`6`,`8`,`10`,`12`,`15`],hint1:`ต้องเดินขวา 2 ครั้งและขึ้น 3 ครั้ง เรียงลำดับใดก็ได้`,hint2:`เลือกว่าใน 5 การเดินทั้งหมด ครั้งไหนเป็น "ขึ้น"`,quickIdea:`จำนวนเส้นทางสั้นที่สุดบนตารางคือค่าคอมบิเนชัน: เลือกตำแหน่งของการเดินแบบหนึ่งท่ามกลางการเดินทั้งหมด`,steps:[`ต้องเดินทั้งหมด: ขวา 2 + ขึ้น 3 = 5 ครั้ง`,`เลือก 2 จาก 5 ครั้งให้เป็น "ขวา": C(5,2) = 10`],competitionTip:`C(5,2) และ C(5,3) ให้ค่าเท่ากัน เลือกนับตำแหน่ง "ขวา" หรือ "ขึ้น" อันไหนง่ายกว่าก็ได้`,commonMistake:`บวก 2 + 3 = 5 ตรงๆ แทนที่จะคำนวณจำนวนการจัดเรียง`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M3-B-11`,mockSet:3,section:`B`,questionNumber:11,marks:4,difficulty:`competition`,topic:`Number Patterns`,subskill:`quadratic sequence rule`,type:`mc`,en:{question:`The sequence 2, 5, 10, 17, 26, ... follows a pattern where each term equals its position squared, plus 1. What is the 8th term?`,options:[`57`,`62`,`65`,`68`,`72`],hint1:`Check the rule on the given terms first: is the 3rd term really 3² + 1?`,hint2:`Once confirmed, substitute position 8 into the rule.`,quickIdea:`Test a suspected rule against every given term before trusting it, then apply it to the new position.`,steps:[`Check the rule termₙ = n² + 1: term1 = 1+1 = 2 ✓, term2 = 4+1 = 5 ✓, term3 = 9+1 = 10 ✓.`,`The rule holds. Apply it to n = 8: term8 = 8² + 1.`,`8² = 64, so term8 = 64 + 1 = 65.`],competitionTip:`When a sequence isn’t simple addition, try "position² plus/minus something" — it is one of the most common competition sequence rules.`,commonMistake:`Continuing the sequence by just adding the differences (3, 5, 7, 9, ...) term by term instead of using a direct formula — this works but is slow and easy to miscount for large positions.`},th:{question:`ลำดับ 2, 5, 10, 17, 26, ... เป็นไปตามกฎที่แต่ละพจน์เท่ากับตำแหน่งยกกำลังสองบวก 1 พจน์ที่ 8 คือเท่าไร`,options:[`57`,`62`,`65`,`68`,`72`],hint1:`ตรวจกฎกับพจน์ที่ให้มาก่อน: พจน์ที่ 3 เท่ากับ 3² + 1 จริงหรือไม่`,hint2:`เมื่อยืนยันแล้ว แทนตำแหน่ง 8 ลงในกฎ`,quickIdea:`ทดสอบกฎที่สงสัยกับทุกพจน์ที่ให้มาก่อนที่จะเชื่อ แล้วนำไปใช้กับตำแหน่งใหม่`,steps:[`ตรวจกฎ พจน์ที่n = n² + 1: พจน์1 = 1+1 = 2 ✓, พจน์2 = 4+1 = 5 ✓, พจน์3 = 9+1 = 10 ✓`,`กฎถูกต้อง นำไปใช้กับ n = 8: พจน์8 = 8² + 1`,`8² = 64 ดังนั้นพจน์8 = 64 + 1 = 65`],competitionTip:`เมื่อลำดับไม่ใช่การบวกธรรมดา ให้ลอง "ตำแหน่ง² บวก/ลบบางอย่าง" เป็นหนึ่งในกฎลำดับที่พบบ่อยที่สุดในการแข่งขัน`,commonMistake:`ไล่ลำดับต่อโดยบวกผลต่าง (3, 5, 7, 9, ...) ทีละพจน์แทนการใช้สูตรโดยตรง วิธีนี้ใช้ได้แต่ช้าและนับผิดง่ายสำหรับตำแหน่งไกลๆ`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M3-B-12`,mockSet:3,section:`B`,questionNumber:12,marks:4,difficulty:`competition`,topic:`Remainders`,subskill:`cyclic pattern for powers modulo a number`,type:`mc`,en:{question:`What is the remainder when 3⁴⁰ is divided by 5?`,options:[`1`,`2`,`3`,`4`,`0`],hint1:`Write out the remainders of 3¹, 3², 3³, 3⁴, 3⁵ when divided by 5 — look for a repeating cycle.`,hint2:`Once you know the cycle length, find where the 40th power lands in that cycle.`,quickIdea:`Remainders of powers repeat in a short cycle — find the cycle length, then use the exponent’s remainder within that cycle.`,steps:[`Remainders of powers of 3 mod 5: 3¹→3, 3²→4, 3³→2, 3⁴→1, 3⁵→3 — the cycle length is 4.`,`40 ÷ 4 = 10 remainder 0, meaning 40 lands exactly on a multiple of the cycle length.`,`A remainder of 0 corresponds to the LAST position in the cycle (3⁴), which is 1.`],competitionTip:`When the exponent divides the cycle length exactly (remainder 0), the answer is the LAST value in the cycle, not the first.`,commonMistake:`Treating remainder 0 as "position 0" and using the first cycle value (3) instead of the last (1).`},th:{question:`เศษที่เหลือเมื่อหาร 3⁴⁰ ด้วย 5 คือเท่าไร`,options:[`1`,`2`,`3`,`4`,`0`],hint1:`เขียนเศษของ 3¹, 3², 3³, 3⁴, 3⁵ เมื่อหารด้วย 5 ออกมา หารูปแบบที่วนซ้ำ`,hint2:`เมื่อรู้ความยาวรอบแล้ว หาว่ากำลัง 40 ตกอยู่ตรงไหนในรอบ`,quickIdea:`เศษของเลขยกกำลังวนซ้ำเป็นรอบสั้นๆ หาความยาวรอบก่อน แล้วใช้เศษของเลขชี้กำลังภายในรอบนั้น`,steps:[`เศษของ 3 ยกกำลัง mod5: 3¹→3, 3²→4, 3³→2, 3⁴→1, 3⁵→3 ความยาวรอบคือ 4`,`40 ÷ 4 = 10 เศษ 0 หมายความว่า 40 ตกที่พหุคูณของความยาวรอบพอดี`,`เศษ 0 ตรงกับตำแหน่งสุดท้ายในรอบ (3⁴) ซึ่งคือ 1`],competitionTip:`เมื่อเลขชี้กำลังหารความยาวรอบลงตัวพอดี (เศษ0) คำตอบคือค่าสุดท้ายในรอบ ไม่ใช่ค่าแรก`,commonMistake:`ถือว่าเศษ0 คือ "ตำแหน่ง0" แล้วใช้ค่าแรกของรอบ (3) แทนที่จะเป็นค่าสุดท้าย (1)`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M3-B-13`,mockSet:3,section:`B`,questionNumber:13,marks:4,difficulty:`competition`,topic:`Word Problems`,subskill:`combined work rate`,type:`mc`,en:{question:`Working alone, Amy can paint a fence in 6 hours. Working alone, Beth can paint the same fence in 3 hours. If they work together, how many hours will it take to paint the fence?`,options:[`1.5`,`2.5`,`3`,`4.5`,`2`],hint1:`Convert each person’s time into a rate: fraction of the fence painted per hour.`,hint2:`Add the two rates together, then find the time from the combined rate.`,quickIdea:`Combine work by adding RATES (fence per hour), never by adding or averaging the times directly.`,steps:[`Amy’s rate = 1/6 fence per hour. Beth’s rate = 1/3 = 2/6 fence per hour.`,`Combined rate = 1/6 + 2/6 = 3/6 = 1/2 fence per hour.`,`Time = 1 ÷ (1/2) = 2 hours.`],competitionTip:`A quick sanity check: working together must always take LESS time than the faster person alone (Beth’s 3 hours) — 2 hours fits.`,commonMistake:`Averaging the two times, (6+3)÷2 = 4.5, instead of combining their rates.`},th:{question:`เอมี่ทาสีรั้วคนเดียวใช้เวลา 6 ชั่วโมง เบธทาสีรั้วเดียวกันคนเดียวใช้เวลา 3 ชั่วโมง ถ้าทั้งสองทำงานร่วมกัน จะใช้เวลากี่ชั่วโมงในการทาสีรั้ว`,options:[`1.5`,`2.5`,`3`,`4.5`,`2`],hint1:`แปลงเวลาของแต่ละคนเป็นอัตรา: สัดส่วนของรั้วที่ทาได้ต่อชั่วโมง`,hint2:`บวกอัตราทั้งสองเข้าด้วยกัน แล้วหาเวลาจากอัตรารวม`,quickIdea:`รวมงานโดยบวก "อัตรา" (รั้วต่อชั่วโมง) ไม่ใช่บวกหรือหาค่าเฉลี่ยของเวลาโดยตรง`,steps:[`อัตราของเอมี่ = 1/6 รั้วต่อชั่วโมง อัตราของเบธ = 1/3 = 2/6 รั้วต่อชั่วโมง`,`อัตรารวม = 1/6 + 2/6 = 3/6 = 1/2 รั้วต่อชั่วโมง`,`เวลา = 1 ÷ (1/2) = 2 ชั่วโมง`],competitionTip:`ตรวจสอบเร็วๆ: การทำงานร่วมกันต้องใช้เวลาน้อยกว่าคนที่เร็วกว่าเสมอ (เบธใช้ 3 ชม.) — 2 ชั่วโมงสมเหตุสมผล`,commonMistake:`หาค่าเฉลี่ยของเวลาทั้งสอง (6+3)÷2 = 4.5 แทนที่จะรวมอัตรา`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M3-B-14`,mockSet:3,section:`B`,questionNumber:14,marks:4,difficulty:`competition`,topic:`Average`,subskill:`weighted average of two groups`,type:`mc`,en:{question:`In a class, the average score of 12 boys is 68, and the average score of 8 girls is 78. What is the average score of the whole class of 20 students?`,options:[`70`,`72`,`71`,`73`,`74`],hint1:`Find the total score for the boys and the total score for the girls separately.`,hint2:`Add both totals, then divide by the total number of students.`,quickIdea:`Convert each group’s average to a total, combine the totals, then divide by the combined count.`,steps:[`Boys’ total = 12 × 68 = 816.`,`Girls’ total = 8 × 78 = 624.`,`Combined total = 816 + 624 = 1440.`,`Class average = 1440 ÷ 20 = 72.`],competitionTip:`The combined average is always closer to the average of the LARGER group — here it lands closer to 68 (boys, the bigger group) than to 78.`,commonMistake:`Averaging 68 and 78 directly, (68+78)÷2 = 73, ignoring that the group sizes are different.`},th:{question:`ในชั้นเรียน คะแนนเฉลี่ยของเด็กชาย 12 คนคือ 68 และคะแนนเฉลี่ยของเด็กหญิง 8 คนคือ 78 คะแนนเฉลี่ยของทั้งชั้น 20 คนคือเท่าไร`,options:[`70`,`72`,`71`,`73`,`74`],hint1:`หาผลรวมคะแนนของเด็กชายและเด็กหญิงแยกกันก่อน`,hint2:`บวกผลรวมทั้งสอง แล้วหารด้วยจำนวนนักเรียนทั้งหมด`,quickIdea:`แปลงค่าเฉลี่ยของแต่ละกลุ่มเป็นผลรวม รวมผลรวมเข้าด้วยกัน แล้วหารด้วยจำนวนรวม`,steps:[`ผลรวมเด็กชาย = 12 × 68 = 816`,`ผลรวมเด็กหญิง = 8 × 78 = 624`,`ผลรวมรวม = 816 + 624 = 1440`,`ค่าเฉลี่ยของชั้น = 1440 ÷ 20 = 72`],competitionTip:`ค่าเฉลี่ยรวมจะอยู่ใกล้ค่าเฉลี่ยของกลุ่มที่ "ใหญ่กว่า" เสมอ ที่นี่ใกล้ 68 (เด็กชาย กลุ่มใหญ่กว่า) มากกว่า 78`,commonMistake:`หาค่าเฉลี่ยของ 68 กับ 78 ตรงๆ (68+78)÷2 = 73 โดยไม่สนใจว่าขนาดกลุ่มต่างกัน`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M3-B-15`,mockSet:3,section:`B`,questionNumber:15,marks:4,difficulty:`competition`,topic:`Speed, Distance & Time`,subskill:`average speed for a round trip (not a simple average)`,type:`mc`,en:{question:`A car travels from Town A to Town B at 60 km/h, and returns the same distance from B to A at 40 km/h. What is the car’s AVERAGE SPEED for the whole round trip?`,options:[`50`,`45`,`48`,`52`,`55`],hint1:`Average speed is NOT the simple average of the two speeds — it is total distance ÷ total time.`,hint2:`Pick a convenient one-way distance (like 120 km) to make the arithmetic easy, then compute total distance and total time.`,quickIdea:`Average speed = total distance ÷ total time, always — never average the speeds directly when the times differ.`,steps:[`Let the one-way distance be 120 km (chosen to divide evenly by both speeds).`,`Time there = 120 ÷ 60 = 2 hours. Time back = 120 ÷ 40 = 3 hours. Total time = 5 hours.`,`Total distance = 120 + 120 = 240 km.`,`Average speed = 240 ÷ 5 = 48 km/h.`],whyOthersFail:`Simply averaging (60+40)÷2 = 50 ignores that the car spends MORE time travelling at the slower speed, which pulls the true average down.`,competitionTip:`For a same-distance round trip, average speed equals the "harmonic mean" of the two speeds: 2ab/(a+b) — here 2×60×40/100 = 48.`,commonMistake:`Computing the simple average of the two speeds, (60+40)÷2 = 50, instead of using total distance ÷ total time.`},th:{question:`รถยนต์เดินทางจากเมือง A ไปเมือง B ด้วยความเร็ว 60 กม./ชม. และเดินทางกลับระยะทางเท่าเดิมจาก B ไป A ด้วยความเร็ว 40 กม./ชม. ความเร็วเฉลี่ยของรถตลอดการเดินทางไป-กลับคือเท่าไร`,options:[`50`,`45`,`48`,`52`,`55`],hint1:`ความเร็วเฉลี่ยไม่ใช่ค่าเฉลี่ยธรรมดาของความเร็วทั้งสอง แต่คือระยะทางรวม ÷ เวลารวม`,hint2:`เลือกระยะทางเที่ยวเดียวที่สะดวก (เช่น 120 กม.) เพื่อให้คำนวณง่าย แล้วหาระยะทางรวมและเวลารวม`,quickIdea:`ความเร็วเฉลี่ย = ระยะทางรวม ÷ เวลารวม เสมอ อย่าหาค่าเฉลี่ยความเร็วตรงๆ เมื่อเวลาต่างกัน`,steps:[`ให้ระยะทางเที่ยวเดียวเป็น 120 กม. (เลือกให้หารลงตัวทั้งสองความเร็ว)`,`เวลาขาไป = 120 ÷ 60 = 2 ชม. เวลาขากลับ = 120 ÷ 40 = 3 ชม. เวลารวม = 5 ชม.`,`ระยะทางรวม = 120 + 120 = 240 กม.`,`ความเร็วเฉลี่ย = 240 ÷ 5 = 48 กม./ชม.`],whyOthersFail:`การหาค่าเฉลี่ยธรรมดา (60+40)÷2 = 50 ไม่คำนึงว่ารถใช้เวลานานกว่าตอนความเร็วช้า ซึ่งดึงค่าเฉลี่ยจริงให้ต่ำลง`,competitionTip:`สำหรับการเดินทางไป-กลับระยะทางเท่ากัน ความเร็วเฉลี่ยเท่ากับ "ค่าเฉลี่ยฮาร์มอนิก" ของสองความเร็ว: 2ab/(a+b) ที่นี่คือ 2×60×40/100 = 48`,commonMistake:`คำนวณค่าเฉลี่ยธรรมดาของความเร็วทั้งสอง (60+40)÷2 = 50 แทนที่จะใช้ระยะทางรวม ÷ เวลารวม`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M3-B-16`,mockSet:3,section:`B`,questionNumber:16,marks:4,difficulty:`competition`,topic:`Perimeter`,subskill:`perimeter of a path surrounding a garden`,type:`mc`,en:{question:`A rectangular garden measuring 15 m by 9 m is surrounded by a path 1 m wide on the outside. What is the perimeter of the OUTER edge of the path?`,options:[`48`,`52`,`56`,`60`,`64`],hint1:`The path adds 1 m to EACH side of the garden, so it adds 2 m to both the length and the width.`,hint2:`Find the outer length and outer width first, then use the perimeter formula.`,quickIdea:`A border of width w around a rectangle adds 2w to both the length and the width.`,steps:[`Outer length = 15 + 1 + 1 = 17 m.`,`Outer width = 9 + 1 + 1 = 11 m.`,`Perimeter = 2 × (17 + 11) = 2 × 28 = 56 m.`],competitionTip:`A border always adds TWICE its width to each dimension, since it wraps around both sides.`,commonMistake:`Adding only 1 m (not 2 m) to each dimension, forgetting the path exists on both sides of the garden.`},th:{question:`สวนสี่เหลี่ยมผืนผ้าขนาด 15 ม. × 9 ม. ล้อมรอบด้วยทางเดินกว้าง 1 ม. ด้านนอก เส้นรอบรูปของขอบนอกทางเดินคือเท่าไร`,options:[`48`,`52`,`56`,`60`,`64`],hint1:`ทางเดินเพิ่ม 1 ม. ให้แต่ละด้านของสวน ดังนั้นเพิ่ม 2 ม. ทั้งความยาวและความกว้าง`,hint2:`หาความยาวและความกว้างด้านนอกก่อน แล้วใช้สูตรเส้นรอบรูป`,quickIdea:`ขอบกว้าง w รอบสี่เหลี่ยมผืนผ้าเพิ่ม 2w ให้ทั้งความยาวและความกว้าง`,steps:[`ความยาวด้านนอก = 15 + 1 + 1 = 17 ม.`,`ความกว้างด้านนอก = 9 + 1 + 1 = 11 ม.`,`เส้นรอบรูป = 2 × (17 + 11) = 2 × 28 = 56 ม.`],competitionTip:`ขอบเพิ่มสองเท่าของความกว้างขอบให้แต่ละมิติเสมอ เพราะล้อมรอบทั้งสองด้าน`,commonMistake:`เพิ่มเพียง 1 ม. (ไม่ใช่ 2 ม.) ให้แต่ละมิติ ลืมว่าทางเดินอยู่ทั้งสองด้านของสวน`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M3-B-17`,mockSet:3,section:`B`,questionNumber:17,marks:4,difficulty:`competition`,topic:`Area`,subskill:`area by subtraction with two triangular cuts`,type:`mc`,en:{question:`A square of side 10 cm has two identical right-triangles cut from two opposite corners, each triangle having legs 3 cm and 4 cm. What is the area of the remaining shape?`,options:[`88`,`82`,`85`,`91`,`94`],hint1:`Find the area of the whole square, and the area of ONE triangle, first.`,hint2:`Since two identical triangles are removed, subtract twice the single-triangle area.`,quickIdea:`Remaining area = whole shape − (number of removed pieces × area of one piece).`,steps:[`Square area = 10 × 10 = 100 cm².`,`One triangle’s area = ½ × 3 × 4 = 6 cm².`,`Two triangles removed = 2 × 6 = 12 cm².`,`Remaining area = 100 − 12 = 88 cm².`],competitionTip:`When identical pieces are removed more than once, multiply the single-piece area by the count before subtracting — don’t subtract one at a time and risk losing track.`,commonMistake:`Subtracting only one triangle’s area (100 − 6 = 94) and forgetting the second identical cut.`},th:{question:`สี่เหลี่ยมจัตุรัสด้าน 10 ซม. ถูกตัดสามเหลี่ยมมุมฉากที่เหมือนกันสองรูปออกจากมุมตรงข้ามสองมุม แต่ละรูปมีด้านประกอบมุมฉาก 3 ซม. และ 4 ซม. พื้นที่ของรูปที่เหลือคือเท่าไร`,options:[`88`,`82`,`85`,`91`,`94`],hint1:`หาพื้นที่สี่เหลี่ยมทั้งหมดและพื้นที่สามเหลี่ยมหนึ่งรูปก่อน`,hint2:`เนื่องจากตัดสามเหลี่ยมเหมือนกันสองรูปออก ให้ลบสองเท่าของพื้นที่สามเหลี่ยมหนึ่งรูป`,quickIdea:`พื้นที่ที่เหลือ = รูปทั้งหมด − (จำนวนชิ้นที่ตัดออก × พื้นที่หนึ่งชิ้น)`,steps:[`พื้นที่สี่เหลี่ยม = 10 × 10 = 100 ตร.ซม.`,`พื้นที่สามเหลี่ยมหนึ่งรูป = ½ × 3 × 4 = 6 ตร.ซม.`,`สามเหลี่ยมสองรูปที่ตัดออก = 2 × 6 = 12 ตร.ซม.`,`พื้นที่ที่เหลือ = 100 − 12 = 88 ตร.ซม.`],competitionTip:`เมื่อชิ้นส่วนที่เหมือนกันถูกตัดออกมากกว่าหนึ่งครั้ง ให้คูณพื้นที่หนึ่งชิ้นด้วยจำนวนก่อนลบ อย่าลบทีละชิ้นเพราะอาจนับตกหล่น`,commonMistake:`ลบพื้นที่สามเหลี่ยมเพียงรูปเดียว (100 − 6 = 94) ลืมการตัดรูปที่สองที่เหมือนกัน`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M3-B-18`,mockSet:3,section:`B`,questionNumber:18,marks:4,difficulty:`competition`,topic:`Angles & Triangles`,subskill:`co-interior angles with parallel lines`,type:`mc`,en:{question:`Lines PQ and RS are parallel. A transversal crosses both lines, making an angle of 118° where it crosses PQ. Find the CO-INTERIOR (same-side interior) angle where the transversal crosses RS.`,options:[`118`,`62`,`72`,`108`,`52`],hint1:`Co-interior angles are on the SAME side of the transversal, between the two parallel lines.`,hint2:`Co-interior angles add up to a fixed total when lines are parallel — recall which total that is.`,quickIdea:`Co-interior (same-side interior) angles between parallel lines always sum to 180°.`,steps:[`Co-interior angles sum to 180°.`,`180° − 118° = 62°.`],whyOthersFail:`Confusing co-interior angles (which sum to 180°) with alternate interior angles (which are simply equal) leads to answering 118° instead.`,competitionTip:`For parallel-line angle questions, know all three rules: alternate angles are EQUAL, corresponding angles are EQUAL, and co-interior angles sum to 180°.`,commonMistake:`Treating the co-interior angle as equal to 118° (that rule applies to alternate or corresponding angles, not co-interior ones).`},th:{question:`เส้น PQ และ RS ขนานกัน เส้นตัดผ่านทั้งสองเส้น ทำมุม 118° ที่ตัดกับ PQ จงหามุมภายในด้านเดียวกัน (co-interior) ที่ตัดกับ RS`,options:[`118`,`62`,`72`,`108`,`52`],hint1:`มุมภายในด้านเดียวกันอยู่ด้านเดียวกันของเส้นตัด ระหว่างเส้นขนานทั้งสอง`,hint2:`มุมภายในด้านเดียวกันรวมกันได้ผลรวมคงที่เมื่อเส้นขนานกัน จำผลรวมนั้นให้ได้`,quickIdea:`มุมภายในด้านเดียวกันระหว่างเส้นขนานรวมกันได้ 180° เสมอ`,steps:[`มุมภายในด้านเดียวกันรวมกันได้ 180°`,`180° − 118° = 62°`],whyOthersFail:`การสับสนระหว่างมุมภายในด้านเดียวกัน (รวมกัน180°) กับมุมแย้ง (เท่ากันตรงๆ) ทำให้ตอบ 118° ผิดพลาด`,competitionTip:`สำหรับโจทย์มุมเส้นขนาน จำทั้งสามกฎ: มุมแย้งเท่ากัน มุมสมนัยเท่ากัน และมุมภายในด้านเดียวกันรวมกันได้ 180°`,commonMistake:`ถือว่ามุมภายในด้านเดียวกันเท่ากับ 118° (กฎนั้นใช้กับมุมแย้งหรือมุมสมนัย ไม่ใช่มุมภายในด้านเดียวกัน)`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M3-B-19`,mockSet:3,section:`B`,questionNumber:19,marks:4,difficulty:`competition`,topic:`Cube & Spatial Reasoning`,subskill:`painted cuboid with a thin dimension (no interior cubes)`,type:`mc`,en:{question:`A rectangular block is built from unit cubes in a 4×3×2 arrangement (24 unit cubes total). The outside is completely painted, then it is taken apart. How many unit cubes have NO paint on them at all (completely unpainted)?`,options:[`0`,`2`,`4`,`6`,`8`],hint1:`A fully unpainted cube must be surrounded on ALL sides by other cubes in every direction.`,hint2:`Look carefully at the height of the block — is it tall enough for any cube to be "buried" in the middle?`,quickIdea:`A cube is unpainted only if it is at least one layer away from every outer face — check whether that is even possible in each direction.`,steps:[`The block’s height is only 2 cubes. In a stack of height 2, every cube touches either the top face or the bottom face.`,`Since every cube touches an outer face in the height direction, NOT ONE cube can be fully buried inside.`,`So the number of completely unpainted cubes is 0.`],whyOthersFail:`Using the general formula (a−2)(b−2)(c−2) gives (4−2)(3−2)(2−2) = 2×1×0 = 0 — the zero comes from the height being only 2, confirming the answer without needing to check every cube by hand.`,competitionTip:`Before counting, check whether EVERY dimension is at least 3 — if any dimension is 1 or 2, there can be no fully interior (unpainted) cubes at all.`,commonMistake:`Assuming a painted block always has some unpainted interior cubes, without checking whether the block is thin enough to rule that out.`},th:{question:`บล็อกสี่เหลี่ยมสร้างจากลูกบาศก์หน่วยจัดเรียงเป็น 4×3×2 (รวม 24 ก้อน) ผิวด้านนอกถูกทาสีทั้งหมด แล้วแยกออกจากกัน มีลูกบาศก์กี่ก้อนที่ไม่มีสีทาเลย (ไม่ถูกทาสีเลยแม้แต่หน้าเดียว)`,options:[`0`,`2`,`4`,`6`,`8`],hint1:`ลูกบาศก์ที่ไม่ถูกทาสีเลยต้องถูกล้อมรอบด้วยลูกบาศก์อื่นทุกด้านทุกทิศทาง`,hint2:`สังเกตความสูงของบล็อกให้ดี สูงพอที่จะมีลูกบาศก์ "ถูกฝัง" อยู่กลางหรือไม่`,quickIdea:`ลูกบาศก์จะไม่ถูกทาสีก็ต่อเมื่ออยู่ห่างจากทุกหน้านอกอย่างน้อยหนึ่งชั้น ตรวจว่าเป็นไปได้หรือไม่ในแต่ละทิศทาง`,steps:[`ความสูงของบล็อกมีเพียง 2 ก้อน ในกองสูง 2 ก้อน ทุกก้อนสัมผัสหน้าบนหรือหน้าล่างเสมอ`,`เนื่องจากทุกก้อนสัมผัสหน้านอกในทิศทางความสูง จึงไม่มีก้อนใดถูกฝังอยู่ข้างในได้เลย`,`ดังนั้นจำนวนลูกบาศก์ที่ไม่ถูกทาสีเลยคือ 0`],whyOthersFail:`การใช้สูตรทั่วไป (a−2)(b−2)(c−2) ให้ (4−2)(3−2)(2−2) = 2×1×0 = 0 ค่าศูนย์มาจากความสูงที่มีเพียง 2 ยืนยันคำตอบโดยไม่ต้องตรวจทีละก้อน`,competitionTip:`ก่อนนับ ตรวจว่าทุกมิติมีค่าอย่างน้อย 3 หรือไม่ ถ้ามิติใดเป็น 1 หรือ 2 จะไม่มีลูกบาศก์ที่ไม่ถูกทาสีอยู่ข้างในเลย`,commonMistake:`สมมติว่าบล็อกที่ทาสีต้องมีลูกบาศก์ข้างในที่ไม่ถูกทาสีเสมอ โดยไม่ตรวจว่าบล็อกบางพอที่จะตัดความเป็นไปได้นั้นออกหรือไม่`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M3-B-20`,mockSet:3,section:`B`,questionNumber:20,marks:4,difficulty:`competition`,topic:`Logic & Elimination`,subskill:`seating deduction puzzle`,type:`mc`,en:{question:`Five friends — Ann, Ben, Cal, Dee, and Eve — sit in a row of 5 seats numbered 1 to 5 from left to right. Cal sits in the middle seat (seat 3). Eve sits in seat 1, and Dee sits immediately to the right of Eve. Ann sits somewhere to the left of Ben. In which seat does Ben sit?`,options:[`Seat 2`,`Seat 3`,`Seat 5`,`Seat 4`,`Seat 1`],hint1:`Place the friends with fixed positions first: Cal and Eve.`,hint2:`"Immediately to the right of Eve" pins down exactly one more seat — see which seats are left for Ann and Ben.`,quickIdea:`Fill in every directly-stated position first, then use the remaining clues to place what is left.`,steps:[`Cal is in seat 3. Eve is in seat 1.`,`Dee sits immediately to the right of Eve (seat 1), so Dee is in seat 2.`,`Remaining seats 4 and 5 belong to Ann and Ben. Since Ann sits to the left of Ben, Ann is in seat 4 and Ben is in seat 5.`],competitionTip:`In seating-logic puzzles, place every friend with an EXACT given position first — this shrinks the puzzle to only the friends left over.`,commonMistake:`Trying to place Ann and Ben before fully working out Cal, Eve, and Dee’s fixed positions, leading to guesswork instead of certainty.`},th:{question:`เพื่อนห้าคน — แอน, เบน, แคล, ดี, และอีฟ — นั่งเรียงกันในที่นั่ง 5 ที่ หมายเลข 1 ถึง 5 จากซ้ายไปขวา แคลนั่งที่นั่งกลาง (ที่นั่ง 3) อีฟนั่งที่นั่ง 1 และดีนั่งถัดจากอีฟไปทางขวาทันที แอนนั่งอยู่ทางซ้ายของเบนที่ใดที่หนึ่ง เบนนั่งที่นั่งใด`,options:[`ที่นั่ง 2`,`ที่นั่ง 3`,`ที่นั่ง 5`,`ที่นั่ง 4`,`ที่นั่ง 1`],hint1:`จัดตำแหน่งที่แน่นอนก่อน: แคลและอีฟ`,hint2:`"ถัดจากอีฟไปทางขวาทันที" กำหนดอีกที่นั่งหนึ่งแน่นอน ดูว่าที่นั่งใดเหลือสำหรับแอนและเบน`,quickIdea:`กรอกตำแหน่งที่ระบุแน่นอนทุกตำแหน่งก่อน แล้วใช้เงื่อนไขที่เหลือจัดตำแหน่งที่เหลือ`,steps:[`แคลอยู่ที่นั่ง 3 อีฟอยู่ที่นั่ง 1`,`ดีนั่งถัดจากอีฟ (ที่นั่ง1) ไปทางขวาทันที ดังนั้นดีอยู่ที่นั่ง 2`,`ที่นั่ง 4 และ 5 ที่เหลือเป็นของแอนและเบน เนื่องจากแอนนั่งทางซ้ายของเบน แอนจึงอยู่ที่นั่ง 4 และเบนอยู่ที่นั่ง 5`],competitionTip:`ในปริศนาตรรกะการนั่ง ให้จัดตำแหน่งที่ระบุแน่ชัดของทุกคนก่อน วิธีนี้ลดปริศนาให้เหลือเฉพาะคนที่ยังไม่ได้จัด`,commonMistake:`พยายามจัดตำแหน่งแอนและเบนก่อนที่จะหาตำแหน่งแน่นอนของแคล อีฟ และดีให้ครบ ทำให้ต้องเดาแทนที่จะแน่ใจ`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M3-C-21`,mockSet:3,section:`C`,questionNumber:21,marks:6,difficulty:`challenge`,topic:`Custom Operations`,subskill:`nested custom operation with a squared term`,type:`free-response`,en:{question:`For any two whole numbers a and b, define a ♦ b = 2a + b² − 1. Find the value of (2 ♦ 3) ♦ 1. (Enter a whole number.)`,hint1:`Compute the inner operation, 2 ♦ 3, completely first.`,hint2:`Use that result as the "a" value in the outer operation, with b = 1.`,quickIdea:`Work from the innermost brackets outward, substituting into the definition exactly as given each time.`,steps:[`2 ♦ 3 = 2×2 + 3² − 1 = 4 + 9 − 1 = 12.`,`Now compute 12 ♦ 1 = 2×12 + 1² − 1 = 24 + 1 − 1 = 24.`],whyOthersFail:`Note the definition is NOT symmetric (a and b play different roles: a is doubled, b is squared) — always keep track of which number is in the "a" position and which is in "b".`,competitionTip:`When a definition treats a and b differently (like here), write out the substitution in full each time rather than trying to shortcut it.`,commonMistake:`Swapping which value is squared, e.g. computing 2² + 2×3 − 1 instead of 2×2 + 3² − 1.`},th:{question:`สำหรับจำนวนเต็มสองจำนวน a และ b ใดๆ กำหนดให้ a ♦ b = 2a + b² − 1 จงหาค่าของ (2 ♦ 3) ♦ 1 (ตอบเป็นจำนวนเต็ม)`,hint1:`คำนวณการดำเนินการด้านในก่อนให้เสร็จสมบูรณ์ คือ 2 ♦ 3`,hint2:`นำผลลัพธ์นั้นไปใช้เป็นค่า "a" ในการดำเนินการด้านนอก โดย b = 1`,quickIdea:`ทำงานจากวงเล็บในสุดออกไปด้านนอก แทนค่าตามนิยามที่กำหนดให้ทุกครั้ง`,steps:[`2 ♦ 3 = 2×2 + 3² − 1 = 4 + 9 − 1 = 12`,`จากนั้นคำนวณ 12 ♦ 1 = 2×12 + 1² − 1 = 24 + 1 − 1 = 24`],whyOthersFail:`สังเกตว่านิยามนี้ไม่สมมาตร (a และ b มีบทบาทต่างกัน: a ถูกคูณสอง ส่วน b ถูกยกกำลังสอง) ต้องติดตามเสมอว่าตัวใดอยู่ตำแหน่ง "a" และตัวใดอยู่ "b"`,competitionTip:`เมื่อนิยามปฏิบัติต่อ a และ b ต่างกัน (เหมือนที่นี่) ให้เขียนการแทนค่าอย่างครบถ้วนทุกครั้งแทนการลัดขั้นตอน`,commonMistake:`สลับตัวที่ถูกยกกำลังสอง เช่นคำนวณ 2² + 2×3 − 1 แทนที่จะเป็น 2×2 + 3² − 1`},correctAnswer:`24`,acceptedAnswers:[`24`,`24.0`],verificationStatus:`verified`},{id:`M3-C-22`,mockSet:3,section:`C`,questionNumber:22,marks:6,difficulty:`challenge`,topic:`Strategy Games`,subskill:`winning move in a two-move subtraction game`,type:`free-response`,en:{question:`In a game, players alternately remove either 1 or 4 stones from a pile of 29 stones. The player who takes the last stone wins. If Player A goes first and both play perfectly, how many stones should Player A remove on the first turn to guarantee a win — 1 or 4? (Enter 1 or 4.)`,hint1:`Build a table of Win/Lose for small pile sizes first, starting from 0 stones.`,hint2:`Look for the repeating pattern in the losing positions once you have the first 10-12 values.`,quickIdea:`Work out Win/Lose for small piles by hand, find the repeating pattern, then apply it to 29.`,steps:[`Building the table from 0 upward (L = losing for the player to move): L-positions occur at 0, 2, 5, 7, 10, 12, 15, 17, 20, 22, 25, 27, ... — a pattern of "remainder 0 or 2 when divided by 5."`,`29 ÷ 5 = 5 remainder 4, so 29 is NOT a losing position (it is a Winning position for Player A) — good, a winning first move exists.`,`From 29, removing 1 leaves 28 (28 ÷ 5 remainder 3 — a Winning position for the opponent, a bad move). Removing 4 leaves 25 (25 ÷ 5 remainder 0 — a Losing position for the opponent).`,`So Player A should remove 4 stones, leaving 25 for the opponent.`],competitionTip:`For a subtraction game with moves {1, 4}, the losing positions repeat with period 5 (since 1+4=5) — but always verify the exact residues by building the table, don’t assume.`,commonMistake:`Assuming the losing positions are simply "multiples of 5" (like a game with moves {1,4} might suggest by analogy to the {1,2,3} game), without checking that residue 2 is also losing here.`},th:{question:`ในเกมหนึ่ง ผู้เล่นผลัดกันหยิบก้อนหิน 1 หรือ 4 ก้อน จากกองที่มี 29 ก้อน ผู้ที่หยิบก้อนสุดท้ายเป็นผู้ชนะ ถ้า A เริ่มก่อนและทั้งสองเล่นสมบูรณ์แบบ A ควรหยิบกี่ก้อนในตาแรกเพื่อรับประกันชัยชนะ — 1 หรือ 4 (ตอบ 1 หรือ 4)`,hint1:`สร้างตารางแพ้/ชนะสำหรับกองขนาดเล็กก่อน เริ่มจาก 0 ก้อน`,hint2:`หารูปแบบที่วนซ้ำในสถานะแพ้ เมื่อได้ค่า 10-12 ค่าแรกแล้ว`,quickIdea:`หาแพ้/ชนะสำหรับกองเล็กด้วยมือ หารูปแบบที่วนซ้ำ แล้วนำไปใช้กับ 29`,steps:[`สร้างตารางจาก 0 ขึ้นไป (L = แพ้สำหรับผู้ที่ต้องเดิน): สถานะแพ้เกิดที่ 0, 2, 5, 7, 10, 12, 15, 17, 20, 22, 25, 27, ... รูปแบบคือ "เศษ 0 หรือ 2 เมื่อหารด้วย 5"`,`29 ÷ 5 = 5 เศษ 4 ดังนั้น 29 ไม่ใช่สถานะแพ้ (เป็นสถานะชนะสำหรับ A) ดี มีการเดินที่ชนะได้`,`จาก 29 หยิบ 1 เหลือ 28 (28÷5 เศษ3 เป็นสถานะชนะของคู่ต่อสู้ การเดินที่ไม่ดี) หยิบ 4 เหลือ 25 (25÷5 เศษ0 เป็นสถานะแพ้ของคู่ต่อสู้)`,`ดังนั้น A ควรหยิบ 4 ก้อน เหลือ 25 ให้คู่ต่อสู้`],competitionTip:`สำหรับเกมลบเลขที่หยิบได้ {1, 4} สถานะแพ้วนซ้ำทุกคาบ 5 (เพราะ1+4=5) แต่ต้องตรวจเศษที่แน่นอนด้วยการสร้างตารางเสมอ อย่าสมมติเอง`,commonMistake:`สมมติว่าสถานะแพ้คือ "พหุคูณของ5" เฉยๆ (เหมือนเทียบกับเกมที่หยิบได้{1,2,3}) โดยไม่ตรวจว่าเศษ2 ก็เป็นสถานะแพ้ด้วยในเกมนี้`},correctAnswer:`4`,acceptedAnswers:[`4`,`4.0`],verificationStatus:`verified`},{id:`M3-C-23`,mockSet:3,section:`C`,questionNumber:23,marks:6,difficulty:`challenge`,topic:`Intersections`,subskill:`maximum circle-circle intersections`,type:`free-response`,en:{question:`What is the maximum number of points at which 5 distinct circles can intersect each other (counting circle-circle intersections only)? (Enter a whole number.)`,hint1:`Any two distinct circles can cross at how many points, at most?`,hint2:`Count how many PAIRS of circles can be formed from 5 circles.`,quickIdea:`Maximum circle-circle intersections = (number of pairs) × (2 points per pair).`,steps:[`Any two circles intersect at most 2 points.`,`Number of pairs among 5 circles = C(5,2) = 10.`,`Maximum total intersections = 10 × 2 = 20.`],competitionTip:`This "pairs × max-per-pair" method works for any maximum-intersection question — always start by counting the pairs.`,commonMistake:`Using C(5,2) = 10 as the final answer, forgetting to multiply by the 2 intersection points each pair can produce.`},th:{question:`จำนวนจุดตัดที่มากที่สุดที่เป็นไปได้ เมื่อวงกลม 5 วงที่แตกต่างกันตัดกันเอง (นับเฉพาะจุดตัดวงกลม-วงกลม) คือเท่าไร (ตอบเป็นจำนวนเต็ม)`,hint1:`วงกลมสองวงที่แตกต่างกันตัดกันได้มากที่สุดกี่จุด`,hint2:`นับว่าวงกลม 5 วงสร้างคู่ได้กี่คู่`,quickIdea:`จุดตัดวงกลม-วงกลมสูงสุด = (จำนวนคู่) × (2 จุดต่อคู่)`,steps:[`วงกลมสองวงตัดกันได้มากที่สุด 2 จุด`,`จำนวนคู่จากวงกลม 5 วง = C(5,2) = 10`,`จุดตัดรวมสูงสุด = 10 × 2 = 20`],competitionTip:`วิธี "คู่ × จุดตัดสูงสุดต่อคู่" ใช้ได้กับโจทย์จุดตัดสูงสุดทุกแบบ เริ่มจากนับจำนวนคู่เสมอ`,commonMistake:`ใช้ C(5,2) = 10 เป็นคำตอบสุดท้าย ลืมคูณด้วยจุดตัด 2 จุดที่แต่ละคู่สร้างได้`},correctAnswer:`20`,acceptedAnswers:[`20`,`20.0`],verificationStatus:`verified`},{id:`M3-C-24`,mockSet:3,section:`C`,questionNumber:24,marks:6,difficulty:`challenge`,topic:`Cube & Spatial Reasoning`,subskill:`painted cuboid: counting edge pieces (exactly 2 faces)`,type:`free-response`,en:{question:`A rectangular block is built from unit cubes in a 5×4×3 arrangement (60 unit cubes total). The outside is completely painted, then it is taken apart. How many unit cubes have paint on EXACTLY 2 faces (lying on an edge of the block, not a corner)? (Enter a whole number.)`,hint1:`A block has 12 edges: 4 running in each of the 3 directions.`,hint2:`On an edge running in a given direction, the two end cubes are corners (3 faces) — the rest have exactly 2 faces painted.`,quickIdea:`Count the edge (2-face) cubes direction by direction: 4 edges per direction × (that direction’s length − 2).`,steps:[`Edges running along the length-5 direction: 4 such edges, each with (5−2) = 3 non-corner cubes → 4×3 = 12.`,`Edges running along the length-4 direction: 4 such edges, each with (4−2) = 2 non-corner cubes → 4×2 = 8.`,`Edges running along the length-3 direction: 4 such edges, each with (3−2) = 1 non-corner cube → 4×1 = 4.`,`Total exactly-2-face cubes = 12 + 8 + 4 = 24.`],whyOthersFail:`A full check: corners = 8, edges = 24, faces (1-face) = 2×[(3×2)+(2×1)+(3×1)] = 2×11 = 22, interior (0-face) = 3×2×1 = 6. Sum = 8+24+22+6 = 60, matching the total 5×4×3 = 60. ✓`,competitionTip:`For an a×b×c block, the "exactly 2 faces" count is always 4[(a−2)+(b−2)+(c−2)] — memorise this alongside the exactly-1-face and exactly-3-face formulas.`,commonMistake:`Using the single-number cube formula 12×(n−2) directly, which only works when all three dimensions are equal (a cube), not for a general rectangular block.`},th:{question:`บล็อกสี่เหลี่ยมสร้างจากลูกบาศก์หน่วยจัดเรียงเป็น 5×4×3 (รวม 60 ก้อน) ผิวด้านนอกถูกทาสีทั้งหมด แล้วแยกออกจากกัน มีลูกบาศก์กี่ก้อนที่มีสีทาอยู่พอดี 2 หน้า (อยู่บนขอบของบล็อก ไม่ใช่มุม) (ตอบเป็นจำนวนเต็ม)`,hint1:`บล็อกมี 12 ขอบ: 4 ขอบในแต่ละ 3 ทิศทาง`,hint2:`บนขอบที่วิ่งไปในทิศทางหนึ่ง ลูกบาศก์ปลายทั้งสองเป็นมุม (3หน้า) ที่เหลือมีสีพอดี 2 หน้า`,quickIdea:`นับลูกบาศก์ขอบ (2หน้า) ทีละทิศทาง: 4 ขอบต่อทิศทาง × (ความยาวทิศทางนั้น − 2)`,steps:[`ขอบที่วิ่งไปตามทิศทางยาว5: มี 4 ขอบ แต่ละขอบมี (5−2) = 3 ก้อนที่ไม่ใช่มุม → 4×3 = 12`,`ขอบที่วิ่งไปตามทิศทางยาว4: มี 4 ขอบ แต่ละขอบมี (4−2) = 2 ก้อนที่ไม่ใช่มุม → 4×2 = 8`,`ขอบที่วิ่งไปตามทิศทางยาว3: มี 4 ขอบ แต่ละขอบมี (3−2) = 1 ก้อนที่ไม่ใช่มุม → 4×1 = 4`,`รวมลูกบาศก์ที่มีสีพอดี 2 หน้า = 12 + 8 + 4 = 24`],whyOthersFail:`ตรวจสอบครบถ้วน: มุม = 8, ขอบ = 24, หน้า (1หน้า) = 2×[(3×2)+(2×1)+(3×1)] = 2×11 = 22, ตรงกลาง (0หน้า) = 3×2×1 = 6 รวม = 8+24+22+6 = 60 ตรงกับ 5×4×3 = 60 ✓`,competitionTip:`สำหรับบล็อกขนาด a×b×c จำนวนที่มีสีพอดี 2 หน้าเท่ากับ 4[(a−2)+(b−2)+(c−2)] เสมอ จำสูตรนี้ไว้คู่กับสูตร 1หน้าและ3หน้า`,commonMistake:`ใช้สูตรลูกบาศก์ตัวเดียว 12×(n−2) โดยตรง ซึ่งใช้ได้เฉพาะเมื่อทั้งสามมิติเท่ากัน (ลูกบาศก์) ไม่ใช่บล็อกสี่เหลี่ยมทั่วไป`},correctAnswer:`24`,acceptedAnswers:[`24`,`24.0`],verificationStatus:`verified`},{id:`M3-C-25`,mockSet:3,section:`C`,questionNumber:25,marks:6,difficulty:`challenge`,topic:`Word Problems`,subskill:`ratio and mixture problem`,type:`free-response`,en:{question:`A jug contains a mixture of pure juice and water in the ratio 3:5, totaling 40 liters. How many liters of pure juice must be added (with no water added or removed) so that the ratio of juice to water becomes 4:5? (Enter a whole number.)`,hint1:`Find the actual amount of juice and the actual amount of water first, using the given ratio and total.`,hint2:`Adding juice does not change the amount of water — use that to set up an equation for the new ratio.`,quickIdea:`Split the total using the ratio to find real amounts, then let the unknown addition change only one quantity.`,steps:[`Ratio parts: 3 + 5 = 8 parts for 40 liters, so 1 part = 5 liters.`,`Juice = 3 × 5 = 15 liters. Water = 5 × 5 = 25 liters.`,`After adding x liters of juice: (15 + x) : 25 = 4 : 5.`,`Cross-multiply: 5(15 + x) = 4 × 25 → 75 + 5x = 100 → 5x = 25 → x = 5.`],whyOthersFail:`Check: new juice = 15+5 = 20, water = 25 (unchanged), and 20:25 simplifies to 4:5. ✓`,competitionTip:`In "add more of one ingredient" ratio problems, the quantity NOT being changed (here, water) stays fixed — always use it as your anchor for the new ratio equation.`,commonMistake:`Accidentally changing the water amount too, or using the original 40-liter total instead of the fixed 25-liter water amount when setting up the new ratio.`},th:{question:`เหยือกใบหนึ่งมีส่วนผสมของน้ำผลไม้แท้และน้ำในอัตราส่วน 3:5 รวม 40 ลิตร ต้องเติมน้ำผลไม้แท้กี่ลิตร (โดยไม่เติมหรือเอาน้ำออก) เพื่อให้อัตราส่วนน้ำผลไม้ต่อน้ำกลายเป็น 4:5 (ตอบเป็นจำนวนเต็ม)`,hint1:`หาปริมาณน้ำผลไม้จริงและปริมาณน้ำจริงก่อน โดยใช้อัตราส่วนและผลรวมที่ให้มา`,hint2:`การเติมน้ำผลไม้ไม่เปลี่ยนปริมาณน้ำ ใช้สิ่งนี้ตั้งสมการสำหรับอัตราส่วนใหม่`,quickIdea:`แบ่งผลรวมตามอัตราส่วนเพื่อหาปริมาณจริง แล้วให้ค่าที่เติมเปลี่ยนเพียงปริมาณเดียว`,steps:[`ส่วนของอัตราส่วน: 3 + 5 = 8 ส่วน สำหรับ 40 ลิตร ดังนั้น 1 ส่วน = 5 ลิตร`,`น้ำผลไม้ = 3 × 5 = 15 ลิตร น้ำ = 5 × 5 = 25 ลิตร`,`หลังเติมน้ำผลไม้ x ลิตร: (15 + x) : 25 = 4 : 5`,`คูณไขว้: 5(15 + x) = 4 × 25 → 75 + 5x = 100 → 5x = 25 → x = 5`],whyOthersFail:`ตรวจสอบ: น้ำผลไม้ใหม่ = 15+5 = 20, น้ำ = 25 (ไม่เปลี่ยน) และ 20:25 ลดรูปเป็น 4:5 ✓`,competitionTip:`ในโจทย์อัตราส่วนแบบ "เติมส่วนผสมหนึ่งเพิ่ม" ปริมาณที่ไม่เปลี่ยน (ที่นี่คือน้ำ) คงที่เสมอ ใช้เป็นจุดยึดสำหรับสมการอัตราส่วนใหม่`,commonMistake:`เผลอเปลี่ยนปริมาณน้ำไปด้วย หรือใช้ผลรวมเดิม 40 ลิตรแทนปริมาณน้ำคงที่ 25 ลิตรเมื่อตั้งสมการอัตราส่วนใหม่`},correctAnswer:`5`,acceptedAnswers:[`5`,`5.0`],verificationStatus:`verified`}],Lr={set:3,title:{en:`Mock Test 3`,th:`ข้อสอบจำลองชุดที่ 3`},estimatedMinutes:60},Rr=[{id:`M4-A-01`,mockSet:4,section:`A`,questionNumber:1,marks:3,difficulty:`foundation`,topic:`Number Sense`,subskill:`estimation before calculating`,type:`mc`,en:{question:`Without calculating exactly, which of these is closest to 396 × 21?`,options:[`4000`,`6000`,`10000`,`8000`,`12000`],hint1:`Round each number to a nearby friendly value before multiplying.`,hint2:`396 is close to 400, and 21 is close to 20.`,quickIdea:`Round both numbers to easy values, multiply the rounded values, and compare to the answer choices.`,steps:[`Round 396 to 400, and 21 to 20.`,`400 × 20 = 8000.`,`The closest option is 8000.`],competitionTip:`Estimating first also catches calculator-style slip-ups — if your exact answer is far from your estimate, recheck your work.`,commonMistake:`Rounding only one of the two numbers, which gives a less accurate estimate.`},th:{question:`โดยไม่ต้องคำนวณอย่างละเอียด ตัวเลือกใดใกล้เคียงกับ 396 × 21 มากที่สุด`,options:[`4000`,`6000`,`10000`,`8000`,`12000`],hint1:`ปัดเศษแต่ละจำนวนให้เป็นค่าที่คำนวณง่ายก่อนคูณ`,hint2:`396 ใกล้เคียง 400 และ 21 ใกล้เคียง 20`,quickIdea:`ปัดเศษทั้งสองจำนวนให้เป็นค่าง่ายๆ คูณค่าที่ปัดแล้ว แล้วเทียบกับตัวเลือก`,steps:[`ปัดเศษ 396 เป็น 400 และ 21 เป็น 20`,`400 × 20 = 8000`,`ตัวเลือกที่ใกล้เคียงที่สุดคือ 8000`],competitionTip:`การประมาณค่าก่อนยังช่วยจับข้อผิดพลาดจากการคำนวณ ถ้าคำตอบจริงต่างจากค่าประมาณมาก ให้ตรวจงานใหม่`,commonMistake:`ปัดเศษเพียงจำนวนเดียวจากสองจำนวน ทำให้ค่าประมาณแม่นยำน้อยลง`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M4-A-02`,mockSet:4,section:`A`,questionNumber:2,marks:3,difficulty:`foundation`,topic:`Factors & Primes`,subskill:`recognising composite numbers`,type:`mc`,en:{question:`Which of the following numbers is composite (NOT prime)?`,options:[`2`,`3`,`91`,`17`,`29`],hint1:`A composite number has factors other than just 1 and itself.`,hint2:`Try dividing 91 by small primes: 2, 3, 5, 7, 11...`,quickIdea:`Test each option for small prime factors before concluding it is prime.`,steps:[`91 ÷ 7 = 13 exactly, so 91 = 7 × 13.`,`Since 91 has factors other than 1 and 91, it is composite.`,`The other options (2, 3, 17, 29) are all prime.`],competitionTip:`91 is a classic "looks prime but isn’t" trap — always test dividing by 7 for two-digit numbers ending in 1.`,commonMistake:`Assuming any odd number that isn’t obviously divisible by 3 or 5 must be prime, without checking 7 and higher.`},th:{question:`ตัวเลือกใดต่อไปนี้เป็นจำนวนประกอบ (ไม่ใช่จำนวนเฉพาะ)`,options:[`2`,`3`,`91`,`17`,`29`],hint1:`จำนวนประกอบมีตัวประกอบอื่นนอกจาก 1 และตัวมันเอง`,hint2:`ลองหาร 91 ด้วยจำนวนเฉพาะเล็กๆ: 2, 3, 5, 7, 11...`,quickIdea:`ทดสอบตัวเลือกแต่ละตัวกับตัวประกอบเฉพาะเล็กๆ ก่อนสรุปว่าเป็นจำนวนเฉพาะ`,steps:[`91 ÷ 7 = 13 พอดี ดังนั้น 91 = 7 × 13`,`เนื่องจาก 91 มีตัวประกอบอื่นนอกจาก 1 และ 91 จึงเป็นจำนวนประกอบ`,`ตัวเลือกอื่น (2, 3, 17, 29) ล้วนเป็นจำนวนเฉพาะ`],competitionTip:`91 เป็นกับดักคลาสสิก "ดูเหมือนเฉพาะแต่ไม่ใช่" ทดสอบหารด้วย 7 เสมอสำหรับเลขสองหลักที่ลงท้ายด้วย 1`,commonMistake:`สมมติว่าเลขคี่ใดๆ ที่ไม่หารด้วย 3 หรือ 5 ชัดเจน ต้องเป็นจำนวนเฉพาะ โดยไม่ตรวจ 7 และตัวที่สูงกว่า`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M4-A-03`,mockSet:4,section:`A`,questionNumber:3,marks:3,difficulty:`foundation`,topic:`Remainders`,subskill:`remainder condition with a range constraint`,type:`mc`,en:{question:`A number leaves remainder 5 when divided by 8. If the number is between 40 and 50, what is the number?`,options:[`42`,`45`,`47`,`44`,`48`],hint1:`List numbers of the form "a multiple of 8, plus 5" near the given range.`,hint2:`Only one such number falls strictly between 40 and 50.`,quickIdea:`Numbers leaving remainder r when divided by d have the form (multiple of d) + r — list nearby candidates.`,steps:[`Numbers with remainder 5 when divided by 8: ..., 37, 45, 53, ...`,`Only 45 falls between 40 and 50.`],competitionTip:`When a range is given alongside a remainder condition, list the remainder-pattern numbers near that range rather than searching from 0.`,commonMistake:`Picking any number in the range without checking it actually leaves remainder 5 when divided by 8.`},th:{question:`จำนวนหนึ่งหาร 8 เหลือเศษ 5 ถ้าจำนวนนั้นอยู่ระหว่าง 40 กับ 50 จำนวนนั้นคือเท่าไร`,options:[`42`,`45`,`47`,`44`,`48`],hint1:`ลองไล่เลขที่มีรูปแบบ "พหุคูณของ 8 บวก 5" ใกล้ช่วงที่กำหนด`,hint2:`มีเพียงเลขเดียวเท่านั้นที่อยู่ระหว่าง 40 กับ 50 พอดี`,quickIdea:`เลขที่หาร d เหลือเศษ r มีรูปแบบ (พหุคูณของ d) + r ลองไล่เลขใกล้ช่วงที่กำหนด`,steps:[`เลขที่หาร 8 เหลือเศษ 5: ..., 37, 45, 53, ...`,`มีเพียง 45 เท่านั้นที่อยู่ระหว่าง 40 กับ 50`],competitionTip:`เมื่อมีช่วงกำกับเงื่อนไขเศษเหลือ ให้ไล่เลขในรูปแบบเศษเหลือใกล้ช่วงนั้นแทนการค้นหาจาก 0`,commonMistake:`เลือกเลขในช่วงโดยไม่ตรวจว่าหาร 8 เหลือเศษ 5 จริงหรือไม่`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M4-A-04`,mockSet:4,section:`A`,questionNumber:4,marks:3,difficulty:`foundation`,topic:`Word Problems`,subskill:`age ratio with a total`,type:`mc`,en:{question:`Sam is twice as old as his cousin Rex. The sum of their ages is 27. How old is Rex?`,options:[`7`,`8`,`9`,`10`,`12`],hint1:`Let Rex’s age be x, and write Sam’s age in terms of x.`,hint2:`Add both ages together and set the total equal to 27.`,quickIdea:`Turn a ratio relationship into a single variable, then use the total to solve.`,steps:[`Let Rex = x, so Sam = 2x.`,`x + 2x = 27 → 3x = 27.`,`x = 9.`],competitionTip:`For "twice as old" or similar ratio clues, always express both quantities using ONE variable before adding.`,commonMistake:`Dividing 27 by 2 instead of by the sum of the ratio parts (1+2=3).`},th:{question:`แซมอายุเป็นสองเท่าของเร็กซ์ ลูกพี่ลูกน้องของเขา ผลรวมอายุของทั้งสองคือ 27 ปี เร็กซ์อายุเท่าไร`,options:[`7`,`8`,`9`,`10`,`12`],hint1:`ให้อายุเร็กซ์เป็น x แล้วเขียนอายุแซมในรูปของ x`,hint2:`บวกอายุทั้งสองเข้าด้วยกัน แล้วให้เท่ากับ 27`,quickIdea:`เปลี่ยนความสัมพันธ์แบบอัตราส่วนให้เป็นตัวแปรเดียว แล้วใช้ผลรวมแก้หาคำตอบ`,steps:[`ให้เร็กซ์ = x ดังนั้นแซม = 2x`,`x + 2x = 27 → 3x = 27`,`x = 9`],competitionTip:`สำหรับเงื่อนไข "อายุเป็นสองเท่า" หรือคล้ายกัน ให้เขียนทั้งสองปริมาณด้วยตัวแปรเดียวก่อนบวกเสมอ`,commonMistake:`นำ 27 ไปหารด้วย 2 แทนที่จะหารด้วยผลบวกของอัตราส่วน (1+2=3)`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M4-A-05`,mockSet:4,section:`A`,questionNumber:5,marks:3,difficulty:`foundation`,topic:`Average`,subskill:`total from an average`,type:`mc`,en:{question:`The average of 4 numbers is 22. What is their total?`,options:[`88`,`80`,`84`,`86`,`90`],hint1:`Use Total = Average × Number of items.`,hint2:`Multiply 22 by 4.`,quickIdea:`Total = Average × Number of items.`,steps:[`Total = 22 × 4 = 88.`],competitionTip:`This is the most basic average-total conversion — practice it until it is automatic, since larger problems build on it.`,commonMistake:`Dividing instead of multiplying (22 ÷ 4).`},th:{question:`ค่าเฉลี่ยของตัวเลข 4 จำนวนคือ 22 ผลรวมของตัวเลขเหล่านี้คือเท่าไร`,options:[`88`,`80`,`84`,`86`,`90`],hint1:`ใช้ ผลรวม = ค่าเฉลี่ย × จำนวนตัว`,hint2:`นำ 22 คูณด้วย 4`,quickIdea:`ผลรวม = ค่าเฉลี่ย × จำนวนตัว`,steps:[`ผลรวม = 22 × 4 = 88`],competitionTip:`นี่คือการแปลงค่าเฉลี่ย-ผลรวมพื้นฐานที่สุด ฝึกจนคล่องเพราะโจทย์ที่ใหญ่กว่าจะต่อยอดจากนี้`,commonMistake:`หารแทนที่จะคูณ (22 ÷ 4)`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M4-A-06`,mockSet:4,section:`A`,questionNumber:6,marks:3,difficulty:`foundation`,topic:`Perimeter`,subskill:`regular polygon side length`,type:`mc`,en:{question:`A regular hexagon (6 equal sides) has a perimeter of 42 cm. What is the length of one side?`,options:[`6`,`8`,`9`,`7`,`5`],hint1:`A regular hexagon has 6 equal sides.`,hint2:`Divide the perimeter by the number of sides.`,quickIdea:`For any regular polygon, side length = perimeter ÷ number of sides.`,steps:[`Side = 42 ÷ 6 = 7 cm.`],competitionTip:`This same division idea works for any regular polygon — pentagon, hexagon, octagon — just divide by the number of sides.`,commonMistake:`Dividing by 4 (as if it were a square) instead of 6.`},th:{question:`หกเหลี่ยมด้านเท่า (6 ด้านเท่ากัน) มีเส้นรอบรูป 42 ซม. ด้านหนึ่งยาวเท่าไร`,options:[`6`,`8`,`9`,`7`,`5`],hint1:`หกเหลี่ยมด้านเท่ามี 6 ด้านเท่ากัน`,hint2:`นำเส้นรอบรูปหารด้วยจำนวนด้าน`,quickIdea:`สำหรับรูปหลายเหลี่ยมด้านเท่าใดๆ ความยาวด้าน = เส้นรอบรูป ÷ จำนวนด้าน`,steps:[`ด้าน = 42 ÷ 6 = 7 ซม.`],competitionTip:`แนวคิดการหารนี้ใช้ได้กับรูปหลายเหลี่ยมด้านเท่าใดๆ ห้าเหลี่ยม หกเหลี่ยม แปดเหลี่ยม เพียงหารด้วยจำนวนด้าน`,commonMistake:`หารด้วย 4 (เหมือนเป็นสี่เหลี่ยมจัตุรัส) แทนที่จะเป็น 6`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M4-A-07`,mockSet:4,section:`A`,questionNumber:7,marks:3,difficulty:`foundation`,topic:`Area`,subskill:`basic triangle area`,type:`mc`,en:{question:`A triangle has a base of 14 cm and a height of 6 cm. What is its area?`,options:[`36`,`40`,`42`,`48`,`84`],hint1:`Use the triangle area formula.`,hint2:`Area = ½ × base × height.`,quickIdea:`Triangle area = ½ × base × height.`,steps:[`Area = ½ × 14 × 6.`,`½ × 14 = 7, then 7 × 6 = 42.`],competitionTip:`Halve whichever of base or height is even FIRST — it usually keeps the numbers smaller and the arithmetic easier.`,commonMistake:`Forgetting the ½, computing 14 × 6 = 84 as the final answer.`},th:{question:`ส

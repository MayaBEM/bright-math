:root{
  --ivory:#F6F0E3; --paper:#FFFBF2; --ink:#2B2723; --ink2:#5A5047; --line:#D9CCB3; --line2:#C4B28F;
  --accent:#C23D22; --accent-d:#A32F18; --petrol:#1B5E78; --petrol-d:#144A5F; --gold:#E8A31E; --sage:#6F8F4E;
  --sil:#2E2924; --mat:#F2E6CB; --tray:#E3D0A8; --wood:#8A5A3C; --wood-d:#6B4429;
  --fs:clamp(16px, 0.55vw + 10.4px, 22px);
  --r:10px; --r2:16px;
  --display:'Fraunces', Georgia, 'Times New Roman', serif; --body:'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0;letter-spacing:-0.01em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--petrol);outline-offset:2px;border-radius:6px}
svg.board-svg:focus,svg.board-svg:focus-visible,svg.board-svg :focus-visible{outline:none}
.piece:focus-visible .pface{stroke:#1B5E78;stroke-width:.1}

/* header / footer */
.top{display:flex;align-items:center;gap:1rem;padding:.55rem clamp(.8rem,2vw,1.6rem);border-bottom:2px solid var(--ink);background:var(--paper);flex:0 0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;background:none;border:0;cursor:pointer;padding:.15rem .3rem;text-align:left}
.brand svg{width:2.1rem;height:2.1rem;flex:0 0 auto}
.brand b{display:block;font-family:var(--display);font-size:1.05rem;line-height:1}
.brand small{display:block;font-size:.72rem;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:.15rem}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:.5rem;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:.3rem .9rem .3rem .4rem;font-weight:500;cursor:pointer;min-height:2.6rem}
.pill i{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;color:#fff;font-style:normal;font-weight:700;font-size:.9rem}
.pill .stars{font-size:.85rem;color:var(--ink2)}
.iconbtn{display:inline-grid;place-items:center;width:2.7rem;height:2.7rem;border:2px solid var(--ink);background:var(--paper);border-radius:10px;cursor:pointer}
.iconbtn[aria-pressed="false"]{background:#EFE6D2;color:var(--ink2)}
.iconbtn:hover{background:#FFF3D6}
.foot{flex:0 0 auto;border-top:2px solid var(--ink);background:var(--paper);padding:.5rem clamp(.8rem,2vw,1.6rem);display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.82rem;color:var(--ink2);align-items:center}
.foot b{color:var(--ink);font-family:var(--display)}
main#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:auto;outline:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.9rem;padding:.55rem 1.2rem;border-radius:10px;border:2px solid var(--ink);background:var(--paper);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn:hover{background:#FFF3D6}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--accent-d)}
.btn.petrol{background:var(--petrol);color:#fff}
.btn.petrol:hover{background:var(--petrol-d)}
.btn.sm{min-height:2.4rem;padding:.35rem .8rem;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:var(--line2);background:transparent}
.btn.ghost:hover{background:#FFF3D6}
.rm *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
.chip{display:inline-block;border:1.5px solid var(--ink);border-radius:6px;padding:.1rem .55rem;font-size:.82rem;font-weight:500;background:var(--paper)}
.chip.fill{background:var(--ink);color:#fff}
.lbl{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(1rem,3vw,3rem);padding:clamp(1rem,3vw,2.5rem) clamp(1rem,4vw,3.5rem);align-items:center;flex:1}
.home h1{font-size:clamp(2.2rem,4.6vw,4rem);margin:.35rem 0 .6rem}
.home .sub{font-size:1.2rem;color:var(--ink2);max-width:34rem}
.kicker{display:inline-flex;gap:.6rem;align-items:center;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.kicker span{background:var(--ink);color:#fff;padding:.15rem .5rem;border-radius:4px}
.who{margin:1.4rem 0 1rem}
.who-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.45rem}
.pchoice{display:inline-flex;align-items:center;gap:.45rem;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:.25rem .85rem .25rem .3rem;cursor:pointer;font-weight:500;min-height:2.6rem}
.pchoice[aria-pressed="true"]{background:var(--ink);color:#fff}
.pchoice i{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:.85rem;font-weight:700;border:2px solid #fff}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
.wscard{display:flex;flex-direction:column;gap:.35rem;text-align:left;border:2px solid var(--ink);border-radius:var(--r2);padding:1.1rem 1.2rem 1rem;background:var(--paper);box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s;min-height:9.5rem}
.wscard:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.wscard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.wscard h2{font-size:1.5rem}
.wscard p{color:var(--ink2);font-size:.95rem}
.wscard .go{margin-top:auto;font-weight:600;color:var(--accent)}
.wscard.a{background:#FBE9DF}.wscard.b{background:#E2EEF0}
.links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.3rem}
.hero{background:var(--wood);padding:.7rem;border-radius:20px;box-shadow:0 8px 0 var(--wood-d);border:2px solid var(--ink)}
.hero .mat{background:var(--mat);border-radius:12px;aspect-ratio:1.22/1;display:grid;place-items:center;overflow:hidden;border:2px solid var(--wood-d)}
.hero svg{width:100%;height:100%;display:block}

/* hub */
.page{padding:clamp(.8rem,2vw,1.8rem) clamp(.8rem,3vw,2.6rem) 2rem;width:100%;max-width:90rem;margin:0 auto}
.crumb{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
.page h1{font-size:clamp(1.8rem,3vw,2.6rem)}
.page .lead{color:var(--ink2);max-width:46rem;margin-top:.4rem}
.tabs{display:flex;gap:.4rem;margin:1.1rem 0 1rem;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tab{border:2px solid var(--ink);border-bottom:0;background:#EFE6D2;border-radius:10px 10px 0 0;padding:.5rem 1.1rem;font-weight:600;cursor:pointer;margin-bottom:-2px;min-height:2.7rem}
.tab[aria-selected="true"]{background:var(--paper);position:relative}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr));gap:1rem}
.lvl{border:2px solid var(--ink);border-radius:var(--r2);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.lvl header{padding:.8rem 1rem .7rem;border-bottom:2px solid var(--ink)}
.lvl header .n{font-family:var(--display);font-size:2.2rem;line-height:1;font-weight:700}
.lvl h3{font-size:1.15rem;margin:.2rem 0 .3rem}
.lvl .tgt{font-size:.82rem;color:var(--ink2)}
.lvl .tgt b{color:var(--ink)}
.lvl.l1 header{background:#F7D9C8}.lvl.l2 header{background:#F8E7B5}.lvl.l3 header{background:#D9E6C2}.lvl.l4 header{background:#CFE3E8}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;padding:.7rem}
.tile{position:relative;border:2px solid var(--ink);background:var(--mat);border-radius:8px;aspect-ratio:1;padding:.2rem;cursor:pointer;display:grid;place-items:center;min-width:0}
.tile:hover{background:#FFF3D6}
.tile svg{width:100%;height:100%}
.tile .no{position:absolute;left:.15rem;top:.05rem;font-size:.68rem;font-weight:700;color:var(--ink2)}
.tile .mini{position:absolute;right:.12rem;bottom:.08rem;display:flex;gap:1px}
.tile .mini i{width:.45rem;height:.45rem;background:var(--gold);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.tile.done{background:#E7F0DA}
.tile .tick{position:absolute;right:.2rem;top:.15rem;width:.7rem;height:.7rem}
.tile .nm{position:absolute;left:0;right:0;bottom:-1px;font-size:.58rem;text-align:center;background:var(--paper);border-top:1.5px solid var(--ink);border-radius:0 0 6px 6px;padding:.05rem 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin-top:1rem}
.mcard{border:2px solid var(--ink);border-radius:var(--r2);background:var(--paper);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--ink);min-height:8.5rem}
.mcard:hover{background:#FFF3D6}.mcard:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.mcard h3{font-size:1.2rem}.mcard p{color:var(--ink2);font-size:.9rem}
.mcard .meta{margin-top:auto;font-weight:600;font-size:.85rem}
.mcard svg{height:3.2rem;width:auto;align-self:flex-start}

/* play layout */
.play{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(17rem,22.5rem) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:clamp(.6rem,1.4vw,1.2rem);padding:clamp(.6rem,1.4vw,1.2rem) clamp(.6rem,2vw,1.6rem)}
.panel{border:2px solid var(--ink);border-radius:var(--r2);background:var(--paper);padding:1rem;display:flex;flex-direction:column;gap:.75rem;overflow:auto;min-height:0}
.panel h2{font-size:1.6rem}
.panel .meta{display:flex;gap:.4rem;flex-wrap:wrap}
.target{border-left:5px solid var(--petrol);background:#E9F1F3;padding:.5rem .7rem;border-radius:0 8px 8px 0;font-size:.88rem}
.target b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol-d);margin-bottom:.15rem}
.target ul{margin:0;padding-left:1.1rem}
.status{font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.status .bar{flex:1;height:.6rem;background:#EFE6D2;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--sage);transition:width .2s}
.btnrow{display:flex;flex-wrap:wrap;gap:.5rem}
.toggle{display:flex;align-items:center;gap:.55rem;font-size:.9rem;cursor:pointer;min-height:2.4rem}
.toggle input{width:1.25rem;height:1.25rem;accent-color:var(--petrol)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .6rem;font-size:.8rem}
.legend div{display:flex;align-items:center;gap:.4rem;line-height:1.15}
.legend svg{width:2rem;height:1.5rem;flex:0 0 auto}
.legend small{display:block;color:var(--ink2);font-size:.72rem}
.stagewrap{position:relative;min-height:18rem;min-width:0;display:flex;flex-direction:column;gap:.6rem}
.stage{position:relative;flex:1 1 0;min-height:0;min-width:0;border:2px solid var(--ink);border-radius:var(--r2);background:var(--wood);box-shadow:0 5px 0 var(--wood-d);padding:.45rem;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage .board-svg{position:absolute;left:.45rem;top:.45rem;width:calc(100% - .9rem);height:calc(100% - .9rem);display:block;touch-action:none}
.mat-board{fill:var(--mat);stroke:#CDB486;stroke-width:.06}
.mat-tray{fill:var(--tray);stroke:#C4A870;stroke-width:.05}
.sil{fill:var(--sil);stroke:var(--sil);stroke-width:.03;stroke-linejoin:round}
.seam{fill:none;stroke:#F6F0E3;stroke-width:.05;stroke-linejoin:round;opacity:.92}
.ghostpoly{fill:none;stroke:#8A7358;stroke-width:.05;stroke-dasharray:.25 .18}
.axis{stroke:var(--accent);stroke-width:.07;stroke-dasharray:.32 .2;stroke-linecap:round}
.piece{cursor:grab}.piece.locked{cursor:default}.piece.drag{cursor:grabbing}
.pface{stroke-width:.045;stroke-linejoin:round}
.pface.mir{opacity:.95}
.pshadow{fill:rgba(64,40,16,.34)}
.piece.sel .pface{stroke:#14202A;stroke-width:.1}
.piece.drag .pface{stroke:#14202A;stroke-width:.08}
.stockface{pointer-events:none}
.stocklbl{font:600 .27px var(--body);fill:#4A3B30;pointer-events:none}
.hintpoly{fill:rgba(194,61,34,.14);stroke-width:.1;stroke-dasharray:.28 .16;stroke-linejoin:round;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-.88}}
.knob circle{fill:var(--petrol);stroke:#fff;stroke-width:.06;cursor:grab}
.knobline{stroke:var(--petrol);stroke-width:.06}
.ptools{position:absolute;z-index:5;display:flex;gap:.45rem;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:.35rem;box-shadow:0 3px 0 var(--ink)}
.ptools[hidden]{display:none}
.tbtn{width:3.1rem;height:3.1rem;border-radius:10px;border:2px solid var(--ink);background:var(--petrol);color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.tbtn:hover{background:var(--petrol-d)}.tbtn:active{transform:translateY(2px)}
.pchip{font-size:.78rem;font-weight:600;padding:0 .5rem;white-space:nowrap}
.winbar{position:relative;flex:0 0 auto;width:100%;z-index:8;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r2);box-shadow:0 5px 0 var(--ink);padding:.8rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.winbar h3{font-size:1.5rem}
.winbar .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.starrow{display:inline-flex;gap:.2rem}
.starrow svg{width:2.1rem;height:2.1rem}
.quiz{border:2px solid var(--line2);border-radius:10px;padding:.55rem .7rem;background:#FFF6DF}
.quiz p{font-weight:600;margin-bottom:.4rem}
.opts{display:flex;flex-wrap:wrap;gap:.45rem}
.opt{min-width:3.2rem;min-height:2.6rem;padding:.25rem .9rem;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:600;cursor:pointer}
.opt:hover{background:#FFF3D6}
.opt.good{background:#CFE5B8;border-color:#335a1c}.opt.bad{background:#F6D3C9;border-color:#8a2a14;text-decoration:line-through}
.fb{font-size:.9rem;margin-top:.4rem}
.fb.good::before{content:"Correct. ";font-weight:700;color:#335a1c}
.fb.bad::before{content:"Not quite. ";font-weight:700;color:#8a2a14}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:700;vertical-align:middle}
.frac span:first-child{border-bottom:2.5px solid currentColor;padding:0 .3em .06em}
.frac span:last-child{padding:.06em .3em 0}
.opt .frac{font-size:1.15rem}

/* tables / teacher / misc */
.tbl{width:100%;border-collapse:collapse;background:var(--paper);border:2px solid var(--ink);font-size:.9rem}
.tbl th,.tbl td{padding:.5rem .6rem;border-bottom:1.5px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:#EFE6D2;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.tbl td.n,.tbl th.n{text-align:center}
.prog{display:inline-block;width:5rem;height:.6rem;border:1.5px solid var(--ink);background:#fff;border-radius:4px;vertical-align:middle;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem}
.badge{border:2px solid var(--ink);border-radius:12px;padding:.6rem .7rem;background:var(--paper);display:flex;gap:.6rem;align-items:center}
.badge.off{opacity:.45;border-style:dashed}
.badge svg{width:2.4rem;height:2.4rem;flex:0 0 auto}
.badge b{display:block;font-size:.92rem}.badge small{color:var(--ink2);font-size:.76rem;line-height:1.2;display:block}
.modal-back{position:fixed;inset:0;background:rgba(43,39,35,.55);z-index:50;display:grid;place-items:center;padding:1rem}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r2);padding:1.3rem;width:min(34rem,100%);max-height:90vh;overflow:auto;box-shadow:0 8px 0 var(--ink)}
.modal h2{font-size:1.5rem;margin-bottom:.6rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin:.6rem 0}
.field input[type=text]{font:inherit;padding:.6rem .8rem;border:2px solid var(--ink);border-radius:10px;background:#fff;min-height:2.9rem}
.note{font-size:.85rem;color:var(--ink2)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.2rem;align-items:start;margin-top:1rem}
.lcard{border:2px solid var(--ink);border-radius:var(--r2);background:var(--paper);padding:1rem 1.1rem}
.lcard h3{font-size:1.25rem;margin-bottom:.4rem}
.lcard .art{background:var(--mat);border:2px solid var(--wood-d);border-radius:12px;padding:.5rem;margin:.6rem 0}
.lcard .art svg{width:100%;height:auto;display:block;max-height:22rem}
.big{font-family:var(--display);font-size:1.5rem;font-weight:700}
.eq{font-family:var(--display);font-size:1.25rem;font-weight:600}
.pt-sheet{display:none}

@media (max-width:900px){
  .home{grid-template-columns:1fr}
  .play{grid-template-columns:1fr;grid-template-rows:auto;overflow:visible;flex:none;min-height:auto}
  .stagewrap{height:min(70vh,36rem)}
  .panel{overflow:visible}
  .lesson,.cols2{grid-template-columns:1fr}
  .ws{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(5,1fr)}
}
@media (min-width:901px) and (max-height:800px){ .panel{padding:.7rem;gap:.5rem} .panel h2{font-size:1.35rem} .panel .lead,.panel>p{font-size:.9rem} }
@media (max-width:1100px) and (min-width:901px){ .play{grid-template-columns:minmax(14.5rem,19rem) minmax(0,1fr)} }
@media (max-width:640px){ .legend,.target{display:none} .panel h2{font-size:1.3rem} }
@media (max-width:520px){ .top{gap:.5rem} .brand small{display:none} .legend{grid-template-columns:1fr} .winbar{padding:.7rem} }

/* print */
#printroot{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff;display:block}
  body>*:not(#printroot){display:none!important}
  #printroot{display:block!important}
  #printroot h1{font-size:20pt;margin:0 0 4pt}
  #printroot .pmeta{display:flex;justify-content:space-between;font-size:10pt;border-bottom:1.5pt solid #000;padding-bottom:4pt;margin-bottom:8pt}
  #printroot svg{width:100%;height:auto;max-height:200mm}
  #printroot table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #printroot th,#printroot td{border:1pt solid #444;padding:3pt 5pt;text-align:left}
  #printroot .pfoot{margin-top:8pt;font-size:9pt;color:#444}
}

</style>

  page.append(crumb('Tangram', 'tg'), h('h1', {}, 'Learn: how the pieces relate'), h('p', { class: 'lead' }, 'Four short lessons. Take your time, tap the buttons, and then try the puzzles.'));
  // 1 Meet
  const cards = h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin:.6rem 0' }, SETS.tg.order.map(t => { const d = T[t]; return h('div', { class: 'badge', style: 'flex-direction:column;align-items:flex-start' }, shapeIcon('tg', t, 3.4, 2.2), h('b', {}, d.name + (t === 'LT' || t === 'ST' ? ' (2)' : '')), h('small', {}, d.sides + ' sides · ' + d.corners + ' corners'), h('small', {}, d.sides === 3 ? 'Triangle' : 'Quadrilateral'), h('small', {}, t === 'PA' ? 'Opposite sides are parallel.' : t === 'SQ' ? '4 equal sides, 4 square corners.' : 'Has a square corner (right angle).')); }));
  page.append(lcard(1, 'Meet the seven pieces', 'Two shapes belong in the same family when they have the same number of sides. Triangles have 3 sides. Quadrilaterals have 4.', cards, sortGame('tg', ['LT', 'MT', 'ST', 'SQ', 'PA'], [[3, '3 sides'], [4, '4 sides']], 6, 'tg-sort')));
  // 2 Same area
  let split = false, lt = 1; const a2 = h('div', {}), a2b = h('div', {});
  const draw2 = () => {
    a2.innerHTML = ''; const kids = [], g = 0.16;
    const shapes = [
      { x: 0, name: 'Square', col: T.SQ.colors[0], whole: T.SQ.verts, A: [[1, 0], [2, 1], [1, 2]], B: [[1, 0], [1, 2], [0, 1]], dA: [g, 0], dB: [-g, 0] },
      { x: 4.4, name: 'Medium triangle', col: T.MT.colors[0], whole: T.MT.verts, A: [[0, 0], [2, 0], [1, 1]], B: [[0, 0], [1, 1], [0, 2]], dA: [g, -g], dB: [-g, g] },
      { x: 8.8, name: 'Parallelogram', col: T.PA.colors[0], whole: T.PA.verts, A: [[0, 0], [2, 0], [1, 1]], B: [[2, 0], [3, 1], [1, 1]], dA: [-g, -g], dB: [g, g] }];
    shapes.forEach(s => {
      const mv = (pts, d) => pts.map(p => [p[0] + s.x + 0.3 + (split ? d[0] : 0), p[1] + 0.4 + (split ? d[1] : 0)]);
      if (split) { kids.push(polyEl(s.whole.map(p => [p[0] + s.x + 0.3, p[1] + 0.4]), 'none', '#8A7358', { 'stroke-dasharray': '0.12 0.1', 'stroke-width': 0.05 })); kids.push(polyEl(mv(s.A, s.dA), T.ST.colors[0]), polyEl(mv(s.B, s.dB), T.ST.colors[1])); }
      else kids.push(polyEl(s.whole.map(p => [p[0] + s.x + 0.3, p[1] + 0.4]), s.col));
      kids.push(sv('text', { x: s.x + 1.5, y: 3.2, 'text-anchor': 'middle', class: 'stocklbl', style: 'font-size:.3px' }, s.name));
    });
    a2.append(art('0 0 12.4 3.6', kids, split ? 'Each shape split into 2 small triangles' : 'Square, medium triangle and parallelogram'), seg('Join or split', [[false, 'Joined'], [true, 'Split into small triangles']], split, v => { split = v; draw2(); }));
  };
  const draw2b = () => {
    a2b.innerHTML = ''; const kids = []; const L = T.LT.verts.map(p => [p[0] + 0.3, p[1] + 0.3]);
    if (lt === 1) kids.push(polyEl(L, T.LT.colors[0]));
    if (lt === 2) { kids.push(polyEl([[0.3, 0.3], [2.3, 0.3], [2.3, 2.3]], T.MT.colors[0]), polyEl([[2.3, 0.3], [4.3, 0.3], [2.3, 2.3]], '#f0c36a')); }
    if (lt === 4) { const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; const c = [2.3, 2.3], p0 = [0.3, 0.3], p1 = [4.3, 0.3], t = [2.3, 0.3]; const l = m(p0, c), r = m(p1, c); kids.push(polyEl([p0, t, l], T.ST.colors[0]), polyEl([t, c, l], T.ST.colors[1]), polyEl([t, p1, r], T.ST.colors[0]), polyEl([t, c, r], T.ST.colors[1])); }
    a2b.append(art('0 0 4.6 2.7', kids, 'Large triangle in ' + lt + ' piece(s)'), seg('Large triangle', [[1, '1 large'], [2, '2 medium'], [4, '4 small']], lt, v => { lt = v; draw2b(); }));
  };
  draw2(); draw2b();
  page.append(lcard(2, 'Same area, different shapes', 'Two small triangles can be joined three different ways. Each way makes a shape with the same area.', a2,
    h('p', { class: 'eq', style: 'margin:.6rem 0' }, '2 small triangles = 1 square = 1 medium triangle = 1 parallelogram'),
    h('p', {}, 'Count the area in small triangles: each of these shapes is 2 small triangles. In unit squares: if the square piece is 1 square unit, a small triangle is half a square unit.'),
    a2b, h('p', { class: 'eq', style: 'margin:.6rem 0' }, '1 large triangle = 2 medium triangles = 4 small triangles'),
    h('p', {}, 'The whole tangram set has an area of 16 small triangles (or 8 square units).')));
  // 3 halves and fourths
  let part = 'whole'; const a3 = h('div', {}), words = h('p', { class: 'big', style: 'margin:.5rem 0' });
  const draw3 = () => {
    a3.innerHTML = ''; const o = 0.3, P = (pts) => pts.map(p => [p[0] + o, p[1] + o]); const kids = [];
    const MT = [[0, 0], [2, 0], [0, 2]], A = [[0, 0], [2, 0], [1, 1]], B = [[0, 0], [1, 1], [0, 2]], C = [[2, 0], [2, 2], [1, 1]], D = [[2, 2], [0, 2], [1, 1]], half2 = [[2, 0], [2, 2], [0, 2]];
    if (part === 'whole') kids.push(polyEl(P([[0, 0], [2, 0], [2, 2], [0, 2]]), '#EFD9A0', '#8A7358'));
    if (part === 'halves') kids.push(polyEl(P(MT), T.MT.colors[0]), polyEl(P(half2), T.ST.colors[1]));
    if (part === 'fourths') kids.push(polyEl(P(A), T.ST.colors[0]), polyEl(P(B), '#f0c36a'), polyEl(P(C), T.ST.colors[1]), polyEl(P(D), '#e5708a'));
    words.innerHTML = ''; words.append(part === 'whole' ? 'The square is 1 whole.' : part === 'halves' ? ['2 equal parts: each is ', fracEl(1, 2), ' of the square.'] : ['4 equal parts: each is ', fracEl(1, 4), ' of the square.']);
    a3.append(art('0 0 2.6 2.6', kids, 'A square shown as ' + part), seg('Parts', [['whole', 'Whole'], ['halves', 'Halves'], ['fourths', 'Fourths']], part, v => { part = v; draw3(); }), words);
  };
  draw3();
  page.append(lcard(3, 'Halves and fourths of a square', 'The medium triangle plus two small triangles can make a square. Split the square into equal shares and name them.', a3, h('p', {}, 'The medium triangle is one half of the square. Each small triangle is one fourth (a quarter). Four fourths make the whole square.')));
  // 4 turn & flip
  const rounds = [{ type: 'PA', ang: 135, flip: 0 }, { type: 'PA', ang: 45, flip: 1 }, { type: 'MT', ang: 270, flip: 0 }]; let ri = 0, sp = { ang: 0, flip: 0 }, moves = 0, matched = false;
  const a4 = h('div', {}), msg = h('p', { class: 'fb', role: 'status' });
  const draw4 = () => {
    a4.innerHTML = ''; const R = rounds[ri], tv = pose('tg', R.type, 2, 1.6, R.ang, R.flip), sv_ = pose('tg', R.type, 7, 1.6, sp.ang, sp.flip);
    matched = sameSet(pose('tg', R.type, 0, 0, sp.ang, sp.flip), pose('tg', R.type, 0, 0, R.ang, R.flip), 1e-3);
    const kids = [polyEl(tv, '#2E2924', '#2E2924'), polyEl(sv_, T[R.type].colors[0]), sv('text', { x: 2, y: 3.4, 'text-anchor': 'middle', class: 'stocklbl', style: 'font-size:.28px' }, 'Target'), sv('text', { x: 7, y: 3.4, 'text-anchor': 'middle', class: 'stocklbl', style: 'font-size:.28px' }, 'Your piece')];
    const ctrl = h('div', { class: 'btnrow' },
      h('button', { class: 'btn sm petrol', type: 'button', onclick: () => { sp.ang = normAng(sp.ang - 45); moves++; Snd.turn(); draw4(); } }, '↺ Turn left 45°'),
      h('button', { class: 'btn sm petrol', type: 'button', onclick: () => { sp.ang = normAng(sp.ang + 45); moves++; Snd.turn(); draw4(); } }, '↻ Turn right 45°'),
      h('button', { class: 'btn sm petrol', type: 'button', onclick: () => { sp.flip = 1 - sp.flip; sp.ang = normAng(-sp.ang); moves++; Snd.turn(); draw4(); } }, 'Flip'));
    msg.className = 'fb' + (matched ? ' good' : ''); msg.textContent = matched ? `It matches! You used ${moves} move${moves === 1 ? '' : 's'}. ${R.flip ? 'This one needed a flip.' : 'No flip was needed.'}` : `Round ${ri + 1} of ${rounds.length}: turn or flip your piece until it matches the dark target.`;
    if (matched) Snd.snap();
    a4.append(art('0 0 9.2 3.6', kids, 'Turn and flip practice'), ctrl, msg, matched ? h('div', { class: 'btnrow', style: 'margin-top:.6rem' }, ri + 1 < rounds.length ? h('button', { class: 'btn sm primary', type: 'button', onclick: () => { ri++; sp = { ang: 0, flip: 0 }; moves = 0; draw4(); } }, 'Next round') : h('button', { class: 'btn sm primary', type: 'button', onclick: () => { Store.record('ln', 'tg-turn', 3); ri = 0; sp = { ang: 0, flip: 0 }; moves = 0; draw4(); } }, 'Finished! Play again')) : null);
    msg.style.display = 'block';
  };
  draw4();
  page.append(lcard(4, 'Turn and flip', 'A turn (rotation) spins a piece around its middle. A flip (reflection) turns it over like a page. The size and shape do not change. Only the parallelogram changes how it looks when flipped.', a4));
  page.append(h('div', { class: 'btnrow', style: 'margin-top:1.2rem' }, h('button', { class: 'btn primary', onclick: () => App.go('tg') }, 'Go to the puzzles')));
};

SCREENS.pbLearn = function () {
  const T = SETS.pb.types, page = h('div', { class: 'page' }); App.main.append(page);
  page.append(crumb('Pattern blocks', 'pb'), h('h1', {}, 'Meet the blocks'), h('p', { class: 'lead' }, 'Six blocks. Learn their names, sort them by sides and count how many triangles each one covers.'));
  const cards = h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin:.6rem 0' }, SETS.pb.order.map(t => { const d = T[t]; return h('div', { class: 'badge', style: 'flex-direction:column;align-items:flex-start' }, shapeIcon('pb', t, 3.4, 2.2), h('b', {}, d.name), h('small', {}, d.sides + ' sides · ' + d.corners + ' corners'), h('small', {}, d.sides === 3 ? 'Triangle' : d.sides === 4 ? 'Quadrilateral' : 'Hexagon')); }));
  page.append(lcard(1, 'Names, sides and corners', 'A shape is named by its sides and corners, not by its color or how it is turned. The square, the rhombuses and the trapezoid are all quadrilaterals because they have 4 sides.', cards, sortGame('pb', ['HX', 'TZ', 'RH', 'TH', 'TG', 'SQ'], [[3, '3 sides'], [4, '4 sides'], [6, '6 sides']], 6, 'pb-sort')));
  // area in triangles
  const kids = []; const hxv = T.HX.verts.map(p => [p[0] * 1 + 1.3, p[1] * 1 + 1.2]);
  const c = [1.3, 1.2]; hxv.forEach((p, i) => kids.push(polyEl([c, p, hxv[(i + 1) % 6]], T.TG.colors[0], '#fff', { 'stroke-width': 0.05 })));
  const tzv = T.TZ.verts.map(p => [p[0] + 3.2, p[1] + 0.8]); const m = [(tzv[0][0] + tzv[1][0]) / 2, tzv[0][1]];
  kids.push(polyEl([tzv[0], m, tzv[3]], T.TG.colors[0], '#fff'), polyEl([m, tzv[2], tzv[3]], T.TG.colors[0], '#fff'), polyEl([m, tzv[1], tzv[2]], T.TG.colors[0], '#fff'));
  const rhv = T.RH.verts.map(p => [p[0] + 6.1, p[1] + 0.8]); const rm = [(rhv[0][0] + rhv[1][0]) / 2, rhv[0][1]];
  kids.push(polyEl([rhv[0], rhv[1], rhv[3]].map((p, i) => i === 1 ? [rm[0], rm[1]] : p), T.TG.colors[0], '#fff'), polyEl([rm, rhv[2], rhv[3]], T.TG.colors[0], '#fff'));
  const tg1 = T.TG.verts.map(p => [p[0] + 8.2, p[1] + 0.8]); kids.push(polyEl(tg1, T.TG.colors[0], '#fff'));
  ['6', '3', '2', '1'].forEach((t, i) => kids.push(sv('text', { x: [1.3, 4.2, 6.6, 8.7][i], y: 2.9, 'text-anchor': 'middle', class: 'stocklbl', style: 'font-size:.4px' }, t + (t === '1' ? ' triangle' : ' triangles'))));
  page.append(lcard(2, 'Area in unit triangles', 'Call the green triangle 1 unit. Count how many triangles cover each block. This is the area, measured in unit triangles.', art('0 0 9.6 3.3', kids, 'Hexagon 6 triangles, trapezoid 3, rhombus 2, triangle 1'),
    h('p', { class: 'eq' }, 'hexagon = 6 · trapezoid = 3 · blue rhombus = 2 · triangle = 1'), h('p', { class: 'note', style: 'margin-top:.4rem' }, 'The square and the thin rhombus do not fit a whole number of triangles. They are measured in their own units.')));
  page.append(h('div', { class: 'btnrow', style: 'margin-top:1.2rem' }, h('button', { class: 'btn primary', onclick: () => App.go('pb') }, 'Go to the puzzles')));
};

'use strict';
DATA = { tg: { puzzles: window.__TG.puzzles }, pb: { puzzles: window.__PB.fill.concat(window.__PB.challenges), sym: window.__PB.symmetry } };
let started = false;
const start = () => { if (!started) { started = true; App.init(); } };
document.addEventListener('DOMContentLoaded', start);
if (document.readyState !== 'loading') start();

</script>

:root {
  --paper: #F7F3E8; --paper-2: #FFFDF7; --grid: #E8E0CB; --ink: #1F2A44; --ink-2: #4A5470; --muted: #6D6857;
  --red: #C8402F; --red-soft: #F7DDD6; --water: #5FA8CF; --water-2: #2F7FA8; --ok: #2E7A4E; --ok-soft: #DDEFE3;
  --hl: rgba(246, 205, 72, .55); --metal: #DCD4BF;
  --slab: 'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif;
  --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 12px; --shadow: 4px 4px 0 var(--ink);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--ink); font: 18px/1.5 var(--body);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-position: -1px -1px;
}
h1, h2, h3 { font-family: var(--slab); font-weight: 700; line-height: 1.12; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 4vw, 40px); }
h2 { font-size: 26px; }
p { margin: 0 0 .7em; }
a { color: inherit; }
.num { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--paper); padding: 8px 14px; z-index: 50; }
.skip:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- header / footer ---------- */
.top { display: flex; align-items: center; gap: 18px; padding: 12px clamp(14px, 3vw, 32px); border-bottom: 2.5px solid var(--ink); background: var(--paper); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; }
.mark-box { width: 36px; height: 40px; border: 2.5px solid var(--ink); border-top: 0; border-radius: 0 0 6px 6px; position: relative; overflow: hidden; background: var(--paper-2); }
.mark-box i { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: var(--water); border-top: 2px solid var(--water-2); }
.mark-box::after { content: ''; position: absolute; right: 0; top: 8px; width: 9px; height: 2px; background: var(--ink); box-shadow: 0 7px 0 var(--ink), 3px 14px 0 var(--ink), 0 21px 0 var(--ink); }
.mark-t { font: 700 22px/1 var(--slab); display: flex; flex-direction: column; }
.mark-t small { font: 600 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--red); margin-top: 3px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; font-weight: 700; padding: 9px 14px; border-radius: 10px; font-size: 17px; }
.nav a:hover { background: var(--hl); }
.nav a.on { background: var(--ink); color: var(--paper); }
.foot { margin-top: auto; display: flex; gap: 10px 22px; justify-content: space-between; flex-wrap: wrap; padding: 14px clamp(14px, 3vw, 32px); border-top: 2px solid var(--ink); font: 600 14px var(--mono); color: var(--ink-2); background: var(--paper); }
.free-badge { display: none; color: var(--red); }
body.free .free-badge { display: inline; }

.main { width: 100%; max-width: 1280px; margin: 0 auto; padding: clamp(16px, 3vw, 34px) clamp(16px, 3vw, 32px) 48px; outline: none; }
.eyebrow { font: 600 14px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--red); margin: 0 0 6px; }
.lede { font-size: 20px; color: var(--ink-2); max-width: 46em; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper-2); color: var(--ink); font: 700 18px var(--body); text-decoration: none; cursor: pointer; transition: transform .08s, background .15s, box-shadow .15s; box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.btn:hover { background: #fff; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: #2B3961; }
.btn.ghost { box-shadow: none; border-width: 2px; background: transparent; }
.btn.ghost:hover { background: var(--hl); }
.btn.sm { min-height: 42px; padding: 0 14px; font-size: 16px; }
.btn.big { min-height: 60px; font-size: 21px; padding: 0 30px; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-pour { background: var(--water-2); color: #fff; border-color: var(--ink); min-width: 170px; }
.btn-pour:hover { background: #236C93; }
.seg { display: inline-flex; border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper-2); }
.seg-b { border: 0; background: transparent; font: 700 16px var(--body); padding: 0 16px; min-height: 44px; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; touch-action: manipulation; }
.seg-b + .seg-b { border-left: 2px solid var(--ink); }
.seg-b.on { background: var(--ink); color: var(--paper); }
.seg.big .seg-b { min-height: 54px; font-size: 19px; padding: 0 22px; }
.tag { display: inline-block; font: 600 13px/1 var(--mono); padding: 5px 8px; border: 1.5px solid var(--ink-2); border-radius: 6px; vertical-align: middle; color: var(--ink-2); white-space: nowrap; }
.tag.g4 { border-color: var(--water-2); color: var(--water-2); }
.tag.ok { border-color: var(--ok); color: var(--ok); }
.tag.lock { border-color: var(--muted); color: var(--muted); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(200, 64, 47, .0), 3px 3px 0 var(--ink); } 50% { box-shadow: 0 0 0 6px rgba(200, 64, 47, .25), 3px 3px 0 var(--ink); } }
.bench-stage.pulse, .shelf.pulse, .seg.pulse { animation: pulse2 1.6s ease-in-out 3; }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 5px var(--hl); } }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 56px); align-items: start; }
.cover { position: relative; background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: 6px 18px 18px 6px; padding: clamp(22px, 4vw, 44px) clamp(22px, 4vw, 44px) clamp(22px, 4vw, 44px) clamp(48px, 7vw, 84px); box-shadow: 6px 6px 0 var(--ink); }
.cover::before { content: ''; position: absolute; left: clamp(28px, 4.5vw, 54px); top: 0; bottom: 0; width: 2px; background: var(--red); opacity: .7; }
.cover-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.brand-chip { font: 700 15px var(--mono); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 4px; }
.cover-std { font: 600 14px var(--mono); color: var(--ink-2); align-self: center; }
.cover-title { font-size: clamp(54px, 7.4vw, 104px); line-height: .9; margin-bottom: 18px; }
.cover-sub { font-size: clamp(19px, 2vw, 23px); max-width: 24em; color: var(--ink-2); }
.grade-pick { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 24px 0 8px; font-weight: 700; }
.log { list-style: none; margin: 0; padding: 0; border-top: 2.5px solid var(--ink); }
.log li { border-bottom: 1.5px solid var(--ink); }
.log-row { display: grid; grid-template-columns: 54px 1fr 30px; grid-template-areas: 'n t g' 'n d g'; column-gap: 12px; padding: 16px 6px; text-decoration: none; align-items: center; transition: background .15s; }
.log-row:hover { background: var(--hl); }
.log-n { grid-area: n; font: 600 22px var(--mono); color: var(--red); align-self: start; padding-top: 4px; }
.log-t { grid-area: t; font: 700 28px/1.1 var(--slab); }
.log-d { grid-area: d; color: var(--ink-2); font-size: 17px; }
.log-go { grid-area: g; font: 700 26px var(--slab); }

/* ---------- lists ---------- */
.list-head { margin-bottom: 22px; }
.lessons { list-style: none; padding: 0; margin: 0; border-top: 2.5px solid var(--ink); max-width: 900px; }
.lessons li { border-bottom: 1.5px solid var(--ink); }
.lesson-row { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; padding: 15px 6px; text-decoration: none; align-items: center; }
.lesson-row:hover { background: var(--hl); }
.lr-main { display: flex; flex-direction: column; }
.lesson-row .log-t { font-size: 23px; }
.is-locked { opacity: .55; }
.set { margin: 0 0 28px; }
.set-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
.set-head h2 { font-size: 24px; margin-bottom: 2px; }
.set-head p { margin: 0; }
.set-id { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border: 2.5px solid var(--ink); border-radius: 50%; font: 700 24px var(--slab); background: var(--paper-2); }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; padding-left: 60px; }
.tile { position: relative; width: 74px; height: 74px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--paper-2); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s; }
.tile:hover { background: var(--hl); }
.tile:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.tile-n { font: 700 26px/1 var(--slab); }
.tile-id { font: 600 12px var(--mono); color: var(--muted); }
.tile.ok { border-color: var(--ok); background: var(--ok-soft); }
.tile.no { border-color: var(--red); background: var(--red-soft); }
.tile .mk { position: absolute; top: 4px; right: 4px; transform: scale(.7); }
.foot-note { margin-top: -6px; }

/* ---------- tool screens ---------- */
.tool-head { display: flex; justify-content: space-between; gap: 14px 20px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
.tool-head h1 { margin: 0; }
.tool-head-r { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.task-q { font-family: var(--body); font-weight: 700; font-size: clamp(21px, 2.3vw, 27px); line-height: 1.35; max-width: 40em; letter-spacing: 0; }
.task-q b { background: var(--hl); padding: 0 3px; }
.explore-opts { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.opt-l { font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 12px; background: var(--paper-2); font-weight: 700; font-size: 16px; }
.chip-x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--grid); font: 700 18px var(--body); cursor: pointer; color: var(--ink); }
.chip-x:hover { background: var(--red-soft); }
.opt-add select { font: 700 16px var(--body); min-height: 44px; border: 2px dashed var(--ink); border-radius: 999px; padding: 0 14px; background: var(--paper-2); color: var(--ink); }
.readout { margin-top: 14px; font-size: 19px; }

.play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 22px; align-items: start; }
.lesson .play { grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); }
.play.no-tool { grid-template-columns: minmax(0, 720px); }
.play.stack { grid-template-columns: minmax(0, 1fr); }
.play.stack .step-card { max-width: 760px; }
.play .scale-tool { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'stage' 'shelf' 'bar'; }
.tool-host { min-width: 0; }
.step-card { background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.step-n { font: 600 14px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.step-text { font-size: 19px; }
.step-text ul { padding-left: 0; list-style: none; }
.yt { font: 700 15px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--red); margin-bottom: 4px; }
.yt::before { content: ''; display: inline-block; width: 10px; height: 10px; background: var(--red); margin-right: 8px; transform: rotate(45deg); vertical-align: 1px; }
.rule { border: 2px dashed var(--red); border-radius: 10px; padding: 12px 16px; background: #FFF8E6; margin: 10px 0 14px; }
.rule p:last-child { margin: 0; }
.num.big { font-size: 28px; display: block; text-align: center; }
.bench-list li { display: flex; gap: 14px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--grid); }
.bench-list .num { min-width: 82px; color: var(--water-2); }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.nudge { color: var(--red); font-weight: 700; min-height: 0; margin: 8px 0 0; }
.done-title { font-size: 40px; }
.steps-dots { display: flex; gap: 8px; margin: -4px 0 16px; flex-wrap: wrap; }
.dot { width: 34px; height: 12px; border-radius: 6px; border: 2px solid var(--ink); background: var(--paper-2); cursor: pointer; padding: 0; }
.dot.done { background: var(--ink-2); }
.dot.on { background: var(--red); border-color: var(--red); }
.barmodel { margin: 12px 0 14px; }
.bm-total { border: 2px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; text-align: center; font: 700 16px var(--mono); padding: 4px; background: var(--paper); }
.bm-row { display: flex; border: 2px solid var(--ink); }
.bm-part { padding: 12px 6px; text-align: center; font: 700 16px var(--mono); background: #DCEAF2; min-width: 0; }
.bm-part + .bm-part { border-left: 2px solid var(--ink); }
.bm-part.q { background: var(--hl); }
.conv { border-collapse: collapse; margin: 10px 0; font-family: var(--mono); font-size: 18px; }
.conv th, .conv td { border: 2px solid var(--ink); padding: 6px 22px; text-align: right; }
.conv th { background: var(--ink); color: var(--paper); }

/* ---------- answer panel ---------- */
.answer { margin-top: 10px; }
.ans-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.ans-input { width: 6.2em; font: 600 36px/1 var(--mono); padding: 8px 10px 6px; border: 0; border-bottom: 3.5px solid var(--ink); background: #fff; color: var(--ink); border-radius: 8px 8px 0 0; text-align: right; }
.ans-input:focus { outline: none; background: #FFF8E1; border-bottom-color: var(--red); }
.ans-unit { font: 700 26px var(--slab); padding-bottom: 8px; }
.ans-note { color: var(--ink-2); font-style: italic; }
.ans-actions { margin-top: 16px; }
.ans-actions .btn { min-width: 150px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; min-height: 54px; padding: 10px 16px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; font: 700 18px var(--body); color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 12px; }
.choice:hover { background: var(--hl); }
.choice.on { background: var(--ink); color: var(--paper); }
.ord { width: 30px; height: 30px; flex: none; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; font: 700 16px var(--mono); }
.choices.order + .btn { margin-top: 10px; }
.unit-seg .seg-b { min-height: 54px; font-size: 22px; font-family: var(--slab); }
.feedback:empty { display: none; }
.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 10px; border: 2.5px solid var(--ink); animation: fbIn .25s ease-out; }
@keyframes fbIn { from { opacity: 0; transform: translateY(6px); } }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.no { border-color: var(--red); background: var(--red-soft); }
.feedback.warn { border-color: var(--ink-2); background: #fff; font-weight: 700; }
.fb-head { font: 700 21px/1.3 var(--body); display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.fb-head b { font-family: var(--mono); }
.fb-why { margin: 0; font-size: 17px; }
.fb-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.mk { display: inline-block; width: 26px; height: 26px; border-radius: 50%; flex: none; position: relative; }
.mk-ok { background: var(--ok); }
.mk-ok::after { content: ''; position: absolute; left: 9px; top: 5px; width: 6px; height: 11px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
.mk-no { background: var(--red); }
.mk-no::before, .mk-no::after { content: ''; position: absolute; left: 6px; top: 11.5px; width: 14px; height: 3px; background: #fff; transform: rotate(45deg); }
.mk-no::after { transform: rotate(-45deg); }

/* ---------- bench ---------- */
.bench { display: grid; grid-template-columns: minmax(0, 1fr) 168px; grid-template-areas: 'stage lens' 'bar bar'; gap: 12px; }
.bench:not(.with-lens) { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'stage' 'bar'; }
.bench-stage { grid-area: stage; background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: var(--r); padding: 8px; min-width: 0; transition: box-shadow .2s; }
.bench-svg { display: block; width: 100%; height: auto; max-height: 64vh; touch-action: none; user-select: none; -webkit-user-select: none; }
.lens { grid-area: lens; border: 2.5px solid var(--ink); border-radius: var(--r); background: var(--paper-2); display: flex; flex-direction: column; overflow: hidden; align-self: start; }
.lens-head { font: 600 13px var(--mono); text-transform: uppercase; letter-spacing: .08em; background: var(--ink); color: var(--paper); padding: 6px 10px; }
.lens-svg { width: 100%; height: 190px; display: block; background: #fff; }
.lens-foot { font-size: 14px; padding: 6px 10px; color: var(--ink-2); border-top: 1.5px solid var(--grid); line-height: 1.3; }
.bench-bar { grid-area: bar; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.no-bar .bench-bar { display: none; }
.pour-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pour-what { font-size: 17px; }
.pour-line.hint .pour-what { color: var(--ink-2); }
.bench-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bench-msg { font-weight: 700; color: var(--red); opacity: 0; transition: opacity .2s; }
.bench-msg.show { opacity: 1; }
.locked .bench-bar, .locked .shelf { pointer-events: none; opacity: .5; }

.ctr { cursor: grab; }
.ctr:active { cursor: grabbing; }
.glass { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.glass.thin { stroke-width: 2.5; }
.glass-fill { fill: rgba(255, 255, 255, .7); }
.water { fill: var(--water); fill-opacity: .82; }
.water-top { stroke: var(--water-2); stroke-width: 2.5; }
.stream { fill: var(--water); fill-opacity: .9; }

path.cyl-foot { fill: var(--metal); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.tick { stroke: var(--ink); stroke-width: 1.6; }
.tick-major { stroke-width: 2.4; }
.tick-mid { stroke-width: 2; }
.tick-label { font: 600 17px var(--mono); fill: var(--ink); }
.unit-label { font: 600 14px var(--mono); fill: var(--ink-2); }
.full-mark { stroke: var(--red); stroke-width: 2; stroke-dasharray: 6 5; }
.marker { fill: var(--hl); }
.pencil-arrow { fill: var(--red); }
.pencil-line { stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 7 5; }
.pencil-line.thick { stroke-width: 4; stroke-dasharray: none; }
.pencil-dot { fill: var(--red); }
.ring { fill: none; stroke: var(--red); stroke-width: 3.5; animation: ring 1.4s ease-in-out infinite; }
@keyframes ring { 50% { stroke-opacity: .3; } }
.tag-dot { fill: var(--ink); }
.tag-letter { font: 700 18px var(--slab); fill: var(--paper); text-anchor: middle; dominant-baseline: middle; }
.tag-name { font: 700 16px var(--body); fill: var(--ink-2); dominant-baseline: middle; text-anchor: middle; }
.ctr.sel .glass { stroke: var(--red); }
.ctr.sel .tag-dot { fill: var(--red); }
.ctr.drop .glass-fill { fill: var(--hl); }
.ctr-name { transition: opacity .2s; }
.ctr.posed .ctr-name { opacity: 0; }

/* ---------- scale ---------- */
.scale-tool { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 320px); grid-template-areas: 'stage shelf' 'bar bar'; gap: 12px; align-items: start; }
.scale-stage { grid-area: stage; }
.shelf { grid-area: shelf; }
.scale-bar { grid-area: bar; }
@media (max-width: 760px) { .scale-tool { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'stage' 'shelf' 'bar'; } }
.scale-stage { background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: var(--r); padding: 6px; transition: background .2s; }
.pan-over .scale-stage { background: #FFF6D6; }
.scale-svg { display: block; width: 100%; height: auto; max-height: 60vh; touch-action: none; user-select: none; -webkit-user-select: none; }
.scale-body { fill: var(--metal); stroke: var(--ink); stroke-width: 3; }
.scale-stem { fill: var(--ink-2); }
.pan-plate { fill: #C9C0A8; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.dial-rim { fill: var(--ink); }
.dial-face { fill: #FFFDF6; stroke: var(--ink); stroke-width: 2; }
.dial-label { font: 600 19px var(--mono); fill: var(--ink); text-anchor: middle; }
.dial-unit { font: 700 18px var(--slab); fill: var(--ink-2); text-anchor: middle; }
.needle-body { fill: var(--red); }
.needle-hub { fill: var(--ink); }
.over .needle-body { fill: #8A1F12; }
.lcd { fill: var(--ink); }
.lcd-num { font: 600 54px var(--mono); fill: #F3EBD2; text-anchor: end; }
.lcd-num.small { font-size: 36px; }
.pan-obj { cursor: pointer; }
.obj-line { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
.obj-label { font-family: var(--mono); font-weight: 600; fill: var(--ink); text-anchor: middle; }
.shelf { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px; border: 2.5px dashed var(--ink-2); border-radius: var(--r); background: rgba(255, 253, 247, .7); }
.shelf-item { width: 92px; min-height: 96px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding: 6px 4px; cursor: grab; touch-action: none; font: 700 13px/1.2 var(--body); color: var(--ink); }
.shelf-item:hover { background: var(--hl); }
.shelf-item svg { width: 72px; height: 62px; overflow: visible; }
.shelf-item.used { opacity: .35; }
.drag-ghost { position: fixed; left: 0; top: 0; width: 80px; height: 80px; pointer-events: none; z-index: 60; filter: drop-shadow(3px 4px 0 rgba(31, 42, 68, .35)); }
.drag-ghost svg { width: 80px; height: 80px; overflow: visible; }

/* ---------- test ---------- */
.test-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.qdots { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.qd { width: 30px; height: 30px; border-radius: 6px; border: 2px solid var(--ink); background: var(--paper-2); cursor: pointer; padding: 0; }
.qd.done { background: var(--ink-2); }
.qd.on { outline: 3px solid var(--red); outline-offset: 1px; }
.timer { font-size: 30px; border: 2.5px solid var(--ink); border-radius: 10px; padding: 2px 14px; background: var(--paper-2); }
.timer.low { color: var(--red); border-color: var(--red); }
.finish { margin-top: 14px; width: 100%; }
.sheet { background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: var(--r); padding: clamp(20px, 4vw, 40px); box-shadow: 6px 6px 0 var(--ink); }
.sheet.narrow { max-width: 760px; }
.score-line { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; margin: 6px 0 22px; }
.score { font-size: 84px; line-height: 1; }
.score small { font-size: 40px; color: var(--muted); }
.score-pct { font-size: 34px; color: var(--water-2); }
.review { list-style: none; padding: 0; margin: 0 0 18px; border-top: 2px solid var(--ink); }
.review li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1.5px solid var(--grid); flex-wrap: wrap; font-weight: 700; }
.review-go { display: flex; gap: 8px; }
.all-good { font: 700 22px var(--slab); color: var(--ok); }
.qreview { list-style: none; padding: 0; margin: 0; counter-reset: q; }
.qreview li { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1.5px solid var(--grid); counter-increment: q; }
.qreview li::before { content: counter(q) '.'; font: 700 18px var(--mono); min-width: 30px; }
.qr-q { font-weight: 700; }
.qr-a, .qr-why { font-size: 16px; margin: 0 0 4px; }
.qr-why { color: var(--ink-2); }

/* ---------- progress ---------- */
.stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.stat { border: 2.5px solid var(--ink); border-radius: 12px; padding: 12px 18px; background: var(--paper-2); display: flex; flex-direction: column; font-weight: 700; min-width: 150px; }
.stat .num { font-size: 32px; }
.table-wrap { overflow-x: auto; margin-bottom: 12px; position: relative; }
table.topics, table.history { width: 100%; border-collapse: collapse; background: var(--paper-2); border: 2.5px solid var(--ink); }
.topics th, .topics td, .history th, .history td { padding: 12px 14px; border-bottom: 1.5px solid var(--grid); text-align: left; vertical-align: middle; }
.topics thead th, .history thead th { background: var(--ink); color: var(--paper); font: 600 14px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.topics tbody th { font-weight: 700; }
.topics tr.flag th { box-shadow: inset 5px 0 0 var(--red); }
.meter { display: inline-block; width: 120px; height: 14px; border: 2px solid var(--ink); border-radius: 7px; overflow: hidden; vertical-align: middle; margin-right: 8px; background: #fff; }
.meter span { display: block; height: 100%; background: var(--water); transition: width .4s ease-out; }
.reset-zone { margin-top: 30px; }

/* ---------- projector mode ---------- */
body.proj .top, body.proj .foot, body.proj .tool-head-r, body.proj .steps-dots { display: none; }
body.proj .main { max-width: none; padding: 16px 24px; }
body.proj .bench-svg, body.proj .scale-svg { max-height: 74vh; }
body.proj { font-size: 22px; }
body.proj .step-text { font-size: 24px; }
body.proj .btn { font-size: 21px; min-height: 58px; }
.proj-exit { position: fixed; right: 16px; top: 12px; z-index: 40; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .home { grid-template-columns: minmax(0, 1fr); }
  .play, .lesson .play { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  body { font-size: 17px; }
  .top { gap: 8px; padding: 10px 12px; position: static; }
  .nav { width: 100%; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; }
  .nav a { padding: 9px 0; font-size: 13.5px; text-align: center; }
  .lens-svg { height: 150px; }
  .bench { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'stage' 'lens' 'bar'; }
  .lens { flex-direction: row; align-items: stretch; }
  .lens-head { writing-mode: vertical-rl; transform: rotate(180deg); padding: 8px 4px; }
  .lens-svg { height: 120px; width: 50%; }
  .lens-foot { border-top: 0; border-left: 1.5px solid var(--grid); align-self: center; }
  .tiles { padding-left: 0; }
  .tile { width: 64px; height: 64px; }
  .log-row { grid-template-columns: 42px 1fr 22px; }
  .log-t { font-size: 24px; }
  .step-card { padding: 16px; }
  .btn-pour { min-width: 0; flex: 1; }
  .ans-input { font-size: 30px; }
  .shelf-item { width: 76px; min-height: 86px; }
  .shelf-item svg { width: 60px; height: 52px; }
  .meter { width: 70px; }
  .topics th, .topics td { padding: 10px 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print { .top, .foot, .bench-bar, .shelf { display: none; } }

<script>// Pure measuring math. Shared by the app, the worksheet builder, and the verify scripts.
// Every amount is an integer: liquid in mL, mass in g.
var Geom = (function () {
  // ---------- liquid containers ----------

  function bar(parts, total, unit) {
    var s = '<div class="barmodel">';
    if (total) s += '<div class="bm-total"><span>' + total + '</span></div>';
    s += '<div class="bm-row">' + parts.map(function (p) { return '<div class="bm-part' + (p.q ? ' q' : '') + '" style="flex:' + p.f + '">' + p.t + '</div>'; }).join('') + '</div></div>';
    return s;
  }
  var L = [];
  L.push({ id: 1, title: 'Liquid Volume: mL and L', goal: 'Know what milliliters and liters are.', steps: [
    { text: '<p><b>Liquid volume</b> is how much space a liquid takes up.</p><p>We measure it in <b>milliliters (mL)</b> and <b>liters (L)</b>.</p><div class="rule"><b>1 L = 1,000 mL</b></div>',
      tool: { type: 'bench', containers: [C('A', 'jug1000', 1000), C('B', 'bk250', 0), C('C', 'bk250', 0)] }, hl: { id: 'A', labels: true } },
    { text: '<p>Picture these to help you guess amounts:</p><ul class="bench-list"><li><span class="num">5 mL</span> a teaspoon</li><li><span class="num">200 mL</span> a juice box</li><li><span class="num">1 L</span> a big water bottle</li><li><span class="num">10 L</span> a bucket</li></ul>' },
    { text: '<p class="yt">Your turn</p><p>Drag jug A onto beaker B (or tap A, then tap B). Hold <b>Hold to pour</b> until beaker B is full at <b>250</b>.</p>', hl: { id: 'B', band: [200, 250] }, hlUI: '.bench-stage', task: { type: 'state', check: { vols: { B: 250 } } } },
    { text: '<p class="yt">Your turn</p><p>Now fill beaker C to 250 mL the same way.</p>', hl: { id: 'C', band: [200, 250] }, task: { type: 'state', check: { vols: { C: 250 } } } },
    { text: '<p>The jug started with 1,000 mL. You poured out 250 mL and 250 mL.</p><p class="yt">How much is left in the jug?</p>', hl: { id: 'A', labels: true }, task: { type: 'number', value: 500, unit: 'mL' }, explain: '250 + 250 = 500 mL went out. 1,000 − 500 = 500 mL is left. Look — the jug shows 500.' },
    { text: '<div class="rule"><p>Use <b>mL</b> for small amounts: a spoon, a cup, a bottle of glue.</p><p>Use <b>L</b> for big amounts: a bucket, a fish tank, a bathtub.</p></div><p>Pouring water from one container to another never changes how much water there is.</p>' },
  ] });
  L.push({ id: 2, title: 'What Is Each Mark Worth?', goal: 'Find the value of each mark before you read a scale.', steps: [
    { text: '<p>Before you read a scale, find out what <b>each mark</b> is worth. Not every scale counts by 1!</p><p>Look at the <b>numbers</b> first. On this cylinder they go 10, 20, 30… They go up by <b>10</b>.</p>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'cyl50', 0, { label: '' })] }, hl: { id: 'A', labels: true } },
    { text: '<p>Now count the <b>spaces</b> between 10 and 20 — count the gaps, not the lines.</p><p>There are <b>5 spaces</b>.</p>', hl: { id: 'A', band: [10, 20] } },
    { text: '<div class="rule"><p>Each mark = <b>(jump between numbers) ÷ (number of spaces)</b></p><p class="num big">10 ÷ 5 = 2</p></div><p>On this cylinder, each mark is worth <b>2 mL</b>.</p>', hl: { id: 'A', band: [10, 20] } },
    { text: '<p class="yt">Your turn</p><p>This cylinder counts by 20. Count the spaces between 20 and 40.</p><p>What is each mark worth?</p>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'cyl100', 0, { label: '' })] }, hl: { id: 'A', band: [20, 40] }, task: { type: 'number', value: 5, unit: 'mL' }, explain: 'The jump is 20 and there are 4 spaces. 20 ÷ 4 = 5 mL.' },
    { text: '<p class="yt">Your turn</p><p>This beaker counts by 50. What is each mark worth?</p>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'bk250', 0, { label: '' })] }, hl: { id: 'A', band: [50, 100] }, task: { type: 'number', value: 10, unit: 'mL' }, explain: 'The jump is 50 and there are 5 spaces. 50 ÷ 5 = 10 mL.' },
    { text: '<p class="yt">Your turn</p><p>This jug counts by 200. What is each mark worth?</p>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'jug1000', 0, { label: '' })] }, hl: { id: 'A', band: [200, 400] }, task: { type: 'number', value: 50, unit: 'mL' }, explain: 'The jump is 200 and there are 4 spaces. 200 ÷ 4 = 50 mL.' },
  ] });
  L.push({ id: 3, title: 'Reading a Beaker and Cylinder', goal: 'Read the water level on any scale.', steps: [
    { text: '<p>Read the water at its <b>flat top</b>. Keep your eyes level with the water, not above it.</p><p>The <b>Close-up</b> box shows the water level up close.</p>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'cyl100', 65, { label: '' })] }, hl: { id: 'A', level: 65 } },
    { text: '<p>Find the <b>number just below</b> the water. Here it is <b>60</b>.</p><p>Each mark is 5 mL (20 ÷ 4). The water is <b>1 mark</b> above 60.</p>', hl: { id: 'A', band: [60, 80] } },
    { text: '<p class="yt">Your turn</p><p>So how much water is in the cylinder?</p>', hl: { id: 'A', band: [60, 80] }, task: { type: 'number', value: 65, unit: 'mL' }, explain: '60 + 5 = 65 mL.' },
    { text: '<p class="yt">Your turn</p><p>Each mark on this jug is 50 mL. How much water is in it?</p>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'jug1000', 650, { label: '' })] }, task: { type: 'number', value: 650, unit: 'mL' }, explain: ex(P.jug1000, 650) },
    { text: '<p class="yt">Your turn</p><p>First find what each mark is worth. Then read the cylinder.</p>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'cyl200', 135, { label: '' })] }, task: { type: 'number', value: 135, unit: 'mL' }, explain: ex(P.cyl200, 135) },
    { text: '<p class="yt">Your turn</p><p>Now measure it yourself. Pour from beaker A into cylinder B to get exactly <b>40 mL</b>. Use <b>+1 mark</b> near the end.</p>',
      tool: { type: 'bench', containers: [C('A', 'bk250', 200), C('B', 'cyl50', 0)] }, hlUI: '.bench-stage', task: { type: 'state', check: { vols: { B: 40 } } }, explain: 'Each mark on the cylinder is 2 mL. 40 is a number on the scale, so stop right at the 40 line.' },
  ] });
  L.push({ id: 4, title: 'Mass: g and kg', goal: 'Know what grams and kilograms are.', steps: [
    { text: '<p><b>Mass</b> is how heavy something is.</p><p>We measure mass in <b>grams (g)</b> and <b>kilograms (kg)</b>.</p><div class="rule"><b>1 kg = 1,000 g</b></div><ul class="bench-list"><li><span class="num">1 g</span> a paper clip</li><li><span class="num">100 g</span> a small apple</li><li><span class="num">1 kg</span> a 1 L bottle of water</li></ul>',
      tool: { type: 'scale', mode: 'digital', unitToggle: true, shelf: weights([1, 10, 100, 500]), pan: [] } },
    { text: '<p class="yt">Your turn</p><p>Tap the weights or drag them onto the pan to make exactly <b>1,000 g</b>.</p>', hlUI: '.shelf', task: { type: 'state', check: { mass: 1000 } }, explain: 'For example 500 + 500 = 1,000 g, or 500 + 100 + 100 + 100 + 100 + 100.' },
    { text: '<p>Press <b>kg + g</b> under the scale. It now says <b>1 kg 000 g</b>.</p><p>1,000 grams and 1 kilogram are the same mass.</p>', hlUI: '.seg' },
    { text: '<p class="yt">Think</p><p>Which is heavier: 1 kg of rocks or 1,000 g of feathers?</p>', task: { type: 'choice', options: ['The rocks', 'The feathers', 'They are the same'], value: 'They are the same' }, explain: '1 kg = 1,000 g. Both have the same mass — the feathers just take up more space.' },
    { text: '<div class="rule"><p>Use <b>g</b> for light things: a pencil, a coin, an egg.</p><p>Use <b>kg</b> for heavy things: a backpack, a dog, a bag of rice.</p></div>' },
  ] });
  L.push({ id: 5, title: 'Reading a Dial Scale', goal: 'Read where the needle points.', steps: [
    { text: '<p>A dial scale has a <b>needle</b> that turns as you add mass.</p><p>Start the same way as before: look at the numbers. This dial goes 0, 200, 400… up by <b>200</b>.</p>',
      tool: { type: 'scale', mode: 'dial', dial: D.d1000, shelf: [S('mc', 'cube', 'sky', 350, 72, 'blue cube')], pan: ['mc'] }, hl: { band: [0, 1000] } },
    { text: '<p>Count the spaces between 200 and 400. There are <b>4</b>.</p><div class="rule"><span class="num big">200 ÷ 4 = 50</span></div><p>Each mark is <b>50 g</b>.</p>', hl: { band: [200, 400] } },
    { text: '<p class="yt">Your turn</p><p>The needle is past 200. Count the marks from 200 to the needle. What is the mass of the cube?</p>', hl: { needle: true }, task: { type: 'number', value: 350, unit: 'g' }, explain: exd(D.d1000, 350) },
    { text: '<p class="yt">Your turn</p><p>New dial! Find what each mark is worth, then read it.</p>',
      tool: { type: 'scale', mode: 'dial', dial: D.d500, shelf: [S('sp', 'sphere', 'sage', 230, 70, 'green ball')], pan: ['sp'] }, task: { type: 'number', value: 230, unit: 'g' }, explain: exd(D.d500, 230) },
    { text: '<p class="yt">Your turn</p><p>This dial shows <b>kilograms</b>. What is the mass of the prism?</p>',
      tool: { type: 'scale', mode: 'dial', dial: D.d10kg, shelf: [S('pr', 'prism', 'clay', 7000, 110, 'orange prism')], pan: ['pr'] }, task: { type: 'number', value: 7, unit: 'kg' }, explain: exd(D.d10kg, 7000) },
  ] });
  L.push({ id: 6, title: 'Compare and Order', goal: 'Measure to decide which is more.', steps: [
    { text: '<p>Which bottle holds more? Your eyes can trick you. <b>Measure</b> to be sure.</p><p class="yt">Your turn</p><p>Pour bottle A into beaker C. How much did A hold?</p>',
      tool: { type: 'bench', sink: true, containers: [U('A', 'cup', 240, 240, 150, 100, 'bottle A'), U('B', 'bottle', 300, 300, 62, 230, 'bottle B'), C('C', 'bk500y', 0)] }, task: { type: 'number', value: 240, unit: 'mL' }, explain: 'The beaker counts by 100 with 5 spaces, so each mark is 20 mL. The water is 2 marks past 200: 240 mL.' },
    { text: '<p class="yt">Your turn</p><p>Tap beaker C and press <b>Empty into sink</b>. Then pour bottle B into C. How much did B hold?</p>', task: { type: 'number', value: 300, unit: 'mL' }, explain: 'Bottle B fills the beaker to 300 mL.' },
    { text: '<p class="yt">Your turn</p><p>Which bottle holds more?</p>', task: { type: 'choice', options: ['Bottle A', 'Bottle B'], value: 'Bottle B' }, explain: '300 mL > 240 mL, so bottle B holds more — even though A looks bigger.' },
    { text: '<p class="yt">Your turn</p><p>Weigh each shape one at a time. Then tap them in order from <b>lightest</b> to <b>heaviest</b>.</p>',
      tool: { type: 'scale', mode: 'digital', shelf: [S('bb', 'sphere', 'sky', 90, 96, 'big ball'), S('sc', 'cube', 'slate', 240, 44, 'small cube'), S('cn', 'cone', 'butter', 150, 64, 'cone')], pan: [], maxItems: 1 },
      task: { type: 'order', items: ['big ball', 'small cube', 'cone'], value: ['big ball', 'cone', 'small cube'] }, explain: '90 g < 150 g < 240 g. The biggest shape is the lightest!' },
  ] });
  L.push({ id: 7, title: 'Word Problems with One Unit', goal: 'Add, subtract, multiply and divide amounts.', steps: [
    { text: '<p>Maya has <b>350 mL</b> of juice. She drinks <b>120 mL</b>. How much is left?</p>' + bar([{ f: 12, t: '120 mL drunk' }, { f: 23, t: '?', q: true }], '350 mL') + '<p>The whole is 350. One part is 120. Subtract to find the other part.</p>',
      tool: null, task: { type: 'number', value: 230, unit: 'mL' }, explain: '350 − 120 = 230 mL.' },
    { text: '<p class="yt">Your turn</p><p>Read both beakers. How much water is there altogether?</p>' + bar([{ f: 1, t: 'A' }, { f: 1, t: 'B' }], '?'),
      tool: { type: 'bench', containers: [C('A', 'bk250', 170), C('B', 'bk250', 80), C('C', 'jug1000', 0)] }, task: { type: 'number', value: 250, unit: 'mL' }, explain: '170 + 80 = 250 mL. Check it: pour both into the jug.' },
    { text: '<p class="yt">Your turn</p><p>Weigh one cube. How much would <b>5</b> cubes weigh? Put 5 on the scale to check.</p>',
      tool: { type: 'scale', mode: 'dial', dial: D.d500, shelf: [S('c40', 'cube', 'rose', 40, 48, 'cube', { copies: 99 })], pan: [] }, task: { type: 'number', value: 200, unit: 'g' }, explain: 'One cube is 40 g. 5 × 40 = 200 g.' },
    { text: '<p class="yt">Your turn</p><p>Share the 600 mL in jug A equally among beakers B, C and D. How much does each get?</p>' + bar([{ f: 1, t: '?' }, { f: 1, t: '?' }, { f: 1, t: '?' }], '600 mL'),
      tool: { type: 'bench', containers: [C('A', 'jug1000', 600), C('B', 'bk250', 0), C('C', 'bk250', 0), C('D', 'bk250', 0)] }, task: { type: 'number', value: 200, unit: 'mL' }, explain: '600 ÷ 3 = 200 mL each. Pour 200 mL into each beaker to check.' },
  ] });
  L.push({ id: 8, title: 'Convert L and mL', grade: 4, goal: 'Write liters as milliliters.', steps: [
    { text: '<p>1 liter is 1,000 milliliters. To change L to mL, <b>multiply by 1,000</b>.</p><table class="conv"><tr><th>L</th><th>mL</th></tr><tr><td>1</td><td>1,000</td></tr><tr><td>2</td><td>2,000</td></tr><tr><td>3</td><td>3,000</td></tr><tr><td>5</td><td>5,000</td></tr></table>',
      tool: { type: 'bench', bar: false, drag: false, containers: [C('A', 'jug2000L', 1000, { label: '' })] }, hl: { id: 'A', level: 1000 } },
    { text: '<p>The water is at <b>1 L</b>, which is 1,000 mL.</p><p>Between 1 L and 2 L there are <b>10 spaces</b>. Each mark is 1,000 ÷ 10 = <b>100 mL</b>.</p>', hl: { id: 'A', band: [1000, 2000] } },
    { text: '<p class="yt">Your turn</p><p>How much water is in the jug now? Write it in <b>mL</b>.</p>',

      $$('[data-unit]', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-unit') === input.unit); });
      $$('[data-c]', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-c') === input.choice); b.setAttribute('aria-pressed', b.getAttribute('data-c') === input.choice); });
      $$('[data-o]', box).forEach(function (b) { var i = input.order.indexOf(b.getAttribute('data-o')); b.classList.toggle('on', i >= 0); $('.ord', b).textContent = i >= 0 ? i + 1 : ''; });
      if (inp && inp.value !== input.num) inp.value = input.num;
    }
    function clearFb() { var f = $('.feedback', box); if (f && !box.classList.contains('locked')) { f.innerHTML = ''; f.className = 'feedback'; } }
    function missing() {
      if ((a.type === 'number' || a.type === 'numunit' || a.type === 'state+number') && !input.num) return 'Type a number first.';
      if (a.type === 'numunit' && !input.unit) return 'Choose a unit.';
      if (a.type === 'choice' && !input.choice) return 'Choose an answer.';
      if (a.type === 'order' && input.order.length < a.items.length) return 'Tap all ' + a.items.length + ' shapes in order.';
      return null;
    }
    function evaluate() {
      var tool = getTool(), n = Geom.parseNum(input.num);
      switch (a.type) {
        case 'number': return { ok: n === a.value };
        case 'numunit': return { ok: n === a.value && input.unit === a.unit, unitWrong: n === a.value && input.unit !== a.unit };
        case 'choice': return { ok: input.choice === a.value };
        case 'order': return { ok: input.order.join('|') === a.value.join('|') };
        case 'state': return { ok: checkState(a.check, tool) };
        case 'state+number': { var st = checkState(a.check, tool); return { ok: st && n === a.value, stateWrong: !st }; }
      }
      return { ok: false };
    }
    function check() {
      var m = missing(), f = $('.feedback', box);

      var r = evaluate();

    }
    function show(r, explainHtml, extra) {
      var f = $('.feedback', box); if (!f) return;

        : '<p class="fb-head"><span class="mk mk-no" aria-hidden="true"></span>' + (r.stateWrong && a.checkMsg ? esc(a.checkMsg) : r.unitWrong ? 'Right number, wrong unit.' : 'Not quite.') + (extra && extra.reveal ? ' The answer is <b>' + esc(answerText(a)) + '</b>.' : '') + '</p>';
      f.innerHTML = head + (explainHtml ? '<p class="fb-why">' + explainHtml + '</p>' : '') + (extra && extra.buttons ? '<div class="fb-btns">' + extra.buttons + '</div>' : '');
      return f;
    }
    var api = {
      box: box, evaluate: evaluate, missing: missing, show: show,
      get: function () { return clone(input); },
      set: function (v) { if (v) { input = clone(v); paint(); } },
      lock: function () { box.classList.add('locked'); $$('input,button.choice,.seg-b,[data-clear],[data-check]', box).forEach(function (b) { b.disabled = true; }); },
      focus: function () { if (inp && window.matchMedia('(pointer:fine)').matches) inp.focus(); },
    };
    return api;
  }

  function Lesson(id, stepIx) {
    var L = ML.LESSONS.filter(function (l) { return l.id === id; })[0];

    var toolCfg = null, solved = {}, tries = 0, skipArmed = false, ans = null;
    // find which tool is active at a given step (inherit from earlier steps)

        '<div class="step-nav"><button class="btn ghost" id="back"' + (stepIx === 0 ? ' hidden' : '') + '>Back</button><button class="btn primary" id="next">' + (stepIx === L.steps.length - 1 ? 'Finish lesson' : 'Next') + '</button></div>';

    function store_() {
      if (!panel) return;
      var q = test.qs[test.i];
      test.saved[test.i] = { input: panel.get(), snap: toolSnapshot(current.tool) };
      var m = panel.missing(), r = panel.evaluate();
      var init = q.tool.type === 'scale' ? { pan: q.tool.pan || [] } : { vols: q.tool.containers.map(function (c) { return c.vol || 0; }) };
      var answered = q.answer.type === 'state' ? JSON.stringify(test.saved[test.i].snap) !== JSON.stringify(init) : m == null;
      test.res[test.i] = { ok: r.ok, answered: answered, input: panel.get() };
    }
    function show(i) {
      test.i = i; var q = test.qs[i];
      teardownTool();
      var cfg = test.saved[i] ? applySnapshot(q.tool, test.saved[i].snap) : q.tool;
      current.tool = makeTool($('#tool'), cfg);
      $('#qn').textContent = 'Question ' + (i + 1) + ' of ' + test.qs.length;
      $('#qp').innerHTML = q.prompt;
      $('#ans').innerHTML = '';
      panel = AnswerPanel($('#ans'), q.answer, function () { return current.tool; }, { mode: 'test' });
      if (test.saved[i]) panel.set(test.saved[i].input);
      $('#prev').hidden = i === 0;
      $('#next').textContent = i === test.qs.length - 1 ? 'Finish test' : 'Next';
      $('#qdots').innerHTML = test.qs.map(function (_, k) { return '<button class="qd' + (k === i ? ' on' : '') + (test.res[k] && test.res[k].answered ? ' done' : '') + '" data-k="' + k + '" aria-label="Question ' + (k + 1) + '"></button>'; }).join('');
      $$('#qdots .qd').forEach(function (b) { b.onclick = function () { store_(); show(+b.getAttribute('data-k')); }; });
      panel.focus();
    }
    $('#prev').onclick = function () { store_(); show(test.i - 1); };
    $('#next').onclick = function () { store_(); if (test.i === test.qs.length - 1) confirmFinish(); else show(test.i + 1); };
    $('#fin').onclick = function () { store_(); confirmFinish(); };
    function confirmFinish() {
      var left = test.qs.length - test.res.filter(function (r) { return r && r.answered; }).length;
      if (left > 0) {
        var c = $('#card .confirm'); if (c) { finish(false); return; }
        var d = document.createElement('p'); d.className = 'confirm nudge'; d.textContent = left + ' question' + (left > 1 ? 's are' : ' is') + ' not answered yet. Press Finish test again to hand it in.'; $('#card').appendChild(d);
        return;
      }
      finish(false);
    }
    function finish(timeUp) {
      clearInterval(current.timer); current.timer = null;
      test.done = true; test.timeUp = timeUp; test.secs = Math.min(TEST_SECS, Math.round((Date.now() - test.start) / 1000));
      var topics = {};
      test.qs.forEach(function (q, k) { var t = topics[q.topic] || (topics[q.topic] = [0, 0]); t[1]++; if (test.res[k] && test.res[k].ok) t[0]++; });
      test.score = test.res.filter(function (r) { return r && r.ok; }).length; test.topics = topics;
      store.tests.push({ at: Date.now(), grade: test.grade, score: test.score, total: test.qs.length, secs: test.secs, topics: topics });
      if (store.tests.length > 30) store.tests.shift();
      save();
      nav('test/results');
    }
    show(test.i);
  }
  function TestResults() {
    if (!test || !test.done) return nav('test');
    var pct = Math.round(test.score / test.qs.length * 100);
    var weak = ML.TOPICS.filter(function (t) { var s = test.topics[t.id]; return s && s[0] / s[1] < 0.7; });
    page('list results', '<section class="sheet"><p class="eyebrow">Test results · Grade ' + test.grade + (test.timeUp ? ' · time ran out' : '') + '</p>' +
      '<div class="score-line"><span class="score num">' + test.score + '<small>/' + test.qs.length + '</small></span><span class="score-pct num">' + pct + '%</span><span class="muted">' + Math.floor(test.secs / 60) + ' min ' + (test.secs % 60) + ' s</span></div>' +
      (weak.length ? '<h2>Review these topics</h2><ul class="review">' + weak.map(function (t) { var s = test.topics[t.id]; return '<li><span>' + t.name + ' <span class="num muted">' + s[0] + '/' + s[1] + '</span></span><span class="review-go"><a class="btn sm" href="#learn/' + t.lesson + '">Lesson ' + t.lesson + '</a><a class="btn sm" href="#practice/' + t.set + '1">Practice set ' + t.set + '</a></span></li>'; }).join('') + '</ul>' : '<p class="all-good">Every topic was 70% or higher. Great measuring!</p>') +
      '<div class="step-nav"><button class="btn primary" id="again">New test</button><a class="btn ghost" href="#progress">Progress dashboard</a></div>' +
      '<h2>Every question</h2><ol class="qreview">' + test.qs.map(function (q, k) {
        var r = test.res[k] || { ok: false }, inp = r.input || {};
        var yours = q.answer.type === 'state' ? (r.answered ? 'used the tool' : '—') : q.answer.type === 'choice' ? (inp.choice || '—') : q.answer.type === 'order' ? ((inp.order || []).join(' → ') || '—') : (inp.num ? inp.num + ' ' + (inp.unit || q.answer.unit) : '—');
        return '<li class="' + (r.ok ? 'ok' : 'no') + '"><span class="mk ' + (r.ok ? 'mk-ok' : 'mk-no') + '" aria-hidden="true"></span><div><p class="qr-q">' + q.prompt + '</p><p class="qr-a">Your answer: <b>' + esc(yours) + '</b>' + (r.ok ? '' : ' · Correct: <b>' + esc(answerText(q.answer)) + '</b>') + '</p><p class="qr-why">' + q.explain + '</p></div></li>';
      }).join('') + '</ol></section>');
    $('#again').onclick = function () { test = { grade: test.grade, qs: ML.makeTest(test.grade), i: 0, saved: [], res: [], start: Date.now(), done: false }; nav('test/run'); };
  }

  // ---------------------------------------------------------------- PROGRESS
  function Progress() {
    var lastTest = store.tests[store.tests.length - 1];
    var rows = ML.TOPICS.map(function (t) {
      var ts = ML.TASKS.filter(function (x) { return x.set === t.set; });
      var tried = ts.filter(function (x) { return store.practice[x.id]; }), ok = tried.filter(function (x) { return store.practice[x.id].ok; });
      var tt = lastTest && lastTest.topics[t.id];
      var pPct = ts.length ? Math.round(tried.length / ts.length * 100) : 0;
      var acc = tried.length ? Math.round(ok.length / tried.length * 100) : null;
      var tp = tt ? Math.round(tt[0] / tt[1] * 100) : null;
      var flag = (acc != null && acc < 70) || (tp != null && tp < 70);
      return '<tr' + (flag ? ' class="flag"' : '') + '><th scope="row">' + t.name + (t.grade === 4 ? ' <span class="tag g4">Gr 4</span>' : '') + '</th>' +
        '<td><div class="meter" aria-label="' + tried.length + ' of ' + ts.length + ' done"><span style="width:' + pPct + '%"></span></div><span class="num small">' + tried.length + '/' + ts.length + '</span></td>' +
        '<td class="num">' + (acc == null ? '—' : acc + '%') + '</td><td class="num">' + (tp == null ? '—' : tp + '%') + '</td>' +
        '<td>' + (flag ? '<a class="btn sm" href="#learn/' + t.lesson + '">Review</a>' : '') + '</td></tr>';
    }).join('');
    var lessonsDone = ML.LESSONS.filter(function (l) { return store.lessons[l.id]; }).length;
    var pDone = ML.TASKS.filter(function (t) { return store.practice[t.id]; }).length;
    page('list', '<div class="list-head"><p class="eyebrow">Progress</p><h1>Your lab record</h1><p class="lede">Scores are saved only on this device.</p></div>' +
      '<div class="stats"><div class="stat"><span class="num">' + lessonsDone + '/10</span>lessons</div><div class="stat"><span class="num">' + pDone + '/40</span>practice tasks</div><div class="stat"><span class="num">' + (lastTest ? lastTest.score + '/' + lastTest.total : '—') + '</span>last test</div></div>' +
      '<div class="table-wrap"><table class="topics"><thead><tr><th scope="col">Topic</th><th scope="col">Practice done</th><th scope="col">Practice correct</th><th scope="col">Last test</th><th scope="col"><span class="sr">Action</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="muted small">Practice correct counts first tries. Topics under 70% are marked so you know what to review.</p>' +
      (store.tests.length ? '<h2>Test history</h2><div class="table-wrap"><table class="history"><thead><tr><th scope="col">Date</th><th scope="col">Level</th><th scope="col">Score</th><th scope="col">Time</th></tr></thead><tbody>' + store.tests.slice().reverse().slice(0, 10).map(function (t) { var d = new Date(t.at); return '<tr><td>' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</td><td>Grade ' + t.grade + '</td><td class="num">' + t.score + '/' + t.total + '</td><td class="num">' + Math.floor(t.secs / 60) + ':' + String(t.secs % 60).padStart(2, '0') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
      '<div class="reset-zone"><button class="btn ghost sm" id="reset">Reset all scores on this device</button></div>');
    $('#reset').onclick = function () {
      var b = $('#reset');
      if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Press again to erase all scores'; b.classList.add('danger'); return; }
      store = { grade: store.grade, practice: {}, lessons: {}, tests: [] }; save(); Progress();
    };
  }

  // ---------------------------------------------------------------- boot
  if (FREE) document.body.classList.add('free');
  window.__ML = { store: function () { return store; }, tool: function () { return current.tool; }, test: function () { return test; }, nav: nav, ML: ML, Geom: Geom, Tools: Tools };
  route_();
})();
</script>
</body>

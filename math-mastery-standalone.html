 A should remove 3 stones, leaving 25 for the opponent.`],competitionTip:`For moves {3, 5}, three consecutive pile sizes (0, 1, 2) are automatically losing — always check ALL sizes smaller than the smallest move before trusting a pattern.`,commonMistake:`Only checking pile size 0 as losing and missing that 1 and 2 stones are ALSO automatically losing (since neither a 3-stone nor 5-stone move is legal there).`},th:{question:`ผู้เล่นสองคนผลัดกันหยิบก้อนหิน 3 หรือ 5 ก้อน จากกองที่มี 28 ก้อน ผู้ที่หยิบก้อนสุดท้ายเป็นผู้ชนะ (ผู้ที่เดินไม่ได้ — เพราะเหลือ 0, 1 หรือ 2 ก้อน — เป็นผู้แพ้) ถ้า A เริ่มก่อนและทั้งสองเล่นสมบูรณ์แบบ A ควรหยิบกี่ก้อนในตาแรก — 3 หรือ 5 (ตอบ 3 หรือ 5)`,hint1:`สร้างตารางแพ้/ชนะสำหรับกองขนาดเล็ก เริ่มจาก 0, 1 และ 2 ก้อน (แพ้ทั้งหมด เพราะเดินไม่ได้เลย)`,hint2:`หารูปแบบที่วนซ้ำในสถานะแพ้ก่อนที่จะกระโดดไปที่ 28`,quickIdea:`สร้างตารางแพ้/ชนะด้วยมือ หารูปแบบที่วนซ้ำ แล้วนำไปใช้กับขนาดกองเป้าหมาย`,steps:[`สร้างตาราง (L = แพ้สำหรับผู้ที่ต้องเดิน): สถานะแพ้เกิดที่ 0, 1, 2, 8, 9, 10, 16, 17, 18, 24, 25, 26 รูปแบบคือ "เศษ 0, 1 หรือ 2 เมื่อหารด้วย 8"`,`28 ÷ 8 = 3 เศษ 4 ดังนั้น 28 เป็นสถานะชนะ มีการเดินแรกที่ดีอยู่`,`จาก 28 หยิบ 3 เหลือ 25 (25÷8 เศษ1 เป็นสถานะแพ้ของคู่ต่อสู้ ดี) หยิบ 5 เหลือ 23 (23÷8 เศษ7 เป็นสถานะชนะของคู่ต่อสู้ ไม่ดี)`,`ดังนั้น A ควรหยิบ 3 ก้อน เหลือ 25 ให้คู่ต่อสู้`],competitionTip:`สำหรับการเดิน {3, 5} ขนาดกองสามค่าติดกัน (0, 1, 2) เป็นสถานะแพ้โดยอัตโนมัติ ตรวจทุกขนาดที่เล็กกว่าการเดินที่เล็กที่สุดก่อนเชื่อรูปแบบเสมอ`,commonMistake:`ตรวจเฉพาะขนาดกอง 0 ว่าแพ้ และพลาดว่า 1 กับ 2 ก้อนก็เป็นสถานะแพ้โดยอัตโนมัติเช่นกัน (เพราะหยิบ3หรือ5ก้อนจากกองนั้นไม่ได้เลย)`},correctAnswer:`3`,acceptedAnswers:[`3`,`3.0`],verificationStatus:`verified`},{id:`M5-C-23`,mockSet:5,section:`C`,questionNumber:23,marks:6,difficulty:`challenge`,topic:`Intersections`,subskill:`maximum intersections of lines and circles, balanced counts`,type:`free-response`,en:{question:`What is the maximum number of points at which 3 distinct straight lines and 3 distinct circles can intersect each other, all together? (Count line-line, line-circle, and circle-circle intersections. Do not count a curve crossing itself.) (Enter a whole number.)`,hint1:`There are three pair-types here: line-line, line-circle, and circle-circle. Handle each separately.`,hint2:`Two lines cross at most 1 point; a line and a circle cross at most 2 points; two circles cross at most 2 points.`,quickIdea:`Split into pair types, find the maximum for each, then add all totals.`,steps:[`Line-line: C(3,2) = 3 pairs, 1 point each → 3.`,`Line-circle: 3 lines × 3 circles = 9 pairs, 2 points each → 18.`,`Circle-circle: C(3,2) = 3 pairs, 2 points each → 6.`,`Maximum total = 3 + 18 + 6 = 27.`],competitionTip:`With equal numbers of lines and circles, it’s easy to mix up which pair-count formula belongs to which type — always relabel clearly before computing.`,commonMistake:`Using C(3,2) for the line-circle pairs (which is for pairs WITHIN one group) instead of the product 3×3 (for pairs BETWEEN two different groups).`},th:{question:`จำนวนจุดตัดที่มากที่สุดที่เป็นไปได้ เมื่อเส้นตรง 3 เส้นที่แตกต่างกันและวงกลม 3 วงที่แตกต่างกันตัดกันทั้งหมด คือเท่าไร (นับจุดตัดเส้น-เส้น, เส้น-วงกลม, และวงกลม-วงกลม ไม่นับเส้นโค้งตัดตัวเอง) (ตอบเป็นจำนวนเต็ม)`,hint1:`มีสามประเภทคู่ที่นี่: เส้น-เส้น, เส้น-วงกลม, และวงกลม-วงกลม จัดการแต่ละประเภทแยกกัน`,hint2:`เส้นสองเส้นตัดกันได้มากที่สุด 1 จุด เส้นกับวงกลมตัดกันได้มากที่สุด 2 จุด วงกลมสองวงตัดกันได้มากที่สุด 2 จุด`,quickIdea:`แบ่งเป็นประเภทคู่ หาค่าสูงสุดของแต่ละประเภท แล้วบวกผลรวมทั้งหมด`,steps:[`เส้น-เส้น: C(3,2) = 3 คู่ คู่ละ1จุด → 3`,`เส้น-วงกลม: เส้น3×วงกลม3 = 9 คู่ คู่ละ2จุด → 18`,`วงกลม-วงกลม: C(3,2) = 3 คู่ คู่ละ2จุด → 6`,`ผลรวมสูงสุด = 3 + 18 + 6 = 27`],competitionTip:`เมื่อจำนวนเส้นและวงกลมเท่ากัน ง่ายที่จะสับสนว่าสูตรนับคู่แบบใดเป็นของประเภทใด ตั้งชื่อให้ชัดเจนก่อนคำนวณเสมอ`,commonMistake:`ใช้ C(3,2) สำหรับคู่เส้น-วงกลม (ซึ่งใช้กับคู่ภายในกลุ่มเดียวกัน) แทนที่จะเป็นผลคูณ 3×3 (สำหรับคู่ระหว่างสองกลุ่มที่ต่างกัน)`},correctAnswer:`27`,acceptedAnswers:[`27`,`27.0`],verificationStatus:`verified`},{id:`M5-C-24`,mockSet:5,section:`C`,questionNumber:24,marks:6,difficulty:`challenge`,topic:`Cube & Spatial Reasoning`,subskill:`total painted faces across all unit cubes (surface area invariant)`,type:`free-response`,en:{question:`A rectangular block measuring 4×3×2 (built from 24 unit cubes) has its outside completely painted, then is taken apart into the 24 unit cubes. If you count the total number of painted faces across ALL the unit cubes combined, what is that total? (Enter a whole number.)`,hint1:`Every painted unit-cube face was originally part of the big block’s OUTER surface — painting happens before cutting.`,hint2:`The total number of painted small faces must equal the total surface area of the original block, measured in unit squares.`,quickIdea:`Since cutting doesn’t add or remove paint, the total painted-face count equals the original block’s surface area.`,steps:[`Surface area of a block = 2 × (length×width + length×height + width×height).`,`2 × (4×3 + 4×2 + 3×2) = 2 × (12 + 8 + 6) = 2 × 26 = 52.`],whyOthersFail:`Checking by category: corners 8×3=24, edges 12×2=24 (using 4[(4-2)+(3-2)+(2-2)]=12 edge cubes), faces 4×1=4 (using 2[(2×1)+(1×0)+(2×0)]=4 face cubes), interior 0×0=0. Total = 24+24+4+0 = 52 ✓, matching the surface-area shortcut exactly.`,competitionTip:`This is a powerful shortcut: the total painted-face count across all small pieces ALWAYS equals the original shape’s surface area — no need to categorize every cube individually.`,commonMistake:`Trying to categorize every one of the 24 cubes by corner/edge/face/interior and sum their painted faces one group at a time, instead of using the much faster surface-area shortcut.`},th:{question:`บล็อกสี่เหลี่ยมขนาด 4×3×2 (สร้างจากลูกบาศก์หน่วย 24 ก้อน) มีผิวนอกถูกทาสีทั้งหมด แล้วแยกออกเป็นลูกบาศก์หน่วย 24 ก้อน ถ้านับจำนวนหน้าที่ถูกทาสีรวมของลูกบาศก์ทั้งหมด ผลรวมนั้นคือเท่าไร (ตอบเป็นจำนวนเต็ม)`,hint1:`ทุกหน้าลูกบาศก์เล็กที่ถูกทาสีเดิมเป็นส่วนหนึ่งของผิวนอกของบล็อกใหญ่ การทาสีเกิดขึ้นก่อนการตัด`,hint2:`จำนวนหน้าเล็กที่ถูกทาสีรวมต้องเท่ากับพื้นที่ผิวรวมของบล็อกเดิม วัดเป็นหน่วยสี่เหลี่ยม`,quickIdea:`เนื่องจากการตัดไม่เพิ่มหรือลดสี จำนวนหน้าที่ถูกทาสีรวมเท่ากับพื้นที่ผิวของบล็อกเดิม`,steps:[`พื้นที่ผิวของบล็อก = 2 × (ยาว×กว้าง + ยาว×สูง + กว้าง×สูง)`,`2 × (4×3 + 4×2 + 3×2) = 2 × (12 + 8 + 6) = 2 × 26 = 52`],whyOthersFail:`ตรวจตามหมวด: มุม 8×3=24, ขอบ 12×2=24 (ใช้ 4[(4-2)+(3-2)+(2-2)]=12 ก้อนขอบ), หน้า 4×1=4 (ใช้ 2[(2×1)+(1×0)+(2×0)]=4 ก้อนหน้า), ตรงกลาง 0×0=0 รวม = 24+24+4+0 = 52 ✓ ตรงกับทางลัดพื้นที่ผิวพอดี`,competitionTip:`นี่เป็นทางลัดที่ทรงพลัง: จำนวนหน้าที่ถูกทาสีรวมของชิ้นเล็กทั้งหมดเท่ากับพื้นที่ผิวของรูปเดิมเสมอ ไม่ต้องจัดประเภทลูกบาศก์แต่ละก้อน`,commonMistake:`พยายามจัดประเภทลูกบาศก์ทั้ง 24 ก้อนตามมุม/ขอบ/หน้า/ตรงกลาง แล้วบวกหน้าที่ทาสีทีละกลุ่ม แทนที่จะใช้ทางลัดพื้นที่ผิวที่เร็วกว่ามาก`},correctAnswer:`52`,acceptedAnswers:[`52`,`52.0`],verificationStatus:`verified`},{id:`M5-C-25`,mockSet:5,section:`C`,questionNumber:25,marks:6,difficulty:`challenge`,topic:`Word Problems`,subskill:`partnership profit-sharing ratio`,type:`free-response`,en:{question:`Anan and Boonmee start a business together. Anan invests $6000 and Boonmee invests $9000. After 4 months, Chai joins by investing $12000. At the end of the year (12 months from the start), a total profit of $46000 is shared in proportion to (investment × number of months invested). How much profit does Chai receive? (Enter a whole number.)`,hint1:`Each person’s "share" of the investment isn’t just their dollar amount — it’s their dollar amount MULTIPLIED by how many months they had it invested.`,hint2:`Chai joined 4 months late, so Chai’s money was invested for only 12 − 4 = 8 months.`,quickIdea:`For partnership problems with different start times, compute "investment × months" for each person, then split the profit using that ratio.`,steps:[`Anan: $6000 × 12 months = 72000 (investment-months).`,`Boonmee: $9000 × 12 months = 108000.`,`Chai: $12000 × 8 months (12 − 4) = 96000.`,`Total investment-months = 72000 + 108000 + 96000 = 276000. Ratio simplifies (÷12000): 6 : 9 : 8, total 23 parts.`,`Each part = $46000 ÷ 23 = $2000. Chai’s share = 8 × $2000 = $16000.`],competitionTip:`Always check that Chai’s months-invested is (total time − time before joining), not the full 12 months — late joiners get a smaller time-weight.`,commonMistake:`Splitting the profit using only the raw investment amounts (6000:9000:12000) without weighting by the number of months each person’s money was actually invested.`},th:{question:`อานันท์และบุญมีเริ่มธุรกิจร่วมกัน อานันท์ลงทุน $6000 และบุญมีลงทุน $9000 หลังจาก 4 เดือน ชัยเข้าร่วมโดยลงทุน $12000 เมื่อสิ้นปี (12 เดือนจากเริ่มต้น) กำไรรวม $46000 ถูกแบ่งตามสัดส่วนของ (เงินลงทุน × จำนวนเดือนที่ลงทุน) ชัยได้รับกำไรเท่าไร (ตอบเป็นจำนวนเต็ม)`,hint1:`"ส่วนแบ่ง" ของการลงทุนแต่ละคนไม่ใช่แค่จำนวนเงิน แต่คือจำนวนเงินคูณด้วยจำนวนเดือนที่ลงทุนไว้`,hint2:`ชัยเข้าร่วมช้าไป 4 เดือน ดังนั้นเงินของชัยลงทุนเพียง 12 − 4 = 8 เดือน`,quickIdea:`สำหรับโจทย์หุ้นส่วนที่เริ่มต่างเวลากัน คำนวณ "เงินลงทุน × เดือน" ของแต่ละคน แล้วแบ่งกำไรตามอัตราส่วนนั้น`,steps:[`อานันท์: $6000 × 12 เดือน = 72000 (หน่วยเงิน-เดือน)`,`บุญมี: $9000 × 12 เดือน = 108000`,`ชัย: $12000 × 8 เดือน (12 − 4) = 96000`,`รวมหน่วยเงิน-เดือน = 72000 + 108000 + 96000 = 276000 อัตราส่วนลดรูป (÷12000): 6 : 9 : 8 รวม 23 ส่วน`,`แต่ละส่วน = $46000 ÷ 23 = $2000 ส่วนแบ่งของชัย = 8 × $2000 = $16000`],competitionTip:`ตรวจสอบเสมอว่าจำนวนเดือนที่ชัยลงทุนคือ (เวลารวม − เวลาก่อนเข้าร่วม) ไม่ใช่เต็ม 12 เดือน ผู้เข้าร่วมทีหลังได้น้ำหนักเวลาน้อยกว่า`,commonMistake:`แบ่งกำไรโดยใช้จำนวนเงินลงทุนดิบเท่านั้น (6000:9000:12000) โดยไม่ถ่วงน้ำหนักด้วยจำนวนเดือนที่เงินของแต่ละคนลงทุนจริง`},correctAnswer:`16000`,acceptedAnswers:[`16000`,`16000.0`],verificationStatus:`verified`}],Vr={set:5,title:{en:`Mock Test 5`,th:`ข้อสอบจำลองชุดที่ 5`},estimatedMinutes:60},Hr=[{id:`number-sense`,number:1,title:{en:`Number Sense & Working Backwards`,th:`ความรู้สึกเชิงจำนวนและการย้อนคิด`},objective:{en:`Learn to work backwards through number machines and chains of mixed operations by reversing each step in the opposite order.`,th:`เรียนรู้การย้อนคิดผ่านเครื่องคิดเลขและลำดับการดำเนินการผสม โดยย้อนแต่ละขั้นตอนสลับลำดับ`},explanation:{en:[`A "number machine" applies operations to an input, one after another, to produce an output.`,`To find the input from the output, reverse EVERY step — and reverse the ORDER too.`,`Undo addition with subtraction, subtraction with addition, multiplication with division, and division with multiplication.`],th:[`"เครื่องคิดเลข" ทำการดำเนินการกับค่าเริ่มต้นทีละขั้นเพื่อให้ได้ผลลัพธ์`,`การหาค่าเริ่มต้นจากผลลัพธ์ ต้องย้อนทุกขั้นตอน และย้อนลำดับด้วย`,`ย้อนการบวกด้วยการลบ ย้อนการลบด้วยการบวก ย้อนการคูณด้วยการหาร และย้อนการหารด้วยการคูณ`]},visual:{kind:`number-machine`,props:{input:`?`,ops:[`×4`,`−9`],output:`23`}},rule:{en:`To undo a chain of operations, reverse both the ORDER and the OPERATION of every step.`,th:`การย้อนลำดับการดำเนินการ ต้องย้อนทั้ง "ลำดับ" และ "การกระทำ" ของทุกขั้นตอน`},examples:[{en:[`Worked Example 1: A number is multiplied by 4, then 9 is subtracted, giving 23. Find the original number.`,`Reverse "−9" by adding 9: 23 + 9 = 32.`,`Reverse "×4" by dividing by 4: 32 ÷ 4 = 8.`,`Check: 8 × 4 = 32, then 32 − 9 = 23. ✓ Original number = 8.`],th:[`ตัวอย่างที่ 1: จำนวนหนึ่งถูกคูณด้วย 4 แล้วลบ 9 ได้ผลลัพธ์ 23 จำนวนเดิมคือเท่าไร`,`ย้อน "−9" โดยบวก 9: 23 + 9 = 32`,`ย้อน "×4" โดยหารด้วย 4: 32 ÷ 4 = 8`,`ตรวจสอบ: 8 × 4 = 32 แล้ว 32 − 9 = 23 ✓ จำนวนเดิม = 8`]},{en:[`Worked Example 2: A number machine: input → +15 → ÷5 → output = 9. Find the input.`,`Reverse "÷5" by multiplying by 5: 9 × 5 = 45.`,`Reverse "+15" by subtracting 15: 45 − 15 = 30.`,`Check: 30 + 15 = 45, then 45 ÷ 5 = 9. ✓ Input = 30.`],th:[`ตัวอย่างที่ 2: เครื่องคิดเลข: ค่าเริ่มต้น → +15 → ÷5 → ผลลัพธ์ = 9 หาค่าเริ่มต้น`,`ย้อน "÷5" โดยคูณ 5: 9 × 5 = 45`,`ย้อน "+15" โดยลบ 15: 45 − 15 = 30`,`ตรวจสอบ: 30 + 15 = 45 แล้ว 45 ÷ 5 = 9 ✓ ค่าเริ่มต้น = 30`]}],commonMistake:{en:`Reversing the steps in the SAME order they were applied, instead of the opposite order.`,th:`ย้อนขั้นตอนตามลำดับเดิมที่ทำไป แทนที่จะย้อนสลับลำดับ`},quickCheck:{en:{question:`A number is halved, then 6 is added, to give 20. What was the original number?`,options:[`28`,`14`,`26`,`34`]},th:{question:`จำนวนหนึ่งถูกลดครึ่งหนึ่ง แล้วบวก 6 ได้ผลลัพธ์ 20 จำนวนเดิมคือเท่าไร`,options:[`28`,`14`,`26`,`34`]},correctIndex:0},practiceQuestionIds:[`M1-A-01`,`M2-A-01`,`M2-B-11`],masteryChallengeId:`M2-B-11`},{id:`factors-primes`,number:2,title:{en:`Factors, Multiples & Primes`,th:`ตัวประกอบ ตัวคูณร่วม และจำนวนเฉพาะ`},objective:{en:`Learn to find the HCF and LCM using prime factorisation, and to reason carefully about prime numbers.`,th:`เรียนรู้การหา HCF และ LCM ด้วยการแยกตัวประกอบเฉพาะ และการให้เหตุผลเกี่ยวกับจำนวนเฉพาะ`},explanation:{en:[`Every whole number greater than 1 can be broken down into prime factors — its unique "DNA."`,`The Highest Common Factor (HCF) is the biggest number that divides two or more numbers exactly.`,`The Lowest Common Multiple (LCM) is the smallest number that two or more numbers all divide into exactly.`],th:[`จำนวนเต็มที่มากกว่า 1 ทุกจำนวนสามารถแยกเป็นตัวประกอบเฉพาะได้ เหมือน "DNA" เฉพาะตัว`,`ตัวหารร่วมมาก (HCF) คือจำนวนที่มากที่สุดที่หารจำนวนตั้งแต่สองจำนวนขึ้นไปลงตัวพอดี`,`ตัวคูณร่วมน้อย (LCM) คือจำนวนที่น้อยที่สุดที่จำนวนตั้งแต่สองจำนวนขึ้นไปหารลงตัวพอดี`]},rule:{en:`HCF = product of shared primes at their LOWEST shared power. LCM = product of ALL primes involved at their HIGHEST power.`,th:`HCF = ผลคูณของตัวประกอบเฉพาะร่วมที่กำลังต่ำสุดร่วมกัน LCM = ผลคูณของตัวประกอบเฉพาะทั้งหมดที่กำลังสูงสุด`},examples:[{en:[`Worked Example 1: Find the LCM of 6 and 10.`,`6 = 2 × 3. 10 = 2 × 5.`,`LCM uses every prime at its highest power: 2 × 3 × 5 = 30.`],th:[`ตัวอย่างที่ 1: หา LCM ของ 6 และ 10`,`6 = 2 × 3 และ 10 = 2 × 5`,`LCM ใช้ตัวประกอบเฉพาะทุกตัวที่กำลังสูงสุด: 2 × 3 × 5 = 30`]},{en:[`Worked Example 2: Find the HCF of 45 and 60.`,`45 = 3² × 5. 60 = 2² × 3 × 5.`,`Shared primes at lowest power: 3¹ and 5¹. HCF = 3 × 5 = 15.`],th:[`ตัวอย่างที่ 2: หา HCF ของ 45 และ 60`,`45 = 3² × 5 และ 60 = 2² × 3 × 5`,`ตัวประกอบร่วมที่กำลังต่ำสุด: 3¹ และ 5¹ HCF = 3 × 5 = 15`]}],commonMistake:{en:`Multiplying the two numbers together and calling it the LCM, without removing the shared factors first (that gives A common multiple, but not the LOWEST one).`,th:`คูณสองจำนวนเข้าด้วยกันแล้วเรียกว่า LCM โดยไม่ตัดตัวประกอบร่วมออกก่อน (ได้ตัวคูณร่วมตัวหนึ่ง แต่ไม่ใช่ตัวที่น้อยที่สุด)`},quickCheck:{en:{question:`What is the LCM of 9 and 12?`,options:[`36`,`18`,`27`,`108`]},th:{question:`LCM ของ 9 และ 12 คือเท่าไร`,options:[`36`,`18`,`27`,`108`]},correctIndex:0},practiceQuestionIds:[`M1-A-02`,`M2-A-02`,`M2-A-03`,`M2-B-12`],masteryChallengeId:`M2-B-12`},{id:`number-patterns`,number:4,title:{en:`Number Patterns`,th:`รูปแบบของจำนวน`},objective:{en:`Spot and use number patterns, including pairing terms in alternating sums and the sum of consecutive odd numbers.`,th:`สังเกตและใช้รูปแบบของจำนวน รวมถึงการจับคู่พจน์ในผลบวกสลับเครื่องหมายและผลบวกของเลขคี่ติดต่อกัน`},explanation:{en:[`Many competition sums look long and scary, but hide a short pattern once you group the terms.`,`The sum of the first n odd numbers is always a perfect square: n².`,`For alternating (+ / −) sums, pairing consecutive terms often turns the whole sum into simple repeated multiplication.`],th:[`ผลบวกในโจทย์แข่งขันหลายข้อดูยาวและยาก แต่ซ่อนรูปแบบสั้นๆ ไว้เมื่อจัดกลุ่มพจน์`,`ผลบวกของเลขคี่ n ตัวแรกเป็นจำนวนกำลังสองเสมอ: n²`,`สำหรับผลบวกสลับเครื่องหมาย (+/−) การจับคู่พจน์ที่ติดกันมักเปลี่ยนผลบวกทั้งหมดให้เป็นการคูณซ้ำง่ายๆ`]},rule:{en:`1 + 3 + 5 + ⋯ + (2n − 1) = n². Pairing consecutive terms can simplify long alternating sums into (number of pairs) × (value of one pair).`,th:`1 + 3 + 5 + ⋯ + (2n − 1) = n² การจับคู่พจน์ที่ติดกันช่วยลดผลบวกสลับเครื่องหมายที่ยาวให้เหลือ (จำนวนคู่) × (ค่าของหนึ่งคู่)`},examples:[{en:[`Worked Example 1: Find 1 + 3 + 5 + ⋯ + 25 (the sum of the first 13 odd numbers).`,`Since 25 = 2(13) − 1, there are n = 13 terms.`,`Sum = 13² = 169.`],th:[`ตัวอย่างที่ 1: หา 1 + 3 + 5 + ⋯ + 25 (ผลบวกของเลขคี่ 13 ตัวแรก)`,`เนื่องจาก 25 = 2(13) − 1 มี n = 13 พจน์`,`ผลบวก = 13² = 169`]},{en:[`Worked Example 2: Find 1 − 2 + 3 − 4 + ⋯ + 19 − 20.`,`Pair the terms: (1−2) + (3−4) + ⋯ + (19−20). Each pair = −1.`,`There are 20 ÷ 2 = 10 pairs, so the total = 10 × (−1) = −10.`],th:[`ตัวอย่างที่ 2: หา 1 − 2 + 3 − 4 + ⋯ + 19 − 20`,`จับคู่พจน์: (1−2) + (3−4) + ⋯ + (19−20) แต่ละคู่ = −1`,`มี 20 ÷ 2 = 10 คู่ ดังนั้นผลรวม = 10 × (−1) = −10`]}],commonMistake:{en:`Using the LAST term as n in the n² formula, instead of the COUNT of terms in the sum.`,th:`ใช้พจน์สุดท้ายเป็น n ในสูตร n² แทนที่จะเป็น "จำนวนพจน์" ในผลบวก`},quickCheck:{en:{question:`What is 1 + 3 + 5 + 7 + 9 (the sum of the first 5 odd numbers)?`,options:[`25`,`15`,`20`,`30`]},th:{question:`1 + 3 + 5 + 7 + 9 (ผลบวกของเลขคี่ 5 ตัวแรก) มีค่าเท่าไร`,options:[`25`,`15`,`20`,`30`]},correctIndex:0},practiceQuestionIds:[`M1-B-11`,`M2-A-06`,`M2-B-19`],masteryChallengeId:`M1-B-11`},{id:`word-problem-strategies`,number:5,title:{en:`Word Problem Strategies`,th:`กลยุทธ์การแก้โจทย์ปัญหา`},objective:{en:`Use the "assume all one type" and model-drawing strategies to solve mixture, comparison, and heads-and-legs problems.`,th:`ใช้กลยุทธ์ "สมมติว่าทุกตัวเป็นชนิดเดียว" และการวาดโมเดล เพื่อแก้โจทย์ผสม เปรียบเทียบ และหัว-ขา`},explanation:{en:[`For "heads and legs" problems, imagine every animal is the type with FEWER legs first.`,`Compare this imagined total to the real total — the difference tells you how many animals need to be "traded up."`,`Each trade-up adds a fixed number of extra legs, so dividing the leg difference by that fixed number gives the count.`],th:[`สำหรับโจทย์ "หัวและขา" ให้สมมติว่าสัตว์ทุกตัวเป็นชนิดที่มีขาน้อยกว่าก่อน`,`เปรียบเทียบผลรวมที่สมมตินี้กับผลรวมจริง ผลต่างจะบอกว่าต้อง "เปลี่ยนชนิด" กี่ตัว`,`การเปลี่ยนแต่ละครั้งเพิ่มขาจำนวนคงที่ ดังนั้นนำผลต่างของขาไปหารด้วยจำนวนคงที่นั้นจะได้คำตอบ`]},rule:{en:`Extra amount ÷ (difference per swap) = number of the "higher" type. Always check your final counts against BOTH original conditions.`,th:`ปริมาณส่วนเกิน ÷ (ผลต่างต่อการเปลี่ยนหนึ่งครั้ง) = จำนวนของชนิดที่ "มากกว่า" ตรวจคำตอบสุดท้ายกับเงื่อนไขทั้งสองข้อเสมอ`},examples:[{en:[`Worked Example 1: A pen has spiders (8 legs) and ants (6 legs), with 5 heads and 34 legs total. How many spiders?`,`Assume all 5 are ants: 5 × 6 = 30 legs. That is 34 − 30 = 4 legs short.`,`Each ant traded for a spider adds 8 − 6 = 2 legs, so spiders = 4 ÷ 2 = 2.`,`Check: 3 ants + 2 spiders = 5 heads; 3×6 + 2×8 = 18+16 = 34 legs. ✓`],th:[`ตัวอย่างที่ 1: คอกหนึ่งมีแมงมุม (8 ขา) และมด (6 ขา) รวม 5 หัวและ 34 ขา มีแมงมุมกี่ตัว`,`สมมติทั้ง 5 ตัวเป็นมด: 5 × 6 = 30 ขา ขาดไป 34 − 30 = 4 ขา`,`มดที่เปลี่ยนเป็นแมงมุมแต่ละตัวเพิ่มขา 8 − 6 = 2 ขา ดังนั้นแมงมุม = 4 ÷ 2 = 2`,`ตรวจสอบ: มด 3 + แมงมุม 2 = 5 หัว; 3×6 + 2×8 = 18+16 = 34 ขา ✓`]},{en:[`Worked Example 2: A farm has 7 heads and 20 legs, all chickens and rabbits. How many rabbits?`,`Assume all 7 are chickens: 7 × 2 = 14 legs. That is 20 − 14 = 6 legs short.`,`Each swap adds 4 − 2 = 2 legs, so rabbits = 6 ÷ 2 = 3.`,`Check: 4 chickens + 3 rabbits = 7 heads; 4×2 + 3×4 = 8+12 = 20 legs. ✓`],th:[`ตัวอย่างที่ 2: ฟาร์มมี 7 หัวและ 20 ขา เป็นไก่และกระต่ายทั้งหมด มีกระต่ายกี่ตัว`,`สมมติทั้ง 7 ตัวเป็นไก่: 7 × 2 = 14 ขา ขาดไป 20 − 14 = 6 ขา`,`การเปลี่ยนแต่ละครั้งเพิ่มขา 4 − 2 = 2 ขา ดังนั้นกระต่าย = 6 ÷ 2 = 3`,`ตรวจสอบ: ไก่ 4 + กระต่าย 3 = 7 หัว; 4×2 + 3×4 = 8+12 = 20 ขา ✓`]}],commonMistake:{en:`Dividing the extra legs by the WRONG number — such as one animal’s full leg count — instead of the DIFFERENCE between the two leg counts.`,th:`นำขาส่วนเกินไปหารด้วยจำนวนที่ผิด เช่นจำนวนขาเต็มของสัตว์ชนิดหนึ่ง แทนที่จะเป็นผลต่างของจำนวนขาทั้งสองชนิด`},quickCheck:{en:{question:`A farm has 6 heads and 16 legs, all chickens and rabbits. How many rabbits?`,options:[`2`,`3`,`4`,`1`]},th:{question:`ฟาร์มมี 6 หัวและ 16 ขา เป็นไก่และกระต่ายทั้งหมด มีกระต่ายกี่ตัว`,options:[`2`,`3`,`4`,`1`]},correctIndex:0},practiceQuestionIds:[`M1-A-04`,`M2-A-07`,`M1-B-14`],masteryChallengeId:`M1-B-14`},{id:`average`,number:6,title:{en:`Average`,th:`ค่าเฉลี่ย`},objective:{en:`Convert confidently between average and total, and correctly update an average when a value joins or leaves a group.`,th:`แปลงระหว่างค่าเฉลี่ยและผลรวมได้อย่างมั่นใจ และปรับค่าเฉลี่ยให้ถูกต้องเมื่อมีค่าเข้าหรือออกจากกลุ่ม`},explanation:{en:[`Average = Total ÷ Number of items, so Total = Average × Number of items.`,`Averages cannot be added, subtracted, or averaged directly — always convert to totals first.`,`When a new value joins, find the new total, then divide by the new count.`],th:[`ค่าเฉลี่ย = ผลรวม ÷ จำนวนตัว ดังนั้นผลรวม = ค่าเฉลี่ย × จำนวนตัว`,`ค่าเฉลี่ยนำมาบวก ลบ หรือหาค่าเฉลี่ยของค่าเฉลี่ยกันตรงๆ ไม่ได้ ต้องแปลงเป็นผลรวมก่อนเสมอ`,`เมื่อมีค่าใหม่เข้ามา ให้หาผลรวมใหม่ก่อน แล้วจึงหารด้วยจำนวนตัวใหม่`]},rule:{en:`Total = Average × Number of items. Always work through totals when averages change.`,th:`ผลรวม = ค่าเฉลี่ย × จำนวนตัว เมื่อค่าเฉลี่ยเปลี่ยน ให้คำนวณผ่านผลรวมเสมอ`},examples:[{en:[`Worked Example 1: The average of 6 numbers is 15. Find their total.`,`Total = 6 × 15 = 90.`],th:[`ตัวอย่างที่ 1: ค่าเฉลี่ยของตัวเลข 6 จำนวนคือ 15 ผลรวมคือเท่าไร`,`ผลรวม = 6 × 15 = 90`]},{en:[`Worked Example 2: The average height of 4 students is 140 cm. A fifth student, 150 cm tall, joins. Find the new average.`,`Total of 4 students = 4 × 140 = 560 cm.`,`New total = 560 + 150 = 710 cm.`,`New average = 710 ÷ 5 = 142 cm.`],th:[`ตัวอย่างที่ 2: ส่วนสูงเฉลี่ยของนักเรียน 4 คนคือ 140 ซม. นักเรียนคนที่ 5 สูง 150 ซม. เข้าร่วม ค่าเฉลี่ยใหม่คือเท่าไร`,`ผลรวมของนักเรียน 4 คน = 4 × 140 = 560 ซม.`,`ผลรวมใหม่ = 560 + 150 = 710 ซม.`,`ค่าเฉลี่ยใหม่ = 710 ÷ 5 = 142 ซม.`]}],commonMistake:{en:`Averaging the old average and the new value directly (e.g. (140+150)÷2), instead of correctly weighting by the number of students.`,th:`หาค่าเฉลี่ยของค่าเฉลี่ยเดิมกับค่าใหม่ตรงๆ (เช่น (140+150)÷2) แทนที่จะถ่วงน้ำหนักด้วยจำนวนนักเรียนอย่างถูกต้อง`},quickCheck:{en:{question:`The average of 3 numbers is 10. A fourth number, 18, is added. What is the new average?`,options:[`12`,`14`,`10`,`16`]},th:{question:`ค่าเฉลี่ยของตัวเลข 3 จำนวนคือ 10 เพิ่มจำนวนที่สี่คือ 18 ค่าเฉลี่ยใหม่คือเท่าไร`,options:[`12`,`14`,`10`,`16`]},correctIndex:0},practiceQuestionIds:[`M1-A-05`,`M2-B-13`],masteryChallengeId:`M2-B-13`},{id:`area`,number:9,title:{en:`Area: Addition, Subtraction & Overlap`,th:`พื้นที่: การบวก การลบ และการทับซ้อน`},objective:{en:`Find the area of composite shapes using the addition and subtraction methods, and handle overlapping regions correctly.`,th:`หาพื้นที่ของรูปประกอบด้วยวิธีบวกและวิธีลบ และจัดการบริเวณที่ทับซ้อนกันได้อย่างถูกต้อง`},explanation:{en:[`Addition method: split a composite shape into simple rectangles or triangles, then add their areas.`,`Subtraction method: start with one big simple shape and subtract the area of any missing pieces.`,`Overlap method: Total area = Area(A) + Area(B) − Area(the overlap), so the shared region is not counted twice.`],th:[`วิธีบวก: แบ่งรูปประกอบเป็นสี่เหลี่ยมหรือสามเหลี่ยมง่ายๆ แล้วบวกพื้นที่เข้าด้วยกัน`,`วิธีลบ: เริ่มจากรูปใหญ่รูปเดียวที่ง่าย แล้วลบพื้นที่ส่วนที่หายไปออก`,`วิธีทับซ้อน: พื้นที่รวม = พื้นที่(A) + พื้นที่(B) − พื้นที่ส่วนทับซ้อน เพื่อไม่ให้นับส่วนที่ใช้ร่วมกันซ้ำ`]},rule:{en:`Pick addition for shapes made of separate pieces, subtraction for shapes with a bite taken out, and the overlap formula whenever two regions share space.`,th:`ใช้วิธีบวกสำหรับรูปที่ประกอบจากชิ้นส่วนแยกกัน ใช้วิธีลบสำหรับรูปที่ถูกกัดออกไปบางส่วน และใช้สูตรทับซ้อนเมื่อสองบริเวณใช้พื้นที่ร่วมกัน`},examples:[{en:[`Worked Example 1 (subtraction): A rectangle 10 cm by 7 cm has a 2 cm by 2 cm square cut from a corner. Find the remaining area.`,`Big area = 10 × 7 = 70 cm². Cut area = 2 × 2 = 4 cm².`,`Remaining = 70 − 4 = 66 cm².`],th:[`ตัวอย่างที่ 1 (วิธีลบ): สี่เหลี่ยม 10 ซม. × 7 ซม. ถูกตัดมุมสี่เหลี่ยมเล็ก 2 ซม. × 2 ซม. ออก พื้นที่ที่เหลือคือเท่าไร`,`พื้นที่ใหญ่ = 10 × 7 = 70 ตร.ซม. พื้นที่ที่ตัด = 2 × 2 = 4 ตร.ซม.`,`พื้นที่ที่เหลือ = 70 − 4 = 66 ตร.ซม.`]},{en:[`Worked Example 2 (overlap): Two rectangles, 8 cm×5 cm and 6 cm×3 cm, overlap in a 3 cm×2 cm region. Find the total covered area.`,`Area A = 40 cm², Area B = 18 cm², Overlap = 6 cm².`,`Total = 40 + 18 − 6 = 52 cm².`],th:[`ตัวอย่างที่ 2 (ทับซ้อน): สี่เหลี่ยมสองรูป 8 ซม.×5 ซม. และ 6 ซม.×3 ซม. ทับซ้อนกันเป็นบริเวณ 3 ซม.×2 ซม. พื้นที่รวมที่ถูกครอบคลุมคือเท่าไร`,`พื้นที่ A = 40 ตร.ซม., พื้นที่ B = 18 ตร.ซม., ส่วนทับซ้อน = 6 ตร.ซม.`,`พื้นที่รวม = 40 + 18 − 6 = 52 ตร.ซม.`]}],commonMistake:{en:`Forgetting to subtract the overlap once when combining two overlapping areas, double-counting the shared region.`,th:`ลืมลบส่วนทับซ้อนออกหนึ่งครั้งเมื่อรวมพื้นที่ที่ทับซ้อนกัน ทำให้นับบริเวณที่ใช้ร่วมกันซ้ำ`},quickCheck:{en:{question:`A 6 cm × 4 cm rectangle has a 2 cm × 1 cm rectangle removed from a corner. What is the remaining area?`,options:[`22`,`24`,`20`,`26`]},th:{question:`สี่เหลี่ยม 6 ซม. × 4 ซม. ถูกตัดสี่เหลี่ยมเล็ก 2 ซม. × 1 ซม. ออกจากมุมหนึ่ง พื้นที่ที่เหลือคือเท่าไร`,options:[`22`,`24`,`20`,`26`]},correctIndex:0},practiceQuestionIds:[`M1-A-07`,`M2-A-09`,`M1-B-15`,`M2-B-15`],masteryChallengeId:`M1-B-15`},{id:`angles-triangles`,number:10,title:{en:`Angles & Triangles`,th:`มุมและสามเหลี่ยม`},objective:{en:`Use the triangle angle sum, angles around a point, and isosceles-triangle properties to chase unknown angles step by step.`,th:`ใช้ผลรวมมุมของสามเหลี่ยม มุมรอบจุด และสมบัติของสามเหลี่ยมหน้าจั่วเพื่อไล่หามุมที่ไม่รู้ค่าทีละขั้น`},explanation:{en:[`The three angles inside any triangle always add up to 180°.`,`Angles that meet at a point and go all the way around add up to 360°.`,`In an isosceles triangle, the two angles opposite the equal sides are also equal.`],th:[`มุมภายในทั้งสามของสามเหลี่ยมใดๆ รวมกันได้ 180° เสมอ`,`มุมที่พบกันที่จุดหนึ่งและครบรอบวงรวมกันได้ 360°`,`ในสามเหลี่ยมหน้าจั่ว มุมสองมุมที่อยู่ตรงข้ามด้านที่เท่ากันจะเท่ากันด้วย`]},rule:{en:`Triangle: 180°. Around a point: 360°. Straight line: 180°. Isosceles triangle: two equal base angles.`,th:`สามเหลี่ยม: 180° รอบจุด: 360° เส้นตรง: 180° สามเหลี่ยมหน้าจั่ว: มุมฐานสองมุมเท่ากัน`},examples:[{en:[`Worked Example 1: In a triangle, one angle is 90° and another is 35°. Find the third angle.`,`180° − 90° − 35° = 55°.`],th:[`ตัวอย่างที่ 1: ในสามเหลี่ยม มุมหนึ่งเป็น 90° อีกมุมเป็น 35° มุมที่สามคือเท่าไร`,`180° − 90° − 35° = 55°`]},{en:[`Worked Example 2: An isosceles triangle has an apex angle of 50°. Find each base angle.`,`The two base angles are equal, and all three angles sum to 180°.`,`Each base angle = (180° − 50°) ÷ 2 = 65°.`],th:[`ตัวอย่างที่ 2: สามเหลี่ยมหน้าจั่วมีมุมยอด 50° มุมฐานแต่ละมุมคือเท่าไร`,`มุมฐานทั้งสองเท่ากัน และมุมทั้งสามรวมกันได้ 180°`,`มุมฐานแต่ละมุม = (180° − 50°) ÷ 2 = 65°`]}],commonMistake:{en:`Confusing the 180° triangle-sum rule with the 360°-around-a-point rule, and using the wrong total.`,th:`สับสนระหว่างกฎผลรวม 180° ของสามเหลี่ยมกับกฎ 360° รอบจุด แล้วใช้ผลรวมผิด`},quickCheck:{en:{question:`A triangle has angles 40° and 70°. What is the third angle?`,options:[`70`,`60`,`80`,`50`]},th:{question:`สามเหลี่ยมมีมุม 40° และ 70° มุมที่สามคือเท่าไร`,options:[`70`,`60`,`80`,`50`]},correctIndex:0},practiceQuestionIds:[`M1-A-08`,`M2-A-10`,`M1-B-17`,`M2-B-18`],masteryChallengeId:`M1-B-17`},{id:`grid-paths`,number:14,title:{en:`Grid Paths`,th:`เส้นทางบนตาราง`},objective:{en:`Count shortest paths on a grid by adding the number of ways from the left and from below, and adjust the count for blocked or required points.`,th:`นับเส้นทางสั้นที่สุดบนตารางโดยบวกจำนวนวิธีจากซ้ายและจากล่าง และปรับจำนวนสำหรับจุดที่ถูกปิดกั้นหรือต้องผ่าน`},explanation:{en:[`On a grid where you may only move RIGHT or UP, the number of shortest paths to any point equals the ways to reach it from the LEFT plus the ways to reach it from BELOW.`,`This builds a triangle of numbers just like Pascal’s Triangle.`,`For a path that must AVOID a point, subtract the paths through it. For a path that MUST PASS THROUGH a point, multiply the two path segments.`],th:[`บนตารางที่เคลื่อนที่ได้เฉพาะขวาหรือขึ้น จำนวนเส้นทางสั้นที่สุดไปยังจุดใดๆ เท่ากับผลรวมของวิธีมาจากซ้ายและวิธีมาจากล่าง`,`สิ่งนี้สร้างตารางตัวเลขคล้ายสามเหลี่ยมปาสกาล`,`สำหรับเส้นทางที่ต้อง "หลีกเลี่ยง" จุดหนึ่ง ให้ลบเส้นทางที่ผ่านจุดนั้นออก สำหรับเส้นทางที่ "ต้องผ่าน" จุดหนึ่ง ให้คูณสองช่วงเส้นทางเข้าด้วยกัน`]},visual:{kind:`grid-path`,props:{cols:3,rows:2,start:{x:0,y:0,label:`A`},end:{x:3,y:2,label:`B`}}},rule:{en:`Paths avoiding a point = (all paths) − (paths through the point). Paths through a required point = (paths to it) × (paths from it onward).`,th:`เส้นทางที่หลีกเลี่ยงจุดหนึ่ง = (เส้นทางทั้งหมด) − (เส้นทางที่ผ่านจุดนั้น) เส้นทางที่ผ่านจุดที่ต้องผ่าน = (เส้นทางไปจุดนั้น) × (เส้นทางจากจุดนั้นต่อไป)`},examples:[{en:[`Worked Example 1: How many shortest paths are there from (0,0) to (3,2), moving only right or up?`,`You need 3 right-moves and 2 up-moves, in any order: choose 2 of the 5 total moves to be "up".`,`Number of paths = C(5,2) = 10.`],th:[`ตัวอย่างที่ 1: มีเส้นทางสั้นที่สุดกี่เส้นทางจาก (0,0) ไป (3,2) เคลื่อนที่ได้เฉพาะขวาหรือขึ้น`,`ต้องเดินขวา 3 ครั้งและขึ้น 2 ครั้ง เรียงลำดับใดก็ได้: เลือก 2 จาก 5 การเดินทั้งหมดให้เป็น "ขึ้น"`,`จำนวนเส้นทาง = C(5,2) = 10`]},{en:[`Worked Example 2: How many shortest paths from (0,0) to (3,3) MUST pass through (1,1)?`,`(0,0) to (1,1): C(2,1) = 2 paths. (1,1) to (3,3): C(4,2) = 6 paths.`,`Paths through (1,1) = 2 × 6 = 12.`],th:[`ตัวอย่างที่ 2: มีเส้นทางสั้นที่สุดกี่เส้นทางจาก (0,0) ไป (3,3) ที่ต้องผ่าน (1,1)`,`(0,0) ไป (1,1): C(2,1) = 2 เส้นทาง (1,1) ไป (3,3): C(4,2) = 6 เส้นทาง`,`เส้นทางที่ผ่าน (1,1) = 2 × 6 = 12`]}],commonMistake:{en:`Adding the two path-segment counts instead of multiplying them when a path must pass through a specific point.`,th:`บวกจำนวนเส้นทางสองช่วงแทนที่จะคูณกัน เมื่อเส้นทางต้องผ่านจุดที่กำหนด`},quickCheck:{en:{question:`How many shortest paths are there from (0,0) to (2,2), moving only right or up?`,options:[`6`,`4`,`8`,`10`]},th:{question:`มีเส้นทางสั้นที่สุดกี่เส้นทางจาก (0,0) ไป (2,2) เคลื่อนที่ได้เฉพาะขวาหรือขึ้น`,options:[`6`,`4`,`8`,`10`]},correctIndex:0},practiceQuestionIds:[`M1-B-19`,`M2-B-16`,`M2-B-17`],masteryChallengeId:`M2-B-16`},{id:`remainders`,number:3,title:{en:`Remainders & Modular Thinking`,th:`เศษเหลือและการคิดแบบมอดุโล`},objective:{en:`Understand quotient and remainder, find numbers from remainder conditions, and use digit-sum and cycle shortcuts for larger problems.`,th:`เข้าใจผลหารและเศษ หาจำนวนจากเงื่อนไขเศษเหลือ และใช้ทางลัดผลบวกหลักและรอบวนซ้ำสำหรับโจทย์ที่ใหญ่ขึ้น`},explanation:{en:[`When one number is divided by another, the leftover amount (smaller than the divisor) is the remainder.`,`Numbers leaving the same remainder when divided by the same divisor follow a repeating pattern — list them to solve range or condition problems.`,`For divisibility by 9 (or 3), the digit sum leaves the same remainder as the original number.`],th:[`เมื่อจำนวนหนึ่งถูกหารด้วยอีกจำนวน ส่วนที่เหลือ (น้อยกว่าตัวหาร) คือเศษ`,`จำนวนที่หารด้วยตัวหารเดียวกันแล้วเหลือเศษเท่ากันจะเป็นไปตามรูปแบบที่วนซ้ำ ลองไล่รายการเพื่อแก้โจทย์ช่วงหรือเงื่อนไข`,`สำหรับการหารด้วย 9 (หรือ 3) ผลบวกของหลักจะมีเศษเท่ากับจำนวนเดิม`]},rule:{en:`Dividend = Divisor × Quotient + Remainder. The remainder is always smaller than the divisor.`,th:`ตัวตั้ง = ตัวหาร × ผลหาร + เศษ เศษต้องน้อยกว่าตัวหารเสมอ`},examples:[{en:[`Worked Example 1: What is the remainder when 50 is divided by 7?`,`7 × 7 = 49.`,`50 − 49 = 1, so the remainder is 1.`],th:[`ตัวอย่างที่ 1: เศษที่เหลือเมื่อหาร 50 ด้วย 7 คือเท่าไร`,`7 × 7 = 49`,`50 − 49 = 1 ดังนั้นเศษคือ 1`]},{en:[`Worked Example 2: A number leaves remainder 3 when divided by 5. What is the smallest such number greater than 20?`,`Numbers leaving remainder 3 when divided by 5: 3, 8, 13, 18, 23, ...`,`The smallest one greater than 20 is 23.`],th:[`ตัวอย่างที่ 2: จำนวนหนึ่งหาร 5 เหลือเศษ 3 จำนวนที่น้อยที่สุดที่มากกว่า 20 คือเท่าไร`,`จำนวนที่หาร 5 เหลือเศษ 3: 3, 8, 13, 18, 23, ...`,`จำนวนที่น้อยที่สุดที่มากกว่า 20 คือ 23`]}],commonMistake:{en:`Writing a remainder that is equal to or larger than the divisor — the remainder must always be smaller than the divisor.`,th:`เขียนเศษที่เท่ากับหรือมากกว่าตัวหาร เศษต้องน้อยกว่าตัวหารเสมอ`},quickCheck:{en:{question:`What is the remainder when 34 is divided by 6?`,options:[`4`,`3`,`5`,`2`]},th:{question:`เศษที่เหลือเมื่อหาร 34 ด้วย 6 คือเท่าไร`,options:[`4`,`3`,`5`,`2`]},correctIndex:0},practiceQuestionIds:[`M1-A-03`,`M3-A-02`,`M2-A-04`],masteryChallengeId:`M5-B-12`},{id:`speed-distance-time`,number:7,title:{en:`Speed, Distance & Time`,th:`ความเร็ว ระยะทาง และเวลา`},objective:{en:`Use Distance = Speed × Time and its rearrangements, including combined speeds for meeting, catch-up, and moving-apart problems.`,th:`ใช้ ระยะทาง = ความเร็ว × เวลา และรูปแบบจัดใหม่ รวมถึงความเร็วรวมสำหรับโจทย์พบกัน ไล่ตาม และแยกห่างกัน`},explanation:{en:[`Distance = Speed × Time. Rearranged: Speed = Distance ÷ Time, and Time = Distance ÷ Speed.`,`When two objects move toward each other (or apart from a shared start), add their speeds.`,`When one object chases another in the same direction, subtract the speeds.`],th:[`ระยะทาง = ความเร็ว × เวลา จัดใหม่ได้: ความเร็ว = ระยะทาง ÷ เวลา และเวลา = ระยะทาง ÷ ความเร็ว`,`เมื่อวัตถุสองชิ้นเคลื่อนที่เข้าหากัน (หรือแยกห่างจากจุดเริ่มร่วม) ให้บวกความเร็ว`,`เมื่อวัตถุหนึ่งไล่ตามอีกวัตถุในทิศทางเดียวกัน ให้ลบความเร็ว`]},rule:{en:`Distance = Speed × Time. Moving toward each other or apart: add speeds. Same-direction catch-up: subtract speeds.`,th:`ระยะทาง = ความเร็ว × เวลา เคลื่อนที่เข้าหาหรือแยกห่างกัน: บวกความเร็ว ไล่ตามทิศทางเดียวกัน: ลบความเร็ว`},examples:[{en:[`Worked Example 1: A cyclist travels 45 km in 3 hours. Find her speed.`,`Speed = Distance ÷ Time = 45 ÷ 3 = 15 km/h.`],th:[`ตัวอย่างที่ 1: นักปั่นจักรยานเดินทาง 45 กม. ใน 3 ชม. หาความเร็ว`,`ความเร็ว = ระยะทาง ÷ เวลา = 45 ÷ 3 = 15 กม./ชม.`]},{en:[`Worked Example 2: Two cars start 200 km apart and drive toward each other at 50 km/h and 30 km/h. How long until they meet?`,`Combined speed = 50 + 30 = 80 km/h.`,`Time = 200 ÷ 80 = 2.5 hours.`],th:[`ตัวอย่างที่ 2: รถสองคันเริ่มห่างกัน 200 กม. ขับเข้าหากันด้วยความเร็ว 50 กม./ชม. และ 30 กม./ชม. ใช้เวลานานเท่าไรจึงจะพบกัน`,`ความเร็วรวม = 50 + 30 = 80 กม./ชม.`,`เวลา = 200 ÷ 80 = 2.5 ชั่วโมง`]}],commonMistake:{en:`Adding speeds for a same-direction catch-up problem instead of subtracting them.`,th:`บวกความเร็วสำหรับโจทย์ไล่ตามทิศทางเดียวกัน แทนที่จะลบ`},quickCheck:{en:{question:`A train travels at 60 km/h for 2.5 hours. How far does it go?`,options:[`150`,`120`,`180`,`90`]},th:{question:`รถไฟเดินทางด้วยความเร็ว 60 กม./ชม. เป็นเวลา 2.5 ชม. ไปได้ไกลเท่าไร`,options:[`150`,`120`,`180`,`90`]},correctIndex:0},practiceQuestionIds:[`M1-B-13`,`M2-B-14`],masteryChallengeId:`M3-B-15`},{id:`perimeter`,number:8,title:{en:`Perimeter`,th:`เส้นรอบรูป`},objective:{en:`Find perimeters of rectangles and irregular shapes, and reason about how perimeter changes when shapes are joined, cut, or bordered.`,th:`หาเส้นรอบรูปของสี่เหลี่ยมและรูปทรงไม่สม่ำเสมอ และให้เหตุผลว่าเส้นรอบรูปเปลี่ยนอย่างไรเมื่อรูปถูกรวม ตัด หรือใส่ขอบ`},explanation:{en:[`Perimeter is the total length of all the boundary sides of a shape.`,`When two shapes are joined, the shared edge disappears from the outer boundary — perimeter decreases.`,`When a shape is cut apart, the new cut edges become boundary for the new pieces — perimeter increases. A border of width w adds 2w to each dimension.`],th:[`เส้นรอบรูปคือความยาวรวมของขอบทั้งหมดของรูปทรง`,`เมื่อรูปสองรูปถูกนำมารวมกัน ขอบที่ใช้ร่วมกันจะหายไปจากขอบเขตด้านนอก เส้นรอบรูปลดลง`,`เมื่อรูปถูกตัดออกจากกัน ขอบที่ตัดใหม่จะกลายเป็นขอบเขตของชิ้นใหม่ เส้นรอบรูปเพิ่มขึ้น ขอบกว้าง w เพิ่ม 2w ให้แต่ละมิติ`]},rule:{en:`Perimeter = sum of all boundary sides. Joining shapes hides shared edges (perimeter decreases); cutting shapes creates new edges (perimeter increases); a border of width w adds 2w to each dimension.`,th:`เส้นรอบรูป = ผลรวมของขอบทั้งหมด การรวมรูปซ่อนขอบร่วม (ลด) การตัดรูปสร้างขอบใหม่ (เพิ่ม) ขอบกว้าง w เพิ่ม 2w ให้แต่ละมิติ`},examples:[{en:[`Worked Example 1: A rectangle is 9 cm by 4 cm. Find its perimeter.`,`Perimeter = 2 × (9 + 4) = 2 × 13 = 26 cm.`],th:[`ตัวอย่างที่ 1: สี่เหลี่ยมผืนผ้าขนาด 9 ซม. × 4 ซม. หาเส้นรอบรูป`,`เส้นรอบรูป = 2 × (9 + 4) = 2 × 13 = 26 ซม.`]},{en:[`Worked Example 2: A square of side 6 cm has a 1 cm-wide border added all around the outside. Find the new outer perimeter.`,`The border adds 2 × 1 = 2 cm to each side: new side = 6 + 2 = 8 cm.`,`New perimeter = 4 × 8 = 32 cm.`],th:[`ตัวอย่างที่ 2: สี่เหลี่ยมจัตุรัสด้าน 6 ซม. มีขอบกว้าง 1 ซม. เพิ่มรอบด้านนอก หาเส้นรอบรูปใหม่`,`ขอบเพิ่ม 2 × 1 = 2 ซม. ให้แต่ละด้าน: ด้านใหม่ = 6 + 2 = 8 ซม.`,`เส้นรอบรูปใหม่ = 4 × 8 = 32 ซม.`]}],commonMistake:{en:`Adding only w (not 2w) to each dimension when a border surrounds a shape on all sides.`,th:`เพิ่มเพียง w (ไม่ใช่ 2w) ให้แต่ละมิติ เมื่อขอบล้อมรอบรูปทุกด้าน`},quickCheck:{en:{question:`A rectangle is 7 cm by 5 cm. Find its perimeter.`,options:[`24`,`35`,`12`,`17`]},th:{question:`สี่เหลี่ยมผืนผ้าขนาด 7 ซม. × 5 ซม. หาเส้นรอบรูป`,options:[`24`,`35`,`12`,`17`]},correctIndex:0},practiceQuestionIds:[`M1-A-06`,`M2-A-08`,`M3-A-04`],masteryChallengeId:`M1-B-16`},{id:`cube-spatial`,number:11,title:{en:`Cube & Spatial Reasoning`,th:`ลูกบาศก์และการคิดเชิงพื้นที่`},objective:{en:`Reason about cube faces and opposite-face relationships, and understand how painting then cutting a block distributes paint across corner, edge, face, and interior pieces.`,th:`ให้เหตุผลเกี่ยวกับหน้าลูกบาศก์และความสัมพันธ์ของหน้าตรงข้าม และเข้าใจว่าการทาสีแล้วตัดบล็อกกระจายสีไปยังชิ้นมุม ขอบ หน้า และข้างในอย่างไร`},explanation:{en:[`A cube has 6 faces, 12 edges, and 8 corners (vertices).`,`When a cube's faces follow a pattern (like opposite faces sharing a sum or product), use the numbers you know to find the ones you don't.`,`When a painted n×n×n cube is taken apart, pieces fall into four categories based on position: corner, edge, face-centre, or interior.`],th:[`ลูกบาศก์มี 6 หน้า 12 ขอบ และ 8 มุม`,`เมื่อหน้าของลูกบาศก์เป็นไปตามรูปแบบ (เช่นหน้าตรงข้ามมีผลรวมหรือผลคูณเท่ากัน) ใช้ตัวเลขที่รู้ค่าเพื่อหาตัวที่ยังไม่รู้`,`เมื่อลูกบาศก์ n×n×n ที่ทาสีถูกแยกออกจากกัน ชิ้นส่วนแบ่งเป็น 4 ประเภทตามตำแหน่ง: มุม ขอบ กลางหน้า หรือข้างใน`]},rule:{en:`For a painted n×n×n cube: corners = 8 (3 faces each), edges = 12(n−2) (2 faces each), faces = 6(n−2)² (1 face each), interior = (n−2)³ (0 faces).`,th:`สำหรับลูกบาศก์ n×n×n ที่ทาสี: มุม = 8 (3 หน้า), ขอบ = 12(n−2) (2 หน้า), หน้า = 6(n−2)² (1 หน้า), ข้างใน = (n−2)³ (0 หน้า)`},examples:[{en:[`Worked Example 1: A cube has opposite faces that always sum to the same total. Two pairs are (1,6) and (2,5). What is the third pair?`,`Numbers 1-6 not yet used: 3 and 4.`,`Check: 3 + 4 = 7, matching 1+6=7 and 2+5=7. The third pair is 3 and 4.`],th:[`ตัวอย่างที่ 1: ลูกบาศก์มีหน้าตรงข้ามที่ผลรวมเท่ากันเสมอ สองคู่คือ (1,6) และ (2,5) คู่ที่สามคือเท่าไร`,`เลข 1-6 ที่ยังไม่ถูกใช้: 3 และ 4`,`ตรวจสอบ: 3 + 4 = 7 ตรงกับ 1+6=7 และ 2+5=7 คู่ที่สามคือ 3 กับ 4`]},{en:[`Worked Example 2: A 2×2×2 cube (8 unit cubes) is painted on the outside, then taken apart. How many unit cubes have exactly 3 painted faces (corners)?`,`For n=2, every unit cube sits at a corner, since (n−2) = 0 leaves no room for edge, face, or interior pieces.`,`All 8 unit cubes are corners with 3 painted faces.`],th:[`ตัวอย่างที่ 2: ลูกบาศก์ 2×2×2 (8 ก้อน) ถูกทาสีด้านนอกแล้วแยกออกจากกัน มีกี่ก้อนที่มีสีพอดี 3 หน้า (มุม)`,`สำหรับ n=2 ทุกก้อนอยู่ที่มุม เพราะ (n−2) = 0 ไม่เหลือที่สำหรับชิ้นขอบ หน้า หรือข้างใน`,`ลูกบาศก์ทั้ง 8 ก้อนเป็นมุมที่มีสี 3 หน้า`]}],commonMistake:{en:`Applying the corner/edge/face/interior formulas meant for a cube directly to a non-cube block without adjusting for three different dimensions.`,th:`ใช้สูตรมุม/ขอบ/หน้า/ข้างในของลูกบาศก์กับบล็อกที่ไม่ใช่ลูกบาศก์โดยตรง โดยไม่ปรับสำหรับสามมิติที่ต่างกัน`},quickCheck:{en:{question:`A 3×3×3 painted cube is taken apart. How many unit cubes have exactly 3 painted faces (corners)?`,options:[`8`,`12`,`6`,`1`]},th:{question:`ลูกบาศก์ 3×3×3 ที่ทาสีถูกแยกออกจากกัน มีกี่ก้อนที่มีสีพอดี 3 หน้า (มุม)`,options:[`8`,`12`,`6`,`1`]},correctIndex:0},practiceQuestionIds:[`M1-A-09`,`M3-A-07`,`M4-A-09`],masteryChallengeId:`M1-C-24`},{id:`visual-patterns`,number:12,title:{en:`Visual & Geometric Patterns`,th:`รูปแบบภาพและเรขาคณิต`},objective:{en:`Analyse visual patterns by checking shape, fill, rotation, and position rules separately, including 3×3 matrices and magic squares.`,th:`วิเคราะห์รูปแบบภาพโดยตรวจกฎรูปทรง ลวดลาย การหมุน และตำแหน่งแยกกัน รวมถึงตาราง 3×3 และตารางกล`},explanation:{en:[`Many visual patterns actually combine TWO separate rules at once — for example, a shape rule and a fill rule.`,`Split the pattern into its separate rules, solve each rule on its own, then combine them to find a missing piece.`,`In a magic square, every row, column, and diagonal shares the same total — use that total to find any missing number.`],th:[`รูปแบบภาพหลายแบบผสมสองกฎเข้าด้วยกัน เช่นกฎรูปทรงและกฎลวดลาย`,`แยกรูปแบบเป็นกฎย่อยแต่ละข้อ แก้แต่ละกฎแยกกัน แล้วนำมารวมกันเพื่อหาส่วนที่หายไป`,`ในตารางกล ทุกแถว คอลัมน์ และเส้นทแยงมุมมีผลรวมเท่ากัน ใช้ผลรวมนั้นหาตัวเลขที่หายไป`]},rule:{en:`Break a two-part visual pattern into two separate one-part rules, solve each, then combine them for the missing cell.`,th:`แยกรูปแบบภาพสองส่วนเป็นกฎเดี่ยวสองข้อ แก้แต่ละข้อ แล้วรวมกันสำหรับช่องที่หายไป`},examples:[{en:[`Worked Example 1: A 3×3 grid has every row summing to 12: Row 1: 5, 3, 4. Row 2: 2, 6, 4. Row 3: 3, ?, 4. Find the missing number.`,`Row 3: 3 + ? + 4 = 12.`,`? = 12 − 7 = 5.`],th:[`ตัวอย่างที่ 1: ตาราง 3×3 ที่แต่ละแถวรวมกันได้ 12: แถว1: 5, 3, 4 แถว2: 2, 6, 4 แถว3: 3, ?, 4 หาเลขที่หายไป`,`แถว3: 3 + ? + 4 = 12`,`? = 12 − 7 = 5`]},{en:[`Worked Example 2: A triangle shape rotates 90° clockwise each step, cycling through up, right, down, left, then repeating. What direction does the 10th shape point?`,`The cycle has length 4. Position 10 corresponds to (10−1) mod 4 = 1 (counting from 0).`,`Index 1 in [up, right, down, left] is "right", so the 10th shape points right.`],th:[`ตัวอย่างที่ 2: รูปสามเหลี่ยมหมุน 90° ตามเข็มนาฬิกาทุกขั้น วนผ่านขึ้น ขวา ลง ซ้าย แล้ววนซ้ำ รูปที่ 10 ชี้ทิศทางใด`,`รอบมีความยาว 4 ตำแหน่ง10 ตรงกับ (10−1) mod 4 = 1 (นับจาก0)`,`ตำแหน่งที่1ใน [ขึ้น, ขวา, ลง, ซ้าย] คือ "ขวา" ดังนั้นรูปที่10ชี้ไปทางขวา`]}],commonMistake:{en:`Trying to find one single rule for a pattern that actually has two independent rules running at once, like shape AND fill.`,th:`พยายามหากฎเดียวสำหรับรูปแบบที่จริงๆ มีสองกฎอิสระทำงานพร้อมกัน เช่นรูปทรงและลวดลาย`},quickCheck:{en:{question:`A row of shapes cycles through circle, square, triangle, repeating. What is the 8th shape?`,options:[`square`,`circle`,`triangle`,`none of these`]},th:{question:`แถวรูปทรงวนผ่านวงกลม สี่เหลี่ยม สามเหลี่ยม แล้ววนซ้ำ รูปที่8คืออะไร`,options:[`สี่เหลี่ยม`,`วงกลม`,`สามเหลี่ยม`,`ไม่มีข้อถูก`]},correctIndex:0},practiceQuestionIds:[`M1-A-10`,`M4-A-10`],masteryChallengeId:`M5-A-10`},{id:`counting-shapes`,number:13,title:{en:`Counting Shapes`,th:`การนับรูปทรง`},objective:{en:`Count triangles, squares, and rectangles systematically by size to avoid missing or double-counting shapes.`,th:`นับสามเหลี่ยม สี่เหลี่ยม และสี่เหลี่ยมผืนผ้าอย่างเป็นระบบตามขนาด เพื่อไม่ให้พลาดหรือนับซ้ำ`},explanation:{en:[`When a figure contains shapes of many sizes, count each size on its own before adding.`,`For an n×n grid, the number of k×k squares is (n−k+1)² — count each size from k=1 up to n.`,`For a triangular grid, count upward-pointing and downward-pointing triangles separately, by size.`],th:[`เมื่อรูปมีขนาดของรูปทรงหลายขนาด ให้นับแต่ละขนาดแยกกันก่อนบวก`,`สำหรับตาราง n×n จำนวนสี่เหลี่ยมขนาด k×k คือ (n−k+1)² นับแต่ละขนาดตั้งแต่ k=1 ถึง n`,`สำหรับตารางสามเหลี่ยม นับสามเหลี่ยมหงายและคว่ำแยกกัน ตามขนาด`]},rule:{en:`Count each size separately, using position-counting formulas, then add every size together.`,th:`นับแต่ละขนาดแยกกัน โดยใช้สูตรนับตำแหน่ง แล้วบวกทุกขนาดเข้าด้วยกัน`},examples:[{en:[`Worked Example 1: How many squares of all sizes are in a 2×2 grid of unit squares?`,`1×1 squares: (2−1+1)² = 2² = 4. 2×2 squares: (2−2+1)² = 1² = 1.`,`Total = 4 + 1 = 5.`],th:[`ตัวอย่างที่ 1: มีสี่เหลี่ยมทุกขนาดกี่รูปในตาราง 2×2 ของสี่เหลี่ยมหน่วย`,`สี่เหลี่ยม1×1: (2−1+1)² = 2² = 4 สี่เหลี่ยม2×2: (2−2+1)² = 1² = 1`,`รวม = 4 + 1 = 5`]},{en:[`Worked Example 2: How many triangles of all sizes are in a triangular grid of side 2 (4 small triangles)?`,`Upward triangles: size 1 → 3, size 2 → 1. Total upward = 4.`,`Downward triangles: size 1 → 1. Grand total = 4 + 1 = 5.`],th:[`ตัวอย่างที่ 2: มีสามเหลี่ยมทุกขนาดกี่รูปในตารางสามเหลี่ยมด้าน 2 (4 รูปเล็ก)`,`สามเหลี่ยมหงาย: ขนาด1 → 3, ขนาด2 → 1 รวมหงาย = 4`,`สามเหลี่ยมคว่ำ: ขนาด1 → 1 รวมทั้งหมด = 4 + 1 = 5`]}],commonMistake:{en:`Counting only the smallest unit shapes and forgetting the larger combined shapes made from several units together.`,th:`นับเฉพาะรูปทรงหน่วยเล็กที่สุด ลืมรูปทรงขนาดใหญ่ที่รวมจากหลายหน่วยเข้าด้วยกัน`},quickCheck:{en:{question:`How many squares of all sizes are in a 3×3 grid of unit squares?`,options:[`14`,`9`,`10`,`16`]},th:{question:`มีสี่เหลี่ยมทุกขนาดกี่รูปในตาราง 3×3 ของสี่เหลี่ยมหน่วย`,options:[`14`,`9`,`10`,`16`]},correctIndex:0},practiceQuestionIds:[`M3-A-09`,`M2-B-17`],masteryChallengeId:`M1-B-18`},{id:`logic-elimination`,number:15,title:{en:`Logic & Elimination`,th:`ตรรกะและการคัดออก`},objective:{en:`Use systematic deduction and elimination, including repeated-elimination puzzles and overlapping-group (inclusion-exclusion) problems.`,th:`ใช้การให้เหตุผลและการคัดออกอย่างเป็นระบบ รวมถึงปริศนาคัดออกซ้ำและโจทย์กลุ่มทับซ้อน`},explanation:{en:[`For positional-logic puzzles, fix every directly-stated fact first, then test remaining possibilities against the leftover clues one at a time.`,`For two overlapping groups where everyone belongs to at least one: Total = Group A + Group B − Both.`,`For repeated-elimination puzzles, simulate round by round rather than guessing a shortcut — the counting must continue seamlessly across rounds.`],th:[`สำหรับปริศนาตรรกะตำแหน่ง กำหนดข้อเท็จจริงที่ระบุแน่ชัดก่อน แล้วทดสอบความเป็นไปได้ที่เหลือกับเงื่อนไขทีละข้อ`,`สำหรับสองกลุ่มที่ทับซ้อนกันซึ่งทุกคนอยู่ในอย่างน้อยหนึ่งกลุ่ม: ผลรวม = กลุ่ม A + กลุ่ม B − ทั้งสอง`,`สำหรับปริศนาคัดออกซ้ำ จำลองทีละรอบแทนการเดาทางลัด การนับต้องต่อเนื่องข้ามรอบ`]},rule:{en:`Total = Group A + Group B − Both (for overlapping groups). For deduction puzzles, fix known positions first, then test the rest against every remaining clue.`,th:`ผลรวม = กลุ่ม A + กลุ่ม B − ทั้งสอง (สำหรับกลุ่มทับซ้อน) สำหรับปริศนาสรุปเหตุผล กำหนดตำแหน่งที่รู้ก่อน แล้วทดสอบที่เหลือกับทุกเงื่อนไข`},examples:[{en:[`Worked Example 1: In a class of 25, every student studies French or Spanish (or both). 18 study French and 12 study Spanish. How many study both?`,`25 = 18 + 12 − Both.`,`Both = 30 − 25 = 5.`],th:[`ตัวอย่างที่ 1: ในชั้นเรียน 25 คน ทุกคนเรียนภาษาฝรั่งเศสหรือสเปน (หรือทั้งสอง) 18 คนเรียนฝรั่งเศส 12 คนเรียนสเปน มีกี่คนที่เรียนทั้งสอง`,`25 = 18 + 12 − ทั้งสอง`,`ทั้งสอง = 30 − 25 = 5`]},{en:[`Worked Example 2: Ten children stand in a circle numbered 1–10. Starting by eliminating child 2, every 2nd child is eliminated (continuing to count seamlessly around and around) until one remains. Which number wins?`,`Simulating round by round: Round 1 eliminates 2,4,6,8,10, leaving 1,3,5,7,9.`,`Continuing the count seamlessly: eliminate 3, then 7, then 1, then 9 — leaving child 5 as the winner.`],th:[`ตัวอย่างที่ 2: เด็ก10คนยืนเป็นวงกลมหมายเลข1-10 เริ่มคัดคนที่2ออกก่อน ทุกคนที่2จะถูกคัดออก (นับต่อเนื่องรอบวง) จนเหลือคนเดียว ใครชนะ`,`จำลองทีละรอบ: รอบ1คัดออก 2,4,6,8,10 เหลือ 1,3,5,7,9`,`นับต่อเนื่อง: คัดออก 3, แล้ว 7, แล้ว 1, แล้ว 9 เหลือเด็กคนที่5เป็นผู้ชนะ`]}],commonMistake:{en:`Adding the two group sizes directly as the answer to "how many belong to both", instead of using Total = A + B − Both.`,th:`บวกขนาดของสองกลุ่มตรงๆ เป็นคำตอบของ "มีกี่คนที่อยู่ในทั้งสองกลุ่ม" แทนที่จะใช้ ผลรวม = A + B − ทั้งสอง`},quickCheck:{en:{question:`In a group of 20, 14 like tea and 10 like coffee, and everyone likes at least one. How many like both?`,options:[`4`,`6`,`3`,`8`]},th:{question:`ในกลุ่ม 20 คน 14 คนชอบชา 10 คนชอบกาแฟ ทุกคนชอบอย่างน้อยหนึ่งอย่าง มีกี่คนที่ชอบทั้งสองอย่าง`,options:[`4`,`6`,`3`,`8`]},correctIndex:0},practiceQuestionIds:[`M4-B-20`,`M3-B-20`],masteryChallengeId:`M1-B-20`},{id:`strategy-games`,number:16,title:{en:`Strategy Games`,th:`เกมกลยุทธ์`},objective:{en:`Find winning first moves in subtraction games by working backwards from losing positions.`,th:`หาการเดินแรกที่ชนะในเกมลบเลข โดยย้อนคิดจากสถานะแพ้`},explanation:{en:[`In a subtraction game where players remove between 1 and k stones, a position is "losing" for the player about to move if EVERY possible move leads to a winning position for the opponent.`,`For simple games (moves 1 to k), losing positions repeat as multiples of (k+1) — but always verify this by building a table for other move sets.`,`Not every pile size has a winning first move — if the starting pile is itself a losing position, the first player cannot force a win.`],th:[`ในเกมลบเลขที่ผู้เล่นหยิบได้ 1 ถึง k ก้อน สถานะหนึ่งเป็น "แพ้" สำหรับผู้ที่ต้องเดิน ถ้าทุกการเดินที่เป็นไปได้นำไปสู่สถานะชนะของคู่ต่อสู้`,`สำหรับเกมง่าย (หยิบ1ถึงk) สถานะแพ้จะวนซ้ำเป็นพหุคูณของ (k+1) แต่ต้องตรวจสอบด้วยการสร้างตารางสำหรับชุดการเดินอื่นเสมอ`,`ไม่ใช่ทุกขนาดกองที่มีการเดินแรกที่ชนะได้ ถ้ากองเริ่มต้นเป็นสถานะแพ้อยู่แล้ว ผู้เล่นคนแรกไม่สามารถบังคับให้ชนะได้`]},rule:{en:`For moves 1 to k, losing positions are multiples of (k+1). Find the nearest lower multiple of (k+1) and remove enough stones to reach it.`,th:`สำหรับการหยิบ1ถึงk สถานะแพ้คือพหุคูณของ (k+1) หาพหุคูณที่ต่ำกว่าใกล้ที่สุด แล้วหยิบให้พอถึงจุดนั้น`},examples:[{en:[`Worked Example 1: Players alternately remove 1, 2, or 3 stones from a pile of 22. The player taking the last stone wins. What should Player A remove first?`,`Losing positions are multiples of 4. The nearest multiple of 4 below 22 is 20.`,`Player A should remove 2 stones, leaving 20 (a losing position for the opponent).`],th:[`ตัวอย่างที่ 1: ผู้เล่นผลัดกันหยิบ 1, 2 หรือ 3 ก้อน จากกอง 22 ก้อน ผู้หยิบก้อนสุดท้ายชนะ A ควรหยิบเท่าไรก่อน`,`สถานะแพ้คือพหุคูณของ4 พหุคูณของ4ที่ต่ำกว่า22ที่ใกล้ที่สุดคือ20`,`A ควรหยิบ 2 ก้อน เหลือ 20 (สถานะแพ้ของคู่ต่อสู้)`]},{en:[`Worked Example 2: Players alternately remove 1 or 2 stones from a pile of 17. What should Player A remove first?`,`Losing positions are multiples of 3 (since 1+2=3). The nearest multiple of 3 below 17 is 15.`,`Player A should remove 2 stones, leaving 15.`],th:[`ตัวอย่างที่ 2: ผู้เล่นผลัดกันหยิบ 1 หรือ 2 ก้อน จากกอง 17 ก้อน A ควรหยิบเท่าไรก่อน`,`สถานะแพ้คือพหุคูณของ3 (เพราะ1+2=3) พหุคูณของ3ที่ต่ำกว่า17ที่ใกล้ที่สุดคือ15`,`A ควรหยิบ 2 ก้อน เหลือ 15`]}],commonMistake:{en:`Assuming every pile size has a winning first move — if the pile size itself is already a losing position (a multiple of k+1), the first player cannot force a win no matter what they remove.`,th:`สมมติว่าทุกขนาดกองมีการเดินแรกที่ชนะได้ ถ้าขนาดกองเป็นสถานะแพ้อยู่แล้ว (พหุคูณของk+1) ผู้เล่นคนแรกไม่สามารถบังคับชนะได้ไม่ว่าจะหยิบเท่าไร`},quickCheck:{en:{question:`Players remove 1 or 2 stones from a pile of 10 (losing positions are multiples of 3). What should Player A remove first to leave a multiple of 3?`,options:[`1`,`2`,`3`,`Cannot win`]},th:{question:`ผู้เล่นหยิบ 1 หรือ 2 ก้อนจากกอง 10 ก้อน (สถานะแพ้คือพหุคูณของ3) A ควรหยิบเท่าไรก่อนเพื่อเหลือพหุคูณของ3`,options:[`1`,`2`,`3`,`ชนะไม่ได้`]},correctIndex:0},practiceQuestionIds:[`M1-C-22`,`M2-C-22`],masteryChallengeId:`M5-C-22`},{id:`intersections`,number:17,title:{en:`Intersections`,th:`จุดตัด`},objective:{en:`Find the maximum number of intersection points among lines and circles by counting each pair-type separately.`,th:`หาจำนวนจุดตัดที่มากที่สุดระหว่างเส้นตรงและวงกลม โดยนับแต่ละประเภทคู่แยกกัน`},explanation:{en:[`Two distinct straight lines cross at most 1 point (unless they are parallel or the same line).`,`A straight line and a circle cross at most 2 points.`,`Two distinct circles cross at most 2 points.`],th:[`เส้นตรงสองเส้นที่แตกต่างกันตัดกันได้มากที่สุด 1 จุด (ยกเว้นขนานกันหรือเป็นเส้นเดียวกัน)`,`เส้นตรงกับวงกลมตัดกันได้มากที่สุด 2 จุด`,`วงกลมสองวงที่แตกต่างกันตัดกันได้มากที่สุด 2 จุด`]},rule:{en:`Two lines: max 1 point. A line and a circle: max 2 points. Two circles: max 2 points. Add the maximums for every pair-type.`,th:`เส้นสองเส้น: สูงสุด 1 จุด เส้นกับวงกลม: สูงสุด 2 จุด วงกลมสองวง: สูงสุด 2 จุด บวกค่าสูงสุดของทุกประเภทคู่`},examples:[{en:[`Worked Example 1: What is the maximum number of intersection points among 3 lines?`,`Number of pairs = C(3,2) = 3, each crossing at most 1 point.`,`Maximum = 3 × 1 = 3.`],th:[`ตัวอย่างที่ 1: จุดตัดสูงสุดระหว่างเส้นตรง 3 เส้นคือเท่าไร`,`จำนวนคู่ = C(3,2) = 3 คู่ละมากที่สุด 1 จุด`,`สูงสุด = 3 × 1 = 3`]},{en:[`Worked Example 2: What is the maximum number of intersection points between 2 lines and 1 circle (all together)?`,`Line-line: C(2,2) = 1 pair × 1 point = 1. Line-circle: 2 lines × 1 circle × 2 points = 4.`,`Total = 1 + 4 = 5.`],th:[`ตัวอย่างที่ 2: จุดตัดสูงสุดระหว่างเส้นตรง 2 เส้นและวงกลม 1 วง (ทั้งหมด) คือเท่าไร`,`เส้น-เส้น: C(2,2) = 1 คู่ × 1 จุด = 1 เส้น-วงกลม: 2เส้น × 1วงกลม × 2จุด = 4`,`รวม = 1 + 4 = 5`]}],commonMistake:{en:`Forgetting one of the pair-types (like line-line) when several different curve/line types are mixed together in the same problem.`,th:`ลืมประเภทคู่ใดประเภทหนึ่ง (เช่นเส้น-เส้น) เมื่อมีเส้น/เส้นโค้งหลายประเภทผสมกันในโจทย์เดียว`},quickCheck:{en:{question:`What is the maximum number of intersection points among 2 circles?`,options:[`2`,`1`,`4`,`0`]},th:{question:`จุดตัดสูงสุดระหว่างวงกลม 2 วงคือเท่าไร`,options:[`2`,`1`,`4`,`0`]},correctIndex:0},practiceQuestionIds:[`M1-C-23`,`M2-C-23`],masteryChallengeId:`M4-C-23`},{id:`custom-operations`,number:18,title:{en:`Custom Operations`,th:`การดำเนินการที่กำหนดใหม่`},objective:{en:`Translate an invented mathematical symbol into ordinary arithmetic using its exact given definition, substituting carefully.`,th:`แปลงสัญลักษณ์ทางคณิตศาสตร์ที่คิดขึ้นใหม่ให้เป็นเลขคณิตปกติตามนิยามที่กำหนดให้อย่างแม่นยำ แทนค่าอย่างระมัดระวัง`},explanation:{en:[`A custom operation defines a brand-new symbol (like ★ or ♦) using ordinary arithmetic — never assume it means something familiar.`,`Always substitute the given numbers into the definition exactly as written, in the correct order.`,`For a nested custom operation, compute the innermost bracket completely first before moving outward.`],th:[`การดำเนินการที่กำหนดใหม่นิยามสัญลักษณ์ใหม่ (เช่น ★ หรือ ♦) ด้วยเลขคณิตปกติ ห้ามสมมติว่าหมายถึงสิ่งที่คุ้นเคย`,`แทนค่าตัวเลขที่ให้มาลงในนิยามตามที่เขียนไว้เป๊ะๆ ตามลำดับที่ถูกต้องเสมอ`,`สำหรับการดำเนินการที่กำหนดใหม่ซ้อนกัน คำนวณวงเล็บในสุดให้เสร็จสมบูรณ์ก่อนออกไปด้านนอก`]},rule:{en:`Never assume what a custom symbol means — always substitute directly into the GIVEN definition, innermost brackets first.`,th:`ห้ามสมมติว่าสัญลักษณ์ใหม่หมายถึงอะไร ให้แทนค่าตามนิยามที่กำหนดให้เสมอ เริ่มจากวงเล็บในสุดก่อน`},examples:[{en:[`Worked Example 1: Define a ★ b = 3a − b. Find 4 ★ 2.`,`3 × 4 − 2 = 12 − 2 = 10.`],th:[`ตัวอย่างที่ 1: กำหนด a ★ b = 3a − b จงหา 4 ★ 2`,`3 × 4 − 2 = 12 − 2 = 10`]},{en:[`Worked Example 2: Using the same definition (a ★ b = 3a − b), find 2 ★ (4 ★ 2).`,`From Example 1, 4 ★ 2 = 10.`,`2 ★ 10 = 3 × 2 − 10 = 6 − 10 = −4.`],th:[`ตัวอย่างที่ 2: ใช้นิยามเดิม (a ★ b = 3a − b) จงหา 2 ★ (4 ★ 2)`,`จากตัวอย่างที่1, 4 ★ 2 = 10`,`2 ★ 10 = 3 × 2 − 10 = 6 − 10 = −4`]}],commonMistake:{en:`Assuming the custom symbol behaves like a familiar operation (such as multiplication) instead of using the exact given definition.`,th:`สมมติว่าสัญลักษณ์ใหม่ทำงานเหมือนการดำเนินการที่คุ้นเคย (เช่นการคูณ) แทนที่จะใช้นิยามที่กำหนดให้เป๊ะๆ`},quickCheck:{en:{question:`Define a ♦ b = a + 2b. Find 3 ♦ 4.`,options:[`11`,`10`,`14`,`7`]},th:{question:`กำหนด a ♦ b = a + 2b จงหา 3 ♦ 4`,options:[`11`,`10`,`14`,`7`]},correctIndex:0},practiceQuestionIds:[`M1-C-21`,`M2-C-21`],masteryChallengeId:`M5-C-21`}],Ur=[{id:`work-backwards`,number:1,name:{en:`Work Backwards`,th:`ย้อนคิดจากผลลัพธ์`},meaning:{en:`Start from the final result and reverse each step to find the starting value.`,th:`เริ่มจากผลลัพธ์สุดท้าย แล้วย้อนแต่ละขั้นตอนเพื่อหาค่าเริ่มต้น`},whenToUse:{en:`Use this when a problem gives you an ending value and a chain of operations, and asks for the starting value.`,th:`ใช้เมื่อโจทย์ให้ค่าสุดท้ายและลำดับการดำเนินการมา แล้วถามหาค่าเริ่มต้น`},example:{en:`A number is tripled, then 4 is added, to give 25. Reverse: 25 − 4 = 21, then 21 ÷ 3 = 7. The original number is 7.`,th:`จำนวนหนึ่งถูกคูณสาม แล้วบวก 4 ได้ 25 ย้อนกลับ: 25 − 4 = 21 แล้ว 21 ÷ 3 = 7 จำนวนเดิมคือ 7`}},{id:`draw-a-diagram`,number:2,name:{en:`Draw a Diagram`,th:`วาดแผนภาพ`},meaning:{en:`Turn a word problem into a picture — a bar model, a grid, or a simple sketch — to see the relationships clearly.`,th:`เปลี่ยนโจทย์ปัญหาเป็นภาพ เช่นแผนภาพแท่ง ตาราง หรือภาพร่างง่ายๆ เพื่อเห็นความสัมพันธ์ชัดเจน`},whenToUse:{en:`Use this for comparison, ratio, or geometry problems where the relationships between quantities are hard to hold in your head.`,th:`ใช้กับโจทย์เปรียบเทียบ อัตราส่วน หรือเรขาคณิต ที่ความสัมพันธ์ระหว่างปริมาณจดจำในหัวได้ยาก`},example:{en:`Ann has 3 more sweets than Ben, and together they have 21. Draw two bars: Ben’s bar, and Ann’s bar which is Ben’s bar plus a 3-sweet extra piece — the picture shows 2×Ben+3=21 immediately.`,th:`แอนมีลูกอมมากกว่าเบน 3 เม็ด รวมกันมี 21 เม็ด วาดแท่งสองแท่ง: แท่งของเบน และแท่งของแอนที่เท่ากับแท่งของเบนบวกส่วนเกิน 3 เม็ด ภาพนี้แสดง 2×เบน+3=21 ได้ทันที`}},{id:`make-a-table`,number:3,name:{en:`Make a Table`,th:`สร้างตาราง`},meaning:{en:`List possible values or cases in an organised table so you can spot patterns and avoid missing or repeating cases.`,th:`จัดเรียงค่าหรือกรณีที่เป็นไปได้ลงในตารางอย่างเป็นระบบ เพื่อสังเกตรูปแบบและไม่พลาดหรือซ้ำกรณี`},whenToUse:{en:`Use this for problems with several conditions to check, or when counting cases systematically (like counting shapes by size).`,th:`ใช้กับโจทย์ที่มีหลายเงื่อนไขต้องตรวจ หรือเมื่อนับกรณีอย่างเป็นระบบ (เช่นนับรูปทรงตามขนาด)`},example:{en:`For counting all triangles in a subdivided figure, make a table with rows "size 1, 2, 3, 4" and columns "upward, downward" — fill in each count carefully before adding.`,th:`สำหรับการนับสามเหลี่ยมทั้งหมดในรูปที่แบ่งย่อย สร้างตารางที่มีแถว "ขนาด 1, 2, 3, 4" และคอลัมน์ "หงาย, คว่ำ" กรอกแต่ละจำนวนอย่างระมัดระวังก่อนบวก`}},{id:`look-for-a-pattern`,number:4,name:{en:`Look for a Pattern`,th:`มองหารูปแบบ`},meaning:{en:`Write out the first few terms or cases of a sequence and look for a rule connecting them.`,th:`เขียนพจน์หรือกรณีแรกๆ ของลำดับออกมา แล้วมองหากฎที่เชื่อมโยงกัน`},whenToUse:{en:`Use this for number sequences, growing figure patterns, or any "find the nth term" question.`,th:`ใช้กับลำดับจำนวน รูปแบบรูปที่เติบโต หรือโจทย์ "หาพจน์ที่ n" ใดๆ`},example:{en:`A row of squares uses 4, 7, 10, 13, ... matchsticks. Each new square adds 3, so the rule is 4 + 3×(n−1) = 3n+1.`,th:`แถวสี่เหลี่ยมจัตุรัสใช้ไม้ขีด 4, 7, 10, 13, ... ก้าน แต่ละรูปใหม่เพิ่ม 3 ก้าน กฎคือ 4 + 3×(n−1) = 3n+1`}},{id:`try-smaller-cases`,number:5,name:{en:`Try Smaller Cases`,th:`ลองกรณีที่เล็กกว่า`},meaning:{en:`When a problem uses a large number, solve the same problem with a small number first to find the pattern or method.`,th:`เมื่อโจทย์ใช้จำนวนใหญ่ ให้ลองแก้โจทย์เดียวกันด้วยจำนวนเล็กก่อน เพื่อหารูปแบบหรือวิธีการ`},whenToUse:{en:`Use this for elimination games, Josephus-style "last one standing" puzzles, and other problems with a large n.`,th:`ใช้กับเกมคัดออก ปริศนา "คนสุดท้ายที่เหลือ" แบบ Josephus และโจทย์อื่นๆ ที่มี n ขนาดใหญ่`},example:{en:`To find who survives an elimination game with 100 people, first work out the answer for 4, 8, and 16 people — the pattern that emerges also solves the 100-person case.`,th:`เพื่อหาว่าใครรอดในเกมคัดออกที่มีคน 100 คน ให้ลองหาคำตอบสำหรับ 4, 8 และ 16 คนก่อน รูปแบบที่พบจะช่วยแก้กรณี 100 คนได้ด้วย`}},{id:`eliminate-impossible`,number:6,name:{en:`Eliminate Impossible Answers`,th:`ตัดคำตอบที่เป็นไปไม่ได้ออก`},meaning:{en:`Use the given clues to rule out answer choices that break at least one condition, narrowing down to the correct one.`,th:`ใช้เงื่อนไขที่ให้มาตัดตัวเลือกที่ขัดกับเงื่อนไขอย่างน้อยหนึ่งข้อออก จนเหลือคำตอบที่ถูกต้อง`},whenToUse:{en:`Use this for multiple-choice questions with several clues, especially when solving directly would take too long.`,th:`ใช้กับโจทย์แบบปรนัยที่มีเงื่อนไขหลายข้อ โดยเฉพาะเมื่อการแก้โดยตรงใช้เวลานานเกินไป`},example:{en:`A number is prime, odd, and less than 90 — check each answer choice against all three clues, crossing out any that fail even one.`,th:`จำนวนหนึ่งเป็นจำนวนเฉพาะ เป็นเลขคี่ และน้อยกว่า 90 ตรวจแต่ละตัวเลือกกับทั้งสามเงื่อนไข ขีดฆ่าตัวที่ไม่ผ่านแม้แต่ข้อเดียว`}},{id:`pair-terms`,number:7,name:{en:`Pair Terms`,th:`จับคู่พจน์`},meaning:{en:`Group terms in a long sum into pairs that each simplify to the same simple value.`,th:`จัดกลุ่มพจน์ในผลบวกที่ยาวเป็นคู่ๆ ที่แต่ละคู่ลดรูปเป็นค่าง่ายๆ เท่ากัน`},whenToUse:{en:`Use this for long alternating sums (+ / −) with an even number of terms.`,th:`ใช้กับผลบวกสลับเครื่องหมาย (+/−) ที่ยาวและมีจำนวนพจน์เป็นเลขคู่`},example:{en:`1 − 2 + 3 − 4 + ⋯ + 99 − 100 pairs into 50 groups of (odd − even) = −1 each, giving −50 total.`,th:`1 − 2 + 3 − 4 + ⋯ + 99 − 100 จับคู่ได้ 50 กลุ่มของ (คี่ − คู่) = −1 แต่ละคู่ รวมได้ −50`}},{id:`break-shape-apart`,number:8,name:{en:`Break the Shape Apart`,th:`แยกรูปทรงออกเป็นส่วน`},meaning:{en:`Split a complicated shape into simpler rectangles, triangles, or squares whose areas or perimeters are easy to find.`,th:`แบ่งรูปทรงที่ซับซ้อนเป็นสี่เหลี่ยม สามเหลี่ยม หรือสี่เหลี่ยมจัตุรัสที่ง่ายกว่า ซึ่งหาพื้นที่หรือเส้นรอบรูปได้ง่าย`},whenToUse:{en:`Use this for L-shapes, staircases, and any composite figure in an area or perimeter question.`,th:`ใช้กับรูปตัว L รูปขั้นบันได และรูปประกอบใดๆ ในโจทย์พื้นที่หรือเส้นรอบรูป`},example:{en:`An L-shaped figure splits neatly into a 7×3 rectangle and a 4×5 rectangle — add their areas: 21 + 20 = 41.`,th:`รูปตัว L แบ่งได้เป็นสี่เหลี่ยม 7×3 และสี่เหลี่ยม 4×5 บวกพื้นที่: 21 + 20 = 41`}},{id:`count-systematically`,number:9,name:{en:`Count Systematically`,th:`นับอย่างเป็นระบบ`},meaning:{en:`When counting shapes or paths, organise the counting by a clear category — such as size — instead of counting at random.`,th:`เมื่อนับรูปทรงหรือเส้นทาง จัดระเบียบการนับด้วยหมวดหมู่ที่ชัดเจน เช่นขนาด แทนการนับแบบสุ่ม`},whenToUse:{en:`Use this for "how many triangles/squares/rectangles" questions — always count by size, smallest to largest.`,th:`ใช้กับโจทย์ "มีสามเหลี่ยม/สี่เหลี่ยม/สี่เหลี่ยมผืนผ้ากี่รูป" นับตามขนาดจากเล็กไปใหญ่เสมอ`},example:{en:`In a 4×4 grid, count 1×1 squares (16), then 2×2 (9), then 3×3 (4), then 4×4 (1), and add: 16+9+4+1=30.`,th:`ในตาราง 4×4 นับสี่เหลี่ยม 1×1 (16) แล้ว 2×2 (9) แล้ว 3×3 (4) แล้ว 4×4 (1) แล้วบวก: 16+9+4+1=30`}},{id:`find-invariant`,number:10,name:{en:`Find What Does Not Change`,th:`หาสิ่งที่ไม่เปลี่ยนแปลง`},meaning:{en:`Some quantities stay fixed even as a shape or situation changes — spotting this "invariant" often reveals the answer instantly.`,th:`บางปริมาณคงที่แม้รูปทรงหรือสถานการณ์เปลี่ยนไป การมองเห็น "สิ่งที่ไม่เปลี่ยน" นี้มักเผยคำตอบได้ทันที`},whenToUse:{en:`Use this for perimeter-of-a-staircase problems, or any question where a shape is rearranged but a total might secretly stay the same.`,th:`ใช้กับโจทย์เส้นรอบรูปของรูปขั้นบันได หรือโจทย์ใดๆ ที่รูปทรงถูกจัดเรียงใหม่แต่ผลรวมอาจไม่เปลี่ยนแปลง`},example:{en:`Cutting a staircase notch into one corner of a rectangle does not change the perimeter — the horizontal and vertical "reach" of the boundary stays the same.`,th:`การตัดรอยหยักขั้นบันไดที่มุมหนึ่งของสี่เหลี่ยมไม่เปลี่ยนเส้นรอบรูป เพราะระยะเอื้อมแนวนอนและแนวตั้งของขอบยังเท่าเดิม`}},{id:`check-units`,number:11,name:{en:`Check Units`,th:`ตรวจหน่วย`},meaning:{en:`Make sure every quantity in your working uses the same unit before adding, comparing, or dividing.`,th:`ตรวจให้แน่ใจว่าทุกปริมาณในวิธีทำใช้หน่วยเดียวกันก่อนบวก เปรียบเทียบ หรือหาร`},whenToUse:{en:`Use this in speed/distance/time problems where minutes and hours (or cm and m) are mixed in the same question.`,th:`ใช้ในโจทย์ความเร็ว/ระยะทาง/เวลา ที่นาทีกับชั่วโมง (หรือ ซม. กับ ม.) ปนกันในโจทย์เดียวกัน`},example:{en:`Before dividing 210 km by a speed in km/h to get an answer in minutes, first find the time in hours, then convert: 2 hours × 60 = 120 minutes.`,th:`ก่อนหาร 210 กม. ด้วยความเร็วหน่วย กม./ชม. เพื่อให้ได้คำตอบเป็นนาที ให้หาเวลาเป็นชั่วโมงก่อน แล้วแปลง: 2 ชั่วโมง × 60 = 120 นาที`}},{id:`estimate-first`,number:12,name:{en:`Estimate Before Calculating`,th:`ประมาณค่าก่อนคำนวณ`},meaning:{en:`Form a rough expectation of the answer’s size before working it out exactly — this catches careless errors immediately.`,th:`คาดคะเนขนาดของคำตอบคร่าวๆ ก่อนคำนวณอย่างละเอียด วิธีนี้ช่วยจับข้อผิดพลาดจากความประมาทได้ทันที`},whenToUse:{en:`Use this on every multiple-choice question as a final check — if your exact answer is wildly different from your estimate, recheck your work.`,th:`ใช้กับโจทย์ปรนัยทุกข้อเป็นการตรวจสอบขั้นสุดท้าย ถ้าคำตอบที่คำนวณได้ต่างจากค่าประมาณมาก ให้ตรวจงานใหม่`},example:{en:`For "the average of 8 students is 72, a 9th scores 90," expect the new average to rise only SLIGHTLY above 72 (since one value among nine has limited pull) — 74 fits, but 81 should look suspicious immediately.`,th:`สำหรับ "ค่าเฉลี่ยของนักเรียน 8 คนคือ 72 คนที่ 9 ได้ 90" คาดว่าค่าเฉลี่ยใหม่จะสูงขึ้นเพียงเล็กน้อยจาก 72 (เพราะหนึ่งค่าในเก้าค่ามีอิทธิพลจำกัด) — 74 สมเหตุสมผล แต่ 81 ควรดูน่าสงสัยทันที`}}],Wr=[{id:`qr-1`,title:{en:`Triangle angle sum`,th:`ผลรวมมุมสามเหลี่ยม`},content:{en:`180°`,th:`180°`},topic:`Angles & Triangles`},{id:`qr-2`,title:{en:`Angles around a point`,th:`มุมรอบจุด`},content:{en:`360°`,th:`360°`},topic:`Angles & Triangles`},{id:`qr-3`,title:{en:`Angles on a straight line`,th:`มุมบนเส้นตรง`},content:{en:`180°`,th:`180°`},topic:`Angles & Triangles`},{id:`qr-4`,title:{en:`Isosceles triangle`,th:`สามเหลี่ยมหน้าจั่ว`},content:{en:`Two base angles are equal`,th:`มุมฐานสองมุมเท่ากัน`},topic:`Angles & Triangles`},{id:`qr-5`,title:{en:`Average`,th:`ค่าเฉลี่ย`},content:{en:`Total ÷ Number of items`,th:`ผลรวม ÷ จำนวนตัว`},topic:`Average`},{id:`qr-6`,title:{en:`Distance`,th:`ระยะทาง`},content:{en:`Speed × Time`,th:`ความเร็ว × เวลา`},topic:`Speed, Distance & Time`},{id:`qr-7`,title:{en:`Meeting (toward each other)`,th:`เคลื่อนที่เข้าหากัน`},content:{en:`Add the two speeds`,th:`บวกความเร็วทั้งสอง`},topic:`Speed, Distance & Time`},{id:`qr-8`,title:{en:`Catch-up (same direction)`,th:`ไล่ตามทิศทางเดียวกัน`},content:{en:`Subtract the two speeds`,th:`ลบความเร็วทั้งสอง`},topic:`Speed, Distance & Time`},{id:`qr-9`,title:{en:`First n odd numbers`,th:`เลขคี่ n ตัวแรก`},content:{en:`Sum = n²`,th:`ผลบวก = n²`},topic:`Number Patterns`},{id:`qr-10`,title:{en:`Remainder rule`,th:`กฎเศษเหลือ`},content:{en:`Dividend = Divisor × Quotient + Remainder`,th:`ตัวตั้ง = ตัวหาร × ผลหาร + เศษ`},topic:`Remainders`},{id:`qr-11`,title:{en:`HCF`,th:`ตัวหารร่วมมาก`},content:{en:`Shared primes at LOWEST power`,th:`ตัวประกอบร่วมที่กำลังต่ำสุด`},topic:`Factors & Primes`},{id:`qr-12`,title:{en:`LCM`,th:`ตัวคูณร่วมน้อย`},content:{en:`All primes at HIGHEST power`,th:`ตัวประกอบทั้งหมดที่กำลังสูงสุด`},topic:`Factors & Primes`},{id:`qr-13`,title:{en:`Overlapping areas`,th:`พื้นที่ทับซ้อน`},content:{en:`Area(A) + Area(B) − Overlap`,th:`พื้นที่(A) + พื้นที่(B) − ส่วนทับซ้อน`},topic:`Area`},{id:`qr-14`,title:{en:`Triangle area`,th:`พื้นที่สามเหลี่ยม`},content:{en:`½ × base × height`,th:`½ × ฐาน × สูง`},topic:`Area`},{id:`qr-15`,title:{en:`Shortest grid paths`,th:`เส้นทางสั้นที่สุดบนตาราง`},content:{en:`Ways = (from left) + (from below)`,th:`จำนวนวิธี = (จากซ้าย) + (จากล่าง)`},topic:`Grid Paths`},{id:`qr-16`,title:{en:`Path through a required point`,th:`เส้นทางผ่านจุดที่ต้องผ่าน`},content:{en:`Multiply the two path segments`,th:`คูณสองช่วงเส้นทางเข้าด้วยกัน`},topic:`Grid Paths`},{id:`qr-17`,title:{en:`Counting shapes`,th:`นับรูปทรง`},content:{en:`Count systematically by size`,th:`นับอย่างเป็นระบบตามขนาด`},topi

ern.`,marks:5},{id:`mock-08-q03`,testId:8,number:3,topic:`Patterns and Operations`,subtopic:`Number Patterns`,difficulty:`Accessible`,question:`Look at the pattern. 2, 5, 10, 17, 26, ____`,diagram:null,choices:[{id:`A`,text:`35`},{id:`B`,text:`36`},{id:`C`,text:`37`},{id:`D`,text:`38`}],correctAnswer:`C`,explanationSteps:[`Find the gaps between the numbers: 3, 5, 7, 9.`,`The gaps go up by 2 each time, so the next gap is 11.`,`Add 11 to 26: 26 + 11 = 37.`],commonMistake:`Choice B (36) comes from using a gap of 10 instead of continuing the +2 pattern to get 11.`,quickTip:`Each gap increases by 2. Find the next gap before adding it on.`,marks:5},{id:`mock-08-q04`,testId:8,number:4,topic:`Number Skills`,subtopic:`Estimation and Rounding`,difficulty:`Accessible`,question:`Which number is closest to 2,000?`,diagram:null,choices:[{id:`A`,text:`1,982`},{id:`B`,text:`1,993`},{id:`C`,text:`2,009`},{id:`D`,text:`2,018`}],correctAnswer:`B`,explanationSteps:[`Find how far each number is from 2,000: 1,982 is 18 away, 1,993 is 7 away.`,`2,009 is 9 away, and 2,018 is 18 away.`,`1,993 has the smallest distance (7), so it is closest.`],commonMistake:`Choice C (2,009) comes from picking a number just above 2,000 without comparing its distance to the others.`,quickTip:`Find the difference between each number and 2,000, then pick the smallest difference.`,marks:5},{id:`mock-08-q05`,testId:8,number:5,topic:`Number Skills`,subtopic:`Comparing and Ordering Numbers`,difficulty:`Accessible`,question:`Which number is the smallest?`,diagram:null,choices:[{id:`A`,text:`7,402`},{id:`B`,text:`7,240`},{id:`C`,text:`7,204`},{id:`D`,text:`7,420`}],correctAnswer:`C`,explanationSteps:[`All numbers start with 7, so compare the hundreds digit next: 4, 2, 2, 4.`,`7,240 and 7,204 both have the smallest hundreds digit (2), so compare their tens digit.`,`7,204 has 0 tens while 7,240 has 4 tens, so 7,204 is the smallest.`],commonMistake:`Choice B (7,240) comes from stopping the comparison after the hundreds digit and not checking the tens digit, where 7,204 is actually smaller.`,quickTip:`Compare digits from left to right - thousands, then hundreds, then tens - until you find a difference.`,marks:5},{id:`mock-08-q06`,testId:8,number:6,topic:`Geometry and Measurement`,subtopic:`Perimeter`,difficulty:`Accessible`,question:`A square has side length 11 cm. A rectangle has the same perimeter and width 7 cm. What is the length of the rectangle?`,diagram:null,choices:[{id:`A`,text:`13 cm`},{id:`B`,text:`14 cm`},{id:`C`,text:`15 cm`},{id:`D`,text:`16 cm`}],correctAnswer:`C`,explanationSteps:[`The square's perimeter is 4 x 11 = 44 cm.`,`For the rectangle, length + width must equal half the perimeter: 44 / 2 = 22 cm.`,`Length = 22 - 7 = 15 cm.`],commonMistake:`Choice B (14 cm) comes from miscalculating the square's perimeter as 42 cm instead of 44 cm, which gives a half-perimeter of 21 and then 21 - 7 = 14.`,quickTip:`First find the square's perimeter (4 x side), then use it to find the missing side of the rectangle.`,marks:5},{id:`mock-08-q07`,testId:8,number:7,topic:`Geometry and Measurement`,subtopic:`Perimeter`,difficulty:`Accessible`,question:`A rectangle has length 14 cm and width 9 cm. Lina walks around it twice. How far does she walk?`,diagram:null,choices:[{id:`A`,text:`46 cm`},{id:`B`,text:`64 cm`},{id:`C`,text:`92 cm`},{id:`D`,text:`126 cm`}],correctAnswer:`C`,explanationSteps:[`Find the perimeter of one trip around: 2 x (14 + 9) = 46 cm.`,`She walks around it twice, so multiply by 2: 46 x 2 = 92 cm.`],commonMistake:`Choice A (46 cm) comes from finding the perimeter of only one lap and forgetting she walks around twice.`,quickTip:`Find the distance for one trip around first, then multiply by how many times she walks.`,marks:5},{id:`mock-08-q08`,testId:8,number:8,topic:`Word Problems and Reasoning`,subtopic:`Division with Remainders`,difficulty:`Accessible`,question:`A rope is 50 cm long. It is cut into pieces of 6 cm each. How many full pieces can be made?`,diagram:null,choices:[{id:`A`,text:`7`},{id:`B`,text:`8`},{id:`C`,text:`9`},{id:`D`,text:`10`}],correctAnswer:`B`,explanationSteps:[`Divide 50 by 6: 6 x 8 = 48, which leaves 2 cm left over.`,`Since 2 cm is not enough for another full 6 cm piece, only 8 full pieces can be made.`],commonMistake:`Choice C (9) comes from rounding 50 / 6 = 8.33 up to 9 instead of counting only full pieces.`,quickTip:`Divide and look at the remainder - a leftover piece that is too short does not count as a full piece.`,marks:5},{id:`mock-08-q09`,testId:8,number:9,topic:`Word Problems and Reasoning`,subtopic:`Division with Remainders`,difficulty:`Moderate`,question:`58 marbles are shared equally among 7 children. How many marbles are left over?`,diagram:null,choices:[{id:`A`,text:`1`},{id:`B`,text:`2`},{id:`C`,text:`3`},{id:`D`,text:`4`}],correctAnswer:`B`,explanationSteps:[`Find the largest multiple of 7 that fits in 58: 7 x 8 = 56.`,`Subtract: 58 - 56 = 2 marbles left over.`],commonMistake:`Choice A (1) comes from wrongly calculating 7 x 8 as 57 instead of 56, giving a remainder of 1 instead of 2.`,quickTip:`Multiply the divisor by your quotient guess, then subtract from the total to check the remainder.`,marks:5},{id:`mock-08-q10`,testId:8,number:10,topic:`Word Problems and Reasoning`,subtopic:`Chicken and Rabbit Problems`,difficulty:`Moderate`,question:`There are chickens and rabbits in a yard. There are 12 heads and 34 legs in total. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`B`,explanationSteps:[`If all 12 animals were chickens, there would be 12 x 2 = 24 legs.`,`There are 34 - 24 = 10 extra legs, and each rabbit adds 2 extra legs (4 - 2).`,`Rabbits = 10 / 2 = 5, and chickens = 12 - 5 = 7.`],commonMistake:`Choice D (7) comes from finding the number of chickens (7) instead of the number of rabbits that the question actually asks for.`,quickTip:`After finding one animal's total, check carefully which animal the question is really asking about.`,marks:5},{id:`mock-08-q11`,testId:8,number:11,topic:`Word Problems and Reasoning`,subtopic:`Chicken and Rabbit Problems`,difficulty:`Moderate`,question:`There are chickens and rabbits in a pen. There are 13 heads and 40 legs in total. How many chickens are there?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`C`,explanationSteps:[`If all 13 animals were chickens, there would be 13 x 2 = 26 legs.`,`There are 40 - 26 = 14 extra legs, and each rabbit adds 2 extra legs.`,`Rabbits = 14 / 2 = 7, so chickens = 13 - 7 = 6.`],commonMistake:`Choice D (7) comes from finding the number of rabbits (7) instead of the number of chickens that the question asks for.`,quickTip:`Use the 'all heads as chickens' trick: start with all chickens, then swap in rabbits until the legs match.`,marks:5},{id:`mock-08-q12`,testId:8,number:12,topic:`Number Skills`,subtopic:`Number Ranges`,difficulty:`Moderate`,question:`Which number is greater than 5,600 but less than 5,650?`,diagram:null,choices:[{id:`A`,text:`5,590`},{id:`B`,text:`5,605`},{id:`C`,text:`5,650`},{id:`D`,text:`5,706`}],correctAnswer:`B`,explanationSteps:[`Check each number against both limits: must be more than 5,600 and less than 5,650.`,`5,590 is too small, 5,650 is not less than 5,650, and 5,706 is too big.`,`5,605 fits between both limits.`],commonMistake:`Choice A (5,590) comes from picking a number close to 5,600 without checking that it must be greater than, not less than, 5,600.`,quickTip:`Check both ends of the range - the number must be more than the first number and less than the second.`,marks:5},{id:`mock-08-q13`,testId:8,number:13,topic:`Number Skills`,subtopic:`Rounding`,difficulty:`Moderate`,question:`What is 6,451 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`6,400`},{id:`B`,text:`6,500`},{id:`C`,text:`6,450`},{id:`D`,text:`6,600`}],correctAnswer:`B`,explanationSteps:[`Look at the last two digits of 6,451, which are 51.`,`Since 51 is 50 or more, round the hundreds digit up.`,`6,451 rounds up to 6,500.`],commonMistake:`Choice A (6,400) comes from rounding down without checking that the tens digit (5) means the number should round up.`,quickTip:`Look at the tens digit: if it is 5 or more, round the hundreds up.`,marks:5},{id:`mock-08-q14`,testId:8,number:14,topic:`Number Skills`,subtopic:`Rounding`,difficulty:`Moderate`,question:`What is 8,749 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`8,700`},{id:`B`,text:`8,750`},{id:`C`,text:`8,800`},{id:`D`,text:`8,900`}],correctAnswer:`A`,explanationSteps:[`Look at the last two digits of 8,749, which are 49.`,`Since 49 is less than 50, round the hundreds digit down.`,`8,749 rounds down to 8,700.`],commonMistake:`Choice B (8,750) comes from confusing rounding to the nearest hundred with rounding to the nearest ten.`,quickTip:`The tens-and-ones part here is 49, which is less than 50, so round down.`,marks:5},{id:`mock-08-q15`,testId:8,number:15,topic:`Number Skills`,subtopic:`Number Clues and Divisibility`,difficulty:`Moderate`,question:`Which number fits all the clues? It is greater than 400, less than 450, and divisible by both 2 and 5.`,diagram:null,choices:[{id:`A`,text:`415`},{id:`B`,text:`420`},{id:`C`,text:`433`},{id:`D`,text:`447`}],correctAnswer:`B`,explanationSteps:[`A number divisible by both 2 and 5 must end in 0.`,`Only 420 ends in 0 and is between 400 and 450.`],commonMistake:`Choice A (415) comes from noticing it is divisible by 5 but forgetting to check that it must also be divisible by 2 (it is odd).`,quickTip:`A number divisible by both 2 and 5 must end in 0.`,marks:5},{id:`mock-08-q16`,testId:8,number:16,topic:`Number Skills`,subtopic:`Number Clues and Divisibility`,difficulty:`Moderate`,question:`Which number fits all the clues? It is odd, greater than 300, less than 330, and divisible by 5.`,diagram:null,choices:[{id:`A`,text:`310`},{id:`B`,text:`315`},{id:`C`,text:`320`},{id:`D`,text:`326`}],correctAnswer:`B`,explanationSteps:[`Numbers divisible by 5 end in 0 or 5.`,`Between 300 and 330, the choices ending in 0 or 5 are 310, 315, and 320.`,`Only 315 is odd, so it fits all the clues.`],commonMistake:`Choice C (320) comes from checking divisibility by 5 and the range correctly but forgetting to check that the number must also be odd.`,quickTip:`Numbers divisible by 5 end in 0 or 5 - but only the ones ending in 5 are odd.`,marks:5},{id:`mock-08-q17`,testId:8,number:17,topic:`Geometry and Measurement`,subtopic:`Time Calculations`,difficulty:`Moderate`,question:`A movie starts at 2:35 PM and ends at 3:25 PM. How long is the movie?`,diagram:null,choices:[{id:`A`,text:`40 minutes`},{id:`B`,text:`45 minutes`},{id:`C`,text:`50 minutes`},{id:`D`,text:`55 minutes`}],correctAnswer:`C`,explanationSteps:[`From 2:35 PM to 3:00 PM is 25 minutes.`,`From 3:00 PM to 3:25 PM is another 25 minutes.`,`Total time: 25 + 25 = 50 minutes.`],commonMistake:`Choice D (55 minutes) comes from miscounting the minutes from 2:35 to 3:00 as 30 instead of 25.`,quickTip:`Count the minutes to the next full hour first, then add the minutes after the hour.`,marks:5},{id:`mock-08-q18`,testId:8,number:18,topic:`Geometry and Measurement`,subtopic:`Time Calculations`,difficulty:`Moderate`,question:`A train arrives at 6:10 PM. The trip took 45 minutes. What time did it leave?`,diagram:null,choices:[{id:`A`,text:`5:15 PM`},{id:`B`,text:`5:25 PM`},{id:`C`,text:`5:30 PM`},{id:`D`,text:`5:35 PM`}],correctAnswer:`B`,explanationSteps:[`Subtract 10 minutes from 6:10 PM to reach 6:00 PM.`,`That leaves 35 more minutes to subtract (45 - 10 = 35): 6:00 PM minus 35 minutes is 5:25 PM.`],commonMistake:`Choice C (5:30 PM) comes from subtracting only 40 minutes instead of the full 45 minutes.`,quickTip:`Break 45 minutes into an easy chunk: subtract 10 minutes to reach 6:00, then subtract the remaining 35 minutes.`,marks:5},{id:`mock-08-q19`,testId:8,number:19,topic:`Word Problems and Reasoning`,subtopic:`Money Problems`,difficulty:`Challenging`,question:`One notebook costs 17 baht and one eraser costs 8 baht. How much do 2 notebooks and 2 erasers cost?`,diagram:null,choices:[{id:`A`,text:`48 baht`},{id:`B`,text:`50 baht`},{id:`C`,text:`52 baht`},{id:`D`,text:`54 baht`}],correctAnswer:`B`,explanationSteps:[`Cost of 2 notebooks: 2 x 17 = 34 baht.`,`Cost of 2 erasers: 2 x 8 = 16 baht.`,`Total: 34 + 16 = 50 baht.`],commonMistake:`Choice A (48 baht) comes from miscalculating 2 x 8 as 14 instead of 16, giving 34 + 14 = 48.`,quickTip:`Find the cost of each item type separately, then add the two totals together.`,marks:5},{id:`mock-08-q20`,testId:8,number:20,topic:`Word Problems and Reasoning`,subtopic:`Money Problems`,difficulty:`Challenging`,question:`Mali has 4 coins of 10 baht, 3 coins of 5 baht, and 2 coins of 1 baht. She buys a pen for 49 baht. How much money does she have left?`,diagram:null,choices:[{id:`A`,text:`6 baht`},{id:`B`,text:`7 baht`},{id:`C`,text:`8 baht`},{id:`D`,text:`9 baht`}],correctAnswer:`C`,explanationSteps:[`Add up all her money: (4 x 10) + (3 x 5) + (2 x 1) = 40 + 15 + 2 = 57 baht.`,`Subtract the cost of the pen: 57 - 49 = 8 baht left.`],commonMistake:`Choice B (7 baht) comes from missing one of the 5-baht coins when adding, getting a total of 56 baht instead of 57 (56 - 49 = 7).`,quickTip:`Add up all the coins carefully first, then subtract the cost of the item.`,marks:5},{id:`mock-08-q21`,testId:8,number:21,topic:`Challenge Problems`,subtopic:`Arrangements and Permutations`,difficulty:`Challenging`,question:`How many different ways can the letters in FROG be arranged?`,diagram:null,choices:[{id:`A`,text:`12`},{id:`B`,text:`18`},{id:`C`,text:`24`},{id:`D`,text:`36`}],correctAnswer:`C`,explanationSteps:[`FROG has 4 letters, and all 4 are different.`,`Multiply 4 x 3 x 2 x 1 = 24 arrangements.`],commonMistake:`Choice B (18) comes from multiplying 3 x 3 x 2 instead of 4 x 3 x 2 x 1, forgetting one of the four letters.`,quickTip:`For 4 different letters, multiply 4 x 3 x 2 x 1.`,marks:5},{id:`mock-08-q22`,testId:8,number:22,topic:`Challenge Problems`,subtopic:`Arrangements and Permutations`,difficulty:`Challenging`,question:`How many different ways can the letters in KEEP be arranged if the two E's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`10`},{id:`D`,text:`12`}],correctAnswer:`D`,explanationSteps:[`If all 4 letters were different, there would be 4 x 3 x 2 x 1 = 24 arrangements.`,`Since the two E's are the same, divide by 2 to remove the repeated arrangements: 24 / 2 = 12.`],commonMistake:`Choice A (6) comes from treating KEEP as if it only had 3 letters (forgetting the P), calculating 3! = 6.`,quickTip:`Find all arrangements as if the letters were different (4!), then divide by 2 for each pair of repeated letters.`,marks:5},{id:`mock-08-q23`,testId:8,number:23,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Challenging`,question:`You have 6 juice flavors. How many different ways can you choose 3 flavors?`,diagram:null,choices:[{id:`A`,text:`15`},{id:`B`,text:`18`},{id:`C`,text:`20`},{id:`D`,text:`24`}],correctAnswer:`C`,explanationSteps:[`Choosing 3 out of 6 flavors, where order does not matter, gives 20 ways.`,`This can be found using (6 x 5 x 4) / (3 x 2 x 1) = 120 / 6 = 20.`],commonMistake:`Choice A (15) comes from accidentally calculating the number of ways to choose 2 flavors from 6 instead of 3.`,quickTip:`Remember, order does not matter when choosing flavors - use the combination method, not simple multiplication.`,marks:5},{id:`mock-08-q24`,testId:8,number:24,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Challenging`,question:`You have 7 toy cars. How many different ways can you choose 2 toy cars?`,diagram:null,choices:[{id:`A`,text:`14`},{id:`B`,text:`18`},{id:`C`,text:`21`},{id:`D`,text:`24`}],correctAnswer:`C`,explanationSteps:[`Choosing 2 out of 7, where order does not matter, uses (7 x 6) / (2 x 1).`,`7 x 6 = 42, and 42 / 2 = 21.`],commonMistake:`Choice A (14) comes from multiplying 7 x 2 = 14 instead of using the combination method (7 x 6 / 2).`,quickTip:`For choosing 2 items from 7, multiply 7 x 6 and then divide by 2 (since order does not matter).`,marks:5},{id:`mock-08-q25`,testId:8,number:25,topic:`Challenge Problems`,subtopic:`Probability`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number less than 4?`,diagram:null,choices:[{id:`A`,text:`1 out of 6`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 2`},{id:`D`,text:`2 out of 3`}],correctAnswer:`C`,explanationSteps:[`Numbers less than 4 on a die are 1, 2, and 3 — that's 3 numbers.`,`3 out of 6 total outcomes simplifies to 1 out of 2.`],commonMistake:`Choice B (1 out of 3) comes from only counting some of the numbers less than 4 instead of all three (1, 2, and 3).`,quickTip:`List the numbers 1 to 6, then cross out any that do not meet both conditions.`,marks:5},{id:`mock-08-q26`,testId:8,number:26,topic:`Challenge Problems`,subtopic:`Probability`,difficulty:`Challenging`,question:`A bag has 3 red balls, 4 blue balls, and 5 green balls. Which color is most likely to be picked?`,diagram:null,choices:[{id:`A`,text:`Red`},{id:`B`,text:`Blue`},{id:`C`,text:`Green`},{id:`D`,text:`Blue and green are equally likely`}],correctAnswer:`C`,explanationSteps:[`Compare the amounts: 3 red, 4 blue, 5 green.`,`Green has the most balls (5 out of 12), so it is most likely to be picked.`],commonMistake:`Choice B (Blue) comes from comparing red and blue but forgetting to check that green actually has even more balls.`,quickTip:`Compare all three amounts - the color with the most balls is most likely to be picked.`,marks:5},{id:`mock-08-q27`,testId:8,number:27,topic:`Challenge Problems`,subtopic:`Function Machines`,difficulty:`Olympiad`,question:`A number machine adds 3 first, then doubles the answer, then subtracts 4. What is the output when the input is 7?`,diagram:null,choices:[{id:`A`,text:`14`},{id:`B`,text:`15`},{id:`C`,text:`16`},{id:`D`,text:`17`}],correctAnswer:`C`,explanationSteps:[`Add 3 to the input: 7 + 3 = 10.`,`Double the answer: 10 x 2 = 20.`,`Subtract 4: 20 - 4 = 16.`],commonMistake:`Choice D (17) comes from subtracting 3 instead of 4 in the final step (20 - 3 = 17 instead of 20 - 4 = 16).`,quickTip:`Follow the machine's steps in order: add first, then double, then subtract - do not skip or swap any step.`,marks:5},{id:`mock-08-q28`,testId:8,number:28,topic:`Number Skills`,subtopic:`Comparing Numbers`,difficulty:`Olympiad`,question:`Which statement is true?`,diagram:null,choices:[{id:`A`,text:`4,509 is greater than 4,590`},{id:`B`,text:`6,021 is less than 6,012`},{id:`C`,text:`3,999 is greater than 3,909`},{id:`D`,text:`5,140 is less than 5,104`}],correctAnswer:`C`,explanationSteps:[`Compare each pair digit by digit, from left to right.`,`4,509 is less than 4,590 (not greater), so A is false. 6,021 is more than 6,012, so B is false. 5,140 is more than 5,104, so D is false.`,`3,999 is indeed greater than 3,909, so C is the true statement.`],commonMistake:`Choice A comes from comparing only the thousands and hundreds digits (4, 5) and stopping there, without noticing that 509 is less than 590.`,quickTip:`Compare numbers digit by digit from left to right until you find where they differ.`,marks:5},{id:`mock-08-q29`,testId:8,number:29,topic:`Patterns and Operations`,subtopic:`Number Patterns`,difficulty:`Olympiad`,question:`Look at the pattern. 1, 4, 3, 6, 5, 8, 7, ____`,diagram:null,choices:[{id:`A`,text:`9`},{id:`B`,text:`10`},{id:`C`,text:`11`},{id:`D`,text:`12`}],correctAnswer:`B`,explanationSteps:[`The pattern alternates between adding 3 and subtracting 1: 1+3=4, 4-1=3, 3+3=6, 6-1=5, 5+3=8, 8-1=7.`,`The last step was subtract 1 (8 to 7), so the next step is add 3: 7 + 3 = 10.`],commonMistake:`Choice A (9) comes from assuming a simple +1 counting pattern instead of tracking the alternating +3, -1 cycle.`,quickTip:`This pattern alternates between adding 3 and subtracting 1 - figure out which step comes next in the cycle.`,marks:5},{id:`mock-08-q30`,testId:8,number:30,topic:`Number Skills`,subtopic:`Number Clues and Divisibility`,difficulty:`Olympiad`,question:`A number is greater than 700, less than 750, and divisible by 5. Which number could it be?`,diagram:null,choices:[{id:`A`,text:`712`},{id:`B`,text:`725`},{id:`C`,text:`734`},{id:`D`,text:`748`}],correctAnswer:`B`,explanationSteps:[`A number divisible by 5 must end in 0 or 5.`,`Only 725 ends in 5, and it is between 700 and 750.`],commonMistake:`Choice D (748) comes from picking a number close to the 750 boundary without checking that it must also end in 0 or 5 to be divisible by 5.`,quickTip:`A number divisible by 5 always ends in 0 or 5 - check that first before checking the range.`,marks:5}],9:[{id:`mock-09-q01`,testId:9,number:1,topic:`Number Skills`,subtopic:`Rounding to the Nearest Hundred`,difficulty:`Accessible`,question:`What is 4,270 rounded to the nearest hundred?`,diagram:null,choices:[{id:`A`,text:`4,200`},{id:`B`,text:`4,300`},{id:`C`,text:`4,000`},{id:`D`,text:`4,370`}],correctAnswer:`B`,explanationSteps:[`Step 1: Look at the tens digit of 4,270, which is 7.`,`Step 2: Since 7 is 5 or more, round the hundreds digit up.`,`Step 3: 4,270 rounds up to 4,300. Therefore the answer is B.`],commonMistake:`Choosing A (4,200) by rounding down instead of up, forgetting that a tens digit of 5 or more means you round up.`,quickTip:`Check the tens digit first - that single digit tells you which way to round!`,marks:5},{id:`mock-09-q02`,testId:9,number:2,topic:`Word Problems and Reasoning`,subtopic:`Multi-Step Addition and Subtraction`,difficulty:`Accessible`,question:`Nara had 45 stamps. She bought 18 more stamps, then gave 12 stamps to her brother. How many stamps does Nara have now?`,diagram:null,choices:[{id:`A`,text:`51`},{id:`B`,text:`63`},{id:`C`,text:`39`},{id:`D`,text:`75`}],correctAnswer:`A`,explanationSteps:[`Step 1: Start with 45 stamps and add the 18 she bought: 45 + 18 = 63.`,`Step 2: Subtract the 12 stamps she gave away: 63 - 12 = 51.`,`Therefore the answer is A.`],commonMistake:`Choosing B (63) by stopping after buying the stamps and forgetting to subtract the 12 given away.`,quickTip:`Work through each event in the order it happens, one step at a time.`,marks:5},{id:`mock-09-q03`,testId:9,number:3,topic:`Geometry and Measurement`,subtopic:`Perimeter of a Rectangle`,difficulty:`Accessible`,question:`A rectangular garden is 9 cm long and 6 cm wide. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`30 cm`},{id:`B`,text:`15 cm`},{id:`C`,text:`54 cm`},{id:`D`,text:`24 cm`}],correctAnswer:`A`,explanationSteps:[`Step 1: A rectangle has two lengths and two widths.`,`Step 2: Perimeter = 9 + 6 + 9 + 6 = 30 cm. Therefore the answer is A.`],commonMistake:`Choosing B (15 cm) by adding only one length and one width and forgetting to double the sum.`,quickTip:`Remember: perimeter of a rectangle is (length + width) doubled.`,marks:5},{id:`mock-09-q04`,testId:9,number:4,topic:`Patterns and Operations`,subtopic:`Arithmetic Sequences`,difficulty:`Accessible`,question:`Look at this pattern: 7, 13, 19, 25, ... What is the next number?`,diagram:null,choices:[{id:`A`,text:`31`},{id:`B`,text:`30`},{id:`C`,text:`32`},{id:`D`,text:`37`}],correctAnswer:`A`,explanationSteps:[`Step 1: Find the pattern's rule by subtracting: 13 - 7 = 6, 19 - 13 = 6, 25 - 19 = 6.`,`Step 2: Each number increases by 6, so 25 + 6 = 31. Therefore the answer is A.`],commonMistake:`Choosing B (30) by miscounting the jump by one when adding 6 to 25.`,quickTip:`Always check the difference between at least three pairs of numbers before predicting the next one.`,marks:5},{id:`mock-09-q05`,testId:9,number:5,topic:`Number Skills`,subtopic:`Comparing 4-Digit Numbers`,difficulty:`Accessible`,question:`Which of these numbers is the smallest: 5,842, 5,824, 5,482, or 5,428?`,diagram:null,choices:[{id:`A`,text:`5,842`},{id:`B`,text:`5,824`},{id:`C`,text:`5,482`},{id:`D`,text:`5,428`}],correctAnswer:`D`,explanationSteps:[`Step 1: All numbers start with 5, so compare the hundreds digit: 8, 8, 4, 4.`,`Step 2: 5,482 and 5,428 have the smaller hundreds digit, so compare their tens digits: 8 versus 2.`,`Step 3: 5,428 has the smaller tens digit, so it is the smallest number. Therefore the answer is D.`],commonMistake:`Choosing C (5,482) by comparing only the first two digits and not checking the tens digit carefully.`,quickTip:`Compare digits from left to right, one place value at a time.`,marks:5},{id:`mock-09-q06`,testId:9,number:6,topic:`Word Problems and Reasoning`,subtopic:`Money and Change`,difficulty:`Accessible`,question:`Tom has 3 ten-baht coins and 4 five-baht coins. He buys a keychain for 35 baht. How much money does he have left?`,diagram:null,choices:[{id:`A`,text:`15 baht`},{id:`B`,text:`20 baht`},{id:`C`,text:`30 baht`},{id:`D`,text:`45 baht`}],correctAnswer:`A`,explanationSteps:[`Step 1: Find Tom's total money: 3 x 10 = 30, and 4 x 5 = 20, so 30 + 20 = 50 baht.`,`Step 2: Subtract the price of the keychain: 50 - 35 = 15 baht. Therefore the answer is A.`],commonMistake:`Choosing B (20 baht) by counting only the five-baht coins and forgetting the three ten-baht coins.`,quickTip:`Add up every type of coin first before you subtract anything spent.`,marks:5},{id:`mock-09-q07`,testId:9,number:7,topic:`Number Skills`,subtopic:`Divisibility Rules`,difficulty:`Accessible`,question:`Which of these numbers can be shared equally into groups of 5 with none left over: 246, 350, 483, or 512?`,diagram:null,choices:[{id:`A`,text:`246`},{id:`B`,text:`350`},{id:`C`,text:`483`},{id:`D`,text:`512`}],correctAnswer:`B`,explanationSteps:[`Step 1: A number can be shared exactly into groups of 5 only if it ends in 0 or 5.`,`Step 2: Only 350 ends in 0. Therefore the answer is B.`],commonMistake:`Choosing D (512) by not checking the last digit carefully against the ends-in-0-or-5 rule.`,quickTip:`For sharing into groups of 5, just check the very last digit of the number.`,marks:5},{id:`mock-09-q08`,testId:9,number:8,topic:`Patterns and Operations`,subtopic:`Number Machines`,difficulty:`Accessible`,question:`A number machine subtracts 3, then multiplies the result by 3. If you put in 11, what comes out?`,diagram:null,choices:[{id:`A`,text:`24`},{id:`B`,text:`30`},{id:`C`,text:`8`},{id:`D`,text:`33`}],correctAnswer:`A`,explanationSteps:[`Step 1: Subtract 3 from 11: 11 - 3 = 8.`,`Step 2: Multiply the result by 3: 8 x 3 = 24. Therefore the answer is A.`],commonMistake:`Choosing B (30) by multiplying by 3 first and then subtracting 3, doing the steps in the wrong order.`,quickTip:`Always follow a number machine's steps in the exact order they are given.`,marks:5},{id:`mock-09-q09`,testId:9,number:9,topic:`Geometry and Measurement`,subtopic:`Perimeter and Repeated Distance`,difficulty:`Moderate`,question:`A triangular flower bed has sides 7 cm, 8 cm, and 10 cm. If Sofia walks around it twice, how far does she walk in total?`,diagram:null,choices:[{id:`A`,text:`50 cm`},{id:`B`,text:`25 cm`},{id:`C`,text:`30 cm`},{id:`D`,text:`75 cm`}],correctAnswer:`A`,explanationSteps:[`Step 1: Find the perimeter of the triangle: 7 + 8 + 10 = 25 cm.`,`Step 2: Walking around it twice means doubling the distance: 25 x 2 = 50 cm. Therefore the answer is A.`],commonMistake:`Choosing B (25 cm) by finding the perimeter correctly but forgetting she walked around it twice.`,quickTip:`Find the distance for one lap first, then multiply by the number of laps.`,marks:5},{id:`mock-09-q10`,testId:9,number:10,topic:`Word Problems and Reasoning`,subtopic:`Multi-Step Word Problems`,difficulty:`Moderate`,question:`Priya had 84 postcards. She mailed 27 postcards to friends, then bought 15 more. Her sister then gave her 9 more postcards. How many postcards does Priya have now?`,diagram:null,choices:[{id:`A`,text:`81`},{id:`B`,text:`72`},{id:`C`,text:`63`},{id:`D`,text:`51`}],correctAnswer:`A`,explanationSteps:[`Step 1: Subtract the mailed postcards: 84 - 27 = 57.`,`Step 2: Add the postcards she bought: 57 + 15 = 72.`,`Step 3: Add her sister's gift: 72 + 9 = 81. Therefore the answer is A.`],commonMistake:`Choosing B (72) by stopping after buying the extra postcards and forgetting to add the 9 from her sister.`,quickTip:`List each event in order and update your total after every single step.`,marks:5},{id:`mock-09-q11`,testId:9,number:11,topic:`Number Skills`,subtopic:`Fraction of a Group`,difficulty:`Moderate`,question:`Arin has 24 balloons for a party. He gives 1/4 of them to his cousin. How many balloons does he give away?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`12`},{id:`D`,text:`4`}],correctAnswer:`A`,explanationSteps:[`Step 1: Finding 1/4 of a group means splitting it into 4 equal parts.`,`Step 2: 24 divided into 4 equal parts is 24 / 4 = 6. Therefore the answer is A.`],commonMistake:`Choosing C (12) by finding 1/2 of 24 instead of 1/4, mixing up the two fractions.`,quickTip:`For 1/4 of a number, divide by 4, not by 2.`,marks:5},{id:`mock-09-q12`,testId:9,number:12,topic:`Patterns and Operations`,subtopic:`Growing-Difference Sequences`,difficulty:`Moderate`,question:`Look at this pattern: 2, 5, 9, 14, 20, ... What is the next number?`,diagram:null,choices:[{id:`A`,text:`27`},{id:`B`,text:`26`},{id:`C`,text:`25`},{id:`D`,text:`28`}],correctAnswer:`A`,explanationSteps:[`Step 1: Find the differences: 5-2=3, 9-5=4, 14-9=5, 20-14=6.`,`Step 2: The difference grows by 1 each time, so the next difference is 7.`,`Step 3: 20 + 7 = 27. Therefore the answer is A.`],commonMistake:`Choosing B (26) by adding 6 again instead of increasing the difference to 7.`,quickTip:`In a growing pattern, check how the difference itself changes before adding.`,marks:5},{id:`mock-09-q13`,testId:9,number:13,topic:`Word Problems and Reasoning`,subtopic:`Sharing with Remainders`,difficulty:`Moderate`,question:`Ken has 53 candies. He shares them equally among 6 friends and keeps whatever is left over for himself. How many candies does each friend get, and how many are left over?`,diagram:null,choices:[{id:`A`,text:`8 each, 5 left over`},{id:`B`,text:`9 each, 5 left over`},{id:`C`,text:`8 each, 6 left over`},{id:`D`,text:`7 each, 5 left over`}],correctAnswer:`A`,explanationSteps:[`Step 1: Find how many groups of 6 fit into 53: 6 x 8 = 48, which is the closest without going over.`,`Step 2: Find what is left: 53 - 48 = 5. Therefore each friend gets 8 candies with 5 left over, so the answer is A.`],commonMistake:`Choosing C (8 each, 6 left over) by finding the right number of candies per friend but making a leftover greater than or equal to the divisor, which is impossible.`,quickTip:`Check that your leftover amount is always smaller than the number of groups you shared into.`,marks:5},{id:`mock-09-q14`,testId:9,number:14,topic:`Number Skills`,subtopic:`Days of the Week`,difficulty:`Moderate`,question:`If today is Wednesday, what day of the week will it be in 17 days?`,diagram:null,choices:[{id:`A`,text:`Saturday`},{id:`B`,text:`Friday`},{id:`C`,text:`Sunday`},{id:`D`,text:`Thursday`}],correctAnswer:`A`,explanationSteps:[`Step 1: A week has 7 days, so find how many full weeks fit into 17: 7 x 2 = 14, leaving 3 extra days.`,`Step 2: Count 3 days forward from Wednesday: Thursday, Friday, Saturday. Therefore the answer is A.`],commonMistake:`Choosing B (Friday) by counting only 2 extra days instead of 3.`,quickTip:`Divide the number of days by 7 first, then count forward using only the remainder.`,marks:5},{id:`mock-09-q15`,testId:9,number:15,topic:`Geometry and Measurement`,subtopic:`Equal Perimeters`,difficulty:`Moderate`,question:`A square has a perimeter of 36 cm. A rectangle has the same perimeter. If the rectangle's length is 11 cm, what is its width?`,diagram:null,choices:[{id:`A`,text:`7 cm`},{id:`B`,text:`9 cm`},{id:`C`,text:`11 cm`},{id:`D`,text:`25 cm`}],correctAnswer:`A`,explanationSteps:[`Step 1: Half of the perimeter equals length plus width: 36 / 2 = 18.`,`Step 2: Width = 18 - 11 = 7 cm. Therefore the answer is A.`],commonMistake:`Choosing B (9 cm) by using the square's own side length (36 / 4 = 9) instead of working out the rectangle's width.`,quickTip:`Remember: length plus width is always half of the perimeter, not the whole perimeter.`,marks:5},{id:`mock-09-q16`,testId:9,number:16,topic:`Patterns and Operations`,subtopic:`Doubling Patterns`,difficulty:`Moderate`,question:`A pond has 3 lily pads. The number of lily pads doubles every week. How many lily pads will there be after 5 weeks?`,diagram:null,choices:[{id:`A`,text:`96`},{id:`B`,text:`48`},{id:`C`,text:`15`},{id:`D`,text:`32`}],correctAnswer:`A`,explanationSteps:[`Step 1: Double 3 each week: 3, 6, 12, 24, 48, 96.`,`Step 2: After 5 doublings, there are 96 lily pads. Therefore the answer is A.`],commonMistake:`Choosing B (48) by doubling only 4 times instead of 5 times.`,quickTip:`Count each doubling step carefully on your fingers so you don't stop one week too early.`,marks:5},{id:`mock-09-q17`,testId:9,number:17,topic:`Patterns and Operations`,subtopic:`Multiplication Word Problems`,difficulty:`Moderate`,question:`In a parking area there are 6 tricycles and 8 cars. Each tricycle has 3 wheels and each car has 4 wheels. How many wheels are there in total?`,diagram:null,choices:[{id:`A`,text:`50`},{id:`B`,text:`42`},{id:`C`,text:`56`},{id:`D`,text:`32`}],correctAnswer:`A`,explanationSteps:[`Step 1: Find the tricycle wheels: 6 x 3 = 18.`,`Step 2: Find the car wheels: 8 x 4 = 32.`,`Step 3: Add them together: 18 + 32 = 50. Therefore the answer is A.`],commonMistake:`Choosing B (42) by using 3 wheels for the cars as well as the tricycles.`,quickTip:`Multiply each vehicle type by its own correct number of wheels before adding.`,marks:5},{id:`mock-09-q18`,testId:9,number:18,topic:`Patterns and Operations`,subtopic:`Timing and Common Multiples`,difficulty:`Moderate`,question:`Two bells ring together at 9:00. Bell A rings every 5 minutes and Bell B rings every 8 minutes. How many minutes later will they ring together again?`,diagram:null,choices:[{id:`A`,text:`40 minutes`},{id:`B`,text:`13 minutes`},{id:`C`,text:`80 minutes`},{id:`D`,text:`24 minutes`}],correctAnswer:`A`,explanationSteps:[`Step 1: List multiples of 5: 5, 10, 15, 20, 25, 30, 35, 40. List multiples of 8: 8, 16, 24, 32, 40.`,`Step 2: The smallest number in both lists is 40. Therefore the answer is A.`],commonMistake:`Choosing B (13 minutes) by simply adding 5 + 8 instead of finding the first shared multiple.`,quickTip:`List the multiples of both numbers and circle the first one they share.`,marks:5},{id:`mock-09-q19`,testId:9,number:19,topic:`Word Problems and Reasoning`,subtopic:`Heads and Legs Logic Puzzle`,difficulty:`Challenging`,question:`On a farm, there are turkeys and goats. Together they have 14 heads and 38 legs. Turkeys have 2 legs and goats have 4 legs. How many goats and turkeys are there?`,diagram:null,choices:[{id:`A`,text:`5 goats and 9 turkeys`},{id:`B`,text:`9 goats and 5 turkeys`},{id:`C`,text:`7 goats and 7 turkeys`},{id:`D`,text:`6 goats and 8 turkeys`}],correctAnswer:`A`,explanationSteps:[`Step 1: If all 14 animals were turkeys, there would be 14 x 2 = 28 legs.`,`Step 2: There are 38 - 28 = 10 extra legs. Each goat adds 2 extra legs compared to a turkey.`,`Step 3: Number of goats = 10 / 2 = 5, so turkeys = 14 - 5 = 9. Therefore the answer is A.`],commonMistake:`Choosing C (7 goats and 7 turkeys) by guessing an even split without checking that the legs actually add up to 38.`,quickTip:`Imagine all the animals as the one with fewer legs first, then work out the extra legs one by one.`,marks:5},{id:`mock-09-q20`,testId:9,number:20,topic:`Number Skills`,subtopic:`Multiples Search`,difficulty:`Challenging`,question:`What is the smallest number greater than 200 that is a multiple of 7?`,diagram:null,choices:[{id:`A`,text:`203`},{id:`B`,text:`196`},{id:`C`,text:`210`},{id:`D`,text:`207`}],correctAnswer:`A`,explanationSteps:[`Step 1: 7 x 28 = 196, which is not greater than 200.`,`Step 2: 7 x 29 = 203, which is the next multiple of 7 and is greater than 200. Therefore the answer is A.`],commonMistake:`Choosing B (196) which is a multiple of 7, but forgetting it must also be greater than 200.`,quickTip:`Always check both conditions in the question: being a multiple AND being greater than the given number.`,marks:5},{id:`mock-09-q21`,testId:9,number:21,topic:`Geometry and Measurement`,subtopic:`Perimeter with a Ratio`,difficulty:`Challenging`,question:`A rectangular field is twice as long as it is wide. If the width is 8 m, what is the perimeter of the field?`,diagram:null,choices:[{id:`A`,text:`48 m`},{id:`B`,text:`24 m`},{id:`C`,text:`128 m`},{id:`D`,text:`32 m`}],correctAnswer:`A`,explanationSteps:[`Step 1: The length is twice the width: 8 x 2 = 16 m.`,`Step 2: Perimeter = 2 x (length + width) = 2 x (16 + 8) = 2 x 24 = 48 m. Therefore the answer is A.`],commonMistake:`Choosing B (24 m) by adding the length and width correctly but forgetting to double the sum for the perimeter.`,quickTip:`Work out the missing side first, then use the full perimeter formula.`,marks:5},{id:`mock-09-q22`,testId:9,number:22,topic:`Patterns and Operations`,subtopic:`Two-Letter Sum Puzzles`,difficulty:`Challenging`,question:`If M + M + N = 20 and M + N = 13, what is the value of N?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`7`},{id:`C`,text:`13`},{id:`D`,text:`9`}],correctAnswer:`A`,explanationSteps:[`Step 1: Compare the two clues: M + M + N is 7 more than M + N, and 20 - 13 = 7, so M = 7.`,`Step 2: Use M + N = 13, so N = 13 - 7 = 6. Therefore the answer is A.`],commonMistake:`Choosing B (7) by correctly finding the value of M but giving that as the answer instead of solving for N.`,quickTip:`Once you find one letter's value, always substitute it back into an equation to find the other letter.`,marks:5},{id:`mock-09-q23`,testId:9,number:23,topic:`Word Problems and Reasoning`,subtopic:`Overlapping Groups`,difficulty:`Challenging`,question:`In a class of 30 students, 18 like drawing, 15 like singing, and 7 like both drawing and singing. How many students like neither drawing nor singing?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`12`},{id:`C`,text:`7`},{id:`D`,text:`26`}],correctAnswer:`A`,explanationSteps:[`Step 1: Find how many like at least one activity: 18 + 15 - 7 = 26 (subtracting the 7 counted twice).`,`Step 2: Subtract from the class total: 30 - 26 = 4. Therefore the answer is A.`],commonMistake:`Choosing D (26) by correctly finding the number who like at least one activity, but forgetting to subtract that from the class total to find those who like neither.`,quickTip:`When a group overlaps, subtract the overlap once before comparing to the total.`,marks:5},{id:`mock-09-q24`,testId:9,number:24,topic:`Challenge Problems`,subtopic:`Pigeonhole Reasoning`,difficulty:`Challenging`,question:`A drawer has red, blue, green, and yellow ribbons, with many ribbons of each color, all mixed together. Without looking, what is the smallest number of ribbons Sofia must pull out to be sure she has two ribbons of the same color?`,diagram:null,choices:[{id:`A`,text:`5`},{id:`B`,text:`4`},{id:`C`,text:`8`},{id:`D`,text:`3`}],correctAnswer:`A`,explanationSteps:[`Step 1: In the worst case, Sofia could pull out one ribbon of each of the 4 colors without a match.`,`Step 2: The very next ribbon she pulls must match one of the first 4 colors. Therefore she needs 5 ribbons, so the answer is A.`],commonMistake:`Choosing B (4) by thinking one ribbon of each color is already enough, without realizing one more ribbon is needed to force a match.`,quickTip:`Think of the worst possible luck first - one of every color - then add one more to guarantee a match.`,marks:5},{id:`mock-09-q25`,testId:9,number:25,topic:`Number Skills`,subtopic:`Letter Arrangements`,difficulty:`Challenging`,question:`How many different ways can the 4 letters in the word LAMP be arranged?`,diagram:null,choices:[{id:`A`,text:`24`},{id:`B`,text:`12`},{id:`C`,text:`10`},{id:`D`,text:`6`}],correctAnswer:`A`,explanationSteps:[`Step 1: There are 4 choices for the first letter, 3 left for the second, 2 left for the third, and 1 left for the last.`,`Step 2: Multiply all the choices together: 4 x 3 x 2 x 1 = 24. Therefore the answer is A.`],commonMistake:`Choosing B (12) by multiplying only 4 x 3 and forgetting to include the choices for the last two positions.`,quickTip:`Multiply the number of choices for every position, not just the first two.`,marks:5},{id:`mock-09-q26`,testId:9,number:26,topic:`Geometry and Measurement`,subtopic:`Adding Distances`,difficulty:`Challenging`,question:`A rabbit is standing 15 m from a well. A carrot patch is 9 m from the same well, on the opposite side, in a straight line. If the rabbit hops to the well and then to the carrot patch, how far does it hop in total?`,diagram:null,choices:[{id:`A`,text:`24 m`},{id:`B`,text:`6 m`},{id:`C`,text:`15 m`},{id:`D`,text:`9 m`}],correctAnswer:`A`,explanationSteps:[`Step 1: The rabbit first hops 15 m to the well.`,`Step 2: Then it hops 9 m more to the carrot patch.`,`Step 3: Total distance = 15 + 9 = 24 m. Therefore the answer is A.`],commonMistake:`Choosing B (6 m) by subtracting the two distances instead of adding both parts of the journey.`,quickTip:`When a path has two parts, add both distances together to find the total journey.`,marks:5},{id:`mock-09-q27`,testId:9,number:27,topic:`Challenge Problems`,subtopic:`Dice Probability`,difficulty:`Olympiad`,question:`Two dice are rolled together. What is the probability that the sum of the two numbers is exactly 7?`,diagram:null,choices:[{id:`A`,text:`1/6`},{id:`B`,text:`1/12`},{id:`C`,text:`1/36`},{id:`D`,text:`1/4`}],correctAnswer:`A`,explanationSteps:[`Step 1: There are 36 possible results in total when two dice are rolled.`,`Step 2: The pairs that make 7 are (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) - that is 6 pairs.`,`Step 3: Probability = 6/36 = 1/6. Therefore the answer is A.`],commonMistake:`Choosing B (1/12) by treating (1,6) and (6,1) as the same outcome and only counting 3 pairs instead of 6.`,quickTip:`Remember that the two dice are different, so (1,6) and (6,1) are two separate outcomes.`,marks:5},{id:`mock-09-q28`,testId:9,number:28,topic:`Challenge Problems`,subtopic:`Code Arrangements with a Rule`,difficulty:`Olympiad`,question:`Nara wants to make a 3-digit code using 3 different digits chosen from 2, 5, 7, and 9, with no digit repeated. If the code must be an even number, how many different codes can she make?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`24`},{id:`C`,text:`12`},{id:`D`,text:`18`}],correctAnswer:`A`,explanationSteps:[`Step 1: For a code to be even, it must end in 2, since 2 is the only even digit available.`,`Step 2: The last digit is fixed as 2, so the first two digits are arranged from the remaining 3 digits (5, 7, 9): 3 x 2 = 6 ways. Therefore the answer is A.`],commonMistake:`Choosing B (24) by calculating all possible 3-digit codes from the 4 digits without applying the rule that the code must be even.`,quickTip:`When a code must be even, fix the last digit first, then count the arrangements for the rest.`,marks:5},{id:`mock-09-q29`,testId:9,number:29,topic:`Word Problems and Reasoning`,subtopic:`Multi-Step Fraction Reasoning`,difficulty:`Olympiad`,question:`Mia has a box of 36 crayons. She gives 1/3 of them to her sister. Then she gives 1/4 of what remains to her cousin. How many crayons does Mia have left?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`15`},{id:`C`,text:`21`},{id:`D`,text:`24`}],correctAnswer:`A`,explanationSteps:[`Step 1: 1/3 of 36 is 12, so she gives away 12, leaving 36 - 12 = 24.`,`Step 2: 1/4 of the remaining 24 is 6, so she gives away 6 more, leaving 24 - 6 = 18. Therefore the answer is A.`],commonMistake:`Choosing B (15) by finding 1/4 of the original 36 crayons (which is 9) instead of 1/4 of the 24 crayons that actually remained.`,quickTip:`After the first gift, always find the fraction of what is left, not the fraction of the original amount.`,marks:5},{id:`mock-09-q30`,testId:9,number:30,topic:`Challenge Problems`,subtopic:`Calendar Logic Puzzle`,difficulty:`Olympiad`,question:`A festival happens every 9 days. The first festival this year was on a Monday. On what day of the week will the 4th festival occur?`,diagram:null,choices:[{id:`A`,text:`Sunday`},{id:`B`,text:`Tuesday`},{id:`C`,text:`Saturday`},{id:`D`,text:`Monday`}],correctAnswer:`A`,explanationSteps:[`Step 1: From the 1st festival to the 4th festival, there are 3 gaps of 9 days: 3 x 9 = 27 days.`,`Step 2: Find full weeks in 27 days: 7 x 3 = 21, leaving 6 extra days.`,`Step 3: Count 6 days forward from Monday: Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. Therefore the answer is A.`],commonMistake:`Choosing B (Tuesday) by using 4 gaps of 9 days (36 days) instead of the correct 3 gaps (27 days) between the 1st and 4th festival.`,quickTip:`Count the gaps between events carefully - the 4th festival is only 3 intervals after the 1st, not 4.`,marks:5}],10:[{id:`mock-10-q01`,testId:10,number:1,topic:`Number Skills`,subtopic:`Number Patterns on a Line`,difficulty:`Accessible`,question:`Look at this pattern of numbers: 15, 24, ?, 42. The numbers are evenly spaced (they go up by the same amount each time). What is the missing number?`,diagram:null,choices:[{id:`A`,text:`33`},{id:`B`,text:`30`},{id:`C`,text:`36`},{id:`D`,text:`39`}],correctAnswer:`A`,explanationSteps:[`The numbers go up by the same amount each time.`,`From 15 to 24, the increase is 24 - 15 = 9.`,`Add 9 to 24 to find the missing number: 24 + 9 = 33.`,`Check: 33 + 9 = 42, which matches. Therefore the answer is 33.`],commonMistake:`Choice C (36) comes from assuming the gap between the numbers is 12 instead of the actual gap of 9.`,quickTip:`Find the step size using two numbers you already know, then use it to find the missing one.`,marks:5},{id:`mock-10-q02`,testId:10,number:2,topic:`Word Problems and Reasoning`,subtopic:`Moving Items Between Groups`,difficulty:`Accessible`,question:`Basket A has 27 acorns. Basket B has 34 acorns. Non moves 9 acorns from Basket B into Basket A. How many acorns are now in Basket A?`,diagram:null,choices:[{id:`A`,text:`25`},{id:`B`,text:`36`},{id:`C`,text:`18`},{id:`D`,text:`43`}],correctAnswer:`B`,explanationSteps:[`Basket A starts with 27 acorns.`,`9 acorns are moved into Basket A, so add: 27 + 9 = 36.`,`Therefore Basket A now has 36 acorns.`],commonMistake:`Choice D (43) comes from adding the 9 acorns to Basket B's total instead of Basket A's.`,quickTip:`Always add the moved amount to the basket that receives it, not the one that gives it away.`,marks:5},{id:`mock-10-q03`,testId:10,number:3,topic:`Patterns and Operations`,subtopic:`Growing Number Patterns`,difficulty:`Accessible`,question:`A pattern of brick rows has 4 bricks in Row 1, 7 bricks in Row 2, and 10 bricks in Row 3, increasing the same way each time. How many bricks are in Row 7?`,diagram:null,choices:[{id:`A`,text:`19`},{id:`B`,text:`25`},{id:`C`,text:`22`},{id:`D`,text:`28`}],correctAnswer:`C`,explanationSteps:[`The number of bricks increases by 3 each row (4, 7, 10, ...).`,`From Row 1 to Row 7 is 6 steps of +3.`,`Row 7 = 4 + (3 x 6) = 4 + 18 = 22.`],commonMistake:`Choice A (19) comes from adding the difference only 5 times instead of 6 times.`,quickTip:`For Row n, add the difference (n - 1) times to the first term - count the steps carefully.`,marks:5},{id:`mock-10-q04`,testId:10,number:4,topic:`Geometry and Measurement`,subtopic:`Adding Lengths (m and cm)`,difficulty:`Accessible`,question:`One ribbon is 2 m 35 cm long. Another ribbon is 1 m 68 cm long. What is the total length of both ribbons?`,diagram:null,choices:[{id:`A`,text:`3 m 93 cm`},{id:`B`,text:`4 m 13 cm`},{id:`C`,text:`3 m 103 cm`},{id:`D`,text:`4 m 3 cm`}],correctAnswer:`D`,explanationSteps:[`Change both lengths into centimeters: 2 m 35 cm = 235 cm, 1 m 68 cm = 168 cm.`,`Add the two lengths: 235 + 168 = 403 cm.`,`Change back into meters and centimeters: 403 cm = 4 m 3 cm (since 400 cm = 4 m).`],commonMistake:`Choice C (3 m 103 cm) comes from adding correctly to get 403 cm but forgetting to regroup the extra 100 cm into 1 more meter.`,quickTip:`When adding lengths, convert everything into the smaller unit first, then change back at the end.`,marks:5},{id:`mock-10-q05`,testId:10,number:5,topic:`Number Skills`,subtopic:`Rounding to the Nearest Thousand`,difficulty:`Accessible`,question:`Round 3,752 to the nearest thousand.`,diagram:null,choices:[{id:`A`,text:`4,000`},{id:`B`,text:`3,000`},{id:`C`,text:`3,800`},{id:`D`,text:`3,700`}],correctAnswer:`A`,explanationSteps:[`Look at the hundreds digit of 3,752, which is 7.`,`Since 7 is 5 or more, round the thousands digit up.`,`Therefore 3,752 rounds up to 4,000.`],commonMistake:`Choice B (3,000) comes from rounding down instead of checking that the hundreds digit (7) means rounding up.`,quickTip:`Look only at the digit right after the place you are rounding to decide whether to round up or down.`,marks:5},{id:`mock-10-q06`,testId:10,number:6,topic:`Patterns and Operations`,subtopic:`Multiplication in Word Problems`,difficulty:`Accessible`,question:`At the park, there are 4 tricycles and 5 bicycles. How many wheels are there in total?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`22`},{id:`C`,text:`23`},{id:`D`,text:`27`}],correctAnswer:`B`,explanationSteps:[`Tricycles have 3 wheels each: 4 x 3 = 12.`,`Bicycles have 2 wheels each: 5 x 2 = 10.`,`Add both totals: 12 + 10 = 22.`],commonMistake:`Choice D (27) comes from using 3 wheels for the bicycles as well as the tricycles (4 x 3 + 5 x 3 = 27).`,quickTip:`Multiply each vehicle type by its own number of wheels before adding the totals together.`,marks:5},{id:`mock-10-q07`,testId:10,number:7,topic:`Word Problems and Reasoning`,subtopic:`Temperature Word Problems`,difficulty:`Accessible`,question:`At 6 in the morning, the temperature was 14 degrees C. By noon it had risen by 9 degrees C. By evening it had dropped by 11 degrees C from the noon temperature. What was the evening temperature?`,diagram:null,choices:[{id:`A`,text:`3 degrees C`},{id:`B`,text:`34 degrees C`},{id:`C`,text:`12 degrees C`},{id:`D`,text:`16 degrees C`}],correctAnswer:`C`,explanationSteps:[`Noon temperature: 14 + 9 = 23 degrees C.`,`Evening temperature: 23 - 11 = 12 degrees C.`],commonMistake:`Choice A (3 degrees C) comes from subtracting only the evening drop (11) from the morning temperature and ignoring the noon rise entirely.`,quickTip:`Work through temperature changes one step at a time, in the order they happen.`,marks:5},{id:`mock-10-q08`,testId:10,number:8,topic:`Geometry and Measurement`,subtopic:`Perimeter of a Triangle`,difficulty:`Accessible`,question:`A triangular garden has sides 18 m, 24 m, and 30 m. Non jogs all the way around the garden twice. How many meters does he jog in total?`,diagram:null,choices:[{id:`A`,text:`72 m`},{id:`B`,text:`96 m`},{id:`C`,text:`120 m`},{id:`D`,text:`144 m`}],correctAnswer:`D`,explanationSteps:[`Perimeter of the triangle: 18 + 24 + 30 = 72 m.`,`Jogging around it twice: 72 x 2 = 144 m.`],commonMistake:`Choice A (72 m) comes from finding the perimeter correctly but forgetting that Non jogs around the garden twice.`,quickTip:`Watch for words like 'twice' or 'around' - they tell you to multiply the perimeter.`,marks:5},{id:`mock-10-q09`,testId:10,number:9,topic:`Number Skills`,subtopic:`Multiples`,difficulty:`Moderate`,question:`What is the smallest multiple of 7 that is greater than 250?`,diagram:null,choices:[{id:`A`,text:`252`},{id:`B`,text:`245`},{id:`C`,text:`256`},{id:`D`,text:`259`}],correctAnswer:`A`,explanationSteps:[`Divide 250 by 7: 250 / 7 = 35 remainder 5, so 35 x 7 = 245, which is not greater than 250.`,`Try the next multiple: 36 x 7 = 252, which is greater than 250.`,`Therefore 252 is the smallest multiple of 7 above 250.`],commonMistake:`Choice B (245) comes from using 35 x 7 without checking that the multiple must be greater than 250.`,quickTip:`Divide first to find the nearest multiple below the number, then add one more group to go above it.`,marks:5},{id:`mock-10-q10`,testId:10,number:10,topic:`Patterns and Operations`,subtopic:`Multi-Step Word Problems`,difficulty:`Moderate`,question:`Zara collected 45 pebbles. She gave 12 pebbles to her brother and 8 pebbles to her sister. Then she found 25 more pebbles at the beach. How many pebbles does Zara have now?`,diagram:null,choices:[{id:`A`,text:`25`},{id:`B`,text:`50`},{id:`C`,text:`66`},{id:`D`,text:`90`}],correctAnswer:`B`,explanationSteps:[`Start with 45 pebbles, then give away 12: 45 - 12 = 33.`,`Give away 8 more: 33 - 8 = 25.`,`Find 25 more pebbles: 25 + 25 = 50.`],commonMistake:`Choice A (25) comes from stopping after giving away pebbles and forgetting to add the 25 pebbles found at the beach.`,quickTip:`Work through the story one event at a time, in order, and read all the way to the last sentence.`,marks:5},{id:`mock-10-q11`,testId:10,number:11,topic:`Patterns and Operations`,subtopic:`Number Machines`,difficulty:`Moderate`,question:`A machine follows this rule: double the input, then add 6, then subtract 4. If the input is 9, what is the output?`,diagram:null,choices:[{id:`A`,text:`14`},{id:`B`,text:`24`},{id:`C`,text:`20`},{id:`D`,text:`26`}],correctAnswer:`C`,explanationSteps:[`Double 9: 9 x 2 = 18.`,`Add 6: 18 + 6 = 24.`,`Subtract 4: 24 - 4 = 20.`],commonMistake:`Choice B (24) comes from doing the double and add steps correctly but forgetting the final subtract-4 step.`,quickTip:`Follow number machine rules in the exact order given, one step at a time.`,marks:5},{id:`mock-10-q12`,testId:10,number:12,topic:`Geometry and Measurement`,subtopic:`Perimeter and Area Together`,difficulty:`Moderate`,question:`A rectangular playground has a perimeter of 70 m. Its width is 15 m. What is its area?`,diagram:null,choices:[{id:`A`,text:`175 sq m`},{id:`B`,text:`450 sq m`},{id:`C`,text:`525 sq m`},{id:`D`,text:`300 sq m`}],correctAnswer:`D`,explanationSteps:[`Half the perimeter equals length + width: 70 / 2 = 35 m.`,`Length = 35 - 15 = 20 m.`,`Area = length x width = 20 x 15 = 300 sq m.`],commonMistake:`Choice C (525 sq m) comes from multiplying the width by half the perimeter (35) instead of finding the length first.`,quickTip:`Perimeter gives you length + width - always find the missing side before multiplying for area.`,marks:5},{id:`mock-10-q13`,testId:10,number:13,topic:`Number Skills`,subtopic:`Number Clues Puzzle`,difficulty:`Moderate`,question:`I am a 2-digit number. The sum of my digits is 11. My units digit is 3 more than my tens digit. I am an odd number. What number am I?`,diagram:null,choices:[{id:`A`,text:`47`},{id:`B`,text:`29`},{id:`C`,text:`65`},{id:`D`,text:`83`}],correctAnswer:`A`,explanationSteps:[`List 2-digit numbers with digit sum 11: 29, 38, 47, 56, 65, 74, 83, 92.`,`Check which one has a units digit that is 3 more than the tens digit: only 47 fits (4 + 3 = 7).`,`47 is also an odd number, so it fits every clue.`],commonMistake:`Choice D (83) comes from picking an odd number with digit sum 11 without checking that the units digit must be exactly 3 more than the tens digit.`,quickTip:`Check every clue against your answer, one at a time, before deciding it is correct.`,marks:5},{id:`mock-10-q14`,testId:10,number:14,topic:`Challenge Problems`,subtopic:`Pigeonhole Principle`,difficulty:`Moderate`,question:`A box contains gloves of 4 different colors: red, blue, green, and yellow. Mali reaches in without looking. What is the least number of gloves she must take out to be sure she has 2 gloves of the same color?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`3`},{id:`D`,text:`8`}],correctAnswer:`B`,explanationSteps:[`In the worst case, Mali could pick one glove of each color first: that is 4 gloves, all different colors.`,`The very next glove she picks must repeat a color, since there are only 4 colors.`,`So she needs 4 + 1 = 5 gloves to be absolutely sure.`],commonMistake:`Choice A (4) comes from thinking that 4 gloves (one of each color) is already enough, forgetting she needs one more glove to guarantee a repeat.`,quickTip:`For 'guaranteed match' puzzles, imagine the worst possible luck first, then add one more.`,marks:5},{id:`mock-10-q15`,testId:10,number:15,topic:`Word Problems and Reasoning`,subtopic:`Probability with Two Dice`,difficulty:`Moderate`,question:`Ravi rolls two ordinary 6-sided dice and adds the numbers shown. What is the probability that the sum is exactly 7?`,diagram:null,choices:[{id:`A`,text:`1/36`},{id:`B`,text:`1/12`},{id:`C`,text:`1/6`},{id:`D`,text:`1/9`}],correctAnswer:`C`,explanationSteps:[`List all pairs that add to 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) - that is 6 pairs.`,`There are 36 total possible pairs when rolling two dice (6 x 6).`,`Probability = 6/36 = 1/6.`],commonMistake:`Choice A (1/36) comes from counting only one pairing (like 1 and 6) and forgetting the other five pairs that also add to 7.`,quickTip:`List every pair carefully - remember (2,5) and (5,2) count as two different rolls.`,marks:5},{id:`mock-10-q16`,testId:10,number:16,topic:`Patterns and Operations`,subtopic:`Two-Step Number Patterns`,difficulty:`Moderate`,question:`A number pattern follows this rule: double the previous number, then subtract 3. The first number is 5. What is the third number in the pattern?`,diagram:null,choices:[{id:`A`,text:`9`},{id:`B`,text:`14`},{id:`C`,text:`17`},{id:`D`,text:`11`}],correctAnswer:`D`,explanationSteps:[`Second number: 5 x 2 - 3 = 10 - 3 = 7.`,`Third number: 7 x 2 - 3 = 14 - 3 = 11.`],commonMistake:`Choice B (14) comes from doubling the second number correctly but forgetting to subtract 3 again.`,quickTip:`Apply the whole rule - both the doubling AND the subtracting - every single time.`,marks:5},{id:`mock-10-q17`,testId:10,number:17,topic:`Word Problems and Reasoning`,subtopic:`Fraction of a Group`,difficulty:`Moderate`,question:`Lucas has 24 marbles. He gives away 1/4 of them to his friend. How many marbles does Lucas keep?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`6`},{id:`C`,text:`16`},{id:`D`,text:`20`}],correctAnswer:`A`,explanationSteps:[`1/4 of 24 = 24 / 4 = 6 marbles given away.`,`Marbles kept = 24 - 6 = 18.`],commonMistake:`Choice B (6) comes from finding how many marbles were given away instead of how many Lucas kept.`,quickTip:`Reread the question after your first calculation to check exactly what it is asking for.`,marks:5},{id:`mock-10-q18`,testId:10,number:18,topic:`Number Skills`,subtopic:`Digit Arrangement`,difficulty:`Moderate`,question:`Using the digits 3, 4, 7, and 8 exactly once each, what is the largest EVEN 4-digit number you can make?`,diagram:null,choices:[{id:`A`,text:`8743`},{id:`B`,text:`8734`},{id:`C`,text:`7438`},{id:`D`,text:`3478`}],correctAnswer:`B`,explanationSteps:[`For the number to be even, the last digit must be 4 or 8.`,`To make the number as large as possible, try ending in 4: the other digits 8, 7, 3 in order give 8734.`,`Ending in 8 instead gives 7438, which is smaller. So 8734 is the largest even number possible.`],commonMistake:`Choice A (8743) comes from simply arranging all digits from largest to smallest and forgetting to check that the last digit must be even.`,quickTip:`Decide the last digit first when a number must be even, then arrange the rest to make it as large as possible.`,marks:5},{id:`mock-10-q19`,testId:10,number:19,topic:`Challenge Problems`,subtopic:`Number Clues Puzzle (Harder)`,difficulty:`Challenging`,question:`I am a 3-digit number between 300 and 500. The sum of my digits is 14. My hundreds digit is double my units digit. What number am I?`,diagram:null,choices:[{id:`A`,text:`284`},{id:`B`,text:`428`},{id:`C`,text:`482`},{id:`D`,text:`462`}],correctAnswer:`C`,explanationSteps:[`Since the number is between 300 and 500, the hundreds digit is 3 or 4.`,`If the hundreds digit is 4, the units digit must be half of 4, which is 2.`,`The tens digit must make the digit sum 14: 4 + 2 + 8 = 14, so the tens digit is 8.`,`The number is 482.`],commonMistake:`Choice B (428) comes from mixing up the tens and units digits - its digit sum is correct, but the hundreds digit is not double the units digit.`,quickTip:`When a puzzle has several clues, use the strictest clue (like the digit relationship) first to narrow down your search.`,marks:5},{id:`mock-10-q20`,testId:10,number:20,topic:`Word Problems and Reasoning`,subtopic:`Ratio and Fractions`,difficulty:`Challenging`,question:`In a garden, the ratio of roses to tulips is 3:5. If there are 45 tulips, how many roses are there?`,diagram:null,choices:[{id:`A`,text:`15`},{id:`B`,text:`75`},{id:`C`,text:`135`},{id:`D`,text:`27`}],correctAnswer:`D`,explanationSteps:[`The 5 parts of the ratio equal 45 tulips, so 1 part = 45 / 5 = 9.`,`Roses are 3 parts: 3 x 9 = 27.`],commonMistake:`Choice B (75) comes from multiplying 45 by 5 over 3 instead of first dividing to find the value of 1 part.`,quickTip:`Find the value of ONE part of the ratio first, then multiply for whichever amount you need.`,marks:5},{id:`mock-10-q21`,testId:10,number:21,topic:`Word Problems and Reasoning`,subtopic:`Calendar and Days of the Week`,difficulty:`Challenging`,question:`March 1st is a Tuesday. What day of the week is March 25th?`,diagram:null,choices:[{id:`A`,text:`Friday`},{id:`B`,text:`Thursday`},{id:`C`,text:`Saturday`},{id:`D`,text:`Monday`}],correctAnswer:`A`,explanationSteps:[`From March 1st to March 25th is 24 days later.`,`Divide 24 by 7: 24 = 7 x 3 + 3, so it is 3 full weeks and 3 extra days.`,`Count 3 days forward from Tuesday: Wednesday, Thursday, Friday.`,`Therefore March 25th is a Friday.`],commonMistake:`Choice B (Thursday) comes from counting only 2 extra days instead of 3 after removing the full weeks.`,quickTip:`Divide the number of days by 7 first, then count forward only the leftover days.`,marks:5},{id:`mock-10-q22`,testId:10,number:22,topic:`Geometry and Measurement`,subtopic:`Shortest Path Reasoning`,difficulty:`Challenging`,question:`Village A to Village B is 420 m along a road. Village B to Village C is 350 m. There is also a direct path from Village A to Village C that is 690 m long. What is the shortest distance from Village A to Village C?`,diagram:null,choices:[{id:`A`,text:`770 m`},{id:`B`,text:`690 m`},{id:`C`,text:`650 m`},{id:`D`,text:`700 m`}],correctAnswer:`B`,explanationSteps:[`Distance going through Village B: 420 + 350 = 770 m.`,`Compare this with the direct path: 690 m.`,`Since 690 m is less than 770 m, the direct path is shorter.`],commonMistake:`Choice A (770 m) comes from adding the two road distances without comparing the total to the direct path.`,quickTip:`Always compare all possible routes before deciding which one is truly the shortest.`,marks:5},{id:`mock-10-q23`,testId:10,number:23,topic:`Geometry and Measurement`,subtopic:`Ratio, Perimeter, and Area`,difficulty:`Challenging`,question:`The length of a rectangle is 3 times its width. The perimeter is 96 cm. What is the area of the rectangle?`,diagram:null,choices:[{id:`A`,text:`96 sq cm`},{id:`B`,text:`144 sq cm`},{id:`C`,text:`432 sq cm`},{id:`D`,text:`1728 sq cm`}],correctAnswer:`C`,explanationSteps:[`Half the perimeter equals length + width: 96 / 2 = 48 cm.`,`Since length = 3 x width, the width and length together make 4 equal parts: 4 x width = 48, so width = 12 cm.`,`Length = 3 x 12 = 36 cm.`,`Area = 36 x 12 = 432 sq cm.`],commonMistake:`Choice B (144 sq cm) comes from treating the rectangle like a square and multiplying 12 x 12 instead of using the correct length of 36 cm.`,quickTip:`When one side is a multiple of the other, split the half-perimeter into equal parts to find each side.`,marks:5},{id:`mock-10-q24`,testId:10,number:24,topic:`Number Skills`,subtopic:`Arranging Letters`,difficulty:`Challenging`,question:`How many different ways can all 5 letters of the word TIGER be arranged, using each letter exactly once?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`24`},{id:`C`,text:`60`},{id:`D`,text:`120`}],correctAnswer:`D`,explanationSteps:[`There are 5 different letters, so there are 5 choices for the first position, 4 for the next, and so on.`,`Multiply: 5 x 4 x 3 x 2 x 1 = 120.`],commonMistake:`Choice C (60) comes from multiplying only 5 x 4 x 3 and stopping before using all 5 letters.`,quickTip:`For arranging all different letters, multiply the counting numbers down from the total number of letters to 1.`,marks:5},{id:`mock-10-q25`,testId:10,number:25,topic:`Patterns and Operations`,subtopic:`Heads and Wheels Logic Puzzle`,difficulty:`Challenging`,question:`At a farm show, there are ducks and tricycles. Ducks have 2 legs each and tricycles have 3 wheels each. Altogether there are 15 ducks and tricycles, and 38 legs and wheels in total. How many tricycles are there?`,diagram:null,choices:[{id:`A`,text:`8`},{id:`B`,text:`7`},{id:`C`,text:`5`},{id:`D`,text:`10`}],correctAnswer:`A`,explanationSteps:[`If all 15 were ducks, there would be 15 x 2 = 30 legs and wheels.`,`The actual total is 38, which is 8 more than 30.`,`Each tricycle has 1 more wheel than a duck has legs (3 - 2 = 1), so the extra 8 must come from 8 tricycles.`],commonMistake:`Choice B (7) comes from correctly finding the number of ducks (7) but answering with that instead of the number of tricycles.`,quickTip:`In heads-and-legs puzzles, first imagine every animal is the smaller type, then see how far off the total is.`,marks:5},{id:`mock-10-q26`,testId:10,number:26,topic:`Challenge Problems`,subtopic:`Repeating Events (LCM)`,difficulty:`Challenging`,question:`A red light blinks every 8 seconds and a blue light blinks every 12 seconds. Both lights blink together at the very start (0 seconds). After how many seconds will they blink together again for the first time?`,diagram:null,choices:[{id:`A`,text:`16`},{id:`B`,text:`24`},{id:`C`,text:`20`},{id:`D`,text:`96`}],correctAnswer:`B`,explanationSteps:[`List the blink times for the red light: 8, 16, 24, 32, ...`,`List the blink times for the blue light: 12, 24, 36, ...`,`The first time they match is 24 seconds.`],commonMistake:`Choice D (96) comes from multiplying 8 x 12 instead of finding the smallest number that appears in both lists of multiples.`,quickTip:`List out the multiples of each number and look for the first one they share.`,marks:5},{id:`mock-10-q27`,testId:10,number:27,topic:`Challenge Problems`,subtopic:`Multi-Clue Number Puzzle`,difficulty:`Olympiad`,question:`I am a 3-digit number. The sum of my digits is 19. My tens digit is 2 more than my units digit. I am divisible by 5. What number am I?`,diagram:null,choices:[{id:`A`,text:`685`},{id:`B`,text:`790`},{id:`C`,text:`775`},{id:`D`,text:`730`}],correctAnswer:`C`,explanationSteps:[`Since I am divisible by 5, my units digit is 0 or 5.`,`If the units digit is 0, the tens digit would be 2, and the hundreds digit would need to be 17 - impossible for a single digit.`,`So the units digit is 5, the tens digit is 5 + 2 = 7, and the hundreds digit is 19 - 5 - 7 = 7.`,`The number is 775.`],commonMistake:`Choice A (685) comes from finding a number with the correct digit sum (19) that is divisible by 5, but forgetting to check that the tens digit must be exactly 2 more than the units digit (8 is not 5 + 2).`,quickTip:`When a clue forces only two possibilities (like ending in 0 or 5), test each one fully before deciding.`,marks:5},{id:`mock-10-q28`,testId:10,number:28,topic:`Word Problems and Reasoning`,subtopic:`Overlapping Groups`,difficulty:`Olympiad`,question:`In a class of 32 students, 18 like drawing, 15 like singing, and 7 students like both drawing and singing. How many students like neither drawing nor singing?`,diagram:null,choices:[{id:`A`,text:`26`},{id:`B`,text:`13`},{id:`C`,text:`20`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`Students who like at least one activity = 18 + 15 - 7 = 26 (subtracting the 7 who were counted twice).`,`Students who like neither = 32 - 26 = 6.`],commonMistake:`Choice A (26) comes from correctly finding how many students like at least one activity but forgetting to subtract that from the total of 32 to find 'neither'.`,quickTip:`When groups overlap, subtract the overlap once before adding, then subtract the result from the total to find 'neither'.`,marks:5},{id:`mock-10-q29`,testId:10,number:29,topic:`Challenge Problems`,subtopic:`Working Backwards`,difficulty:`Olympiad`,question:`Aiko thought of a number. She added 15, then multiplied the result by 3, then subtracted 9, and got 90. What number did Aiko start with?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`33`},{id:`C`,text:`24`},{id:`D`,text:`28`}],correctAnswer:`A`,explanationSteps:[`Work backwards from 90: undo 'subtract 9' by adding 9: 90 + 9 = 99.`,`Undo 'multiply by 3' by dividing by 3: 99 / 3 = 33.`,`Undo 'add 15' by subtracting 15: 33 - 15 = 18.`,`Aiko's starting number was 18.`],commonMistake:`Choice B (33) comes from correctly undoing the first two steps but forgetting to subtract 15 at the end.`,quickTip:`To work backwards through a chain of operations, reverse both the order and the operation (add becomes subtract, multiply becomes divide).`,marks:5},{id:`mock-10-q30`,testId:10,number:30,topic:`Challenge Problems`,subtopic:`Multi-Friend Ratio Puzzle`,difficulty:`Olympiad`,question:`Three friends, Zara, Non, and Ravi, have 50 stickers altogether. Zara has 6 more stickers than Non. Ravi has twice as many stickers as Zara. How many stickers does Ravi have?`,diagram:null,choices:[{id:`A`,text:`14`},{id:`B`,text:`28`},{id:`C`,text:`20`},{id:`D`,text:`30`}],correctAnswer:`B`,explanationSteps:[`Let Non's stickers be 1 unit. Then Zara has 1 unit + 6.`,`Ravi has twice Zara's amount: 2 units + 12.`,`All three together: 1 unit + (1 unit + 6) + (2 units + 12) = 4 units + 18 = 50, so 4 units = 32, meaning 1 unit = 8.`,`Zara = 8 + 6 = 14, and Ravi = 2 x 14 = 28.`],commonMistake:`Choice A (14) comes from correctly finding Zara's number of stickers but answering with it instead of Ravi's.`,quickTip:`In multi-person puzzles, write each person's amount in terms of the same unit before adding them all together.`,marks:5}]},Hr=[{testId:1,title:`Number Explorer`,subtitle:`Warm up with numbers, place value, and simple patterns.`,tier:`Foundation`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:2,title:`Pattern Detective`,subtitle:`Spot the rule and predict what comes next.`,tier:`Foundation`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:3,title:`Smart Solver`,subtitle:`Multi-step word problems and everyday reasoning.`,tier:`Building`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:4,title:`Geometry Quest`,subtitle:`Shapes, perimeter, and measurement in real situations.`,tier:`Building`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:5,title:`Logic Builder`,subtitle:`Puzzles, probability, and careful step-by-step thinking.`,tier:`Advancing`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:6,title:`Maths Challenger`,subtitle:`Trickier patterns and problems that need two ideas at once.`,tier:`Advancing`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:7,title:`Olympiad Training`,subtitle:`Competition-style reasoning across every topic area.`,tier:`Advancing`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:8,title:`Advanced Reasoning`,subtitle:`Deeper logic puzzles and multi-step olympiad problems.`,tier:`Final Challenge`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:9,title:`Final Preparation`,subtitle:`A full-difficulty mixed review before the last test.`,tier:`Final Challenge`,questionCount:30,timeLimitMinutes:90,totalMarks:150},{testId:10,title:`Grand Challenge`,subtitle:`The toughest mix of everything - the final simulation.`,tier:`Final Challenge`,questionCount:30,timeLimitMinutes:90,totalMarks:150}];function Ur(e){return Hr.find(t=>t.testId===e)}function Wr(e){

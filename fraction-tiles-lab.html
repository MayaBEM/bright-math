/* Fraction Tiles Lab · "Swiss poster" theme. Flat color, black rules, square corners. */
:root {
  --paper: #F7F6F2; --white: #fff; --ink: #111; --ink2: #4a4844; --rule: 3px;
  --red: #E63B2E; --yellow: #F6C22B; --blue: #1F4FD1; --green: #0B7F58;
  --good: #0B7F58; --good-bg: #E2F3EA; --bad: #C2271B; --bad-bg: #FCE6E2;
  --hl: #F6C22B;
  --th: 64px;           /* tile thickness */
  --vlen: min(62vh, 560px); /* bar length when the board is turned */
  --f: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;
}
/* tile colors: one per size, always shown with a label as well */
.c1 { --c: #D8D2C4; --ci: #111; }
.c2 { --c: #E63B2E; --ci: #fff; }
.c3 { --c: #F6C22B; --ci: #111; }
.c4 { --c: #F28C28; --ci: #111; }
.c5 { --c: #1F4FD1; --ci: #fff; }
.c6 { --c: #F3A6B5; --ci: #111; }
.c8 { --c: #111111; --ci: #fff; }
.c10 { --c: #0B7F58; --ci: #fff; }
.c12 { --c: #8FB8E8; --ci: #111; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 18px; line-height: 1.45; min-height: 100vh; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -0.02em; }
p { margin: 0; }
b { font-weight: 800; }
#app { min-height: 100vh; display: flex; flex-direction: column; }
main { width: 100%; max-width: 1180px; margin: 0 auto; padding: 24px 24px 48px; flex: 1; outline: none; }

/* fractions, stacked everywhere */
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; font-weight: 800; font-variant-numeric: lining-nums tabular-nums; margin: 0 .08em; }
.fr .nu { padding: 0 .12em .08em; }
.fr .de { padding: .08em .12em 0; border-top: .1em solid currentColor; }
.mx { display: inline-flex; align-items: center; gap: .1em; font-weight: 800; white-space: nowrap; }
p .fr, li .fr, small .fr { font-size: .86em; }

/* ── header / footer ── */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: var(--white); border-bottom: var(--rule) solid var(--ink); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px 0; text-align: left; }
.brand b { display: block; font-size: 20px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.brand small { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin-top: 3px; }
.mark { display: grid; gap: 3px; width: 34px; }
.mark i { display: block; height: 8px; background: var(--ink); }
.mark i:nth-child(2) { width: 50%; background: var(--red); } .mark i:nth-child(3) { width: 75%; background: var(--blue); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 0; border-bottom: 4px solid transparent; padding: 8px 12px; font-weight: 700; font-size: 17px; min-height: 48px; }
nav button:hover { border-bottom-color: var(--ink2); }
nav button[aria-current="page"] { border-bottom-color: var(--red); }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 24px; border-top: var(--rule) solid var(--ink); background: var(--white); font-size: 14px; color: var(--ink2); }
.foot b { color: var(--ink); }

/* ── buttons ── */
.primary, .ghost { min-height: 54px; padding: 10px 24px; border: var(--rule) solid var(--ink); font-weight: 800; font-size: 18px; transition: background .15s, color .15s, transform .1s; }
.primary { background: var(--ink); color: #fff; }
.primary:hover { background: var(--red); border-color: var(--red); }
.ghost { background: var(--white); }
.ghost:hover { background: var(--ink); color: #fff; }
.primary:active, .ghost:active { transform: translateY(2px); }
.primary:disabled, .ghost:disabled { opacity: .35; cursor: default; transform: none; }
.primary.sm, .ghost.sm { min-height: 44px; padding: 6px 16px; font-size: 16px; }
.primary.big { min-height: 64px; font-size: 22px; padding: 12px 36px; }
.ghost.danger { border-color: var(--bad); color: var(--bad); }
.ghost.danger:hover { background: var(--bad); color: #fff; }
.link { background: none; border: 0; padding: 6px 0; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; min-height: 44px; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

/* ── page heads ── */
.pagehead { margin-bottom: 18px; }
.pagehead h2 { font-size: clamp(34px, 5vw, 52px); font-weight: 900; }
.pagehead p { margin-top: 8px; max-width: 62ch; color: var(--ink2); }
.pagehead .meta { color: var(--ink); }
.legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }

/* ── home ── */
.home { min-height: 100vh; display: flex; flex-direction: column; }
.h-top { display: flex; justify-content: space-between; gap: 12px; padding: 14px 28px; border-bottom: var(--rule) solid var(--ink); background: var(--white); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 14px; flex-wrap: wrap; }
.h-brand::before { content: ''; display: inline-block; width: 14px; height: 14px; background: var(--red); margin-right: 10px; vertical-align: -1px; }
.h-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 32px; padding: 32px 28px 28px; max-width: 1280px; width: 100%; margin: 0 auto; align-items: center; }
.h-title h1 { font-size: clamp(54px, 9.5vw, 132px); font-weight: 900; line-height: .86; letter-spacing: -0.045em; }
.h-title p { margin-top: 20px; font-size: 20px; max-width: 30ch; color: var(--ink2); }
.free-tag { display: inline-block; margin-top: 14px !important; background: var(--yellow); color: var(--ink) !important; padding: 4px 12px; font-weight: 800; border: var(--rule) solid var(--ink); }
.wall .bd.mini { --th: clamp(26px, 4.2vw, 46px); }
.wl { display: flex; height: var(--th); background: var(--ink); border-left: var(--rule) solid var(--ink); border-right: var(--rule) solid var(--ink); }
.wl:first-child { border-top: var(--rule) solid var(--ink); } .wl:last-child { border-bottom: var(--rule) solid var(--ink); }
.wl .tile { animation: wallIn .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 60ms); transform-origin: left center; }
@keyframes wallIn { from { transform: scaleX(0); } to { transform: none; } }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: var(--rule) solid var(--ink); border-bottom: var(--rule) solid var(--ink); max-width: 1280px; width: calc(100% - 56px); margin: 0 auto; background: var(--white); }
.mode { text-align: left; background: var(--white); border: 0; border-right: var(--rule) solid var(--ink); padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 8px; min-height: 190px; transition: background .15s, color .15s; }
.mode:last-child { border-right: 0; }
.mode i { font-style: normal; font-weight: 900; font-size: 15px; letter-spacing: .1em; }
.mode b { font-size: clamp(28px, 3vw, 40px); font-weight: 900; letter-spacing: -0.03em; }
.mode span { color: var(--ink2); font-size: 16px; }
.mode:nth-child(1) i { color: var(--red); } .mode:nth-child(2) i { color: var(--blue); } .mode:nth-child(3) i { color: var(--green); } .mode:nth-child(4) i { color: #B57F00; }
.mode:hover { background: var(--ink); color: #fff; } .mode:hover span { color: #ddd; }
.h-foot { max-width: 1280px; width: calc(100% - 56px); margin: 12px auto 28px; }
.home .foot { margin-top: auto; }

/* ── board ── */
.bd { --cap: 120; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tray { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.tt { position: relative; height: 66px; background: var(--c); color: var(--ci); border: var(--rule) solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; touch-action: none; transition: transform .12s; }
.tt .sw { display: none; }
.tt:hover { transform: translateY(-3px); }
.tt:active { transform: translateY(1px); }
.nolab .tt .lab { visibility: hidden; }
.field { display: flex; flex-direction: column; gap: 10px; }
.lane { display: grid; grid-template-columns: 44px minmax(0, 1fr) 0; align-items: center; gap: 10px; }
.tots .lane { grid-template-columns: 44px minmax(0, 1fr) 76px; }
.lane .bar { position: relative; display: flex; height: var(--th); background: var(--white); outline: var(--rule) solid var(--ink); }
.lane.ref .bar { background: var(--ink); }
.seg { flex: 0 0 calc(var(--u) / var(--cap) * 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 26px; box-shadow: inset -1.5px 0 0 #fff; }
.seg:last-child { box-shadow: none; }
.tag { width: 44px; height: 44px; border: var(--rule) solid var(--ink); background: var(--white); font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; padding: 0; }
.ghosttag { border-color: transparent; background: none; }
.lane.row.on .tag { background: var(--ink); color: #fff; }
.tot { font-size: 24px; font-weight: 800; text-align: center; }
.tile { flex: 0 0 calc(var(--u) / var(--cap) * 100%); min-width: 0; height: 100%; padding: 0; border: 0; background: var(--c); color: var(--ci); box-shadow: inset 0 0 0 1.5px var(--ink); display: flex; align-items: center; justify-content: center; container-type: size; touch-action: none; position: relative; }
.c8.tile, .dragghost.c8 { box-shadow: inset 0 0 0 1.5px var(--ink), inset 0 0 0 3px #fff; }
.tile .lab, .dragghost .lab { font-size: clamp(9px, min(40cqw, 30cqh), 28px); font-weight: 900; }
.nolab .tile .lab, .dragghost.nolab .lab { visibility: hidden; }
.tile.lock { cursor: default; background-image: repeating-linear-gradient(135deg, transparent 0 9px, rgba(0, 0, 0, .14) 9px 11px); }
.tile:not(.lock):hover { filter: brightness(1.06); }
.tile.pop { animation: pop .18s cubic-bezier(.2, .9, .3, 1.4); }
.tile.out { animation: out .14s ease-in forwards; }
.tile.lifted { opacity: .25; }
@keyframes pop { from { transform: scale(.82); } to { transform: none; } }
@keyframes out { to { transform: scale(.6); opacity: 0; } }
.ph { flex: 0 0 calc(var(--u) / var(--cap) * 100%); height: 100%; background: repeating-linear-gradient(90deg, rgba(17, 17, 17, .08) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 3px var(--ink); }
.lane.over .bar { outline-color: var(--blue); }
.lane.nofit .bar { outline-color: var(--bad); outline-style: dashed; }
.dragghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; background: var(--c); color: var(--ci); box-shadow: inset 0 0 0 1.5px var(--ink); display: flex; align-items: center; justify-content: center; container-type: size; transition: box-shadow .12s; }
.dragghost.lift { box-shadow: inset 0 0 0 1.5px var(--ink), 6px 6px 0 rgba(17, 17, 17, .85); }
.dragghost.bad { opacity: .6; box-shadow: inset 0 0 0 3px var(--bad); }
.bd.dragging { cursor: grabbing; }
.bd-msg { min-height: 28px; margin-top: 12px; font-weight: 700; color: var(--ink2); }
.bd-msg.bad { color: var(--bad); }
.bd-msg.flash { animation: flash .4s; }
@keyframes flash { 0% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 100% { transform: none; } }

/* turned board (portrait phones) */
.bd.vert .field { flex-direction: row; gap: 10px; overflow-x: auto; padding: 4px 4px 8px; }
.bd.vert .lane { grid-template-columns: none; grid-template-rows: 44px var(--vlen) 0; justify-items: center; width: var(--th); flex: 0 0 auto; }
.bd.vert.tots .lane { grid-template-rows: 44px var(--vlen) 64px; }
.bd.vert .lane .bar { flex-direction: column; height: var(--vlen); width: var(--th); }
.bd.vert .seg { box-shadow: inset 0 -1.5px 0 #fff; }
.bd.vert .tile, .bd.vert .ph { width: 100%; height: auto; }
.bd.vert .tot { font-size: 18px; }

/* static mini boards (answer pictures) */
.bd.mini { --th: 42px; }
.bd.mini .lane { grid-template-columns: 30px minmax(0, 1fr) 0; gap: 8px; }
.bd.mini .tag { width: 30px; height: 30px; font-size: 14px; border-width: 2px; }
.bd.mini .seg { font-size: 18px; }
.bd.mini .field { gap: 6px; }

/* ── tools ── */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.tools button { min-height: 46px; padding: 6px 14px; background: var(--white); border: 2px solid var(--ink); font-weight: 700; font-size: 16px; }
.tools button:hover { background: #ecebe6; }
.tools button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tools .strong { background: var(--yellow); }
.tools .sep { width: 2px; height: 30px; background: var(--ink); opacity: .2; margin: 0 4px; }
.seg2 { display: inline-flex; } .seg2 button + button { border-left: 0; }
.exitproj { display: none; }

/* projector mode */
body.proj .top, body.proj .foot, body.proj .pagehead { display: none; }
body.proj main { max-width: none; padding: 20px 28px 96px; }
body.proj .bd { --th: clamp(80px, 11vh, 120px); }
body.proj .tt { height: clamp(72px, 10vh, 100px); font-size: 30px; }
body.proj .tag { width: 56px; height: 56px; font-size: 24px; }
body.proj .lane { grid-template-columns: 56px minmax(0, 1fr) 0; }
body.proj .tots .lane { grid-template-columns: 56px minmax(0, 1fr) 100px; }
body.proj .tot { font-size: 34px; }
body.proj .seg { font-size: 40px; }
body.proj .tools { position: fixed; right: 16px; bottom: 16px; z-index: 30; margin: 0; background: var(--white); border: var(--rule) solid var(--ink); padding: 8px; }
body.proj .tools > :not([data-t="undo"]):not([data-t="reset"]):not([data-t="labels"]):not([data-t="totals"]) { display: none; }
body.proj .exitproj { display: block; position: fixed; left: 16px; bottom: 16px; z-index: 30; min-height: 54px; padding: 8px 18px; background: var(--ink); color: #fff; border: 0; font-weight: 800; }

/* ── lists ── */
.list { display: grid; gap: 0; border-top: var(--rule) solid var(--ink); }
.row-item { display: flex; align-items: center; gap: 18px; width: 100%; text-align: left; padding: 16px 12px; background: var(--white); border: 0; border-bottom: var(--rule) solid var(--ink); min-height: 76px; transition: background .15s; }
.row-item:hover { background: #efede6; }
.row-item .num { font-style: normal; font-weight: 900; font-size: 34px; width: 52px; flex: 0 0 auto; }
.ri-main { flex: 1; min-width: 0; } .ri-main b { display: block; font-size: 22px; } .ri-main small { color: var(--ink2); font-size: 15px; }
.ri-state { font-weight: 800; white-space: nowrap; }
.ok { color: var(--good); }
.is-locked { opacity: .5; }
.review { border-top: var(--rule) solid var(--ink); }
.locked { margin-top: 18px; background: var(--yellow); border: var(--rule) solid var(--ink); padding: 18px 20px; max-width: 760px; }
.locked p { margin-top: 6px; }

/* practice */
.psets { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.pset { background: var(--white); border: var(--rule) solid var(--ink); padding: 16px; }
.pset.focus { box-shadow: 8px 8px 0 var(--yellow); }
.pset h3 { font-size: 24px; font-weight: 900; } .pset p { color: var(--ink2); font-size: 15px; margin-top: 4px; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.mb { aspect-ratio: 1; min-height: 52px; border: 2px solid var(--ink); background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; line-height: 1; }
.mb b { font-size: 20px; } .mb small { font-size: 13px; font-weight: 800; min-height: 13px; margin-top: 3px; }
.mb:hover { background: #efede6; }
.mb.won { background: var(--ink); color: #fff; }
.mb.tried { box-shadow: inset 0 -6px 0 var(--yellow); }
.mb.mini { width: 30px; min-height: 30px; aspect-ratio: auto; height: 30px; display: inline-flex; } .mb.mini b { font-size: 14px; }

/* lesson + mission */
.ls-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.std { font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--white); border: 2px solid var(--ink); padding: 3px 10px; }
.lesson h2, .mission h2 { font-size: clamp(30px, 4vw, 44px); font-weight: 900; margin: 6px 0 12px; }
.mission h2 small { font-size: .5em; color: var(--ink2); font-weight: 700; }
.dots { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 14px; flex-wrap: wrap; }
.dots li { width: 26px; height: 8px; background: #d9d6cc; }
.dots li.past { background: var(--ink); } .dots li.now { background: var(--red); width: 44px; }
.step, .prompt { background: var(--white); border: var(--rule) solid var(--ink); padding: 16px 20px; margin-bottom: 16px; }
.prompt { font-size: 22px; font-weight: 600; }
.prompt .hint { display: block; font-size: 15px; color: var(--ink2); font-weight: 500; margin-top: 4px; }
.st-n { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.st-t { font-size: 23px; font-weight: 600; margin-top: 4px; max-width: 60ch; }
.todo { margin-top: 10px; font-size: 15px; font-weight: 800; color: #8a6200; }
.todo::before { content: ''; display: inline-block; width: 12px; height: 12px; background: var(--yellow); border: 2px solid var(--ink); margin-right: 8px; vertical-align: -1px; }
.nudge { animation: flash .4s; }
.done { margin-top: 10px; padding: 10px 14px; background: var(--good-bg); border-left: 6px solid var(--good); font-size: 18px; }
.done b { color: var(--good); }
.q { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.qfb { flex-basis: 100%; padding: 10px 14px; font-size: 17px; }
.qfb.good { background: var(--good-bg); border-left: 6px solid var(--good); } .qfb.bad { background: var(--bad-bg); border-left: 6px solid var(--bad); }
.ls-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.ls-nav .primary.ready { background: var(--red); border-color: var(--red); }
.hl { outline: 5px solid var(--hl) !important; outline-offset: 4px; position: relative; z-index: 2; animation: hl 1.4s ease-in-out 3; }
@keyframes hl { 50% { outline-offset: 8px; } }

/* answers */
.answers { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; margin-top: 18px; }
.ans { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.in-lab { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
.ans input { width: 72px; height: 58px; border: var(--rule) solid var(--ink); background: var(--white); text-align: center; font: 900 30px var(--f); border-radius: 0; padding: 0; }
.ans .w { height: 92px; width: 66px; font-size: 38px; }
.fin { display: flex; align-items: center; gap: 8px; }
.stk { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.bar-l { width: 80px; height: 5px; background: var(--ink); }
.ans small { flex-basis: 100%; color: var(--ink2); font-size: 14px; }
.sym .cv { font-size: 34px; }
.symset { display: inline-flex; gap: 6px; }
.sb, .ch, .oc, .os { min-height: 58px; min-width: 64px; border: var(--rule) solid var(--ink); background: var(--white); font-weight: 900; font-size: 28px; padding: 6px 14px; }
.ch { font-size: 22px; min-width: 88px; }
.sb[aria-pressed="true"], .ch[aria-pressed="true"] { background: var(--ink); color: #fff; }
.order { flex-direction: column; align-items: flex-start; }
.ocards, .oslots { display: flex; gap: 8px; flex-wrap: wrap; }
.oc:disabled { opacity: .25; cursor: default; }
.os { min-width: 96px; min-height: 84px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-style: dashed; }
.os small { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.os[data-i] { border-style: solid; }
.check-row { margin-top: 18px; }
.fb { margin-top: 18px; border: var(--rule) solid var(--ink); background: var(--white); padding: 16px 20px; }
.fb.good { border-color: var(--good); box-shadow: inset 8px 0 0 var(--good); }
.fb.bad { border-color: var(--bad); box-shadow: inset 8px 0 0 var(--bad); }
.fb > p { margin-left: 6px; margin-top: 6px; }
.verdict { font-size: 22px; }
.fb.good .verdict b { color: var(--good); } .fb.bad .verdict b { color: var(--bad); }
.solpic { margin: 14px 0 0 6px; max-width: 720px; }
.solpic .cap { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); margin-bottom: 8px; }
.finish { text-align: left; padding: 30px 0; }
.finish .big { font-size: 80px; font-weight: 900; color: var(--good); line-height: 1; }
.finish h2 { font-size: 40px; font-weight: 900; margin: 8px 0; }

/* test */
.t-intro { background: var(--white); border: var(--rule) solid var(--ink); padding: 24px; max-width: 760px; }
.facts { list-style: none; padding: 0; margin: 0 0 16px; display: flex; gap: 28px; flex-wrap: wrap; }
.facts b { font-size: 48px; font-weight: 900; display: block; line-height: 1; }
.t-intro p { margin-bottom: 18px; }
.meta { margin-top: 12px; }
.t-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; margin-bottom: 14px; font-weight: 800; }
.prog { height: 12px; border: 2px solid var(--ink); background: var(--white); } .prog i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.clock { font-size: 26px; font-variant-numeric: tabular-nums; border: var(--rule) solid var(--ink); padding: 2px 12px; background: var(--white); }
.clock.low { background: var(--red); color: #fff; border-color: var(--red); }
.t-help { margin-top: 10px; font-size: 14px; color: var(--ink2); }
.score { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; background: var(--white); border: var(--rule) solid var(--ink); padding: 20px 24px; }
.score .big { font-size: 96px; font-weight: 900; line-height: .9; letter-spacing: -0.04em; } .score .big span { font-size: .4em; color: var(--ink2); }
.score h2 { font-size: 34px; font-weight: 900; }
.results h3, .progress h3, main > h3 { font-size: 24px; font-weight: 900; margin: 26px 0 10px; }
.topics { display: grid; gap: 8px; }
.tp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) 48px; gap: 12px; align-items: center; background: var(--white); border: 2px solid var(--ink); padding: 8px 12px; }
.tp.weak { border-color: var(--bad); }
.meter { display: block; height: 14px; background: #e6e3da; } .meter i { display: block; height: 100%; background: var(--ink); }
.meter.t i { background: var(--blue); }
.tp.weak .meter i { background: var(--bad); }
.allgood { margin-top: 16px; font-weight: 800; color: var(--good); }
.answers-list { padding-left: 28px; display: grid; gap: 10px; }
.answers-list li { background: var(--white); border: 2px solid var(--ink); padding: 10px 14px; }
.answers-list li.bad { border-color: var(--bad); } .answers-list li.good b { color: var(--good); } .answers-list li.bad b { color: var(--bad); }
.answers-list .q { font-weight: 700; } .answers-list .ex { color: var(--ink2); font-size: 16px; margin-top: 4px; }

/* progress */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: var(--rule) solid var(--ink); background: var(--white); margin-bottom: 20px; }
.stats > div { padding: 16px 18px; border-right: var(--rule) solid var(--ink); }
.stats > div:last-child { border-right: 0; }
.stats b { display: block; font-size: 44px; font-weight: 900; line-height: 1; } .stats b span { font-size: .45em; color: var(--ink2); }
.stats small { font-size: 15px; color: var(--ink2); }
.tablewrap { overflow-x: auto; }
.dash { width: 100%; border-collapse: collapse; background: var(--white); border: var(--rule) solid var(--ink); }
.dash th, .dash td { padding: 12px 14px; border-bottom: 2px solid #ddd9cf; text-align: left; vertical-align: middle; }
.dash thead th { background: var(--ink); color: #fff; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.dash .c { text-align: center; }
.dash td small { display: block; font-size: 14px; color: var(--ink2); margin-top: 4px; }
.dash .meter { min-width: 120px; }
.spark { display: flex; gap: 8px; align-items: flex-end; height: 130px; background: var(--white); border: var(--rule) solid var(--ink); padding: 12px; }
.sp { flex: 1; max-width: 48px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.sp i { display: block; width: 100%; background: var(--blue); min-height: 2px; } .sp small { font-weight: 800; font-size: 13px; }
.confirm { margin-top: 12px; background: var(--bad-bg); border: 2px solid var(--bad); padding: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.confirm[hidden] { display: none; }

/* ── responsive ── */
@media (max-width: 900px) {
  .h-grid { grid-template-columns: 1fr; }
  .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mode:nth-child(2) { border-right: 0; }
  .mode:nth-child(-n+2) { border-bottom: var(--rule) solid var(--ink); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats > div:nth-child(2) { border-right: 0; } .stats > div:nth-child(-n+2) { border-bottom: var(--rule) solid var(--ink); }
}
@media (max-width: 640px) {
  body { font-size: 17px; }
  :root { --th: 52px; }
  main { padding: 16px 16px 40px; }
  .top { padding: 8px 16px; gap: 6px; }
  .brand b { font-size: 18px; }
  nav { width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
  nav button { font-size: 14px; padding: 6px 2px; min-height: 44px; }
  .tray { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .tt { height: 54px; font-size: 19px; }
  .lane { grid-template-columns: 34px minmax(0, 1fr) 0; gap: 8px; }

<noscript><p style="padding:24px;font:18px sans-serif">Fraction Tiles Lab needs JavaScript. Open this file in Chrome, Edge or Safari.</p></noscript>
<script>window.FTL_EDITION = 'full';</script>
<script>
// Fraction Tiles Lab · content + exact fraction math (no floating point anywhere).
// Text uses tokens {3/4} and {1 2/3}; the app renders them as stacked fractions.
(function (root) {
  'use strict';
  // ── exact fractions as [numerator, denominator] ──
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const F = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; };
  const add = (a, b) => F(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
  const sub = (a, b) => F(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
  const cmp = (a, b) => Math.sign(a[0] * b[1] - b[0] * a[1]);
  const eq = (a, b) => cmp(a, b) === 0;
  const str = (f) => f[1] === 1 ? String(f[0]) : `${f[0]}/${f[1]}`;
  const mixedStr = (f) => { const [n, d] = F(f[0], f[1]); if (d === 1) return String(n); if (n < d) return `${n}/${d}`; const w = Math.floor(n / d); return `${w} ${n - w * d}/${d}`; };
  const tok = (f) => `{${str(f)}}`;

  // One whole is 120 units: the LCM of 2, 3, 4, 5, 6, 8, 10 and 12, so every tile is a whole number of units.
  const PLURAL = { 2: 'halves', 3: 'thirds', 4: 'fourths', 5: 'fifths', 6: 'sixths', 8: 'eighths', 10: 'tenths', 12: 'twelfths' };
  const UNITS = 120;
  const DENS = [1, 2, 3, 4, 5, 6, 8, 10, 12];
  const unitsOf = (d) => UNITS / d;

  // ── board helpers (row = { tiles: [{ d, lock }] }) ──
  const rowTotal = (row) => row.tiles.reduce((s, t) => add(s, [1, t.d]), [0, 1]);
  const freeTiles = (row) => row.tiles.filter((t) => !t.lock);
  const freeSizes = (row) => [...new Set(freeTiles(row).map((t) => t.d))];
  const freeTotal = (row) => freeTiles(row).reduce((s, t) => add(s, [1, t.d]), [0, 1]);
  const sizeName = (d) => d === 1 ? '1-whole' : `{1/${d}}`;
  const rowAsFraction = (row) => { // what a single-size row "says": count / size
    const s = freeSizes(row); if (s.length !== 1) return null; return [freeTiles(row).length, s[0]];
  };

  // Requirement on one row. Returns '' when met, else a short student-facing reason.
  function checkReq(board, q) {
    const row = board.rows[q.row]; const R = `row ${q.row + 1}`;
    if (!row) return `Use ${R}.`;
    const free = freeTiles(row);
    if (q.total && !free.length && !row.tiles.length) return `${cap(R)} is empty. Build it with tiles first.`;
    if (q.only && free.some((t) => !q.only.includes(t.d))) return `Use only ${q.only.map(sizeName).join(' and ')} tiles in ${R}.`;
    if (q.single && freeSizes(row).length > 1) return `Use one tile size in ${R}, not a mix.`;
    if (q.notSize && free.length && freeSizes(row).every((d) => q.notSize.includes(d))) return `Try a different tile size in ${R} from the one already shown.`;
    if (q.needFree && !free.length) return `Add tiles to ${R}.`;
    if (q.total) {
      const t = q.freeOnly ? freeTotal(row) : rowTotal(row);
      if (!eq(t, q.total)) return `${cap(R)} is ${tok(t)} long. It should be ${tok(q.total)} long${cmp(t, q.total) > 0 ? ', so it is too long' : ', so it is too short'}.`;
    }
    return '';
  }
  const cap = (s) => s[0].toUpperCase() + s.slice(1);

  // Parse a typed fraction {w, n, d} (strings). Returns [n, d] or null.
  function parseFrac(v) {
    const w = (v.w ?? '').trim(), n = (v.n ?? '').trim(), d = (v.d ?? '').trim();
    const ok = (x) => /^\d{1,3}$/.test(x);
    if (!n && !d && ok(w)) return [Number(w), 1];
    if (!ok(n) || !ok(d) || Number(d) === 0) return null;
    if (w && !ok(w)) return null;
    return F(Number(w || 0) * Number(d) + Number(n), Number(d));
  }

  // ── lessons ── (board: setup; wait: (board) => true when the step is done)
  const R = (board, i) => board.rows[i];
  const isRow = (b, i, total, opts = {}) => !checkReq(b, { row: i, total, ...opts });
  const LESSONS = [
    { id: 'L1', topic: 'unit', title: 'Meet the Tiles', sub: 'Unit fractions', std: '3.NF.A.1', steps: [
      { text: 'This long bar is <b>1 whole</b>. Every tile is measured against it.', board: { rows: [{}, {}] }, hl: ['ref'] },
      { text: 'These are your fraction tiles. Each size has its own color, and the label tells you its size.', hl: ['tray'] },
      { text: 'Drag the red {1/2} tile into <b>row 1</b>. You can also tap a tile to drop it into the selected row.', hl: ['tray:2', 'row:0'], wait: (b) => R(b, 0).tiles.some((t) => t.d === 2), done: 'It snapped to the left edge, right under the whole.' },
      { text: 'Add one more {1/2} tile to row 1.', hl: ['tray:2'], wait: (b) => isRow(b, 0, [1, 1], { only: [2] }), done: 'Two halves fill 1 whole exactly. Not too long, not too short.' },
      { text: 'Now fill <b>row 2</b> with {1/4} tiles until it is as long as the whole. Count as you go.', hl: ['tray:4', 'row:1'], wait: (b) => isRow(b, 1, [1, 1], { only: [4] }), done: 'Four fourths make 1 whole. Each piece is {1/4}: <b>1</b> of <b>4</b> equal parts.' },
      { text: 'Tap any tile on the board to take it off. Try it on row 2.', hl: ['row:1'], wait: (b) => R(b, 1).tiles.length === 3, done: 'Gone. Tiles you tap go back to the tray.' },
      { text: 'Made a mistake? Press <b>Undo</b> to bring the tile back.', hl: ['undo'], wait: (b) => R(b, 1).tiles.length === 4, done: 'Undo steps back one move at a time.' },
      { text: 'Which tile is longer, {1/3} or {1/8}? Put one of each on the board to check.', board: { rows: [{}, {}] }, q: { type: 'choice', options: ['{1/3}', '{1/8}'], answer: 0, explain: 'The whole is shared by 3 parts for thirds but 8 parts for eighths. Fewer parts means each part is bigger, so {1/3} is longer.' } },
      { text: 'A whole is cut into 5 equal parts. What do we call one part?', q: { type: 'choice', options: ['{1/5}', '{5/1}', '{1/4}'], answer: 0, explain: 'One part out of 5 equal parts is {1/5}. The bottom number tells how many equal parts make the whole.' } },
      { text: 'Press <b>Labels</b> to hide the numbers. Can you still tell the tiles apart by length?', hl: ['labels'], wait: (b) => !b.labels, done: 'Good. Length is what matters. Turn labels back on whenever you like.' },
      { text: '<b>Remember:</b> a unit fraction like {1/6} is one equal part of a whole cut into 6. The bigger the bottom number, the smaller the tile.' },
    ] },
    { id: 'L2', topic: 'build', title: 'Building Fractions', sub: 'Count tiles of one size', std: '3.NF.A.1 · 4.NF.B.3b', steps: [
      { text: '{3/5} means <b>3</b> tiles that are each {1/5}. The top number counts the tiles. The bottom number names their size.', board: { rows: [{}, {}, {}] } },
      { text: 'Build {3/5} in row 1.', hl: ['tray:5', 'row:0'], wait: (b) => isRow(b, 0, [3, 5], { only: [5] }), done: '3 fifths: three {1/5} tiles side by side.' },
      { text: 'Clear row 1 (tap the tiles off, or press Reset). Then build {5/8} in row 1.', hl: ['tray:8'], wait: (b) => isRow(b, 0, [5, 8], { only: [8] }), done: 'Five {1/8} tiles make {5/8}.' },
      { text: 'Row 1 now shows {5/8}. Split it: put some eighths in row 2 and the rest in row 3, so rows 2 and 3 together match row 1.', board: { rows: [{ lock: [8, 8, 8, 8, 8] }, {}, {}] }, hl: ['row:1', 'row:2'], wait: (b) => R(b, 1).tiles.length && R(b, 2).tiles.length && !checkReq(b, { row: 1, only: [8] }) && !checkReq(b, { row: 2, only: [8] }) && eq(add(rowTotal(R(b, 1)), rowTotal(R(b, 2))), [5, 8]), done: (b) => `You showed {5/8} = {${R(b, 1).tiles.length}/8} + {${R(b, 2).tiles.length}/8}. Breaking a fraction into parts is called <b>decomposing</b>.` },
      { text: 'Which one shows {4/6}?', q: { type: 'choice', options: ['4 tiles that are each {1/6}', '6 tiles that are each {1/4}', '1 tile that is {1/4}'], answer: 0, explain: 'The bottom number 6 names the size ({1/6}). The top number 4 counts them: four {1/6} tiles.' } },
      { text: '{7/10} = {4/10} + ?', q: { type: 'choice', options: ['{3/10}', '{3/7}', '{11/10}'], answer: 0, explain: '7 tenths take away 4 tenths leaves 3 tenths. The size of the tiles does not change, so it is {3/10}.' } },
    ] },
    { id: 'L3', topic: 'equiv', title: 'Equivalent Fractions', sub: 'Same length, new name', std: '3.NF.A.3a–b · 4.NF.A.1', steps: [
      { text: 'Row 1 shows {1/2}. Use {1/4} tiles in row 2 to make the <b>same length</b>.', board: { rows: [{ lock: [2] }, {}, {}, {}] }, hl: ['tray:4', 'row:1'], wait: (b) => isRow(b, 1, [1, 2], { only: [4] }), done: '{2/4} is exactly as long as {1/2}. Same length means <b>equivalent</b>: {1/2} = {2/4}.' },
      { text: 'Now use {1/6} tiles in row 3.', hl: ['tray:6', 'row:2'], wait: (b) => isRow(b, 2, [1, 2], { only: [6] }), done: '{1/2} = {2/4} = {3/6}.' },
      { text: 'And {1/8} tiles in row 4.', hl: ['tray:8', 'row:3'], wait: (b) => isRow(b, 3, [1, 2], { only: [8] }), done: '{1/2} = {2/4} = {3/6} = {4/8}. Look at the numbers: 1 × 4 = 4 and 2 × 4 = 8. Multiply the top and bottom by the same number and the length stays the same.' },
      { text: 'Row 1 shows {2/3}. Find a tile size that matches it <b>exactly</b> in row 2. Not every size works.', board: { rows: [{ lock: [3, 3] }, {}, {}] }, hl: ['row:1'], wait: (b) => isRow(b, 1, [2, 3], { single: true, notSize: [3], needFree: true }), done: (b) => { const f = rowAsFraction(R(b, 1)); return `{2/3} = {${f[0]}/${f[1]}}. Fourths, fifths and eighths never line up with the end of {2/3}.`; } },
      { text: 'Which fraction is equal to {3/4}?', q: { type: 'choice', options: ['{6/8}', '{3/8}', '{4/3}'], answer: 0, explain: '{3/4} = {6/8} because 3 × 2 = 6 and 4 × 2 = 8. Six eighths are as long as three fourths.' } },
      { text: '{2/5} = <b>?</b>/10', q: { type: 'choice', options: ['4', '5', '2'], answer: 0, explain: 'Each {1/5} tile is as long as two {1/10} tiles, so 2 fifths = 4 tenths: {2/5} = {4/10}.' } },
    ] },
    { id: 'L4', topic: 'compare', title: 'Comparing Fractions', sub: 'Longer, shorter or equal', std: '3.NF.A.3d · 4.NF.A.2', steps: [
      { text: 'Same size tiles: rows 1 and 2 both use eighths. Which is longer?', board: { rows: [{ lock: [8, 8, 8] }, { lock: [8, 8, 8, 8, 8] }] }, q: { type: 'sym', a: '{3/8}', b: '{5/8}', answer: '<', explain: 'Same tile size, so count tiles: 3 is less than 5, so {3/8} < {5/8}.' } },
      { text: 'Same top number: build {2/3} in row 1 and {2/5} in row 2.', board: { rows: [{}, {}] }, hl: ['row:0', 'row:1'], wait: (b) => isRow(b, 0, [2, 3], { only: [3] }) && isRow(b, 1, [2, 5], { only: [5] }), done: 'Both rows have 2 tiles, but the tiles are not the same size.' },
      { text: 'So which is bigger?', q: { type: 'sym', a: '{2/3}', b: '{2/5}', answer: '>', explain: 'Thirds are bigger than fifths, so 2 thirds are longer than 2 fifths: {2/3} > {2/5}.' } },
      { text: 'Use {1/2} as a benchmark. Row 1 shows {1/2}. Build {3/8} in row 2.', board: { rows: [{ lock: [2] }, {}] }, hl: ['row:1'], wait: (b) => isRow(b, 1, [3, 8], { only: [8] }), done: '{3/8} stops before the end of {1/2}.' },
      { text: 'Compare.', q: { type: 'sym', a: '{3/8}', b: '{1/2}', answer: '<', explain: 'Half of 8 is 4, so {4/8} = {1/2}. Three eighths is less: {3/8} < {1/2}.' } },
      { text: 'Without building: {4/6} is more than {1/2}, and {3/8} is less than {1/2}. So…', q: { type: 'sym', a: '{4/6}', b: '{3/8}', answer: '>', explain: 'One is past the halfway mark and one is not, so {4/6} > {3/8}.' } },
      { text: '<b>Three ways to compare:</b> same size, count the tiles. Same count, the bigger tiles win. Different both ways, check each against {1/2} or build them and line up the ends.' },
    ] },
    { id: 'L5', topic: 'mixed', title: 'Beyond 1 Whole', sub: 'Improper fractions and mixed numbers', std: '3.NF.A.3c · 4.NF.B.3', steps: [
      { text: 'Now there are <b>2 wholes</b>. Fill row 1 with {1/3} tiles to the end of the first whole.', board: { wholes: 2, rows: [{}, {}] }, hl: ['tray:3', 'row:0'], wait: (b) => isRow(b, 0, [1, 1], { only: [3] }), done: '{3/3} = 1. Any fraction with the same top and bottom number is 1 whole.' },
      { text: 'Keep going: add 2 more thirds to row 1.', hl: ['tray:3'], wait: (b) => isRow(b, 0, [5, 3], { only: [3] }), done: '{5/3} is longer than 1 whole. When the top number is bigger than the bottom, it is an <b>improper fraction</b>.' },
      { text: 'Build the same length in row 2 with <b>one 1-whole tile</b> and some thirds.', hl: ['tray:1', 'row:1'], wait: (b) => isRow(b, 1, [5, 3], { only: [1, 3] }) && R(b, 1).tiles.filter((t) => t.d === 1).length === 1, done: '{5/3} = {1 2/3}. A whole number and a fraction together make a <b>mixed number</b>.' },
      { text: '{7/4} = ?', board: { wholes: 2, rows: [{}, {}] }, q: { type: 'choice', options: ['{1 3/4}', '{1 4/7}', '{7 1/4}'], answer: 0, explain: '4 fourths make 1 whole. 7 fourths is 1 whole and 3 more fourths: {1 3/4}.' } },
      { text: 'Which is equal to 2?', q: { type: 'choice', options: ['{8/4}', '{4/8}', '{2/4}'], answer: 0, explain: '4 fourths make 1, so 8 fourths make 2.' } },
      { text: '{1 1/6} = ?', q: { type: 'choice', options: ['{7/6}', '{6/7}', '{2/6}'], answer: 0, explain: '1 whole is {6/6}. Add {1/6} more: {7/6}.' } },
    ] },
    { id: 'L6', topic: 'addlike', title: 'Add and Subtract: Same Size', sub: 'Join tiles, take tiles away', std: '4.NF.B.3a, d', steps: [
      { text: '{2/5} + {1/5}: put 2 fifths in row 1, then 1 more fifth.', board: { rows: [{}, {}] }, hl: ['tray:5', 'row:0'], wait: (b) => isRow(b, 0, [3, 5], { only: [5] }), done: '{2/5} + {1/5} = {3/5}. Add the top numbers. The tile size, the bottom number, stays the same.' },
      { text: '{3/8} + {4/8} = ?', q: { type: 'choice', options: ['{7/8}', '{7/16}', '{12/8}'], answer: 0, explain: '3 eighths and 4 eighths are 7 eighths. Adding does not change the tile size, so the bottom stays 8.' } },
      { text: 'Row 1 shows {5/6}. Take away {2/6}: tap two tiles off.', board: { rows: [{ tiles: [6, 6, 6, 6, 6] }] }, hl: ['row:0'], wait: (b) => isRow(b, 0, [3, 6], { only: [6] }), done: '{5/6} − {2/6} = {3/6}.' },
      { text: '{4/5} + {3/5}: build it in row 1. It goes past 1 whole.', board: { wholes: 2, rows: [{}, {}] }, hl: ['tray:5', 'row:0'], wait: (b) => isRow(b, 0, [7, 5], { only: [5] }), done: '{4/5} + {3/5} = {7/5} = {1 2/5}.' },
      { text: '{1 1/4} − {3/4} = ?', q: { type: 'choice', options: ['{2/4}', '{1 2/4}', '{4/4}'], answer: 0, explain: 'Trade the 1 whole for {4/4}. Then {5/4} − {3/4} = {2/4}.' } },
    ] },
    { id: 'L7', topic: 'addunlike', title: 'Different Sizes', sub: 'Find a common tile', std: '5.NF.A.1', steps: [
      { text: '{1/2} + {1/3} is in row 1. You cannot count a half and a third together. Fill row 2 with <b>one tile size</b> to exactly the same length.', board: { rows: [{ lock: [2, 3] }, {}, {}, {}] }, hl: ['row:1'], wait: (b) => isRow(b, 1, [5, 6], { single: true }), done: (b) => { const f = rowAsFraction(R(b, 1)); return `{1/2} + {1/3} = {${f[0]}/${f[1]}}.`; } },
      { text: 'Why sixths? Show {1/2} with sixths in row 3 and {1/3} with sixths in row 4.', hl: ['tray:6'], wait: (b) => isRow(b, 2, [1, 2], { only: [6] }) && isRow(b, 3, [1, 3], { only: [6] }), done: '{1/2} = {3/6} and {1/3} = {2/6}. Now they are the same size: {3/6} + {2/6} = {5/6}.' },
      { text: '{3/4} − {1/3}: row 1 shows {3/4}, row 2 shows {1/3}. In row 3, build the difference with one tile size that fits both.', board: { rows: [{ lock: [4, 4, 4] }, { lock: [3] }, {}] }, hl: ['row:2'], wait: (b) => isRow(b, 2, [5, 12], { single: true }), done: '{3/4} = {9/12} and {1/3} = {4/12}. {9/12} − {4/12} = {5/12}.' },
      { text: 'Which tile size works for {1/2} + {1/5}?', q: { type: 'choice', options: ['{1/10}', '{1/7}', '{1/3}'], answer: 0, explain: 'Halves and fifths both line up with tenths: {1/2} = {5/10} and {1/5} = {2/10}.' } },
      { text: '{2/3} + {1/6} = ?', q: { type: 'choice', options: ['{5/6}', '{3/9}', '{3/6}'], answer: 0, explain: '{2/3} = {4/6}. Then {4/6} + {1/6} = {5/6}.' } },
      { text: '<b>The rule:</b> change to tiles of the same size first, then add or subtract the top numbers.' },
    ] },
  ];

  // ── practice: 40 missions ──
  // setup: board; reqs: row requirements; inputs: typed answers; sol: rows for the answer picture.
  const L = (...d) => ({ lock: d });
  const ALL = DENS;
  const M = [];
  const mission = (o) => M.push({ id: M.length + 1, ...o });

  // Set 1 · Build
  const build = (n, d, topic, explain) => mission({ set: 'build', topic, prompt: `Build {${n}/${d}} in row 1.`, setup: { rows: [{}, {}] }, reqs: [{ row: 0, total: F(n, d), only: [d] }], inputs: [], sol: [Array(n).fill(d)], explain });
  build(1, 3, 'unit', 'One {1/3} tile: 1 of the 3 equal parts that make the whole.');
  build(3, 4, 'build', 'Three {1/4} tiles. The 3 counts the tiles, the 4 names their size.');
  build(2, 5, 'build', 'Two {1/5} tiles make {2/5}.');
  build(5, 6, 'build', 'Five {1/6} tiles make {5/6}, one tile short of 1 whole.');
  build(7, 8, 'build', 'Seven {1/8} tiles make {7/8}, one eighth short of 1 whole.');
  build(9, 10, 'build', 'Nine {1/10} tiles make {9/10}.');
  build(7, 12, 'build', 'Seven {1/12} tiles make {7/12}, a little more than half.');
  mission({ set: 'build', topic: 'unit', prompt: 'Fill row 1 to exactly 1 whole using only {1/6} tiles. How many tiles did you use?', setup: { rows: [{}, {}] }, reqs: [{ row: 0, total: [1, 1], only: [6] }], inputs: [{ type: 'num', label: 'tiles', answer: 6 }], sol: [[6, 6, 6, 6, 6, 6]], explain: '6 sixths make 1 whole: {6/6} = 1.' });

  // Set 2 · Equivalent (any correct answer)
  const equiv = (n, d, explain) => mission({ set: 'equiv', topic: 'equiv', prompt: `Row 1 shows {${n}/${d}}. In row 2, build a fraction equal to it using <b>one tile size</b> (not ${sizeName(d)}). Type the fraction you built.`, setup: { rows: [L(...Array(n).fill(d)), {}] }, reqs: [{ row: 1, total: F(n, d), single: true, notSize: [d], needFree: true }], inputs: [{ type: 'frac', answer: F(n, d), matchRow: 1, notDen: d, any: true }], sol: null, solFrom: [F(n, d), d], explain });
  equiv(1, 2, 'Any of these work: {2/4}, {3/6}, {4/8}, {5/10}, {6/12}. Each one is exactly as long as {1/2}.');
  equiv(2, 3, '{4/6} and {8/12} both match {2/3}. Fourths, fifths, eighths and tenths do not line up with it.');
  equiv(3, 4, '{6/8} and {9/12} both match {3/4}.');

<script>

    totalTok(r) {
      const free = r.tiles; if (!free.length) return '';
      const sizes = [...new Set(free.map((t) => t.d))];
      if (sizes.length === 1 && sizes[0] !== 1) return `{${free.length}/${sizes[0]}}`;
      const t = D.rowTotal(r); return t[0] > t[1] && t[1] > 1 ? mixedTok(t) : fracTok(t);
    }

    tileHTML(t, i, ri) {
      const lab = t.d === 1 ? '1' : frHTML(1, t.d);
      const name = t.d === 1 ? '1 whole' : `1/${t.d}`;
      return `<button class="tile c${t.d}${t.lock ? ' lock' : ''}${t.id === this.fresh && !reduce ? ' pop' : ''}" style="--u:${D.unitsOf(t.d)}" data-id="${t.id}" data-d="${t.d}" ${t.lock ? 'tabindex="-1" aria-disabled="true"' : ''} aria-label="${name} tile${t.lock ? ', part of the question' : ', press to remove'}"><span class="lab">${lab}</span></button>`;
    }
    render() {
      const segs = Array.from({ length: this.wholes }, () => `<div class="seg" style="--u:${D.UNITS}"><span class="lab">1</span></div>`).join('');
      const rows = this.rows.map((r, i) => `
        <div class="lane row${i === this.active ? ' on' : ''}" data-r="${i}">
          <button class="tag" data-r="${i}" aria-label="Select row ${i + 1}">${i + 1}</button>
          <div class="bar" data-r="${i}">${r.tiles.map((t, k) => this.tileHTML(t, k, i)).join('')}</div>
          <div class="tot">${this.totals ? fx(this.totalTok(r)) : ''}</div>
        </div>`).join('');
      const tray = this.tray.map((d) => `<button class="tt c${d}" data-d="${d}" aria-label="Add a ${d === 1 ? '1 whole' : '1/' + d} tile"><span class="sw"></span><span class="lab">${d === 1 ? '1' : frHTML(1, d)}</span></button>`).join('');
      this.host.innerHTML = `
        <div class="bd${this.vert ? ' vert' : ''}${this.labels ? '' : ' nolab'}${this.totals ? ' tots' : ''}" style="--cap:${this.cap}">
          <div class="tray" role="toolbar" aria-label="Fraction tiles">${tray}</div>
          <div class="field">
            <div class="lane ref"><span class="tag ghosttag" aria-hidden="true"></span><div class="bar">${segs}</div><div class="tot"></div></div>
            ${rows}
          </div>
          <p class="bd-msg${this.msg ? ' bad' : ''}" aria-live="polite">${fx(this.msg)}</p>
        </div>`;
      this.fresh = null;
    }

    // ── input ──
    click(e) {
      if (this.suppress) { this.suppress = false; return; }
      const tt = e.target.closest('.tt'); if (tt) { this.place(Number(tt.dataset.d), this.active, null); return; }
      const tile = e.target.closest('.tile'); if (tile) { if (tile.classList.contains('lock')) { this.say('That tile is part of the question. It stays.'); return; } this.removeAnimated(tile); return; }
      const lane = e.target.closest('.lane.row'); if (lane) { this.active = Number(lane.dataset.r); this.host.querySelectorAll('.lane.row').forEach((n) => n.classList.toggle('on', n === lane)); }
    }
    key(e) {
      if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.closest('.tile')) { e.preventDefault(); this.removeAnimated(e.target.closest('.tile')); }
      if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.undo(); }
    }
    removeAnimated(node) {
      const id = node.dataset.id;
      if (reduce) { this.remove(id); return; }
      node.classList.add('out'); setTimeout(() => this.remove(id), 140);
    }
    down(e) {
      if (e.button !== 0) return;
      const src = e.target.closest('.tt, .tile:not(.lock)'); if (!src) return;
      const isTray = src.classList.contains('tt');
      const d = Number(src.dataset.d);
      let moving = null;
      if (!isTray) { const ri = Number(src.closest('.bar').dataset.r); moving = { row: ri, tile: this.rows[ri].tiles.find((t) => t.id === src.dataset.id) }; }
      const r0 = src.getBoundingClientRect();
      this.drag = { d, src, moving, x0: e.clientX, y0: e.clientY, on: false, offX: isTray ? null : e.clientX - r0.left, offY: isTray ? null : e.clientY - r0.top, pid: e.pointerId };
      const mv = (ev) => this.move(ev), up = (ev) => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); this.up(ev); };
      addEventListener('pointermove', mv, { passive: false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    }
    unitPx() { const b = this.host.querySelector('.lane.ref .bar').getBoundingClientRect(); return (this.vert ? b.height : b.width) / this.cap; }
    begin() {
      const g = this.drag; g.on = true; this.suppress = true;
      const refBar = this.host.querySelector('.lane.ref .bar').getBoundingClientRect();
      const len = this.unitPx() * D.unitsOf(g.d);
      const thick = this.vert ? refBar.width : refBar.height;
      g.w = this.vert ? thick : len; g.h = this.vert ? len : thick;
      if (g.offX == null) { g.offX = g.w / 2; g.offY = g.h / 2; }
      const ghost = el(`<div class="dragghost c${g.d}${this.labels ? '' : ' nolab'}" style="width:${g.w}px;height:${g.h}px"><span class="lab">${g.d === 1 ? '1' : frHTML(1, g.d)}</span></div>`);
      document.body.appendChild(ghost); g.ghost = ghost;
      if (g.moving) g.src.classList.add('lifted');
      this.host.querySelector('.bd').classList.add('dragging');
      if (!reduce) requestAnimationFrame(() => ghost.classList.add('lift'));
    }
    move(e) {
      const g = this.drag; if (!g) return;
      if (!g.on) { if (Math.hypot(e.clientX - g.x0, e.clientY - g.y0) < 6) return; this.begin(); }
      e.preventDefault();
      const x = e.clientX - g.offX, y = e.clientY - g.offY;
      g.ghost.style.transform = `translate(${x}px, ${y}px)`;
      // auto-scroll near the edges
      if (e.clientY < 28) scrollBy(0, -8); else if (e.clientY > innerHeight - 28) scrollBy(0, 8);
      const cx = x + g.w / 2, cy = y + g.h / 2;
      const t = this.target(cx, cy);
      this.preview(t);
      g.t = t;
    }
    target(cx, cy) {
      const lanes = [...this.host.querySelectorAll('.lane.row .bar')];
      let best = null, bestDist = Infinity;
      for (const b of lanes) {
        const r = b.getBoundingClientRect();
        const along = this.vert ? cx : cy; const lo = this.vert ? r.left : r.top; const hi = this.vert ? r.right : r.bottom;
        const across = this.vert ? cy : cx; const s0 = this.vert ? r.top : r.left; const s1 = this.vert ? r.bottom : r.right;
        if (across < s0 - 60 || across > s1 + 60) continue;
        const dist = along < lo ? lo - along : along > hi ? along - hi : 0;
        if (dist < bestDist) { bestDist = dist; best = b; }
      }
      if (!best) return null;
      const thick = this.vert ? best.getBoundingClientRect().width : best.getBoundingClientRect().height;
      if (bestDist > thick * 0.8) return null;
      const ri = Number(best.dataset.r); const row = this.rows[ri];
      // insertion index: count tiles whose middle is before the ghost's middle
      const pos = this.vert ? cy : cx;
      let idx = 0;
      best.querySelectorAll('.tile:not(.lifted)').forEach((n) => { const r = n.getBoundingClientRect(); const mid = this.vert ? (r.top + r.bottom) / 2 : (r.left + r.right) / 2; if (mid < pos) idx++; });
      const lockN = row.tiles.filter((t) => t.lock).length; idx = Math.max(idx, lockN);
      const g = this.drag;
      const used = this.used(row) - (g.moving && g.moving.row === ri ? D.unitsOf(g.d) : 0);
      const fits = used + D.unitsOf(g.d) <= this.cap;
      return { ri, idx, fits, bar: best };
    }
    preview(t) {
      this.host.querySelectorAll('.ph').forEach((n) => n.remove());
      this.host.querySelectorAll('.lane.nofit, .lane.over').forEach((n) => n.classList.remove('nofit', 'over'));
      const g = this.drag; g.ghost.classList.toggle('bad', !!(t && !t.fits));
      if (!t) return;
      const lane = t.bar.closest('.lane');
      if (!t.fits) { lane.classList.add('nofit'); return; }
      lane.classList.add('over');
      const ph = el(`<div class="ph" style="--u:${D.unitsOf(g.d)}"></div>`);
      const kids = [...t.bar.querySelectorAll('.tile:not(.lifted)')];
      if (t.idx >= kids.length) t.bar.appendChild(ph); else t.bar.insertBefore(ph, kids[t.idx]);
    }
    up() {
      const g = this.drag; this.drag = null; if (!g) return;
      if (!g.on) return; // a tap: the click handler does the work
      const t = g.t;
      const bd = this.host.querySelector('.bd'); bd && bd.classList.remove('dragging');
      const finish = () => g.ghost.remove();
      if (t && t.fits) {
        // count the index among the row's tiles, excluding the lifted one
        let idx = t.idx;
        if (g.moving && g.moving.row === t.ri) { const k = this.rows[t.ri].tiles.findIndex((x) => x.id === g.moving.tile.id); if (k < idx) idx++; }
        finish(); this.place(g.d, t.ri, idx, g.moving);
      } else if (t && !t.fits) {
        finish(); this.render(); this.say(`That ${g.d === 1 ? '1-whole' : `{1/${g.d}}`} tile does not fit in row ${t.ri + 1}. It would go past the end.`, true);
      } else if (g.moving) {
        finish(); this.remove(g.moving.tile.id);
      } else { finish(); this.render(); }
      setTimeout(() => { this.suppress = false; }, 0);
    }
  }

  // read-only picture of rows (answer pictures, worksheets in the app)
  function staticBars(rows, wholes = 1) {
    const cap = wholes * D.UNITS;
    const segs = Array.from({ length: wholes }, () => `<div class="seg" style="--u:${D.UNITS}"><span class="lab">1</span></div>`).join('');
    return `<div class="bd mini" style="--cap:${cap}"><div class="field">
      <div class="lane ref"><span class="tag ghosttag"></span><div class="bar">${segs}</div><div class="tot"></div></div>

  }

  // ══════════════════════════════════════════════════════════
  //  Answer inputs
  // ══════════════════════════════════════════════════════════
  function inputHTML(inp, k) {
    const lab = inp.label ? `<span class="in-lab">${esc(inp.label)}</span>` : '';
    if (inp.type === 'frac') return `<div class="ans frac" data-k="${k}">${lab}<div class="fin">${inp.mixed ? `<input class="w" inputmode="numeric" maxlength="2" aria-label="whole number (optional)" placeholder="">` : ''}<span class="stk"><input class="n" inputmode="numeric" maxlength="3" aria-label="top number"><span class="bar-l"></span><input class="d" inputmode="numeric" maxlength="3" aria-label="bottom number"></span></div>${inp.mixed ? '<small>Whole number box is optional</small>' : ''}</div>`;
    if (inp.type === 'num') return `<div class="ans num" data-k="${k}">${lab}<input class="v" inputmode="numeric" maxlength="3" aria-label="${esc(inp.label || 'answer')}"></div>`;
    if (inp.type === 'sym') return `<div class="ans sym" data-k="${k}"><span class="cv">${fx(inp.a)}</span><span class="symset" role="group" aria-label="Choose a sign">${['<', '=', '>'].map((s) => `<button type="button" class="sb" data-s="${s}" aria-pressed="false">${esc(s)}</button>`).join('')}</span><span class="cv">${fx(inp.b)}</span></div>`;
    if (inp.type === 'choice') return `<div class="ans choice" data-k="${k}" role="group">${inp.options.map((o, i) => `<button type="button" class="ch" data-i="${i}" aria-pressed="false">${fx(o)}</button>`).join('')}</div>`;
    if (inp.type === 'order') return `<div class="ans order" data-k="${k}"><div class="ocards">${inp.items.map((o, i) => `<button type="button" class="oc" data-i="${i}">${fx(o)}</button>`).join('')}</div><div class="oslots">${inp.items.map((o, i) => `<button type="button" class="os" data-slot="${i}" aria-label="${['Smallest', 'Middle', 'Largest'][i] || 'Slot ' + (i + 1)}"><small>${['smallest', 'middle', 'largest'][i]}</small><span></span></button>`).join('')}</div></div>`;
    return '';
  }
  function wireInputs(host, onAny) {
    host.addEventListener('click', (e) => {
      const b = e.target.closest('.sb, .ch'); if (b) { b.parentElement.querySelectorAll('.sb, .ch').forEach((n) => n.setAttribute('aria-pressed', String(n === b))); onAny && onAny(); return; }
      const oc = e.target.closest('.oc'); if (oc && !oc.disabled) { const box = oc.closest('.order'); const slot = [...box.querySelectorAll('.os')].find((s) => !s.dataset.i); if (slot) { slot.dataset.i = oc.dataset.i; slot.querySelector('span').innerHTML = oc.innerHTML; oc.disabled = true; } onAny && onAny(); return; }
      const os = e.target.closest('.os'); if (os && os.dataset.i) { const box = os.closest('.order'); box.querySelector(`.oc[data-i="${os.dataset.i}"]`).disabled = false; delete os.dataset.i; os.querySelector('span').innerHTML = ''; onAny && onAny(); }
    });
    host.addEventListener('input', (e) => { const t = e.target; if (t.tagName === 'INPUT') { t.value = t.value.replace(/\D/g, ''); onAny && onAny(); } });
  }
  function readInput(host, inp, k) {
    const box = host.querySelector(`.ans[data-k="${k}"]`);
    if (inp.type === 'frac') { const v = { w: box.querySelector('.w')?.value || '', n: box.querySelector('.n').value, d: box.querySelector('.d').value }; return { raw: v, f: D.parseFrac(v), empty: !v.w && !v.n && !v.d }; }
    if (inp.type === 'num') { const v = box.querySelector('.v').value.trim(); return { v: v === '' ? null : Number(v), empty: v === '' }; }
    if (inp.type === 'sym') { const s = box.querySelector('.sb[aria-pressed="true"]'); return { s: s ? s.dataset.s : null, empty: !s }; }
    if (inp.type === 'choice') { const s = box.querySelector('.ch[aria-pressed="true"]'); return { i: s ? Number(s.dataset.i) : null, empty: !s }; }
    if (inp.type === 'order') { const o = [...box.querySelectorAll('.os')].map((s) => s.dataset.i); return { order: o.map(Number), empty: o.some((x) => x == null) }; }
  }
  // returns '' if right, else reason
  function judge(inp, got, board, all) {
    if (got.empty) return 'Fill in your answer.';
    if (inp.type === 'frac') {
      if (!got.f) return 'Type a top and a bottom number.';
      if (!D.eq(got.f, inp.answer)) return `${fracTok(got.f) === fracTok(inp.answer) ? '' : 'That is not the right amount.'}`.trim() || 'Not quite.';
      if (inp.matchRow != null) {
        const rf = D.rowAsFraction(board.rows[inp.matchRow]);
        const typed = rawFrac(got.raw);
        if (!rf || !typed || typed[0] !== rf[0] || typed[1] !== rf[1]) return rf ? `Your row ${inp.matchRow + 1} shows {${rf[0]}/${rf[1]}}. Type the fraction your tiles show.` : `Build row ${inp.matchRow + 1} first.`;
        if (inp.notDen && typed[1] === inp.notDen) return `{${typed[0]}/${typed[1]}} is the same fraction you started with. Find a new one.`;
      }
      if (inp.differentFrom != null) { const other = rawFrac(all[inp.differentFrom].raw); const me = rawFrac(got.raw); if (other && me && other[1] === me[1]) return 'Your two fractions are the same. Make them different.'; }
      return '';
    }
    if (inp.type === 'num') return got.v === inp.answer ? '' : 'Not quite.';
    if (inp.type === 'sym') return got.s === inp.answer ? '' : 'Look at where the two rows end.';
    if (inp.type === 'choice') return got.i === inp.answer ? '' : 'Not quite.';
    if (inp.type === 'order') return got.order.every((v, i) => v === inp.answer[i]) ? '' : 'The order is not right yet.';
    return '';
  }
  const rawFrac = (v) => { const n = Number(v.n), d = Number(v.d), w = Number(v.w || 0); if (!v.n || !v.d || !d) return null; return [w * d + n, d]; };
  const answerText = (inp) => {
    if (inp.type === 'frac') { const a = inp.answer; let s = fracTok(a); if (a[0] > a[1] && a[1] > 1) s += ` = ${mixedTok(a)}`; return s; }
    if (inp.type === 'num') return String(inp.answer);
    if (inp.type === 'sym') return `${inp.a} ${esc(inp.answer)} ${inp.b}`;
    if (inp.type === 'choice') return inp.options[inp.answer];
    if (inp.type === 'order') return inp.answer.map((i) => inp.items[i]).join(' , ');
  };
  const gotText = (inp, got) => {
    if (got.empty) return 'no answer';
    if (inp.type === 'frac') { if (!got.f) return 'not a fraction'; const r = rawFrac(got.raw); return r ? (got.raw.w ? `{${got.raw.w} ${got.raw.n}/${got.raw.d}}` : `{${r[0]}/${r[1]}}`) : fracTok(got.f); }
    if (inp.type === 'num') return String(got.v);
    if (inp.type === 'sym') return `${inp.a} ${esc(got.s)} ${inp.b}`;
    if (inp.type === 'choice') return inp.options[got.i];
    if (inp.type === 'order') return got.order.map((i) => inp.items[i]).join(' , ');
  };

  // ── Learn list ──
  function learn() {

      const locked = FREE && i > 0; const done = store.lessons[l.id];
      return `<button class="row-item${locked ? ' is-locked' : ''}" ${locked ? 'data-locked="1"' : `data-go="lesson" data-arg="${l.id}"`}>

  // ── Lesson player ──
  function lesson(id) {
    const L = D.LESSONS.find((l) => l.id === id) || D.LESSONS[0];
    if (FREE && L.id !== 'L1') return learn();
    let i = 0; let board = null; let lastSetup = null; let solved = false;
    app.innerHTML = shell('learn-lesson', `
      <section class="lesson">
        <div class="ls-head"><button class="link" data-go="learn">← All lessons</button><span class="std">${esc(L.std)}</span></div>
        <h2>${esc(L.title)}</h2>
        <ol class="dots" aria-label="Steps">${L.steps.map((s, k) => `<li data-k="${k}"></li>`).join('')}</ol>
        <div class="step" aria-live="polite"></div>
        <div class="ls-tools tools"><button data-t="undo">Undo</button><button data-t="reset">Reset step</button><button data-t="labels" aria-pressed="${prefs.labels}">Labels</button></div>

        <div class="ls-nav"><button class="ghost" data-t="back">Back</button><button class="primary" data-t="next">Next</button></div>
      </section>`);
    const host = document.getElementById('board');
    const stepBox = app.querySelector('.step');
    const tools = app.querySelector('.lesson');

    function setHL(step) {
      app.querySelectorAll('.hl').forEach((n) => n.classList.remove('hl'));
      (step.hl || []).forEach((h) => {
        let n = null;
        if (h === 'ref') n = host.querySelector('.lane.ref');
        else if (h === 'tray') n = host.querySelector('.tray');
        else if (h.startsWith('tray:')) n = host.querySelector(`.tt[data-d="${h.slice(5)}"]`);

        else n = app.querySelector(`[data-t="${h}"]`);
        n && n.classList.add('hl');
      });
    }
    function evalStep() {
      const s = L.steps[i];
      const waitOk = !s.wait || s.wait(board);
      const qOk = !s.q || stepBox.dataset.qok === '1';
      const ok = waitOk && qOk;
      const fb = stepBox.querySelector('.done');
      if (s.wait && waitOk && fb && !fb.dataset.shown) { fb.dataset.shown = '1'; fb.innerHTML = '<b>✓</b> ' + fx(typeof s.done === 'function' ? s.done(board) : (s.done || 'Done.')); fb.hidden = false; }
      if (s.wait && !waitOk && fb && fb.dataset.shown && !solved) { /* keep feedback once shown */ }
      if (ok) solved = true;
      app.querySelector('[data-t="next"]').classList.toggle('ready', ok);
      setHL(ok ? { hl: [] } : s);
    }
    function show() {
      const s = L.steps[i]; solved = false;
      app.querySelectorAll('.dots li').forEach((n, k) => { n.className = k < i ? 'past' : k === i ? 'now' : ''; });
      // board: new setup if step has one, else keep
      const setup = s.board || lastSetup || { rows: [{}, {}] };
      if (s.board || !board) { if (board) board.load(setup); else board = new Board(host, setup, { onChange: evalStep }); lastSetup = setup; }
      window.__FTL.board = board;
      stepBox.dataset.qok = '';
      stepBox.innerHTML = `<p class="st-n">Step ${i + 1} of ${L.steps.length}</p><p class="st-t">${fx(s.text)}</p>${s.wait ? '<p class="todo">Do this on the board to continue.</p>' : ''}${s.q ? `<div class="q">${inputHTML(s.q, 0)}<button class="primary sm" data-t="checkq">Check</button><div class="qfb" hidden></div></div>` : ''}<p class="done" hidden></p>`;
      app.querySelector('[data-t="back"]').disabled = i === 0;
      app.querySelector('[data-t="next"]').textContent = i === L.steps.length - 1 ? 'Finish lesson' : 'Next';
      evalStep();
    }
    wireInputs(stepBox, () => {});
    const handler = (e) => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      const t = b.dataset.t; const s = L.steps[i];
      if (t === 'undo') board.undo();
      if (t === 'reset') { board.load(lastSetup); evalStep(); }
      if (t === 'labels') { prefs.labels = board.labels = !board.labels; b.setAttribute('aria-pressed', board.labels); board.render(); evalStep(); }
      if (t === 'checkq') {
        const got = readInput(stepBox, s.q, 0); const why = judge(s.q, got, board, [got]);
        const fb = stepBox.querySelector('.qfb'); fb.hidden = false;
        if (got.empty) { fb.className = 'qfb bad'; fb.innerHTML = 'Choose an answer first.'; return; }
        const right = !why;
        fb.className = 'qfb ' + (right ? 'good' : 'bad');
        fb.innerHTML = `<b>${right ? '✓ Correct.' : '✗ Not quite.'}</b> ${right ? '' : `The answer is ${fx(answerText(s.q))}. `}${fx(s.q.explain)}`;
        stepBox.dataset.qok = '1'; evalStep();
      }
      if (t === 'back' && i > 0) { i--; show(); }
      if (t === 'next') {
        const okNow = (!s.wait || s.wait(board)) && (!s.q || stepBox.dataset.qok === '1');
        if (!okNow) { const td = stepBox.querySelector('.todo') || stepBox.querySelector('.q'); if (td) { td.classList.remove('nudge'); void td.offsetWidth; td.classList.add('nudge'); if (s.q && !s.wait) { const fb = stepBox.querySelector('.qfb'); fb.hidden = false; fb.className = 'qfb bad'; fb.textContent = 'Answer the question, then press Check.'; } } setHL(s); return; }
        if (i < L.steps.length - 1) { i++; show(); }

  }
  function finishLesson(L) {

  }

  // ── Practice list ──
  const missionLocked = (m) => FREE && !D.FREE_MISSIONS.includes(m.id);
  function practice(focus) {
    const sets = D.SETS.map((s) => {
      const ms = D.MISSIONS.filter((m) => m.set === s.id);
      return `<section class="pset${focus === s.id ? ' focus' : ''}"><h3>${esc(s.name)}</h3><p>${esc(s.blurb)}</p><div class="mgrid">${ms.map((m) => {
        const st = store.practice[m.id]; const lk = missionLocked(m);
        return `<button class="mb${st ? (st.first ? ' won' : ' tried') : ''}${lk ? ' is-locked' : ''}" ${lk ? 'data-locked="1"' : `data-go="mission" data-arg="${m.id}"`} aria-label="Mission ${m.id}${st ? (st.first ? ', correct' : ', tried') : ''}${lk ? ', full version' : ''}"><b>${m.id}</b><small>${lk ? 'Full' : st ? (st.first ? '✓' : '○') : ''}</small></button>`;
      }).join('')}</div></section>`;
    }).join('');

    app.innerHTML = shell('practice', `<section class="pagehead"><h2>Practice</h2><p>${FREE ? '5' : '40'} missions. Every mission needs the tiles: build first, then answer. You see the answer and why straight away.</p><p class="meta"><b>${won}</b> right first time · <b>${done}</b> tried</p><p class="legend"><span class="mb won mini"><b>✓</b></span> right first time <span class="mb tried mini"><b>○</b></span> tried</p></section><div class="psets">${sets}</div><div id="lk"></div>`);
    app.querySelectorAll('[data-locked]').forEach((b) => b.addEventListener('click', () => { const n = document.getElementById('lk'); n.innerHTML = lockNote('This mission'); n.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); }));
  }

  // ── Mission player ──
  function mission(idArg) {
    const m = D.MISSIONS.find((x) => x.id === Number(idArg)) || D.MISSIONS[0];
    if (missionLocked(m)) return practice();
    const set = D.SETS.find((s) => s.id === m.set);
    const list = D.MISSIONS.filter((x) => !missionLocked(x));
    const pos = list.indexOf(m); const next = list[pos + 1];
    let tries = 0;
    app.innerHTML = shell('practice-mission', `
      <section class="mission">
        <div class="ls-head"><button class="link" data-go="practice">← All missions</button><span class="std">${esc(set.name)}</span></div>
        <h2>Mission ${m.id}<small> of 40</small></h2>
        <p class="prompt">${fx(m.prompt)}</p>
        <div class="tools"><button data-t="undo">Undo</button><button data-t="reset">Reset</button><button data-t="labels" aria-pressed="${prefs.labels}">Labels</button></div>

    const host = document.getElementById('board');

    const sec = app.querySelector('.mission');
    const fb = sec.querySelector('.fb');
    const clearFb = () => { if (!fb.hidden && fb.dataset.final !== '1') { fb.hidden = true; } };
    wireInputs(sec, clearFb);
    const solRows = () => {
      if (m.sol) return m.sol;
      const [f, d] = m.solFrom; // f in simplest form, d = the size already shown in row 1
      const alt = [2, 3, 4, 5, 6, 8, 10, 12].find((x) => x !== d && (x * f[0]) % f[1] === 0);
      return [m.setup.rows[0].lock, Array(alt * f[0] / f[1]).fill(alt)];
    };
    const handler = (e) => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      const t = b.dataset.t;
      if (t === 'undo') board.undo();
      if (t === 'reset') { board.push(); const h = board.history; board.load(m.setup); board.history = h; clearFb(); }
      if (t === 'labels') { prefs.labels = board.labels = !board.labels; b.setAttribute('aria-pressed', board.labels); board.render(); }
      if (t === 'check') check();
      if (t === 'again') { fb.hidden = true; fb.dataset.final = ''; }
    };
    sec.addEventListener('click', handler);
    function check() {
      const boardWhy = m.reqs.map((q) => D.checkReq(board, q)).find(Boolean) || '';
      const gots = m.inputs.map((inp, k) => readInput(sec, inp, k));
      if (!boardWhy && gots.some((g) => g.empty)) { show('bad', 'Fill in your answer, then press Check.', false); return; }
      if (boardWhy && board.rows.every((r) => !r.tiles.filter((t) => !t.lock).length) && !m.setup.rows.some((r) => r.tiles)) { show('bad', fx('Build it with the tiles first. ' + boardWhy), false); return; }
      const inWhy = m.inputs.map((inp, k) => judge(inp, gots[k], board, gots)).find(Boolean) || '';
      const right = !boardWhy && !inWhy;
      tries++;
      const rec = store.practice[m.id];
      if (!rec) store.practice[m.id] = { first: right, done: right };
      else if (right) rec.done = true;
      save();
      const ans = m.inputs.length ? `<p><b>Answer:</b> ${m.inputs.map((inp) => fx(answerText(inp))).join(' and ')}${m.inputs.some((x) => x.any) ? ' (or another equal fraction)' : ''}</p>` : '';
      const pic = `<div class="solpic"><p class="cap">What the tiles look like:</p>${staticBars(solRows(), m.setup.wholes || 1)}</div>`;
      const html = right
        ? `<p class="verdict"><b>✓ Correct.</b></p><p>${fx(m.explain)}</p>${pic}`
        : `<p class="verdict"><b>✗ Not yet.</b> ${fx(boardWhy || inWhy)}</p>${ans}<p>${fx(m.explain)}</p>${pic}`;
      show(right ? 'good' : 'bad', html, true, right);

    function show(kind, html, final, right) {
      fb.hidden = false; fb.dataset.final = final ? '1' : ''; fb.className = 'fb ' + kind;
      fb.innerHTML = html + (final ? `<div class="btns">${right ? '' : '<button class="ghost" data-t="again">Try again</button>'}${next ? `<button class="primary" data-go="mission" data-arg="${next.id}">Next mission</button>` : `<button class="primary" data-go="practice">All missions</button>`}</div>` : '');
      if (final) fb.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
    }
  }

  // ── Test ──
  let T = null; let timer = null;
  function test() {
    const last = store.tests[store.tests.length - 1];
    app.innerHTML = shell('test', `<section class="pagehead"><h2>Test</h2><p>${D.POOL.length} questions in the bank. Each test picks 15 of them across all seven topics, so every test is new.</p></section>
      ${FREE ? lockNote('The test') : `<section class="t-intro"><ul class="facts"><li><b>15</b> questions</li><li><b>${D.TEST_MINUTES}</b> minutes</li><li><b>7</b> topics</li></ul><p>The tiles are there on every question. You see your score, the answers and what to review at the end.</p><button class="primary big" data-t="start">Start the test</button>${last ? `<p class="meta">Last test: <b>${last.score}/${last.total}</b></p>` : ''}</section>`}`);
    const b = app.querySelector('[data-t="start"]'); b && b.addEventListener('click', startTest);
  }
  function buildTest() {
    const qs = [];
    for (const [topic, n] of Object.entries(D.TEST_PLAN)) qs.push(...shuffle(D.POOL.filter((q) => q.topic === topic)).slice(0, n));
    return qs.map((q) => ({ ...q, options: q.options ? q.options.slice() : undefined }))
      .map((q) => { if (q.kind === 'choice') { const order = shuffle(q.options.map((_, i) => i)); q.options = order.map((i) => q.options[i]); q.answer = order.indexOf(q.answer); } return q; });
  }
  function startTest() {
    T = { qs: buildTest(), i: 0, answers: [], boards: [], start: Date.now(), limit: D.TEST_MINUTES * 60 };
    go('testRun');
  }
  const asInput = (q) => q.kind === 'num' ? { type: 'num', answer: q.answer } : q.kind === 'frac' ? { type: 'frac', answer: q.answer, mixed: q.mixed } : q.kind === 'sym' ? { type: 'sym', a: q.a, b: q.b, answer: q.answer } : q.kind === 'choice' ? { type: 'choice', options: q.options, answer: q.answer } : null;
  function testRun() {
    if (!T) return test();
    window.__FTL.test = T;
    app.innerHTML = shell('test-run', `<section class="trun">
      <div class="t-bar"><span class="qn"></span><span class="prog"><i></i></span><span class="clock" aria-live="off"></span></div>
      <p class="prompt"></p><div class="tools"><button data-t="undo">Undo</button><button data-t="clear">Clear board</button><button data-t="labels" aria-pressed="${prefs.labels}">Labels</button></div><div id="board"></div><div class="answers"></div>
      <div class="ls-nav"><button class="ghost" data-t="prev">Back</button><button class="primary" data-t="next">Next</button></div>
      <p class="t-help">You can go back and change answers until you finish.</p></section>`);
    const host = document.getElementById('board'); let board = null;
    const sec = app.querySelector('.trun'); const ans = sec.querySelector('.answers');
    wireInputs(ans, () => {});
    function saveCur() {
      const q = T.qs[T.i]; const inp = asInput(q);
      T.boards[T.i] = board.snap();
      if (q.kind === 'build') T.answers[T.i] = { board: JSON.parse(board.snap()) };
      else T.answers[T.i] = readInput(ans, inp, 0);
      // remember raw UI state so Back restores it
      T.answers[T.i].ui =[...ans.querySelectorAll('input')].map((n) => n.value).concat([...ans.querySelectorAll('[aria-pressed="true"]')].map((n) => '#' + (n.dataset.s || n.dataset.i)));
    }
    function showQ() {
      const q = T.qs[T.i];
      sec.querySelector('.qn').textContent = `Question ${T.i + 1} of ${T.qs.length}`;
      sec.querySelector('.prog i').style.width = `${(T.i / T.qs.length) * 100}%`;
      sec.querySelector('.prompt').innerHTML = fx(q.prompt) + (q.kind === 'build' ? '' : ' <span class="hint">Use the tiles if they help.</span>');
      const setup = q.setup || { rows: [{}, {}, {}], wholes: (q.topic === 'mixed' || (q.mixed)) ? 2 : 1 };
      if (!board) board = new Board(host, setup); else board.load(setup);
      window.__FTL.board = board;
      if (T.boards[T.i]) { const o = JSON.parse(T.boards[T.i]); board.rows = o.rows; board.wholes = o.wholes; board.render(); }
      const inp = asInput(q);
      ans.innerHTML = inp ? inputHTML(inp, 0) : '<p class="hint">Your board is your answer.</p>';
      const prev = T.answers[T.i];
      if (prev && prev.ui) { const ins = [...ans.querySelectorAll('input')]; prev.ui.forEach((v, k) => { if (typeof v === 'string' && v.startsWith('#')) { const n = ans.querySelector(`[data-s="${v.slice(1)}"], [data-i="${v.slice(1)}"]`); n && n.setAttribute('aria-pressed', 'true'); } else if (ins[k]) ins[k].value = v; }); }
      sec.querySelector('[data-t="prev"]').disabled = T.i === 0;
      sec.querySelector('[data-t="next"]').textContent = T.i === T.qs.length - 1 ? 'Finish test' : 'Next';
    }
    const handler = (e) => {
      const b = e.target.closest('[data-t]'); if (!b) return; const t = b.dataset.t;
      if (t === 'undo') board.undo();
      if (t === 'clear') { board.push(); const h = board.history; board.load(board.setup); board.history = h; }
      if (t === 'labels') { prefs.labels = board.labels = !board.labels; b.setAttribute('aria-pressed', board.labels); board.render(); }
      if (t === 'prev' && T.i > 0) { saveCur(); T.i--; showQ(); }
      if (t === 'next') { saveCur(); if (T.i < T.qs.length - 1) { T.i++; showQ(); } else { const left = T.qs.filter((q, k) => isBlank(q, T.answers[k])).length; if (left && !b.dataset.sure) { b.dataset.sure = '1'; b.textContent = `${left} blank. Finish anyway?`; return; } finishTest(); } }
    };
    sec.addEventListener('click', handler);
    const tick = () => {
      const left = Math.max(0, T.limit - Math.floor((Date.now() - T.start) / 1000));
      const c = sec.querySelector('.clock'); if (c) { c.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; c.classList.toggle('low', left <= 60); }
      if (left <= 0) { saveCur(); finishTest(true); }

    cleanup = () => { clearInterval(timer); };
    showQ();
  }
  const isBlank = (q, a) => !a || (q.kind === 'build' ? !a.board.rows[0].tiles.length : a.empty);
  function grade(q, a) {
    if (!a || isBlank(q, a)) return false;

  }
  function finishTest(timeUp) {

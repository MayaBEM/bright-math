@media (min-width:1500px){body{font-size:20px}body.cls{font-size:24px}.screen{max-width:1640px}:root{--pzmax:max(260px,min(440px,calc(100vh - 470px)))}.setgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.visual .pzw{--pz:260px}}
h1,h2,h3,.disp,.btn,.chip,.cut b,.pip{font-family:Lexend,'Atkinson Hyperlegible',sans-serif}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
button{font:inherit;color:inherit}
#app{min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:14px}
.foot{text-align:center;font-size:.8rem;color:var(--ink2);padding:6px 12px 12px}
.foot b{font-family:Lexend;color:var(--tomato)}
:root[data-theme=dark] .foot b{color:var(--butter)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.55em 1.2em;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;user-select:none;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.cut:focus-visible,.chip:focus-visible,.opt:focus-visible,.slotbtn:focus-visible,.mini:focus-visible{outline:3px solid var(--slate);outline-offset:3px}
.btn.pri{background:var(--tomato);color:var(--onacc);border-color:var(--tomato-dk);box-shadow:0 4px 0 var(--tomato-dk)}
.btn.grn{background:var(--basil);color:var(--onacc);border-color:var(--basil-dk);box-shadow:0 4px 0 var(--basil-dk)}
.btn.sm{min-height:44px;padding:.35em .9em;font-size:.9rem}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;min-height:44px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ico{width:1.2em;height:1.2em;flex:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em;font-weight:700;font-size:.92em;font-family:Lexend,sans-serif}
.fr>span{padding:.04em .18em;min-width:.9em;text-align:center}
.fr>span+span{border-top:.1em solid currentColor}
.mix{display:inline-flex;align-items:center;white-space:nowrap}
.mix .w{font-family:Lexend;font-weight:700;margin-right:.05em}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .ttl{flex:1;min-width:150px}
.bar .ttl small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.bar .ttl h2{font-size:1.25rem}
.coins{display:inline-flex;align-items:center;gap:.4em;font-family:Lexend;font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:.25em .8em .25em .35em;min-height:44px}
.pips{display:flex;gap:5px}
.pip{width:26px;height:26px;border-radius:7px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.pip.cur{background:var(--butter);color:#2F2119}
.pip.ok{background:var(--basil);border-color:var(--basil-dk);color:#fff}
.pip.no{background:var(--paper2);color:var(--bad)}
/* start */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
.brand{font-family:Lexend;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;color:var(--tomato)}
:root[data-theme=dark] .brand{color:var(--butter)}
.hero h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:800;line-height:.98;margin:.15em 0 .2em}
.hero h1 span{color:var(--tomato)}
:root[data-theme=dark] .hero h1 span{color:var(--butter)}
.hero p.lead{font-size:1.1rem;color:var(--ink2);margin:0 0 14px;max-width:34em}
.scene{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:18px;background:#F2DFC0}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:16px}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input{flex:1;min-width:180px;min-height:52px;font:inherit;font-size:1.1rem;padding:.4em .7em;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lbl{font-family:Lexend;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:0 0 6px}
/* level map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.lvl{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--ink)}
.lvl .num{font-family:Lexend;font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tomato)}
:root[data-theme=dark] .lvl .num{color:var(--butter)}
.lvl h3{font-size:1.2rem}
.lvl p{margin:0;color:var(--ink2);font-size:.95rem;flex:1}
.lvl .stars{display:flex;gap:3px}
.lvl.locked{opacity:.75;box-shadow:0 5px 0 var(--line);border-color:var(--line)}
.lvl.locked .lk{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;color:var(--ink2)}
.lvl .art{height:84px;display:flex;align-items:center;justify-content:center;border-bottom:2px dashed var(--line);margin:-2px -2px 2px;padding-bottom:8px}
.lvl .art svg{height:76px;width:auto}
/* play */
.play{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:18px;align-items:start;flex:1}
.ticket{position:relative;background:#FFFDF6;color:#2F2119;border:2.5px solid #2F2119;border-radius:12px;padding:0 0 14px;box-shadow:0 5px 0 rgba(47,33,25,.35)}
.ticket .th{background:var(--tomato);color:#FFF8EC;border-radius:9px 9px 0 0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-family:Lexend;font-weight:700}
.ticket .th small{font-weight:600;opacity:.9}
.ticket .who{padding:10px 14px 8px;border-bottom:2px dashed #CDB79A;font-weight:700;display:flex;justify-content:space-between;gap:8px;position:relative}
.ticket .who::before,.ticket .who::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2.5px solid #2F2119}
.ticket .who::before{left:-12px;clip-path:inset(0 0 0 50%)}
.ticket .who::after{right:-12px;clip-path:inset(0 50% 0 0)}
.ticket .lines{padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.tline{display:flex;align-items:center;gap:10px;font-family:Lexend;font-weight:700;font-size:1.45rem}
.tline svg{width:36px;height:36px;flex:none}
.ticket .ask{padding:4px 14px 6px;font-size:1rem}
.ticket .note{margin:6px 14px 0;padding:8px 10px;border:2px solid #2F2119;border-radius:8px;background:#FBEFC9;font-weight:700;font-size:.95rem}
.ticket .tools{display:flex;gap:8px;padding:8px 14px 0;flex-wrap:wrap}
.ticket .btn{min-height:44px;font-size:.85rem;padding:.3em .8em;background:#FFFDF6;color:#2F2119;border-color:#2F2119;box-shadow:0 3px 0 #2F2119}
.work{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step{font-family:Lexend;font-weight:700;font-size:.9rem;color:var(--ink2);display:flex;align-items:center;gap:8px}
.step i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.8rem}
.cuts{display:flex;gap:8px;flex-wrap:wrap}
.cut{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;min-height:62px;padding:5px 6px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.cut svg{width:34px;height:34px}
.cut b{font-size:.95rem;line-height:1}
.cut.on{background:var(--butter);color:#2F2119}
.cut[aria-disabled=true]{opacity:.35}
.pizzas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;touch-action:none;user-select:none;-webkit-user-select:none}
.pzw{width:var(--pz,min(330px,74vw));position:relative}
.pz{width:100%;height:auto;display:block;overflow:visible}
.pz .hit{cursor:pointer}
.pz .hit.hov{fill:rgba(46,94,120,.25)}
.pzlab{text-align:center;font-weight:700;margin-top:4px}
.tray{display:flex;gap:8px;flex-wrap:wrap;touch-action:none}
.chip{display:flex;align-items:center;gap:6px;min-height:48px;padding:3px 11px 3px 5px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);cursor:grab;font-weight:700;font-size:.9rem;box-shadow:0 3px 0 var(--ink);touch-action:none}
.chip svg{width:34px;height:34px;flex:none}
.chip.on{background:var(--butter);color:#2F2119}
.readout{font-weight:700;color:var(--ink2);font-size:.95rem;min-height:1.4em}
.readout b{color:var(--ink)}
.cnt{display:flex;align-items:center;gap:10px;font-weight:700}
.cnt .btn{min-width:52px;padding:0}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto;padding-top:6px;border-top:2px dashed var(--line)}
.ghost-top{position:fixed;left:0;top:0;width:56px;height:56px;pointer-events:none;z-index:50;transform:translate(-50%,-60%)}
.visual{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.visual .pzw{--pz:min(200px,40vw)}
.q{font-size:1.25rem;font-weight:700;text-align:center;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.opt{min-height:64px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:700;font-size:1.15rem;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:.4em;text-align:center}
.opt.on{background:var(--butter);color:#2F2119;outline:3px solid var(--ink);outline-offset:-6px}
.eqn{display:flex;align-items:center;justify-content:center;gap:12px;font-size:2.2rem;font-family:Lexend;font-weight:700;flex-wrap:wrap}
.box{display:inline-grid;place-items:center;min-width:1.6em;min-height:1.25em;border:3px solid var(--ink);border-radius:8px;background:var(--paper);cursor:pointer;padding:0 .12em;font-family:Lexend}
.box.f{border-color:var(--slate);box-shadow:0 0 0 3px var(--slate)}
.box.e{color:var(--line)}
.fentry{display:inline-flex;align-items:center;gap:.25em;font-size:2.4rem}
.fentry .stk{display:inline-flex;flex-direction:column;align-items:center;gap:.12em}
.fentry .stk hr{width:100%;border:0;border-top:.09em solid var(--ink);margin:0}
.wlab{font-size:.75rem;color:var(--ink2);text-align:center;font-family:Atkinson Hyperlegible}
.pad{display:grid;grid-template-columns:repeat(6,minmax(52px,72px));gap:8px;justify-content:center}
.pad .btn{min-height:56px;font-size:1.3rem;padding:0}
.pad .btn.wide{grid-column:span 2;font-size:1rem}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.mini{position:relative;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);padding:6px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.mini.on{background:#E3F1E2;border-color:var(--basil-dk)}
:root[data-theme=dark] .mini.on{background:#1F3324}
.mini .tag{position:absolute;top:4px;right:4px;width:24px;height:24px}
.o3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slotbtn{min-width:120px;min-height:120px;border:2.5px dashed var(--ink2);border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:1.6rem}
.slotbtn.full{border-style:solid;border-color:var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink)}
.slotbtn small{font-size:.75rem;font-weight:700;color:var(--ink2);font-family:Lexend;text-transform:uppercase}
.slotbtn svg{width:64px;height:64px}
.slotbtn.used{opacity:.3}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(28,21,17,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 8px 0 var(--ink)}
.card .hd{display:flex;align-items:center;gap:12px;padding:14px 18px;font-family:Lexend;font-weight:800;font-size:1.5rem;border-bottom:2.5px solid var(--ink)}
.card .hd.ok{background:var(--okbg);color:var(--ok)}
.card .hd.no{background:var(--badbg);color:var(--bad)}
.card .hd svg{width:40px;height:40px;flex:none}
.card .bd{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.card .ft{padding:0 18px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.expl{font-size:1.1rem;margin:0;padding:10px 12px;border-left:6px solid var(--butter);background:var(--paper2);border-radius:6px}
.why{margin:0;font-weight:700;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
/* lesson */
.lesson{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.lesson .txt h2{font-size:1.7rem;margin-bottom:.4em}
.lesson .visual .pzw{--pz:min(190px,26vw)}
.lesson .txt p{font-size:1.15rem;margin:0 0 .7em}
.mistake{border:2.5px solid var(--bad);border-radius:12px;padding:10px 12px;background:var(--badbg)}
.mistake b{display:flex;align-items:center;gap:6px;font-family:Lexend;color:var(--bad);margin-bottom:2px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
/* shop */
.shopgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px}
.item .nm{flex:1;font-weight:700}
.item .nm small{display:block;font-weight:400;color:var(--ink2);font-size:.85rem}
.owned{font-family:Lexend;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:4px}
/* settings / teacher */
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:700}
.sw{position:relative;width:64px;height:36px;border-radius:999px;border:2.5px solid var(--ink);background:var(--paper2);cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw[aria-checked=true]{background:var(--basil)}
.sw[aria-checked=true]::after{left:31px;background:#FFF8EC}
table.sum{width:100%;border-collapse:collapse;font-size:.95rem}
table.sum th,table.sum td{border:2px solid var(--ink);padding:6px 8px;text-align:center}
table.sum th{background:var(--paper2);font-family:Lexend}
table.sum td:first-child{text-align:left;font-weight:700}
.scroll{overflow-x:auto}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .big{font-family:Lexend;font-weight:800;font-size:2.4rem}
.timer{height:22px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;flex:1;min-width:140px}
.timer i{display:block;height:100%;background:var(--tomato);transition:width .25s linear}
.timer.low i{background:var(--bad)}
.rushtag{font-family:Lexend;font-weight:800;background:var(--ink);color:var(--butter);padding:.3em .7em;border-radius:8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.anim .tp{animation:pop .35s both}
.anim .cl{stroke-dasharray:120;animation:draw .5s both}
.card,.lvl,.panel{animation:rise .25s both}
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
@media (max-width:860px){
  .play,.hero,.lesson,.shopgrid{grid-template-columns:1fr}
  .tline{font-size:1.25rem}
  .pad{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:520px){
  body{font-size:16px}
  .pad{grid-template-columns:repeat(4,1fr)}
  .pad .btn.wide{grid-column:span 2}
  .cut{min-width:52px}
  .eqn{font-size:1.8rem}
  .fentry{font-size:2rem}
  .pips .pip{width:20px;height:20px;font-size:.6rem}
}
@media print{
  body{background:#fff;color:#000}
  .noprint,.foot{display:none!important}
  .panel{border:0;box-shadow:none;animation:none}
}
</style>

"use strict";
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);

const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const eq=(a,b,c,d)=>a*d===b*c;
const cmp=(a,b,c,d)=>Math.sign(a*d-b*c);

const f1=x=>Math.round(x*100)/100;
const SLICES=[2,3,4,6,8,10,12];
const DW={2:['half','halves'],3:['third','thirds'],4:['fourth','fourths'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths'],12:['twelfth','twelfths']};
function F(n,d){return `<span class="fr" aria-label="${n} over ${d}"><span>${n}</span><span>${d}</span></span>`}
function M(w,n,d){return `<span class="mix">${w?`<span class="w">${w}</span>`:''}${n?F(n,d):''}</span>`}
/* value n/d shown as mixed number / whole when possible */
function V(n,d){if(n%d===0)return `<span class="mix"><span class="w">${n/d}</span></span>`;if(n>d)return M(Math.floor(n/d),n%d,d);return F(n,d)}
function S(n,d){if(d===1)return String(n);const w=DW[d];if(!w)return `${n} over ${d}`;return `${n} ${n===1?w[0]:w[1]}`}
function SV(n,d){if(n%d===0)return String(n/d);if(n>d)return `${Math.floor(n/d)} and ${S(n%d,d)}`;return S(n,d)}
const NAMES=['Ava','Leo','Mia','Noah','Priya','Mateo','Zoe','Kai','Amara','Ben','Lina','Omar','Hana','Theo','Sofia','Jamal','Nora','Ravi','Elena','Sam','Iris','Diego','June','Felix','Maya','Owen','Tara','Hugo'];
/* ============ toppings (shape + color) ============ */
const TK=['pep','mush','gpep','olive','pine'];
const TOP={pep:{name:'Pepperoni',w:'pepperoni',p:'pepperoni'},mush:{name:'Mushroom',w:'mushroom',p:'mushrooms'},gpep:{name:'Green pepper',w:'green pepper',p:'green peppers'},olive:{name:'Olive',w:'olive',p:'olives'},pine:{name:'Pineapple',w:'pineapple',p:'pineapple'}};
const r2=x=>Math.round(x*100)/100;
function drawTop(k,x,y,s,rot){

function check(it,a){

    if(it.fixedN&&a.n!==it.fixedN)return {ok:false,why:`The chef’s note says ${it.fixedN} slices. You cut ${a.n}.`};
    const c=counts(a);
    for(const L of it.lines){if((a.n*L.n)%L.d!==0)return {ok:false,why:`${a.n} slices can’t show ${DW[L.d][1]} evenly. Try ${SLICES.filter(x=>x%L.d===0).join(', ')} slices.`};
      if(!eq(c[L.t]||0,a.n,L.n,L.d))return {ok:false,why:`You put ${TOP[L.t].p} on ${c[L.t]||0} of ${a.n} slices${(c[L.t]||0)?` = ${F(c[L.t]||0,a.n)}`:''}. The order needs ${it.multi?V(L.n,L.d):F(L.n,L.d)}.`}}
    for(const k in c)if(!it.lines.some(L=>L.t===k))return {ok:false,why:`This order has no ${TOP[k].p}.`};
    return {ok:true}}
  if(it.type==='choice'){if(a==null)return {ok:false};return {ok:!!it.choices[a].ok}}
  if(it.type==='num'){return {ok:a!==''&&+a===it.ans}}

    n=n===''?0:+n;d=+d;return {ok:eq(w*d+n,d,it.ans[0],it.ans[1])}}
  if(it.type==='set')return {ok:a.size===it.need,why:a.size!==it.need?`You made ${a.size} veggie pizza${a.size===1?'':'s'}. The order needs ${it.need}.`:''};

    const all=[];it.lines.forEach(l=>{for(let i=0;i<l.n*each;i++)all.push(l.t)});const count=Math.max(1,Math.ceil(all.length/n));
    for(let p=0;p<count;p++)pz.push(Array.from({length:n},(_,i)=>all[p*n+i]||null));return {n,count,pizzas:pz}}

    if(!cur||inc.last>=cur.last){DB.students[s.name]=inc}else{['stars','best','rushBest'].forEach(k=>{for(const l in inc[k])cur[k][l]=Math.max(cur[k][l]||0,inc[k][l])})}n++});save();toast(`Imported ${n} player${n===1?'':'s'}.`);render()}catch(e){toast('That file is not a Fraction Pizza backup.')}};r.readAsText(file)}
/* ---------- settings modal ---------- */
function openSettings(){const st=DB.settings,s=stu();const ov=document.createElement('div');ov.className='ov';ov.id='setov';
  const row=(k,l)=>`<div class="tog">${l}<button class="sw" role="switch" aria-checked="${!!st[k]}" data-act="sset" data-k="${k}" aria-label="${l}"></button></div>`;
  ov.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Settings"><div class="hd">${IC.gear.replace('class="ico"','width="32" height="32"')}<span>Settings</span></div><div class="bd">
   ${row('sound','Sound effects')}${row('rm','Reduced motion')}${row('timer','Rush Hour timer')}${row('dark','Night shift (dark mode)')}
   <div class="row">${s?`<button class="btn sm" data-act="mybackup">Back up my progress</button><label class="btn sm" for="imp2">Restore a backup</label><input id="imp2" type="file" accept=".json,application/json" class="sr" data-act="import">`:''}${s?'<button class="btn sm" data-act="home">Switch player</button>':''}</div></div>
   <div class="ft"><button class="btn pri" data-act="closeset">Done</button></div></div>`;document.body.appendChild(ov)}
/* ---------- confetti ---------- */
function confetti(n){if(DB.settings.rm||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='confetti';const cols=['#C2412D','#F2BE4B','#3D7547','#DFA45F','#2E5E78'];
  for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%5];p.style.animationDelay=Math.random()*.4+'s';p.style.width=(6+Math.random()*8)+'px';if(i%3===0)p.style.borderRadius='50%';c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),2300)}
/* ---------- actions ---------- */
function login(name,cls){name=name.trim().slice(0,16);if(!name){toast('Type your name first.');return}if(!DB.students[name])DB.students[name]=newStu(name,cls);DB.current=name;ST.mode=cls?'class':'solo';DB.students[name].last=Date.now();save();go('map')}
function act(a,el){const d=el?el.dataset:{};const it=(ST.screen==='play'||ST.screen==='rush')?curItem():null;
  switch(a){
  case 'solo':login(($('#nm')||{}).value||'',false);break;
  case 'pick':login(d.n,false);break;
  case 'class':login('Class Team',true);break;
  case 'teacher':ST.tok=false;go('teacher');setTimeout(()=>{const p=$('#pin');if(p){p.focus();p.onkeydown=e=>{if(e.key==='Enter')act('pinok')}}},50);break;
  case 'pinok':if(($('#pin')||{}).value===DB.settings.pin){ST.tok=true;render()}else toast('That PIN is not correct.');break;
  case 'home':$$('.ov').forEach(o=>o.remove());ST.mode='solo';go('start');break;
  case 'map':clearInterval(rushTimer);$$('.ov').forEach(o=>o.remove());go('map');break;
  case 'learn':ST.lvl=+d.l;ST.lesson=0;go('learn');break;
  case 'lnext':ST.lesson++;render();break;
  case 'lprev':ST.lesson=Math.max(0,ST.lesson-1);render();break;
  case 'lsay':{const sl=LESSONS[ST.lvl][ST.lesson];say(strip(sl.h+'. '+sl.p.join(' ')+(sl.m?' Common mistake: '+sl.m:'')));break}
  case 'startlvl':startLevel(+d.l);break;
  case 'rush':startRush(+d.l);break;
  case 'shop':go('shop');break;
  case 'buy':{const s=stu(),u=UPG.find(x=>x.id===d.id);if(u&&s.coins>=u.cost&&!s.upg.includes(u.id)){s.coins-=u.cost;s.upg.push(u.id);save();SFX.win();confetti(30);render()}break}
  case 'settings':openSettings();break;
  case 'closeset':$('#setov')&&$('#setov').remove();if(ST.screen!=='play'&&ST.screen!=='rush')render();break;
  case 'sset':DB.settings[d.k]=!DB.settings[d.k];save();el.setAttribute('aria-checked',DB.settings[d.k]);applySettings();break;
  case 'tset':DB.settings[d.k]=!DB.settings[d.k];save();el.setAttribute('aria-checked',DB.settings[d.k]);break;
  case 'mybackup':exportData(stu());break;
  case 'export':exportData();break;
  case 'print':window.print();break;
  case 'chpin':{const p=prompt('New teacher PIN (4–8 digits):');if(p&&/^\d{4,8}$/.test(p)){DB.settings.pin=p;save();toast('PIN changed.')}else if(p)toast('Use 4–8 digits.');break}
  case 'resetstu':{const n=$('#delsel').value;if(n&&confirm(`Reset all progress for ${n}?`)){const c=DB.students[n].cls;DB.students[n]=newStu(n,c);save();render()}break}
  case 'delstu':{const n=$('#delsel').value;if(n&&confirm(`Delete ${n} from this device?`)){delete DB.students[n];if(DB.current===n)DB.current=null;save();render()}break}
  case 'say':say(it.say);break;
  case 'saysol':{const o=el.closest('.ov');say(o.dataset.say);break}
  case 'think':{let t=30;const b=el;b.disabled=true;const iv=setInterval(()=>{b.innerHTML=`${IC.clock}${t}s`;if(--t<0){clearInterval(iv);b.innerHTML=`${IC.clock}Think time`;b.disabled=false;SFX.coin()}},1000);break}
  case 'cut':{const n=+d.n;if(ST.b.n===n)break;const had=ST.b.pizzas.some(p=>p.some(Boolean));ST.b.n=n;ST.b.pizzas=Array.from({length:3},()=>Array(n).fill(null));SFX.slice();refreshWork();if(had)toast('New cut: toppings cleared.',1300);break}
  case 'pzplus':if(ST.b.count<3){ST.b.count++;refreshWork()}break;
  case 'pzminus':if(ST.b.count>1){ST.b.count--;if(ST.b.n)ST.b.pizzas[ST.b.count]=Array(ST.b.n).fill(null);refreshWork()}break;
  case 'clearall':ST.b.pizzas=Array.from({length:3},()=>Array(ST.b.n||0).fill(null));refreshWork();break;
  case 'opt':ST.sel=+d.i;SFX.tap();$$('.opt').forEach((o,i)=>{o.classList.toggle('on',i===ST.sel);o.setAttribute('aria-pressed',i===ST.sel)});break;
  case 'focus':ST.e.f=d.f;refreshWork();break;
  case 'key':keyIn(d.k);break;
  case 'settog':{const i=+d.i;ST.set.has(i)?ST.set.delete(i):ST.set.add(i);SFX.tap();refreshWork();break}
  case 'o3':{const i=+d.i;if(!ST.o3.includes(i)&&ST.o3.length<3){ST.o3.push(i);SFX.tap();refreshWork()}break}
  case 'o3x':{const k=+d.k;if(ST.o3[k]!=null){ST.o3.splice(k,1);refreshWork()}break}
  case 'o3clear':ST.o3=[];refreshWork();break;
  case 'check':doCheck();break;
  case 'next':nextItem();break;
  }}
function keyIn(k){const e=ST.e;const f=e.f;if(k==='del'){e[f]=e[f].slice(0,-1)}else if(e[f].length<2){e[f]=(e[f]==='0'?'':e[f])+k}
  if(curItem().type==='frac'&&k!=='del'&&e[f].length>=1){/* stay; user taps next box */}
  SFX.tap();refreshWork()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;if(el.closest('.tray')||(el.closest('.pizzas')))return;act(el.dataset.act,el)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.act==='import'&&e.target.files[0])importData(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if($('.ov')){if(e.key==='Enter'||e.key==='Escape'){const n=$('#nextBtn');if(n){e.preventDefault();nextItem()}else if(e.key==='Escape'&&$('#setov'))$('#setov').remove()}return}
  if(ST.screen!=='play'&&ST.screen!=='rush')return;const it=curItem();
  if(/^[0-9]$/.test(e.key)&&(it.type==='num'||it.type==='frac')){keyIn(e.key);return}
  if(e.key==='Backspace'&&(it.type==='num'||it.type==='frac')){e.preventDefault();keyIn('del');return}
  if(e.key==='Tab'&&it.type==='frac'){e.preventDefault();const ord=(it.whole?['w','n','d']:['n','d']);ST.e.f=ord[(ord.indexOf(ST.e.f)+(e.shiftKey?ord.length-1:1))%ord.length];refreshWork();return}
  if(e.key==='Enter'){e.preventDefault();doCheck()}});
/* test hooks (used by the automated QA) */
window.__fpsRender=()=>render();window.__fps={genLevel,genRush,check,solve,LEVELS,SLICES,sector,pizzaSVG,get ST(){return ST},get DB(){return DB},act,login,save};
load();render();
</script>

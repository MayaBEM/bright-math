 divide by 10, every digit in the number slides one place along the place-value chart. Multiply or divide by a power of 10 — like 10³ or 10⁶ — and the digits slide several places at once, all in one clean move. Once you can see that sliding motion, huge numbers (distances in space) and tiny ones (the width of a blood cell) become just as easy to handle as small whole numbers.`,blocks:[{kind:`heading`,id:`what-is-a-power`,text:`What is a power of 10?`},{kind:`p`,text:`A power of 10 is what you get when you multiply 10 by itself a number of times. ${Zm(1)} is 10, ${Zm(2)} is 10 × 10 = 100, and ${Zm(4)} means 10 × 10 × 10 × 10 = 10 000. The small raised number is called the power, index or exponent — it tells you how many 10s are multiplied together.`},{kind:`tip`,text:`Shortcut: for a whole-number power of 10, the exponent tells you exactly how many zeros follow the 1. ${Zm(5)} has 5 zeros, so ${Zm(5)} = ${Qm(1e5)}.`},{kind:`visual`,component:`powerMachine`,props:{mode:`explore`}},{kind:`heading`,id:`multiplying`,text:`Multiplying by a power of 10`},{kind:`p`,text:`When you multiply by 10ⁿ, every digit shifts n places to the left on the place-value chart — which has the same effect as moving the decimal point n places to the right. For a whole number, that looks like “adding zeros”, but it's really the digits changing which column they sit in.`},{kind:`worked`,title:`Work out ${$m(6,4)}`,steps:[`${Zm(4)} means 10 000, so this is 6 × 10 000.`,`The digit 6 shifts 4 places to the left: from the ones column all the way to the ten-thousands column.`,`6 → 60 000`],answer:Qm(6e4)},{kind:`worked`,title:`Work out ${$m(`34.6`,3)}`,steps:[`${Zm(3)} means the decimal point moves 3 places to the right.`,`34.6 → 346. → 3460. → 34600.`,`There's no digit left after the point, so we just write the whole number.`],answer:Qm(34600)},{kind:`mistake`,wrong:`Thinking ${$m(`0.36`,6)} = 0.36 with six zeros stuck on the end (0.36000000)`,right:`0.36 × 10⁶ = 360 000`,why:`“Add zeros” only works when every digit is to the left of the decimal point already. With a decimal number, picture the decimal point moving n places to the right instead — that always works, for whole numbers and decimals alike.`},{kind:`heading`,id:`dividing`,text:`Dividing by a power of 10`},{kind:`p`,text:`Dividing by 10ⁿ does the reverse: every digit shifts n places to the right, which moves the decimal point n places to the left. If there aren't enough digits to shift, fill the empty places with zeros.`},{kind:`worked`,title:`Work out ${eh(72e4,4)}`,steps:[`${Zm(4)} has 4 zeros, so shift every digit 4 places to the right.`,`720000 → 72000. → 7200. → 720. → 72.`],answer:`72`},{kind:`worked`,title:`Work out ${eh(`5.4`,2)}`,steps:[`Move the decimal point 2 places to the left: 5.4 → 0.54 → 0.054.`,`There aren't enough digits before the point, so a zero fills the empty place.`],answer:`0.054`},{kind:`visual`,component:`powerMachine`,props:{mode:`challenge`}},{kind:`heading`,id:`combined`,text:`Combining several powers of 10`},{kind:`p`,text:`If a number is multiplied and divided by several powers of 10 in a row, the exponents simply add and subtract to give one overall shift. Multiplying by 10³ then dividing by 10⁵ is the same as dividing by 10² overall, because 3 − 5 = −2.`},{kind:`worked`,title:`Priya starts with a number, multiplies by 10³, divides by 10⁵, multiplies by 10⁶, then divides by 10². She thinks this is the same as multiplying by 10.`,steps:[`Add the exponents, using + for × and − for ÷: +3 − 5 + 6 − 2.`,`+3 − 5 + 6 − 2 = 2, so the overall effect is × 10², not × 10.`,`Test it: starting from 7 → × 10³ = 7000 → ÷ 10⁵ = 0.07 → × 10⁶ = 70 000 → ÷ 10² = 700, which is 7 × 100.`],answer:`Priya is incorrect — the overall effect is × 100, not × 10.`},{kind:`tip`,text:`Whenever a question chains several × 10 and ÷ 10 steps together, add up the exponents first (treating division as a negative exponent) before you touch a single digit.`},{kind:`heading`,id:`units`,text:`Using powers of 10 to convert metric units`},{kind:`p`,text:`The metric system is built entirely from powers of 10, which is exactly why converting between metric units is just multiplying or dividing by a power of 10. For mass: number of milligrams = number of grams × 10³ = number of kilograms × 10⁶ = number of tonnes × 10⁹.`},{kind:`visual`,component:`massConverter`},{kind:`worked`,title:`Convert 0.9 kg to milligrams, and convert 36 000 mg to grams`,steps:[`mg = kg × 10⁶, so 0.9 × 10⁶ = 900 000 mg.`,`To reverse a conversion, divide instead of multiply: g = mg ÷ 10³.`,`36 000 ÷ 10³ = 36 g.`],answer:`0.9 kg = 900 000 mg, and 36 000 mg = 36 g`},{kind:`heading`,id:`ordering`,text:`Comparing numbers written as a decimal × a power of 10`},{kind:`p`,text:`Scientists often write very large or very small measurements as a decimal number between 1 and 10, multiplied by a power of 10 — for example, a probe's distance from five landmarks. You could work out every multiplication first, but it's faster to compare the powers of 10 first: a bigger exponent almost always means a bigger number, since each extra power of 10 multiplies the size by 10 again.`},{kind:`visual`,component:`spaceDistances`},{kind:`worked`,title:`Order these distances from smallest to largest: 5.2 × 10³ km, 6.7 × 10⁶ km, 1.9 × 10² km, 3.05 × 10⁸ km, 8.4 × 10⁴ km`,steps:[`Compare the exponents first: 10² < 10³ < 10⁴ < 10⁶ < 10⁸.`,`That already fixes the order: 1.9×10², then 5.2×10³, then 8.4×10⁴, then 6.7×10⁶, then 3.05×10⁸.`,`Check by calculating: 190, 5200, 84 000, 6 700 000, 305 000 000 — the order matches.`],answer:`190 km, 5 200 km, 84 000 km, 6 700 000 km, 305 000 000 km`}],summary:[`Multiplying by 10ⁿ shifts every digit n places to the left (the decimal point moves n places right).`,`Dividing by 10ⁿ shifts every digit n places to the right (the decimal point moves n places left), filling empty places with zeros.`,`Chained × 10 and ÷ 10 steps combine by adding and subtracting their exponents.`,`Metric unit conversions are just multiplying or dividing by a power of 10.`,`To compare numbers written as decimal × 10ⁿ, compare the exponents first.`]},oh={lessonId:`rounding`,intro:`Rounding lets you state a number as precisely as a situation actually needs — no more, no less. A nurse doesn't need a patient's mass to eight decimal places, but an engineer designing a satellite might need several. The rules are the same however many digits you keep: you just need to look at the right one.`,blocks:[{kind:`heading`,id:`degree-of-accuracy`,text:`Degree of accuracy`},{kind:`p`,text:`The degree of accuracy is the level of detail you round an answer to — for example, “to 2 decimal places” or “to the nearest 10”. To round to a given degree of accuracy, keep the digits up to that point and use the very next digit to decide whether the last digit you keep stays the same or increases by 1.`},{kind:`keyword`,term:`round`,def:`To replace a number with a simpler, less exact value that is close to it.`},{kind:`keyword`,term:`degree of accuracy`,def:`How precise a rounded answer is, e.g. “to 2 decimal places” or “to the nearest whole number”.`},{kind:`heading`,id:`decimal-places`,text:`Rounding to a number of decimal places`},{kind:`p`,text:`To round to n decimal places: keep the first n digits after the decimal point, then look at the next digit along. If that digit is 5 or more, round the last digit you kept up by 1. If it's less than 5, leave it as it is.`},{kind:`visual`,component:`roundingLine`,props:{value:5.27,dp:1}},{kind:`worked`,title:`Round 5.27 to 1 decimal place`,steps:[`Keep 1 digit after the point: 5.2, and look at the next digit, 7.`,`7 is 5 or more, so round the tenths digit up: 2 → 3.`],answer:`5.3`},{kind:`worked`,title:`Round 3.95 to 1 decimal place`,steps:[`Keep the digit 9, and look at the next digit, 5.`,`5 rounds up, so 9 becomes 10 — the extra 1 carries into the units column.`,`3.9… rounds up to 4.0, not “3.10”.`],answer:`4.0`},{kind:`tip`,text:`Keep every decimal place you were asked for, even if the last digit turns out to be a zero. “Round 19.995 to 2 d.p.” must be written 20.00, not just 20.`},{kind:`mistake`,wrong:`Writing 7.4955 rounded to 2 d.p. as 7.5`,right:`7.4955 rounded to 2 d.p. = 7.50`,why:`7.5 only shows 1 decimal place. “To 2 decimal places” means the answer must show exactly 2 digits after the point, even when the second one is a zero.`},{kind:`heading`,id:`nearest-10-and-whole`,text:`Rounding to the nearest 10 or a whole number`},{kind:`p`,text:`The same idea works for rounding to the nearest whole number or the nearest 10 — you just look one column further to the right than the one you're rounding to.`},{kind:`table`,headers:[`Degree of accuracy`,`132.457 681 rounds to`],rows:[[`nearest 10`,`130`],[`nearest whole number`,`132`],[`1 decimal place`,`132.5`],[`2 decimal places`,`132.46`],[`3 decimal places`,`132.458`],[`4 decimal places`,`132.4577`],[`5 decimal places`,`132.45768`]]},{kind:`p`,text:`The same starting number gives a different-looking rounded answer at every degree of accuracy — none of them is “more correct” than another; they're just different levels of precision.`},{kind:`heading`,id:`division-and-calculators`,text:`Rounding answers from division or a calculator`},{kind:`p`,text:`When a division doesn't work out exactly, work out one extra digit beyond the accuracy you need, then round — never stop exactly at the target place and just cut the rest off. Cutting off without checking the next digit is called truncating, and it can quietly give you the wrong rounded answer.`},{kind:`visual`,component:`longDivision`},{kind:`worked`,title:`Amir and Zara both round 100 ÷ 7 to 3 decimal places`,steps:[`100 ÷ 7 = 14.285714…`,`Amir stops his division exactly at 3 decimal places: 14.285. He has truncated, not rounded — he never looked at the 4th digit.`,`Zara works out one extra digit, 14.2857, then rounds that to 3 d.p. The 4th digit is 7, so the 3rd digit rounds up: 14.286.`],answer:`Zara is correct: 14.286. Amir's 14.285 is wrong because he ignored the digit that decides the rounding.`},{kind:`tip`,text:`Rule of thumb: to round correctly to n decimal places, calculate to at least n + 1 decimal places first.`},{kind:`heading`,id:`golden-rule`,text:`Round only the final answer`},{kind:`p`,text:`If a calculation has more than one step, round only at the very end. Rounding numbers in the middle of a calculation can shift the final answer, because each rounding step throws away a little bit of information — and those small errors can add up.`},{kind:`worked`,title:`Work out 19.385 62 − 4.146 18, correct to 3 decimal places, two different ways`,steps:[`Correct way — subtract first, round last: 19.38562 − 4.14618 = 15.23944, which rounds to 15.239.`,`Risky way — round first, then subtract: 19.386 − 4.146 = 15.240.`,`The two methods give different answers: 15.239 and 15.240.`],answer:`The correct 3 d.p. answer is 15.239. Rounding the numbers before subtracting gave the wrong final answer, 15.240.`},{kind:`mistake`,wrong:`Rounding each number as you go through a multi-step calculation`,right:`Carry the exact (or a very precise) value through every step, and round only the final result`,why:`Each early rounding step can nudge the true value slightly. Those small nudges can combine and change the digit you round to at the end.`},{kind:`heading`,id:`working-backwards`,text:`Working backwards: which numbers round to a given value?`},{kind:`p`,text:`Rounding also works in reverse: lots of different numbers can round to the same value, because rounding only cares about which side of a midpoint a number falls on.`},{kind:`worked`,title:`Which numbers round to 12.75, correct to 2 decimal places?`,steps:[`12.75 rounds a number that is at least 12.745 but less than 12.755.`,`12.745, 12.7498, 12.75, and 12.7549 all lie in that range, so they all round to 12.75.`,`12.744 is just outside the range (it rounds down to 12.74), and 12.755 is just outside the other end (it rounds up to 12.76).`],answer:`Any number from 12.745 up to (but not including) 12.755 rounds to 12.75.`}],summary:[`To round to n decimal places, keep n digits after the point and use the next digit to decide whether to round up or leave as is.`,`Keep every requested decimal place, even trailing zeros — “to 2 d.p.” always shows 2 digits after the point.`,`The same number rounds to a different-looking value at every degree of accuracy — none is more ‘correct’ than another.`,`When dividing, work out one extra digit before rounding, or you risk truncating instead of rounding.`,`Round only the final answer of a multi-step calculation — rounding partway through can change the result.`]},sh={lessonId:`powers-of-ten`,questions:[{id:`pot-p1`,type:`mcq`,prompt:`What is 10⁴?`,choices:[{id:`a`,label:`40`},{id:`b`,label:`1000`},{id:`c`,label:`10 000`},{id:`d`,label:`40 000`}],correctChoiceId:`c`,explanation:`10⁴ means 10 × 10 × 10 × 10 = 10 000. The exponent 4 tells you there are 4 zeros after the 1.`,misconceptions:{a:`This treats the power as “10 × 4” instead of “10 multiplied by itself 4 times”.`,b:`1000 is 10³, one power too small.`,d:`40 000 has one zero too many — 10⁴ has exactly 4 zeros, not 5.`}},{id:`pot-p2`,type:`mcq`,prompt:`How many zeros follow the 1 in 10⁷?`,choices:[{id:`a`,label:`6`},{id:`b`,label:`7`},{id:`c`,label:`8`},{id:`d`,label:`70`}],correctChoiceId:`b`,explanation:`The exponent of a power of 10 always equals the number of zeros after the 1, so 10⁷ has 7 zeros.`,misconceptions:{a:`One zero short — easy to lose count when writing out a long number.`,c:`One zero too many.`,d:`70 is the exponent written as a number, not the zero count.`}},{id:`pot-p3`,type:`numeric`,prompt:`Work out 7 × 10⁴.`,correctValue:7e4,explanation:`Shift the digit 7 four places to the left: 7 → 70 000.`},{id:`pot-p4`,type:`numeric`,prompt:`Work out 0.52 × 10³.`,correctValue:520,explanation:`Move the decimal point 3 places to the right: 0.52 → 5.2 → 52. → 520.`},{id:`pot-p5`,type:`mcq`,prompt:`What is 9 × 10⁵?`,choices:[{id:`a`,label:`90 000`},{id:`b`,label:`900 000`},{id:`c`,label:`9 000 000`},{id:`d`,label:`45 000`}],correctChoiceId:`b`,explanation:`10⁵ = 100 000, and 9 × 100 000 = 900 000.`,misconceptions:{a:`This uses 10⁴ (4 zeros) instead of 10⁵ (5 zeros).`,c:`This uses 10⁶ (6 zeros) instead of 10⁵.`,d:`This multiplies 9 × 5 instead of using 9 × 10⁵.`}},{id:`pot-p6`,type:`numeric`,prompt:`Work out 630 000 ÷ 10⁴.`,correctValue:63,explanation:`Shift every digit 4 places to the right: 630 000 → 63.`},{id:`pot-p7`,type:`numeric`,prompt:`Work out 8.2 ÷ 10².`,correctValue:.082,explanation:`Move the decimal point 2 places to the left: 8.2 → 0.82 → 0.082.`},{id:`pot-p8`,type:`mcq`,prompt:`What is 450 000 ÷ 10⁵?`,choices:[{id:`a`,label:`0.45`},{id:`b`,label:`4.5`},{id:`c`,label:`45`},{id:`d`,label:`450`}],correctChoiceId:`b`,explanation:`Shift every digit 5 places to the right: 450 000 → 4.5.`,misconceptions:{a:`This shifts one place too many.`,c:`This shifts one place too few (only 4 places).`,d:`This divides by 10³ instead of 10⁵.`}},{id:`pot-p9`,type:`true-false`,prompt:`True or false?`,statement:`0.7 × 10⁶ = 70 000`,correctAnswer:!1,explanation:`0.7 × 10⁶ = 700 000. Moving the decimal point 6 places to the right from 0.7 gives 700000, not 70000 — a common slip is moving it one place too few.`},{id:`pot-p10`,type:`true-false`,prompt:`True or false?`,statement:`Dividing a number by 10³ moves every digit 3 places to the right, which moves the decimal point 3 places to the left.`,correctAnswer:!0,explanation:`Dividing by a power of 10 always shifts digits to the right by the value of the exponent.`},{id:`pot-p11`,type:`fill-blank`,prompt:`Complete the conversion rule: number of milligrams = number of grams × 10^__`,correctAnswers:[`3`],explanation:`1 gram = 1000 milligrams = 10³ milligrams.`,placeholder:`exponent`},{id:`pot-p12`,type:`numeric`,prompt:`Convert 0.62 kg to milligrams. (mg = kg × 10⁶)`,correctValue:62e4,unit:`mg`,explanation:`0.62 × 10⁶ = 620 000 mg.`},{id:`pot-p13`,type:`numeric`,prompt:`Convert 8 000 000 mg to kilograms. (kg = mg ÷ 10⁶)`,correctValue:8,unit:`kg`,explanation:`8 000 000 ÷ 10⁶ = 8 kg.`},{id:`pot-p14`,type:`order`,prompt:`Put these distances in order, from smallest to largest.`,orderHint:`smallest → largest`,items:[{id:`a`,label:`3.4 × 10² km`},{id:`b`,label:`5.5 × 10⁴ km`},{id:`c`,label:`2.1 × 10⁵ km`},{id:`d`,label:`9.9 × 10⁷ km`}],correctOrder:[`a`,`b`,`c`,`d`],explanation:`Compare the exponents: 10² < 10⁴ < 10⁵ < 10⁷, so 340 km < 55 000 km < 210 000 km < 99 000 000 km.`},{id:`pot-p15`,type:`matching`,prompt:`Match each expression to its value.`,pairs:[{id:`m1`,left:`6 × 10³`,right:`6000`},{id:`m2`,left:`6 × 10⁴`,right:`60 000`},{id:`m3`,left:`6 × 10⁵`,right:`600 000`},{id:`m4`,left:`6 ÷ 10²`,right:`0.06`}],explanation:`Each extra power of 10 in a multiplication adds one more zero; dividing by a power of 10 moves the decimal point left instead.`}]},ch={lessonId:`rounding`,questions:[{id:`rnd-p1`,type:`numeric`,prompt:`Round 8.36 to 1 decimal place.`,correctValue:8.4,explanation:`Keep the tenths digit 3 and look at the hundredths digit, 6. Since 6 ≥ 5, round the 3 up to 4.`},{id:`rnd-p2`,type:`numeric`,prompt:`Round 4.05 to 1 decimal place.`,correctValue:4.1,explanation:`The tenths digit is 0, and the next digit is 5, so it rounds up: 4.05 → 4.1.`},{id:`rnd-p3`,type:`fill-blank`,prompt:`Round 6.999 to 2 decimal places. Write your answer showing exactly 2 decimal places.`,correctAnswers:[`7.00`,`7.0`],explanation:`6.999 rounds up: the hundredths and tenths digits both carry, turning 6.99… into 7.00. Even though it's a whole number, 2 decimal places must still be shown: 7.00.`,placeholder:`e.g. 1.23`},{id:`rnd-p4`,type:`numeric`,prompt:`Round 0.0728 to 3 decimal places.`,correctValue:.073,explanation:`Keep 0.072 and look at the next digit, 8. Since 8 ≥ 5, round up: 0.073.`},{id:`rnd-p5`,type:`numeric`,prompt:`Round 15.4 to the nearest 10.`,correctValue:20,explanation:`15.4 is closer to 20 than to 10 once you compare it to the midpoint, 15 — anything from 15 upward rounds to 20.`},{id:`rnd-p6`,type:`numeric`,prompt:`Round 476.3 to the nearest 10.`,correctValue:480,explanation:`476.3 is between 470 and 480, and it's closer to 480.`},{id:`rnd-p7`,type:`numeric`,prompt:`Round 7.5 to the nearest whole number.`,correctValue:8,explanation:`7.5 is exactly halfway between 7 and 8. By the standard rounding rule, halfway values round up, giving 8.`},{id:`rnd-p8`,type:`numeric`,prompt:`Round 2.499 to 1 decimal place.`,correctValue:2.5,explanation:`Keep the tenths digit 4 and look at the hundredths digit, 9. Since 9 ≥ 5, round up: 2.5.`},{id:`rnd-p9`,type:`mcq`,prompt:`What is 25 ÷ 6 correct to 3 decimal places?`,choices:[{id:`a`,label:`4.166`},{id:`b`,label:`4.167`},{id:`c`,label:`4.16`},{id:`d`,label:`4.17`}],correctChoiceId:`b`,explanation:`25 ÷ 6 = 4.1666… The 4th decimal digit is 6, which rounds the 3rd digit up: 4.167.`,misconceptions:{a:`This truncates at 3 decimal places instead of checking the 4th digit and rounding.`,c:`This only shows 2 decimal places, not 3.`,d:`This rounds to 2 decimal places (4.17) instead of 3.`}},{id:`rnd-p10`,type:`true-false`,prompt:`True or false?`,statement:`Cutting a division off exactly at the number of decimal places you need always gives the correctly rounded answer.`,correctAnswer:!1,explanation:`This is truncating, not rounding. For example, truncating 25 ÷ 6 at 3 d.p. gives 4.166, but the correctly rounded answer is 4.167 — you must check the next digit.`},{id:`rnd-p11`,type:`mcq`,prompt:`What is 0.4996 correct to 3 decimal places?`,choices:[{id:`a`,label:`0.5`},{id:`b`,label:`0.500`},{id:`c`,label:`0.499`},{id:`d`,label:`0.4996`}],correctChoiceId:`b`,explanation:`Keep 0.499 and look at the next digit, 6. Rounding up carries all the way through: 0.499 + 0.001 = 0.500. Written to 3 d.p., it must show all 3 digits.`,misconceptions:{a:`This only shows 1 decimal place, not 3.`,c:`This forgets to round up using the 4th digit.`,d:`This isn't rounded at all — it's the original number.`}},{id:`rnd-p12`,type:`mcq`,prompt:`What does ‘degree of accuracy’ mean?`,choices:[{id:`a`,label:`How many questions you answered correctly`},{id:`b`,label:`The level of precision a rounded value is given to, such as ‘2 decimal places’`},{id:`c`,label:`Always rounding to the nearest whole number`},{id:`d`,label:`The opposite of estimating`}],correctChoiceId:`b`,explanation:`Degree of accuracy describes how precise a rounded answer is — for example, ‘to the nearest 10’ or ‘to 3 decimal places’ are both degrees of accuracy.`},{id:`rnd-p13`,type:`mcq`,prompt:`Which of these numbers rounds to 9.62, correct to 2 decimal places?`,choices:[{id:`a`,label:`9.612`},{id:`b`,label:`9.618`},{id:`c`,label:`9.625`},{id:`d`,label:`9.63`}],correctChoiceId:`b`,explanation:`9.618 lies between 9.615 and 9.625, so it rounds to 9.62. 9.612 rounds to 9.61, and 9.625 rounds up to 9.63 (it's exactly on the next boundary).`,misconceptions:{a:`9.612 is below 9.615, so it rounds down to 9.61 instead.`,c:`9.625 sits exactly on the boundary and rounds up to 9.63, not down to 9.62.`,d:`9.63 is already outside the range that rounds to 9.62.`}},{id:`rnd-p14`,type:`mcq`,prompt:`Why should you round only the final answer of a multi-step calculation?`,choices:[{id:`a`,label:`It's faster to only round once`},{id:`b`,label:`Rounding partway through can introduce small errors that change the final rounded answer`},{id:`c`,label:`Calculators are only accurate for final answers`},{id:`d`,label:`It only matters when working with money`}],correctChoiceId:`b`,explanation:`Each early rounding step throws away a small amount of information. Those small changes can build up and shift the digit you round to at the very end.`}]},lh={lessonId:`final`,questions:[{id:`fin-pot-1`,type:`mcq`,prompt:`What is 10⁶?`,choices:[{id:`a`,label:`60 000`},{id:`b`,label:`600 000`},{id:`c`,label:`1 000 000`},{id:`d`,label:`6 000 000`}],correctChoiceId:`c`,explanation:`10⁶ = 10 multiplied by itself 6 times = 1 000 000 (six zeros after the 1).`,misconceptions:{a:`This confuses the exponent with a coefficient of 6.`,b:`Also mixes in a 6 that shouldn't be there — 10⁶ alone is 1 000 000.`,d:`This is 6 × 10⁶, not 10⁶ itself.`}},{id:`fin-pot-2`,type:`numeric`,prompt:`Work out 3 × 10⁶.`,correctValue:3e6,explanation:`Shift the digit 3 six places to the left: 3 000 000.`},{id:`fin-pot-3`,type:`numeric`,prompt:`Work out 0.47 × 10⁴.`,correctValue:4700,explanation:`Move the decimal point 4 places right: 0.47 → 4.7 → 47. → 470. → 4700.`},{id:`fin-pot-4`,type:`mcq`,prompt:`What is 5 × 10⁷?`,choices:[{id:`a`,label:`5 000 000`},{id:`b`,label:`50 000 000`},{id:`c`,label:`500 000 000`},{id:`d`,label:`500 000`}],correctChoiceId:`b`,explanation:`10⁷ = 10 000 000, and 5 × 10 000 000 = 50 000 000.`,misconceptions:{a:`This uses 10⁶ instead of 10⁷.`,c:`This uses 10⁸ instead of 10⁷.`,d:`This uses 10⁵ instead of 10⁷.`}},{id:`fin-pot-5`,type:`numeric`,prompt:`Work out 910 000 ÷ 10³.`,correctValue:910,explanation:`Shift every digit 3 places to the right: 910 000 → 910.`},{id:`fin-pot-6`,type:`numeric`,prompt:`Work out 6.3 ÷ 10³.`,correctValue:.0063,explanation:`Move the decimal point 3 places to the left: 6.3 → 0.63 → 0.063 → 0.0063.`},{id:`fin-pot-7`,type:`true-false`,prompt:`True or false?`,statement:`72 000 000 ÷ 10⁶ = 72`,correctAnswer:!0,explanation:`10⁶ has 6 zeros. Removing 6 zeros from 72 000 000 leaves 72.`},{id:`fin-pot-8`,type:`fill-blank`,prompt:`Complete the conversion rule: number of milligrams = number of kilograms × 10^__`,correctAnswers:[`6`],explanation:`1 kilogram = 1 000 000 milligrams = 10⁶ milligrams.`,placeholder:`exponent`},{id:`fin-pot-9`,type:`numeric`,prompt:`Convert 1.5 tonnes to milligrams. (mg = t × 10⁹)`,correctValue:15e8,unit:`mg`,explanation:`1.5 × 10⁹ = 1 500 000 000 mg.`},{id:`fin-pot-10`,type:`numeric`,prompt:`Convert 930 000 000 mg to tonnes. (t = mg ÷ 10⁹)`,correctValue:.93,unit:`t`,explanation:`930 000 000 ÷ 10⁹ = 0.93 t.`},{id:`fin-pot-11`,type:`order`,prompt:`Put these measurements in order, from smallest to largest.`,orderHint:`smallest → largest`,items:[{id:`a`,label:`7.2 × 10²`},{id:`b`,label:`4.6 × 10⁴`},{id:`c`,label:`1.1 × 10⁶`},{id:`d`,label:`2.05 × 10⁹`}],correctOrder:[`a`,`b`,`c`,`d`],explanation:`Compare exponents first: 10² < 10⁴ < 10⁶ < 10⁹, so 720 < 46 000 < 1 100 000 < 2 050 000 000.`},{id:`fin-pot-12`,type:`matching`,prompt:`Match each expression to its value.`,pairs:[{id:`m1`,left:`4 × 10²`,right:`400`},{id:`m2`,left:`4 × 10³`,right:`4000`},{id:`m3`,left:`4 × 10⁵`,right:`400 000`},{id:`m4`,left:`4 ÷ 10²`,right:`0.04`}],explanation:`Multiplying by a bigger power of 10 shifts the digits further left; dividing shifts them right instead.`},{id:`fin-pot-13`,type:`numeric`,prompt:`Jae starts with 3, multiplies by 10², divides by 10⁴, multiplies by 10⁵, then divides by 10¹. What is the result?`,correctValue:300,explanation:`Add the exponents: +2 − 4 + 5 − 1 = 2, so the overall effect is × 10². 3 × 10² = 300.`},{id:`fin-rnd-1`,type:`numeric`,prompt:`Round 3.14159 to 2 decimal places.`,correctValue:3.14,explanation:`Keep 3.14 and look at the next digit, 1. Since 1 < 5, round down (keep it as it is): 3.14.`},{id:`fin-rnd-2`,type:`fill-blank`,prompt:`Round 9.995 to 2 decimal places. Write your answer showing exactly 2 decimal places.`,correctAnswers:[`10.00`,`10.0`],explanation:`9.995 rounds up: the hundredths, tenths, and units digits all carry, turning 9.99… into 10.00. The 2 decimal places must still be shown.`,placeholder:`e.g. 1.23`},{id:`fin-rnd-3`,type:`numeric`,prompt:`Round 0.0451 to 3 decimal places.`,correctValue:.045,explanation:`Keep 0.045 and look at the next digit, 1. Since 1 < 5, it stays 0.045.`},{id:`fin-rnd-4`,type:`numeric`,prompt:`Round 128.6 to the nearest 10.`,correctValue:130,explanation:`128.6 is between 120 and 130, and closer to 130.`},{id:`fin-rnd-5`,type:`numeric`,prompt:`Round 84.5 to the nearest whole number.`,correctValue:85,explanation:`84.5 is exactly halfway between 84 and 85. Halfway values round up, giving 85.`},{id:`fin-rnd-6`,type:`true-false`,prompt:`True or false?`,statement:`Truncating 13 ÷ 6 at 3 decimal places (2.166) always gives the same result as correctly rounding it to 3 decimal places.`,correctAnswer:!1,explanation:`13 ÷ 6 = 2.1666… Truncating at 3 d.p. gives 2.166, but the correctly rounded answer is 2.167, because the 4th digit (6) rounds the 3rd digit up.`},{id:`fin-rnd-7`,type:`mcq`,prompt:`What is 13 ÷ 6 correct to 3 decimal places?`,choices:[{id:`a`,label:`2.166`},{id:`b`,label:`2.167`},{id:`c`,label:`2.16`},{id:`d`,label:`2.17`}],correctChoiceId:`b`,explanation:`13 ÷ 6 = 2.1666… The 4th decimal digit, 6, rounds the 3rd digit up from 6 to 7: 2.167.`,misconceptions:{a:`This truncates instead of checking the next digit and rounding.`,c:`This only shows 2 decimal places.`,d:`This rounds to 2 decimal places instead of 3.`}},{id:`fin-rnd-8`,type:`numeric`,prompt:`Work out the exact value of 8.3251 − 2.1749, then round your answer to 2 decimal places.`,correctValue:6.15,explanation:`8.3251 − 2.1749 = 6.1502, which rounds to 6.15.`},{id:`fin-rnd-9`,type:`mcq`,prompt:`A student rounds 8.3251 to 8.33 and 2.1749 to 2.17 first, then subtracts to get 6.16. Why is this considered incorrect as ‘the answer correct to 2 d.p.’?`,choices:[{id:`a`,label:`It isn't incorrect — both methods always agree`},{id:`b`,label:`Rounding the numbers before subtracting can shift the final digit away from the true rounded answer`},{id:`c`,label:`You should always round up when subtracting`},{id:`d`,label:`6.16 is actually the exact value`}],correctChoiceId:`b`,explanation:`The exact difference is 6.1502, which rounds to 6.15. Rounding each number first (8.33 − 2.17 = 6.16) gives a different, incorrect answer — which is exactly why you should round only the final answer.`},{id:`fin-rnd-10`,type:`mcq`,prompt:`Which of these numbers rounds to 6.28, correct to 2 decimal places?`,choices:[{id:`a`,label:`6.273`},{id:`b`,label:`6.276`},{id:`c`,label:`6.285`},{id:`d`,label:`6.29`}],correctChoiceId:`b`,explanation:`6.276 lies between 6.275 and 6.285, so it rounds to 6.28. 6.273 rounds to 6.27, and 6.285 rounds up to 6.29 (it sits exactly on that boundary).`,misconceptions:{a:`6.273 is below 6.275, so it rounds down to 6.27 instead.`,c:`6.285 sits exactly on the next boundary and rounds up to 6.29.`,d:`6.29 is already outside the range that rounds to 6.28.`}}]},uh={"powers-of-ten":ah,rounding:oh},dh={"powers-of-ten":sh,rounding:ch},fh={amber:{bg:`bg-(--color-amber-100)`,bgLight:`bg-(--color-amber-50)`,border:`border-(--color-amber-500)`,text:`text-(--color-amber-700)`,solid:`bg-(--color-amber-500)`,solidHover:`hover:bg-(--color-amber-600)`,ring:`ring-(--color-amber-500)`,gradient:`from-(--color-amber-300) to-(--color-amber-500)`},teal:{bg:`bg-(--color-teal-100)`,bgLight:`bg-(--color-teal-50)`,border:`border-(--color-teal-500)`,text:`text-(--color-teal-700)`,solid:`bg-(--color-teal-500)`,solidHover:`hover:bg-(--color-teal-600)`,ring:`ring-(--color-teal-500)`,gradient:`from-(--color-teal-300) to-(--color-teal-500)`},moss:{bg:`bg-(--color-moss-50)`,bgLight:`bg-(--color-moss-50)`,border:`border-(--color-moss-500)`,text:`text-(--color-moss-700)`,solid:`bg-(--color-moss-500)`,solidHover:`hover:bg-(--color-moss-600)`,ring:`ring-(--color-moss-500)`,gradient:`from-(--color-moss-300) to-(--color-moss-500)`},slate:{bg:`bg-(--color-paper-dim)`,bgLight:`bg-(--color-paper)`,border:`border-(--color-slate-500)`,text:`text-(--color-slate-700)`,solid:`bg-(--color-slate-700)`,solidHover:`hover:bg-(--color-slate-900)`,ring:`ring-(--color-slate-500)`,gradient:`from-(--color-slate-500) to-(--color-slate-900)`}};function ph(e){return fh[e]}function $({children:e,delay:t=0}){return Ep()?(0,J.jsx)(`div`,{children:e}):(0,J.jsx)(Tp.div,{initial:{opacity:0,y:16},whileInView:{opacity:1,y:0},viewport:{once:!0,margin:`-40px`},transition:{duration:.4,delay:t,ease:`easeOut`},children:e})}function mh(){let{state:e,overallPercent:t}=Jm

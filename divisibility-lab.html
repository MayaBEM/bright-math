/* ============ confetti ============ */
function confetti(){
  if(reduced()) return;
  var cv = document.createElement("canvas");
  cv.className = "confetti";
  document.body.appendChild(cv);
  var w = cv.width = window.innerWidth, h = cv.height = window.innerHeight;
  var ctx = cv.getContext("2d");
  var cols = ["#E5A82E","#F4C3CB","#2E8355","#FBE7C4","#C0392B"];
  var bits = [];
  for(var i=0;i<90;i++){
    bits.push({x:Math.random()*w, y:-20-Math.random()*h*0.4, r:4+Math.random()*5,
      vy:2+Math.random()*3, vx:-1+Math.random()*2, a:Math.random()*Math.PI,
      va:-0.15+Math.random()*0.3, c:cols[i%cols.length]});
  }
  var t0 = Date.now();
  (function frame(){
    ctx.clearRect(0,0,w,h);
    bits.forEach(function(b){
      b.x += b.vx; b.y += b.vy; b.a += b.va;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
      ctx.fillStyle = b.c; ctx.fillRect(-b.r/2,-b.r/2,b.r,b.r*1.5); ctx.restore();
    });
    if(Date.now()-t0 < 2600) requestAnimationFrame(frame);
    else cv.remove();
  })();
}

/* ============ rules reference + live checker ============ */
var RULES = [
  {d:2,  test:"The last digit is even (0, 2, 4, 6 or 8).",            yes:"4 738", no:"4 737"},
  {d:3,  test:"The digit sum is a multiple of 3.",                     yes:"5 214", no:"5 215"},
  {d:4,  test:"The last two digits form a multiple of 4.",             yes:"7 316", no:"7 318"},
  {d:5,  test:"The last digit is 0 or 5.",                             yes:"2 485", no:"2 483"},
  {d:6,  test:"It passes the 2 test and the 3 test.",                  yes:"4 152", no:"4 154"},
  {d:8,  test:"The last three digits form a multiple of 8.",           yes:"15 240", no:"15 244"},
  {d:9,  test:"The digit sum is a multiple of 9.",                     yes:"6 831", no:"6 832"},
  {d:10, test:"The last digit is 0.",                                  yes:"4 970", no:"4 975"},
  {d:11, test:"Odd-position total − even-position total is a multiple of 11.", yes:"9 174", no:"9 175"}
];

function digitsOf(str){
  var d = String(str).replace(/[^0-9]/g,"");
  return d;
}
function checkNumber(str){
  var d = digitsOf(str);
  if(!d) return null;
  var sum = 0, odd = 0, even = 0;
  for(var i=0;i<d.length;i++){
    var v = +d.charAt(i);
    sum += v;
    // position counted from the right, 1-based
    var posFromRight = d.length - i;
    if(posFromRight % 2 === 1) odd += v; else even += v;
  }
  var last  = +d.charAt(d.length-1);
  var last2 = +d.slice(-2);
  var last3 = +d.slice(-3);
  var diff  = odd - even;
  var by2  = last % 2 === 0;
  var by3  = sum % 3 === 0;
  var by4  = last2 % 4 === 0;
  var by5  = last === 0 || last === 5;
  var by8  = last3 % 8 === 0;
  var by9  = sum % 9 === 0;
  var by10 = last === 0;
  var by11 = diff % 11 === 0;
  return {
    digits:d, sum:sum, odd:odd, even:even, diff:diff,
    rows:[
      {d:2,  ok:by2,  why:"last digit "+last+(by2?" is even":" is odd")},
      {d:3,  ok:by3,  why:"digit sum "+sum+(by3?" is a multiple of 3":" is not a multiple of 3")},
      {d:4,  ok:by4,  why:"last two digits "+d.slice(-2)+(by4?" ÷ 4 = "+(last2/4):" ÷ 4 is not whole")},
      {d:5,  ok:by5,  why:"last digit "+last+(by5?" is 0 or 5":" is not 0 or 5")},
      {d:6,  ok:by2&&by3, why:(by2&&by3)?"passes both the 2 and 3 tests":"fails the "+(!by2?"2":"3")+" test"},
      {d:8,  ok:by8,  why:"last three digits "+d.slice(-3)+(by8?" ÷ 8 = "+(last3/8):" ÷ 8 is not whole")},
      {d:9,  ok:by9,  why:"digit sum "+sum+(by9?" is a multiple of 9":" is not a multiple of 9")},
      {d:10, ok:by10, why:by10?"it ends in 0":"it does not end in 0"},
      {d:11, ok:by11, why:odd+" − "+even+" = "+(diff<0?"−"+Math.abs(diff):diff)+(by11?", a multiple of 11":", not a multiple of 11")}
    ]
  };
}

function paintChecker(){
  var box = document.getElementById("chkout");
  var inp = document.getElementById("chkin");
  if(!box || !inp) return;
  var res = checkNumber(inp.value);
  if(!res){
    box.innerHTML = '<p class="empty" style="margin:0">Type a whole number above and every test runs at once.</p>';
    return;
  }
  var pretty = res.digits.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  var chips = res.rows.map(function(r){
    return '<div class="chip '+(r.ok?"y":"n")+'">'
      + '<span class="dv">÷'+r.d+'</span>'
      + '<span class="vd">'+(r.ok?"✓ yes":"✗ no")+'</span>'
      + '<span class="wy">'+r.why+'</span></div>';
  }).join("");
  var pass = res.rows.filter(function(r){ return r.ok; }).map(function(r){ return r.d; });
  box.innerHTML = '<p class="chksum"><b>'+pretty+'</b> is divisible by '
    + (pass.length ? '<b>'+pass.join(", ")+'</b>' : '<b>none</b> of these')
    + '.</p><div class="chips">'+chips+'</div>';
}

function renderRules(){
  view = "rules"; syncChrome();

  var cards = RULES.map(function(r){
    return '<div class="rule rise">'
      + '<div class="rd">÷'+r.d+'</div>'
      + '<div class="rt">'+r.test+'</div>'
      + '<div class="rx"><span class="y">'+r.yes+' ✓</span><span class="n">'+r.no+' ✗</span></div>'
      + '</div>';
  }).join("");

  app.innerHTML = '<div class="wrap view">'
   + '<div class="rules-head">'
     + '<p class="eyebrow gold">Stage 7 · 1.5</p>'
     + '<h2 class="dash-h">The nine tests</h2>'
     + '<p class="dash-sub">Every test here answers the same question — <i>does this number divide exactly?</i> — without doing the division. Learn the nine, then try them on any number you like.</p>'
   + '</div>'

   + '<h3 class="dash-sec">Try any number <small>type and every test runs at once</small></h3>'
   + '<div class="checker rise">'
     + '<label for="chkin">Your number</label>'
     + '<input id="chkin" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="5184" maxlength="12">'
     + '<div class="quick">'
       + ['2736','8424','5130','1000','7650'].map(function(v){
           return '<button class="qn" data-try="'+v+'">'+v.replace(/\B(?=(\d{3})+(?!\d))/g," ")+'</button>';
         }).join("")
     + '</div>'
     + '<div id="chkout"></div>'
   + '</div>'

   + '<h3 class="dash-sec">The rules <small>example that works · example that fails</small></h3>'
   + '<div class="rules">'+cards+'</div>'

   + '<h3 class="dash-sec">Two traps to avoid</h3>'
   + '<div class="traps">'
     + '<div class="trap rise"><b>Combining only works with no shared factor</b>'
       + '<p>2 and 3 share nothing, so passing both means passing 6 ✓. But 2 and 4 <i>do</i> share a factor — 12 passes both and is still not a multiple of 8.</p></div>'
     + '<div class="trap rise"><b>9 implies 3, but 3 never implies 9</b>'
       + '<p>Every multiple of 9 is a multiple of 3. The reverse fails: 12 has digit sum 3, so it passes the 3 test and fails the 9 test.</p></div>'
   + '</div>'

   + '<div class="cta-row" style="margin-bottom:34px">'
     + '<button class="btn-primary" data-nav-go="practice">Start the 30 questions</button>'
     + '<button class="btn-ghost" data-nav-go="home">Back to home</button>'
   + '</div>'
   + '<footer class="site-foot"><span>Bright EngMath · Stage 7 · 1.5 Tests for divisibility</span><span>Tests for 2, 3, 4, 5, 6, 8, 9, 10 and 11.</span></footer>'
   + '</div>';

  var inp = document.getElementById("chkin");
  inp.addEventListener("input", paintChecker);
  app.querySelectorAll("[data-try]").forEach(function(b){
    b.onclick = function(){ inp.value = b.dataset.try; paintChecker(); inp.focus(); };
  });
  paintChecker();
  stagger();
  window.scrollTo(0,0);
}

/* ============ navigation ============ */
elPrev.onclick = function(){ if(state.idx>0){ state.idx--; save(); renderQuestion(); } };
elNext.onclick = function(){
  if(state.idx < Q.length-1){ state.idx++; save(); renderQuestion(); }
  else { spend(); renderResults(); }
};
elCheck.onclick = function(){ checkQuestion(state.idx); };

document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-nav],[data-nav-go]") : null;
  if(!b) return;
  var to = b.dataset.nav || b.dataset.navGo;
  if(view === "practice") spend();
  if(to === "home") renderHome();
  else if(to === "rules") renderRules();
  else if(to === "dash") renderDash();
  else if(to === "practice") renderQuestion();
});

document.addEventListener("keydown", function(e){
  if(view !== "practice") return;
  var tag = (e.target.tagName||"").toLowerCase();
  if(tag === "input") return;
  if(e.key === "ArrowRight"){ elNext.click(); }
  if(e.key === "ArrowLeft" && !elPrev.disabled){ elPrev.click(); }
});

/* pause the clock when the tab is hidden */
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ if(view === "practice") spend(); }
  else { qStart = Date.now(); }
});

/* ============ text size (exam view) ============ */
(function(){
  var STEPS = [1, 1.12, 1.26, 1.42];
  var i = 1;
  try{ var v = parseInt(localStorage.getItem("divisibility-qsize"),10); if(v>=0 && v<STEPS.length) i = v; }catch(e){}
  var minus = document.getElementById("tminus"), plus = document.getElementById("tplus");
  function apply(){
    document.documentElement.style.setProperty("--qs", STEPS[i]);
    minus.disabled = (i === 0);
    plus.disabled = (i === STEPS.length-1);
    try{ localStorage.setItem("divisibility-qsize", i); }catch(e){}
  }
  minus.onclick = function(){ if(i>0){ i--; apply(); } };
  plus.onclick  = function(){ if(i<STEPS.length-1){ i++; apply(); } };
  apply();
})();

/* ============ theme ============ */
(function(){
  var btn = document.getElementById("themebtn");
  var root = document.documentElement;
  var stored = null;
  try{ stored = localStorage.getItem("divisibility-theme"); }catch(e){}
  if(stored) root.setAttribute("data-theme", stored);
  function isDark(){
    return root.getAttribute("data-theme") === "dark"
      || (!root.getAttribute("data-theme") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function label(){
    btn.textContent = isDark() ? "☀" : "☽";
    btn.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode");
  }
  label();
  btn.onclick = function(){
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("divisibility-theme", next); }catch(e){}
    label();
  };
})();

/* ============ boot ============ */
load();
paintStreak();
renderHome();

})();
</script>

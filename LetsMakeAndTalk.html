:root{
  --ink:#4A2C1D;--ink2:#7A5440;--cream:#FFF6E3;--paper:#FFFDF7;--tile:#FFF1D6;--tileLine:#F0DDB4;
  --tomato:#E5483A;--tomatoD:#B92F28;--butter:#FFD45C;--butterD:#E9B52C;--teal:#2E9C8F;--tealD:#1F776D;--green:#4FA83A;--greenD:#3A7F2B;
  --wood:#E9C58B;--woodD:#C98F4E;--sky:#7CC4E8;--bad:#C8412F;--good:#2E7D32;
  --accent:#E5483A;--tint:#FFE3DC;--fs:clamp(16px,.55vw + 10px,22px);
  --r:18px;--shadow:0 3px 0 rgba(74,44,29,.18),0 10px 24px rgba(74,44,29,.12);
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html.big{--fs:clamp(18px,.7vw + 11px,26px)}
body{margin:0;font-family:'Andika','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--tile);
  background-image:linear-gradient(var(--tileLine) 2px,transparent 2px),linear-gradient(90deg,var(--tileLine) 2px,transparent 2px);background-size:96px 48px;line-height:1.35;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,transparent 0 0),radial-gradient(ellipse at 50% 0,rgba(255,255,255,.55),transparent 60%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:4px solid #1D6FB8;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{display:block;flex:none;overflow:visible}
svg.ui{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;min-width:0}

/* ---------- awning header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:4px solid var(--ink);box-shadow:0 6px 0 var(--accent)}
.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;margin-top:6px;background:radial-gradient(circle at 18px 0,var(--accent) 17px,transparent 18px) 0 0/36px 18px repeat-x;filter:drop-shadow(0 2px 0 var(--ink));pointer-events:none}
.top-in{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:64px}
.top .grow{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;line-height:1;white-space:nowrap}
.brand b{color:var(--tomato)}.brand i{font-style:normal;color:var(--teal)}
.brand svg{width:34px;height:34px}
.ktitle{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0}
.ktitle span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:inline-flex;background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.lvl button{border:0;background:#fff;padding:.35rem .8rem;font-weight:700;min-height:44px;min-width:46px}
.lvl button[aria-pressed=true]{background:var(--ink);color:#fff}
.lvl button+button{border-left:3px solid var(--ink)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;min-height:46px;padding:0 12px;border:3px solid var(--ink);background:#fff;border-radius:14px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.iconbtn[aria-pressed=true]{background:var(--butter)}
.steps{display:flex;gap:8px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stepb{flex:1 1 0;min-width:10.5rem;display:flex;align-items:center;gap:10px;padding:.2rem .8rem .2rem .35rem;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;text-align:left;min-height:44px;white-space:nowrap}
.stepb .n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--tint);border:3px solid var(--ink);flex:none;font-size:1rem}
.stepb[aria-current=step]{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--ink)}
.stepb[aria-current=step] .n{background:#fff;color:var(--ink)}
.stepb.done .n{background:var(--good);color:#fff}
.stepb.done .n svg{width:1em;height:1em}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:56px;padding:.55rem 1.3rem;border-radius:16px;border:3px solid var(--ink);background:#fff;font-weight:700;font-size:1.1rem;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--tomato);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.gold{background:var(--butter)}
.btn.sm{min-height:46px;font-size:1rem;padding:.3rem .9rem}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--ink)}
.btn svg.ui{width:1.4em;height:1.4em}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:1rem 1.2rem}
.h1{font-size:clamp(2rem,4.4vw,3.6rem);line-height:1.02;margin:0;font-weight:700}
.h2{font-size:1.5rem;margin:0 0 .5rem}
.muted{color:var(--ink2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.2rem .7rem;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-weight:700;font-size:.9rem}
.stars{display:inline-flex;gap:2px}.stars svg{width:1.3rem;height:1.3rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:14px;z-index:60;font-weight:700;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .35s cubic-bezier(.2,.8,.3,1.4)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,212,92,.9),0 3px 0 rgba(74,44,29,.2)}}
html.reduce *,html.reduce *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- home ---------- */
.home{max-width:1240px;margin:0 auto;padding:34px 20px 20px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:26px}
.hero .h1 em{font-style:normal;color:var(--tomato);text-shadow:3px 3px 0 var(--butter)}
.hero p{font-size:1.25rem;margin:.8rem 0 1rem;max-width:34rem}
.levels{display:grid;gap:10px}
.levelc{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:left;padding:.7rem 1rem;border:3px solid var(--ink);border-radius:16px;background:#fff;min-height:64px}
.levelc .big{grid-row:span 2;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--butter);border:3px solid var(--ink);font-weight:700;font-size:1.3rem}
.levelc b{font-size:1.1rem}.levelc small{font-size:.95rem;color:var(--ink2)}
.levelc[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:0 5px 0 var(--tomato)}
.levelc[aria-pressed=true] small{color:#FFE3B0}
.levelc[aria-pressed=true] .big{background:var(--butter);color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kcard{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);transition:transform .12s}
.kcard:hover{transform:translateY(-3px)}
.kcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.kcard .pic{background:var(--tint);border-bottom:3px solid var(--ink);padding:14px 0 8px;display:grid;place-items:center;position:relative}
.kcard .pic svg{width:min(62%,220px);height:auto;aspect-ratio:1;overflow:visible}
.kcard .info{padding:.7rem 1rem .9rem}
.kcard h3{margin:0;font-size:1.45rem}
.kcard .tag{color:var(--ink2);font-size:1rem}
.kcard .ribbon{position:absolute;left:-6px;top:12px;background:var(--tomato);color:#fff;font-weight:700;padding:.2rem 1rem .2rem .9rem;border:3px solid var(--ink);border-left:0;border-radius:0 12px 12px 0;font-size:.95rem;z-index:2}
.kcard .num{position:absolute;right:10px;top:8px;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);font-weight:700}
.kcard .prog{display:flex;gap:5px;margin-top:.5rem;align-items:center}
.kcard .prog i{width:1.1rem;height:.55rem;border-radius:6px;border:2px solid var(--ink);background:#fff}
.kcard .prog i.on{background:var(--good)}
.kcard .badge{position:absolute;right:10px;bottom:10px;width:56px;height:56px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.foot{padding:16px;text-align:center;color:var(--ink2);font-size:.95rem}
.foot b{color:var(--tomato)}
.profile{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- word studio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:16px;padding:14px 18px 22px;max-width:1500px;margin:0 auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:.4rem 1rem;min-height:48px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:700}
.tab[aria-selected=true]{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--ink)}
.tab small{opacity:.8;margin-left:4px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:12px}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:.6rem .4rem .5rem;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);min-height:9.5rem;justify-content:center}
.wcard .ic{width:5.2rem;height:5.2rem}
.wcard span{font-weight:700;font-size:1.15rem;text-align:center;line-height:1.1}
.wcard[aria-pressed=true]{background:var(--butter);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.wcard .tk{position:absolute;right:6px;top:6px;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;border:2px solid var(--ink)}
.wcard .tk svg{width:.9rem;height:.9rem;stroke-width:3.4}
.wcard.txt{min-height:7rem}.wcard.txt span{font-size:1.45rem}
.detail{position:sticky;top:150px;align-self:start;text-align:center;padding:1.1rem}
.detail .ic{width:min(46vw,13rem);height:min(46vw,13rem);margin:0 auto .3rem}
.detail .w{font-size:2.8rem;font-weight:700;line-height:1.05}
.detail .eg{font-size:1.4rem;margin:.6rem 0 1rem;min-height:3.8rem}
.gamebar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.prog2{font-weight:700;margin:6px 0 12px}
.game{max-width:1100px;margin:0 auto;padding:14px 18px 24px;text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:16px 0}
.opt{width:9.5rem;min-height:9.5rem;padding:.5rem;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:1.1rem}
.opt .ic{width:6rem;height:6rem}
.opt.wide{width:auto;min-width:12rem;min-height:4.5rem;padding:.6rem 1.2rem;font-size:1.3rem}
.opt.good{background:#D9F2D3;border-color:var(--good)}
.opt.bad{background:#FADBD4;border-color:var(--bad)}
.opt .mk{font-size:.9rem}
.opt.q{background:var(--butter);font-size:3.4rem}
.fb{min-height:3.2rem;font-size:1.3rem;font-weight:700}

/* ---------- make it ---------- */
.make{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr);gap:14px 18px;padding:30px 18px 14px;height:calc(100dvh - var(--hdr,150px));min-height:520px;max-width:1700px;margin:0 auto}
.bwrap{grid-column:1/-1;display:flex;gap:14px;align-items:stretch}
.bubble{position:relative;isolation:isolate;flex:1;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:.55rem 1.3rem .65rem;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;justify-content:center;gap:.35rem;min-height:0}
.brow{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bubble::after{content:"";position:absolute;z-index:-1;left:12%;bottom:-24px;width:34px;height:34px;background:#fff;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg);border-radius:0 0 8px 0}
.say{font-size:clamp(1.4rem,2.2vw,2.5rem);font-weight:700;line-height:1.2}
.say mark{background:linear-gradient(transparent 62%,var(--butter) 62%);color:inherit;padding:0 .1em}
.say .slot{display:inline-block;min-width:4.5rem;border-bottom:4px dashed var(--ink2);text-align:center}
.say .done{color:var(--greenD)}
.say-sub{font-size:.95rem;color:var(--ink2);font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{display:inline-flex;align-items:center;gap:6px;padding:.15rem .7rem;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-size:.9rem}
.status.on{background:#D9F2D3;border-color:var(--good);color:var(--greenD)}
.bctl{display:flex;gap:10px;flex-wrap:wrap}
.bctl .btn{min-height:48px}
.heard{font-size:1rem;font-weight:700;color:var(--ink2)}
.stageBox{position:relative;min-height:0;background:var(--wood);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);overflow:hidden;display:grid;place-items:center;
  background-image:repeating-linear-gradient(0deg,rgba(201,143,78,.28) 0 3px,transparent 3px 34px)}
.stageBox>svg.scene{position:absolute;left:3%;top:5%;width:94%;height:92%;overflow:visible}
.stageBox.over{outline:6px dashed var(--tomato);outline-offset:-10px}
.prog-top{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:5px;z-index:2}
.prog-top i{flex:1;max-width:2.8rem;height:2.1rem;border-radius:10px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;opacity:.9}
.prog-top i .ic{width:1.5rem;height:1.5rem}
.prog-top i.q{border-style:dashed;background:#fff8ea}.prog-top i.q b{font-size:1.1rem;line-height:1;color:var(--ink2)}
.prog-top i.on{background:#D9F2D3;border-color:var(--good)}.prog-top i.cur{background:var(--butter);box-shadow:0 0 0 3px var(--butterD)}
.make .stageBox>svg.scene{top:11%;height:87%}
.trayscroll .tray.many{grid-template-columns:repeat(auto-fill,minmax(4.9rem,1fr));gap:7px}.trayscroll .tray.many .tile{min-height:4.6rem;padding:.2rem .15rem;border-radius:16px;box-shadow:0 4px 0 var(--ink);gap:2px}.trayscroll .tray.many .tile .ic{width:2.6rem;height:2.6rem}.trayscroll .tray.many .tile span{font-size:.8rem;line-height:1.05;letter-spacing:-.2px}
.trayscroll{overflow:auto;min-height:0;padding:0 6px 12px}.trayscroll .tray{overflow:visible;padding:0 0 6px}.trayscroll .trayh{margin:2px 0 5px;font-size:.98rem}
.okmark{display:inline-grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:#D9F2D3;border:3px solid var(--good)}.okmark .ic{width:1.5rem;height:1.5rem}
.held{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:.3rem .8rem .3rem .4rem;font-weight:700;z-index:2;box-shadow:0 3px 0 var(--ink)}
.held .ic{width:3rem;height:3rem}
.restart{position:absolute;right:12px;bottom:12px;z-index:2}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr));gap:12px;align-content:start;overflow:auto;padding:4px 6px 12px;min-height:0}
.tray.few{grid-template-columns:repeat(2,minmax(0,1fr));align-content:center}
.tray.few .tile{min-height:9.6rem}.tray.few .tile .ic{width:6rem;height:6rem}.tray.few .tile span{font-size:1.3rem}
.tray.many{grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:8px}
.tray.many .tile{min-height:6.5rem;padding:.25rem .2rem}.tray.many .tile .ic{width:3.3rem;height:3.3rem}.tray.many .tile span{font-size:.95rem}
.trayh{font-weight:700;font-size:1.05rem;margin:0 0 6px;color:var(--ink2);grid-column:1/-1}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:9.6rem;padding:.5rem .3rem;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tile .ic{width:5.8rem;height:5.8rem;pointer-events:none}
.tile span{font-weight:700;font-size:1.15rem;text-align:center;line-height:1.1;pointer-events:none}
.tile.sel{background:var(--butter);transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile.used{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.tile.hint{outline:5px solid var(--butterD);outline-offset:2px;animation:pulse 1.4s infinite}
.tile.dragging{opacity:.35}
.ghost{position:fixed;z-index:80;pointer-events:none;width:7rem;height:7rem;transform:translate(-50%,-60%) rotate(-6deg);filter:drop-shadow(0 12px 10px rgba(0,0,0,.3))}
.ghost svg{width:100%;height:100%}
.done-panel{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#FFFDF7;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);z-index:5;text-align:center;padding:12px 16px}
.done-panel h2{font-size:1.6rem;margin:0}
.scene-final{height:100%}

/* ---------- describe ---------- */
.describe{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;padding:14px 18px 24px;max-width:1500px;margin:0 auto;align-items:start}
.describe .stageBox{aspect-ratio:1;max-height:calc(100dvh - 190px);width:100%}
.prompt{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:.8rem 1rem;margin-bottom:12px;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.prompt.act{background:#FFF8DA;box-shadow:0 4px 0 var(--ink),0 0 0 5px var(--butter)}
.prompt.ok{background:#E8F6E3}
.prompt .say{font-size:clamp(1.3rem,2vw,2.1rem)}
.prompt .slot{cursor:pointer;min-width:5rem;padding:0 .3rem;background:rgba(255,212,92,.35);border-radius:8px}
.prompt .slot.fill{border-bottom-color:transparent;background:var(--butter)}
.pctl{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.wchip{display:flex;align-items:center;gap:8px;padding:.3rem 1rem .3rem .4rem;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:1.2rem;min-height:56px;box-shadow:0 3px 0 var(--ink)}
.wchip .ic{width:2.6rem;height:2.6rem}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:.8rem 1rem;border:3px dashed var(--ink);border-radius:20px;background:#fff}
.rec .dot{width:1rem;height:1rem;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
.note{font-size:1rem;color:var(--ink2)}

/* ---------- role-play ---------- */
.rp{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:18px;padding:14px 18px 24px;max-width:1500px;margin:0 auto;align-items:start}
.banner{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.role{padding:.4rem 1rem;border-radius:14px;border:3px solid var(--ink);font-weight:700;font-size:1.15rem;background:#fff}
.role.you{background:var(--butter)}
.ticket{position:relative;background:#FFFEF4;border:3px solid var(--ink);padding:1rem 1.2rem 1.4rem;box-shadow:var(--shadow);margin-bottom:14px;
  --zz:radial-gradient(circle at 10px 100%,transparent 9px,#000 10px);-webkit-mask:var(--zz) bottom/20px 100% repeat-x;}
.ticket{border-radius:12px 12px 0 0}
.ticket h3{margin:0 0 .4rem;font-size:1.3rem;display:flex;justify-content:space-between;gap:8px}
.tlist{display:flex;flex-wrap:wrap;gap:10px}
.titem{display:flex;align-items:center;gap:6px;padding:.2rem .8rem .2rem .3rem;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:700;font-size:1.15rem}
.titem .ic{width:3.2rem;height:3.2rem}
.titem.no{background:#FADBD4;text-decoration:line-through;text-decoration-thickness:3px}
.titem.no b{font-size:.95rem;text-decoration:none;display:inline-block;margin-right:2px}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{max-width:92%;padding:.5rem 1rem;border:3px solid var(--ink);border-radius:18px;background:#fff;font-size:1.05rem;opacity:.7}
.line.c{align-self:flex-start;border-bottom-left-radius:4px}.line.k{align-self:flex-end;border-bottom-right-radius:4px;background:#FFF1D6}
.dlg .cur{max-width:100%;padding:1rem 1.2rem;border:4px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 6px 0 var(--ink)}
.dlg .cur .who{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:.3rem;flex-wrap:wrap}
.dlg .cur .say{font-size:clamp(1.5rem,2.4vw,2.5rem)}
.dlg .cur .row{margin-top:.8rem}
.mini{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.buildtray{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr));gap:8px}
.buildtray .tile{min-height:6.9rem;padding:.3rem .2rem}.buildtray .tile .ic{width:3.6rem;height:3.6rem}.buildtray .tile span{font-size:.95rem}
.minipan{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;align-items:start}
.minipan .stageBox{aspect-ratio:1;max-height:48vh;width:100%}
.picks{display:flex;gap:6px;flex-wrap:wrap;min-height:3.4rem;margin:8px 0}
.pk{display:flex;align-items:center;gap:4px;padding:.1rem .6rem .1rem .2rem;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:700}
.pk .ic{width:2.4rem;height:2.4rem}
.pk b{margin-left:4px;opacity:.6}

/* ---------- quick check ---------- */
.qc{max-width:980px;margin:0 auto;padding:16px 18px 30px}
.qprog{display:flex;gap:6px;margin-bottom:14px}
.qprog i{flex:1;height:1rem;border-radius:8px;border:3px solid var(--ink);background:#fff}
.qprog i.ok{background:var(--good)}.qprog i.no{background:var(--bad)}.qprog i.cur{background:var(--butter)}
.qcard{padding:1.2rem 1.4rem;text-align:center}
.qtext{font-size:clamp(1.5rem,2.6vw,2.4rem);font-weight:700;margin:.2rem 0 .8rem}
.qimg{width:9rem;height:9rem;margin:0 auto}
.fbox{margin-top:12px;padding:.9rem 1.1rem;border:3px solid var(--ink);border-radius:18px;text-align:left;font-size:1.2rem;display:flex;gap:12px;align-items:flex-start}
.fbox.good{background:#DDF3D6}.fbox.bad{background:#FADBD4}
.fbox svg.ui{width:2rem;height:2rem;stroke-width:3.4;flex:none}
.ocards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0}
.ocard{display:flex;align-items:center;gap:10px;padding:.4rem 1rem .4rem .5rem;min-height:4.4rem;border:3px solid var(--ink);border-radius:18px;background:#fff;font-weight:700;font-size:1.2rem;box-shadow:0 4px 0 var(--ink)}
.ocard .ic{width:3rem;height:3rem}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}

  /** the sandwich (side view / cut-face). Returns {svg, topY} */
  function stack(S, x0, x1, B, withDrop, vk) {
    const d = S.done || {}, toasted = !!d.toast, press = !!d.press, k = (press ? .86 : 1) * vk, o = [];
    let y = B;
    o.push(bread(x0, x1, y, Math.round(34 * vk), toasted)); y -= Math.round(34 * vk);
    if (d.spread) { o.push(LAY.butter.draw(x0, x1, y + 1, LAY.butter.h * vk)); y -= 5 * vk; }
    (S.picks || []).forEach((id, i) => {
      const L = LAY[id] || LAY.cheese, h = L.h * k, g = L.draw(x0, x1, y + 2, h, i);
      o.push(withDrop && i === S.lastPick ? `<g class="drop">${g}</g>` : g); y -= h - 3;
    });
    return { svg: o.join(''), topY: y };
  }

  /** two diagonal halves: cut faces towards us with a triangular top */
  function halves(S, B, o) {
    const Wc = 140, cxs = [106, 294], vk = 1.5;
    cxs.forEach((cx, hi) => {
      const x0 = cx - Wc / 2, x1 = cx + Wc / 2, st = stack({ ...S, lastPick: -1 }, x0, x1, B, false, vk);
      const topH = Math.round(42 * vk * .9), yb = st.topY + 3, dome = yb - topH;
      const rot = hi ? 2.5 : -2.5;
      o.push(`<g transform="rotate(${rot} ${cx} ${B})">`);
      // triangular top face behind the dome
      o.push(`<path d="M${f1(x0 + 2)} ${f1(yb - 22)}L${f1(cx)} ${f1(dome - 46)}L${f1(x1 - 2)} ${f1(yb - 22)}Z" fill="#CD8A3C" ${O}/>`);
      o.push(`<path d="M${f1(x0 + 22)} ${f1(yb - 34)}L${f1(cx - 4)} ${f1(dome - 32)}" stroke="#F3CE86" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/>`);
      o.push(st.svg);
      o.push(topBread(x0, x1, yb, topH, !!(S.done || {}).toast));
      o.push('</g>');
    });
  }

  function scene(S) {
    const d = S.done || {}, last = S.last, o = [];
    const plated = !!(S.final || S.mini || d.serve);
    const cutStage = plated || d.cut;
    const showBoard = !plated;
    if (plated) plate(o); else board(o);

    // ----- before the bread is toasted -----
    if (!plated && !d.toast) {
      if (!d.slice) {

        if (last === 'slice') o.push(`<g class="drop">${use('sw_knife', 262, 120, 200, 12)}</g>`);
      }
      return o.join('');
    }
    // ----- the toaster -----
    if (last === 'toast' && !plated) {
      o.push(`<g class="drop">${use('sw_toaster', 200, 196, 330)}</g>`);
      return o.join('');
    }
    // ----- the sandwich -----
    if (cutStage) {
      halves(S, plated ? 318 : 304, o);
      if (!plated && last === 'cut') o.push(`<g class="drop">${use('sw_knife', 200, 120, 210, 118)}</g>`);
      return o.join('');

    const cx = 200, W = 230, x0 = cx - W / 2, x1 = cx + W / 2, B = 304, vk = 1.45;
    const st = stack(S, x0, x1, B, true, vk);
    o.push(st.svg);

    if (!d.stack) {

      o.push(`<g transform="rotate(-3 ${cx} ${f1(st.topY - 30)})">${topBread(x0 + 6, x1 - 6, st.topY - 30, Ht, true)}</g>`);

    return o.join('');
  }

    const q = QC.qs[QC.i], prog = QC.qs.map((x, i) => `<i class="${x.res === true ? 'ok' : x.res === false ? 'no' : i === QC.i ? 'cur' : ''}"></i>`).join('');
    let body = '';
    if (q.type === 'read') body = `<div class="qtext">Find the picture: <mark style="background:var(--butter)">${esc(q.target.word)}</mark></div><div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="qans" data-i="${i}" aria-label="Picture ${i + 1}">${BEM.svg(o.icon)}</button>`).join('')}</div>`;
    else if (q.type === 'name') body = `${BEM.svg(q.target.icon, 0, 'qimg')}<div class="qtext">What is this?</div><div class="opts">${q.opts.map((o, i) => `<button class="opt wide" data-act="qans" data-i="${i}">${esc(o.word)}</button>`).join('')}</div>`;
    else if (q.type === 'text') body = `${q.img ? BEM.svg(q.img, 0, 'qimg') : ''}<div class="qtext">${esc(q.q)}</div><div class="opts">${q.opts.map((o, i) => `<button class="opt wide" data-act="qans" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`;
    else body = `<div class="qtext">Put the steps in order.</div><p class="note">Tap the steps: first, next, then…</p><div class="slots">${q.seq.map((s, i) => `<div class="slotb ${i < q.next ? 'f' : ''}"><b>${i + 1}</b>${i < q.next ? esc(s.act) : ''}</div>`).join('')}</div><div class="ocards">${q.cards.filter((c) => c.i >= q.next).map((c) => `<button class="ocard" data-act="qord" data-i="${c.i}">${BEM.svg(c.icon)}${esc(c.act)}</button>`).join('')}</div>`;
    const fb = QC.fb;
    box.innerHTML = `<div class="qprog" role="img" aria-label="Question ${QC.i + 1} of 8">${prog}</div><div class="card qcard"><p class="muted" style="margin:0">Question ${QC.i + 1} of 8</p>${body}<div id="qfb" role="status" aria-live="polite">${fb ? `<div class="fbox ${fb.ok ? 'good' : 'bad'} pop">${ico(fb.ok ? 'check' : 'x')}<div><b>${fb.ok ? 'Correct!' : 'Not quite.'}</b> ${fb.html}</div></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="qnext">${QC.i === 7 ? 'See my score' : 'Next question'} ${ico('right')}</button></div>` : ''}</div></div>`;
    if (q.res !== null) { $$all('.opt', box, q); }
  }
  const $$all = (sel, box, q) => { box.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; const o = q.opts[i]; const ok = q.type === 'text' ? o.ok : o.id === q.target.id; if (ok) { b.classList.add('good'); b.insertAdjacentHTML('beforeend', '<span class="mk">✓ right answer</span>'); } else if (q.pick === i) { b.classList.add('bad'); b.insertAdjacentHTML('beforeend', '<span class="mk">✗ your answer</span>'); } }); };
  ACT.qans = (t) => {
    const q = QC.qs[QC.i]; if (q.res !== null) return; const i = +t.dataset.i, o = q.opts[i]; const ok = q.type === 'text' ? o.ok : o.id === q.target.id; q.res = ok; q.pick = i;
    const K = A.K(); QC.fb = { ok, html: q.type === 'text' ? (ok ? '' : `The answer is <b>${esc(q.answer)}</b>. `) + esc(q.why) : (ok ? `That is <b>${esc(q.target.word)}</b>.` : `The answer is <b>${esc(q.target.word)}</b>.`) };
    U.play(ok ? 'good' : 'bad'); qcRender();
  };
  ACT.qord = (t) => {
    const q = QC.qs[QC.i]; if (q.res !== null) return; const i = +t.dataset.i;
    if (i === q.next) { q.next++; U.play('pick'); if (q.next === q.seq.length) { q.res = q.errors === 0; QC.fb = { ok: q.res, html: q.res ? esc(q.seq.map((s) => s.act).join(' ')) : 'The order is: ' + esc(q.seq.map((s, k) => (k + 1) + '. ' + s.act).join(' ')) + ' ' + (q.errors ? 'You made ' + q.errors + ' mistake' + (q.errors > 1 ? 's' : '') + '.' : '') }; U.play(q.res ? 'good' : 'bad'); } qcRender(); }
    else { q.errors++; U.play('bad'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); }
  };
  ACT.qnext = () => { if (!QC || QC.done) return; const q = QC.qs[QC.i]; if (q.res === null) return; QC.fb = null; U.play('next'); if (QC.i === 7) { finish(); } else QC.i++; qcRender(); };
  function finish() {
    const K = A.K(), score = QC.qs.filter((q) => q.res).length, o = BEM.kp(); QC.done = true; QC.score = score;
    const stars = score >= 7 ? 3 : score >= 5 ? 2 : score >= 3 ? 1 : 0; QC.stars = stars;
    o.best = Math.max(o.best || 0, score); o.stars = Math.max(o.stars || 0, stars); if (score >= 5) o.badge = 1; BEM.persist(); BEM.markStep(4); U.play(score >= 5 ? 'star' : 'next');
  }
  function result(box) {
    const K = A.K(), idx = Object.values(BEM.kitchens).sort((a, b) => a.n - b.n), next = idx[(idx.findIndex((x) => x.id === K.id) + 1) % idx.length];
    const pass = QC.score >= 5;
    box.innerHTML = `<div class="card result pop"><h2 class="h1" style="font-size:2.4rem">${pass ? 'You earned the ' + esc(K.short) + ' badge!' : 'Good try!'}</h2>${pass ? `<svg class="badgebig" viewBox="0 0 100 100" aria-hidden="true">${BEM.badgeSvg(K)}</svg>` : ''}<div class="bigstars" role="img" aria-label="${QC.stars} of 3 stars">${[1, 2, 3].map((n) => U.star(n <= QC.stars)).join('')}</div>
      <p style="font-size:1.6rem;margin:.2rem 0 1rem"><b>${QC.score} of 8</b> correct</p><p class="muted" style="font-size:1.2rem">${pass ? 'You can cook and talk in the ' + esc(K.name) + '!' : 'You need 5 correct answers for the badge. Practice the words and try again.'}</p>
      <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn" data-act="qagain">${ico('redo')} Try again</button>${pass || QC.score >= 3 ? '' : `<button class="btn" data-act="step" data-v="0">Word Studio</button>`}<button class="btn pri" data-act="open" data-v="${next.id}">${esc(next.short)} Kitchen ${ico('right')}</button><button class="btn" data-act="home">${ico('home')} All kitchens</button></div></div>`;
  }
  ACT.qagain = () => { qcInit(); BEM.render(); };

  // ---------- test hooks ----------
  BEM.test = { get M() { return BEM.mkState(); }, get RP() { return RP; }, get QC() { return QC; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', BEM.boot); else BEM.boot();
})();

</script></body></html>

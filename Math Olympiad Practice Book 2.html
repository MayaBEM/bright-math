  --btn:#f6c34f; --btn-ink:#1a1405; --plate:#f8fafc; --c20:#6db5f1; --c20s:#15283c; --c24:#ff9e57; --c24s:#3a2516; --c25:#4fd0c4; --c25s:#113331; --on-set:#0f151d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111925; --grid:#1a2533; --card:#172231; --line:#2a3a4f;
  --ink:#e7edf5; --muted:#9db0c7; --soft:#1e2b3d;
  --mari:#f6c34f; --mari-soft:#3a3016; --mari-ink:#ffe6a6;
  --ok:#5cc28c; --ok-soft:#173328; --bad:#ff8a77; --bad-soft:#3b1f1b;
  --btn:#f6c34f; --btn-ink:#1a1405; --plate:#f8fafc; --c20:#6db5f1; --c20s:#15283c; --c24:#ff9e57; --c24s:#3a2516; --c25:#4fd0c4; --c25s:#113331; --on-set:#0f151d; color-scheme:dark}

*{box-sizing:border-box}
.y2020{--set:var(--c20);--set-s:var(--c20s)} .y2024{--set:var(--c24);--set-s:var(--c24s)} .y2025{--set:var(--c25);--set-s:var(--c25s)}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.6;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mari);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo{width:44px;height:44px;border-radius:10px;flex:none;display:block;background:#ff914c}
.hero{grid-template-columns:minmax(0,1fr) auto;align-items:center;max-width:none!important;column-gap:28px}
.hero .txt{display:grid;gap:10px;max-width:640px}
.hero .biglogo{width:220px;border-radius:16px;box-shadow:0 4px 0 var(--line)}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.hero .biglogo{width:160px;grid-row:1}}
.brand b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.switch{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;background:transparent;cursor:pointer;font-weight:600;font-size:15px}
.switch i{width:34px;height:20px;border-radius:999px;background:var(--soft);position:relative;flex:none;border:1px solid var(--line)}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-pressed="true"] i{background:var(--mari)}
.switch[aria-pressed="true"] i::after{transform:translateX(14px);background:#1d2b45}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}

/* home */
.hero{padding-block:36px 20px;display:grid;gap:10px;max-width:720px}
.hero h1{font-size:clamp(28px,5vw,42px)}
.hero p{margin:0;color:var(--muted);font-size:18px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:12px}
.booklet{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px 20px 18px 30px;display:grid;gap:10px;text-align:left;cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .15s,box-shadow .15s}
.booklet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;border-radius:var(--r) 0 0 var(--r);background:repeating-linear-gradient(180deg,var(--set) 0 14px,transparent 14px 20px)}
.booklet:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.booklet .k{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.booklet .yr{font-family:var(--f-display);font-size:54px;font-weight:700;line-height:1;color:var(--set)}
.booklet{border-top:6px solid var(--set)}
.booklet .sub{color:var(--muted);font-size:15px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--ok);border-radius:999px}
.booklet .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;font-weight:600}
.booklet .go{background:var(--set);color:var(--on-set);border-radius:8px;padding:4px 12px}
.booklet .bar span{background:var(--set)}
.how{margin-top:28px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px;max-width:720px}
.how h2{font-size:20px}
.how ol{margin:0;padding-left:22px;display:grid;gap:4px}

/* set view */
.sethead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-block:20px 14px;padding:14px 18px;background:var(--set-s);border:1.5px solid var(--set);border-left:10px solid var(--set);border-radius:var(--r)}
.sethead .yr{color:var(--set)}
.sethead h1{font-size:clamp(24px,4vw,32px)}
.sethead .score{margin-left:auto;font-weight:700;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--set);color:var(--on-set);border-color:var(--set)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.rail{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:10px}
.rail h3{font-size:14px;font-family:var(--f-body);font-weight:700;color:var(--muted);letter-spacing:.04em}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;display:grid;place-items:center;font-size:16px}
.chip[data-s="c"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip[data-s="w"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip[data-s="r"]{background:var(--mari-soft);border-color:var(--mari);color:var(--mari-ink)}
.chip .m{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;font-size:11px;line-height:17px;text-align:center;color:#fff}
.chip .m:empty{display:none}
.chip[data-s="c"] .m{background:var(--ok)}
.chip[data-s="w"] .m{background:var(--bad)}
.chip[data-s="r"] .m{background:var(--mari);color:#1d2b45}
.chip[aria-current="true"]{outline:3px solid var(--set);outline-offset:1px}
.legend{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid}
.legend .lc::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .lw::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .lr::before{background:var(--mari-soft);border-color:var(--mari)}

.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,28px);display:grid;gap:18px;min-width:0;grid-template-columns:minmax(0,1fr)}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--set)}
.badge{font-size:13px;font-weight:700;border:1.5px solid var(--set);border-radius:999px;padding:2px 10px;color:var(--set);background:var(--set-s)}
.sheet{border-top:6px solid var(--set)}
.qtext{font-size:clamp(18px,2.2vw,21px);font-weight:600;line-height:1.55;max-width:66ch;margin:0}
.qtext + .qtext{margin-top:-8px}
.fig{background:var(--plate);border:1.5px solid var(--line);border-radius:8px;padding:12px;justify-self:start;max-width:100%}
.fig img{display:block;max-width:100%;height:auto;max-height:340px}
.pre{background:var(--plate);color:#1d2b45;border:1.5px solid var(--line);border-radius:8px;padding:12px 16px;font-family:var(--f-mono);font-size:16px;line-height:1.5;overflow-x:auto;margin:0;justify-self:start;max-width:100%}

.vocab summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vocab summary::-webkit-details-marker{display:none}
.vocab .vt{font-size:14px;font-weight:700;color:var(--on-set);background:var(--set);border-radius:999px;padding:3px 12px}
.vocab .sr{display:none}
.vocab .vc{color:var(--muted);font-weight:500}
.vocab[open] ul{margin-top:10px}
.rail{max-height:calc(100vh - 100px);overflow-y:auto}
.rail .vocab{padding:10px 12px;margin-top:4px}
.rail .vocab h3{font-size:15px}
.rail .vocab summary{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.rail .vocab h3{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 6px;align-items:center}
.rail .vocab h3 svg{grid-row:1}
.rail .vocab .vc{grid-column:1 / -1;font-size:13px}
.rail .vocab .vt{justify-self:start}
.rail .vocab ul{flex-direction:column;gap:6px}
.rail .vocab li{display:grid;gap:0;padding:6px 10px}
.vocab{display:block;border:1.5px dashed var(--set);border-radius:8px;padding:12px 14px;background:var(--card)}
.vocab h3{font-family:var(--f-body);font-size:16px;font-weight:700;color:var(--set);display:flex;align-items:center;gap:8px}
.vocab ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.vocab li{background:var(--set-s);border-radius:8px;padding:5px 12px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;max-width:100%}
.vocab .w{font-weight:700;color:var(--ink)}
.vocab .th{color:var(--muted);font-size:15px}
.vtable{width:100%;border-collapse:collapse;background:var(--card);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.vtable th,.vtable td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable th{background:var(--set-s);color:var(--set);font-size:15px}
.vtable td.qn{white-space:nowrap;border-right:1px solid var(--line)}
.vtable .w{font-weight:700}
.vwrap{overflow-x:auto;max-width:100%}
.answer{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-top:2px dashed var(--line);padding-top:16px}
.answer label{font-weight:700}
.arow{display:flex;gap:10px;flex-wrap:wrap}
.arow input{flex:1 1 180px;min-width:0;max-width:320px;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:8px;background:var(--paper);font-variant-numeric:tabular-nums}
.arow input:focus{border-color:var(--ink);outline:none}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--btn-ink);font-size:16px}
#app .btn:not(.ghost){background:var(--set);color:var(--on-set)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:8px;max-width:760px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:8px;background:var(--card);padding:10px 12px;cursor:pointer;text-align:left;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.opt:hover{border-color:var(--ink)}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--set);background:var(--set-s)}
.opt[aria-pressed="true"] .L{background:var(--set);color:var(--on-set);border-color:var(--set)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through;cursor:not-allowed}
.opt.no .L{border-color:var(--bad)}
.opt .v{min-width:0;overflow-wrap:anywhere}
.mode{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.mode button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:15px}
.mode button[aria-pressed="true"]{background:var(--mari);color:#1d2b45}
.tabs .mode{margin-left:auto}
.fb{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 14px;font-weight:600}
.fb .ic{font-size:20px;line-height:1.3;font-weight:800;flex:none}
.fb.ok{background:var(--ok-soft);color:var(--ok);border:1.5px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad)}
.fb.ok,.fb.bad{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:.4}to{transform:none;opacity:1}}

.method{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--set-s);border:1.5px solid var(--set);border-radius:var(--r);padding:clamp(14px,2.5vw,22px)}
.mhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mhead h2{font-size:20px}
.mhead span{color:var(--muted);font-size:15px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:st;font-size:18px;line-height:1.7}
.steps > li{counter-increment:st;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border-radius:8px;padding:10px 14px}
.steps > li::before{content:attr(data-l) " " counter(st);white-space:nowrap;background:var(--set);color:var(--on-set);border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px;margin-top:4px}
.steps .ln{display:block}
.steps .ln + .ln{margin-top:4px}
.steps .ar{color:var(--set);font-weight:800;padding-inline:2px}
.mh{font-family:var(--f-body);font-size:18px;font-weight:700;color:var(--set)}
.soltitle{font-size:22px;display:flex;align-items:center;gap:10px}
.soltitle::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--set)}
.steps ul{margin:8px 0 0;padding:8px 12px 8px 30px;display:grid;gap:4px;background:var(--set-s);border-radius:6px}
.steps b{background:linear-gradient(transparent 55%,var(--mari-soft) 55%);padding:0 2px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.final{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:2px solid var(--ok);border-radius:8px;padding:10px 14px}
.final .lbl{font-weight:700;color:var(--ok)}
.final .val{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.tip{background:var(--mari-soft);border:2px dashed var(--mari);border-radius:8px;padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;color:var(--ink);font-size:18px}
.tip svg{grid-row:span 2;width:30px;height:30px;color:var(--mari-ink)}
.tip .tl{font-family:var(--f-display);font-weight:700;color:var(--mari-ink);font-size:17px}
.tip b{font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* tips + results */
.list{display:grid;gap:10px}
.tiprow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.tiprow:hover{border-color:var(--ink)}
.tiprow .n{font-family:var(--f-display);font-weight:700;background:var(--mari);color:#1d2b45;border-radius:8px;padding:2px 10px;font-variant-numeric:tabular-nums}
.result{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:grid;gap:16px;max-width:760px}
.big{font-family:var(--f-display);font-size:clamp(48px,8vw,72px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;color:var(--muted)}
.rchips{display:flex;gap:8px;flex-wrap:wrap}
.rchips .chip{width:46px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border:1.5px solid var(--bad);border-radius:8px;padding:10px 12px}

@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .chips{grid-template-columns:repeat(8,1fr)}
  .legend{grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 12px}
  .brand small{display:none}
}
@media (max-width:520px){.steps > li{grid-template-columns:minmax(0,1fr);gap:6px}.steps > li::before{justify-self:start;margin-top:0}.tip{font-size:17px}}
@media (max-width:420px){.chips{grid-template-columns:repeat(5,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- solution presenter ---------- */
.btn.big{font-size:18px;padding:12px 22px;border:2px solid var(--set);color:var(--set)}
.fb.note{background:var(--mari-soft);border:1.5px solid var(--mari);color:var(--mari-ink)}
.deck{background:var(--card);border:2px solid var(--set);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;outline:none}
.deck:fullscreen{background:var(--paper);border:0;border-radius:0;padding:0}
.deck:fullscreen .stage{flex:1;font-size:1.2em;display:grid;align-content:center}
.deck:fullscreen .v-svg,.deck:fullscreen .v-img{width:min(820px,100%)}
.dk-top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--set);color:var(--on-set);padding:10px 16px}
.dk-top h2{font-size:20px}
.dk-count{font-weight:600}
.dots{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--on-set);background:transparent;padding:0;cursor:pointer}
.dot.done{background:var(--on-set);opacity:.5}
.dot.on{background:var(--on-set);transform:scale(1.25)}
.dk-top .btn.sm{padding:5px 12px;font-size:14px;color:var(--on-set);border-color:var(--on-set);background:transparent}
.stage{padding:clamp(16px,3vw,30px);min-height:360px;overflow:hidden}
.slide{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.in-fwd{animation:slin .35s ease-out}
.in-bwd{animation:slinb .35s ease-out}
@keyframes slin{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes slinb{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
.sl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sl-n{background:var(--set-s);color:var(--set);border:1.5px solid var(--set);border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px}
.sl-head h3{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);font-weight:600}
.sl-x{margin:0;font-size:clamp(18px,2.2vw,21px);line-height:1.55;max-width:62ch}
.sl-v{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;justify-items:center;align-items:center}
.sl-v.two{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.dk-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1.5px solid var(--line);background:var(--set-s)}
.hint{color:var(--muted);font-size:14px}

/* ---------- visuals ---------- */
.ar{color:var(--set);font-weight:800}
.v-eq{display:grid;gap:10px;font-size:clamp(20px,2.6vw,26px);font-weight:500;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px 24px;text-align:center;max-width:100%;overflow-x:auto;font-variant-numeric:tabular-nums}
.v-eq b.hl{color:var(--set);font-weight:700;background:var(--mari-soft);padding:0 5px;border-radius:5px}
.v-eq s{color:var(--bad);text-decoration-thickness:2px;opacity:.8}
.v-seq{max-width:100%}
.v-seq .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.v-seq .b{min-width:54px;height:54px;padding:0 12px;display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:22px;font-weight:700}
.v-seq .b.hi{background:var(--set);color:var(--on-set);border-color:var(--set)}
.v-seq .b.q{background:var(--mari-soft);border-color:var(--mari);border-style:dashed}
.v-seq .b.x{opacity:.45;text-decoration:line-through}
.v-seq .g{display:grid;justify-items:center;line-height:1.1;min-width:22px}
.v-seq .g em{font-style:normal;font-size:14px;font-weight:700;color:var(--set)}
.v-seq .g i{font-style:normal;color:var(--muted);font-size:20px}
.v-seq .note{text-align:center;margin-top:12px;font-weight:600;font-size:19px}
.v-grid{overflow-x:auto;max-width:100%}
.v-grid table{border-collapse:collapse;font-size:clamp(16px,2vw,20px);font-variant-numeric:tabular-nums}
.v-grid td,.v-grid th{border:1.5px solid var(--line);padding:8px 14px;text-align:center;background:var(--card);white-space:nowrap}
.v-grid th{background:var(--soft);font-weight:700}
.v-grid .hi{background:var(--mari-soft);font-weight:800;box-shadow:inset 0 0 0 3px var(--mari)}
.v-grid .ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.v-grid .no{background:var(--bad-soft);color:var(--bad)}
.v-grid .col{box-shadow:inset 0 0 0 3px var(--set)}
.v-bar{display:grid;gap:14px;width:min(560px,100%)}
.v-bar .br{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;align-items:center}
.v-bar .bl{font-weight:700}
.v-bar .bs{display:flex;gap:3px}
.v-bar .seg{height:48px;display:grid;place-items:center;border-radius:6px;font-weight:600;font-size:15px;background:var(--set-s);border:2px solid var(--set);min-width:0}
.v-bar .seg.add{background:var(--mari-soft);border-color:var(--mari);border-style:dashed}
.v-bar .bn{grid-column:2;font-size:15px;color:var(--bad);font-weight:600}
.v-dots{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.v-dots .dg{display:grid;gap:8px;justify-items:center;font-weight:600}
.v-dots .dd{display:flex;flex-wrap:wrap;gap:6px;max-width:120px;justify-content:center}
.v-dots .dd i{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.v-img{margin:0;display:grid;gap:8px;justify-items:center;width:min(620px,100%)}
.v-img .plate{background:var(--plate);border:1.5px solid var(--line);border-radius:10px;padding:4px;width:100%}
.v-img svg{display:block;width:100%;height:auto;max-height:380px}
.v-img figcaption{font-weight:700;font-size:20px;color:var(--set)}
.mk{fill:var(--set);stroke:#ffffff;stroke-width:3}
.mk.big{fill:var(--ok)}
.mkt{fill:#ffffff;font:700 26px var(--f-body)}
.v-svg{width:min(560px,100%)}
.v-svg svg{display:block;width:100%;height:auto;max-height:400px;overflow:visible}
.s-ln{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.s-hl{fill:none;stroke:var(--set);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.s-hl2,.s-hlM{fill:none;stroke:var(--mari);stroke-width:6;stroke-linecap:round}
.s-dash{fill:none;stroke:var(--set);stroke-width:2.5;stroke-dasharray:8 6}
.s-dashM{fill:var(--mari-soft);stroke:var(--mari);stroke-width:2.5;stroke-dasharray:8 6}
.s-fill{fill:var(--set-s)}
.s-fillS{fill:var(--set);fill-opacity:.55}
.s-fillM{fill:var(--mari);fill-opacity:.35}
.s-none,.s-ghost{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5}
.s-ghostM{fill:var(--soft);stroke:var(--muted);stroke-width:2}
.s-tri{fill:var(--mari);fill-opacity:.75;stroke:var(--ink);stroke-width:2.5}
.s-grid{stroke:var(--line);stroke-width:1.5}
.s-cell{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.s-cellH{fill:var(--set);fill-opacity:.55;stroke:var(--card);stroke-width:1.5}
.s-dot{fill:var(--set)}
.s-arr{fill:none;stroke:var(--mari);stroke-width:4;stroke-linecap:round}
.s-arr-h{fill:var(--mari)}
.s-arr2{fill:none;stroke:var(--set);stroke-width:4;stroke-linecap:round}
.s-arr2-h{fill:var(--set)}
.s-badge{fill:var(--set)}
.s-bt{fill:var(--on-set);font:700 15px var(--f-body)}
.s-t{fill:var(--ink);font:500 18px var(--f-body)}
.s-ts{fill:var(--set);font:700 17px var(--f-body)}
.s-tb{fill:var(--ink);font:700 22px var(--f-body)}
.s-tm{fill:var(--mari-ink);font:700 17px var(--f-body)}
@media (max-width:600px){.hint{display:none}.stage{min-height:0}.dots{margin-left:0;width:100%}}

/* ---------- all-steps solution + interactive picture ---------- */
b.hl{color:var(--set);font-weight:700;background:var(--mari-soft);padding:0 4px;border-radius:4px}

.st[data-fr]{cursor:pointer}

.stv{display:grid;justify-items:start;gap:8px;max-width:100%;min-width:0}
.stv .v-eq{font-size:20px;padding:10px 16px;text-align:left}

.stv .v-seq .note{text-align:left}
.stv .v-bar{width:min(460px,100%)}
.stv .v-dots{justify-content:flex-start}
.stv .v-grid table{font-size:17px}
.seepic{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--set);color:var(--set);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;cursor:pointer}
.st.fin{border-color:var(--ok)}
.st.fin .num{background:var(--ok);color:#fff}
.st.fin .bigans{font-size:clamp(40px,6vw,60px)}
.pic{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);border:1.5px solid var(--line);border-radius:12px;background:var(--card);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px}
.pic:fullscreen{background:var(--paper);padding:28px;align-content:center}
.pic:fullscreen .pic-stage svg{max-height:70vh}
.pic-top{display:flex;align-items:center;gap:10px}

.pic-stage{display:grid;justify-items:center;min-height:200px;min-width:0}
.pic-stage .v-img,.pic-stage .v-svg{width:100%}
.pic-cap{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.pic-cap .num{width:28px;height:28px;font-size:14px}
.pic-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbtn{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--ink)}
.pbtn.main{background:var(--set);color:var(--on-set);border-color:var(--set);padding:8px 16px}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pic .dots{margin-left:auto;display:flex;gap:6px}
.pic .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--set);background:transparent;padding:0;cursor:pointer}
.pic .dot.on{background:var(--set)}
.anim .v-img image{animation:fadein .5s both}
.pop{animation:pop2 .45s cubic-bezier(.3,1.6,.6,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop2{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.anim .s-ln,.anim .s-hl,.anim .s-hl2,.anim .s-hlM,.anim .s-arr,.anim .s-arr2{animation:draw 1.4s ease backwards}
.anim .s-hl,.anim .s-hl2,.anim .s-hlM,.anim .s-arr,.anim .s-arr2{animation-delay:.7s}
@keyframes draw{from{stroke-dasharray:1400;stroke-dashoffset:1400}to{stroke-dasharray:1400;stroke-dashoffset:0}}
.anim .s-fill,.anim .s-fillS,.anim .s-fillM,.anim .s-tri,.anim .s-cellH,.anim .s-arr-h,.anim .s-arr2-h,.anim .s-dot,.anim .s-badge{animation:fadein .7s .9s both}
.anim text{animation:fadein .6s 1.3s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (max-width:1000px){.sol.has-pic .sol-body{grid-template-columns:minmax(0,1fr)}.pic{position:static;order:-1}}
@media (max-width:600px){.sheet{padding:14px}.sol-body{padding:10px}.st{grid-template-columns:minmax(0,1fr);gap:8px;padding:12px}.st .num{width:30px;height:30px;font-size:14px}.st.fin .tip{grid-template-columns:minmax(0,1fr)}.st.fin .tip svg{grid-row:auto}}

const IMGS = {}, IMGSZ = {};
// ---------- Visual helpers for the solution slides ----------
const V = {
  eq:(lines)=>({k:"eq",lines}),
  seq:(items,o={})=>({k:"seq",items,...o}),
  grid:(rows,o={})=>({k:"grid",rows,...o}),
  bar:(rows,o={})=>({k:"bar",rows,...o}),
  dots:(groups,o={})=>({k:"dots",groups,...o}),
  img:(key,marks=[],o={})=>({k:"img",key,marks,...o}),
  svg:(vb,s,o={})=>({k:"svg",vb,s,...o})
};
const P = (pts)=>pts.map(p=>p.join(",")).join(" ");
const tx = (x,y,t,c="s-t",a="middle")=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}" dominant-baseline="middle">${t}</text>`;

// 2020 Q10 and 2024 Q9: a road drawn as a line
function road(parts,ends,notes=""){
  let x=20,s=`<line x1="20" y1="60" x2="540" y2="60" class="s-ln"/>`;
  parts.forEach(p=>{const w=p.w;s+=`<line x1="${x}" y1="60" x2="${x+w}" y2="60" class="${p.c||"s-ln"}"/>`+(p.t?tx(x+w/2,p.up?32:88,p.t,p.tc||"s-t"):"");x+=w;});
  ends.forEach(e=>{s+=`<circle cx="${e.x}" cy="60" r="7" class="s-dot"/>`+tx(e.x,e.y||100,e.t,"s-tb");});
  return V.svg("0 0 560 120",s+notes);
}
function arrow(x1,y,x2,cls="s-arr",t="",ty=0){
  const d=x2>x1?1:-1;
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="${cls}"/><polygon points="${P([[x2,y],[x2-12*d,y-7],[x2-12*d,y+7]])}" class="${cls}-h"/>`+(t?tx((x1+x2)/2,y+(ty||-16),t,"s-ts"):"");
}
// 2020 Q14: three identical rectangles
function rect3(step){
  let s=`<rect x="0" y="120" width="200" height="80" class="s-ln"/><rect x="200" y="0" width="80" height="200" class="s-ln"/><rect x="280" y="0" width="80" height="200" class="s-ln"/>`;
  if(step===0){s=`<rect x="0" y="120" width="200" height="80" class="s-fill"/>`+s+tx(100,160,"long","s-ts")+tx(-22,160,"short","s-ts","end")+tx(240,-14,"short","s-ts")+tx(372,100,"long","s-ts","start");}
  if(step===1){s+=`<line x1="190" y1="0" x2="190" y2="120" class="s-hl"/>`+tx(180,60,"6 cm","s-ts","end")+tx(240,100,"long","s-t")+tx(100,160,"short","s-t")+tx(180,250,"long − short = 6 cm","s-ts");}
  if(step===2){s+=`<line x1="0" y1="232" x2="200" y2="232" class="s-hl"/><line x1="204" y1="232" x2="276" y2="232" class="s-hl2"/><line x1="284" y1="232" x2="360" y2="232" class="s-hl2"/>`+tx(100,256,"long","s-ts")+tx(240,256,"short","s-ts")+tx(320,256,"short","s-ts")+tx(180,-14,"total width = 18 cm","s-t");}
  if(step===3){return V.svg("40 20 320 150",`<rect x="80" y="60" width="200" height="80" class="s-fill"/><rect x="80" y="60" width="200" height="80" class="s-ln"/>`+tx(180,40,"10 cm","s-ts")+tx(292,100,"4 cm","s-ts","start")+tx(180,100,"1 rectangle","s-t"));}
  return V.svg("-80 -40 520 320",s);
}
// 2024 Q6: square with semicircle and quadrants
function semi(step){
  const left=`<path d="M0,0 A100,100 0 0 1 0,200 Z" class="${step===2?"s-ghost":"s-fillS"}"/>`;
  const right=`<path d="M200,0 A100,100 0 0 1 100,100 A100,100 0 0 1 200,200 Z" class="s-fillS"/>`;
  const quads=`<path d="M100,0 L200,0 A100,100 0 0 1 100,100 Z" class="${step===1?"s-fillM":"s-none"}"/><path d="M100,200 L100,100 A100,100 0 0 1 200,200 Z" class="${step===1?"s-fillM":"s-none"}"/>`;
  let s=`<rect x="0" y="0" width="200" height="200" class="s-ln"/>`;
  if(step<2) s=left+right+quads+s+`<line x1="100" y1="0" x2="100" y2="200" class="s-dash"/>`;
  else s=`<rect x="100" y="0" width="100" height="200" class="s-fillS"/>`+left+s+`<line x1="100" y1="0" x2="100" y2="200" class="s-dash"/>`+tx(150,222,"25 cm","s-ts")+tx(212,100,"50 cm","s-ts","start");
  if(step===1) s+=`<path d="M40,100 C70,40 120,40 150,70" class="s-arr"/><polygon points="${P([[150,70],[136,68],[145,57]])}" class="s-arr-h"/>`+tx(150,222,"2 quarters = 1 half circle","s-ts");
  if(step===0) s+=tx(50,222,"half circle","s-ts")+tx(150,222,"leftover part","s-ts");
  return V.svg("-30 -20 300 260",s);
}
// 2024 Q7: arrowhead
function arrowhead(step){
  const L=[10,215],R=[410,215],T=[210,15],I=[205,150];
  let s="";
  if(step===0) s+=`<polygon points="${P([L,I,R])}" class="s-fillS"/>`;
  if(step===1) s+=`<polygon points="${P([L,T,R])}" class="s-fill"/>`;
  s+=`<polygon points="${P([L,T,R])}" class="s-ln"/><polyline points="${P([L,I,R])}" class="s-ln"/>`;
  s+=tx(210,48,"x°",step===2?"s-tb":"s-t")+tx(80,178,"29°")+tx(338,178,"18°")+tx(205,176,"129°");
  if(step===0) s+=tx(210,242,"the 2 bottom angles of the small triangle = 180 − 129 = 51°","s-ts");
  if(step===1) s+=tx(210,242,"big triangle bottom angles = 51 + 29 + 18 = 98°","s-ts");
  return V.svg("0 0 420 260",s);
}
// 2024 Q11: square on a 10 x 10 grid
function sq11(step){
  let g="";for(let i=1;i<10;i++)g+=`<line x1="${i*20}" y1="0" x2="${i*20}" y2="200" class="s-grid"/><line x1="0" y1="${i*20}" x2="200" y2="${i*20}" class="s-grid"/>`;
  let s=g+`<polygon points="200,0 120,40 200,200" class="s-fillS"/><rect x="0" y="0" width="200" height="200" class="s-ln"/><line x1="0" y1="100" x2="200" y2="0" class="s-ln"/><line x1="100" y1="0" x2="200" y2="200" class="s-ln"/>`;
  s+=tx(-12,-12,"A")+tx(212,-12,"B")+tx(212,212,"C")+tx(-12,212,"D")+tx(-14,100,"E")+tx(100,-14,"F");
  if(step>=1) s+=`<circle cx="120" cy="40" r="6" class="s-dot"/>`+tx(108,54,"G","s-tb")+`<line x1="120" y1="40" x2="200" y2="40" class="s-hl"/>`+tx(160,26,"4","s-ts");
  if(step>=2) s+=`<line x1="214" y1="0" x2="214" y2="200" class="s-hl2"/>`+tx(232,150,"10","s-ts");
  return V.svg("-36 -36 290 270",s);
}
// 2024 Q13: rectangle ABCD
function rect13(step){
  let s="";
  if(step<=1) s+=`<rect x="120" y="0" width="150" height="180" class="s-fill"/><polygon points="270,0 120,180 270,180" class="s-fillS"/>`;
  else s+=`<rect x="0" y="0" width="270" height="105" class="s-fill"/><polygon points="0,0 0,105 270,0" class="s-fillS"/>`;
  s+=`<rect x="0" y="0" width="270" height="180" class="s-ln"/><line x1="0" y1="105" x2="270" y2="0" class="s-ln"/><line x1="270" y1="0" x2="120" y2="180" class="s-ln"/>`;
  s+=tx(-14,-12,"A")+tx(284,-12,"B")+tx(284,194,"C")+tx(-14,194,"D")+tx(-16,105,"F")+tx(120,198,"E");
  if(step<=1){s+=tx(60,214,"4 parts","s-ts")+tx(195,214,"5 parts","s-ts")+tx(230,150,"60","s-tb");}
  else{s+=tx(-20,52,"7","s-ts","end")+tx(-20,142,"5","s-ts","end")+tx(70,30,"?","s-tb");}

function parseNum(s){s=s.replace(/,/g,"").replace(/\s+/g,"");const fr=s.match(/(-?\d+)\/(\d+)/);if(fr)return +fr[1]/+fr[2];const m=s.match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null;}
function isRight(y,n,raw){const k=KEY[y][n-1];const s=raw.trim().toLowerCase();
  if(typeof k==="number"){const v=parseNum(s);return v!==null&&Math.abs(v-k)<1e-9;}
  if(k.letter)return s.replace(/[^a-z]/g,"")===k.letter.toLowerCase();
  if(k.time){const m=s.replace(/\s/g,"").match(/^(\d{1,2})(?:[:.](\d{2}))?(am|pm)?/);if(!m)return false;let h=+m[1],mi=+(m[2]||0);if(m[3]==="pm"&&h<12)h+=12;if(m[3]==="am"&&h===12)h=0;if(!m[3])return h*60+mi===k.time||(h+12)*60+mi===k.time;return h*60+mi===k.time;}
  return false;}

    return `<div class="v-seq"><div class="row">${h}</div>${v.note?`<div class="note">${fmt(v.note)}</div>`:""}</div>`;}

      if(/^[+\-*]/.test(c)&&c.length>1){cls={"+":"ok","-":"no","*":"hi"}[c[0]];tx=c.slice(1);}

      return `<${tag} class="${cls.trim()}">${mark}${esc(tx)}</${tag}>`;}).join("")}</tr>`).join("");
    return `<div class="v-grid"><table>${rows}</table></div>`;}
  if(v.k==="bar"){

    return `<div class="v-bar">${v.rows.map(r=>`<div class="br"><span class="bl">${esc(r.l)}</span><div class="bs" style="width:${r.s.reduce((a,x)=>a+x[1],0)/mx*100}%">${r.s.map(([tx,w,k])=>`<span class="seg ${k}" style="flex:${w}">${esc(tx)}</span>`).join("")}</div>${r.n?`<span class="bn">${esc(r.n)}</span>`:""}</div>`).join("")}</div>`;}

  return `<nav class="rail2" aria-label="${t("nav")}"><span class="rsec">${t("secA")}</span><div class="chips2">${all.slice(0,10).map((q,i)=>chip(q,i)).join("")}</div>
    <span class="rsec">${t("secB")}</span><div class="chips2">${all.slice(10).map((q,i)=>chip(q,i+10)).join("")}</div>
    <div class="legend2"><span class="lc">${t("legC")}</span><span class="lw">${t("legW")}</span><span class="lr">${t("legR")}</span></div></nav>`;
}
function wordsHTML(y,n){
  const v=(VOCAB[y]||[])[n-1]||[];
  return `<div class="words" role="dialog" aria-label="${t("vocabT")}"><div class="wh"><b>${t("vocabT")}</b><button type="button" class="pbtn" id="wclose">${t("hide")}</button></div>
    <ul>${v.map(([w,th,en])=>`<li><span class="w">${esc(w)}</span><span>${esc(en)}</span></li>`).join("")}</ul></div>`;
}
function qHTML(){
  const y=S.year,q=qs(y)[S.qi],n=q.n,key=sk(y,n);
  const fig=q.fig;
  const fb=S.fb[key],st=prog(y)[n];
  let fbHTML="";
  if(fb==="ok") fbHTML=`<div class="fb ok" role="status"><span class="ic">✓</span><span>${t("okMsg")}</span></div>`;
  else if(fb==="bad") fbHTML=`<div class="fb bad" role="status"><span class="ic">✗</span><span>${t("badMsg")}</span></div>`;
  else if(fb==="empty") fbHTML=`<div class="fb bad" role="status"><span class="ic">!</span><span>${t(S.mode==="mc"?"pickFirst":"empty")}</span></div>`;
  else if(st==="r"&&!S.teacher) fbHTML=`<div class="fb note"><span class="ic">•</span><span>${t("revealNote")}</span></div>`;
  const last=S.qi===qs(y).length-1,nv=((VOCAB[y]||[])[n-1]||[]).length;
  return `<div class="qhead"><h2 class="qnum">${t("q")} ${n}</h2><span class="badge">${n<=10?t("secA"):t("secB")}</span>
      ${nv?`<button type="button" class="wbtn" id="words" aria-expanded="${!!S.wopen}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>${t("vocabT")} (${nv})</button>`:""}</div>
    <div class="qtexts">${q.q.map(x=>`<p class="qtext">${esc(x)}</p>`).join("")}</div>
    ${fig?`<div class="fig2 qfig"><svg viewBox="${fig.vb}" role="img" aria-label="Figure for question ${n}">${fig.s}</svg></div>`:""}
    <form class="answer2" id="aform" autocomplete="off">
      ${S.mode==="mc"?optsHTML(y,n,key):`<label for="ans">${t("yourAns")}</label>
      <div class="arow"><input id="ans" inputmode="text" placeholder="${t("ph")}"><button class="btn" type="submit">${t("check")}</button></div>`}
      ${fbHTML}
    </form>
    <div class="nav2"><button class="btn ghost" type="button" id="prev" ${S.qi===0?"disabled":""}>← ${t("prevQ")}</button>
      <button class="btn" type="button" id="next">${last?t("finish"):t("nextQ")+" →"}</button></div>
    ${S.wopen?wordsHTML(y,n):""}`;
}
function spaneHTML(){
  const y=S.year,q=qs(y)[S.qi],key=sk(y,q.n);
  const open=S.teacher||S.open[key]||S.fb[key]==="ok";
  if(open) return solHTML(y,q);
  return `<div class="sol-wait"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
    <h2>${t("sol")}</h2><p>${t("waitP")}</p><button class="btn big2" type="button" id="opensol">▶ ${t("showSol")}</button></div>`;
}
const isDia=(v,y,n)=>v&&(v.k==="svg"||(v.k==="img"&&!(v.key===FIGS[y][n]&&!(v.marks||[]).length)));
function framesOf(y,n){const f=[];LESSON[y][n].forEach((s,i)=>{if(isDia(s.v,y,n))f.push({i,v:s.v,t:s.t});});return f;}
function solHTML(y,q){
  const key=sk(y,q.n),steps=LESSON[y][q.n],fr=framesOf(y,q.n),fi=Math.min(S.frame[key]||0,Math.max(0,fr.length-1));
  let fc=0;
  const picIc=`<svg class="pi" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="has picture"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
  const cards=steps.map((s,i)=>{const dia=isDia(s.v,y,q.n);const myF=dia?fc++:-1;
    const sameFig=s.v&&s.v.k==="img"&&!dia;
    const vis=dia||sameFig?viz(s.v2):viz(s.v)+viz(s.v2);
    return `<li class="st${dia&&myF===fi?" on":""}"${dia?` data-fr="${myF}" title="${t("seePic")}"`:""}><span class="num">${i+1}</span><div class="stb"><h4>${fmt(s.t)}${dia?picIc:""}</h4>${s.x?`<p>${fmt(s.x)}</p>`:""}${vis?`<div class="stv">${vis}</div>`:""}</div></li>`;}).join("");
  const fin=`<div class="finbar"><div class="finrow"><span class="num">✓</span><h4>${t("ansIs")}</h4><div class="bigans">${esc(q.ans)}</div></div>
      <div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span class="tl">${t("tip")}</span><div>${q.tip}</div></div></div>`;
  return `<section class="sol${fr.length?" has-pic":""}" id="sol">
    <div class="sol-head"><h2>${t("sol")}</h2><span>${steps.length} ${t("steps")}</span>${fr.length?`<span class="sh-note">${t("clickStep")}</span>`:""}</div>
    <div class="sol-body">${fr.length?`<aside class="pic" id="pic">${picHTML(y,q.n,fi)}</aside>`:""}<ol class="steps2">${cards}</ol></div>${fin}
  </section>`;
}
function overlayHTML(){
  const body=S.ov==="tips"?tipsHTML():S.ov==="vocab"?vocabTabHTML():resultHTML();
  return `<div class="ovbg" id="ovbg"><div class="ovp" role="dialog" aria-label="${t(S.ov)}"><div class="ovh"><h2>${t(S.ov)}: ${setName(S.year)}</h2><button type="button" class="pbtn" id="ovclose">✕ ${t("close")}</button></div><div class="ovb">${body}</div></div></div>`;
}
function picHTML(y,n,fi){
  const fr=framesOf(y,n),f=fr[fi],many=fr.length>1;
  const dots=many?fr.map((_,k)=>`<button type="button" class="dot${k===fi?" on":""}" data-fr="${k}" aria-label="${t("picture")} ${k+1}"></button>`).join(""):"";
  return `<div class="pic-top"><b>${t("picture")}</b>${many?`<span>${fi+1} / ${fr.length}</span>`:""}<button type="button" class="pbtn" id="pfs">${document.fullscreenElement?t("exitFull"):t("full")}</button></div>
    <div class="pic-stage anim" id="pstage">${viz(f.v)}</div>
    <div class="pic-cap"><span class="num">${f.i+1}</span>${fmt(f.t)}</div>
    <div class="pic-ctl">${many?`<button type="button" class="pbtn" id="pprev" ${fi===0?"disabled":""} aria-label="${t("back")}">◀</button>`:""}
      <button type="button" class="pbtn main" id="pplay">${S.playing?"❚❚ "+t("pause"):many?"▶ "+t("play"):"↻ "+t("replay")}</button>
      ${many?`<button type="button" class="pbtn" id="pnext" ${fi===fr.length-1?"disabled":""} aria-label="${t("next")}">▶</button><div class="dots">${dots}</div>`:""}</div>`;
}
function optsHTML(y,n,key){
  const [opts,ci]=CHOICES[y][n-1],pick=S.pick[key],wr=S.wrongs[key]||[],solved=S.fb[key]==="ok"||S.teacher;
  const plain=opts.join("")==="ABCDE";
  const b=opts.map((o,i)=>{let c="";if(solved&&i===ci)c="ok";else if(wr.includes(i))c="no";
    return `<button type="button" class="opt ${c}" data-opt="${i}" aria-pressed="${pick===i&&!c}" ${c==="no"?"disabled":""}><span class="L">${LET[i]}</span>${plain?"":`<span class="v">${esc(o)}</span>`}</button>`}).join("");
  return `<span style="font-weight:700">${t("pickAns")}</span><div class="opts">${b}</div><div><button class="btn" type="submit">${t("check")}</button></div>`;
}
function tipsHTML(){
  return `<p style="margin:0 0 12px;color:var(--muted)">${t("tipsP")}</p><div class="list">${qs(S.year).map((q,i)=>`
    <button class="tiprow" type="button" data-goto="${i}"><span class="n">${q.n}</span><span>${q.tip}</span></button>`).join("")}</div>`;
}
function vocabTabHTML(){
  const y=S.year;
  const rows=qs(y).map((q,i)=>((VOCAB[y]||[])[i]||[]).map(([w,th,en],j)=>`<tr>${j===0?`<td class="qn" rowspan="${VOCAB[y][i].length}"><button class="chip" type="button" data-goto="${i}" style="width:40px">${q.n}</button></td>`:""}<td class="w">${esc(w)}</td><td>${esc(en)}</td></tr>`).join("")).join("");
  return `<p style="margin:0 0 12px;color:var(--muted)">${t("vocabP")}</p><div class="vwrap"><table class="vtable"><thead><tr><th>${t("q")}</th><th>${t("vWord")}</th><th>${t("vEn")}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function resultHTML(){
  const y=S.year,c=count(y),p=prog(y);
  const miss=qs(y).map((q,i)=>({q,i})).filter(o=>p[o.q.n]!=="c");
  const msg=c>=12?t("resGood"):c>=7?t("resMid"):t("resLow");
  return `<section class="result"><h2>${t("resT")}</h2>
    <div class="big">${c}<small> / 15</small></div><p style="margin:0;font-size:18px">${msg}</p>
    <div class="bar" aria-hidden="true"><span style="width:${c/15*100}%"></span></div>
    <h3 style="font-size:18px">${t("retryT")}</h3>
    ${miss.length?`<div class="rchips">${miss.map(o=>`<button class="chip" type="button" data-goto="${o.i}" data-s="${p[o.q.n]||""}">${o.q.n}</button>`).join("")}</div>`:`<p style="margin:0">${t("none")}</p>`}
    <div class="mbtns">${miss.length?`<button class="btn" type="button" data-goto="${miss[0].i}">${t("retry")}</button>`:""}
      <button class="btn ghost" type="button" id="back">${t("backSet")}</button>
      <button class="btn ghost" type="button" id="reset">${t("reset")}</button></div>
    ${S.confirm?`<div class="confirm"><span>${t("sure")}</span><button class="btn" type="button" id="yes">${t("yes")}</button><button class="btn ghost" type="button" id="no">${t("no")}</button></div>`:""}
  </section>`;
}

/* ---------- actions ---------- */
function openSet(y){if(S.view==="set"&&S.year!==y)S.qi=0;S.view="set";S.year=y;S.ov=null;S.wopen=false;S.confirm=false;if(location.hash!=="#set-"+y)history.replaceState(null,"","#set-"+y);render();window.scrollTo(0,0);}
function goQ(i){S.ov=null;S.wopen=false;S.qi=i;render();}
function curKey(){const q=qs(S.year)[S.qi];return sk(S.year,q.n);}
let playT=null;
function setFrame(fi,prevFi){
  const q=qs(S.year)[S.qi],key=sk(S.year,q.n),fr=framesOf(S.year,q.n);if(!fr.length)return;
  fi=Math.max(0,Math.min(fr.length-1,fi));S.frame[key]=fi;
  const pic=$("#pic");if(!pic)return;pic.innerHTML=picHTML(S.year,q.n,fi);
  const prev=prevFi!=null&&fr[prevFi]&&fr[prevFi].v.k==="img"?new Set((fr[prevFi].v.marks||[]).map(m=>m[0]+","+m[1])):null;
  let d=0;pic.querySelectorAll("g[data-k]").forEach(g=>{if(!prev||!prev.has(g.dataset.k)){g.classList.add("pop");g.style.animationDelay=(0.25+d*0.35)+"s";d++;}});
  document.querySelectorAll(".st[data-fr]").forEach(li=>li.classList.toggle("on",+li.dataset.fr===fi));
}
function stopPlay(){if(playT){clearTimeout(playT);playT=null;}S.playing=false;}
function play(){
  const q=qs(S.year)[S.qi],key=sk(S.year,q.n),fr=framesOf(S.year,q.n);
  if(fr.length<2){stopPlay();setFrame(S.frame[key]||0,null);return;}
  S.playing=true;let i=(S.frame[key]||0)>=fr.length-1?0:(S.frame[key]||0);setFrame(i,null);
  const tick=()=>{if(!S.playing)return;if(i>=fr.length-1){stopPlay();setFrame(i,i);return;}const p=i;i++;setFrame(i,p);playT=setTimeout(tick,2600);};
  playT=setTimeout(tick,2600);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const y=S.year,q=S.view==="set"?qs(y)[S.qi]:null,key=q?sk(y,q.n):null;
  if(b.dataset.mode){S.mode=b.dataset.mode;save();render();return;}
  if(b.dataset.opt){S.pick[key]=+b.dataset.opt;if(S.fb[key]!=="ok")S.fb[key]=null;render();return;}
  if(b.id==="teacher"){S.teacher=!S.teacher;render();return;}
  if(b.id==="home-btn"||b.id==="back"){S.view="home";history.replaceState(null,"",location.pathname+location.search);render();window.scrollTo(0,0);return;}
  if(b.dataset.open){openSet(b.dataset.open);return;}
  if(b.dataset.ov){S.ov=b.dataset.ov;S.confirm=false;render();return;}
  if(b.id==="ovclose"){S.ov=null;S.confirm=false;render();return;}
  if(b.id==="words"){S.wopen=!S.wopen;render();return;}
  if(b.id==="wclose"){S.wopen=false;render();return;}
  if(b.dataset.q){S.qi=+b.dataset.q;S.wopen=false;render();return;}
  if(b.dataset.goto){goQ(+b.dataset.goto);return;}
  if(b.dataset.fr!=null&&b.closest("#sol")){stopPlay();const p=S.frame[key]||0;setFrame(+b.dataset.fr,p);return;}
  if(b.id==="opensol"){S.open[key]=true;if(prog(y)[q.n]!=="c"){prog(y)[q.n]="r";S.fb[key]=null;save();}render();return;}
  if(b.id==="pnext"){stopPlay();setFrame((S.frame[key]||0)+1,S.frame[key]||0);return;}
  if(b.id==="pprev"){stopPlay();setFrame((S.frame[key]||0)-1,null);return;}
  if(b.id==="pplay"){if(S.playing){stopPlay();setFrame(S.frame[key]||0,S.frame[key]||0);}else play();return;}
  if(b.id==="pfs"){const d=$("#pic");try{if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{});}catch(err){}return;}
  if(b.id==="prev"&&S.qi>0){goQ(S.qi-1);return;}
  if(b.id==="next"){if(S.qi<qs(y).length-1)goQ(S.qi+1);else{S.ov="result";render();}return;}
  if(b.id==="reset"){S.confirm=true;render();return;}
  if(b.id==="no"){S.confirm=false;render();return;}
  if(b.id==="yes"){S.prog[y]={};[S.open,S.frame,S.fb,S.typed,S.pick,S.wrongs].forEach(o=>Object.keys(o).forEach(k=>{if(k.startsWith(y+"-"))delete o[k]}));S.confirm=false;save();render();return;}
});
document.addEventListener("click",e=>{if(e.target.id==="ovbg"){S.ov=null;S.confirm=false;render();return;}if(e.target.closest("button"))return;const li=e.target.closest(".st[data-fr]");if(!li)return;stopPlay();const k=curKey();setFrame(+li.dataset.fr,S.frame[k]||0);});
document.addEventListener("fullscreenchange",()=>{const b=$("#pfs");if(b)b.textContent=document.fullscreenElement?t("exitFull"):t("full");});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&(S.ov||S.wopen)){S.ov=null;S.wopen=false;render();return;}
  if(S.ov||!$("#pic"))return;const tg=e.target;if(tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();stopPlay();const k=curKey();setFrame((S.frame[k]||0)+1,S.frame[k]||0);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();stopPlay();const k=curKey();setFrame((S.frame[k]||0)-1,null);}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("vocab")){S.vopen[d.dataset.k]=d.open;const v=d.querySelector(".vt");if(v)v.textContent=d.open?t("hide"):t("tapOpen");}},true);
document.addEventListener("input",e=>{if(e.target.id==="ans")S.typed[curKey()]=e.target.value;});
document.addEventListener("submit",e=>{
  e.preventDefault();if(e.target.id!=="aform")return;
  const y=S.year,q=qs(y)[S.qi],key=sk(y,q.n);
  if(S.mode==="mc"){
    const p=S.pick[key];if(p==null){S.fb[key]="empty";render();return;}
    const ok=p===CHOICES[y][q.n-1][1],cur=prog(y)[q.n];
    S.fb[key]=ok?"ok":"bad";
    if(ok){if(cur!=="r"&&!(S.wrongs[key]||[]).length)prog(y)[q.n]="c";}else{(S.wrongs[key]=S.wrongs[key]||[]).push(p);S.pick[key]=null;if(!cur)prog(y)[q.n]="w";}
    save();render();return;}
  const v=$("#ans").value;
  if(!v.trim()){S.fb[key]="empty";render();$("#ans").focus();return;}
  const ok=isRight(y,q.n,v),cur=prog(y)[q.n];
  S.fb[key]=ok?"ok":"bad";
  if(ok&&cur!=="r")prog(y)[q.n]="c";else if(!ok&&!cur)prog(y)[q.n]="w";
  save();render();const a=$("#ans");if(a&&!ok)a.select();
});
function fromHash(){const m=location.hash.match(/^#set-(S[1-6])$/);if(m)openSet(m[1]);else render();}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>

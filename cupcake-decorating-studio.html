/* =========================== SPRINKLE JAR =========================== */
const SCAT = {
  sess: null,
  emitAt(p, n) { const id = SS.scatter; Stage.pearl = SS.pearl; Stage.emit(id, id, p.x, p.y, n, id === 'pearls' ? 12 : 17); },
  down(p) { this.sess = { act: cup().newAct(), last: p, n: 0, tHold: p.t }; cup().act = this.sess.act; Snd.shake(); this.emitAt(p, 7); this.sess.n += 7; },
  move(p) {
    const s = this.sess; if (!s) return; const d = Math.hypot(p.sx - s.last.sx, p.sy - s.last.sy), n = Math.min(10, Math.floor(d / 4)); s.shake = clamp(d / 30, .2, 1.4); s.t = performance.now();
    if (n > 0) { this.emitAt(p, n); s.n += n; Snd.shake(); } s.last = p;
  },
  up() { const s = this.sess; if (!s) return; this.sess = null; Studio.announceAction('scatter', { id: SS.scatter, n: s.n }); },
  tick(dt, now) { const s = this.sess; if (!s) return false; if (now - s.tHold > 160) { s.tHold = now; if (s.last && !(s.t && now - s.t < 160)) { this.emitAt(s.last, 2); } } return true; },
  overlay(ctx, p, now) { if (!p) return; const sh = this.sess && this.sess.t && now - this.sess.t < 220 ? this.sess.shake || 1 : this.sess ? .3 : 0; drawJar(ctx, p.sx, p.sy, SS.scatter, SS.pearl, sh, now); }
};

/* =========================== PLACED TOPPINGS ===========================
   Everything is placed by hand, anywhere on the cupcake. Nothing rolls off and nothing disappears.
   Modes: place (tap or drag), move (drag a piece), erase (tap a piece). */
const TSZ = { s: .75, m: 1, l: 1.35 };
const TOP_KINDS = new Set(['top', 'fond', 'candle', 'flag', 'wafer', 'sign']);

'use strict';
/* Touch lock for tablets (Maya's rule): never zooms, slides sideways or bounces; one finger at a time; a resting palm is ignored while the Apple Pencil is in use. */
(function () {
  const meta = document.querySelector('meta[name=viewport]');
  const LOCK = 'width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover';
  if (meta) meta.setAttribute('content', LOCK);
  const SCROLLERS = '.rail,.panel,.mbody,.bbody,.thumbs,.pr-prev,.ptiles,textarea,.sett,.bk';
  const inScroller = el => !!(el && el.closest && el.closest(SCROLLERS));
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if ((e.touches && e.touches.length > 1) || !inScroller(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('textarea,input'))) e.preventDefault(); });
  const home = () => {
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    const se = document.scrollingElement; if (se) { se.scrollLeft = 0; se.scrollTop = 0; }
    document.body.scrollLeft = 0; document.body.scrollTop = 0; const app = document.getElementById('app'); if (app) { app.scrollLeft = 0; app.scrollTop = 0; }
  };
  window.addEventListener('scroll', home, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(home, 200));
  document.addEventListener('focusout', () => setTimeout(home, 60));
  const vv = window.visualViewport;
  if (vv) { const fix = () => { if (vv.scale > 1.001 && meta) { meta.setAttribute('content', LOCK + ', shrink-to-fit=no'); meta.setAttribute('content', LOCK); } home(); }; vv.addEventListener('resize', fix); vv.addEventListener('scroll', fix); }

  /* one finger at a time + palm rejection. Mouse is never gated. */
  const gate = { id: null, t: 0, penAt: -1e9, blocked: new Set() };
  const now = () => performance.now(), swallow = e => { e.stopImmediatePropagation(); if (e.cancelable) e.preventDefault(); };
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return; const t = now();
    if (e.pointerType === 'pen') gate.penAt = t;
    else if (t - gate.penAt < 1500) { gate.blocked.add(e.pointerId); return swallow(e); }
    if (gate.id !== null && gate.id !== e.pointerId && t - gate.t < 8000) { gate.blocked.add(e.pointerId); return swallow(e); }
    gate.id = e.pointerId; gate.t = t;
  }, true);
  document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') return; if (e.pointerType === 'pen') gate.penAt = now(); if (gate.blocked.has(e.pointerId)) swallow(e); }, true);
  const up = e => { if (e.pointerType === 'mouse') return; if (gate.blocked.delete(e.pointerId)) return swallow(e); if (gate.id === e.pointerId) gate.id = null; };
  document.addEventListener('pointerup', up, true); document.addEventListener('pointercancel', up, true);
  document.addEventListener('click', e => { if (e.pointerType === 'touch' && now() - gate.penAt < 1500) swallow(e); }, true);
  window.__touchLock = { home, LOCK, gate };
})();

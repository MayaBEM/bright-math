:root{--cream:#FFF8EE;--paper:#FFFFFF;--ink:#4B2A18;--ink2:#7A5538;--rose:#F0457F;--rosed:#B8205A;--mint:#6FE3BD;--mintd:#14906B;--line:#F2CFA8;--navy:#3A4FC4;--sun:#FFD43B;--sky:#6BC6FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe0f2;font-family:Lexend,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:3px solid #1d6fd8;outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%}
/* header */
#top{flex:none;height:64px;display:flex;align-items:center;gap:14px;padding:0 14px 7px;background:linear-gradient(#FFF6FA,#FFE6F1);position:relative;z-index:6}
#top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(135deg,#FF5C8E 0 10px,#FFFFFF 10px 20px)}
#logo{height:44px;width:auto;display:block;flex:none}
#titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
#stepTitle{font:700 19px/1.15 Poppins,sans-serif;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#parts{display:flex;gap:6px;margin-top:4px}
#parts span{font:600 11.5px Lexend,sans-serif;padding:1px 9px;border:1.5px solid var(--line);color:var(--ink2);background:var(--paper)}
#parts span.on{background:var(--rose);color:#fff;border-color:var(--rosed)}
#starbox{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;background:var(--sun);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(75,42,24,.35);flex:none}
#starbox svg{width:24px;height:24px;fill:#fff;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}#starbox b{font:700 20px Poppins,sans-serif;min-width:1.2em;text-align:center}
#starbox.pop{animation:starpop .5s ease-out}@keyframes starpop{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-4deg)}100%{transform:scale(1)}}
#app.startMode #starbox{display:none}
#topbtns{display:flex;gap:6px;flex:none}
.tb{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;background:var(--paper);border:2px solid var(--ink);font:600 13.5px Lexend,sans-serif;white-space:nowrap;box-shadow:0 3px 0 rgba(75,42,24,.35);transition:transform .12s}
#bHome{background:#C9F5E6}#bWords{background:#CFEBFF}#bSay{background:#FFF0A8}#bMute{background:#FFD3E3}#bFull{background:#E4DBFF}#bTeach{background:#FFE0C4}
.tb:hover,.btn:hover,.vb:hover,.tool:hover,.hcard:hover{transform:translateY(-2px)}
.tb:active,.btn:active,.vb:active,.tool:active,.hcard:active{transform:translateY(2px) scale(.97)}
#main{flex:1;display:flex;min-height:0;min-width:0}
#stageWrap{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#cfe0f2}
#stage{display:block;position:absolute;left:0;top:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;background:var(--paper);border:2px solid var(--ink);font:600 15.5px Lexend,sans-serif;box-shadow:0 3px 0 rgba(75,42,24,.35)}
.btn.primary{background:linear-gradient(#FF6C9E,#F0457F);color:#fff;border-color:#9A1D4E;box-shadow:0 4px 0 #9A1D4E;text-shadow:0 1px 0 rgba(0,0,0,.2)}
#actions .btn.primary{animation:wiggle 2.4s ease-in-out infinite}@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-2.5deg) scale(1.04)}95%{transform:rotate(2.5deg) scale(1.04)}}
.btn.danger{background:#FBE0E0;border-color:#9E2A2A}
.btn.big{min-height:min(56px,8vh);font-size:18px;padding:0 26px}
.btn svg{width:20px;height:20px}
/* overlays on the stage */
#topcol{position:absolute;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3;padding:0 12px}
#hint{max-width:min(720px,100%);padding:8px 16px 8px 44px;background:#FFF3B0;border:2px solid var(--ink);position:relative;font:600 clamp(14px,1.5vw,18px)/1.3 Lexend,sans-serif;text-align:center;z-index:3;box-shadow:0 4px 0 rgba(75,42,24,.25);pointer-events:none}
#hint::before{content:'';position:absolute;left:12px;top:50%;width:22px;height:22px;margin-top:-11px;background:var(--rose);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
#banner{max-width:100%;padding:8px 16px;background:#FFE3EE;border:2px solid var(--rose);font:600 clamp(16px,1.9vw,24px)/1.35 Lexend,sans-serif;text-align:center;z-index:3;box-shadow:0 4px 0 rgba(158,52,80,.25);pointer-events:none}
#banner b{background:var(--rose);color:#fff;padding:1px 9px;margin:0 3px;letter-spacing:.03em;font-weight:700}
#banner.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
#rightcol{position:absolute;left:10px;top:76px;width:282px;z-index:3;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-height:calc(100% - 200px);overflow:auto}
#rightcol>*{pointer-events:auto}#rightcol{max-height:calc(100% - 190px)}
#sayit,#describeCard,#orderCard{background:var(--paper);border:2px solid var(--ink);padding:10px 12px;box-shadow:0 4px 0 rgba(75,42,24,.25)}
.sh{display:flex;align-items:center;gap:8px}.sh b{flex:1;font:700 15px Poppins,sans-serif;color:var(--rose)}
.mini{width:30px;height:30px;border:2px solid var(--line);background:var(--cream);font:700 16px Lexend}
#sayText{font:600 clamp(17px,1.7vw,22px)/1.3 Lexend,sans-serif;margin:8px 0 4px}
#sayit small{color:var(--ink2);font-size:12.5px}
#sayit.min #sayText,#sayit.min small{display:none}
.seg{display:inline-flex}.seg button{padding:4px 9px;border:2px solid var(--line);background:var(--paper);font:600 12px Lexend,sans-serif;margin-left:-2px}
.seg button.on{background:var(--rose);color:#fff;border-color:var(--rosed);position:relative}
#orderCard{width:100%;max-height:none}
.oh{display:flex;justify-content:space-between;align-items:center;font:700 15px Poppins,sans-serif;color:var(--rose)}
.otext{font:500 clamp(15px,1.45vw,18px)/1.55 Lexend,sans-serif;margin:8px 0}
.osub{font:500 13px Lexend,sans-serif;color:var(--ink2);border-top:2px dashed var(--line);padding-top:6px}
mark{background:none;color:inherit}mark.pos{background:#FFD9E2;border-bottom:3px solid var(--rose);font-weight:700;padding:0 2px}mark.col{border-bottom:4px solid var(--c);font-weight:700;padding:0 2px}mark.num{background:#DDF1E9;font-weight:700;padding:0 2px}
.stars{display:inline-flex;gap:2px}.lvstar{width:20px;height:20px;fill:#EADFC9;stroke:#4B2A18;stroke-width:1.2}.lvstar.full,.bstar.full{fill:#F6C632}.bstar{width:62px;height:62px;fill:#EADFC9;stroke:#4B2A18;stroke-width:1}
#actions{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:22px;display:flex;gap:10px;z-index:4}
#app.deco #actions{bottom:104px}
#viewbar{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:6px;background:rgba(255,246,250,.97);border:2px solid var(--ink);max-width:calc(100% - 16px);z-index:4;box-shadow:0 4px 0 rgba(75,42,24,.25)}
.vb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:66px;height:56px;background:var(--paper);border:2px solid var(--line);font:600 11px/1.05 Lexend,sans-serif;padding:2px;text-align:center}
.vb svg{width:22px;height:22px}
.vb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#undoBtn,#clearBtn{background:#FFE3C9}#turnL,#turnR{background:#D9F0FF}#zoutBtn,#zinBtn{background:#E8F7D6}#globeBtn{background:#E4F4FF}#describeBtn{background:#FFF0A8}
.vb.good{background:var(--mint);border-color:var(--mintd);width:84px}
/* palette */
#palette{flex:none;width:318px;background:linear-gradient(#FFF6FA,#FFF0DE);border-right:3px solid var(--ink);display:flex;flex-direction:column;min-height:0;overflow:hidden;z-index:2}
#tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:3px solid var(--ink);flex:none}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;background:var(--paper);border:0;border-right:2px solid var(--line);font:600 12px Lexend,sans-serif}
#tabs button:last-child{border-right:0}#tabs button.on{background:var(--rose);color:#fff}
#tabs button[data-tab=hand].on{background:#FF9F43}#tabs button[data-tab=candy].on{background:#B07CF0}#tabs button[data-tab=yard].on{background:#2FBF7A}#tabs button[data-tab=snow].on{background:#3FA9F5}#tabs button[data-tab=sweets].on{background:#F0457F}#tabs button{font-size:11px}
#toolHead{padding:8px 12px;font:500 13.5px Lexend,sans-serif;border-bottom:2px solid var(--line);flex:none;color:var(--ink2)}#toolHead b{color:var(--ink);text-transform:none}
#tools{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;align-content:start;min-height:0}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:6px 2px;background:var(--paper);border:2px solid var(--line);font:500 12.5px/1.1 Lexend,sans-serif;min-height:92px;text-align:center}
.tool img{width:54px;height:54px;object-fit:contain;pointer-events:none}

/* ===== jelly buttons: glossy, tactile, bouncy (corners stay square) ===== */
.tb,.btn,.vb,.tool,.hcard{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .12s}
.tb:hover,.btn:hover,.vb:hover,.tool:hover,.hcard:hover{transform:none}
@keyframes jelly{0%{transform:scale(1)}28%{transform:scale(1.09,.92)}52%{transform:scale(.95,1.07)}74%{transform:scale(1.03,.98)}100%{transform:scale(1.04)}}
@media (hover:hover){.tb:hover,.btn:hover,.vb:hover,.tool:hover,.hcard:hover,#bHome:hover{animation:jelly .5s ease-out forwards}}
.tb:active,.btn:active,.vb:active,.tool:active,.hcard:active,#bHome:active{animation:none!important;transform:translateY(3px) scale(.96)!important;box-shadow:0 1px 0 rgba(75,42,24,.4)!important}
.tb,.vb{background-image:linear-gradient(180deg,rgba(255,255,255,.75) 0,rgba(255,255,255,.1) 48%,rgba(0,0,0,.05) 100%);box-shadow:0 4px 0 rgba(75,42,24,.4),inset 0 2px 0 rgba(255,255,255,.85)}

#logoBtn:hover{transform:scale(1.07) rotate(-2deg)}#logoBtn:active{transform:scale(.95)}#logoBtn:focus-visible{outline:3px solid #1d6fd8;outline-offset:2px}
#homeWrap{display:none}
#top{background:radial-gradient(circle,rgba(255,150,190,.3) 2.2px,transparent 3px) 0 0/20px 20px,linear-gradient(#FFFDF6,#FFEAF3);padding-bottom:0}
#top::after{bottom:auto;top:100%;height:30px;pointer-events:none;background:radial-gradient(ellipse 7px 17px at 20% 6px,#FF8FB8 66%,transparent 70%) 0 0/130px 30px repeat-x,radial-gradient(ellipse 6px 12px at 72% 6px,#FF8FB8 66%,transparent 70%) 0 0/130px 30px repeat-x,radial-gradient(circle at 50% 0,#FF8FB8 11px,transparent 12px) 0 0/22px 15px repeat-x,linear-gradient(#FF8FB8,#FF8FB8) 0 0/100% 6px no-repeat;filter:drop-shadow(0 3px 0 rgba(160,30,80,.25));z-index:7}
#topcol{top:34px}#rightcol{top:84px}#turnbar{top:66px}
#palette{padding-top:15px}
#stepTitle{color:#C42368;text-shadow:2px 2px 0 #fff,3px 3px 0 #FFC2DA}
#parts span{border-radius:999px;padding:1px 11px}
.mhead{position:relative;background:linear-gradient(#FFB6D1,#FF8FB8);border-bottom:0}.mhead h2{color:#fff;text-shadow:0 2px 0 #C23C73,0 0 8px rgba(160,30,80,.3)}
.mhead::after{content:'';position:absolute;left:0;right:0;top:100%;height:13px;pointer-events:none;background:radial-gradient(circle at 50% 0,#FF8FB8 8px,transparent 9px) 0 0/18px 13px repeat-x}
.mbody{padding-top:26px}
#bigmsg{position:fixed;left:0;right:0;top:20%;z-index:40;display:flex;justify-content:center;pointer-events:none}
#bigmsg span{font:700 clamp(34px,7vw,92px)/1 Poppins,sans-serif;color:#fff;padding:.18em .7em;background:linear-gradient(#FF6C9E,#E0306E);border-radius:.3em;border:.08em solid #FFE7A0;text-shadow:0 .05em 0 #A3164E;box-shadow:0 .12em 0 #8F1442,0 .3em .6em rgba(0,0,0,.25),inset 0 .06em 0 rgba(255,255,255,.5);transform:scale(0)}
#bigmsg.go span{animation:ribbon 4.2s ease-out forwards}
@keyframes ribbon{0%{transform:scale(0) rotate(-8deg)}12%{transform:scale(1.15) rotate(3deg)}20%{transform:scale(1) rotate(-1deg)}82%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.05);opacity:0}}
@media (min-aspect-ratio:5/4) and (min-height:521px){
  #start{flex-direction:column}
  .panel{width:100%;height:100%;max-height:none;background:none;padding:2.6vh 3vw 3.6vh;align-items:center;justify-content:space-between;pointer-events:none;overflow:visible;gap:0}
  .panel::after{display:none}
  .biglogo{position:absolute;left:2.4vw;top:2.6vh;width:min(190px,15vw);margin:0}
  .ttl{display:flex;flex-direction:column;align-items:center;gap:1.4vh;margin-top:.6vh}
  .panel h1{font-size:clamp(30px,min(4.3vw,8.4vh),74px);text-align:center;color:#fff;letter-spacing:.01em;text-shadow:-3px -3px 0 #F0457F,3px -3px 0 #F0457F,-3px 3px 0 #F0457F,3px 3px 0 #F0457F,0 -4px 0 #F0457F,0 4px 0 #F0457F,-4px 0 0 #F0457F,4px 0 0 #F0457F,0 8px 0 #B8205A,0 14px 16px rgba(120,20,70,.35)}
  .panel .sub{text-align:center;max-width:none;padding:.5vh 2vw;background:rgba(255,255,255,.9);border-radius:999px;border:3px solid #FFC2DA;box-shadow:0 4px 0 rgba(194,60,115,.25);font:500 clamp(14px,1.5vw,20px) Lexend,sans-serif;color:var(--ink)}
  .sbtns{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:1.4vh 1.2vw;margin:0;pointer-events:auto}.srow{display:contents}
  .sbtns .btn{min-height:min(60px,9vh);padding:0 clamp(12px,1.5vw,24px);font:700 clamp(14px,1.3vw,18px) Poppins,sans-serif;color:#fff;border-radius:999px;border:3px solid rgba(255,255,255,.9);text-shadow:0 2px 0 rgba(0,0,0,.22);gap:10px;outline:0;background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
  .sbtns .btn svg{width:26px;height:26px;stroke-width:2.2}
  #sStart{background-color:#F0457F;box-shadow:0 6px 0 #A3164E,0 10px 14px rgba(120,20,70,.3)}#sOrder{background-color:#2F9BEF;box-shadow:0 6px 0 #1763A8,0 10px 14px rgba(20,60,120,.3)}#sFree{background-color:#35B567;box-shadow:0 6px 0 #1B7A40,0 10px 14px rgba(20,90,50,.3)}#sClass{background-color:#F2A100;box-shadow:0 6px 0 #B06E00,0 10px 14px rgba(120,70,0,.3)}#sWords{background-color:#8A63E0;box-shadow:0 6px 0 #5A3AA8,0 10px 14px rgba(60,30,120,.3)}#sTeach{background-color:#F2793A;box-shadow:0 6px 0 #B3501A,0 10px 14px rgba(120,50,10,.3)}
  #sStart{font-size:clamp(16px,1.5vw,21px);min-height:min(68px,10vh)}
  #app.startMode #mascot{display:none}
}

/* ===== calm, tidy tool dock ===== */
#viewbar{gap:2px;padding:7px 10px;background:rgba(255,255,255,.95);border:0;border-radius:28px;box-shadow:0 8px 26px rgba(140,40,90,.28),0 0 0 3px rgba(255,255,255,.9)}
#viewbar .vb{width:70px;height:64px;gap:4px;padding:4px 0 3px;background:transparent;background-image:none;border:0;box-shadow:none;border-radius:18px;font:600 10.5px/1 Lexend,sans-serif;white-space:nowrap;color:var(--ink)}
#viewbar .vb span{display:block;white-space:nowrap}
#viewbar .vb svg{width:32px;height:32px;padding:6px;border-radius:12px;border:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
#viewbar .vb:hover{background:rgba(240,69,127,.1)}
#viewbar .vb.on{background:#3A4FC4;color:#fff}#viewbar .vb.on svg{background:#fff;color:#3A4FC4;box-shadow:none}
#viewbar .vb.good{width:74px;background:linear-gradient(#CBF6E4,#8CE3C2);color:#0E6B4C}
#viewbar .vb.good:hover{background:linear-gradient(#D9FAEC,#9AEACB)}
@media (max-width:1180px) and (min-aspect-ratio:5/4){#viewbar .vb{width:58px;font-size:10px}#viewbar .vb.good{width:62px}#viewbar .vb svg{width:28px;height:28px;padding:5px}}
@media (max-aspect-ratio:5/4){#viewbar .vb{width:64px}#viewbar .vb.good{width:68px}}
@media (max-width:820px){#viewbar .vb{width:58px;font-size:10px}#viewbar .vb.good{width:60px}}
@media (max-width:520px){#viewbar .vb{width:48px;height:54px;font-size:9px}#viewbar .vb.good{width:52px}#viewbar .vb svg{width:26px;height:26px;padding:4px}}
@media (max-height:520px){#viewbar .vb{width:46px;height:42px}#viewbar .vb span{display:none}#viewbar .vb svg{width:26px;height:26px;padding:4px}#viewbar .vb.good{width:46px}}
#sPrint{--c:#2FA89A}
@media (min-aspect-ratio:5/4) and (min-height:521px){#sPrint{background-color:#2FB5A5;box-shadow:0 6px 0 #1B7D72,0 10px 14px rgba(10,80,70,.3)}.srow{display:contents}}

@media (max-aspect-ratio:5/4),(max-width:760px){.sbtns{gap:8px}.sbtns .btn,.srow .btn{min-height:44px;padding:0 14px;font-size:15px;gap:6px;white-space:nowrap}.btn.big{min-height:44px}.sbtns .btn svg{width:20px;height:20px}.srow{gap:8px;flex-wrap:wrap}.panel{padding-top:14px}.panel .biglogo{width:min(150px,36vw,16vh)}}

/* ===== touch lock: the page is fixed like a game screen ===== */
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100%;width:100%;overflow:hidden;position:relative}
@supports (height:100dvh){#app{height:100dvh}}
#stage{touch-action:none}
#tools,.mbody,#chooseWrap,#rightcol,.panel,.wgrid,.olist{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
@media (max-aspect-ratio:5/4),(max-width:760px){#tools{touch-action:pan-x}}
.wtabs{touch-action:pan-x}

</style>

<script>
/* ---- 01-util.js ---- */
'use strict';
/* Utilities, tweens, particles, labels (no DOM access at load time) */
const TAU = Math.PI * 2;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  bounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
};

/* color helpers */
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function shade(c, amt) { return amt >= 0 ? mix(c, '#ffffff', amt) : mix(c, '#000000', -amt); }
function rgba(c, a) { const [r, g, b] = hex2rgb(c); return `rgba(${r},${g},${b},${a})`; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

/* tweens */
const Tw = {
  list: [],
  to(obj, props, dur, easing, cb, delay) {
    const t = { obj, props, dur: dur * 1000, e: easing || ease.out, cb, t: -(delay || 0) * 1000, from: {} };
    this.list.push(t); return t;
  },
  after(sec, fn) { this.list.push({ wait: true, t: 0, dur: sec * 1000, cb: fn }); },
  step(dtMs) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const t = this.list[i]; if (!t) continue; t.t += dtMs;
      if (t.t < 0) continue;
      if (t.wait) { if (t.t >= t.dur) { this.list.splice(i, 1); t.cb && t.cb(); } continue; }
      if (!t.started) { t.started = true; for (const k in t.props) t.from[k] = t.obj[k]; }
      const p = clamp(t.t / t.dur, 0, 1), e = t.e(p);
      for (const k in t.props) t.obj[k] = lerp(t.from[k], t.props[k], e);
      if (p >= 1) { const j = this.list.indexOf(t); if (j >= 0) this.list.splice(j, 1); t.cb && t.cb(); }
    }
  },
  clear() { this.list.length = 0; }
};

/* screen-space particles and floating word labels */
const FX = {
  p: [], labels: [],
  add(o) { this.p.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, t: 0, r: 4, color: '#fff', kind: 'dot', rot: 0, vr: 0, drag: 0, a: 1 }, o)); },
  burst(x, y, colors, n, power) {
    n = n || 14; power = power || 1;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(40, 180) * power;
      this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, g: 380, life: rnd(.5, 1.1), r: rnd(2, 5), color: pick(colors), kind: Math.random() < .5 ? 'dot' : 'sq', vr: rnd(-8, 8) });
    }
  },
  sparkle(x, y, n, color) {
    for (let i = 0; i < (n || 6); i++) {
      this.add({ x: x + rnd(-14, 14), y: y + rnd(-14, 14), vx: rnd(-20, 20), vy: rnd(-40, -10), life: rnd(.5, 1), r: rnd(3, 7), color: color || '#fff6c8', kind: 'star', vr: rnd(-3, 3) });
    }
  },
  firework(x, y, color, n) {
    n = n || 46; const pal = [color, '#FFFFFF', '#FFE7A0'];
    for (let i = 0; i < n; i++) { const a = i / n * TAU + rnd(-.1, .1), s = rnd(90, 250); this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 130, life: rnd(1, 1.7), r: rnd(2.2, 4.6), color: pick(pal), kind: i % 3 ? 'dot' : 'star', drag: 1.1, vr: rnd(-4, 4) }); }
  },
  puff(x, y, color, n) {
    for (let i = 0; i < (n || 8); i++) this.add({ x: x + rnd(-8, 8), y: y + rnd(-4, 4), vx: rnd(-30, 30), vy: rnd(-50, -15), life: rnd(.5, .9), r: rnd(6, 14), color: color || '#ffffff', kind: 'puff', drag: 1.5 });
  },
  confetti(w, h, n) {
    const cols = ['#FF4F7B', '#FFB0CA', '#FFD43B', '#4FDDB0', '#4DB4FF', '#FF9F43', '#fff'];
    for (let i = 0; i < n; i++) this.add({ x: rnd(0, w), y: rnd(-h * .3, 0), vx: rnd(-40, 40), vy: rnd(60, 200), g: 120, life: rnd(2.2, 4), r: rnd(3, 7), color: pick(cols), kind: i % 4 === 0 ? 'star' : 'sq', vr: rnd(-8, 8) });
  },
  label(text, x, y, opt) { if (typeof Settings !== 'undefined' && Settings.labels === false) return; this.labels = this.labels.filter(l => l.text !== text); this.labels.push(Object.assign({ text, x, y, t: 0, life: 2.2, vy: -22 }, opt || {})); if (this.labels.length > 4) this.labels.shift(); },
  step(dt) {
    dt = Math.min(dt, .05);
    for (let i = this.p.length - 1; i >= 0; i--) {
      const q = this.p[i]; q.t += dt;
      if (q.t >= q.life) { this.p.splice(i, 1); continue; }
      q.vy += q.g * dt; if (q.drag) { const d = Math.max(0, 1 - q.drag * dt); q.vx *= d; q.vy *= d; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    }
    for (let i = this.labels.length - 1; i >= 0; i--) {
      const l = this.labels[i]; l.t += dt; l.y += l.vy * dt * (1 - l.t / l.life);
      if (l.t >= l.life) this.labels.splice(i, 1);
    }
  },
  draw(ctx) {
    for (const q of this.p) {
      const k = q.t / q.life, a = q.a * (k < .7 ? 1 : 1 - (k - .7) / .3);
      ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillStyle = q.color;
      if (q.kind === 'sq') ctx.fillRect(-q.r, -q.r * .6, q.r * 2, q.r * 1.2);
      else if (q.kind === 'star') { ctx.beginPath(); for (let i = 0; i < 8; i++) { const rr = i % 2 ? q.r * .35 : q.r; const an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } ctx.closePath(); ctx.fill(); }
      else if (q.kind === 'puff') { ctx.globalAlpha *= .6; ctx.beginPath(); ctx.arc(0, 0, q.r * (1 + k * .8), 0, TAU); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, q.r, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
    for (const l of this.labels) {
      const k = l.t / l.life, a = k < .12 ? k / .12 : k > .75 ? 1 - (k - .75) / .25 : 1;
      ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.font = '600 15px Lexend, sans-serif';
      const w = ctx.measureText(l.text).width + 22, h = 28, x = l.x - w / 2, y = l.y - h / 2;
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + 2, y + 3, w, h);
      ctx.fillStyle = '#FFF7EC'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#4B2A18'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#4B2A18'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l.text, l.x, l.y + 1);
      ctx.restore();
    }
  },
  clear() { this.p.length = 0; this.labels.length = 0; }
};

/* small vector helpers for the 3D house */
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  rot(v, ax, ang) { // Rodrigues
    const c = Math.cos(ang), s = Math.sin(ang), d = V.dot(ax, v), x = V.cross(ax, v);
    return [v[0] * c + x[0] * s + ax[0] * d * (1 - c), v[1] * c + x[1] * s + ax[1] * d * (1 - c), v[2] * c + x[2] * s + ax[2] * d * (1 - c)];
  }
};

/* number words and grammar helpers */
const NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const numWord = n => n <= 12 ? NUMW[n] : String(n);
const aAn = w => /^[aeiou]/i.test(w) ? 'an' : 'a';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

'use strict';
/* All sound effects are made in code with the Web Audio API. No audio files. No voice. */
const Snd = {
  ctx: null, master: null, muted: store.get('muted', false), last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : .8;
      const comp = this.ctx.createDynamicsCompressor(); this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 1.2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nbuf = buf;
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) { this.muted = m; store.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : .8; },
  ok() { return this.ctx && !this.muted; },
  throttle(name, ms) { const n = performance.now(); if (this.last[name] && n - this.last[name] < ms) return false; this.last[name] = n; return true; },
  tone(f, dur, type, vol, slide, delay, attack) {
    if (!this.ok()) return; const c = this.ctx, t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || .2, t0 + (attack || .008));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + .05);
  },
  noise(dur, ftype, f0, f1, vol, delay, q) {
    if (!this.ok() || !this.nbuf) return; const c = this.ctx, t0 = c.currentTime + (delay || 0);
    const s = c.createBufferSource(); s.buffer = this.nbuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = ftype || 'bandpass'; f.frequency.setValueAtTime(f0, t0); if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur); f.Q.value = q || 1;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || .2, t0 + Math.min(.02, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0, Math.random() * .5); s.stop(t0 + dur + .05);
  },
  click() { if (this.throttle('click', 40)) { this.tone(900, .05, 'triangle', .09, 600); } },
  roll() { if (!this.throttle('roll', 90)) return; this.noise(.22, 'bandpass', 220, 340, .22, 0, 1.2); this.tone(70, .12, 'sine', .12, 55); },
  pop() { this.tone(520, .12, 'sine', .3, 150); this.noise(.05, 'highpass', 2500, 0, .12); this.tone(90, .1, 'sine', .2, 60, .02); },
  oven() { this.noise(.25, 'lowpass', 500, 160, .3); this.tone(150, .25, 'sawtooth', .06, 95); this.tone(80, .15, 'square', .1, 50, .22); this.noise(.1, 'bandpass', 1800, 900, .08, .25, 4); },
  ding() { [0, .38].forEach(d => { this.tone(1568, .9, 'sine', .22, 0, d); this.tone(2093, .7, 'sine', .1, 0, d); this.tone(3136, .4, 'sine', .05, 0, d); }); },
  squeeze() { if (!this.throttle('squeeze', 110)) return; this.noise(.14, 'bandpass', 700 + Math.random() * 300, 450, .16, 0, 2.5); this.tone(180 + Math.random() * 60, .1, 'sine', .05, 120); },
  plop() { this.tone(460 + Math.random() * 80, .14, 'sine', .28, 160); this.noise(.04, 'bandpass', 1500, 0, .06, 0, 2); },
  clink() { const f = 2200 + Math.random() * 800; this.tone(f, .22, 'sine', .12); this.tone(f * 1.51, .16, 'sine', .07, 0, .01); },
  thud() { this.tone(110, .18, 'sine', .35, 48); this.noise(.1, 'lowpass', 600, 200, .22); },
  crack() { [0, .07, .13].forEach((d, i) => this.noise(.05 + i * .02, 'highpass', 2200 - i * 500, 0, .26 - i * .05, d, .8)); this.tone(220, .3, 'triangle', .07, 90, .1); },
  snow() { this.noise(.5, 'highpass', 4500, 2500, .09, 0, .6); this.noise(.35, 'bandpass', 6500, 3500, .05, .08, 1.5); },
  chime() { [0, .07, .15, .24, .34].forEach((d, i) => { const f = [3520, 4186, 3136, 4699, 3951][i]; this.tone(f, .5, 'sine', .08, 0, d); this.tone(f * 1.5, .3, 'sine', .03, 0, d); }); },
  oops() { this.tone(420, .22, 'triangle', .18, 330); this.tone(330, .3, 'triangle', .16, 220, .18); },
  wobble() { if (!this.throttle('wob', 250)) return; this.tone(300, .3, 'sine', .08, 360); this.tone(150, .3, 'triangle', .05, 120); },
  whoosh() { this.noise(.25, 'bandpass', 500, 2200, .08, 0, .8); },
  tick() { this.tone(1800, .03, 'square', .04); },
  shutter() { this.noise(.04, 'highpass', 3000, 0, .25); this.noise(.06, 'bandpass', 1500, 0, .2, .06, 2); this.tone(1200, .03, 'square', .05, 0, .02); },
  door() { this.tone(180, .35, 'sawtooth', .05, 260); this.tone(90, .25, 'sine', .15, 70, .2); },
  fanfare() {
    const n = [[523, 0], [659, .14], [784, .28], [1047, .42], [784, .62], [1047, .76], [1319, 1.0]];

  }
};

'use strict';
/* Touch lock for tablets: the page never zooms, slides left or right, or bounces.
   Only the areas that really need to scroll (tool list, dialogs, word lists) can scroll. */
(function () {
  const meta = document.querySelector('meta[name=viewport]');
  const LOCK = 'width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover';
  if (meta) meta.setAttribute('content', LOCK);
  const SCROLLERS = '#tools,.mbody,#chooseWrap,#rightcol,.panel,.wgrid,.wtabs,textarea,.olist,#colors';
  const inScroller = el => !!(el && el.closest && el.closest(SCROLLERS));
  // 1. no pinch zoom (Safari gesture events), no two-finger moves, no page drag outside the scroll areas
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if ((e.touches && e.touches.length > 1) || !inScroller(e.target)) e.preventDefault(); }, { passive: false });
  // 2. long-press menus and text selection stay off the game
  document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('textarea,input'))) e.preventDefault(); });
  // 3. if anything still moves the page, put it straight back
  const home = () => {
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    const se = document.scrollingElement; if (se) { se.scrollLeft = 0; se.scrollTop = 0; }
    document.body.scrollLeft = 0; document.body.scrollTop = 0; const app = document.getElementById('app'); if (app) { app.scrollLeft = 0; app.scrollTop = 0; }
  };
  window.addEventListener('scroll', home, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(home, 200));
  document.addEventListener('focusout', () => setTimeout(home, 60));
  const vv = window.visualViewport;
  if (vv) {
    const fix = () => { if (vv.scale > 1.001 && meta) { meta.setAttribute('content', LOCK + ', shrink-to-fit=no'); meta.setAttribute('content', LOCK); } home(); };
    vv.addEventListener('resize', fix); vv.addEventListener('scroll', fix);
  }
  window.__touchLock = { home, LOCK };
})();

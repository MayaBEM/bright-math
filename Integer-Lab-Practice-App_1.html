/* ===========================================================
   INTEGER LAB
   Concept: a premium maths workbook redrawn as a study desk —
   ruled paper, hairline rules, ink-navy cover panels, one
   terracotta accent and antique gold for anything earned.
   =========================================================== */
:root{
  /* surfaces */
  --paper:#FFFCF6;
  --ivory:#F6F1E6;
  --ivory-2:#EFE8D9;
  /* ink */
  --ink:#14283A;
  --ink-2:#4A5C6E;
  --ink-3:#8B94A0;
  --ink-inv:#FBF6EA;
  /* accents */
  --clay:#C4553A;
  --clay-d:#A23F27;
  --clay-w:#F7E8E1;
  --teal:#1F6960;
  --teal-w:#DFEDE9;
  --gold:#A9812B;
  --gold-w:#F7EEDA;
  /* rules */
  --line:#E4DAC7;
  --line-2:#D0C2A8;
  --line-3:#BCA983;
  /* semantic */
  --ok:#256B4C;
  --ok-w:#E2F0E7;
  --no:#B33F33;
  --no-w:#FAE7E3;
  /* shape */
  --r-lg:16px;
  --r:10px;
  --r-sm:6px;
  --sh-1:0 1px 2px rgba(20,40,58,.05);
  --sh-2:0 1px 1px rgba(20,40,58,.04), 0 8px 24px -12px rgba(20,40,58,.18);
  --sh-3:0 2px 4px rgba(20,40,58,.05), 0 22px 48px -22px rgba(20,40,58,.28);
  --font-d:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-b:"Figtree","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--ivory);
  color:var(--ink);
  font-family:var(--font-b);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  position:relative;
}
/* ruled-paper texture + warm light, fixed behind everything */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 70% at 12% -10%, rgba(255,255,255,.85), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(to bottom, rgba(20,40,58,.035) 0 1px, transparent 1px 34px);
}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.012em}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}
ul{margin:.5em 0 .9em;padding-left:1.15em}
li{margin:.3em 0}
b,strong{font-weight:700;color:var(--ink)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit}
::selection{background:var(--gold-w)}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:3px}

.wrap{max-width:1010px;margin:0 auto;padding:0 26px}
.math{font-variant-numeric:tabular-nums lining-nums;font-weight:700;letter-spacing:0;white-space:nowrap}
.eyebrow{
  display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;
  color:var(--clay-d);
}
.eyebrow::after{content:"";display:block;width:26px;height:2px;background:var(--clay);margin-top:7px}
.lbl-sm{font-size:.67rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:rgba(246,241,230,.88);
  backdrop-filter:saturate(1.15) blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-d);font-weight:600;font-size:1.02rem;letter-spacing:-.01em}
.mark{
  width:32px;height:32px;border-radius:8px;flex:none;
  background:var(--ink);color:var(--ink-inv);
  display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--font-b);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.top-sp{flex:1}
.top-back{
  border:1px solid var(--line-2);background:transparent;color:var(--ink-2);
  padding:8px 15px;border-radius:var(--r-sm);font-weight:600;font-size:.85rem;
  transition:border-color .15s,color .15s,background .15s;
}
.top-back:hover{border-color:var(--ink-3);color:var(--ink);background:var(--paper)}
.top-prog{font-size:.82rem;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.top-prog b{color:var(--ink);font-weight:700}

/* ---------- buttons ---------- */
.btn{
  border:1px solid transparent;border-radius:var(--r);padding:13px 24px;font-weight:700;font-size:.98rem;
  letter-spacing:-.005em;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--clay);color:#fff;box-shadow:var(--sh-2)}
.btn-primary:hover{background:var(--clay-d)}
.btn-dark{background:var(--ink);color:var(--ink-inv);box-shadow:var(--sh-2)}
.btn-dark:hover{background:#0C1D2C}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink);background:var(--paper)}
.btn-quiet{background:transparent;border:none;color:var(--ink-2);padding:13px 6px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line-3)}
.btn-quiet:hover{color:var(--ink);text-decoration-color:var(--clay)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-dark:disabled,.btn-primary:disabled{opacity:1;background:transparent;color:var(--ink-3);border-color:var(--line-2)}
.btn-sm{padding:9px 16px;font-size:.86rem}

/* ---------- hero ---------- */
.hero{
  display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center;
  padding:64px 0 52px;
}
.hero h1{font-size:clamp(2.2rem,4.2vw,3rem);margin:20px 0 0;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--clay)}
.hero .lede{font-size:1.06rem;color:var(--ink-2);margin-top:18px;max-width:44ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;align-items:center}
.hero-meta{display:flex;flex-wrap:wrap;gap:0;margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
.hero-meta div{padding-right:26px;margin-right:26px;border-right:1px solid var(--line)}
.hero-meta div:last-child{border-right:none;padding-right:0;margin-right:0}
.hero-meta .n{font-family:var(--font-d);font-size:1.5rem;font-weight:600;display:block;line-height:1.1}
.hero-meta .t{font-size:.76rem;color:var(--ink-3);font-weight:600;letter-spacing:.04em}

/* cover panel — a real teaching preview, not decoration */
.cover{
  background:var(--ink);color:var(--ink-inv);border-radius:var(--r-lg);padding:26px 26px 22px;
  box-shadow:var(--sh-3);position:relative;overflow:hidden;
}
.cover::after{
  content:"";position:absolute;inset:8px;border:1px solid rgba(251,246,234,.14);border-radius:10px;pointer-events:none;
}
.cover .ct{font-size:.66rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--gold-w);opacity:.85}
.cover .cq{font-family:var(--font-d);font-size:1.7rem;margin:10px 0 2px;color:#fff;letter-spacing:-.01em}
.cover .cnl{margin:8px 0 2px}
.cover .nl{overflow:visible;margin:0}
.cover .nl svg{width:100%;height:auto;max-width:100%;margin:0}
.cover .cc{font-size:.82rem;color:#AEC0CE;margin-top:2px}
.cover .rules{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(251,246,234,.15)}
.cover .rule-chip{
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:rgba(251,246,234,.06);border:1px solid rgba(251,246,234,.1);border-radius:var(--r-sm);
  padding:9px 6px;font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums;color:#B9CAD7;
}
.cover .rule-chip .eqr{color:var(--gold-w);font-weight:700;font-size:.95rem}
.cover .rule-chip.pos .eqr{color:#8FD3B6}
.cover .rule-chip.neg .eqr{color:#F0A08C}

/* ---------- section heads ---------- */
.sec-head{display:flex;align-items:baseline;gap:16px;margin:52px 0 6px}
.sec-head h2{font-size:1.42rem}
.sec-head .rule{flex:1;height:1px;background:var(--line-2)}
.sec-head .hint{font-size:.82rem;color:var(--ink-3);font-weight:600;white-space:nowrap}

/* ---------- curriculum map (home) ---------- */
.curric{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.crow{
  display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:20px;
  width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:20px 12px 20px 4px;position:relative;
  transition:background .16s,padding .16s;
}
.crow::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--clay);
  transform:scaleY(0);transform-origin:center;transition:transform .18s ease;
}
.crow:hover{background:var(--paper);padding-left:12px}
.crow:hover::before{transform:scaleY(1)}
.cnum{
  font-family:var(--font-d);font-size:1.85rem;font-weight:600;color:var(--line-3);
  font-variant-numeric:lining-nums;line-height:1;transition:color .16s;
}
.crow:hover .cnum{color:var(--clay)}
.crow.guide .cnum{color:var(--gold)}
.cbody{min-width:0}
.cbody h3{font-size:1.24rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cbody p{font-size:.95rem;color:var(--ink-2);margin:3px 0 0}
.cmeta{margin-top:9px;font-size:.79rem;color:var(--ink-3);font-weight:600;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.cmeta .dot{color:var(--line-3)}
.tag-start{
  font-family:var(--font-b);font-size:.64rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold);background:var(--gold-w);border-radius:3px;padding:3px 8px;
}
.pill-done{
  background:var(--ok-w);color:var(--ok);border-radius:3px;padding:3px 9px;font-size:.76rem;font-weight:700;
}
.cgo{
  font-size:.86rem;font-weight:700;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:7px;
  transition:color .16s,gap .16s;
}
.crow:hover .cgo{color:var(--clay);gap:11px}
.cgo .arw{font-size:1.05rem;line-height:1}
.difficulty{display:flex;gap:3px;margin-top:10px}
.difficulty i{width:16px;height:3px;border-radius:2px;background:var(--line-2)}
.difficulty i.on{background:var(--clay)}

/* ---------- footer ---------- */
.foot{
  margin:60px 0 44px;padding-top:20px;border-top:1px solid var(--line);
  font-size:.82rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.linkbtn{background:none;border:none;padding:0;color:var(--ink-3);font-size:inherit;font-weight:600;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.linkbtn:hover{color:var(--ink-2);text-decoration-color:var(--ink-3)}

/* ---------- page head ---------- */
.page-head{padding:44px 0 4px;max-width:62ch}
.page-head h1{font-size:clamp(2rem,4.4vw,2.75rem);margin-top:18px}
.page-head .lede{color:var(--ink-2);margin-top:14px;font-size:1.03rem}

/* ---------- guide ---------- */
.gstep{
  display:grid;grid-template-columns:74px 1fr;gap:8px;
  padding:38px 0 34px;border-top:1px solid var(--line);
}
.gstep:first-of-type{border-top:none;padding-top:22px}
.gs-num{
  font-family:var(--font-d);font-size:2.1rem;font-weight:600;color:var(--line-3);line-height:1;
  font-variant-numeric:lining-nums;padding-top:2px;
}
.gs-body{min-width:0}
.gs-body h3{font-size:1.4rem;margin:0 0 12px}
.gs-body>p,.gs-body>ul{max-width:64ch}
.example{
  background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:0 var(--r) var(--r) 0;padding:20px 22px;margin-top:20px;box-shadow:var(--sh-1);
}
.example .lbl{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.example .q{font-size:1.5rem;margin:8px 0 14px;font-family:var(--font-b);font-weight:700;font-variant-numeric:tabular-nums}
.example ol{margin:0;padding-left:1.25em;color:var(--ink-2);font-size:.95rem}
.example li{margin:.35em 0}
.example .a{
  margin-top:14px;font-size:1.1rem;color:var(--teal);border-top:1px solid var(--line);padding-top:12px;
  display:block;font-weight:700;font-variant-numeric:tabular-nums;
}
.box{border-radius:var(--r);padding:17px 20px;margin-top:20px;font-size:.94rem;border:1px solid transparent}
.box .bt{font-weight:700;display:block;margin-bottom:3px;letter-spacing:-.005em}
.box-key{background:var(--gold-w);border-color:#EBDDBB;color:#6E5416}
.box-warn{background:var(--no-w);border-color:#F0CFC8;color:#8B3227}
.box-tip{background:var(--teal-w);border-color:#C9E0DA;color:#164F48}
.box b{color:inherit}

.signtab{width:100%;border-collapse:collapse;margin-top:18px;font-size:.95rem}
.signtab th{
  text-align:left;font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);
  padding:0 14px 9px 0;font-weight:700;border-bottom:1px solid var(--line-2);
}
.signtab td{padding:11px 14px 11px 0;border-bottom:1px solid var(--line)}
.signtab tr:last-child td{border-bottom:none}
.signtab td:first-child{font-weight:700;font-size:1.08rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.signtab td:nth-child(2){font-weight:700;color:var(--clay);font-size:1.08rem;width:1%;text-align:center}
.signtab td:last-child{color:var(--ink-2);font-variant-numeric:tabular-nums}

/* number line */
.nl{margin:22px 0 6px;max-width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.nl svg{display:block;width:auto;height:auto;max-width:none;margin:0}
.nl-cap{font-size:.87rem;color:var(--ink-2);font-weight:600;margin-top:6px;padding-left:2px;border-left:2px solid var(--line-2);padding-left:10px}
.nlx{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin-top:20px;box-shadow:var(--sh-1);
}
.nlx-ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-weight:600;color:var(--ink-2)}
.nlx-ctrl select{
  font-family:var(--font-b);font-weight:700;font-size:1rem;padding:8px 10px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--ivory);color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.nlx-ctrl select:hover{border-color:var(--ink-3)}
.nlx-out{font-size:1.3rem;color:var(--teal);font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- quiz ---------- */
.qhead{padding:36px 0 0}
.qhead .kick{display:flex;align-items:center;gap:10px;font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--clay-d)}
.qhead h2{font-size:1.55rem;margin:8px 0 18px}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.steps i{
  flex:1 1 auto;height:4px;min-width:6px;border-radius:2px;background:var(--line-2);
  transition:background .25s ease;
}
.steps i.ok{background:var(--teal)}
.steps i.no{background:var(--clay)}
.steps i.now{background:var(--ink)}
.stepline{display:flex;align-items:center;gap:16px}
.stepline .steps{flex:1}
.stepline .cnt{font-size:.8rem;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

.qcard{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:34px 36px;margin:20px 0;box-shadow:var(--sh-2);position:relative;overflow:hidden;
  animation:rise .3s cubic-bezier(.2,.7,.3,1);
}
.qcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--clay);opacity:.9}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qnum{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qlabel{color:var(--ink);font-weight:700;font-size:1.02rem;margin:9px 0 0;letter-spacing:-.005em}
.qtext{font-size:1.13rem;margin:8px 0 0;color:var(--ink-2)}
.qtext b{color:var(--ink)}
.slate{
  margin:18px 0 0;background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 22px;text-align:center;
}
.qbig{font-size:clamp(2rem,5.6vw,2.7rem);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.qnote{font-size:.92rem;color:var(--ink-2);margin-top:10px}

.answer{margin-top:24px}
.ansrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ansrow .eq{font-size:1.55rem;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
input.ans{
  width:180px;font-size:1.6rem;font-weight:700;text-align:center;padding:11px 12px;
  border:1px solid var(--line-2);border-bottom-width:3px;border-radius:var(--r-sm);
  background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;
  transition:border-color .15s,background .15s;
}
input.ans::placeholder{color:var(--line-3)}
input.ans:focus{outline:none;border-color:var(--clay);background:#fff}
input.ans.good{border-color:var(--ok);background:var(--ok-w);color:var(--ok)}
input.ans.bad{border-color:var(--no);background:var(--no-w);color:var(--no)}
input.ans:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.kbd-tip{font-size:.8rem;color:var(--ink-3);font-weight:600}
.kbd-tip b{background:var(--ivory-2);border-radius:3px;padding:1px 6px;font-weight:700;color:var(--ink-2)}

.opts{display:grid;gap:9px;margin-top:4px}
.opt{
  display:flex;align-items:center;gap:15px;text-align:left;width:100%;
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:15px 18px;
  font-weight:600;color:var(--ink);font-size:1.02rem;
  transition:border-color .14s,background .14s,box-shadow .14s;
}
.opt .k{
  width:27px;height:27px;flex:none;border-radius:var(--r-sm);background:var(--ivory);border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--ink-2);
}
.opt:hover:not(:disabled){background:var(--ivory);border-color:var(--ink-3)}
.opt.sel{border-color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
.opt.good{border-color:var(--ok);background:var(--ok-w);box-shadow:none}
.opt.good .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--no);background:var(--no-w);box-shadow:none}
.opt.bad .k{background:var(--no);color:#fff;border-color:var(--no)}
.opt:disabled{cursor:default}
.opt .mk{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.opt.good .mk{color:var(--ok)}
.opt.bad .mk{color:var(--no)}

/* grids: tables + pyramids */
.gwrap{overflow-x:auto;padding:8px 2px 12px;display:flex;justify-content:center}
table.gt{border-collapse:separate;border-spacing:0;margin:6px auto 0}
table.gt th,table.gt td{
  border:1px solid var(--line-2);width:82px;height:62px;text-align:center;
  font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;padding:0;
}
table.gt th{background:var(--ivory-2);color:var(--ink)}
table.gt th.op{background:var(--ink);color:var(--ink-inv);font-size:1.35rem;border-color:var(--ink)}
table.gt td{background:var(--paper)}
table.gt tr:first-child th:first-child{border-radius:var(--r-sm) 0 0 0}
table.gt tr:last-child td:last-child{border-radius:0 0 var(--r-sm) 0}
.cellin{
  width:100%;height:100%;border:none;background:transparent;text-align:center;
  font-size:1.2rem;font-weight:700;font-family:var(--font-b);color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.cellin::placeholder{color:var(--line-3)}
.cellin:focus{outline:2px solid var(--clay);outline-offset:-2px;background:#fff}
.cellin:disabled{-webkit-text-fill-color:currentColor;opacity:1}
td.good{background:var(--ok-w)!important;border-color:var(--ok)}
td.good .cellin{color:var(--ok)}
td.bad{background:var(--no-w)!important;border-color:var(--no)}
td.bad .cellin{color:var(--no)}

.pyr{margin:0 auto;display:flex;flex-direction:column-reverse;align-items:center;gap:8px;padding:6px 0 2px;min-width:320px}
.pyrow{display:flex;gap:8px;justify-content:center}
.brick{
  width:94px;height:60px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--paper);
  display:grid;place-items:center;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;
}
.brick.fixed{background:var(--ivory-2);color:var(--ink);border-color:var(--line-3)}
.brick.good{background:var(--ok-w);border-color:var(--ok)}
.brick.good .cellin{color:var(--ok)}
.brick.bad{background:var(--no-w);border-color:var(--no)}
.brick.bad .cellin{color:var(--no)}

/* feedback */
.fb{border-radius:var(--r);padding:22px 24px;margin-top:22px;animation:pop .24s cubic-bezier(.2,.7,.3,1);border:1px solid transparent}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fb-good{background:var(--ok-w);border-color:#C3DECF}
.fb-bad{background:var(--gold-w);border-color:#E9D9B4}
.fb .verdict{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.06rem;font-family:var(--font-d)}
.fb-good .verdict{color:var(--ok)}
.fb-bad .verdict{color:#8A6410}
.fb .verdict .ic{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.78rem;flex:none;font-family:var(--font-b);font-weight:700}
.fb-good .ic{background:var(--ok)}
.fb-bad .ic{background:#B5850F}
.fb .correct{margin-top:12px;font-size:1rem;color:var(--ink-2);font-weight:600}
.fb .correct b{font-size:1.3rem;color:var(--ink);font-weight:700}
.fb .why{margin-top:11px;color:var(--ink-2);font-size:.97rem;line-height:1.68;border-top:1px solid rgba(20,40,58,.09);padding-top:11px}
.fb .why b{color:var(--ink)}
.hintbox{
  background:var(--gold-w);border:1px solid #EBDDBB;border-radius:var(--r);
  padding:15px 19px;margin-top:18px;font-size:.94rem;color:#6E5416;
}
.hintbox b{color:#503C0E}

.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;align-items:center}
.actions .sp{flex:1}

.qfoot{text-align:center;font-size:.85rem;color:var(--ink-3);font-weight:600;margin:18px auto 0;max-width:52ch}

/* ---------- results ---------- */
.res{
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);
  padding:44px 34px 36px;text-align:center;margin:24px 0 0;box-shadow:var(--sh-3);position:relative;
}
.res::before{content:"";position:absolute;inset:9px;border:1px solid var(--line);border-radius:9px;pointer-events:none}
.res .rlbl{font-size:.66rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ring{margin:16px auto 4px;display:block}
.res .score{font-family:var(--font-d);font-size:clamp(2.6rem,9vw,3.7rem);line-height:1;letter-spacing:-.02em}
.res .score span{color:var(--ink-3);font-size:.42em}
.res .grade{font-family:var(--font-d);font-size:1.35rem;margin-top:12px}
.res .msg{color:var(--ink-2);margin-top:10px;max-width:46ch;margin-inline:auto;font-size:.98rem}
.res .actions{justify-content:center;margin-top:26px}

.review{margin-top:10px;border-top:1px solid var(--line)}
.rev{
  min-width:0;display:flex;gap:16px;align-items:flex-start;
  border-bottom:1px solid var(--line);padding:15px 4px;text-align:left;
}
.rev .badge{
  width:24px;height:24px;border-radius:var(--r-sm);flex:none;display:grid;place-items:center;
  font-size:.75rem;font-weight:700;color:#fff;margin-top:2px;
}
.rev.ok .badge{background:var(--ok)}
.rev.no .badge{background:var(--no)}
.rev .qq{font-weight:700;white-space:normal;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rev .aa{font-size:.89rem;color:var(--ink-2);margin-top:3px;overflow-wrap:anywhere}
.rev .aa b{color:var(--ink)}

/* ---------- answer key ---------- */
.keysec{margin-top:34px;break-inside:avoid}
.keysec h3{font-size:1.18rem;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.keylist{margin-top:0}
.keyrow{display:flex;gap:18px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.keyrow .n{font-weight:700;color:var(--ink-3);width:30px;flex:none;font-variant-numeric:tabular-nums;font-size:.85rem}
.keyrow .q{flex:1;font-weight:600;white-space:normal;overflow-wrap:anywhere;min-width:0;font-variant-numeric:tabular-nums}
.keyrow .a{font-weight:700;color:var(--teal);white-space:normal;text-align:right;max-width:42%;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

@media print{
  .top,.actions,.foot,.noprint{display:none!important}
  body{background:#fff;font-size:11.5px}
  body::before{display:none}
  .keyrow{padding:4px 2px}
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:34px;padding:42px 0 34px}
  .cover{order:2}
}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  .hero{padding:32px 0 26px;gap:28px}
  .hero .lede{font-size:1rem}
  .hero-meta div{padding-right:16px;margin-right:16px}
  .hero-meta .n{font-size:1.3rem}
  .qcard{padding:24px 20px;border-radius:var(--r)}
  .slate{padding:20px 14px}
  .gstep{grid-template-columns:1fr;gap:0;padding:30px 0 26px}
  .gs-num{font-size:1.5rem;margin-bottom:6px}
  .res{padding:32px 20px 28px}
  .crow{grid-template-columns:44px 1fr;gap:14px;padding:18px 6px 18px 4px}
  .crow .cgo{grid-column:2;justify-content:flex-start;margin-top:2px}
  .cnum{font-size:1.5rem}
  .cbody{min-width:0}
.cbody h3{font-size:1.12rem}
  .btn{padding:12px 18px}
  .btn-quiet{padding-left:0;padding-right:0}
  .actions .btn{flex:1 1 auto}
  input.ans{width:150px;font-size:1.45rem}
  table.gt th,table.gt td{width:66px;height:54px;font-size:1.05rem}
  .brick{width:78px;height:54px;font-size:1.05rem}
  .cover{padding:20px 18px 18px}
  .cover .rules{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

<script>
/* ===========================================================
   INTEGER LAB — app engine
   =========================================================== */
const MINUS = "−";
const app = document.getElementById("app");
const STORE = "integer-lab-v1";

/* ---------- helpers ---------- */
const fmt = (n) => (n < 0 ? MINUS + Math.abs(n) : String(n));
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const strip = (s) => String(s).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

function parseNum(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/[−–—]/g, "-").replace(/\s+/g, "").replace(/^\+/, "");
  if (!/^-?\d+$/.test(s)) return null;
  return parseInt(s, 10);
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
}
function save(d) {
  try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) {}
}
function markSet(id, score, total) {
  const d = load();
  d.sets = d.sets || {};
  const prev = d.sets[id] || { best: -1 };
  d.sets[id] = { best: Math.max(prev.best, score), total: total, done: true };
  save(d);
}
function markGuide() { const d = load(); d.guide = true; save(d); }

/* ---------- number line SVG ---------- */
const NL_THEME = {
  light: { axis: "#14283A", tick: "#C0B098", lab: "#8B94A0", lab0: "#14283A", arc: "#C4553A", arcLab: "#A23F27", start: "#14283A", end: "#C4553A" },
  dark:  { axis: "#8FA6B6", tick: "#4A6377", lab: "#9FB4C3", lab0: "#FBF6EA", arc: "#E0AE5A", arcLab: "#E6C489", start: "#FBF6EA", end: "#E0AE5A" },
};
function numberLine(a, b, caption, mode, theme, range) {
  const T = NL_THEME[theme === "dark" ? "dark" : "light"];
  const dark = theme === "dark";
  const FS = dark ? 15 : 14;
  const lo = Math.min(a, b), hi = Math.max(a, b);
  let min = Math.min(lo - 2, -6), max = Math.max(hi + 2, 6);
  if (max - min > 26) { min = lo - 1; max = hi + 1; }
  if (range) { min = range.min; max = range.max; }
  const step = dark ? 34 : 40, pad = dark ? 26 : 22;
  const w = (max - min) * step + pad * 2;
  const arc = mode !== "mark" && a !== b;
  const h = arc ? 100 : 52;
  const base = arc ? 68 : 20;
  const x = (n) => pad + (n - min) * step;
  let ticks = "";
  for (let n = min; n <= max; n++) {
    const big = n === 0;
    ticks += `<line x1="${x(n)}" y1="${base - (big ? 9 : 6)}" x2="${x(n)}" y2="${base + (big ? 9 : 6)}" stroke="${big ? T.axis : T.tick}" stroke-width="${big ? 2 : 1.2}"/>`;
    ticks += `<text x="${x(n)}" y="${base + 26}" text-anchor="middle" font-size="${FS}" font-weight="${big ? 700 : 500}" fill="${big ? T.lab0 : T.lab}" font-family="Figtree,system-ui,sans-serif">${fmt(n)}</text>`;
  }
  let jump = "";
  if (mode === "mark") {
    jump = `<circle cx="${x(a)}" cy="${base}" r="5" fill="${T.start}"/><circle cx="${x(b)}" cy="${base}" r="5" fill="${T.end}"/>`;
  } else if (a !== b) {
    const x1 = x(a), x2 = x(b), mid = (x1 + x2) / 2;
    const top = base - 42;
    jump = `<path d="M ${x1} ${base - 12} Q ${mid} ${top} ${x2} ${base - 12}" fill="none" stroke="${T.arc}" stroke-width="2.2" stroke-linecap="round"/>
      <polygon points="${x2},${base - 8} ${x2 - (x2 > x1 ? 7 : -7)},${base - 18} ${x2 + (x2 > x1 ? 3 : -3)},${base - 19}" fill="${T.arc}"/>
      <circle cx="${x1}" cy="${base}" r="5" fill="${T.start}"/>
      <circle cx="${x2}" cy="${base}" r="5" fill="${T.end}"/>
      <text x="${mid}" y="${top + 1}" text-anchor="middle" font-size="${FS - 0.5}" font-weight="700" fill="${T.arcLab}" font-family="Figtree,system-ui,sans-serif">${Math.abs(b - a)} ${x2 > x1 ? "RIGHT" : "LEFT"}</text>`;
  } else {
    jump = `<circle cx="${x(a)}" cy="${base}" r="5" fill="${T.end}"/>`;
  }
  return `<div class="nl"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(caption || "number line")}">
    <line x1="${pad - 12}" y1="${base}" x2="${w - pad + 12}" y2="${base}" stroke="${T.axis}" stroke-width="1.6"/>
    ${ticks}${jump}
  </svg></div>${caption ? `<p class="nl-cap">${caption}</p>` : ""}`;
}

  app.innerHTML = `${header("Home")}

/* ---------- QUESTION BUILDER (shared) ---------- */
/* opts.standalone => no next-button navigation, used in the guide warm-up */
function buildQuestion(q, idx, total, opts) {
  opts = opts || {};
  const card = el(`<div class="qcard"></div>`);
  let resolved = false;

  const head = document.createElement("div");
  head.innerHTML = `<div class="qnum">Question ${idx + 1} of ${total}</div>` +
    (q.label ? `<div class="qlabel">${q.label}</div>` : "");
  card.appendChild(head);

  const body = document.createElement("div");
  card.appendChild(body);

  const answerZone = document.createElement("div");
  answerZone.className = "answer";
  card.appendChild(answerZone);

  const fbZone = document.createElement("div");
  card.appendChild(fbZone);

  const actions = el(`<div class="actions"></div>`);
  const checkBtn = el(`<button class="btn btn-dark">Check answer</button>`);
  const hintBtn = q.hint ? el(`<button class="btn btn-ghost btn-sm">Hint</button>`) : null;
  actions.appendChild(checkBtn);
  if (hintBtn) actions.appendChild(hintBtn);
  const spacer = el(`<div class="sp"></div>`);
  actions.appendChild(spacer);
  card.appendChild(actions);

  let getState = () => ({ filled: false, correct: false, given: "" });
  let lock = () => {};
  let paint = () => {};

  /* --- numeric --- */
  if (q.type === "num") {
    body.innerHTML = /<b>|<br>/.test(q.prompt)
      ? `<div class="qtext">${q.prompt}</div>`
      : `<div class="slate"><div class="qbig math">${q.prompt}</div></div>`;
    const isWord = /<b>|<br>/.test(q.prompt);
    const isBlank = /\u25A2/.test(q.prompt);
    const isEst = /^Estimate/i.test(q.label || "");
    const lead = isWord ? "" : isBlank ? "\u25A2 =" : isEst ? "\u2248" : "=";
    const row = el(`<div class="ansrow">${lead ? `<span class="eq math">${lead}</span>` : ""}</div>`);
    const input = el(`<input class="ans" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Your answer" placeholder="?">`);
    row.appendChild(input);
    row.appendChild(el(`<span class="kbd-tip">type a negative as <b>-7</b></span>`));
    answerZone.appendChild(row);
    input.addEventListener("input", () => { checkBtn.disabled = parseNum(input.value) === null; });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); onCheck(); } });
    checkBtn.disabled = true;
    getState = () => {
      const v = parseNum(input.value);
      return { filled: v !== null, correct: v === q.ans, given: v === null ? "—" : fmt(v) };
    };
    lock = () => { input.disabled = true; };
    paint = (ok) => { const v = parseNum(input.value); if (v !== null) input.value = fmt(v); input.classList.add(ok ? "good" : "bad"); };
  }

  /* --- multiple choice --- */
  if (q.type === "mc") {
    body.innerHTML = `<div class="qtext">${q.prompt}</div>`;
    const opts = el(`<div class="opts" role="group"></div>`);
    let sel = -1;
    const btns = q.options.map((o, i) => {
      const b = el(`<button class="opt"><span class="k">${"ABCD"[i]}</span><span class="ot math">${o}</span></button>`);
      b.onclick = () => {
        if (resolved) return;
        sel = i;
        btns.forEach((x, j) => x.classList.toggle("sel", j === i));
        checkBtn.disabled = false;
      };
      opts.appendChild(b);
      return b;
    });
    answerZone.appendChild(opts);
    checkBtn.disabled = true;
    getState = () => ({ filled: sel >= 0, correct: sel === q.ans, given: sel < 0 ? "—" : q.options[sel] });
    lock = () => btns.forEach((b) => (b.disabled = true));
    paint = () => {
      btns.forEach((b, i) => {
        b.classList.remove("sel");
        if (i === q.ans) { b.classList.add("good"); b.appendChild(el(`<span class="mk">Correct</span>`)); }
        else if (i === sel) { b.classList.add("bad"); b.appendChild(el(`<span class="mk">Your answer</span>`)); }
      });
    };
  }

  /* --- grid: table or pyramid --- */
  if (q.type === "grid") {
    const inputs = [];
    if (q.note) body.innerHTML = `<div class="qnote">${q.note}</div>`;

    if (q.gridKind === "table") {
      const wrap = el(`<div class="gwrap"></div>`);
      const t = el(`<table class="gt"></table>`);
      const thead = el(`<tr></tr>`);
      thead.appendChild(el(`<th class="op math">${q.op}</th>`));
      q.cols.forEach((c) => thead.appendChild(el(`<th class="math">${fmt(c)}</th>`)));
      t.appendChild(thead);
      q.rows.forEach((r) => {
        const tr = el(`<tr></tr>`);
        tr.appendChild(el(`<th class="math">${fmt(r)}</th>`));
        q.cols.forEach((c) => {
          const td = el(`<td></td>`);
          const inp = el(`<input class="cellin" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="${strip(fmt(r))} ${q.op} ${strip(fmt(c))}" placeholder="?">`);
          const want = q.op === "+" ? r + c : r - c;
          inputs.push({ inp, want, cell: td });
          td.appendChild(inp);
          tr.appendChild(td);
        });
        t.appendChild(tr);
      });
      wrap.appendChild(t);
      answerZone.appendChild(wrap);
    } else {
      const levels = [q.bottom.slice()];
      let cur = q.bottom;
      while (cur.length > 1) {
        const nx = [];
        for (let k = 0; k < cur.length - 1; k++) nx.push(cur[k] + cur[k + 1]);
        levels.push(nx); cur = nx;
      }
      const wrap = el(`<div class="gwrap"></div>`);
      const pyr = el(`<div class="pyr"></div>`);
      levels.forEach((lv, li) => {
        const row = el(`<div class="pyrow"></div>`);
        lv.forEach((val, ii) => {
          const fixed = (q.show || []).indexOf(li + "," + ii) >= 0;
          if (fixed) {
            row.appendChild(el(`<div class="brick fixed math">${fmt(val)}</div>`));
          } else {
            const brick = el(`<div class="brick"></div>`);
            const inp = el(`<input class="cellin" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="brick row ${li + 1} position ${ii + 1}" placeholder="?">`);
            brick.appendChild(inp);
            inputs.push({ inp, want: val, cell: brick });
            row.appendChild(brick);
          }
        });
        pyr.appendChild(row);
      });
      wrap.appendChild(pyr);
      answerZone.appendChild(wrap);
    }

    const sync = () => { checkBtn.disabled = inputs.some((o) => parseNum(o.inp.value) === null); };
    inputs.forEach((o, i) => {
      o.inp.addEventListener("input", sync);
      o.inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          if (i < inputs.length - 1) inputs[i + 1].inp.focus(); else onCheck();
        }
      });
    });
    checkBtn.disabled = true;
    getState = () => ({
      filled: inputs.every((o) => parseNum(o.inp.value) !== null),
      correct: inputs.every((o) => parseNum(o.inp.value) === o.want),
      given: inputs.map((o) => (parseNum(o.inp.value) === null ? "—" : fmt(parseNum(o.inp.value)))).join(", "),
    });
    lock = () => inputs.forEach((o) => (o.inp.disabled = true));
    paint = () => inputs.forEach((o) => {
      const v = parseNum(o.inp.value);
      const ok = v === o.want;
      if (v !== null) o.inp.value = fmt(v);
      o.cell.classList.add(ok ? "good" : "bad");
    });
    card._correctText = () => inputs.map((o) => fmt(o.want)).join(", ");
  }

  if (hintBtn) {
    hintBtn.onclick = () => {
      if (card.querySelector(".hintbox")) return;
      fbZone.appendChild(el(`<div class="hintbox"><b>Hint:</b> ${q.hint}</div>`));
      hintBtn.disabled = true;
    };
  }

  function correctText() {
    if (q.type === "num") return fmt(q.ans);
    if (q.type === "mc") return q.options[q.ans];
    return card._correctText();
  }

  function onCheck() {
    if (resolved) { if (card._onNext) card._onNext(); return; }
    const st = getState();
    if (!st.filled) return;
    resolved = true;
    lock(); paint(st.correct);
    if (hintBtn) hintBtn.disabled = true;
    const hb = card.querySelector(".hintbox"); if (hb) hb.remove();
    fbZone.appendChild(el(`<div class="fb ${st.correct ? "fb-good" : "fb-bad"}">
      <div class="verdict"><span class="ic">${st.correct ? "&#10003;" : "!"}</span>${st.correct ? "Correct" : "Not quite"}</div>
      <div class="correct math">${q.type === "grid" ? "Answers" : "Answer"}: <b>${correctText()}</b></div>
      <div class="why">${q.why}</div>
    </div>`));
    card._record = st;
    if (card._onResolved) card._onResolved(st);
    checkBtn.textContent = opts.standalone ? "Checked" : (opts.lastLabel || "Next question");
    checkBtn.disabled = !!opts.standalone;
    if (!opts.standalone) setTimeout(() => checkBtn.focus(), 30);
  }
  checkBtn.onclick = onCheck;
  card._focus = () => {
    const f = card.querySelector("input:not([disabled])");
    if (f) f.focus();
  };
  return card;
}

/* ---------- QUIZ FLOW ---------- */
let quiz = null;
function startSet(id) {
  const set = SETS.find((s) => s.id === id);
  quiz = { set: set, i: 0, records: [] };
  go({ name: "quiz" });
}

function renderQuiz() {
  const s = quiz.set, i = quiz.i, total = s.questions.length;
  const right = quiz.records.filter((r) => r.correct).length;
  const segs = s.questions.map((q, k) => {
    const rec = quiz.records[k];
    const cls = rec ? (rec.correct ? "ok" : "no") : (k === i ? "now" : "");
    return `<i class="${cls}"></i>`;
  }).join("");
  app.innerHTML = `${header("Exit", quiz.records.length ? `<b>${right}</b> of ${quiz.records.length} right` : "")}
  <main class="wrap">
    <div class="qhead">
      <div class="kick"><span>Set ${s.n}</span><span>·</span><span>${s.name}</span></div>
      <h2>${s.tagline}</h2>
      <div class="stepline"><div class="steps" aria-label="progress">${segs}</div><span class="cnt">${i + 1} / ${total}</span></div>
    </div>
    <div id="qholder"></div>
    <p class="qfoot">Check your answer to see the full working — including on the questions you get right.</p>
    <div style="height:40px"></div>
  </main>`;
  document.getElementById("backBtn").onclick = () => go({ name: "home" });

  const q = s.questions[i];
  const last = i === total - 1;
  const card = buildQuestion(q, i, total, { lastLabel: last ? "See my results" : "Next question" });
  card._onResolved = (st) => { quiz.records.push({ q: q, correct: st.correct, given: st.given }); };
  card._onNext = () => {
    if (last) { markSet(s.id, quiz.records.filter((r) => r.correct).length, total); go({ name: "results" }); }
    else { quiz.i++; renderQuiz(); }
  };
  document.getElementById("qholder").appendChild(card);
  card._focus();
}

/* ---------- RESULTS ---------- */
function renderResults() {
  const s = quiz.set, recs = quiz.records;
  const score = recs.filter((r) => r.correct).length, total = recs.length;
  const pct = Math.round((score / total) * 100);
  let grade, msg;
  if (pct === 100) { grade = "Perfect score"; msg = "Every question correct. You are ready to move on."; }
  else if (pct >= 80) { grade = "Strong work"; msg = "You have this topic well under control. Look at the questions you missed, then try the next set."; }
  else if (pct >= 60) { grade = "Getting there"; msg = "Solid progress. Read the explanations for the questions below, then run this set again."; }
  else { grade = "Keep going"; msg = "This topic takes practice. Go back to the guide, then try this set once more — the explanations below show every step."; }

  const nextSet = SETS[SETS.findIndex((x) => x.id === s.id) + 1];
  const R = 53, C = 2 * Math.PI * R;
  const review = recs.map((r, i) => `<div class="rev ${r.correct ? "ok" : "no"}">
      <span class="badge">${r.correct ? "&#10003;" : "&#10007;"}</span>
      <div><div class="qq math">${i + 1}. ${strip(r.q.prompt || r.q.label || "")}</div>
      <div class="aa">You answered <b>${esc(r.given)}</b>${r.correct ? "" : ` · correct answer <b>${esc(correctOf(r.q))}</b>`}</div></div>
    </div>`).join("");

  app.innerHTML = `${header("Home")}
  <main class="wrap">
    <div class="res">
      <div class="rlbl">Set ${s.n} · ${s.name} · complete</div>
      <svg class="ring" width="126" height="126" viewBox="0 0 126 126" role="img" aria-label="${pct} percent">
        <circle cx="63" cy="63" r="${R}" fill="none" stroke="#E4DAC7" stroke-width="9"/>
        <circle cx="63" cy="63" r="${R}" fill="none" stroke="${pct >= 60 ? "#1F6960" : "#C4553A"}" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"
          transform="rotate(-90 63 63)"/>
        <text x="63" y="70" text-anchor="middle" font-size="27" font-weight="700" fill="#14283A" font-family="Figtree,system-ui,sans-serif">${pct}%</text>
      </svg>
      <div class="score">${score}<span>/${total}</span></div>
      <div class="grade">${grade}</div>
      <p class="msg">${msg}</p>
      <div class="actions">
        ${nextSet ? `<button class="btn btn-primary" id="next">Next: Set ${nextSet.n} · ${nextSet.name}</button>` : `<button class="btn btn-primary" id="home2">Back to the route</button>`}
        <button class="btn btn-ghost" id="again">Try this set again</button>
      </div>
    </div>
    <div class="sec-head"><h2>Your answers</h2><div class="rule"></div><span class="hint">${score} of ${total} right</span></div>
    <div class="review">${review}</div>
    <div style="height:40px"></div>
  </main>`;
  document.getElementById("backBtn").onclick = () => go({ name: "home" });
  document.getElementById("again").onclick = () => startSet(s.id);
  if (nextSet) document.getElementById("next").onclick = () => startSet(nextSet.id);
  else document.getElementById("home2").onclick = () => go({ name: "home" });
}

function correctOf(q) {
  if (q.type === "num") return fmt(q.ans);
  if (q.type === "mc") return strip(q.options[q.ans]);
  if (q.gridKind === "table") {
    const out = [];
    q.rows.forEach((r) => q.cols.forEach((c) => out.push(fmt(q.op === "+" ? r + c : r - c))));
    return out.join(", ");
  }
  const levels = [q.bottom.slice()];
  let cur = q.bottom;
  while (cur.length > 1) { const nx = []; for (let k = 0; k < cur.length - 1; k++) nx.push(cur[k] + cur[k + 1]); levels.push(nx); cur = nx; }
  const out = [];
  levels.forEach((lv, li) => lv.forEach((v, ii) => { if ((q.show || []).indexOf(li + "," + ii) < 0) out.push(fmt(v)); }));
  return out.join(", ");
}

/* ---------- TEACHER ANSWER KEY ---------- */
function renderKey() {
  const sec = (title, list) => `<div class="keysec"><h3>${title}</h3><div class="keylist">` +
    list.map((q, i) => `<div class="keyrow"><span class="n">${i + 1}</span>
      <span class="q math">${strip(q.prompt || q.label || "")}${q.type === "grid" ? ` <span style="font-weight:600;color:var(--ink-3)">(${q.gridKind})</span>` : ""}</span>
      <span class="a math">${esc(correctOf(q))}</span></div>`).join("") + `</div></div>`;

  app.innerHTML = `${header("Home")}
  <main class="wrap">
    <div class="page-head">
      <span class="eyebrow">For the teacher</span>
      <h1>Answer key</h1>
      <p class="lede">All 60 questions with their answers, in order. Print it for marking, or keep it open while you teach.</p>
      <div class="actions noprint"><button class="btn btn-ghost btn-sm" id="printKey">Print this key</button></div>
    </div>
    ${sec("Warm-up check (in the guide)", WARMUP)}
    ${SETS.map((s) => sec(`Set ${s.n} · ${s.name}`, s.questions)).join("")}
    <div style="height:40px"></div>
  </main>`;
  document.getElementById("backBtn").onclick = () => go({ name: "home" });
  document.getElementById("printKey").onclick = () => window.print();
}

/* ---------- render ---------- */
function render() {
  if (view.name === "home") renderHome();
  else if (view.name === "guide") renderGuide();
  else if (view.name === "quiz") renderQuiz();
  else if (view.name === "results") renderResults();
  else if (view.name === "key") renderKey();
}
render();

</script>
</body>
</html>

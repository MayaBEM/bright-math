ect, <i>would have<\/i> + past participle.", "tag": "Conditionals"}, {"n": 12, "part": 1, "stem": "If I could travel back in time, I _____ the pyramids being built.", "opts": ["will watch", "watched", "have watched", "am watching", "would watch"], "ans": 4, "expl": "An imaginary situation = second conditional: <i>if<\/i> + past simple, <i>would<\/i> + base verb.", "tag": "Conditionals"}, {"n": 13, "part": 1, "stem": "The Great Wall of China _____ over many centuries.", "opts": ["built", "was built", "is built", "has built", "was building"], "ans": 1, "expl": "The wall receives the action and the time is finished: past simple passive <i>was built<\/i>.", "tag": "Passive voice"}, {"n": 14, "part": 1, "stem": "Many ancient objects _____ in the desert by archaeologists last year.", "opts": ["found", "are found", "have found", "were finding", "were found"], "ans": 4, "expl": "<i>Objects<\/i> receive the action and <i>last year<\/i> is finished: past simple passive, plural: <i>were found<\/i>.", "tag": "Passive voice"}, {"n": 15, "part": 1, "stem": "_____ the storm, the ship reached the harbor safely.", "opts": ["Although", "In spite of", "Because", "However", "Unless"], "ans": 1, "expl": "<i>In spite of<\/i> is followed by a noun phrase (<i>the storm<\/i>). <i>Although<\/i> needs a full clause.", "tag": "Linking words"}, {"n": 16, "part": 1, "stem": "Take a map _____ you get lost in the forest.", "opts": ["unless", "although", "despite", "in case", "as if"], "ans": 3, "expl": "<i>In case<\/i> = to be prepared for something that might happen.", "tag": "Linking words"}, {"n": 17, "part": 1, "stem": "Nobody has ever reached the bottom of the cave, _____ ?", "opts": ["haven’t they", "have they", "has he", "hasn’t anybody", "did they"], "ans": 1, "expl": "<i>Nobody<\/i> is a negative word, so the tag is positive, and we use <i>they<\/i> for it: <i>have they?<\/i>", "tag": "Question tags"}, {"n": 18, "part": 1, "stem": "Although he was injured, the climber decided to _____ and reach the top.", "opts": ["carry off", "carry out", "carry on", "carry away", "carry in"], "ans": 2, "expl": "<i>Carry on<\/i> = continue. <i>Carry out<\/i> means perform or complete a task.", "tag": "Prepositions & phrasal verbs"}, {"n": 19, "part": 1, "stem": "I wish we _____ more time at the museum; it closes in ten minutes.", "opts": ["have", "will have", "would have", "had", "are having"], "ans": 3, "expl": "<i>Wish<\/i> + past simple for an unreal present situation: <i>I wish we had more time<\/i>.", "tag": "Wish"}, {"n": 20, "part": 1, "stem": "The explorers had to take care of _____ in the wilderness.", "opts": ["themselves", "theirs", "them", "their", "themself"], "ans": 0, "expl": "The subject and the object are the same people, so we use the reflexive pronoun <i>themselves<\/i>.", "tag": "Reflexive / possessive pronouns"}, {"n": 21, "part": 2, "stem": "The explorers faced many <u>hardships<\/u>.", "opts": ["difficulties", "rewards", "celebrations", "maps", "gifts"], "ans": 0, "expl": "<i>Hardships<\/i> = <i>difficulties<\/i>.", "tag": "Synonym"}, {"n": 22, "part": 2, "stem": "The soldiers showed great <u>courage<\/u>.", "opts": ["fear", "anger", "luck", "speed", "bravery"], "ans": 4, "expl": "<i>Courage<\/i> = <i>bravery<\/i>.", "tag": "Synonym"}, {"n": 23, "part": 2, "stem": "He made a <u>remarkable<\/u> discovery.", "opts": ["boring", "amazing", "ordinary", "dangerous", "secret"], "ans": 1, "expl": "<i>Remarkable<\/i> = <i>amazing<\/i>. <i>Ordinary<\/i> is the opposite.", "tag": "Synonym"}, {"n": 24, "part": 2, "stem": "The sailors were <u>stranded<\/u> on a small island.", "opts": ["stuck", "rescued", "paid", "taught", "famous"], "ans": 0, "expl": "<i>Stranded<\/i> = left in a place with no way to leave.", "tag": "Synonym"}, {"n": 25, "part": 2, "stem": "The explorers <u>endured<\/u> terrible cold.", "opts": ["avoided", "enjoyed", "measured", "put up with", "described"], "ans": 3, "expl": "<i>Endure<\/i> = <i>put up with<\/i>.", "tag": "Synonym"}, {"n": 26, "part": 3, "stem": "", "opts": ["such", "too", "very", "so", "enough"], "ans": 3, "expl": "<i>So + adverb/adjective + that<\/i> shows a result: <i>so much that he kept going<\/i>.", "tag": "Cloze – connectors"}, {"n": 27, "part": 3, "stem": "", "opts": ["who", "which", "whose", "what", "where"], "ans": 1, "expl": "After a comma, <i>which<\/i> refers to the whole idea of visiting more than forty countries.", "tag": "Cloze – grammar"}, {"n": 28, "part": 3, "stem": "", "opts": ["has traveled", "traveled", "was traveling", "had traveled", "would travel"], "ans": 3, "expl": "<i>By the time he returned<\/i> + a completed earlier action = past perfect <i>had traveled<\/i>.", "tag": "Cloze – grammar"}, {"n": 29, "part": 3, "stem": "", "opts": ["describing", "describe", "described", "to describing", "to describe"], "ans": 4, "expl": "<i>Ask + person + to + base verb.<\/i>", "tag": "Cloze – grammar"}, {"n": 30, "part": 3, "stem": "", "opts": ["was", "is", "had been", "were", "has been"], "ans": 4, "expl": "<i>Since then<\/i> links the past to now, so we use the present perfect passive: <i>has been translated<\/i>.", "tag": "Cloze – grammar"}, {"n": 31, "part": 3, "stem": "", "opts": ["who", "whose", "that", "what", "where"], "ans": 2, "expl": "<i>That<\/i> refers to a thing (a network) and is the subject of <i>connected<\/i>.", "tag": "Cloze – grammar"}, {"n": 32, "part": 3, "stem": "", "opts": ["were brought", "brought", "are bringing", "have brought", "bring"], "ans": 0, "expl": "Gold, glass and horses receive the action in the past: past simple passive, plural.", "tag": "Cloze – grammar"}, {"n": 33, "part": 3, "stem": "", "opts": ["to", "with", "by", "for", "of"], "ans": 3, "expl": "<i>For protection<\/i> = in order to be protected.", "tag": "Cloze – grammar"}, {"n": 34, "part": 3, "stem": "", "opts": ["was", "is", "were", "been", "being"], "ans": 2, "expl": "The subject is <i>ideas and religions<\/i> (plural) and the story is in the past: <i>were exchanged<\/i>.", "tag": "Cloze – grammar"}, {"n": 35, "part": 3, "stem": "", "opts": ["become", "became", "becomes", "were become", "have became"], "ans": 1, "expl": "The story is in the past: <i>became rich<\/i>.", "tag": "Cloze – grammar"}, {"n": 36, "part": 4, "stem": "Which leg of the expedition took the longest?", "opts": ["Leg 1", "Leg 2", "Leg 3", "All took the same time", "Leg 4"], "ans": 4, "expl": "Leg 4 has the tallest bar (21 days).", "tag": "Chart reading"}, {"n": 37, "part": 4, "stem": "How many days did the whole expedition take?", "opts": ["48 days", "54 days", "60 days", "58 days", "66 days"], "ans": 2, "expl": "12 + 18 + 9 + 21 = <b>60<\/b> days.", "tag": "Chart reading"}, {"n": 38, "part": 4, "stem": "Which leg took exactly twice as long as Leg 3?", "opts": ["Leg 1", "Leg 4", "Leg 3", "Leg 2", "None of them"], "ans": 3, "expl": "Leg 3 took 9 days and 2 × 9 = 18, which is <b>Leg 2<\/b>.", "tag": "Chart reading"}, {"n": 39, "part": 4, "stem": "Two adults and one child visit on a Tuesday, and each person takes an audio guide. How much do they pay in total?", "opts": ["$20", "$23", "$26", "$32", "$29"], "ans": 4, "expl": "Tickets: 2 × $8 + $4 = $20. Audio guides: 3 × $3 = $9. Total = <b>$29<\/b>.", "tag": "Notices & ads"}, {"n": 40, "part": 4, "stem": "On which day is the museum closed?", "opts": ["Tuesday", "Wednesday", "Saturday", "Monday", "Sunday"], "ans": 3, "expl": "<i>Closed on Mondays.<\/i>", "tag": "Notices & ads"}, {"n": 41, "part": 5, "stem": "On which days can school groups visit the exhibition?", "opts": ["Every day of the week", "From Tuesday to Friday", "Only on weekends", "From Monday to Thursday", "Only on Fridays"], "ans": 1, "expl": "<i>School groups may visit Tuesday to Friday only.<\/i>", "tag": "Reading – detail"}, {"n": 42, "part": 5, "stem": "Which school group can book a visit?", "opts": ["A class of 30 students that books three weeks ahead for a Wednesday visit", "A class of 12 students that books three weeks ahead", "A class of 45 students that books a month ahead", "A class of 30 students that books one week ahead", "A class of 30 students that wants to visit on a Saturday"], "ans": 0, "expl": "Groups must have 15–40 students, book at least two weeks ahead, and visit Tuesday–Friday. Only the 30-student class booking three weeks ahead for a Wednesday meets <b>all<\/b> the rules.", "tag": "Reading – inference"}, {"n": 43, "part": 5, "stem": "A class of 30 students all do the papyrus workshop. How much extra do they pay in total?", "opts": ["$30", "$32", "$62", "$120", "$60"], "ans": 4, "expl": "30 students × $2 = <b>$60<\/b>.", "tag": "Reading – inference"}, {"n": 44, "part": 5, "stem": "How many teachers can enter free with a class of 30 students?", "opts": ["1", "2", "3", "4", "30"], "ans": 2, "expl": "One teacher is free for every 10 students: 30 ÷ 10 = <b>3<\/b> teachers.", "tag": "Reading – inference"}, {"n": 45, "part": 5, "stem": "Which of these is allowed in the galleries?", "opts": ["Eating lunch", "Taking photographs without flash", "Taking photographs with flash", "Touching the objects", "Bringing food"], "ans": 1, "expl": "<i>Photographs are welcome, but no flash.<\/i> Food is not allowed.", "tag": "Reading – detail"}, {"n": 46, "part": 5, "stem": "Why did Kai join the ship?", "opts": ["He wanted to become rich.", "He loved the sea.", "His father was ill.", "The captain was his uncle.", "He was running away from school."], "ans": 2, "expl": "<i>When his father fell ill, he took his place on the merchant ship.<\/i>", "tag": "Reading – detail"}, {"n": 47, "part": 5, "stem": "What happened on the twelfth day?", "opts": ["The ship reached the coast.", "The captain became ill.", "A storm tore the sail and the map was lost.", "Mr. Ren left the ship.", "The crew found treasure."], "ans": 2, "expl": "<i>A storm tore the sail and washed the captain’s map overboard.<\/i>", "tag": "Reading – detail"}, {"n": 48, "part": 5, "stem": "Why did Mr. Ren trust the compass?", "opts": ["It was made of brass.", "It was a gift from the captain.", "It always shows the right direction, even when the sea changes.", "It was newer than the map.", "It could predict storms."], "ans": 2, "expl": "<i>The sea changes, but this does not<\/i>: the compass is reliable.", "tag": "Reading – inference"}, {"n": 49, "part": 5, "stem": "How did Mr. Ren show that he trusted Kai?", "opts": ["He let Kai steer the ship.", "He gave Kai the captain’s map.", "He asked Kai to leave.", "He sent Kai to sleep.", "He taught Kai to swim."], "ans": 0, "expl": "<i>You steer. I will tell you when to turn.<\/i>", "tag": "Reading – inference"}, {"n": 50, "part": 5, "stem": "What does the last sentence suggest about Kai?", "opts": ["He wanted to go home.", "He was angry with Mr. Ren.", "He had become happy and proud of his life at sea.", "He was afraid of storms.", "He had lost the compass."], "ans": 2, "expl": "<i>He did not wish to be anywhere else<\/i> shows that he was now content.", "tag": "Reading – inference"}, {"n": 51, "part": 5, "stem": "What was the Great Pyramid built for?", "opts": ["As a school", "As a market", "As a lighthouse", "As a tomb for a pharaoh", "As a palace for slaves"], "ans": 3, "expl": "<i>Built … as a tomb for the Egyptian pharaoh Khufu.<\/i>", "tag": "Reading – detail"}, {"n": 52, "part": 5, "stem": "What did archaeologists find near the pyramid?", "opts": ["A second pyramid", "A ship made of stone", "A library full of books", "The remains of a town where the workers lived", "The tomb of every worker"], "ans": 3, "expl": "<i>The remains of a town nearby where the workers lived.<\/i>", "tag": "Reading – detail"}, {"n": 53, "part": 5, "stem": "Why do experts think the workers were well fed?", "opts": ["They wrote letters about food.", "The pharaoh told them so.", "They were very tall.", "Elephants carried their meals.", "Bakeries and cattle bones were found in their town."], "ans": 4, "expl": "<i>Bakeries, bread ovens and even the bones of cattle<\/i> suggest the workers were well fed.", "tag": "Reading – inference"}, {"n": 54, "part": 5, "stem": "Which statement is TRUE according to the passage?", "opts": ["The pyramid is exactly 4,000 years old.", "Nobody knows for certain how the blocks were lifted.", "All the workers were slaves.", "The pyramid is made of mud.", "The pyramid is still the tallest structure on Earth."], "ans": 1, "expl": "<i>Nobody knows exactly how the blocks were lifted into place.<\/i>", "tag": "Reading – detail"}, {"n": 55, "part": 5, "stem": "In paragraph 2, “remains” is closest in meaning to …", "opts": ["what is left of something", "something that is brand new", "a long story", "a kind of food", "a secret door"], "ans": 0, "expl": "<i>The remains of a town<\/i> = the parts of the town that still exist after a long time.", "tag": "Reading – vocabulary"}, {"n": 56, "part": 5, "stem": "What is the writer’s main opinion?", "opts": ["History should be removed from school.", "Dates are the most important part of history.", "Only teachers enjoy history.", "Explorers were never afraid.", "History is a very useful subject."], "ans": 4, "expl": "The first paragraph says it: <i>history is one of the most useful subjects in school<\/i>.", "tag": "Reading – main idea"}, {"n": 57, "part": 5, "stem": "Who is compared to “a driver who never looks in the mirror”?", "opts": ["A person who knows nothing about the past", "A student who loves history", "A teacher who tells stories", "An explorer at sea", "A person who drives too fast"], "ans": 0, "expl": "The comparison shows that ignoring the past is dangerous, like driving without checking behind you.", "tag": "Reading – inference"}, {"n": 58, "part": 5, "stem": "Why does the writer mention explorers who crossed oceans in tiny boats?", "opts": ["To teach how to build boats", "To show what ordinary people can achieve", "To prove that oceans are small", "To complain about modern ships", "To explain how maps are made"], "ans": 1, "expl": "<i>It makes us realize what ordinary people can achieve.<\/i>", "tag": "Reading – author’s purpose"}, {"n": 59, "part": 5, "stem": "How does the writer answer the complaint about memorizing dates?", "opts": ["By agreeing that dates should be removed", "By saying students are lazy", "By saying history is only about dates", "By blaming bad teaching rather than the subject", "By asking students to stop complaining"], "ans": 3, "expl": "<i>That is a fair criticism of bad teaching, but not of the subject itself.<\/i>", "tag": "Reading – detail"}, {"n": 60, "part": 5, "stem": "Which word best describes the writer’s attitude to history?", "opts": ["Doubtful", "Enthusiastic", "Bored", "Fearful", "Angry"], "ans": 1, "expl": "The writer praises history and gives strong, positive reasons.", "tag": "Reading – attitude & tone"}]}], "rules": {"Past perfect": "had + past participle shows the earlier of two past actions: When we arrived, the film had already started. Use it with by the time, before, after, already.", "Past perfect continuous": "had been + verb-ing shows a longer action that was in progress up to a past moment: She was tired because she had been working since dawn.", "Present perfect continuous": "have / has been + verb-ing stresses an action that started in the past and is still going on or has just stopped, with for or since: He has been practising since he was six.", "Present perfect (advanced)": "After a superlative use the present perfect with ever: the best film I have ever seen. Use just, already, yet, ever, never with have / has + past participle.", "Future perfect": "will have + past participle = finished before a future time: By 2040 they will have built …", "Future continuous": "will be + verb-ing = in progress at a future moment: At eight I will be watching TV.", "Reported speech": "Move the tense back one step (am → was, will → would, do → did) and change time words (tomorrow → the next day). Questions use normal word order with if / whether or a question word. Commands: told + person + (not) to + verb.", "Relative clauses": "who = people, which = things, whose = possession, where = places. Clauses after a comma (non-defining) cannot use that. After a preposition use whom for people.", "Gerund / infinitive": "Some verbs take -ing (avoid, enjoy, finish, mind); others take to + verb (promise, decide, hope, want). After prepositions use -ing. Remember doing = remember the past; remember to do = remember a task.", "Modals of deduction": "must be = sure it is true; can’t be = sure it is impossible; might / may be = possible. For the past: must have + past participle.", "Linking words": "despite / in spite of + noun or -ing; although / even though + clause; unless = if … not; in case = to be prepared; so … that and such a … that show a result; however shows contrast.", "Question tags": "Positive statement → negative tag, negative statement → positive tag, with the same auxiliary: You haven’t seen it, have you?", "Comparison (advanced)": "the + comparative … the + comparative (the more you practise, the better you become); much / far / a lot + comparative to strengthen; less … than for the opposite; very cannot be used before a comparative.", "Quantifiers & determiners": "each / every + singular verb; none = three or more, neither = two; either / both for two things; much / many / a few / a little by countability.", "Causative": "have / get + object + past participle = someone else does the job: We had the windows cleaned.", "Word formation": "Decide the part of speech first: after a / the / of we need a noun, after be a adjective, before a verb an adverb: courage, important, clearly, improvement.", "Present simple / S-V agreement": "Habits and facts take the present simple. A singular subject (he, she, it, each, everybody, nobody, the news) takes -s. With neither … nor, the verb agrees with the nearer subject.", "Past simple": "Finished actions with a time marker (yesterday, last week, in 1850) take the past simple. Learn the irregular forms: go–went, see–saw, ride–rode, spend–spent.", "Past continuous": "was / were + verb-ing shows an action in progress at a past moment, often interrupted by a past simple action: I was watching TV when the lights went out.", "Present continuous": "am / is / are + verb-ing for actions happening now (Listen! …) and for fixed plans.", "Present perfect (for / since)": "have / has + past participle. since + a starting point (since 2015); for + a length of time; already in statements, yet in questions and negatives.", "Future (going to / will)": "be going to for plans and for predictions from evidence (dark clouds). will for instant decisions and opinions (I think it will …).", "Used to": "used to + base verb describes a past habit that has stopped.", "Comparison": "Comparative + than (bigger, heavier, more tiring). Superlative with the (the biggest, the most interesting). as + adjective + as for equality. Irregular: good, better, best.", "Prepositions & phrasal verbs": "Learn prepositions in chunks: on + date, at + clock time, interested in, arrive at a place. Phrasal verbs have their own meaning: take off, turn down, look for, give up.", "Quantifiers & containers": "Countable: many, a few, too many, How many. Uncountable: much, a little, too much, How much. any for negatives and questions. Containers: a bottle / bar / loaf / tube / carton of.", "Reflexive / possessive pronouns": "Reflexive pronouns match the subject (myself, yourself, himself, ourselves, themselves). Possessive pronouns stand alone (mine, yours, his, hers, ours, theirs).", "Modal verbs": "A modal is followed by the base verb. must = obligation, mustn’t = forbidden, should = advice, May I …? = polite request, don’t have to = not necessary.", "Question words": "Pick the question word from the answer: person → who, place → where, time → when, reason → why, price or amount → how much, frequency → how often.", "Passive voice": "be + past participle when the subject receives the action: is spoken, was built, will be built.", "Conditionals": "If + present simple, present simple = a general fact. If + past simple, would + verb = an imaginary situation.", "There is / there are": "There is + singular or uncountable noun; there are + plural noun.", "Wish": "wish + past simple for an unreal present situation: I wish I had …, I wish I could …", "Enough / too": "adjective + enough (+ to + verb); too + adjective = more than is good.", "Adverbs": "Adverbs describe verbs: slow–slowly, good–well. Some keep the adjective form (hard, fast).", "Adverbs of frequency": "always, usually, often, sometimes, never: choose by the meaning of the whole sentence.", "Articles": "a / an for one non-specific thing (an before a vowel sound: an honest girl); the for something specific or unique (the sun, the east).", "Conjunctions": "but = contrast, so = result, because = reason, although = contrast in one sentence, in case = to be prepared, both … and …"}}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var barRO=null;
function setBarH(){var b=document.querySelector('.bar'),h=b?b.offsetHeight+6:6;document.documentElement.style.setProperty('--barh',h+'px');if(window.ResizeObserver){if(barRO)barRO.disconnect();if(b){barRO=new ResizeObserver(function(){document.documentElement.style.setProperty('--barh',(b.offsetHeight+6)+'px')});barRO.observe(b)}}}
window.addEventListener('resize',setBarH);
function applyTheme(t){var r=document.documentElement.style;if(t){r.setProperty('--tbg',t.bg);r.setProperty('--tc',t.accent);r.setProperty('--sh2',t.accent2)}else{r.removeProperty('--tbg');r.removeProperty('--tc');r.removeProperty('--sh2')}}
function bestOf(id){try{return +localStorage.getItem(KEY+'best-'+id)||0}catch(e){return 0}}
function setBest(id,v){try{if(v>bestOf(id))localStorage.setItem(KEY+'best-'+id,String(v))}catch(e){}}
function starsOf(tot,g){var n=tot>=g[0]?5:tot>=g[1]?4:tot>=g[2]?3:tot>=20?2:1,o='';for(var i=0;i<5;i++)o+=i<n?'★':'☆';return o}
var HOME_SVG='<svg class="home-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>';
function confetti(){var d=document.createElement('div');d.id='cf';var cs=['#ff5a8a','#7a6cff','#3fc43f','#3da5ff','#ff9d2e','#ffd21f'],h='';for(var i=0;i<44;i++)h+='<i style="left:'+Math.round(Math.random()*100)+'%;background:'+cs[i%6]+';animation-delay:'+(Math.random()*1.2).toFixed(2)+'s;animation-duration:'+(2.4+Math.random()*1.6).toFixed(2)+'s"></i>';d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},5200)}
var EXAM_SECONDS = 55*60;
var KEY = 'bem-atlas-'+D.build+'-';
var app = document.getElementById('app');
var S = null;          // current session
var tick = null;
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function load(id){try{var v=localStorage.getItem(KEY+id);return v?JSON.parse(v):null}catch(e){return null}}
function save(){if(!S)return;try{localStorage.setItem(KEY+S.id,JSON.stringify({mode:S.mode,answers:S.answers,flags:S.flags,elapsed:S.elapsed,submitted:S.submitted,part:S.part}))}catch(e){}}
function wipe(id){try{localStorage.removeItem(KEY+id)}catch(e){}}
function testById(id){return D.tests.filter(function(t){return t.id===id})[0]}
function fmt(sec){sec=Math.max(0,sec);var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}

/* ---------- visuals ---------- */
function svgAxes(w,h,ymax,ystep,ylabel){
  var L=52,B=40,T=44,R=20,pw=w-L-R,ph=h-T-B,s='';
  for(var v=0;v<=ymax;v+=ystep){var y=T+ph-(v/ymax)*ph;s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="var(--ink)" font-weight="700">'+v+'</text>'}
  s+='<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="2"/><line x1="'+L+'" x2="'+(w-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="2"/>';
  if(ylabel)s+='<text x="14" y="'+(T+ph/2)+'" transform="rotate(-90 14 '+(T+ph/2)+')" text-anchor="middle" font-size="12" fill="var(--muted)" font-weight="700">'+esc(ylabel)+'</text>';
  return {s:s,L:L,T:T,pw:pw,ph:ph,B:T+ph}
}
function vBar(v){
  var w=440,h=245,a=svgAxes(w,h,v.ymax,v.ystep,v.ylabel),n=v.vals.length,bw=a.pw/n*0.6,s=a.s;
  v.vals.forEach(function(val,i){var cx=a.L+a.pw/n*(i+.5),bh=val/v.ymax*a.ph;
    s+='<rect x="'+(cx-bw/2)+'" y="'+(a.B-bh)+'" width="'+bw+'" height="'+bh+'" fill="var(--chart)" stroke="var(--ink)" stroke-width="2.5"/><text x="'+cx+'" y="'+(a.B-bh-6)+'" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">'+val+'</text><text x="'+cx+'" y="'+(a.B+18)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+esc(v.labels[i])+'</text>'});
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(v.title)+'"><text x="'+w/2+'" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">'+esc(v.title)+'</text>'+s+'</svg>'
}
function vLine(v){
  var w=440,h=245,a=svgAxes(w,h,v.ymax,v.ystep,v.ylabel),n=v.vals.length,pts=[],s=a.s,dots='';
  v.vals.forEach(function(val,i){var x=a.L+a.pw/n*(i+.5),y=a.B-val/v.ymax*a.ph;pts.push(x+','+y);
    dots+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="var(--bg)" stroke="var(--ink)" stroke-width="2.5"/><text x="'+x+'" y="'+(y-11)+'" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">'+val+'</text><text x="'+x+'" y="'+(a.B+18)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+esc(v.labels[i])+'</text>'});
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--chart)" stroke-width="4" stroke-linejoin="round"/>'+dots;
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(v.title)+'"><text x="'+w/2+'" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">'+esc(v.title)+'</text>'+s+'</svg>'
}
var PIEC=['#ff5a8a','#7a6cff','#3fc43f','#3da5ff','#ff9d2e','#b07a3a'];
function vPie(v){
  var w=440,h=232,cx=110,cy=130,r=82,tot=0,a0=-Math.PI/2,s='',leg='';
  v.data.forEach(function(d){tot+=d[1]});
  v.data.forEach(function(d,i){var a1=a0+d[1]/tot*2*Math.PI,x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),big=(a1-a0)>Math.PI?1:0;
    s+='<path d="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+r+' '+r+' 0 '+big+' 1 '+x1+' '+y1+'Z" fill="'+PIEC[i%PIEC.length]+'" stroke="#111" stroke-width="2.5"/>';
    var y=70+i*30;leg+='<rect x="250" y="'+(y-12)+'" width="16" height="16" fill="'+PIEC[i%PIEC.length]+'" stroke="#111" stroke-width="2"/><text x="274" y="'+y+'" font-size="14" font-weight="700" fill="var(--ink)">'+esc(d[0])+' '+d[1]+'%</text>';a0=a1});
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(v.title)+'"><text x="'+w/2+'" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">'+esc(v.title)+'</text>'+s+leg+'</svg>'
}
function vTable(v){return '<table class="grid2"><tr>'+v.headers.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr>'+v.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table>'}
function vNotice(v){return '<div class="notice" style="--nc:'+(v.color||'#111')+'"><div class="nt">'+v.title+'</div><div class="nb">'+v.lines.map(function(l){return '<div>'+l+'</div>'}).join('')+'</div></div>'}
function visual(v){return '<div class="visual">'+({bar:vBar,line:vLine,pie:vPie,table:vTable,notice:vNotice,html:function(v){return '<div class="signs">'+v.html+'</div>'}}[v.t])(v)+'</div>'}

/* ---------- question blocks ---------- */
function qHTML(t,q,mode){ // mode: 'test' | 'review'
  var a=S.answers[q.n],flag=S.flags.indexOf(q.n)>=0,show=false,locked=false;
  if(mode==='review'){show=true;locked=true}
  else if(S.mode==='practice'&&a!=null){show=true;locked=true}
  var h='<div class="q'+(flag&&mode==='test'?' flagged':'')+'" id="q'+q.n+'"><div class="qh"><div class="qn">'+q.n+'</div><div class="stem">'+(q.stem||'<i>Choose the best word or phrase for blank '+q.n+'.</i>')+'</div>';
  if(mode==='test')h+='<button class="flagb" data-flag="'+q.n+'" aria-pressed="'+flag+'" title="Flag to review later">'+(flag?'Flagged':'Flag')+'</button>';
  h+='</div><div class="opts" role="group" aria-label="Question '+q.n+' answers">';
  q.opts.forEach(function(o,i){
    var cls='opt';
    if(show){if(i===q.ans)cls+=' right';else if(i===a)cls+=' wrong'}
    else if(a===i)cls+=' sel';
    h+='<button class="'+cls+'" data-q="'+q.n+'" data-o="'+i+'"'+(locked?' disabled':'')+' aria-pressed="'+(a===i)+'"><i>'+(i+1)+'</i><span>'+o+'</span></button>'});
  h+='</div>';
  if(show)h+=explHTML(q,a,mode==='test');
  return h+'</div>'
}
function explHTML(q,a,cheer){
  var ok=a===q.ans,ch=cheer&&a!=null?'<div class="cheer '+(ok?'res-ok':'res-no')+'">'+(ok?['Nice work!','Spot on!','You got it!','Great thinking!'][q.n%4]:'Almost! Read why, then keep going.')+'</div>':'',res=a==null?'<span class="res-no">Not answered</span>':ok?'<span class="res-ok">Correct</span>':'<span class="res-no">Not quite. You chose '+(a+1)+') '+q.opts[a]+'</span>';
  return '<div class="expl">'+ch+'<div class="ans">'+res+'<span>Answer: <b>'+(q.ans+1)+') '+q.opts[q.ans]+'</b></span><span class="pill">'+esc(q.tag)+'</span></div>'+q.expl+'</div>'
}
function blockHTML(t,b,mode){
  var qs=b.qs.map(function(n){return t.q[n]}),pane='',qh='',head=b.label||b.intro||'';
  if(b.kind==='cloze'){
    pane='<div class="passage"><h3>'+esc(b.title)+'</h3><p>'+b.text.replace(/\{(\d+)\}/g,function(m,k){var n=b.qs[+k-1],a=S.answers[n];return '<span class="blank'+(a!=null?' on':'')+'" id="bl'+n+'">'+(a!=null?(a+1):n)+'</span>'})+'</p></div>'
  }else if(b.kind==='visual'){
    pane=visual(b.visual)
  }else if(b.kind==='passage'){
    pane=(b.text?'<div class="passage">'+(b.title?'<h3>'+esc(b.title)+'</h3>':'')+b.text.split('\n\n').map(function(p){return '<p>'+p+'</p>'}).join('')+'</div>':'')+(b.visual?visual(b.visual):'')
  }
  qs.forEach(function(q){qh+=qHTML(t,q,mode)});
  if(!pane)return '<div class="block">'+qh+'</div>';
  return '<div class="block split"><div class="pane"><div class="phead"><span>'+esc(head)+'</span><button class="pmin" type="button" data-pmin="1" aria-expanded="true">Hide</button></div><div class="pbody">'+pane+'</div></div><div class="qcol">'+qh+'</div></div>'
}

/* ---------- views ---------- */
function home(){
  stopTick();S=null;applyTheme(null);
  var h='<div class="brandbar"><b>Bright EngMath</b><span>Grade 6 English</span></div><h1>'+esc(D.title)+'</h1><p class="lead">'+esc(D.lead)+'</p>'
   +'<div class="facts"><div class="fact"><b>'+D.tests.length+'</b><span>'+(D.tests.length>1?'tests':'test')+'</span></div><div class="fact"><b>60</b><span>questions each</span></div><div class="fact"><b>55</b><span>minutes</span></div><div class="fact"><b>5</b><span>parts</span></div><div class="fact"><b>'+D.tests.filter(function(t){var v=load(t.id);return v&&v.submitted}).length+'/'+D.tests.length+'</b><span>finished</span></div></div><p class="cheerhome">Pick a test, beat your best score, and read every explanation to level up.</p>';
  var curSeries=null;
  D.tests.forEach(function(t){
    if(t.series!==curSeries){if(curSeries!==null)h+='</div>';curSeries=t.series;h+='<h2 class="series">'+esc(t.series)+'</h2><div class="grid">'}
    var sv=load(t.id),n=sv?Object.keys(sv.answers).length:0,col=t.accent;
    h+='<div class="folder" style="--c:'+col+'"><section class="card"><div class="top"><div class="tile">'+t.no+'</div><div><div class="meta">'+esc(t.label)+' · '+esc(t.level)+' level</div><h2>'+esc(t.theme)+'</h2></div></div><p class="blurb">'+esc(t.blurb)+'</p>';
    if(sv)h+='<div class="saved">'+(sv.submitted?'Finished':'In progress')+' · '+n+'/60 answered</div>';
    if(bestOf(t.id))h+='<div class="bestline">Best: '+bestOf(t.id)+'/60 <span style="color:var(--tc);-webkit-text-stroke:1px var(--ink)">'+starsOf(bestOf(t.id),t.guide)+'</span></div>';
    h+='<div class="acts" style="--c:'+col+'">'
     +(sv&&!sv.submitted?'<button class="btn main" data-act="resume" data-id="'+t.id+'">Resume</button>':'')
     +(sv&&sv.submitted?'<button class="btn main" data-act="results" data-id="'+t.id+'">See results</button>':'')
     +'<button class="btn'+(sv?'':' main')+'" data-act="start" data-mode="exam" data-id="'+t.id+'">'+(sv?'Restart exam':'Start exam')+'</button><button class="btn" data-act="start" data-mode="practice" data-id="'+t.id+'">Practice mode</button></div></section></div>'});
  h+='</div><div class="howto"><div><b>Exam mode</b>55-minute timer, no hints. Answers and full explanations appear when you submit.</div><div><b>Practice mode</b>No timer. Each answer is checked right away and explained.</div><div><b>Saved on this device</b>Progress is kept in this browser, so you can close the page and come back.</div></div>'
   +'<div class="foot">© Bright EngMath · Original questions · American English · Single-classroom license · Not affiliated with any school or exam board</div>';
  app.innerHTML=h;setBarH();window.scrollTo(0,0)
}
function begin(id,mode,fresh){
  var t=testById(id),sv=fresh?null:load(id);
  S={id:id,t:t,mode:sv?sv.mode:mode,answers:sv?sv.answers:{},flags:sv?sv.flags:[],elapsed:sv?sv.elapsed:0,submitted:sv?sv.submitted:false,part:sv&&sv.part?sv.part:1,confirm:false};
  if(fresh)wipe(id);applyTheme(t);S.streak=0;
  S.t.q={};S.t.qlist.forEach(function(q){S.t.q[q.n]=q});
  if(S.submitted)return results();
  testView();startTick()
}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function startTick(){
  stopTick();if(S.mode!=='exam')return;
  tick=setInterval(function(){
    S.elapsed++;var r=EXAM_SECONDS-S.elapsed,el=$('#timer');
    if(el){el.textContent=fmt(r);el.className='timer'+(r<300?' low':'')}
    if(S.elapsed%5===0)save();
    if(r<=0){submit()}
  },1000)
}
function tabsHTML(){
  return S.t.parts.map(function(pp){var done=true;for(var n=pp.from;n<=pp.to;n++)if(S.answers[n]==null){done=false;break}
    return '<button class="tab" role="tab" data-part="'+pp.no+'" aria-selected="'+(pp.no===S.part)+'">'+pp.no+'. '+esc(pp.name)+'<small>'+pp.from+'–'+pp.to+'</small>'+(done?'<span class="ck" aria-label="complete">✓</span>':'')+'</button>'}).join('')
}
function paletteHTML(){
  return S.t.qlist.map(function(q){var a=S.answers[q.n],c='';
    if(S.mode==='practice'&&a!=null)c=a===q.ans?'ok':'no';else if(a!=null)c='done';
    if(S.flags.indexOf(q.n)>=0)c+=' flag';
    return '<button class="'+c+'" data-go="'+q.n+'" aria-label="Question '+q.n+(a!=null?', answered':'')+'">'+q.n+'</button>'}).join('')
}
function testView(){
  var t=S.t,p=t.parts[S.part-1],col=t.accent,ans=Object.keys(S.answers).length;
  var h='<div class="bar"><div class="barin" style="--c:'+col+'"><div class="t">'+esc(t.label)+'<small>'+esc(t.theme)+' · '+(S.mode==='exam'?'Exam mode':'Practice mode')+'</small></div>'
   +(S.mode==='exam'?'<div class="timer" id="timer" role="timer">'+fmt(EXAM_SECONDS-S.elapsed)+'</div>':'')
   +'<div class="meta" id="count">'+ans+'/60 answered</div>'+(S.mode==='practice'?'<span class="streak" id="streak" hidden></span>':'')+'<button class="btn" data-act="map" aria-expanded="false">Map</button><button class="btn dark" data-act="askSubmit">Submit</button><button class="btn" data-act="home">'+HOME_SVG+'Home</button></div><div class="prog" aria-hidden="true"><i id="progfill" style="width:'+Math.round(ans/60*100)+'%"></i></div>'
   +'<div class="tabs" role="tablist" style="--c:'+col+'">'+tabsHTML()+'</div></div>';
  h+='<div class="layout" style="--c:'+col+'"><div id="main"><div class="partinfo"><h2>Part '+p.no+' · '+esc(p.name)+'</h2><p>'+esc(p.instr)+' Questions '+p.from+'–'+p.to+'.</p></div>';
  if(S.confirm)h+=confirmHTML();
  p.blocks.forEach(function(b){h+=blockHTML(t,b,'test')});
  h+='<div class="nav"><button class="btn" data-act="prev"'+(S.part===1?' disabled':'')+'>← Previous part</button>'+(S.part<5?'<button class="btn main" data-act="next">Next part →</button>':'<button class="btn dark" data-act="askSubmit">Finish and submit</button>')+'</div></div>'
   +'</div><aside class="side pop" id="mapPop" aria-label="Question map" hidden><h3>Question map</h3><div class="pal" id="pal">'+paletteHTML()+'</div><div class="legendm"><span>Filled = answered</span><span>Red dot = flagged</span></div></aside>';
  app.innerHTML=h;setBarH();window.scrollTo(0,0)
}
function confirmHTML(){
  var un=60-Object.keys(S.answers).length,fl=S.flags.length;
  return '<div class="confirm"><b>Ready to submit?</b><p style="margin:4px 0 10px">'+(un?'You have <b>'+un+'</b> unanswered question'+(un>1?'s':'')+'. ':'All 60 questions are answered. ')+(fl?fl+' flagged. ':'')+'You cannot change answers after submitting.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn dark" data-act="submit">Submit my answers</button><button class="btn" data-act="cancel">Keep working</button></div></div>'
}
function refreshChrome(){
  var pal=$('#pal'),c=$('#count'),tb=$('.tabs'),pf=$('#progfill'),st=$('#streak'),k=Object.keys(S.answers).length;if(pal)pal.innerHTML=paletteHTML();if(c)c.textContent=k+'/60 answered';if(tb)tb.innerHTML=tabsHTML();if(pf)pf.style.width=Math.round(k/60*100)+'%';setBarH();if(st){if(S.streak>=2){st.hidden=false;st.textContent='🔥 '+S.streak+' in a row'}else st.hidden=true}
}
function answer(n,o){
  var q=S.t.q[n];if(S.submitted)return;
  if(S.mode==='practice'&&S.answers[n]!=null)return;
  S.answers[n]=o;save();if(S.mode==='practice'){if(o===q.ans)S.streak++;else S.streak=0}
  var el=$('#q'+n);if(el){var tmp=document.createElement('div');tmp.innerHTML=qHTML(S.t,q,'test');el.replaceWith(tmp.firstChild)}
  var bl=$('#bl'+n);if(bl){bl.textContent=o+1;bl.className='blank on'}
  refreshChrome()
}
function submit(){
  S.submitted=true;stopTick();save();results('all',true)
}
function score(){
  var t=S.t,tot=0,per={};
  t.parts.forEach(function(p){per[p.no]=0});
  t.qlist.forEach(function(q){if(S.answers[q.n]===q.ans){tot++;per[q.part]++}});
  return {tot:tot,per:per}
}
function results(filter,fresh){
  stopTick();filter=filter||'all';applyTheme(S.t);setBest(S.id,score().tot);
  var t=S.t,sc=score(),col=t.accent,g=t.guide,band=sc.tot>=g[0]?'Excellent':sc.tot>=g[1]?'Strong':sc.tot>=g[2]?'Keep practicing':'Review the explanations';
  var tip=sc.tot>=g[0]?'You are ready for hard exam papers. Try the next test.':sc.tot>=g[1]?'Solid work. Read the explanations for the questions you missed, then try again in a few days.':sc.tot>=g[2]?'Good start. Study the skill notes below, then retake the test in a week.':'Read every explanation below, study the skill notes, then retake the test in a week.';
  var ti=D.tests.indexOf(testById(S.id)),nextT=D.tests[ti+1]||null;
  var h='<div class="brandbar"><b>Bright EngMath</b><div style="display:flex;gap:12px;align-items:center"><span>'+esc(t.label)+' · Results</span><button class="btn" data-act="home">'+HOME_SVG+'Home</button></div></div><div style="--c:'+col+'"><div class="score"><div class="big">'+sc.tot+'<small> / 60</small></div><div><p class="band">'+band+'</p><div class="stars" aria-label="Rating">'+starsOf(sc.tot,g)+'</div><p style="margin:0 0 6px;font-weight:500">'+tip+'</p><div class="meta">'+Math.round(sc.tot/60*100)+'% · Time used '+fmt(S.elapsed)+(S.mode==='practice'?' (practice mode)':'')+'</div><div class="parts">'
   +'<div class="badges">'+t.parts.filter(function(p){return sc.per[p.no]/(p.to-p.from+1)>=0.8}).map(function(p){return '<span class="pill">★ '+esc(p.name)+' master</span>'}).join('')+'</div>'+t.parts.map(function(p){var n=p.to-p.from+1;return '<div class="prow"><span>'+p.no+'. '+esc(p.name)+'</span><div class="meter"><i style="width:'+(sc.per[p.no]/n*100)+'%"></i></div><span>'+sc.per[p.no]+'/'+n+'</span></div>'}).join('')+'</div></div></div>';
  h+='<p class="meta">Score guide: '+g[0]+'–60 Excellent · '+g[1]+'–'+(g[0]-1)+' Strong · '+g[2]+'–'+(g[1]-1)+' Keep practicing · below '+g[2]+' Review the explanations, then retake the test in a week.</p>';
  // skill notes
  var tags={},order=[];
  t.qlist.forEach(function(q){if(q.part===1){if(!tags[q.tag]){tags[q.tag]=[];order.push(q.tag)}tags[q.tag].push(q)}});
  h+='<div class="skills"><h3>Grammar skills in this test</h3>'+order.map(function(tg){
    return '<div class="skill"><b>'+esc(tg)+'</b><span class="nums">'+tags[tg].map(function(q){return '<span class="'+(S.answers[q.n]===q.ans?'ok':'no')+'">'+q.n+'</span>'}).join('')+'</span><p>'+esc(D.rules[tg]||'')+'</p></div>'}).join('')+'</div>';
  h+='<div class="filters" role="group" aria-label="Filter review"><button class="btn" data-filter="all" aria-pressed="'+(filter==='all')+'">All questions</button><button class="btn" data-filter="wrong" aria-pressed="'+(filter==='wrong')+'">Only the ones I missed</button><span style="flex:1"></span>'+(nextT?'<button class="btn" data-act="nexttest" data-id="'+nextT.id+'">Next: '+esc(nextT.label)+' →</button>':'')+'<button class="btn main" data-act="retake">Retake test</button><button class="btn" data-act="home">'+HOME_SVG+'All tests</button></div>';
  t.parts.forEach(function(p){
    var bl=p.blocks.map(function(b){
      var qs=b.qs.filter(function(n){return filter==='all'||S.answers[n]!==t.q[n].ans});
      if(!qs.length)return '';
      return blockHTML(t,{kind:filter==='all'?b.kind:(b.kind==='visual'||b.kind==='passage'||b.kind==='cloze'?b.kind:'qs'),title:b.title,text:b.text,intro:b.intro,visual:b.visual,qs:qs},'review')}).join('');
    if(bl)h+='<div class="partinfo" style="--c:'+col+'"><h2>Part '+p.no+' · '+esc(p.name)+'</h2></div>'+bl});
  if(filter==='wrong'&&sc.tot===60)h+='<div class="confirm"><b>Perfect score!</b> Nothing to review.</div>';
  h+='<div class="foot">© Bright EngMath · Original questions · Single-classroom license · Not affiliated with any school or exam board</div></div>';
  app.innerHTML=h;setBarH();
  if(filter==='all')window.scrollTo(0,0);
  if(fresh&&sc.tot>=g[1])confetti()
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-pmin')){var pn=b.closest('.pane');var mn=pn.classList.toggle('min');b.textContent=mn?'Show':'Hide';b.setAttribute('aria-expanded',!mn);return}
  if(b.dataset.o!=null)return answer(+b.dataset.q,+b.dataset.o);
  if(b.dataset.flag){var n=+b.dataset.flag,i=S.flags.indexOf(n);if(i>=0)S.flags.splice(i,1);else S.flags.push(n);save();var el=$('#q'+n);el.classList.toggle('flagged',i<0);b.setAttribute('aria-pressed',i<0);b.textContent=i<0?'Flagged':'Flag';return refreshChrome()}
  if(b.dataset.go){var mp=$('#mapPop');if(mp)mp.hidden=true;var q=S.t.q[+b.dataset.go];if(q.part!==S.part){S.part=q.part;save();testView()}var el2=$('#q'+q.n);if(el2)el2.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b.dataset.part){S.part=+b.dataset.part;S.confirm=false;save();return testView()}
  if(b.dataset.filter)return results(b.dataset.filter);
  var a=b.dataset.act;if(!a)return;
  if(a==='start')return begin(+b.dataset.id,b.dataset.mode,true);
  if(a==='resume')return begin(+b.dataset.id);
  if(a==='results')return begin(+b.dataset.id);
  if(a==='map'){var mp2=$('#mapPop');mp2.hidden=!mp2.hidden;b.setAttribute('aria-expanded',!mp2.hidden);return}
  if(a==='home'){save();return home()}
  if(a==='next'){S.part++;S.confirm=false;save();return testView()}
  if(a==='prev'){S.part--;S.confirm=false;save();return testView()}
  if(a==='askSubmit'){S.confirm=true;testView();var c=$('.confirm');if(c)c.scrollIntoView({block:'center'});return}
  if(a==='cancel'){S.confirm=false;return testView()}
  if(a==='submit')return submit();
  if(a==='retake'){return begin(S.id,S.mode,true)}
  if(a==='nexttest'){return begin(+b.dataset.id,S.mode,true)}
});
window.addEventListener('beforeunload',save);
if(D.tests.length===1&&location.hash==='#go'){begin(D.tests[0].id,'exam',false)}else home();
})();
</script>
</body></html>

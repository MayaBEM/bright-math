, 1+1, 0+2</td><td>3</td></tr><tr><td>0</td><td>3+0, 2+1, 1+2, 0+3</td><td>4</td></tr><tr><td>Total</td><td></td><td><b>10</b></td></tr></table>", "check": "", "tip": "Fix one box, then list the rest.", "trap": ""}, {"n": 25, "marks": 6, "topic": "Speed", "skill": "Trains and platforms", "stem": "A train passes a lamp post in 10 seconds. It passes completely through a 300 m long station in 30 seconds. How long is the train, in metres?", "fig": "", "opts": null, "ans": "150", "val": "150", "know": ["The train passes a lamp post in 10 s.", "It passes a 300 m station in 30 s."], "find": "The train’s length.", "steps": ["Passing the post: the train moves its own length in 10 s.", "Passing the station: it moves its length + 300 m in 30 s. That is 20 s more, for 300 m more.", "Speed = 300 ÷ 20 = 15 m/s. Length = 15 × 10 = <b>150 m</b>."], "vis": "", "check": "150 + 300 = 450 m in 30 s = 15 m/s ✓", "tip": "Compare the two situations: the extra time is for the extra distance.", "trap": ""}]}, {"id": 3, "name": "Paper 3", "p": "#9C4127", "a": "#1F7A87", "t": "#F6E7E1", "t2": "#EBCFC4", "ap": "#D6EEF1", "qs": [{"n": 1, "marks": 3, "topic": "Number patterns", "skill": "Adding a run of numbers", "stem": "Find the value of<div class=\"eq\">50 + 49 + 48 + ⋯ + 41</div>", "fig": "", "opts": ["405", "445", "450", "455", "500"], "ans": "D", "val": "455", "know": ["50 + 49 + … + 41 (10 numbers)."], "find": "The total.", "steps": ["Pair the first and last: 50 + 41 = 91, 49 + 42 = 91, …", "10 numbers make 5 pairs.", "5 × 91 = <b>455</b>."], "vis": "", "check": "", "tip": "Pair from the outside in.", "trap": ""}, {"n": 2, "marks": 3, "topic": "Word problems", "skill": "Unit method", "stem": "A pencil case costs 4 times as much as a pen. Together they cost $15. How much does the pencil case cost?", "fig": "", "opts": ["$3", "$9", "$10", "$12", "$13"], "ans": "D", "val": "$12", "know": ["Pencil case = 4 × pen.", "Together $15."], "find": "The cost of the pencil case.", "steps": ["Pen = 1 unit, case = 4 units: 5 units = $15.", "1 unit = $3.", "Case = 4 × $3 = <b>$12</b>."], "vis": "", "check": "$12 + $3 = $15 ✓", "tip": "Draw units for “times as much”.", "trap": "$3 is the pen."}, {"n": 3, "marks": 3, "topic": "Geometry", "skill": "Area by subtracting", "stem": "A 3 cm × 3 cm square is cut from each corner of a 9 cm × 9 cm card, as shown. What is the area of the card that is left, in cm²?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 155 165\" width=\"155\" height=\"165\"  style=\"font-family:Source Sans 3, sans-serif\"><polygon points=\"55.0,10.0 100.0,10.0 100.0,55.0 145.0,55.0 145.0,100.0 100.0,100.0 100.0,145.0 55.0,145.0 55.0,100.0 10.0,100.0 10.0,55.0 55.0,55.0\" fill=\"#F6E7E1\" stroke=\"#1B2430\" stroke-width=\"1.8\" /><rect x=\"10\" y=\"10\" width=\"45\" height=\"45\" fill=\"none\" stroke=\"#AEBBB7\" stroke-dasharray=\"4 3\"/><rect x=\"100\" y=\"10\" width=\"45\" height=\"45\" fill=\"none\" stroke=\"#AEBBB7\" stroke-dasharray=\"4 3\"/><rect x=\"10\" y=\"100\" width=\"45\" height=\"45\" fill=\"none\" stroke=\"#AEBBB7\" stroke-dasharray=\"4 3\"/><rect x=\"100\" y=\"100\" width=\"45\" height=\"45\" fill=\"none\" stroke=\"#AEBBB7\" stroke-dasharray=\"4 3\"/><text x=\"77.5\" y=\"161\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"400\" fill=\"#1B2430\">9 cm</text><text x=\"32.5\" y=\"36.5\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"400\" fill=\"#98A4A0\">3</text></svg>", "opts": ["27", "36", "45", "54", "72"], "ans": "C", "val": "45", "know": ["The card is 9 cm × 9 cm.", "A 3 cm square is cut from each of the 4 corners."], "find": "The area left.", "steps": ["Whole card: 9 × 9 = 81 cm².", "4 corners: 4 × (3 × 3) = 36 cm².", "Left: 81 − 36 = <b>45 cm²</b>."], "vis": "", "check": "", "tip": "Find the whole, then take away the pieces.", "trap": ""}, {"n": 4, "marks": 3, "topic": "Arithmetic", "skill": "Order of operations", "stem": "Evaluate<div class=\"eq\">48 × 25 ÷ 12</div>", "fig": "", "opts": ["50", "75", "100", "120", "150"], "ans": "C", "val": "100", "know": ["48 × 25 ÷ 12."], "find": "The value.", "steps": ["Divide first to make it easy: 48 ÷ 12 = 4.", "4 × 25 = <b>100</b>."], "vis": "", "check": "", "tip": "Multiplying and dividing can be done in any order.", "trap": ""}, {"n": 5, "marks": 3, "topic": "Arithmetic", "skill": "Defined operations", "stem": "A new operation is defined as<div class=\"eq\"><i>a</i> ⊕ <i>b</i> = 3 × <i>a</i> − <i>b</i></div>Find the value of (5 ⊕ 7) ⊕ 2.", "fig": "", "opts": ["8", "16", "20", "22", "24"], "ans": "D", "val": "22", "know": ["<i>a</i> ⊕ <i>b</i> = 3 × <i>a</i> − <i>b</i>."], "find": "(5 ⊕ 7) ⊕ 2.", "steps": ["Brackets first: 5 ⊕ 7 = 15 − 7 = 8.", "Then 8 ⊕ 2 = 24 − 2 = <b>22</b>."], "vis": "", "check": "", "tip": "Do the brackets first.", "trap": "8 is only the first step."}, {"n": 6, "marks": 3, "topic": "Word problems", "skill": "Working backwards", "stem": "Kim thinks of a number. She takes away 4, multiplies by 5 and then adds 10. The answer is 45. What was her number?", "fig": "", "opts": ["7", "9", "11", "13", "15"], "ans": "C", "val": "11", "know": ["Number → − 4 → × 5 → + 10 → 45."], "find": "Kim’s number.", "steps": ["Undo + 10: 45 − 10 = 35.", "Undo × 5: 35 ÷ 5 = 7.", "Undo − 4: 7 + 4 = <b>11</b>."], "vis": "", "check": "(11 − 4) × 5 + 10 = 45 ✓", "tip": "Go backwards with the opposite operations.", "trap": ""}, {"n": 7, "marks": 3, "topic": "Logic", "skill": "Balance puzzles", "stem": "There are 9 coins that look the same. One of them is fake and is a little lighter than the others. Using a balance scale, what is the smallest number of weighings that will <b>always</b> find the fake coin?", "fig": "", "opts": ["1", "2", "3", "4", "8"], "ans": "B", "val": "2", "know": ["9 coins, one is lighter.", "A balance scale compares two groups."], "find": "The fewest weighings that always work.", "steps": ["Split into 3 groups of 3. Weigh group 1 against group 2.", "If one side is lighter, the fake is there. If they balance, it is in group 3. One weighing finds the right group of 3.", "Now weigh 1 coin against 1 coin from that group. Lighter side = fake; balance = the third coin.", "So <b>2</b> weighings are enough."], "vis": "<table class=\"kt\"><tr><th>Weighing</th><th>Coins left to check</th></tr><tr><td>Start</td><td>9</td></tr><tr><td>After 1</td><td>3</td></tr><tr><td>After 2</td><td>1 (found!)</td></tr></table>", "check": "", "tip": "A balance has 3 results (left, right, balance), so split into 3 groups.", "trap": "Splitting into 2 groups needs more weighings."}, {"n": 8, "marks": 3, "topic": "Word problems", "skill": "Assumption method (coins)", "stem": "Mia has 20 coins. Some are 2-baht coins and the rest are 5-baht coins. Altogether they are worth 64 baht. How many 5-baht coins does she have?", "fig": "", "opts": ["6", "7", "8", "9", "10"], "ans": "C", "val": "8", "know": ["20 coins: 2-baht and 5-baht.", "Worth 64 baht."], "find": "How many 5-baht coins.", "steps": ["Pretend all are 2-baht: 40 baht.", "64 − 40 = 24 baht missing.", "Each 5-baht coin adds 3 more: 24 ÷ 3 = <b>8</b>."], "vis": "", "check": "8 × 5 + 12 × 2 = 40 + 24 = 64 ✓", "tip": "Pretend they are all the same, then fix the difference.", "trap": ""}, {"n": 9, "marks": 3, "topic": "Number sense", "skill": "Counting even numbers", "stem": "How many even numbers are there between 25 and 75?", "fig": "", "opts": ["24", "25", "26", "49", "50"], "ans": "B", "val": "25", "know": ["Between 25 and 75 (not including them)."], "find": "How many even numbers.", "steps": ["The even numbers are 26, 28, …, 74.", "Halve them: 13, 14, …, 37.", "From 13 to 37 there are 37 − 13 + 1 = <b>25</b> numbers."], "vis": "", "check": "", "tip": "Halving even numbers turns them into a simple list.", "trap": ""}, {"n": 10, "marks": 3, "topic": "Counting", "skill": "Factor pairs", "stem": "A rectangle has whole-number side lengths and an area of 24 cm². How many different rectangles like this are there? (A 4 × 6 rectangle and a 6 × 4 rectangle count as the same.)", "fig": "", "opts": ["3", "4", "6", "8", "12"], "ans": "B", "val": "4", "know": ["Area 24 cm², whole-number sides."], "find": "How many different rectangles.", "steps": ["List the factor pairs of 24: 1 × 24, 2 × 12, 3 × 8, 4 × 6.", "6 × 4 is the same as 4 × 6, so we stop.", "There are <b>4</b> rectangles."], "vis": "", "check": "", "tip": "List factor pairs from 1 upwards.", "trap": ""}, {"n": 11, "marks": 4, "topic": "Data", "skill": "Averages of consecutive numbers", "stem": "The average of 3 consecutive whole numbers is 21. What do you get when you multiply the smallest number by the largest?", "fig": "", "opts": ["420", "440", "441", "462", "480"], "ans": "B", "val": "440", "know": ["3 consecutive numbers, average 21."], "find": "Smallest × largest.", "steps": ["The middle number is the average: 21.", "The numbers are 20, 21, 22.", "20 × 22 = <b>440</b>."], "vis": "", "check": "", "tip": "The middle of a run is the average.", "trap": "441 = 21 × 21."}, {"n": 12, "marks": 4, "topic": "Word problems", "skill": "Excess and shortage", "stem": "If each student gets 5 pencils, there are 3 pencils left over. If each student gets 6 pencils, 4 more pencils are needed. How many pencils are there?", "fig": "", "opts": ["38", "40", "42", "44", "45"], "ans": "A", "val": "38", "know": ["5 each → 3 left over.", "6 each → 4 short."], "find": "How many pencils.", "steps": ["1 more pencil each uses the 3 extra and needs 4 more: 3 + 4 = 7 pencils. So there are 7 students.", "Pencils = 7 × 5 + 3 = <b>38</b>."], "vis": "", "check": "7 × 6 = 42 = 38 + 4 ✓", "tip": "Left over + short = the total change.", "trap": ""}, {"n": 13, "marks": 4, "topic": "Fractions", "skill": "Decimals and fractions", "stem": "Which of these is equal to<div class=\"eq\">0.75 + <span class=\"frac\"><span>1</span><span>8</span></span> ?</div>", "fig": "", "opts": ["<span class=\"frac\"><span>5</span><span>8</span></span>", "<span class=\"frac\"><span>3</span><span>4</span></span>", "<span class=\"frac\"><span>13</span><span>16</span></span>", "<span class=\"frac\"><span>7</span><span>8</span></span>", "<span class=\"frac\"><span>15</span><span>16</span></span>"], "ans": "D", "val": "<span class=\"frac\"><span>7</span><span>8</span></span>", "know": ["0.75 + 1/8."], "find": "The equal fraction.", "steps": ["0.75 = 3/4 = 6/8.", "6/8 + 1/8 = <b>7/8</b>."], "vis": "", "check": "", "tip": "Change decimals to fractions with the same bottom number.", "trap": ""}, {"n": 14, "marks": 4, "topic": "Number puzzles", "skill": "Cryptarithm (addition)", "stem": "<i>A</i>, <i>B</i> and <i>C</i> are different digits (<i>AB</i> means a 2-digit number, not <i>A</i> × <i>B</i>) and<div class=\"eq\"><i>AB</i> + <i>CB</i> = <i>BBA</i></div>What is the 3-digit number <i>BBA</i>?", "fig": "", "opts": ["112", "113", "114", "116", "118"], "ans": "A", "val": "112", "know": ["<i>AB</i> + <i>CB</i> = <i>BBA</i>.", "Different digits."], "find": "The number <i>BBA</i>.", "steps": ["Two 2-digit numbers add up to less than 200, so <i>B</i> = 1.", "The ones column: 1 + 1 = 2, so <i>A</i> = 2.", "Then 21 + <i>C</i>1 = 112, so <i>C</i>1 = 91 and <i>C</i> = 9.", "<i>BBA</i> = <b>112</b>: 21 + 91 = 112 ✓."], "vis": "", "check": "", "tip": "Start with the hundreds digit of the answer.", "trap": ""}, {"n": 15, "marks": 4, "topic": "Geometry", "skill": "Angles on a straight line", "stem": "A straight angle (180°) is split into three angles in the ratio 1 : 2 : 3. What is the size of the largest of the three angles?", "fig": "", "opts": ["30°", "45°", "60°", "75°", "90°"], "ans": "E", "val": "90°", "know": ["A straight angle (180°) split in the ratio 1 : 2 : 3."], "find": "The largest angle.", "steps": ["1 + 2 + 3 = 6 parts = 180°.", "1 part = 30°.", "Largest = 3 parts = <b>90°</b>."], "vis": "", "check": "30 + 60 + 90 = 180 ✓", "tip": "Add the ratio parts first.", "trap": ""}, {"n": 16, "marks": 4, "topic": "Number patterns", "skill": "Multiplying patterns", "stem": "Find the next number in the sequence.<div class=\"eq\">1, 2, 6, 24, 120, ___</div>", "fig": "", "opts": ["144", "240", "360", "600", "720"], "ans": "E", "val": "720", "know": ["1, 2, 6, 24, 120, …"], "find": "The next number.", "steps": ["2 = 1 × 2, 6 = 2 × 3, 24 = 6 × 4, 120 = 24 × 5.", "Next: 120 × 6 = <b>720</b>."], "vis": "", "check": "", "tip": "Look at what each number is multiplied by.", "trap": ""}, {"n": 17, "marks": 4, "topic": "Number theory", "skill": "Calendar remainders", "stem": "1 March is a Tuesday. On which day of the week is 1 June of the same year? (March has 31 days, April 30 and May 31.)", "fig": "", "opts": ["Wednesday", "Tuesday", "Thursday", "Friday", "Saturday"], "ans": "A", "val": "Wednesday", "know": ["1 March is a Tuesday.", "March 31, April 30, May 31 days."], "find": "The day of 1 June.", "steps": ["Days from 1 March to 1 June: 31 + 30 + 31 = 92.", "92 = 13 weeks + 1 day.", "Tuesday + 1 day = <b>Wednesday</b>."], "vis": "", "check": "", "tip": "Use the remainder after dividing by 7.", "trap": ""}, {"n": 18, "marks": 4, "topic": "Counting", "skill": "Gaps and objects", "stem": "Posters 1 m wide are stuck in a row on a wall 21 m long. There is a 1 m gap between each pair of posters and also a 1 m gap at each end of the wall. How many posters are there?", "fig": "", "opts": ["10", "11", "12", "20", "21"], "ans": "A", "val": "10", "know": ["Wall 21 m. Posters 1 m wide.", "1 m gaps between posters and at both ends."], "find": "How many posters.", "steps": ["Pattern: gap, poster, gap, poster, …, poster, gap. There is one more gap than posters.", "Try 10 posters: 10 m of posters + 11 m of gaps = 21 m ✓.", "There are <b>10</b> posters."], "vis": "", "check": "", "tip": "Write the pattern of gaps and objects.", "trap": ""}, {"n": 19, "marks": 4, "topic": "Geometry", "skill": "Perimeter to area", "stem": "A rectangle has a perimeter of 30 cm. Its length is 3 cm more than its width. What is its area, in cm²?", "fig": "", "opts": ["36", "45", "48", "51", "54"], "ans": "E", "val": "54", "know": ["Perimeter 30 cm.", "Length = width + 3."], "find": "The area.", "steps": ["Half the perimeter: length + width = 15.", "Width + 3 + width = 15, so 2 widths = 12, width = 6 cm, length = 9 cm.", "Area = 6 × 9 = <b>54 cm²</b>."], "vis": "", "check": "", "tip": "Half the perimeter = length + width.", "trap": ""}, {"n": 20, "marks": 4, "topic": "Counting", "skill": "Counting triangles", "stem": "A triangle has one line from the top corner down to the base and one line across, parallel to the base. How many triangles are there in the figure?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 180\" width=\"220\" height=\"180\"  style=\"font-family:Source Sans 3, sans-serif\"><polygon points=\"110.0,12.0 10.0,170.0 210.0,170.0\" fill=\"none\" stroke=\"#1B2430\" stroke-width=\"1.8\" /><line x1=\"110.0\" y1=\"12.0\" x2=\"120.0\" y2=\"170.0\" stroke=\"#1B2430\" stroke-width=\"1.6\" /><line x1=\"55.0\" y1=\"98.9\" x2=\"165.0\" y2=\"98.9\" stroke=\"#1B2430\" stroke-width=\"1.6\" /></svg>", "opts": ["2", "3", "4", "5", "6"], "ans": "E", "val": "6", "know": ["One line from the top corner to the base.", "One line parallel to the base."], "find": "How many triangles.", "steps": ["Every triangle uses the top corner and one of the across lines (the base or the middle line).", "With the base: choose 2 of the 3 lines from the top → 3 triangles. With the middle line → 3 more.", "Total: <b>6</b>."], "vis": "", "check": "", "tip": "Count one layer at a time.", "trap": ""}, {"n": 21, "marks": 6, "topic": "Number patterns", "skill": "Growing jumps", "stem": "In the sequence 1, 2, 4, 7, 11, 16, …, the jumps are 1, 2, 3, 4, 5, … What is the 20th number in the sequence?", "fig": "", "opts": null, "ans": "191", "val": "191", "know": ["1, 2, 4, 7, 11, 16, … with jumps 1, 2, 3, …"], "find": "The 20th number.", "steps": ["To reach the 20th number we add 19 jumps: 1 + 2 + … + 19 = 190.", "Start at 1: 1 + 190 = <b>191</b>."], "vis": "", "check": "Check the 5th: 1 + (1 + 2 + 3 + 4) = 11 ✓", "tip": "The nth number = first number + all jumps before it.", "trap": ""}, {"n": 22, "marks": 6, "topic": "Number patterns", "skill": "Growing patterns", "stem": "Square tables are pushed together in a row. 1 table seats 4 people, 2 tables seat 6 and 3 tables seat 8. How many tables are needed to seat exactly 40 people?", "fig": "<div class=\"fig-row\"><div class=\"fig-item\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 54 54\" width=\"54\" height=\"54\"  style=\"font-family:Source Sans 3, sans-serif\"><rect x=\"14\" y=\"14\" width=\"26\" height=\"26\" fill=\"#F6E7E1\" stroke=\"#1B2430\" stroke-width=\"1.3\"/><circle cx=\"27.0\" cy=\"7\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"27.0\" cy=\"47\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"7\" cy=\"27.0\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"47\" cy=\"27.0\" r=\"4\" fill=\"#1F7A87\"/></svg><div class=\"figcap\">1 table: 4 seats</div></div><div class=\"fig-item\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 80 54\" width=\"80\" height=\"54\"  style=\"font-family:Source Sans 3, sans-serif\"><rect x=\"14\" y=\"14\" width=\"26\" height=\"26\" fill=\"#F6E7E1\" stroke=\"#1B2430\" stroke-width=\"1.3\"/><circle cx=\"27.0\" cy=\"7\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"27.0\" cy=\"47\" r=\"4\" fill=\"#1F7A87\"/><rect x=\"40\" y=\"14\" width=\"26\" height=\"26\" fill=\"#F6E7E1\" stroke=\"#1B2430\" stroke-width=\"1.3\"/><circle cx=\"53.0\" cy=\"7\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"53.0\" cy=\"47\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"7\" cy=\"27.0\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"73\" cy=\"27.0\" r=\"4\" fill=\"#1F7A87\"/></svg><div class=\"figcap\">2 tables: 6 seats</div></div><div class=\"fig-item\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 106 54\" width=\"106\" height=\"54\"  style=\"font-family:Source Sans 3, sans-serif\"><rect x=\"14\" y=\"14\" width=\"26\" height=\"26\" fill=\"#F6E7E1\" stroke=\"#1B2430\" stroke-width=\"1.3\"/><circle cx=\"27.0\" cy=\"7\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"27.0\" cy=\"47\" r=\"4\" fill=\"#1F7A87\"/><rect x=\"40\" y=\"14\" width=\"26\" height=\"26\" fill=\"#F6E7E1\" stroke=\"#1B2430\" stroke-width=\"1.3\"/><circle cx=\"53.0\" cy=\"7\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"53.0\" cy=\"47\" r=\"4\" fill=\"#1F7A87\"/><rect x=\"66\" y=\"14\" width=\"26\" height=\"26\" fill=\"#F6E7E1\" stroke=\"#1B2430\" stroke-width=\"1.3\"/><circle cx=\"79.0\" cy=\"7\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"79.0\" cy=\"47\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"7\" cy=\"27.0\" r=\"4\" fill=\"#1F7A87\"/><circle cx=\"99\" cy=\"27.0\" r=\"4\" fill=\"#1F7A87\"/></svg><div class=\"figcap\">3 tables: 8 seats</div></div></div>", "opts": null, "ans": "19", "val": "19", "know": ["1 table: 4 seats, 2: 6, 3: 8."], "find": "Tables for 40 people.", "steps": ["Each new table adds 2 seats. Seats = 2 × tables + 2.", "2 × tables + 2 = 40, so 2 × tables = 38.", "Tables = <b>19</b>."], "vis": "", "check": "", "tip": "Find what each new table adds.", "trap": ""}, {"n": 23, "marks": 6, "topic": "Number sense", "skill": "Digit sums", "stem": "Find the sum of <b>all the digits</b> used to write the numbers from 1 to 20. (For example, 15 gives 1 + 5.)", "fig": "", "opts": null, "ans": "102", "val": "102", "know": ["The numbers 1 to 20."], "find": "The sum of all their digits.", "steps": ["1 to 9: 1 + 2 + … + 9 = 45.", "10 to 19: ten 1s = 10, plus 0 + 1 + … + 9 = 45 → 55.", "20: 2 + 0 = 2. Total: 45 + 55 + 2 = <b>102</b>."], "vis": "", "check": "", "tip": "Split into groups of ten.", "trap": ""}, {"n": 24, "marks": 6, "topic": "Counting", "skill": "Arrangements with a condition", "stem": "Ann, Ben, Cat and Dan stand in a line. In how many different orders can they stand if Ann is <b>not</b> first?", "fig": "", "opts": null, "ans": "18", "val": "18", "know": ["4 children in a line.", "Ann is not first."], "find": "How many orders.", "steps": ["All orders: 4 × 3 × 2 × 1 = 24.", "Orders with Ann first: 3 × 2 × 1 = 6.", "24 − 6 = <b>18</b>."], "vis": "", "check": "", "tip": "Sometimes it’s easier to count what you don’t want and take it away.", "trap": ""}, {"n": 25, "marks": 6, "topic": "Rates", "skill": "Work rates", "stem": "6 workers can build a wall in 10 days. Every worker works at the same speed. How many days would 4 workers take to build the same wall?", "fig": "", "opts": null, "ans": "15", "val": "15", "know": ["6 workers take 10 days."], "find": "The days for 4 workers.", "steps": ["The wall needs 6 × 10 = 60 worker-days of work.", "4 workers do 4 worker-days each day.", "60 ÷ 4 = <b>15 days</b>."], "vis": "", "check": "", "tip": "Fewer workers take longer.", "trap": "6.7 days would mean fewer workers were faster."}]}, {"id": 4, "name": "Paper 4", "p": "#253A5E", "a": "#C23B55", "t": "#E8ECF3", "t2": "#CBD3E2", "ap": "#F7DCE2", "qs": [{"n": 1, "marks": 3, "topic": "Number patterns", "skill": "Sum of a growing list", "stem": "Find the value of<div class=\"eq\">2 + 5 + 8 + 11 + ⋯ + 59</div>", "fig": "", "opts": ["590", "600", "610", "620", "1220"], "ans": "C", "val": "610", "know": ["2, 5, 8, … 59 (goes up by 3)."], "find": "The total.", "steps": ["How many numbers? (59 − 2) ÷ 3 + 1 = 20.", "Pair the first and last: 2 + 59 = 61. 20 numbers make 10 pairs.", "10 × 61 = <b>610</b>."], "vis": "", "check": "", "tip": "Count the numbers, then pair them.", "trap": "1220 forgets that 20 numbers make only 10 pairs."}, {"n": 2, "marks": 3, "topic": "Word problems", "skill": "Balancing", "stem": "Three times a number, plus 7, is the same as the number plus 31. What is the number?", "fig": "", "opts": ["8", "10", "12", "14", "24"], "ans": "C", "val": "12", "know": ["3 × number + 7 = number + 31."], "find": "The number.", "steps": ["Take one “number” away from both sides: 2 × number + 7 = 31.", "2 × number = 24.", "Number = <b>12</b>."], "vis": "", "check": "3 × 12 + 7 = 43 = 12 + 31 ✓", "tip": "Keep both sides balanced.", "trap": ""}, {"n": 3, "marks": 3, "topic": "Geometry", "skill": "Area of overlapping shapes", "stem": "Two rectangles, each 8 cm by 3 cm, cross to make the shape shown. They overlap in a 3 cm square. What is the area of the whole shape, in cm²?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 140 155\" width=\"140\" height=\"155\"  style=\"font-family:Source Sans 3, sans-serif\"><rect x=\"10\" y=\"55\" width=\"120\" height=\"45\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.6\"/><rect x=\"47.5\" y=\"17.5\" width=\"45\" height=\"120\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.6\" fill-opacity=\".85\"/><rect x=\"47.5\" y=\"55\" width=\"45\" height=\"45\" fill=\"#CBD3E2\" stroke=\"#1B2430\" stroke-width=\"1.2\"/><text x=\"112.0\" y=\"81.5\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1B2430\">8 × 3</text><text x=\"70\" y=\"34.0\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1B2430\">8 × 3</text></svg>", "opts": ["39", "42", "45", "48", "57"], "ans": "A", "val": "39", "know": ["Two 8 × 3 rectangles cross.", "They overlap in a 3 × 3 square."], "find": "The area of the shape.", "steps": ["Each rectangle: 8 × 3 = 24 cm².", "The middle square (9 cm²) is inside both, so it was counted twice.", "24 + 24 − 9 = <b>39 cm²</b>."], "vis": "", "check": "", "tip": "Take away the overlap once.", "trap": "48 counts the middle square twice."}, {"n": 4, "marks": 3, "topic": "Arithmetic", "skill": "Clever grouping", "stem": "Evaluate<div class=\"eq\">999 × 7 + 7</div>", "fig": "", "opts": ["6993", "7000", "7007", "7700", "7777"], "ans": "B", "val": "7000", "know": ["999 × 7 + 7."], "find": "The value.", "steps": ["999 × 7 + 7 = 999 lots of 7 + 1 lot of 7 = 1000 lots of 7.", "1000 × 7 = <b>7000</b>."], "vis": "", "check": "", "tip": "Group the same numbers together.", "trap": ""}, {"n": 5, "marks": 3, "topic": "Arithmetic", "skill": "Defined operations", "stem": "For any whole number <i>n</i>, [<i>n</i>] means <i>n</i> × <i>n</i> − <i>n</i>. Find [5] − [4].", "fig": "", "opts": ["1", "4", "8", "9", "20"], "ans": "C", "val": "8", "know": ["[<i>n</i>] = <i>n</i> × <i>n</i> − <i>n</i>."], "find": "[5] − [4].", "steps": ["[5] = 25 − 5 = 20.", "[4] = 16 − 4 = 12.", "20 − 12 = <b>8</b>."], "vis": "", "check": "", "tip": "Work out each part, then subtract.", "trap": ""}, {"n": 6, "marks": 3, "topic": "Word problems", "skill": "Working backwards", "stem": "A tank of water was used for 3 days. On day 1, <span class=\"frac\"><span>1</span><span>3</span></span> of the water was used. On day 2, half of what was left was used. On day 3, 10 litres were used. Then 20 litres were left. How many litres were in the tank at the start?", "fig": "", "opts": ["60", "75", "80", "90", "120"], "ans": "D", "val": "90", "know": ["Day 1: 1/3 used. Day 2: half of the rest used.", "Day 3: 10 L used. 20 L left."], "find": "The water at the start.", "steps": ["Before day 3: 20 + 10 = 30 L.", "Day 2 used half, so before day 2: 30 × 2 = 60 L.", "Day 1 used 1/3, so 60 L is 2/3 of the tank. 1/3 = 30 L, whole tank = <b>90 L</b>."], "vis": "<table class=\"kt\"><tr><th>Step (backwards)</th><th>Litres</th></tr><tr><td>End</td><td>20</td></tr><tr><td>Before day 3</td><td>30</td></tr><tr><td>Before day 2</td><td>60</td></tr><tr><td>Start (60 is 2/3)</td><td><b>90</b></td></tr></table>", "check": "", "tip": "When 1/3 is used, 2/3 is left.", "trap": ""}, {"n": 7, "marks": 3, "topic": "Logic", "skill": "Liars and truth-tellers", "stem": "Tom, Sam and Joe are friends. Exactly one of them always lies; the other two always tell the truth.<div class=\"quote\">Tom: “Sam is the liar.”<br>Sam: “I am not the liar.”<br>Joe: “Tom is the liar.”</div>Who is the liar?", "fig": "", "opts": ["Tom", "Sam", "Joe", "Tom or Sam", "It cannot be determined"], "ans": "A", "val": "Tom", "know": ["Exactly one liar.", "Tom: “Sam is the liar.” Sam: “I am not.” Joe: “Tom is the liar.”"], "find": "Who the liar is.", "steps": ["Tom and Joe can’t both be telling the truth (they blame different people). So the liar is Tom or Joe.", "If Joe lies, Tom is honest and Sam is the liar. But that makes two liars ✗.", "So <b>Tom</b> is the liar: Sam and Joe both tell the truth ✓."], "vis": "<table class=\"kt\"><tr><th>Liar</th><th>Tom</th><th>Sam</th><th>Joe</th><th>OK?</th></tr><tr><td><b>Tom</b></td><td>lie</td><td>true</td><td>true</td><td><b>✓</b></td></tr><tr><td>Sam</td><td>true</td><td>lie</td><td>lie</td><td>✗</td></tr><tr><td>Joe</td><td>lie</td><td>true</td><td>lie</td><td>✗</td></tr></table>", "check": "", "tip": "Two people who blame different people can’t both be right.", "trap": ""}, {"n": 8, "marks": 3, "topic": "Word problems", "skill": "Assumption (legs) method", "stem": "There are children and dogs in a park: 22 heads and 64 legs altogether. How many dogs are there?", "fig": "", "opts": ["8", "9", "10", "11", "12"], "ans": "C", "val": "10", "know": ["22 heads, 64 legs.", "Children 2 legs, dogs 4 legs."], "find": "How many dogs.", "steps": ["Pretend all are children: 44 legs.", "64 − 44 = 20 legs missing.", "Each dog adds 2: 20 ÷ 2 = <b>10 dogs</b>."], "vis": "", "check": "10 × 4 + 12 × 2 = 64 ✓", "tip": "Pretend they are all the same, then fix the difference.", "trap": ""}, {"n": 9, "marks": 3, "topic": "Number sense", "skill": "Multiples and digit sums", "stem": "What is the smallest whole number that is a multiple of 6 and whose digits add up to 15?", "fig": "", "opts": ["69", "78", "87", "96", "159"], "ans": "B", "val": "78", "know": ["A multiple of 6.", "Its digits add up to 15."], "find": "The smallest such number.", "steps": ["A multiple of 6 is even, and its digit sum is in the 3 times table (15 ✓).", "The smallest 2-digit numbers with digit sum 15: 69, 78, 87, 96.", "69 is odd. 78 is even: <b>78</b> = 6 × 13 ✓."], "vis": "", "check": "", "tip": "Multiples of 6 are even and in the 3 times table.", "trap": "69 is odd, so not a multiple of 6."}, {"n": 10, "marks": 3, "topic": "Counting", "skill": "Choosing in order", "stem": "How many 3-digit numbers use three different digits from 1, 2, 3, 4, 5 with the digits getting bigger from left to right? (For example, 135.)", "fig": "", "opts": ["6", "7", "8", "9", "10"], "ans": "E", "val": "10", "know": ["Digits from 1 to 5, all different.", "Digits get bigger from left to right."], "find": "How many numbers.", "steps": ["Once you choose 3 digits, there is only one way to put them in increasing order.", "List the choices: 123, 124, 125, 134, 135, 145, 234, 235, 245, 345.", "That is <b>10</b>."], "vis": "", "check": "", "tip": "Choosing the digits decides the number.", "trap": "60 counts every order of the digits."}, {"n": 11, "marks": 4, "topic": "Data", "skill": "Averages (totals method)", "stem": "In a class of 20 students, the average mark is 65. The top 5 students have an average of 80. What is the average mark of the other 15 students?", "fig": "", "opts": ["55", "60", "62", "64", "65"], "ans": "B", "val": "60", "know": ["20 students, average 65.", "Top 5 average 80."], "find": "The average of the other 15.", "steps": ["Class total: 20 × 65 = 1300.", "Top 5 total: 5 × 80 = 400.", "Other 15: 1300 − 400 = 900, average 900 ÷ 15 = <b>60</b>."], "vis": "", "check": "", "tip": "Use totals for averages.", "trap": ""}, {"n": 12, "marks": 4, "topic": "Word problems", "skill": "Excess and shortage", "stem": "If 30 people get on each bus, 10 people are left behind. If 35 people get on each bus, the last bus has only 5 people and all the other buses are full. How many people are there?", "fig": "", "opts": ["230", "235", "240", "245", "250"], "ans": "E", "val": "250", "know": ["30 per bus → 10 left behind.", "35 per bus → last bus has only 5."], "find": "How many people.", "steps": ["With 35 per bus, the last bus is 30 seats short.", "Going from 30 to 35 per bus (5 more each) seats the 10 left behind and leaves 30 seats spare: 10 + 30 = 40.", "Buses = 40 ÷ 5 = 8. People = 8 × 30 + 10 = <b>250</b>."], "vis": "", "check": "7 full buses × 35 = 245, + 5 = 250 ✓", "tip": "Extra + spare = the total change.", "trap": ""}, {"n": 13, "marks": 4, "topic": "Fractions", "skill": "Dividing by a fraction", "stem": "How many <span class=\"frac\"><span>1</span><span>6</span></span>s are there in 2<span class=\"frac\"><span>1</span><span>3</span></span> ?", "fig": "", "opts": ["7", "12", "13", "14", "15"], "ans": "D", "val": "14", "know": ["2 1/3 and 1/6."], "find": "How many 1/6s in 2 1/3.", "steps": ["1 whole = 6 sixths, so 2 wholes = 12 sixths.", "1/3 = 2 sixths.", "12 + 2 = <b>14</b>."], "vis": "", "check": "", "tip": "Change everything into the small unit.", "trap": ""}, {"n": 14, "marks": 4, "topic": "Number puzzles", "skill": "Cryptarithm (multiplication)", "stem": "<i>A</i>, <i>B</i> and <i>C</i> are different digits (<i>AB</i> means a 2-digit number, not <i>A</i> × <i>B</i>) and<div class=\"eq\"><i>AB</i> × <i>C</i> = <i>BBB</i></div>What is the 2-digit number <i>AB</i>?", "fig": "", "opts": ["37", "54", "63", "74", "83"], "ans": "D", "val": "74", "know": ["<i>AB</i> × <i>C</i> = <i>BBB</i>.", "Different digits."], "find": "The number <i>AB</i>.", "steps": ["<i>BBB</i> = <i>B</i> × 111 = <i>B</i> × 3 × 37. So <i>AB</i> is probably a multiple of 37.", "Multiples of 37: 37, 74. Try 37 × 3 = 111 (digits repeat ✗). 74 × 6 = 444: B = 4 ✓, A = 7, C = 6 all different ✓.", "<i>AB</i> = <b>74</b>."], "vis": "", "check": "", "tip": "Numbers like 444 are B × 111 = B × 3 × 37.", "trap": ""}, {"n": 15, "marks": 4, "topic": "Geometry", "skill": "Angles in a pentagon", "stem": "What do the five angles inside any five-sided shape (pentagon) add up to? (Hint: cut it into triangles from one corner.)", "fig": "", "opts": ["180°", "270°", "360°", "450°", "540°"], "ans": "E", "val": "540°", "know": ["Any five-sided shape."], "find": "The total of its angles.", "steps": ["From one corner, draw lines to the 2 corners that are not next to it.", "This cuts the pentagon into 3 triangles.", "3 × 180° = <b>540°</b>."], "vis": "", "check": "", "tip": "Triangles inside a shape = sides − 2.", "trap": ""}, {"n": 16, "marks": 4, "topic": "Number patterns", "skill": "Prime numbers", "stem": "Find the next number in the sequence.<div class=\"eq\">2, 3, 5, 7, 11, 13, ___</div>", "fig": "", "opts": ["12", "14", "15", "16", "17"], "ans": "E", "val": "17", "know": ["2, 3, 5, 7, 11, 13, …"], "find": "The next number.", "steps": ["These are the prime numbers (they only divide by 1 and themselves).", "After 13: 14 ✗, 15 ✗, 16 ✗, 17 ✓.", "Next is <b>17</b>."], "vis": "", "check": "", "tip": "Learn the first primes: 2, 3, 5, 7, 11, 13, 17, 19.", "trap": "15 = 3 × 5 is not prime."}, {"n": 17, "marks": 4, "topic": "Number theory", "skill": "Repeating patterns", "stem": "When 3 is divided by 11, the answer is a decimal that repeats forever:<div class=\"eq\">3 ÷ 11 = 0.272727…</div>What is the 2027th digit after the decimal point?", "fig": "", "opts": ["0", "2", "3", "7", "9"], "ans": "B", "val": "2", "know": ["3 ÷ 11 = 0.272727…"], "find": "The 2027th digit after the point.", "steps": ["The digits repeat 2, 7, 2, 7, … Odd places are 2, even places are 7.", "2027 is odd.", "So the digit is <b>2</b>."], "vis": "", "check": "", "tip": "A 2-digit repeat: look at odd or even.", "trap": ""}, {"n": 18, "marks": 4, "topic": "Counting", "skill": "Objects around a loop", "stem": "A square courtyard has sides of 12 m. Flower pots stand all round its edge, 2 m apart, with a pot at every corner. How many flower pots are there?", "fig": "", "opts": ["24", "25", "26", "27", "28"], "ans": "A", "val": "24", "know": ["Square, 12 m sides.", "Pots every 2 m, one at each corner."], "find": "How many pots.", "steps": ["Distance all round: 4 × 12 = 48 m.", "48 ÷ 2 = 24 gaps.", "On a closed loop, pots = gaps = <b>24</b>."], "vis": "", "check": "", "tip": "Closed loop: objects = gaps.", "trap": "28 counts the corners twice."}, {"n": 19, "marks": 4, "topic": "Geometry", "skill": "Perimeter with a hole", "stem": "A 3 × 3 square of tiles, each 2 cm × 2 cm, has its middle tile taken out. What is the total length of all the edges (the outside edge and the edge of the hole), in cm?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 122 130\" width=\"122\" height=\"130\"  style=\"font-family:Source Sans 3, sans-serif\"><rect x=\"10\" y=\"10\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"10\" y=\"44\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"10\" y=\"78\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"44\" y=\"10\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"44\" y=\"78\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"78\" y=\"10\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"78\" y=\"44\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"78\" y=\"78\" width=\"34\" height=\"34\" fill=\"#E8ECF3\" stroke=\"#1B2430\" stroke-width=\"1.5\"/><rect x=\"44\" y=\"44\" width=\"34\" height=\"34\" fill=\"#fff\" stroke=\"#1B2430\" stroke-width=\"2\"/><text x=\"61.0\" y=\"128\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"400\" fill=\"#1B2430\">each tile: 2 cm</text></svg>", "opts": ["24", "28", "30", "32", "36"], "ans": "D", "val": "32", "know": ["3 × 3 tiles of 2 cm, middle tile removed."], "find": "Total length of all edges.", "steps": ["Outside edge: the big square is 6 cm wide, so 4 × 6 = 24 cm.", "Edge of the hole: 4 × 2 = 8 cm.", "Total: 24 + 8 = <b>32 cm</b>."], "vis": "", "check": "", "tip": "A hole adds its own edge.", "trap": "24 forgets the hole."}, {"n": 20, "marks": 4, "topic": "Counting", "skill": "Counting triangles", "stem": "A square has one diagonal and both lines through the middle (one across, one up and down). How many triangles are there in the figure?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 170 170\" width=\"170\" height=\"170\"  style=\"font-family:Source Sans 3, sans-serif\"><rect x=\"10\" y=\"10\" width=\"150\" height=\"150\" fill=\"#fff\" stroke=\"#1B2430\" stroke-width=\"1.8\"/><line x1=\"10.0\" y1=\"160.0\" x2=\"160.0\" y2=\"10.0\" stroke=\"#1B2430\" stroke-width=\"1.6\" /><line x1=\"10.0\" y1=\"85.0\" x2=\"160.0\" y2=\"85.0\" stroke=\"#1B2430\" stroke-width=\"1.6\" /><line x1=\"85.0\" y1=\"10.0\" x2=\"85.0\" y2=\"160.0\" stroke=\"#1B2430\" stroke-width=\"1.6\" /></svg>", "opts": ["6", "7", "8", "9", "10"], "ans": "A", "val": "6", "know": ["A square with one diagonal and both middle lines."], "find": "How many triangles.", "steps": ["The middle lines make 4 small squares. The diagonal cuts 2 of them into 2 small triangles each → 4 small triangles.", "The diagonal also cuts the whole square into 2 big triangles → 2.", "Total: 4 + 2 = <b>6</b>."], "vis": "", "check": "", "tip": "Count small triangles, then the big ones.", "trap": ""}, {"n": 21, "marks": 6, "topic": "Number sense", "skill": "Place value", "stem": "The digits 1 to 9 are each used once to make three 3-digit numbers. What is the <b>largest</b> possible total of the three numbers?", "fig": "", "opts": null, "ans": "2556", "val": "2556", "know": ["Digits 1 to 9, each once.", "Three 3-digit numbers."], "find": "The largest total.", "steps": ["Put the biggest digits in the hundreds place: 9, 8, 7 → (9 + 8 + 7) × 100 = 2400.", "Next in the tens: 6, 5, 4 → 15 × 10 = 150.", "Last in the ones: 3, 2, 1 → 6. Total: 2400 + 150 + 6 = <b>2556</b>."], "vis": "", "check": "e.g. 963 + 852 + 741 = 2556 ✓", "tip": "Big digits go in the big places.", "trap": ""}, {"n": 22, "marks": 6, "topic": "Number patterns", "skill": "Triangular numbers", "stem": "Cans are stacked in rows. The bottom row has 12 cans, and each row above has one can fewer, up to 1 can at the top. How many cans are there altogether?", "fig": "", "opts": null, "ans": "78", "val": "78", "know": ["Rows of 12, 11, 10, … 1 cans."], "find": "The total.", "steps": ["1 + 2 + … + 12.", "Pair them: 1 + 12 = 13, six pairs.", "6 × 13 = <b>78</b>."], "vis": "", "check": "", "tip": "Pair from the outside in.", "trap": ""}, {"n": 23, "marks": 6, "topic": "Counting", "skill": "Clock patterns", "stem": "A digital clock shows times from 00:00 to 23:59. How many times in one day does it show the same two digits for the hour and the minutes, like 07:07 or 21:21?", "fig": "", "opts": null, "ans": "24", "val": "24", "know": ["Clock from 00:00 to 23:59.", "Hour digits = minute digits."], "find": "How many times.", "steps": ["For every hour 00 to 23, the same minutes (00 to 23) exist on the clock.", "00:00, 01:01, …, 23:23.", "That is 24 hours → <b>24</b> times."], "vis": "", "check": "", "tip": "Check each hour can be a minute value.", "trap": ""}, {"n": 24, "marks": 6, "topic": "Counting", "skill": "Choices with a rule", "stem": "A flag has 3 stripes in a row. Each stripe is red, white or blue, and stripes next to each other must be different colours. How many different flags can be made?", "fig": "", "opts": null, "ans": "12", "val": "12", "know": ["3 stripes: red, white or blue.", "Neighbours must be different."], "find": "How many flags.", "steps": ["First stripe: 3 choices.", "Second stripe: any colour except the first → 2 choices.", "Third: any colour except the second → 2 choices. 3 × 2 × 2 = <b>12</b>."], "vis": "", "check": "", "tip": "Multiply the choices for each stripe.", "trap": "6 assumes all three stripes must be different."}, {"n": 25, "marks": 6, "topic": "Speed", "skill": "Speed, distance and time", "stem": "A car travels 150 km in 2½ hours. At the same speed, how many km does it travel in 4 hours?", "fig": "", "opts": null, "ans": "240", "val": "240", "know": ["150 km in 2½ hours."], "find": "The distance in 4 hours.", "steps": ["2½ hours = 5 half-hours. 150 ÷ 5 = 30 km every half hour.", "That is 60 km every hour.", "In 4 hours: 4 × 60 = <b>240 km</b>."], "vis": "", "check": "", "tip": "Find the distance for 1 hour first.", "trap": ""}]}, {"id": 5, "name": "Paper 5", "p": "#5B3A29", "a": "#2B8566", "t": "#F2EAE4", "t2": "#E2D2C6", "ap": "#D6EFE5", "qs": [{"n": 1, "marks": 3, "topic": "Number patterns", "skill": "Sum of multiples of 4", "stem": "Find the value of<div class=\"eq\">4 + 8 + 12 + 16 + ⋯ + 80</div>", "fig": "", "opts": ["800", "820", "840", "880", "1680"], "ans": "C", "val": "840", "know": ["4 + 8 + 12 + … + 80 (the 4 times table)."], "find": "The total.", "steps": ["4 + 8 + … + 80 = 4 × (1 + 2 + … + 20).", "1 + 2 + … + 20 = 210.", "4 × 210 = <b>840</b>."], "vis": "", "check": "", "tip": "Take out the common number first.", "trap": ""}, {"n": 2, "marks": 3, "topic": "Word problems", "skill": "Three-part units", "stem": "Box A has twice as many sweets as Box B. Box C has 3 more sweets than Box B. The three boxes have 43 sweets altogether. How many sweets are in Box A?", "fig": "", "opts": ["10", "13", "20", "23", "26"], "ans": "C", "val": "20", "know": ["A = 2 × B. C = B + 3.", "A + B + C = 43."], "find": "The sweets in box A.", "steps": ["B = 1 unit, A = 2 units, C = 1 unit + 3.", "4 units + 3 = 43, so 4 units = 40 and 1 unit = 10.", "A = 2 × 10 = <b>20</b>."], "vis": "", "check": "20 + 10 + 13 = 43 ✓", "tip": "Use units, and take away the extra first.", "trap": "10 is box B."}, {"n": 3, "marks": 3, "topic": "Geometry", "skill": "Perimeter and area", "stem": "A square has an area of 49 cm². A rectangle has the same perimeter as the square, and its length is 9 cm. What is the area of the rectangle, in cm²?", "fig": "", "opts": ["36", "40", "45", "49", "63"], "ans": "C", "val": "45", "know": ["Square area 49 cm².", "Rectangle: same perimeter, length 9 cm."], "find": "The rectangle’s area.", "steps": ["The square’s side is 7 cm (7 × 7 = 49), so its perimeter is 28 cm.", "The rectangle: length + width = 14, so the width is 14 − 9 = 5 cm.", "Area = 9 × 5 = <b>45 cm²</b>."], "vis": "", "check": "", "tip": "Half the perimeter = length + width.", "trap": ""}, {"n": 4, "marks": 3, "topic": "Arithmetic", "skill": "Spotting equal brackets", "stem": "Evaluate<div class=\"eq\">(101 − 1) + (102 − 2) + (103 − 3) + ⋯ + (110 − 10)</div>", "fig": "", "opts": ["100", "900", "1000", "1055", "1100"], "ans": "C", "val": "1000", "know": ["(101 − 1) + (102 − 2) + … + (110 − 10)."], "find": "The value.", "steps": ["Every bracket is 100: 101 − 1 = 100, 102 − 2 = 100, …", "There are 10 brackets.", "10 × 100 = <b>1000</b>."], "vis": "", "check": "", "tip": "Work out one bracket and look for a pattern.", "trap": ""}, {"n": 5, "marks": 3, "topic": "Arithmetic", "skill": "Defined operations", "stem": "A new operation is defined as<div class=\"eq\"><i>a</i> ◈ <i>b</i> = <i>a</i> × <i>a</i> + <i>b</i></div>Find the value of (2 ◈ 3) ◈ 1.", "fig": "", "opts": ["8", "16", "49", "50", "64"], "ans": "D", "val": "50", "know": ["<i>a</i> ◈ <i>b</i> = <i>a</i> × <i>a</i> + <i>b</i>."], "find": "(2 ◈ 3) ◈ 1.", "steps": ["Brackets first: 2 ◈ 3 = 4 + 3 = 7.", "Then 7 ◈ 1 = 49 + 1 = <b>50</b>."], "vis": "", "check": "", "tip": "Do the brackets first.", "trap": "49 forgets the + 1."}, {"n": 6, "marks": 3, "topic": "Word problems", "skill": "Working backwards", "stem": "Each morning the apples on a magic tree double, and then 5 apples are picked. After 3 mornings there are 45 apples. How many apples were on the tree at the start?", "fig": "", "opts": ["5", "7", "8", "9", "10"], "ans": "E", "val": "10", "know": ["Each morning: double, then pick 5.", "After 3 mornings: 45 apples."], "find": "Apples at the start.", "steps": ["Morning 3 backwards: 45 + 5 = 50, halve → 25.", "Morning 2: 25 + 5 = 30, halve → 15.", "Morning 1: 15 + 5 = 20, halve → <b>10</b>."], "vis": "<table class=\"kt\"><tr><th>Step (backwards)</th><th>Apples</th></tr><tr><td>End</td><td>45</td></tr><tr><td>Before morning 3</td><td>25</td></tr><tr><td>Before morning 2</td><td>15</td></tr><tr><td>Start</td><td><b>10</b></td></tr></table>", "check": "10 → 20 − 5 = 15 → 30 − 5 = 25 → 50 − 5 = 45 ✓", "tip": "Undo the last step first: add back, then halve.", "trap": ""}, {"n": 7, "marks": 3, "topic": "Logic", "skill": "Overlapping groups", "stem": "In a class of 30 students, 18 like apples, 15 like bananas and 5 like neither fruit. How many students like <b>both</b>?", "fig": "", "opts": ["5", "8", "9", "10", "13"], "ans": "B", "val": "8", "know": ["30 students. 18 like apples, 15 like bananas.", "5 like neither."], "find": "How many like both.", "steps": ["Students who like at least one fruit: 30 − 5 = 25.", "18 + 15 = 33 counts the “both” group twice.", "Both = 33 − 25 = <b>8</b>."], "vis": "", "check": "Apples only 10 + both 8 + bananas only 7 + neither 5 = 30 ✓", "tip": "Draw two overlapping circles.", "trap": ""}, {"n": 8, "marks": 3, "topic": "Word problems", "skill": "Assumption method (money)", "stem": "Ann bought 12 stamps. Some cost 3 baht and the rest cost 5 baht. She paid 46 baht altogether. How many 5-baht stamps did she buy?", "fig": "", "opts": ["4", "5", "6", "7", "8"], "ans": "B", "val": "5", "know": ["12 stamps: 3 baht and 5 baht.", "46 baht."], "find": "How many 5-baht stamps.", "steps": ["Pretend all are 3-baht: 36 baht.", "46 − 36 = 10 baht missing.", "Each 5-baht stamp adds 2: 10 ÷ 2 = <b>5</b>."], "vis": "", "check": "5 × 5 + 7 × 3 = 25 + 21 = 46 ✓", "tip": "Pretend they are all the same, then fix the difference.", "trap": ""}, {"n": 9, "marks": 3, "topic": "Number sense", "skill": "Factors", "stem": "Which number is a factor of 60 but <b>not</b> a factor of 45?", "fig": "", "opts": ["3", "5", "9", "12", "15"], "ans": "D", "val": "12", "know": ["Choices: 3, 5, 9, 12, 15."], "find": "A factor of 60 that is not a factor of 45.", "steps": ["Check 60: 3 ✓, 5 ✓, 9 ✗, 12 ✓, 15 ✓.", "Check 45 for the ones that divide 60: 3 ✓, 5 ✓, 12 ✗, 15 ✓.", "Only <b>12</b> divides 60 but not 45."], "vis": "", "check": "", "tip": "Test each choice against both rules.", "trap": "9 divides 45 but not 60, which is the opposite of what we want."}, {"n": 10, "marks": 3, "topic": "Counting", "skill": "Organised lists", "stem": "In how many ways can 10 be written as the sum of two <b>different</b> whole numbers that are both at least 1? (1 + 9 and 9 + 1 count as the same.)", "fig": "", "opts": ["3", "4", "5", "9", "10"], "ans": "B", "val": "4", "know": ["10 = a + b, with a and b different and at least 1."], "find": "How many ways.", "steps": ["List them: 1 + 9, 2 + 8, 3 + 7, 4 + 6.", "5 + 5 uses the same number twice, so it doesn’t count.", "<b>4</b> ways."], "vis": "", "check": "", "tip": "Make an organised list.", "trap": "5 forgets that the numbers must be different."}, {"n": 11, "marks": 4, "topic": "Data", "skill": "Pairs of totals", "stem": "Boxes A and B weigh 30 kg together, boxes B and C weigh 40 kg together, and boxes A and C weigh 32 kg together. What is the average weight of the three boxes, in kg?", "fig": "", "opts": ["17", "18", "19", "20", "34"], "ans": "A", "val": "17", "know": ["A + B = 30, B + C = 40, A + C = 32."], "find": "The average weight.", "steps": ["Add all three: (A + B) + (B + C) + (A + C) = 102. Each box is counted twice.", "So A + B + C = 102 ÷ 2 = 51 kg.", "Average = 51 ÷ 3 = <b>17 kg</b>."], "vis": "", "check": "", "tip": "Adding all the pairs counts each box twice.", "trap": "34 is the average of the pair totals."}, {"n": 12, "marks": 4, "topic": "Word problems", "skill": "Age problems", "stem": "The ages of Ann and Ben add up to 30. Six years ago, Ann was twice as old as Ben. How old is Ann now?", "fig": "", "opts": ["12", "14", "16", "18", "20"], "ans": "D", "val": "18", "know": ["Ann + Ben = 30 now.", "6 years ago: Ann = 2 × Ben."], "find": "Ann’s age now.", "steps": ["6 years ago, their ages added up to 30 − 12 = 18.", "Then Ann = 2 units, Ben = 1 unit: 3 units = 18, so 1 unit = 6.", "Ann was 12, so now she is 12 + 6 = <b>18</b>."], "vis": "", "check": "18 + 12 = 30 ✓ and 6 years ago 12 = 2 × 6 ✓", "tip": "Going back 6 years takes 6 years from each person.", "trap": ""}, {"n": 13, "marks": 4, "topic": "Fractions", "skill": "Fractions of a whole", "stem": "A jug is <span class=\"frac\"><span>1</span><span>4</span></span> full. After 3 litres of water are added, it is <span class=\"frac\"><span>1</span><span>2</span></span> full. How many litres does the jug hold when it is full?", "fig": "", "opts": ["6", "8", "9", "12", "16"], "ans": "D", "val": "12", "know": ["1/4 full → add 3 L → 1/2 full."], "find": "The full capacity.", "steps": ["The 3 litres filled from 1/4 to 1/2, which is 1/4 of the jug.", "1/4 of the jug = 3 L.", "Whole jug = 4 × 3 = <b>12 L</b>."], "vis": "", "check": "", "tip": "Find the fraction that the added amount fills.", "trap": ""}, {"n": 14, "marks": 4, "topic": "Number puzzles", "skill": "Cryptarithm (multiplication)", "stem": "<i>A</i>, <i>B</i> and <i>C</i> are different digits (<i>AB</i> means a 2-digit number, not <i>A</i> × <i>B</i>) and<div class=\"eq\"><i>AB</i> × 5 = <i>CCB</i></div>What is the 2-digit number <i>AB</i>?", "fig": "", "opts": ["45", "55", "65", "75", "85"], "ans": "A", "val": "45", "know": ["<i>AB</i> × 5 = <i>CCB</i>.", "Different digits."], "find": "The number <i>AB</i>.", "steps": ["The answer ends in <i>B</i>. <i>B</i> × 5 ends in <i>B</i> only when <i>B</i> = 5 (or 0, but then the digits clash).", "Try numbers ending in 5: 45 × 5 = 225 → C = 2, B = 5 ✓.", "<i>AB</i> = <b>45</b>."], "vis": "<table class=\"kt\"><tr><th>Try</th><th>× 5</th><th>Fits CCB?</th></tr><tr><td><b>45</b></td><td><b>225</b></td><td><b>✓</b></td></tr><tr><td>55</td><td>275</td><td>✗</td></tr><tr><td>65</td><td>325</td><td>✗</td></tr><tr><td>75</td><td>375</td><td>✗</td></tr></table>", "check": "", "tip": "Look at the ones digit first.", "trap": ""}, {"n": 15, "marks": 4, "topic": "Geometry", "skill": "Angles in a triangle", "stem": "In a triangle, the third angle is 40°. The first angle is 20° bigger than the second angle. What is the size of the first angle?", "fig": "", h up with Ali?", "fig": "", "opts": null, "ans": "30", "val": "30", "know": ["Ali: 4 km/h from 8:00.", "Ben: 12 km/h from 9:00, same road."], "find": "Minutes after 9:00 when Ben catches Ali.", "steps": ["At 9:00 Ali is already 4 km ahead.", "Ben gains 12 − 4 = 8 km every hour.", "4 km ÷ 8 km per hour = half an hour = <b>30 minutes</b>."], "vis": "", "check": "At 9:30: Ali 6 km, Ben 6 km ✓", "tip": "Catching up: use the difference in speeds.", "trap": ""}]}];
const $app = document.getElementById('app');
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let S = null; // current session
let tick = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setPaint(p){ const r=document.documentElement.style; r.setProperty('--p',p.p); r.setProperty('--a',p.a); r.setProperty('--t',p.t); r.setProperty('--t2',p.t2); r.setProperty('--ap',p.ap); }
function norm(v){ return String(v).replace(/<[^>]+>/g,'').replace(/[\s,$°]/g,'').toLowerCase(); }
function isRight(q, a){ if(a==null || a==='') return false; return q.opts ? a===q.ans : norm(a)===norm(q.val); }
function ansText(q){ return q.opts ? `(${q.ans}) ${q.opts['ABCDE'.indexOf(q.ans)]}` : esc(q.val); }
function section(n){ return n<=10?'A':(n<=20?'B':'C'); }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), x=s%60; return `${m}:${String(x).padStart(2,'0')}`; }

/* ---------- home ---------- */

      <div class="stripe"></div>

        <ul>${skills.map(s=>`<li>${esc(s)}</li>`).join('')}<li>…and 21 more skills</li></ul>

        <div class="acts">

  }).join('');
  $app.innerHTML = `
  <header class="top"><div class="brand"><b>Bright EngMath</b> · Olympiad Room</div><div class="eyebrow">Middle Primary · Grades 3–4</div></header>
  <section class="hero">

      <p>Each paper follows the Middle Primary olympiad format: 20 multiple-choice questions and 5 open-answer questions, worth 3, 4 or 6 marks. Sit a paper under exam conditions, or practise one question at a time with a step-by-step solution after every answer.</p></div>
    <div class="facts"><div><b>125</b><span>questions</span></div><div><b>5 × 100</b><span>marks</span></div><div><b>90</b><span>minutes each</span></div></div>

  <section class="papers">${cards}</section>

/* ---------- session ---------- */
function start(id, mode){
  const p = PAPERS.find(x=>x.id===id); setPaint(p);
  S = {p, mode, i:0, answers:{}, flags:{}, checked:{}, done:false, confirm:false, endAt: Date.now()+90*60*1000, review:null};
  clearInterval(tick);
  if(mode==='exam'){ tick = setInterval(()=>{ const left=(S.endAt-Date.now())/1000; const c=document.getElementById('clock'); if(c){ c.textContent=fmtTime(left); c.classList.toggle('low', left<300);} if(left<=0){ finish(); } }, 1000); }
  room();
}

function qHTML(q, opts){
  const {locked, showRight, chosen} = opts;
  let a = '';
  if(q.opts){
    a = `<div class="choices" role="radiogroup" aria-label="Answer choices">` + q.opts.map((o,k)=>{
      const L='ABCDE'[k]; let cls='choice', tag='';
      if(showRight){ if(L===q.ans){cls+=' right'; tag='Correct answer';} else if(L===chosen){cls+=' wrong'; tag='Your answer';} }
      else if(L===chosen) cls+=' sel';
      return `<button class="${cls}" role="radio" aria-checked="${L===chosen}" data-pick="${L}" ${locked?'disabled':''}><span class="bub">${L}</span><span>${o}</span>${tag?`<span class="tag">${tag}</span>`:''}</button>`;
    }).join('') + `</div>`;
  } else {
    const cls = showRight ? (isRight(q,chosen)?'right':'wrong') : '';
    a = `<div class="open"><label for="openans">Answer</label><input id="openans" inputmode="text" autocomplete="off" class="${cls}" value="${esc(chosen??'')}" ${locked?'disabled':''} placeholder="Type a number">${showRight?`<span>Correct answer: <b>${esc(q.val)}</b></span>`:''}</div>`;
  }
  return `<div class="qhead"><div class="qno">${q.n}</div><div><div class="qmeta">Section ${section(q.n)} · ${q.marks} marks</div><div class="qtopic">${esc(q.topic)} · ${esc(q.skill)}</div></div></div>
    <div class="stem">${q.stem}</div>${q.fig?`<div class="fig">${q.fig}</div>`:''}${a}`;
}

function solHTML(q){
  return `<div class="sol">
    <h3>Step-by-step solution</h3>
    <div class="kf"><div><div class="kfh">1 · What do we know?</div><ul>${q.know.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><div class="kfh">2 · What do we need to find?</div><p>${q.find}</p></div></div>
    <div><div class="kfh">3 · Let’s solve it</div><div class="steps">${q.steps.map((s,i)=>`<div class="step"><span class="sn">Step ${i+1}</span><div>${splitLines(s)}</div></div>`).join('')}</div></div>
    ${q.vis?`<div class="vis">${q.vis}</div>`:''}
    <div class="ansline"><span>4 · Answer</span>So the answer is <b>${ansText(q)}</b>.</div>
    <div class="notes">${q.check?`<div class="ck"><b>Check</b>${q.check}</div>`:''}${q.tip?`<div class="tip"><b>Remember</b>${q.tip}</div>`:''}${q.trap?`<div class="trap"><b>Watch out</b>${q.trap}</div>`:''}</div>
  </div>`;
}
function splitLines(s){ return s.split(/(?<=[.!?✓✗)])\s+(?=(?:[A-Z(]|<b>[A-Z]|<i>[A-Z]))/).map(x=>`<div class="ln">${x}</div>`).join(''); }

function sheetHTML(){
  const p=S.p; let h=`<aside class="sheet" aria-label="Answer sheet"><h3>Answer sheet</h3>`;
  const groups=[['A','Section A · 3 marks',1,10],['B','Section B · 4 marks',11,20],['C','Section C · 6 marks',21,25]];
  for(const [,lab,a,b] of groups){
    h+=`<div class="sec">${lab}</div><div class="cells">`;
    for(let n=a;n<=b;n++){
      const q=p.qs[n-1], v=S.answers[n]; let cls='cell';
      if(S.mode==='practice' && S.checked[n]) cls += isRight(q,v)?' right':' wrong';
      else if(v!=null && v!=='') cls+=' done';
      if(S.i===n-1) cls+=' cur'; if(S.flags[n]) cls+=' flagged';
      const shown = v!=null && v!=='' ? (q.opts? v : '✓') : '';
      h+=`<button class="${cls}" data-go="${n-1}" aria-label="Question ${n}${shown?', answered':''}">${n}<b>${esc(shown)}</b></button>`;
    }
    h+=`</div>`;
  }
  const answered = Object.values(S.answers).filter(v=>v!=null&&v!=='').length;
  if(S.mode==='exam'){
    h+=`<p class="legend">${answered} of 25 answered. A dot marks a flagged question.</p>`;
    if(S.confirm){ h+=`<div class="confirm"><b>Submit your paper?</b><br>${25-answered?`${25-answered} question${25-answered>1?'s are':' is'} still blank.`:'Every question has an answer.'} You can’t change answers after this.<div class="r"><button class="btn accent" id="doSubmit">Yes, submit</button><button class="btn ghost" id="noSubmit">Keep working</button></div></div>`; }
    else h+=`<button class="btn accent" id="askSubmit" style="width:100%;margin-top:12px">Submit paper</button>`;
  } else {
    const right = Object.keys(S.checked).filter(n=>isRight(p.qs[n-1],S.answers[n])).length;
    h+=`<p class="legend">Checked ${Object.keys(S.checked).length} of 25 · ${right} right. Green = right, red = try reading the solution.</p><button class="btn ghost" id="toHome" style="width:100%;margin-top:8px">Back to all papers</button>`;
  }
  return h+`</aside>`;
}

function room(){
  const p=S.p, q=p.qs[S.i], n=q.n, mode=S.mode;
  const chosen=S.answers[n]; const checked = mode==='practice' && S.checked[n];
  const left = (S.endAt-Date.now())/1000;
  let after='';
  if(checked){
    const ok=isRight(q,chosen);
    after = `<div class="verdict ${ok?'ok':'no'}"><span class="sym">${ok?'✓':'✗'}</span>${ok?`Correct! +${q.marks} marks.`:`Not quite. The answer is ${ansText(q)}.`}</div>` + solHTML(q);
  }
  const nav = mode==='exam'
    ? `<div class="nav"><button class="btn ghost" id="prev" ${S.i===0?'disabled':''}>← Previous</button><div class="r"><button class="btn ghost flag ${S.flags[n]?'on':''}" id="flag">${S.flags[n]?'Flagged':'Flag for later'}</button><button class="btn primary" id="next" ${S.i===24?'disabled':''}>Next →</button></div></div>`
    : `<div class="nav"><button class="btn ghost" id="prev" ${S.i===0?'disabled':''}>← Previous</button><div class="r">${checked?`<button class="btn primary" id="next">${S.i===24?'See summary':'Next question →'}</button>`:`<button class="btn primary" id="check" ${chosen==null||chosen===''?'disabled':''}>Check answer</button>`}</div></div>`;
  $app.innerHTML = `
  <div class="bar"><div class="who"><span class="chip p">${p.name}</span><span class="chip mode">${mode==='exam'?'Timed exam':'Practice'}</span><span>Question ${n} of 25</span></div>
    ${mode==='exam'?`<div class="clock ${left<300?'low':''}" id="clock" aria-label="Time left">${fmtTime(left)}</div>`:''}
    <button class="btn ghost" id="quit">${mode==='exam'?'Leave exam':'All papers'}</button></div>
  <div class="room"><main class="qcard">${qHTML(q,{locked:checked, showRight:checked, chosen})}${after}${nav}</main>${sheetHTML()}</div>`;
  bindRoom();
}

function bindRoom(){
  const q=S.p.qs[S.i], n=q.n;
  $app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ S.answers[n]=b.dataset.pick; room(); });
  const inp=document.getElementById('openans');
  if(inp && !inp.disabled){ inp.oninput=()=>{ S.answers[n]=inp.value.trim(); const c=document.getElementById('check'); if(c) c.disabled=!inp.value.trim(); refreshSheetCell(n); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(S.mode==='practice' && inp.value.trim()) doCheck(); else go(S.i+1);} }; }
  $app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f;};
  on('prev',()=>go(S.i-1)); on('next',()=>{ if(S.mode==='practice'&&S.i===24) summary(); else go(S.i+1); });
  on('flag',()=>{ S.flags[n]=!S.flags[n]; room(); });
  on('check',doCheck); on('askSubmit',()=>{S.confirm=true; room();}); on('noSubmit',()=>{S.confirm=false; room();}); on('doSubmit',finish);
  on('quit',()=>{ if(S.mode==='exam' && !S.leaving){ S.leaving=true; const b=document.getElementById('quit'); b.textContent='Tap again to leave (answers are lost)'; b.classList.add('accent'); setTimeout(()=>{ if(S){S.leaving=false; if(document.getElementById('quit')) room();} },3500); } else home(); });
  on('toHome',home);
}
function refreshSheetCell(n){ const c=$app.querySelector(`[data-go="${n-1}"]`); if(!c) return; const v=S.answers[n]; c.classList.toggle('done', !!v); c.querySelector('b').textContent = v ? '✓' : ''; }
function go(i){ if(i<0||i>24) return; S.i=i; S.confirm=false; room(); window.scrollTo({top:0}); }
function doCheck(){ const n=S.p.qs[S.i].n; if(S.answers[n]==null||S.answers[n]==='') return; S.checked[n]=true; room(); }

document.addEventListener('keydown',e=>{
  if(!S || S.done || e.target.tagName==='INPUT') return;
  const q=S.p.qs[S.i]; const k=e.key.toUpperCase();
  if(q.opts && 'ABCDE'.includes(k) && k.length===1 && !(S.mode==='practice'&&S.checked[q.n])){ S.answers[q.n]=k; room(); }
  else if(e.key==='ArrowRight') go(S.i+1); else if(e.key==='ArrowLeft') go(S.i-1);
  else if(e.key==='Enter' && S.mode==='practice'){ if(S.checked[q.n]) { S.i===24?summary():go(S.i+1); } else doCheck(); }
});

/* ---------- results ---------- */
function scoreOf(){ const p=S.p; let tot=0, sec={A:0,B:0,C:0}, right=0; p.qs.forEach(q=>{ if(isRight(q,S.answers[q.n])){ tot+=q.marks; sec[section(q.n)]+=q.marks; right++; } }); return {tot,sec,right}; }
function finish(){
  clearInterval(tick); S.done=true; const r=scoreOf();
  const key='olymp-best-'+S.p.id; const best=store.get(key); if(best==null||r.tot>best) store.set(key,r.tot);
  results();
}
function summary(){ S.done=true; results(); }
function results(){
  const p=S.p, r=scoreOf(); window.scrollTo(0,0);
  if(S.review!=null) return reviewQ(S.review);
  const missed={}; p.qs.forEach(q=>{ if(!isRight(q,S.answers[q.n])) (missed[q.topic]=missed[q.topic]||[]).push(q.n); });
  const rows=p.qs.map(q=>{ const v=S.answers[q.n]; const st = (v==null||v==='')?['skip','Blank']:(isRight(q,v)?['ok','Right']:['no','Wrong']);
    return `<button class="rrow" data-rev="${q.n-1}"><span class="n">${q.n}</span><span>${esc(q.skill)}<br><small style="color:var(--muted)">Your answer: ${v?esc(v):'—'} · Correct: ${q.opts?q.ans:esc(q.val)}</small></span><span class="mk">${isRight(q,v)?q.marks:0}/${q.marks}</span><span class="st ${st[0]}">${st[1]}</span></button>`; }).join('');
  const msg = r.tot>=80?'Excellent! A strong medal-level score.':r.tot>=60?'Good work. Polish Section B to push higher.':r.tot>=40?'A solid start. Read the solutions for the questions you missed.':'Keep going: work through each solution, then try this paper again in a week.';
  $app.innerHTML = `
  <div class="bar"><div class="who"><span class="chip p">${p.name}</span><span class="chip mode">${S.mode==='exam'?'Exam result':'Practice summary'}</span></div><button class="btn ghost" id="home2">All papers</button></div>
  <section class="res-top"><div class="score">${r.tot}<small> / 100</small></div>
    <div><h2 style="font-size:26px">${msg}</h2><p style="margin:6px 0 0;color:var(--muted)">${r.right} of 25 questions right${S.mode==='practice'?' (unchecked questions count as blank)':''}.</p>
    <div class="secs"><div><b>${r.sec.A} / 30</b><span>Section A</span></div><div><b>${r.sec.B} / 40</b><span>Section B</span></div><div><b>${r.sec.C} / 30</b><span>Section C</span></div></div></div></section>
  <div class="res-grid"><div class="review">${rows}</div>
    <aside class="topicbox"><h3>What to practise next</h3>${Object.keys(missed).length?`<ul style="margin:0;padding-left:18px">${Object.entries(missed).map(([t,ns])=>`<li><b>${esc(t)}</b> · Q${ns.join(', Q')}</li>`).join('')}</ul>`:'<p>Nothing! Every question is right.</p>'}
    <p class="legend">Tap any question to see its full step-by-step solution.</p>
    <div style="display:grid;gap:8px;margin-top:12px"><button class="btn primary" id="again">Try this paper again</button><button class="btn ghost" id="practise">Practise it with solutions</button></div></aside></div>`;
  $app.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{ S.review=+b.dataset.rev; reviewQ(S.review); });
  document.getElementById('home2').onclick=home;
  document.getElementById('again').onclick=()=>start(p.id,'exam');
  document.getElementById('practise').onclick=()=>start(p.id,'practice');
}
function reviewQ(i){
  const p=S.p, q=p.qs[i]; window.scrollTo(0,0);
  $app.innerHTML = `
  <div class="bar"><div class="who"><span class="chip p">${p.name}</span><span class="chip mode">Review</span><span>Question ${q.n} of 25</span></div><button class="btn ghost" id="back">Back to results</button></div>
  <main class="qcard">${qHTML(q,{locked:true, showRight:true, chosen:S.answers[q.n]})}${solHTML(q)}
    <div class="nav"><button class="btn ghost" id="rp" ${i===0?'disabled':''}>← Previous</button><button class="btn primary" id="rn" ${i===24?'disabled':''}>Next →</button></div></main>`;
  document.getElementById('back').onclick=()=>{ S.review=null; results(); };
  document.getElementById('rp').onclick=()=>{ S.review=i-1; reviewQ(i-1); };
  document.getElementById('rn').onclick=()=>{ S.review=i+1; reviewQ(i+1); };
}

home();
</script>

</body></html>

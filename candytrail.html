<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Trail · Halloween phonics walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Chewy&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept: a trick-or-treat route drawn on a night map. You walk a lantern-lit
   path, read the signs at every fork, and a wrong sign means a cute dead end.
   Cream paper panels sit on a deep teal night; pumpkin orange is the one accent. */
:root{
  --night:#0f2229; --night2:#183540; --paper:#fbf3df; --paper2:#f1e5c4; --ink:#2a2218; --muted:#6b5f47;
  --cream:#f6ecc8; --orange:#f08a24; --orange-d:#b9560a; --pink:#ef6f91; --mint:#6fd1b0; --butter:#f6d365;
  --ok:#256f49; --ok-bg:#dcf0e3; --bad:#a63d27; --bad-bg:#fbe1d7; --focus:#ffd166;
  --c:#f08a24; --d:#a24a05;
}
*{box-sizing:border-box}
html{font-size:18px}
html.big{font-size:22px}
body{margin:0;background:var(--night);color:var(--cream);min-height:100vh;line-height:1.5;
  font-family:'Andika','IBM Plex Sans Thai',system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 3rem}
.disp{font-family:'Chewy','Andika',sans-serif;font-weight:400;letter-spacing:.01em}
svg.ico{width:1.15em;height:1.15em;flex:none}
.pt{color:var(--d)}

/* buttons */
.btn{font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:12px;padding:.45rem 1.2rem;min-height:48px;cursor:pointer;transition:background .12s,transform .08s}
.btn:hover:not(:disabled){background:rgba(246,236,200,.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#2a1604;font-weight:700}
.btn.primary:hover:not(:disabled){background:#ffa040}
.btn.paper{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{display:inline-flex;align-items:center;gap:.35rem;background:none;border:0;padding:0;min-height:44px;cursor:pointer;font-size:.9rem;color:var(--cream);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap;padding:.4rem 0}
.wm{font-weight:700;font-size:.82rem;letter-spacing:.03em;color:var(--cream);opacity:.85}
.menu{position:relative;font-size:.85rem}
.menu summary{list-style:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:.4rem;padding:0 .2rem;text-decoration:underline;text-underline-offset:3px}
.menu summary::-webkit-details-marker{display:none}
.menu .drop{position:absolute;right:0;top:100%;z-index:30;background:var(--paper);color:var(--ink);border-radius:12px;padding:.4rem .9rem;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu label{display:flex;align-items:center;gap:.5rem;min-height:44px;cursor:pointer}
.menu input{width:18px;height:18px;accent-color:var(--orange-d);margin:0}
.jarbtn{display:inline-flex;align-items:center;gap:.5rem;background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:.2rem .9rem .2rem .5rem;min-height:44px;cursor:pointer;font-weight:700}
.jarbtn svg{width:30px;height:30px}

/* title */
.hero{display:grid;grid-template-columns:1fr minmax(300px,480px);gap:1rem 2.5rem;align-items:center;padding:1.2rem 0 2rem}
.hero h1{font-size:clamp(3.4rem,10vw,6.4rem);line-height:.95;color:var(--orange);margin:.2rem 0 .5rem}
.hero .tag{font-size:1.15rem;max-width:26rem}
.hero .acts{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.4rem}
.hero .art{border-radius:20px;overflow:hidden;border:2px solid rgba(246,236,200,.25)}
.hero .art svg{display:block;width:100%;height:auto}
.how{margin-top:2.4rem;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;border-top:1px solid rgba(246,236,200,.25);padding-top:1.2rem}
.how b{display:block;font-size:1.1rem;color:var(--butter)}
.how p{font-size:.92rem;opacity:.9}
.how .n{font-family:'Chewy',sans-serif;font-size:2rem;color:var(--orange);line-height:1}

/* character select */
.sh{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--butter)}
.pagetitle{font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;margin:.4rem 0 .5rem}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.6rem 0}
.charbtn{position:relative;background:var(--night2);border:3px solid transparent;border-radius:18px;padding:1rem .6rem .8rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem}
.charbtn:hover{border-color:rgba(246,236,200,.4)}
.charbtn[aria-pressed="true"]{border-color:var(--orange);background:#1d4150}
.charbtn svg{width:min(120px,100%);height:auto}
.charbtn b{font-size:1.5rem;font-family:'Chewy',sans-serif;font-weight:400;color:var(--butter)}
.charbtn small{font-size:.8rem;opacity:.85}
.charbtn .on{position:absolute;top:.5rem;right:.6rem;font-size:.72rem;font-weight:700;background:var(--orange);color:#2a1604;border-radius:6px;padding:0 .4rem;display:none}
.charbtn[aria-pressed="true"] .on{display:block}

/* trail map */
.trailhead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;padding:1rem 0 .4rem}
.trail{position:relative;max-width:620px;margin:1rem auto 0;height:calc(8*128px + 40px)}
.trail svg.line{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translateX(-50%);width:150px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15rem;padding:.3rem}
.stop .dot{width:64px;height:64px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-family:'Chewy',sans-serif;font-size:2rem;border:4px solid var(--orange);position:relative}
.stop:hover .dot{background:#fff;transform:scale(1.06)}
.stop .nm{font-weight:700;font-size:1rem;line-height:1.2;color:var(--cream);text-shadow:0 0 5px var(--night),0 0 5px var(--night),0 0 2px var(--night)}
.stop .cb{font-size:.8rem;color:var(--butter);word-spacing:.15em;text-shadow:0 0 5px var(--night),0 0 5px var(--night),0 0 2px var(--night)}
.stop .st{display:flex;gap:2px;height:18px}
.stop .st svg{width:18px;height:18px}
.stop .gold{position:absolute;right:-6px;top:-4px;width:24px;height:24px}

/* play screen */
.hud{display:flex;align-items:center;gap:.4rem 1rem;flex-wrap:wrap;padding:.3rem 0 .5rem}
.lvname{font-family:'Chewy',sans-serif;font-size:1.4rem;color:var(--orange);flex:1;min-width:9rem;line-height:1.1}
.lvname small{font-family:'Andika',sans-serif;font-size:.78rem;color:var(--cream);opacity:.8;margin-left:.4rem}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--cream);opacity:.8}
.pips i.done{background:var(--orange);border-color:var(--orange);opacity:1}
.pips i.now{border-color:var(--butter);box-shadow:0 0 0 3px rgba(246,211,101,.35);opacity:1}
.pips i.door{border-radius:4px 4px 2px 2px}
.jar{display:flex;align-items:center;gap:.3rem;font-weight:700}
.jar svg{width:26px;height:26px}
.jar.pulse{animation:pulse .4s}
@keyframes pulse{50%{transform:scale(1.25)}}
.play{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:1.2rem 1.6rem;align-items:start}
.scene{position:relative;container-type:inline-size;aspect-ratio:360/420;border-radius:18px;overflow:hidden;border:2px solid rgba(246,236,200,.25);background:#14303a;width:100%;transition:opacity .25s}
.scene.fade{opacity:0}
.scene svg.sc{position:absolute;inset:0;width:100%;height:100%;display:block}
.sign{position:absolute;transform:translate(-50%,-100%);background:#b07a40;color:#fff7e3;border:0;border-bottom:4px solid #6b4220;border-radius:8px;padding:.35em .7em .3em;font-weight:700;font-size:max(14px,4.5cqw);line-height:1.15;cursor:pointer;text-align:center;min-width:4.4em;box-shadow:0 0 0 3px #6b4220;z-index:3}
.sign small{display:block;font-size:.62em;font-weight:400;opacity:.9}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:8px;height:3.2cqw;background:#6b4220;transform:translateX(-50%);margin-top:4px}
.sign:hover:not(:disabled){background:#c58a4c}
.sign.ok{background:#2f8a5b;box-shadow:0 0 0 3px #145c38,0 0 22px 6px rgba(246,211,101,.6)}
.sign.bad{background:#5b4a3c;color:#c9b99a;box-shadow:0 0 0 3px #3b3027;transform:translate(-50%,-100%) rotate(-7deg)}
.sign:disabled{cursor:default}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:.25em .7em;font-weight:700;font-size:max(13px,4.2cqw);white-space:nowrap;z-index:5;animation:rise .2s}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:var(--paper);transform:translateX(-50%)}
.bubble.side::after{display:none}
.pop{position:absolute;z-index:6;left:50%;top:48%;display:flex;gap:4px;align-items:center;transform:translate(-50%,-50%);animation:floatup 1.3s ease-out forwards;pointer-events:none}
.pop svg{width:11cqw;height:11cqw}
.pop b{font-family:'Chewy',sans-serif;font-weight:400;font-size:9cqw;color:var(--butter);text-shadow:0 2px 0 #0f2229}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,-90%)}to{opacity:1;transform:translate(-50%,-100%)}}
.hero-bob{animation:bob 1.6s ease-in-out infinite}
.walking .hero-bob{animation:none}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.de{opacity:0;transition:opacity .25s}
.de.show{opacity:1}
.obs{transition:opacity .6s,transform .6s;transform-box:fill-box;transform-origin:center}
.obs.gone{opacity:0;transform:translateY(40px) scale(.8)}
.obs.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.leaf{transition:transform .8s;transform-box:fill-box}
.leaf.l{transform-origin:left center}
.leaf.r{transform-origin:right center}
.opened .leaf{transform:scaleX(.08)}
.light{opacity:0;transition:opacity .6s}
.opened .light{opacity:1}

/* panel */
.panel{background:var(--paper);color:var(--ink);border-radius:18px;padding:1.1rem 1.2rem 1.3rem;text-align:center}
.ask{font-size:.95rem;color:var(--muted);margin-bottom:.7rem}
.wordrow{display:flex;justify-content:center;align-items:center;gap:.8rem;flex-wrap:wrap}
.pic{display:grid;place-items:center;background:rgba(240,138,36,.16);border-radius:12px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.pic:empty{display:none}
.wcard{display:inline-flex;align-items:center;gap:.9rem;padding:.5rem 1.3rem .5rem .5rem;background:#fff;border:2px solid var(--paper2);border-radius:14px}
.wcard .pic{width:4.2rem;height:4.2rem;font-size:2.7rem}
.wtxt{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:700;line-height:1.05}
.panel>.pic,.pic.big{width:5rem;height:5rem;font-size:3.2rem;margin:0 auto .4rem}
.fillword{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:700;letter-spacing:.03em;line-height:1.2;display:flex;justify-content:center;flex-wrap:wrap}
.blank{display:inline-block;min-width:1.6em;margin:0 .08em;border-bottom:.07em solid var(--ink);text-align:center;color:var(--ok)}
.sent{font-size:clamp(1.4rem,5vw,2rem);font-weight:700;line-height:1.45;margin:.2rem 0}
.thm{min-height:1.6rem;margin:.4rem 0 .2rem;font-size:1rem;color:var(--muted)}
.say{gap:.45rem}
.panel .btn{border-color:var(--ink);color:var(--ink)}
.panel .btn:hover:not(:disabled){background:rgba(42,34,24,.08)}
.panel .btn.primary{background:var(--orange);border-color:var(--orange-d);color:#2a1604}
.thplay{width:5rem;height:5rem;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center}
.thplay .ico{width:2.2rem;height:2.2rem}
.hintp{font-size:.85rem;color:var(--muted);margin-top:.6rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.6rem;max-width:560px;margin:.9rem auto 0}
.opt{position:relative;min-height:70px;padding:.5rem .4rem;font-size:1.6rem;font-weight:700;background:#fff;border:2px solid #d9c9a0;border-radius:12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--orange-d)}
.opt:disabled{cursor:default}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt .mk{position:absolute;top:.3rem;right:.4rem;display:flex}
.opt .mk .ico{width:1rem;height:1rem}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.tile{width:clamp(40px,12vw,64px);height:clamp(58px,16vw,84px);border:2px solid #d9c9a0;background:#fff;border-radius:10px;font-size:clamp(1.8rem,7vw,2.8rem);font-weight:700;cursor:pointer;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--orange-d)}
.tile.silent{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);text-decoration:line-through}
.tile.shake{animation:shake .3s}
.msg{min-height:1.4rem;font-size:.95rem;color:var(--bad);margin-top:.5rem}
.fb{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;text-align:left;background:var(--ok-bg);border-left:5px solid var(--ok);border-radius:8px;padding:.8rem 1rem;margin-top:1rem;animation:fadein .2s}
.fb>.ico{width:1.6rem;height:1.6rem;color:var(--ok);margin-top:.1rem}
.fb strong{display:block;color:var(--ok);font-size:1.1rem}
.fb p{font-size:.93rem}
.fb .btn{grid-column:1/-1;justify-self:start;margin-top:.4rem}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* results + album */
.res{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:1.4rem 2.4rem;align-items:center;padding:1.5rem 0}
.sigbox{background:var(--night2);border-radius:22px;padding:1.4rem;text-align:center;position:relative}
.sigbox .cd{width:130px;height:130px;margin:0 auto}
.sigbox .cd svg{width:100%;height:100%}
.sigbox.gold{box-shadow:0 0 0 3px var(--butter),0 0 30px 6px rgba(246,211,101,.35)}
.sigbox .gl{position:absolute;top:.7rem;left:.7rem;font-size:.72rem;font-weight:700;background:var(--butter);color:#3a2a00;border-radius:6px;padding:0 .45rem}
.sigbox h2{font-family:'Chewy',sans-serif;font-weight:400;font-size:1.6rem;color:var(--butter);margin-top:.5rem}
.haul{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0 1rem}
.haul span{display:inline-flex;align-items:center;gap:.15rem;background:var(--night2);border-radius:999px;padding:.1rem .7rem .1rem .3rem;font-weight:700;font-size:.9rem}
.haul svg{width:28px;height:28px}
.stars{display:flex;gap:6px;margin:.4rem 0 .8rem}
.stars svg{width:44px;height:44px}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.2rem}
.albumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;margin-top:1.4rem}
.cslot{background:var(--night2);border-radius:16px;padding:.9rem .6rem;text-align:center;position:relative;min-height:170px}
.cslot svg{width:76px;height:76px}
.cslot.off svg{filter:brightness(0);opacity:.25}
.cslot b{display:block;font-size:.95rem;margin-top:.3rem;line-height:1.25}
.cslot small{display:block;font-size:.74rem;opacity:.8;line-height:1.3;margin-top:.15rem}
.cslot .cnt{position:absolute;top:.5rem;right:.6rem;font-weight:700;background:var(--orange);color:#2a1604;border-radius:999px;min-width:1.6rem;padding:0 .4rem;font-size:.85rem}
.cslot .gd{position:absolute;top:.5rem;left:.6rem;font-size:.68rem;font-weight:700;background:var(--butter);color:#3a2a00;border-radius:6px;padding:0 .35rem}

@media (max-width:900px){
  .play{grid-template-columns:1fr}
  .scene{max-width:520px;margin:0 auto}
  .hero{grid-template-columns:1fr}
  .res{grid-template-columns:1fr}
}
@media (max-width:640px){
  .chars{grid-template-columns:repeat(2,1fr)}
  .how{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:1rem">Please turn on JavaScript to play.</p></noscript>
<script>
/* ============ DATA ============
   word tuple: [word, Thai meaning, blank-spelling (or null), index of blank (optional)] */
const UNITS = [
 {n:1,c:'#8a5a86',on:'#fff',combos:'ar · ir ur · er or',ex:'car · bird · teacher',
  ask:'Which letters make the sound in this word?',pool:['ar','ir','ur','er','or'],
  groups:[
   {label:'ar',note:'ar says /ɑː/ (ah), as in car, farm, park and star.',words:[['car','รถยนต์','ar'],['farm','ฟาร์ม','ar'],['park','สวนสาธารณะ','ar'],['star','ดาว','ar']]},
   {label:'ir / ur',note:'ir and ur say the same sound, /ɜː/ (er), as in bird, girl, nurse and purple.',words:[['bird','นก','ir'],['girl','เด็กผู้หญิง','ir'],['nurse','พยาบาล','ur'],['purple','สีม่วง','ur']]},
   {label:'er / or',note:'At the end of a word, er and or say a soft /ə/, as in teacher, sister, doctor and tractor.',words:[['teacher','ครู','er'],['sister','พี่สาว / น้องสาว','er'],['doctor','หมอ','or'],['tractor','รถแทรกเตอร์','or']]}]},
 {n:2,c:'#e8792f',on:'#1f1a12',combos:'ou ow · oi oy · oo u',ex:'mouse · coin · book',
  ask:'Which letters make the sound in this word?',pool:['ou','ow','oi','oy','oo','u'],
  groups:[
   {label:'ou / ow',note:'ou and ow say /aʊ/ (ow!), as in mouse, house, cow and brown.',words:[['mouse','หนู','ou'],['house','บ้าน','ou'],['cow','วัว','ow'],['brown','สีน้ำตาล','ow']]},
   {label:'oi / oy',note:'oi and oy say /ɔɪ/, as in coin, soil, toy and boy. oy is usually at the end of a word.',words:[['coin','เหรียญ','oi'],['soil','ดิน','oi'],['toy','ของเล่น','oy'],['boy','เด็กผู้ชาย','oy']]},
   {label:'oo / u',note:'oo and u can say a short /ʊ/, as in book, foot, bush and pull.',words:[['book','หนังสือ','oo'],['foot','เท้า','oo'],['bush','พุ่มไม้','u'],['pull','ดึง','u']]}]},
 {n:3,c:'#e5b32f',on:'#1f1a12',combos:'au aw · all wa · or oar',ex:'sauce · ball · horse',
  ask:'Which spelling pattern does this word have?',pool:['au','aw','all','wa','or','oar'],
  groups:[
   {label:'au / aw',note:'au and aw both say /ɔː/, as in sauce, August, prawn and draw.',words:[['sauce','ซอส','au'],['August','เดือนสิงหาคม','au'],['prawn','กุ้ง','aw'],['draw','วาด','aw']]},
   {label:'all / wa',note:'all says /ɔːl/, as in ball and tall. wa often says /wɔː/, as in water and walk.',words:[['ball','ลูกบอล','all'],['tall','สูง','all'],['water','น้ำ','wa'],['walk','เดิน','wa']]},
   {label:'or / oar',note:'or and oar both say /ɔː/, as in horse, fork, roar and board.',words:[['horse','ม้า','or'],['fork','ส้อม','or'],['roar','คำราม','oar'],['board','กระดาน','oar']]}]},
 {n:4,c:'#3f8450',on:'#fff',combos:'are air · ea ear · ear eer',ex:'square · bread · deer',
  ask:'Which sound does this word have?',pool:['are','air','ea','ear','eer'],
  groups:[

const INK='#2b2b35';
const dotEyes=(Lx,Rx,cy,mood,ink=INK,r=3.4)=>{
  if(mood==='cheer')return [Lx,Rx].map(x=>`<path d="M${x-4.5} ${cy+1.5} Q${x} ${cy-5.5} ${x+4.5} ${cy+1.5}" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`).join('');
  if(mood==='scared')return [Lx,Rx].map(x=>`<circle cx="${x}" cy="${cy}" r="${r+1.8}" fill="#fff" stroke="${ink}" stroke-width="1.4"/><circle cx="${x}" cy="${cy}" r="1.6" fill="${ink}"/>`).join('');
  return [Lx,Rx].map(x=>`<circle cx="${x}" cy="${cy}" r="${r}" fill="${ink}"/><circle cx="${x+1.1}" cy="${cy-1.2}" r="1.1" fill="#fff"/>`).join('');
};
const eyePair=(Lx,Rx,cy,mood,o={})=>{
  o=Object.assign({white:'#fff',ink:INK,r:5,pr:2.6,iris:null},o);
  if(mood==='cheer')return [Lx,Rx].map(x=>`<path d="M${x-4.5} ${cy+1.5} Q${x} ${cy-5.5} ${x+4.5} ${cy+1.5}" fill="none" stroke="${o.ink}" stroke-width="2.6" stroke-linecap="round"/>`).join('');
  const r=mood==='scared'?o.r+1.2:o.r,pr=mood==='scared'?o.pr*.55:o.pr;
  return [Lx,Rx].map(x=>`<circle cx="${x}" cy="${cy}" r="${r}" fill="${o.white}" stroke="${o.ink}" stroke-width="1.3"/>${o.iris?`<circle cx="${x}" cy="${cy}" r="${r-1.3}" fill="${o.iris}"/>`:''}<circle cx="${x+.4}" cy="${cy+(mood==='scared'?0:.7)}" r="${pr}" fill="${o.ink}"/><circle cx="${x+1.5}" cy="${cy-1.5}" r=".9" fill="#fff"/>`).join('');
};
const mouth=(cx,cy,mood,ink=INK)=>{
  if(mood==='cheer')return `<path d="M${cx-5.5} ${cy} Q${cx} ${cy+9} ${cx+5.5} ${cy}Z" fill="#7a2b1d" stroke="${ink}" stroke-width="1.6" stroke-linejoin="round"/>`;
  if(mood==='scared')return `<ellipse cx="${cx}" cy="${cy+3}" rx="2.8" ry="3.8" fill="#5a1d14" stroke="${ink}" stroke-width="1.2"/>`;
  return `<path d="M${cx-4} ${cy} Q${cx} ${cy+5} ${cx+4} ${cy}" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>`;
};

function fx(kind){
  if(!prefs.fx)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime;
    FX[kind].forEach(([f,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=kind==='boo'?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.1,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.26);
      o.connect(g);g.connect(ac.destination);o.start(t0+d);o.stop(t0+d+.28);
    });
  }catch(e){}
}

/* ============ RUN STATE + LEVEL BUILDER ============ */
let S=null;
const HW=30,HH=55;
function buildLevel(ui){
  const u=UNITS[ui];
  const script=[['J','sort'],['O','listen'],['J','fill'],['O',ui===6?'hunt':'cloze'],['J','listen'],['O','fill'],['J','cloze']];
  const used=new Set(),cl=shuffle(CLOZE[ui]);let ci=0;
  const take=f=>{const pool=shuffle(u.words).filter(w=>f(w)&&!used.has(w.w));const w=pool[0]||shuffle(u.words).filter(f)[0];used.add(w.w);return w};
  return script.map(([kind,type],n)=>{
    const e={kind,type,n,fails:0,obs:kind==='O'?OBS_OF[type]:null};
    if(type==='sort'){
      const wd=take(()=>true),others=shuffle(u.groups.map((_,gi)=>gi).filter(g=>g!==wd.gi)).slice(0,2);
      e.wd=wd;e.say=wd.w;e.options=shuffle([wd.gi,...others]).map(gi=>({label:u.groups[gi].label,sub:u.groups[gi].sub||'',correct:gi===wd.gi}));
    }else if(type==='fill'){
      const wd=take(w=>w.s),q=fillQ(wd);
      e.wd=wd;e.say=wd.w;e.options=q.opts.slice(0,kind==='J'?3:4).map(o=>({label:o,correct:o===wd.s}));
      if(!e.options.some(o=>o.correct)){e.options[0]={label:wd.s,correct:true}}
      e.options=shuffle(e.options);
    }else if(type==='listen'){
      const wd=take(()=>true),others=shuffle(u.words.filter(x=>x.w!==wd.w)).slice(0,2).map(x=>x.w);
      e.wd=wd;e.say=wd.w;e.options=shuffle([wd.w,...others]).map(o=>({label:o,correct:o===wd.w}));
    }else if(type==='cloze'){
      const q=clozeQ(ui,cl[ci++%cl.length]);
      Object.assign(e,{wd:q.wd,sentence:q.sentence,full:q.full,thTxt:q.thTxt,say:q.say});
      e.options=q.opts.map(o=>({label:o,correct:o===q.wd.w}));
    }else{
      const wd=take(w=>HUNT[w.w]);e.wd=wd;e.say=wd.w;e.hunt=HUNT[wd.w];
    }
    return e;
  });
}

  const wd=e.wd,t=e.type;

  let body='';

  else if(t==='fill'){

      ?`<p class="ask">Which letters are missing?</p>${pic(wd)}<div class="fillword" aria-label="${wd.w}"><span>${b.pre}</span><span class="blank" id="blank">&nbsp;</span><span>${b.post}</span></div><div class="wordrow" style="margin-top:.4rem">${listen}</div><div class="thm">${th(wd)}</div>`
      :`<p class="ask">Which letters fix the word on the stone?</p>${pic(wd)}<div class="wordrow">${listen}</div><div class="thm">${th(wd)}</div>`;
  }else if(t==='listen')body=`<p class="ask">Listen. Which word did you hear?</p><div class="wordrow">${hasSpeech?`<button class="thplay" id="say" aria-label="Play the word again">${I.spk}</button><button class="btn" id="slow">Play slowly</button>`:'<p>Word sounds are not available in this browser.</p>'}</div><div class="thm" id="reveal"></div>`;
  else if(t==='cloze')body=`<p class="ask">Read the sentence. Which word fits?</p>${pic(wd)}<p class="sent" id="sent">${e.sentence.replace('___','<span class="blank" id="blank">&nbsp;&nbsp;&nbsp;</span>')}</p><div class="wordrow">${listen}</div><div class="thm">${prefs.thai?e.thTxt:''}</div>`;
  else body=`<p class="ask">Tap the letter that is silent.</p>${pic(wd)}<div class="wordrow">${listen}</div><div class="tiles">${[...wd.w].map((c,i)=>`<button class="tile" data-i="${i}" aria-label="letter ${c}">${c}</button>`).join('')}</div><div class="thm">${th(wd)}</div>`;
  let input='';
  if(e.kind==='J')input=`<p class="hintp">Tap a sign on the path. A wrong sign is a dead end.</p>`;
  else if(t!=='hunt')input=`<div class="opts">${e.options.map((o,i)=>`<button class="opt" data-i="${i}"><span>${o.label}</span></button>`).join('')}</div>`;
  const lead=e.kind==='O'?`<p class="hintp" style="margin:0 0 .7rem;font-weight:700;color:var(--orange-d)">${OBS_TEXT[e.obs]}</p>`:'';
  return lead+body+input+`<div class="msg" id="msg" aria-live="polite"></div><div id="fbbox" aria-live="polite"></div>`;
}

function showEncounter(){
  if(S.i>=S.enc.length)return showDoor();
  const e=cur();S.busy=false;S.mood='idle';e.fails=0;
  app.innerHTML=`<div class="wrap">${hud()}<div class="play">${sceneHTML(e)}<div class="panel" id="panel">${panelHTML(e)}</div></div></div>`;
  bindMenu();
  $('#back').onclick=leave;
  const sayBtn=$('#say');if(sayBtn)sayBtn.onclick=()=>say(e.say,e.type==='cloze'?.75:.8);
  const slow=$('#slow');if(slow)slow.onclick=()=>say(e.wd.w,.45);
  if(e.kind==='J')$$('.sign').forEach(b=>b.onclick=()=>pickSign(+b.dataset.i));
  else if(e.type==='hunt')bindHunt(e);
  else $$('.opt').forEach(b=>b.onclick=()=>pickOpt(+b.dataset.i));
  S.keys=n=>{const list=e.kind==='J'?$$('.sign'):$$('.opt');const b=list[n-1];if(b&&!b.disabled)b.click()};
  if(prefs.sound||e.type==='listen')setTimeout(()=>{if(S&&cur()===e)say(e.say,e.type==='cloze'?.75:.8)},500);
}

/* ---- hero movement ---- */
function setMood(m){S.mood=m;const h=$('#heroInner');if(h)h.innerHTML=charInner(save.char,m)}
function heroAt(x,y){const h=$('#hero');if(h)h.setAttribute('transform',`translate(${x-HW} ${y-HH})`)}
function walk(pathEl,reverse){
  return new Promise(res=>{
    const L=pathEl.getTotalLength(),sc=$('#scene');
    const set=t=>{const p=pathEl.getPointAtLength((reverse?1-t:t)*L);heroAt(p.x,p.y+Math.sin(t*L/8)*-2);S.hx=p.x;S.hy=p.y};
    if(reduced()){set(1);return res()}
    sc.classList.add('walking');
    const t0=performance.now(),ms=Math.max(500,L*4.2);
    (function step(now){
      const t=Math.min(1,(now-t0)/ms),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      set(e);
      if(t<1)requestAnimationFrame(step);else{sc.classList.remove('walking');res()}
    })(t0);
  });
}
function bubble(text,x,y,side){
  const sc=$('#scene');if(!sc)return;
  $$('.bubble').forEach(b=>b.remove());
  const b=document.createElement('div');b.className='bubble';b.textContent=text;
  if(side){const cx=x+(x<=180?78:-78);b.classList.add('side');b.style.left=(cx/3.6)+'%';b.style.top=((y-24)/4.2)+'%'}
  else{b.style.left=(x/3.6)+'%';b.style.top=((y-62)/4.2)+'%'}
  sc.appendChild(b);setTimeout(()=>b.remove(),1800);
}
function popCandy(n,ids){
  const sc=$('#scene');if(!sc)return;
  const p=document.createElement('div');p.className='pop';
  p.innerHTML=ids.map(candySVG).join('')+`<b>+${n}</b>`;
  sc.appendChild(p);setTimeout(()=>p.remove(),1400);
  const j=$('#jar');if(j){j.classList.remove('pulse');void j.offsetWidth;j.classList.add('pulse')}
  const jn=$('#jarn');if(jn)jn.textContent=S.candies.length;
}
function award(e){
  const n=e.fails?1:3,got=[];
  for(let i=0;i<n;i++)got.push(pick(COMMONS));
  got.forEach(id=>{S.candies.push(id);addAlbum(id)});
  if(!e.fails)S.firstTry++;
  fx('pop');popCandy(n,got);
  return n;
}
function successPanel(e,n){
  const g=UNITS[S.ui].groups[e.wd.gi],last=S.i+1>=S.enc.length;
  let note=fmt(g,e.wd.w);
  if(e.type==='cloze')note=`${e.full}<br>${note}`;
  if(e.type==='fill'){const b=blankInfo(e.wd);note=`${e.wd.w} = ${b.pre?b.pre+' + ':''}<b>${b.mid}</b>${b.post?' + '+b.post:''}. ${note}`}
  $('#msg').textContent='';
  $('#fbbox').innerHTML=`<div class="fb">${I.check}<div><strong>${e.fails?'You made it!':'Right!'} +${n} ${cw(n)}</strong><p>${note}</p></div><button class="btn primary" id="nxt">${last?'Walk to the door':'Keep walking'} ${I.next}</button></div>`;
  const b=$('#nxt');b.onclick=advance;b.focus({preventScroll:true});
  b.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});
  S.keys=null;
}
async function advance(){
  const sc=$('#scene');
  if(sc)sc.classList.add('fade');
  await delay(reduced()?0:280);
  S.i++;showEncounter();
}

/* ---- junction: signs ---- */
async function pickSign(i){
  if(S.busy)return;
  const e=cur(),o=e.options[i],sign=$(`.sign[data-i="${i}"]`);
  S.busy=true;
  $$('.sign').forEach(s=>s.disabled=true);
  const path=$('#w'+i);
  await walk(path);
  if(o.correct){
    sign.classList.add('ok');setMood('cheer');
    if(e.type==='fill')$('#blank').textContent=blankInfo(e.wd).mid;
    if(e.type==='cloze')$('#blank').innerHTML=colored(e.wd);
    if(e.type==='sort')$('#wtxt').innerHTML=colored(e.wd);
    if(e.type==='listen'){const r=$('#reveal');if(r)r.innerHTML=`${pic(e.wd)}<div>${th(e.wd)}</div>`}
    const n=award(e);
    successPanel(e,n);
    S.busy=false;
  }else{
    e.fails++;S.fails++;
    $(`#de${i}`).classList.add('show');setMood('scared');fx('boo');
    bubble(pick(['Eek! Dead end!','Oops! Wrong way!','Boo! Go back!']),S.hx,S.hy,true);
    $('#msg').textContent='Dead end! Listen again, then try another sign.';
    await delay(reduced()?200:1000);
    setMood('idle');
    await walk(path,true);
    sign.classList.add('bad');sign.setAttribute('aria-label',sign.getAttribute('aria-label')+' (dead end)');
    $$('.sign').forEach((s,k)=>{if(!s.classList.contains('bad'))s.disabled=false});
    const tryN=$$('.sign:not(.bad)')[0];
    S.busy=false;
  }
}

/* ---- obstacle: answer buttons ---- */
async function clearObstacle(e){
  const o=$('#obs');
  if(e.obs==='gate'){$('#scene').classList.add('opened');o.classList.add('opened')}
  o.classList.add('gone');
  await delay(reduced()?0:650);
}
async function pickOpt(i){
  if(S.busy)return;
  const e=cur(),o=e.options[i],btn=$(`.opt[data-i="${i}"]`);
  if(o.correct){
    S.busy=true;
    $$('.opt').forEach(b=>{b.disabled=true;if(b!==btn)b.style.opacity=.5});
    btn.classList.add('ok');btn.insertAdjacentHTML('beforeend',`<span class="mk">${I.check}</span>`);
    if(e.type==='fill'){const sb=$('#stoneBlank');if(sb){sb.textContent=blankInfo(e.wd).mid;sb.setAttribute('fill','#256f49')}}
    if(e.type==='cloze')$('#blank').innerHTML=colored(e.wd);
    if(e.type==='listen'){const r=$('#reveal');if(r)r.innerHTML=`${pic(e.wd)}<div>${th(e.wd)}</div>`}
    setMood('cheer');
    await clearObstacle(e);
    await walk($('#wt'));
    const n=award(e);
    successPanel(e,n);
    S.busy=false;
  }else{
    e.fails++;S.fails++;
    btn.disabled=true;btn.classList.add('bad');btn.insertAdjacentHTML('beforeend',`<span class="mk">${I.cross}</span>`);
    scare(e,'Eek! Try again!');
  }
}
async function scare(e,txt){
  setMood('scared');fx('boo');
  const ob=$('#obs');if(ob){ob.classList.remove('shake');void ob.getBoundingClientRect();ob.classList.add('shake')}
  bubble(txt,180,372);
  $('#msg').textContent='Not quite. Listen again and try another answer.';
  await delay(reduced()?200:900);
  if(S&&cur()===e&&!S.busy)setMood('idle');
}
function bindHunt(e){
  const [target,soft]=e.hunt,wd=e.wd;
  $$('.tile').forEach(t=>t.onclick=async()=>{
    if(S.busy)return;
    const i=+t.dataset.i;
    if(target.includes(i)){
      S.busy=true;
      $$('.tile').forEach((x,k)=>{x.disabled=true;if(target.includes(k))x.classList.add('silent')});
      setMood('cheer');
      await clearObstacle(e);
      await walk($('#wt'));
      const n=award(e);
      successPanel(e,n);
      S.busy=false;
    }else if(soft.includes(i)){
      $('#msg').textContent=`That letter is silent too, but look for the one in “${UNITS[S.ui].groups[wd.gi].label}”.`;
    }else{
      e.fails++;S.fails++;
      t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');
      scare(e,'Eek! Try again!');
    }
  });
}

/* ============ DOOR + RESULTS ============ */
function showDoor(){
  S.busy=false;S.mood='cheer';
  app.innerHTML=`<div class="wrap">${hud()}<div class="play"><div class="scene" id="scene"><svg class="sc" viewBox="0 0 360 420" role="img" aria-label="The haunted house door at the end of the trail">${doorSVG(S.ui)}${heroSVG(180,398)}</svg></div>
  <div class="panel"><p class="ask">You made it to the end of the trail!</p><h2 class="disp" style="font-size:2rem;color:var(--orange-d);margin-bottom:.4rem">Knock, knock…</h2>
  <p>You collected <b>${S.candies.length}</b> ${cw(S.candies.length)} on the way. Someone is waiting behind this door with a special treat.</p>
  <div style="margin-top:1rem"><button class="btn primary" id="knock">Knock on the door</button></div></div></div></div>`;
  bindMenu();$('#back').onclick=leave;
  $('#knock').onclick=async()=>{
    $('#knock').disabled=true;fx('open');
    $('#scene').classList.add('opened');
    await delay(reduced()?0:1300);
    finishLevel();
  };
}
function finishLevel(){
  const ui=S.ui,perfect=S.fails===0,ft=S.firstTry,total=S.enc.length;
  const stars=ft>=total-1?3:ft>=Math.ceil(total*.6)?2:1;
  const sig=CANDY.find(c=>c.lv===ui);
  addAlbum(sig.id,perfect);
  const prev=save.best[ui]||{stars:0,gold:false,candy:0};
  save.best[ui]={stars:Math.max(prev.stars,stars),gold:prev.gold||perfect,candy:Math.max(prev.candy,S.candies.length)};
  persist();fx('win');
  const counts={};S.candies.forEach(id=>counts[id]=(counts[id]||0)+1);
  const run=S;
  const msg=perfect?'No wrong turns at all! The treat is gold.':ft>=total-1?'Just one wrong turn. Great walking!':'You found the way out. Walk again to learn the tricky ones.';
  app.innerHTML=`<div class="wrap"><div class="bar"><div class="wm">Bright EngMath</div>${menu()}</div>
  <section class="res"><div class="sigbox${perfect?' gold':''}">${perfect?'<span class="gl">GOLD</span>':''}<div class="cd">${candySVG(sig.id,130)}</div><div class="sh" style="margin-top:.4rem">New treat</div><h2>${sig.name}</h2></div>
  <div><div class="sh">${LEVELS[ui].name} · Unit ${UNITS[ui].n}</div><h1 class="disp pagetitle">Trick or treat!</h1>
  <div class="stars" role="img" aria-label="${stars} of 3 stars">${stars3(stars)}</div>
  <p>${msg}</p><p style="opacity:.85;font-size:.92rem;margin-top:.3rem">${ft} of ${total} stops right on the first try.</p>
  <div class="haul" aria-label="Candy collected on this trail">${Object.entries(counts).map(([id,n])=>`<span>${candySVG(id,28)}×${n}</span>`).join('')}</div>
  <div class="actions"><button class="btn primary" id="again">Walk it again</button><button class="btn" id="tr">Back to the trail</button><button class="btn" id="jr">Candy jar</button></div></div></section></div>`;
  bindMenu();
  $('#again').onclick=()=>startLevel(ui);$('#tr').onclick=trail;$('#jr').onclick=album;
  window.scrollTo(0,0);S=null;
}

document.addEventListener('keydown',e=>{
  if(S&&S.keys&&!S.busy&&/^[1-9]$/.test(e.key)&&!e.metaKey&&!e.ctrlKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))S.keys(+e.key);
});
title();
</script>

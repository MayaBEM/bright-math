:root{
  --bg:#EAF5F3; --paper:#FFFFFF; --ink:#2D3142; --ink2:#5C6275; --line:#2D3142;
  --tile:#E3E8EC; --soft:#F6FAF9;
  --u1:#F26B4F; --u2:#1FA88F; --u3:#F4AC2C; --u4:#3C97DD; --u5:#E0628A; --boss:#2D3142;
  --t1:#FFE4DC; --t2:#D6F3EC; --t3:#FFF0CC; --t4:#DCEEFC; --t5:#FCE0EA;
  --shade:#FF8A65; --shade2:#FFC4AE; --ok:#16917B; --bad:#D64B3F; --okbg:#DDF5EE; --badbg:#FDE8E4;
  --focus:#3C97DD; --radius:20px;
}
[data-theme="dark"]{
  --bg:#171C26; --paper:#222938; --ink:#F1F3F7; --ink2:#B4BACB; --line:#F1F3F7;
  --tile:#2E3646; --soft:#283042; --shade:#FF8A65; --shade2:#8C4B33;
  --t1:#4A2E2A; --t2:#1E413B; --t3:#4A3E1E; --t4:#1F3550; --t5:#4A2636;
  --okbg:#173A33; --badbg:#41231F; --boss:#10141C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg) radial-gradient(circle at 1px 1px,rgba(45,49,66,.07) 1.6px,transparent 2px) 0 0/26px 26px;color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,.ttl{font-family:Poppins,system-ui,sans-serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
/* header */
header{background:var(--paper);border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:20}
.hbar{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand img{height:40px;width:auto;display:block}
.brand .ttl{font-size:17px;font-weight:700}
.brand small{display:block;font-family:Lexend;font-size:12px;color:var(--ink2);font-weight:400}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px;background:var(--paper)}
.ib{border:2px solid var(--ink);background:var(--paper);border-radius:10px;min-width:44px;height:44px;padding:0 10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ib svg{width:20px;height:20px}
/* generic */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);padding:22px;box-shadow:0 6px 0 rgba(45,49,66,.9)}
[data-theme="dark"] .card{box-shadow:0 6px 0 #000}
.btn{border:3px solid var(--ink);background:var(--u1);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700;font-family:Poppins;font-size:17px;min-height:50px;box-shadow:0 4px 0 var(--ink);transform:translateY(-2px);transition:transform .08s,box-shadow .08s}
[data-theme="dark"] .btn{background:var(--shade);color:#1B1B1B;border-color:var(--shade);box-shadow:0 4px 0 #9b4b2c}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.go2{background:var(--u2)}.btn.go4{background:var(--u4)}
[data-theme="dark"] .btn.alt{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 #000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--ink2)}
.th{display:none;background:var(--soft);border-left:5px solid var(--u3);padding:8px 12px;border-radius:8px;margin-top:8px;font-size:15px;font-family:Lexend,"Noto Sans Thai",Tahoma,sans-serif}
body.showTH .th{display:block}
body.showTH span.th{display:inline}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-weight:700;margin:0 .12em;font-family:Poppins}
.fr .n{border-bottom:.11em solid currentColor;padding:0 .18em;min-width:1em;text-align:center}
.fr .d{padding:0 .18em;text-align:center}
.fr .q{display:inline-block;min-width:1.3em;border:.09em solid currentColor;border-radius:.15em;margin:.06em 0;text-align:center}
/* mascot */
.pip{flex:none;display:block}
.pip.bob{animation:bob 1.4s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.say{display:flex;gap:12px;align-items:flex-start}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px 16px;flex:1}
.bubble::before{content:'';position:absolute;left:-12px;top:22px;width:18px;height:18px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.fb .say .bubble{background:transparent;border:0;padding:0}.fb .say .bubble::before{display:none}
.stars{display:inline-flex;gap:2px}.stars svg{width:20px;height:20px}
/* start */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center}
.hero h1{font-size:44px;font-weight:800;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--u1)}
.quiltArt{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);overflow:hidden;aspect-ratio:1}
.quiltArt svg{display:block;width:100%;height:100%}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input.t,select.t{width:100%;border:2.5px solid var(--ink);border-radius:10px;padding:10px 12px;font:inherit;background:var(--paper);color:var(--ink);min-height:48px}
/* map */
.quilt{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--ink);box-shadow:0 7px 0 var(--ink)}
.patch{position:relative;overflow:hidden;border:0;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--paper);padding:18px 16px 16px;text-align:left;min-height:190px;display:flex;flex-direction:column;gap:6px}
.patch:nth-child(3n){border-right:0}
.patch:nth-child(n+4){border-bottom:0}
.patch .num{font-family:Poppins;font-weight:800;font-size:15px;color:#fff;border-radius:8px;padding:2px 10px;align-self:flex-start}
.patch h3{font-size:20px;font-weight:700}
.patch .stitch{position:absolute;inset:8px;border:2.5px dashed currentColor;border-radius:14px;opacity:.55;pointer-events:none}
.patch .ico{position:absolute;right:14px;top:14px;width:70px;opacity:.95}
.patch h3{max-width:calc(100% - 78px)}
.patch.locked{background:var(--tile);color:var(--ink2);cursor:not-allowed}
.patch.done{filter:saturate(1.15)}
.steps4{display:flex;gap:6px;margin-top:auto}
.steps4 i{flex:1;height:10px;border-radius:4px;border:2px solid var(--ink);background:var(--paper)}
.steps4 i.on{background:var(--ink)}
.tag{font-size:13px;font-weight:600}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.dock .btn{width:100%;font-size:15px;padding:10px}
/* unit */
.unitHead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.unitHead .sw{width:54px;height:54px;border-radius:12px;border:3px solid var(--ink)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stepCard{border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);background:var(--paper);padding:16px;text-align:left;min-height:150px;display:flex;flex-direction:column;gap:6px}
.stepCard b{font-family:Poppins;font-size:19px}
.stepCard .st{margin-top:auto;font-size:14px;font-weight:600}
.stepCard:disabled{background:var(--tile);color:var(--ink2);cursor:not-allowed}
.stepCard .k{font-family:Poppins;font-weight:800;font-size:28px;line-height:1}
/* lesson */
.lesson{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.lesson .vis{background:var(--t4);border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;align-items:center;justify-content:center;min-height:280px;flex-wrap:wrap;gap:8px}
.lesson .txt{font-size:20px}
.lesson .txt p{margin:0 0 10px}
.mistake{border:3px solid var(--bad);border-radius:12px;padding:12px 14px;background:var(--badbg)}
.mistake .lab{font-family:Poppins;font-weight:800;color:var(--bad);font-size:14px;letter-spacing:.5px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
/* shapes */
svg.shape{width:100%;max-width:230px;height:auto;display:block;overflow:visible}
.part{fill:var(--paper);stroke:var(--line);stroke-width:3;stroke-linejoin:round;transition:fill .35s}
.part.on{fill:var(--shade)}
svg.tap .part{cursor:pointer}
svg.tap .part:hover{fill:var(--shade2)}
svg.tap .part.on:hover{fill:var(--shade)}
.btnItem .body{fill:var(--paper);stroke:var(--line);stroke-width:3;transition:fill .3s}
.btnItem.on .body{fill:var(--shade)}
.btnItem .hole{fill:var(--line)}
.btnItem.on .hole{fill:var(--paper)}
svg.tap .btnItem{cursor:pointer}
.sq{fill:var(--tile);stroke:var(--line);stroke-width:3}
svg.nl{width:100%;max-width:640px;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.nl .ax{stroke:var(--line);stroke-width:4;stroke-linecap:round}
.nl .tk{stroke:var(--line);stroke-width:3.5;stroke-linecap:round}
.nl text{fill:var(--ink);font-family:Poppins;font-weight:700;font-size:28px}
.nl .pin circle{fill:var(--shade);stroke:var(--line);stroke-width:3}
.nl .pin line{stroke:var(--line);stroke-width:4}
.nl .jump{fill:none;stroke:var(--shade);stroke-width:3.5;stroke-linecap:round}
.nl.drag{cursor:grab}
.nl .dot{fill:var(--shade);stroke:var(--line);stroke-width:3}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pbar{flex:1;min-width:140px;height:16px;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--paper)}
.pbar i{display:block;height:100%;background:var(--u2);transition:width .3s}
.qcard{display:grid;grid-template-columns:1fr;gap:14px}
.prompt{display:flex;gap:10px;align-items:flex-start;font-size:22px;font-weight:600}
.prompt .fr{font-size:24px}
.visq{display:flex;justify-content:center;align-items:center;min-height:120px}
.visq svg.shape{max-width:300px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{border:3px solid var(--ink);background:var(--paper);border-radius:18px;box-shadow:0 4px 0 var(--ink);min-height:88px;font-size:20px;font-weight:600;padding:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.opt .fr{font-size:30px}
.opt:hover{background:var(--t4)}
.opt.good{animation:pop .35s ease-out}
.opt.good{background:var(--okbg);border-color:var(--ok);border-width:4px}
.opt.bad{background:var(--badbg);border-color:var(--bad);border-width:4px;position:relative}
.opt.bad::after{content:'✗';position:absolute;top:4px;right:8px;color:var(--bad);font-weight:800;font-size:18px}
.opt.good{position:relative}.opt.good::after{content:'✓';position:absolute;top:4px;right:8px;color:var(--ok);font-weight:800;font-size:18px}
.opt:disabled{cursor:default}
.fb{border-radius:18px;padding:12px 16px;border:3px solid;display:none;font-size:18px}
.fb.show{display:block}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.no{border-color:var(--bad);background:var(--badbg)}
.fb .big{font-family:Poppins;font-weight:800;font-size:20px}
.hintBox{border:2.5px solid var(--u3);border-radius:12px;padding:10px 14px;background:var(--soft);display:none}
.hintBox.show{display:block}
.hintBox ol{margin:4px 0 0;padding-left:22px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:520px;margin:0 auto}
.keypad button{border:2.5px solid var(--ink);background:var(--paper);border-radius:10px;min-height:52px;font-size:22px;font-weight:700;font-family:Poppins}
.bigfr{font-size:58px;display:flex;justify-content:center}
.bigfr .fr .q.filled{background:var(--okbg)}
.partPick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.partPick button{border:2.5px solid var(--ink);background:var(--paper);border-radius:10px;min-width:56px;min-height:48px;font-weight:700;font-size:18px}
.partPick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.timer{font-family:Poppins;font-weight:800;font-size:18px;border:2.5px solid var(--ink);border-radius:10px;padding:2px 12px;background:var(--paper)}
.timer.low{background:var(--badbg);border-color:var(--bad)}
/* explore */
.explore{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
.tool{display:flex;flex-direction:column;gap:14px;align-items:center}
.readout{font-size:52px;display:flex;align-items:center;gap:14px;justify-content:center;min-height:120px}
.readout .w{font-size:20px;font-weight:600}
.chal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chal li{border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;background:var(--paper);font-weight:600}
.chal li .bx{width:28px;height:28px;border:2.5px solid var(--ink);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800}
.chal li.done{background:var(--okbg)}
.chal li.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;border-right:2px solid var(--ink);background:var(--paper);padding:8px 14px;min-height:44px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* results, report */
.score{font-family:Poppins;font-weight:800;font-size:64px;line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:var(--paper);font-size:14px;font-weight:600}
.badge.off{opacity:.35}
.badge svg{width:30px;height:30px}
table.rep{width:100%;border-collapse:collapse;font-size:15px}
table.rep th,table.rep td{border:2px solid var(--ink);padding:6px 8px;text-align:left}
table.rep th{background:var(--soft);font-family:Poppins}
.report{max-width:820px;margin:0 auto}
.repHead{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.repHead img{height:48px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.kv div{border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:Poppins;font-size:20px}
/* cheat sheet */
.cheat{max-width:820px;margin:0 auto;background:#fff;color:#22303C;border:2.5px solid #22303C;border-radius:12px;padding:18px}
.cheat .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cheat .box{border:2px solid #22303C;border-radius:10px;padding:10px}
.cheat h3{font-size:17px;margin-bottom:4px}
.cheat svg .part{fill:#fff;stroke:#22303C}
.cheat svg .part.on{fill:#9FA9B0}
.cheat .nl text{fill:#22303C}.cheat .nl .ax,.cheat .nl .tk,.cheat .nl .pin line{stroke:#22303C}
.cheat .nl .jump{stroke:#22303C}.cheat .nl .dot{fill:#9FA9B0;stroke:#22303C}
.cheat .btnItem .body{stroke:#22303C;fill:#fff}.cheat .btnItem.on .body{fill:#9FA9B0}.cheat .btnItem .hole{fill:#22303C}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,28,34,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:440px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-30px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;transition:transform .3s;display:flex;gap:10px;align-items:center;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast{transition:transform .3s,opacity .3s}
footer{max-width:1000px;margin:10px auto 24px;padding:0 16px;font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:760px){
  html,body{font-size:16px}
  .hero{grid-template-columns:1fr}.hero h1{font-size:34px}
  .quilt{grid-template-columns:1fr 1fr}
  .patch .ico{width:34px;right:10px;top:12px}.patch h3{max-width:none;font-size:18px}
  .patch{min-height:160px;border-right:3px solid var(--ink)!important;border-bottom:3px solid var(--ink)!important}
  .patch:nth-child(2n){border-right:0!important}
  .patch:nth-child(n+5){border-bottom:0!important}
  .dock{grid-template-columns:1fr 1fr}
  .path{grid-template-columns:1fr 1fr}
  .lesson,.explore{grid-template-columns:1fr}
  .lesson .vis{min-height:220px}
  .opts{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:1fr 1fr}
  .cheat .grid{grid-template-columns:1fr}
  .brand .ttl{font-size:15px}.brand small{display:none}
  .prompt{font-size:19px}
  .keypad{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:520px){.brand .ttl{display:none}.brand img{height:34px}.hbar{gap:5px;padding:6px 10px;flex-wrap:nowrap}.ib{min-width:38px;height:38px;padding:0 6px}.chip{padding:2px 8px;font-size:13px}.chip .lb{display:none}.toast{top:60px}}
@media print{
  header,footer,.noprint,.modal,.toast{display:none!important}
  body{background:#fff;color:#000}
  .wrap{padding:0;max-width:none}
  .card{border-width:2px}
  @page{size:A4;margin:12mm}
}
</style>

<script>
"use strict";
/* ========== helpers ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
const DENS=[2,3,4,6,8];
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const DW={2:['half','halves'],3:['third','thirds'],4:['fourth','fourths'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths']};
const sayF=(a,b)=>NUMW[a]+' '+(a===1?DW[b][0]:DW[b][1]);
const F=(a,b,c='')=>`<span class="fr ${c}"><span class="n">${a}</span><span class="d">${b}</span></span>`;
const are=n=>n===1?'is':'are';const pp=(n,w)=>n+' '+w+(n===1?'':'s');
const TH=(t)=>`<div class="th" lang="th">${t}</div>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let timers=[];const later=(f,ms)=>{timers.push(setTimeout(f,ms));};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[];if(bossTick){clearInterval(bossTick);bossTick=null;}};
let bossTick=null;

/* ========== state ========== */
const KEY='bem_fraction_quilt_v1';
const UNITS=[
 {name:'Equal Parts',short:'Equal Parts',color:'var(--u1)',th:'แบ่งเท่า ๆ กัน',goal:'Tell equal from not equal parts and name halves, thirds, fourths, sixths and eighths.'},
 {name:'Part of a Whole',short:'Whole',color:'var(--u2)',th:'เศษส่วนของหนึ่งชิ้น',goal:'Name the fraction that is shaded and shade a fraction.'},
 {name:'Part of a Set',short:'Set',color:'var(--u3)',th:'เศษส่วนของกลุ่ม',goal:'Name a fraction of a group of things.'},
 {name:'On the Number Line',short:'Number Line',color:'var(--u4)',th:'เศษส่วนบนเส้นจำนวน',goal:'Find and place fractions between 0 and 1.'},
 {name:'Missing Numbers & Build It',short:'Build It',color:'var(--u5)',th:'หาตัวเลขที่หายไป และสร้างเศษส่วน',goal:'Find a missing top or bottom number and build your own fractions.'}
];
function blank(){return{name:'',cls:'',xp:0,streak:0,best:0,badges:[],
 units:UNITS.map(()=>({learn:false,explore:false,practice:false,check:false,checkBest:0,checkLast:null,pr:{c:0,t:0},fast:false})),
 diag:null,boss:null,reviews:0,settings:{hideTH:false,unlock:false,timer:10,sound:true,dark:false,th:false}};}
let S=blank();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.units){S=Object.assign(blank(),s);S.settings=Object.assign(blank().settings,s.settings||{});}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ========== sound / speech / fx ========== */
let AC=null;
function tone(seq){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});}catch(e){}}
const sOK=()=>tone([[660,.12],[880,.18]]);
const sNO=()=>tone([[300,.18],[220,.22]]);
const sWIN=()=>tone([[523,.12],[659,.12],[784,.12],[1046,.3]]);
function speak(t){try{if(!('speechSynthesis' in window))return toast('Read-aloud is not available on this device.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
const spkBtn=(t)=>`<button class="ib" data-say="${esc(t)}" aria-label="Read aloud" title="Read aloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>`;
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#F26B4F','#1FA88F','#F4AC2C','#3C97DD','#E0628A','#2D3142'];
 for(let i=0;i<70;i++){const d=document.createElement('div');d.className='conf';d.style.left=rnd(100)+'vw';d.style.background=pick(cols);d.style.animationDelay=(Math.random()*.5)+'s';d.style.width=(6+rnd(8))+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),2300);}}
let toastT;function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ========== mascot: Pip the button ========== */
function pip(mood='happy',size=86,bob=false){const ink='#2D3142';
 const mouth={happy:`<path d="M38 64 Q50 76 62 64" stroke="${ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
  think:`<circle cx="52" cy="68" r="4.5" fill="${ink}"/>`,
  cheer:`<path d="M36 61 Q50 84 64 61 Z" fill="${ink}"/><path d="M43 70 Q50 76 57 70" fill="#FF6F61"/>`}[mood];
 const eyes=mood==='think'?`<circle cx="40" cy="46" r="6" fill="${ink}"/><circle cx="62" cy="46" r="6" fill="${ink}"/><circle cx="42" cy="44" r="2" fill="#fff"/><circle cx="64" cy="44" r="2" fill="#fff"/>`
  :mood==='cheer'?`<path d="M33 49 Q39 41 45 49" stroke="${ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M55 49 Q61 41 67 49" stroke="${ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`
  :`<circle cx="39" cy="49" r="6" fill="${ink}"/><circle cx="61" cy="49" r="6" fill="${ink}"/><circle cx="41" cy="47" r="2" fill="#fff"/><circle cx="63" cy="47" r="2" fill="#fff"/>`;
 return `<svg class="pip ${bob?'bob':''}" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">
 <path d="M50 18 C 46 6, 60 0, 64 8 C 68 16, 56 18, 58 10" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
 <circle cx="50" cy="56" r="40" fill="#FF8A65" stroke="${ink}" stroke-width="4.5"/>

/* ========== drawing ========== */
const P=(x,y)=>[x,y];
function ptsToD(pts){return 'M'+pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' L')+' Z';}
function sector(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];const[x0,y0]=p(a0),[x1,y1]=p(a1);
 return `M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;}
const GRID={2:[1,2],3:[1,3],4:[2,2],6:[2,3],8:[2,4]};
function kindsFor(b){const k=['circle','bar'];if(b===4||b===6||b===8)k.push('grid');if(b===4||b===8)k.push('tri');return k;}
/* returns array of path d strings */
function partsOf(kind,b,w){
 const out=[];
 if(kind==='circle'){const ws=w||Array(b).fill(1);const tot=ws.reduce((s,x)=>s+x,0);let a=0;ws.forEach(x=>{const a1=a+360*x/tot;out.push(sector(100,100,88,a,a1));a=a1;});}
 else if(kind==='bar'){const ws=w||Array(b).fill(1);const tot=ws.reduce((s,x)=>s+x,0);let x0=10;ws.forEach(x=>{const x1=x0+180*x/tot;out.push(ptsToD([P(x0,55),P(x1,55),P(x1,145),P(x0,145)]));x0=x1;});}
 else if(kind==='bands'){const ws=w;const tot=ws.reduce((s,x)=>s+x,0);let y0=20;ws.forEach(x=>{const y1=y0+160*x/tot;out.push(ptsToD([P(20,y0),P(180,y0),P(180,y1),P(20,y1)]));y0=y1;});}
 else if(kind==='grid'){const[r,c]=GRID[b];const s=Math.min(180/c,180/r);const ox=100-s*c/2,oy=100-s*r/2;for(let i=0;i<r;i++)for(let j=0;j<c;j++){const x=ox+j*s,y=oy+i*s;out.push(ptsToD([P(x,y),P(x+s,y),P(x+s,y+s),P(x,y+s)]));}}
 else if(kind==='tri'){const c=P(100,100),TL=P(20,20),TR=P(180,20),BR=P(180,180),BL=P(20,180);
  if(b===4){[[TL,TR],[TR,BR],[BR,BL],[BL,TL]].forEach(([p,q])=>out.push(ptsToD([c,p,q])));}
  else{const TM=P(100,20),RM=P(180,100),BM=P(100,180),LM=P(20,100);[[TL,TM],[TM,TR],[TR,RM],[RM,BR],[BR,BM],[BM,BL],[BL,LM],[LM,TL]].forEach(([p,q])=>out.push(ptsToD([c,p,q])));}}
 return out;
}
function shapeSVG(kind,b,on,opt={}){const ps=partsOf(kind,b,opt.w);const set=new Set(on||[]);
 return `<svg class="shape ${opt.tap?'tap':''}" viewBox="0 0 200 200" role="img" aria-label="${opt.label||'shape'}" style="${opt.max?'max-width:'+opt.max+'px':''}">`+
  ps.map((d,i)=>`<path class="part ${set.has(i)?'on':''}" data-i="${i}" d="${d}"/>`).join('')+`</svg>`;}
function shadedIdx(kind,b,a){if(kind==='grid'||kind==='tri')return shuffle(range(0,b-1)).slice(0,a);const s=rnd(b);return range(0,a-1).map(i=>(kind==='circle'?(s+i)%b:i));}
function randUnequal(){const k=pick(['bar','bar','circle','bands']);
 const W={bar:[[1,2],[1,1,2],[2,1,1,1],[1,2,1],[3,1],[1,1,1,2],[1,2,1,2]],circle:[[180,90,90],[90,90,60,120],[140,220],[120,60,120,60]],bands:[[1,2],[1,1,2],[2,1,3],[1,3]]}[k];
 const w=shuffle(pick(W));return{kind:k,w,b:w.length};}
/* sets */
function setSVG(n,on,opt={}){const set=new Set(on||[]);const cols=n<=4?n:Math.ceil(n/2),rows=Math.ceil(n/cols),c=74;
 let s=`<svg class="shape ${opt.tap?'tap':''}" viewBox="0 0 ${cols*c} ${rows*c}" style="max-width:${Math.min(cols*c*1.15,420)}px" role="img" aria-label="${opt.label||'set'}">`;
 for(let i=0;i<n;i++){const x=(i%cols)*c+c/2,y=Math.floor(i/cols)*c+c/2;
  if(opt.shapes){const isSq=opt.shapes[i];s+= isSq?`<rect class="sq" x="${x-25}" y="${y-25}" width="50" height="50" rx="4"/>`:`<circle class="sq" cx="${x}" cy="${y}" r="27"/>`;}
  else{s+=`<g class="btnItem ${set.has(i)?'on':''}" data-i="${i}"><circle class="body" cx="${x}" cy="${y}" r="28"/>${[[-7,-7],[7,-7],[-7,7],[7,7]].map(([dx,dy])=>`<circle class="hole" cx="${x+dx}" cy="${y+dy}" r="3.6"/>`).join('')}</g>`;}}
 return s+'</svg>';}
/* number line */
const NX0=50,NX1=590,NY=80;const nlx=(i,b)=>NX0+(NX1-NX0)*i/b;
function nlSVG(b,opt={}){let s=`<svg class="nl ${opt.drag?'drag':''}" viewBox="0 0 640 150" role="img" aria-label="number line from 0 to 1">`;
 s+=`<line class="ax" x1="${NX0-18}" y1="${NY}" x2="${NX1+18}" y2="${NY}"/>`;
 if(opt.jumps){for(let i=0;i<opt.jumps;i++){const a=nlx(i,b),c=nlx(i+1,b),m=(a+c)/2;s+=`<path class="jump" d="M${a+4},${NY-6} Q${m},${NY-48} ${c-4},${NY-6}"/>`;}}
 for(let i=0;i<=b;i++){const x=nlx(i,b),h=(i===0||i===b)?24:16;s+=`<line class="tk" x1="${x}" y1="${NY-h}" x2="${x}" y2="${NY+h}"/>`;}
 s+=`<text x="${NX0}" y="${NY+56}" text-anchor="middle">0</text><text x="${NX1}" y="${NY+56}" text-anchor="middle">1</text>`;
 if(opt.dot!=null)s+=`<circle class="dot" cx="${nlx(opt.dot,b)}" cy="${NY}" r="11"/>`;
 if(opt.pin!=null)s+=`<g class="pin" transform="translate(${nlx(opt.pin,b)},0)"><line x1="0" y1="${NY}" x2="0" y2="${NY-46}"/><circle cx="0" cy="${NY-56}" r="15"/><circle cx="0" cy="${NY-56}" r="5" fill="#fff" stroke="none"/></g>`;
 if(opt.drag)s+=`<rect x="0" y="0" width="640" height="150" fill="transparent"/>`;
 return s+'</svg>';}
function wireNL(svg,b,get,setIdx){let dragging=false;
 const toIdx=e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*640;return Math.max(0,Math.min(b,Math.round((x-NX0)/(NX1-NX0)*b)));};
 const move=i=>{const g=$('.pin',svg);if(g)g.setAttribute('transform',`translate(${nlx(i,b)},0)`);setIdx(i);};
 svg.addEventListener('pointerdown',e=>{dragging=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}move(toIdx(e));e.preventDefault();});
 svg.addEventListener('pointermove',e=>{if(dragging)move(toIdx(e));});
 const up=()=>{dragging=false;};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
 svg.tabIndex=0;svg.addEventListener('keydown',e=>{let i=get();if(e.key==='ArrowRight'){move(Math.min(b,i+1));e.preventDefault();}if(e.key==='ArrowLeft'){move(Math.max(0,i-1));e.preventDefault();}});}

 ticks:['You counted tick marks. Count the spaces (jumps) between 0 and 1.','หนูนับขีด ต้องนับช่อง (การกระโดด) ระหว่าง 0 ถึง 1'],
 fromEnd:['You counted back from 1. Always count the jumps from 0.','หนูนับถอยจาก 1 ต้องนับจาก 0 เสมอ'],
 count:['Count again carefully, one part at a time.','ลองนับใหม่ทีละส่วนอย่างช้า ๆ'],
 den:['Check the bottom number. Count ALL the equal parts in the whole.','ตรวจตัวล่างอีกครั้ง นับทุกส่วนที่เท่ากันในหนึ่งชิ้น']
};
const fv=(a,b)=>a/b;
function fracOpts(a,b,cands){const out=[{a,b,ok:true}];const seen=new Set([fv(a,b)]);
 const tryAdd=(x,y,tag)=>{if(out.length>=4)return;if(!(x>=1&&y>=2&&y<=10&&x<=10))return;const v=fv(x,y);if(seen.has(v))return;seen.add(v);out.push({a:x,b:y,tag});};
 cands.forEach(([x,y,t])=>tryAdd(x,y,t));
 let guard=0;while(out.length<4&&guard++<200){if(rnd(2)&&b>2)tryAdd(1+rnd(b-1),b,'count');else tryAdd(a,pick(DENS),'den');}
 return shuffle(out).map(o=>({html:F(o.a,o.b),say:sayF(o.a,o.b),ok:!!o.ok,tag:o.tag}));}

function makeItems(units,n){const out=[],seen=new Set();let gi=0,guard=0;
 const gens=[];units.forEach(u=>POOL[u].forEach(g=>gens.push(g)));
 const order=[];while(order.length<n){shuffle(gens).forEach(g=>order.push(g));}
 while(out.length<n&&guard++<800){const g=order[gi%order.length];gi++;const it=g();if(seen.has(it.sig))continue;seen.add(it.sig);out.push(it);}
 return out;}

function animate(kind,vis){const parts=$$('.part',vis);
 if(kind==='lines'){parts.forEach((p,i)=>{p.style.opacity=i?0:1;p.style.transition='opacity .4s';later(()=>p.style.opacity=1,500*i);});}
 if(kind==='one'){later(()=>parts[0]&&parts[0].classList.add('on'),600);}
 if(kind==='three'){[0,1,2].forEach(i=>later(()=>parts[i].classList.add('on'),500+500*i));}
 if(kind==='build'){[0,1,2,3].forEach(i=>later(()=>parts[i].classList.add('on'),500+450*i));}
 if(kind==='set2'){const b=$$('.btnItem',vis);[1,4].forEach((i,k)=>later(()=>b[i].classList.add('on'),600+600*k));}
 if(kind==='jump'){const svg=$('svg.nl',vis);const g=$('.pin',svg);[1,2,3].forEach(k=>later(()=>{g.style.transition='transform .45s';g.setAttribute('transform',`translate(${nlx(k,4)},0)`);const a=nlx(k-1,4),c=nlx(k,4),m=(a+c)/2;svg.insertAdjacentHTML('afterbegin',`<path class="jump" d="M${a+4},${NY-6} Q${m},${NY-48} ${c-4},${NY-6}"/>`);},500+700*(k-1)));}}
SCREENS.learn=(app,{u,s})=>{const L=LESSONS[u],sl=L[s],U=UNITS[u];
 app.innerHTML=`<div class="unitHead"><div class="sw" style="background:var(--t${u+1});padding:6px;width:66px;height:66px">${unitIcon(u)}</div><div><span class="muted">Patch ${u+1}: Learn</span><h2 style="font-size:26px">${U.name}</h2></div><span class="sp"></span><button class="btn alt" id="back">Back</button></div>
 <div class="card"><div class="lesson"><div class="vis" id="lv">${sl.v()}</div>

 <div class="dots">${L.map((_,i)=>`<i class="${i===s?'on':''}"></i>`).join('')}</div>

 if(sl.a)animate(sl.a,$('#lv'));
 $('#back').onclick=()=>go('unit',u);$('#prev').onclick=()=>go('learn',{u,s:s-1});
 $('#next').onclick=()=>{if(s<L.length-1)return go('learn',{u,s:s+1});if(!S.units[u].learn){S.units[u].learn=true;addXP(10);}save();toast('Lesson done! +10 XP. Next: Explore.');go('unit',u);};};

const CHAL=[
 [{t:'Make <b>sixths</b>',f:s=>s.eq&&s.b===6},{t:'Make a patch with parts that are <b>NOT</b> equal',f:s=>!s.eq},{t:'Make <b>fourths</b> with a circle',f:s=>s.eq&&s.b===4&&s.kind==='circle'}],
 [{a:3,b:4},{a:5,b:8},{a:2,b:6}],
 [{a:2,b:3},{a:3,b:6},{a:1,b:4}],
 [{a:2,b:3},{a:5,b:6},{a:1,b:2}],
 [{a:4,b:6},{a:7,b:8},{a:1,b:3}]
];
SCREENS.explore=(app,u)=>{const U=UNITS[u];const done=new Set();const ch=CHAL[u];
 const st={kind:'circle',b:4,eq:true,on:new Set(),n:6,idx:0};
 const chalHTML=()=>ch.map((c,i)=>`<li class="${done.has(i)?'done':''}"><span class="bx">${done.has(i)?'✓':i+1}</span><span>${c.t||((u===2?'Color in ':u===3?'Put the pin on ':u===4?'Build ':'Make ')+F(c.a,c.b))}</span></li>`).join('');
 const title=['Patch Cutter','Fraction Maker','Button Box','Pin the Line','Build Your Own'][u];
 const help=['Choose a shape and the number of parts. Switch between equal and not equal.','Choose the number of parts, then tap parts to shade them.','Choose how many buttons, then tap buttons to color them in.','Choose the number of parts, then drag the pin.','Choose the number of parts, then tap to shade. Build each fraction.'][u];
 const helpTh=['เลือกรูปและจำนวนส่วน ลองสลับแบบเท่ากันและไม่เท่ากัน','เลือกจำนวนส่วน แล้วแตะเพื่อระบาย','เลือกจำนวนกระดุม แล้วแตะเพื่อระบายสี','เลือกจำนวนส่วน แล้วลากหมุด','เลือกจำนวนส่วน แตะระบาย แล้วสร้างเศษส่วนตามโจทย์'][u];
 app.innerHTML=`<div class="unitHead"><div class="sw" style="background:var(--t${u+1});padding:6px;width:66px;height:66px">${unitIcon(u)}</div><div><span class="muted">Patch ${u+1}: Explore</span><h2 style="font-size:26px">${title}</h2></div><span class="sp"></span><button class="btn alt" id="back">Back</button></div>
 <p style="margin:0 0 4px">${help}</p>${TH(helpTh)}
 <div class="explore" style="margin-top:12px"><div class="card tool" id="tool"></div>
 <div><div class="card"><h3 style="margin-bottom:10px">Challenges</h3><ul class="chal" id="chal">${chalHTML()}</ul></div>
 <button class="btn" id="fin" style="width:100%;margin-top:14px">I’m done exploring</button></div></div>`;
 const tool=$('#tool');
 const check=()=>{ch.forEach((c,i)=>{if(done.has(i))return;let ok=false;
   if(u===0)ok=c.f(st);else if(u===1||u===4)ok=st.b===c.b&&st.on.size===c.a;else if(u===2)ok=st.n===c.b&&st.on.size===c.a;else if(u===3)ok=st.b===c.b&&st.idx===c.a;
   if(ok){done.add(i);addXP(5);sOK();toast('Challenge done! +5 XP');}});$('#chal').innerHTML=chalHTML();if(done.size===ch.length){confetti();}};
 const partBtns=(cur,list=DENS)=>`<div class="partPick" id="pp">${list.map(b=>`<button aria-pressed="${b===cur}" data-b="${b}">${b}</button>`).join('')}</div>`;
 function draw(){
  if(u===0){const ks=st.eq?kindsFor(st.b):['circle','bar'];if(!ks.includes(st.kind))st.kind=ks[0];
   const w=st.eq?null:(st.kind==='circle'?range(1,st.b).map(i=>i%2?1:1.8):range(1,st.b).map(i=>i%2?1:1.8));
   tool.innerHTML=`<div class="seg" id="eqs"><button aria-pressed="${st.eq}" data-e="1">Equal</button><button aria-pressed="${!st.eq}" data-e="0">Not equal</button></div>
   <div class="seg" id="ks">${['circle','bar','grid','tri'].map(k=>`<button aria-pressed="${st.kind===k}" data-k="${k}" ${ks.includes(k)?'':'disabled style="opacity:.4"'}>${{circle:'Circle',bar:'Strip',grid:'Grid',tri:'Triangles'}[k]}</button>`).join('')}</div>
   <div style="width:230px">${shapeSVG(st.kind,st.b,[],{w})}</div><div>Number of parts</div>${partBtns(st.b)}
   <div class="readout"><span class="w" style="font-size:22px">${st.eq?`${st.b} equal parts are called <b>${DW[st.b][1]}</b>. One part is ${F(1,st.b)}`:`These parts are <b>not equal</b>. No fraction name yet!`}</span></div>`;
   $$('#eqs button').forEach(b=>b.onclick=()=>{st.eq=b.dataset.e==='1';draw();check();});
   $$('#ks button').forEach(b=>b.onclick=()=>{if(b.disabled)return;st.kind=b.dataset.k;draw();check();});}
  else if(u===1||u===4){const ks=kindsFor(st.b);if(!ks.includes(st.kind))st.kind=ks[0];if(u===4)st.kind='bar';
   tool.innerHTML=(u===1?`<div class="seg" id="ks">${['circle','bar','grid'].map(k=>`<button aria-pressed="${st.kind===k}" data-k="${k}" ${ks.includes(k)?'':'disabled style="opacity:.4"'}>${{circle:'Circle',bar:'Strip',grid:'Grid'}[k]}</button>`).join('')}</div>`:'')+
   `<div style="width:${u===4?300:230}px">${shapeSVG(st.kind,st.b,[...st.on],{tap:true,max:u===4?300:230})}</div><div>Number of parts</div>${partBtns(st.b)}
   <div class="readout">${F(st.on.size,st.b)}<span class="w">${st.on.size?sayF(st.on.size,st.b):'nothing shaded yet'}</span></div><button class="btn alt" id="clr">Clear</button>`;
   $$('.part',tool).forEach(p=>p.onclick=()=>{const i=+p.dataset.i;st.on.has(i)?st.on.delete(i):st.on.add(i);sOK();draw();check();});
   const k=$('#ks');if(k)$$('button',k).forEach(b=>b.onclick=()=>{if(b.disabled)return;st.kind=b.dataset.k;st.on.clear();draw();});
   $('#clr').onclick=()=>{st.on.clear();draw();};}
  else if(u===2){tool.innerHTML=`<div class="row"><button class="ib" id="mn" aria-label="Fewer buttons">−</button><b>${st.n} buttons</b><button class="ib" id="pl" aria-label="More buttons">+</button></div>
   <div style="width:100%;display:flex;justify-content:center">${setSVG(st.n,[...st.on],{tap:true})}</div>
   <div class="readout">${F(st.on.size,st.n)}<span class="w">${st.on.size?sayF(st.on.size,st.n)+' of the set':'tap a button'}</span></div><button class="btn alt" id="clr">Clear</button>`;
   $$('.btnItem',tool).forEach(p=>p.onclick=()=>{const i=+p.dataset.i;st.on.has(i)?st.on.delete(i):st.on.add(i);sOK();draw();check();});
   $('#mn').onclick=()=>{if(st.n>2){st.n--;st.on.delete(st.n);draw();check();}};$('#pl').onclick=()=>{if(st.n<8){st.n++;draw();check();}};$('#clr').onclick=()=>{st.on.clear();draw();};}
  else if(u===3){tool.innerHTML=`<div style="width:100%">${nlSVG(st.b,{pin:st.idx,drag:true,jumps:st.idx})}</div><div>Number of parts</div>${partBtns(st.b)}
   <div class="readout">${st.idx===0?'<span class="fr" style="font-size:52px">0</span>':F(st.idx,st.b)}<span class="w">${st.idx===0?'at zero':st.idx===st.b?'at one whole':sayF(st.idx,st.b)}</span></div>`;
   const svg=$('svg.nl',tool);wireNL(svg,st.b,()=>st.idx,i=>{if(i!==st.idx){st.idx=i;}});
   svg.addEventListener('pointerup',()=>{draw();check();});svg.addEventListener('keyup',()=>{draw();check();});}
  $$('#pp button').forEach(b=>b.onclick=()=>{st.b=+b.dataset.b;st.on.clear();st.idx=Math.min(st.idx,st.b);draw();check();});}
 draw();
 $('#back').onclick=()=>go('unit',u);
 $('#fin').onclick=()=>{if(!S.units[u].explore){S.units[u].explore=true;addXP(10);save();}toast('Explore done! Next: Practice.');go('unit',u);};};

SCREENS.quiz=(app,cfg)=>{
 const mode=cfg.mode;let items;
 if(mode==='diag')items=[0,1,2,3,4].flatMap(u=>makeItems([u],2));
 else if(mode==='boss')items=shuffle([0,1,2,3,4].flatMap(u=>makeItems([u],3)));
 else items=makeItems(cfg.units,cfg.n);
 const hintsOn=mode==='practice'||mode==='review';const fbOn=mode!=='diag'&&mode!=='boss';
 const res=[];let qi=0;let endAt=null;
 const label={diag:'Check-up',practice:'Practice',check:'Check',review:'Review',boss:'Boss Round'}[mode];
 if(mode==='boss'){endAt=Date.now()+S.settings.timer*60000;bossTick=setInterval(()=>{const t=$('#tm');const left=Math.max(0,endAt-Date.now());if(t){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);t.textContent=m+':'+String(s).padStart(2,'0');t.classList.toggle('low',left<60000);}if(left<=0){clearInterval(bossTick);bossTick=null;while(res.length<items.length)res.push({u:items[res.length].u,ok:false,timeout:true});finish();}},250);}
 function fmtLeft(){const left=Math.max(0,endAt-Date.now());return Math.floor(left/60000)+':'+String(Math.floor(left%60000/1000)).padStart(2,'0');}
 function finish(){clearTimers();go('result',{mode,res,cfg,items});}
 function show(){const it=items[qi];window.__FQcur=it;let attempt=1,hintN=0,answered=false;
  const U=cfg.u!=null?UNITS[cfg.u]:null;
  app.innerHTML=`<div class="qtop"><b>${label}${U?': '+U.name:''}</b><div class="pbar"><i style="width:${qi/items.length*100}%"></i></div><span>${qi+1} of ${items.length}</span>${mode==='boss'?`<span class="timer" id="tm">${fmtLeft()}</span>`:''}<button class="btn alt" id="quit" style="min-height:44px;padding:6px 14px;font-size:15px">Exit</button></div>
  <div class="card qcard"><div class="prompt">${spkBtn(it.say)}<div>${it.q}${TH(it.th)}</div></div>
  <div class="visq" id="vis"></div><div id="ctl"></div>
  <div class="hintBox" id="hb"><b>Hints</b><ol id="hl"></ol></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="actions" id="act">${hintsOn?'<button class="btn alt" id="hint">Hint (1 of 3)</button>':''}<button class="btn" id="chk" style="display:none">Check answer</button><button class="btn" id="nxt" style="display:none">${qi===items.length-1?'Finish':'Next'}</button><button class="btn alt" id="again" style="display:none">Try again</button></div></div>`;
  $('#quit').onclick=()=>{if(mode==='diag'){S.diag={done:true,skipped:true,scores:[]};save();}go(cfg.u!=null?'unit':'map',cfg.u);};
  const vis=$('#vis'),ctl=$('#ctl'),chk=$('#chk'),nxt=$('#nxt'),again=$('#again'),fb=$('#fb');
  if(hintsOn)$('#hint').onclick=()=>{if(hintN>=3)return;const h=it.hints[hintN++];$('#hb').classList.add('show');$('#hl').insertAdjacentHTML('beforeend',`<li>${h.en}<span class="th" lang="th"> (${h.th})</span></li>`);$('#hint').textContent=hintN>=3?'No more hints':'Hint ('+(hintN+1)+' of 3)';if(hintN>=3)$('#hint').disabled=true;};
  let state={on:new Set(),idx:0,b:null,val:''};
  function build(){state={on:new Set(),idx:0,b:null,val:''};ctl.innerHTML='';vis.innerHTML='';
   if(it.type==='mc'){vis.innerHTML=it.vis;if(it.wide)vis.firstElementChild.style.maxWidth='620px';
    ctl.innerHTML=`<div class="opts ${it.two?'two':''}">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-label="${esc(o.say)}">${o.html}</button>`).join('')}</div>`;
    $$('.opt',ctl).forEach(b=>b.onclick=()=>{if(answered)return;const o=it.opts[+b.dataset.i];
     const msg=o.ok?null:(it.msgs&&it.msgs[o.tag])||MSG[o.tag]||MSG.count;grade(o.ok,msg,b);});}
   if(it.type==='shade'){const draw=()=>{vis.innerHTML=shapeSVG(it.kind,it.b,[...state.on],{tap:true});$$('.part',vis).forEach(p=>p.onclick=()=>{if(answered)return;const i=+p.dataset.i;state.on.has(i)?state.on.delete(i):state.on.add(i);draw();});};draw();chk.style.display='';}
   if(it.type==='set'){const draw=()=>{vis.innerHTML=setSVG(it.b,[...state.on],{tap:true});$$('.btnItem',vis).forEach(p=>p.onclick=()=>{if(answered)return;const i=+p.dataset.i;state.on.has(i)?state.on.delete(i):state.on.add(i);draw();});};draw();chk.style.display='';}
   if(it.type==='nl'){vis.innerHTML=nlSVG(it.b,{pin:0,drag:true});const svg=$('svg.nl',vis);svg.style.maxWidth='640px';wireNL(svg,it.b,()=>state.idx,i=>{if(!answered)state.idx=i;});chk.style.display='';
    ctl.innerHTML='<p class="muted center" style="margin:0">Drag the pin or tap the line. On a keyboard use the arrow keys.</p>';}
   if(it.type==='missing'){vis.innerHTML=`<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center"><div style="width:220px;display:flex;justify-content:center">${it.vis}</div><div class="bigfr" id="bf"></div></div>`;
    const paint=()=>{const box=`<span class="q ${state.val?'filled':''}">${state.val||'?'}</span>`;$('#bf').innerHTML=`<span class="fr"><span class="n">${it.top==='?'?box:it.top}</span><span class="d">${it.bot==='?'?box:it.bot}</span></span>`;};paint();
    ctl.innerHTML=`<div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="x" aria-label="Delete" style="grid-column:span 2">Delete</button></div>`;
    $$('.keypad button',ctl).forEach(b=>b.onclick=()=>{if(answered)return;const d=b.dataset.d;if(d==='x')state.val=state.val.slice(0,-1);else if(state.val.length<2)state.val=(state.val==='0'?'':state.val)+d;paint();});chk.style.display='';}
   if(it.type==='build'){const draw=()=>{ctl.innerHTML=`<p class="center" style="margin:0 0 8px"><b>Step 1:</b> How many equal parts?</p><div class="partPick">${DENS.map(b=>`<button data-b="${b}" aria-pressed="${state.b===b}">${b}</button>`).join('')}</div>`;
     vis.innerHTML=state.b?`<div style="width:100%;max-width:340px;margin:0 auto"><p class="center" style="margin:0"><b>Step 2:</b> Tap parts to shade.</p>${shapeSVG('bar',state.b,[...state.on],{tap:true,max:340})}</div>`:`<p class="muted">Choose the number of parts below.</p>`;
     $$('.partPick button',ctl).forEach(b=>b.onclick=()=>{if(answered)return;state.b=+b.dataset.b;state.on.clear();draw();});
     $$('.part',vis).forEach(p=>p.onclick=()=>{if(answered)return;const i=+p.dataset.i;state.on.has(i)?state.on.delete(i):state.on.add(i);draw();});};draw();chk.style.display='';}
  }
  build();
  chk.onclick=()=>{if(answered)return;let ok=false,msg=null;
   if(it.type==='shade'||it.type==='set'){const c=state.on.size;ok=c===it.a;if(!ok)msg=c===0?['Tap some parts first.','แตะเพื่อระบายก่อน']:c===it.b?['You shaded ALL the parts. The top number tells how many to shade.','หนูระบายทุกส่วน ตัวบนบอกว่าต้องระบายกี่ส่วน']:[`You shaded ${c}. ${it.type==='set'?'Color in':'Shade'} exactly ${it.a}: the top number.`,`หนูระบาย ${c} ส่วน ต้องระบาย ${it.a} ส่วนตามตัวบน`];}
   if(it.type==='nl'){const i=state.idx;ok=i===it.a;if(!ok)msg=i===0?['Move the pin away from 0 first.','เลื่อนหมุดออกจาก 0 ก่อน']:i===it.b-it.a?MSG.fromEnd:i===it.a+1?['You may have counted the 0 tick as 1. Start at 0, then count the jumps.','หนูอาจนับขีด 0 เป็น 1 ให้เริ่มที่ 0 แล้วนับการกระโดด']:[`Your pin is ${i} jump${i>1?'s':''} from 0. You need ${it.a} jump${it.a>1?'s':''} from 0.`,`หมุดอยู่ห่างจาก 0 ไป ${i} ช่อง ต้องนับ ${it.a} ช่องจาก 0`];}
   if(it.type==='missing'){if(!state.val){toast('Type a number first.');return;}const v=+state.val;ok=v===it.ans;if(!ok)msg=it.wrong(v);}
   if(it.type==='build'){if(!state.b){toast('Choose the number of parts first.');return;}ok=state.b===it.b&&state.on.size===it.a;if(!ok)msg=state.b!==it.b?(state.b===it.a?['You cut by the top number. The BOTTOM number tells how many equal parts.','หนูแบ่งตามตัวบน ตัวล่างบอกว่าต้องแบ่งกี่ส่วน']:MSG.den):[`You shaded ${state.on.size}. Shade exactly ${pp(it.a,'part')}.`,`หนูระบาย ${state.on.size} ส่วน ต้องระบาย ${it.a} ส่วน`];}
   grade(ok,msg,null);};
  function revealMC(){$$('.opt',ctl).forEach((b,i)=>{b.disabled=true;if(it.opts[i].ok)b.classList.add('good');});}
  function grade(ok,msg,btn){
   if(!fbOn){answered=true;res.push({u:it.u,ok,sig:it.sig,q:it.q});if(ok){S.streak++;}else S.streak=0;if(ok)sOK();next();return;}
   if(ok){answered=true;const first=attempt===1;res.push({u:it.u,ok:first,sig:it.sig,q:it.q});
    if(first){S.streak++;S.best=Math.max(S.best,S.streak);if(!S.badges.includes('first'))award('first');if(S.streak>=5)award('streak5');if(S.streak>=10)award('streak10');}
    addXP(first&&hintN===0?10:5);sOK();if(btn)btn.classList.add('good');if(it.type==='mc')revealMC();
    fb.className='fb show ok';fb.innerHTML=saysHTML('cheer',`<div class="big">${first?pick(['Correct!','Great counting!','Yes, well done!','Exactly right!','You got it!']):'Got it this time!'}</div><div>${it.explain}</div>${TH(it.explainTh)}`,58);
    chk.style.display='none';again.style.display='none';nxt.style.display='';if($('#hint'))$('#hint').style.display='none';nxt.focus();}
   else{S.streak=0;sNO();if(btn)btn.classList.add('bad');
    const canRetry=mode!=='check'&&attempt===1;
    if(canRetry){fb.className='fb show no';fb.innerHTML=saysHTML('think',`<div class="big">Not yet. Let’s look again!</div><div>${msg[0]}</div>${TH(msg[1])}`,58);answered=true;chk.style.display='none';again.style.display='';again.focus();}
    else{answered=true;res.push({u:it.u,ok:false,sig:it.sig,q:it.q});if(it.type==='mc')revealMC();
     fb.className='fb show no';fb.innerHTML=saysHTML('think',`<div class="big">${mode==='check'?'Not this time.':'Let’s see the answer.'}</div><div>${msg[0]}</div>${TH(msg[1])}<div style="margin-top:6px"><b>Answer:</b> ${it.explain}</div>${TH(it.explainTh)}`,58);
     chk.style.display='none';again.style.display='none';nxt.style.display='';if($('#hint'))$('#hint').style.display='none';showAnswer();}
   }
   save();hud();}
  function showAnswer(){if(it.type==='shade')vis.innerHTML=shapeSVG(it.kind,it.b,range(0,it.a-1).map(i=>i));if(it.type==='set')vis.innerHTML=setSVG(it.b,range(0,it.a-1));
   if(it.type==='nl'){vis.innerHTML=nlSVG(it.b,{pin:it.a,jumps:it.a});}if(it.type==='build'){vis.innerHTML=`<div style="width:100%;max-width:340px;margin:0 auto">${shapeSVG('bar',it.b,range(0,it.a-1),{max:340})}</div>`;}}
  again.onclick=()=>{attempt=2;answered=false;fb.className='fb';again.style.display='none';build();if(it.type!=='mc')chk.style.display='';};
  nxt.onclick=next;
  function next(){qi++;if(qi>=items.length)finish();else show();}
 }
 show();};

/* ----- results ----- */
SCREENS.result=(app,{mode,res,cfg,items})=>{const c=res.filter(r=>r.ok).length,t=res.length,pct=Math.round(c/t*100);
 let html='',btns='';
 if(mode==='diag'){const sc=[0,1,2,3,4].map(u=>res.filter(r=>r.u===u&&r.ok).length);S.diag={done:true,scores:sc};sc.forEach((s,u)=>{if(s===2)S.units[u].fast=true;});save();
  html=`<h2>Check-up done!</h2><p class="score">${c} <span style="font-size:28px">out of ${t}</span></p><table class="rep" style="margin-top:12px"><tr><th>Patch</th><th>Score</th><th>What next</th></tr>${UNITS.map((U,u)=>`<tr><td>${u+1}. ${U.name}</td><td>${sc[u]} out of 2</td><td>${sc[u]===2?'Fast track: you may go straight to the Check':'Start with Learn'}</td></tr>`).join('')}</table>`;btns=`<button class="btn" id="b1">Go to my quilt</button>`;}
 if(mode==='practice'){const u=cfg.u;S.units[u].practice=true;S.units[u].pr.c+=c;S.units[u].pr.t+=t;save();
  html=`<h2>Practice done!</h2><p class="score">${c} <span style="font-size:28px">out of ${t}</span></p><p>correct on the first try.</p>${TH('ฝึกเสร็จแล้ว ต่อไปทำแบบทดสอบ (Check)')}`;btns=`<button class="btn" id="b1">Go to the Check</button><button class="btn alt" id="b2">Practice again</button>`;}
 if(mode==='check'){const u=cfg.u,s=S.units[u];s.checkLast=c;s.checkBest=Math.max(s.checkBest,c);const pass=c>=4;
  if(pass){const firstPass=!s.check;s.check=true;s.learn=true;s.explore=true;s.practice=true;save();confetti();sWIN();award('u'+u);if(c===5)award('perfect');addXP(firstPass?30:10);}
  else{s.practice=false;s.fast=false;save();}
  html=pass?`<h2>Patch ${u+1} passed!</h2><p class="score">${c} <span style="font-size:28px">out of 5</span></p><p>You sewed the <b>${UNITS[u].name}</b> patch onto your quilt.</p>${TH('ผ่านแล้ว! ผ้าชิ้นนี้ถูกเย็บลงผ้าห่มของหนู')}`:
   `<h2>Almost there!</h2><p class="score">${c} <span style="font-size:28px">out of 5</span></p><p>You need 4 or 5 to pass. Do one more practice round with new questions, then try the Check again.</p>${TH('ต้องได้ 4 หรือ 5 ข้อจึงผ่าน ฝึกอีกรอบด้วยโจทย์ใหม่ แล้วลองใหม่')}`;
  btns=pass?(u>0?`<button class="btn" id="b1">Quick Review (4 questions)</button><button class="btn alt" id="b2">Back to the quilt</button>`:`<button class="btn" id="b2">Back to the quilt</button>`):`<button class="btn" id="b3">Practice again</button>`;}
 if(mode==='review'){S.reviews++;save();award('review');html=`<h2>Review done!</h2><p class="score">${c} <span style="font-size:28px">out of ${t}</span></p><p>Looking back helps you remember.</p>`;btns=`<button class="btn" id="b2">Back to the quilt</button>`;}
 if(mode==='boss'){const byU=[0,1,2,3,4].map(u=>({c:res.filter(r=>r.u===u&&r.ok).length,t:res.filter(r=>r.u===u).length}));
  S.boss={best:Math.max(pct,S.boss?S.boss.best:0),last:pct,lastC:c,lastT:t,date:new Date().toISOString(),byU};res.forEach(r=>{if(r.ok)addXP(15);});save();if(pct>=80){award('boss');confetti();sWIN();}
  html=`<h2>${pct>=80?'You beat the Boss Round!':'Boss Round finished'}</h2><p class="score">${pct}%</p><p>${c} out of ${t} correct${res.some(r=>r.timeout)?' (time ran out)':''}.</p>
  <table class="rep"><tr><th>Patch</th><th>Correct</th></tr>${UNITS.map((U,u)=>`<tr><td>${u+1}. ${U.name}</td><td>${byU[u].c} out of ${byU[u].t}</td></tr>`).join('')}</table>`;
  btns=`<button class="btn" id="b4">See My Report</button><button class="btn alt" id="b2">Back to the quilt</button>`;}
 const good=mode==='diag'||pct>=80;
 app.innerHTML=`<div class="card center" style="max-width:640px;margin:0 auto"><div style="display:flex;justify-content:center;margin-bottom:6px">${pip(good?'cheer':'happy',110,true)}</div>${html}<div class="row" style="justify-content:center;margin-top:16px">${btns}</div></div>`;
 const on=(id,f)=>{const b=$('#'+id);if(b)b.onclick=f;};

DgQmBw4UJgcHmu/wfaHGkWnjIv6wAAAABJRU5ErkJggg==" alt="Bright EngMath"><div><h2 style="font-size:24px">Fraction Cheat Sheet</h2><span style="color:#55636E">Fraction Quilt Studio, Grades 2–3</span></div></div>
 <div class="grid">
 <div class="box"><h3>1. Equal parts</h3><div class="row" style="flex-wrap:nowrap"><div style="width:90px">${shapeSVG('bar',4,[],{max:90})}</div><div style="width:90px">${shapeSVG('bar',3,[],{w:[1,2,1],max:90})}</div></div><p style="margin:4px 0 0">Equal parts are all the same size. 2 = halves, 3 = thirds, 4 = fourths, 6 = sixths, 8 = eighths.</p></div>
 <div class="box"><h3>2. Part of a whole</h3><div class="row" style="flex-wrap:nowrap"><div style="width:90px">${shapeSVG('circle',8,[0,1,2],{max:90})}</div><div style="font-size:34px">${F(3,8)}</div><div style="font-size:14px">top = parts shaded<br>bottom = ALL equal parts</div></div></div>
 <div class="box"><h3>3. Part of a set</h3><div class="row" style="flex-wrap:nowrap"><div style="width:150px">${setSVG(4,[0,1,2])}</div><div style="font-size:34px">${F(3,4)}</div></div><p style="margin:4px 0 0">Bottom = ALL the things in the set.</p></div>
 <div class="box"><h3>4. Number line</h3>${nlSVG(4,{dot:3,jumps:3})}<p style="margin:4px 0 0">Count the jumps from 0. 3 jumps out of 4 = ${F(3,4)}</p></div>
 <div class="box"><h3>5. Missing number and build it</h3><p style="margin:0">Missing top? Count the shaded parts.<br>Missing bottom? Count ALL the parts.<br>Build ${F(2,6)}: cut 6 equal parts, shade 2.</p></div>
 <div class="box" style="border-width:3px"><h3>Watch out!</h3><p style="margin:0">• 3 shaded and 5 white is ${F(3,8)}, not ${F(3,5)}<br>• Count spaces, not tick marks<br>• Parts must be equal before you name a fraction</p></div>
 </div><p style="font-size:12px;color:#55636E;margin:10px 0 0">© Bright EngMath. For single classroom use only.</p></div>
 <div class="row noprint" style="justify-content:center;margin-top:14px"><button class="btn" id="pr">Print</button><button class="btn alt" id="bk">Back to map</button></div>`;
 $('#pr').onclick=()=>window.print();$('#bk').onclick=()=>go('map');};

/* ========== teacher settings ========== */
function openModal(h){$('#modalCard').innerHTML=h;$('#modal').classList.add('show');}
function closeModal(){$('#modal').classList.remove('show');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
$('#setBtn').onclick=()=>{openModal(`<h2 style="margin-bottom:8px">Teacher Settings</h2><label class="f" for="pin">Enter the teacher PIN</label><input class="t" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><p class="muted" style="font-size:14px">The PIN is in the Teacher Guide.</p><div class="row" style="margin-top:10px"><button class="btn" id="pinGo">Open</button><button class="btn alt" id="mc">Cancel</button></div>`);
 $('#pin').focus();$('#mc').onclick=closeModal;const tryPin=()=>{if($('#pin').value==='1234')teacherPanel();else{toast('That PIN is not correct.');$('#pin').value='';}};$('#pinGo').onclick=tryPin;$('#pin').onkeydown=e=>{if(e.key==='Enter')tryPin();};};
function teacherPanel(){let armed=false;openModal(`<h2 style="margin-bottom:8px">Teacher Settings</h2>
 <label class="row" style="gap:10px;margin:8px 0"><input type="checkbox" id="hTH" ${S.settings.hideTH?'checked':''} style="width:24px;height:24px"> Hide the TH (Thai help) button</label>
 <label class="row" style="gap:10px;margin:8px 0"><input type="checkbox" id="uAll" ${S.settings.unlock?'checked':''} style="width:24px;height:24px"> Unlock all patches and the Boss Round</label>
 <label class="f" for="tmr">Boss Round timer</label><select class="t" id="tmr">${[5,10,15,20].map(m=>`<option value="${m}" ${S.settings.timer===m?'selected':''}>${m} minutes</option>`).join('')}</select>
 <div class="row" style="margin-top:16px"><button class="btn" id="sv">Save</button><button class="btn alt" id="rs" style="border-color:var(--bad);color:var(--bad)">Reset all progress</button></div>`);
 $('#sv').onclick=()=>{S.settings.hideTH=$('#hTH').checked;S.settings.unlock=$('#uAll').checked;S.settings.timer=+$('#tmr').value;if(S.settings.hideTH)S.settings.th=false;save();applySettings();closeModal();toast('Settings saved.');go(route==='start'?'start':'map');};
 $('#rs').onclick=()=>{if(!armed){armed=true;$('#rs').textContent='Tap again to reset everything';return;}const keep=Object.assign({},S.settings);S=blank();S.settings=keep;save();closeModal();toast('All progress was reset.');go('start');};}
function applySettings(){document.documentElement.setAttribute('data-theme',S.settings.dark?'dark':'light');$('#darkBtn').setAttribute('aria-pressed',S.settings.dark);
 $('#sndBtn').setAttribute('aria-pressed',S.settings.sound);$('#sndWave').style.display=S.settings.sound?'':'none';
 $('#thBtn').style.display=S.settings.hideTH?'none':'';document.body.classList.toggle('showTH',!S.settings.hideTH&&S.settings.th);$('#thBtn').setAttribute('aria-pressed',!!S.settings.th);}
$('#thBtn').onclick=()=>{S.settings.th=!S.settings.th;save();applySettings();};
$('#sndBtn').onclick=()=>{S.settings.sound=!S.settings.sound;save();applySettings();};
$('#darkBtn').onclick=()=>{S.settings.dark=!S.settings.dark;save();applySettings();};
$('#homeBtn').onclick=()=>go(S.name&&S.diag?'map':'start');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ========== boot ========== */
load();applySettings();go(S.name&&S.diag?'map':'start');
window.__FQ={gen,makeItems,fracOpts,partsOf,S:()=>S};
</script>

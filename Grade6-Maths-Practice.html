:root{
  --ground:#F8F1E1; --ground-2:#FCF7EC; --surface:#FFFFFF;
  --ink:#1F2846; --ink-2:#3A4560; --muted:#626C84;
  --line:#EADFC9; --line-soft:#F2E9D9;
  --coral:#F66F58; --accent:#E04E30; --accent-dark:#CE3E24;
  --blue:#375BC0; --amber:#F5B84E;
  --ok:#1F7A54; --ok-bg:#E9F5EF; --ok-line:#BBE0CD;
  --no:#9B2115; --no-bg:#FBEAE7; --no-line:#EFC4BD;
  --warn:#A25812; --warn-bg:#FDF3E2; --warn-line:#F0DEBB;
  --c:#375BC0;
  --r:18px; --shadow:0 1px 2px rgba(31,40,70,.05), 0 12px 26px -16px rgba(31,40,70,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'NunitoApp',ui-rounded,'Segoe UI Variable',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  background:var(--ground); color:var(--ink); line-height:1.52;
  font-size:16.5px; overflow-x:hidden;
  background-image:radial-gradient(circle at 6% -10%, rgba(255,214,192,.55) 0%, transparent 34%),
                   radial-gradient(circle at 97% -4%, rgba(205,219,248,.45) 0%, transparent 30%);
  background-attachment:fixed;
}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 96px}
h1,h2,h3{font-weight:900;letter-spacing:-.022em;line-height:1.12}
svg.fig text{font-family:'NunitoApp',system-ui,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- home ---------- */
.top{padding:44px 0 26px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mark{width:35px;height:35px;border-radius:12px;background:var(--coral);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:14.5px;letter-spacing:-.4px}
.brand{font-size:12.5px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:43px}
.top .lede{margin-top:10px;color:var(--muted);font-size:17px;max-width:46ch}
.rule{height:6px;width:78px;border-radius:3px;background:var(--coral);margin:18px 0 4px}
.grouphead{display:flex;align-items:baseline;justify-content:space-between;
  margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grouphead h2{font-size:20px;font-weight:900}
.grouphead span{font-size:13px;color:var(--muted);font-weight:600}
.cards{display:grid;gap:12px}
.card{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;text-align:left;width:100%;
  box-shadow:var(--shadow);transition:transform .12s ease, box-shadow .12s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,40,70,.07),0 18px 32px -16px rgba(31,40,70,.34)}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card .spine{width:8px;flex:0 0 8px;background:var(--cc)}
.card .body>*{display:block}
.card .body{padding:15px 17px;flex:1;min-width:0;display:block}
.card .code{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--cc)}
.card .name{font-size:19px;font-weight:800;margin-top:1px;letter-spacing:-.015em}
.card .blurb{color:var(--muted);font-size:14.5px;margin-top:2px}
.card .meta{display:flex !important;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;
  font-size:13px;color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:#F3EAD8;color:var(--muted)}
.badge.best{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;line-height:1.6}

/* ---------- quiz ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(248,241,225,.94);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);
  padding:6px 10px;border-radius:9px;margin-left:-10px}
.back:hover{background:#F0E5CE;color:var(--ink)}
.bar .title{flex:1;min-width:0;font-size:14.5px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bar .count{font-size:13.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--line-soft)}
.pbar i{display:block;height:100%;background:var(--c);transition:width .3s ease}
.qwrap{padding-top:26px}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 13px;border-radius:999px;background:#F3EAD8;color:var(--muted)}
.chip.tally{background:#FDE6DF;color:#B03A22}
.chip.sec{background:color-mix(in srgb, var(--c) 13%, #fff);color:var(--c)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;box-shadow:var(--shadow)}
.qnum{font-size:14.5px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:var(--c);margin-bottom:5px}
.qtext{font-size:17.5px;line-height:1.56;font-weight:600}
.qtext b{font-weight:900}
.figbox{margin:14px 0 6px;text-align:center;overflow:visible;padding:6px 0 10px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0}
svg.fig{max-width:100%;height:auto;vertical-align:middle;overflow:visible}
.figrow{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:8px 0}
.figcell{text-align:center}
.figcap{font-weight:800;font-size:14px;color:var(--ink-2);margin-bottom:2px}
.figsub{font-size:13.5px;color:var(--muted);margin-top:3px}
.legend{margin-top:6px;font-size:13.5px}
.lgi{display:inline-block;margin:0 9px 4px 0;font-weight:600}
.lgi i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
table.dtab{border-collapse:collapse;margin:12px auto;font-size:15px}
table.dtab th,table.dtab td{border:1px solid #A79E8C;padding:6px 13px}
table.dtab th{background:#F2EFE8;font-weight:700}

/* options */
.opts{display:grid;gap:9px;margin-top:18px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  border:1.5px solid var(--line);background:var(--surface);border-radius:14px;
  padding:13px 15px;font-size:17px;font-weight:600;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--c);background:color-mix(in srgb, var(--c) 4%, #fff)}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt .ltr{flex:0 0 27px;height:27px;border-radius:9px;background:#F3EAD8;color:var(--muted);
  display:grid;place-items:center;font-weight:900;font-size:14px;margin-top:1px}
.opt .txt{flex:1;min-width:0}
.opt .res{flex:0 0 auto;font-weight:800;font-size:15px}
.opt.sel{border-color:var(--c);background:color-mix(in srgb, var(--c) 6%, #fff)}
.opt.right{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.right .res{color:var(--ok)}
.opt.wrong{border-color:var(--no-line);background:var(--no-bg)}
.opt.wrong .ltr{background:var(--no);color:#fff}
.opt.wrong .res{color:var(--no)}
.opt:disabled{cursor:default}

/* free answer */
.ansrow{margin-top:18px}
.lab{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;display:block}
input.ans, textarea.ans{width:100%;border:1.5px solid var(--line);border-radius:13px;
  padding:13px 15px;font-size:17px;background:var(--surface)}
input.ans:focus,textarea.ans:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent)}
textarea.ans{min-height:96px;resize:vertical;line-height:1.5}
.hint{font-size:13.5px;color:var(--muted);margin-top:7px}
.yn{display:flex;gap:10px;margin-top:18px}
.yn button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;
  padding:14px;font-size:17px;font-weight:700}
.yn button:hover:not(:disabled){border-color:var(--c)}
.yn button.sel{border-color:var(--c);background:color-mix(in srgb, var(--c) 7%, #fff)}
.yn button.right{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.yn button.wrong{border-color:var(--no-line);background:var(--no-bg);color:var(--no)}

/* parts */
.part{border-top:1px solid var(--line-soft);margin-top:20px;padding-top:18px}
.part:first-of-type{border-top:none;margin-top:16px;padding-top:0}
.plabrow{display:flex;align-items:baseline;gap:10px}
.plab{font-weight:800;color:var(--c);font-size:16px}
.pmark{font-size:12.5px;color:var(--muted);font-weight:700;margin-left:auto}

/* actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{border-radius:14px;padding:15px 24px;font-size:19px;font-weight:800;letter-spacing:-.01em;
  background:var(--ink);color:#fff;transition:background .12s, transform .06s}
.btn:hover{background:#141B31}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#D9D2C2;color:#8C8779;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#F3EAD8}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:var(--accent-dark)}
.btn.wide{flex:1;min-width:170px;text-align:center}

/* feedback */
.fb{margin-top:20px;border-radius:14px;padding:16px 18px;border:1.5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.no{background:var(--no-bg);border-color:var(--no-line)}
.fb.part{background:var(--warn-bg);border-color:var(--warn-line)}
.fb .head{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17.5px}
.fb.ok .head{color:var(--ok)} .fb.no .head{color:var(--no)} .fb.part .head{color:var(--warn)}
.fb .icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:14px;flex:0 0 24px;font-weight:800}
.fb.ok .icon{background:var(--ok)} .fb.no .icon{background:var(--no)} .fb.part .icon{background:var(--warn)}
.fb .gain{margin-left:auto;font-size:13.5px;font-weight:700;opacity:.85}
.fb .correct{margin-top:10px;font-size:16px}
.fb .correct b{font-weight:800}
.expl{margin-top:14px;background:var(--surface);border-radius:12px;padding:13px 15px;
  border:1px solid var(--line-soft)}
.expl .h{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.expl p{font-size:15.5px;line-height:1.55}
.scheme{margin-top:10px;font-size:13.5px;color:#4E5C68;display:flex;gap:8px;flex-wrap:wrap}
.scheme span{background:#F3EAD8;border-radius:999px;padding:4px 11px;font-weight:600}
.scheme b{color:var(--ok);font-weight:800;margin-right:3px}
.watch{margin-top:12px;background:var(--warn-bg);border:1px solid var(--warn-line);
  border-radius:12px;padding:11px 14px;font-size:15px;color:#6B4A16}
.watch b{color:var(--warn)}
.selfmark{margin-top:14px}
.selfmark .q{font-size:14.5px;font-weight:700;margin-bottom:9px}
.selfrow{display:flex;gap:8px;flex-wrap:wrap}
.selfrow button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:10px 15px;font-size:14.5px;font-weight:700}
.selfrow button:hover{border-color:var(--ink)}
.selfrow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* results */
.res-top{text-align:center;padding:40px 0 6px}
.score{font-size:72px;font-weight:900;line-height:1;letter-spacing:-.03em}
.score small{font-size:28px;font-weight:800;color:var(--muted)}
.band{display:inline-block;margin-top:12px;padding:7px 18px;border-radius:999px;
  font-weight:800;font-size:15px}
.res-sub{color:var(--muted);margin-top:10px;font-size:16px}
.brk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-top:26px;box-shadow:var(--shadow)}
.brk h3{font-size:17px;font-weight:900;margin-bottom:14px}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:13px}
.srow .nm{font-size:14.5px;font-weight:600}
.srow .vl{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:4px}
.missed{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.missed button{border:1.5px solid var(--no-line);background:var(--no-bg);color:var(--no);
  border-radius:999px;padding:8px 15px;font-weight:800;font-size:14px}
.missed button:hover{background:#F8DCD5}
@media (max-width:560px){
  .top{padding:30px 0 20px} .top h1{font-size:33px} .top .lede{font-size:16px}
  .qcard{padding:17px} .qtext{font-size:16.5px} .score{font-size:58px}
  .btn.wide{min-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<script>
const DATA = [{"id":"07_2D-Shapes","code":"Chapter 7","title":"2-Dimensional Shapes","colour":"#375BC0","blurb":"Triangles, angles and circles","sub":"Types of triangles · Angles of a triangle · Drawing triangles · Parts of a circle · Drawing circles","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"What type of triangle is shown below?","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 143.3\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,95.3 150.0,95.3 59.8,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"75.0\" y=\"110.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text><text x=\"115.8\" y=\"37.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text><text x=\"17.2\" y=\"39.7\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 cm</text></svg>","sol":"All three sides are different lengths (6 cm, 7 cm and 8 cm), so the triangle is scalene.","scheme":[],"watch":"Choosing “isosceles” because two of the sides look nearly the same length.","opts":["Equilateral","Right-angled","Isosceles","Scalene"],"ans":3,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"Find the value of <b>∠x</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 160.2\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,112.2 150.0,112.2 104.7,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"16.4,94.7 17.2,95.4 17.9,96.2 18.6,97.0 19.3,97.9 19.9,98.8 20.5,99.7 21.0,100.7 21.6,101.6 22.0,102.6 22.4,103.6 22.8,104.7 23.1,105.7 23.4,106.8 23.6,107.9 23.8,108.9 23.9,110.0 24.0,111.1 24.0,112.2\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"36.7\" y=\"97.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">47°</text><polyline points=\"126.0,112.2 126.1,110.6 126.2,109.0 126.5,107.5 126.8,105.9 127.3,104.4 127.9,102.9 128.5,101.5 129.3,100.1 130.1,98.8 131.0,97.5 132.0,96.3 133.1,95.1 134.3,94.1 135.5,93.1 136.8,92.1 138.2,91.3 139.6,90.6 141.0,89.9\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"116.8\" y=\"90.9\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">68°</text><polyline points=\"113.7,22.3 112.3,22.8 110.8,23.2 109.3,23.5 107.8,23.8 106.3,23.9 104.8,24.0 103.3,24.0 101.8,23.8 100.3,23.6 98.8,23.3 97.4,22.9 96.0,22.4 94.6,21.8 93.2,21.1 91.9,20.3 90.7,19.5 89.5,18.5 88.3,17.5\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"97.4\" y=\"37.4\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text></svg>","sol":"The angles of a triangle add up to 180°. x = 180° − 47° − 68° = 65°.","scheme":[],"watch":"Adding the two given angles and stopping there (115°).","opts":["65°","112°","115°","133°"],"ans":0,"check":{"type":"mcq"}},{"n":3,"s":"A","m":1,"text":"Which set of three angles could be the angles of a triangle?","fig":"","sol":"62° + 49° + 69° = 180°. The other sets add up to 170°, 190° and 190°.","scheme":[],"watch":"Not adding all three angles, and picking a set just because it looks sensible.","opts":["95°, 45°, 30°","88°, 46°, 56°","45°, 45°, 100°","62°, 49°, 69°"],"ans":3,"check":{"type":"mcq"}},{"n":4,"s":"A","m":1,"text":"The straight line <b>PQ</b> has been drawn inside the circle below. What is the correct name for PQ?","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"-58.5\" y1=\"-38.5\" x2=\"58.5\" y2=\"-38.5\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"-51.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">PQ</text></svg>","sol":"PQ joins two points on the circle but does not pass through the centre O, so it is a chord.","scheme":[],"watch":"Calling it a diameter — a diameter must pass through the centre.","opts":["A chord","A radius","A diameter","An arc"],"ans":0,"check":{"type":"mcq"}},{"n":5,"s":"A","m":1,"text":"Malee is going to draw a triangle with two sides of 7 cm and 5 cm and an angle of 62° between them. Which instruments does she need?","fig":"","sol":"She measures the two side lengths with a ruler and the 62° angle with a protractor.","scheme":[],"watch":"Choosing compasses — compasses are for circles and arcs, not for measuring an angle.","opts":["A ruler only","A pair of compasses only","A protractor and a pair of compasses","A ruler and a protractor"],"ans":3,"check":{"type":"mcq"}},{"n":6,"s":"A","m":1,"text":"Find the value of <b>∠x</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 225.9 168.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,120.0 177.9,120.0 0.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"153.9,120.0 153.9,119.2 154.0,118.4 154.0,117.6 154.1,116.8 154.2,116.1 154.4,115.3 154.5,114.5 154.7,113.7 154.9,113.0 155.2,112.2 155.5,111.5 155.8,110.8 156.1,110.0 156.4,109.3 156.8,108.6 157.2,107.9 157.6,107.2 158.0,106.6\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"139.6\" y=\"108.9\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">34°</text><polyline points=\"19.9,13.4 19.1,14.5 18.3,15.5 17.5,16.5 16.5,17.4 15.6,18.3 14.6,19.1 13.5,19.8 12.4,20.5 11.3,21.2 10.1,21.8 8.9,22.3 7.7,22.7 6.4,23.1 5.2,23.4 3.9,23.7 2.6,23.9 1.3,24.0 0.0,24.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"18.8\" y=\"33.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text><polyline points=\"0.0,109.0 11.0,109.0 11.0,120.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/></svg>","sol":"x = 180° − 90° − 34° = 56°.","scheme":[],"watch":"Forgetting the right angle and working out 180° − 34° = 146°.","opts":["34°","56°","124°","146°"],"ans":1,"check":{"type":"mcq"}},{"n":7,"s":"A","m":1,"text":"One angle of a triangle is 104°. Which words describe this triangle?","fig":"","sol":"104° is greater than 90°, so the triangle has an obtuse angle and is obtuse-angled.","scheme":[],"watch":"Reading 104° as a right angle because it is “about 90°”.","opts":["Acute-angled","Equilateral","Right-angled","Obtuse-angled"],"ans":3,"check":{"type":"mcq"}},{"n":8,"s":"A","m":1,"text":"What is the name for the distance all the way round the edge of a circle?","fig":"","sol":"The complete distance round the edge of a circle is called the circumference.","scheme":[],"watch":"Choosing “an arc” — an arc is only a part of the circumference.","opts":["The diameter","The circumference","The radius","An arc"],"ans":1,"check":{"type":"mcq"}},{"n":9,"s":"A","m":1,"text":"The shaded part of the circle below is a semicircle. The radius of the circle is 9 cm. How long is the straight edge of the semicircle?","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><path d=\"M-70,0 A70,70 0 0 1 70,0 Z\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm          </text></svg>","sol":"The straight edge of a semicircle is a diameter. Diameter = 2 × 9 cm = 18 cm.","scheme":[],"watch":"Giving 9 cm — that is the radius, only half of the straight edge.","opts":["4.5 cm","9 cm","18 cm","27 cm"],"ans":2,"check":{"type":"mcq"}},{"n":10,"s":"A","m":1,"text":"<b>AB</b> is the base of an isosceles triangle. Find the value of <b>∠y</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 178.0 181.3\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,133.3 130.0,133.3 65.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"10.5,111.7 11.8,112.4 13.1,113.2 14.3,114.0 15.5,115.0 16.6,116.0 17.6,117.0 18.6,118.2 19.5,119.3 20.4,120.6 21.1,121.9 21.8,123.2 22.4,124.6 22.9,126.0 23.3,127.4 23.6,128.9 23.8,130.3 24.0,131.8 24.0,133.3\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"33.9\" y=\"113.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">64°</text><polyline points=\"75.5,21.6 74.4,22.1 73.3,22.5 72.1,22.9 71.0,23.2 69.8,23.5 68.6,23.7 67.4,23.9 66.2,24.0 65.0,24.0 63.8,24.0 62.6,23.9 61.4,23.7 60.2,23.5 59.0,23.2 57.9,22.9 56.7,22.5 55.6,22.1 54.5,21.6\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"65.0\" y=\"38.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">y</text><line x1=\"93.0\" y1=\"68.8\" x2=\"102.0\" y2=\"64.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"37.0\" y1=\"68.8\" x2=\"28.0\" y2=\"64.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"-12.4\" y=\"141.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><text x=\"142.4\" y=\"141.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text></svg>","sol":"The base angles of an isosceles triangle are equal, so both are 64°. y = 180° − 64° − 64° = 52°.","scheme":[],"watch":"Subtracting only one base angle: 180° − 64° = 116°.","opts":["32°","52°","64°","116°"],"ans":1,"check":{"type":"mcq"}},{"n":11,"s":"B","m":2,"text":"The diagram shows triangle <i>ABC</i>. ∠<i>BAC</i> = 90° and ∠<i>ACB</i> is twice ∠<i>ABC</i>. Find ∠<i>ABC</i>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 203.9 138.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 155.9,90.0 0.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,79.0 11.0,79.0 11.0,90.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"-13.0\" y=\"97.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><text x=\"170.3\" y=\"94.2\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"-9.8\" y=\"-11.3\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text></svg>","sol":"∠ABC + ∠ACB = 180° − 90° = 90°. These two angles are 1 part and 2 parts, so 3 parts = 90° and 1 part = 30°. ∠ABC = 30°.","scheme":["M1 ∠ABC + ∠ACB = 90°","A1 30°"],"watch":"Dividing 90° by 2 and giving 45° for both angles.","ans":"30°","check":{"type":"numeric","nums":[30.0],"unit":"deg","display":"30°"}},{"n":12,"s":"B","m":2,"text":"A round tabletop has a radius of 45 cm. Anong measures right across the tabletop, passing through the centre. What length does she measure? Give your answer in <b>metres</b>.","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">45 cm          </text></svg>","sol":"The line across the centre is a diameter. Diameter = 2 × 45 cm = 90 cm = 0.9 m.","scheme":["M1 2 × 45 = 90 cm","A1 0.9 m"],"watch":"Leaving the answer as 90 cm when metres were asked for.","ans":"0.9 m","check":{"type":"numeric","nums":[0.9],"unit":"m","display":"0.9 m"}},{"n":13,"s":"B","m":2,"text":"Krit folds a square piece of paper in half along one of its diagonals. He makes a triangle with a right angle and two equal sides. Find the size of each of the other two angles of the triangle.","fig":"","sol":"180° − 90° = 90° is shared equally between the two equal angles. 90° ÷ 2 = 45°.","scheme":["M1 180° − 90° = 90°","A1 45°"],"watch":"Giving 90° for each, forgetting that the two angles share what is left.","ans":"45°","check":{"type":"numeric","nums":[45.0],"unit":"deg","display":"45°"}},{"n":14,"s":"B","m":2,"text":"In the diagram, <i>BCD</i> is a straight line. ∠<i>ABC</i> = 63° and ∠<i>BAC</i> = 46°. Find <b>∠x</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 267.0 234.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,175.7 150.0,175.7 89.5,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"150.0\" y1=\"175.7\" x2=\"210.0\" y2=\"175.7\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"10.9,154.3 12.2,155.0 13.4,155.8 14.6,156.7 15.7,157.6 16.8,158.6 17.8,159.6 18.8,160.8 19.7,161.9 20.5,163.2 21.2,164.4 21.8,165.7 22.4,167.1 22.9,168.5 23.3,169.9 23.6,171.3 23.8,172.8 24.0,174.2 24.0,175.7\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"34.1\" y=\"155.8\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">63°</text><polyline points=\"97.3,22.7 96.3,23.0 95.3,23.3 94.2,23.5 93.2,23.7 92.1,23.9 91.0,24.0 90.0,24.0 88.9,24.0 87.8,23.9 86.8,23.8 85.7,23.7 84.6,23.5 83.6,23.3 82.6,23.0 81.6,22.6 80.6,22.3 79.6,21.8 78.6,21.4\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"86.7\" y=\"37.9\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">46°</text><text x=\"-12.1\" y=\"184.6\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"161.5\" y=\"185.3\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><text x=\"90.7\" y=\"-14.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><text x=\"169.0\" y=\"157.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text><text x=\"219.0\" y=\"186.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">D</text></svg>","sol":"∠ACB = 180° − 63° − 46° = 71°. BCD is a straight line, so x = 180° − 71° = 109°.","scheme":["M1 ∠ACB = 71°","A1 109°"],"watch":"Stopping at 71° and forgetting the angles on the straight line.","ans":"109°","check":{"type":"numeric","nums":[109.0],"unit":"deg","display":"109°"}},{"n":15,"s":"B","m":2,"text":"Anong is drawing triangle <i>KLM</i> from the measurements shown. She has already drawn <i>LK</i> = 7 cm. Describe the next <b>two</b> steps she should take to finish the triangle.","fig":"<svg class=\"fig\" viewBox=\"-24.0 2.0 188.0 142.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,120.0 140.0,120.0 34.2,26.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"8.2,97.4 9.7,98.1 11.2,98.8 12.6,99.6 14.0,100.5 15.2,101.5 16.5,102.5 17.6,103.7 18.7,104.9 19.7,106.2 20.5,107.6 21.3,109.0 22.0,110.5 22.6,112.0 23.1,113.6 23.5,115.1 23.8,116.8 23.9,118.4 24.0,120.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"32.8\" y=\"98.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">70°</text><text x=\"70.0\" y=\"135.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text><text x=\"3.0\" y=\"67.9\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 cm    </text><text x=\"-13.2\" y=\"127.1\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">L</text><text x=\"154.0\" y=\"125.4\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">K</text><text x=\"28.9\" y=\"12.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">M</text></svg>","sol":"Step 1: use a protractor to draw an angle of 70° at L. Step 2: measure 5 cm along that new line from L and mark the point M, then join M to K.","scheme":["B1 draw the 70° angle at L with a protractor","B1 mark M 5 cm from L along it (then join M to K)"],"watch":"Measuring the 5 cm side before the 70° angle is drawn, so M cannot be placed.","ans":"Draw the 70° angle at L, then mark M 5 cm from L","check":{"type":"self"}},{"n":16,"s":"B","m":2,"text":"<i>ABCD</i> is a rectangle. The diagonal <i>BD</i> has been drawn. ∠<i>ABD</i> = 27°. Find <b>∠x</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 224.6 138.0\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 176.6,0.0 176.6,90.0 0.0,90.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"176.6\" y1=\"0.0\" x2=\"0.0\" y2=\"90.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"-13.4\" y=\"-6.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><text x=\"190.0\" y=\"-6.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"190.0\" y=\"96.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><text x=\"-13.4\" y=\"96.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">D</text><text x=\"141.6\" y=\"8.4\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">27°</text><text x=\"18.8\" y=\"59.3\" font-size=\"13\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text></svg>","sol":"∠DAB = 90° because ABCD is a rectangle. In triangle ABD, x = 180° − 90° − 27° = 63°.","scheme":["M1 using ∠DAB = 90° in triangle ABD","A1 63°"],"watch":"Using 180° − 27° = 153° and forgetting the right angle at A.","ans":"63°","check":{"type":"numeric","nums":[63.0],"unit":"deg","display":"63°"}},{"n":17,"s":"B","m":2,"text":"Three angles meet at the point <i>O</i> and together they make a full turn. Two of the angles are 128° and 97°. Find the third angle, <b>∠x</b>.","fig":"","sol":"The angles at a point add up to 360°. 128° + 97° = 225°, so x = 360° − 225° = 135°.","scheme":["M1 128° + 97° = 225° (or 360° − 128°)","A1 135°"],"watch":"Using 180° instead of 360° for the angles that meet at a point.","ans":"135°","check":{"type":"numeric","nums":[135.0],"unit":"deg","display":"135°"}},{"n":18,"s":"B","m":2,"text":"Two of the angles of a triangle are 65° and 50°. Is the triangle <b>scalene</b> or <b>isosceles</b>? Show how you know.","fig":"","sol":"The third angle = 180° − 65° − 50° = 65°. Two angles are equal (65° and 65°), so two sides are equal and the triangle is isosceles.","scheme":["M1 third angle = 65°","A1 isosceles, because two angles are equal"],"watch":"Saying scalene because the two angles given are different.","ans":"Isosceles","check":{"type":"self"}},{"n":19,"s":"B","m":2,"text":"Two circles are drawn on a page. Each circle has a radius of 4.5 cm. The circles touch each other at exactly one point. How far apart are the two centres?","fig":"","sol":"The distance between the centres is one radius plus the other radius: 4.5 cm + 4.5 cm = 9 cm.","scheme":["M1 4.5 + 4.5","A1 9 cm"],"watch":"Giving 4.5 cm, using only one radius.","ans":"9 cm","check":{"type":"numeric","nums":[9.0],"unit":"cm","display":"9 cm"}},{"n":20,"s":"B","m":2,"text":"Somchai says, “A triangle can have two right angles.” Explain why Somchai is wrong.","fig":"","sol":"90° + 90° = 180°, which is the total of all three angles of a triangle. There would be 0° left for the third angle, so the shape could not close up into a triangle.","scheme":["C1 two right angles make 180°","C1 nothing is left for the third angle, so no triangle can be formed"],"watch":"Answering only “because it is impossible” with no reference to the 180° angle sum.","ans":"Two right angles already use up 180°","check":{"type":"self"}},{"n":21,"s":"C","m":4,"text":"The diagram shows the frame of a tent. <i>AB</i> = <i>AC</i> and ∠<i>BAC</i> = 50°.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 188.0 198.1\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,150.1 140.0,150.1 70.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"80.1,21.8 79.1,22.2 78.0,22.6 76.9,23.0 75.8,23.3 74.6,23.6 73.5,23.7 72.3,23.9 71.2,24.0 70.0,24.0 68.8,24.0 67.7,23.9 66.5,23.7 65.4,23.6 64.2,23.3 63.1,23.0 62.0,22.6 60.9,22.2 59.9,21.8\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"70.0\" y=\"38.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">50°</text><line x1=\"100.5\" y1=\"77.2\" x2=\"109.5\" y2=\"72.9\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"39.5\" y1=\"77.2\" x2=\"30.5\" y2=\"72.9\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"-12.2\" y=\"158.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"152.2\" y=\"158.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><text x=\"70.0\" y=\"-15.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text></svg>","sol":"","scheme":["M1 180° − 50° = 130°, then ÷ 2","A1 65°","M1 new base angle = (180° − 80°) ÷ 2 = 50°","A1 decreases by 15°"],"watch":"Halving 180° instead of subtracting the apex angle first.","parts":[{"label":"(a)","text":"Find ∠<i>ABC</i>.","fig":"","m":2,"ans":"65°","sol":"180° − 50° = 130°; the two base angles are equal, so ∠ABC = 130° ÷ 2 = 65°.","check":{"type":"numeric","nums":[65.0],"unit":"deg","display":"65°"}},{"label":"(b)","text":"For a larger tent the designer changes ∠<i>BAC</i> to 80°, keeping <i>AB</i> = <i>AC</i>. By how many degrees does each base angle change?","fig":"","m":2,"ans":"It decreases by 15°","sol":"New base angle = (180° − 80°) ÷ 2 = 50°. The change is 65° − 50° = 15°, a decrease.","check":{"type":"numeric","nums":[15.0],"unit":"deg","display":"It decreases by 15°"}}]},{"n":22,"s":"C","m":4,"text":"Anong is asked to draw triangle <i>PQR</i> with <i>PQ</i> = 8 cm, ∠<i>QPR</i> = 35° and ∠<i>PQR</i> = 65°.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 208.0 132.5\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,84.5 160.0,84.5 120.6,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"19.7,70.7 20.1,71.4 20.5,72.1 21.0,72.8 21.3,73.5 21.7,74.2 22.0,75.0 22.3,75.7 22.6,76.5 22.9,77.3 23.1,78.1 23.3,78.8 23.5,79.6 23.7,80.4 23.8,81.3 23.9,82.1 23.9,82.9 24.0,83.7 24.0,84.5\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"38.1\" y=\"73.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">35°</text><polyline points=\"136.0,84.5 136.0,83.0 136.2,81.5 136.4,80.0 136.8,78.5 137.2,77.1 137.7,75.6 138.3,74.3 139.0,72.9 139.8,71.6 140.6,70.4 141.5,69.2 142.5,68.0 143.6,67.0 144.8,66.0 146.0,65.0 147.2,64.2 148.5,63.4 149.9,62.7\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"126.3\" y=\"64.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">65°</text><text x=\"80.0\" y=\"99.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text><text x=\"-14.4\" y=\"88.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text><text x=\"173.8\" y=\"90.4\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text><text x=\"127.1\" y=\"-13.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">R</text></svg>","sol":"","scheme":["M1 180° − 35° − 65°","A1 80°","C1 the 65° angle should be drawn at Q","C1 R is not known until the two lines cross"],"watch":"In (b), only saying “she measured wrongly” without naming the correct vertex.","parts":[{"label":"(a)","text":"Work out the size of ∠<i>PRQ</i>.","fig":"","m":2,"ans":"80°","sol":"∠PRQ = 180° − 35° − 65° = 80°.","check":{"type":"numeric","nums":[80.0],"unit":"deg","display":"80°"}},{"label":"(b)","text":"Anong drew <i>PQ</i> = 8 cm first. She then used a protractor to draw an angle of 35° at <i>P</i> and an angle of 65° at <i>R</i>. Explain the mistake Anong made and say what she should have done.","fig":"","m":2,"ans":"The 65° angle belongs at Q, not at R","sol":"The 65° angle is the angle at Q, so it must be drawn at Q, the other end of PQ. R cannot be used at that stage because R is not on the paper yet — R is the point where the two drawn lines cross.","check":{"type":"self"}}]},{"n":23,"s":"C","m":4,"text":"The diagram shows a circle with centre <i>O</i>. Two straight lines have been drawn on it.","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">                  MN</text><line x1=\"-58.5\" y1=\"-38.5\" x2=\"58.5\" y2=\"-38.5\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"-51.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">PQ</text></svg>","sol":"","scheme":["B1 diameter","C1 because MN passes through the centre O","M1 17 ÷ 2 (radius = diameter ÷ 2)","A1 8.5 cm"],"watch":"In (b), doubling 17 cm instead of halving it.","parts":[{"label":"(a)","text":"Write down the mathematical name of the line <i>MN</i>, and explain how you can tell.","fig":"","m":2,"ans":"A diameter","sol":"MN joins two points on the circle and passes through the centre O, so it is a diameter.","check":{"type":"self"}},{"label":"(b)","text":"<i>MN</i> = 17 cm. Find the length of <i>OM</i>.","fig":"","m":2,"ans":"8.5 cm","sol":"OM is a radius and MN is a diameter, so OM = 17 cm ÷ 2 = 8.5 cm.","check":{"type":"numeric","nums":[8.5],"unit":"cm","display":"8.5 cm"}}]},{"n":24,"s":"C","m":4,"text":"Mei is drawing a design. She first draws a square of side 14 cm. Inside it she draws the largest circle that will fit, touching all four sides of the square.","fig":"<svg class=\"fig\" viewBox=\"-92.0 -92.0 184.0 200.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"-70\" y=\"-70\" width=\"140\" height=\"140\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#fff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><text x=\"0.0\" y=\"86.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text></svg>","sol":"","scheme":["B1 7 cm","C1 the circle’s diameter is 14 cm, the same as the side of the square, and compasses are set to the radius","M1 each diameter = 14 ÷ 2 = 7 cm","A1 3.5 cm"],"watch":"In (a), setting the compasses to 14 cm, the diameter, instead of the radius.","parts":[{"label":"(a)","text":"What distance should Mei set between the point and the pencil of her compasses? Explain how you know.","fig":"","m":2,"ans":"7 cm","sol":"The circle touches both sides of the square, so its diameter is 14 cm, the same as the side of the square. Compasses are set to the radius, and 14 cm ÷ 2 = 7 cm.","check":{"type":"numeric","nums":[7.0],"unit":"cm","display":"7 cm"}},{"label":"(b)","text":"Mei rubs out that circle. Inside the same square she now draws two equal circles, side by side. The two circles touch each other, and together they just fit across the square: the first touches the left-hand side and the second touches the right-hand side. Find the radius of each of these two circles.","fig":"","m":2,"ans":"3.5 cm","sol":"Two diameters together stretch right across the square, so each diameter = 14 cm ÷ 2 = 7 cm. Radius = 7 cm ÷ 2 = 3.5 cm.","check":{"type":"numeric","nums":[3.5],"unit":"cm","display":"3.5 cm"}}]},{"n":25,"s":"C","m":4,"text":"<i>PQRS</i> is a rectangle. <i>T</i> is a point on <i>SR</i>. ∠<i>QPT</i> = 32° and ∠<i>PQT</i> = 62°.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 238.0 152.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 190.0,0.0 190.0,89.1 0.0,89.1\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"142.6\" y2=\"89.1\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"190.0\" y1=\"0.0\" x2=\"142.6\" y2=\"89.1\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"11.0,89.1 11.0,78.1 0.0,78.1\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"-13.6\" y=\"-6.4\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text><text x=\"203.6\" y=\"-6.4\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text><text x=\"203.6\" y=\"95.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">R</text><text x=\"-13.6\" y=\"95.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">S</text><text x=\"38.5\" y=\"11.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">32°</text><text x=\"154.0\" y=\"21.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">62°</text><text x=\"142.6\" y=\"104.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">T</text></svg>","sol":"","scheme":["M1 180° − 32° − 62°","A1 86°","B1 says No","C1 no two angles are equal, so no two sides are equal"],"watch":"In (b), saying yes because <i>PT</i> and <i>QT</i> look about the same length in the diagram.","parts":[{"label":"(a)","text":"Find ∠<i>PTQ</i>.","fig":"","m":2,"ans":"86°","sol":"In triangle PQT, ∠PTQ = 180° − 32° − 62° = 86°.","check":{"type":"numeric","nums":[86.0],"unit":"deg","display":"86°"}},{"label":"(b)","text":"Ben says, “Triangle <i>PQT</i> is an isosceles triangle.” Is Ben correct? Explain your answer.","fig":"","m":2,"ans":"No","sol":"The three angles are 32°, 62° and 86°. No two of them are equal, so no two sides are equal and the triangle is not isosceles — it is scalene.","check":{"type":"yesno","value":"no"}}]}]},{"id":"08_3D-Shapes","code":"Chapter 8","title":"3-Dimensional Shapes","colour":"#146A78","blurb":"Solids, faces and nets","sub":"Cones, cylinders, spheres and pyramids · Faces, edges and vertices · Nets of solids","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"The solid below is a cube. How many <b>vertices</b> does it have?","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 272.0 208.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,34 100,34 100,134 0,134\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,34 34,0 134,0 100,34\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"100,34 134,0 134,100 100,134\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,134 34,100 134,100\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"34\" y1=\"0\" x2=\"34\" y2=\"100\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg>","sol":"A cube has 8 vertices (corners), 6 faces and 12 edges.","scheme":[],"watch":"Giving 6, the number of faces, instead of the number of vertices.","opts":["4","6","8","12"],"ans":2,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"Which solid has <b>2 flat faces</b> and exactly <b>1 curved surface</b>?","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-26.0 -26.0 152.0 206.0\" style=\"width:26mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M50.0,0 L0,120 A50.0,22 0 0 0 100,120 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><path d=\"M0,120 A50.0,22 0 0 1 100,120\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-88.0 -88.0 176.0 176.0\" style=\"width:26mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"62\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><ellipse cx=\"0\" cy=\"0\" rx=\"62\" ry=\"17.360000000000003\" fill=\"none\" stroke=\"#94a3b8\" stroke-width  fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 136.0 110.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"52\" y=\"52\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"78\" y=\"52\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">C</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 136.0 84.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"52\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"78\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">D</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 136.0 110.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sa mid"],"ans":1,"check":{"type":"mcq"}},{"n":7,"s":"A","m":1,"text":"The net of a <b>cylinder</b> is made up of:","fig":"","sol":"The two circles make the flat ends and the rectangle rolls round to make the curved surface.","scheme":[],"watch":"Forgetting the second circle for the other end of the cylinder.","opts":["1 circle and 4 triangles","2 triangles and 3 rectangles","6 squares","2 circles and 1 rectangle"],"ans":3,"check":{"type":"mcq"}},{"n":8,"s":"A","m":1,"text":"Which solid has <b>4 faces</b>, and every one of its faces is a triangle?","fig":"","sol":"A triangular pyramid has a triangular base and three triangular faces — 4 triangles altogether.","scheme":[],"watch":"Choosing the triangular prism, which has 2 triangles and 3 rectangles.","opts":["Triangular pyramid","Square pyramid","Triangular prism","Cube"],"ans":0,"check":{"type":"mcq"}},{"n":9,"s":"A","m":1,"text":"A solid has 5 faces, 5 vertices and 8 edges. Its base is a square. Which solid is it?","fig":"","sol":"A square pyramid has 1 square face and 4 triangular faces (5 faces), 5 vertices and 8 edges.","scheme":[],"watch":"Choosing the triangular prism, which also has 5 faces, without checking that this solid has a square base.","opts":["Cuboid","Triangular prism","Square pyramid","Triangular pyramid"],"ans":2,"check":{"type":"mcq"}},{"n":10,"s":"A","m":1,"text":"The net below folds to make a cube. Which face will be <b>opposite</b> face Q?","fig":"<svg class=\"fig\" viewBox=\"-16.0 -16.0 140.0 176.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"36\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"18.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text><rect x=\"0\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"18.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text><rect x=\"36\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">R</text><rect x=\"72\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">S</text><rect x=\"36\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">T</text><rect x=\"36\" y=\"108\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"126.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">U</text></svg>","sol":"Q and S are the two flaps on either side of the middle strip, so they fold to face each other. (P is opposite T and R is opposite U.)","scheme":[],"watch":"Choosing R, which is joined to Q, so it ends up next to Q and not opposite it.","opts":["P","S","T","U"],"ans":1,"check":{"type":"mcq"}},{"n":11,"s":"B","m":2,"text":"The solid below is a cuboid. Write down the number of <b>faces</b>, <b>edges</b> and <b>vertices</b> it has.","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 304.0 188.0\" style=\"width:50mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,36 130,36 130,114 0,114\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,36 36,0 166,0 130,36\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"130,36 166,0 166,78 130,114\" fill=\"#c7d2fe\" stroke=\"#1f2937\" s "/><text x=\"18.0\" y=\"18.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><rect x=\"36\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"18.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><rect x=\"36\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><rect x=\"72\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">D</text><rect x=\"72\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">E</text><rect x=\"108\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"126.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">F</text></svg>","sol":"Fold B up first. A and D then face each other, and B and E face each other. (C is opposite F.)","scheme":["B1 D is opposite A","B1 E is opposite B"],"watch":"Picking the face that is joined to A, which folds to sit next to A, not opposite it.","ans":"Opposite A is D; opposite B is E","check":{"type":"self"}},{"n":14,"s":"B","m":2,"text":"Here is the net of a solid. <b>(i)</b> Name the solid it folds to make. <b>(ii)</b> How many vertices will the solid have?","fig":"<svg class=\"fig\" viewBox=\"-24.0 -76.0 228.0 192.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\"

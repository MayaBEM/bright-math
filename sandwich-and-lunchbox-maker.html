'use strict';
/* Sound effects made in code (Web Audio). No audio files, no voice. */
const Snd = (() => {
  let ctx = null, master = null, noiseBuf = null, muted = Store.get('mute', false);
  const log = [];
  function init() {
    if (ctx) return ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : 0.75;
      const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      const len = ctx.sampleRate; noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return ctx;
  }
  function resume() { const c = init(); if (c && c.state === 'suspended') c.resume(); }
  /* filtered noise burst */
  function noise(o) {
    const c = init(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0), dur = o.dur || 0.2;
    const src = c.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.playbackRate.value = o.rate || 1;
    const flt = c.createBiquadFilter(); flt.type = o.type || 'bandpass'; flt.frequency.setValueAtTime(o.f0 || 1000, t0); flt.Q.value = o.q || 1;
    if (o.f1) flt.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
    const g = c.createGain(); const peak = o.gain || 0.3;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(master); src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }
  function tone(freq, dur, o) {
    const c = init(); if (!c) return; o = o || {};
    const t0 = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t0 + (o.att || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  const bell = (f, at, gain) => { tone(f, 0.7, { at, gain: gain || 0.16, att: 0.004 }); tone(f * 2.01, 0.4, { at, gain: (gain || 0.16) * 0.35, att: 0.004 }); };
  const SFX = {
    peel() { noise({ type: 'bandpass', f0: 2200, f1: 5200, q: 2, dur: 0.24, gain: 0.22 }); noise({ type: 'highpass', f0: 4000, dur: 0.12, gain: 0.08, at: 0.1 }); },
    rustle() { for (let i = 0; i < 5; i++) noise({ type: 'bandpass', f0: 3000 + Math.random() * 3000, q: 0.8, dur: 0.05 + Math.random() * 0.05, gain: 0.12, at: i * 0.045 }); },
    tap() { tone(150, 0.1, { f1: 70, gain: 0.22 }); noise({ type: 'lowpass', f0: 900, dur: 0.07, gain: 0.18 }); },
    snip() { noise({ type: 'highpass', f0: 5000, dur: 0.05, gain: 0.3 }); tone(3200, 0.06, { type: 'triangle', gain: 0.08 }); noise({ type: 'highpass', f0: 5000, dur: 0.05, gain: 0.3, at: 0.11 }); tone(3600, 0.06, { type: 'triangle', gain: 0.08, at: 0.11 }); },
    spread() { noise({ type: 'bandpass', f0: 700, f1: 1500, q: 0.7, dur: 0.42, gain: 0.2, att: 0.05 }); },
    pop() { tone(320, 0.18, { f1: 90, gain: 0.3 }); noise({ type: 'bandpass', f0: 1800, dur: 0.06, gain: 0.25 }); tone(520, 0.25, { f1: 300, type: 'triangle', gain: 0.1, at: 0.03 }); },
    crunch() { for (let i = 0; i < 6; i++) noise({ type: 'bandpass', f0: 1500 + Math.random() * 2500, q: 1.2, dur: 0.035, gain: 0.3, at: i * 0.05 }); },
    pour() { noise({ type: 'bandpass', f0: 900, f1: 2200, q: 3, dur: 0.9, gain: 0.18, att: 0.1 }); for (let i = 0; i < 7; i++) tone(500 + i * 90, 0.08, { gain: 0.04, at: 0.1 + i * 0.11, f1: 900 + i * 90 }); },
    click() { noise({ type: 'highpass', f0: 3000, dur: 0.03, gain: 0.3 }); tone(900, 0.05, { type: 'square', gain: 0.06 }); noise({ type: 'highpass', f0: 2500, dur: 0.03, gain: 0.3, at: 0.09 }); },
    chime() { bell(659, 0, 0.15); bell(880, 0.1, 0.15); bell(1319, 0.2, 0.13); },
    oops() { tone(330, 0.22, { type: 'triangle', f1: 260, gain: 0.2 }); tone(247, 0.35, { type: 'triangle', f1: 170, gain: 0.2, at: 0.2 }); },
    fanfare() { const n = [[523, 0, 0.16], [659, 0.15, 0.16], [784, 0.3, 0.16], [1047, 0.46, 0.5]]; n.forEach(([f, at, d]) => { tone(f, d + 0.1, { type: 'sawtooth', gain: 0.07, at }); tone(f * 2, d + 0.1, { type: 'triangle', gain: 0.07, at }); }); bell(1568, 0.7, 0.12); bell(2093, 0.82, 0.1); },
    flash() { noise({ type: 'highpass', f0: 6000, dur: 0.08, gain: 0.25 }); tone(1800, 0.05, { type: 'square', gain: 0.05 }); tone(1200, 0.07, { type: 'square', gain: 0.05, at: 0.07 }); },
    squish() { tone(220, 0.14, { f1: 120, gain: 0.18 }); noise({ type: 'lowpass', f0: 600, dur: 0.12, gain: 0.15 }); },
    sizzle() { noise({ type: 'highpass', f0: 4500, dur: 0.6, gain: 0.07, att: 0.1 }); },
    thud() { tone(110, 0.16, { f1: 48, gain: 0.34 }); noise({ type: 'lowpass', f0: 700, dur: 0.09, gain: 0.22 }); },
    splat() { noise({ type: 'lowpass', f0: 900, f1: 300, dur: 0.16, gain: 0.3, att: 0.004 }); tone(190, 0.12, { f1: 70, gain: 0.2 }); noise({ type: 'bandpass', f0: 2600, q: 2, dur: 0.05, gain: 0.12, at: 0.05 }); },
    slap() { noise({ type: 'bandpass', f0: 1800, f1: 900, q: 1.1, dur: 0.1, gain: 0.3, att: 0.003 }); tone(130, 0.08, { f1: 70, gain: 0.16 }); },
    key() { tone(700, 0.05, { type: 'triangle', gain: 0.07 }); }
  };
  return {
    log,
    play(n) { if (SFX[n]) { log.push(n); if (log.length > 400) log.shift(); if (!muted) { try { resume(); SFX[n](); } catch (e) { /* ignore */ } } } },
    resume, init,
    get muted() { return muted; },
    setMuted(m) { muted = !!m; Store.set('mute', muted); if (master) master.gain.value = muted ? 0 : 0.75; }
  };
})();

'use strict';
/* =========================================================
   ENGLISH ENGINE: a/an, some/any, countable vs uncountable, quantity phrases,
   Say-it cards, how-to text, order cards + order checker, recipe checker.
   ========================================================= */
const Lang = (() => {
  const NUMW = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  const num = (n) => (n >= 0 && n <= 12 ? NUMW[n] : String(n));
  const art = (w) => (/^[aeiou]/i.test(w) ? 'an' : 'a');
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const unitPl = (u) => u + 's';
  const list = (a) => (a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);
  const F = (id) => FOOD[id];
  /* quantity phrase: qty('cheese',2) -> "two slices of cheese" */
  function qty(id, n, o) {
    const f = F(id); n = n == null ? 1 : n; o = o || {};
    if (f.pc && !o.whole) return n === 1 ? `${art(f.pc[0])} ${f.pc[0]}` : `${num(n)} ${f.pc[1]}`;
    if (f.type === 'c') return n === 1 ? `${art(f.n)} ${f.n}` : `${num(n)} ${f.pl}`;
    if (f.unit) return n === 1 ? `${art(f.unit)} ${f.unit} of ${f.n}` : `${num(n)} ${unitPl(f.unit)} of ${f.n}`;
    return `some ${f.n}`;
  }
  /* unspecific: "some tomato slices", "some cheese" */
  function some(id, o) {
    const f = F(id); o = o || {};
    if (f.pc && !o.whole) return id === 'lettuce' ? 'some lettuce' : 'some ' + f.pc[1];
    if (f.type === 'c') return 'some ' + f.pl;
    return 'some ' + f.n;
  }
  /* label as shown in the word bank / on tags: "an apple", "some butter" */
  function label(id) { const f = F(id); if (f.type === 'c') return `${art(f.n)} ${f.n}`; if (f.type === 'p') return 'some ' + f.n; return f.n; }
  const name = (id) => F(id).n;
  const isCount = (id) => F(id).type === 'c' || F(id).type === 'p';

  /* ---- sequence words ---- */
  const SEQ5 = ['First', 'Next', 'Then', 'After that', 'Finally'];
  const seqFor = (n) => ({ 1: ['First'], 2: ['First', 'Finally'], 3: ['First', 'Then', 'Finally'], 4: ['First', 'Next', 'Then', 'Finally'], 5: SEQ5 }[n] || SEQ5);
  /* live tracker used while a creation is being made */
  const Seq = { i: -1, cat: null, reset() { this.i = -1; this.cat = null; },
    word(cat, last) { if (cat !== this.cat) { this.cat = cat; this.i++; } if (last) return 'Finally'; return SEQ5[Math.min(this.i, 3)]; } };

  /* ---- sentence builders for Say-it cards ---- */
  const bPhrase = (id) => (F(id).type === 'c' ? `${art(F(id).n)} ${F(id).n}` : F(id).n);
  const breadMany = (id, n) => (F(id).type === 'c' ? qty(id, 1) : qty(id, n || 2));
  function say(ev, seq) {
    const S = seq ? seq + ', ' : '';
    const sw = (s) => (seq ? S + (/^I[ ']/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1)) : s);
    const t = ev.t;
    if (t === 'bread') return [bPhrase(ev.id), sw(`I'm using ${bPhrase(ev.id)}.`)];
    if (t === 'toast') { const L = ev.lvl; return L >= 4 ? ['burnt toast', 'Oh no! The toast is burnt!'] : L === 3 ? ['dark toast', 'The toast is dark.'] : L === 2 ? ['golden toast', 'The toast is golden and crunchy.'] : ['lightly toasted bread', sw("I'm toasting the bread.")]; }
    if (t === 'spread') return [some(ev.id), sw(`I spread ${some(ev.id)} on the ${ev.where || 'bread'}.`)];
    if (t === 'slice') { const v = ev.id; return v === 'lettuce' ? ['a lettuce leaf', sw("I peel a lettuce leaf.")] : [some(v), sw(`I slice ${art(F(v).n)} ${F(v).n}.`)]; }
    if (t === 'add') return [qty(ev.id, ev.n || 1), sw(`I add ${qty(ev.id, ev.n || 1)}.`)];
    if (t === 'top') return ['the top slice', sw(F(ev.bread).type === 'c' ? 'I put the top on.' : 'I put the top slice on.')];
    if (t === 'cut') return [cutShort(ev.cut), sw(cutSentence(ev.cut))];
    if (t === 'crusts') return ['no crusts', sw('I cut off the crusts.')];
    if (t === 'slip') return ['too many layers!', 'Oh no! There are too many layers!'];
    if (t === 'tbase') return [some(ev.id), sw(`I spread ${some(ev.id)} on my toast.`)];
    if (t === 'ttop') return [qty(ev.id, ev.n), sw(`I'm putting ${qty(ev.id, ev.n)} on my toast.`)];
    if (t === 'drizzle') return ['a drizzle of ' + DRINK_NAME[ev.id], sw(`I drizzle some ${DRINK_NAME[ev.id]} on my toast.`)];
    if (t === 'sprinkle') return [some(ev.id), sw(`I sprinkle ${some(ev.id)} on my toast.`)];
    if (t === 'board') return ['my toast board', `There are ${num(ev.n)} ${ev.n === 1 ? 'toast' : 'toasts'} on my board.`];
    if (t === 'box') return ['a ' + BOX_NAME[ev.id].replace(/^an? /, ''), `I'm using ${art(BOX_NAME[ev.id])} ${BOX_NAME[ev.id]}.`];
    if (t === 'main') return [ev.what === 'toast' ? 'a slice of toast' : 'a sandwich', `I'm packing ${ev.what === 'toast' ? 'a slice of toast' : 'a sandwich'}.`];
    if (t === 'prep') { const v = { peel: ['peel the banana', 'I peel the banana.'], slice: ['slice the apple', 'I slice the apple.'], wash: ['wash the grapes', 'I wash the grapes.'], cut: ['cut the watermelon', 'I cut the watermelon.'] }[ev.act]; return v; }
    if (t === 'pack') return [LUNCH[ev.id].ph, `I'm packing ${LUNCH[ev.id].ph}.`];
    if (t === 'drink') return [LUNCH[ev.id].ph, `Can I have ${LUNCH[ev.id].ph}, please?`];
    if (t === 'wrap') return ['wrap it up', 'I wrap the sandwich in paper.'];
    if (t === 'napkin') return ['a napkin', 'I put in a napkin.'];
    if (t === 'fork') return ['a fork', 'I put in a fork.'];
    if (t === 'note') return ['a note card', 'I write a note: "' + ev.text + '"'];
    if (t === 'close') return ['close the lid', 'I close the lid.'];
    if (t === 'full') return ['the box is full', 'The box is full!'];
    return ['', ''];
  }
  const cutShort = (c) => ({ none: 'not cut', half: 'cut in half', quarters: 'cut into quarters', triangles: 'cut into triangles', star: 'a star shape', heart: 'a heart shape', dino: 'a dinosaur shape' }[c]);
  const cutSentence = (c) => ({ none: "I don't cut the sandwich.", half: 'I cut the sandwich in half.', quarters: 'I cut the sandwich into quarters.', triangles: 'I cut the sandwich into triangles.', star: 'I cut the sandwich into a star shape.', heart: 'I cut the sandwich into a heart shape.', dino: 'I cut the sandwich into a dinosaur shape.' }[c]);
  const cutOrder = (c) => ({ half: 'cut in half', quarters: 'cut into quarters', triangles: 'cut into triangles', star: 'cut into a star shape', heart: 'cut into a heart shape', dino: 'cut into a dinosaur shape' }[c]);

  /* ---- tags: short paper tag text shown when something is used ---- */
  function tag(ev) { const r = say(ev); return r[0]; }

  /* ---- how-to steps from a creation ---- */
  function groupFill(layers) {
    const out = []; const idx = {};
    layers.forEach((l) => { const id = typeof l === 'string' ? l : l.id; if (idx[id] == null) { idx[id] = out.length; out.push([id, 0]); } out[idx[id]][1]++; });
    return out;
  }
  function howtoSandwich(sw) {
    const steps = [];
    const toastWord = sw.lvl && sw.lvl < 4 ? 'toast' : null;
    const bread = F(sw.bread).type === 'c' ? qty(sw.bread, 1) : qty(sw.bread, 2);
    steps.push({ k: 'bread', pic: { bread: sw.bread, lvl: sw.lvl || 0 }, s: toastWord ? `I toast ${bread}.` : `I get ${bread}.` });
    if (sw.sb || sw.st) {
      const s = sw.sb && sw.st && sw.sb !== sw.st ? `I spread ${some(sw.sb)} on one slice and ${some(sw.st)} on the other slice.` : `I spread ${some(sw.sb || sw.st)} on the ${sw.sb && sw.st ? 'bread' : 'bottom slice'}.`;
      steps.push({ k: 'spread', pic: { spread: sw.sb || sw.st }, s: F(sw.bread).type === 'c' ? s.replace('slice', 'half').replace('slice', 'half') : s });
    }
    if ((sw.layers || []).length) {
      const parts = groupFill(sw.layers).map(([id, n]) => qty(id, n));
      steps.push({ k: 'fill', pic: { fills: groupFill(sw.layers).map((x) => x[0]) }, s: `I add ${list(parts)}.` });
    }
    if (sw.top !== false) steps.push({ k: 'top', pic: { top: true }, s: F(sw.bread).type === 'c' ? 'I put the top on.' : 'I put the top slice on.' });
    if (sw.cut && sw.cut !== 'none') steps.push({ k: 'cut', pic: { cut: sw.cut }, s: (sw.crusts === false ? 'I cut off the crusts and ' : 'I ') + cutSentence(sw.cut).replace(/^I /, '').replace(" the sandwich", ' it').replace("don't cut it", "don't cut it") });
    else if (sw.crusts === false) steps.push({ k: 'cut', pic: { cut: 'none' }, s: 'I cut off the crusts.' });
    return steps;
  }
  function howtoToast(t) {
    const steps = [];
    steps.push({ k: 'bread', pic: { bread: t.bread, lvl: t.lvl || 0 }, s: t.lvl && t.lvl < 4 ? `I toast ${qty(t.bread, 1)}.` : `I get ${qty(t.bread, 1)}.` });
    if (t.base) steps.push({ k: 'spread', pic: { spread: t.base }, s: `I spread ${some(t.base)} on the toast.` });
    if ((t.items || []).length) { const parts = groupFill(t.items).map(([id, n]) => qty(id, n)); steps.push({ k: 'fill', pic: { fills: groupFill(t.items).map((x) => x[0]) }, s: `I put ${list(parts)} on top.` }); }
    const fin = []; if (t.drizzle) fin.push(`drizzle some ${DRINK_NAME[t.drizzle]}`); if (t.sprinkle) fin.push(`sprinkle ${some(t.sprinkle)}`);
    if (fin.length) steps.push({ k: 'finish', pic: { drizzle: t.drizzle, sprinkle: t.sprinkle }, s: `I ${fin.join(' and ')} on my toast.`.replace('drizzle some honey', 'drizzle some honey').replace('drizzle some chocolate', 'drizzle some chocolate') });
    return steps;
  }
  /* join with sequence words */
  function howtoText(steps) {
    const w = seqFor(steps.length);
    return steps.map((s, i) => `${w[i]}, ${lf(s.s)}`).join(' ');
  }
  const fixI = (s) => s.replace(/\bi\b/g, 'I');
  const lf = (s) => (/^I[ ']/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1));

  return { num, art, cap, list, qty, some, label, name, isCount, say, tag, Seq, seqFor, SEQ5, cutOrder, cutShort, cutSentence, howtoSandwich, howtoToast, howtoText, fixI, lf, groupFill };
})();

/* =========================================================
   ORDERS (reading) : generator, text, checker
   ========================================================= */
const Orders = (() => {
  const SPREAD_PH = (id) => Lang.some(id);
  const FILL_SW = ['ham', 'chicken', 'tuna', 'egg', 'cheese', 'tomato', 'cucumber', 'lettuce', 'onion', 'pickle', 'carrot'];
  const MAIN_FILL = ['ham', 'chicken', 'tuna', 'egg', 'cheese'];
  const EXTRAS = ['grapes', 'crackers', 'yoghurt', 'cookies', 'rice', 'banana', 'apple', 'watermelon', 'carrot', 'cucumber'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuf = (a) => shuffle(a);

  function extraPh(id) { return { grapes: 'some grapes', crackers: 'some crackers', yoghurt: 'a bowl of yoghurt', cookies: 'two cookies', rice: 'two rice balls', banana: 'a banana', apple: 'some apple slices', watermelon: 'a piece of watermelon', carrot: 'some carrot sticks', cucumber: 'some cucumber slices' }[id]; }

  /* ----- text ----- */
  function sandwichText(o) {
    const D = o.details, g = (t) => D.filter((d) => d.t === t);
    const bread = g('bread')[0], toasted = g('toasted').length > 0, spread = g('spread')[0], fills = g('fill'), nof = g('nofill'), cut = g('cut')[0], extras = g('extra'), drink = g('drink')[0];
    const opener = o.opener || 'Can I have';
    const b = bread ? bread.v : null, bt = b ? FOOD[b].type : 'u';
    const fillPh = (d) => (d.n ? Lang.qty(d.v, d.n) : Lang.some(d.v));
    let subj, withList = [];
    const mainFill = fills.length === 1 && !fills[0].n && MAIN_FILL.includes(fills[0].v) && !spread ? fills[0].v : null;
    const slice = !b || bt !== 'c';
    const toastedWord = toasted ? 'toasted ' : '';
    if (mainFill && !fills[1]) {
      if (slice) subj = `${Lang.art(mainFill)} ${mainFill} sandwich`;
      else subj = `${Lang.art(mainFill)} ${toastedWord}${mainFill} ${FOOD[b].n}`;
    } else if (!slice) { subj = `${Lang.art(toastedWord + FOOD[b].n)} ${toastedWord}${FOOD[b].n}`; fills.forEach((d) => withList.push(fillPh(d))); }
    else { subj = 'a sandwich'; fills.forEach((d) => withList.push(fillPh(d))); }
    if (spread) withList.unshift(SPREAD_PH(spread.v));
    let s = `${opener} ${subj}`;
    if (slice && b) s += ` on ${toastedWord}${FOOD[b].n}`;
    else if (slice && toasted) s += ' on toasted bread';
    if (withList.length) s += ` with ${Lang.list(withList)}`;
    if (nof.length && !o.noSeparateNo) s += `, but ${nof.length ? 'without any ' + Lang.list(nof.map((d) => FOOD[d.v].pl || FOOD[d.v].n)) : ''}`;
    if (cut) s += `, ${Lang.cutOrder(cut.v)}`;
    const ex = extras.map((d) => extraPh(d.v)); if (drink) ex.push(LUNCH[drink.v].ph);
    if (ex.length) s += `, ${withList.length ? 'plus' : 'with'} ${Lang.list(ex)}`;
    return s + ', please' + (opener.startsWith('Can') ? '?' : '.');
  }
  function toastText(o) {
    const D = o.details, g = (t) => D.filter((d) => d.t === t);
    const bread = g('bread')[0], base = g('base')[0], tops = g('top'), dz = g('drizzle')[0], sp = g('sprinkle')[0], drink = g('drink')[0], extras = g('extra');
    const opener = o.opener || "I'd like";
    const kind = bread && bread.v !== 'white' ? `${FOOD[bread.v].n.replace(' bread', '')} toast` : 'toast';
    let s = `${opener} a slice of ${kind}`;
    const w = [];
    if (base) w.push(Lang.some(base.v));
    tops.forEach((d) => w.push(d.n ? Lang.qty(d.v, d.n) : Lang.some(d.v)));
    if (sp) w.push(Lang.some(sp.v));
    if (dz) w.push(`a drizzle of ${DRINK_NAME[dz.v]}`);
    if (w.length) s += ` with ${Lang.list(w)}`;
    const ex = extras.map((d) => extraPh(d.v)); if (drink) ex.push(LUNCH[drink.v].ph);
    if (ex.length) s += `${w.length ? ', plus' : ', with'} ${Lang.list(ex)}`;
    return s + ', please' + (opener.startsWith('Can') ? '?' : '.');
  }
  function text(o) { return o.kind === 'toast' ? toastText(o) : sandwichText(o); }

  /* ----- generator ----- */
  function makeSandwich(level) {
    const D = [], mf = pick(MAIN_FILL);
    const wantN = level === 3;
    if (level === 1) {
      D.push({ t: 'fill', v: mf });
      if (Math.random() < .55) D.push({ t: 'bread', v: pick(['white', 'brown']) });
    } else if (level === 2) {
      D.push({ t: 'fill', v: mf }, { t: 'bread', v: pick(['white', 'brown', 'bun', 'wrap', 'croissant']) });
      const r = Math.random();
      if (r < .34) D.push({ t: 'cut', v: pick(['half', 'quarters', 'triangles']) });
      else if (r < .67) D.push({ t: 'spread', v: pick(['butter', 'mayo', 'jam', 'peanut', 'cream']) });
      else D.push({ t: 'fill', v: pick(FILL_SW.filter((x) => x !== mf && !['onion', 'pickle'].includes(x))) });
    } else {
      const sameBread = pick(['white', 'brown']);
      D.push({ t: 'bread', v: sameBread }, { t: 'fill', v: mf, n: 2 }, { t: 'cut', v: pick(['half', 'quarters', 'triangles', 'star', 'heart']) });
      const pool = shuf([{ t: 'fill', v: pick(['tomato', 'cucumber', 'lettuce']) }, { t: 'nofill', v: pick(['onion', 'pickle']) }, { t: 'extra', v: pick(EXTRAS) }, { t: 'drink', v: pick(DRINKS) }, { t: 'toasted', v: true }]);
      D.push(pool[0], pool[1]);
    }
    return D;
  }
  function makeToast(level) {
    const D = [];
    const strong = ['strawberry', 'banana', 'kiwi', 'blueberry', 'raspberry', 'peach', 'apple'];
    if (level === 1) { if (Math.random() < .5) D.push({ t: 'base', v: pick(TOAST_BASES) }, { t: 'top', v: pick(strong) }); else D.push({ t: 'base', v: pick(TOAST_BASES) }); }
    else if (level === 2) { D.push({ t: 'base', v: pick(TOAST_BASES) }, { t: 'top', v: pick(strong), n: pick([3, 4, 5, 6]) }); D.push(Math.random() < .5 ? { t: 'drizzle', v: pick(DRIZZLES) } : { t: 'sprinkle', v: pick(SPRINKLES) }); }
    else {
      const savory = Math.random() < .5;
      D.push({ t: 'bread', v: pick(['white', 'brown', 'seeded', 'sourdough']) });
      if (savory) D.push({ t: 'base', v: pick(['avocado', 'cream', 'butter']) }, { t: 'top', v: 'friedegg', n: pick([1, 2]) }, { t: 'top', v: pick(['tomato', 'salmon', 'cheese']), n: pick([2, 3]) }, Math.random() < .5 ? { t: 'sprinkle', v: pick(SPRINKLES) } : { t: 'drink', v: pick(DRINKS) });
      else D.push({ t: 'base', v: pick(['choc', 'peanut', 'jam', 'cream']) }, { t: 'top', v: pick(['strawberry', 'banana', 'blueberry', 'kiwi']), n: pick([4, 5, 6, 7]) }, { t: 'drizzle', v: pick(DRIZZLES) }, Math.random() < .5 ? { t: 'sprinkle', v: pick(SPRINKLES) } : { t: 'drink', v: pick(DRINKS) });
    }
    return D;
  }
  function make(level, kind) {
    kind = kind || (Math.random() < .6 ? 'sandwich' : 'toast');
    level = level || 1;
    const details = kind === 'toast' ? makeToast(level) : makeSandwich(level);
    // toasted bread sometimes for sandwiches at level 3
    
    const c = pick(CUSTOMERS);
    const o = { kind, level, details, customer: c.name, cust: c, opener: kind === 'toast' ? pick(["I'd like", 'Can I have']) : pick(['Can I have', "I'd like"]) };
    o.text = text(o);
    return o;
  }

  /* ----- checker ----- */
  const cntLayers = (sw, id) => (sw.layers || []).filter((l) => (typeof l === 'string' ? l : l.id) === id).length;
  const cntTop = (t, id) => (t.items || []).filter((x) => x.id === id).length;
  function check(o, build) {
    const sw = build.sw, t = build.toast, L = build.lunch || { items: [], drink: null };
    const rows = [];
    const ok = (label, pass, got) => rows.push({ label, ok: !!pass, got: got || '' });
    o.details.forEach((d) => {
      if (o.kind === 'sandwich') {
        if (d.t === 'bread') ok(`Bread: ${FOOD[d.v].n}`, sw && sw.bread === d.v, sw && sw.bread ? FOOD[sw.bread].n : 'none');
        else if (d.t === 'toasted') ok('Toasted bread', sw && sw.lvl >= 1 && sw.lvl <= 3, sw ? TOAST_LEVELS[sw.lvl || 0] : '');
        else if (d.t === 'spread') ok(`Spread: ${Lang.some(d.v)}`, sw && (sw.sb === d.v || sw.st === d.v), sw && (sw.sb || sw.st) ? Lang.some(sw.sb || sw.st) : 'no spread');
        else if (d.t === 'fill') { const n = cntLayers(sw, d.v); ok(`Filling: ${d.n ? Lang.qty(d.v, d.n) : Lang.some(d.v)}`, d.n ? n === d.n : n >= 1, n ? Lang.qty(d.v, n) : 'none'); }
        else if (d.t === 'nofill') ok(`No ${FOOD[d.v].pc ? FOOD[d.v].pc[1] : FOOD[d.v].n}`, cntLayers(sw, d.v) === 0, cntLayers(sw, d.v) ? 'there is some' : '');
        else if (d.t === 'cut') ok(`Cut: ${Lang.cutShort(d.v).replace('cut ', '')}`, sw && sw.cut === d.v, sw ? Lang.cutShort(sw.cut || 'none') : '');
      } else {
        if (d.t === 'bread') ok(`Bread: ${FOOD[d.v].n}`, t && t.bread === d.v, t && t.bread ? FOOD[t.bread].n : 'none');
        else if (d.t === 'base') ok(`Spread: ${Lang.some(d.v)}`, t && t.base === d.v, t && t.base ? Lang.some(t.base) : 'no spread');
        else if (d.t === 'top') { const n = cntTop(t, d.v); ok(`Topping: ${d.n ? Lang.qty(d.v, d.n) : Lang.some(d.v)}`, d.n ? n === d.n : n >= 1, n ? Lang.qty(d.v, n) : 'none'); }
        else if (d.t === 'drizzle') ok(`Drizzle: ${DRINK_NAME[d.v]}`, t && t.drizzle === d.v, t && t.drizzle ? DRINK_NAME[t.drizzle] : 'none');
        else if (d.t === 'sprinkle') ok(`Sprinkle: ${Lang.some(d.v)}`, t && t.sprinkle === d.v, t && t.sprinkle ? Lang.some(t.sprinkle) : 'none');
      }
      if (d.t === 'extra') ok(`Extra: ${extraPh(d.v)}`, (L.items || []).includes(d.v), (L.items || []).length ? 'other things' : 'nothing');
      if (d.t === 'drink') ok(`Drink: ${LUNCH[d.v].ph}`, L.drink === d.v, L.drink ? LUNCH[L.drink].ph : 'no drink');
    });
    const good = rows.filter((r) => r.ok).length, total = rows.length;
    const ratio = total ? good / total : 0;
    return { rows, good, total, stars: ratio === 1 ? 3 : ratio >= 0.6 ? 2 : good > 0 ? 1 : 0 };
  }
  /* does the order need the lunchbox step? */
  const needsPack = (o) => o.details.some((d) => d.t === 'extra' || d.t === 'drink');
  const needsMat = (o) => o.kind === 'sandwich' && o.details.some((d) => (d.t === 'fill' && MAT_VEG.includes(d.v) && d.v !== 'carrot') || d.t === 'nofill');
  return { make, text, check, needsPack, extraPh };
})();

/* recipe cards: compare order of layers */
const Recipes = {
  check(rec, sw) {
    const rows = [];
    rows.push({ label: 'Bread: ' + FOOD[rec.bread].n, ok: sw.bread === rec.bread });
    if (rec.sb) rows.push({ label: 'Bottom spread: ' + Lang.some(rec.sb), ok: sw.sb === rec.sb });
    if (rec.st) rows.push({ label: 'Top spread: ' + Lang.some(rec.st), ok: sw.st === rec.st });
    const got = (sw.layers || []).map((l) => (typeof l === 'string' ? l : l.id));
    rec.f.forEach((id, i) => rows.push({ label: `Layer ${i + 1}: ${Lang.qty(id, 1)}`, ok: got[i] === id }));
    if (got.length > rec.f.length) rows.push({ label: 'No extra layers', ok: false });
    const good = rows.filter((r) => r.ok).length;
    return { rows, good, total: rows.length, stars: good === rows.length ? 3 : good / rows.length >= .6 ? 2 : good ? 1 : 0 };
  },
  text(rec) {
    const parts = rec.f.map((id) => Lang.qty(id, 1));
    const sp = rec.sb ? (rec.st ? `${Lang.some(rec.sb)} on one slice and ${Lang.some(rec.st)} on the other` : Lang.some(rec.sb)) : '';
    return `${rec.name}: ${FOOD[rec.bread].type === 'c' ? Lang.qty(rec.bread, 1) : FOOD[rec.bread].n}${sp ? ', ' + sp : ''}${parts.length ? ', ' + Lang.list(parts) : ''}.`;
  }
};

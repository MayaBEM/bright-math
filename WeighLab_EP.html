    const def = { name: '', cls: '', xp: 0, streak: 0, best: 0, lv: {}, boss: null, market: null, reviews: 0, set: { th: ED.thDefault, unlock: false, sound: true, theme: 'auto', pin: '1234' } };
    const saved = Store.load(); this.st = Object.assign(def, saved || {}); this.st.set = Object.assign(def.set, (saved || {}).set || {});
    this.thOn = this.st.set.th; Sound.on = this.st.set.sound; this.applyTheme();
    Drag.init(); this.bar(); this.route('home');
    let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => Object.values(SCALES).forEach(s => s.host.isConnected && s.update(true)), 120); });
  },
  save() { Store.save(this.st); },
  L(n) { return this.st.lv[n] || (this.st.lv[n] = { learn: false, explore: false, prac: null, check: null, badge: 0, tries: 0 }); },
  unlocked(n) {
    if (ED.trial && n > 2) return false;
    if (this.st.set.unlock || n === 1) return true;
    const p = this.st.lv[n - 1]; return !!(p && p.check && p.check.passed);
  },
  passedCount() { let c = 0; for (let i = 1; i <= 10; i++) if (this.st.lv[i] && this.st.lv[i].check && this.st.lv[i].check.passed) c++; return c; },
  applyTheme() { const t = this.st.set.theme; document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; },
  toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('on'), 2200); },
  addXP(n) { this.st.xp += n; this.save(); this.bar(); },
  bar() {
    $('#xp').textContent = group(this.st.xp) + ' XP'; $('#streak').innerHTML = `${IC.bolt}<span>${this.st.streak}</span>`;
    $('#streak').title = 'Streak (best ' + this.st.best + ')';
    const th = $('#btn-th'); th.hidden = !this.st.set.th; th.setAttribute('aria-pressed', this.thOn);
    $('#btn-sound').classList.toggle('off', !Sound.on); $('#btn-sound').setAttribute('aria-pressed', Sound.on);
    document.body.classList.toggle('th-on', this.thOn && this.st.set.th);
  },
  route(view, arg) {
    Speech.stop(); clearInterval(this.timer); this.view = view; const m = $('#main'); m.innerHTML = ''; window.scrollTo(0, 0);
    document.body.classList.toggle('classmode', view === 'class');
    ({ home: () => this.home(m), stall: () => this.stall(m, arg.n, arg.step), review: () => this.review(m), boss: () => this.bossIntro(m), report: () => this.report(m), cheat: () => this.cheat(m), market: () => this.market(m), class: () => this.classMode(m) })[view]();
    m.focus({ preventScroll: true });
  },

  /* ---------------- HOME ---------------- */
  home(m) {
    const S = this.st, pc = this.passedCount();
    const tiles = Object.keys(LESSONS).map(k => {
      const n = +k, L = LESSONS[n], lv = S.lv[n] || {}, un = this.unlocked(n);
      const dots = STEPS.map(([s]) => `<i class="${(s === 'learn' && lv.learn) || (s === 'explore' && lv.explore) || (s === 'practice' && lv.prac) || (s === 'check' && lv.check && lv.check.passed) ? 'on' : ''}"></i>`).join('');
      return `<button class="stall-tile ${un ? '' : 'locked'}" data-n="${n}" ${un ? '' : 'aria-disabled="true"'} type="button">
        <span class="awning" aria-hidden="true" style="--aw:${STALL_COL[n]}"></span><span class="tnum">${n}</span>
        <span class="tname">${L.stall}</span><span class="ttitle">${L.title}</span>
        <span class="counter" aria-hidden="true">${artIcons(STALL_ART[n], 46)}</span>
        <span class="tfoot"><span class="dots" aria-label="steps done">${dots}</span>${lv.badge ? stamp(lv.badge, n) : ''}</span>${un ? '' : `<span class="shutter"><span class="lk">${IC.lock}${ED.trial && n > 2 ? 'Full version' : 'Opens after Stall ' + (n - 1)}</span></span>`}</button>`;
    }).join('');
    const reviewOpen = !ED.trial && (pc >= 3 || S.set.unlock), bossOpen = !ED.trial && (pc >= 10 || S.set.unlock), mktOpen = !ED.trial || true;
    m.innerHTML = `
      <section class="hero"><div class="hero-in">
        <p class="kicker">Mass &amp; Weighing · mg · g · kg · t</p>
        <h1>Weigh Station <span>Market</span></h1>
        <p class="lede">Work through the stalls in order. Each stall: <b>Learn</b> → <b>Explore</b> → <b>Practice</b> → <b>Check</b>. Pass a Check with 80% to open the next stall.</p>
        <form class="who" id="who"><label>Name <input id="nm" value="${esc(S.name)}" maxlength="30" autocomplete="off" placeholder="Your name"></label><label>Class <input id="cl" value="${esc(S.cls)}" maxlength="12" autocomplete="off" placeholder="e.g. P.5/2"></label></form>
      </div><div class="hero-scene" aria-hidden="true">${heroScene()}</div></section>
      <div class="roadwrap">${roadHTML(pc, 10, true)}<span class="roadtxt">${pc === 10 ? 'Every stall done — try the Boss Round!' : pc ? `Your truck has passed ${pc} stall${pc > 1 ? 's' : ''}. Keep driving!` : 'Start at Stall 1. Your delivery truck moves as you pass each stall.'}</span></div>
      ${ED.trial ? '<p class="trial-note">Free trial: Stalls 1–2 are open. The full Weigh Lab has 10 stalls, the Boss Round, Review Stall and Market Challenge.</p>' : ''}
      <h2 class="sec">Market stalls <small>${pc}/10 passed</small></h2>
      <div class="stalls">${tiles}</div>
      <h2 class="sec">More to do</h2>
      <div class="extras">
        ${extra('review', 'Review Stall', 'Mixed practice from stalls you passed. Keeps old skills fresh.', reviewOpen, 'Pass 3 stalls')}
        ${extra('market', 'Market Challenge', 'Fill the basket to an exact target mass.', mktOpen && !ED.trial, 'Full version')}
        ${extra('boss', 'Boss Round', '25 tasks · timed · no hints. The final test.', bossOpen, ED.trial ? 'Full version' : 'Pass all 10 stalls')}
        ${extra('report', 'My Report', 'Your scores, badges and what to review. Print it.', true)}
        ${extra('cheat', 'Cheat Sheet', 'Units, staircase, benchmarks. Printable.', true)}
        ${extra('class', 'Class Mode', 'Big-screen scales for teacher demos.', true)}
      </div>`;
    $$('.stall-tile', m).forEach(b => b.onclick = () => { const n = +b.dataset.n; if (!this.unlocked(n)) { this.toast(ED.trial && n > 2 ? 'This stall is in the full version.' : 'Pass the Check in Stall ' + (n - 1) + ' first.'); return; } Sound.click(); this.route('stall', { n }); });
    $$('.extra', m).forEach(b => b.onclick = () => { if (b.classList.contains('locked')) { this.toast(b.dataset.why); return; } Sound.click(); this.route(b.dataset.v); });
    $('#nm').oninput = e => { S.name = e.target.value; this.save(); }; $('#cl').oninput = e => { S.cls = e.target.value; this.save(); };
    $('#who').onsubmit = e => e.preventDefault();
    function extra(v, t, d, open, why) { return `<button type="button" class="extra ${open ? '' : 'locked'}" data-v="${v}" data-why="${why || ''}"><b>${t}</b><span>${open ? d : (IC.lock + ' ' + why)}</span></button>`; }
  },

  /* ---------------- STALL ---------------- */
  stall(m, n, step) {
    const L = LESSONS[n], lv = this.L(n); step = step || (!lv.learn ? 'learn' : !lv.explore ? 'explore' : !lv.prac ? 'practice' : 'check');
    this.cur = { n, step };
    m.innerHTML = `<div class="stall-head"><button class="back" type="button">${IC.home}<span>Market</span></button>
      <div class="sbanner" style="--sc:${STALL_COL[n]}"><span class="sb-art" aria-hidden="true">${artIcons(STALL_ART[n], 52)}</span><div><p class="kicker">Stall ${n} · ${L.stall}</p><h1>${L.title}</h1></div></div>
      <nav class="steps" aria-label="Stall steps">${STEPS.map(([s, t], i) => `<button type="button" data-s="${s}" class="${s === step ? 'cur' : ''} ${isDone(lv, s) ? 'done' : ''}" ${s === step ? 'aria-current="step"' : ''}><span>${'ABCD'[i]}</span>${t}</button>`).join('')}</nav></div>
      <div id="stage"></div>`;
    $('.back', m).onclick = () => this.route('home');
    $$('.steps button', m).forEach(b => b.onclick = () => { Sound.click(); this.route('stall', { n, step: b.dataset.s }); });
    const st = $('#stage', m);
    ({ learn: () => this.learn(st, n), explore: () => this.explore(st, n), practice: () => this.practice(st, n), check: () => this.check(st, n) })[step]();
    function isDone(lv, s) { return (s === 'learn' && lv.learn) || (s === 'explore' && lv.explore) || (s === 'practice' && lv.prac) || (s === 'check' && lv.check && lv.check.passed); }
  },

  /* ---- A) LEARN ---- */
  learn(st, n) {
    const L = LESSONS[n], cards = [...L.cards, { mistake: true }]; let i = 0;
    const show = () => {
      const c = cards[i];
      if (c.mistake) {
        st.innerHTML = `<article class="lcard mistake"><div class="mk-tag">Common mistake</div><h2>Watch out!</h2><p class="big">${L.mistake.en}</p>${thBox(L.mistake.th)}
          <div class="lc-actions">${speakBtn()}</div></article>${nav()}`;
      } else {
        st.innerHTML = `<article class="lcard"><div class="lc-text"><p class="kicker">Card ${i + 1} of ${L.cards.length}</p><h2>${c.t}</h2><p class="big">${c.en}</p>${thBox(c.th)}<div class="lc-actions">${speakBtn()}${c.demo ? '<button class="btn sm ghost play" type="button">Play again</button>' : ''}</div></div><div class="lc-vis" id="lvis"></div></article>${nav()}`;
        const v = $('#lvis', st);
        if (c.demo) runDemo(v, c.demo, $('.play', st));
        else if (c.bench) v.innerHTML = benchStrip();
        else if (c.dial) { const h = document.createElement('div'); v.appendChild(h); new Scale(h, { type: 'dial', dial: c.dial, locked: true, zoom: false }); }
        else if (c.stair) v.innerHTML = stairSVG(c.stair[0], c.stair[1]);
        else if (c.puzzle) v.innerHTML = puzzleSVG(c.puzzle[0], c.puzzle[1]);
        else v.remove();
      }
      $('.speak', st).onclick = () => { const t = c.mistake ? L.mistake.en : c.t + '. ' + c.en; if (!Speech.say(t.replace(/<[^>]+>/g, ''))) this.toast('Read-aloud is not available on this device.'); };
      const pv = $('.prev', st), nx = $('.next', st);
      pv.onclick = () => { if (i > 0) { i--; show(); } };
      nx.onclick = () => { Sound.click(); if (i < cards.length - 1) { i++; show(); } else { this.L(n).learn = true; this.addXP(10); this.route('stall', { n, step: 'explore' }); } };
    };
    const nav = () => `<div class="lnav"><button class="btn ghost prev" type="button" ${i ? '' : 'disabled'}>Back</button><div class="pips">${cards.map((_, j) => `<i class="${j === i ? 'on' : j < i ? 'done' : ''}"></i>`).join('')}</div><button class="btn next" type="button">${i < cards.length - 1 ? 'Next' : 'Go to Explore'}</button></div>`;
    show();
  },

  /* ---- B) EXPLORE ---- */
  explore(st, n) {
    const cfg = EXPLORE[n];
    st.innerHTML = `<div class="explore"><div class="ex-top"><div class="tabs" role="tablist">${cfg.scales.map((s, i) => `<button role="tab" type="button" data-i="${i}" class="${i ? '' : 'cur'}">${s.style === 'round' ? 'Round dial' : SCALE_NAMES[s.type]}</button>`).join('')}</div>
      <ul class="tries">${cfg.tries.map(t => `<li>${t}</li>`).join('')}</ul></div><div id="playground"></div>
      <div class="lnav"><span></span><span class="muted">Drag items on and off. Tap an item to add or remove it.</span><button class="btn next" type="button">Go to Practice</button></div></div>`;
    const pg = $('#playground', st); let cur = 0;
    const mount = i => { cur = i; $$('.tabs button', st).forEach(b => b.classList.toggle('cur', +b.dataset.i === i)); playground(pg, cfg.scales[i], n === 3 && cfg.scales[i].type === 'dial'); };
    $$('.tabs button', st).forEach(b => b.onclick = () => mount(+b.dataset.i)); mount(0);
    $('.next', st).onclick = () => { this.L(n).explore = true; this.addXP(10); this.route('stall', { n, step: 'practice' }); };
  },

  /* ---- C) PRACTICE ---- */
  practice(st, n) {
    const tasks = practiceSet(n, 12);
    new Runner(st, tasks, { mode: 'practice', title: `Practice · Stall ${n}`, done: r => {
      const lv = this.L(n); lv.prac = { right: r.right, total: r.total, date: Date.now() }; this.save();
      slip(st, r, { title: `Practice receipt · Stall ${n}`, next: ['Take the Check', () => this.route('stall', { n, step: 'check' })], again: ['Practice again', () => this.route('stall', { n, step: 'practice' })] });
    } });
  },

  /* ---- D) CHECK ---- */
  check(st, n, retry) {
    const lv = this.L(n);
    if (lv.retake && !retry) { // targeted re-practice first
      st.innerHTML = `<div class="panel"><h2>Before you retake</h2><p>Last time some tasks were tricky. Do 4 practice tasks on those skills first — new items, hints on.</p><div class="lc-actions"><button class="btn" id="rp" type="button">Start re-practice</button></div></div>`;
      $('#rp').onclick = () => new Runner(st, targetedSet(n, lv.retake), { mode: 'practice', title: 'Re-practice', done: r => { lv.retake = null; this.save(); slip(st, r, { title: 'Re-practice receipt', next: ['Retake the Check', () => this.check(st, n, true)] }); } });
      return;
    }
    st.innerHTML = `<div class="panel"><h2>Check · 6 tasks</h2><p>No hints this time. Get <b>5 or 6 right</b> (80%) to pass and open the next stall.</p><div class="lc-actions"><button class="btn" id="go" type="button">Start the Check</button></div></div>`;
    $('#go').onclick = () => new Runner(st, checkSet(n), { mode: 'check', title: `Check · Stall ${n}`, done: r => {
      lv.tries = (lv.tries || 0) + 1; const pass = r.right / r.total >= .8;
      const prevBest = lv.check ? lv.check.best : 0;
      lv.check = { best: Math.max(prevBest, r.right), total: r.total, passed: (lv.check && lv.check.passed) || pass, last: r.right, date: Date.now() };
      if (pass) {
        const tier = r.right === r.total ? (lv.tries === 1 ? 3 : 2) : 1; lv.badge = Math.max(lv.badge || 0, tier);
        this.addXP(50); Confetti.go(); Sound.win();
      } else { lv.retake = [...new Set(r.missed.map(t => t.gen))]; }
      this.save();
      slip(st, r, { title: `Check receipt · Stall ${n}`, pass, badge: pass ? lv.badge : 0, n,
        next: pass ? (n < 10 ? [this.unlocked(n + 1) ? `Go to Stall ${n + 1}` : 'Back to the market', () => this.unlocked(n + 1) ? this.route('stall', { n: n + 1 }) : this.route('home')] : ['Back to the market', () => this.route('home')]) : ['Re-practice and retake', () => this.route('stall', { n, step: 'check' })],
        again: pass ? ['Back to the market', () => this.route('home')] : null });
    } });
  },

  /* ---------------- REVIEW ---------------- */
  review(m) {
    const passed = Object.keys(this.st.lv).map(Number).filter(k => this.st.lv[k].check && this.st.lv[k].check.passed);
    const levels = passed.length ? passed : [1, 2, 3];

    m.innerHTML = `<div class="stall-head"><button class="back" type="button">${IC.home}<span>Market</span></button><div><p class="kicker">Spaced review</p><h1>Review Stall</h1></div></div><div id="stage"></div>`;
    $('.back', m).onclick = () => this.route('home');
    new Runner($('#stage', m), reviewSet(levels, weak), { mode: 'practice', title: 'Review', done: r => { this.st.reviews++; this.addXP(20); slip($('#stage'), r, { title: 'Review receipt', next: ['Another review', () => this.route('review')], again: ['Back to the market', () => this.route('home')] }); } });
  },

  /* ---------------- BOSS ---------------- */
  bossIntro(m) {
    m.innerHTML = `<div class="stall-head"><button class="back" type="button">${IC.home}<span>Market</span></button><div><p class="kicker">Final test</p><h1>Boss Round</h1></div></div>
      <div id="stage"><div class="panel boss"><h2>25 tasks · 30 minutes · no hints</h2><p>Every stall is in here, with new items you have not seen. Work carefully — the timer is shown at the top. When time runs out, the test ends.</p>

      const st = $('#stage'); const end = Date.now() + 30 * 60e3;

        clearInterval(this.timer); const by = {}; res.log.forEach(x => { by[x.lv] = by[x.lv] || [0, 0]; by[x.lv][1]++; if (x.ok) by[x.lv][0]++; });
        this.st.boss = { right: res.right, total: 25, by, date: Date.now(), secs: Math.round((Date.now() - (end - 30 * 60e3)) / 1000) }; this.addXP(res.right * 4); if (res.right >= 20) { Confetti.go(); Sound.win(); }
        slip(st, res, { title: 'Boss Round receipt', next: ['See My Report', () => this.route('report')], again: ['Back to the market', () => this.route('home')] });
      } });

    };
  },

  /* ---------------- REPORT ---------------- */
  report(m) {
    const S = this.st, rows = Object.keys(LESSONS).map(k => { const n = +k, lv = S.lv[n] || {}, c = lv.check; return { n, t: LESSONS[n].title, best: c ? c.best : null, passed: c && c.passed, badge: lv.badge || 0, boss: S.boss && S.boss.by[n] }; });
    const toReview = rows.filter(r => (r.best !== null && r.best < 6) || (r.boss && r.boss[0] < r.boss[1])).map(r => r.t), notStarted = rows.filter(r => r.best === null).length;
    const d = new Date();
    m.innerHTML = `<div class="stall-head noprint"><button class="back" type="button">${IC.home}<span>Market</span></button><div><p class="kicker">Progress</p><h1>My Report</h1></div><button class="btn sm" id="pr" type="button">Print</button></div>
      <section class="report receipt"><header><div><b class="brand">WEIGH LAB</b><span>Weigh Station Market · Report</span></div><div class="rmeta"><span>Name: <b>${esc(S.name || '________')}</b></span><span>Class: <b>${esc(S.cls || '____')}</b></span><span>Date: <b>${d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</b></span></div></header>
      <table><thead><tr><th>Stall</th><th>Skill</th><th>Check</th><th>Boss</th><th>Stamp</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.n}</td><td>${r.t}</td><td>${r.best === null ? '–' : r.best + '/6' + (r.passed ? ' ✓' : '')}</td><td>${r.boss ? r.boss[0] + '/' + r.boss[1] : '–'}</td><td>${r.badge ? TIER[r.badge] : '–'}</td></tr>`).join('')}</tbody></table>
      <div class="rsum"><div><span>Boss Round</span><b>${S.boss ? S.boss.right + ' / 25 (' + Math.round(S.boss.right * 4) + '%)' : 'not taken'}</b></div><div><span>XP</span><b>${group(S.xp)}</b></div><div><span>Best streak</span><b>${S.best}</b></div></div>
      <div class="rrev"><span>What to review:</span> ${toReview.length ? toReview.join(' · ') : (notStarted === 10 ? 'Start with Stall 1.' : 'Nothing — great work!')}${notStarted && notStarted < 10 ? ` <span class="muted">(${notStarted} stall${notStarted > 1 ? 's' : ''} not checked yet)</span>` : ''}</div>
      <footer>Bright EngMath · Weigh Lab · For single classroom use only</footer></section>`;
    $('.back', m).onclick = () => this.route('home'); $('#pr').onclick = () => window.print();
  },

  /* ---------------- CHEAT SHEET ---------------- */
  cheat(m) {
    m.innerHTML = `<div class="stall-head noprint"><button class="back" type="button">${IC.home}<span>Market</span></button><div><p class="kicker">Keep this handy</p><h1>Cheat Sheet</h1></div><button class="btn sm" id="pr" type="button">Print</button></div>
      <section class="cheat"><h2 class="brand">WEIGH LAB · Cheat Sheet</h2>
      <div class="cs-grid"><div class="cs"><h3>Units of mass</h3><table><tr><td>1 t</td><td>= 1,000 kg</td></tr><tr><td>1 kg</td><td>= 1,000 g</td></tr><tr><td>1 g</td><td>= 1,000 mg</td></tr></table><h3>Benchmarks</h3><table><tr><td>grain of rice</td><td>≈ 25 mg</td></tr><tr><td>paper clip</td><td>≈ 1 g</td></tr><tr><td>1 L of water</td><td>≈ 1 kg</td></tr><tr><td>small car</td><td>≈ 1 t</td></tr></table></div>

      <div class="cs"><h3>Reading a dial</h3><ol><li>Pick two numbers next to each other.</li><li>Difference ÷ number of <b>spaces</b> = one small mark.</li><li>Start at the number before the needle and count on.</li></ol><h3>Mixed units</h3><p>2 kg 350 g = 2,350 g = 2.35 kg<br>2 kg 35 g = 2,035 g = 2.035 kg</p></div>
      <div class="cs"><h3>Digital &amp; balance</h3><p><b>TARE</b>: bowl on → TARE → add food.<br>Balance: object left, weights right, until level.</p><h3>Solve it</h3><p>Same units first · Read → Plan → Solve → Check.<br>Balance puzzle: do the same to both sides.</p></div></div>
      <footer>Bright EngMath · Weigh Lab · For single classroom use only</footer></section>`;
    $('.back', m).onclick = () => this.route('home'); $('#pr').onclick = () => window.print();
  },

  /* ---------------- MARKET CHALLENGE ---------------- */
  market(m) {
    let round = 0, t0 = Date.now(), skips = 0; const ROUNDS = 5;
    m.innerHTML = `<div class="stall-head"><button class="back" type="button">${IC.home}<span>Market</span></button><div><p class="kicker">Extra mode</p><h1>Market Challenge</h1></div><div class="mk-stat"><span id="mkr">Round 1/5</span><span id="mkt">0:00</span></div></div><div id="stage"></div>`;
    $('.back', m).onclick = () => this.route('home');
    const st = $('#stage', m);
    this.timer = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000), e = $('#mkt'); if (e) e.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 500);

    $('.hintbox', this.host).innerHTML = t.hints.slice(0, this.hint).map((h, j) => `<div class="hint"><b>Hint ${j + 1}</b> ${h}${App.thOn && App.st.set.th && t.hintsTH[j] ? `<span class="th" lang="th"><span>TH</span>${t.hintsTH[j]}</span>` : ''}</div>`).join('');
    if (this.hint >= 3) $('#hint', this.host).disabled = true;
  }
  read() {
    const a = this.t.ans, box = $('.tans', this.host);
    if (a.kind === 'mcq') return this.sel == null ? { empty: true } : { ok: this.sel === a.correct, val: a.options[this.sel] };
    if (a.kind === 'num') { const raw = $('#ai', box).value; if (!raw.trim()) return { empty: true }; const u = a.units.length > 1 ? $('#au', box).value : a.units[0]; const mg = parseIn(raw, u); if (isNaN(mg)) return { bad: true }; return { ok: mg === a.mg, mg, u }; }
    if (a.kind === 'mixed') { const b = $('#ab', box).value, s = $('#as', box).value; if (!b.trim() && !s.trim()) return { empty: true }; const B = b.trim() ? parseIn(b, a.big) : 0, S = s.trim() ? parseIn(s, a.small) : 0; if (isNaN(B) || isNaN(S) || B % U[a.big]) return { bad: true }; return { ok: B + S === a.mg && S < U[a.big], mg: B + S, overflow: S >= U[a.big] }; }
    if (a.kind === 'plain') { const raw = $('#ai', box).value.trim().replace(/,/g, ''); if (!raw) return { empty: true }; if (!/^\d+$/.test(raw)) return { bad: true }; return { ok: +raw === a.n, n: +raw }; }
    if (a.kind === 'order') { if (this.order.length < a.labels.length) return { empty: true, msg: 'Tap every mass to put them in order.' }; return { ok: this.order.every((j, k) => j === a.order[k]) }; }
    if (a.kind === 'scale') { const g = a.goal(this.scales); return g === true ? { ok: true } : { ok: false, msg: g }; }
  }
  diagnose(r) {
    const a = this.t.ans;
    if (r.msg) return r.msg;
    if (r.overflow) return 'The grams must be less than 1,000 — regroup 1,000 g as 1 kg.';
    if (r.mg != null) {
      const c = a.mg, u = r.mg;
      if (u === c * 1000 || u * 1000 === c) return 'Check your units — it looks like you multiplied instead of dividing by 1,000 (or the other way).';
      if (u === c * 10 || u * 10 === c || u === c * 100 || u * 100 === c) return 'Check the zeros and the decimal point.';
      if (this.t.dial && Math.abs(u - c) % this.t.dial.i === 0) return 'Almost — check the small marks! Each small mark is ' + fm(this.t.dial.i, 'g') + '.';
      if (this.t.gen === 'mixToKg' || this.t.gen === 'digitalMix' || this.t.gen === 'gToMix') return 'Remember: the grams fill 3 places after the point. 35 g = 0.035 kg.';

  checkIt() {

    if (r.empty) { fb.className = 'fb nudge'; fb.textContent = r.msg || 'Answer first, then press Check.'; return; }

      fb.className = 'fb good'; fb.innerHTML = `${IC.check}<b>${pick(PRAISE)}</b> <span>+${xp} XP</span>`; Sound.good();

      if (!second) this.finishTask(false); else if (this.hintsOn && this.hint === 0) this.showHint();

  }
  finishTask(ok) {
    this.answered = true; const t = this.t; this.log.push({ lv: t.lv, gen: t.gen, ok }); if (ok) this.right++;
    $$('.mcq button', this.host).forEach((b, j) => { if (j === t.ans.correct) b.classList.add('right'); else if (b.getAttribute('aria-checked') === 'true') b.classList.add('wrong'); b.disabled = true; });
    this.scales.forEach(s => s.spec.locked = true);

  }
  next() { Sound.click(); if (this.i < this.tasks.length - 1) { this.i++; this.show(); } else this.finish(); }
  finish() {
    if (this.done) return; this.done = true;
    const missed = this.tasks.filter((t, j) => !(this.log[j] && this.log[j].ok));

}
function slip(host, r, o) {
  const rows = r.tasks.map((t, j) => { const ok = r.log[j] && r.log[j].ok; return `<div class="sl-row ${ok ? 'ok' : 'no'}"><span>${j + 1}. ${t.prompt.replace(/<[^>]+>/g, '').slice(0, 54)}${t.prompt.replace(/<[^>]+>/g, '').length > 54 ? '…' : ''}</span><b>${ok ? IC.check : IC.cross}</b></div>`; }).join('');
  host.innerHTML = `<div class="receipt slip"><header><b class="brand">WEIGH STATION MARKET</b><span>${o.title}</span><span>${new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })}</span></header>
    <div class="sl-list">${rows}</div><div class="sl-total"><span>TOTAL</span><b>${r.right} / ${r.total}</b></div>
    ${o.pass === true ? `<div class="sl-pass">${stamp(o.badge, o.n)}<div><b>Passed!</b><span>${TIER[o.badge]} Weigh Master stamp${o.badge === 3 ? ' — perfect on the first try!' : o.badge === 2 ? ' — a perfect score!' : '.'}</span></div></div>` : o.pass === false ? `<div class="sl-fail"><b>Not yet — you need 5 of 6.</b><span>You will do 4 quick practice tasks on the tricky skills, then retake the Check with new items.</span></div>` : ''}
    <div class="lc-actions">${o.again ? `<button class="btn ghost" id="sa" type="button">${o.again[0]}</button>` : ''}<button class="btn" id="sn" type="button">${o.next[0]}</button></div></div>`;
  $('#sn', host).onclick = o.next[1]; if (o.again) $('#sa', host).onclick = o.again[1];
  $('#sn', host).focus();
}

function flyXP(n, from) {
  if (RM() || !from) return; const r = from.getBoundingClientRect(), t = $('#xp').getBoundingClientRect(), el = document.createElement('div');
  el.className = 'xpfly'; el.textContent = '+' + n; el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = r.top + 'px'; document.body.appendChild(el);
  el.animate([{ transform: 'translate(-50%,0) scale(1)', opacity: 1 }, { transform: `translate(${t.left - r.left - r.width / 2}px,${t.top - r.top}px) scale(.6)`, opacity: .2 }], { duration: 900, easing: 'cubic-bezier(.5,0,.6,1)' }).onfinish = () => { el.remove(); const x = $('#xp'); x.classList.remove('bump'); void x.offsetWidth; x.classList.add('bump'); };
}
/* ---------------- confetti (geometric) ---------------- */
const Confetti = {
  burst(from) {
    if (RM() || !from) return; const r = from.getBoundingClientRect(), cols = ['#15803D', '#EF4444', '#FACC15', '#2563EB'];
    for (let i = 0; i < 14; i++) { const d = document.createElement('i'); d.className = 'spark'; d.style.background = cols[i % 4]; d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top + 8) + 'px'; document.body.appendChild(d);
      const a = Math.PI * 2 * i / 14, dist = 50 + rnd() * 40; d.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist}px) scale(.3) rotate(200deg)`, opacity: 0 }], { duration: 650, easing: 'ease-out' }).onfinish = () => d.remove(); }
  },
  go() {
    if (RM()) return; const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; c.hidden = false;
    const cols = ['#15803D', '#EF4444', '#FACC15', '#92400E', '#FFFBEB'], P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (rnd() - .5) * 200, y: innerHeight * .35, vx: (rnd() - .5) * 14, vy: -rnd() * 14 - 4, s: 6 + rnd() * 8, r: rnd() * 6, vr: (rnd() - .5) * .3, c: pick(cols), sh: ri(0, 2) }));
    const t0 = performance.now();
    const f = now => { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.strokeStyle = '#1F2937'; x.lineWidth = 1.5; x.beginPath(); if (p.sh === 0) x.rect(-p.s / 2, -p.s / 2, p.s, p.s * .6); else if (p.sh === 1) x.arc(0, 0, p.s / 2.4, 0, 6.3); else { x.moveTo(0, -p.s / 2); x.lineTo(p.s / 2, p.s / 2); x.lineTo(-p.s / 2, p.s / 2); x.closePath(); } x.fill(); x.stroke(); x.restore(); }); if (now - t0 < 2200) requestAnimationFrame(f); else { c.hidden = true; } };
    requestAnimationFrame(f);
  }
};

/* ---------------- boot ---------------- */

});

document.getElementById('btn-sound').innerHTML=IC.sound;document.getElementById('btn-theme').innerHTML=IC.moon;document.getElementById('btn-set').innerHTML=IC.gear;

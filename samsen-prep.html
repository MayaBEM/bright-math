ngle PAB + angle BAC + angle QAC = 180°. Subtract the two given angles from 180° to find angle BAC.`,th:`จุด P, A, Q อยู่บนเส้นตรงเดียวกัน ดังนั้นมุม PAB + มุม BAC + มุม QAC = 180° นำ 180° ลบด้วยมุมที่กำหนดให้ทั้งสองเพื่อหามุม BAC`}],visual:{kind:`geometryFigure`,width:280,height:200,segments:[{x1:50,y1:45,x2:230,y2:45,ticks:1},{x1:50,y1:180,x2:230,y2:180,ticks:1},{x1:140,y1:45,x2:50,y2:180,style:`solid`},{x1:140,y1:45,x2:230,y2:180,style:`solid`}],points:[{x:50,y:45,label:`P`,labelOffset:[-14,-4]},{x:230,y:45,label:`Q`,labelOffset:[14,-4]},{x:140,y:45,label:`A`,labelOffset:[0,-12]},{x:50,y:180,label:`B`,labelOffset:[-14,12]},{x:230,y:180,label:`C`,labelOffset:[14,12]}],angleMarks:[{x:140,y:45,fromDeg:180,toDeg:236,radius:20,label:`52°`,color:`var(--coral)`},{x:140,y:45,fromDeg:304,toDeg:360,radius:20,label:`61°`,color:`var(--teal)`}],alt:{en:`Triangle ABC with line PQ through vertex A parallel to base BC, marking angle PAB as 52 degrees and angle QAC as 61 degrees.`,th:`สามเหลี่ยม ABC มีเส้น PQ ลากผ่านจุดยอด A ขนานกับฐาน BC มุม PAB = 52 องศา และมุม QAC = 61 องศา`}},estimatedSeconds:90},{id:`B-10`,testId:`samsen-mock-b`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Cylinder Volume`,th:`ปริมาตรทรงกระบอก`},difficulty:`Medium`,prompt:{en:`Tank A and Tank B are cylindrical water tanks at a market garden that hold the same volume of water. Tank A has a base radius of 9 cm and a height of 16 cm. Tank B has a height of 36 cm. Find the base radius of Tank B.`,th:`ถังเก็บน้ำ A และถังเก็บน้ำ B เป็นถังทรงกระบอกที่สวนตลาด มีปริมาตรน้ำเท่ากัน ถัง A มีรัศมีฐาน 9 เซนติเมตร และสูง 16 เซนติเมตร ถัง B สูง 36 เซนติเมตร จงหารัศมีฐานของถัง B`},options:[{id:`A`,label:{en:`12 cm`,th:`12 เซนติเมตร`}},{id:`B`,label:{en:`6 cm`,th:`6 เซนติเมตร`}},{id:`C`,label:{en:`4 cm`,th:`4 เซนติเมตร`}},{id:`D`,label:{en:`36 cm`,th:`36 เซนติเมตร`}}],correctOptionId:`B`,explanation:{en:`Equal volumes mean π × 9² × 16 = π × r² × 36. So r² = (9² × 16) ÷ 36 = 1296 ÷ 36 = 36, and r = 6 cm.`,th:`ปริมาตรเท่ากันหมายความว่า π × 9² × 16 = π × r² × 36 ดังนั้น r² = (9² × 16) ÷ 36 = 1296 ÷ 36 = 36 และ r = 6 เซนติเมตร`},distractorNotes:{A:{en:`This correctly finds the radius as 6 cm but then doubles it, mistakenly giving the diameter instead of the radius.`,th:`ตัวเลือกนี้หารัศมีได้ถูกต้องเป็น 6 เซนติเมตร แต่กลับนำไปคูณสองอีกครั้ง ทำให้ได้เส้นผ่านศูนย์กลางแทนที่จะเป็นรัศมี`},C:{en:`This treats volume as proportional to radius directly (not radius squared), computing r = 9 × 16 ÷ 36 = 4 instead of properly squaring and square-rooting.`,th:`ตัวเลือกนี้คิดว่าปริมาตรแปรผันตรงกับรัศมีโดยตรง (ไม่ใช่รัศมียกกำลังสอง) จึงคำนวณ r = 9 × 16 ÷ 36 = 4 แทนที่จะยกกำลังสองและถอดรากที่สองอย่างถูกต้อง`},D:{en:`This correctly finds r² = 36 but forgets to take the square root, giving 36 instead of 6.`,th:`ตัวเลือกนี้หา r² = 36 ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงตอบ 36 แทนที่จะเป็น 6`}},hints:[{en:`Since both tanks are cylinders with the same volume, set their volume formulas equal to each other.`,th:`เนื่องจากถังทั้งสองมีปริมาตรเท่ากัน ให้ตั้งสมการปริมาตรของทั้งสองถังให้เท่ากัน`},{en:`Volume of a cylinder is π × radius² × height. Write π × 9² × 16 = π × r² × 36 and cancel π from both sides.`,th:`ปริมาตรทรงกระบอกคือ π × รัศมี² × สูง เขียนสมการ π × 9² × 16 = π × r² × 36 แล้วตัด π ออกจากทั้งสองข้าง`},{en:`Solve for r² first, then remember to take the square root to get r.`,th:`แก้หาค่า r² ก่อน แล้วอย่าลืมถอดรากที่สองเพื่อหาค่า r`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:18,height:16,label:`Tank A`},{baseSide:12,height:36,label:`Tank B`}],alt:{en:`Two cylindrical tanks of equal volume. Tank A is short and wide (radius 9 cm, height 16 cm); Tank B is tall and narrower, with a height of 36 cm and an unknown radius.`,th:`ถังทรงกระบอกสองใบที่มีปริมาตรเท่ากัน ถัง A เตี้ยและกว้าง (รัศมี 9 เซนติเมตร สูง 16 เซนติเมตร) ถัง B สูงและแคบกว่า สูง 36 เซนติเมตร แต่ยังไม่ทราบรัศมี`}},estimatedSeconds:85},{id:`B-11`,testId:`samsen-mock-b`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area`,th:`พื้นที่รูปประกอบ`},difficulty:`Hard`,prompt:{en:`The diagram shows a rectangular market plot 24 m long and 16 m wide. A triangular corner with legs 8 m and 6 m (dashed lines) is fenced off separately for a storage shed, leaving the shaded pentagon-shaped area for market stalls. Find the shaded area.`,th:`จากรูป แปลงตลาดรูปสี่เหลี่ยมผืนผ้ายาว 24 เมตร กว้าง 16 เมตร มีมุมรูปสามเหลี่ยมที่มีด้านประกอบมุมฉากยาว 8 เมตร และ 6 เมตร (เส้นประ) ถูกกั้นไว้แยกต่างหากเพื่อสร้างโรงเก็บของ เหลือพื้นที่รูปห้าเหลี่ยมสีเข้มไว้สำหรับตั้งแผงขายของ จงหาพื้นที่ส่วนที่แรเงา`},options:[{id:`A`,label:{en:`384 m²`,th:`384 ตารางเมตร`}},{id:`B`,label:{en:`408 m²`,th:`408 ตารางเมตร`}},{id:`C`,label:{en:`360 m²`,th:`360 ตารางเมตร`}},{id:`D`,label:{en:`336 m²`,th:`336 ตารางเมตร`}}],correctOptionId:`C`,explanation:{en:`Rectangle area = 24 × 16 = 384 m². The cut-off triangle has area (8 × 6) ÷ 2 = 24 m². Shaded area = 384 − 24 = 360 m².`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 24 × 16 = 384 ตารางเมตร พื้นที่สามเหลี่ยมที่ถูกตัดออก = (8 × 6) ÷ 2 = 24 ตารางเมตร พื้นที่ส่วนที่แรเงา = 384 − 24 = 360 ตารางเมตร`},distractorNotes:{A:{en:`This is just the full rectangle's area (24 × 16) — it forgets to remove the cut-off triangular corner at all.`,th:`ตัวเลือกนี้คือพื้นที่สี่เหลี่ยมผืนผ้าทั้งหมด (24 × 16) โดยลืมตัดพื้นที่สามเหลี่ยมมุมออกเลย`},B:{en:`This adds the triangle's area to the rectangle instead of subtracting it.`,th:`ตัวเลือกนี้นำพื้นที่สามเหลี่ยมไปบวกเพิ่มกับพื้นที่สี่เหลี่ยมผืนผ้า แทนที่จะลบออก`},D:{en:`This subtracts 8 × 6 = 48 for the cut corner instead of the triangle's actual area (8 × 6 ÷ 2 = 24), forgetting to halve it.`,th:`ตัวเลือกนี้ลบด้วย 8 × 6 = 48 แทนที่จะเป็นพื้นที่สามเหลี่ยมจริง (8 × 6 ÷ 2 = 24) โดยลืมหารสอง`}},hints:[{en:`Start by finding the area of the full rectangle before any corner is cut off.`,th:`เริ่มจากหาพื้นที่ของสี่เหลี่ยมผืนผ้าทั้งหมดก่อนที่จะตัดมุมออก`},{en:`The cut-off piece is a right triangle with legs 8 m and 6 m — find its area using (base × height) ÷ 2.`,th:`ส่วนที่ถูกตัดออกเป็นสามเหลี่ยมมุมฉาก ด้านประกอบมุมฉากยาว 8 เมตรและ 6 เมตร หาพื้นที่โดยใช้ (ฐาน × สูง) ÷ 2`},{en:`Subtract the triangle's area from the rectangle's area to get the shaded pentagon's area.`,th:`นำพื้นที่สามเหลี่ยมไปลบออกจากพื้นที่สี่เหลี่ยมผืนผ้า จะได้พื้นที่รูปห้าเหลี่ยมที่แรเงา`}],visual:{kind:`geometryFigure`,width:240,height:160,showGrid:!0,gridStep:40,polygons:[{points:[[0,0],[240,0],[240,100],[160,160],[0,160]],fill:`shaded`}],segments:[{x1:240,y1:160,x2:240,y2:100,style:`dashed`},{x1:240,y1:160,x2:160,y2:160,style:`dashed`}],labels:[{x:120,y:-6,text:`24 m`,bold:!0},{x:-10,y:80,text:`16 m`,bold:!0},{x:252,y:130,text:`6 m`},{x:200,y:172,text:`8 m`}],alt:{en:`A 24 by 16 metre rectangle with the bottom-right corner cut off along a diagonal, leaving a shaded pentagon. The cut removes legs of 8 m along the bottom and 6 m up the right side.`,th:`สี่เหลี่ยมผืนผ้าขนาด 24 คูณ 16 เมตร ตัดมุมล่างขวาออกตามแนวทแยง เหลือรูปห้าเหลี่ยมที่แรเงา ส่วนที่ตัดออกมีด้าน 8 เมตรตามแนวล่างและ 6 เมตรตามแนวขวา`}},estimatedSeconds:110},{id:`B-12`,testId:`samsen-mock-b`,number:12,skill:`Geometry & Angles`,topic:{en:`Bent Transversal Angles`,th:`มุมเส้นตัดหักมุม`},difficulty:`Hard`,prompt:{en:`In the diagram, PQ ∥ RS. The straight path from A bends at point M and continues to B. Angle QAM = (3x + 5)°, angle AMB = 125°, and angle SBM = (2x + 15)°. Find angle SBM.`,th:`จากรูป PQ ขนานกับ RS เส้นทางตรงจาก A หักมุมที่จุด M แล้วต่อไปยัง B มุม QAM = (3x + 5)° มุม AMB = 125° และมุม SBM = (2x + 15)° จงหามุม SBM`},options:[{id:`A`,label:{en:`68°`,th:`68°`}},{id:`B`,label:{en:`21°`,th:`21°`}},{id:`C`,label:{en:`65°`,th:`65°`}},{id:`D`,label:{en:`57°`,th:`57°`}}],correctOptionId:`D`,explanation:{en:`Drawing an auxiliary line through M parallel to PQ and RS splits angle AMB into two parts equal to angle QAM and angle SBM (alternate angles). So (3x + 5) + (2x + 15) = 125, giving 5x + 20 = 125, 5x = 105, x = 21. Then angle SBM = 2(21) + 15 = 57°.`,th:`เมื่อลากเส้นเสริมผ่าน M ขนานกับ PQ และ RS จะแบ่งมุม AMB ออกเป็นสองส่วนที่เท่ากับมุม QAM และมุม SBM (มุมแย้ง) ดังนั้น (3x + 5) + (2x + 15) = 125 จะได้ 5x + 20 = 125 นั่นคือ 5x = 105 และ x = 21 ดังนั้นมุม SBM = 2(21) + 15 = 57°`},distractorNotes:{A:{en:`This is angle QAM (68°), not angle SBM — the question asks for the angle at B, not at A.`,th:`ตัวเลือกนี้คือมุม QAM (68°) ไม่ใช่มุม SBM โจทย์ถามหามุมที่จุด B ไม่ใช่จุด A`},B:{en:`This is the value of x itself (21), not the angle SBM in degrees.`,th:`ตัวเลือกนี้คือค่าของ x (21) ไม่ใช่ขนาดของมุม SBM`},C:{en:`This comes from solving 5x = 125 instead of 5x = 105 (forgetting to subtract 20 first), giving x = 25 instead of x = 21.`,th:`ตัวเลือกนี้เกิดจากการแก้สมการ 5x = 125 แทนที่จะเป็น 5x = 105 (ลืมลบ 20 ก่อน) ทำให้ได้ x = 25 แทนที่จะเป็น 21`}},hints:[{en:`Imagine a line through M drawn parallel to both PQ and RS — this splits the bend angle into two parts.`,th:`ลองนึกภาพเส้นที่ลากผ่าน M ขนานกับทั้ง PQ และ RS เส้นนี้จะแบ่งมุมที่จุดหักออกเป็นสองส่วน`},{en:`By alternate angles, each part of angle AMB equals one of the two given angles, angle QAM and angle SBM.`,th:`ด้วยมุมแย้ง แต่ละส่วนของมุม AMB จะเท่ากับมุมที่กำหนดให้มุมใดมุมหนึ่ง คือมุม QAM หรือมุม SBM`},{en:`Set (3x + 5) + (2x + 15) equal to 125 and solve for x, then substitute x back into the expression for angle SBM.`,th:`ตั้งสมการ (3x + 5) + (2x + 15) = 125 แก้หาค่า x แล้วแทนค่ากลับในนิพจน์ของมุม SBM`}],visual:{kind:`geometryFigure`,width:260,height:200,segments:[{x1:20,y1:20,x2:240,y2:20,ticks:1},{x1:20,y1:180,x2:240,y2:180,ticks:1},{x1:70,y1:20,x2:150,y2:100,style:`solid`},{x1:150,y1:100,x2:110,y2:180,style:`solid`}],points:[{x:20,y:20,label:`P`,labelOffset:[-12,-4]},{x:240,y:20,label:`Q`,labelOffset:[10,-4]},{x:20,y:180,label:`R`,labelOffset:[-12,8]},{x:240,y:180,label:`S`,labelOffset:[10,8]},{x:70,y:20,label:`A`,labelOffset:[-4,-12]},{x:150,y:100,label:`M`,labelOffset:[12,0]},{x:110,y:180,label:`B`,labelOffset:[-4,14]}],angleMarks:[{x:70,y:20,fromDeg:315,toDeg:360,radius:16,label:`(3x+5)°`,color:`var(--coral)`},{x:150,y:100,fromDeg:135,toDeg:243,radius:22,label:`125°`,color:`var(--navy)`},{x:110,y:180,fromDeg:0,toDeg:63,radius:16,label:`(2x+15)°`,color:`var(--teal)`}],alt:{en:`Two parallel lines PQ and RS with a bent transversal from A to M to B, marking angle QAM as (3x+5) degrees, angle AMB as 125 degrees, and angle SBM as (2x+15) degrees.`,th:`เส้นขนานสองเส้น PQ และ RS มีเส้นตัดหักมุมจาก A ไปยัง M แล้วไปยัง B มุม QAM = (3x+5) องศา มุม AMB = 125 องศา และมุม SBM = (2x+15) องศา`}},estimatedSeconds:130},{id:`B-13`,testId:`samsen-mock-b`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Concentric Circles`,th:`วงกลมร่วมศูนย์กลาง`},difficulty:`Hard`,prompt:{en:`The diagram shows two concentric circles. The area of the shaded ring between them is 3 times the area of the inner circle. Find the ratio of the outer radius to the inner radius.`,th:`จากรูป วงกลมสองวงมีจุดศูนย์กลางร่วมกัน พื้นที่วงแหวนสีเข้มระหว่างวงกลมทั้งสองเป็น 3 เท่าของพื้นที่วงกลมวงใน จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน`},options:[{id:`A`,label:{en:`2 : 1`,th:`2 : 1`}},{id:`B`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`C`,label:{en:`4 : 1`,th:`4 : 1`}},{id:`D`,label:{en:`1 : 2`,th:`1 : 2`}}],correctOptionId:`A`,explanation:{en:`Let the inner radius be r and outer radius R. Ring area = πR² − πr² = 3 × πr², so R² − r² = 3r², giving R² = 4r², so R = 2r. The ratio R : r = 2 : 1.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R พื้นที่วงแหวน = πR² − πr² = 3 × πr² ดังนั้น R² − r² = 3r² จะได้ R² = 4r² นั่นคือ R = 2r อัตราส่วน R : r = 2 : 1`},distractorNotes:{B:{en:`This is the ratio of the ring's area to the inner circle's area (3 : 1, as given in the problem) mistaken for the ratio of their radii — but area ratios and radius ratios are not the same, since area depends on the square of the radius.`,th:`ตัวเลือกนี้คืออัตราส่วนพื้นที่วงแหวนต่อพื้นที่วงใน (3 : 1 ตามที่โจทย์กำหนด) ซึ่งถูกเข้าใจผิดว่าเป็นอัตราส่วนของรัศมี แต่อัตราส่วนพื้นที่กับอัตราส่วนรัศมีไม่เท่ากัน เพราะพื้นที่ขึ้นอยู่กับรัศมียกกำลังสอง`},C:{en:`This is the ratio of the outer circle's area to the inner circle's area (4 : 1, since outer area = inner + ring = r² + 3r² = 4r²) mistaken for the radius ratio.`,th:`ตัวเลือกนี้คืออัตราส่วนพื้นที่วงนอกต่อพื้นที่วงใน (4 : 1 เพราะพื้นที่วงนอก = วงใน + วงแหวน = r² + 3r² = 4r²) ซึ่งถูกเข้าใจผิดว่าเป็นอัตราส่วนของรัศมี`},D:{en:`This has the ratio flipped — it gives inner : outer instead of outer : inner.`,th:`ตัวเลือกนี้สลับอัตราส่วนกลับด้าน โดยให้วงในต่อวงนอกแทนที่จะเป็นวงนอกต่อวงใน`}},hints:[{en:`Let the inner radius be r and the outer radius be R, then write the ring area in terms of both.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R แล้วเขียนพื้นที่วงแหวนในรูปของทั้งสองตัว`},{en:`Ring area = πR² − πr². Set this equal to 3 times the inner circle's area (3πr²) and cancel π from both sides.`,th:`พื้นที่วงแหวน = πR² − πr² ให้เท่ากับ 3 เท่าของพื้นที่วงใน (3πr²) แล้วตัด π ออกจากทั้งสองข้าง`},{en:`Solve R² − r² = 3r² for R² in terms of r², then take the square root to find the ratio R : r.`,th:`แก้สมการ R² − r² = 3r² เพื่อหา R² ในรูปของ r² แล้วถอดรากที่สองเพื่อหาอัตราส่วน R : r`}],visual:{kind:`concentricCircles`,outerRadius:2,innerRadius:1,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles with the outer radius labeled R and the inner radius labeled r, with the ring between them shaded.`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกัน รัศมีวงนอกกำกับด้วย R และรัศมีวงในกำกับด้วย r โดยแรเงาบริเวณวงแหวนระหว่างสองวง`}},estimatedSeconds:100},{id:`B-14`,testId:`samsen-mock-b`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Leaf/Lens Area`,th:`พื้นที่รูปใบไม้`},difficulty:`Hard`,prompt:{en:`The diagram shows a square tile of side 14 cm used in a market fountain design. Two quarter-circle arcs, each with radius 14 cm, are drawn from opposite corners, creating the shaded leaf-shaped pattern. Find the area of the shaded leaf. (Use π ≈ \\frac{22}{7}.)`,th:`จากรูป กระเบื้องสี่เหลี่ยมจัตุรัสด้าน 14 เซนติเมตร ใช้ในลวดลายน้ำพุที่ตลาด มีส่วนโค้งหนึ่งในสี่ของวงกลมสองส่วน รัศมีส่วนละ 14 เซนติเมตร ลากจากมุมตรงข้ามกัน เกิดเป็นลวดลายรูปใบไม้ที่แรเงา จงหาพื้นที่รูปใบไม้ที่แรเงา (กำหนดให้ π ≈ \\frac{22}{7})`},options:[{id:`A`,label:{en:`42 cm²`,th:`42 ตารางเซนติเมตร`}},{id:`B`,label:{en:`112 cm²`,th:`112 ตารางเซนติเมตร`}},{id:`C`,label:{en:`308 cm²`,th:`308 ตารางเซนติเมตร`}},{id:`D`,label:{en:`196 cm²`,th:`196 ตารางเซนติเมตร`}}],correctOptionId:`B`,explanation:{en:`Each quarter circle has area (\\frac{1}{4}) × \\frac{22}{7} × 14² = 154 cm². Two quarter circles together cover 308 cm², but this double-counts the square exactly once, so the leaf area = 308 − 196 = 112 cm² (where 196 = 14² is the square's area).`,th:`พื้นที่หนึ่งในสี่วงกลมแต่ละส่วน = (\\frac{1}{4}) × \\frac{22}{7} × 14² = 154 ตารางเซนติเมตร เมื่อรวมสองส่วนได้ 308 ตารางเซนติเมตร แต่ค่านี้นับพื้นที่สี่เหลี่ยมจัตุรัสซ้ำไปหนึ่งครั้ง ดังนั้นพื้นที่ใบไม้ = 308 − 196 = 112 ตารางเซนติเมตร (โดย 196 = 14² คือพื้นที่สี่เหลี่ยมจัตุรัส)`},distractorNotes:{A:{en:`This subtracts only one quarter-circle's area from the square (196 − 154 = 42) instead of combining both quarter circles and removing the square's area once.`,th:`ตัวเลือกนี้ลบพื้นที่หนึ่งในสี่วงกลมเพียงส่วนเดียวออกจากสี่เหลี่ยมจัตุรัส (196 − 154 = 42) แทนที่จะรวมพื้นที่ทั้งสองส่วนโค้งแล้วลบพื้นที่สี่เหลี่ยมจัตุรัสออกเพียงครั้งเดียว`},C:{en:`This adds the two quarter-circle areas (154 + 154 = 308) without subtracting the square's area, double-counting the tile itself.`,th:`ตัวเลือกนี้บวกพื้นที่หนึ่งในสี่วงกลมทั้งสอง (154 + 154 = 308) โดยไม่ลบพื้นที่สี่เหลี่ยมจัตุรัสออก ทำให้นับพื้นที่กระเบื้องซ้ำ`},D:{en:`This is just the area of the square tile (14² = 196) — it ignores the arcs completely.`,th:`ตัวเลือกนี้คือพื้นที่กระเบื้องสี่เหลี่ยมจัตุรัสเฉยๆ (14² = 196) โดยไม่ได้คิดถึงส่วนโค้งเลย`}},hints:[{en:`Start by finding the area of one quarter circle with radius 14 cm.`,th:`เริ่มจากหาพื้นที่หนึ่งในสี่วงกลมที่มีรัศมี 14 เซนติเมตร`},{en:`The two quarter circles overlap exactly over the square tile — adding both counts the square twice.`,th:`หนึ่งในสี่วงกลมทั้งสองส่วนซ้อนทับกันพอดีบริเวณกระเบื้องสี่เหลี่ยมจัตุรัส การบวกทั้งสองส่วนจะนับพื้นที่สี่เหลี่ยมจัตุรัสซ้ำสองครั้ง`},{en:`Leaf area = (quarter circle + quarter circle) − square area = 308 − 196.`,th:`พื้นที่ใบไม้ = (หนึ่งในสี่วงกลม + หนึ่งในสี่วงกลม) − พื้นที่สี่เหลี่ยมจัตุรัส = 308 − 196`}],visual:{kind:`leafShape`,width:14,height:14,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A square tile with two quarter-circle arcs drawn from the top-left and bottom-right corners, forming a shaded leaf shape in the middle.`,th:`กระเบื้องสี่เหลี่ยมจัตุรัสที่มีส่วนโค้งหนึ่งในสี่วงกลมสองส่วนลากจากมุมบนซ้ายและมุมล่างขวา เกิดเป็นรูปใบไม้ที่แรเงาตรงกลาง`}},estimatedSeconds:105},{id:`B-15`,testId:`samsen-mock-b`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a Remainder`,th:`เศษส่วนของส่วนที่เหลือ`},difficulty:`Hard`,prompt:{en:`A drum contains 90 litres of coconut milk for a dessert stall. On Monday, \\frac{2}{5} of it is used. On Tuesday, \\frac{1}{3} of what remains is used. Find the difference between the amount used on Monday and the amount used on Tuesday.`,th:`ถังบรรจุกะทิ 90 ลิตร สำหรับแผงขายของหวาน วันจันทร์ใช้ไป \\frac{2}{5} ของทั้งหมด วันอังคารใช้ไปอีก \\frac{1}{3} ของที่เหลือ จงหาผลต่างระหว่างปริมาณที่ใช้ในวันจันทร์กับวันอังคาร`},options:[{id:`A`,label:{en:`6 litres`,th:`6 ลิตร`}},{id:`B`,label:{en:`54 litres`,th:`54 ลิตร`}},{id:`C`,label:{en:`18 litres`,th:`18 ลิตร`}},{id:`D`,label:{en:`36 litres`,th:`36 ลิตร`}}],correctOptionId:`C`,explanation:{en:`Monday: \\frac{2}{5} × 90 = 36 litres used, leaving 90 − 36 = 54 litres. Tuesday: \\frac{1}{3} × 54 = 18 litres used. Difference = 36 − 18 = 18 litres.`,th:`วันจันทร์: \\frac{2}{5} × 90 = 36 ลิตร เหลือ 90 − 36 = 54 ลิตร วันอังคาร: \\frac{1}{3} × 54 = 18 ลิตร ผลต่าง = 36 − 18 = 18 ลิตร`},distractorNotes:{A:{en:`This applies \\frac{1}{3} to the original 90 litres instead of the 54 litres that remained after Monday, giving a wrong Tuesday amount of 30 litres and a wrong difference of 6 litres.`,th:`ตัวเลือกนี้ใช้ \\frac{1}{3} กับ 90 ลิตรเดิม แทนที่จะใช้กับ 54 ลิตรที่เหลือหลังวันจันทร์ ทำให้ได้ปริมาณวันอังคารผิดเป็น 30 ลิตร และผลต่างผิดเป็น 6 ลิตร`},B:{en:`This adds the two daily amounts (36 + 18 = 54) instead of finding the difference between them.`,th:`ตัวเลือกนี้บวกปริมาณของสองวันเข้าด้วยกัน (36 + 18 = 54) แทนที่จะหาผลต่างระหว่างสองวัน`},D:{en:`This is just the amount used on Monday — it forgets to also find Tuesday's amount and take the difference.`,th:`ตัวเลือกนี้คือปริมาณที่ใช้ในวันจันทร์เฉยๆ โดยลืมหาปริมาณวันอังคารและหาผลต่าง`}},hints:[{en:`Find how much coconut milk is used on Monday first, in litres.`,th:`หาก่อนว่าวันจันทร์ใช้กะทิไปกี่ลิตร`},{en:`Tuesday's fraction (\\frac{1}{3}) applies to what is left after Monday, not to the original 90 litres.`,th:`เศษส่วนของวันอังคาร (\\frac{1}{3}) ใช้กับปริมาณที่เหลือหลังวันจันทร์ ไม่ใช่กับ 90 ลิตรเดิม`},{en:`Once you have both daily amounts in litres, subtract the smaller from the larger to find the difference.`,th:`เมื่อได้ปริมาณของทั้งสองวันเป็นลิตรแล้ว นำจำนวนที่น้อยกว่าไปลบออกจากจำนวนที่มากกว่าเพื่อหาผลต่าง`}],visual:null,estimatedSeconds:95},{id:`B-16`,testId:`samsen-mock-b`,number:16,skill:`Algebra & Patterns`,topic:{en:`Area Equations`,th:`สมการพื้นที่`},difficulty:`Hard`,prompt:{en:`A square sheet of paper has side length 16 cm. Each of its four corners is cut off to form four congruent right-angled triangles, each with two equal legs of length x cm, leaving a regular octagon in the middle with an area of 224 cm². Find x.`,th:`กระดาษสี่เหลี่ยมจัตุรัสด้านยาว 16 เซนติเมตร ถูกตัดมุมทั้งสี่ออกเป็นสามเหลี่ยมมุมฉากที่เท่ากันทุกมุม แต่ละมุมมีด้านประกอบมุมฉากยาวเท่ากันคือ x เซนติเมตร เหลือรูปแปดเหลี่ยมด้านเท่าตรงกลางมีพื้นที่ 224 ตารางเซนติเมตร จงหาค่า x`},options:[{id:`A`,label:{en:`8 cm`,th:`8 เซนติเมตร`}},{id:`B`,label:{en:`16 cm`,th:`16 เซนติเมตร`}},{id:`C`,label:{en:`2 cm`,th:`2 เซนติเมตร`}},{id:`D`,label:{en:`4 cm`,th:`4 เซนติเมตร`}}],correctOptionId:`D`,explanation:{en:`Square area = 16² = 256 cm². Each corner triangle has area x²/2, and there are 4 corners, so 256 − 4 × (x²/2) = 224. This gives 256 − 2x² = 224, so 2x² = 32, x² = 16, and x = 4 cm.`,th:`พื้นที่สี่เหลี่ยมจัตุรัส = 16² = 256 ตารางเซนติเมตร แต่ละมุมสามเหลี่ยมมีพื้นที่ x²/2 และมี 4 มุม ดังนั้น 256 − 4 × (x²/2) = 224 จะได้ 256 − 2x² = 224 นั่นคือ 2x² = 32, x² = 16 และ x = 4 เซนติเมตร`},distractorNotes:{A:{en:`This forgets that there are 4 corner triangles, solving x²/2 = 32 (using only one triangle's worth of area) instead of 4 × (x²/2) = 32.`,th:`ตัวเลือกนี้ลืมว่ามีสามเหลี่ยมมุมทั้ง 4 มุม จึงแก้สมการ x²/2 = 32 (คิดพื้นที่แค่มุมเดียว) แทนที่จะเป็น 4 × (x²/2) = 32`},B:{en:`This correctly finds x² = 16 but forgets to take the square root, giving 16 instead of 4.`,th:`ตัวเลือกนี้หา x² = 16 ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงตอบ 16 แทนที่จะเป็น 4`},C:{en:`This divides the total removed area (32) by the side length (16) instead of properly solving the equation 2x² = 32 for x.`,th:`ตัวเลือกนี้นำพื้นที่ที่ตัดออกทั้งหมด (32) ไปหารด้วยความยาวด้าน (16) แทนที่จะแก้สมการ 2x² = 32 หาค่า x อย่างถูกต้อง`}},hints:[{en:`Start by finding the total area removed: the square's area minus the octagon's area.`,th:`เริ่มจากหาพื้นที่ทั้งหมดที่ถูกตัดออก คือพื้นที่สี่เหลี่ยมจัตุรัสลบด้วยพื้นที่แปดเหลี่ยม`},{en:`Each cut-off corner is a right triangle with both legs equal to x, so its area is x²/2. There are 4 such corners.`,th:`แต่ละมุมที่ถูกตัดออกเป็นสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาวเท่ากันคือ x พื้นที่จึงเท่ากับ x²/2 และมีมุมแบบนี้ 4 มุม`},{en:`Set up the equation 256 − 4 × (x²/2) = 224, simplify, then solve for x² before taking the square root.`,th:`ตั้งสมการ 256 − 4 × (x²/2) = 224 ทำให้เป็นรูปง่าย แล้วแก้หาค่า x² ก่อนที่จะถอดรากที่สอง`}],visual:{kind:`geometryFigure`,width:160,height:160,segments:[{x1:0,y1:0,x2:160,y2:0,style:`dashed`},{x1:160,y1:0,x2:160,y2:160,style:`dashed`},{x1:160,y1:160,x2:0,y2:160,style:`dashed`},{x1:0,y1:160,x2:0,y2:0,style:`dashed`}],polygons:[{points:[[40,0],[120,0],[160,40],[160,120],[120,160],[40,160],[0,120],[0,40]],fill:`shaded`}],labels:[{x:14,y:10,text:`x`,bold:!0,color:`var(--coral-ink)`},{x:8,y:26,text:`x`,bold:!0,color:`var(--coral-ink)`},{x:80,y:-6,text:`16 cm`}],alt:{en:`A dashed square outline with its four corners cut off, leaving a shaded regular octagon in the middle. Each cut corner leg is labeled x.`,th:`เส้นประรูปสี่เหลี่ยมจัตุรัสที่ตัดมุมทั้งสี่ออก เหลือรูปแปดเหลี่ยมด้านเท่าที่แรเงาตรงกลาง แต่ละด้านที่ตัดมุมกำกับด้วย x`}},estimatedSeconds:120},{id:`B-17`,testId:`samsen-mock-b`,number:17,skill:`Graphs & Data`,topic:{en:`Grouped Bar Charts`,th:`แผนภูมิแท่งกลุ่ม`},difficulty:`VeryHard`,prompt:{en:`The bar chart shows the number of items sold by two food stalls, Stall A and Stall B, over four days of a school Sports Day fair. Which statement below is INCORRECT?`,th:`แผนภูมิแท่งแสดงจำนวนสินค้าที่ขายได้จากแผงขายของกิน 2 แผง คือแผง A และแผง B ตลอด 4 วันของงานกีฬาสีโรงเรียน ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Stall A sold the most items on Thursday out of all four days.`,th:`แผง A ขายได้มากที่สุดในวันพฤหัสบดีเมื่อเทียบกับทั้งสี่วัน`}},{id:`B`,label:{en:`Stall B's total sales over the four days were less than Stall A's total sales.`,th:`ยอดขายรวม 4 วันของแผง B น้อยกว่ายอดขายรวมของแผง A`}},{id:`C`,label:{en:`On Wednesday, Stall B sold 20 more items than Stall A.`,th:`วันพุธ แผง B ขายได้มากกว่าแผง A อยู่ 20 ชิ้น`}},{id:`D`,label:{en:`The difference between Stall A's highest and lowest daily sales is 25 items.`,th:`ผลต่างระหว่างยอดขายสูงสุดกับต่ำสุดในแต่ละวันของแผง A เท่ากับ 25 ชิ้น`}}],correctOptionId:`A`,explanation:{en:`Adding up each stall's sales: Stall A = 30+45+25+50 = 150; Stall B = 40+35+45+30 = 150. The two totals are actually equal, not one less than the other, so statement B is incorrect. All the other statements check out against the chart.`,th:`รวมยอดขายของแต่ละแผง: แผง A = 30+45+25+50 = 150 แผง B = 40+35+45+30 = 150 ยอดขายรวมทั้งสองแผงเท่ากัน ไม่ใช่แผงหนึ่งน้อยกว่าอีกแผงหนึ่ง ดังนั้นข้อความ B ไม่ถูกต้อง ส่วนข้อความอื่นตรวจสอบกับกราฟแล้วถูกต้องทั้งหมด`},distractorNotes:{B:void 0,C:{en:`This statement is true — on Wednesday Stall B sold 45 and Stall A sold 25, a difference of exactly 20, so this is not the incorrect statement.`,th:`ข้อความนี้ถูกต้อง เพราะวันพุธแผง B ขายได้ 45 และแผง A ขายได้ 25 ต่างกันพอดี 20 ชิ้น จึงไม่ใช่ข้อความที่ไม่ถูกต้อง`},D:{en:`This statement is true — Stall A's highest day (Thursday, 50) minus its lowest day (Wednesday, 25) is exactly 25, so this is not the incorrect statement.`,th:`ข้อความนี้ถูกต้อง เพราะยอดขายสูงสุดของแผง A (วันพฤหัสบดี 50) ลบด้วยยอดต่ำสุด (วันพุธ 25) เท่ากับ 25 พอดี จึงไม่ใช่ข้อความที่ไม่ถูกต้อง`}},hints:[{en:`Check each statement one at a time against the bar heights in the chart.`,th:`ตรวจสอบข้อความแต่ละข้อทีละข้อ เทียบกับความสูงของแท่งกราฟ`},{en:`For statements about totals, add up all four days for each stall separately before comparing.`,th:`สำหรับข้อความที่พูดถึงยอดรวม ให้บวกยอดขายทั้งสี่วันของแต่ละแผงแยกกันก่อนเปรียบเทียบ`},{en:`Stall A's total and Stall B's total both add up to 150 — look closely at what statement B actually claims about that.`,th:`ยอดรวมของแผง A และแผง B รวมกันแล้วเท่ากับ 150 ทั้งคู่ ลองพิจารณาข้อความ B ให้ดีว่ากล่าวอ้างอะไรเกี่ยวกับเรื่องนี้`}],visual:{kind:`barChart`,categories:[`Mon`,`Tue`,`Wed`,`Thu`],series:[{name:{en:`Stall A`,th:`แผง A`},color:`coral`,values:[30,45,25,50]},{name:{en:`Stall B`,th:`แผง B`},color:`teal`,values:[40,35,45,30]}],yStep:10,yMax:60,alt:{en:`Grouped bar chart of items sold by Stall A and Stall B across Monday, Tuesday, Wednesday, and Thursday.`,th:`แผนภูมิแท่งกลุ่มแสดงจำนวนสินค้าที่ขายได้ของแผง A และแผง B ในวันจันทร์ อังคาร พุธ และพฤหัสบดี`}},estimatedSeconds:150},{id:`B-18`,testId:`samsen-mock-b`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Charts`,th:`แผนภูมิวงกลม`},difficulty:`VeryHard`,prompt:{en:`A class survey asked students to name their favourite trip destination. The pie chart shows the results in degrees. If 24 students chose "City", how many students chose "Beach"?`,th:`การสำรวจในห้องเรียนถามนักเรียนว่าชอบไปเที่ยวที่ไหนมากที่สุด แผนภูมิวงกลมแสดงผลเป็นองศา ถ้ามีนักเรียน 24 คนเลือก "เมือง" จะมีนักเรียนกี่คนที่เลือก "ชายหาด"`},options:[{id:`A`,label:{en:`22 students`,th:`22 คน`}},{id:`B`,label:{en:`60 students`,th:`60 คน`}},{id:`C`,label:{en:`150 students`,th:`150 คน`}},{id:`D`,label:{en:`38 students`,th:`38 คน`}}],correctOptionId:`B`,explanation:{en:`City's slice is 60° and represents 24 students, so 1° represents 24 ÷ 60 = 0.4 students. Beach's slice is 150°, so Beach = 150 × 0.4 = 60 students.`,th:`สัดส่วน "เมือง" คือ 60° แทนนักเรียน 24 คน ดังนั้น 1° แทนนักเรียน 24 ÷ 60 = 0.4 คน สัดส่วน "ชายหาด" คือ 150° ดังนั้น ชายหาด = 150 × 0.4 = 60 คน`},distractorNotes:{A:{en:`This is the count for "Countryside" (55° × 0.4 = 22), not "Beach" — the wrong slice was used.`,th:`ตัวเลือกนี้คือจำนวนคนของ "ชนบท" (55° × 0.4 = 22) ไม่ใช่ "ชายหาด" ใช้สัดส่วนผิดข้อ`},C:{en:`This uses Beach's degree value (150) directly as the number of students, forgetting to convert degrees into a count using the given City data.`,th:`ตัวเลือกนี้นำค่าองศาของ "ชายหาด" (150) มาใช้เป็นจำนวนคนโดยตรง โดยลืมแปลงองศาเป็นจำนวนคนโดยใช้ข้อมูล "เมือง" ที่กำหนดให้`},D:{en:`This is the count for "Mountain" (95° × 0.4 = 38), not "Beach" — the wrong slice was used.`,th:`ตัวเลือกนี้คือจำนวนคนของ "ภูเขา" (95° × 0.4 = 38) ไม่ใช่ "ชายหาด" ใช้สัดส่วนผิดข้อ`}},hints:[{en:`Find how many students correspond to 1 degree of the pie chart, using the "City" information.`,th:`หาว่านักเรียนกี่คนเทียบเท่ากับ 1 องศาของแผนภูมิวงกลม โดยใช้ข้อมูลของ "เมือง"`},{en:`City = 60° = 24 students, so divide to find students per degree.`,th:`เมือง = 60° = 24 คน ดังนั้นให้หารเพื่อหาจำนวนคนต่อ 1 องศา`},{en:`Multiply the students-per-degree value by Beach's 150° to find its count.`,th:`นำจำนวนคนต่อ 1 องศา ไปคูณกับองศาของ "ชายหาด" (150°) เพื่อหาจำนวนคน`}],visual:{kind:`pieChart`,slices:[{label:`Beach`,degrees:150,color:`coral`},{label:`Mountain`,degrees:95,color:`sage`},{label:`City`,degrees:60,color:`teal`},{label:`Countryside`,degrees:55,color:`gold`}],alt:{en:`Pie chart of favourite trip destinations: Beach 150 degrees, Mountain 95 degrees, City 60 degrees, Countryside 55 degrees.`,th:`แผนภูมิวงกลมแสดงจุดหมายทริปที่ชื่นชอบ: ชายหาด 150 องศา ภูเขา 95 องศา เมือง 60 องศา ชนบท 55 องศา`}},estimatedSeconds:140},{id:`B-19`,testId:`samsen-mock-b`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Profit & Loss Percentage`,th:`กำไรขาดทุนร้อยละ`},difficulty:`VeryHard`,prompt:{en:`A vendor bought a batch of woven baskets for 2,400 baht. She marked up the price so that, if sold at the marked price, she would make a 25% profit. However, on a rainy market day she had to sell all the baskets at a 10% discount off the marked price. Find her actual profit or loss.`,th:`พ่อค้าซื้อตะกร้าสานมาชุดหนึ่งในราคา 2,400 บาท เธอตั้งราคาขายไว้เพื่อหวังกำไร 25% ถ้าขายได้ในราคาที่ตั้งไว้ แต่เนื่องจากฝนตกในวันตลาด เธอต้องลดราคาลง 10% จากราคาที่ตั้งไว้จึงจะขายตะกร้าได้หมด จงหากำไรหรือขาดทุนที่แท้จริงของเธอ`},options:[{id:`A`,label:{en:`Profit of 360 baht`,th:`กำไร 360 บาท`}},{id:`B`,label:{en:`Loss of 240 baht`,th:`ขาดทุน 240 บาท`}},{id:`C`,label:{en:`Profit of 300 baht`,th:`กำไร 300 บาท`}},{id:`D`,label:{en:`Profit of 600 baht`,th:`กำไร 600 บาท`}}],correctOptionId:`C`,explanation:{en:`Marked price = 2,400 × 1.25 = 3,000 baht. Actual selling price after a 10% discount off the marked price = 3,000 × 0.9 = 2,700 baht. Actual profit = 2,700 − 2,400 = 300 baht.`,th:`ราคาที่ตั้งไว้ = 2,400 × 1.25 = 3,000 บาท ราคาขายจริงหลังลด 10% จากราคาที่ตั้งไว้ = 3,000 × 0.9 = 2,700 บาท กำไรที่แท้จริง = 2,700 − 2,400 = 300 บาท`},distractorNotes:{A:{en:`This simply subtracts the two percentages (25% − 10% = 15%) and applies that to the cost price, but percentage changes cannot be combined by simple subtraction like this: 2,400 × 0.15 = 360.`,th:`ตัวเลือกนี้นำร้อยละทั้งสองมาลบกันตรงๆ (25% − 10% = 15%) แล้วคูณกับราคาทุน แต่การเปลี่ยนแปลงร้อยละสองครั้งไม่สามารถบวกลบกันตรงๆ ได้แบบนี้: 2,400 × 0.15 = 360`},B:{en:`This mistakenly applies the 10% discount to the cost price (2,400) instead of the marked price (3,000), then compares that to the cost, giving a loss of 2,400 − 2,160 = 240.`,th:`ตัวเลือกนี้เข้าใจผิดว่าลด 10% จากราคาทุน (2,400) แทนที่จะเป็นราคาที่ตั้งไว้ (3,000) แล้วนำไปเทียบกับราคาทุน ทำให้ได้ขาดทุน 2,400 − 2,160 = 240`},D:{en:`This uses the marked price (3,000) as if it were the actual selling price, forgetting that the discount was applied before the sale: 3,000 − 2,400 = 600.`,th:`ตัวเลือกนี้ใช้ราคาที่ตั้งไว้ (3,000) เป็นราคาขายจริง โดยลืมว่ามีการลดราคาก่อนขายจริง: 3,000 − 2,400 = 600`}},hints:[{en:`First find the marked price — the price she originally intended to sell at for a 25% profit.`,th:`หาก่อนว่าราคาที่ตั้งไว้ (ที่หวังกำไร 25%) คือเท่าใด`},{en:`The 10% discount is taken off the marked price, not off the original cost price.`,th:`การลด 10% นั้นลดจากราคาที่ตั้งไว้ ไม่ใช่ลดจากราคาทุนเดิม`},{en:`Find the actual selling price after the discount, then compare it to the original cost of 2,400 baht to find the real profit or loss.`,th:`หาราคาขายจริงหลังลดราคาแล้ว จากนั้นนำไปเทียบกับราคาทุนเดิม 2,400 บาท เพื่อหากำไรหรือขาดทุนที่แท้จริง`}],visual:null,estimatedSeconds:130},{id:`B-20`,testId:`samsen-mock-b`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Percentage Relationships`,th:`ความสัมพันธ์ร้อยละ`},difficulty:`VeryHard`,prompt:{en:`Anong, Boonmee, and Chai together saved 6,200 baht for a class trip. Boonmee saved 20% more than Anong. Chai saved 25% less than Boonmee. Find how much more Anong saved than Chai.`,th:`อนงค์ บุญมี และชัย ร่วมกันออมเงิน 6,200 บาท เพื่อไปทัศนศึกษา บุญมีออมเงินมากกว่าอนงค์อยู่ 20% ชัยออมเงินน้อยกว่าบุญมีอยู่ 25% จงหาว่าอนงค์ออมเงินมากกว่าชัยอยู่เท่าใด`},options:[{id:`A`,label:{en:`600 baht`,th:`600 บาท`}},{id:`B`,label:{en:`400 baht`,th:`400 บาท`}},{id:`C`,label:{en:`1,800 baht`,th:`1,800 บาท`}},{id:`D`,label:{en:`200 baht`,th:`200 บาท`}}],correctOptionId:`D`,explanation:{en:`Let Anong = A. Boonmee = 1.2A. Chai = 0.75 × 1.2A = 0.9A. Sum: A + 1.2A + 0.9A = 3.1A = 6,200, so A = 2,000. Then Boonmee = 2,400 and Chai = 1,800. Anong minus Chai = 2,000 − 1,800 = 200 baht.`,th:`ให้อนงค์ = A บุญมี = 1.2A ชัย = 0.75 × 1.2A = 0.9A รวมกัน: A + 1.2A + 0.9A = 3.1A = 6,200 ดังนั้น A = 2,000 บุญมี = 2,400 และชัย = 1,800 อนงค์ลบชัย = 2,000 − 1,800 = 200 บาท`},distractorNotes:{A:{en:`This is Boonmee's savings minus Chai's savings (2,400 − 1,800 = 600), not Anong's minus Chai's.`,th:`ตัวเลือกนี้คือเงินออมของบุญมีลบด้วยเงินออมของชัย (2,400 − 1,800 = 600) ไม่ใช่อนงค์ลบชัย`},B:{en:`This is Boonmee's savings minus Anong's savings (2,400 − 2,000 = 400), which answers "how much more did Boonmee save than Anong", not what was asked.`,th:`ตัวเลือกนี้คือเงินออมของบุญมีลบด้วยเงินออมของอนงค์ (2,400 − 2,000 = 400) ซึ่งตอบคำถาม "บุญมีออมมากกว่าอนงค์เท่าใด" ไม่ใช่คำถามที่โจทย์ถาม`},C:{en:`This is simply Chai's total savings (1,800), not the difference between Anong's and Chai's savings.`,th:`ตัวเลือกนี้คือเงินออมทั้งหมดของชัยเฉยๆ (1,800) ไม่ใช่ผลต่างระหว่างเงินออมของอนงค์กับชัย`}},hints:[{en:`Let Anong's savings be a variable, A, and write Boonmee's and Chai's savings in terms of A.`,th:`ให้เงินออมของอนงค์เป็นตัวแปร A แล้วเขียนเงินออมของบุญมีและชัยในรูปของ A`},{en:`Boonmee = 1.2 × A (20% more), and Chai = 0.75 × Boonmee (25% less than Boonmee, not less than Anong).`,th:`บุญมี = 1.2 × A (มากกว่า 20%) และชัย = 0.75 × บุญมี (น้อยกว่าบุญมี 25% ไม่ใช่น้อยกว่าอนงค์)`},{en:`Add all three expressions, set the sum equal to 6,200 to solve for A, then compute Anong minus Chai.`,th:`บวกทั้งสามนิพจน์เข้าด้วยกัน ให้เท่ากับ 6,200 เพื่อแก้หา A แล้วคำนวณอนงค์ลบชัย`}],visual:null,estimatedSeconds:145}]},{id:`samsen-mock-c`,title:{en:`Mock Test C`,th:`ข้อสอบชุด C`},subtitle:{en:`Workshop & City Paper`,th:`ชุดโรงงานและเมือง`},recommendedMinutes:40,questions:[{id:`C-01`,testId:`samsen-mock-c`,number:1,skill:`Number & Operations`,topic:{en:`Largest Number from Digits`,th:`การเรียงเลขให้มากที่สุด`},difficulty:I(1),prompt:{en:`A carpenter labels four wooden number tiles 1, 4, 6, and 9. Using each tile exactly once, what is the largest 4-digit EVEN number he can arrange them into?`,th:`ช่างไม้เขียนตัวเลขลงบนแผ่นไม้ 4 แผ่น ได้แก่ 1, 4, 6 และ 9 ถ้าใช้แผ่นไม้ทุกแผ่นเพียงครั้งเดียว จะเรียงเป็นจำนวน 4 หลักที่เป็นจำนวนคู่และมีค่ามากที่สุดได้เท่าใด`},options:[{id:`A`,label:{en:`9,614`,th:`9,614`}},{id:`B`,label:{en:`9,641`,th:`9,641`}},{id:`C`,label:{en:`9,416`,th:`9,416`}},{id:`D`,label:{en:`6,941`,th:`6,941`}}],correctOptionId:`A`,explanation:{en:`The last digit must be even, so it can only be 4 or 6. Try each: ending in 4 leaves 9,6,1 for the front (9,614); ending in 6 leaves 9,4,1 for the front (9,416). Comparing the two, 9,614 is larger, so it is the answer.`,th:`ตัวสุดท้ายต้องเป็นเลขคู่ จึงมีได้แค่ 4 หรือ 6 ลองทีละแบบ: ถ้าลงท้ายด้วย 4 เหลือ 9, 6, 1 ไว้เรียงข้างหน้า ได้ 9,614 ถ้าลงท้ายด้วย 6 เหลือ 9, 4, 1 ได้ 9,416 เมื่อเทียบกัน 9,614 มีค่ามากกว่า จึงเป็นคำตอบ`},distractorNotes:{B:{en:`Ignores the "even" requirement and simply arranges all four digits in descending order (9,6,4,1), forgetting the number must end in an even digit.`,th:`ลืมเงื่อนไข "จำนวนคู่" แล้วเรียงเลขทั้งสี่จากมากไปน้อยตรงๆ (9,6,4,1) โดยไม่สนใจว่าตัวสุดท้ายต้องเป็นเลขคู่`},C:{en:`Correctly picks an even last digit but chooses 6 instead of the smaller even digit 4, so the front digits end up smaller overall.`,th:`เลือกตัวสุดท้ายเป็นเลขคู่ถูกต้อง แต่เลือก 6 แทนที่จะเป็น 4 ซึ่งเป็นเลขคู่ที่น้อยกว่า ทำให้ตัวเลขด้านหน้าได้ค่าน้อยกว่าที่ควร`},D:{en:`Misreads or reorders the tiles incorrectly, placing 6 before 9 in the leading position.`,th:`เรียงแผ่นไม้ผิดตำแหน่ง โดยนำ 6 ขึ้นนำหน้า 9 ทั้งที่ 9 มีค่ามากกว่าและควรอยู่หน้าสุด`}},hints:[{en:`Think about which digits can go in the last (ones) place.`,th:`ลองคิดดูว่าหลักหน่วย (ตัวสุดท้าย) ใช้เลขตัวไหนได้บ้าง`},{en:`A number is even only when its last digit is even — here that means 4 or 6.`,th:`จำนวนจะเป็นจำนวนคู่ก็ต่อเมื่อหลักหน่วยเป็นเลขคู่ ในที่นี้คือ 4 หรือ 6 เท่านั้น`},{en:`Try ending in 4 and ending in 6 separately: for each case, arrange the remaining three digits from largest to smallest in front. Then compare the two full numbers.`,th:`ลองแยกกรณีลงท้ายด้วย 4 กับลงท้ายด้วย 6 แต่ละกรณีให้เรียงเลข 3 ตัวที่เหลือจากมากไปน้อยไว้ข้างหน้า แล้วนำสองจำนวนที่ได้มาเทียบกัน`}],visual:null,estimatedSeconds:50},{id:`C-02`,testId:`samsen-mock-c`,number:2,skill:`Word Problems & Logic`,topic:{en:`Two-Price Puzzle`,th:`โจทย์ราคาสองแบบ`},difficulty:I(2),prompt:{en:`A workshop manager has enough budget to buy several identical toolboxes. If each toolbox costs 45 baht, he will have 30 baht of budget left over. If each toolbox costs 40 baht instead, he can buy 2 more toolboxes and still have 10 baht left over. How much total budget does he have?`,th:`ผู้จัดการโรงงานมีงบประมาณพอซื้อกล่องเครื่องมือแบบเดียวกันได้จำนวนหนึ่ง ถ้ากล่องละ 45 บาท จะเหลืองบ 30 บาท แต่ถ้ากล่องละ 40 บาท จะซื้อได้เพิ่มอีก 2 กล่อง และยังเหลืองบ 10 บาท ผู้จัดการมีงบประมาณทั้งหมดเท่าใด`},options:[{id:`A`,label:{en:`570 baht`,th:`570 บาท`}},{id:`B`,label:{en:`560 baht`,th:`560 บาท`}},{id:`C`,label:{en:`540 baht`,th:`540 บาท`}},{id:`D`,label:{en:`480 baht`,th:`480 บาท`}}],correctOptionId:`A`,explanation:{en:`Let n be the number of toolboxes bought at 45 baht. The budget is 45n + 30. At 40 baht he buys (n+2) boxes, so the budget is also 40(n+2) + 10. Setting these equal: 45n + 30 = 40n + 90, so 5n = 60 and n = 12. The budget is 45(12) + 30 = 570 baht (check: 40(14) + 10 = 570 too).`,th:`ให้ n เป็นจำนวนกล่องที่ซื้อได้เมื่อราคากล่องละ 45 บาท งบประมาณคือ 45n + 30 เมื่อราคากล่องละ 40 บาท จะซื้อได้ (n+2) กล่อง งบประมาณจึงเท่ากับ 40(n+2) + 10 ด้วย ให้สองสมการเท่ากัน: 45n + 30 = 40n + 90 จะได้ 5n = 60 ดังนั้น n = 12 งบประมาณคือ 45(12) + 30 = 570 บาท (ตรวจสอบ: 40(14) + 10 = 570 บาทเช่นกัน)`},distractorNotes:{B:{en:`Uses the second price scenario but forgets to add the 10-baht leftover: 40 × 14 = 560.`,th:`ใช้สถานการณ์ราคาที่สองแต่ลืมบวกเงินที่เหลือ 10 บาท: 40 × 14 = 560`},C:{en:`Uses the first price scenario but forgets to add the 30-baht leftover: 45 × 12 = 540.`,th:`ใช้สถานการณ์ราคาแรกแต่ลืมบวกเงินที่เหลือ 30 บาท: 45 × 12 = 540`},D:{en:`Makes an arithmetic slip solving 5n = 60 as n = 10 instead of 12, giving budget = 45(10) + 30 = 480.`,th:`คำนวณผิดพลาดตอนแก้สมการ 5n = 60 ได้ n = 10 แทนที่จะเป็น 12 ทำให้ได้งบประมาณ = 45(10) + 30 = 480`}},hints:[{en:`Write the total budget two different ways, once for each price.`,th:`ลองเขียนงบประมาณทั้งหมดสองแบบ แบบละหนึ่งราคา`},{en:`If n boxes are bought at 45 baht, the budget is 45n + 30. Write a similar expression for the 40-baht case using n + 2 boxes.`,th:`ถ้าซื้อได้ n กล่องตอนราคา 45 บาท งบประมาณคือ 45n + 30 ลองเขียนสมการแบบเดียวกันสำหรับกรณีราคา 40 บาท โดยใช้จำนวนกล่อง n + 2`},{en:`Set the two expressions for the budget equal to each other and solve for n, then substitute back to find the total budget.`,th:`ให้สมการงบประมาณทั้งสองแบบเท่ากัน แก้หาค่า n แล้วแทนกลับเพื่อหางบประมาณทั้งหมด`}],visual:null,estimatedSeconds:65},{id:`C-03`,testId:`samsen-mock-c`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:I(3),prompt:{en:`A carpenter cut seven wooden planks to different fractions of a metre: \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{4}{9}, and \\frac{11}{18} of a metre. Arranged from longest to shortest, which plank is the 4th longest?`,th:`ช่างไม้ตัดไม้กระดาน 7 แผ่น ให้มีความยาวเป็นเศษส่วนของเมตรดังนี้ \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{4}{9} และ \\frac{11}{18} เมตร ถ้าเรียงจากยาวที่สุดไปสั้นที่สุด แผ่นที่ยาวเป็นอันดับที่ 4 มีความยาวเท่าใด`},options:[{id:`A`,label:{en:`\\frac{3}{4} m`,th:`\\frac{3}{4} เมตร`}},{id:`B`,label:{en:`\\frac{2}{3} m`,th:`\\frac{2}{3} เมตร`}},{id:`C`,label:{en:`\\frac{5}{8} m`,th:`\\frac{5}{8} เมตร`}},{id:`D`,label:{en:`\\frac{11}{18} m`,th:`\\frac{11}{18} เมตร`}}],correctOptionId:`C`,explanation:{en:`Convert every fraction to a common denominator of 72: \\frac{3}{4}=\\frac{54}{72}, \\frac{5}{8}=\\frac{45}{72}, \\frac{7}{12}=\\frac{42}{72}, \\frac{2}{3}=\\frac{48}{72}, \\frac{5}{6}=\\frac{60}{72}, \\frac{4}{9}=\\frac{32}{72}, \\frac{11}{18}=\\frac{44}{72}. Ranking from largest: \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{11}{18}, \\frac{7}{12}, \\frac{4}{9}. The 4th longest is \\frac{5}{8}.`,th:`แปลงเศษส่วนทุกตัวให้มีตัวส่วนร่วมเป็น 72: \\frac{3}{4}=\\frac{54}{72}, \\frac{5}{8}=\\frac{45}{72}, \\frac{7}{12}=\\frac{42}{72}, \\frac{2}{3}=\\frac{48}{72}, \\frac{5}{6}=\\frac{60}{72}, \\frac{4}{9}=\\frac{32}{72}, \\frac{11}{18}=\\frac{44}{72} เรียงจากมากไปน้อย: \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{11}{18}, \\frac{7}{12}, \\frac{4}{9} อันดับที่ 4 คือ \\frac{5}{8}`},distractorNotes:{A:{en:`Counts one rank too high — \\frac{3}{4} is actually the 2nd longest, not the 4th.`,th:`นับอันดับผิดไปหนึ่งอันดับ จริงๆ แล้ว \\frac{3}{4} อยู่อันดับที่ 2 ไม่ใช่อันดับที่ 4`},B:{en:`Counts one rank too high — \\frac{2}{3} is actually the 3rd longest, not the 4th.`,th:`นับอันดับผิดไปหนึ่งอันดับ จริงๆ แล้ว \\frac{2}{3} อยู่อันดับที่ 3 ไม่ใช่อันดับที่ 4`},D:{en:`Counts one rank too low — \\frac{11}{18} is actually the 5th longest, not the 4th.`,th:`นับอันดับผิดไปหนึ่งอันดับ จริงๆ แล้ว \\frac{11}{18} อยู่อันดับที่ 5 ไม่ใช่อันดับที่ 4`}},hints:[{en:`You cannot compare these fractions directly — they need a common denominator or decimal form first.`,th:`เศษส่วนเหล่านี้เทียบกันตรงๆ ไม่ได้ ต้องแปลงให้มีตัวส่วนร่วมหรือแปลงเป็นทศนิยมก่อน`},{en:`The denominators 4, 8, 12, 3, 6, 9, 18 all divide evenly into 72 — use 72 as the common denominator.`,th:`ตัวส่วน 4, 8, 12, 3, 6, 9, 18 หารลงตัวกับ 72 ทั้งหมด ลองใช้ 72 เป็นตัวส่วนร่วม`},{en:`Convert all seven fractions to /72ths, list the numerators from largest to smallest, and count down to the 4th one.`,th:`แปลงเศษส่วนทั้ง 7 ตัวให้เป็นเศษส่วนที่มีตัวส่วน 72 เรียงตัวเศษจากมากไปน้อย แล้วนับไปถึงอันดับที่ 4`}],visual:null,estimatedSeconds:60},{id:`C-04`,testId:`samsen-mock-c`,number:4,skill:`Number & Operations`,topic:{en:`Mixed Expressions`,th:`การคำนวณนิพจน์ผสม`},difficulty:I(4),prompt:{en:`A machinist read two calibration values from a manual:
A = (15 − 3) ÷ 4 + 2 × \\frac{3}{4}
B = 5 − (2 + \\frac{1}{3}) × \\frac{3}{7}
What is the value of 2 × (A ÷ B)?`,th:`ช่างเครื่องอ่านค่าปรับเทียบสองค่าจากคู่มือ:
A = (15 − 3) ÷ 4 + 2 × \\frac{3}{4}
B = 5 − (2 + \\frac{1}{3}) × \\frac{3}{7}
ค่าของ 2 × (A ÷ B) เท่ากับเท่าใด`},options:[{id:`A`,label:{en:`4 \\frac{1}{2}`,th:`4 \\frac{1}{2}`}},{id:`B`,label:{en:`2 \\frac{1}{4}`,th:`2 \\frac{1}{4}`}},{id:`C`,label:{en:`1 \\frac{7}{9}`,th:`1 \\frac{7}{9}`}},{id:`D`,label:{en:`1 \\frac{1}{8}`,th:`1 \\frac{1}{8}`}}],correctOptionId:`B`,explanation:{en:`A = (15−3)÷4 + 2×\\frac{3}{4} = 3 + \\frac{3}{2} = 4 \\frac{1}{2} = \\frac{9}{2}. B = 5 − (\\frac{7}{3})×(\\frac{3}{7}) = 5 − 1 = 4. So A÷B = (\\frac{9}{2})÷4 = \\frac{9}{8}, and 2×(\\frac{9}{8}) = \\frac{9}{4} = 2 \\frac{1}{4}.`,th:`A = (15−3)÷4 + 2×\\frac{3}{4} = 3 + \\frac{3}{2} = 4 \\frac{1}{2} = \\frac{9}{2}  ส่วน B = 5 − (\\frac{7}{3})×(\\frac{3}{7}) = 5 − 1 = 4  ดังนั้น A÷B = (\\frac{9}{2})÷4 = \\frac{9}{8}  และ 2×(\\frac{9}{8}) = \\frac{9}{4} = 2 \\frac{1}{4}`},distractorNotes:{A:{en:`Reports A itself (4 \\frac{1}{2}), forgetting to actually divide by B and multiply by 2.`,th:`ตอบค่า A เฉยๆ (4 \\frac{1}{2}) ลืมนำไปหารด้วย B และคูณ 2 ตามที่โจทย์ถาม`},C:{en:`Computes B ÷ A instead of A ÷ B, then multiplies by 2: (4 ÷ 4.5) × 2 = \\frac{16}{9} = 1 \\frac{7}{9}.`,th:`คำนวณ B ÷ A แทนที่จะเป็น A ÷ B แล้วคูณ 2: (4 ÷ 4.5) × 2 = \\frac{16}{9} = 1 \\frac{7}{9}`},D:{en:`Correctly finds A ÷ B = \\frac{9}{8} but forgets the final ×2 step.`,th:`หาค่า A ÷ B ได้ถูกต้องเป็น \\frac{9}{8} แต่ลืมคูณ 2 ในขั้นตอนสุดท้าย`}},hints:[{en:`Work out A and B completely and separately first before combining them.`,th:`ลองหาค่า A และ B ให้เสร็จสมบูรณ์แยกกันก่อน แล้วค่อยนำมารวมกัน`},{en:`Remember order of operations: brackets first, then × and ÷ left to right, then + and −.`,th:`อย่าลืมลำดับการคำนวณ: วงเล็บก่อน แล้วจึงคูณ/หารจากซ้ายไปขวา แล้วจึงบวก/ลบ`},{en:`You should get A = \\frac{9}{2} and B = 4. Divide A by B first, then multiply the result by 2.`,th:`คุณควรได้ A = \\frac{9}{2} และ B = 4 ให้นำ A หารด้วย B ก่อน แล้วจึงนำผลลัพธ์ไปคูณด้วย 2`}],visual:null,estimatedSeconds:65},{id:`C-05`,testId:`samsen-mock-c`,number:5,skill:`Number & Operations`,topic:{en:`LCM from a Remainder Clue`,th:`ค.ร.น. จากเงื่อนไขเศษเหลือ`},difficulty:I(5),prompt:{en:`Two crates together contain 84 bolts. When the number of bolts in the larger crate is divided by the number in the smaller crate, the quotient is 3 and the remainder is 4. What is the LCM of the two bolt counts?`,th:`ลังใส่น็อตสองใบมีน็อตรวมกัน 84 ตัว เมื่อนำจำนวนน็อตในลังใหญ่หารด้วยจำนวนน็อตในลังเล็ก ได้ผลหาร 3 เศษ 4 จงหา ค.ร.น. ของจำนวนน็อตทั้งสองลัง`},options:[{id:`A`,label:{en:`4`,th:`4`}},{id:`B`,label:{en:`63`,th:`63`}},{id:`C`,label:{en:`1,280`,th:`1,280`}},{id:`D`,label:{en:`320`,th:`320`}}],correctOptionId:`D`,explanation:{en:`Let the smaller crate have x bolts, so the larger has 3x + 4. Their sum: x + 3x + 4 = 84, so 4x = 80 and x = 20. The larger crate has 3(20) + 4 = 64 bolts. GCF(20, 64) = 4, so LCM = (20 × 64) ÷ 4 = 1,280 ÷ 4 = 320.`,th:`ให้ลังเล็กมีน็อต x ตัว ลังใหญ่จะมี 3x + 4 ตัว ผลรวม: x + 3x + 4 = 84 จะได้ 4x = 80 ดังนั้น x = 20 ลังใหญ่มีน็อต 3(20) + 4 = 64 ตัว ห.ร.ม.(20, 64) = 4 ดังนั้น ค.ร.น. = (20 × 64) ÷ 4 = 1,280 ÷ 4 = 320`},distractorNotes:{A:{en:`Finds the correct GCF (4) but reports it instead of the LCM the question actually asks for.`,th:`หา ห.ร.ม. ได้ถูกต้องเป็น 4 แต่ตอบ ห.ร.ม. แทนที่จะเป็น ค.ร.น. ที่โจทย์ถาม`},B:{en:`Ignores the remainder of 4 and solves x + 3x = 84 instead, getting x = 21 and larger = 63. Since 63 happens to be a multiple of 21, this (wrong) LCM comes out as 63.`,th:`ลืมเศษ 4 แล้วแก้สมการ x + 3x = 84 แทน ได้ x = 21 และลังใหญ่มี 63 ตัว เนื่องจาก 63 เป็นพหุคูณของ 21 พอดี จึงได้ ค.ร.น. ผิดเป็น 63`},C:{en:`Multiplies the two numbers together (20 × 64 = 1,280) but forgets to divide by the GCF to get the true LCM.`,th:`นำสองจำนวนมาคูณกันตรงๆ (20 × 64 = 1,280) แต่ลืมหารด้วย ห.ร.ม. เพื่อให้ได้ ค.ร.น. ที่แท้จริง`}},hints:[{en:`Turn the division statement into an equation: larger = 3 × smaller + 4.`,th:`เปลี่ยนประโยคการหารให้เป็นสมการ: ลังใหญ่ = 3 × ลังเล็ก + 4`},{en:`Let the smaller crate be x. Use the sum 84 to write and solve an equation for x.`,th:`ให้ลังเล็กเป็น x ใช้ผลรวม 84 ตั้งสมการและแก้หาค่า x`},{en:`Once you know both numbers, find their GCF first, then use LCM = (number1 × number2) ÷ GCF.`,th:`เมื่อรู้จำนวนทั้งสองแล้ว ให้หา ห.ร.ม. ก่อน แล้วใช้สูตร ค.ร.น. = (จำนวนที่ 1 × จำนวนที่ 2) ÷ ห.ร.ม.`}],visual:null,estimatedSeconds:70},{id:`C-06`,testId:`samsen-mock-c`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing Tile Pattern`,th:`แบบรูปกระเบื้องที่ขยายตัว`},difficulty:I(6),prompt:{en:`A landscaper is laying a plus-shaped paving pattern that grows with each new design. Design 1 uses 1 tile (just the centre). Each new design adds one tile to the end of every one of the four arms. Design 3 (shown, 9 tiles) and Design 4 (13 tiles) follow this rule. Following the same pattern, how many tiles will Design 15 use?`,th:`ภูมิสถาปนิกกำลังปูกระเบื้องเป็นรูปเครื่องหมายบวก ซึ่งขยายใหญ่ขึ้นทุกแบบ แบบที่ 1 ใช้กระเบื้อง 1 แผ่น (แค่ตรงกลาง) แบบถัดไปแต่ละแบบจะเพิ่มกระเบื้อง 1 แผ่นที่ปลายแขนทั้ง 4 ด้าน แบบที่ 3 (ในรูป มี 9 แผ่น) และแบบที่ 4 (มี 13 แผ่น) เป็นไปตามกฎนี้ ถ้าปูตามแบบรูปเดิม แบบที่ 15 จะใช้กระเบื้องกี่แผ่น`},options:[{id:`A`,label:{en:`53`,th:`53`}},{id:`B`,label:{en:`57`,th:`57`}},{id:`C`,label:{en:`60`,th:`60`}},{id:`D`,label:{en:`225`,th:`225`}}],correctOptionId:`B`,explanation:{en:`The tile count follows Tn = 4n − 3 (check: T1=1, T2=5, T3=9, T4=13, matching the pattern). For Design 15: T15 = 4(15) − 3 = 60 − 3 = 57.`,th:`จำนวนกระเบื้องเป็นไปตามสูตร Tn = 4n − 3 (ตรวจสอบ: T1=1, T2=5, T3=9, T4=13 ตรงกับแบบรูป) สำหรับแบบที่ 15: T15 = 4(15) − 3 = 60 − 3 = 57`},distractorNotes:{A:{en:`Off by one design — this is actually the tile count for Design 14 (4×14−3 = 53), not Design 15.`,th:`นับแบบผิดไปหนึ่งแบบ ค่านี้คือจำนวนกระเบื้องของแบบที่ 14 (4×14−3 = 53) ไม่ใช่แบบที่ 15`},C:{en:`Uses the formula 4n without subtracting 3, forgetting the centre tile is shared and already counted once: 4 × 15 = 60.`,th:`ใช้สูตร 4n โดยไม่ลบ 3 ลืมไปว่ากระเบื้องตรงกลางถูกนับซ้ำและควรหักออก: 4 × 15 = 60`},D:{en:`Mistakes the growing plus-shape for a growing square and squares the design number instead: 15² = 225.`,th:`เข้าใจผิดว่ารูปเครื่องหมายบวกที่ขยายตัวเป็นรูปสี่เหลี่ยมจัตุรัส จึงยกกำลังสองลำดับแบบแทน: 15² = 225`}},hints:[{en:`List out the tile counts for Design 1, 2, 3, 4 and look for how much is added each time.`,th:`ลองเขียนจำนวนกระเบื้องของแบบที่ 1, 2, 3, 4 แล้วสังเกตว่าเพิ่มขึ้นทีละเท่าไร`},{en:`Each new design adds exactly 4 tiles (one per arm) to the previous one — this is a pattern with a constant difference of 4.`,th:`แต่ละแบบใหม่เพิ่มกระเบื้อง 4 แผ่นเสมอ (แขนละ 1 แผ่น) นี่คือแบบรูปที่มีผลต่างคงที่เท่ากับ 4`},{en:`Write the rule as Tn = 4n − 3, then substitute n = 15.`,th:`เขียนสูตรเป็น Tn = 4n − 3 แล้วแทนค่า n = 15`}],visual:{kind:`gridPattern`,gridSize:5,cells:[{row:0,col:2},{row:1,col:2},{row:2,col:0},{row:2,col:1},{row:2,col:2},{row:2,col:3},{row:2,col:4},{row:3,col:2},{row:4,col:2}],alt:{en:`Design 3 of the plus-shaped tile pattern: a vertical arm and horizontal arm of tiles crossing at the centre, 9 tiles in total.`,th:`แบบที่ 3 ของแบบรูปกระเบื้องรูปเครื่องหมายบวก: แขนแนวตั้งและแนวนอนตัดกันตรงกลาง รวม 9 แผ่น`}},estimatedSeconds:75},{id:`C-07`,testId:`samsen-mock-c`,number:7,skill:`Word Problems & Logic`,topic:{en:`Meeting Point Speed`,th:`โจทย์ความเร็วพบกัน`},difficulty:I(7),prompt:{en:`A jogging path connects the Park Gate and the Fountain. Mali starts at the Park Gate jogging toward the Fountain at 15 km/h. At the same moment, Wichai starts at the Fountain jogging toward the Park Gate at 20 km/h. They meet after 24 minutes. How long is the jogging path?`,th:`เส้นทางวิ่งออกกำลังกายเชื่อมระหว่างประตูสวนกับน้ำพุ มาลีออกวิ่งจากประตูสวนไปทางน้ำพุด้วยความเร็ว 15 กม./ชม. ในเวลาเดียวกัน วิชัยออกวิ่งจากน้ำพุไปทางประตูสวนด้วยความเร็ว 20 กม./ชม. ทั้งสองคนพบกันหลังจากวิ่งไป 24 นาที เส้นทางวิ่งนี้ยาวเท่าใด`},options:[{id:`A`,label:{en:`6 km`,th:`6 กม.`}},{id:`B`,label:{en:`8 km`,th:`8 กม.`}},{id:`C`,label:{en:`14 km`,th:`14 กม.`}},{id:`D`,label:{en:`840 km`,th:`840 กม.`}}],correctOptionId:`C`,explanation:{en:`Since they move toward each other, their speeds add: 15 + 20 = 35 km/h. 24 minutes = \\frac{24}{60} = 0.4 hours. Distance = 35 × 0.4 = 14 km.`,th:`เนื่องจากทั้งสองวิ่งเข้าหากัน จึงนำความเร็วมาบวกกัน: 15 + 20 = 35 กม./ชม. 24 นาที = \\frac{24}{60} = 0.4 ชั่วโมง ระยะทาง = 35 × 0.4 = 14 กม.`},distractorNotes:{A:{en:`Uses only Mali's speed (15 km/h) and forgets that Wichai is also closing the distance from the other end: 15 × 0.4 = 6.`,th:`ใช้ความเร็วของมาลีอย่างเดียว (15 กม./ชม.) โดยลืมว่าวิชัยก็วิ่งเข้าหาจากอีกฝั่งด้วย: 15 × 0.4 = 6`},B:{en:`Uses only Wichai's speed (20 km/h) and forgets to add Mali's speed: 20 × 0.4 = 8.`,th:`ใช้ความเร็วของวิชัยอย่างเดียว (20 กม./ชม.) โดยลืมบวกความเร็วของมาลี: 20 × 0.4 = 8`},D:{en:`Forgets to convert 24 minutes into hours and multiplies the combined speed by 24 directly: 35 × 24 = 840.`,th:`ลืมแปลง 24 นาทีให้เป็นชั่วโมง แล้วนำความเร็วรวมไปคูณกับ 24 ตรงๆ: 35 × 24 = 840`}},hints:[{en:`They are moving toward each other from opposite ends — think about how their speeds combine.`,th:`ทั้งสองวิ่งเข้าหากันจากปลายทั้งสองด้าน ลองคิดว่าความเร็วของทั้งคู่รวมกันอย่างไร`},{en:`When two people move toward each other, the distance between them shrinks at the sum of their speeds.`,th:`เมื่อสองคนวิ่งเข้าหากัน ระยะห่างระหว่างพวกเขาจะลดลงด้วยอัตราเท่ากับผลรวมของความเร็วทั้งสองคน`},{en:`Add the two speeds, convert 24 minutes to hours (÷60), then multiply speed × time to get the path length.`,th:`บวกความเร็วทั้งสอง แปลง 24 นาทีเป็นชั่วโมง (หาร 60) แล้วคูณความเร็ว × เวลา เพื่อหาความยาวเส้นทาง`}],visual:null,estimatedSeconds:70},{id:`C-08`,testId:`samsen-mock-c`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing in Ratio`,th:`การแบ่งตามอัตราส่วน`},difficulty:I(8),prompt:{en:`Three workers, Anan, Boon, and Chai, share a project bonus of 3,600 baht in the ratio 5:4:3. Boon spends 480 baht of his share on lunch for the team, then uses the rest to buy notebooks costing 50 baht each. How many notebooks can he buy, and how much money is left over?`,th:`คนงานสามคน คือ อนันต์ บุญ และชัย แบ่งเงินโบนัสโครงการ 3,600 บาท ตามอัตราส่วน 5:4:3 บุญนำเงินส่วนแบ่งของตนไปเลี้ยงข้าวทีมงาน 480 บาท แล้วนำเงินที่เหลือไปซื้อสมุดราคาเล่มละ 50 บาท บุญจะซื้อสมุดได้กี่เล่ม และเหลือเงินเท่าใด`},options:[{id:`A`,label:{en:`10 notebooks, 20 baht left`,th:`สมุด 10 เล่ม เหลือเงิน 20 บาท`}},{id:`B`,label:{en:`14 notebooks, 20 baht left`,th:`สมุด 14 เล่ม เหลือเงิน 20 บาท`}},{id:`C`,label:{en:`20 notebooks, 20 baht left`,th:`สมุด 20 เล่ม เหลือเงิน 20 บาท`}},{id:`D`,label:{en:`24 notebooks, 0 baht left`,th:`สมุด 24 เล่ม เหลือเงิน 0 บาท`}}],correctOptionId:`B`,explanation:{en:`The ratio parts total 5+4+3=12, so each part is 3,600 ÷ 12 = 300 baht. Boon (4 parts) gets 4 × 300 = 1,200 baht. After the 480-baht lunch: 1,200 − 480 = 720 baht. At 50 baht per notebook: 720 ÷ 50 = 14 notebooks with 20 baht left over (14 × 50 = 700, remainder 20).`,th:`อัตราส่วนรวมกันได้ 5+4+3=12 ส่วน ดังนั้น 1 ส่วนเท่ากับ 3,600 ÷ 12 = 300 บาท บุญได้ 4 ส่วน คือ 4 × 300 = 1,200 บาท หลังจากเลี้ยงข้าว 480 บาท เหลือ 1,200 − 480 = 720 บาท ซื้อสมุดเล่มละ 50 บาท: 720 ÷ 50 = 14 เล่ม เหลือเงิน 20 บาท (14 × 50 = 700 เหลือเศษ 20)`},distractorNotes:{A:{en:`Miscalculates one ratio part as 250 baht instead of 300 (3,600 ÷ 12 done incorrectly), leading to 250×4−480=520, then 520÷50=10 remainder 20.`,th:`คำนวณ 1 ส่วนผิดเป็น 250 บาทแทนที่จะเป็น 300 (หาร 3,600 ÷ 12 ผิด) ทำให้ได้ 250×4−480=520 แล้ว 520÷50=10 เหลือเศษ 20`},C:{en:`Uses Anan's share (5 parts = 1,500 baht) instead of Boon's (4 parts), giving 1,500−480=1,020, then 1,020÷50=20 remainder 20.`,th:`ใช้ส่วนแบ่งของอนันต์ (5 ส่วน = 1,500 บาท) แทนที่จะเป็นของบุญ (4 ส่วน) ทำให้ได้ 1,500−480=1,020 แล้ว 1,020÷50=20 เหลือเศษ 20`},D:{en:`Forgets to subtract the 480-baht lunch spending, dividing the full 1,200-baht share by 50 directly: 1,200÷50=24, remainder 0.`,th:`ลืมหักเงินเลี้ยงข้าว 480 บาทออก นำเงินส่วนแบ่งเต็ม 1,200 บาทไปหาร 50 ตรงๆ: 1,200÷50=24 เหลือเศษ 0`}},hints:[{en:`First find how much money 1 ratio part is worth.`,th:`หาก่อนว่าอัตราส่วน 1 ส่วนมีค่าเท่ากับเงินเท่าไร`},{en:`Add the ratio numbers (5+4+3) to find the total number of parts, then divide the total bonus by that number.`,th:`บวกตัวเลขอัตราส่วน (5+4+3) เพื่อหาจำนวนส่วนทั้งหมด แล้วนำโบนัสทั้งหมดไปหารด้วยจำนวนส่วนนั้น`},{en:`Find Boon's share (4 parts), subtract the 480-baht lunch cost, then divide what remains by 50 to get notebooks and leftover money.`,th:`หาส่วนแบ่งของบุญ (4 ส่วน) หักค่าเลี้ยงข้าว 480 บาทออก แล้วนำเงินที่เหลือไปหารด้วย 50 เพื่อหาจำนวนสมุดและเงินที่เหลือ`}],visual:null,estimatedSeconds:90},{id:`C-09`,testId:`samsen-mock-c`,number:9,skill:`Geometry & Angles`,topic:{en:`Angle Chasing with Parallels`,th:`การหามุมเมื่อมีเส้นขนาน`},difficulty:I(9),prompt:{en:`In the diagram, path l₁ runs parallel to path m — two straight paths through a park. A triangular flower bed ABC has vertex A on path l₁, while vertices B and C both lie on path m. The angle at A (∠BAC) measures 48°. Path m is extended beyond C, and the angle between this extension and side CA measures 143°. What is the measure of ∠ABC (the angle at B)?`,th:`จากรูป ทางเดิน l₁ ขนานกับทางเดิน m ซึ่งเป็นทางเดินตรงสองเส้นในสวนสาธารณะ แปลงดอกไม้รูปสามเหลี่ยม ABC มีจุดยอด A อยู่บนทางเดิน l₁ ส่วนจุด B และ C อยู่บนทางเดิน m ทั้งคู่ มุมที่จุด A (∠BAC) มีขนาด 48° ต่อทางเดิน m ออกไปเลยจุด C มุมระหว่างส่วนต่อนี้กับด้าน CA มีขนาด 143° จงหาขนาดของ ∠ABC (มุมที่จุด B)`},options:[{id:`A`,label:{en:`37°`,th:`37°`}},{id:`B`,label:{en:`132°`,th:`132°`}},{id:`C`,label:{en:`143°`,th:`143°`}},{id:`D`,label:{en:`95°`,th:`95°`}}],correctOptionId:`D`,explanation:{en:`Since B, C, and the extension all lie on the straight path m, the exterior angle (143°) and interior ∠ACB are supplementary: ∠ACB = 180° − 143° = 37°. Using the triangle angle sum: ∠ABC = 180° − 48° − 37° = 95°.`,th:`เนื่องจาก B, C และส่วนต่อของทางเดินอยู่บนเส้นตรง m เดียวกัน มุมภายนอก (143°) กับมุมภายใน ∠ACB จึงรวมกันได้ 180°: ∠ACB = 180° − 143° = 37° จากนั้นใช้ผลรวมมุมภายในสามเหลี่ยม: ∠ABC = 180° − 48° − 37° = 95°`},distractorNotes:{A:{en:`Correctly finds ∠ACB = 37° but reports that angle instead of the ∠ABC the question actually asks for.`,th:`หา ∠ACB ได้ถูกต้องเป็น 37° แต่ตอบมุมนี้แทนที่จะเป็น ∠ABC ที่โจทย์ถาม`},B:{en:`Computes 180° − 48° = 132°, forgetting to also subtract ∠ACB — effectively ignoring the third angle of the triangle.`,th:`คำนวณ 180° − 48° = 132° โดยลืมลบ ∠ACB ออกด้วย ซึ่งเท่ากับละเลยมุมที่สามของสามเหลี่ยมไป`},C:{en:`Simply reports the given exterior angle (143°) directly, misreading which angle the question is asking for.`,th:`ตอบมุมภายนอกที่โจทย์ให้มา (143°) ตรงๆ โดยอ่านโจทย์ผิดว่าถามมุมใด`}},hints:[{en:`B, C, and the extension of path m all lie on the same straight line — what do angles on a straight line add up to?`,th:`B, C และส่วนต่อของทางเดิน m อยู่บนเส้นตรงเดียวกัน มุมบนเส้นตรงรวมกันได้เท่าไร`},{en:`Use the straight-line fact to find ∠ACB first (180° minus the given 143°), then you'll have two of the triangle's three angles.`,th:`ใช้ข้อเท็จจริงเรื่องเส้นตรงหา ∠ACB ก่อน (180° ลบด้วย 143° ที่โจทย์ให้) แล้วจะได้มุมสองในสามมุมของสามเหลี่ยม`},{en:`The three angles of triangle ABC add up to 180°. You know ∠BAC (48°) and can find ∠ACB (37°) — subtract both from 180° to get ∠ABC.`,th:`มุมทั้งสามของสามเหลี่ยม ABC รวมกันได้ 180° รู้ ∠BAC (48°) และหา ∠ACB ได้ (37°) นำทั้งสองไปลบออกจาก 180° จะได้ ∠ABC`}],visual:{kind:`geometryFigure`,width:250,height:200,segments:[{x1:10,y1:40,x2:240,y2:40,ticks:1},{x1:10,y1:170,x2:240,y2:170,ticks:1},{x1:39,y1:40,x2:50,y2:170},{x1:39,y1:40,x2:210,y2:170}],points:[{x:39,y:40,label:`A`,labelOffset:[-4,-8]},{x:50,y:170,label:`B`,labelOffset:[-14,14]},{x:210,y:170,label:`C`,labelOffset:[6,14]}],angleMarks:[{x:39,y:40,fromDeg:275,toDeg:323,radius:20,label:`48°`},{x:210,y:170,fromDeg:0,toDeg:143,radius:24,label:`143°`}],labels:[{x:20,y:30,text:`l₁`},{x:20,y:182,text:`m`}],alt:{en:`Two parallel horizontal paths l1 and m. Triangle ABC has vertex A on l1 and vertices B, C on m. The angle at A is marked 48 degrees, and the exterior angle at C (between path m extended and side CA) is marked 143 degrees.`,th:`ทางเดินขนานสองเส้นแนวนอน l1 และ m สามเหลี่ยม ABC มีจุดยอด A อยู่บน l1 และจุด B, C อยู่บน m มุมที่ A กำกับไว้ 48 องศา และมุมภายนอกที่ C (ระหว่างทางเดิน m ที่ต่อออกไปกับด้าน CA) กำกับไว้ 143 องศา`}},estimatedSeconds:85},{id:`C-10`,testId:`samsen-mock-c`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Equal-Volume Cylinders`,th:`ทรงกระบอกที่มีปริมาตรเท่ากัน`},difficulty:I(10),prompt:{en:`Cylindrical Silo A has a circular base with radius 6 m and stands 8 m tall. Silo B is 18 m tall and holds exactly the same volume of grain as Silo A. What is the radius of Silo B's circular base?`,th:`ยุ้งข้าวทรงกระบอก A มีฐานวงกลมรัศมี 6 เมตร สูง 8 เมตร ยุ้งข้าว B สูง 18 เมตร และจุปริมาตรข้าวเท่ากับยุ้งข้าว A พอดี ฐานวงกลมของยุ้งข้าว B มีรัศมีเท่าใด`},options:[{id:`A`,label:{en:`2.7 m`,th:`2.7 เมตร`}},{id:`B`,label:{en:`8 m`,th:`8 เมตร`}},{id:`C`,label:{en:`9 m`,th:`9 เมตร`}},{id:`D`,label:{en:`4 m`,th:`4 เมตร`}}],correctOptionId:`D`,explanation:{en:`Volume A = π × 6² × 8 = 288π. Since Volume B is equal: π × r² × 18 = 288π, so r² = 288 ÷ 18 = 16, giving r = 4 m.`,th:`ปริมาตร A = π × 6² × 8 = 288π เนื่องจากปริมาตร B เท่ากัน: π × r² × 18 = 288π จะได้ r² = 288 ÷ 18 = 16 ดังนั้น r = 4 เมตร`},distractorNotes:{A:{en:`Treats volume as if it scales linearly with radius (forgetting the r² in the volume formula): rB = rA×hA÷hB = 6×8÷18 ≈ 2.7.`,th:`เข้าใจผิดว่าปริมาตรแปรผันตรงกับรัศมีแบบเชิงเส้น (ลืม r² ในสูตรปริมาตร): rB = rA×hA÷hB = 6×8÷18 ≈ 2.7`},B:{en:`Uses Silo A's diameter (12 m) in place of its radius when setting up the equation, giving r² = 12²×8÷18 = 64, so r = 8.`,th:`ใช้เส้นผ่านศูนย์กลางของยุ้ง A (12 เมตร) แทนรัศมีตอนตั้งสมการ ทำให้ได้ r² = 12²×8÷18 = 64 ดังนั้น r = 8`},C:{en:`Sets up the equation with the heights swapped (rB² = rA²×hB÷hA instead of ÷hB), giving r² = 36×18÷8 = 81, so r = 9.`,th:`ตั้งสมการโดยสลับความสูง (rB² = rA²×hB÷hA แทนที่จะหารด้วย hB) ทำให้ได้ r² = 36×18÷8 = 81 ดังนั้น r = 9`}},hints:[{en:`Both silos hold the same volume — write the volume formula for each and set them equal.`,th:`ยุ้งข้าวทั้งสองจุปริมาตรเท่ากัน ลองเขียนสูตรปริมาตรของแต่ละยุ้งแล้วให้เท่ากัน`},{en:`Volume of a cylinder = π × radius² × height. The π on both sides will cancel out.`,th:`ปริมาตรทรงกระบอก = π × รัศมี² × ความสูง ค่า π ทั้งสองข้างจะตัดกันได้`},{en:`From π×6²×8 = π×r²×18, cancel π, then solve r² = (6²×8)÷18 and take the square root.`,th:`จาก π×6²×8 = π×r²×18 ตัด π ออก แล้วแก้สมการ r² = (6²×8)÷18 จากนั้นถอดรากที่สอง`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:12,height:8,label:`Silo A`},{baseSide:8,height:18,label:`Silo B`}],alt:{en:`Two cylindrical silos: Silo A is wide and short (radius 6 m, height 8 m); Silo B is narrow and tall (height 18 m, unknown radius), holding the same volume.`,th:`ยุ้งข้าวทรงกระบอกสองใบ: ยุ้ง A ฐานกว้างและเตี้ย (รัศมี 6 เมตร สูง 8 เมตร) ยุ้ง B ฐานแคบและสูง (สูง 18 เมตร รัศมีไม่ทราบค่า) จุปริมาตรเท่ากัน`}},estimatedSeconds:95},{id:`C-11`,testId:`samsen-mock-c`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area`,th:`พื้นที่รูปประกอบ`},difficulty:I(11),prompt:{en:`A workshop's rectangular floor is 16 m by 10 m. To fit around a support pillar, the top-right corner is sliced off in a straight diagonal cut, removing a right-triangular corner that measures 6 m along the top edge and 4 m down the side edge (shaded region shows what remains). What is the area of the remaining pentagon-shaped floor?`,th:`พื้นโรงงานรูปสี่เหลี่ยมผืนผ้ากว้าง 16 เมตร ยาว 10 เมตร เพื่อให้เว้นพื้นที่รอบเสาค้ำ จึงตัดมุมบนขวาออกเป็นเส้นทแยงตรง โดยตัดเป็นรูปสามเหลี่ยมมุมฉากซึ่งด้านบนยาว 6 เมตร และด้านข้างยาว 4 เมตร (พื้นที่แรเงาคือส่วนที่เหลือ) พื้นรูปห้าเหลี่ยมที่เหลือมีพื้นที่เท่าใด`},options:[{id:`A`,label:{en:`172 m²`,th:`172 ตร.ม.`}},{id:`B`,label:{en:`160 m²`,th:`160 ตร.ม.`}},{id:`C`,label:{en:`148 m²`,th:`148 ตร.ม.`}},{id:`D`,label:{en:`136 m²`,th:`136 ตร.ม.`}}],correctOptionId:`C`,explanation:{en:`Rectangle area = 16 × 10 = 160 m². The cut-off triangle has area = (6 × 4) ÷ 2 = 12 m². Remaining shaded area = 160 − 12 = 148 m².`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 16 × 10 = 160 ตร.ม. รูปสามเหลี่ยมที่ตัดออกมีพื้นที่ = (6 × 4) ÷ 2 = 12 ตร.ม. พื้นที่ส่วนที่เหลือ (แรเงา) = 160 − 12 = 148 ตร.ม.`},distractorNotes:{A:{en:`Adds the triangle's area instead of subtracting it: 160 + 12 = 172.`,th:`นำพื้นที่สามเหลี่ยมไปบวกแทนที่จะลบ: 160 + 12 = 172`},B:{en:`Reports the full rectangle's area, forgetting the corner was cut off at all: 16 × 10 = 160.`,th:`ตอบพื้นที่สี่เหลี่ยมผืนผ้าเต็มรูป ลืมไปว่ามุมถูกตัดออกไปแล้ว: 16 × 10 = 160`},D:{en:`Forgets to halve the triangle's area (uses 6 × 4 = 24 instead of 12), giving 160 − 24 = 136.`,th:`ลืมหารพื้นที่สามเหลี่ยมด้วย 2 (ใช้ 6 × 4 = 24 แทนที่จะเป็น 12) ทำให้ได้ 160 − 24 = 136`}},hints:[{en:`The shaded shape is the rectangle with a triangular corner missing.`,th:`รูปแรเงาคือสี่เหลี่ยมผืนผ้าที่ขาดมุมสามเหลี่ยมไปหนึ่งมุม`},{en:`Find the full rectangle's area and the cut-off triangle's area separately.`,th:`หาพื้นที่สี่เหลี่ยมผืนผ้าเต็มรูปและพื้นที่สามเหลี่ยมที่ตัดออกแยกกันก่อน`},{en:`Remaining area = rectangle area − triangle area = (16×10) − (6×4÷2).`,th:`พื้นที่ที่เหลือ = พื้นที่สี่เหลี่ยม − พื้นที่สามเหลี่ยม = (16×10) − (6×4÷2)`}],visual:{kind:`geometryFigure`,width:160,height:100,showGrid:!0,gridStep:20,segments:[{x1:100,y1:0,x2:160,y2:0,style:`dashed`},{x1:160,y1:0,x2:160,y2:40,style:`dashed`}],polygons:[{points:[[0,0],[100,0],[160,40],[160,100],[0,100]],fill:`shaded`}],labels:[{x:80,y:-6,text:`16 m`,bold:!0},{x:-10,y:50,text:`10 m`,bold:!0},{x:130,y:12,text:`6 m`},{x:172,y:22,text:`4 m`}],alt:{en:`A 16 m by 10 m rectangle with the top-right corner cut off by a diagonal (a 6 m by 4 m right triangle removed), leaving a shaded pentagon.`,th:`สี่เหลี่ยมผืนผ้า 16x10 เมตร ตัดมุมบนขวาด้วยเส้นทแยง (ตัดสามเหลี่ยมมุมฉาก 6x4 เมตรออก) เหลือเป็นรูปห้าเหลี่ยมแรเงา`}},estimatedSeconds:110},{id:`C-12`,testId:`samsen-mock-c`,number:12,skill:`Geometry & Angles`,topic:{en:`Zigzag Angles Between Parallels`,th:`มุมหักมุมระหว่างเส้นขนาน`},difficulty:I(12),prompt:{en:`Lines l₁ and l₂ are parallel walking paths through a park. A zigzag path goes from point A on l₁, bends at point P between the two paths, and continues to point B on l₂. The angle between l₁ and AP (at A) is (2x + 10)°, the angle between l₂ and PB (at B) is (3x − 5)°, and the bend angle at P (∠APB) is 105°. Find the value of the angle at B, (3x − 5)°.`,th:`เส้น l₁ และ l₂ เป็นทางเดินที่ขนานกันในสวนสาธารณะ ทางเดินหักมุมจากจุด A บน l₁ หักที่จุด P ซึ่งอยู่ระหว่างทางเดินทั้งสอง แล้วไปถึงจุด B บน l₂ มุมระหว่าง l₁ กับ AP (ที่จุด A) เท่ากับ (2x + 10)° มุมระหว่าง l₂ กับ PB (ที่จุด B) เท่ากับ (3x − 5)° และมุมหัก ณ จุด P (∠APB) เท่ากับ 105° จงหาค่ามุมที่จุด B คือ (3x − 5)°`},options:[{id:`A`,label:{en:`55°`,th:`55°`}},{id:`B`,label:{en:`50°`,th:`50°`}},{id:`C`,label:{en:`49°`,th:`49°`}},{id:`D`,label:{en:`20°`,th:`20°`}}],correctOptionId:`A`,explanation:{en:`For a bend between two parallel lines, the bend angle equals the sum of the two marked angles: (2x+10) + (3x−5) = 105. This gives 5x + 5 = 105, so 5x = 100 and x = 20. The angle at B is 3(20) − 5 = 55°.`,th:`สำหรับทางเดินที่หักมุมระหว่างเส้นขนานสองเส้น มุมหักจะเท่ากับผลรวมของมุมที่กำกับไว้ทั้งสอง: (2x+10) + (3x−5) = 105 จะได้ 5x + 5 = 105 ดังนั้น 5x = 100 และ x = 20 มุมที่จุด B คือ 3(20) − 5 = 55°`},distractorNotes:{B:{en:`Solves for x correctly (x=20) but reports the angle at A, (2x+10) = 50°, instead of the angle at B that the question asks for.`,th:`แก้หาค่า x ได้ถูกต้อง (x=20) แต่ตอบมุมที่จุด A คือ (2x+10) = 50° แทนที่จะเป็นมุมที่จุด B ที่โจทย์ถาม`},C:{en:`Makes a sign error combining the constants (+10 and −5 mistakenly combined as +15 instead of +5), getting 5x+15=105, x=18, then 3(18)−5=49.`,th:`คำนวณเครื่องหมายผิดตอนรวมค่าคงที่ (+10 กับ −5 บวกผิดเป็น +15 แทนที่จะเป็น +5) ได้ 5x+15=105, x=18 แล้ว 3(18)−5=49`},D:{en:`Solves correctly for x = 20 but reports x itself instead of substituting it back into (3x−5) to find the angle.`,th:`แก้หาค่า x ได้ถูกต้องเป็น 20 แต่ตอบค่า x เฉยๆ โดยไม่แทนกลับเข้าไปใน (3x−5) เพื่อหาค่ามุม`}},hints:[{en:`When a path bends between two parallel lines, there is a special relationship linking the bend angle to the two marked angles.`,th:`เมื่อทางเดินหักมุมระหว่างเส้นขนานสองเส้น จะมีความสัมพันธ์พิเศษระหว่างมุมหักกับมุมที่กำกับไว้ทั้งสอง`},{en:`The bend angle equals the sum of the angle at A and the angle at B: (2x+10) + (3x−5) = 105.`,th:`มุมหักเท่ากับผลรวมของมุมที่ A กับมุมที่ B: (2x+10) + (3x−5) = 105`},{en:`Solve the equation for x first, then substitute x back into (3x − 5) — do not stop at finding x.`,th:`แก้สมการหาค่า x ก่อน แล้วแทนค่า x กลับเข้าไปใน (3x − 5) อย่าหยุดแค่หาค่า x`}],visual:{kind:`geometryFigure`,width:250,height:200,segments:[{x1:10,y1:40,x2:240,y2:40,ticks:1},{x1:10,y1:170,x2:240,y2:170,ticks:1},{x1:195,y1:40,x2:140,y2:105},{x1:140,y1:105,x2:186,y2:170}],points:[{x:195,y:40,label:`A`,labelOffset:[6,-8]},{x:140,y:105,label:`P`,labelOffset:[-16,0]},{x:186,y:170,label:`B`,labelOffset:[8,14]}],angleMarks:[{x:195,y:40,fromDeg:180,toDeg:230,radius:22,label:`(2x+10)°`},{x:186,y:170,fromDeg:125,toDeg:180,radius:22,label:`(3x-5)°`},{x:140,y:105,fromDeg:-55,toDeg:50,radius:18,label:`105°`}],labels:[{x:20,y:30,text:`l₁`},{x:20,y:182,text:`l₂`}],alt:{en:`Two parallel horizontal paths l1 (top) and l2 (bottom). A zigzag path runs from A on l1, bends at P between the lines, then to B on l2, with the angle at A, the angle at B, and the bend angle at P all marked.`,th:`ทางเดินขนานแนวนอนสองเส้น l1 (บน) และ l2 (ล่าง) ทางเดินหักมุมจาก A บน l1 หักที่ P ระหว่างเส้น แล้วไปยัง B บน l2 โดยกำกับมุมที่ A มุมที่ B และมุมหักที่ P ไว้ทั้งหมด`}},estimatedSeconds:130},{id:`C-13`,testId:`samsen-mock-c`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Concentric Circle Ratio`,th:`อัตราส่วนวงกลมร่วมศูนย์`},difficulty:I(13),prompt:{en:`Two concentric circles are painted on a workshop floor as a safety marking. The area of the ring between the two circles is 8 times the area of the inner circle. What is the ratio of the outer radius to the inner radius (R : r)?`,th:`มีการทาสีวงกลมร่วมศูนย์สองวงบนพื้นโรงงานเพื่อเป็นเครื่องหมายความปลอดภัย พื้นที่วงแหวนระหว่างวงกลมทั้งสองเป็น 8 เท่าของพื้นที่วงกลมวงใน อัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน (R : r) เท่ากับเท่าใด`},options:[{id:`A`,label:{en:`1 : 3`,th:`1 : 3`}},{id:`B`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`C`,label:{en:`8 : 1`,th:`8 : 1`}},{id:`D`,label:{en:`9 : 1`,th:`9 : 1`}}],correctOptionId:`B`,explanation:{en:`Ring area = πR² − πr² = 8 × πr², so R² − r² = 8r², giving R² = 9r². Taking the square root: R = 3r, so R : r = 3 : 1.`,th:`พื้นที่วงแหวน = πR² − πr² = 8 × πr² จะได้ R² − r² = 8r² ดังนั้น R² = 9r² ถอดรากที่สอง: R = 3r ดังนั้น R : r = 3 : 1`},distractorNotes:{A:{en:`Finds the correct ratio but reports it backwards (r : R instead of R : r).`,th:`หาอัตราส่วนได้ถูกต้อง แต่เขียนกลับด้าน (r : R แทนที่จะเป็น R : r)`},C:{en:`Uses the given multiplier (8) directly as the radius ratio, forgetting that area scales with the square of the radius, not the radius itself.`,th:`นำตัวคูณที่โจทย์ให้ (8) มาใช้เป็นอัตราส่วนรัศมีตรงๆ ลืมไปว่าพื้นที่แปรผันตามกำลังสองของรัศมี ไม่ใช่รัศมีโดยตรง`},D:{en:`Correctly finds R² = 9r² but forgets to take the square root, reporting the ratio of the squares instead of the ratio of the radii.`,th:`หา R² = 9r² ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงตอบอัตราส่วนของพื้นที่ (กำลังสอง) แทนที่จะเป็นอัตราส่วนของรัศมี`}},hints:[{en:`The ring is the outer circle with the inner circle removed — write its area as a subtraction.`,th:`วงแหวนคือวงกลมวงนอกที่หักวงกลมวงในออก ลองเขียนพื้นที่ในรูปการลบ`},{en:`Ring area = πR² − πr². Set this equal to 8 times the inner circle's area (8πr²) and simplify — the π cancels.`,th:`พื้นที่วงแหวน = πR² − πr² ให้เท่ากับ 8 เท่าของพื้นที่วงกลมวงใน (8πr²) แล้วตัดทอน — π จะตัดกันได้`},{en:`You should reach R² = 9r². Take the square root of both sides to find the ratio of R to r.`,th:`คุณควรได้ R² = 9r² ถอดรากที่สองทั้งสองข้างเพื่อหาอัตราส่วนของ R ต่อ r`}],visual:{kind:`concentricCircles`,outerRadius:30,innerRadius:10,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles: an inner circle of radius r and an outer circle of radius R, with the ring between them shaded.`,th:`วงกลมร่วมศูนย์สองวง: วงในรัศมี r และวงนอกรัศมี R โดยแรเงาบริเวณวงแหวนระหว่างสองวง`}},estimatedSeconds:100},{id:`C-14`,testId:`samsen-mock-c`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Leaf-Shaped Region`,th:`พื้นที่รูปใบไม้`},difficulty:I(14),prompt:{en:`A square paving tile has side length 14 cm. Two quarter-circle arcs, each with radius equal to the tile's side length, are drawn from two opposite corners of the tile, overlapping to form a shaded leaf-shaped design in the middle (shown). Using π = \\frac{22}{7}, find the area of the shaded leaf shape.`,th:`กระเบื้องปูพื้นรูปสี่เหลี่ยมจัตุรัสมีด้านยาว 14 ซม. เขียนส่วนโค้งหนึ่งในสี่วงกลมสองเส้น รัศมีเท่ากับความยาวด้านของกระเบื้อง จากมุมตรงข้ามกันสองมุม ทับกันเป็นลวดลายรูปใบไม้แรเงาตรงกลาง (ดังรูป) กำหนด π = \\frac{22}{7} จงหาพื้นที่ของรูปใบไม้ที่แรเงา`},options:[{id:`A`,label:{en:`448 cm²`,th:`448 ตร.ซม.`}},{id:`B`,label:{en:`308 cm²`,th:`308 ตร.ซม.`}},{id:`C`,label:{en:`154 cm²`,th:`154 ตร.ซม.`}},{id:`D`,label:{en:`112 cm²`,th:`112 ตร.ซม.`}}],correctOptionId:`D`,explanation:{en:`Each quarter circle has area (\\frac{1}{4})π(14)² = (\\frac{1}{4})(\\frac{22}{7})(196) = 154 cm². Two quarter circles together cover 308 cm², but this double-counts the square tile's area once, so the leaf area = 308 − 196 = 112 cm².`,th:`หนึ่งในสี่วงกลมแต่ละวงมีพื้นที่ = (\\frac{1}{4})π(14)² = (\\frac{1}{4})(\\frac{22}{7})(196) = 154 ตร.ซม. สองวงรวมกันได้ 308 ตร.ซม. แต่เป็นการนับพื้นที่กระเบื้องซ้อนทับหนึ่งครั้ง จึงต้องลบพื้นที่กระเบื้อง (196 ตร.ซม.) ออก: พื้นที่ใบไม้ = 308 − 196 = 112 ตร.ซม.`},distractorNotes:{A:{en:`Mistakenly doubles the side length to use as the radius (28 cm instead of 14 cm), giving r²(π/2−1) = 784×(\\frac{4}{7}) = 448.`,th:`เข้าใจผิดว่ารัศมีต้องเป็นสองเท่าของด้าน (28 ซม. แทนที่จะเป็น 14 ซม.) ทำให้ได้ r²(π/2−1) = 784×(\\frac{4}{7}) = 448`},B:{en:`Adds the two quarter-circle areas together (308 cm²) but forgets to subtract the overlapping square tile area.`,th:`นำพื้นที่หนึ่งในสี่วงกลมสองวงมาบวกกัน (308 ตร.ซม.) แต่ลืมลบพื้นที่กระเบื้องส่วนที่ซ้อนทับออก`},C:{en:`Uses only one quarter circle's area (154 cm²), forgetting the leaf shape is formed by two overlapping quarter circles.`,th:`ใช้พื้นที่หนึ่งในสี่วงกลมเพียงวงเดียว (154 ตร.ซม.) ลืมไปว่ารูปใบไม้เกิดจากหนึ่งในสี่วงกลมสองวงทับกัน`}},hints:[{en:`The leaf shape is where the two quarter circles overlap — think about what happens when you add their two areas together.`,th:`รูปใบไม้คือส่วนที่หนึ่งในสี่วงกลมสองวงทับซ้อนกัน ลองคิดว่าเกิดอะไรขึ้นเมื่อนำพื้นที่ทั้งสองมาบวกกัน`},{en:`Adding the two quarter-circle areas counts the whole square tile's area twice — you need to subtract it back out once.`,th:`การบวกพื้นที่หนึ่งในสี่วงกลมทั้งสองทำให้พื้นที่กระเบื้องทั้งแผ่นถูกนับซ้ำสองครั้ง ต้องลบออกหนึ่งครั้ง`},{en:`Leaf area = (2 × quarter-circle area) − square area = (2 × 154) − 196.`,th:`พื้นที่ใบไม้ = (2 × พื้นที่หนึ่งในสี่วงกลม) − พื้นที่สี่เหลี่ยมจัตุรัส = (2 × 154) − 196`}],visual:{kind:`leafShape`,width:14,height:14,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A square tile with two overlapping quarter-circle arcs from opposite corners, forming a shaded leaf shape in the middle.`,th:`กระเบื้องรูปสี่เหลี่ยมจัตุรัสมีส่วนโค้งหนึ่งในสี่วงกลมสองเส้นจากมุมตรงข้ามทับกัน เกิดเป็นรูปใบไม้แรเงาตรงกลาง`}},estimatedSeconds:120},{id:`C-15`,testId:`samsen-mock-c`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a Remainder`,th:`เศษส่วนของส่วนที่เหลือ`},difficulty:I(15),prompt:{en:`A water tank holds 480 litres when full. On Monday, a factory used \\frac{3}{8} of the tank. On Tuesday, it used \\frac{2}{5} of what remained. How many litres more water were used on Monday than on Tuesday?`,th:`ถังน้ำใบหนึ่งจุน้ำได้ 480 ลิตรเมื่อเต็มถัง วันจันทร์โรงงานใช้น้ำไป \\frac{3}{8} ของถัง วันอังคารใช้น้ำไป \\frac{2}{5} ของส่วนที่เหลือ วันจันทร์ใช้น้ำมากกว่าวันอังคารกี่ลิตร`},options:[{id:`A`,label:{en:`300 litres`,th:`300 ลิตร`}},{id:`B`,label:{en:`180 litres`,th:`180 ลิตร`}},{id:`C`,label:{en:`60 litres`,th:`60 ลิตร`}},{id:`D`,label:{en:`12 litres`,th:`12 ลิตร`}}],correctOptionId:`C`,explanation:{en:`Monday's use = \\frac{3}{8} × 480 = 180 litres, leaving 480 − 180 = 300 litres. Tuesday's use = \\frac{2}{5} × 300 = 120 litres. The difference: 180 − 120 = 60 litres.`,th:`วันจันทร์ใช้น้ำ = \\frac{3}{8} × 480 = 180 ลิตร เหลือ 480 − 180 = 300 ลิตร วันอังคารใช้น้ำ = \\frac{2}{5} × 300 = 120 ลิตร ผลต่าง: 180 − 120 = 60 ลิตร`},distractorNotes:{A:{en:`Adds Monday's and Tuesday's usage instead of subtracting: 180 + 120 = 300, misreading "how many more" as "how many in total."`,th:`นำการใช้น้ำวันจันทร์และวันอังคารมาบวกกันแทนการลบ: 180 + 120 = 300 อ่านโจทย์ "มากกว่ากี่ลิตร" ผิดเป็น "รวมกันกี่ลิตร"`},B:{en:`Reports the amount of water left in the tank after both days (300 − 120 = 180) instead of the difference the question asks for.`,th:`ตอบปริมาณน้ำที่เหลือในถังหลังใช้ไปสองวัน (300 − 120 = 180) แทนที่จะเป็นผลต่างที่โจทย์ถาม`},D:{en:`Computes Tuesday's usage as \\frac{2}{5} of the original 480 litres instead of \\frac{2}{5} of the 300-litre remainder: \\frac{2}{5} × 480 = 192, then |180 − 192| = 12.`,th:`คำนวณการใช้น้ำวันอังคารเป็น \\frac{2}{5} ของ 480 ลิตรเดิม แทนที่จะเป็น \\frac{2}{5} ของส่วนที่เหลือ 300 ลิตร: \\frac{2}{5} × 480 = 192 แล้ว |180 − 192| = 12`}},hints:[{en:`Work out Monday's usage and the remaining water first, before touching Tuesday.`,th:`หาปริมาณน้ำที่ใช้วันจันทร์และปริมาณน้ำที่เหลือก่อน ค่อยไปคำนวณวันอังคาร`},{en:`Tuesday's fraction (\\frac{2}{5}) applies to what was LEFT after Monday, not to the original full tank.`,th:`เศษส่วนของวันอังคาร (\\frac{2}{5}) ใช้กับปริมาณน้ำที่เหลือหลังวันจันทร์ ไม่ใช่กับน้ำเต็มถังตอนแรก`},{en:`Find Monday's litres (\\frac{3}{8} × 480), then the remainder (480 minus that), then Tuesday's litres (\\frac{2}{5} of the remainder), then subtract Tuesday from Monday.`,th:`หาลิตรของวันจันทร์ (\\frac{3}{8} × 480) แล้วหาส่วนที่เหลือ (480 ลบด้วยค่านั้น) แล้วหาลิตรวันอังคาร (\\frac{2}{5} ของส่วนที่เหลือ) แล้วนำวันจันทร์ลบวันอังคาร`}],visual:null,estimatedSeconds:105},{id:`C-16`,testId:`samsen-mock-c`,number:16,skill:`Algebra & Patterns`,topic:{en:`Cut-Corner Area Equation`,th:`สมการพื้นที่จากมุมที่ถูกตัด`},difficulty:I(16),prompt:{en:`A square sheet of plywood has side length 16 cm. A carpenter cuts a small right-triangle off each of the 4 corners; both legs of every triangle are the same length, x cm. After the 4 corners are removed, the remaining octagonal piece (shaded) has an area of 224 cm². Find the value of x.`,th:`แผ่นไม้อัดรูปสี่เหลี่ยมจัตุรัสมีด้านยาว 16 ซม. ช่างไม้ตัดรูปสามเหลี่ยมมุมฉากเล็กๆ ออกจากมุมทั้ง 4 มุม โดยด้านประกอบมุมฉากทั้งสองด้านของสามเหลี่ยมทุกรูปยาวเท่ากันคือ x ซม. หลังจากตัดมุมทั้ง 4 ออกแล้ว ชิ้นแปดเหลี่ยมที่เหลือ (แรเงา) มีพื้นที่ 224 ตร.ซม. จงหาค่า x`},options:[{id:`A`,label:{en:`2 cm`,th:`2 ซม.`}},{id:`B`,label:{en:`4 cm`,th:`4 ซม.`}},{id:`C`,label:{en:`5.7 cm`,th:`5.7 ซม.`}},{id:`D`,label:{en:`8 cm`,th:`8 ซม.`}}],correctOptionId:`B`,explanation:{en:`Each corner triangle has area \\frac{x²}{2}, and there are 4 of them, so total area removed = 4 × \\frac{x²}{2} = 2x². The equation is: 16² − 2x² = 224, so 256 − 2x² = 224, giving 2x² = 32, x² = 16, and x = 4 cm.`,th:`สามเหลี่ยมมุมหนึ่งมีพื้นที่ \\frac{x²}{2} และมีทั้งหมด 4 มุม พื้นที่ที่ตัดออกทั้งหมด = 4 × \\frac{x²}{2} = 2x² ตั้งสมการ: 16² − 2x² = 224 จะได้ 256 − 2x² = 224 ดังนั้น 2x² = 32 หรือ x² = 16 ดังนั้น x = 4 ซม.`},distractorNotes:{A:{en:`Finds the correct x = 4 but then mistakenly halves it, confusing the leg length with half of something in the figure.`,th:`หาค่า x = 4 ได้ถูกต้อง แต่นำไปหาร 2 อีกครั้งโดยไม่ตั้งใจ สับสนระหว่างความยาวด้านกับค่าครึ่งหนึ่งของบางส่วนในรูป`},C:{en:`Finds the length of the hypotenuse of the cut-off triangle (x√2 ≈ 5.7 cm) instead of the leg length x that the question asks for.`,th:`หาความยาวด้านตรงข้ามมุมฉากของสามเห

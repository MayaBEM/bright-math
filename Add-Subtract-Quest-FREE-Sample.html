    else if (step === 3) { say = 'Here are <em>all the ways</em> to make 10.'; body = `<div class="eqs" style="width:min(100%,520px)">${Array.from({ length: 11 }, (_, k) => { const a = 10 - k; return `<div style="display:grid;grid-template-columns:1fr 5.5ch;gap:12px;align-items:center;opacity:${k < shown ? 1 : 0};transition:opacity .3s"><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:3px">${Array.from({ length: 10 }, (_, j) => `<i style="height:20px;border-radius:3px;background:${j < a ? 'var(--wc)' : 'var(--ink)'}"></i>`).join('')}</div><span style="font-size:20px;text-align:left">${a} + ${10 - a}</span></div>`; }).join('')}</div>`; next = shown >= 11; }
    else if (step === 4) { say = tryDone ? 'Yes! <em>4</em> and <span class="b2">6</span> make 10.' : 'Your turn. How many more to make 10?'; body = `<div class="slot-area" id="try"></div>`; next = tryDone; }
    else { say = 'To make 10, look at the <em>empty boxes</em>. That is the partner number.'; body = `<div class="tf2-row">${[[9, 1], [5, 5], [2, 8]].map(([a, b]) => `<div class="vz">${Viz.tenFrame(a, b, { small: true })}<div class="cap">${a} + ${b} = 10</div></div>`).join('')}</div>`; }
    main.innerHTML = shell(lv, 'learn', `<section class="card"><div class="kicker">Learn · Step ${step + 1} of ${N}</div>${step === 0 ? `<p class="goal">Goal: ${esc(lv.goal)}</p>` : ''}
      <div class="say-row"><p class="say">${say}</p>${listenBtn(say.replace(/<[^>]+>/g, ''))}</div>${body}
      <div class="learn-nav"><button class="btn ghost" data-a="back" ${step ? '' : 'disabled'}>← Back</button><div class="dots">${Array.from({ length: N }, (_, k) => `<i class="${k === step ? 'on' : ''}"></i>`).join('')}</div>
      ${step === N - 1 ? '<button class="btn" data-a="practice">Start Practice →</button>' : `<button class="btn" data-a="next" ${next ? '' : 'disabled'}>Next →</button>`}</div></section>`);
    if (step === 1) main.querySelectorAll('.tf .c.tap').forEach(c => c.onclick = () => { if (filled < 3) { filled++; draw(); } });
    if (step === 3 && shown < 11) { const t = setInterval(() => { if (step !== 3 || !main.querySelector('.eqs')) return clearInterval(t); shown++; const rows = main.querySelectorAll('.eqs > div'); rows.forEach((r, k) => r.style.opacity = k < shown ? 1 : 0); if (shown >= 11) { clearInterval(t); const b = main.querySelector('[data-a=next]'); if (b) b.disabled = false; } }, 200); }
    if (step === 4 && !tryDone) runTask(main.querySelector('#try'), { kind: 'missing', tokens: [4, '+', '?', '=', 10], answer: 6, hint: { type: 'tenframe', a: 4, b: 6 }, fact: [4, 6] }, 'learn', () => { tryDone = true; draw(); });
    if (step === 4 && tryDone) main.querySelector('#try').innerHTML = Viz.tenFrame(4, 6);
    main.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const a = b.dataset.a; if (a === 'next') { step++; draw(); } if (a === 'back') { step--; draw(); } if (a === 'practice') { LP(lv.id).learn = true; save(); go('level', lv.id, 'practice'); } });
  }
  draw();
}

/* ---------------- PRACTICE ---------------- */
const GAME_NAMES = { pairs: 'Make 10 Pairs', match: 'Match Up', missing: 'Missing Number', hop: 'Number Line Hop', tf: 'True or False', word: 'Word Problem', family: 'Fact Family House', column: 'Column Builder', choice: 'Think It Through', round: 'Rounding' };
function makeTasks(lv, kinds, src) {
  const out = [], seen = new Set();
  for (const k of kinds) {
    let q, key, n = 0;
    do { q = lv.gen(R, k, src); key = JSON.stringify([q.tokens, q.nums, q.left, q.right, q.text, q.prompt, q.start, q.tiles, q.cards && q.cards.map(c => c.label)]); } while (seen.has(key) && ++n < 30);
    seen.add(key); q.gameKind = k; out.push(q);
  }
  return out;
}
function Practice(lv) {
  const tasks = makeTasks(lv, lv.practice, 'app');
  let i = 0, first = 0;
  const draw = () => {
    const q = tasks[i];
    let gname = GAME_NAMES[q.gameKind] || GAME_NAMES[q.kind];
    if (q.kind === 'pairs' && q.target !== 10) gname = `Make ${q.target} Pairs`;
    main.innerHTML = shell(lv, 'practice', `<section class="card"><div class="prow"><span>${i + 1} / ${tasks.length}</span><div class="progress"><i style="width:${i / tasks.length * 100}%"></i></div></div><span class="game-name">${gname}</span><div class="slot-area" id="task"></div></section>`);
    runTask(main.querySelector('#task'), q, 'practice', ok => { if (ok) first++; i++; if (i < tasks.length) draw(); else done(); });
  };
  const done = () => {
    LP(lv.id).practice = true; save();
    main.innerHTML = shell(lv, 'practice', `<section class="card"><div class="kicker">Practice complete</div><p class="say">Nice work on <em>${esc(lv.name)}</em>!</p>
      <div class="score">${first} / ${tasks.length}</div><p class="note">Right on the first try. The Boss Round has 12 questions${S().bossTimer ? ' and a clock' : ''}.</p>
      <div class="row center"><button class="btn ghost" data-go="level" data-arg="${lv.id}" data-arg2="practice">Practice again</button><button class="btn" data-go="level" data-arg="${lv.id}" data-arg2="boss">Go to Boss Round →</button></div></section>`);
  };
  draw();
}

/* ---------------- BOSS ---------------- */
function Boss(lv) {
  const T = lv.bossTime, timed = S().bossTimer;
  main.innerHTML = shell(lv, 'boss', `<section class="card"><div class="boss-badge">12</div><p class="say">Boss Round: <em>${esc(lv.name)}</em></p>
    <div class="rules"><div><b>12</b>questions</div><div><b>${timed ? Math.floor(T / 60) + ':' + String(T % 60).padStart(2, '0') : 'No clock'}</b>${timed ? 'on the clock' : 'take your time'}</div><div><b>8</b>correct to pass</div></div>
    <p class="note">3 stars: all 12 correct · 2 stars: 10 or 11 · 1 star: 8 or 9</p><button class="btn" id="go">Start Boss Round</button></section>`);
  $('#go').onclick = () => bossRun(lv);
}
function bossRun(lv) {
  const kinds = Array.from({ length: 12 }, (_, k) => lv.boss[k % lv.boss.length]);
  const qs = R.shuffle(makeTasks(lv, kinds, 'app'));
  const T = lv.bossTime, timed = S().bossTimer, t0 = Date.now();
  let i = 0, score = 0, over = false;
  const clock = () => { const left = Math.max(0, T - Math.floor((Date.now() - t0) / 1000)); return { left, txt: `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` }; };
  const draw = () => {
    const c = clock();
    main.innerHTML = shell(lv, 'boss', `<section class="card"><div class="prow"><span>${i + 1} / 12</span><div class="progress"><i id="tbar" style="width:${timed ? c.left / T * 100 : i / 12 * 100}%"></i></div>${timed ? `<span class="timer" id="clock">${c.txt}</span>` : ''}</div><span class="game-name">Boss Round</span><div class="slot-area" id="task"></div></section>`);
    runTask(main.querySelector('#task'), qs[i], 'boss', ok => { if (over) return; if (ok) score++; i++; if (i < 12) draw(); else finish(false); });
  };
  const finish = timeUp => {
    if (over) return; over = true; clearInterval(timer); timer = null; padFn = null;
    const k = score === 12 ? 3 : score >= 10 ? 2 : score >= 8 ? 1 : 0;
    const p = LP(lv.id), wasLocked = nextOf(lv) && !isOpen(nextOf(lv));
    if (k > p.stars) p.stars = k; if (score > p.best) p.best = score; save();
    const nx = nextOf(lv), opened = k && nx && wasLocked && isOpen(nx);
    const used = Math.min(T, Math.round((Date.now() - t0) / 1000));
    main.innerHTML = shell(lv, 'boss', `<section class="card"><div class="kicker">${timeUp ? 'Time is up' : 'Boss Round complete'}</div><div class="bigstars" aria-label="${k} of 3 stars">${stars(k)}</div>
      <div class="score">${score} / 12</div>${timed ? `<p class="note">Time: ${Math.floor(used / 60)}:${String(used % 60).padStart(2, '0')}</p>` : ''}
      <p class="say">${k ? (opened ? `Level ${nx.n} is open: <em>${esc(nx.name)}</em>` : nx ? 'You passed!' : `You finished World ${lv.world}!`) : 'So close! You need 8 to pass.'}</p>
      <div class="row center"><button class="btn ghost" data-go="level" data-arg="${lv.id}" data-arg2="learn">Review Learn</button><button class="btn ghost" id="again">Try again</button>${k && nx ? `<button class="btn" data-go="level" data-arg="${nx.id}">Next level →</button>` : `<button class="btn" data-go="map" data-arg="${lv.world}">Back to map</button>`}</div></section>`);
    $('#again').onclick = () => bossRun(lv);
  };
  if (timed) timer = setInterval(() => { const c = clock(); const el = $('#clock'), b = $('#tbar'); if (el) { el.textContent = c.txt; el.classList.toggle('low', c.left <= 20); } if (b) b.style.width = c.left / T * 100 + '%'; if (c.left === 0) finish(true); }, 250);
  draw();
}

/* ---------------- DASHBOARD ---------------- */
function Dashboard() {
  const n = passed(), rk = rankOf(n), nextR = Eng.RANKS.find(r => r.at > n);
  let grid = '<div class="h">+</div>' + Array.from({ length: 11 }, (_, b) => `<div class="h">${b}</div>`).join('');
  for (let a = 0; a <= 10; a++) { grid += `<div class="h">${a}</div>`; for (let b = 0; b <= 10; b++) { const L = factLevel(a, b); grid += `<div class="${L ? 'l' + L : ''}" title="${a} + ${b} = ${a + b}">${a + b}</div>`; } }
  const fluent = (() => { let c = 0; for (let a = 0; a <= 10; a++) for (let b = 0; b <= 10; b++) if (factLevel(a, b) === 3) c++; return c; })();
  main.innerHTML = `<div class="topbar"><button class="icon-btn" data-go="home" aria-label="Back to home">←</button><h2>My Progress<small>Saved on this device only</small></h2></div>
  <div class="dash">
    <div class="panel"><div class="stats"><div class="stat"><b>${n}</b><span>of 25 levels passed</span></div><div class="stat"><b>${totalStars()}</b><span>of 75 stars</span></div><div class="stat"><b>${fluent}</b><span>of 121 facts fluent</span></div><div class="stat"><b>${[1, 2, 3].map(w => DB.speed[w] || 0).join(' · ')}</b><span>Speed bests W1 · W2 · W3</span></div></div></div>
    <div class="panel"><h3>Rank: ${rk.name}</h3><p class="note" style="margin-bottom:12px">${nextR ? `Pass ${nextR.at - n} more ${nextR.at - n === 1 ? 'level' : 'levels'} to become <b>${nextR.name}</b>.` : 'You reached the top rank!'}</p>
      <div class="ranks">${Eng.RANKS.map(r => `<div class="rank${n >= r.at ? ' got' : ''}${r === rk ? ' cur' : ''}">${rankSVG(r.shape, n >= r.at, r.name)}<span>${r.name}</span><small>${r.at} levels</small></div>`).join('')}</div></div>
    <div class="panel"><h3>Levels</h3>${WORLDS.map(w => `<div class="wtitle" style="--c:var(--w${w.n})"><i></i>World ${w.n} · ${w.name} (Grade ${w.grade})</div>
      <table class="ltable"><thead><tr><th>Level</th><th class="c">Learn</th><th class="c">Practice</th><th>Boss</th></tr></thead><tbody>${LEVELS.filter(l => l.world === w.n).map(l => { const p = DB.levels[l.id] || {}; const m = v => v ? '<span class="okmark">✓</span>' : '<span class="nomark"></span>';
        return `<tr><td>${l.n}. ${esc(l.name)}</td><td class="c">${m(p.learn)}</td><td class="c">${m(p.practice)}</td><td><span class="stars" aria-label="${p.stars || 0} stars">${stars(p.stars || 0)}</span>${p.best ? ` <small>${p.best}/12</small>` : ''}</td></tr>`; }).join('')}</tbody></table>`).join('')}</div>
    <div class="panel"><h3>Facts within 20</h3><p class="note">Every addition fact from 0 + 0 to 10 + 10. Boxes fill in as you answer them in any game.</p>
      <div class="fgrid" style="margin-top:12px">${grid}</div>
      <div class="legend"><span><i style="background:#EFEBE3"></i>Not yet</span><span><i style="background:#F6DCC8"></i>Learning (•)</span><span><i style="background:#EBA27F"></i>Getting there (●)</span><span><i style="background:var(--w1)"></i>Fluent: right 3 times, 4 seconds or less (⬤)</span></div></div>
  </div>`;
}

/* ---------------- TEACHER ---------------- */
let teacherOK = false;
function Teacher() {
  if (!teacherOK) {
    main.innerHTML = `<div class="topbar"><button class="icon-btn" data-go="home" aria-label="Back to home">←</button><h2>Teacher Settings</h2></div>
      <div class="panel gate"><p class="say">For teachers</p><p class="note">Press and hold the button for 2 seconds.</p><button class="btn dark hold" id="hold">Hold to open<i></i></button></div>`;
    const b = $('#hold'), bar = b.querySelector('i'); let t = null, s = 0;
    const start = e => { e.preventDefault(); s = Date.now(); t = setInterval(() => { const p = Math.min(1, (Date.now() - s) / 2000); bar.style.width = p * 100 + '%'; if (p >= 1) { clearInterval(t); teacherOK = true; Teacher(); } }, 40); };
    const stop = () => { clearInterval(t); bar.style.width = 0; };
    b.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !t) start(e); }); b.addEventListener('keyup', stop);
    return;
  }
  const s = S();
  const sw = (id, on, label) => `<div class="tline"><span>${label}</span><button class="switch" role="switch" aria-checked="${on}" data-sw="${id}" aria-label="${label}"></button></div>`;
  main.innerHTML = `<div class="topbar"><button class="icon-btn" data-go="home" aria-label="Back to home">←</button><h2>Teacher Settings<small>Saved on this device</small></h2></div>
  <div class="dash">
    ${FREEBIE ? '<div class="free">This is the free sample. Only Doubles and Make 10 can be opened.</div>' : ''}
    <div class="panel tset"><h3>Quick settings</h3>
      ${sw('allOpen', s.allOpen, 'Open every level (skip the order)')}
      ${sw('bossTimer', s.bossTimer, 'Boss Round clock')}
      ${sw('voice', s.voice, 'Listen buttons (read aloud)')}
      ${WORLDS.map(w => sw('w' + w.n, s.worlds[w.n], `World ${w.n} (Grade ${w.grade}) is open`)).join('')}</div>
    <div class="panel tset"><h3>Choose levels</h3><p class="note">Auto = opens after the level before it is passed.</p>
      ${LEVELS.map(l => `<div class="tline"><span>W${l.world} · ${l.n}. ${esc(l.name)}</span><select data-lv="${l.id}" aria-label="${esc(l.name)}"><option value="">Auto</option><option value="open" ${s.open[l.id] === 'open' ? 'selected' : ''}>Open</option><option value="closed" ${s.open[l.id] === 'closed' ? 'selected' : ''}>Closed</option></select></div>`).join('')}</div>
    <div class="panel tset"><h3>Reset</h3><p class="note">Erase stars, progress, facts and speed records on this device. Settings stay.</p><button class="btn" style="background:var(--bad)" id="reset">Reset progress</button></div>
  </div>`;
  main.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => {
    const k = b.dataset.sw, on = b.getAttribute('aria-checked') !== 'true';
    if (k[0] === 'w' && k.length === 2) s.worlds[k[1]] = on; else s[k] = on;
    b.setAttribute('aria-checked', on); save();
  });
  main.querySelectorAll('[data-lv]').forEach(sel => sel.onchange = () => { if (sel.value) s.open[sel.dataset.lv] = sel.value; else delete s.open[sel.dataset.lv]; save(); });
  $('#reset').onclick = () => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Reset progress"><p class="say">Erase all progress?</p><p class="note">This cannot be undone.</p><div class="row center"><button class="btn ghost" data-x>Cancel</button><button class="btn" style="background:var(--bad)" data-y>Yes, erase</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('[data-x]').onclick = () => m.remove();
    m.querySelector('[data-y]').onclick = () => { const keep = DB.settings; DB = blank(); DB.settings = keep; save(); m.remove(); toast('Progress erased.'); };
  };
}

/* ---------------- SPEED CHALLENGE ---------------- */
function Speed(w) {
  if (FREEBIE) { toast('Speed Challenge is in the full version.'); return go('home'); }
  if (!w) {
    main.innerHTML = `<div class="topbar"><button class="icon-btn" data-go="home" aria-label="Back to home">←</button><h2>Speed Challenge<small>60 seconds. How many can you get?</small></h2></div>
      <div class="worlds">${WORLDS.map(x => `<button class="world" style="--c:var(--w${x.n})" data-go="speed" data-arg="${x.n}"><span class="wnum">${x.n}</span><span class="wtag">Grade ${x.grade}</span><span class="wname">${x.name}</span><span class="wsub">${['Facts within 20', 'Tens and ones within 100', 'Hundreds and tens within 1000'][x.n - 1]}</span><span class="wcount">Best: ${DB.speed[x.n] || 0}</span></button>`).join('')}</div>`;
    return;
  }
  w = +w; document.body.className = 'wc' + w;
  let score = 0, miss = 0, q = null, v = '', over = false, qStart = 0;
  const t0 = Date.now(), T = 60;
  main.innerHTML = `<div class="topbar"><button class="icon-btn" data-go="speed" aria-label="Back">←</button><h2>Speed Challenge<small>World ${w} · ${WORLDS[w - 1].name}</small></h2><span class="roundel">${w}</span></div>
    <section class="card"><div class="prow"><span id="sc">0 correct</span><div class="progress"><i id="tbar" style="width:100%"></i></div><span class="timer" id="clock">1:00</span></div><div class="eq" id="sq"></div><div class="fbx" style="width:100%;min-height:10px"></div>${padHTML()}</section>`;
  const next = () => { let n; do { n = Eng.speedQ(R, w); } while (q && n.tokens.join() === q.tokens.join()); q = n; v = ''; qStart = Date.now(); $('#sq').innerHTML = q.tokens.map(tok).join(''); };
  bindPad(main, k => {
    if (over) return; const slot = main.querySelector('[data-slot]');
    if (k === 'ok') { if (v === '') return; const ok = +v === q.answer; if (q.fact) recordFact(q.fact, ok, Date.now() - qStart);
      if (ok) { score++; main.querySelector('.fbx').innerHTML = ''; } else { miss++; main.querySelector('.fbx').innerHTML = fbBad(eqText(q.tokens, q.answer)); }
      $('#sc').textContent = `${score} correct`; next(); return; }
    v = k === 'del' ? v.slice(0, -1) : (v + k).slice(0, 4); slot.textContent = v; slot.classList.toggle('filled', !!v);
  });
  next();
  timer = setInterval(() => {
    const left = Math.max(0, T - Math.floor((Date.now() - t0) / 1000));
    $('#clock').textContent = `0:${String(left).padStart(2, '0')}`.replace('0:60', '1:00'); $('#clock').classList.toggle('low', left <= 10); $('#tbar').style.width = left / T * 100 + '%';
    if (left === 0) { over = true; clearInterval(timer); padFn = null; save();
      const best = DB.speed[w] || 0, nb = score > best; if (nb) { DB.speed[w] = score; save(); }
      main.querySelector('.card').innerHTML = `<div class="kicker">Time is up</div><div class="score">${score}</div><p class="say">${nb ? 'New best score!' : `Your best is ${best}.`}</p><p class="note">${miss} not yet. Keep practicing your strategies.</p><div class="row center"><button class="btn ghost" data-go="speed">Choose world</button><button class="btn" data-go="speed" data-arg="${w}">Play again</button></div>`; }
  }, 250);
}

/* ---------------- CLASS MODE ---------------- */
function ClassMode() {
  if (FREEBIE) { toast('Class Mode is in the full version.'); return go('home'); }
  const teams = { A: 0, B: 0 };
  let lvId = LEVELS[0].id, q = null;
  const opts = LEVELS.map(l => `<option value="${l.id}">World ${l.world} · ${l.n}. ${esc(l.name)}</option>`).join('');
  main.innerHTML = `<div class="topbar"><button class="icon-btn" data-go="home" aria-label="Back to home">←</button><h2>Class Mode<small>Show on the big screen. Everyone answers on paper or whiteboards.</small></h2><button class="btn small dark" id="fs" style="background:#fff;color:var(--ink)">Full screen</button></div>
    <div class="classm"><div class="picker" style="margin-bottom:14px"><select id="lv" aria-label="Choose a level">${opts}</select><button class="btn" id="new">New question</button></div>
    <section class="card" id="stage"><p class="say">Pick a level, then press <em>New question</em>.</p></section>
    <div class="row center" style="margin-top:14px"><button class="btn ghost" id="hint">Show picture</button><button class="btn dark" id="ans">Show answer</button></div>
    <div class="teams" style="margin-top:16px">${['A', 'B'].map(t => `<div class="team">Team ${t} <b id="t${t}">0</b><button data-t="${t}" aria-label="Add a point to team ${t}">+</button></div>`).join('')}</div></div>`;
  const stageEl = $('#stage');
  const fresh = () => {
    const lv = byId(lvId); document.body.className = 'wc' + lv.world;
    const kinds = lv.boss.filter(k => ['missing', 'word', 'tf', 'choice', 'column'].includes(k));
    q = lv.gen(R, R.pick(kinds), 'app');
    stageEl.innerHTML = `<div class="kicker">${esc(lv.name)} · ${lv.std}</div><div class="slot-area" id="ct"></div><div id="reveal" style="width:100%;display:grid;justify-items:center;gap:14px"></div>`;
    const host = $('#ct');
    // display only: render without input
    if (q.kind === 'missing') host.innerHTML = `<div class="eq">${q.tokens.map(t => t === '?' ? '<span class="slot">?</span>' : tok(t)).join('')}</div>`;
    else if (q.kind === 'word') host.innerHTML = `<div class="say-row"><div class="story">${esc(q.text)}</div>${listenBtn(q.text)}</div>`;
    else if (q.kind === 'tf') host.innerHTML = `<p class="say">${q.prompt ? esc(q.prompt) : 'True or false?'}</p>${q.prompt ? '' : `<div class="eq">${q.left.join(' ')} = ${q.right.join(' ')}</div>`}`;
    else if (q.kind === 'choice') host.innerHTML = `${q.story ? `<div class="story">${esc(q.story)}</div>` : ''}<p class="say">${esc(q.prompt)}</p><div class="eqs">${q.options.map((o, i) => `<div>${'ABC'[i]}. ${esc(o)}</div>`).join('')}</div>`;
    else if (q.kind === 'column') columnStatic(host, q, { mode: 'class' });
  };
  $('#lv').onchange = e => { lvId = e.target.value; fresh(); };
  $('#new').onclick = fresh;
  $('#hint').onclick = () => { if (!q) return; $('#reveal').innerHTML = Viz.render(q.hint || (q.model ? { type: 'bar', model: q.model } : null)) || '<p class="note">No picture for this one.</p>'; };
  $('#ans').onclick = () => { if (!q) return; $('#reveal').innerHTML = `<div class="answer-reveal">${esc(answerText(q))}</div>` + Viz.render(q.hint || (q.model ? { type: 'bar', model: q.model } : null)); };
  main.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { teams[b.dataset.t]++; $('#t' + b.dataset.t).textContent = teams[b.dataset.t]; });
  $('#fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} };
}

/* test hook for automated checks (read-only) */
window.__ASQ = { Eng, DB: () => DB, go, LEVELS };
go('home');

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medal Arena Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,700&family=Sora:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface2:#E9ECF7; --ink:#1C2340; --ink2:#525A78; --line:#CDD2E6;
  --indigo:#22306B; --indigo-ink:#FFFFFF; --gold:#E8B23A; --gold-soft:#FCEFD0; --gold-deep:#8A5F00;
  --coral:#E4572E; --coral-soft:#FBE0D8;
  --good:#1E8E5A; --good-soft:#DDF3E8; --bad:#C62A2A; --bad-soft:#FBE3E3;
  --fig-bg:#FFFFFF; --shadow:0 1px 2px rgba(28,35,64,.06),0 8px 24px rgba(28,35,64,.07);
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Sora","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10152B; --surface:#1A2140; --surface2:#242C52; --ink:#EEF0F8; --ink2:#AAB1CC; --line:#343D66;
    --indigo:#2C3C85; --gold:#F0C04F; --gold-soft:#3A3220; --gold-deep:#F0C04F; --coral:#F07A57; --coral-soft:#3D2620;
    --good:#4CC98A; --good-soft:#18352A; --bad:#FF7A7A; --bad-soft:#3E1F24; --fig-bg:#F4F6FB;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10152B; --surface:#1A2140; --surface2:#242C52; --ink:#EEF0F8; --ink2:#AAB1CC; --line:#343D66;
  --indigo:#2C3C85; --gold:#F0C04F; --gold-soft:#3A3220; --gold-deep:#F0C04F; --coral:#F07A57; --coral-soft:#3D2620;
  --good:#4CC98A; --good-soft:#18352A; --bad:#FF7A7A; --bad-soft:#3E1F24; --fig-bg:#F4F6FB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lab{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:10px;border:2px solid transparent;font-weight:700;font-size:16px;transition:transform .12s ease,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--indigo);color:#fff}
.btn-primary:hover{background:#2E3F86}
.btn-gold{background:var(--gold);color:#1C2340}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.05;margin:0 2px;font-weight:700}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 2px}.fr .de{padding:0 2px}
.bx{display:inline-block;width:1.2em;height:1.2em;border:2px solid currentColor;border-radius:3px;vertical-align:-.22em;margin:0 2px}
.tok{vertical-align:-4px;margin:0 1px}
.seq{font-weight:800;letter-spacing:.04em;color:var(--gold-deep);font-size:1.08em}
:root:not([data-theme]) .seq{color:var(--indigo)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seq{color:var(--gold)}}
:root[data-theme="light"] .seq{color:var(--indigo)}
.shapes,.boxes{display:inline-block;margin:4px 0;font-weight:700}
.ok{color:var(--good);font-weight:800}.no{color:var(--bad);font-weight:800}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.18em;font-size:13px;color:var(--ink)}
.brand i{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--indigo)}
.topbar .sp{flex:1}

/* home */
.hero{background:var(--indigo);color:#fff;border-radius:18px;padding:clamp(24px,5vw,44px);position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:900;color:#fff;max-width:16ch}
.hero h1 em{font-style:italic;font-weight:700;color:var(--gold)}
.hero p{max-width:56ch;margin:14px 0 0;opacity:.92;font-size:17px}
.hero .facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;font-size:14px;font-weight:600}
.hero .facts span{display:flex;align-items:center;gap:8px}
.hero .facts span::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.hero .ring{position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;border:40px solid rgba(255,255,255,.06)}
.hero .tri{position:absolute;right:48px;bottom:36px;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:44px solid rgba(228,87,46,.7)}
.hero .sq{position:absolute;right:110px;bottom:30px;width:34px;height:34px;background:rgba(232,178,58,.75);transform:rotate(18deg)}
.ladder-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 14px}
.ladder-head h2{font-size:28px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){.ladder{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.tcard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:210px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--ink2);transform:translateY(-2px)}
.medal{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--mc);box-shadow:inset 0 0 0 5px rgba(255,255,255,.25)}
.medal b{width:42px;height:42px;border-radius:50%;background:#fff;color:#22306B;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:22px}
.tcard h3{font-size:21px}
.tcard .meta{font-size:13px;color:var(--ink2);font-weight:600}
.tcard .best{margin-top:auto;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.tcard .best .pill{padding:2px 9px;border-radius:20px;background:var(--surface2)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.how div{border-top:3px solid var(--sc);padding-top:10px}
.how b{font-family:var(--display);font-size:22px}
.how p{margin:4px 0 0;color:var(--ink2);font-size:14px}

/* intro */
.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px)}
.intro h2{font-size:clamp(30px,5vw,44px);font-weight:900}
.intro .lvl{display:inline-flex;align-items:center;gap:10px;margin:10px 0 12px;font-weight:700}
.intro .lvl span{background:var(--mc);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;letter-spacing:.12em}
table.sc{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
table.sc th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:6px 4px;border-bottom:2px solid var(--line)}
table.sc td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-direction:column;gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px}
.mode:hover{border-color:var(--ink2)}
.mode h3{font-size:22px;display:flex;align-items:center;gap:10px}
.mode p{margin:0;color:var(--ink2);font-size:14.5px}
.mode .go{margin-top:6px;font-weight:800;color:var(--ink)}
.mode.primary{border-color:var(--indigo);background:var(--indigo);color:#fff}
.mode.primary p{color:rgba(255,255,255,.85)}.mode.primary .go{color:var(--gold)}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qhead .title{font-weight:700}
.qhead .title small{display:block;font-weight:600;color:var(--ink2);font-size:13px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px}
.timer.low{border-color:var(--bad);color:var(--bad)}
.progress{height:8px;background:var(--surface2);border-radius:8px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
.qlayout{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
@media (max-width:860px){.qlayout{grid-template-columns:1fr}}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px);box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.qnum{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:20px;background:var(--sc);color:var(--sct);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold)}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--ink2)}
.chip.sec{background:var(--sc);color:var(--sct)}
.qtext{font-size:clamp(18px,2.4vw,21px);line-height:1.55;font-weight:500}
.qfig{margin:16px 0 4px;background:var(--fig-bg);border-radius:12px;padding:12px;display:inline-block;max-width:100%;overflow-x:auto}
.qfig svg{display:block;max-width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;font-size:18px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--ink2)}
.opt .L{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.opt.sel{border-color:var(--indigo);background:var(--surface2)}
.opt.sel .L{background:var(--indigo);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .L{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt .tag{margin-left:auto;font-size:13px;font-weight:800}
.opt[disabled]{cursor:default}
.fill{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.fill input{font:inherit;font-size:24px;font-weight:700;width:min(220px,100%);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.fill input:focus{border-color:var(--indigo);outline:none}
.fill .unit{font-weight:700;color:var(--ink2)}
.fill input.right{border-color:var(--good);background:var(--good-soft)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:13.5px;color:var(--ink2);margin-top:8px}
.qnav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:22px}
.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;border:2px solid}
.feedback.good{border-color:var(--good);background:var(--good-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback .fh{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.sol{margin-top:12px}
.steps{list-style:none;counter-reset:s;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:7px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:6px;background:var(--surface2);color:var(--ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tip{background:var(--gold-soft);border-left:5px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:10px}
.tip b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin-right:6px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
.palette{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.pg{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pg.done{background:var(--surface2);border-color:var(--ink2)}
.pg.cur{outline:3px solid var(--gold);outline-offset:1px}
.pg.r{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pg.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin-top:10px}
.confirm{background:var(--surface);border:2px solid var(--coral);border-radius:14px;padding:14px}
.confirm p{margin:0 0 10px;font-weight:600}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

/* results */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:640px){.res-top{grid-template-columns:1fr}}
.bigmedal{width:150px;height:150px;border-radius:50%;background:var(--mc);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 10px rgba(255,255,255,.22)}
.bigmedal div{width:104px;height:104px;border-radius:50%;background:#fff;color:#22306B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.12em}
.bigmedal div b{font-family:var(--display);font-size:38px;letter-spacing:0;line-height:1}
.res-top h2{font-size:clamp(30px,5vw,46px);font-weight:900}
.res-top p{color:var(--ink2);margin:6px 0 0}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
@media (max-width:640px){.scores{grid-template-columns:repeat(2,1fr)}}
.scores div{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.scores b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.scores div.tot{background:var(--gold-soft);border-color:var(--gold)}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 22px;margin-top:10px}
@media (max-width:640px){.topics{grid-template-columns:1fr}}
.trow{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;font-size:14px;font-weight:600}
.bar{height:12px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo)}
:root[data-theme="dark"] .bar i{background:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar i{background:var(--gold)}}
.trow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px;margin-top:10px}
details.rv{background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
details.rv summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
details.rv summary::-webkit-details-marker{display:none}
details.rv .st{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
details.rv .st.r{background:var(--good)} details.rv .st.w{background:var(--bad)} details.rv .st.s{background:var(--ink2)}
details.rv .sm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rv .sm small{color:var(--ink2);font-weight:600}
details.rv .body{padding:0 16px 16px 56px}
@media (max-width:640px){details.rv .body{padding:0 14px 14px}}
.cmp{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0;font-weight:600}
.sectitle{font-size:24px;margin:30px 0 4px}
.foot{margin-top:36px;font-size:13px;color:var(--ink2);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.qcard .qtext .shapes .tok, .qcard .qtext .tok{color:var(--ink)}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const TESTS = [{"id": 1, "medal": "Bronze", "level": "Warm-Up", "grade": "Grade 3", "color": "#B87333", "blurb": "A confident start: core number sense, simple patterns and first logic puzzles.", "qs": [{"n": 1, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "What is 38 + 45 + 62?", "fig": "", "steps": ["Add the friendly pair first: 38 + 62 = 100.", "100 + 45 = 145."], "tip": "Look for two numbers that make 100 and add them first.", "unit": "", "options": ["135", "155", "144", "245", "145"], "correct": 4, "ansText": "145"}, {"n": 2, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>5, 10, 20, 40, ___</b>", "fig": "", "steps": ["Each number is double the one before: 5 × 2 = 10, 10 × 2 = 20, 20 × 2 = 40.", "40 × 2 = 80."], "tip": "If the jumps keep getting bigger, try multiplying.", "unit": "", "options": ["60", "50", "80", "70", "100"], "correct": 2, "ansText": "80"}, {"n": 3, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "How many corners (vertices) do 3 triangles and 2 rectangles have altogether?", "fig": "", "steps": ["3 triangles: 3 × 3 = 9 corners.", "2 rectangles: 2 × 4 = 8 corners.", "9 + 8 = 17 corners."], "tip": "Multiply by the number of shapes instead of counting every corner.", "unit": "", "options": ["17", "15", "20", "14", "12"], "correct": 0, "ansText": "17"}, {"n": 4, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "A bag has 30 marbles. <span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">5</span></span> of them are red. How many marbles are <b>not</b> red?", "fig": "", "steps": ["<span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">5</span></span> of 30 = 30 ÷ 5 = 6 red marbles.", "Not red: 30 − 6 = 24."], "tip": "Read the question word carefully: “not red” means subtract the red ones.", "unit": "", "options": ["6", "25", "5", "24", "20"], "correct": 3, "ansText": "24"}, {"n": 5, "sec": "A", "pts": 3, "topic": "Counting", "kind": "mc", "text": "How many two-digit numbers have 7 as their ones digit?", "fig": "", "steps": ["The numbers are 17, 27, 37, 47, 57, 67, 77, 87, 97.", "The tens digit can be 1 to 9, so there are 9 numbers."], "tip": "07 is not a two-digit number — the tens digit starts at 1.", "unit": "", "options": ["9", "10", "8", "7", "90"], "correct": 0, "ansText": "9"}, {"n": 6, "sec": "A", "pts": 3, "topic": "Logic", "kind": "mc", "text": "Tia is older than Sam. Sam is older than Jo. Kai is younger than Jo. Who is the oldest?", "fig": "", "steps": ["Order the clues from oldest to youngest: Tia, Sam, Jo.", "Kai is younger than Jo, so Kai goes last: Tia, Sam, Jo, Kai.", "Tia is the oldest."], "tip": "Draw a line and place each name as you read the clues.", "unit": "", "options": ["Sam", "Jo", "Kai", "Tia", "It cannot be decided"], "correct": 3, "ansText": "Tia"}, {"n": 7, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "Which number is 100 less than 5,040?", "fig": "", "steps": ["5,040 has 50 hundreds. Take away 1 hundred: 49 hundreds.", "49 hundreds and 40 = 4,940."], "tip": "When a digit is 0, take the hundred from the next place (regroup).", "unit": "", "options": ["5,940", "4,940", "4,040", "5,030", "4,904"], "correct": 1, "ansText": "4,940"}, {"n": 8, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "The letters repeat in this pattern:<br><b class='seq'>A B B C A B B C A B B C …</b><br>How many B’s are in the first 18 letters?", "fig": "", "steps": ["The repeating block is A, B, B, C — 4 letters with 2 B’s.", "4 full blocks use 16 letters and have 4 × 2 = 8 B’s.", "Letters 17 and 18 are A and B: 1 more B.", "Total: 8 + 1 = 9 B’s."], "tip": "Count full blocks first, then check the leftover letters.", "unit": "", "options": ["8", "10", "6", "12", "9"], "correct": 4, "ansText": "9"}, {"n": 9, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "A lesson starts at 9:35 a.m. and ends at 10:20 a.m. How many minutes long is the lesson?", "fig": "", "steps": ["9:35 → 10:00 is 25 minutes.", "10:00 → 10:20 is 20 minutes.", "25 + 20 = 45 minutes."], "tip": "Jump to the o’clock first, then add the rest.", "unit": "", "options": ["45", "55", "35", "85", "40"], "correct": 0, "ansText": "45"}, {"n": 10, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "A square has sides of 9 cm. What is its perimeter?", "fig": "", "steps": ["A square has 4 equal sides.", "4 × 9 = 36 cm."], "tip": "Perimeter is the distance around. Area (9 × 9 = 81) is a different thing!", "unit": "", "options": ["81 cm", "36 cm", "18 cm", "27 cm", "45 cm"], "correct": 1, "ansText": "36 cm"}, {"n": 11, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "Use each of the digits 4, 7 and 1 once to make the smallest possible <b>odd</b> three-digit number. What is it?", "fig": "", "steps": ["An odd number must end in 1 or 7.", "To be as small as possible, we want 1 in the hundreds place.", "Then the ones digit must be 7, leaving 4 for the tens: 147."], "tip": "Decide the digit with a rule (the ones digit) and the most important place (the hundreds) first.", "unit": "", "options": ["174", "417", "471", "147", "714"], "correct": 3, "ansText": "147"}, {"n": 12, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "Apples are sold at 4 for $1. How much do 20 apples cost?", "fig": "", "steps": ["20 apples make 20 ÷ 4 = 5 groups of 4.", "Each group costs $1, so 5 × $1 = $5."], "tip": "Think in groups: how many “4 for $1” groups are in 20?", "unit": "", "options": ["$4", "$20", "$5", "$80", "$10"], "correct": 2, "ansText": "$5"}, {"n": 13, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "How many rectangles of any size are in this figure? (Squares count as rectangles.)", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 140 52\" width=\"140\" height=\"52\"><rect x=\"4\" y=\"4\" width=\"132\" height=\"44\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><line x1=\"48\" y1=\"4\" x2=\"48\" y2=\"48\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"92\" y1=\"4\" x2=\"92\" y2=\"48\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["1 square wide: 3.", "2 squares wide: 2.", "3 squares wide: 1.", "3 + 2 + 1 = 6."], "tip": "In a row of n squares, count n + (n − 1) + … + 1.", "unit": "", "options": ["6", "3", "5", "4", "7"], "correct": 0, "ansText": "6"}, {"n": 14, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "I am a two-digit number between 20 and 40. I am even. My digits add up to 9. What number am I?", "fig": "", "steps": ["Numbers between 20 and 40 with digits that add to 9: 27 and 36.", "27 is odd, so it is not the answer.", "The number is 36."], "tip": "List the numbers that fit one clue, then cross out the ones that break another.", "unit": "", "options": ["27", "18", "36", "45", "32"], "correct": 2, "ansText": "36"}, {"n": 15, "sec": "B", "pts": 4, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>2, 3, 5, 9, 17, ___</b>", "fig": "", "steps": ["The jumps are +1, +2, +4, +8 — they double each time.", "The next jump is +16.", "17 + 16 = 33."], "tip": "Write the jumps underneath — the jumps may have their own pattern.", "unit": "", "options": ["25", "33", "34", "32", "26"], "correct": 1, "ansText": "33"}, {"n": 16, "sec": "B", "pts": 4, "topic": "Geometry", "kind": "mc", "text": "A rectangle is 7 cm long and 3 cm wide. What is its area?", "fig": "", "steps": ["Area = length × width.", "7 × 3 = 21 cm²."], "tip": "20 cm is the perimeter (7 + 3 + 7 + 3) — don’t mix them up!", "unit": "", "options": ["20 cm²", "10 cm²", "21 cm²", "24 cm²", "17 cm²"], "correct": 2, "ansText": "21 cm²"}, {"n": 17, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "Bikes have 2 wheels and tricycles have 3 wheels. A yard has 6 of them in total — some bikes and some tricycles — with 15 wheels altogether. How many tricycles are there?", "fig": "", "steps": ["Pretend all 6 are bikes: 6 × 2 = 12 wheels.", "There are 15 − 12 = 3 extra wheels.", "Each tricycle has 1 extra wheel, so there are 3 tricycles.", "Check: 3 bikes (6 wheels) + 3 tricycles (9 wheels) = 15. <span class=\"ok\">✓</span>"], "tip": "Pretend they are all the same, then share out the extra.", "unit": "", "options": ["2", "3", "4", "5", "1"], "correct": 1, "ansText": "3"}, {"n": 18, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "What is 50 × 8 × 2?", "fig": "", "steps": ["Multiply the friendly pair first: 50 × 2 = 100.", "100 × 8 = 800."], "tip": "You can multiply in any order — pick the pair that makes 100.", "unit": "", "options": ["400", "1,600", "160", "800", "108"], "correct": 3, "ansText": "800"}, {"n": 19, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "An ice pop comes in 4 flavors and 2 stick colors. Each ice pop has 1 flavor and 1 stick color. How many different ice pops are possible?", "fig": "", "steps": ["Each flavor can go with 2 stick colors.", "4 × 2 = 8 ice pops."], "tip": "One choice from each group? Multiply.", "unit": "", "options": ["6", "4", "2", "16", "8"], "correct": 4, "ansText": "8"}, {"n": 20, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "Children stand in a line. Mia is 5th from the front. There are 3 children behind her. How many children are in the line?", "fig": "", "steps": ["5th from the front: Mia and 4 children in front of her = 5 children.", "3 children are behind her.", "5 + 3 = 8 children."], "tip": "Mia’s position already counts Mia — just add the children behind her.", "unit": "", "options": ["9", "7", "5", "3", "8"], "correct": 4, "ansText": "8"}, {"n": 21, "sec": "C", "pts": 5, "topic": "Number Sense", "kind": "fill", "text": "What is 2 + 4 + 6 + … + 18 + 20?", "fig": "", "steps": ["There are 10 even numbers from 2 to 20.", "Pair them: 2 + 20 = 22, 4 + 18 = 22, … → 5 pairs.", "5 × 22 = 110."], "tip": "Pair the first and last numbers — every pair has the same sum.", "unit": "", "correct": "110", "ansText": "110"}, {"n": 22, "sec": "C", "pts": 5, "topic": "Patterns", "kind": "fill", "text": "Triangles are made from toothpicks in a row, as shown. 1 triangle uses 3 toothpicks, 2 triangles use 5 and 3 triangles use 7. How many toothpicks are needed for a row of 12 triangles?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 272.0 90\" width=\"272\" height=\"90\"><line x1=\"10\" y1=\"53.17691453623979\" x2=\"46\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"46\" y1=\"53.17691453623979\" x2=\"28.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"28.0\" y1=\"22\" x2=\"10\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"28.0\" y=\"10\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">1 triangle</text><text x=\"28.0\" y=\"69.17691453623979\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">3 toothpicks</text><line x1=\"86.0\" y1=\"53.17691453623979\" x2=\"122.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"53.17691453623979\" x2=\"104.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"104.0\" y1=\"22\" x2=\"86.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"104.0\" y1=\"22\" x2=\"140.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"22\" x2=\"122.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"53.17691453623979\" x2=\"104.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"113.0\" y=\"10\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">2 triangles</text><text x=\"113.0\" y=\"69.17691453623979\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">5 toothpicks</text><line x1=\"180.0\" y1=\"53.17691453623979\" x2=\"216.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"216.0\" y1=\"53.17691453623979\" x2=\"198.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"198.0\" y1=\"22\" x2=\"180.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"198.0\" y1=\"22\" x2=\"234.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"234.0\" y1=\"22\" x2=\"216.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"216.0\" y1=\"53.17691453623979\" x2=\"198.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"216.0\" y1=\"53.17691453623979\" x2=\"252.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"252.0\" y1=\"53.17691453623979\" x2=\"234.0\" y2=\"22\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"234.0\" y1=\"22\" x2=\"216.0\" y2=\"53.17691453623979\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"216.0\" y=\"10\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">3 triangles</text><text x=\"216.0\" y=\"69.17691453623979\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">7 toothpicks</text></svg>", "steps": ["The first triangle needs 3 toothpicks.", "Each new triangle shares a side, so it needs only 2 more.", "12 triangles: 3 + 11 × 2 = 25 toothpicks."], "tip": "Rule: toothpicks = 2 × (number of triangles) + 1. Check: 2 × 3 + 1 = 7. <span class=\"ok\">✓</span>", "unit": "", "correct": "25", "ansText": "25"}, {"n": 23, "sec": "C", "pts": 5, "topic": "Word Problems", "kind": "fill", "text": "Leo saves $3 on Monday. Each day after that, he saves $1 more than the day before. How many dollars has he saved altogether by the end of Friday?", "fig": "", "steps": ["Monday 3, Tuesday 4, Wednesday 5, Thursday 6, Friday 7.", "3 + 4 + 5 + 6 + 7 = 25."], "tip": "For numbers in a row, total = middle number × how many: 5 × 5 = 25.", "unit": "", "correct": "25", "ansText": "25"}, {"n": 24, "sec": "C", "pts": 5, "topic": "Geometry", "kind": "fill", "text": "How many triangles of any size are in this figure?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 180\" width=\"260\" height=\"180\"><polygon points=\"130,10 10,170 250,170\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"130\" y1=\"10\" x2=\"70.0\" y2=\"170\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"130\" y1=\"10\" x2=\"130.0\" y2=\"170\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"130\" y1=\"10\" x2=\"190.0\" y2=\"170\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["Every triangle uses the top point, and its bottom side is made of pieces of the base.", "The base has 4 small pieces.", "1 piece: 4, 2 pieces: 3, 3 pieces: 2, 4 pieces: 1.", "4 + 3 + 2 + 1 = 10 triangles."], "tip": "Count the ways to choose pieces of the base: 4 + 3 + 2 + 1.", "unit": "", "correct": "10", "ansText": "10"}, {"n": 25, "sec": "C", "pts": 5, "topic": "Counting", "kind": "fill", "text": "Omar writes all the whole numbers from 1 to 25. How many times does he write the digit 2?", "fig": "", "steps": ["Digit 2 in the ones place: 2, 12, 22 → 3 times.", "Digit 2 in the tens place: 20, 21, 22, 23, 24, 25 → 6 times.", "Total: 3 + 6 = 9 (22 has two 2s, and we counted both)."], "tip": "Count the ones place and the tens place separately.", "unit": "", "correct": "9", "ansText": "9"}]}, {"id": 2, "medal": "Silver", "level": "Builder", "grade": "Grade 3", "color": "#9AA3B5", "blurb": "Builds problem-solving stamina with multi-step thinking and organized counting.", "qs": [{"n": 1, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "What is 2,000 − 5 − 50 − 500?", "fig": "", "steps": ["Add the amounts taken away: 5 + 50 + 500 = 555.", "2,000 − 555 = 1,445."], "tip": "Combine everything you subtract, then subtract once.", "unit": "", "options": ["1,455", "1,445", "1,545", "1,505", "555"], "correct": 1, "ansText": "1,445"}, {"n": 2, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>64, 32, 16, 8, ___</b>", "fig": "", "steps": ["Each number is half of the one before: 64 ÷ 2 = 32, 32 ÷ 2 = 16, 16 ÷ 2 = 8.", "8 ÷ 2 = 4."], "tip": "Shrinking fast? Try dividing.", "unit": "", "options": ["4", "2", "6", "0", "16"], "correct": 0, "ansText": "4"}, {"n": 3, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "A van can carry 9 children. What is the smallest number of vans needed for 60 children?", "fig": "", "steps": ["60 ÷ 9 = 6 remainder 6.", "6 vans carry 54 children, but 6 children are left.", "One more van is needed: 7 vans."], "tip": "Everyone must ride — a remainder means one more van.", "unit": "", "options": ["6", "7", "8", "51", "9"], "correct": 1, "ansText": "7"}, {"n": 4, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "How many faces does a square pyramid have?", "fig": "", "steps": ["The base is 1 square.", "Each of the 4 base edges has a triangle face above it: 4 triangles.", "1 + 4 = 5 faces."], "tip": "Count the base, then the faces that meet at the top.", "unit": "", "options": ["4", "6", "8", "3", "5"], "correct": 4, "ansText": "5"}, {"n": 5, "sec": "A", "pts": 3, "topic": "Logic", "kind": "mc", "text": "Today is Saturday. What day of the week was it 9 days ago?", "fig": "", "steps": ["7 days ago was also a Saturday.", "9 − 7 = 2 more days back.", "Saturday → Friday → Thursday."], "tip": "Remove full weeks of 7 days first.", "unit": "", "options": ["Friday", "Wednesday", "Monday", "Thursday", "Sunday"], "correct": 3, "ansText": "Thursday"}, {"n": 6, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "Which number rounds to 3,000 when it is rounded to the nearest thousand?", "fig": "", "steps": ["Numbers from 2,500 to 3,499 round to 3,000.", "2,450 and 2,099 round to 2,000; 3,580 and 3,720 round to 4,000.", "Only 2,650 rounds to 3,000."], "tip": "Look at the hundreds digit: 5 or more rounds up.", "unit": "", "options": ["2,650", "2,450", "3,580", "3,720", "2,099"], "correct": 0, "ansText": "2,650"}, {"n": 7, "sec": "A", "pts": 3, "topic": "Counting", "kind": "mc", "text": "How many of the whole numbers from 1 to 60 are multiples of 6?", "fig": "", "steps": ["The multiples are 6, 12, 18, …, 60.", "60 ÷ 6 = 10, so there are 10."], "tip": "Count multiples of n up to a number by dividing by n.", "unit": "", "options": ["9", "11", "10", "6", "12"], "correct": 2, "ansText": "10"}, {"n": 8, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "The word STAR is written again and again: STARSTARSTAR… How many times does the letter S appear in the first 27 letters?", "fig": "", "steps": ["27 ÷ 4 = 6 remainder 3: 6 full blocks and 3 more letters.", "6 blocks have 6 Ss.", "The 3 extra letters are S, T, A: 1 more S. Total 7."], "tip": "Always check the leftover letters after the full blocks.", "unit": "", "options": ["6", "8", "7", "27", "9"], "correct": 2, "ansText": "7"}, {"n": 9, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "Nina buys 3 pens for $2 each and a ruler for $4. She pays with a $20 bill. How much change does she get?", "fig": "", "steps": ["Pens: 3 × $2 = $6.", "Total: $6 + $4 = $10.", "Change: $20 − $10 = $10."], "tip": "Find the total cost first, then subtract from the money paid.", "unit": "", "options": ["$14", "$6", "$12", "$10", "$8"], "correct": 3, "ansText": "$10"}, {"n": 10, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "A rectangle has a perimeter of 18 cm. Its length is 5 cm. What is its width?", "fig": "", "steps": ["Half the perimeter is length + width: 18 ÷ 2 = 9 cm.", "Width = 9 − 5 = 4 cm."], "tip": "Length + width = half the perimeter.", "unit": "", "options": ["13 cm", "9 cm", "4 cm", "8 cm", "3 cm"], "correct": 2, "ansText": "4 cm"}, {"n": 11, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "Put the digits 2, 4, 6 and 8 in the boxes, using each digit once:<br><span class='boxes'><span class=\"bx\"></span><span class=\"bx\"></span> + <span class=\"bx\"></span><span class=\"bx\"></span></span><br>What is the largest possible sum?", "fig": "", "steps": ["The tens places matter most, so put the largest digits there: 8 and 6.", "Put 4 and 2 in the ones places.", "For example, 84 + 62 = 146 (or 82 + 64 = 146)."], "tip": "Biggest digits go in the biggest place values.", "unit": "", "options": ["142", "128", "154", "164", "146"], "correct": 4, "ansText": "146"}, {"n": 12, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "Ada, Ben, Cal and Dee each do one different activity: soccer, tennis, swimming or chess. Ada’s activity uses a racket. Ben’s activity is done in water. Dee’s activity does not use a ball. Who plays soccer?", "fig": "", "steps": ["A racket is used in tennis, so Ada plays tennis.", "Water means swimming, so Ben swims.", "Soccer and chess are left for Cal and Dee. Soccer uses a ball, so Dee plays chess.", "Cal plays soccer."], "tip": "Use a small grid of names × activities and cross out as you go.", "unit": "", "options": ["Ada", "Ben", "Dee", "Cal", "It cannot be decided"], "correct": 3, "ansText": "Cal"}, {"n": 13, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "In a tournament, each of 6 teams plays every other team exactly once. How many games are played in total?", "fig": "", "steps": ["Team 1 plays 5 new games, team 2 plays 4 new games, and so on.", "5 + 4 + 3 + 2 + 1 = 15 games."], "tip": "Count only new games for each team, so no game is counted twice.", "unit": "", "options": ["15", "30", "36", "12", "6"], "correct": 0, "ansText": "15"}, {"n": 14, "sec": "B", "pts": 4, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>0, 3, 8, 15, 24, ___</b>", "fig": "", "steps": ["The jumps are +3, +5, +7, +9 (odd numbers).", "The next jump is +11.", "24 + 11 = 35."], "tip": "Jumps that go up by 2 each time are a common olympiad pattern.", "unit": "", "options": ["33", "36", "34", "48", "35"], "correct": 4, "ansText": "35"}, {"n": 15, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "Cars have 4 wheels and motorbikes have 2 wheels. A parking lot has 5 cars and some motorbikes. There are 32 wheels altogether. How many motorbikes are there?", "fig": "", "steps": ["5 cars have 5 × 4 = 20 wheels.", "Wheels left for motorbikes: 32 − 20 = 12.", "12 ÷ 2 = 6 motorbikes."], "tip": "Take away the part you know, then share what is left.", "unit": "", "options": ["5", "6", "7", "12", "4"], "correct": 1, "ansText": "6"}, {"n": 16, "sec": "B", "pts": 4, "topic": "Geometry", "kind": "mc", "text": "How many triangles of any size are in this figure?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 180\" width=\"260\" height=\"180\"><polygon points=\"130,10 10,170 250,170\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"130\" y1=\"10\" x2=\"130.0\" y2=\"170\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"70.0\" y1=\"90.0\" x2=\"190.0\" y2=\"90.0\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["Every triangle uses the top point.", "Its bottom side lies on the base or on the middle line.", "Each of these lines is split into 2 pieces, giving 2 + 1 = 3 triangles each.", "3 + 3 = 6 triangles."], "tip": "Count one line at a time, then add.", "unit": "", "options": ["4", "5", "6", "8", "3"], "correct": 2, "ansText": "6"}, {"n": 17, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "Four consecutive whole numbers (numbers in a row, such as 3, 4, 5 and 6) add up to 50. What is the smallest of the four numbers?", "fig": "", "steps": ["Call the smallest number n. The four numbers are n, n + 1, n + 2, n + 3.", "Their total is 4 × n + 6 = 50, so 4 × n = 44 and n = 11.", "Check: 11 + 12 + 13 + 14 = 50. <span class=\"ok\">✓</span>"], "tip": "Take away the extra 1 + 2 + 3 = 6 first, then share equally.", "unit": "", "options": ["12", "11", "10", "13", "9"], "correct": 1, "ansText": "11"}, {"n": 18, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "A bus trip starts at 10:45 a.m. and ends at 1:10 p.m. on the same day. How long is the trip?", "fig": "", "steps": ["10:45 a.m. → 12:45 p.m. is 2 hours.", "12:45 p.m. → 1:10 p.m. is 25 minutes.", "Total: 2 h 25 min."], "tip": "Jump whole hours first, then count the minutes.", "unit": "", "options": ["3 h 25 min", "2 h 35 min", "2 h 15 min", "2 h 25 min", "3 h 35 min"], "correct": 3, "ansText": "2 h 25 min"}, {"n": 19, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "A number machine adds 5 and then doubles the result. The output is 36. What was the input?", "fig": "", "steps": ["Work backwards. Undo “double”: 36 ÷ 2 = 18.", "Undo “add 5”: 18 − 5 = 13.", "Check: (13 + 5) × 2 = 36. <span class=\"ok\">✓</span>"], "tip": "Reverse the order and use the opposite operation.", "unit": "", "options": ["31", "77", "16", "8", "13"], "correct": 4, "ansText": "13"}, {"n": 20, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "How many three-digit numbers can be made from the digits 1, 2 and 3 if a digit may be used more than once? (For example, 113 and 222.)", "fig": "", "steps": ["Each place (hundreds, tens, ones) has 3 choices.", "3 × 3 × 3 = 27."], "tip": "Repeats allowed? Every place gets all the choices.", "unit": "", "options": ["27", "6", "9", "18", "12"], "correct": 0, "ansText": "27"}, {"n": 21, "sec": "C", "pts": 5, "topic": "Patterns", "kind": "fill", "text": "Square numbers can be made from dots, as shown: 1, 4, 9, 16, … How many dots are in the 12th square?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 258 80\" width=\"258\" height=\"80\"><circle cx=\"14\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><text x=\"14.0\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:12px;font-weight:600;fill:#1C2340\">1</text><circle cx=\"58\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"72\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"58\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"72\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><text x=\"65.0\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:12px;font-weight:600;fill:#1C2340\">4</text><circle cx=\"116\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"130\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"144\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"116\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"130\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"144\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"116\" cy=\"40\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"130\" cy=\"40\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"144\" cy=\"40\" r=\"4.4\" fill=\"#1C2340\"/><text x=\"130.0\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:12px;font-weight:600;fill:#1C2340\">9</text><circle cx=\"188\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"202\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"216\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"230\" cy=\"12\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"188\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"202\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"216\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"230\" cy=\"26\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"188\" cy=\"40\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"202\" cy=\"40\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"216\" cy=\"40\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"230\" cy=\"40\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"188\" cy=\"54\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"202\" cy=\"54\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"216\" cy=\"54\" r=\"4.4\" fill=\"#1C2340\"/><circle cx=\"230\" cy=\"54\" r=\"4.4\" fill=\"#1C2340\"/><text x=\"209.0\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:12px;font-weight:600;fill:#1C2340\">16</text></svg>", "steps": ["The nth square has n rows of n dots.", "The 12th square has 12 × 12 dots.", "12 × 12 = 144."], "tip": "Square numbers: n × n. Learn them up to 12 × 12 = 144.", "unit": "", "correct": "144", "ansText": "144"}, {"n": 22, "sec": "C", "pts": 5, "topic": "Word Problems", "kind": "fill", "text": "Mom is 4 times as old as Tim. In 5 years, their ages will add up to 50. How old is Tim now?", "fig": "", "steps": ["In 5 years, both are 5 years older: 10 years added in total.", "Their ages now add up to 50 − 10 = 40.", "Mom is 4 parts and Tim is 1 part: 5 parts = 40, so 1 part = 8.", "Tim is 8. Check: Mom is 32; in 5 years, 13 + 37 = 50. <span class=\"ok\">✓</span>"], "tip": "Draw bar models: Tim = 1 box, Mom = 4 boxes.", "unit": "", "correct": "8", "ansText": "8"}, {"n": 23, "sec": "C", "pts": 5, "topic": "Geometry", "kind": "fill", "text": "This staircase shape is made from 6 equal squares. Each square has sides of 3 cm. What is the perimeter of the shape, in cm?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 138\" width=\"128\" height=\"138\"><rect x=\"10\" y=\"10\" width=\"36\" height=\"36\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"10\" y=\"46\" width=\"36\" height=\"36\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"46\" y=\"46\" width=\"36\" height=\"36\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"10\" y=\"82\" width=\"36\" height=\"36\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"46\" y=\"82\" width=\"36\" height=\"36\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"82\" y=\"82\" width=\"36\" height=\"36\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><text x=\"28.0\" y=\"132\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:12px;font-weight:600;fill:#1C2340\">3 cm</text></svg>", "steps": ["Walk around the outside and count the square sides: there are 12.", "Each side is 3 cm.", "Perimeter = 12 × 3 = 36 cm."], "tip": "A staircase has the same perimeter as the square around it: 4 × 9 = 36.", "unit": "cm", "correct": "36", "ansText": "36 cm"}, {"n": 24, "sec": "C", "pts": 5, "topic": "Number Sense", "kind": "fill", "text": "What is the smallest whole number greater than 2 that leaves a remainder of 2 when it is divided by 3, by 4 and by 5?", "fig": "", "steps": ["(The number − 2) must be a common multiple of 3, 4 and 5.", "The smallest common multiple of 3, 4 and 5 is 60.", "The number is 60 + 2 = 62. Check: 62 ÷ 3, 62 ÷ 4 and 62 ÷ 5 each leave 2. <span class=\"ok\">✓</span>"], "tip": "Same remainder for every divisor? Find a common multiple and add the remainder.", "unit": "", "correct": "62", "ansText": "62"}, {"n": 25, "sec": "C", "pts": 5, "topic": "Counting", "kind": "fill", "text": "Using only 1-cent, 2-cent and 5-cent coins, how many different ways can you make exactly 10 cents? (The order of the coins does not matter.)", "fig": "", "steps": ["With two 5-cent coins: 1 way.", "With one 5-cent coin, make 5 cents from 1s and 2s: 0, 1 or 2 twos → 3 ways.", "With no 5-cent coin, make 10 cents from 1s and 2s: 0 to 5 twos → 6 ways.", "Total: 1 + 3 + 6 = 10 ways."], "tip": "Start with the largest coin and make an organized list.", "unit": "", "correct": "10", "ansText": "10"}]}, {"id": 3, "medal": "Gold", "level": "Stretch", "grade": "Grade 3–4", "color": "#E8B23A", "blurb": "Stretches strong Grade 3 and on-level Grade 4 students with trickier twists.", "qs": [{"n": 1, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "What is 199 + 245?", "fig": "", "steps": ["199 is 1 less than 200.", "200 + 245 = 445.", "Take away the extra 1: 445 − 1 = 444."], "tip": "Round 199 up to 200, then fix the difference.", "unit": "", "options": ["444", "454", "434", "445", "344"], "correct": 0, "ansText": "444"}, {"n": 2, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>90, 81, 72, 63, ___</b>", "fig": "", "steps": ["Each number is 9 less than the one before.", "63 − 9 = 54."], "tip": "These are the multiples of 9, counting down.", "unit": "", "options": ["53", "56", "45", "55", "54"], "correct": 4, "ansText": "54"}, {"n": 3, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "How many sides do an octagon and a pentagon have altogether?", "fig": "", "steps": ["An octagon has 8 sides.", "A pentagon has 5 sides.", "8 + 5 = 13."], "tip": "Octa = 8 (like an octopus’s 8 arms), penta = 5.", "unit": "", "options": ["12", "14", "11", "13", "15"], "correct": 3, "ansText": "13"}, {"n": 4, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "A baker puts 36 cupcakes into boxes of 6. How many boxes does she fill?", "fig": "", "steps": ["We need to find how many groups of 6 are in 36.", "36 ÷ 6 = 6 boxes."], "tip": "“Boxes of 6” is a division clue.", "unit": "", "options": ["5", "7", "6", "30", "42"], "correct": 2, "ansText": "6"}, {"n": 5, "sec": "A", "pts": 3, "topic": "Logic", "kind": "mc", "text": "What number goes in the box?<br><span class='boxes'><span class=\"bx\"></span> × 6 = 50 − 8</span>", "fig": "", "steps": ["Work out the right side first: 50 − 8 = 42.", "<span class=\"bx\"></span> × 6 = 42, so <span class=\"bx\"></span> = 42 ÷ 6 = 7."], "tip": "Both sides of = must be equal. Simplify one side, then solve.", "unit": "", "options": ["7", "6", "8", "42", "9"], "correct": 0, "ansText": "7"}, {"n": 6, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "What is the value of the digit 4 in 64,210?", "fig": "", "steps": ["Place values from the right: ones 0, tens 1, hundreds 2, thousands 4, ten thousands 6.", "The digit 4 is in the thousands place, so it is worth 4,000."], "tip": "Name each place from the right: ones, tens, hundreds, thousands …", "unit": "", "options": ["40,000", "400", "40", "4", "4,000"], "correct": 4, "ansText": "4,000"}, {"n": 7, "sec": "A", "pts": 3, "topic": "Counting", "kind": "mc", "text": "A book has pages numbered 1 to 50. How many page numbers contain the digit 5 at least once?", "fig": "", "steps": ["Digit 5 in the ones place: 5, 15, 25, 35, 45.", "Digit 5 in the tens place: only 50.", "5 + 1 = 6 page numbers."], "tip": "Check the ones place and the tens place separately.", "unit": "", "options": ["5", "10", "6", "15", "7"], "correct": 2, "ansText": "6"}, {"n": 8, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "What letter comes next?<br><b class='seq'>B, D, G, K, P, ___</b>", "fig": "", "steps": ["Number the letters: B = 2, D = 4, G = 7, K = 11, P = 16.", "The jumps are +2, +3, +4, +5, so the next jump is +6.", "16 + 6 = 22, and the 22nd letter is V."], "tip": "Turn letters into numbers (A = 1, B = 2, …).", "unit": "", "options": ["U", "W", "T", "V", "Q"], "correct": 3, "ansText": "V"}, {"n": 9, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "A rope is 2 meters long. It is cut into pieces that are each 40 cm long. How many pieces are there?", "fig": "", "steps": ["Change meters to centimeters: 2 m = 200 cm.", "200 ÷ 40 = 5 pieces."], "tip": "Use the same units before you divide.", "unit": "", "options": ["4", "5", "8", "20", "50"], "correct": 1, "ansText": "5"}, {"n": 10, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "A regular hexagon has sides of 5 cm. What is its perimeter?", "fig": "", "steps": ["A hexagon has 6 sides, and in a regular hexagon they are all equal.", "6 × 5 = 30 cm."], "tip": "Regular means all sides are the same length.", "unit": "", "options": ["25 cm", "35 cm", "11 cm", "60 cm", "30 cm"], "correct": 4, "ansText": "30 cm"}, {"n": 11, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "What is 1,001 − 999 + 998 − 996?", "fig": "", "steps": ["Group in pairs: (1,001 − 999) + (998 − 996).", "Each pair is 2.", "2 + 2 = 4."], "tip": "Pair numbers that are close together — big numbers can give tiny answers.", "unit": "", "options": ["2", "0", "6", "1,004", "4"], "correct": 4, "ansText": "4"}, {"n": 12, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "Pip, Quin, Remy and Suki ran a race. There were no ties. Suki finished right before Pip. Quin finished last. Remy did not finish first. Who finished second?", "fig": "", "steps": ["Quin is 4th, so Suki, Pip and Remy take places 1 to 3.", "Suki is right before Pip: the order is either Suki, Pip, Remy or Remy, Suki, Pip.", "Remy did not finish first, so the order is Suki, Pip, Remy, Quin.", "Pip finished second."], "tip": "List all possible orders, then cross out the ones that break a clue.", "unit": "", "options": ["Suki", "Pip", "Remy", "Quin", "It cannot be decided"], "correct": 1, "ansText": "Pip"}, {"n": 13, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "How many squares of any size are in this 2 × 3 grid?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 128 88\" width=\"128\" height=\"88\"><rect x=\"4\" y=\"4\" width=\"120\" height=\"80\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><line x1=\"44\" y1=\"4\" x2=\"44\" y2=\"84\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"84\" y1=\"4\" x2=\"84\" y2=\"84\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"4\" y1=\"44\" x2=\"124\" y2=\"44\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["1 × 1 squares: 6.", "2 × 2 squares: 2 (one on the left, one on the right).", "6 + 2 = 8."], "tip": "Count by size. A 3 × 3 square cannot fit, because the grid is only 2 rows tall.", "unit": "", "options": ["8", "6", "9", "7", "10"], "correct": 0, "ansText": "8"}, {"n": 14, "sec": "B", "pts": 4, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>1, 3, 6, 10, 15, ___</b>", "fig": "", "steps": ["The jumps are +2, +3, +4, +5.", "The next jump is +6: 15 + 6 = 21."], "tip": "These are the triangle numbers: 1, 1 + 2, 1 + 2 + 3, …", "unit": "", "options": ["20", "21", "18", "25", "19"], "correct": 1, "ansText": "21"}, {"n": 15, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "A class has 32 students. <span class=\"fr\"><span class=\"nu\">3</span><span class=\"de\">8</span></span> of them walk to school. How many students do <b>not</b> walk to school?", "fig": "", "steps": ["<span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">8</span></span> of 32 = 4, so <span class=\"fr\"><span class=\"nu\">3</span><span class=\"de\">8</span></span> of 32 = 3 × 4 = 12 walk.", "Not walking: 32 − 12 = 20."], "tip": "Find one part first (<span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">8</span></span>), then multiply.", "unit": "", "options": ["12", "24", "8", "20", "29"], "correct": 3, "ansText": "20"}, {"n": 16, "sec": "B", "pts": 4, "topic": "Geometry", "kind": "mc", "text": "Two 2 cm by 2 cm squares are cut from the corners of a 10 cm by 6 cm rectangle, as shown. What is the area of the shape that is left?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 164\" width=\"260\" height=\"164\"><polygon points=\"80,14 200,14 200,54 240,54 240,134 40,134 40,54 80,54\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><rect x=\"40\" y=\"14\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#E4572E\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/><rect x=\"200\" y=\"14\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#E4572E\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/><text x=\"140.0\" y=\"150\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:13px;font-weight:600;fill:#1C2340\">10 cm</text><text x=\"16\" y=\"84.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:13px;font-weight:600;fill:#1C2340\">6 cm</text><text x=\"60.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:600;fill:#E4572E\">2</text><text x=\"220.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:600;fill:#E4572E\">2</text><text x=\"140.0\" y=\"28\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#E4572E\">2 cm squares</text></svg>", "steps": ["Area of the rectangle: 10 × 6 = 60 cm².", "Each square cut out: 2 × 2 = 4 cm². Two squares: 8 cm².", "60 − 8 = 52 cm²."], "tip": "Whole shape minus the missing pieces.", "unit": "", "options": ["56 cm²", "60 cm²", "52 cm²", "44 cm²", "48 cm²"], "correct": 2, "ansText": "52 cm²"}, {"n": 17, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "Which number can be divided exactly by both 4 and 9?", "fig": "", "steps": ["Divisible by 9: the digits add up to a multiple of 9 → 72, 54 and 90.", "Divisible by 4: 72 ÷ 4 = 18 <span class=\"ok\">✓</span>, but 54 and 90 are not multiples of 4.", "The answer is 72."], "tip": "Digit-sum test for 9, then check 4.", "unit": "", "options": ["54", "48", "90", "72", "84"], "correct": 3, "ansText": "72"}, {"n": 18, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "In a secret code, each letter stands for a different digit. CAT is 312 and ACT is 132. What number is TAC?", "fig": "", "steps": ["From CAT = 312: C = 3, A = 1, T = 2.", "(Check with ACT: A = 1, C = 3, T = 2 → 132 <span class=\"ok\">✓</span>.)", "TAC = 2, 1, 3 → 213."], "tip": "Match each letter with its digit, then decode.", "unit": "", "options": ["213", "231", "123", "321", "312"], "correct": 0, "ansText": "213"}, {"n": 19, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "How many different ways can you choose 2 different fruits from an apple, a banana, a cherry, a date and a fig? (The order does not matter.)", "fig": "", "steps": ["The apple can pair with 4 others, the banana with 3 new ones, and so on.", "4 + 3 + 2 + 1 = 10."], "tip": "This is the handshake pattern: 5 items → 10 pairs.", "unit": "", "options": ["20", "10", "5", "25", "8"], "correct": 1, "ansText": "10"}, {"n": 20, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "Kim is 5 years younger than Lou. Lou is 3 years older than Max. Max is 10 years old. How old is Kim?", "fig": "", "steps": ["Lou is 3 years older than Max: 10 + 3 = 13.", "Kim is 5 years younger than Lou: 13 − 5 = 8."], "tip": "Start with the age you know and follow the chain.", "unit": "", "options": ["18", "12", "8", "2", "13"], "correct": 2, "ansText": "8"}, {"n": 21, "sec": "C", "pts": 5, "topic": "Patterns", "kind": "fill", "text": "Hexagons are made from sticks in a row, as shown. 1 hexagon uses 6 sticks, "#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"81.44486372867091\" y1=\"48.5\" x2=\"81.44486372867091\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"81.44486372867091\" y1=\"31.5\" x2=\"96.16729559300637\" y2=\"23.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"125.61215932167728\" y1=\"23.0\" x2=\"140.33459118601274\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"140.33459118601274\" y1=\"31.5\" x2=\"140.33459118601274\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"140.33459118601274\" y1=\"48.5\" x2=\"125.61215932167728\" y2=\"57.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"125.61215932167728\" y1=\"57.0\" x2=\"110.88972745734182\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"110.88972745734182\" y1=\"48.5\" x2=\"110.88972745734182\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"110.88972745734182\" y1=\"31.5\" x2=\"125.61215932167728\" y2=\"23.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"110.88972745734182\" y=\"10\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">2 hexagons</text><text x=\"110.88972745734182\" y=\"73\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">11 sticks</text><line x1=\"195.0570230503482\" y1=\"23.0\" x2=\"209.77945491468364\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"209.77945491468364\" y1=\"31.5\" x2=\"209.77945491468364\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"209.77945491468364\" y1=\"48.5\" x2=\"195.0570230503482\" y2=\"57.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"195.0570230503482\" y1=\"57.0\" x2=\"180.33459118601274\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"180.33459118601274\" y1=\"48.5\" x2=\"180.33459118601274\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"180.33459118601274\" y1=\"31.5\" x2=\"195.0570230503482\" y2=\"23.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"224.50188677901912\" y1=\"23.0\" x2=\"239.22431864335456\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"239.22431864335456\" y1=\"31.5\" x2=\"239.22431864335456\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"239.22431864335456\" y1=\"48.5\" x2=\"224.50188677901912\" y2=\"57.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"224.50188677901912\" y1=\"57.0\" x2=\"209.77945491468367\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"209.77945491468367\" y1=\"48.5\" x2=\"209.77945491468367\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"209.77945491468367\" y1=\"31.5\" x2=\"224.50188677901912\" y2=\"23.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"253.94675050769\" y1=\"23.0\" x2=\"268.6691823720255\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"268.6691823720255\" y1=\"31.5\" x2=\"268.6691823720255\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"268.6691823720255\" y1=\"48.5\" x2=\"253.94675050769\" y2=\"57.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"253.94675050769\" y1=\"57.0\" x2=\"239.22431864335456\" y2=\"48.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"239.22431864335456\" y1=\"48.5\" x2=\"239.22431864335456\" y2=\"31.5\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"239.22431864335456\" y1=\"31.5\" x2=\"253.94675050769\" y2=\"23.0\" stroke=\"#E4572E\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"224.50188677901912\" y=\"10\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">3 hexagons</text><text x=\"224.50188677901912\" y=\"73\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">16 sticks</text></svg>", "steps": ["The first hexagon needs 6 sticks.", "Each new hexagon shares one side, so it needs 5 more sticks.", "10 hexagons: 6 + 9 × 5 = 51 sticks."], "tip": "Rule: sticks = 5 × (number of hexagons) + 1. Check: 5 × 3 + 1 = 16. <span class=\"ok\">✓</span>", "unit": "", "correct": "51", "ansText": "51"}, {"n": 22, "sec": "C", "pts": 5, "topic": "Logic", "kind": "fill", "text": "I think of a number. I subtract 6 and then multiply by 4. The answer is 48. What is my number?", "fig": "", "steps": ["Work backwards. Undo “multiply by 4”: 48 ÷ 4 = 12.", "Undo “subtract 6”: 12 + 6 = 18.", "Check: (18 − 6) × 4 = 48. <span class=\"ok\">✓</span>"], "tip": "Reverse the steps and use the opposite operations.", "unit": "", "correct": "18", "ansText": "18"}, {"n": 23, "sec": "C", "pts": 5, "topic": "Geometry", "kind": "fill", "text": "How many rectangles of any size are in this 2 × 2 grid? (Squares count as rectangles.)", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\" width=\"96\" height=\"96\"><rect x=\"4\" y=\"4\" width=\"88\" height=\"88\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><line x1=\"48\" y1=\"4\" x2=\"48\" y2=\"92\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"4\" y1=\"48\" x2=\"92\" y2=\"48\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["A rectangle is fixed by choosing 2 of the 3 vertical lines and 2 of the 3 horizontal lines.", "Ways to choose 2 vertical lines: 3. Ways to choose 2 horizontal lines: 3.", "3 × 3 = 9 rectangles."], "tip": "Rectangles in a grid = (vertical line pairs) × (horizontal line pairs).", "unit": "", "correct": "9", "ansText": "9"}, {"n": 24, "sec": "C", "pts": 5, "topic": "Word Problems", "kind": "fill", "text": "Two boxes hold 64 pencils altogether. One box has 10 more pencils than the other. How many pencils are in the bigger box?", "fig": "", "steps": ["Take away the extra 10: 64 − 10 = 54.", "Share equally: 54 ÷ 2 = 27 pencils in the smaller box.", "Bigger box: 27 + 10 = 37. Check: 37 + 27 = 64 <span class=\"ok\">✓</span>."], "tip": "Bigger number = (total + difference) ÷ 2 = (64 + 10) ÷ 2 = 37.", "unit": "", "correct": "37", "ansText": "37"}, {"n": 25, "sec": "C", "pts": 5, "topic": "Number Sense", "kind": "fill", "text": "What is the largest three-digit number whose digits are all different and add up to 10?", "fig": "", "steps": ["To make the number large, use the largest hundreds digit: 9.", "The other two digits must add up to 1, so they are 1 and 0.", "Put the larger one in the tens place: 910."], "tip": "Build the largest number from the left: the biggest possible digit in each place.", "unit": "", "correct": "910", "ansText": "910"}]}, {"id": 4, "medal": "Platinum", "level": "Challenge", "grade": "Grade 4", "color": "#4F6D8F", "blurb": "Olympiad-style reasoning: truth puzzles, grid counting and clever shortcuts.", "qs": [{"n": 1, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "What is 25 × 16?", "fig": "", "steps": ["16 = 4 × 4.", "25 × 4 = 100, and 100 × 4 = 400."], "tip": "Split the other number to make 25 × 4 = 100.", "unit": "", "options": ["350", "400", "425", "410", "40"], "correct": 1, "ansText": "400"}, {"n": 2, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>3, 4, 7, 11, 18, ___</b>", "fig": "", "steps": ["Each number is the sum of the two before it: 3 + 4 = 7, 4 + 7 = 11, 7 + 11 = 18.", "11 + 18 = 29."], "tip": "When the jumps look random, try adding the previous two numbers.", "unit": "", "options": ["25", "28", "29", "26", "36"], "correct": 2, "ansText": "29"}, {"n": 3, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "How many lines of symmetry does a regular pentagon have?", "fig": "", "steps": ["Each line goes from a corner to the middle of the opposite side.", "A pentagon has 5 corners, so there are 5 lines."], "tip": "A regular shape has as many lines of symmetry as sides.", "unit": "", "options": ["1", "2", "10", "0", "5"], "correct": 4, "ansText": "5"}, {"n": 4, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "Four friends share 3 pizzas equally. Each pizza is cut into 8 equal slices. How many slices does each friend get?", "fig": "", "steps": ["Total slices: 3 × 8 = 24.", "24 ÷ 4 = 6 slices each."], "tip": "Find the total first, then share it equally.", "unit": "", "options": ["8", "4", "6", "12", "24"], "correct": 2, "ansText": "6"}, {"n": 5, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "What is <span class=\"fr\"><span class=\"nu\">2</span><span class=\"de\">3</span></span> of 45?", "fig": "", "steps": ["<span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">3</span></span> of 45 = 45 ÷ 3 = 15.", "<span class=\"fr\"><span class=\"nu\">2</span><span class=\"de\">3</span></span> of 45 = 2 × 15 = 30."], "tip": "Divide by the bottom number, then multiply by the top number.", "unit": "", "options": ["15", "20", "40", "90", "30"], "correct": 4, "ansText": "30"}, {"n": 6, "sec": "A", "pts": 3, "topic": "Logic", "kind": "mc", "text": "Each shape stands for a number.<br><span class='shapes'><svg class=\"tok\" viewBox=\"0 0 18 18\" width=\"18\" height=\"18\"><rect x=\"2\" y=\"2\" width=\"14\" height=\"14\" fill=\"#E9ECF7\" stroke=\"currentColor\" stroke-width=\"1.8\"/></svg> + <svg class=\"tok\" viewBox=\"0 0 18 18\" width=\"18\" height=\"18\"><rect x=\"2\" y=\"2\" width=\"14\" height=\"14\" fill=\"#E9ECF7\" stroke=\"currentColor\" stroke-width=\"1.8\"/></svg> = 18</span><br><span class='shapes'><svg class=\"tok\" viewBox=\"0 0 18 18\" width=\"18\" height=\"18\"><rect x=\"2\" y=\"2\" width=\"14\" height=\"14\" fill=\"#E9ECF7\" stroke=\"currentColor\" stroke-width=\"1.8\"/></svg> + <svg class=\"tok\" viewBox=\"0 0 18 18\" width=\"18\" height=\"18\"><polygon points=\"9.0,2 16,16 2,16\" fill=\"#FBE0D8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg> + <svg class=\"tok\" viewBox=\"0 0 18 18\" width=\"18\" height=\"18\"><polygon points=\"9.0,2 16,16 2,16\" fill=\"#FBE0D8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg> = 21</span><br>What number does <svg class=\"tok\" viewBox=\"0 0 18 18\" width=\"18\" height=\"18\"><polygon points=\"9.0,2 16,16 2,16\" fill=\"#FBE0D8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg> stand for?", "fig": "", "steps": ["Two equal squares make 18, so one square = 9.", "9 + two triangles = 21, so two triangles = 12.", "One triangle = 12 ÷ 2 = 6."], "tip": "Solve the line with only one kind of shape first.", "unit": "", "options": ["6", "9", "12", "3", "4"], "correct": 0, "ansText": "6"}, {"n": 7, "sec": "A", "pts": 3, "topic": "Counting", "kind": "mc", "text": "How many odd numbers are there between 30 and 90?", "fig": "", "steps": ["The odd numbers are 31, 33, …, 89.", "From 31 to 89 is 58, which is 29 jumps of 2.", "29 jumps means 29 + 1 = 30 numbers."], "tip": "Numbers in a list: (last − first) ÷ step + 1.", "unit": "", "options": ["29", "31", "60", "59", "30"], "correct": 4, "ansText": "30"}, {"n": 8, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "June 1 is a Wednesday. What day of the week is June 30 of the same year?", "fig": "", "steps": ["Wednesdays in June: 1, 8, 15, 22, 29.", "June 30 is 1 day after June 29.", "Wednesday + 1 day = Thursday."], "tip": "Dates 7 apart fall on the same day of the week.", "unit": "", "options": ["Wednesday", "Friday", "Tuesday", "Thursday", "Saturday"], "correct": 3, "ansText": "Thursday"}, {"n": 9, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "A movie is 2 hours 15 minutes long. It ends at 5:05 p.m. What time did it start?", "fig": "", "steps": ["Go back 2 hours: 5:05 → 3:05 p.m.", "Go back 15 more minutes: 3:05 → 2:50 p.m."], "tip": "Count backwards: whole hours first, then minutes.", "unit": "", "options": ["3:50 p.m.", "2:40 p.m.", "2:50 p.m.", "3:10 p.m.", "2:15 p.m."], "correct": 2, "ansText": "2:50 p.m."}, {"n": 10, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "The side length of a square is tripled. The area of the new square is how many times the area of the old square?", "fig": "", "steps": ["Try a square with side 1: area 1.", "Triple the side to 3: area 3 × 3 = 9.", "9 ÷ 1 = 9 times."], "tip": "Test with easy numbers.", "unit": "", "options": ["3", "6", "12", "9", "27"], "correct": 3, "ansText": "9"}, {"n": 11, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "What is the remainder when 5,672 is divided by 9?", "fig": "", "steps": ["A number and the sum of its digits leave the same remainder when divided by 9.", "5 + 6 + 7 + 2 = 20, and 20 ÷ 9 = 2 remainder 2.", "Check: 9 × 630 = 5,670, and 5,672 − 5,670 = 2."], "tip": "Dividing by 9? Add the digits.", "unit": "", "options": ["2", "0", "1", "7", "8"], "correct": 0, "ansText": "2"}, {"n": 12, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "Exactly one of Dan, Eve and Fay broke the vase. Dan says, “Eve did it.” Eve says, “Fay did it.” Fay says, “Eve is lying.” Exactly two of them are telling the truth. Who broke the vase?", "fig": "", "steps": ["Test each person and count the true statements.", "If Dan did it: Dan false, Eve false, Fay true → 1 true. <span class=\"no\">✗</span>", "If Eve did it: Dan true, Eve false, Fay true → 2 true. <span class=\"ok\">✓</span>", "If Fay did it: Dan false, Eve true, Fay false → 1 true. <span class=\"no\">✗</span> So Eve broke the vase."], "tip": "Suppose each person did it, then check the rule.", "unit": "", "options": ["Dan", "Fay", "Eve", "Nobody", "It cannot be decided"], "correct": 2, "ansText": "Eve"}, {"n": 13, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "How many two-digit numbers have digits that add up to 10?", "fig": "", "steps": ["List them: 19, 28, 37, 46, 55, 64, 73, 82, 91.", "There are 9."], "tip": "Go through the tens digits 1 to 9 in order.", "unit": "", "options": ["10", "8", "11", "9", "19"], "correct": 3, "ansText": "9"}, {"n": 14, "sec": "B", "pts": 4, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>1, 4, 13, 40, ___</b>", "fig": "", "steps": ["Each number is 3 times the one before, plus 1: 1 × 3 + 1 = 4, 4 × 3 + 1 = 13, 13 × 3 + 1 = 40.", "40 × 3 + 1 = 121."], "tip": "The jumps (3, 9, 27) are multiplying by 3 — try a “× 3” rule.", "unit": "", "options": ["120", "121", "80", "122", "160"], "correct": 1, "ansText": "121"}, {"n": 15, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "Together, 5 notebooks and 2 pens cost $19. One notebook costs $3. How much does one pen cost?", "fig": "", "steps": ["5 notebooks cost 5 × $3 = $15.", "2 pens cost $19 − $15 = $4.", "One pen costs $4 ÷ 2 = $2."], "tip": "Subtract the part you know, then share what is left.", "unit": "", "options": ["$4", "$3", "$1", "$7", "$2"], "correct": 4, "ansText": "$2"}, {"n": 16, "sec": "B", "pts": 4, "topic": "Geometry", "kind": "mc", "text": "What is the smaller angle between the hands of a clock at 10:00?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 160 160\" width=\"160\" height=\"160\"><circle cx=\"80\" cy=\"80\" r=\"66\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><line x1=\"80.0\" y1=\"22.0\" x2=

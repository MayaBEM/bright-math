<title>Boo Manor Escape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a moonlit house you climb room by room; rooms are glowing windows, each opening onto a cream "spell letter" card beside a big number pad. */
:root{
  --night:#18213A; --night2:#222E48; --night3:#2C3B5A; --line:#3D5175; --sky2:#121A2E;
  --paper:#F7EFDD; --paper2:#E9DCBE; --ink:#2B241E; --ink2:#6B5D4E;
  --pumpkin:#EE8836; --pumpkin-d:#B95F1C; --moon:#F4C95D; --glow:#FFD98A; --mint:#8ED3B5; --mint-d:#3E8F6E;
  --rose:#E2786C; --cream:#FBF5E8; --muted:#A8B6CB; --wood:#8E5E3B;
  --display:'Grandstander','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Segoe UI',system-ui,sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}

/* sky */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--sky2) 0%,var(--night) 60%,#1E2A44 100%)}
.moonglow{position:fixed;right:6%;top:40px;pointer-events:none;width:120px;height:120px;border-radius:50%;background:var(--moon);box-shadow:0 0 60px 20px rgba(244,201,93,.25);z-index:0;pointer-events:none;opacity:.9}
.moonglow::before,.moonglow::after{content:"";position:absolute;border-radius:50%;background:#E5B649}
.moonglow::before{width:18px;height:18px;left:62px;top:28px}.moonglow::after{width:10px;height:10px;left:34px;top:70px}
.bat{position:fixed;z-index:0;pointer-events:none;width:44px;opacity:.85;top:110px;left:-60px;animation:flyA 22s linear infinite}
.bat.b2{top:260px;width:30px;animation:flyB 31s linear 6s infinite}
.bat svg{width:100%;height:auto;animation:flap .35s ease-in-out infinite alternate;transform-origin:center}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
@keyframes flyA{0%{transform:translate(0,0)}25%{transform:translate(30vw,-40px)}50%{transform:translate(60vw,20px)}75%{transform:translate(90vw,-30px)}100%{transform:translate(115vw,0)}}
@keyframes flyB{0%{transform:translate(115vw,0) scaleX(-1)}50%{transform:translate(50vw,60px) scaleX(-1)}100%{transform:translate(-10vw,10px) scaleX(-1)}}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;padding:14px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--moon);background:none;border:0;padding:0}
.brand svg{width:36px;height:36px}
.bar .sp{flex:1}
.keys{display:flex;gap:6px;align-items:center}
.keyslot{width:32px;height:32px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;background:rgba(0,0,0,.15)}
.keyslot.got{border:2px solid var(--moon);background:rgba(244,201,93,.16);animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
.keyslot svg{width:19px;height:19px}
.stars{font-family:var(--display);font-weight:600;color:var(--moon);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.ghostbtn{background:var(--night2);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:15px}
.ghostbtn:hover{border-color:var(--muted)}
.ghostbtn.on{border-color:var(--mint);color:var(--mint)}
@keyframes popIn{from{transform:scale(.3) rotate(-30deg)}to{transform:none}}

.screen{animation:fade .35s ease-out}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* start */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;padding:18px 0 8px}
.hero h1{font-size:clamp(46px,8vw,88px);color:var(--cream)}
.hero h1 span{color:var(--moon);display:inline-block;animation:wobble 4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
.hero .tag{font-size:19px;color:var(--muted);margin:14px 0 20px;max-width:32ch}
.hero .art{display:grid;place-items:center}
.hero .art svg{width:100%;max-width:420px;height:auto;overflow:visible}
.win{animation:flicker 3.5s infinite}
.win.w2{animation-delay:1.3s}.win.w3{animation-delay:2.2s}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.55}55%{opacity:1}70%{opacity:.85}}
.name{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.name label{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);width:100%}
.name input{flex:1;min-width:0;max-width:280px;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--night2);color:var(--cream)}
.primary{background:var(--pumpkin);color:#2A1606;border:0;border-radius:12px;padding:13px 24px;font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--pumpkin-d);transition:transform .1s}
.primary:hover{filter:brightness(1.06)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pumpkin-d)}
.secondary{background:transparent;border:2px solid var(--line);border-radius:12px;padding:11px 20px;font-family:var(--display);font-weight:600;font-size:17px;color:var(--cream)}
.secondary:hover{border-color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.howto div{border-top:2px solid var(--line);padding-top:10px;font-size:15.5px;color:var(--muted)}
.howto b{display:block;font-family:var(--display);font-size:18px;color:var(--cream);margin-bottom:2px}

/* house map */
.mapgrid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;padding-top:6px}
.house{position:relative;max-width:580px;width:100%;margin:0 auto}
.house .moonglow{position:absolute;left:0;top:6px;right:auto;width:96px;height:96px;z-index:0}
.roof{height:64px;clip-path:polygon(50% 0,100% 100%,0 100%);margin:0 -4%;
  background:repeating-linear-gradient(180deg,#34456A 0 10px,#2A3956 10px 12px)}
.tower{width:46%;margin:0 auto}
.tower .roof{height:52px;margin:0}
.walls{background:#2C3B5A;padding:12px;display:grid;gap:12px;border-left:4px solid #26344F;border-right:4px solid #26344F;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 26px)}
.floor2{grid-template-columns:1fr 1fr}
.room{position:relative;min-height:150px;border-radius:70px 70px 10px 10px;border:3px solid #13192A;background:#121A2A;text-align:left;padding:30px 14px 12px;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .15s}
.room::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:9px;background:#13192A;border-radius:0 0 8px 8px}
.room>*{position:relative;z-index:1}
.room .n{font-family:var(--display);font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.06em}
.room .rn{font-family:var(--display);font-weight:800;font-size:22px}
.room .sk{font-size:14px;color:var(--muted)}
.room .st{margin-top:auto;padding-bottom:6px;display:flex;align-items:center;justify-content:space-between;font-size:14px;gap:6px}
.room .ico{position:absolute;right:12px;top:30px;width:50px;height:50px;z-index:1}
.room.open{background:radial-gradient(circle at 50% 40%,#FFE2A0 0,#F4C95D 45%,#D99A3C 100%);color:var(--ink);border-color:#5A3B1E;animation:glowPulse 2.4s ease-in-out infinite}
.room.open .n,.room.open .sk{color:#6B4A1E}
.room.open:hover{transform:translateY(-3px)}
.room.done{background:radial-gradient(circle at 50% 40%,#E8FFF4 0,#A8E2C8 50%,#6FB898 100%);color:var(--ink);border-color:#2B5A47}
.room.done .n,.room.done .sk{color:#2B5A47}
.room.locked{cursor:not-allowed}
.room.locked .rn,.room.locked .ico{opacity:.4}
.room .lock{width:22px;height:22px}
.room.shake{animation:shake .35s}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,201,93,.0),0 0 26px rgba(244,201,93,.35)}50%{box-shadow:0 0 0 6px rgba(244,201,93,.18),0 0 40px rgba(244,201,93,.5)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ground{height:16px;background:#26344F;border-radius:0 0 8px 8px;margin:0 -3%}
.door{display:flex;align-items:center;gap:14px;margin:14px auto 0;max-width:580px;width:100%;border-radius:14px;border:2px dashed var(--line);background:rgba(0,0,0,.15);padding:12px 16px;text-align:left}
.door.ready{border:2px solid var(--pumpkin);background:rgba(238,136,54,.14);animation:glowPulse 2s infinite}
.door svg{width:44px;height:44px;flex:none}
.door b{font-family:var(--display);font-size:19px;display:block}
.door span{font-size:14.5px;color:var(--muted)}
.side{background:rgba(34,46,72,.92);border-radius:var(--r);padding:16px 18px;border:1.5px solid var(--line)}
.side h3{font-size:22px;color:var(--moon);margin-bottom:6px}
.side p{margin:0 0 10px;color:var(--muted);font-size:15.5px}
.side .pipsay{display:flex;gap:12px;align-items:flex-start}
.side .pipsay svg{width:70px;height:70px;flex:none}
.msg{min-height:22px;color:var(--rose);font-size:15px;margin-top:8px}
.tbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(142,211,181,.14);border:1.5px solid var(--mint);color:var(--mint);border-radius:999px;padding:3px 10px;font-size:13.5px;font-family:var(--display);font-weight:600}

/* room play */
.roomhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.roomhead h2{font-size:30px}
.roomhead .sk{color:var(--muted);font-size:15px}
.picker{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.picker .lbl{font-size:13.5px;color:var(--muted)}
.qtab{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--night2);font-family:var(--display);font-weight:800;font-size:18px;display:grid;place-items:center;position:relative}
.qtab.cur{border-color:var(--moon);background:var(--moon);color:var(--ink);transform:scale(1.08)}
.qtab.solved{border-color:var(--mint);background:#244A40}
.qtab.solved.cur{background:var(--mint);color:var(--ink)}
.qtab.tried:not(.solved){border-color:var(--rose)}
.qtab .tick{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--mint);color:var(--ink);font-size:11px;display:grid;place-items:center;font-family:var(--body);font-weight:700}
.keybar{display:flex;align-items:center;gap:10px;margin:-2px 0 14px;font-size:15px;color:var(--muted)}
.keybar .meter{flex:1;max-width:260px;height:12px;border-radius:999px;background:var(--night2);border:1.5px solid var(--line);overflow:hidden}
.keybar .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pumpkin),var(--moon));transition:width .5s}
.play{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:22px 24px 20px;position:relative;box-shadow:0 10px 0 -4px var(--paper2),0 20px 40px rgba(0,0,0,.25)}
.card .seal{position:absolute;right:-10px;top:-12px;width:56px;height:56px;border-radius:50%;background:var(--pumpkin);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 3px 0 var(--pumpkin-d);transform:rotate(8deg)}
.qno{font-family:var(--display);font-weight:800;font-size:15px;color:var(--pumpkin-d);letter-spacing:.04em}
.intro{margin:4px 0 0;color:var(--ink2);font-size:16px}
.story{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:8px}
.story .scene{width:112px;height:112px;display:grid;place-items:center;background:#FFF8EA;border:2px solid #E3D3B0;border-radius:18px;padding:10px;animation:scenePop .5s cubic-bezier(.3,1.5,.5,1)}
.story .scene svg{width:100%;height:100%;animation:bob 3.4s ease-in-out .5s infinite}
@keyframes scenePop{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.story p{font-size:23px;line-height:1.42;margin:0;max-width:36ch}
.story p b{color:var(--pumpkin-d)}
.answerline{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.answerline .lbl{font-family:var(--display);font-weight:600;color:var(--ink2)}
.ansbox{min-width:160px;height:64px;border-radius:12px;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:38px;color:var(--ink);padding:0 14px;font-variant-numeric:tabular-nums;transition:background .2s}
.ansbox.empty{color:#C9B999}
.ansbox.right{border-color:var(--mint-d);background:#E6F6EE;animation:popIn .45s cubic-bezier(.3,1.6,.5,1)}
.ansbox.wrong{border-color:#B9483D;background:#FBE7E3;animation:shake .35s}
.unit{font-size:20px;color:var(--ink2)}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.chip{background:transparent;border:2px solid #CDBB98;border-radius:999px;padding:6px 14px;font-size:15px;color:var(--ink);font-weight:700}
.chip:hover{border-color:var(--ink2)}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:18px;display:flex;gap:12px;align-items:flex-start;animation:fade .3s}
.feedback svg{width:48px;height:48px;flex:none}
.feedback.ok{background:#E3F3EA;border:2px solid #9CCFB5}
.feedback.hint{background:#FCEFD6;border:2px solid #E7C984}
.feedback.show{background:#EEF0F7;border:2px solid #B9C3DA}
.feedback b{font-family:var(--display)}
.steps{margin:6px 0 0;padding-left:20px;font-size:17px}
.steps li{margin:2px 0;font-variant-numeric:tabular-nums}
.pic{margin-top:14px;background:#fff;border:2px dashed #CDBB98;border-radius:12px;padding:12px;overflow-x:auto;animation:fade .3s}
.pic svg{display:block;max-width:100%;height:auto}
.pic .cap{font-size:15px;color:var(--ink2);margin-top:6px}
.tstrip{margin-top:16px;border-top:2px dashed #CDBB98;padding-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px}
.tstrip .ta{font-family:var(--display);font-weight:800;color:var(--mint-d)}
.tstrip button{border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:700;border:2px solid var(--mint-d);background:#E3F3EA;color:var(--ink)}
.tstrip button.no{border-color:#C9B999;background:transparent}

/* keypad */
.pad{background:rgba(34,46,72,.95);border-radius:var(--r);padding:14px;border:1.5px solid var(--line);display:grid;gap:10px}
.keysgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.k{height:62px;border-radius:12px;border:0;background:var(--night3);font-family:var(--display);font-weight:800;font-size:28px;color:var(--cream);box-shadow:0 3px 0 #141C30;transition:transform .08s}
.k:hover{background:#3A4E6E}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 #141C30}
.k.del{font-size:17px;font-weight:600}
.pad .primary{width:100%;font-size:22px;padding:15px}
.pad .note{font-size:13.5px;color:var(--muted);text-align:center}

/* candy burst */
.candy{position:fixed;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:40;transition:transform .9s cubic-bezier(.15,.7,.3,1),opacity .9s ease-in}
.candy.sq{border-radius:3px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(8,12,22,.75);display:grid;place-items:center;z-index:30;animation:fade .25s;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pop{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px 26px 22px;max-width:470px;width:100%;text-align:center;animation:popIn .45s cubic-bezier(.3,1.5,.5,1);max-height:100%;overflow:auto}
.pop h2{font-size:34px;margin:6px 0 4px}
.pop p{font-size:18px;margin:6px 0 16px;color:var(--ink2)}
.pop .big{height:130px;display:grid;place-items:center}
.pop .big svg{width:130px;height:130px}
.spinkey{animation:spinKey 1.1s cubic-bezier(.3,1.4,.5,1)}
@keyframes spinKey{0%{transform:scale(.2) rotate(-540deg);opacity:0}70%{transform:scale(1.15) rotate(10deg);opacity:1}100%{transform:none}}
.pop .stars3{font-size:26px;color:var(--pumpkin);letter-spacing:3px;margin:4px 0}
.pop .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pop .secondary{color:var(--ink);border-color:#CDBB98}
/* door finale */
.finale{perspective:700px;width:170px;height:210px;margin:0 auto 6px;position:relative}
.finale .light{position:absolute;inset:8px 10px 0;border-radius:80px 80px 0 0;background:radial-gradient(circle at 50% 60%,#FFF6D8,#F4C95D 60%,#EE8836);}
.finale .leaf{position:absolute;top:8px;bottom:0;width:calc(50% - 10px);background:var(--wood);border:3px solid var(--ink);transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.5,0,.2,1) .3s}
.finale .leaf.l{left:10px;border-radius:80px 0 0 0;transform-origin:left center}
.finale .leaf.r{right:10px;border-radius:0 80px 0 0;transform-origin:right center}
.finale.open .leaf.l{transform:rotateY(-105deg)}
.finale.open .leaf.r{transform:rotateY(105deg)}
.finale .pipout{position:absolute;left:50%;bottom:10px;width:80px;margin-left:-40px;opacity:0;transform:translateY(20px) scale(.6);transition:all .9s ease-out 1.2s}
.finale.open .pipout{opacity:1;transform:none}

/* teacher */
.teacher{max-width:960px;margin:0 auto}
.teacher h2{font-size:32px;color:var(--moon);margin:8px 0 4px}
.teacher .lead{color:var(--muted);max-width:66ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 14px}
.tab{border:2px solid var(--line);background:var(--night2);border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:600}
.tab.on{background:var(--moon);color:var(--ink);border-color:var(--moon)}
.panel{background:rgba(34,46,72,.95);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.ctl section{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:rgba(0,0,0,.12)}
.ctl h3{font-size:18px;margin-bottom:6px}
.ctl p{font-size:14.5px;color:var(--muted);margin:0 0 10px}
.toggle{display:flex;align-items:center;gap:10px;font-size:16px}
.toggle input{width:22px;height:22px;accent-color:var(--pumpkin)}
.roomrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.roomrow:last-child{border-bottom:0}
.mini{border-radius:999px;padding:5px 12px;font-size:14px;border:2px solid var(--line);background:var(--night3)}
.mini.on{border-color:var(--moon);background:rgba(244,201,93,.18);color:var(--moon)}
.need{display:flex;gap:6px}
.need button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--night3);font-family:var(--display);font-weight:800}
.need button.on{background:var(--moon);color:var(--ink);border-color:var(--moon)}
.res{overflow-x:auto}
.res table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.res th,.res td{border:1px solid var(--line);padding:8px;text-align:center}
.res th{font-family:var(--display);font-weight:600;background:var(--night3)}
.res td:first-child{text-align:left;font-family:var(--display);font-weight:600}
.cell{width:100%;min-height:44px;border-radius:8px;border:0;background:transparent;font-size:14px;line-height:1.2}
.cell.s1{background:#244A40;color:#CFF3E2}
.cell.s2{background:#4A3A24;color:#FFE2A8}
.cell.s3{background:#4A2A2A;color:#FFC9C2}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.editor .er{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.editor .er button{border-radius:999px;padding:6px 14px;border:2px solid var(--line);background:var(--night3);font-family:var(--display);font-weight:600}
.editor .er button.on{background:var(--pumpkin);border-color:var(--pumpkin);color:#2A1606}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label{font-size:13.5px;color:var(--muted);font-family:var(--display);font-weight:600}
.f input,.f textarea,.f select{font:inherit;font-size:16px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:#141C30;color:var(--cream);width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qed{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;background:rgba(0,0,0,.12)}
.qed h4{font-family:var(--display);margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.qed .chk{font-size:13.5px;font-family:var(--body);color:var(--mint)}
.qed .chk.bad{color:var(--rose)}
.savebar{position:sticky;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;background:rgba(24,33,58,.96);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.savebar .ok{color:var(--mint);font-size:14.5px}
.tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tk section{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.tk h3{font-size:18px}.tk .s{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.tk ol{margin:0;padding-left:20px;font-size:14.5px}.tk li{margin:4px 0}.tk li b{color:var(--moon)}
.gate{max-width:420px;margin:40px auto;text-align:center}
.gate input{font:inherit;font-size:24px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--night2);color:var(--cream);width:160px;text-align:center}

/* certificate */
.cert{background:var(--paper);color:var(--ink);border-radius:18px;max-width:720px;margin:10px auto;padding:30px 28px;text-align:center;border:6px double #CDBB98;animation:popIn .6s cubic-bezier(.3,1.4,.5,1)}
.cert .kick{font-family:var(--display);font-weight:600;color:var(--pumpkin-d);letter-spacing:.12em;font-size:14px}
.cert h2{font-size:clamp(34px,6vw,52px);margin:6px 0}
.cert .who{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);border-bottom:2px solid var(--ink);display:inline-block;padding:0 18px 2px;margin:10px 0 6px;min-width:60%}
.cert p{font-size:18px;color:var(--ink2);max-width:46ch;margin:8px auto}
.cert .meta{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:14px 0 6px;font-family:var(--display);font-weight:600}
.cert .ghosts{display:flex;justify-content:center;gap:10px;margin:8px 0}
.cert .ghosts svg{width:60px;height:60px}
.cert .ghosts span:nth-child(2){animation-delay:.6s}.cert .ghosts span:nth-child(3){animation-delay:1.2s}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}.hero .art{order:-1}.hero .art svg{max-width:260px}
  .mapgrid,.play{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr}
  .frow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .picker{margin-left:0;width:100%}
  .k{height:56px}
  .house .moonglow{width:64px;height:64px}
}
@media (max-width:480px){
  .story{grid-template-columns:1fr}.story .scene{width:88px;height:88px}
  .story p{font-size:20px}.card{padding:18px 16px}
  .room{min-height:132px;padding-top:26px}.room .rn{font-size:18px}.room .ico{width:36px;height:36px}
  .floor2{gap:8px}.walls{padding:8px}
  .brand span{display:none}
  .qtab{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bat{display:none}}

function barsPic(g,n){ // g equal bars of n, total ?
  const W=Math.min(560,g*92), bw=W/g, h=40; let s='';
  for(let i=0;i<g;i++) s+=`<rect x="${i*bw+1}" y="22" width="${bw-2}" height="${h}" rx="6" fill="#FFE7B0" stroke="#2B241E" stroke-width="2"/><text x="${i*bw+bw/2}" y="${22+h/2+7}" text-anchor="middle" font-family="Grandstander,system-ui" font-weight="800" font-size="20" fill="#2B241E">${n}</text>`;
  s+=`<path d="M2 78 v8 h${W-4} v-8" fill="none" stroke="#2B241E" stroke-width="2"/><text x="${W/2}" y="108" text-anchor="middle" font-family="Grandstander,system-ui" font-weight="800" font-size="22" fill="#B95F1C">?</text>`;
  s+=`<text x="2" y="14" font-family="Andika,system-ui" font-size="14" fill="#6B5D4E">${g} groups of ${n}</text>`;
  return `<svg viewBox="0 0 ${W} 114" width="${W}" role="img" aria-label="${g} equal bars of ${n}, total unknown">${s}</svg>`;
}
function sharePic(total,g){
  const W=Math.min(560,Math.max(300,g*110)), bw=W/g; let s=`<rect x="1" y="6" width="${W-2}" height="40" rx="6" fill="#FFE7B0" stroke="#2B241E" stroke-width="2"/><text x="${W/2}" y="33" text-anchor="middle" font-family="Grandstander,system-ui" font-weight="800" font-size="20" fill="#2B241E">${total}</text>`;
  for(let i=0;i<g;i++) s+=`<rect x="${i*bw+1}" y="62" width="${bw-2}" height="40" rx="6" fill="#DDF1E7" stroke="#2B241E" stroke-width="2"/><text x="${i*bw+bw/2}" y="89" text-anchor="middle" font-family="Grandstander,system-ui" font-weight="800" font-size="20" fill="#B95F1C">?</text>`;
  return `<svg viewBox="0 0 ${W} 108" width="${W}" role="img" aria-label="${total} shared into ${g} equal parts">${s}</svg>`;
}
function groupsOfPic(total,n){
  const W=Math.min(560,Math.max(320,(total/n)*90)); let s=`<rect x="1" y="6" width="${W-2}" height="40" rx="6" fill="#FFE7B0" stroke="#2B241E" stroke-width="2"/><text x="${W/2}" y="33" text-anchor="middle" font-family="Grandstander,system-ui" font-weight="800" font-size="20" fill="#2B241E">${total}</text>`;

}
function picHTML(p){
  if(!p||!p.type||p.type==='none') return '';
  if(p.type==='bars') return `<div class="pic">${barsPic(+p.g,+p.n)}<div class="cap">Each bar is one group. Add the bars together.</div></div>`;
  if(p.type==='share') return `<div class="pic">${sharePic(+p.total,+p.g)}<div class="cap">${p.total} split into ${p.g} equal parts. What goes in one part?</div></div>`;
  return `<div class="pic">${groupsOfPic(+p.total,+p.n)}<div class="cap">Keep making groups of ${p.n} until you reach ${p.total}.</div></div>`;
}

      if(shoot){shoot.l+=14;ctx.globalAlpha=Math.max(0,1-shoot.l/260);ctx.strokeStyle='#FFF4D6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(shoot.x+shoot.l,shoot.y+shoot.l*.4);ctx.lineTo(shoot.x+shoot.l-60,shoot.y+shoot.l*.4-24);ctx.stroke();if(shoot.l>260)shoot=null}}

function burst(el){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r=el.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, cols=['#EE8836','#F4C95D','#8ED3B5','#E2786C','#FBF5E8'];
  for(let i=0;i<26;i++){const d=document.createElement('span');d.className='candy'+(i%3?'':' sq');d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%5];document.body.appendChild(d);
    const a=Math.random()*6.28, v=80+Math.random()*140;requestAnimationFrame(()=>{d.style.transform=`translate(${Math.cos(a)*v}px,${Math.sin(a)*v-60}px) rotate(${Math.random()*360}deg)`;d.style.opacity='0'});
    setTimeout(()=>d.remove(),1000)}

  tp.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const i=+b.dataset.k;P.keys[i]=!P.keys[i];if(!allKeys())P.escaped=P.escaped&&P.riddle.s===1;saveP();tControls();topbar()});
  document.getElementById('savename').onclick=()=>{P.name=document.getElementById('pn').value.trim().slice(0,20);saveP();document.getElementById('cmsg').style.color='var(--mint)';document.getElementById('cmsg').textContent='Name saved.'};
  let armed=false; document.getElementById('newp').onclick=e=>{if(!armed){armed=true;e.target.textContent='Tap again to clear';return} P=blankProg();saveP();tControls();topbar();document.getElementById('cmsg').style.color='var(--mint)';document.getElementById('cmsg').textContent='Progress cleared. Ready for a new player.'};
}
function tResults(){
  const tp=document.getElementById('tp'); const maxQ=Math.max(...CONTENT.rooms.map(r=>r.qs.length));
  const cell=(p,i,j)=>{const cls=p.s?(p.f?'s1':'s2'):p.t?'s3':'';const txt=p.s?(p.f?'★ first try':`✓ after ${p.t} ${p.t===1?'try':'tries'}`):p.t?`✗ ${p.t} ${p.t===1?'try':'tries'}`:'not tried';
    return `<button class="cell ${cls}" data-i="${i}" data-j="${j}" title="Click to change">${txt}</button>`};
  tp.innerHTML=`<p style="margin:0 0 10px;color:var(--muted)">Click any cell to change it: not tried → ★ first try → ✓ solved later → ✗ not yet.</p>
   <div class="res"><table><thead><tr><th>Room</th>${Array.from({length:maxQ},(_,j)=>`<th>Story ${j+1}</th>`).join('')}<th>Key</th></tr></thead><tbody>
   ${CONTENT.rooms.map((R,i)=>`<tr><td>${i+1}. ${esc(R.name)}</td>${Array.from({length:maxQ},(_,j)=>`<td>${P.q[i][j]?cell(P.q[i][j],i,j):''}</td>`).join('')}<td>${P.keys[i]?'✓':'—'}</td></tr>`).join('')}
   <tr><td>Riddle lock</td><td colspan="${maxQ}">${cell(P.riddle,'r',0)}</td><td>${P.escaped?'Escaped':'—'}</td></tr></tbody></table></div>
   <div class="legend"><span><i style="background:#244A40"></i>first try</span><span><i style="background:#4A3A24"></i>solved after a hint</span><span><i style="background:#4A2A2A"></i>tried, not yet</span></div>
   <p style="margin:12px 0 0">Total: <b>${P.q.flat().filter(x=>x.s).length+(P.riddle.s?1:0)}</b> of ${totalQs()} solved · <b>★ ${stars()}</b> first-try stars</p>`;
  tp.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{const p=b.dataset.i==='r'?P.riddle:P.q[+b.dataset.i][+b.dataset.j];
    if(!p.s&&!p.t){p.s=1;p.f=true}else if(p.s&&p.f){p.f=false;p.t=Math.max(1,p.t)}else if(p.s){p.s=0;p.t=Math.max(1,p.t)}else{p.s=0;p.f=false;p.t=0}
    if(b.dataset.i!=='r')checkKey(+b.dataset.i); else if(p.s) P.escaped=true; saveP();topbar();tResults()});
}
function tEdit(){
  const tp=document.getElementById('tp'), isR=edRoom===5, R=isR?null:CONTENT.rooms[edRoom];
  const qForm=(q,j)=>{const pic=q.pic||{type:'none'};
    return `<div class="qed" data-j="${j}"><h4><span>${isR?'Riddle lock':`Story ${j+1}`}</span><span class="chk" id="chk${j}"></span></h4>
     <div class="f"><label>Story text (numbers turn bold on their own)</label><textarea data-f="t">${esc(q.t)}</textarea></div>
     <div class="f"><label>Story picture</label><div style="display:flex;gap:10px;align-items:center"><span class="edpic" style="width:52px;height:52px;flex:none;background:#FFF8EA;border-radius:10px;padding:5px">${ICONS[q.img]||''}</span><select data-f="img">${PICS.map(([k,l])=>`<option value="${k}" ${q.img===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
     <div class="frow"><div class="f"><label>Answer (a whole number)</label><input data-f="a" inputmode="numeric" value="${esc(q.a)}"></div>
      <div class="f"><label>Unit word</label><input data-f="unit" value="${esc(q.unit||'')}" placeholder="e.g. cookies or ¢"></div>
      ${isR?'':`<div class="f"><label>Bar model</label><select data-f="ptype"><option value="none" ${pic.type==='none'?'selected':''}>No bar model</option><option value="bars" ${pic.type==='bars'?'selected':''}>Equal groups (×)</option><option value="share" ${pic.type==='share'?'selected':''}>Share into parts (÷)</option><option value="groupsof" ${pic.type==='groupsof'?'selected':''}>Groups of (÷)</option></select></div>
      <div class="f"><label>Bar model numbers</label><input data-f="pnums" value="${pic.type==='bars'?`${pic.g} x ${pic.n}`:pic.type==='share'?`${pic.total} / ${pic.g}`:pic.type==='groupsof'?`${pic.total} by ${pic.n}`:''}" placeholder="3 x 10 · 48 / 4 · 50 by 10"></div>`}</div>
     <div class="f"><label>Hint (shown after the first wrong answer)</label><input data-f="hint" value="${esc(q.hint||'')}"></div>
     <div class="f"><label>Worked steps (one step per line)</label><textarea data-f="steps">${esc((q.steps||[]).join('\n'))}</textarea></div></div>`};
  tp.innerHTML=`<div class="editor"><div class="er">${CONTENT.rooms.map((r,i)=>`<button data-r="${i}" class="${edRoom===i?'on':''}">Room ${i+1}</button>`).join('')}<button data-r="5" class="${isR?'on':''}">Riddle</button></div>
   ${isR?'':`<div class="frow"><div class="f"><label>Room name</label><input id="rn" value="${esc(R.name)}"></div><div class="f"><label>Skill</label><input id="rs" value="${esc(R.skill)}"></div>
     <div class="f" style="grid-column:span 2"><label>Room welcome line</label><input id="ri" value="${esc(R.intro)}"></div></div>`}
   ${isR?qForm(CONTENT.riddle,0):R.qs.map(qForm).join('')}
   <div class="savebar"><button class="primary" id="save" style="font-size:17px;padding:10px 18px">Save changes</button><button class="secondary" id="restore">Restore the original stories</button><span class="ok" id="smsg" role="status"></span></div>
   <details style="margin-top:14px"><summary style="cursor:pointer;color:var(--muted)">Copy or paste a whole question set (to move it to another device)</summary>
     <div class="f" style="margin-top:8px"><textarea id="json" style="min-height:120px;font-size:13px">${esc(JSON.stringify(CONTENT))}</textarea></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="mini" id="copyj">Copy</button><button class="mini" id="loadj">Load pasted set</button><span id="jmsg" class="msg"></span></div></details></div>`;
  tp.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{edRoom=+b.dataset.r;tEdit()});
  const read=box=>{const g=f=>box.querySelector(`[data-f="${f}"]`); const q={t:g('t').value.trim(),img:g('img').value,a:parseInt(g('a').value,10),unit:g('unit').value.trim(),hint:g('hint').value.trim(),steps:g('steps').value.split('\n').map(s=>s.trim()).filter(Boolean)};
    if(g('ptype')){const t=g('ptype').value, ns=(g('pnums').value.match(/\d+/g)||[]).map(Number);
      if(t==='bars'&&ns.length>=2)q.pic={type:'bars',g:ns[0],n:ns[1]};else if(t==='share'&&ns.length>=2)q.pic={type:'share',total:ns[0],g:ns[1]};else if(t==='groupsof'&&ns.length>=2)q.pic={type:'groupsof',total:ns[0],n:ns[1]};}
    return q};
  const validate=()=>{let ok=true;tp.querySelectorAll('.qed').forEach(box=>{const q=read(box),c=document.getElementById('chk'+box.dataset.j);
    const bad=!q.t?'Add the story text':!(Number.isInteger(q.a)&&q.a>=0&&q.a<=9999)?'Answer must be a whole number up to 9999':'';c.textContent=bad||'Looks good';c.className='chk'+(bad?' bad':'');if(bad)ok=false});return ok};
  tp.addEventListener('input',validate); validate();
  tp.querySelectorAll('[data-f="img"]').forEach(sel=>sel.onchange=()=>{sel.parentNode.querySelector('.edpic').innerHTML=ICONS[sel.value]||''});
  document.getElementById('save').onclick=()=>{const m=document.getElementById('smsg');if(!validate()){m.style.color='var(--rose)';m.textContent='Fix the stories marked in red first.';return}
    if(isR){CONTENT.riddle=read(tp.querySelector('.qed'))}else{R.name=document.getElementById('rn').value.trim()||R.name;R.skill=document.getElementById('rs').value.trim();R.intro=document.getElementById('ri').value.trim();
      tp.querySelectorAll('.qed').forEach(box=>{R.qs[+box.dataset.j]=read(box)})}
    m.style.color='var(--mint)';m.textContent=saveC()?'Saved. The game uses your new stories now.':'Saved for this visit only (this browser does not allow storage).';};
  let armed=false; document.getElementById('restore').onclick=e=>{if(!armed){armed=true;e.target.textContent='Tap again to restore';return} CONTENT=clone(DEFAULT);saveC();tEdit();document.getElementById('smsg').textContent='Original stories restored.'};
  document.getElementById('copyj').onclick=()=>{const t=document.getElementById('json');navigator.clipboard.writeText(t.value).then(()=>document.getElementById('jmsg').textContent='Copied.',()=>{t.select();document.getElementById('jmsg').textContent='Press Ctrl+C or Cmd+C to copy.'})};
  document.getElementById('loadj').onclick=()=>{const jm=document.getElementById('jmsg');try{const d=JSON.parse(document.getElementById('json').value);if(!d||!Array.isArray(d.rooms)||d.rooms.length!==5||!d.riddle)throw 0;
      d.rooms.forEach(r=>{if(!Array.isArray(r.qs)||!r.qs.length)throw 0;r.qs.forEach(q=>{if(typeof q.t!=='string'||!Number.isInteger(+q.a))throw 0;q.a=+q.a})});
      CONTENT=d;CONTENT.keyNeed=CONTENT.keyNeed||3;saveC();P.q=CONTENT.rooms.map((r,i)=>r.qs.map((_,j)=>(P.q[i]&&P.q[i][j])||{s:0,f:false,t:0}));saveP();tEdit();document.getElementById('smsg').textContent='Question set loaded.'}
    catch(e){jm.style.color='var(--rose)';jm.textContent='That text is not a Boo Manor question set.'}};
}
function tKey(){
  document.getElementById('tp').innerHTML=`<div class="tk">${CONTENT.rooms.map((R,i)=>`<section><h3>Room ${i+1} · ${esc(R.name)}</h3><div class="s">${esc(R.skill)}</div><ol>${R.qs.map(q=>`<li>${esc(q.t)} <b>${fmtA(q.a,q.unit)}</b></li>`).join('')}</ol></section>`).join('')}
   <section><h3>Front door · Riddle lock</h3><div class="s">Final challenge</div><ol><li>${esc(CONTENT.riddle.t)} <b>${CONTENT.riddle.a}</b></li></ol></section></div>`;
}

/* ================= wiring ================= */
document.getElementById('homeBtn').onclick=()=>{layer.innerHTML='';P.name?mapScreen():startScreen()};
document.getElementById('teacherBtn').onclick=()=>{layer.innerHTML='';teacherScreen()};
document.addEventListener('keydown',e=>{
  if(layer.innerHTML&&e.key==='Escape'){layer.innerHTML='';return}
  if(!document.getElementById('check')||layer.innerHTML||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(/^\d$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('del'); else if(e.key==='Enter'){e.preventDefault();check()}
});
topbar(); startScreen();
</script>

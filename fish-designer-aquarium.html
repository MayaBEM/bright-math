:root{
  --ink:#0E3A4A; --ink2:#2D5E6E; --paper:#FFF6E3; --paper2:#FFEAC0; --foam:#E2F6F3; --sea:#2AA9C9; --deep:#0F6E8F;
  --coral:#D9573F; --coral-d:#A8402C; --butter:#F4E2A6; --kelp:#1F9A6E; --warn:#B4531A; --ok:#14795A;
  --r:3px; --hard:0 2px 0 rgba(14,58,74,.4);
  --head:'Poppins',system-ui,sans-serif; --body:'Lexend',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--foam);font-size:17px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
#main{flex:1;min-height:0;position:relative;background:
  radial-gradient(ellipse at 20% 110%,#BFE9E6 0,transparent 55%),radial-gradient(ellipse at 85% -10%,#FFF1CF 0,transparent 50%),linear-gradient(#DDF3F1,#C7EAEA)}
.screen{display:none;position:absolute;inset:0;overflow:hidden}
.screen.on{display:block}
:focus-visible{outline:4px solid #1d7fd6;outline-offset:2px;border-radius:3px}

/* ---------- header (logo sits straight on the page colour, no box) ---------- */
.top{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--paper);border-bottom:2px solid var(--ink);position:relative;z-index:5}
.logo{height:52px;width:auto;display:block}
.brand{font-family:var(--head);font-weight:700;font-size:23px;margin:0;letter-spacing:-.2px;white-space:nowrap;color:var(--ink)}
.brand span{color:var(--coral)}
.steps{display:flex;gap:8px;margin-left:auto}
.step{border:2px solid var(--ink);background:#fff;border-radius:3px;padding:5px 14px 5px 8px;font-family:var(--head);font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 0 rgba(14,58,74,.4);min-height:44px}
.step b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--paper2);border:2.2px solid var(--ink);font-size:15px}
.step.on{background:var(--butter)}
.step:active{transform:translateY(2px);box-shadow:none}
.top-right{display:flex;align-items:center;gap:8px}
.shells{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);background:#fff;border-radius:3px;padding:3px 12px 3px 8px;font-family:var(--head);font-weight:700;font-size:21px;min-height:44px}
.shells.bump{animation:bump .55s}
@keyframes bump{30%{transform:scale(1.18) rotate(-3deg)}60%{transform:scale(.96)}}
.icon-btn{width:44px;height:44px;border:2px solid var(--ink);border-radius:3px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(14,58,74,.4);padding:0}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.icon-btn svg{width:24px;height:24px}
body[data-screen=welcome] .top{display:none}

/* ---------- buttons / panels ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:#fff;border-radius:var(--r);padding:8px 16px;font-family:var(--head);font-weight:600;font-size:18px;min-height:46px;box-shadow:var(--hard);transition:transform .08s,box-shadow .08s;line-height:1.1}
.btn:active{transform:translateY(1px)}
.btn svg{width:22px;height:22px}
.btn.small{padding:5px 12px;font-size:16px;min-height:42px}
.btn.primary{background:var(--deep);color:#fff;border-color:#0A4A63}
.btn.primary:hover{background:#0c5f7e}
.btn.big{font-size:24px;padding:12px 28px;min-height:60px}
.btn.ghost{background:var(--paper)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:3px;box-shadow:0 2px 0 rgba(14,58,74,.4)}

/* ---------- welcome ---------- */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.wall{flex:none;text-align:center;padding:clamp(10px,3vh,34px) 16px 20px;background:var(--paper)}
.wlogo{height:clamp(84px,18vh,150px);width:auto;margin:0 auto;display:block}
.wall h1{font-family:var(--head);font-weight:700;font-size:clamp(32px,6.4vh,58px);margin:6px 0 2px;line-height:1.05}
.wall h1 span{color:var(--coral)}
.wall p{margin:0 0 14px;font-size:clamp(16px,2.6vh,22px);color:var(--ink2)}
.wbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.wwater{flex:1;min-height:0;position:relative;overflow:hidden;border-top:2px solid var(--ink);background:linear-gradient(#8DE0F0 0,#3FB4D8 55%,#1E8CB7 100%)}
.wfish{position:absolute;width:min(30vw,300px);left:0;animation:drift 26s linear infinite}
.wfish svg{width:100%;height:auto}
.wfish.f0{top:6%;animation-duration:30s}.wfish.f1{top:30%;animation-duration:38s;animation-delay:-12s;width:min(34vw,340px)}
.wfish.f2{top:8%;animation-duration:44s;animation-delay:-30s;width:min(24vw,230px)}.wfish.f3{top:34%;animation-duration:34s;animation-delay:-20s;width:min(26vw,260px)}
.wfish.f4{top:18%;animation-duration:52s;animation-delay:-5s;width:min(28vw,280px)}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(110vw)}}
.rays{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(100deg,rgba(255,255,255,.0) 0 90px,rgba(255,255,255,.13) 90px 150px,rgba(255,255,255,0) 150px 260px);animation:rays 18s ease-in-out infinite alternate}
@keyframes rays{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.fd{position:absolute;bottom:0;display:block}
.fd svg{width:100%;height:auto;overflow:visible}
.wfloor{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none}
.sand{position:absolute;left:-5%;right:-5%;bottom:-18px;height:46%;background:linear-gradient(#F6D98B,#E2B866);border-radius:50% 50% 0 0/100% 100% 0 0;border-top:4px solid rgba(255,255,255,.4)}
.wfloor .fd.a{left:6%;width:60px;bottom:10%}.wfloor .fd.b{left:18%;width:84px;bottom:6%}.wfloor .fd.c{left:46%;width:130px;bottom:8%}.wfloor .fd.d{right:20%;width:60px;bottom:4%}.wfloor .fd.e{right:7%;width:96px;bottom:10%}
.wfloor .sand{z-index:0}.wfloor .fd{z-index:1}

/* ---------- designer ---------- */
.design{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,34vw,460px);gap:16px;padding:14px 18px 16px}
.stagecol{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.stage{flex:1;min-height:0;position:relative;border:2px solid var(--ink);border-radius:3px;overflow:hidden;box-shadow:0 10px 24px rgba(6,35,48,.22), inset 0 0 40px rgba(6,40,70,.35);background:linear-gradient(#9BE6F3 0,#47B9DC 55%,#1F8DB5 100%)}
.stage .fishwrap{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.stage .fishsvg{width:100%;height:100%}
.fishwrap.pop{animation:pop .38s ease-out}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
.bubbles-css{position:absolute;inset:0;pointer-events:none;z-index:1}
.bubbles-css i{position:absolute;bottom:-20px;width:calc(8px + var(--i)*3px);height:calc(8px + var(--i)*3px);border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.18);left:calc(var(--i)*14% - 4%);animation:rise calc(7s + var(--i)*1.3s) linear infinite;animation-delay:calc(var(--i)*-1.7s)}
@keyframes rise{to{transform:translateY(-110vh) translateX(14px)}}
.floor-deco{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:1;pointer-events:none}
.floor-deco .fd.a{left:3%;width:7%;bottom:8%}.floor-deco .fd.b{left:11%;width:10%;bottom:4%}.floor-deco .fd.c{right:3%;width:14%;bottom:6%}.floor-deco .fd.d{right:20%;width:6%;bottom:2%}.floor-deco .fd.e{right:14%;width:9%;bottom:12%}
.floor-deco .sand{height:30%;bottom:-12px}
.capbar{display:flex;align-items:center;gap:10px}
.caption{flex:1;min-width:0;font-family:var(--head);font-weight:700;font-size:30px;background:var(--paper);border:2px solid var(--ink);border-radius:3px;padding:2px 16px;min-height:56px;display:flex;align-items:center;box-shadow:0 2px 0 rgba(14,58,74,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.caption.flash{animation:flash .5s}
@keyframes flash{0%{background:var(--butter);transform:scale(1.02)}100%{background:var(--paper);transform:none}}
.namebar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.namebar label{font-family:var(--head);font-weight:600;font-size:18px;white-space:nowrap}
.name{flex:1;min-width:120px;font-family:var(--head);font-weight:600;font-size:24px;border:2px solid var(--ink);border-radius:3px;padding:6px 14px;background:#fff;color:var(--ink);min-height:52px}
.name.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.tools{display:flex;flex-direction:column;min-height:0;padding:10px;gap:8px}
.tooltabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none}
.tt{border:2px solid var(--ink);background:#fff;border-radius:3px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--head);font-weight:600;font-size:14px;min-height:56px;box-shadow:0 2px 0 rgba(14,58,74,.4);line-height:1.05}
.tt .tp{width:100%;height:26px;display:block}
.tt .tp svg{width:100%;height:100%}
.tt.on{background:var(--butter)}
.tt:active{transform:translateY(2px);box-shadow:none}
.toolbody{flex:1;min-height:0;overflow:auto;padding:4px 4px 8px;overscroll-behavior:contain}
.tb-title{display:flex;align-items:baseline;gap:10px;margin:2px 2px 8px;flex-wrap:wrap}
.tb-title b{font-family:var(--head);font-weight:700;font-size:21px}
.tb-title span{color:var(--ink2);font-size:15px}
.sub-h{font-family:var(--head);font-weight:600;font-size:17px;margin:12px 2px 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.opt{position:relative;border:2px solid var(--ink);background:#fff;border-radius:3px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 rgba(14,58,74,.4);min-height:92px}
.opt .pic{display:block;width:100%;aspect-ratio:4/3;background:linear-gradient(#bfeaf5,#7bd0ea);border-radius:3px;overflow:hidden}
.opt .pic svg{width:100%;height:100%}
.opt .lbl{font-family:var(--head);font-weight:600;font-size:14px;line-height:1.1;text-align:center}
.opt.on{background:var(--butter);border-color:var(--ink);outline:4px solid var(--coral);outline-offset:-1px}
.opt .tick{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;border:2px solid var(--ink);display:grid;place-items:center}
.opt .tick svg{width:15px;height:15px;stroke-width:3.4}
.opt:active{transform:translateY(2px);box-shadow:none}
.partrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pt{border:2px solid var(--ink);background:#fff;border-radius:3px;padding:4px 10px 4px 6px;font-family:var(--head);font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px;min-height:42px;box-shadow:0 2px 0 rgba(14,58,74,.4)}
.pt .mini{width:20px;height:20px;border-radius:50%;border:2.2px solid var(--ink);display:block}
.pt.on{background:var(--butter);outline:3px solid var(--coral);outline-offset:-1px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{border:2px solid var(--ink);background:#fff;border-radius:3px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:72px;box-shadow:0 2px 0 rgba(14,58,74,.4)}
.sw .dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.35)}
.sw .dot i{display:block;width:20px;height:20px}.sw .dot i svg{width:20px;height:20px;stroke-width:3.4}
.sw .lbl{font-family:var(--head);font-weight:600;font-size:14px}
.sw.on{background:var(--butter);outline:4px solid var(--coral);outline-offset:-1px}
.swatches.small{grid-template-columns:repeat(6,1fr);gap:6px}
.swatches.small .sw{min-height:50px;padding:4px 0}.swatches.small .sw .dot{width:26px;height:26px}.swatches.small .sw .dot i,.swatches.small .sw .dot i svg{width:15px;height:15px}.swatches.small .sw .lbl{font-size:12px}

/* ---------- describe ---------- */
.describe{position:absolute;inset:0;display:grid;grid-template-columns:clamp(250px,26vw,330px) minmax(0,1fr);gap:16px;padding:14px 18px 16px}
.fishcol{display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px;min-height:0}
.fish-mini{width:100%;aspect-ratio:3/2;max-height:46%;position:relative;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:linear-gradient(#9BE6F3,#47B9DC 60%,#1F8DB5)}
.fish-mini .fishwrap{position:absolute;inset:0}.fish-mini .fishsvg{width:100%;height:100%}
.fish-name{font-family:var(--head);font-weight:700;font-size:28px;text-align:center;line-height:1.1;word-break:break-word}
.fish-btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:auto}
.workpanel{padding:14px 18px;min-height:0;overflow:auto;display:flex;flex-direction:column}
.work{display:flex;flex-direction:column;gap:12px;min-height:100%}
.work-h{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.work-h h2{font-family:var(--head);font-weight:700;font-size:28px;margin:0}
.work-h p{margin:2px 0 0;color:var(--ink2);font-size:17px}
.lvlbar{display:flex;gap:6px}
.lv{border:2px solid var(--ink);background:#fff;border-radius:3px;padding:6px 14px;font-family:var(--head);font-weight:600;font-size:17px;min-height:44px;box-shadow:0 2px 0 rgba(14,58,74,.4)}
.lv.on{background:var(--butter);outline:3px solid var(--coral);outline-offset:-1px}
.lvl-fixed{font-family:var(--head);font-weight:700;background:var(--butter);border:2px solid var(--ink);border-radius:3px;padding:6px 14px}
.frames{display:flex;flex-direction:column;gap:6px}
.frame{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--head);font-weight:600;font-size:26px;min-height:58px}
.fnum{width:auto;min-width:26px;height:26px;padding:0 8px;border-radius:3px;background:var(--paper2);border:2.2px solid var(--ink);font-size:14px;display:grid;place-items:center}
.slot{min-width:96px;min-height:48px;border:3px dashed var(--ink2);background:#fff;border-radius:3px;font-family:var(--head);font-weight:700;font-size:24px;padding:2px 12px;color:var(--ink)}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--butter);box-shadow:0 2px 0 rgba(14,58,74,.4)}
.slot.active{border-color:var(--coral);background:#FFF0EC;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,80,60,.25)}}
.bank{display:flex;flex-direction:column;gap:8px;padding:10px;background:#fff;border:2px solid var(--ink);border-radius:3px}
.tilegroup{display:flex;gap:10px;align-items:flex-start}
.tg-label{flex:none;width:92px;font-family:var(--head);font-weight:600;font-size:13px;color:var(--ink2);padding-top:12px;line-height:1.1}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:2px solid var(--ink);border-radius:3px;padding:4px 12px;font-family:var(--head);font-weight:600;font-size:19px;min-height:44px;box-shadow:0 2px 0 rgba(14,58,74,.4);display:flex;align-items:center;gap:7px;background:#fff}
.tile.td{background:#FFE9A8}.tile.tp{background:#CDEEE2}.tile.tc{background:#fff}
.tile:active{transform:translateY(2px);box-shadow:none}
.tdot{width:18px;height:18px;border-radius:50%;border:2.2px solid var(--ink);display:block}
.res{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:3px;font-size:17px;font-weight:700;margin:0 0 4px 36px}
.res i{flex:none;display:block}.res i svg{width:22px;height:22px}
.res.ok{background:#DDF5E7;color:var(--ok)}.res.wrong{background:#FFE9DA;color:var(--warn)}.res.unclear{background:#FFF3C9;color:#7A5A00}
.l2{display:flex;flex-direction:column;gap:6px}
.l2row{display:flex;align-items:center;gap:10px}
.l2row label{flex:none;min-width:130px;font-family:var(--head);font-weight:600;font-size:23px}
.l2row input{flex:1;min-width:0;font-family:var(--body);font-weight:700;font-size:22px;border:2px solid var(--ink);border-radius:3px;padding:8px 12px;min-height:50px;background:#fff;color:var(--ink)}
.pre{font-family:var(--head);font-weight:600;font-size:24px}
textarea#free{width:100%;font-family:var(--body);font-weight:700;font-size:22px;border:2px solid var(--ink);border-radius:3px;padding:10px 14px;background:#fff;color:var(--ink);resize:none;line-height:1.5}
.count{font-size:15px;color:var(--ink2);font-weight:700}
.resl{display:flex;flex-direction:column;gap:2px}
.ritem q{display:block;font-weight:700;font-size:17px;margin:4px 0 2px;quotes:none}
.ritem .res{margin-left:0}
.checkrow{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;bottom:-14px;background:var(--paper);padding:10px 0 4px}
.msg{flex:1;min-width:180px;font-weight:700;font-size:18px;color:var(--warn)}
.msg.ok{color:var(--ok)}
.final{position:absolute;inset:0 0 0 calc(clamp(250px,26vw,330px) + 16px);display:none}
.describe .final{position:static;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);gap:16px;min-height:0}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:3px;box-shadow:0 2px 0 rgba(14,58,74,.4);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.card-water{flex:none;aspect-ratio:3/2;max-height:52%;position:relative;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:linear-gradient(#9BE6F3,#47B9DC 60%,#1F8DB5)}
.card-water .fishwrap{position:absolute;inset:0}.card-water .fishsvg{width:100%;height:100%}
.card-name{font-family:var(--head);font-weight:700;font-size:34px;margin:0;text-align:center;line-height:1.05}
.card-sent{margin:0;padding:0 8px 0 24px;font-size:20px;line-height:1.35;font-weight:400}
.final-side{display:flex;flex-direction:column;gap:12px;justify-content:center}
.reward{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--butter);border:2px solid var(--ink);border-radius:3px;padding:12px 16px;box-shadow:0 2px 0 rgba(14,58,74,.4);font-family:var(--head);animation:reward .8s}
.reward svg{width:44px;height:44px}.reward b{font-size:34px}.reward small{width:100%;font-size:15px;font-weight:600}
@keyframes reward{0%{transform:scale(.6) rotate(-6deg);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.swimmsg{margin:0;font-weight:700;font-size:18px}.swimmsg.warn{color:var(--warn)}

/* ---------- aquarium ---------- */
.aq{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,24vw,310px);gap:14px;padding:12px 16px 14px}
.aqmain{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.tank{flex:1;min-height:0;position:relative;border:2px solid var(--ink);border-radius:3px;overflow:hidden;box-shadow:0 2px 0 rgba(14,58,74,.4);background:#2A9CC4}
.tank canvas{position:absolute;inset:0;display:block}
.moving .tank{outline:4px dashed var(--butter);outline-offset:-10px}
.tank-tools{position:absolute;left:10px;top:34px;display:flex;gap:8px;z-index:3;align-items:center;flex-wrap:wrap;right:10px}
.tank-tools .btn{box-shadow:0 2px 0 rgba(14,58,74,.4)}
.btn[aria-pressed=true]{background:var(--butter)}
.fishcount{margin-left:auto;font-family:var(--head);font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:3px;padding:5px 12px;font-size:16px}
.care{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:none}
.carecard{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--ink);border-radius:3px;background:var(--paper);padding:8px 12px;box-shadow:0 2px 0 rgba(14,58,74,.4);min-height:68px}
.carecard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.carecard .ci{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:var(--butter)}
.carecard .ci svg{width:26px;height:26px}
.carecard .ct{font-family:var(--head);font-weight:700;font-size:20px;line-height:1.1}
.c-clean .ci{background:#BFEFD8}.c-light .ci{background:#FFF0A8}.c-bubbles .ci{background:#BCE6F7}.c-feed .ci{background:#FFD1B8}
.shop{display:flex;flex-direction:column;min-height:0;padding:10px;gap:8px}
.shop-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--head);font-size:22px}
.shop-sh{display:flex;align-items:center;gap:4px;font-weight:700}.shop-sh svg{width:22px;height:22px}
.shoptabs{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:6px}
.st{border:2px solid var(--ink);background:#fff;border-radius:3px;font-family:var(--head);font-weight:600;font-size:15px;padding:6px 4px;min-height:42px;box-shadow:0 2px 0 rgba(14,58,74,.4)}
.st.on{background:var(--butter)}
.shoplist{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;padding:2px 2px 8px}
.item{position:relative;border:2px solid var(--ink);background:#fff;border-radius:3px;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 0 rgba(14,58,74,.4);min-height:116px}
.item .ipic{display:block;width:100%;height:64px}
.item .ipic svg{width:100%;height:100%}
.item .ipic.swatch{border-radius:3px;border:2.2px solid var(--ink);position:relative;overflow:hidden}
.iname{font-family:var(--head);font-weight:600;font-size:14px;line-height:1.05;text-align:center}
.price{display:inline-flex;align-items:center;gap:3px;font-family:var(--head);font-weight:700;font-size:15px;background:var(--paper2);border:2.2px solid var(--ink);border-radius:3px;padding:1px 8px}
.price svg{width:18px;height:18px}
.item.poor{opacity:.72}.item.full{opacity:.6}
.item.use{background:#D8F4E6;outline:3px solid var(--kelp);outline-offset:-1px}
.own{position:absolute;top:3px;right:5px;font-family:var(--head);font-weight:700;font-size:13px;background:var(--ink);color:#fff;border-radius:3px;padding:0 6px}
.star-a{position:absolute;left:30%;top:20%;width:5px;height:5px;border-radius:50%;background:#FFE27A;box-shadow:16px 10px 0 #7DF3F0,-8px 18px 0 #FF9EC9,30px -2px 0 #FFE27A}
.fishinfo{position:absolute;right:12px;top:80px;width:min(290px,80%);background:var(--paper);border:2px solid var(--ink);border-radius:3px;box-shadow:0 2px 0 rgba(14,58,74,.4);padding:10px 12px;z-index:4;display:none}
.fishinfo.on{display:block;animation:pop .3s}
.fishinfo .x{position:absolute;right:6px;top:6px;width:34px;height:34px;border:2px solid var(--ink);background:#fff;border-radius:3px;display:grid;place-items:center;padding:0}
.fishinfo .x svg{width:18px;height:18px}
.fishinfo .ipic{height:96px;margin:0 30px 4px 0;background:linear-gradient(#9BE6F3,#47B9DC);border-radius:3px;border:2px solid var(--ink);overflow:hidden}
.fishinfo .ipic svg{width:100%;height:100%}
.fishinfo h3{font-family:var(--head);font-weight:700;font-size:24px;margin:2px 0}
.fishinfo ul{margin:0 0 8px;padding-left:20px;font-size:16px}
.ibtns{display:flex;gap:6px;flex-wrap:wrap}
.decorpop{position:absolute;z-index:4;display:none}
.decorpop.on{display:block}
.empty{position:absolute;inset:24px 0 0;display:none;place-items:center;z-index:2;pointer-events:none}
.empty.on{display:grid}
.ebox{pointer-events:auto;background:var(--paper);border:2px solid var(--ink);border-radius:3px;box-shadow:0 2px 0 rgba(14,58,74,.4);padding:16px 22px;text-align:center;max-width:380px}
.ebox h3{font-family:var(--head);font-weight:700;font-size:26px;margin:0 0 4px}.ebox p{margin:0 0 12px}

/* ---------- modals, toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,45,60,.55);display:grid;place-items:center;z-index:50;padding:12px}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:3px;box-shadow:0 14px 36px rgba(6,35,48,.4);width:min(560px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;animation:pop .25s}
.modal.big{width:min(1040px,100%);height:calc(100dvh - 24px)}
.modal.small{width:min(500px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:2px solid var(--ink)}
.mh h2{font-family:var(--head);font-weight:700;font-size:26px;margin:0}
.mb{padding:14px 16px;overflow:auto;min-height:0}
.confirm p{margin:0 0 14px;font-size:18px}.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.pin{display:flex;flex-direction:column;gap:10px}.pin p{margin:0}
.pin input,.settings input[type=password]{font-family:var(--head);font-size:28px;letter-spacing:6px;text-align:center;border:2px solid var(--ink);border-radius:3px;padding:8px;min-height:54px;background:#fff;color:var(--ink)}
.pin-msg{min-height:24px;color:var(--warn);font-weight:700}
.sgroup{margin-bottom:14px;padding-bottom:12px;border-bottom:2px dashed var(--ink2)}.sgroup:last-child{border:0;margin:0}
.sgroup h3{font-family:var(--head);font-size:20px;margin:0 0 4px}.hint{margin:0 0 8px;color:var(--ink2);font-size:15px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio,.check{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;min-height:44px;cursor:pointer}
.radio input,.check input{width:24px;height:24px;accent-color:var(--coral)}
.settings .row input{flex:1;min-width:0;font-size:18px;letter-spacing:1px}
.wb{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.wb-sec{background:#fff;border:2px solid var(--ink);border-radius:3px;padding:10px 12px}
.wb-sec.wide{grid-column:1/-1}
.wb-sec h3{font-family:var(--head);font-weight:700;font-size:21px;margin:0 0 8px;color:var(--coral-d)}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.wb-item{border:2px solid var(--ink);border-radius:3px;background:var(--paper);padding:3px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 rgba(14,58,74,.4)}
.wb-item .pic{display:block;width:100%;aspect-ratio:4/3;background:linear-gradient(#bfeaf5,#7bd0ea);border-radius:3px;overflow:hidden}
.wb-item .pic svg{width:100%;height:100%}
.wb-item .w{font-family:var(--head);font-weight:600;font-size:14px;text-align:center;line-height:1.1}
.diagram-wrap{display:block;max-width:560px;margin:0 auto;background:linear-gradient(#bfeaf5,#7bd0ea);border:2px solid var(--ink);border-radius:3px;overflow:hidden}
.diagram-wrap svg{width:100%;height:auto}
.partlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px}
.wlink{border:0;background:none;text-align:left;padding:4px 0;font-size:16px}
.wlink b{font-family:var(--head);font-size:19px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:#FFE9A8;border-radius:3px;padding:4px 14px;font-family:var(--head);font-weight:600;font-size:19px;min-height:44px;box-shadow:0 2px 0 rgba(14,58,74,.4)}
.model{font-size:19px;margin:12px 0 0}
#toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-30px);background:var(--ink);color:#fff;font-weight:700;padding:11px 20px;border-radius:3px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center;font-size:17px;border:3px solid #fff}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- smaller screens ---------- */
@media (max-width:1100px){
  .brand{font-size:21px}.step{font-size:16px;padding-right:10px}
  .caption{font-size:24px}
  .tg-label{width:74px}
  .carecard .ct{font-size:17px}.carecard{padding:6px 8px;gap:7px}.carecard .ci{width:38px;height:38px}
}
@media (max-width:980px){
  .logo{height:44px}.brand{display:none}
  .design{grid-template-columns:1fr;grid-template-rows:minmax(0,43%) minmax(0,1fr);gap:10px;padding:10px 12px 12px}
  .describe{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px 12px 12px}
  .fishcol{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px}
  .fish-mini{width:150px;max-height:none;flex:none}
  .fish-name{font-size:22px;flex:1}.fish-btns{flex-direction:row;width:auto;margin:0}
  .describe .final{grid-template-columns:1fr}
  .aq{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);padding:10px 12px}
  .shop{position:absolute;right:12px;top:10px;bottom:10px;width:min(300px,80vw);z-index:6;transform:translateX(120%);transition:transform .25s;display:flex}
  body.shop-open .shop{transform:none}
  .care{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .top{gap:8px;padding:0 8px}.step{padding:4px 8px 4px 5px;font-size:14px}.step b{width:22px;height:22px;font-size:13px}.shells{font-size:18px;padding:3px 8px}
  .namebar{flex-wrap:wrap}.namebar label{display:none}
  .tg-label{display:none}
}
@media (max-height:700px) and (min-width:981px){
  .tb-title{margin-bottom:4px}.opt{min-height:84px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .wfish{animation:none;left:20%}.bubbles-css,.rays{display:none}

@media (max-width:1180px){.step.homebtn .l{display:none}.tmbadge{font-size:12px}.tmgift .l{display:none}}

.tank-tools{position:static;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
body.home-tank .tank-tools{display:none}
.tripbanner{top:18px}
.item .ipic.swatch.place{height:104px}
.caption{white-space:normal;line-height:1.1;font-size:clamp(17px,1.9vw,28px);padding:4px 14px}
@media (max-width:860px){.top{gap:4px;padding:0 6px}.step{padding:4px 6px;font-size:13px}.logo{height:38px}.tmbadge{max-width:74px;line-height:1.05;font-size:10px;padding:2px 4px;min-height:40px}.steps{gap:3px;margin-left:2px}.shells{padding:2px 6px}}

/* ===================== v4: rewards, album, life, transitions ===================== */
/* screens and dialogs glide in (calm, short) */
.screen.on{animation:scrIn .32s cubic-bezier(.2,.7,.3,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body[data-screen=welcome] #scr-aquarium.on{animation:none}
.overlay{animation:ovIn .18s ease-out}
@keyframes ovIn{from{opacity:0}}
.modal{animation:modalIn .26s cubic-bezier(.2,.8,.3,1.1)}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on,.overlay,.modal{animation:none}}
/* confetti + flying shells + badge banner never block a tap */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
.flyshell{position:fixed;left:0;top:0;width:28px;height:28px;pointer-events:none;z-index:96;filter:drop-shadow(0 2px 0 rgba(14,58,74,.35))}
.flyshell svg{width:28px;height:28px}
#badge-pop{position:fixed;right:16px;bottom:16px;z-index:94;display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:8px 18px 8px 10px;pointer-events:none;opacity:0;transform:translateY(24px);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.3,1.2);max-width:min(420px,calc(100% - 32px))}
#badge-pop.on{opacity:1;transform:none}
#badge-pop .bp-art svg{width:56px;height:72px}
#badge-pop small{display:block;font:700 12px var(--head);color:var(--coral);text-transform:uppercase;letter-spacing:.8px}
#badge-pop b{display:block;font:700 22px var(--head);line-height:1.1}
#badge-pop .bp-t>span{display:block;font-size:14px;color:var(--ink2)}
/* home: word of the day challenge + streak + album tile */
.hw-play{min-height:40px;padding:4px 12px;font-size:16px;gap:5px}
.hw-play .hw-sh svg{width:18px;height:18px}
.hw-done{display:flex;align-items:center;gap:5px;font:700 14px var(--head);color:var(--ok);background:#E5F5EC;border:2px solid var(--ok);padding:4px 10px}
.hw-done i svg{width:18px;height:18px}
.hword.done .hw-pic{outline:3px solid var(--ok);outline-offset:-3px}
.hstats .streak{display:flex;align-items:center;gap:5px;color:var(--ink)}
.hstats .sun{display:inline-block;width:12px;height:12px;background:#F2A33A;border:2px solid #A8620A;transform:rotate(45deg)}
.htiles{grid-template-columns:repeat(6,minmax(0,1fr))}
.alb-tile{display:flex;justify-content:center;align-items:center;gap:4px;height:100%;padding:3px 0}
.alb-tile svg{height:92%;width:auto}
@media (max-width:860px){.htiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.htiles{grid-template-columns:repeat(2,1fr)}}
/* word of the day dialog */
.wotd-word{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wotd-word small{display:block;width:100%;font:600 13px var(--head);text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin-bottom:-8px}
.wotd-word b{font:700 34px var(--head);line-height:1.1}
.wotd-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wotd-opt{position:relative;border:2px solid var(--ink);background:#fff;padding:4px;box-shadow:3px 3px 0 var(--ink);min-height:44px}
.wotd-opt .pic{display:block;aspect-ratio:4/3;background:linear-gradient(#bfeaf5,#7bd0ea);overflow:hidden}
.wotd-opt .pic svg{width:100%;height:100%}
.wotd-opt b{position:absolute;top:-10px;left:-10px;width:28px;height:28px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--ink);font:700 15px var(--head)}
.wotd-opt.no{opacity:.45}.wotd-opt.shake{animation:shake .45s}
.wotd-opt.yes{outline:4px solid var(--ok);outline-offset:-2px;background:#E5F5EC}
.wotd-opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.wotd-msg{margin-top:12px;min-height:26px;font-weight:600}
.wotd-msg>b{display:block;font:700 22px var(--head);color:var(--ok)}
.wotd-msg .wsent{margin:6px 0;font-size:19px}.wotd-msg .wsent i{font-style:normal;font-weight:700;background:#fff;border:1.5px solid var(--ink);padding:1px 8px}
.wotd-msg .reward{margin:8px 0}
.wotd-msg small{display:block;color:var(--ink2);margin:6px 0}
/* album */
.albm .mb{display:flex;flex-direction:column;min-height:0;flex:1;padding-bottom:10px}
.alb{display:flex;flex-direction:column;min-height:0;flex:1;gap:10px}
.alb-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.alb-tab{display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:#fff;font:600 17px var(--head);min-height:46px;box-shadow:0 2px 0 rgba(14,58,74,.4);padding:4px 8px}
.alb-tab b{font-size:13px;background:var(--paper2);border:1.5px solid var(--ink);padding:0 6px;white-space:nowrap}
.alb-tab.on{background:var(--butter);outline:3px solid var(--coral);outline-offset:-2px}
.alb-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 4px 8px}
.alb-lead{margin:0 0 10px;color:var(--ink2)}.alb-empty{font:600 19px var(--head);text-align:center;padding:40px 10px}
.alb-fish{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.alb-f{display:flex;flex-direction:column;align-items:stretch;border:2px solid var(--ink);background:#fff;padding:0;box-shadow:3px 3px 0 var(--ink);text-align:left}
.alb-f .af-pic{display:block;aspect-ratio:3/2;background:linear-gradient(#bfeaf5,#5fbfde);border-bottom:2px solid var(--ink)}
.alb-f .af-pic svg{width:100%;height:100%}
.alb-f b{font:700 17px var(--head);padding:4px 8px 0}.alb-f small{padding:0 8px 6px;color:var(--ink2);font-size:13px}
.alb-f:active,.alb-c:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.alb-stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:6px}
.stampc{position:relative;background:#fff;border:2px dashed var(--ink2);padding:8px 8px 10px;transform:rotate(var(--r));text-align:center;opacity:.6}
.stampc.got{opacity:1;border:3px double var(--coral-d);background:#FFFBF1;box-shadow:3px 3px 0 rgba(168,64,44,.35)}
.stampc .sp-pic{display:grid;place-items:center;aspect-ratio:2/1;background:#DCE6E8 center/cover no-repeat;border:1.5px solid var(--ink2);filter:sepia(.15)}
.stampc .sp-pic i{font:700 34px var(--head);font-style:normal;color:#8A9AA0}
.stampc b{display:block;font:700 17px var(--head);margin-top:6px;text-transform:uppercase;letter-spacing:.8px;color:var(--coral-d)}
.stampc:not(.got) b{color:var(--ink2)}
.stampc small{display:block;font-size:13px;color:var(--ink2)}
.stampc.got::after{content:'VISITED';position:absolute;top:10px;right:6px;font:700 12px var(--head);letter-spacing:1px;color:var(--coral-d);border:2px solid var(--coral-d);padding:0 5px;transform:rotate(12deg);background:rgba(255,251,241,.85)}
.alb-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.alb-c{display:flex;flex-direction:column;align-items:center;border:2px solid var(--ink);background:#fff;padding:6px;box-shadow:3px 3px 0 var(--ink)}
.alb-c .ac-pic{display:block;width:100%;aspect-ratio:4/3;background:linear-gradient(#bfeaf5,#7bd0ea)}
.alb-c .ac-pic svg{width:100%;height:100%}
.alb-c:not(.got) .ac-pic{filter:grayscale(1) brightness(.35);opacity:.5}
.alb-c b{font:700 15px var(--head);margin-top:4px}.alb-c small{font-size:12px;color:var(--ink2)}
.alb-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.alb-b{display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid var(--ink);background:#fff;padding:8px 8px 10px;box-shadow:3px 3px 0 var(--ink)}
.alb-b:not(.got){background:#F3F1EC;box-shadow:3px 3px 0 #9AA8AD;border-color:#9AA8AD}
.alb-b .ab-art svg{width:64px;height:82px}
.alb-b b{font:700 16px var(--head)}.alb-b small{font-size:13px;color:var(--ink2);line-height:1.25}
.alb-page{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.alb-page .ap-pic{aspect-ratio:3/2;background:linear-gradient(#bfeaf5,#5fbfde);border:2px solid var(--ink)}
.alb-page .ap-pic svg{width:100%;height:100%}
.alb-page h3{font:700 26px var(--head);margin:0 0 6px}.alb-page ul{margin:0 0 10px;padding-left:20px;font-size:18px}
@media (max-width:700px){.alb-page{grid-template-columns:1fr}.alb-tab{font-size:14px}}

/* ===================== touch lock (iPad: no zoom, no sideways slide, no bounce) ===================== */
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;touch-action:manipulation}
#app{width:100%;overflow:hidden;position:relative}
canvas{touch-action:none}
.confetti{touch-action:auto}
.toolbody,.workpanel,.shoplist,.mb,.orders,.cards,.alb-body{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
input,textarea,select{font-size:max(16px,1em)}
/* portrait tablets: keep the word of the day (it was hidden before), centred below the wall */
@media (max-width:860px){.hword{display:flex;left:50%;transform:translateX(-50%);top:calc(var(--wallh) + 84px);white-space:nowrap}.hw-pic{width:64px;height:44px}}
@media (max-width:520px){.hword .hw-pic{display:none}}

</style>

/* ---- 00-lock.js ---- */
/* ===== Touch lock (Maya's rule for every web app): the page never zooms, slides sideways or bounces.
   Only the real scroll areas (tool list, dialogs, shop list, orders, cards, album) can scroll.
   OnePointer: one finger at a time on the tank and the paint stage, and a resting palm is ignored while an Apple Pencil is used. ===== */
'use strict';
(function () {
  const meta = document.querySelector('meta[name=viewport]');
  const LOCK = 'width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover';
  if (meta) meta.setAttribute('content', LOCK);
  const SCROLLERS = '.toolbody,.workpanel,.shoplist,.mb,.orders,.cards,.alb-body,textarea';
  const inScroller = el => !!(el && el.closest && el.closest(SCROLLERS));
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if ((e.touches && e.touches.length > 1) || !inScroller(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('textarea,input'))) e.preventDefault(); });
  const home = () => {
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    const se = document.scrollingElement; if (se) { se.scrollLeft = 0; se.scrollTop = 0; }
    if (document.body) { document.body.scrollLeft = 0; document.body.scrollTop = 0; } const app = document.getElementById('app'); if (app) { app.scrollLeft = 0; app.scrollTop = 0; }
  };
  window.addEventListener('scroll', home, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(home, 200));
  document.addEventListener('focusout', () => setTimeout(home, 60));
  const vv = window.visualViewport;
  if (vv) { const fix = () => { if (vv.scale > 1.001 && meta) { meta.setAttribute('content', LOCK + ', shrink-to-fit=no'); meta.setAttribute('content', LOCK); } home(); }; vv.addEventListener('resize', fix); vv.addEventListener('scroll', fix); }
  window.__touchLock = { home, LOCK };
})();
const OnePointer = (() => {
  let active = null, since = 0, penAt = -1e9;
  return {
    /* true = this pointer may act; false = ignore it (second finger, or a palm while a pen is in use) */
    take(e) {
      const now = performance.now();
      if (e.pointerType === 'pen') penAt = now;
      else if (e.pointerType === 'touch' && now - penAt < 1500) return false;
      if (active !== null && active !== e.pointerId && now - since < 8000) return false;
      active = e.pointerId; since = now; return true;
    },
    owns: e => active === null || active === e.pointerId,
    release(e) { if (!e || active === e.pointerId) active = null; },
    _reset() { active = null; penAt = -1e9; }
  };
})();

/* ===== util: colour maths, tiny DOM helpers, seeded random ===== */
'use strict';
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
function lighten(c, t) { return mix(c, '#ffffff', t); }
function darken(c, t) { return mix(c, '#0b2233', t); }
function rnd(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function pick(arr, r) { return arr[Math.floor((r || Math.random)() * arr.length)]; }
function shuffle(arr, r) { r = r || Math.random; const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
let _uid = 0; function uid(p) { return (p || 'u') + (++_uid); }

:root{
  --paper:#fffdf6; --ink:#1d2b44; --ink2:#475569; --muted:#8a94a6; --line:#dfe3ea;
  --acc:#0f8b8d; --acc-l:#d7f3f2; --acc-d:#0b5f61; --hi:#fff0a8;
  --ok:#2e8b57; --ok-l:#e3f5ea; --bad:#d9534f; --bad-l:#fdeaea;
  --r:14px; --shadow:0 10px 24px rgba(29,43,68,.10);
  --fs:1rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:var(--fs);line-height:1.5;min-height:100vh;
 background-image:linear-gradient(rgba(29,43,68,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(29,43,68,.06) 1px,transparent 1px);background-size:28px 28px}
body.xl{--fs:1.25rem} body.xxl{--fs:1.5rem}
b,strong{font-weight:800}
button{font-family:inherit;font-size:1em;cursor:pointer;border:none;border-radius:12px;padding:.7em 1.3em;font-weight:800;transition:transform .12s,box-shadow .12s,background .12s;color:var(--ink);background:#fff;border:2px solid var(--line);min-height:44px}
button:hover{transform:translateY(-1px);box-shadow:var(--shadow)} button:active{transform:translateY(0)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)} .btn-p:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink2)} .btn-ghost:hover{background:#fff}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 48px}
@media(min-width:720px){.wrap{padding:28px 32px 64px}}
/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:'Fredoka';font-weight:600;font-size:1.15em;letter-spacing:.3px;display:flex;flex-direction:column;line-height:1.05}
.brand::after{content:'';display:block;height:4px;background:var(--hi);border-radius:2px;margin-top:3px}
.spacer{flex:1}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;padding:.45em .9em;min-height:38px;border-radius:9px;font-size:.9em;background:transparent} .seg button:hover{box-shadow:none;transform:none;background:#f1f4f8}
.seg button.on{background:var(--ink);color:#fff}
/* home */
.hero{display:grid;grid-template-columns:1fr;gap:18px;align-items:center;margin:8px 0 26px}
@media(min-width:760px){.hero{grid-template-columns:1.1fr .9fr}}
h1{font-family:'Fredoka';font-weight:700;font-size:clamp(2.2rem,6vw,3.6rem);line-height:.95;margin:0 0 .35em}
h1 .hl{display:inline-block;padding:0 .12em;background:var(--hi);border-radius:8px;transform:rotate(-1.5deg)}
.hand{font-family:'Caveat';font-weight:700;color:var(--acc-d);font-size:1.5em;line-height:1.1}
.lead{font-size:1.05em;color:var(--ink2);max-width:46ch}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ch{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 18px;position:relative;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px;overflow:hidden}
.ch::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.ch:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.ch .num{font-family:'Fredoka';font-weight:700;color:var(--c);font-size:.95em;letter-spacing:1px}
.ch .t{font-family:'Fredoka';font-weight:600;font-size:1.15em;line-height:1.15}
.ch .meta{font-size:.85em;color:var(--muted);margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-block;background:var(--acc-l);color:var(--acc-d);border-radius:20px;padding:1px 10px;font-size:.8em;font-weight:800}
.bar{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--c,var(--acc));width:0;transition:width .4s}
/* chapter page */
.crumb{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:.95em;margin-bottom:10px;flex-wrap:wrap}
.chead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.chead .badge{font-family:'Fredoka';font-weight:700;font-size:2.2em;color:#fff;background:var(--c);border-radius:14px;width:1.9em;height:1.9em;display:flex;align-items:center;justify-content:center;line-height:1}
.chead h2{font-family:'Fredoka';font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);margin:0;line-height:1}
.chead .std{color:var(--muted);font-size:.9em;margin-top:6px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:22px}
.part{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.part:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.part .k{font-family:'Fredoka';font-weight:600;color:var(--c);font-size:.9em;letter-spacing:1px;text-transform:uppercase}
.part .t{font-family:'Fredoka';font-weight:600;font-size:1.25em}
.part .d{color:var(--ink2);font-size:.92em;flex:1}
.part .best{font-size:.85em;color:var(--muted)}
.lessons{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 18px}
.lessons h3{margin:0 0 8px;font-family:'Fredoka';font-weight:600}
.lessons ol{margin:0;padding-left:22px;columns:2;column-gap:28px;font-size:.95em} @media(max-width:600px){.lessons ol{columns:1}}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qtop .bar{flex:1;min-width:120px}
.qtop .cnt{font-weight:800;color:var(--ink2);white-space:nowrap}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:var(--shadow);position:relative}
@media(min-width:720px){.card{padding:30px 34px 24px}}
.qnum{position:absolute;top:-16px;left:22px;background:var(--c,var(--acc));color:#fff;font-family:'Fredoka';font-weight:700;border-radius:20px;padding:3px 14px;font-size:.95em}
.stem{font-size:1.18em;line-height:1.5;margin:6px 0 16px}
.stem .pts{display:none}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:1.05em;min-height:52px;line-height:1.35}
.opt .l{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--c,var(--acc));color:var(--c,var(--acc));display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700}
.opt:hover{border-color:var(--c,var(--acc))}
.opt.sel{border-color:var(--c,var(--acc));background:var(--cl,var(--acc-l))} .opt.sel .l{background:var(--c,var(--acc));color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-l)} .opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-l)} .opt.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{opacity:1;cursor:default;transform:none;box-shadow:none}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;display:none;animation:pop .25s ease-out}
.fb.show{display:block} .fb.ok{background:var(--ok-l);border:2px solid var(--ok)} .fb.bad{background:var(--bad-l);border:2px solid var(--bad)} .fb.info{background:var(--hi);border:2px solid #f3c969}
.fb .h{font-family:'Fredoka';font-weight:600;font-size:1.1em;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.fb .h .ic{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.9em;font-weight:900}
.fb.ok .h .ic{background:var(--ok)} .fb.bad .h .ic{background:var(--bad)} .fb.info .h .ic{background:#d9a300}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:flex-end}
.actions .left{margin-right:auto}
/* teach reveal */
.ans{margin-top:16px;border-radius:12px;padding:14px 16px;background:var(--hi);border:2px solid #f3c969;display:none}
.ans.show{display:block;animation:pop .25s ease-out}
.ans .h{font-family:'Fredoka';font-weight:600;margin-bottom:4px}
.scen{background:var(--cl,var(--acc-l));border:2px solid var(--c,var(--acc));border-radius:14px;padding:12px 16px;margin-bottom:14px}
.scen h4{margin:0 0 4px;font-family:'Fredoka';font-weight:600} .scen .clues{background:transparent;border:none;padding:0;margin:0}
/* results */
.result{text-align:center;padding:30px 20px}
.score{font-family:'Fredoka';font-weight:700;font-size:4em;line-height:1;color:var(--c,var(--acc))}
.result .hand{font-size:1.8em;margin:6px 0 14px}
.review{text-align:left;margin-top:22px;display:grid;gap:10px}
.rv{border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start;background:#fff}
.rv .n{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.rv.ok .n{background:var(--ok)} .rv.bad .n{background:var(--bad)}
.rv .body{flex:1;font-size:.95em} .rv .body svg{max-width:100%;height:auto}
.note{font-size:.85em;color:var(--muted);margin-top:14px}
/* content helpers from the tests */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 3px;font-size:.92em}
.fr .nu{border-bottom:2px solid currentColor;padding:0 4px 1px} .fr .de{padding:1px 4px 0}
.mx{display:inline-flex;align-items:center;gap:1px}
.vert{display:inline-flex;flex-direction:column;align-items:flex-end;font-weight:800;font-size:1.15em;line-height:1.25;margin:4px 12px}
.vert .bar{width:100%;border-top:2px solid var(--ink);margin-top:2px;height:12px;background:none;border-radius:0}
table.mini{border-collapse:collapse;margin:6px 0;font-size:.95em} table.mini th,table.mini td{border:1px solid #b8c2cf;padding:3px 12px;text-align:left} table.mini th{background:#f1f4f8}
.figrow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:6px 0} .figrow .cap{font-size:.85em;text-align:center;font-weight:700}
.cmp{display:inline-block;margin:6px 24px 0 0;font-weight:600}
.lines,.work{display:none}
.clues{background:var(--hi);border:2px solid #f3c969;border-radius:12px;padding:10px 16px;margin:4px 0 12px} .clues h4{margin:0 0 4px;font-family:'Fredoka';font-weight:600} .clues ol,.clues ul{margin:0;padding-left:20px} .clues p{margin:2px 0}
.pvbox{display:flex;gap:4px;margin:8px 0;max-width:520px} .pvbox div{flex:1;border:2px solid var(--ink);height:44px;display:flex;align-items:flex-end;justify-content:center;font-size:.6em;color:var(--muted);padding-bottom:3px;font-weight:700;text-align:center}
svg{max-width:100%;height:auto}
.stem u{text-decoration:underline;text-decoration-thickness:2px}
.kbd{font-size:.8em;color:var(--muted)} .kbd b{border:1px solid var(--line);border-radius:5px;padding:0 6px;background:#fff;font-weight:700}
footer{margin-top:40px;color:var(--muted);font-size:.85em;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;left:-9999px}
</style>

<div class="wrap" id="app"></div>
<script>
const DATA = [{"n": 1, "title": "Place Value", "color": "#0f8b8d", "light": "#d7f3f2", "dark": "#0b5f61", "lessons": ["Place Value", "Read and Write Multi-Digit Numbers", "Compare Numbers", "Order Numbers", "Use Place Value to Round", "Problem-Solving Investigation: Use the Four-Step Plan"], "standards": ["4.NBT.A.1", "4.NBT.A.2", "4.NBT.A.3", "4.OA.A.3"], "mc": [{"q": "In the number <b>482,731</b>, what is the value of the digit 8?", "o": ["8", "800", "8,000", "80,000"], "a": 3, "e": "The 8 is in the ten thousands place, so its value is 8 × 10,000 = 80,000.", "l": 1}, {"q": "In which number does the digit 5 have a value of <b>5,000</b>?", "o": ["52,140", "12,504", "35,214", "54,021"], "a": 2, "e": "In 35,214 the 5 is in the thousands place (5 × 1,000 = 5,000). In the other numbers the 5 is in a different place.", "l": 1}, {"q": "Which statement about <b>7,000</b> and <b>700</b> is true?", "o": ["700 is 10 times as much as 7,000.", "7,000 is 10 times as much as 700.", "7,000 is 100 times as much as 700.", "7,000 and 700 have the same value."], "a": 1, "e": "7,000 ÷ 700 = 10, so 7,000 is 10 times as much as 700. Each place to the left is 10 times greater.", "l": 1}, {"q": "What is <b>306,052</b> written in word form?", "o": ["three hundred sixty thousand, fifty-two", "three hundred six thousand, five hundred two", "thirty-six thousand, fifty-two", "three hundred six thousand, fifty-two"], "a": 3, "e": "306,052 = 306 thousands + 52. Read the thousands group, say &quot;thousand&quot;, then read 52. The 0 in the hundreds place is not spoken.", "l": 2}, {"q": "Which is the expanded form of <b>59,408</b>?", "o": ["50,000 + 9,000 + 400 + 8", "50,000 + 9,000 + 40 + 8", "5,000 + 900 + 40 + 8", "50,000 + 900 + 400 + 8"], "a": 0, "e": "Write the value of each non-zero digit: 5 ten thousands (50,000), 9 thousands (9,000), 4 hundreds (400), 8 ones (8).", "l": 2}, {"q": "Write <b>two hundred forty thousand, nine hundred three</b> in standard form.", "o": ["240,930", "204,903", "240,903", "24,903"], "a": 2, "e": "&quot;Two hundred forty thousand&quot; = 240,000 and &quot;nine hundred three&quot; = 903 (no tens, so write a 0). Together: 240,903.", "l": 2}, {"q": "Which symbol makes the statement true?<br><b>736,415 &#9675; 736,451</b>", "o": ["&gt;", "&lt;", "=", "cannot be compared"], "a": 1, "e": "Both numbers share 736,4__. Compare the tens: 1 &lt; 5, so 736,415 &lt; 736,451.", "l": 3}, {"q": "Which number is <b>greater than</b> 589,000?", "o": ["588,999", "98,999", "589,000", "598,000"], "a": 3, "e": "Compare the thousands: 598,000 has 9 ten-thousands while 589,000 has 8, so 598,000 is greater. 588,999 and 98,999 are smaller; 589,000 is equal.", "l": 3}, {"q": "Which list shows the numbers in order from <b>least to greatest</b>?<br>45,612&nbsp;&nbsp; 45,162&nbsp;&nbsp; 46,125&nbsp;&nbsp; 44,999", "o": ["44,999; 45,612; 45,162; 46,125", "44,999; 45,162; 45,612; 46,125", "46,125; 45,612; 45,162; 44,999", "45,162; 44,999; 45,612; 46,125"], "a": 1, "e": "Compare from the left. 44,999 is the only number with 4 thousands, so it is least. Then 45,162 &lt; 45,612 (hundreds 1 &lt; 6), and 46,125 is greatest.", "l": 4}, {"q": "Round <b>63,471</b> to the nearest thousand.", "o": ["60,000", "63,500", "64,000", "63,000"], "a": 3, "e": "The digit to the right of the thousands place is 4 (less than 5), so the thousands digit stays 3: 63,000.", "l": 5}, {"q": "Round <b>285,650</b> to the nearest ten thousand.", "o": ["280,000", "285,000", "290,000", "286,000"], "a": 2, "e": "The ten thousands digit is 8. The digit to its right is 5, so round up: 290,000.", "l": 5}, {"q": "Which number rounds to <b>400,000</b> when rounded to the nearest hundred thousand?", "o": ["349,999", "362,500", "450,000", "451,200"], "a": 1, "e": "362,500 is between 300,000 and 400,000, and its ten thousands digit (6) is 5 or more, so it rounds up to 400,000. 349,999 rounds down to 300,000; 450,000 and 451,200 round up to 500,000.", "l": 5}], "sa": [{"q": "In the number <b>527,819</b>, what is the value of the digit 2?", "pts": 1, "a": "20,000", "l": 1}, {"q": "Complete the sentence: <b>60,000</b> is ______ times as much as <b>6,000</b>.", "pts": 1, "a": "10", "l": 1}, {"q": "Complete the sentence: <b>300</b> is 10 times as much as ______.", "pts": 1, "a": "30", "l": 1}, {"q": "Write <b>814,207</b> in expanded form.", "pts": 1, "a": "800,000 + 10,000 + 4,000 + 200 + 7", "l": 2}, {"q": "Write <b>814,207</b> in word form.", "pts": 1, "a": "eight hundred fourteen thousand, two hundred seven", "l": 2}, {"q": "Write <b>900,000 + 60,000 + 5,000 + 30 + 1</b> in standard form.", "pts": 1, "a": "965,031", "l": 2}, {"q": "Compare. Write <b>&lt;</b>, <b>&gt;</b>, or <b>=</b> in each circle.<br><span class='cmp'>a) 128,430 &#9675; 128,340</span><span class='cmp'>b) 70,601 &#9675; 70,601</span><span class='cmp'>c) 499,999 &#9675; 500,000</span>", "pts": 3, "a": "a) &gt; &nbsp;&nbsp; b) = &nbsp;&nbsp; c) &lt; &nbsp;&nbsp;(1 point each)", "l": 3}, {"q": "Order the numbers from <b>greatest to least</b>.<br>381,245&nbsp;&nbsp; 318,452&nbsp;&nbsp; 381,524&nbsp;&nbsp; 38,145", "pts": 2, "a": "381,524; 381,245; 318,452; 38,145 &nbsp;(2 pts all correct, 1 pt if one number is misplaced)", "l": 4}, {"q": "Round <b>758,392</b> to the nearest:<br><span class='cmp'>a) ten ____________</span><span class='cmp'>b) hundred ____________</span><span class='cmp'>c) thousand ____________</span><span class='cmp'>d) hundred thousand ____________</span>", "pts": 4, "a": "a) 758,390 &nbsp; b) 758,400 &nbsp; c) 758,000 &nbsp; d) 800,000 &nbsp;(1 point each)", "l": 5}, {"q": "A number rounded to the nearest hundred is <b>2,600</b>. Write the <b>smallest</b> and the <b>greatest</b> whole number it could be. Explain how you know.", "pts": 3, "a": "Smallest: 2,550 &nbsp; Greatest: 2,649. Any number from 2,550 to 2,649 rounds to 2,600 because the tens digit decides: 5 or more rounds up (2,550 → 2,600), 4 or less rounds down (2,649 → 2,600). (1 pt smallest, 1 pt greatest, 1 pt explanation)", "l": 5}], "wp": [{"q": "Three towns reported their populations.<br><table class='mini'><tr><th>Town</th><th>Population</th></tr><tr><td>Riverton</td><td>48,215</td></tr><tr><td>Oakdale</td><td>48,512</td></tr><tr><td>Pine Hill</td><td>48,125</td></tr></table>Which town has the <b>greatest</b> population? Use place value to explain how you know.", "a": "<b>Oakdale (48,512).</b> All three numbers have the same ten thousands digit (4) and thousands digit (8), so compare the hundreds: 5 &gt; 2 &gt; 1. Rubric: 1 pt correct town, 2 pts place-value explanation.", "l": 6}, {"q": "A city library owns <b>156,420</b> books. Round this number to the nearest <b>thousand</b> and to the nearest <b>ten thousand</b>. Which rounded number is closer to the actual number of books? Explain.", "a": "Nearest thousand: <b>156,000</b>. Nearest ten thousand: <b>160,000</b>. 156,000 is closer (only 420 away; 160,000 is 3,580 away). Rubric: 1 pt each rounding, 1 pt comparison/explanation.", "l": 6}, {"q": "Mia wrote the number <i>six hundred thousand, forty-seven</i> as <b>600,470</b>. Is Mia correct? If not, write the correct number in standard form and explain her mistake.", "a": "<b>Not correct.</b> The correct number is <b>600,047</b>. Mia put the digits 4 and 7 in the hundreds and tens places; \"forty-seven\" means 4 tens and 7 ones, so a 0 is needed in the hundreds place. Rubric: 1 pt \"no\", 1 pt correct number, 1 pt explanation.", "l": 6}, {"q": "A car's odometer shows <b>89,996</b> kilometers. Write the number that is <b>10,000 more</b> than 89,996 and the number that is <b>10 more</b> than 89,996.", "a": "10,000 more: <b>99,996</b>. &nbsp; 10 more: <b>90,006</b> (regroup: 89,996 + 10 = 90,006). Rubric: 1 pt for 99,996, 2 pts for 90,006 (regrouping across places).", "l": 6}, {"q": "In Number A, the digit 4 has a value of <b>40,000</b>. In Number B, the digit 4 has a value of <b>400</b>. How many times as great is the value of the 4 in Number A than the 4 in Number B? Show your thinking.", "a": "<b>100 times as great.</b> 400 × 10 = 4,000 and 4,000 × 10 = 40,000, so 400 × 100 = 40,000. Rubric: 2 pts correct answer, 1 pt showing the ×10 / ×100 reasoning.", "l": 6}], "pt": {"title": "The Mystery Number", "intro": "<div class='clues'><h4>Clues</h4><ol><li>I am a 6-digit number.</li><li>My hundred thousands digit is <b>3</b>.</li><li>My ten thousands digit is <b>4</b>.</li><li>My thousands digit is <b>3 times</b> my hundred thousands digit.</li><li>My hundreds digit is <b>0</b>.</li><li>My tens digit is <b>2 more than</b> my hundreds digit.</li><li>My ones digit is <b>5</b>.</li></ol></div><div class='pvbox'><div>Hundred Thousands</div><div>Ten Thousands</div><div>Thousands</div><div>Hundreds</div><div>Tens</div><div>Ones</div></div>", "items": [{"q": "Write the mystery number in <b>standard form</b> and in <b>word form</b>.", "pts": 2, "a": "Standard form: <b>349,025</b>. Word form: <b>three hundred forty-nine thousand, twenty-five</b>. (1 pt each)"}, {"q": "Write the mystery number in <b>expanded form</b>. Then round it to the nearest <b>ten thousand</b>.", "pts": 2, "a": "Expanded form: <b>300,000 + 40,000 + 9,000 + 20 + 5</b>. Rounded to the nearest ten thousand: <b>350,000</b>. (1 pt each)"}, {"q": "Write a 6-digit number that is <b>greater than</b> the mystery number but still rounds to <b>300,000</b> when rounded to the nearest hundred thousand. Explain why your number works.", "pts": 1, "a": "Any number from <b>349,026 to 349,999</b> (e.g., 349,500). It is greater than 349,025, and its ten thousands digit is 4, so it rounds down to 300,000. (1 pt: correct number with a valid explanation)"}]}}, {"n": 2, "title": "Add and Subtract Whole Numbers", "color": "#2f6fdb", "light": "#dce9ff", "dark": "#1f4aa0", "lessons": ["Addition Properties and Subtraction Rules", "Addition and Subtraction Patterns", "Add and Subtract Mentally", "Estimate Sums and Differences", "Add Whole Numbers", "Subtract Whole Numbers", "Subtract Across Zeros", "Problem-Solving Investigation: Draw a Diagram", "Solve Multi-Step Word Problems"], "standards": ["4.NBT.B.4", "4.NBT.A.3", "4.OA.A.3", "4.OA.C.5"], "mc": [{"q": "Which equation shows the <b>Commutative Property of Addition</b>?", "o": ["4,215 + 0 = 4,215", "4,215 + 3,180 = 3,180 + 4,215", "(4,215 + 3,180) + 600 = 4,215 + (3,180 + 600)", "4,215 − 4,215 = 0"], "a": 1, "e": "The Commutative Property says the order of the addends can change without changing the sum: a + b = b + a.", "l": 1}, {"q": "Use the pattern to find the missing sum.<br>6 + 7 = 13&nbsp;&nbsp;&nbsp; 60 + 70 = 130&nbsp;&nbsp;&nbsp; 600 + 700 = 1,300&nbsp;&nbsp;&nbsp; 6,000 + 7,000 = ____", "o": ["1,300", "130,000", "13,000", "1,300,000"], "a": 2, "e": "Each line is the basic fact 6 + 7 = 13 with one more zero. 6 thousands + 7 thousands = 13 thousands = 13,000.", "l": 2}, {"q": "Which shows a correct way to find <b>398 + 245</b> using mental math?", "o": ["400 + 245 − 2 = 643", "400 + 245 + 2 = 647", "400 + 250 = 650", "398 + 200 = 598"], "a": 0, "e": "Round 398 up to 400 (add 2), add 245 to get 645, then subtract the 2 you added: 643.", "l": 3}, {"q": "Use mental math. <b>7,000 − 2,999</b> = ", "o": ["4,000", "5,001", "4,011", "4,001"], "a": 3, "e": "Think 7,000 − 3,000 = 4,000, but 2,999 is 1 less than 3,000, so the answer is 1 more: 4,001.", "l": 3}, {"q": "Estimate <b>63,482 + 28,715</b> by rounding each number to the nearest <b>thousand</b>.", "o": ["91,000", "92,000", "90,000", "92,197"], "a": 1, "e": "63,482 rounds to 63,000 and 28,715 rounds to 29,000. 63,000 + 29,000 = 92,000.", "l": 4}, {"q": "About how much greater is <b>458,219</b> than <b>212,760</b>? Round each number to the nearest <b>ten thousand</b>.", "o": ["250,000", "240,000", "245,459", "300,000"], "a": 0, "e": "458,219 rounds to 460,000 and 212,760 rounds to 210,000. 460,000 − 210,000 = 250,000.", "l": 4}, {"q": "Add.<br><span class='vert'><span>346,587</span><span class='op'>+&nbsp;275,948</span><span class='bar'></span></span>", "o": ["511,425", "622,435", "621,535", "622,535"], "a": 3, "e": "Add place by place with regrouping: 346,587 + 275,948 = 622,535. Check: 622,535 − 275,948 = 346,587.", "l": 5}, {"q": "Find the sum. <b>48,275 + 9,648 + 125,406</b>", "o": ["182,329", "173,329", "183,329", "183,229"], "a": 2, "e": "48,275 + 9,648 = 57,923; then 57,923 + 125,406 = 183,329. Line up the places carefully.", "l": 5}, {"q": "Subtract.<br><span class='vert'><span>731,264</span><span class='op'>−&nbsp;458,397</span><span class='bar'></span></span>", "o": ["272,867", "327,133", "272,967", "282,867"], "a": 0, "e": "Regroup across several places: 731,264 − 458,397 = 272,867. Check: 272,867 + 458,397 = 731,264.", "l": 6}, {"q": "A stadium holds <b>68,420</b> people. So far <b>49,785</b> tickets have been sold. How many tickets are still unsold?", "o": ["21,365", "18,635", "19,635", "18,735"], "a": 1, "e": "Unsold = total seats − tickets sold = 68,420 − 49,785 = 18,635.", "l": 6}, {"q": "Subtract. <b>50,000 − 23,476</b> = ", "o": ["27,524", "36,524", "26,534", "26,524"], "a": 3, "e": "Subtracting across zeros: regroup 50,000 as 4 ten-thousands, 9 thousands, 9 hundreds, 9 tens, 10 ones. 50,000 − 23,476 = 26,524.", "l": 7}, {"q": "Subtract.<br><span class='vert'><span>300,402</span><span class='op'>−&nbsp;186,735</span><span class='bar'></span></span>", "o": ["123,667", "114,333", "113,667", "113,677"], "a": 2, "e": "300,402 − 186,735 = 113,667. Check by adding: 113,667 + 186,735 = 300,402.", "l": 7}], "sa": [{"q": "Use the <b>Identity Property of Addition</b> to complete the equation.<br><b>27,409 + ______ = 27,409</b>", "pts": 1, "a": "0 — adding zero to a number does not change it (Identity Property).", "l": 1}, {"q": "Complete each equation. Then name the property or rule you used.<br><span class='cmp'>a) (16 + 9) + 11 = 16 + (____ + 11)</span><span class='cmp'>b) 3,562 − 3,562 = ____</span><span class='cmp'>c) Property used in part a: ______________</span>", "pts": 3, "a": "a) 9 &nbsp;&nbsp; b) 0 (a number minus itself is 0) &nbsp;&nbsp; c) Associative Property of Addition &nbsp;(1 point each)", "l": 1}, {"q": "Use the pattern to complete each equation.<br>9 − 4 = 5&nbsp;&nbsp;&nbsp; 90 − 40 = 50&nbsp;&nbsp;&nbsp;<span class='cmp'>a) 900 − 400 = ______</span><span class='cmp'>b) 9,000 − 4,000 = ______</span>", "pts": 2, "a": "a) 500 &nbsp;&nbsp; b) 5,000 — the basic fact 9 − 4 = 5 is followed by the same number of zeros. (1 point each)", "l": 2}, {"q": "Use mental math to find each answer.<br><span class='cmp'>a) 4,998 + 2,750 = ______</span><span class='cmp'>b) 8,500 − 3,996 = ______</span>", "pts": 2, "a": "a) 7,748 (5,000 + 2,750 − 2) &nbsp;&nbsp; b) 4,504 (8,500 − 4,000 + 4) &nbsp;(1 point each)", "l": 3}, {"q": "Estimate by rounding each number to the nearest <b>hundred</b>.<br><span class='cmp'>a) 2,381 + 5,649 ≈ ______</span><span class='cmp'>b) 9,127 − 4,762 ≈ ______</span>", "pts": 2, "a": "a) 2,400 + 5,600 = 8,000 &nbsp;&nbsp; b) 9,100 − 4,800 = 4,300 &nbsp;(1 point each)", "l": 4}, {"q": "Add.<br><span class='vert'><span>58,374</span><span class='op'>+&nbsp;36,859</span><span class='bar'></span></span>", "pts": 1, "a": "95,233 — regroup ones, tens, hundreds, and thousands.", "l": 5}, {"q": "<span class='cmp'>a) Find the sum: 124,956 + 388,275 = ______</span><br><span class='cmp'>b) Use an estimate to show your answer is reasonable.</span>", "pts": 2, "a": "a) 513,231 &nbsp;&nbsp; b) Estimate: 125,000 + 388,000 = 513,000, which is close to 513,231, so the answer is reasonable. (1 point each)", "l": 5}, {"q": "Subtract.<br><span class='vert'><span>84,612</span><span class='op'>−&nbsp;29,785</span><span class='bar'></span></span>", "pts": 1, "a": "54,827 — regroup in the ones, tens, hundreds, and thousands places.", "l": 6}, {"q": "Subtract.<br><span class='cmp'>a) 7,000 − 2,864 = ______</span><span class='cmp'>b) 40,000 − 18,215 = ______</span>", "pts": 2, "a": "a) 4,136 &nbsp;&nbsp; b) 21,785 — regroup across the zeros (for example, think of 7,000 as 6 thousands, 9 hundreds, 9 tens, 10 ones). (1 point each)", "l": 7}, {"q": "Find <b>500,000 − 263,709</b>. Then <b>check</b> your answer with addition. Write the addition equation you used.", "pts": 2, "a": "500,000 − 263,709 = <b>236,291</b>. Check: 236,291 + 263,709 = 500,000. (1 pt difference, 1 pt correct addition check)", "l": 7}], "wp": [{"q": "A hiking trail is <b>12,450</b> meters long. Jamal hiked <b>4,875</b> meters before lunch and <b>3,680</b> meters after lunch. Draw a diagram to show the problem. How many more meters does Jamal have to hike to reach the end of the trail?", "a": "<b>3,895 meters.</b> Bar model: whole = 12,450; parts = 4,875, 3,680, and ?. 4,875 + 3,680 = 8,555; 12,450 − 8,555 = 3,895. Rubric: 1 pt diagram shows the whole and parts, 1 pt adds the two parts, 1 pt correct final answer.", "l": 8}, {"q": "The population of Elm City is <b>48,316</b>. That is <b>9,578 more</b> than the population of Oak Town. Draw a diagram to compare the two populations. What is the population of Oak Town?", "a": "<b>38,738 people.</b> Comparison bars: Elm City bar is longer by 9,578, so Oak Town = 48,316 − 9,578 = 38,738. Rubric: 1 pt diagram shows the comparison, 1 pt chooses subtraction (not addition), 1 pt correct answer.", "l": 8}, {"q": "A bookstore sold <b>2,350</b> books in March. In April it sold <b>1,785 fewer</b> books than in March. Draw a diagram. How many books did the bookstore sell in March and April <b>altogether</b>?", "a": "<b>2,915 books.</b> April = 2,350 − 1,785 = 565 books; total = 2,350 + 565 = 2,915. Rubric: 1 pt diagram, 1 pt April total (565), 1 pt correct final answer.", "l": 8}, {"q": "A school is raising <b>$25,000</b> for a new playground. The table shows the money collected so far.<br><table class='mini'><tr><th>Month</th><th>Amount collected</th></tr><tr><td>September</td><td>$8,462</td></tr><tr><td>October</td><td>$9,875</td></tr><tr><td>November</td><td>$4,338</td></tr></table>How much more money does the school need to reach its goal?", "a": "<b>$2,325.</b> 8,462 + 9,875 + 4,338 = 22,675; 25,000 − 22,675 = 2,325. Rubric: 1 pt adds the three amounts (22,675), 1 pt subtracts from 25,000, 1 pt correct answer with $ sign.", "l": 9}, {"q": "A toy factory made <b>36,420</b> toys in Week 1 and <b>29,875</b> toys in Week 2. Then <b>50,000</b> of the toys were shipped to stores. How many toys are still at the factory?", "a": "<b>16,295 toys.</b> 36,420 + 29,875 = 66,295; 66,295 − 50,000 = 16,295. Rubric: 1 pt adds the two weeks (66,295), 1 pt subtracts 50,000, 1 pt correct answer.", "l": 9}], "pt": {"title": "Road Trip Planner", "intro": "<div class='clues'><h4>The Garcia family's road trip</h4><p>The Garcia family rented a car for a 4-day road trip. The rental includes <b>2,000 free miles</b>. The table shows the plan.</p><div class='figrow'><div><table class='mini'><tr><th>Day</th><th>Route</th><th>Miles</th></tr><tr><td>Day 1</td><td>Home → Mountain View</td><td>286</td></tr><tr><td>Day 2</td><td>Mountain View → Lake Shore</td><td>419</td></tr><tr><td>Day 3</td><td>Lake Shore → Sand Dunes</td><td>507</td></tr><tr><td>Day 4</td><td>Sand Dunes → Home</td><td>392</td></tr></table></div><div><table class='mini'><tr><th>Possible side trip</th><th>Extra miles</th></tr><tr><td>Red Canyon</td><td>185</td></tr><tr><td>Crystal Caves</td><td>395</td></tr><tr><td>Sunset Beach</td><td>420</td></tr></table></div></div></div>", "items": [{"q": "<span class='cmp'>a) Find the total number of miles for the four days.</span><br><span class='cmp'>b) Round each day's miles to the nearest hundred and estimate the total. Is your exact answer reasonable?</span>", "pts": 2, "a": "a) 286 + 419 + 507 + 392 = <b>1,604 miles</b>. b) Estimate: 300 + 400 + 500 + 400 = <b>1,600</b>; 1,604 is very close to 1,600, so it is reasonable. (1 pt each)"}, {"q": "<span class='cmp'>a) How many free miles will the family have left after the four days?</span><br><span class='cmp'>b) How many more miles will they drive on Day 3 than on Day 1?</span>", "pts": 2, "a": "a) 2,000 − 1,604 = <b>396 miles</b> left (subtract across zeros). b) 507 − 286 = <b>221 more miles</b>. (1 pt each)"}, {"q": "The family wants to add a side trip without going over the 2,000 free miles. Which side trip(s) could they choose? Use your answer to question 29 to justify your choice.", "pts": 1, "a": "<b>Red Canyon (1,604 + 185 = 1,789) or Crystal Caves (1,604 + 395 = 1,999)</b> — each one stays at or under 2,000. Sunset Beach (420) would make 2,024, which is over the limit, and Canyon + Caves together (580) would also be too many. (1 pt: a valid choice with a correct justification)"}]}}, {"n": 3, "title": "Understand Multiplication and Division", "color": "#7c4dcc", "light": "#ebe2ff", "dark": "#55338f", "lessons": ["Relate Multiplication and Division", "Relate Division and Subtraction", "Multiplication as Comparison", "Compare to Solve Problems", "Multiplication Properties and Division Rules", "The Associative Property of Multiplication", "Factors and Multiples", "Problem-Solving Investigation: Reasonable Answers"], "standards": ["4.OA.A.1", "4.OA.A.2", "4.OA.B.4", "4.OA.A.3"], "mc": [{"q": "Which equation belongs to the same <b>fact family</b> as 7 × 8 = 56?", "o": ["56 ÷ 7 = 9", "56 ÷ 8 = 7", "7 + 8 = 15", "8 × 6 = 48"], "a": 1, "e": "A fact family uses the same three numbers (7, 8, 56). 56 ÷ 8 = 7 is the related division fact.", "l": 1}, {"q": "Find the unknown number. <b>? ÷ 6 = 8</b>", "o": ["14", "42", "48", "54"], "a": 2, "e": "Division and multiplication are related: ? = 8 × 6 = 48. Check: 48 ÷ 6 = 8.", "l": 1}, {"q": "Rosa subtracted: 36 − 9 = 27, 27 − 9 = 18, 18 − 9 = 9, 9 − 9 = 0. Which division equation does her work show?", "o": ["36 ÷ 9 = 4", "36 ÷ 9 = 3", "36 − 9 = 27", "9 × 4 = 36"], "a": 0, "e": "Rosa subtracted 9 four times to reach 0, so 36 contains four groups of 9: 36 ÷ 9 = 4.", "l": 2}, {"q": "Which equation shows that <b>42 is 6 times as many as 7</b>?", "o": ["42 = 6 + 7", "42 = 7 × 7", "6 = 42 × 7", "42 = 6 × 7"], "a": 3, "e": "&quot;6 times as many as 7&quot; means 6 groups of 7, so 42 = 6 × 7.", "l": 3}, {"q": "Which statement describes the equation <b>5 × 9 = 45</b>?", "o": ["45 is 5 more than 9.", "45 is 5 times as many as 9.", "9 is 5 times as many as 45.", "45 is 9 more than 5."], "a": 1, "e": "5 × 9 = 45 means 45 is 5 times as many as 9 (or 9 times as many as 5). It is not 5 more than 9.", "l": 3}, {"q": "Maya has <b>8</b> stickers. Leo has <b>4 times as many</b> stickers as Maya. How many stickers does Leo have?", "o": ["12", "2", "24", "32"], "a": 3, "e": "4 times as many as 8 is 4 × 8 = 32 stickers.", "l": 4}, {"q": "A shelf holds <b>54</b> books. That is <b>6 times as many</b> books as a basket holds. How many books does the basket hold?", "o": ["48", "324", "9", "60"], "a": 2, "e": "54 is 6 times the basket, so the basket holds 54 ÷ 6 = 9 books.", "l": 4}, {"q": "Which equation shows the <b>Zero Property of Multiplication</b>?", "o": ["15 × 1 = 15", "15 + 0 = 15", "0 × 15 = 0", "15 ÷ 15 = 1"], "a": 2, "e": "The Zero Property of Multiplication: any number multiplied by 0 equals 0.", "l": 5}, {"q": "Which equation is <b>true</b>?", "o": ["0 ÷ 8 = 0", "8 ÷ 0 = 0", "8 ÷ 8 = 8", "8 ÷ 1 = 1"], "a": 0, "e": "0 divided by any non-zero number is 0. You cannot divide by 0, and 8 ÷ 8 = 1, 8 ÷ 1 = 8.", "l": 5}, {"q": "Which expression is equal to <b>(2 × 9) × 5</b> by the <b>Associative Property of Multiplication</b>?", "o": ["(2 + 9) × 5", "2 × (9 × 5)", "2 × 9 + 5", "(2 × 5) + 9"], "a": 1, "e": "The Associative Property lets you change the grouping: (2 × 9) × 5 = 2 × (9 × 5). Both equal 90.", "l": 6}, {"q": "Which list shows <b>all</b> the factors of <b>24</b>?", "o": ["1, 2, 3, 4, 6, 12, 24", "2, 3, 4, 6, 8, 12", "24, 48, 72, 96", "1, 2, 3, 4, 6, 8, 12, 24"], "a": 3, "e": "Factor pairs of 24: 1 × 24, 2 × 12, 3 × 8, 4 × 6. The complete list is 1, 2, 3, 4, 6, 8, 12, 24.", "l": 7}, {"q": "Which number is a multiple of <b>both 4 and 6</b>?", "o": ["36", "16", "18", "20"], "a": 0, "e": "36 = 4 × 9 and 36 = 6 × 6, so 36 is a multiple of both 4 and 6. The others are not multiples of both.", "l": 7}], "sa": [{"q": "Write the <b>fact family</b> for the numbers 6, 9, and 54. (Write two multiplication equations and two division equations.)", "pts": 2, "a": "6 × 9 = 54, 9 × 6 = 54, 54 ÷ 6 = 9, 54 ÷ 9 = 6 &nbsp;(1 pt both multiplication equations, 1 pt both division equations)", "l": 1}, {"q": "Use <b>repeated subtraction</b> to find <b>40 ÷ 8</b>. Show each subtraction step, then write the quotient.", "pts": 2, "a": "40 − 8 = 32, 32 − 8 = 24, 24 − 8 = 16, 16 − 8 = 8, 8 − 8 = 0. Five subtractions, so 40 ÷ 8 = <b>5</b>. (1 pt steps, 1 pt quotient)", "l": 2}, {"q": "Write a multiplication equation for each comparison.<br><span class='cmp'>a) 56 is 7 times as many as 8.</span><span class='cmp'>b) 3 times as many as 9 is 27.</span>", "pts": 2, "a": "a) 56 = 7 × 8 &nbsp;&nbsp; b) 27 = 3 × 9 (or 3 × 9 = 27) &nbsp;(1 point each)", "l": 3}, {"q": "A toy car costs <b>$12</b>. A toy truck costs <b>3 times as much</b> as the car.<br><span class='cmp'>a) How much does the truck cost?</span><span class='cmp'>b) How much more does the truck cost than the car?</span>", "pts": 2, "a": "a) 3 × $12 = <b>$36</b> &nbsp;&nbsp; b) $36 − $12 = <b>$24</b> more &nbsp;(1 point each)", "l": 4}, {"q": "Complete the equation. Then name the property you used.<br><span class='cmp'>a) 9 × 7 = 7 × ______</span><span class='cmp'>b) Property: ______________</span>", "pts": 2, "a": "a) 9 &nbsp;&nbsp; b) Commutative Property of Multiplication (the order of the factors does not change the product) &nbsp;(1 point each)", "l": 5}, {"q": "Use the <b>division rules</b> to find each quotient.<br><span class='cmp'>a) 46 ÷ 1 = ______</span><span class='cmp'>b) 0 ÷ 15 = ______</span>", "pts": 2, "a": "a) 46 (any number divided by 1 is itself) &nbsp;&nbsp; b) 0 (zero divided by any nonzero number is 0) &nbsp;(1 point each)", "l": 5}, {"q": "Use the <b>Associative Property</b> to find <b>(7 × 2) × 5</b>. Show the grouping that makes the multiplication easier.", "pts": 1, "a": "<b>70</b> — regroup as 7 × (2 × 5) = 7 × 10 = 70.", "l": 6}, {"q": "List <b>all</b> the factors of <b>36</b>.", "pts": 2, "a": "1, 2, 3, 4, 6, 9, 12, 18, 36 &nbsp;(2 pts all nine factors; 1 pt if one factor is missing or one extra number is listed)", "l": 7}, {"q": "Write the first <b>five</b> multiples of <b>7</b>, starting with 7.", "pts": 1, "a": "7, 14, 21, 28, 35", "l": 7}, {"q": "<span class='cmp'>a) Is 42 a multiple of 6? Explain how you know.</span><br><span class='cmp'>b) Is 7 a factor of 50? Explain how you know.</span>", "pts": 2, "a": "a) <b>Yes</b> — 6 × 7 = 42. &nbsp;&nbsp; b) <b>No</b> — 50 ÷ 7 = 7 R1 (7 × 7 = 49 and 7 × 8 = 56, so no whole number times 7 equals 50). (1 point each)", "l": 7}], "wp": [{"q": "A box holds <b>8</b> crayons. Ms. Lee buys <b>7</b> boxes and then gives <b>15</b> crayons to another class. Kai says Ms. Lee has <b>71</b> crayons left. Is Kai's answer reasonable? Explain, and find the correct answer.", "a": "<b>Not reasonable; 41 crayons.</b> 7 × 8 = 56 crayons in all, and giving some away must leave fewer than 56, so 71 is too big (Kai added instead of subtracting). 56 − 15 = 41. Rubric: 1 pt says not reasonable, 1 pt explanation, 1 pt correct answer.", "l": 8}, {"q": "Jonah is <b>9</b> years old. His grandmother is <b>7 times as old</b> as Jonah. His father is <b>36</b> years old. How many years older is Jonah's grandmother than his father?", "a": "<b>27 years.</b> Grandmother: 7 × 9 = 63 years old. 63 − 36 = 27. Rubric: 1 pt grandmother's age (63), 1 pt subtracts 36, 1 pt correct answer.", "l": 8}, {"q": "Ava says that <b>54 ÷ 6 = 8</b> because 6 × 8 = 54. Is Ava's answer reasonable? Explain, and write the correct quotient.", "a": "<b>Not reasonable; 54 ÷ 6 = 9.</b> 6 × 8 = 48, not 54, so 8 is wrong. 6 × 9 = 54, so the quotient is 9. Rubric: 1 pt says not reasonable, 1 pt explains using 6 × 8 = 48, 1 pt correct quotient.", "l": 8}, {"q": "Five friends each buy <b>3</b> tickets to a show. Each ticket costs <b>$6</b>. Tanya estimates the friends spend about <b>$45</b> in all. Is her estimate reasonable? Explain, and find the exact total.", "a": "<b>Not reasonable; $90.</b> 5 × 3 = 15 tickets, and 15 × $6 = $90. $45 is only half of that (Tanya may have used 15 × 3). Rubric: 1 pt number of tickets (15), 1 pt exact total, 1 pt explanation of why $45 is not reasonable.", "l": 8}, {"q": "A baker packs <b>48</b> muffins into boxes of <b>6</b>. She sells each box for <b>$9</b>. Dan says she will earn <b>$432</b>. Is Dan's answer reasonable? Explain his mistake and find the correct amount.", "a": "<b>Not reasonable; $72.</b> 48 ÷ 6 = 8 boxes, and 8 × $9 = $72. Dan multiplied 48 × 9 (the muffins, not the boxes). Rubric: 1 pt number of boxes (8), 1 pt correct amount, 1 pt explains Dan's mistake.", "l": 8}], "pt": {"title": "At the Pet Shop", "intro": "<div class='clues'><h4>Pine Street Pet Shop</h4><p>The table shows how many of each animal the pet shop has today. Use it to answer the questions.</p><table class='mini'><tr><th>Animal</th><th>Number</th></tr><tr><td>Goldfish</td><td>24</td></tr><tr><td>Parakeets</td><td>8</td></tr><tr><td>Hamsters</td><td>6</td></tr><tr><td>Rabbits</td><td>4</td></tr></table></div>", "items": [{"q": "a) How many times as many goldfish as hamsters does the shop have? Write a multiplication equation to show the comparison.<br>b) The shop has 3 times as many turtles as rabbits. How many turtles does the shop have?", "pts": 2, "a": "a) <b>4 times as many</b>; 24 = 4 × 6 (or 24 ÷ 6 = 4). b) 3 × 4 = <b>12 turtles</b>. (1 pt each)"}, {"q": "a) The goldfish are sold in bags of 4. How many bags can be made from all the goldfish? Write a related multiplication fact.<br>b) The parakeets are kept in cages with the same number of birds in each cage, and there is more than one cage. List every possible number of cages.", "pts": 2, "a": "a) 24 ÷ 4 = <b>6 bags</b>; 6 × 4 = 24. b) <b>2, 4, or 8 cages</b> (the factors of 8 greater than 1: 2 cages of 4, 4 cages of 2, 8 cages of 1). (1 pt each)"}, {"q": "Write your <b>own</b> comparison statement about two animals in the table using the words <b>\"times as many.\"</b> Then write an equation that proves your statement is true.", "pts": 1, "a": "Any correct comparison with a matching equation, e.g. \"There are 6 times as many goldfish as rabbits: 24 = 6 × 4\" or \"There are 2 times as many parakeets as rabbits: 8 = 2 × 4\" or \"4 times as many goldfish as hamsters: 24 = 4 × 6\". (1 pt: statement and equation agree and are true)"}]}}, {"n": 4, "title": "Multiply with One-Digit Numbers", "color": "#e8603c", "light": "#ffe3da", "dark": "#a63d22", "lessons": ["Multiples of 10, 100, and 1,000", "Round to Estimate Products", "Hands On: Use Place Value to Multiply", "Hands On: Use Models to Multiply", "Multiply by a Two-Digit Number", "Hands On: Model Regrouping", "The Distributive Property", "Multiply with Regrouping", "Multiply by a Multi-Digit Number", "Problem-Solving Investigation: Estimate or Exact Answer", "Multiply Across Zeros"], "standards": ["4.NBT.B.5", "4.NBT.A.3", "4.OA.A.3"], "mc": [{"q": "Find <b>6 × 700</b>.", "o": ["420", "4,200", "42,000", "4,900"], "a": 1, "e": "Use the basic fact 6 × 7 = 42, then add the two zeros from 700: 4,200.", "l": 1}, {"q": "Find <b>8 × 5,000</b>.", "o": ["4,000", "4,500", "40,000", "400,000"], "a": 2, "e": "8 × 5 = 40, then add the three zeros from 5,000: 40,000.", "l": 1}, {"q": "Estimate <b>7 × 3,842</b> by rounding 3,842 to its greatest place value.", "o": ["21,000", "2,800", "26,894", "28,000"], "a": 3, "e": "3,842 rounds to 4,000 (greatest place is thousands). 7 × 4,000 = 28,000.", "l": 2}, {"q": "Dana estimated <b>6 × 489</b> as 6 × 500 = 3,000. Which statement about her estimate is true?", "o": ["The estimate is greater than the exact product because 489 was rounded up.", "The estimate is less than the exact product because 489 was rounded down.", "The estimate is equal to the exact product.", "The estimate is less than the exact product because 6 was rounded up."], "a": 0, "e": "489 was rounded up to 500, so 6 × 500 is greater than the exact product (6 × 489 = 2,934).", "l": 2}, {"q": "Which shows how to use <b>place value</b> to find <b>4 × 352</b>?", "o": ["(4 × 300) + (4 × 5) + (4 × 2)", "(4 × 3) + (4 × 5) + (4 × 2)", "(4 × 300) + (4 × 50) + (4 × 2)", "(4 + 300) + (4 + 50) + (4 + 2)"], "a": 2, "e": "Break 352 into 300 + 50 + 2 and multiply each part by 4: (4 × 300) + (4 × 50) + (4 × 2) = 1,408.", "l": 3}, {"q": "Find <b>7 × 46</b>.", "o": ["282", "312", "328", "322"], "a": 3, "e": "7 × 46 = 7 × 40 + 7 × 6 = 280 + 42 = 322.", "l": 5}, {"q": "A box holds <b>24</b> pencils. How many pencils are in <b>8</b> boxes?", "o": ["192", "162", "32", "182"], "a": 0, "e": "8 boxes × 24 pencils = 192 pencils.", "l": 5}, {"q": "Which expression uses the <b>Distributive Property</b> to find <b>6 × 34</b>?", "o": ["(6 × 30) × (6 × 4)", "(6 × 30) + (6 × 4)", "(6 + 30) + (6 + 4)", "6 × 30 + 4"], "a": 1, "e": "The Distributive Property breaks 34 into 30 + 4: (6 × 30) + (6 × 4) = 180 + 24 = 204.", "l": 7}, {"q": "Find <b>4 × 2,386</b>.", "o": ["8,244", "9,444", "9,544", "8,544"], "a": 2, "e": "4 × 2,386 = 8,000 + 1,200 + 320 + 24 = 9,544.", "l": 9}, {"q": "Multiply.<br><span class='vert'><span>3,527</span><span class='op'>×&nbsp;6</span><span class='bar'></span></span>", "o": ["18,162", "21,162", "21,062", "20,162"], "a": 1, "e": "3,527 × 6: 6 × 7 = 42 (write 2, regroup 4), 6 × 2 + 4 = 16, 6 × 5 + 1 = 31, 6 × 3 + 3 = 21. Product: 21,162.", "l": 9}, {"q": "Find <b>5 × 3,007</b>.", "o": ["15,035", "1,535", "15,350", "15,005"], "a": 0, "e": "5 × 3,007 = 5 × 3,000 + 5 × 7 = 15,000 + 35 = 15,035. Do not skip the zeros.", "l": 11}, {"q": "Find <b>8 × 2,050</b>.", "o": ["1,640", "16,040", "164,000", "16,400"], "a": 3, "e": "8 × 2,050 = 8 × 2,000 + 8 × 50 = 16,000 + 400 = 16,400.", "l": 11}], "sa": [{"q": "The area model shows <b>4 × 23</b>.<br><svg xmlns='http://www.w3.org/2000/svg' width='236' height='86' viewBox='0 0 236 86' style='vertical-align:middle;display:inline-block'><rect x='30' y='18' width='150' height='60' fill='#cfe3f7' stroke='#1d2b44' stroke-width='2'/><rect x='180' y='18' width='44' height='60' fill='#e8eef6' stroke='#1d2b44' stroke-width='2'/><text x='105' y='12' font-size='13' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>20</text><text x='202' y='12' font-size='13' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>3</text><text x='18' y='53' font-size='13' font-family='Nunito' font-weight='700' text-anchor='end' fill='#1d2b44'>4</text><text x='105' y='53' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>4 × 20</text><text x='202' y='53' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>4 × 3</text></svg><br><span class='cmp'>a) Write the two partial products: ______ and ______</span><span class='cmp'>b) 4 × 23 = ______</span>", "pts": 2, "a": "a) 80 and 12 (4 × 20 = 80, 4 × 3 = 12) &nbsp;&nbsp; b) 80 + 12 = 92 &nbsp;(1 point each)", "l": 4}, {"q": "An area model for <b>6 × 48</b> is split into <b>6 × 40</b> and <b>6 × 8</b>. What is the product?", "pts": 1, "a": "288 — 6 × 40 = 240 and 6 × 8 = 48; 240 + 48 = 288.", "l": 4}, {"q": "Marco uses base-ten blocks to model <b>3 × 26</b>.<br><span class='cmp'>a) How many ones blocks does he have before regrouping?</span><br><span class='cmp'>b) After he regroups the ones, how many tens and ones does he have in all? Write the product.</span>", "pts": 2, "a": "a) 3 × 6 = 18 ones &nbsp;&nbsp; b) 18 ones = 1 ten 8 ones; 3 × 2 tens = 6 tens, plus 1 ten = 7 tens and 8 ones, so 3 × 26 = 78 &nbsp;(1 point each)", "l": 6}, {"q": "When you model <b>5 × 38</b> with base-ten blocks, you get <b>40 ones</b>. Explain how to regroup the 40 ones. Then write the product.", "pts": 1, "a": "Trade the 40 ones for 4 tens and 0 ones. 5 × 3 tens = 15 tens; 15 tens + 4 tens = 19 tens = 190. Product: <b>190</b>.", "l": 6}, {"q": "Multiply.<br><span class='vert'><span>68</span><span class='op'>×&nbsp;7</span><span class='bar'></span></span>", "pts": 1, "a": "476 — 7 × 8 = 56, write 6 and regroup 5 tens; 7 × 6 tens = 42 tens + 5 tens = 47 tens.", "l": 8}, {"q": "Multiply.<br><span class='cmp'>a) 4 × 59 = ______</span><span class='cmp'>b) 6 × 83 = ______</span><span class='cmp'>c) 9 × 76 = ______</span>", "pts": 3, "a": "a) 236 &nbsp;&nbsp; b) 498 &nbsp;&nbsp; c) 684 &nbsp;(1 point each)", "l": 8}, {"q": "Mia says that <b>8 × 47 = 326</b>. Find the correct product and explain Mia's mistake.", "pts": 2, "a": "Correct product: <b>376</b>. 8 × 7 = 56, so write 6 and regroup 5 tens; 8 × 4 tens = 32 tens, plus the 5 regrouped tens = 37 tens. Mia forgot to add the regrouped 5 tens (32 instead of 37). (1 pt product, 1 pt explanation)", "l": 8}, {"q": "Multiply. Then use an estimate to check that your answer is reasonable.<br><span class='vert'><span>2,794</span><span class='op'>×&nbsp;3</span><span class='bar'></span></span>", "pts": 2, "a": "Product: <b>8,382</b>. Estimate: 3 × 3,000 = 9,000, which is close to 8,382, so the answer is reasonable. (1 pt product, 1 pt estimate check)", "l": 9}, {"q": "Multiply.<br><span class='cmp'>a) 6 × 4,008 = ______</span><span class='cmp'>b) 7 × 5,090 = ______</span>", "pts": 2, "a": "a) 24,048 &nbsp;&nbsp; b) 35,630 &nbsp;(1 point each)", "l": 11}, {"q": "Ben multiplied <b>4 × 3,006</b> and got <b>1,224</b>. Find the correct product and explain Ben's mistake.", "pts": 2, "a": "Correct product: <b>12,024</b>. Ben skipped the zeros and multiplied 4 × 306 = 1,224. Every place must be multiplied: 4 × 6 = 24, 4 × 0 tens = 0, 4 × 0 hundreds = 0, 4 × 3 thousands = 12 thousands. (1 pt product, 1 pt explanation)", "l": 11}], "wp": [{"q": "Field trip tickets cost <b>$7</b> each. Ms. Ortiz has <b>$200</b> to buy tickets for her <b>28</b> students. Does she need an estimate or an exact answer to know if she has enough money? Explain, then solve.", "a": "<b>Exact answer; yes, she has enough.</b> 28 × $7 = $196, which is less than $200. An estimate of 30 × 7 = 210 would wrongly suggest she does not have enough, so the exact product is needed because the amounts are so close. Rubric: 1 pt chooses exact with a reason, 1 pt correct product $196, 1 pt conclusion.", "l": 10}, {"q": "An orchard has <b>6</b> apple trees. Each tree has about <b>185</b> apples. The farmer wants to know <b>about</b> how many apples there are. Is an estimate or an exact answer needed? Explain, then find the answer.", "a": "<b>An estimate is enough</b> because the question asks \"about how many\" and 185 is already an approximate number. 6 × 200 = <b>about 1,200 apples</b> (accept 6 × 190 = 1,140 or any reasonable estimate; exact 1,110 also acceptable if labeled). Rubric: 1 pt chooses estimate with a reason, 1 pt rounding, 1 pt reasonable answer.", "l": 10}, {"q": "A library has <b>4</b> shelves, and each shelf holds <b>1,275</b> books. The librarian must print exactly one label for every book. Estimate the number of labels first, then find the exact number. Explain why the exact number is needed.", "a": "Estimate: 4 × 1,000 = 4,000 (or 4 × 1,300 = 5,200). Exact: 4 × 1,275 = <b>5,100 labels</b>. The exact number is needed so that every book gets a label and none are wasted. Rubric: 1 pt reasonable estimate, 1 pt exact product, 1 pt explanation.", "l": 10}, {"q": "Ella saves <b>$35</b> every month for <b>9</b> months. She wants to buy a bike that costs <b>$300</b>. Will she have enough money? Explain whether an estimate can answer the question, then solve.", "a": "<b>Yes.</b> 9 × $35 = $315, which is more than $300. An estimate is not enough: rounding gives 9 × $40 = $360 or 9 × $30 = $270, one above and one below $300, so the exact amount is needed. Rubric: 1 pt exact product $315, 1 pt conclusion, 1 pt explains why an estimate is not enough.", "l": 10}, {"q": "A train travels <b>1,205</b> miles each day. The company reports the exact total distance for <b>6</b> days. Find the total distance. Then show how an estimate checks that your answer is reasonable.", "a": "<b>7,230 miles.</b> 6 × 1,205 = 7,230 (multiply across the zero: 6 × 0 tens = 0). Estimate: 6 × 1,200 = 7,200, which is close to 7,230. Rubric: 2 pts correct product (1 pt if a zero-place error such as 7,230 → 723 or 7,320), 1 pt estimate check.", "l": 10}], "pt": {"title": "Field Day Snack Order", "intro": "<div class='clues'><h4>Field Day snacks for 8 classes</h4><p>The PTA is ordering snacks for <b>8 classes</b>. The table shows how many of each item one class needs and the cost for one class. The PTA has a budget of <b>$400</b> for juice boxes and granola bars.</p><table class='mini'><tr><th>Item</th><th>Number for 1 class</th><th>Cost for 1 class</th></tr><tr><td>Juice boxes</td><td>36</td><td>$19</td></tr><tr><td>Granola bars</td><td>48</td><td>$27</td></tr><tr><td>Fruit cups</td><td>24</td><td>$15</td></tr></table></div>", "items": [{"q": "a) Exactly how many juice boxes are needed for all 8 classes?<br>b) Exactly how many granola bars are needed for all 8 classes?", "pts": 2, "a": "a) 8 × 36 = <b>288 juice boxes</b>. b) 8 × 48 = <b>384 granola bars</b>. (1 pt each)"}, {"q": "a) Round each cost to the nearest ten dollars and <b>estimate</b> the total cost of juice boxes and granola bars for 8 classes.<br>b) Find the <b>exact</b> total cost. Is the $400 budget enough? Explain why the estimate alone could not tell you.", "pts": 2, "a": "a) 8 × $20 + 8 × $30 = $160 + $240 = <b>$400</b>. b) 8 × $19 = $152 and 8 × $27 = $216; $152 + $216 = <b>$368</b>, so $400 is enough. The estimate equals the budget exactly, so only the exact total shows whether the real cost is under $400. (1 pt each)"}, {"q": "After buying juice boxes and granola bars, the PTA uses the money left in the $400 budget to buy fruit cups for as many whole classes as possible. How many classes can get fruit cups? Justify your answer with multiplication.", "pts": 1, "a": "<b>2 classes.</b> $400 − $368 = $32 left. Fruit cups cost $15 per class: 2 × $15 = $30, which fits, but 3 × $15 = $45 is more than $32. (1 pt: correct number of classes with a multiplication justification)"}]}}, {"n": 5, "title": "Multiply with Two-Digit Numbers", "color": "#3a9d4f", "light": "#dcf4e1", "dark": "#276d36", "lessons": ["Multiply by Tens", "Estimate Products", "Hands On: Use the Distributive Property to Multiply", "Multiply by a Two-Digit Number", "Solve Multi-Step Word Problems", "Problem-Solving Investigation: Make a Table"], "standards": ["4.NBT.B.5", "4.NBT.A.3", "4.OA.A.3"], "mc": [{"q": "What is <b>40 × 30</b>?", "o": ["120", "1,200", "12,000", "700"], "a": 1, "e": "4 × 3 = 12, then add the two zeros: 1,200.", "l": 1}, {"q": "Which expression has the <b>same product</b> as 60 × 50?", "o": ["6 × 500", "6 × 50", "600 × 50", "60 × 5"], "a": 0, "e": "60 × 50 = 3,000 and 6 × 500 = 3,000. Both have the basic fact 6 × 5 with two zeros.", "l": 1}, {"q": "A box holds 24 crayons. How many crayons are in <b>30 boxes</b>?", "o": ["72", "672", "720", "7,200"], "a": 2, "e": "24 × 30 = 24 × 3 tens = 72 tens = 720.", "l": 1}, {"q": "Round each factor to the nearest ten to estimate <b>38 × 52</b>.", "o": ["1,500", "1,800", "2,400", "2,000"], "a": 3, "e": "38 rounds to 40 and 52 rounds to 50. 40 × 50 = 2,000.", "l": 2}, {"q": "Which is the <b>best estimate</b> for 71 × 29?", "o": ["1,400", "2,100", "2,800", "210"], "a": 1, "e": "71 rounds to 70 and 29 rounds to 30. 70 × 30 = 2,100.", "l": 2}, {"q": "Kai estimates that 48 × 62 is about <b>3,000</b>. Which shows how Kai estimated?", "o": ["40 × 60 = 2,400", "50 × 70 = 3,500", "40 × 70 = 2,800", "50 × 60 = 3,000"], "a": 3, "e": "48 rounds to 50 and 62 rounds to 60. 50 × 60 = 3,000.", "l": 2}, {"q": "Which number makes the equation true?<br><b>14 × 23 = (14 × 20) + (14 × ___)</b>", "o": ["3", "2", "20", "23"], "a": 0, "e": "23 = 20 + 3, so 14 × 23 = (14 × 20) + (14 × 3).", "l": 3}, {"q": "Which expression shows <b>36 × 25</b> using the distributive property?", "o": ["(30 × 20) + (6 × 5)", "(36 × 20) + 5", "(30 × 25) + (6 × 25)", "(30 × 25) + 6"], "a": 2, "e": "Break apart 36 into 30 + 6: (30 × 25) + (6 × 25) = 750 + 150 = 900.", "l": 3}, {"q": "The area model shows <b>23 × 45</b>. What is the missing partial product?<br><svg xmlns='http://www.w3.org/2000/svg' width='200' height='96' viewBox='0 0 200 96' style='vertical-align:middle;display:inline-block'><rect x='34' y='20' width='99' height='43' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1.5'/><text x='83.5' y='46.5' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>800</text><rect x='133' y='20' width='61' height='43' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><text x='163.5' y='46.5' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>100</text><rect x='34' y='63' width='99' height='29' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><text x='83.5' y='82.5' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#e8603c'>?</text><rect x='133' y='63' width='61' height='29' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><text x='163.5' y='82.5' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>15</text><text x='83.5' y='14' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>40</text><text x='163.5' y='14' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>5</text><text x='28' y='45.5' font-size='12' font-family='Nunito' text-anchor='end' fill='#1d2b44'>20</text><text x='28' y='81.5' font-size='12' font-family='Nunito' text-anchor='end' fill='#1d2b44'>3</text></svg>", "o": ["12", "120", "1,200", "135"], "a": 1, "e": "The missing box is 3 × 40 = 120. The four partial products are 800, 100, 120 and 15.", "l": 3}, {"q": "What is <b>47 × 36</b>?", "o": ["423", "1,592", "1,692", "1,782"], "a": 2, "e": "47 × 36 = 47 × 30 + 47 × 6 = 1,410 + 282 = 1,692.", "l": 4}, {"q": "What is <b>85 × 29</b>?", "o": ["935", "2,365", "2,565", "2,465"], "a": 3, "e": "85 × 29 = 85 × 30 − 85 = 2,550 − 85 = 2,465.", "l": 4}, {"q": "A school orders 24 boxes of markers. Each box holds 12 markers. The teachers use 150 of the markers. How many markers are <b>left</b>?", "o": ["138", "288", "438", "126"], "a": 0, "e": "24 × 12 = 288 markers. 288 − 150 = 138 markers left.", "l": 5}], "sa": [{"q": "Find the product. <b>70 × 80</b> = ______", "pts": 1, "a": "5,600 &nbsp;(7 × 8 = 56, then add the two zeros)", "l": 1}, {"q": "Complete each equation.<br><span class='cmp'>a) 32 × 40 = ________</span><span class='cmp'>b) ________ × 30 = 1,500</span>", "pts": 2, "a": "a) 1,280 &nbsp; b) 50 &nbsp;(1 point each)", "l": 1}, {"q": "Round each factor to the nearest ten to estimate <b>63 × 48</b>.", "pts": 1, "a": "60 × 50 = 3,000", "l": 2}, {"q": "Dev says that <b>27 × 54 = 14,580</b>. Use estimation to explain why Dev's answer is <b>not reasonable</b>.", "pts": 2, "a": "Estimate: 30 × 50 = 1,500. Dev's answer, 14,580, is about ten times too large, so it is not reasonable. (1 pt reasonable estimate, 1 pt explanation; the exact product is 1,458)", "l": 2}, {"q": "Use the distributive property to complete the equation.<br><b>18 × 25 = (10 × 25) + (8 × 25) = ________ + ________ = ________</b>", "pts": 2, "a": "250 + 200 = 450 &nbsp;(1 pt both partial products, 1 pt product)", "l": 3}, {"q": "The area model shows <b>34 × 26</b>. Write the four partial products in the model, then find the product.<br><svg xmlns='http://www.w3.org/2000/svg' width='260' height='118' viewBox='0 0 260 118' style='vertical-align:middle;display:inline-block'><rect x='34' y='20' width='136' height='56' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1.5'/><text x='102.0' y='53.0' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#e8603c'>?</text><rect x='170' y='20' width='84' height='56' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><text x='212.0' y='53.0' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#e8603c'>?</text><rect x='34' y='76' width='136' height='38' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><text x='102.0' y='100.0' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#e8603c'>?</text><rect x='170' y='76' width='84' height='38' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><text x='212.0' y='100.0' font-size='13' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#e8603c'>?</text><text x='102.0' y='14' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>30</text><text x='212.0' y='14' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>4</text><text x='28' y='52.0' font-size='12' font-family='Nunito' text-anchor='end' fill='#1d2b44'>20</text><text x='28' y='99.0' font-size='12' font-family='Nunito' text-anchor='end' fill='#1d2b44'>6</text></svg><br>34 × 26 = ________", "pts": 2, "a": "Partial products: 600, 80, 180, 24 &nbsp;(30 × 20, 4 × 20, 30 × 6, 4 × 6). Product: 884 &nbsp;(1 pt all four partial products, 1 pt product)", "l": 3}, {"q": "Find each product. Show your work.<br><span class='cmp'>a) <span class='vert'><span>53</span><span class='op'>×&nbsp;24</span><span class='bar'></span></span></span><span class='cmp'>b) <span class='vert'><span>68</span><span class='op'>×&nbsp;47</span><span class='bar'></span></span></span>", "pts": 2, "a": "a) 1,272 &nbsp;(212 + 1,060) &nbsp; b) 3,196 &nbsp;(476 + 2,720) &nbsp;(1 point each)", "l": 4}, {"q": "Tara multiplied <b>46 × 72</b> and got 414. She added the partial products 92 and 322. Explain Tara's mistake, then write the correct product.", "pts": 2, "a": "The 7 in 72 means 70, so the second partial product is 46 × 70 = 3,220, not 322. Correct product: 92 + 3,220 = 3,312. (1 pt explanation, 1 pt correct product)", "l": 4}, {"q": "A theater has 28 rows with 32 seats in each row. 596 tickets were sold for tonight's show.<br><span class='cmp'>a) How many seats does the theater have? ________</span><span class='cmp'>b) How many seats will be empty? ________</span>", "pts": 2, "a": "a) 28 × 32 = 896 seats &nbsp; b) 896 − 596 = 300 empty seats &nbsp;(1 point each)", "l": 5}, {"q": "Each tray holds 24 muffins. Complete the table. Then tell how many trays are needed for 120 muffins.<br><table class='mini'><tr><th>Trays</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Muffins</td><td>24</td><td>48</td><td></td><td></td><td></td></tr></table>", "pts": 2, "a": "Table: 72, 96, 120 (add 24 each time). 120 muffins need 5 trays. (1 pt table, 1 pt answer)", "l": 6}], "wp": [{"q": "A farmer plants 36 rows of corn with 48 plants in each row. She also plants 12 rows of beans with 25 plants in each row. How many plants does the farmer plant in all?", "a": "Corn: 36 × 48 = 1,728. Beans: 12 × 25 = 300. Total: <b>2,028 plants</b>. Rubric: 1 pt each product, 1 pt correct total.", "l": 6}, {"q": "Museum tickets cost $12 for each student and $18 for each adult. A class of 46 students and 3 adults visits the museum. What is the total cost of the tickets?", "a": "Students: 46 × $12 = $552. Adults: 3 × $18 = $54. Total: <b>$606</b>. Rubric: 1 pt student cost, 1 pt adult cost, 1 pt total.", "l": 6}, {"q": "A library has 240 books in its new reading corner. It adds 35 books every week. Make a table to find after how many weeks the reading corner will have <b>more than 400 books</b>.", "a": "Table: week 1 → 275, week 2 → 310, week 3 → 345, week 4 → 380, week 5 → 415. After <b>5 weeks</b> (415 &gt; 400). Rubric: 1 pt organized table, 1 pt correct totals, 1 pt correct number of weeks.", "l": 6}, {"q": "A store sells pencils two ways: 24 boxes with 36 pencils in each box, or 18 boxes with 45 pencils in each box. Which choice gives <b>more pencils</b>, and how many more?", "a": "24 × 36 = 864 pencils; 18 × 45 = 810 pencils. The <b>24 boxes of 36</b> give <b>54 more pencils</b>. Rubric: 1 pt each product, 1 pt correct choice with difference.", "l": 6}, {"q": "Ms. Lee has $1,800 to spend on 28 tablets that cost $52 each. First <b>estimate</b> the total cost by rounding. Then find the <b>exact</b> cost and tell how much money Ms. Lee will have left.", "a": "Estimate: 30 × $50 = about $1,500. Exact: 28 × $52 = <b>$1,456</b>. Money left: 1,800 − 1,456 = <b>$344</b>. Rubric: 1 pt reasonable estimate, 1 pt exact cost, 1 pt money left.", "l": 6}], "pt": {"title": "The Fun Run Fundraiser", "intro": "<div class='clues'><h4>Fun Run Order Form</h4><p>The 4th grade is holding a fun run. <b>85 runners</b> signed up, and each runner gets a T-shirt and a water bottle. The organizers also order 12 banners for the course. Each runner collects <b>$45</b> in pledges.</p><table class='mini'><tr><th>Item</th><th>Price for each</th><th>Number ordered</th></tr><tr><td>T-shirt</td><td>$14</td><td>85</td></tr><tr><td>Water bottle</td><td>$11</td><td>85</td></tr><tr><td>Banner</td><td>$38</td><td>12</td></tr></table></div>", "items": [{"q": "Find the cost of all the <b>T-shirts</b> and the cost of all the <b>water bottles</b>.", "pts": 2, "a": "T-shirts: 85 × $14 = <b>$1,190</b>. Water bottles: 85 × $11 = <b>$935</b>. (1 pt each)"}, {"q": "Find the <b>total cost</b> of the whole order (T-shirts, water bottles, and banners). Then find how much pledge money the 85 runners collect in all, and how much <b>more</b> that is than the total cost.", "pts": 2, "a": "Banners: 12 × $38 = $456. Total cost: 1,190 + 935 + 456 = <b>$2,581</b>. Pledges: 85 × $45 = <b>$3,825</b>. Difference: 3,825 − 2,581 = <b>$1,244</b>. (1 pt total cost, 1 pt pledges and difference)"}, {"q": "The organizers want to keep the total cost <b>under $2,600</b>. Can they add <b>one more banner</b> to the order? Explain how you know.", "pts": 1, "a": "<b>No.</b> One more banner costs $38, and 2,581 + 38 = 2,619, which is more than $2,600. (1 pt: correct decision with a valid explanation)"}]}}, {"n": 6, "title": "Divide by a One-Digit Number", "color": "#d23f8a", "light": "#ffdeed", "dark": "#962a62", "lessons": ["Divide Multiples of 10, 100, and 1,000", "Estimate Quotients", "Hands On: Use Place Value to Divide", "Problem-Solving Investigation: Make a Model", "Divide with Remainders", "Interpret Remainders", "Place the First Digit", "Hands On: Distributive Property and Partial Quotients", "Divide Greater Numbers", "Quotients with Zeros", "Solve Multi-Step Word Problems"], "standards": ["4.NBT.B.6", "4.OA.A.3", "4.NBT.A.3"], "mc": [{"q": "What is <b>2,400 ÷ 6</b>?", "o": ["40", "400", "4,000", "300"], "a": 1, "e": "24 ÷ 6 = 4, then add the two zeros: 400.", "l": 1}, {"q": "Which division has a quotient of <b>70</b>?", "o": ["490 ÷ 7", "4,900 ÷ 7", "560 ÷ 7", "7,000 ÷ 7"], "a": 0, "e": "490 ÷ 7 = 70 because 7 × 70 = 490. The others give 80, 700 and 1,000.", "l": 1}, {"q": "Use compatible numbers to estimate <b>358 ÷ 6</b>.", "o": ["50", "60", "70", "600"], "a": 1, "e": "358 is close to 360, and 360 ÷ 6 = 60 is a basic fact. So the estimate is 60.", "l": 2}, {"q": "Which is the <b>best estimate</b> for 2,791 ÷ 4?", "o": ["70", "600", "700", "800"], "a": 2, "e": "2,791 is close to 2,800, and 2,800 ÷ 4 = 700.", "l": 2}, {"q": "Which expression shows <b>96 ÷ 3</b> broken apart by place value?", "o": ["(90 ÷ 3) + (6 ÷ 3)", "(90 ÷ 3) + 6", "(9 ÷ 3) + (6 ÷ 3)", "96 ÷ (3 + 3)"], "a": 0, "e": "96 = 90 + 6. Divide each part by 3: (90 ÷ 3) + (6 ÷ 3) = 30 + 2 = 32.", "l": 3}, {"q": "What is <b>59 ÷ 7</b>?", "o": ["7 R10", "8 R4", "8 R5", "8 R3"], "a": 3, "e": "7 × 8 = 56 and 59 − 56 = 3, so 59 ÷ 7 = 8 R3.", "l": 5}, {"q": "A van holds 8 students. There are 61 students going on a trip. How many vans are <b>needed</b>?", "o": ["7", "7 R5", "8", "5"], "a": 2, "e": "61 ÷ 8 = 7 R5. Seven full vans leave 5 students, so an 8th van is needed.", "l": 6}, {"q": "Nina has 50 beads. She uses 6 beads for each bracelet. After she makes as many bracelets as she can, how many beads are <b>left over</b>?", "o": ["8", "2", "6", "8 R2"], "a": 1, "e": "50 ÷ 6 = 8 R2. She makes 8 bracelets and 2 beads are left over.", "l": 6}, {"q": "In <b>316 ÷ 4</b>, in which place is the first digit of the quotient?", "o": ["thousands", "hundreds", "tens", "ones"], "a": 2, "e": "4 does not go into 3 (hundreds), but it goes into 31 (tens), so the first digit of the quotient is in the tens place: 316 ÷ 4 = 79.", "l": 7}, {"q": "Which expression shows <b>246 ÷ 6</b> using the distributive property?", "o": ["(240 ÷ 6) + 6", "(24 ÷ 6) + (6 ÷ 6)", "(240 ÷ 6) × (6 ÷ 6)", "(240 ÷ 6) + (6 ÷ 6)"], "a": 3, "e": "246 = 240 + 6, and both parts divide evenly by 6: (240 ÷ 6) + (6 ÷ 6) = 40 + 1 = 41.", "l": 8}, {"q": "What is <b>1,956 ÷ 4</b>?", "o": ["489", "479", "498", "389"], "a": 0, "e": "1,956 ÷ 4 = 489. Check: 489 × 4 = 1,956.", "l": 9}, {"q": "What is <b>3,618 ÷ 6</b>?", "o": ["63", "630", "613", "603"], "a": 3, "e": "3,618 ÷ 6 = 603. There is a 0 in the tens place because 6 does not go into 1 ten.", "l": 10}], "sa": [{"q": "Find the quotient. <b>5,400 ÷ 9</b> = ______", "pts": 1, "a": "600 &nbsp;(54 ÷ 9 = 6, then add the two zeros)", "l": 1}, {"q": "Complete each equation.<br><span class='cmp'>a) 320 ÷ 4 = ________</span><span class='cmp'>b) 2,100 ÷ ________ = 700</span>", "pts": 2, "a": "a) 80 &nbsp; b) 3 &nbsp;(1 point each)", "l": 1}, {"q": "Use compatible numbers to estimate <b>4,213 ÷ 7</b>. Write the numbers you used.", "pts": 1, "a": "4,200 ÷ 7 = 600 &nbsp;(accept any reasonable compatible pair, e.g. 4,200 ÷ 7)", "l": 2}, {"q": "Use place value to divide.<br><b>84 ÷ 4 = (80 ÷ 4) + (4 ÷ 4) = ________ + ________ = ________</b>", "pts": 2, "a": "20 + 1 = 21 &nbsp;(1 pt both partial quotients, 1 pt quotient)", "l": 3}, {"q": "Divide. Write each quotient with its remainder.<br><span class='cmp'>a) 73 ÷ 4 = ________</span><span class='cmp'>b) 128 ÷ 5 = ________</span>", "pts": 2, "a": "a) 18 R1 &nbsp; b) 25 R3 &nbsp;(1 point each)", "l": 5}, {"q": "Pencils come in packs of 9. Ms. Ortiz needs 150 pencils.<br><span class='cmp'>a) How many packs must she buy? ________</span><span class='cmp'>b) How many extra pencils will she have? ________</span>", "pts": 2, "a": "a) 150 ÷ 9 = 16 R6, so she must buy 17 packs &nbsp; b) 17 × 9 = 153, so 3 extra pencils &nbsp;(1 point each)", "l": 6}, {"q": "Look at <b>612 ÷ 9</b>.<br><span class='cmp'>a) In which place is the first digit of the quotient? ________</span><span class='cmp'>b) Find the quotient. ________</span>", "pts": 2, "a": "a) tens place (9 &gt; 6, so look at 61 tens) &nbsp; b) 68 &nbsp;(1 point each)", "l": 7}, {"q": "Use partial quotients to complete the equation.<br><b>372 ÷ 4 = (360 ÷ 4) + (12 ÷ 4) = ________ + ________ = ________</b>", "pts": 2, "a": "90 + 3 = 93 &nbsp;(1 pt both partial quotients, 1 pt quotient)", "l": 8}, {"q": "Sam divided <b>2,420 ÷ 4</b> and wrote the quotient <b>65</b>. Explain Sam's mistake, then write the correct quotient.", "pts": 2, "a": "Sam left out the zero: 4 goes into 2 (tens) 0 times, so the quotient needs a 0 in the tens place. Correct quotient: 605. (1 pt explanation, 1 pt correct quotient; check: 605 × 4 = 2,420)", "l": 10}, {"q": "Jade buys 3 packs of stickers with 24 stickers in each pack. She shares all the stickers equally among 8 friends.<br><span class='cmp'>a) How many stickers does Jade buy? ________</span><span class='cmp'>b) How many stickers does each friend get? ________</span>", "pts": 2, "a": "a) 3 × 24 = 72 stickers &nbsp; b) 72 ÷ 8 = 9 stickers each &nbsp;(1 point each)", "l": 11}], "wp": [{"q": "A bakery bakes 1,248 cookies and packs them in boxes of 8. The boxes are then packed into cartons that hold 9 boxes each. How many cartons are completely full, and how many boxes are left over?", "a": "Boxes: 1,248 ÷ 8 = 156. Cartons: 156 ÷ 9 = 17 R3, so <b>17 full cartons</b> with <b>3 boxes left over</b>. Rubric: 1 pt number of boxes, 1 pt division of boxes into cartons, 1 pt correct interpretation of the remainder.", "l": 4}, {"q": "Ms. Chen has 215 photos to put in an album. Each page holds 6 photos. Draw a model or make a diagram to show the problem. How many pages will be completely full? How many photos will be on the last page?", "a": "215 ÷ 6 = 35 R5. <b>35 full pages</b>, and the last (36th) page will have <b>5 photos</b>. Rubric: 1 pt model/diagram, 1 pt correct division, 1 pt both answers with the remainder interpreted correctly.", "l": 4}, {"q": "A school raised $1,962 at a book fair. The money is shared equally among 6 classrooms. Each classroom then spends $85 on new books. How much money does each classroom have left?", "a": "$1,962 ÷ 6 = $327 for each classroom. $327 − $85 = <b>$242</b> left. Rubric: 1 pt correct quotient, 1 pt subtraction, 1 pt final answer with units.", "l": 4}, {"q": "From Monday to Friday a theater sold 2,575 tickets, the same number each day. On Saturday it sold 118 more tickets than on one weekday. How many tickets did the theater sell on Saturday?", "a": "Each weekday: 2,575 ÷ 5 = 515 tickets. Saturday: 515 + 118 = <b>633 tickets</b>. Rubric: 1 pt division, 1 pt addition, 1 pt final answer.", "l": 4}, {"q": "A farmer harvests 1,476 apples and packs them equally into 4 crates. He sells 3 of the crates at the market. Use a bar model to show the problem. How many apples does the farmer sell?", "a": "Each crate: 1,476 ÷ 4 = 369 apples. Sold: 3 × 369 = <b>1,107 apples</b> (or 1,476 − 369 = 1,107). Rubric: 1 pt bar model, 1 pt apples in each crate, 1 pt final answer.", "l": 4}], "pt": {"title": "Planning the Zoo Trip", "intro": "<div class='clues'><h4>Zoo Trip Facts</h4><p>The 4th grade is planning a trip to the zoo. Use the facts in the table to plan the trip.</p><table class='mini'><tr><th>Fact</th><th>Number</th></tr><tr><td>Students going on the trip</td><td>136</td></tr><tr><td>Adults going on the trip</td><td>8</td></tr><tr><td>Seats on each bus</td><td>45</td></tr><tr><td>Water bottles in each case</td><td>7</td></tr></table></div>", "items": [{"q": "How many people are going on the trip in all? How many <b>buses</b> are needed so that everyone has a seat?", "pts": 2, "a": "People: 136 + 8 = <b>144</b>. Buses: 144 ÷ 45 = 3 R9, so <b>4 buses</b> are needed (3 full buses plus 1 more for the 9 extra people). (1 pt total people, 1 pt buses with remainder interpreted)"}, {"q": "Every person gets one water bottle. How many <b>cases</b> must the school buy? How many water bottles will be <b>left over</b>?", "pts": 2, "a": "144 ÷ 7 = 20 R4, so the school must buy <b>21 cases</b>. 21 × 7 = 147, so <b>3 bottles</b> are left over. (1 pt each)"}, {"q": "At the zoo, the 136 students will be split into equal tour groups with <b>no students left over</b>. Each group must have <b>fewer than 10</b> students. Choose a group size that works, tell how many groups there will be, and explain why your choice works.", "pts": 1, "a": "Any of: groups of <b>8 → 17 groups</b> (136 ÷ 8 = 17), groups of <b>4 → 34 groups</b>, or groups of <b>2 → 68 groups</b>. The choice works because the division has no remainder. (1 pt: valid group size, correct number of groups, and explanation)"}]}}, {"n": 7, "title": "Patterns and Sequences", "color": "#4b56c9", "light": "#e1e3ff", "dark": "#323b8f", "lessons": ["Nonnumeric Patterns", "Numeric Patterns", "Sequences", "Problem-Solving Investigation: Look for a Pattern", "Addition and Subtraction Rules", "Multiplication and Division Rules", "Order of Operations", "Hands On: Equations with Two Operations", "Equations with Multiple Operations"], "standards": ["4.OA.C.5", "4.OA.A.3", "4.OA.B.4"], "mc": [{"q": "Which shape comes <b>next</b> in the pattern?<br><svg xmlns='http://www.w3.org/2000/svg' width='248' height='28' viewBox='0 0 248 28' style='vertical-align:middle;display:inline-block'><circle cx='13.0' cy='13.0' r='10.0' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1.5'/><rect x='35' y='3' width='20' height='20' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='67' y='3' width='20' height='20' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><polygon points='109.0,3 119,23 99,23' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><circle cx='141.0' cy='13.0' r='10.0' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1.5'/><rect x='163' y='3' width='20' height='20' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='195' y='3' width='20' height='20' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><text x='230' y='20' font-size='18' font-weight='bold' font-family='Nunito' fill='#e8603c'>?</text></svg>", "o": ["triangle", "circle", "square", "star"], "a": 0, "e": "The pattern unit is circle, square, square, triangle. After the second square comes a triangle.", "l": 1}, {"q": "A necklace has beads in this repeating pattern: red, blue, blue, green, red, blue, blue, green, &hellip; What color is the <b>11th</b> bead?", "o": ["red", "blue", "green", "cannot tell"], "a": 1, "e": "The unit red, blue, blue, green has 4 beads. 11 = 2 units (8 beads) + 3 more: red, blue, blue — so the 11th bead is blue.", "l": 1}, {"q": "What is the next number in the pattern?<br><b>7, 12, 17, 22, ___</b>", "o": ["25", "26", "27", "32"], "a": 2, "e": "Each term is 5 more than the one before: 22 + 5 = 27.", "l": 2}, {"q": "Which rule describes the pattern <b>96, 48, 24, 12</b>?", "o": ["Subtract 48", "Divide by 2", "Subtract 24", "Divide by 4"], "a": 1, "e": "96 ÷ 2 = 48, 48 ÷ 2 = 24, 24 ÷ 2 = 12. The rule is divide by 2.", "l": 2}, {"q": "A sequence starts with <b>4</b> and follows the rule <b>multiply by 3</b>. What are the first four terms?", "o": ["4, 7, 10, 13", "4, 12, 36, 108", "4, 12, 24, 48", "3, 9, 27, 81"], "a": 1, "e": "Start at 4 and multiply by 3 each time: 4, 12, 36, 108.", "l": 3}, {"q": "Look at the sequence <b>3, 8, 13, 18, 23, 28</b>. Which statement is true about the terms?", "o": ["Every term is odd.", "Every term is a multiple of 3.", "The terms alternate between odd and even.", "Every term ends in 3."], "a": 2, "e": "The terms go odd, even, odd, even... (3, 8, 13, 18...) because adding 5 switches between odd and even.", "l": 3}, {"q": "Which rule describes the table?<br><table class='mini'><tr><th>Input</th><th>15</th><th>22</th><th>40</th></tr><tr><td>Output</td><td>9</td><td>16</td><td>34</td></tr></table>", "o": ["Subtract 6", "Add 6", "Subtract 5", "Add 9"], "a": 0, "e": "15 − 6 = 9, 22 − 6 = 16, 40 − 6 = 34. Every output is 6 less than the input.", "l": 5}, {"q": "The rule for the table is <b>multiply by 4</b>. What is the missing output?<br><table class='mini'><tr><th>Input</th><th>3</th><th>5</th><th>7</th></tr><tr><td>Output</td><td>12</td><td>20</td><td>?</td></tr></table>", "o": ["11", "24", "28", "32"], "a": 2, "e": "7 × 4 = 28.", "l": 6}, {"q": "Which rule describes the table?<br><table class='mini'><tr><th>Input</th><th>36</th><th>20</th><th>48</th></tr><tr><td>Output</td><td>9</td><td>5</td><td>12</td></tr></table>", "o": ["Subtract 27", "Divide by 3", "Multiply by 4", "Divide by 4"], "a": 3, "e": "36 ÷ 4 = 9, 20 ÷ 4 = 5, 48 ÷ 4 = 12. The rule is divide by 4.", "l": 6}, {"q": "What is the value of <b>24 − 3 × 6</b>?", "o": ["126", "18", "21", "6"], "a": 3, "e": "Multiply first: 3 × 6 = 18. Then 24 − 18 = 6.", "l": 7}, {"q": "What is the value of <b>18 + 6 ÷ 3 − 2</b>?", "o": ["18", "6", "16", "20"], "a": 0, "e": "Divide first: 6 ÷ 3 = 2. Then 18 + 2 − 2 = 18.", "l": 7}, {"q": "Which equation is <b>true</b> when <b>m = 5</b>?", "o": ["m × 4 − 5 = 20", "(m + 7) ÷ 2 = 5", "30 ÷ m + 1 = 5", "2 × m + 3 = 13"], "a": 3, "e": "Replace m with 5: 2 × 5 + 3 = 13. The other equations are not true when m = 5.", "l": 9}], "sa": [{"q": "Write the names of the <b>next two shapes</b> in the pattern.<br><svg xmlns='http://www.w3.org/2000/svg' width='248' height='28' viewBox='0 0 248 28' style='vertical-align:middle;display:inline-block'><rect x='3' y='3' width='20' height='20' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><polygon points='45.0,3 55,23 35,23' fill='#e8e

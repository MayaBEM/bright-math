re stops there, and an arrow means it carries on forever.`,figures:[{spec:{kind:`basic`,variant:`line`,labels:[`A`,`B`]},caption:`Line AB — arrows at both ends`},{spec:{kind:`basic`,variant:`segment`,labels:[`A`,`B`]},caption:`Segment AB — it stops at A and at B`},{spec:{kind:`basic`,variant:`ray`,labels:[`A`,`B`]},caption:`Ray AB — starts at A, travels past B forever`}],bullets:[`A dot at the end means the figure stops there. We call that point an endpoint.`,`An arrow at the end means the figure never stops in that direction.`,`Straightness does not decide the name — the ends do.`,`Nothing in real life goes on forever, so lines and rays are ideas we draw, not objects we can hold.`]},learn:[{heading:`1. It all starts with a point`,body:[`A point marks one exact spot. It has no length, no width and no thickness, so we cannot really draw one — we make a small dot instead and label it with a capital letter.`,`The dot on a map that shows your school is a point. So is the tip of a sharp pencil pressed on paper. Every other figure in geometry is built from points.`],figure:{kind:`points`,points:[{name:`A`,x:18,y:34},{name:`B`,x:52,y:66},{name:`C`,x:84,y:30}],caption:`Three points: point A, point B and point C`}},{heading:`2. Line, segment or ray — check the ends`,body:[`A line is straight and never stops. We draw arrows at both ends to show that it carries on in both directions.`,`A line segment is the part of a line between two points. It stops at both ends, so it has two endpoints and no arrows. A ray stops at one end only: it has one endpoint and one arrow.`],figures:[{spec:{kind:`basic`,variant:`line`,labels:[`P`,`Q`]},caption:`Line: 0 endpoints, 2 arrows`},{spec:{kind:`basic`,variant:`segment`,labels:[`P`,`Q`]},caption:`Segment: 2 endpoints, 0 arrows`},{spec:{kind:`basic`,variant:`ray`,labels:[`P`,`Q`]},caption:`Ray: 1 endpoint, 1 arrow`}],callout:{title:`Careful: a line is not a segment`,text:`A drawing on paper always has to stop somewhere, but a line does not. If the figure has arrows, the drawing is only a small piece of something that goes on forever. If it has dots at both ends, the figure really does stop — that is a segment.`,tone:`warn`}},{heading:`3. The symbols we write`,body:[`Mathematicians save time with symbols. Each figure has its own mark that sits above the letters. In books you will see the bar or the arrow printed on top of the letters; here we write it just after them so it is easy to read on screen.`,`The mark tells you the type of figure, and the letters tell you which points it passes through.`],notation:[{symbol:`A`,read:`point A`,meaning:`One exact spot. A point needs only one capital letter, and it has no size at all.`},{symbol:`AB↔`,read:`line AB (imagine the double arrow sitting on top of the letters)`,meaning:`The whole straight line through A and B. The double arrow means it never stops in either direction.`},{symbol:`AB‾`,read:`line segment AB (imagine a flat bar on top of the letters)`,meaning:`Only the part between A and B, including both endpoints. There is no arrow, so nothing carries on.`},{symbol:`AB→`,read:`ray AB (imagine a single arrow on top of the letters)`,meaning:`The figure that starts at A and travels forever through B. The single arrow shows the direction it goes.`}]},{heading:`4. For a ray, the order of the letters matters`,body:[`Read a ray name like a journey: the first letter is where you start, and the second letter is a point you travel through.`,`Ray AB starts at A and heads past B. Ray BA starts at B and heads the opposite way. Same two points, two different rays.`,`Lines and segments have no starting point, so their letters can go either way round. Line AB and line BA are the same line, and segment AB and segment BA are the same segment.`],figures:[{spec:{kind:`basic`,variant:`ray`,labels:[`A`,`B`]},caption:`Ray AB — endpoint at A`},{spec:{kind:`basic`,variant:`ray`,labels:[`B`,`A`]},caption:`Ray BA — endpoint at B`}],callout:{title:`Rule: name the endpoint first`,text:`A ray is always named with its endpoint first. Find the dot, write that letter, then write a letter for any other point the ray passes through.`,tone:`rule`}},{heading:`5. Collinear points sit on one straight line`,body:[`Points are collinear when one single straight line passes through all of them. "Co" means together and "linear" means line, so collinear means "together on a line".`,`In the diagram, the line passes through A, B and C, so those three points are collinear. Point D is off the line, so A, B and D are not collinear — you would have to bend to reach D, and lines never bend.`],figure:{kind:`points`,points:[{name:`A`,x:14,y:68},{name:`B`,x:44,y:50},{name:`C`,x:74,y:32},{name:`D`,x:52,y:80}],lineThrough:[`A`,`C`],caption:`A, B and C are collinear. D is not on the line.`},callout:{title:`Tip: use a straight edge`,text:`To test whether points are collinear, lay a ruler or the edge of a card against two of them. If the edge also touches the third point, all three are collinear.`,tone:`tip`}},{heading:`6. When two lines cross`,body:[`Lines that cross are called intersecting lines. The single point they share is the point of intersection.`,`Two straight lines can share at most one point. Once they have crossed, they keep moving apart, and a straight line can never bend back to cross again.`,`A crossroads is a good picture of this: two roads, one junction.`],figure:{kind:`relation`,variant:`intersecting`,crossAngle:58,rotation:6,labelLines:[`m`,`n`],caption:`Lines m and n intersect at the marked point`}},{heading:`7. Parallel lines and perpendicular lines`,body:[`Parallel lines run side by side and never meet, no matter how far you follow them. The gap between them stays exactly the same. Railway tracks, the two long edges of a ruler and the ruled lines on a page of writing are all parallel.`,`Perpendicular lines are a special kind of intersecting line: they cross at exactly 90°, making a square corner. We mark that corner with a small square instead of a curved arc. The corner of a window, the two strokes of a capital T and the place where a wall meets the floor are all perpendicular.`,`So perpendicular lines always intersect, but intersecting lines are only perpendicular when the corner is square.`],figures:[{spec:{kind:`relation`,variant:`parallel`,rotation:0,labelLines:[`a`,`b`]},caption:`Parallel: the gap never changes`},{spec:{kind:`relation`,variant:`perpendicular`,rotation:0,labelLines:[`c`,`d`]},caption:`Perpendicular: the small square means exactly 90°`}],callout:{title:`Rule: the small square means 90°`,text:`Whenever you see a small square drawn in a corner, the angle there is exactly 90°. If there is no square, do not assume the lines are perpendicular — check first.`,tone:`rule`}},{heading:`8. A plane is a flat surface`,body:[`A plane is a flat surface with no thickness that spreads out forever in every direction. We draw it as a slanted four-sided shape, because a flat surface seen from the side looks like that.`,`A tabletop, a whiteboard and a page of your book are all good models of a plane, although real ones stop at the edges. Points and lines can sit on a plane: here points A and B lie on plane P, and the line through them lies on the plane too.`],figure:{kind:`plane`,name:`P`,points:[{name:`A`,x:26,y:60},{name:`B`,x:70,y:34}],lineThrough:[`A`,`B`],caption:`Plane P, with line AB drawn on it`},callout:{title:`Tip: same plane is not the same line`,text:`Points on the same flat surface are called coplanar. That is not the same as collinear. Three points can share a plane and still make a triangle shape, so always check for one straight line before you say "collinear".`,tone:`tip`}}],summary:{vocabulary:[{term:`Point`,meaning:`One exact spot with no size. Marked with a dot and named with one capital letter, such as point A.`},{term:`Line`,meaning:`A straight path that never stops. It is drawn with an arrow at each end and written AB↔.`},{term:`Line segment`,meaning:`The straight part of a line between two endpoints. It stops at both ends and is written AB‾.`},{term:`Ray`,meaning:`A straight path that starts at one endpoint and carries on forever in one direction. Written AB→.`},{term:`Endpoint`,meaning:`A point where a figure stops. A segment has two, a ray has one and a line has none.`},{term:`Collinear points`,meaning:`Points that all lie on one straight line.`},{term:`Point of intersection`,meaning:`The single point that two intersecting lines share.`},{term:`Parallel lines`,meaning:`Lines that stay the same distance apart and never meet.`},{term:`Perpendicular lines`,meaning:`Lines that cross at exactly 90°, shown by a small square in the corner.`},{term:`Plane`,meaning:`A flat surface with no thickness that spreads out forever, such as an endless tabletop.`}],rules:[`Name a point with one capital letter. Name any other figure with the points it passes through.`,`Count the ends to choose the name: two arrows = line, two endpoints = segment, one endpoint and one arrow = ray.`,`A ray is always named with its endpoint first, so AB→ and BA→ are different rays.`,`For a line or a segment the order of the letters does not matter: AB‾ and BA‾ are the same segment.`,`Two straight lines on the same flat surface are either parallel or they cross at exactly one point.`,`Perpendicular lines are intersecting lines that meet at exactly 90°, marked with a small square.`],mistakes:[{wrong:`Calling a figure with a dot at each end a "line" because it is straight.`,right:`It stops at both ends, so it is a line segment. A line needs an arrow at each end.`},{wrong:`Writing "ray BA" for a ray whose dot is at A.`,right:`Write "ray AB". The endpoint always comes first in a ray name.`},{wrong:`Saying points are collinear because they are all on the same page or plane.`,right:`Points are collinear only when one straight line passes through every one of them.`},{wrong:`Calling two lines parallel because they do not touch anywhere on the page.`,right:`Check the gap between them. If it grows or shrinks, the lines will meet, so they are not parallel.`},{wrong:`Calling every pair of crossing lines perpendicular.`,right:`Only lines that cross at exactly 90°, shown by a small square, are perpendicular.`}]}}})),wi,Ti=o((()=>{wi={id:`l2`,index:2,title:`Naming Angles`,subtitle:`Vertex, arms and the five types of angle`,description:`Find out what an angle really is, learn to name one so nobody can misunderstand you, and sort angles into acute, right, obtuse, straight and reflex.`,discover:{headline:`Every corner hides an angle`,text:`Open a door, cut with scissors, or watch the hands of a clock move apart. Each time, two straight parts swing away from one shared point, and the space they open up is an angle. Once you can name an angle, you can talk about exactly which corner you mean — even when a drawing is full of them.`,figure:{kind:`angle`,degrees:55,vertex:`B`,arms:[`A`,`C`],showValue:!0},bullets:[`Two rays that start from the same point make an angle.`,`The shared starting point is called the vertex — it is the corner.`,`The two rays are called the arms (some books call them the sides).`,`The size of an angle tells you how far one arm has opened away from the other.`]},learn:[{heading:`What an angle really is`,body:[`Take one point and send two rays out from it. The amount of turn between those two rays is the angle.`,`An angle is not about how long the arms are drawn. You could stretch both arms twice as far and the angle would stay exactly the same, because the arms would still open by the same amount.`],figure:{kind:`angle`,degrees:55,vertex:`B`,arms:[`A`,`C`]},callout:{title:`The two-ray test`,text:`Before you call something an angle, check for two rays and one shared starting point. If either part is missing, there is no angle to measure.`,tone:`tip`}},{heading:`The vertex and the arms`,body:[`The point where the two rays meet is the vertex. It is the corner of the angle, and every angle has exactly one.`,`The two rays themselves are the arms. In the picture the arms are ray BA and ray BC, and they both begin at the vertex B.`,`The little curve drawn near the corner is called an arc. It is not part of the angle — it is just a marker that says "this is the angle I am talking about".`],figures:[{spec:{kind:`angle`,degrees:70,vertex:`B`,arms:[`A`,`C`],highlight:`vertex`},caption:`The vertex B — the shared corner`},{spec:{kind:`angle`,degrees:70,vertex:`B`,arms:[`A`,`C`],highlight:`arm1`},caption:`One arm — ray BA, leaving the vertex`}]},{heading:`The angle symbol ∠`,body:[`Writing "the angle at B" every time is slow, so mathematicians use the small symbol ∠ instead. It looks like a tiny corner, which makes it easy to remember.`,`Read ∠ABC out loud as "angle A B C". The symbol replaces the word "angle" and the letters tell you which angle you mean.`],notation:[{symbol:`∠ABC`,read:`angle A B C`,meaning:`The angle at vertex B, held between ray BA and ray BC.`},{symbol:`∠B`,read:`angle B`,meaning:`The angle at vertex B — safe to use only when one single angle sits at B.`},{symbol:`∠CBD`,read:`angle C B D`,meaning:`The angle at vertex B, held between ray BC and ray BD.`}]},{heading:`Three letters, vertex in the middle`,body:[`The usual way to name an angle uses three letters: a point on one arm, then the vertex, then a point on the other arm.`,`The middle letter is always the vertex. That is the whole trick, and it never changes.`,`You may read the arms in either order, so ∠ABC and ∠CBA are two names for the same angle. What you may never do is move the vertex letter out of the middle: ∠BAC is a different angle altogether, because it has its corner at A.`],figure:{kind:`angle`,degrees:50,vertex:`B`,arms:[`A`,`C`]},callout:{title:`Middle letter = vertex`,text:`In every three-letter angle name, the letter in the middle sits at the corner. Check it before you write the name, and check it again before you answer a question.`,tone:`rule`}},{heading:`When one letter is enough`,body:[`If only one angle sits at a vertex, you can save time and name it with the vertex letter alone.`,`In this diagram the only angle at P is the one between ray PQ and ray PR, so ∠P is perfectly clear. You could also write ∠QPR or ∠RPQ — all three names mean the same angle.`],figure:{kind:`angle`,degrees:60,vertex:`P`,arms:[`Q`,`R`]}},{heading:`When one letter is not enough`,body:[`Now look at point B with three rays leaving it. Suddenly there are three different angles sharing the same corner: ∠ABC, ∠CBD and ∠ABD.`,`If you wrote ∠B, nobody would know which of the three you meant. The name has to point to exactly one angle, so here you must use three letters.`,`Notice that ray BC lies inside ∠ABD. That is why ∠ABC and ∠CBD fit together side by side to make the whole of ∠ABD.`],figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}],highlightPair:[`A`,`C`]},callout:{title:`Careful with short names`,text:`Count the rays at the vertex first. Two rays means a one-letter name is safe. Three or more rays means you must write three letters.`,tone:`warn`}},{heading:`Acute, right and obtuse angles`,body:[`Angles are sorted by size, and a full turn is 360°. The square corner of a page is a quarter of that turn: 90°.`,`An acute angle is smaller than a square corner: more than 0° and less than 90°.`,`A right angle is exactly 90°. Instead of an arc, we mark it with a small square so it stands out.`,`An obtuse angle has opened past a square corner but has not become a straight line: more than 90° and less than 180°.`],figures:[{spec:{kind:`angle`,degrees:45,showValue:!0},caption:`Acute — less than 90°`},{spec:{kind:`angle`,degrees:90,showValue:!0},caption:`Right — exactly 90°`},{spec:{kind:`angle`,degrees:130,showValue:!0},caption:`Obtuse — between 90° and 180°`}]},{heading:`Straight and reflex angles`,body:[`Keep opening an obtuse angle and the two arms end up pointing in opposite directions. They now lie in one straight line, and the angle measures exactly 180°. That is a straight angle — still a real angle, because two rays still share one endpoint.`,`Open it further still and you go round the outside of the corner. Any angle bigger than 180° but smaller than 360° is called a reflex angle.`,`Every corner really has two angles: the one on the inside and the big reflex one on the outside. The arc in the diagram shows you which of the two is meant.`],figures:[{spec:{kind:`angle`,degrees:180,showValue:!0},caption:`Straight — exactly 180°`},{spec:{kind:`angle`,degrees:240,showValue:!0},caption:`Reflex — between 180° and 360°`}],callout:{title:`Follow the arc`,text:`When you see a large angle, trace the arc with your finger. If it sweeps past the straight-line position, the angle being marked is the reflex one.`,tone:`tip`}}],summary:{vocabulary:[{term:`Angle`,meaning:`The amount of opening between two rays that start from the same point.`},{term:`Vertex`,meaning:`The shared starting point of the two rays — the corner of the angle.`},{term:`Arms (sides)`,meaning:`The two rays that make the angle. Both begin at the vertex.`},{term:`∠`,meaning:`The angle symbol. ∠ABC is read as "angle A B C".`},{term:`Degree (°)`,meaning:`The unit used to measure angles. A full turn is 360°.`},{term:`Acute angle`,meaning:`An angle greater than 0° and less than 90°.`},{term:`Right angle`,meaning:`An angle of exactly 90°, marked with a small square.`},{term:`Obtuse angle`,meaning:`An angle greater than 90° and less than 180°.`},{term:`Straight angle`,meaning:`An angle of exactly 180°, where the arms make a straight line.`},{term:`Reflex angle`,meaning:`An angle greater than 180° and less than 360°.`}],rules:[`An angle needs two rays and one shared endpoint. The shared endpoint is the vertex.`,`In a three-letter name the middle letter is always the vertex: ∠ABC has its corner at B.`,`The outside letters may swap places, so ∠ABC and ∠CBA name the same angle.`,`Use a one-letter name only when a single angle sits at that vertex; otherwise use three letters.`,`Sort by size: acute is under 90°, right is exactly 90°, obtuse is between 90° and 180°, straight is exactly 180°, and reflex is between 180° and 360°.`,`Longer arms do not make a bigger angle. Only the amount of opening counts.`],mistakes:[{wrong:`Saying the vertex of ∠ABC is A because A is written first.`,right:`The vertex is the middle letter, so the vertex of ∠ABC is B.`},{wrong:`Writing ∠B when rays BA, BC and BD all leave point B.`,right:`Three angles share that corner, so name the one you mean with three letters, such as ∠CBD.`},{wrong:`Calling an angle of 91° a right angle because it is close to 90°.`,right:`A right angle is exactly 90°. An angle of 91° has passed 90°, so it is obtuse.`},{wrong:`Saying a 180° figure is only a straight line and not an angle.`,right:`Two rays still share one endpoint, so it is an angle — the straight angle, 180°.`},{wrong:`Thinking an angle with long arms is bigger than the same angle drawn with short arms.`,right:`Arm length is only about the drawing. The angle is the amount of opening, so both are equal.`}]}}})),Ei,Di=o((()=>{Ei={id:`l3`,index:3,title:`Measuring Angles`,subtitle:`Degrees, protractors and sensible estimates`,description:`Learn what a degree really is, meet every part of a protractor, follow five steps to measure any angle, choose the correct scale every time, and use estimation to check that your answer makes sense.`,discover:{headline:`How do you say exactly how big an angle is?`,text:`You can already say whether an angle is narrow or wide. But "quite wide" is not much help if you are building a ramp or cutting a slice of pizza. To compare angles fairly, everyone in the world uses the same unit: the degree. A protractor is the tool that counts those degrees for you.`,figure:{kind:`protractor`,degrees:60,rotation:0,showReading:!0},bullets:[`An angle measures turn, not length — so we need a turning unit, not centimetres.`,`One complete turn is cut into 360 equal parts, and each part is one degree.`,`We write the unit as a small raised circle: 60 degrees is written 60°.`,`A protractor is a half circle with 180 degree marks around its curved edge.`]},learn:[{heading:`What a degree really is`,body:[`Imagine standing still and spinning slowly all the way round until you face the way you started. That is a complete turn.`,`Mathematicians cut that complete turn into 360 equal slices. One slice is one degree. So a complete turn is 360°, and every angle you meet is just a number of those slices.`,`Why 360? It is an old idea from astronomers, and it is a handy number because it splits evenly into halves, thirds, quarters, fifths, sixths and many more.`],figure:{kind:`turn`,object:`compass`,startBearing:0,turn:360,direction:`cw`,showResult:!0,showCompass:!0,caption:`One complete turn — all the way round — is 360°.`},callout:{title:`Turn, not length`,text:`An angle never tells you how long anything is. It only tells you how far one arm has swung away from the other.`,tone:`tip`}},{heading:`The degree symbol`,body:[`A number on its own is not an angle. Writing 45 could mean 45 apples. Writing 45° says clearly that you mean an angle of forty-five degrees.`,`The symbol is a tiny circle, written up at the top right of the number, with no space in front of it.`,`When you name an angle as well, the whole sentence is short and neat: ∠ABC = 60°.`],notation:[{symbol:`°`,read:`degrees`,meaning:`the unit we measure angles in`},{symbol:`45°`,read:`forty-five degrees`,meaning:`an angle made of 45 of the 360 slices of a turn`},{symbol:`∠ABC = 60°`,read:`angle A B C equals sixty degrees`,meaning:`the angle with vertex B, between arms BA and BC, measures 60 degrees`}],callout:{title:`Never drop the little circle`,text:`An answer written as 45 is incomplete. Always write 45°, so everyone knows you measured an angle.`,tone:`rule`}},{heading:`The parts of a protractor`,body:[`A protractor looks busy, but it only has three parts that matter.`,`The centre point is the small cross in the middle of the flat edge. This is the part that sits on the vertex.`,`The baseline is the flat straight edge itself. You turn the protractor until the baseline lies exactly along one arm.`,`The two scales are the two rings of numbers around the curved edge. One ring counts up from the left end, the other counts up from the right end, and at every mark the two numbers add to 180.`],figure:{kind:`protractor`,degrees:60,rotation:0,caption:`Centre point on the vertex, baseline along the lower arm, two scales on the curved edge.`}},{heading:`Five steps for measuring any angle`,body:[`Step 1 — Put the centre point of the protractor exactly on the vertex of the angle.`,`Step 2 — Turn the protractor until the baseline lies exactly along one arm.`,`Step 3 — Look along the curved edge and find where the other arm crosses it. If that arm is too short to reach, extend it with a ruler — this does not change the angle.`,`Step 4 — Choose the scale that starts at 0 on the arm you lined up in Step 2.`,`Step 5 — Read the number on that scale where the second arm crosses, and write it with a degree symbol.`,`In the picture below the lower arm lies along the baseline at the inner 0, and the upper arm crosses the inner scale at 60, so the angle is 60°.`],figure:{kind:`protractor`,degrees:60,rotation:0,showReading:!0,caption:`The five steps carried out on one angle: the reading is 60°.`}},{heading:`Choosing the right scale`,body:[`A protractor carries two scales so that it works whichever way round you place it. Only one of them can be right for your angle.`,`The rule is short: use the scale whose 0 sits on the arm you lined up with the baseline.`,`In the first picture the lined-up arm points right, so the inner scale starts at 0 there and the reading is 40°. In the second picture the lined-up arm points left, so the outer scale starts at 0 there and the reading is 40° again — the same angle, read from the other end.`,`The two scales always add to 180 at the same mark. At the mark below, one scale says 40 and the other says 140, because 40 + 140 = 180.`],figures:[{spec:{kind:`protractor`,degrees:40,rotation:0,showReading:!0},caption:`Lined-up arm on the right → read the inner scale → 40°.`},{spec:{kind:`protractor`,degrees:40,rotation:180,showReading:!0},caption:`Lined-up arm on the left → read the outer scale → 40°.`}],callout:{title:`The most common mistake in this lesson`,text:`Reading the wrong scale turns 40° into 140°, or 50° into 130°. If your answer and the other scale add to 180, you have probably read the wrong one. Check which scale starts at 0 on your own arm.`,tone:`warn`}},{heading:`Estimate before you measure`,body:[`A guess made on purpose is called an estimate, and it is your safety net. Make one before you touch the protractor.`,`Use 90° as your ruler for the eyes. A right angle is the square corner of a book, a door frame or a sheet of paper.`,`Ask one question: is this angle narrower than a square corner, about the same, or wider? Narrower means your answer must be under 90. Wider means it must be over 90.`,`Then measure. If the reading disagrees with your estimate, you have almost certainly read the wrong scale — so check again before writing your answer down.`],figure:{kind:`angle`,degrees:90,rotation:0,vertex:`B`,arms:[`A`,`C`],caption:`The square corner: your reference angle of 90°.`},callout:{title:`Estimate, measure, check`,text:`Estimate first, measure second, then ask "does my answer match my estimate?" Those three moves catch nearly every protractor error.`,tone:`tip`}},{heading:`Long arms do not make a big angle`,body:[`Both angles below measure exactly 50°. Only the arms have been drawn differently.`,`The arms of an angle are rays, so they could carry on forever. Their length is just how much of the ray the artist decided to draw.`,`What you are really measuring is the amount of turn at the vertex, and stretching an arm does not turn anything.`,`So if an arm is too short to reach the scale of your protractor, extend it with a ruler and measure with confidence. The answer will not change.`],figures:[{spec:{kind:`angle`,degrees:50,rotation:0,vertex:`B`,armLengths:[100,44],showValue:!0},caption:`One long arm, one short arm — still 50°.`},{spec:{kind:`angle`,degrees:50,rotation:0,vertex:`B`,armLengths:[44,100],showValue:!0},caption:`Swap the lengths over — still 50°.`}],callout:{title:`Remember`,text:`Angle size comes from the turn at the vertex, never from the length of the arms.`,tone:`rule`}},{heading:`The sizes you must know`,body:[`Once you have a measurement, its number tells you the name of the angle straight away.`,`Acute: greater than 0° and less than 90°. Right: exactly 90°. Obtuse: greater than 90° and less than 180°. Straight: exactly 180°.`,`Two more are worth knowing: a complete turn is exactly 360°, and anything between 180° and 360° is called a reflex angle.`,`Watch the fence numbers. 90° is not acute and not obtuse — it has its own name. 180° is not obtuse — it is straight.`],figures:[{spec:{kind:`angle`,degrees:45,rotation:0,showValue:!0},caption:`Acute: 45°`},{spec:{kind:`angle`,degrees:90,rotation:0,showValue:!0},caption:`Right: exactly 90°`},{spec:{kind:`angle`,degrees:130,rotation:0,showValue:!0},caption:`Obtuse: 130°`},{spec:{kind:`angle`,degrees:180,rotation:0,showValue:!0},caption:`Straight: exactly 180°`}]},{heading:`Angle facts that save you time`,body:[`Some angles can be worked out instead of measured.`,`Angles on a straight line add up to 180°. In the diagram, ray BC splits the straight line ABD into 115° and 65°, and 115 + 65 = 180.`,`Four right angles make a complete turn, because 90 + 90 + 90 + 90 = 360. That also means one right angle is a quarter of a full turn.`,`Clock hands make angles too. The twelve hour marks share 360° equally, so each step is 30°. At 3 o'clock the hands are three steps apart: 3 × 30 = 90°. Take care at half past, though — by then the hour hand has crept half way to the next mark, because it moves 0.5° every minute.`,`Real life is full of these angles: a door opening, a road junction, the blades of a pair of scissors, the slope of a ramp.`],figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:115},{name:`D`,deg:180}],highlightPair:[`C`,`D`],showValue:!0,caption:`A, B and D lie on a straight line, so the two angles at B add to 180°.`},callout:{title:`Check it with a sum`,text:`If two angles sit on a straight line, add them. A total that is not 180° means one of the measurements is wrong.`,tone:`rule`}}],summary:{vocabulary:[{term:`Degree`,meaning:`The unit for measuring angles. A complete turn is cut into 360 equal degrees.`},{term:`Degree symbol (°)`,meaning:`The small raised circle written straight after the number, as in 45°.`},{term:`Protractor`,meaning:`The half-circle tool used to measure and draw angles.`},{term:`Centre point`,meaning:`The small cross in the middle of the protractor baseline. It sits on the vertex.`},{term:`Baseline`,meaning:`The flat straight edge of the protractor. It lies along one arm of the angle.`},{term:`Inner scale`,meaning:`The ring of numbers that starts at 0 on the right-hand end of the baseline.`},{term:`Outer scale`,meaning:`The ring of numbers that starts at 0 on the left-hand end of the baseline.`},{term:`Estimate`,meaning:`A sensible guess made before measuring, usually by comparing the angle with 90°.`},{term:`Right angle`,meaning:`An angle of exactly 90°, the square corner and a quarter of a complete turn.`},{term:`Complete turn`,meaning:`A turn all the way round back to the start: exactly 360°.`}],rules:[`Angles are measured in degrees, and every answer is written with the ° symbol.`,`Measure in five steps: centre point on the vertex, baseline along one arm, find where the other arm crosses, choose the scale that starts at 0 on your arm, read the number.`,`Use the scale whose 0 sits on the arm you lined up with the baseline. The two scales always add to 180 at the same mark.`,`Estimate against 90° first. If the reading disagrees with the estimate, you have read the wrong scale.`,`Acute: 0° < angle < 90°. Right: exactly 90°. Obtuse: 90° < angle < 180°. Straight: exactly 180°. Complete turn: 360°.`,`Angles on a straight line add to 180°, four right angles make 360°, and the length of the arms never changes the size of an angle.`],mistakes:[{wrong:`Reading 130° for an angle that is clearly narrower than a square corner.`,right:`Estimate first. A narrow angle must be under 90°, so read the scale that starts at 0 on your own arm and write 50°.`},{wrong:`Placing the end of the protractor baseline on the vertex.`,right:`The centre point — the small cross in the middle of the baseline — goes on the vertex. The end of the baseline is only where a scale begins.`},{wrong:`Saying one angle is bigger than another because its arms are drawn longer.`,right:`Compare the turn at the vertex. Arms are rays and can be any length, so a 50° angle stays 50° however far its arms are drawn.`},{wrong:`Calling an angle of exactly 90° acute, because 90 is less than 180.`,right:`The fence for acute is 90, not 180. Exactly 90° is a right angle; only angles under 90° are acute.`},{wrong:`Writing the answer as 72 with no symbol.`,right:`Write 72°. Without the degree symbol the number does not say that you measured an angle.`}]}}})),Oi,ki=o((()=>{Oi={id:`l4`,index:4,title:`Drawing Angles`,subtitle:`Six steps that turn a number into an accurate drawing`,description:`Reading an angle tells you how big it already is. Drawing one is the other way round: you are given a number and you have to make it appear on the paper. In this lesson you learn the six steps in order, how to pick the right scale, and how to check what you have drawn before you move on.`,discover:{headline:`A number on a page, turned into a picture`,text:`Someone says "draw an angle of 65°". You cannot guess it — 65° and 75° look almost the same by eye. A protractor lets you place the second arm exactly where it belongs, so your drawing means the same thing to everybody who looks at it.`,figure:{kind:`angle`,degrees:65,vertex:`B`,arms:[`A`,`C`],showArc:!0,showValue:!0,caption:`Angle ABC, drawn at exactly 65°`},bullets:[`Every angle you draw needs a vertex — the point where the two arms meet.`,`You always draw one arm first, then measure the second one from it.`,`The protractor does the hard part: it tells you where the second arm goes.`,`When you have finished, name the type of angle you drew. It is the quickest way to catch a mistake.`]},learn:[{heading:`Start with one arm and a vertex`,body:[`An angle is made of two rays that start at the same point. That shared point is the vertex.`,`You cannot measure anything until one of those rays exists, so the first arm is always drawn by hand with a ruler.`,`Its direction does not matter at all. Pointing right, pointing up, sloping — any of them is fine, because you measure the second arm from the first one, not from the edge of the page.`,`Mark the endpoint clearly and give it a letter. That letter is the middle letter of the angle name.`],figure:{kind:`basic`,variant:`ray`,labels:[`B`,`A`],caption:`Ray BA. Point B will be the vertex of the angle.`},notation:[{symbol:`∠ABC`,read:`angle A B C`,meaning:`the angle at vertex B, between arm BA and arm BC`},{symbol:`∠ABC = 65°`,read:`angle A B C equals 65 degrees`,meaning:`the amount of turn from BA to BC is 65 degrees`}]},{heading:`The six steps, in order`,body:[`Step 1: Draw the first ray with a ruler and mark its endpoint. That endpoint is the vertex.`,`Step 2: Put the protractor’s centre mark exactly on the vertex.`,`Step 3: Line the protractor’s baseline up along the ray you have just drawn.`,`Step 4: Find the degree mark you need on the scale that starts at 0 on your ray.`,`Step 5: Make a small, neat pencil mark next to that number.`,`Step 6: Lift the protractor away and join the vertex to your mark with a ruler.`,`Do them in this order every single time. Steps 2 and 3 go together — the protractor is not ready until the centre is on the vertex and the baseline is on the ray.`],figure:{kind:`protractor`,degrees:65,showReading:!0,caption:`Steps 2 to 5: centre on the vertex, baseline on the ray, then find 65 on the scale that starts at 0.`},callout:{title:`Watch the centre point`,text:`The centre mark is not on the plastic edge. It is the small cross, hole or arrow set slightly inside the straight edge. If you rest the edge on the vertex instead of the centre, every angle you draw will be a little bit wrong — and you will not be able to see why.`,tone:`warn`}},{heading:`Choosing the right scale`,body:[`Every mark on a protractor carries two numbers, one from each scale. They always add up to 180.`,`Only one of them is yours. Run your finger back along the scale to the 0 and check that the 0 sits on the ray you drew.`,`If your ray points to the right, you count on the scale whose 0 is on the right. If your ray points to the left, you count on the other one.`,`This is why a 50° angle sometimes comes out as 130°. The two numbers share the same mark, so counting on the wrong scale gives you the partner angle instead: 50 + 130 = 180.`],figure:{kind:`protractor`,degrees:50,showReading:!0,caption:`The mark for 50° on one scale is the mark for 130° on the other.`},callout:{title:`Estimate before you measure`,text:`Say the answer out loud before you touch the protractor. "50° is acute, so it must be less than a square corner." Then, if your finger lands on a mark that would give a wide, obtuse angle, you already know you are on the wrong scale.`,tone:`tip`}},{heading:`Check your work by naming what you drew`,body:[`The moment your second arm is ruled, look at it and give it a name: acute, right, obtuse or straight.`,`Then compare that name with the number you were asked for. 120° should look obtuse. If it looks acute, something has gone wrong.`,`This one-second check catches the two most common errors: reading the wrong scale, and starting the count somewhere other than 0.`,`If it fails the check, do not rub out the whole drawing. Keep the first ray, put the protractor back and find the mark again.`],figure:{kind:`angle`,degrees:120,vertex:`B`,arms:[`A`,`C`],showArc:!0,showValue:!0,caption:`Asked for 120°, drew 120°, and it looks obtuse. The check passes.`}},{heading:`Drawing right angles quickly`,body:[`A right angle is exactly 90°, so the second arm points straight away from the first, making a square corner.`,`On a protractor, 90 is the same number on both scales, which means you cannot choose the wrong one.`,`Mark a right angle with a small square at the vertex rather than a curved arc. Everyone reading your work then knows it is exactly 90°, not 89° or 91°.`,`You can also use the corner of a ruler or a piece of paper to check a right angle when you have no protractor to hand.`],figure:{kind:`angle`,degrees:90,vertex:`B`,arms:[`A`,`C`],showArc:!0,caption:`A right angle, marked with a small square instead of an arc.`}},{heading:`Drawing obtuse angles`,body:[`An obtuse angle is bigger than 90° but smaller than 180°, so the second arm passes the upright position and keeps going.`,`Work out how far past 90° you need to go. For 145°, that is 55° past the square corner, or 35° short of a straight line.`,`Keep counting up the same scale you started on. Do not jump across to the other set of numbers halfway through.`,`Big angles need long arms. If the arms are too short, the mark can be hard to line up and the drawing looks squashed.`],figure:{kind:`angle`,degrees:145,vertex:`B`,arms:[`A`,`C`],showArc:!0,showValue:!0,caption:`145° — 55° past a right angle, 35° short of a straight line.`},callout:{title:`Two ways to describe the same drawing`,text:`Any angle between 90° and 180° can be described from either side: 145° is "55° past a right angle" and also "35° before a straight angle". Both describe the same drawing, and either one is a good way to check your work.`,tone:`rule`}},{heading:`Arm length does not change the angle`,body:[`An angle measures the turn between two arms, not how far the arms travel.`,`The two drawings below are both 55°. One has short arms and one has long arms, but the opening between them is identical.`,`That means you can rule the arms as long or as short as the space allows. Longer arms are often easier to draw accurately, because a tiny slip at the mark matters less.`,`It also means you can never compare two angles by looking at how much ink is on the page. You have to compare the turn.`],figures:[{spec:{kind:`angle`,degrees:55,vertex:`B`,arms:[`A`,`C`],armLengths:[50,50],showArc:!0,showValue:!0},caption:`Short arms — 55°`},{spec:{kind:`angle`,degrees:55,vertex:`Q`,arms:[`P`,`R`],armLengths:[108,108],showArc:!0,showValue:!0},caption:`Long arms — still 55°`}]},{heading:`One drawing can answer two questions`,body:[`Draw a straight line, put a point on it, and rule one arm upwards from that point. You have now made two angles at once.`,`They sit side by side along the straight line, so together they must make 180°.`,`In the picture below the marked angle is 55°, so the angle on the other side has to be 180° − 55° = 125°.`,`This is a useful shortcut. If someone asks for 125° and your protractor is easier to line up the other way round, draw 55° and use the angle beside it.`],figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:55},{name:`D`,deg:180}],highlightPair:[`A`,`C`],showValue:!0,caption:`Angle ABC is 55°, so angle CBD must be 125°.`}}],summary:{vocabulary:[{term:`Vertex`,meaning:`The point where the two arms of an angle meet. The protractor’s centre mark goes here.`},{term:`Arm`,meaning:`One of the two rays that form an angle. Arms can be any length.`},{term:`Baseline`,meaning:`The straight edge line of the protractor, running through 0 and 180. It lies along your first ray.`},{term:`Centre mark`,meaning:`The small cross, hole or arrow in the middle of the protractor’s straight edge. Every degree is counted from here.`},{term:`Scale`,meaning:`One of the two rings of numbers on a protractor. Use the one that reads 0 along your own ray.`},{term:`Degree (°)`,meaning:`The unit for measuring turn. A full turn is 360°.`},{term:`Acute angle`,meaning:`An angle smaller than 90°, such as 30°, 45° or 75°.`},{term:`Right angle`,meaning:`Exactly 90°, a square corner. Marked with a small square, not an arc.`},{term:`Obtuse angle`,meaning:`An angle between 90° and 180°, such as 110° or 155°.`},{term:`Straight angle`,meaning:`Exactly 180°. The two arms lie in a straight line.`}],rules:[`Draw the first ray before you pick up the protractor — its endpoint is the vertex.`,`The protractor’s centre mark goes on the vertex, and its baseline goes along your ray.`,`Count from the 0 that sits on your own ray, and stay on that same scale.`,`The two numbers printed on one mark always add up to 180°.`,`Finish by ruling the second arm from the vertex through your pencil mark.`,`Name the angle you drew — acute, right or obtuse — and check it matches the size you were asked for.`],mistakes:[{wrong:`Resting the bottom edge of the protractor on the vertex.`,right:`Put the centre mark on the vertex. It sits slightly inside the plastic edge.`},{wrong:`Drawing 130° when you were asked for 50°.`,right:`Check the 0 before you count. If the 0 on your ray is not the one you started from, you will draw 180° minus the size you wanted.`},{wrong:`Starting the second arm at the far end of the first ray.`,right:`Both arms must start at the vertex — the same point the protractor centre was on.`},{wrong:`Saying an angle is bigger because its arms are longer.`,right:`Arm length changes nothing. 55° with short arms and 55° with long arms are the same angle.`},{wrong:`Finishing the drawing without looking at it.`,right:`Name it. If you were asked for 110° and it looks acute, you have used the wrong scale.`}]}}})),Ai,ji=o((()=>{Ai={id:`l5`,index:5,title:`Turns & Rotations`,subtitle:`Quarter, half, three-quarter and complete turns`,description:`Measure turns in degrees, tell clockwise from anticlockwise, and work out the direction you face after a turn.`,discover:{headline:`A turn is an angle you can walk into`,text:`Stand still and spin on the spot. You have not moved anywhere, but you are facing a new way. That change of direction is a turn, and we measure it in degrees — exactly the same degrees we use for angles. The arrow below starts facing North and turns until it faces East. That amount of turning has a name: a quarter turn, or 90°.`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`cw`,showResult:!0,animate:!0,caption:`The arrow starts at North and makes a quarter turn clockwise to East.`},bullets:[`A turn changes the direction you face, not the place you stand.`,`All the way round is 360°, so a quarter of the way round is 90°.`,`Clockwise means the way the hands of a clock travel; anticlockwise is the opposite way.`,`Doors, keys, wheels, fan blades and clock hands are all turning every day.`]},learn:[{heading:`What a turn is`,body:[`When something turns, it stays in the same place but spins around a fixed point. A key stays in the lock while it turns. A door stays on its hinges. A wheel stays on its axle.`,`The amount of turning is measured in degrees, written with a small circle like this: 90°. Going all the way round, back to where you started, is 360°.`,`Because a turn is measured in degrees, a turn really is an angle — the angle between the direction you started in and the direction you end up in.`],figure:{kind:`turn`,object:`key`,startBearing:0,turn:90,direction:`cw`,showResult:!0,animate:!0,caption:`The key turns about a fixed point. The faded key shows where it began.`}},{heading:`A quarter turn is 90°`,body:[`Cut a complete turn into four equal parts and you get four quarter turns.`,`Working: 1/4 × 360° = 360° ÷ 4 = 90°.`,`A quarter turn is a right angle. If you face North and make a quarter turn clockwise, you finish facing East.`],figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`cw`,showResult:!0,animate:!0,caption:`A quarter turn clockwise: North to East, 90°.`}},{heading:`A half turn is 180°`,body:[`Two quarter turns join up to make a half turn.`,`Working: 1/2 × 360° = 360° ÷ 2 = 180°.`,`A half turn always leaves you facing the opposite direction. From North you finish at South; from East you finish at West.`],figure:{kind:`turn`,object:`compass`,startBearing:0,turn:180,direction:`cw`,showResult:!0,animate:!0,caption:`A half turn: North to South, 180°.`},callout:{title:`A half turn is the easy one`,text:`For a half turn it does not matter whether you go clockwise or anticlockwise — 180° one way and 180° the other way both land on the opposite direction. Every other turn does depend on which way you go.`,tone:`tip`}},{heading:`A three-quarter turn is 270°`,body:[`Three quarter turns joined together make a three-quarter turn.`,`Working: 3/4 × 360° = 3 × 90° = 270°.`,`Starting at North and turning clockwise, you pass East, then South, and stop at West. A three-quarter turn clockwise finishes in the same place as a quarter turn anticlockwise — the long way round instead of the short way.`],figure:{kind:`turn`,object:`car`,startBearing:0,turn:270,direction:`cw`,showResult:!0,animate:!0,caption:`A three-quarter turn clockwise: North all the way round to West, 270°.`}},{heading:`A complete turn is 360°`,body:[`A complete turn takes you right round the circle and back to your starting direction.`,`Working: 4/4 × 360° = 360°, which is four right angles: 90° + 90° + 90° + 90°.`,`A complete turn is the only turn that leaves the direction unchanged. If a robot makes four quarter turns the same way, it ends up exactly where it began.`],figure:{kind:`turn`,object:`fish`,startBearing:0,turn:360,direction:`cw`,showResult:!0,animate:!0,caption:`A complete turn: right round the circle and back to North, 360°.`},callout:{title:`The four turns to remember`,text:`Quarter turn 90° · half turn 180° · three-quarter turn 270° · complete turn 360°. Each step adds one more right angle.`,tone:`rule`}},{heading:`Clockwise and anticlockwise`,body:[`Every turn needs two pieces of information: how far, and which way.`,`Clockwise is the way the hands of a clock move: from the 12 across to the 3, down to the 6, along to the 9 and back to the 12. On a compass that order is North → East → South → West.`,`Anticlockwise is the opposite way round: North → West → South → East.`,`The pictures below are both quarter turns from North, but they finish on opposite sides of the compass.`],figures:[{spec:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`cw`,showResult:!0},caption:`Quarter turn clockwise: North to East.`},{spec:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`ccw`,showResult:!0},caption:`Quarter turn anticlockwise: North to West.`}],callout:{title:`Do not swap the two directions`,text:`Mixing up clockwise and anticlockwise sends you to the wrong side of the compass. Before you answer, glance at a real clock and check which way its hands sweep.`,tone:`warn`}},{heading:`The compass rose and the direction you face`,body:[`The four main compass directions are North, East, South and West. Neighbouring directions are a quarter turn (90°) apart, so the whole rose is 4 × 90° = 360°.`,`To work out where a turn finishes, start on the direction you are facing and take one step round the rose for every quarter turn — forwards for clockwise, backwards for anticlockwise.`,`Example: face South and make a three-quarter turn clockwise. Step 1 takes you to West, step 2 to North, step 3 to East. So you finish facing East.`,`The in-between directions North-East, South-East, South-West and North-West sit exactly half way between the main ones, so each small step around the eight-point rose is 45°.`],figure:{kind:`multi-angle`,vertex:`O`,rays:[{name:`N`,deg:90},{name:`E`,deg:0},{name:`S`,deg:270},{name:`W`,deg:180}],caption:`The four main directions, each a quarter turn apart.`}},{heading:`Turns all around you`,body:[`A clock is the easiest turning machine to watch. The minute hand takes an hour to make one complete turn, so 15 minutes is a quarter turn (90°), 30 minutes is a half turn (180°) and 45 minutes is a three-quarter turn (270°).`,`At 3 o’clock the minute hand is on the 12 and the hour hand is on the 3, so the hands make a quarter turn — a right angle of 90°.`,`Look for turns elsewhere too: a door swinging open, a tap being turned off, a bicycle wheel rolling, a fan blade spinning, a skateboarder spinning a full 360°, and a car turning at a junction.`],figure:{kind:`clock`,hour:3,minute:0,showAngle:!0,caption:`At 3 o’clock the hands are a quarter turn apart.`}}],summary:{vocabulary:[{term:`Turn (rotation)`,meaning:`A movement that spins something around a fixed point and changes the direction it faces.`},{term:`Degree (°)`,meaning:`The unit we use to measure turns and angles. A complete turn is 360°.`},{term:`Quarter turn`,meaning:`A turn of 90°, which is a right angle.`},{term:`Half turn`,meaning:`A turn of 180°, finishing in the opposite direction.`},{term:`Three-quarter turn`,meaning:`A turn of 270°, which is three right angles.`},{term:`Complete turn`,meaning:`A turn of 360°, finishing in the direction you started in.`},{term:`Clockwise`,meaning:`Turning the same way as the hands of a clock: North → East → South → West.`},{term:`Anticlockwise`,meaning:`Turning the opposite way to the hands of a clock: North → West → South → East.`},{term:`Right angle`,meaning:`An angle of exactly 90°, the same as a quarter turn.`},{term:`Compass rose`,meaning:`The diagram showing North, East, South and West, with North-East, South-East, South-West and North-West in between.`}],rules:[`A quarter turn is 90°, a half turn is 180°, a three-quarter turn is 270° and a complete turn is 360°.`,`A complete turn contains four right angles, because 4 × 90° = 360°.`,`Clockwise turns run North → East → South → West; anticlockwise turns run the same list backwards.`,`A half turn always finishes on the opposite direction, whichever way you turn.`,`A complete turn is the only turn that leaves you facing exactly the way you started.`,`On the eight-point compass rose each neighbouring direction is 45° apart, so a quarter turn skips over one direction.`],mistakes:[{wrong:`A quarter turn is 45°.`,right:`A quarter turn is a quarter of 360°, so it is 90°. A 45° turn is only an eighth of a turn.`},{wrong:`From North, a quarter turn clockwise finishes at West.`,right:`Clockwise from North finishes at East. West is a quarter turn anticlockwise.`},{wrong:`A half turn clockwise and a half turn anticlockwise finish in different places.`,right:`Both are 180°, so both finish facing the opposite direction. Only the route round the circle is different.`},{wrong:`A three-quarter turn is 180°.`,right:`Three quarters of 360° is 270°. It is a half turn that measures 180°.`},{wrong:`After a complete turn you are facing a brand new direction.`,right:`A complete turn is 360° and brings you right back to the direction you started in.`}]}}})),Mi,Ni=o((()=>{Ci(),Ti(),Di(),ki(),ji(),Mi={l1:Si,l2:wi,l3:Ei,l4:Oi,l5:Ai}})),Pi,Fi=o((()=>{Pi=[{id:`line-vs-segment`,title:`Calling a segment a line`,mistake:`Writing "line AB" for a figure that clearly stops at A and stops at B.`,why:`Both figures are straight and both are drawn with the same two letters, so the middle of the drawing gives you no clue at all.`,fix:`Read the ends before you write the name. Arrows mean it never stops, so it is a line. Dots mean it stops, so it is a segment.`,figures:[{spec:{kind:`basic`,variant:`line`,labels:[`A`,`B`]},caption:`Line AB — arrows at both ends, no length`},{spec:{kind:`basic`,variant:`segment`,labels:[`A`,`B`]},caption:`Segment AB — stops at both ends, so it has a length`}]},{id:`vertex-middle-letter`,title:`Putting the wrong letter in the middle`,mistake:`Naming the angle at corner B as ∠BAC instead of ∠ABC.`,why:`Students often write the letters in the order they read them off the page, from left to right, rather than checking which point is the corner.`,fix:`In a three-letter angle name the middle letter is always the vertex. Find the corner first, write that letter second, then put the two arm letters around it.`,figures:[{spec:{kind:`angle`,degrees:50,vertex:`B`,arms:[`A`,`C`],highlight:`vertex`},caption:`∠ABC — B is in the middle, and B is the corner`},{spec:{kind:`angle`,degrees:50,vertex:`A`,arms:[`B`,`C`],highlight:`vertex`},caption:`∠BAC — a different angle, because now the corner is A`}]},{id:`protractor-scale`,title:`Reading the wrong scale`,mistake:`Recording 130° for an angle that is really 50°, because the arm crosses both numbers.`,why:`A protractor carries two scales that run in opposite directions, so every arm points at two numbers that always add up to 180.`,fix:`Decide first whether the angle is smaller or bigger than a square corner, then pick the number that matches. Start counting from the scale where the bottom arm reads 0.`,figures:[{spec:{kind:`protractor`,degrees:50,showReading:!0},caption:`This angle is narrower than a square corner, so the reading is 50°`},{spec:{kind:`angle`,degrees:130,showValue:!0},caption:`130° would look like this — far too wide to match the angle above`}]},{id:`arm-length`,title:`Thinking longer arms mean a bigger angle`,mistake:`Saying the angle with the long arms must be the bigger one.`,why:`A drawing with long arms simply takes up more paper, and more ink is easy to mistake for more angle.`,fix:`Measure the opening at the vertex, not the arms. Stretching an arm moves its tip further away but never changes how far the two arms have opened.`,figures:[{spec:{kind:`angle`,degrees:50,showValue:!0,armLengths:[50,50]},caption:`Short arms — the angle measures 50°`},{spec:{kind:`angle`,degrees:50,showValue:!0,armLengths:[110,110]},caption:`Long arms — still exactly 50°`}]},{id:`cw-vs-ccw`,title:`Mixing up clockwise and anticlockwise`,mistake:`Turning a quarter turn the wrong way, so north ends up facing west instead of east.`,why:`Once you are picturing the turn in your head it is easy to lose track of which way round the clock actually goes.`,fix:`Point one finger at 12 on an imaginary clock face and sweep it towards 3. That way is clockwise; the opposite way is anticlockwise.`,figures:[{spec:{kind:`turn`,object:`compass`,startBearing:0,turn:90,direction:`cw`,showResult:!0,showCompass:!0},caption:`Clockwise: north turns to east`},{spec:{kind:`turn`,object:`compass`,startBearing:0,turn:90,direction:`ccw`,showResult:!0,showCompass:!0},caption:`Anticlockwise: north turns to west`}]},{id:`ray-backwards`,title:`Naming a ray backwards`,mistake:`Writing "ray BA" for a ray that actually starts at A.`,why:`Segment names work in either order — AB and BA are the same segment — so students assume ray names work the same way. They do not.`,fix:`Write the endpoint first, always. Ray AB and ray BA start at opposite points and head in opposite directions, so only one of them is your figure.`,figures:[{spec:{kind:`basic`,variant:`ray`,labels:[`A`,`B`]},caption:`Ray AB — begins at A and travels to the right`},{spec:{kind:`basic`,variant:`ray`,labels:[`B`,`A`],rotation:180},caption:`Ray BA — begins at B and travels the other way`}]},{id:`crossing-is-not-perpendicular`,title:`Calling every crossing pair perpendicular`,mistake:`Labelling two lines perpendicular just because they cross.`,why:`The word perpendicular is often met at the same time as the word intersecting, and a crossing at 60° can look close enough to square if you only glance at it.`,fix:`Perpendicular is a promise about the angle, not about the crossing. Only use the word when the angle at the crossing is exactly 90°, and show it with a small square.`,figures:[{spec:{kind:`relation`,variant:`intersecting`,crossAngle:60},caption:`Intersecting at 60° — crossing, but not perpendicular`},{spec:{kind:`relation`,variant:`perpendicular`},caption:`Perpendicular — the square mark promises exactly 90°`}]},{id:`straight-angle-counts`,title:`Thinking a straight line cannot be an angle`,mistake:`Saying "that is just a line, so there is no angle here" when the two arms point opposite ways.`,why:`Angles are usually drawn as visible corners, so a figure with no corner does not look like an angle at all.`,fix:`Check for two arms and one shared vertex. When those arms open all the way to opposite directions you have a straight angle, and it measures 180°.`,figures:[{spec:{kind:`angle`,degrees:180,vertex:`B`,arms:[`A`,`C`],showValue:!0},caption:`∠ABC = 180°: a real angle with vertex B`},{spec:{kind:`angle`,degrees:160,vertex:`B`,arms:[`A`,`C`],showValue:!0},caption:`160° is obtuse; it only becomes straight at exactly 180°`}]}]})),Ii,Li=o((()=>{Ii=[{id:`ray-one-endpoint`,name:`One endpoint, one direction`,line:`A ray has one endpoint and one arrow.`,detail:`Use it to tell the three straight figures apart: no arrows means a segment, one arrow means a ray, two arrows means a line. The endpoint is also the letter you write first.`,figure:{kind:`basic`,variant:`ray`,labels:[`A`,`B`]}},{id:`vertex-in-the-middle`,name:`The vertex lives in the middle`,line:`In ∠ABC the corner is B — the middle letter.`,detail:`Use it every time you read or write a three-letter angle name. Cover the outer two letters with your fingers and the letter left showing is the corner you must look at.`,figure:{kind:`angle`,degrees:55,vertex:`B`,arms:[`A`,`C`],highlight:`vertex`}},{id:`square-corner`,name:`Square corner = 90°`,line:`If it fits the corner of a page, it is a right angle.`,detail:`Use the corner of your exercise book as a free right-angle checker. A gap means the angle is acute, an overlap means it is obtuse, and a perfect fit means 90°.`,figure:{kind:`angle`,degrees:90,showValue:!0}},{id:`turn-fractions`,name:`Turn fractions of 360°`,line:`¼ × 360° = 90°, ½ × 360° = 180°, ¾ × 360° = 270°, whole turn = 360°.`,detail:`Use it whenever a question talks about turns instead of degrees. Work out the fraction of a full circle first, then multiply by 360 — the four answers above cover almost every turn question.`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:270,direction:`cw`,showResult:!0,showCompass:!0}},{id:`a-is-for-acute`,name:`A is for Acute`,line:`Acute angles are small and sharp — under 90°.`,detail:`Use it when you are sorting angles quickly. Picture the sharp point of a slice of pizza: narrow, pointy and definitely less than a square corner.`,figure:{kind:`angle`,degrees:35,showValue:!0}},{id:`obtuse-is-open`,name:`Obtuse is Open wide`,line:`Both words start with O: an obtuse angle is opened wide, past 90°.`,detail:`Use it after the square-corner check. If the angle has swung past the square corner but has not flattened into a straight line, it is obtuse — between 90° and 180°.`,figure:{kind:`angle`,degrees:125,showValue:!0}},{id:`parallel-double-l`,name:`The two l’s in paraLLel`,line:`The letters l-l in "parallel" run side by side and never touch.`,detail:`Use it to keep parallel and perpendicular apart. Parallel lines run alongside each other forever; perpendicular lines crash into each other at 90°.`,figure:{kind:`relation`,variant:`parallel`,labelLines:[`a`,`b`]}},{id:`estimate-first`,name:`Guess before you measure`,line:`Say acute, right or obtuse first, then read the protractor.`,detail:`Use it to catch scale mistakes. If you decided the angle was acute, any reading above 90° must be from the wrong scale, so subtract it from 180° and check again.`,figure:{kind:`protractor`,degrees:60,showReading:!0}}]})),I,Ri=o((()=>{I=[{term:`Point`,definition:`A point marks one exact spot and has no length, width or thickness.`,figure:{kind:`points`,points:[{name:`A`,x:50,y:50}],caption:`Point A — a dot with a capital letter beside it`},check:{prompt:`How do we name a point?`,options:[`With a capital letter`,`With a number`,`With an arrow`],correct:0,note:`Every point gets one capital letter, so this one is read as "point A".`}},{term:`Line`,definition:`A line is perfectly straight and keeps going forever in both directions.`,figure:{kind:`basic`,variant:`line`,labels:[`A`,`B`],caption:`Line AB — arrows show it never stops`},check:{prompt:`How many arrows does a line have?`,options:[`None`,`One`,`Two`],correct:2,note:`A line runs on forever both ways, so it needs an arrow at each end.`}},{term:`Line segment`,definition:`A line segment is a straight piece of a line that stops at both ends.`,figure:{kind:`basic`,variant:`segment`,labels:[`A`,`B`],caption:`Segment AB — it stops at A and at B`},check:{prompt:`Which figure has a definite length you could measure with a ruler?`,options:[`A line`,`A line segment`,`A ray`],correct:1,note:`Only the segment has two stopping points, so only the segment has a length.`}},{term:`Ray`,definition:`A ray starts at one point and travels straight on forever in one direction.`,figure:{kind:`basic`,variant:`ray`,labels:[`A`,`B`],caption:`Ray AB — it begins at A and passes through B`},check:{prompt:`Ray AB begins at which point?`,options:[`A`,`B`,`It begins at both`],correct:0,note:`The first letter of a ray name is always the point it starts from, so ray AB starts at A.`}},{term:`Endpoint`,definition:`An endpoint is a point where a figure stops instead of carrying on.`,figure:{kind:`basic`,variant:`ray`,labels:[`P`,`Q`],caption:`P is the endpoint of ray PQ; the other end never stops`},check:{prompt:`How many endpoints does a ray have?`,options:[`None`,`One`,`Two`],correct:1,note:`A ray stops at its starting point and runs on forever the other way, so it has exactly one endpoint.`}},{term:`Collinear points`,definition:`Collinear points are points that all sit on one single straight line.`,figure:{kind:`points`,points:[{name:`A`,x:15,y:70},{name:`B`,x:45,y:50},{name:`C`,x:75,y:30}],lineThrough:[`A`,`C`],caption:`A, B and C are collinear — one straight line passes through all three`},check:{prompt:`Points D, E and F cannot all be joined by one straight line. What are they?`,options:[`Collinear`,`Not collinear`,`Parallel`],correct:1,note:`If one straight line cannot pass through every point, the points are not collinear.`}},{term:`Intersecting lines`,definition:`Intersecting lines are two lines that cross each other at one point.`,figure:{kind:`relation`,variant:`intersecting`,crossAngle:55,labelLines:[`a`,`b`],caption:`Lines a and b intersect at the marked point`},check:{prompt:`How many points do two straight intersecting lines share?`,options:[`None`,`Exactly one`,`Two`],correct:1,note:`Two different straight lines can only cross once — after that they move apart forever.`}},{term:`Parallel lines`,definition:`Parallel lines stay exactly the same distance apart, so they never meet.`,figure:{kind:`relation`,variant:`parallel`,labelLines:[`a`,`b`],caption:`Lines a and b are parallel — the arrow marks show it`},check:{prompt:`What happens if you follow two parallel lines a very long way?`,options:[`They meet`,`They stay the same distance apart`,`They cross at 90°`],correct:1,note:`The gap between parallel lines never changes, so they can never touch.`}},{term:`Perpendicular lines`,definition:`Perpendicular lines cross each other at a right angle.`,figure:{kind:`relation`,variant:`perpendicular`,labelLines:[`a`,`b`],caption:`The small square shows the lines meet at 90°`},check:{prompt:`Two lines cross at 90°. What are they?`,options:[`Parallel`,`Perpendicular`,`Collinear`],correct:1,note:`A 90° crossing is exactly what perpendicular means, and we mark it with a small square.`}},{term:`Plane`,definition:`A plane is a flat surface that spreads out forever in every direction.`,figure:{kind:`plane`,name:`P`,points:[{name:`A`,x:25,y:40},{name:`B`,x:70,y:62}],caption:`Plane P, with points A and B lying on it`},check:{prompt:`Which everyday object is most like a small part of a plane?`,options:[`A pencil tip`,`A tabletop`,`A piece of string`],correct:1,note:`A tabletop is flat and spreads out in two directions, just like a small piece of a plane.`}},{term:`Angle`,definition:`An angle is the amount of opening between two rays that start at the same point.`,figure:{kind:`angle`,degrees:55,vertex:`B`,arms:[`A`,`C`],caption:`The angle between ray BA and ray BC`},check:{prompt:`What do you need before you can call something an angle?`,options:[`Two rays from one shared point`,`Two separate points`,`One curved line`],correct:0,note:`Two rays and one shared starting point make an angle; take either part away and there is nothing to measure.`}},{term:`Vertex`,definition:`The vertex is the corner point where the two arms of an angle meet.`,figure:{kind:`angle`,degrees:60,vertex:`B`,arms:[`A`,`C`],highlight:`vertex`,caption:`B is the vertex of this angle`},check:{prompt:`In ∠ABC, which letter sits at the vertex?`,options:[`A`,`B`,`C`],correct:1,note:`The middle letter of a three-letter angle name is always the vertex, so here it is B.`}},{term:`Arm (side)`,definition:`An arm is one of the two rays that come out of the vertex to make the angle.`,figure:{kind:`angle`,degrees:60,vertex:`B`,arms:[`A`,`C`],highlight:`arm1`,caption:`The highlighted ray BA is one arm; ray BC is the other`},check:{prompt:`How many arms does one angle have?`,options:[`One`,`Two`,`Three`],correct:1,note:`Every angle is made by exactly two arms opening away from the same vertex.`}},{term:`Degree`,definition:`A degree is the unit we use to measure how open an angle is, written with a small ° sign.`,figure:{kind:`angle`,degrees:40,vertex:`B`,arms:[`A`,`C`],showValue:!0,caption:`This angle measures 40 degrees, written 40°`},check:{prompt:`How many degrees are in one complete turn?`,options:[`90°`,`180°`,`360°`],correct:2,note:`A full circle is cut into 360 equal degrees, so one complete turn is 360°.`}},{term:`Protractor`,definition:`A protractor is the half-circle tool with two scales that measures angles in degrees.`,figure:{kind:`protractor`,degrees:40,showReading:!0,caption:`The centre sits on the vertex and one arm sits on the zero line`},check:{prompt:`Where does the centre of the protractor go?`,options:[`On the vertex`,`On the tip of an arm`,`Anywhere along the arc`],correct:0,note:`The centre point always sits on the vertex, otherwise the scale numbers mean nothing.`}},{term:`Acute angle`,definition:`An acute angle is smaller than a right angle, so it measures less than 90°.`,figure:{kind:`angle`,degrees:40,showValue:!0,caption:`A 40° angle — sharp and narrow, so it is acute`},check:{prompt:`Which measurement belongs to an acute angle?`,options:[`35°`,`95°`,`180°`],correct:0,note:`35° is below 90°, so it is acute; the other two are too wide.`}},{term:`Right angle`,definition:`A right angle is a square corner and measures exactly 90°.`,figure:{kind:`angle`,degrees:90,showValue:!0,caption:`A right angle — marked with a small square instead of an arc`},check:{prompt:`A right angle measures exactly…`,options:[`45°`,`90°`,`100°`],correct:1,note:`A right angle is a quarter of a full turn: 360° ÷ 4 = 90°.`}},{term:`Obtuse angle`,definition:`An obtuse angle is wider than a right angle but still less than a straight line, so it is between 90° and 180°.`,figure:{kind:`angle`,degrees:130,showValue:!0,caption:`A 130° angle — wider than a square corner, so it is obtuse`},check:{prompt:`Which measurement belongs to an obtuse angle?`,options:[`89°`,`90°`,`119°`],correct:2,note:`119° sits between 90° and 180°, so it is obtuse; 89° is acute and 90° is a right angle.`}},{term:`Straight angle`,definition:`A straight angle is a half turn, so its two arms make one straight line and it measures 180°.`,figure:{kind:`angle`,degrees:180,vertex:`B`,arms:[`A`,`C`],showValue:!0,caption:`Ray BA and ray BC point opposite ways: a 180° angle`},check:{prompt:`Two right angles placed side by side make…`,options:[`a straight angle`,`an acute angle`,`a complete turn`],correct:0,note:`90° + 90° = 180°, which is a straight angle.`}},{term:`Turn (rotation)`,definition:`A turn is a rotation of an object around a fixed point, measured in degrees.`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`cw`,showR s an endpoint at each end.`},{id:`l1-03`,lesson:`l1`,skill:`figures`,difficulty:1,type:`click-target`,prompt:`Click the endpoint of this ray.`,figure:{kind:`basic`,variant:`ray`,labels:[`M`,`N`],rotation:12},clickTargets:[{id:`endpoint`,label:`the endpoint at M`},{id:`arrow`,label:`the arrow end`}],answer:{kind:`click`,correct:`endpoint`},hints:[`The endpoint is where the ray starts.`,`A ray never ends at the arrow — the arrow means it keeps going.`],explanation:`Correct! Point M is the endpoint. The ray starts at M and travels forever past N.`,reteach:`The arrow end is not an endpoint — it shows the ray goes on forever. The ray begins at M.`},{id:`l1-04`,lesson:`l1`,skill:`notation`,difficulty:2,type:`mcq`,prompt:`What is the correct name for this ray?`,figure:{kind:`basic`,variant:`ray`,labels:[`A`,`B`]},options:[{id:`a`,text:`Ray AB`},{id:`b`,text:`Ray BA`,why:`Ray BA would start at B and travel towards A — the opposite direction.`},{id:`c`,text:`Segment AB`,why:`A segment stops at both ends, but this figure has an arrow.`},{id:`d`,text:`Line AB`,why:`A line needs arrows at both ends.`}],answer:{kind:`choice`,correct:`a`},hints:[`For a ray, the endpoint is always named first.`,`The ray starts at A and passes through B.`],explanation:`Correct! The endpoint comes first, so this is ray AB. Order matters for rays.`,reteach:`Rays are named endpoint first. This ray starts at A, so it is ray AB — not ray BA.`},{id:`l1-05`,lesson:`l1`,skill:`relations`,difficulty:2,type:`mcq`,prompt:`Which words describe these two lines?`,figure:{kind:`relation`,variant:`perpendicular`,rotation:0,labelLines:[`a`,`b`]},options:[{id:`a`,text:`They are parallel.`,why:`Parallel lines never cross — these lines meet.`},{id:`b`,text:`They intersect, and they are perpendicular.`},{id:`c`,text:`They intersect, but they are not perpendicular.`,why:`The small square shows the angle is exactly 90°.`},{id:`d`,text:`They never meet.`,why:`They already meet in the diagram.`}],answer:{kind:`choice`,correct:`b`},hints:[`Look for the small square at the crossing point.`,`A small square always means an angle of 90°.`],explanation:`Correct! The lines cross, so they intersect, and the small square shows they meet at 90° — so they are perpendicular.`,reteach:`Perpendicular lines are a special kind of intersecting line: they cross at exactly 90°. The small square is the clue.`},{id:`l1-06`,lesson:`l1`,skill:`relations`,difficulty:2,type:`sort`,prompt:`Sort each real-life example into the right group.`,buckets:[{id:`par`,label:`Parallel`},{id:`perp`,label:`Perpendicular`}],items:[{id:`i1`,label:`Railway tracks`,bucket:`par`},{id:`i2`,label:`The corner of a book`,bucket:`perp`},{id:`i3`,label:`The two long edges of a ruler`,bucket:`par`},{id:`i4`,label:`The two strokes of a capital T`,bucket:`perp`},{id:`i5`,label:`The lines on writing paper`,bucket:`par`},{id:`i6`,label:`Where a wall meets the floor`,bucket:`perp`}],answer:{kind:`sort`},hints:[`Parallel lines stay the same distance apart and never meet.`,`Perpendicular lines meet and make a square corner.`],explanation:`Correct! Railway tracks, ruler edges and paper lines stay the same distance apart, while book corners, the letter T and a wall meeting the floor all make square corners.`,reteach:`Ask yourself: do the two lines make a square corner? If yes, they are perpendicular. If they never meet at all, they are parallel.`},{id:`l1-07`,lesson:`l1`,skill:`plane-collinear`,difficulty:2,type:`mcq`,prompt:`Which three points are collinear?`,figure:{kind:`points`,points:[{name:`P`,x:12,y:60},{name:`Q`,x:42,y:45},{name:`R`,x:72,y:30},{name:`S`,x:55,y:78}],lineThrough:[`P`,`R`]},options:[{id:`a`,text:`P, Q and R`},{id:`b`,text:`P, Q and S`,why:`S is not on the drawn line.`},{id:`c`,text:`Q, R and S`,why:`S sits below the line.`},{id:`d`,text:`P, R and S`,why:`S sits below the line.`}],answer:{kind:`choice`,correct:`a`},hints:[`Collinear means "on the same straight line".`,`Follow the straight line with your finger. Which points does it touch?`],explanation:`Correct! P, Q and R all lie on the same straight line, so they are collinear. S is not on that line.`,reteach:`Collinear points sit on one straight line. Point S is off the line, so any group containing S is not collinear.`},{id:`l1-08`,lesson:`l1`,skill:`figures`,difficulty:2,type:`numeric`,prompt:`How many endpoints does a line segment have?`,answer:{kind:`numeric`,value:2},hints:[`Look at both ends of a segment.`,`A segment stops at each end.`],explanation:`Correct! A line segment has exactly 2 endpoints, one at each end.`,reteach:`A segment stops at both ends, so it has 2 endpoints. A ray has 1 endpoint and a line has 0.`},{id:`l1-09`,lesson:`l1`,skill:`figures`,difficulty:3,type:`error-analysis`,prompt:`A student looks at this figure and says, "It is a line, because it is straight." What is the mistake?`,figure:{kind:`basic`,variant:`segment`,labels:[`C`,`D`]},options:[{id:`a`,text:`Being straight is not enough — a line must have arrows at both ends. This figure stops at C and D, so it is a segment.`},{id:`b`,text:`The figure is not straight, so it cannot be a line.`,why:`The figure is perfectly straight — that is not the problem.`},{id:`c`,text:`The figure is a ray, because it has one endpoint.`,why:`Count again: this figure has an endpoint at each end.`},{id:`d`,text:`The student is right.`,why:`A line never stops, but this figure stops at both C and D.`}],answer:{kind:`choice`,correct:`a`},hints:[`Lines, segments and rays are all straight.`,`The difference is what happens at the ends.`],explanation:`Correct! Lines, segments and rays are all straight. What makes a line different is that it never stops — it needs arrows at both ends.`,reteach:`Straightness does not decide the name. Check the ends: two endpoints = segment, one endpoint + one arrow = ray, two arrows = line.`},{id:`l1-10`,lesson:`l1`,skill:`figures`,difficulty:1,type:`figure-choice`,prompt:`Which diagram shows a ray?`,options:[{id:`a`,figure:{kind:`basic`,variant:`line`,labels:[`X`,`Y`],hideLabels:!0},why:`Two arrows mean this figure never stops in either direction — that is a line.`},{id:`b`,figure:{kind:`basic`,variant:`segment`,labels:[`X`,`Y`],hideLabels:!0},why:`No arrows at all, so this figure stops at both ends. That is a segment.`},{id:`c`,figure:{kind:`basic`,variant:`ray`,labels:[`X`,`Y`],hideLabels:!0}}],answer:{kind:`choice`,correct:`c`},hints:[`A ray starts somewhere and never stops.`,`Look for one dot and one arrow.`],explanation:`Correct! A ray has one endpoint (the dot) and one arrow, so it travels forever in one direction only.`,reteach:`Count the arrows. Two arrows = line. No arrows = segment. Exactly one arrow and one dot = ray.`,tags:[`identify`]},{id:`l1-11`,lesson:`l1`,skill:`figures`,difficulty:1,type:`mcq`,context:`Look at the straight edge of a ruler on your desk.`,prompt:`Which figure is the best model for the straight edge of a ruler?`,options:[{id:`a`,text:`A line segment`},{id:`b`,text:`A line`,why:`A line never stops, but a ruler stops at each end.`},{id:`c`,text:`A ray`,why:`A ray keeps going in one direction. A ruler does not.`},{id:`d`,text:`A point`,why:`A point marks one spot and has no length at all.`}],answer:{kind:`choice`,correct:`a`},hints:[`Ask yourself: does a ruler stop, or does it go on forever?`,`A ruler has two ends you can touch.`],explanation:`Correct! A ruler edge is straight and it stops at both ends, so a line segment models it best.`,reteach:`Everyday straight objects nearly always model segments, because you can point to both ends. Lines and rays never stop.`,tags:[`real-life`]},{id:`l1-12`,lesson:`l1`,skill:`figures`,difficulty:1,type:`numeric`,prompt:`How many endpoints does a ray have?`,figure:{kind:`basic`,variant:`ray`,labels:[`A`,`B`]},answer:{kind:`numeric`,value:1},hints:[`An endpoint is a place where the figure stops.`,`The arrow end never stops, so it is not an endpoint.`],explanation:`Correct! A ray has exactly 1 endpoint. It stops at the dot and travels forever the other way.`,reteach:`Only the dot end stops. The arrow means "keeps going", so a ray has 1 endpoint, not 2.`},{id:`l1-13`,lesson:`l1`,skill:`notation`,difficulty:1,type:`mcq`,prompt:`Which of these names a single point?`,options:[{id:`a`,text:`A`},{id:`b`,text:`AB‾ (a bar over the letters)`,why:`The bar joins A and B into one segment.`},{id:`c`,text:`AB→ (one arrow over the letters)`,why:`One arrow means the ray that starts at A.`},{id:`d`,text:`AB↔ (a double arrow over the letters)`,why:`A double arrow means the whole line through A and B.`}],answer:{kind:`choice`,correct:`a`},hints:[`A point is one single spot, so it needs only one letter.`,`Two letters always describe a figure that joins two points.`],explanation:`Correct! One capital letter names one point. We say and write "point A".`,reteach:`One letter = one point. As soon as you see two letters with a bar or an arrow on top, the name belongs to a segment, a ray or a line.`,tags:[`symbols`]},{id:`l1-14`,lesson:`l1`,skill:`notation`,difficulty:1,type:`mcq`,prompt:`In geometry, what does AB‾ (the letters A and B with a bar over them) mean?`,options:[{id:`a`,text:`The line segment from A to B`},{id:`b`,text:`The line through A and B`,why:`A whole line is written with a double arrow: AB↔.`},{id:`c`,text:`The ray that starts at A`,why:`A ray is written with a single arrow: AB→.`},{id:`d`,text:`Two separate points, A and B`,why:`The bar joins the two points into one figure.`}],answer:{kind:`choice`,correct:`a`},hints:[`The mark on top tells you the type of figure.`,`A flat bar has no arrow, so nothing carries on forever.`],explanation:`Correct! A flat bar with no arrows means the figure stops at both ends, so AB‾ is the segment from A to B.`,reteach:`Read the mark on top: bar = segment (stops), one arrow = ray (one endpoint), double arrow = line (never stops).`,tags:[`symbols`]},{id:`l1-15`,lesson:`l1`,skill:`relations`,difficulty:1,type:`figure-choice`,prompt:`Which diagram shows parallel lines?`,options:[{id:`a`,figure:{kind:`relation`,variant:`parallel`,rotation:0}},{id:`b`,figure:{kind:`relation`,variant:`intersecting`,crossAngle:55,rotation:0},why:`These lines already cross, so they are intersecting, not parallel.`},{id:`c`,figure:{kind:`relation`,variant:`perpendicular`,rotation:0},why:`These lines meet at a square corner, so they are perpendicular.`}],answer:{kind:`choice`,correct:`a`},hints:[`Parallel lines never touch, no matter how far you follow them.`,`The small arrow feathers are a code that says "these two are parallel".`],explanation:`Correct! Parallel lines stay exactly the same distance apart and never meet.`,reteach:`If the two lines touch anywhere, they are not parallel. Parallel lines run side by side forever, like railway tracks.`},{id:`l1-16`,lesson:`l1`,skill:`relations`,difficulty:1,type:`click-target`,context:`Two straight roads cross in the middle of a town.`,prompt:`Click the point of intersection.`,figure:{kind:`relation`,variant:`intersecting`,crossAngle:62,rotation:8,labelLines:[`m`,`n`]},clickTargets:[{id:`intersection`,label:`the point where the two roads cross`},{id:`line-m`,label:`road m`},{id:`line-n`,label:`road n`}],answer:{kind:`click`,correct:`intersection`},hints:[`The point of intersection is the one spot both lines share.`,`Follow each line with your finger until they touch.`],explanation:`Correct! Two straight lines can share only one point, and that shared point is called the point of intersection.`,reteach:`The point of intersection is where the two lines meet. It is the single point that belongs to both lines at once.`,tags:[`real-life`]},{id:`l1-17`,lesson:`l1`,skill:`plane-collinear`,difficulty:1,type:`click-target`,prompt:`Click the point that is NOT collinear with the others.`,figure:{kind:`points`,points:[{name:`A`,x:14,y:68},{name:`B`,x:44,y:50},{name:`C`,x:74,y:32},{name:`D`,x:52,y:80}],lineThrough:[`A`,`C`]},clickTargets:[{id:`point-A`,label:`point A`},{id:`point-B`,label:`point B`},{id:`point-C`,label:`point C`},{id:

var KEY='hz-horizon-',EXAM=55*60,app=document.getElementById('app'),S=null,tick=null,barRO=null;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function load(id){try{var v=localStorage.getItem(KEY+id);return v?JSON.parse(v):null}catch(e){return null}}
function save(){if(!S)return;try{localStorage.setItem(KEY+S.id,JSON.stringify({mode:S.mode,answers:S.answers,flags:S.flags,elapsed:S.elapsed,submitted:S.submitted,part:S.part}))}catch(e){}}
function wipe(id){try{localStorage.removeItem(KEY+id)}catch(e){}}
function bestOf(id){try{return +localStorage.getItem(KEY+'best-'+id)||0}catch(e){return 0}}
function setBest(id,v){try{if(v>bestOf(id))localStorage.setItem(KEY+'best-'+id,String(v))}catch(e){}}
function testById(id){return D.tests.filter(function(t){return t.id===id})[0]}
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function theme(t){var r=document.documentElement.style;if(t)r.setProperty('--accent',t.accent);else r.removeProperty('--accent')}
function setBarH(){var b=$('.bar'),h=b?b.offsetHeight+4:6;document.documentElement.style.setProperty('--barh',h+'px');
  if(window.ResizeObserver){if(barRO)barRO.disconnect();if(b){barRO=new ResizeObserver(function(){document.documentElement.style.setProperty('--barh',(b.offsetHeight+4)+'px')});barRO.observe(b)}}}
function starsOf(n,g){var k=n>=g[0]?5:n>=g[1]?4:n>=g[2]?3:n>=20?2:1,o='';for(var i=0;i<5;i++)o+=i<k?'★':'☆';return o}

/* ---- visuals ---- */
function axes(w,h,ymax,ystep,ylabel){var L=52,B=40,T=44,R=20,pw=w-L-R,ph=h-T-B,s='';
  for(var v=0;v<=ymax;v+=ystep){var y=T+ph-(v/ymax)*ph;s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+y+'" y2="'+y+'" stroke="#d8ccb6"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#1c1a17" font-weight="600">'+v+'</text>'}
  s+='<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="#1c1a17" stroke-width="2"/><line x1="'+L+'" x2="'+(w-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="#1c1a17" stroke-width="2"/>';
  if(ylabel)s+='<text x="14" y="'+(T+ph/2)+'" transform="rotate(-90 14 '+(T+ph/2)+')" text-anchor="middle" font-size="12" fill="#665d52" font-weight="600">'+esc(ylabel)+'</text>';
  return {s:s,L:L,pw:pw,ph:ph,B:T+ph}}
function title(w,t){return '<text x="'+w/2+'" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1a17">'+esc(t)+'</text>'}
function vBar(v){var w=440,h=245,a=axes(w,h,v.ymax,v.ystep,v.ylabel),n=v.vals.length,bw=a.pw/n*.6,s=a.s;
  v.vals.forEach(function(val,i){var cx=a.L+a.pw/n*(i+.5),bh=val/v.ymax*a.ph;s+='<rect x="'+(cx-bw/2)+'" y="'+(a.B-bh)+'" width="'+bw+'" height="'+bh+'" fill="var(--accent)"/><text x="'+cx+'" y="'+(a.B-bh-6)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1a17">'+val+'</text><text x="'+cx+'" y="'+(a.B+18)+'" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1a17">'+esc(v.labels[i])+'</text>'});
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(v.title)+'">'+title(w,v.title)+s+'</svg>'}
function vLine(v){var w=440,h=245,a=axes(w,h,v.ymax,v.ystep,v.ylabel),n=v.vals.length,p=[],d='',s=a.s;
  v.vals.forEach(function(val,i){var x=a.L+a.pw/n*(i+.5),y=a.B-val/v.ymax*a.ph;p.push(x+','+y);d+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fffdf7" stroke="var(--accent)" stroke-width="3"/><text x="'+x+'" y="'+(y-11)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1a17">'+val+'</text><text x="'+x+'" y="'+(a.B+18)+'" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1a17">'+esc(v.labels[i])+'</text>'});
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(v.title)+'">'+title(w,v.title)+s+'<polyline points="'+p.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round"/>'+d+'</svg>'}
var PIE=['#cf5b43','#2f6f8f','#e0a73a','#6c9a7b','#8a7f72','#b9774a'];
function vPie(v){var w=440,h=232,cx=110,cy=130,r=82,tot=0,a0=-Math.PI/2,s='',l='';v.data.forEach(function(d){tot+=d[1]});
  v.data.forEach(function(d,i){var a1=a0+d[1]/tot*2*Math.PI,x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+='<path d="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+r+' '+r+' 0 '+((a1-a0)>Math.PI?1:0)+' 1 '+x1+' '+y1+'Z" fill="'+PIE[i%6]+'" stroke="#fffdf7" stroke-width="2"/>';
    var y=70+i*30;l+='<rect x="250" y="'+(y-12)+'" width="16" height="16" fill="'+PIE[i%6]+'"/><text x="274" y="'+y+'" font-size="14" font-weight="600" fill="#1c1a17">'+esc(d[0])+' '+d[1]+'%</text>';a0=a1});
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(v.title)+'">'+title(w,v.title)+s+l+'</svg>'}
function vTable(v){return '<table class="grid2"><tr>'+v.headers.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr>'+v.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table>'}
function vNotice(v){return '<div class="notice" style="--nc:'+(v.color||'#1c1a17')+'"><div class="nt">'+v.title+'</div><div class="nb">'+v.lines.map(function(x){return '<div>'+x+'</div>'}).join('')+'</div></div>'}
function visual(v){return '<div class="visual">'+({bar:vBar,line:vLine,pie:vPie,table:vTable,notice:vNotice,html:function(x){return x.html}}[v.t])(v)+'</div>'}

/* ---- questions ---- */
function explHTML(q,a,cheer){
  var ok=a===q.ans,res=a==null?'<span class="res-no">✕ Not answered</span>':ok?'<span class="res-ok">✓ Correct</span>':'<span class="res-no">✕ You chose '+(a+1)+') '+q.opts[a]+'</span>';
  return '<div class="expl"><div class="res">'+res+'<span>Answer: '+(q.ans+1)+') '+q.opts[q.ans]+'</span></div>'+q.expl+'<div class="skill" style="margin-top:6px">'+esc(q.tag)+'</div></div>'}
function qHTML(q,mode){
  var a=S.answers[q.n],flag=S.flags.indexOf(q.n)>=0,show=mode==='review'||(S.mode==='practice'&&a!=null),lock=show;
  var h='<div class="q'+(flag&&mode==='test'?' flagged':'')+'" id="q'+q.n+'"><div class="qh"><div class="qn">'+q.n+'</div><div class="stem">'+(q.stem||'<span style="color:var(--muted);font-weight:500">Choose the best word or phrase for blank '+q.n+'.</span>')+'</div>';
  if(mode==='test')h+='<button class="flagb" data-flag="'+q.n+'" aria-pressed="'+flag+'">'+(flag?'Flagged':'Flag')+'</button>';
  h+='</div><div class="opts" role="group" aria-label="Question '+q.n+' answers">';
  q.opts.forEach(function(o,i){var c='opt',mark=i+1;
    if(show){if(i===q.ans){c+=' right';mark='✓'}else if(i===a){c+=' wrong';mark='✕'}}else if(a===i)c+=' sel';
    h+='<button class="'+c+'" data-q="'+q.n+'" data-o="'+i+'"'+(lock?' disabled':'')+' aria-pressed="'+(a===i)+'"><i>'+mark+'</i><span>'+o+'</span></button>'});
  h+='</div>';if(show)h+=explHTML(q,a);return h+'</div>'}
function blockHTML(t,b,mode){
  var qs=b.qs.map(function(n){return t.q[n]}),pane='',qh='',head=b.label||b.intro||'';
  if(b.kind==='cloze')pane='<div class="passage"><h3>'+esc(b.title)+'</h3><p>'+b.text.replace(/\{(\d+)\}/g,function(m,k){var n=b.qs[+k-1],a=S.answers[n];return '<span class="blank'+(a!=null?' on':'')+'" id="bl'+n+'">'+(a!=null?(a+1):n)+'</span>'})+'</p></div>';
  else if(b.kind==='visual')pane=visual(b.visual);
  else if(b.kind==='passage')pane=(b.text?'<div class="passage">'+(b.title?'<h3>'+esc(b.title)+'</h3>':'')+b.text.split('\n\n').map(function(p){return '<p>'+p+'</p>'}).join('')+'</div>':'')+(b.visual?visual(b.visual):'');
  qs.forEach(function(q){qh+=qHTML(q,mode)});
  if(!pane)return '<div class="block">'+qh+'</div>';
  return '<div class="block split"><div class="pane"><div class="phead"><span>'+esc(head)+'</span><button class="pmin" type="button" data-pmin="1" aria-expanded="true">Hide</button></div><div class="pbody">'+pane+'</div></div><div class="qcol">'+qh+'</div></div>'}

/* ---- views ---- */
function home(){
  stop();S=null;theme(null);
  var h='<div class="topline"><img class="logo" src="'+LOGO+'" alt="Bright EngMath"><div class="ttl">Grade 6 English</div></div>'
   +'<section class="hero"><div class="kick">Horizon Series</div><h1>Three new mock exams for Grade 6 English</h1><p class="lead">Read the passage, answer the questions, and learn from a full explanation for every answer. The passage stays beside the questions, so you never scroll back to find it.</p>'
   +'<p class="facts"><span><b>3</b>tests</span><span><b>60</b>questions each</span><span><b>55</b>minutes</span><span><b>5</b>parts</span></p></section>'
   +'<section class="toc"><h2>Choose a test</h2>';
  D.tests.forEach(function(t){
    var sv=load(t.id),n=sv?Object.keys(sv.answers).length:0,b=bestOf(t.id);
    h+='<div class="chap" style="--c:'+t.accent+'"><div class="no">'+String(t.no).padStart(2,'0')+'</div><div><h3>'+esc(t.theme)+'</h3><p>'+esc(t.blurb)+'</p><ul>'+t.reads.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul></div><div class="acts">'
     +(sv?'<div class="state">'+(sv.submitted?'Finished':'In progress')+', '+n+'/60 answered'+(b?', best '+b+'/60':'')+'</div>':'')
     +(sv&&!sv.submitted?'<button class="btn accent" data-act="resume" data-id="'+t.id+'">Resume</button>':'')
     +(sv&&sv.submitted?'<button class="btn accent" data-act="results" data-id="'+t.id+'">See results</button>':'')
     +'<button class="btn'+(sv?'':' primary')+'" data-act="start" data-mode="exam" data-id="'+t.id+'">'+(sv?'Restart exam':'Start exam')+'</button><button class="btn" data-act="start" data-mode="practice" data-id="'+t.id+'">Practice mode</button></div></div>'});
  h+='</section><section class="how"><div><b>Exam mode</b><p>A 55-minute timer and no hints. Answers and explanations appear after you submit.</p></div><div><b>Practice mode</b><p>No timer. Each answer is checked as soon as you choose it, with an explanation.</p></div><div><b>Saved on this device</b><p>Your progress stays in this browser, so you can close the page and continue later.</p></div></section>'
   +'<div class="foot">© Bright EngMath. Original questions. American English. Single-classroom license. Not affiliated with any school or exam board.</div>';
  app.innerHTML=h;setBarH();window.scrollTo(0,0)}
function begin(id,mode,fresh){
  var t=testById(id),sv=fresh?null:load(id);if(fresh)wipe(id);
  S={id:id,t:t,mode:sv?sv.mode:mode,answers:sv?sv.answers:{},flags:sv?sv.flags:[],elapsed:sv?sv.elapsed:0,submitted:sv?sv.submitted:false,part:sv&&sv.part?sv.part:1,confirm:false,streak:0};
  t.q={};t.qlist.forEach(function(q){t.q[q.n]=q});theme(t);
  if(S.submitted)return results();testView();run()}
function stop(){if(tick){clearInterval(tick);tick=null}}
function run(){stop();if(S.mode!=='exam')return;tick=setInterval(function(){S.elapsed++;var r=EXAM-S.elapsed,el=$('#timer');if(el){el.textContent=fmt(r);el.className='timer'+(r<300?' low':'')}if(S.elapsed%5===0)save();if(r<=0)submit()},1000)}
function tabsHTML(){return S.t.parts.map(function(p){var d=true;for(var n=p.from;n<=p.to;n++)if(S.answers[n]==null){d=false;break}
  return '<button class="tab" role="tab" data-part="'+p.no+'" aria-selected="'+(p.no===S.part)+'">'+p.no+'. '+esc(p.name)+'<small>'+p.from+'–'+p.to+'</small>'+(d?'<span class="ck" aria-label="complete">✓</span>':'')+'</button>'}).join('')}
function palHTML(){return S.t.qlist.map(function(q){var a=S.answers[q.n],c='';if(S.mode==='practice'&&a!=null)c=a===q.ans?'ok':'no';else if(a!=null)c='done';if(S.flags.indexOf(q.n)>=0)c+=' flag';return '<button class="'+c+'" data-go="'+q.n+'" aria-label="Question '+q.n+(a!=null?', answered':'')+'">'+q.n+'</button>'}).join('')}
function testView(){
  var t=S.t,p=t.parts[S.part-1],k=Object.keys(S.answers).length;
  var h='<div class="bar"><div class="barin"><img class="ic" src="'+ICON+'" alt=""><div class="t">'+esc(t.label)+'<small>'+esc(t.theme)+', '+(S.mode==='exam'?'Exam mode':'Practice mode')+'</small></div>'
   +(S.mode==='exam'?'<div class="timer" id="timer" role="timer">'+fmt(EXAM-S.elapsed)+'</div>':'')
   +'<div class="count" id="count">'+k+'/60 answered</div><button class="btn sm" data-act="map" aria-expanded="false">Map</button><button class="btn sm primary" data-act="ask">Submit</button><button class="btn sm" data-act="home">Home</button></div>'
   +'<div class="prog" aria-hidden="true"><i id="pf" style="width:'+Math.round(k/60*100)+'%"></i></div><div class="tabs" role="tablist">'+tabsHTML()+'</div></div>'
   +'<div class="partinfo"><h2>Part '+p.no+': '+esc(p.name)+'</h2><p>'+esc(p.instr)+' Questions '+p.from+'–'+p.to+'.</p></div>';
  if(S.confirm)h+=confirmHTML();
  p.blocks.forEach(function(b){h+=blockHTML(t,b,'test')});
  h+='<div class="nav"><button class="btn" data-act="prev"'+(S.part===1?' disabled':'')+'>← Previous part</button>'+(S.part<5?'<button class="btn accent" data-act="next">Next part →</button>':'<button class="btn primary" data-act="ask">Finish and submit</button>')+'</div>'
   +'<aside class="map" id="map" aria-label="Question map" hidden><h3>Question map</h3><div class="pal" id="pal">'+palHTML()+'</div><div class="maplegend">Filled = answered. Red dot = flagged.</div></aside>';
  app.innerHTML=h;setBarH();window.scrollTo(0,0)}
function confirmHTML(){var un=60-Object.keys(S.answers).length,fl=S.flags.length;
  return '<div class="confirm"><b>Ready to submit?</b><p style="margin:4px 0 10px">'+(un?'You have <b>'+un+'</b> unanswered question'+(un>1?'s':'')+'. ':'All 60 questions are answered. ')+(fl?fl+' flagged. ':'')+'You cannot change answers after submitting.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="submit">Submit my answers</button><button class="btn" data-act="cancel">Keep working</button></div></div>'}
function chrome(){var k=Object.keys(S.answers).length,p=$('#pal'),c=$('#count'),t=$('.tabs'),f=$('#pf');if(p)p.innerHTML=palHTML();if(c)c.textContent=k+'/60 answered';if(t)t.innerHTML=tabsHTML();if(f)f.style.width=Math.round(k/60*100)+'%';setBarH()}
function answer(n,o){var q=S.t.q[n];if(S.submitted)return;if(S.mode==='practice'&&S.answers[n]!=null)return;S.answers[n]=o;save();
  var el=$('#q'+n);if(el){var d=document.createElement('div');d.innerHTML=qHTML(q,'test');el.replaceWith(d.firstChild)}
  var bl=$('#bl'+n);if(bl){bl.textContent=o+1;bl.className='blank on'}chrome()}
function submit(){S.submitted=true;stop();save();results()}
function score(){var per={},tot=0;S.t.parts.forEach(function(p){per[p.no]=0});S.t.qlist.forEach(function(q){if(S.answers[q.n]===q.ans){tot++;per[q.part]++}});return {tot:tot,per:per}}
function results(filter){
  stop();filter=filter||'all';theme(S.t);var t=S.t,sc=score(),g=t.guide;setBest(S.id,sc.tot);
  var band=sc.tot>=g[0]?'Excellent':sc.tot>=g[1]?'Strong':sc.tot>=g[2]?'Keep practicing':'Review the explanations';
  var tip=sc.tot>=g[0]?'You are ready for harder papers. Try the next test.':sc.tot>=g[1]?'Solid work. Read the explanations for the questions you missed, then try again in a few days.':sc.tot>=g[2]?'Good start. Study the skill notes below, then retake the test in a week.':'Read every explanation below, study the skill notes, then retake the test in a week.';
  var ni=D.tests.indexOf(t),nx=D.tests[ni+1];
  var h='<div class="topline"><img class="logo" src="'+LOGO+'" alt="Bright EngMath"><button class="btn sm" data-act="home">Home</button></div>'
   +'<div class="score"><div class="big">'+sc.tot+'<small> / 60</small></div><div><div class="tag">'+esc(t.label)+' results</div><p class="band">'+band+'</p><div class="stars" aria-label="Rating">'+starsOf(sc.tot,g)+'</div><p style="margin:0 0 4px">'+tip+'</p><div class="count">'+Math.round(sc.tot/60*100)+'%, time used '+fmt(S.elapsed)+(S.mode==='practice'?' (practice mode)':'')+'</div><div class="parts">'
   +t.parts.map(function(p){var n=p.to-p.from+1;return '<div class="prow"><span>'+p.no+'. '+esc(p.name)+'</span><div class="meter"><i style="width:'+(sc.per[p.no]/n*100)+'%"></i></div><span>'+sc.per[p.no]+'/'+n+'</span></div>'}).join('')+'</div></div></div>'
   +'<p class="count">Score guide: '+g[0]+'–60 Excellent; '+g[1]+'–'+(g[0]-1)+' Strong; '+g[2]+'–'+(g[1]-1)+' Keep practicing; below '+g[2]+' Review the explanations, then retake the test in a week.</p>';
  var tags={},order=[];t.qlist.forEach(function(q){if(q.part===1){if(!tags[q.tag]){tags[q.tag]=[];order.push(q.tag)}tags[q.tag].push(q)}});
  h+='<div class="skills"><h3>Grammar skills in this test</h3>'+order.map(function(tg){return '<div class="skillrow"><b>'+esc(tg)+'</b><span class="nums">'+tags[tg].map(function(q){return '<span class="'+(S.answers[q.n]===q.ans?'ok':'no')+'">'+q.n+(S.answers[q.n]===q.ans?' ✓':' ✕')+'</span>'}).join('')+'</span><p>'+esc(D.rules[tg]||'')+'</p></div>'}).join('')+'</div>';
  h+='<div class="filters" role="group" aria-label="Filter review"><button class="btn sm" data-filter="all" aria-pressed="'+(filter==='all')+'">All questions</button><button class="btn sm" data-filter="wrong" aria-pressed="'+(filter==='wrong')+'">Only the ones I missed</button><span style="flex:1"></span>'+(nx?'<button class="btn sm" data-act="nexttest" data-id="'+nx.id+'">Next: '+esc(nx.label)+' →</button>':'')+'<button class="btn sm accent" data-act="retake">Retake test</button><button class="btn sm" data-act="home">All tests</button></div>';
  t.parts.forEach(function(p){var bl=p.blocks.map(function(b){var qs=b.qs.filter(function(n){return filter==='all'||S.answers[n]!==t.q[n].ans});if(!qs.length)return '';
    return blockHTML(t,{kind:b.kind,title:b.title,text:b.text,intro:b.intro,label:b.label,visual:b.visual,qs:qs},'review')}).join('');
    if(bl)h+='<div class="partinfo"><h2>Part '+p.no+': '+esc(p.name)+'</h2></div>'+bl});
  if(filter==='wrong'&&sc.tot===60)h+='<div class="confirm"><b>Perfect score.</b> Nothing to review.</div>';
  h+='<div class="foot">© Bright EngMath. Original questions. Single-classroom license. Not affiliated with any school or exam board.</div>';
  app.innerHTML=h;setBarH();if(filter==='all')window.scrollTo(0,0)}

app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-pmin')){var pn=b.closest('.pane'),m=pn.classList.toggle('min');b.textContent=m?'Show':'Hide';b.setAttribute('aria-expanded',!m);return}
  if(b.dataset.o!=null)return answer(+b.dataset.q,+b.dataset.o);
  if(b.dataset.flag){var n=+b.dataset.flag,i=S.flags.indexOf(n);if(i>=0)S.flags.splice(i,1);else S.flags.push(n);save();var el=$('#q'+n);el.classList.toggle('flagged',i<0);b.setAttribute('aria-pressed',i<0);b.textContent=i<0?'Flagged':'Flag';return chrome()}
  if(b.dataset.go){var mp=$('#map');if(mp)mp.hidden=true;var q=S.t.q[+b.dataset.go];if(q.part!==S.part){S.part=q.part;save();testView()}var e2=$('#q'+q.n);if(e2)e2.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b.dataset.part){S.part=+b.dataset.part;S.confirm=false;save();return testView()}
  if(b.dataset.filter)return results(b.dataset.filter);
  var a=b.dataset.act;if(!a)return;
  if(a==='start')return begin(+b.dataset.id,b.dataset.mode,true);
  if(a==='resume'||a==='results')return begin(+b.dataset.id);
  if(a==='home'){save();return home()}
  if(a==='next'){S.part++;S.confirm=false;save();return testView()}
  if(a==='prev'){S.part--;S.confirm=false;save();return testView()}
  if(a==='map'){var m2=$('#map');m2.hidden=!m2.hidden;b.setAttribute('aria-expanded',!m2.hidden);return}
  if(a==='ask'){S.confirm=true;testView();var c=$('.confirm');if(c)c.scrollIntoView({block:'center'});return}
  if(a==='cancel'){S.confirm=false;return testView()}
  if(a==='submit')return submit();
  if(a==='retake')return begin(S.id,S.mode,true);
  if(a==='nexttest')return begin(+b.dataset.id,S.mode,true)});
window.addEventListener('resize',setBarH);window.addEventListener('beforeunload',save);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=$('#map');if(m)m.hidden=true}});
home();
})();
</script>
</body></html>

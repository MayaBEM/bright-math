apital letters at the top of the sign.`,`A prohibition sign tells you what you must NOT do — read the heading first.`,`Rule out option A — the sign never mentions talking or noise.`],hint3EliminateIndex:0,vocabulary:[{term:`prohibition`,meaningEnglish:`a rule that stops you from doing something`,meaningThai:`ข้อห้าม`}],tags:[`signs`,`school-life`,`library`]},{id:`MT1-Q02`,testId:`mock-test-1`,section:`Signs and Notices`,order:2,skill:`Identifying where a notice would appear`,skillTag:`signs`,difficulty:`Foundation`,instruction:`Read the notice. Then choose the best answer.`,stimulus:{type:`notice`,title:`Sports Day Practice`,lines:[`Every Tuesday and Thursday, 3:30–4:30 pm`,`Meet at the school playground`,`Wear sports shoes and bring water`],footer:`See Mr. Somchai if you have questions.`,badge:`This week`},question:`Where would you most likely see this notice?`,options:[`On a school noticeboard`,`On a restaurant menu`,`Inside a public bus`,`On a hospital door`],correctAnswer:0,explanationEnglish:`The notice talks about school sports practice, a teacher's name, and the school playground, so it belongs on a school noticeboard where students can read announcements.`,explanationThai:`ป้ายประกาศพูดถึงการซ้อมกีฬาที่โรงเรียน ชื่อคุณครู และสนามเด็กเล่นของโรงเรียน จึงควรติดไว้ที่บอร์ดประกาศของโรงเรียนที่นักเรียนอ่านได้`,keyClue:`school playground, Mr. Somchai`,optionExplanations:[`Correct — the details (teacher, playground, practice times) are all school-related.`,`There is no food or menu information in the notice.`,`The notice is about sports practice, not bus rules or routes.`,`The notice has nothing to do with health or hospitals.`],hints:[`Notice who the notice is for and what activity it describes.`,`Think about which place naturally has announcements about students, teachers, and school activities.`,`Rule out option D — nothing about health or hospitals is mentioned.`],hint3EliminateIndex:3,tags:[`signs`,`school-life`,`notice`]},{id:`MT1-Q03`,testId:`mock-test-1`,section:`Vocabulary in Context`,order:3,skill:`Choosing the correct everyday vocabulary word`,skillTag:`vocabulary`,difficulty:`Foundation`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`My little sister is only three years old, so she is too ___ to go to school yet.`,options:[`young`,`old`,`tall`,`busy`],correctAnswer:0,explanationEnglish:`A three-year-old child has not reached school age, so "young" is the correct word. "Too young" means "not old enough."`,explanationThai:`เด็กอายุสามขวบยังไม่ถึงวัยที่จะเข้าโรงเรียน จึงใช้คำว่า "young" (เด็ก/อายุน้อย) โครงสร้าง "too young" หมายถึง "ยังไม่โตพอ"`,keyClue:`three years old, too ___ to go to school`,optionExplanations:[`Correct — a three-year-old is not old enough for school, so "too young" fits.`,`"Old" is the opposite meaning; a young child is not "too old" for school.`,`"Tall" describes height, not age or readiness for school.`,`"Busy" describes having things to do, which does not match the sentence.`],hints:[`Focus on the age given in the sentence — three years old.`,`"Too + adjective" often means something is not suitable yet, like being too small or not ready.`,`Rule out option C — height is not related to starting school.`],hint3EliminateIndex:2,vocabulary:[{term:`young`,meaningEnglish:`not old; having lived only a short time`,meaningThai:`อายุน้อย, เด็ก`}],tags:[`vocabulary`,`family`,`age`]},{id:`MT1-Q04`,testId:`mock-test-1`,section:`Vocabulary in Context`,order:4,skill:`Choosing the opposite (antonym) in context`,skillTag:`vocabulary`,difficulty:`Foundation`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`The weather was very hot in the morning, but it became ___ in the evening.`,options:[`sunny`,`cool`,`bright`,`dry`],correctAnswer:1,explanationEnglish:`The word "but" shows a contrast between the morning and the evening weather. Since the morning was hot, the opposite word "cool" fits the evening.`,explanationThai:`คำว่า "but" แสดงถึงความขัดแย้งระหว่างอากาศตอนเช้ากับตอนเย็น เมื่อตอนเช้าร้อน คำตรงข้ามคือ "cool" (เย็นสบาย) จึงเหมาะกับตอนเย็น`,keyClue:`hot ... but ... in the evening`,optionExplanations:[`"Sunny" describes sunlight, not temperature, so it does not contrast with "hot."`,`Correct — "cool" is the opposite of "hot" and fits the contrast word "but."`,`"Bright" describes light, not temperature.`,`"Dry" describes lack of moisture, not a contrast to heat.`],hints:[`Look at the connecting word "but" — it signals a change or contrast.`,`When a sentence contrasts two things with "but," the second idea is often the opposite of the first.`,`Rule out option A — "sunny" describes light, not a temperature contrast to "hot."`],hint3EliminateIndex:0,vocabulary:[{term:`cool`,meaningEnglish:`slightly cold; not hot`,meaningThai:`เย็นสบาย`}],tags:[`vocabulary`,`weather`,`antonyms`]},{id:`MT1-Q05`,testId:`mock-test-1`,section:`Vocabulary in Context`,order:5,skill:`Choosing vocabulary that matches a feeling`,skillTag:`vocabulary`,difficulty:`Foundation`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`Ploy studied very hard for two weeks, so she felt ___ when she passed the test.`,options:[`tired`,`proud`,`angry`,`bored`],correctAnswer:1,explanationEnglish:`Passing a test after studying hard is a good result, so the natural feeling is "proud" — feeling pleased about your own achievement.`,explanationThai:`การสอบผ่านหลังจากตั้งใจอ่านหนังสือมาสองสัปดาห์เป็นผลลัพธ์ที่ดี ความรู้สึกที่เหมาะสมคือ "proud" (ภูมิใจ) ซึ่งหมายถึงรู้สึกดีกับความสำเร็จของตนเอง`,keyClue:`studied hard ... passed the test`,optionExplanations:[`"Tired" could describe studying itself, but it does not match the happy result of passing.`,`Correct — passing a test after hard work naturally makes someone feel proud.`,`"Angry" does not fit a positive result like passing a test.`,`"Bored" does not match the excitement of a good result.`],hints:[`Think about how someone usually feels after succeeding at something they worked hard for.`,`Positive results like passing a test usually connect to positive feeling words.`,`Rule out option C — "angry" does not match a good result.`],hint3EliminateIndex:2,vocabulary:[{term:`proud`,meaningEnglish:`feeling pleased about an achievement`,meaningThai:`ภูมิใจ`}],tags:[`vocabulary`,`feelings`,`school-life`]},{id:`MT1-Q06`,testId:`mock-test-1`,section:`Grammar and Usage`,order:6,skill:`Present simple for daily routines`,skillTag:`grammar`,difficulty:`Foundation`,instruction:`Choose the correct word to complete the sentence.`,stimulus:{type:`none`},question:`Every morning, my father ___ to work by car.`,options:[`go`,`going`,`gone`,`goes`],correctAnswer:3,explanationEnglish:`With the subject "my father" (he/she/it), present simple verbs add -s: "goes." The phrase "every morning" signals a routine, which uses present simple.`,explanationThai:`ประธาน "my father" เทียบเท่ากับ he/she/it กริยาในรูป present simple จึงต้องเติม -s เป็น "goes" คำว่า "every morning" บ่งบอกถึงกิจวัตรประจำ ซึ่งใช้ present simple`,keyClue:`Every morning, my father`,optionExplanations:[`"Go" is missing the -s needed for a third-person singular subject like "my father."`,`"Going" needs a helping verb like "is" to be grammatical here.`,`"Gone" is a past participle and needs "has" before it, which is not present here.`,`Correct — "goes" matches the third-person singular subject with present simple.`],hints:[`Look at the subject "my father" — it means he/she/it.`,`In present simple, verbs after he/she/it usually end in -s.`,`Rule out option B — "going" alone cannot follow a subject without a helping verb like "is."`],hint3EliminateIndex:1,grammarRule:`Present simple: add -s/-es to the verb after he/she/it subjects for routines and habits.`,tags:[`grammar`,`present-simple`,`routines`]},{id:`MT1-Q07`,testId:`mock-test-1`,section:`Grammar and Usage`,order:7,skill:`Present continuous for actions happening now`,skillTag:`grammar`,difficulty:`Foundation`,instruction:`Choose the correct word to complete the sentence.`,stimulus:{type:`none`},question:`Look! The children ___ football in the park right now.`,options:[`play`,`plays`,`are playing`,`played`],correctAnswer:2,explanationEnglish:`The words "Look!" and "right now" show the action is happening at this exact moment, so present continuous (am/is/are + verb-ing) is needed: "are playing."`,explanationThai:`คำว่า "Look!" และ "right now" แสดงว่าเหตุการณ์กำลังเกิดขึ้นในขณะนี้ จึงต้องใช้ present continuous (am/is/are + verb-ing) คือ "are playing"`,keyClue:`Look! ... right now`,optionExplanations:[`"Play" (present simple) does not show an action happening at this exact moment.`,`"Plays" is for he/she/it and also does not show a right-now action.`,`Correct — "are playing" (present continuous) matches "right now" with the plural subject "the children."`,`"Played" is past tense, but the action is happening now, not in the past.`],hints:[`Notice the signal words "Look!" and "right now."`,`Actions happening at this exact moment use am/is/are + verb-ing.`,`Rule out option D — the action is happening now, not in the past.`],hint3EliminateIndex:3,grammarRule:`Present continuous (am/is/are + verb-ing) describes actions happening at the moment of speaking.`,tags:[`grammar`,`present-continuous`,`signal-words`]},{id:`MT1-Q08`,testId:`mock-test-1`,section:`Grammar and Usage`,order:8,skill:`Past simple with a time marker`,skillTag:`grammar`,difficulty:`Foundation`,instruction:`Choose the correct word to complete the sentence.`,stimulus:{type:`none`},question:`We ___ to the zoo last Sunday with our grandparents.`,options:[`go`,`goes`,`went`,`going`],correctAnswer:2,explanationEnglish:`"Last Sunday" shows the action finished in the past, so the past simple form of "go," which is "went," is needed.`,explanationThai:`คำว่า "last Sunday" แสดงว่าเหตุการณ์จบลงไปแล้วในอดีต จึงต้องใช้ past simple ของ "go" ซึ่งคือ "went"`,keyClue:`last Sunday`,optionExplanations:[`"Go" is present simple, but "last Sunday" needs a past tense verb.`,`"Goes" is also present simple and does not match a past time marker.`,`Correct — "went" is the irregular past simple form of "go," matching "last Sunday."`,`"Going" needs a helping verb and does not show past time on its own.`],hints:[`Find the time expression that tells you when this happened.`,`Past time markers like "last Sunday" need a past simple verb.`,`Rule out option A — "go" is present tense, not past.`],hint3EliminateIndex:0,grammarRule:`Past simple describes finished actions; "go" has the irregular past form "went."`,tags:[`grammar`,`past-simple`,`irregular-verbs`]},{id:`MT1-Q09`,testId:`mock-test-1`,section:`Grammar and Usage`,order:9,skill:`Comparative adjectives`,skillTag:`grammar`,difficulty:`Foundation`,instruction:`Choose the correct word to complete the sentence.`,stimulus:{type:`none`},question:`This backpack is ___ than that one, so I will buy this one.`,options:[`cheap`,`cheapest`,`more cheap`,`cheaper`],correctAnswer:3,explanationEnglish:`When comparing two things with "than," short adjectives like "cheap" add -er to become "cheaper." This is the comparative form.`,explanationThai:`เมื่อเปรียบเทียบสิ่งของสองอย่างด้วยคำว่า "than" คำคุณศัพท์สั้น เช่น "cheap" จะเติม -er เป็น "cheaper" ซึ่งเป็นรูปเปรียบเทียบขั้นกว่า`,keyClue:`than that one`,optionExplanations:[`"Cheap" is the base form and cannot be used directly before "than."`,`"Cheapest" is the superlative form, used for comparing three or more items, not with "than."`,`"More cheap" is incorrect because short adjectives use -er, not "more."`,`Correct — "cheaper" is the comparative form used with "than" to compare two items.`],hints:[`Notice the word "than," which signals a comparison between two things.`,`Short adjectives (one syllable, like "cheap") usually add -er for comparisons.`,`Rule out option B — "cheapest" is for comparing three or more things, not used with "than."`],hint3EliminateIndex:1,grammarRule:`Comparative adjectives compare two things and are often followed by "than" (e.g., cheap → cheaper).`,tags:[`grammar`,`comparatives`,`adjectives`]},{id:`MT1-Q10`,testId:`mock-test-1`,section:`Grammar and Usage`,order:10,skill:`Articles a/an/the`,skillTag:`grammar`,difficulty:`Foundation`,instruction:`Choose the correct word to complete the sentence.`,stimulus:{type:`none`},question:`I saw ___ elephant at the zoo yesterday. The elephant was very big.`,options:[`a`,`an`,`the`,`no article needed`],correctAnswer:1,explanationEnglish:`The word "elephant" starts with a vowel sound, so it needs "an" instead of "a." Since this is the first time it is mentioned, "the" would not be correct here.`,explanationThai:`คำว่า "elephant" ขึ้นต้นด้วยเสียงสระ จึงต้องใช้ "an" แทน "a" และเนื่องจากเป็นการกล่าวถึงครั้งแรก จึงยังไม่ใช้ "the" ในตำแหน่งนี้`,keyClue:`elephant (vowel sound)`,optionExplanations:[`"A" is used before consonant sounds, but "elephant" begins with a vowel sound.`,`Correct — "an" is used before words that begin with a vowel sound, like "elephant."`,`"The" is used for something already known or mentioned before, but this is the first mention.`,`An article is needed here because "elephant" is a singular countable noun.`],hints:[`Listen to the first sound of the word "elephant."`,`"A" is used before consonant sounds; "an" is used before vowel sounds.`,`Rule out option C — "the" is for things already mentioned, and this is the first mention.`],hint3EliminateIndex:2,grammarRule:`Use "an" before words that begin with a vowel sound (a, e, i, o, u).`,tags:[`grammar`,`articles`,`nouns`]},{id:`MT1-Q11`,testId:`mock-test-1`,section:`Grammar and Usage`,order:11,skill:`Prepositions of place`,skillTag:`grammar`,difficulty:`Foundation`,instruction:`Choose the correct word to complete the sentence.`,stimulus:{type:`none`},question:`The cat is sleeping ___ the box, not inside it.`,options:[`in`,`under`,`on`,`into`],correctAnswer:2,explanationEnglish:`The sentence contrasts the cat's position with "inside" the box, so the cat must be resting "on" the top surface of the box.`,explanationThai:`ประโยคนี้เปรียบเทียบตำแหน่งของแมวกับคำว่า "inside" (ข้างใน) ดังนั้นแมวจึงต้องนอนอยู่ "on" คือบนพื้นผิวด้านบนของกล่อง`,keyClue:`not inside it`,optionExplanations:[`"In" means inside, which contradicts "not inside it" in the sentence.`,`"Under" means below the box, which is not supported by the sentence.`,`Correct — "on" shows the cat is resting on top of the box, contrasted with being inside.`,`"Into" shows movement inside something, which contradicts "not inside it."`],hints:[`Read the second part of the sentence carefully — it tells you where the cat is NOT.`,`Prepositions of place describe exact positions like on top of, inside, below, or beside.`,`Rule out option A — "in" means inside, which the sentence says is wrong.`],hint3EliminateIndex:0,grammarRule:`Prepositions of place (in, on, under) describe exact positions of objects.`,tags:[`grammar`,`prepositions`,`position`]},{id:`MT1-Q12`,testId:`mock-test-1`,section:`Everyday Conversation`,order:12,skill:`Responding to an introduction`,skillTag:`conversation`,difficulty:`Foundation`,instruction:`Read the dialogue. Choose the best line to complete it.`,stimulus:{type:`dialogue`,setting:`First day of school`,lines:[{speaker:`Anan`,text:`Hi, I'm Anan. I'm new here.`},{speaker:`Malee`,text:`___`}]},question:`What is the best way for Malee to reply?`,options:[`Nice to meet you, Anan. I'm Malee.`,`Goodbye, see you later.`,`I don't know you.`,`Where is the bathroom?`],correctAnswer:0,explanationEnglish:`When someone introduces themselves, the polite and natural reply is to greet them back and share your own name, like "Nice to meet you."`,explanationThai:`เมื่อมีคนแนะนำตัวเอง คำตอบที่สุภาพและเป็นธรรมชาติคือการทักทายกลับและบอกชื่อของตัวเอง เช่น "Nice to meet you"`,keyClue:`I'm new here.`,optionExplanations:[`Correct — this is a friendly, natural response to a first introduction.`,`"Goodbye" does not make sense right after someone has just introduced themselves.`,`This reply is impolite and does not fit a friendly first meeting.`,`This question is unrelated to being introduced to someone new.`],hints:[`Think about what Anan just did — he told his name for the first time.`,`A polite reply to an introduction usually includes a greeting and your own name.`,`Rule out option C — it sounds unfriendly and does not match a first meeting.`],hint3EliminateIndex:2,tags:[`conversation`,`greetings`,`school-life`]},{id:`MT1-Q13`,testId:`mock-test-1`,section:`Everyday Conversation`,order:13,skill:`Asking for help politely`,skillTag:`conversation`,difficulty:`Foundation`,instruction:`Read the dialogue. Choose the best line to complete it.`,stimulus:{type:`dialogue`,setting:`In a classroom`,lines:[{speaker:`Nok`,text:`Excuse me, ___?`},{speaker:`Teacher`,text:`Of course, here you are.`}]},question:`What did Nok most likely say to the teacher?`,options:[`can you close the window`,`why are you here`,`do you like ice cream`,`could you help me with this question`],correctAnswer:3,explanationEnglish:`The teacher's reply "Of course, here you are" shows she is giving or helping with something, so Nok must have politely asked for help, like "could you help me with this question."`,explanationThai:`คำตอบของครูที่ว่า "Of course, here you are" แสดงว่าครูกำลังให้ความช่วยเหลือ ดังนั้นนกน่าจะขอความช่วยเหลืออย่างสุภาพ เช่น "could you help me with this question"`,keyClue:`Of course, here you are.`,optionExplanations:[`This request about a window does not match "here you are," which suggests handing something over.`,`This is a strange or rude question that does not fit "Of course, here you are."`,`This question about ice cream does not connect logically to the teacher's reply.`,`Correct — asking for help fits the teacher's response of giving assistance.`],hints:[`Look closely at the teacher's reply — it sounds like she is handing something over or agreeing to help.`,`"Could you...?" is a polite way to ask someone for help or a favor.`,`Rule out option B — it does not fit a helpful reply like "Of course, here you are."`],hint3EliminateIndex:1,tags:[`conversation`,`requests`,`school-life`]},{id:`MT1-Q14`,testId:`mock-test-1`,section:`Everyday Conversation`,order:14,skill:`Choosing a polite way to thank someone`,skillTag:`conversation`,difficulty:`Foundation`,instruction:`Choose the best response for the situation.`,stimulus:{type:`none`},question:`Your friend lends you her pencil. What should you say?`,options:[`Thank you very much.`,`It is not mine.`,`I don't need it.`,`Give it back now.`],correctAnswer:0,explanationEnglish:`When someone does something kind for you, like lending an item, the polite and expected response is to thank them.`,explanationThai:`เมื่อมีคนทำสิ่งดีๆ ให้เรา เช่น ให้ยืมของ คำตอบที่สุภาพและเหมาะสมคือการกล่าวขอบคุณ`,keyClue:`lends you her pencil`,optionExplanations:[`Correct — thanking someone is the polite response after receiving help or a favor.`,`This response does not make sense; it ignores the kindness shown.`,`This response is impolite and rejects the friend's kindness.`,`This is a rude, demanding response that does not fit the situation.`],hints:[`Think about what your friend just did for you.`,`A kind action, like lending something, usually deserves a polite thank-you.`,`Rule out option D — it sounds rude and does not match a kind gesture.`],hint3EliminateIndex:3,tags:[`conversation`,`politeness`,`school-life`]},{id:`MT1-Q15`,testId:`mock-test-1`,section:`Everyday Conversation`,order:15,skill:`Responding to a simple invitation`,skillTag:`conversation`,difficulty:`Foundation`,instruction:`Read the dialogue. Choose the best line to complete it.`,stimulus:{type:`dialogue`,setting:`On the phone`,lines:[{speaker:`Ploy`,text:`Do you want to come to my birthday party on Saturday?`},{speaker:`Tam`,text:`___`}]},question:`Which is the best reply for Tam to accept the invitation?`,options:[`I have never been to a party.`,`Sure, I would love to come!`,`Saturday is a weekend day.`,`No, I am your friend.`],correctAnswer:1,explanationEnglish:`To accept an invitation naturally, the best response shows enthusiasm and agreement, like "Sure, I would love to come!"`,explanationThai:`การตอบรับคำเชิญอย่างเป็นธรรมชาติ ควรแสดงความยินดีและตกลง เช่น "Sure, I would love to come!"`,keyClue:`Do you want to come...?`,optionExplanations:[`This statement is unrelated and does not answer the invitation.`,`Correct — this shows clear, enthusiastic acceptance of the invitation.`,`This is just a fact about the day and does not answer whether Tam will come.`,`This response is confusing and does not properly accept or decline the invitation.`],hints:[`Think about how someone happily agrees to an invitation.`,`A good reply to an invitation clearly says yes or no, often with a reason or feeling.`,`Rule out option A — it does not actually answer the invitation.`],hint3EliminateIndex:0,tags:[`conversation`,`invitations`,`birthday`]},{id:`MT1-Q16`,testId:`mock-test-1`,section:`Cloze Dialogue or Short Message`,order:16,skill:`Completing a text message with the correct word`,skillTag:`conversation`,difficulty:`Foundation`,instruction:`Read the text message below. Choose the best word for blank (1).`,stimulus:{type:`message`,channel:`text`,from:`Mai`,to:`Fon`,body:[`Hi Fon! Are you free (1) ___ Saturday afternoon?`,`I want to go to the park and ride bikes.`,`Let me know if you can (2) ___ me!`,`See you (3) ___ 3 pm at the park gate.`]},question:`Which word best completes blank (1): "Are you free (1) ___ Saturday afternoon?"`,options:[`on`,`at`,`in`,`to`],correctAnswer:0,explanationEnglish:`We use the preposition "on" with specific days, like "on Saturday." This is a common time preposition rule.`,explanationThai:`เราใช้คำบุพบท "on" กับวันที่เจาะจง เช่น "on Saturday" เป็นกฎการใช้คำบุพบทเกี่ยวกับเวลาที่พบบ่อย`,keyClue:`Saturday afternoon`,optionExplanations:[`Correct — "on" is used before specific days such as Saturday.`,`"At" is used for exact clock times, like "at 3 pm," not for days.`,`"In" is used for longer periods like months or years, not specific days.`,`"To" shows direction or movement and does not fit before a day name.`],hints:[`Look at the word right after the blank — it is a day of the week.`,`Days of the week usually pair with the preposition "on."`,`Rule out option D — "to" shows direction, not a day of the week.`],hint3EliminateIndex:3,grammarRule:`Use "on" with days and dates (on Saturday, on May 5th).`,tags:[`grammar`,`prepositions`,`messages`]},{id:`MT1-Q17`,testId:`mock-test-1`,section:`Cloze Dialogue or Short Message`,order:17,skill:`Completing a text message with the correct word`,skillTag:`conversation`,difficulty:`Foundation`,instruction:`Read the same text message again. Choose the best word for blank (2).`,stimulus:{type:`message`,channel:`text`,from:`Mai`,to:`Fon`,body:[`Hi Fon! Are you free (1) ___ Saturday afternoon?`,`I want to go to the park and ride bikes.`,`Let me know if you can (2) ___ me!`,`See you (3) ___ 3 pm at the park gate.`]},question:`Which word best completes blank (2): "Let me know if you can (2) ___ me!"`,options:[`join`,`joins`,`joined`,`joining`],correctAnswer:0,explanationEnglish:`After the modal verb "can," we always use the base form of the verb, without -s, -ed, or -ing. So "can join" is correct.`,explanationThai:`หลังคำกริยาช่วย "can" ต้องใช้กริยารูปพื้นฐานเสมอ ไม่เติม -s, -ed หรือ -ing ดังนั้น "can join" จึงถูกต้อง`,keyClue:`if you can ___ me`,optionExplanations:[`Correct — "can" is followed by the base form of the verb, "join."`,`"Joins" adds -s, but modal verbs like "can" never take an -s verb after them.`,`"Joined" is past tense, which cannot follow "can."`,`"Joining" is the -ing form, which cannot follow "can" directly.`],hints:[`Look at the small helping word right before the blank.`,`Modal verbs such as can, will, and must are always followed by the base form of a verb.`,`Rule out option C — past tense verbs never follow "can."`],hint3EliminateIndex:2,grammarRule:`Modal verbs (can, will, must) are followed by the base form of the verb.`,tags:[`grammar`,`modal-verbs`,`messages`]},{id:`MT1-Q18`,testId:`mock-test-1`,section:`Cloze Dialogue or Short Message`,order:18,skill:`Completing a text message with the correct word`,skillTag:`conversation`,difficulty:`Foundation`,instruction:`Read the same text message again. Choose the best word for blank (3).`,stimulus:{type:`message`,channel:`text`,from:`Mai`,to:`Fon`,body:[`Hi Fon! Are you free (1) ___ Saturday afternoon?`,`I want to go to the park and ride bikes.`,`Let me know if you can (2) ___ me!`,`See you (3) ___ 3 pm at the park gate.`]},question:`Which word best completes blank (3): "See you (3) ___ 3 pm at the park gate."`,options:[`on`,`in`,`at`,`from`],correctAnswer:2,explanationEnglish:`We use the preposition "at" with exact clock times, such as "at 3 pm." This is different from "on," which is used with days.`,explanationThai:`เราใช้คำบุพบท "at" กับเวลาที่เจาะจงบนนาฬิกา เช่น "at 3 pm" ซึ่งต่างจาก "on" ที่ใช้กับวัน`,keyClue:`3 pm`,optionExplanations:[`"On" is used for days, not exact clock times.`,`"In" is used for longer periods like months or years, not exact clock times.`,`Correct — "at" is used with exact clock times such as "at 3 pm."`,`"From" shows a starting point, not a specific point in time like "3 pm."`],hints:[`Look at what follows the blank — it is a specific clock time.`,`Exact clock times usually pair with the preposition "at."`,`Rule out option B — "in" is for longer time periods, not exact clock times.`],hint3EliminateIndex:1,grammarRule:`Use "at" with exact clock times (at 3 pm, at noon).`,tags:[`grammar`,`prepositions`,`messages`]},{id:`MT1-Q19`,testId:`mock-test-1`,section:`Reading Comprehension`,order:19,skill:`Finding the main idea of a passage`,skillTag:`reading`,difficulty:`Foundation`,instruction:`Read the passage. Then answer the question.`,stimulus:{type:`passage`,title:`A Trip to the Farm`,paragraphs:[`Last month, my class went on a trip to a farm outside the city. We arrived early in the morning and met the farmer, Mr. Wichai. He showed us the cows, chickens, and pigs, and taught us how to feed them.`,`After lunch, we picked fresh vegetables from the garden, like tomatoes and corn. My friends and I were tired but very happy. We learned that growing food takes a lot of hard work every day.`,`Before we left, Mr. Wichai gave each student a small bag of vegetables to take home. It was one of the best school trips I have ever had.`],wordCount:108},question:`What is this passage mainly about?`,options:[`A student who wants to become a farmer`,`How to cook vegetables from a garden`,`A comparison between city life and farm life`,`A class trip to a farm and what they learned`],correctAnswer:3,explanationEnglish:`The passage describes a class trip to a farm, the animals and vegetables the students saw, and what they learned about farm work, so the main idea is about the trip and what happened during it.`,explanationThai:`เนื้อเรื่องเล่าถึงการไปทัศนศึกษาที่ฟาร์มของนักเรียน สัตว์และผักที่พวกเขาเห็น และสิ่งที่ได้เรียนรู้เกี่ยวกับงานฟาร์ม ใจความหลักจึงเป็นเรื่องการไปทัศนศึกษาและสิ่งที่เกิดขึ้นระหว่างทริป`,keyClue:`went on a trip to a farm`,optionExplanations:[`The passage does not say the student wants to become a farmer; it just describes the trip.`,`Cooking is never mentioned; the passage only talks about picking vegetables.`,`The passage does not compare city and farm life directly.`,`Correct — the whole passage focuses on the class trip and the experiences/lessons from it.`],hints:[`Think about what happens from the beginning to the end of the passage.`,`The main idea is usually the overall event the whole passage describes, not just one small detail.`,`Rule out option B — cooking is never mentioned in the passage.`],hint3EliminateIndex:1,tags:[`reading`,`main-idea`,`farm`]},{id:`MT1-Q20`,testId:`mock-test-1`,section:`Reading Comprehension`,order:20,skill:`Finding a supporting detail in a passage`,skillTag:`reading`,difficulty:`Foundation`,instruction:`Read the passage again. Then answer the question.`,stimulus:{type:`passage`,title:`A Trip to the Farm`,paragraphs:[`Last month, my class went on a trip to a farm outside the city. We arrived early in the morning and met the farmer, Mr. Wichai. He showed us the cows, chickens, and pigs, and taught us how to feed them.`,`After lunch, we picked fresh vegetables from the garden, like tomatoes and corn. My friends and I were tired but very happy. We learned that growing food takes a lot of hard work every day.`,`Before we left, Mr. Wichai gave each student a small bag of vegetables to take home. It was one of the best school trips I have ever had.`],wordCount:108},question:`What did the students do after lunch?`,options:[`They fed the cows and chickens`,`They picked fresh vegetables from the garden`,`They rode a bus back to school`,`They cooked lunch with Mr. Wichai`],correctAnswer:1,explanationEnglish:`The passage clearly states "After lunch, we picked fresh vegetables from the garden," which directly answers the question.`,explanationThai:`เนื้อเรื่องระบุชัดเจนว่า "After lunch, we picked fresh vegetables from the garden" ซึ่งตอบคำถามได้โดยตรง`,keyClue:`After lunch, we picked fresh vegetables`,optionExplanations:[`Feeding the animals happened earlier in the morning, before lunch, not after.`,`Correct — the passage directly states this activity happened after lunch.`,`The passage never mentions a bus ride back to school.`,`The passage never mentions cooking lunch with the farmer.`],hints:[`Search the second paragraph for the phrase "After lunch."`,`Supporting details are facts stated directly in the text — look for the exact matching sentence.`,`Rule out option A — feeding animals happened in the morning, not after lunch.`],hint3EliminateIndex:0,tags:[`reading`,`detail`,`farm`]},{id:`MT1-Q21`,testId:`mock-test-1`,section:`Reading Comprehension`,order:21,skill:`Understanding vocabulary in context within a passage`,skillTag:`reading`,difficulty:`Foundation`,instruction:`Read the passage again. Then answer the question.`,stimulus:{type:`passage`,title:`A Trip to the Farm`,paragraphs:[`Last month, my class went on a trip to a farm outside the city. We arrived early in the morning and met the farmer, Mr. Wichai. He showed us the cows, chickens, and pigs, and taught us how to feed them.`,`After lunch, we picked fresh vegetables from the garden, like tomatoes and corn. My friends and I were tired but very happy. We learned that growing food takes a lot of hard work every day.`,`Before we left, Mr. Wichai gave each student a small bag of vegetables to take home. It was one of the best school trips I have ever had.`],wordCount:108},question:`In the sentence "My friends and I were tired but very happy," what does the word "tired" mean?`,options:[`Excited and full of energy`,`Angry about the trip`,`Confused about what to do`,`Needing rest because of hard work`],correctAnswer:3,explanationEnglish:`"Tired" describes feeling low on energy, usually after physical effort. The passage explains the students had been working hard picking vegetables, which caused this feeling.`,explanationThai:`"Tired" หมายถึงความรู้สึกอ่อนเพลีย ไม่มีแรง มักเกิดขึ้นหลังจากออกแรงทำงาน เนื้อเรื่องอธิบายว่านักเรียนทำงานหนักในการเก็บผัก จึงทำให้รู้สึกเหนื่อย`,keyClue:`tired but very happy`,optionExplanations:[`This is the opposite meaning of "tired," which describes low, not high, energy.`,`"Angry" is not supported anywhere in the passage; the students felt happy, not angry.`,`"Confused" does not match the context of physical work and needing rest.`,`Correct — "tired" means needing rest, which matches the hard work of picking vegetables.`],hints:[`Think about what the students had just finished doing before this sentence.`,`Words describing feelings after physical activity often relate to energy levels.`,`Rule out option A — it means the opposite of what "tired" means.`],hint3EliminateIndex:0,vocabulary:[{term:`tired`,meaningEnglish:`needing rest; having little energy`,meaningThai:`เหนื่อย, อ่อนเพลีย`}],tags:[`reading`,`vocabulary-in-context`,`farm`]},{id:`MT1-Q22`,testId:`mock-test-1`,section:`Reading Comprehension`,order:22,skill:`Making a simple inference from a passage`,skillTag:`reading`,difficulty:`Foundation`,instruction:`Read the passage again. Then answer the question.`,stimulus:{type:`passage`,title:`A Trip to the Farm`,paragraphs:[`Last month, my class went on a trip to a farm outside the city. We arrived early in the morning and met the farmer, Mr. Wichai. He showed us the cows, chickens, and pigs, and taught us how to feed them.`,`After lunch, we picked fresh vegetables from the garden, like tomatoes and corn. My friends and I were tired but very happy. We learned that growing food takes a lot of hard work every day.`,`Before we left, Mr. Wichai gave each student a small bag of vegetables to take home. It was one of the best school trips I have ever had.`],wordCount:108},question:`Based on the passage, how did the writer most likely feel about the trip overall?`,options:[`The writer disliked the trip and wanted to go home early`,`The writer thought the trip was boring and unimportant`,`The writer enjoyed the trip and found it meaningful`,`The writer was scared of the farm animals`],correctAnswer:2,explanationEnglish:`The passage says the students were "very happy" and calls it "one of the best school trips," which shows the writer enjoyed the trip and found it a meaningful experience.`,explanationThai:`เนื้อเรื่องบอกว่านักเรียน "very happy" และเรียกทริปนี้ว่า "one of the best school trips" แสดงว่าผู้เขียนสนุกกับทริปนี้และรู้สึกว่ามันมีความหมาย`,keyClue:`one of the best school trips I have ever had`,optionExplanations:[`Nothing in the passage suggests the writer disliked the trip or wanted to leave early.`,`The passage says the opposite — the writer describes it very positively, not as boring.`,`Correct — phrases like "very happy" and "one of the best trips" show enjoyment and meaning.`,`There is no mention of fear; the students happily fed and learned about the animals.`],hints:[`Look at the last sentence of the passage for a strong clue about the writer's feelings.`,`An inference means using clues in the text to figure out something not directly stated as a single fact.`,`Rule out option D — nothing in the passage mentions fear of the animals.`],hint3EliminateIndex:3,tags:[`reading`,`inference`,`farm`]},{id:`MT1-Q23`,testId:`mock-test-1`,section:`Functional Language and Error Recognition`,order:23,skill:`Choosing the grammatically correct sentence`,skillTag:`functional`,difficulty:`Foundation`,instruction:`Choose the sentence that is grammatically correct.`,stimulus:{type:`none`},question:`Which sentence is correct?`,options:[`She have two brothers and one sister.`,`She has two brothers and one sister.`,`She having two brothers and one sister.`,`She to have two brothers and one sister.`],correctAnswer:1,explanationEnglish:`With the subject "she" (he/she/it), the present simple verb "have" changes to "has." This subject-verb agreement rule applies to all present simple sentences.`,explanationThai:`เมื่อประธานคือ "she" (เทียบเท่า he/she/it) กริยา "have" ในรูป present simple ต้องเปลี่ยนเป็น "has" กฎความสอดคล้องระหว่างประธานกับกริยานี้ใช้กับประโยค present simple ทั้งหมด`,keyClue:`She ___ two brothers`,optionExplanations:[`"Have" is incorrect with "she"; it must change to "has" for third-person singular subjects.`,`Correct — "has" correctly agrees with the third-person singular subject "she."`,`"Having" cannot stand alone as the main verb without a helping verb like "is."`,`"To have" is the infinitive form and cannot be used directly as the main verb here.`],hints:[`Look closely at the subject of the sentence — "she."`,`Remember that he/she/it subjects need an -s or -es ending on present simple verbs.`,`Rule out option D — "to have" is an infinitive and cannot be the main verb of this sentence.`],hint3EliminateIndex:3,grammarRule:`Subject-verb agreement: he/she/it subjects use "has" instead of "have" in present simple.`,tags:[`grammar`,`subject-verb-agreement`,`error-recognition`]},{id:`MT1-Q24`,testId:`mock-test-1`,section:`Functional Language and Error Recognition`,order:24,skill:`Choosing the correct plural noun form`,skillTag:`functional`,difficulty:`Foundation`,instruction:`Choose the sentence that is grammatically correct.`,stimulus:{type:`none`},question:`Which sentence is correct?`,options:[`There are three childs playing outside.`,`There are three childrens playing outside.`,`There are three children playing outside.`,`There are three child playing outside.`],correctAnswer:2,explanationEnglish:`"Child" is an irregular noun, so its plural form does not simply add -s. The correct irregular plural is "children," with no extra -s added.`,explanationThai:`"Child" เป็นคำนามอปกติ (irregular noun) รูปพหูพจน์จึงไม่ได้เติม -s ตรงๆ รูปพหูพจน์ที่ถูกต้องคือ "children" โดยไม่มีการเติม -s เพิ่มอีก`,keyClue:`three ___ playing outside`,optionExplanations:[`"Childs" is incorrect; "child" does not follow the regular -s plural pattern.`,`"Childrens" incorrectly adds an extra -s to the already-plural word "children."`,`Correct — "children" is the correct irregular plural form of "child."`,`"Child" is singular, but "three" requires a plural noun.`],hints:[`Look at the number word "three" — it tells you the noun should be plural.`,`Some nouns, like "child," have irregular plural forms that do not just add -s.`,`Rule out option D — "child" is singular and cannot follow the number "three."`],hint3EliminateIndex:3,grammarRule:`Irregular plural nouns do not follow the regular -s rule (e.g., child → children).`,tags:[`grammar`,`plurals`,`error-recognition`]},{id:`MT1-Q25`,testId:`mock-test-1`,section:`Functional Language and Error Recognition`,order:25,skill:`Choosing the best natural response in a situation`,skillTag:`functional`,difficulty:`Foundation`,instruction:`Choose the best response for the situation.`,stimulus:{type:`none`},question:`Someone says "I'm sorry I broke your pencil." What is the best reply?`,options:[`That's okay, don't worry about it.`,`You must pay me one hundred baht.`,`I don't have a pencil.`,`Why did you break it on purpose?`],correctAnswer:0,explanationEnglish:`When someone apologizes politely for a small accident, the natural and kind response is to accept the apology, such as "That's okay, don't worry about it."`,explanationThai:`เมื่อมีคนขอโทษอย่างสุภาพสำหรับอุบัติเหตุเล็กน้อย คำตอบที่เป็นธรรมชาติและใจดีคือการรับคำขอโทษ เช่น "That's okay, don't worry about it"`,keyClue:`I'm sorry I broke your pencil.`,optionExplanations:[`Correct — accepting an apology kindly is the natural, expected response.`,`This response is too harsh for a small accident like a broken pencil.`,`This does not make sense; the speaker already said they broke your pencil.`,`This assumes it was done on purpose, which is unfair since the person apologized.`],hints:[`Think about how a kind person usually responds to someone saying sorry.`,`A good reply to an apology usually shows understanding and forgiveness, not anger.`,`Rule out option B — demanding money is too harsh a reaction for an apology about a pencil.`],hint3EliminateIndex:1,tags:[`functional`,`apologies`,`politeness`]}],wh={type:`passage`,title:`Email: Bright Star School Book Fair`,paragraphs:[`Dear Parents and Students,`,`We are excited to announce that our annual Book Fair will take place in the school hall from Monday, 14 September to Friday, 18 September. This year, the fair will feature more than two thousand books, including comics, novels, and educational guides for every age group. Local authors will also visit on Wednesday afternoon to talk about their work and sign copies of their books.`,`Students who wish to buy books should bring cash, as the fair does not accept cards this year. Teachers will guide each class to the hall during their scheduled reading period, so students do not need to miss any other lessons. All profits from the fair will go toward buying new furniture for our library, which badly needs repair after many years of heavy use.`,`We hope to see many of you there!`,`Mrs. Preecha, Head of Library`],wordCount:147},Th={type:`message`,channel:`text`,from:`Mom`,to:`Ploy`,body:[`Hi Ploy,`,`I ______ be home late tonight because of a meeting, so please start dinner without me if needed.`,`Please ______ your brother do his homework before dinner.`,`There ______ some fruit in the fridge if you get hungry.`,`Love, Mom`]},Eh=[{id:`MT2-Q01`,testId:`mock-test-2`,section:`Signs and Notices`,order:1,skill:`Understanding a safety sign's instruction`,skillTag:`signs`,difficulty:`Standard`,instruction:`Read the sign and choose the best answer.`,stimulus:{type:`sign`,heading:`MIND THE GAP`,body:`Please stand behind the yellow line until the train stops completely.`,tone:`safety`,location:`Train platform`,icon:`caution`},question:`What are passengers asked to do?`,options:[`Wait inside the train doors`,`Get on the train before it stops`,`Stand behind the yellow line until the train stops`,`Walk quickly across the platform`],correctAnswer:2,explanationEnglish:`Safety signs at train platforms often tell passengers to keep a safe distance from the edge until it is safe to board. The key instruction is in the body text, which tells passengers exactly what to do and when.`,explanationThai:`ป้ายเตือนความปลอดภัยที่ชานชาลารถไฟมักบอกให้ผู้โดยสารยืนห่างจากขอบชานชาลาจนกว่ารถไฟจะจอดสนิท คำตอบที่ถูกต้องต้องตรงกับข้อความในป้ายเป๊ะๆ`,keyClue:`stand behind the yellow line until the train stops completely`,optionExplanations:[`Wrong — the sign talks about waiting on the platform, not standing inside train doors.`,`Wrong — the sign says to wait, not to board before the train stops; that would be dangerous.`,`Correct — matches the instruction "stand behind the yellow line until the train stops completely."`,`Wrong — the sign does not mention walking quickly; it asks for waiting safely.`],hints:[`Look at the exact words written under the heading.`,`Safety signs tell you what action to take and when it is safe to do it.`,`This is not about walking — the sign says nothing about walking quickly.`],hint3EliminateIndex:3,vocabulary:[{term:`platform`,meaningEnglish:`the raised area beside the tracks where passengers wait for a train`,meaningThai:`ชานชาลา`}],tags:[`signs`,`safety`,`transportation`]},{id:`MT2-Q02`,testId:`mock-test-2`,section:`Signs and Notices`,order:2,skill:`Finding a specific detail in a community notice`,skillTag:`signs`,difficulty:`Standard`,instruction:`Read the notice and choose the best answer.`,stimulus:{type:`notice`,title:`Central Park Clean-Up Day`,lines:[`Date: Saturday, 12 September`,`Time: 8:00 a.m. – 11:00 a.m.`,`Meet at the main gate near the fountain.`,`Gloves and rubbish bags will be provided.`],footer:`Volunteers of all ages are welcome!`,badge:`Community Event`},question:`Where will the clean-up event begin?`,options:[`At the bus station near the park`,`At the park's swimming pool`,`At the community sports center`,`At the main gate, near the fountain`],correctAnswer:3,explanationEnglish:`Community notices usually state exact meeting details—date, time, and place—so readers know precisely what to do. Detail questions require you to match the wording of the notice closely.`,explanationThai:`ประกาศกิจกรรมชุมชนมักระบุรายละเอียดที่ชัดเจน เช่น วันที่ เวลา และสถานที่นัดพบ คำถามแบบนี้ต้องหาให้ตรงกับข้อความในประกาศ`,keyClue:`Meet at the main gate near the fountain.`,optionExplanations:[`Wrong — the notice gives the fountain by the main gate as the meeting point, not a bus station.`,`Wrong — the notice never mentions a swimming pool.`,`Wrong — the sports center is not mentioned in the notice.`,`Correct — the notice says "Meet at the main gate near the fountain."`],hints:[`Read the third line of the notice carefully.`,`Detail questions ask you to find one exact fact stated in the text.`,`The notice never talks about swimming, so that option can't be right.`],hint3EliminateIndex:1,tags:[`signs`,`notices`,`community`]},{id:`MT2-Q03`,testId:`mock-test-2`,section:`Vocabulary in Context`,order:3,skill:`Occupation vocabulary in context`,skillTag:`vocabulary`,difficulty:`Standard`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`My uncle works at a clinic. He takes care of sick animals every day. He is a ______.`,options:[`electrician`,`pharmacist`,`dentist`,`veterinarian`],correctAnswer:3,explanationEnglish:`Occupation words are often defined by what a person does. 'Takes care of sick animals' is the exact job description of a veterinarian.`,explanationThai:`คำศัพท์อาชีพมักอธิบายด้วยหน้าที่การงาน คำว่า 'ดูแลสัตว์ป่วย' คือหน้าที่ของสัตวแพทย์โดยตรง`,keyClue:`takes care of sick animals`,optionExplanations:[`Wrong — an electrician repairs electrical systems, not animals.`,`Wrong — a pharmacist prepares and sells medicine; not specifically for animals.`,`Wrong — a dentist takes care of teeth, not sick animals.`,`Correct — a veterinarian is a doctor who treats animals.`],hints:[`Think about who works with animals, not people.`,`Match the job description in the sentence to the correct job title.`,`A dentist only works with teeth, so that can't be the answer.`],hint3EliminateIndex:2,vocabulary:[{term:`veterinarian`,meaningEnglish:`a doctor who treats sick or injured animals`,meaningThai:`สัตวแพทย์`}],tags:[`vocabulary`,`occupations`,`context-clues`]},{id:`MT2-Q04`,testId:`mock-test-2`,section:`Vocabulary in Context`,order:4,skill:`Travel vocabulary in context`,skillTag:`vocabulary`,difficulty:`Standard`,instruction:`Choose the word or phrase that best completes the sentence.`,stimulus:{type:`none`},question:`Before you get on the plane, you must show your passport and ticket at the ______.`,options:[`platform`,`check-in counter`,`departure lounge`,`ticket office`],correctAnswer:1,explanationEnglish:`Travel vocabulary is often linked to a sequence of actions. Showing your passport and ticket before boarding a plane happens at the check-in counter.`,explanationThai:`คำศัพท์การเดินทางมักเกี่ยวข้องกับลำดับขั้นตอน การแสดงพาสปอร์ตและตั๋วก่อนขึ้นเครื่องบินจะทำที่เคาน์เตอร์เช็คอิน`,keyClue:`show your passport and ticket`,optionExplanations:[`Wrong — a platform is where you wait for a train, not a plane.`,`Correct — passengers show their passport and ticket at the check-in counter before boarding.`,`Wrong — the departure lounge is where you wait after check-in, not where you show documents.`,`Wrong — a ticket office is where you buy tickets, not where you show your passport before flying.`],hints:[`Think about airports, not train stations.`,`This is the place where staff check your documents before you board.`,`A platform belongs to train stations, not airports.`],hint3EliminateIndex:0,vocabulary:[{term:`check-in counter`,meaningEnglish:`the place at an airport where passengers show documents and get a boarding pass`,meaningThai:`เคาน์เตอร์เช็คอิน`}],tags:[`vocabulary`,`travel`,`airport`]},{id:`MT2-Q05`,testId:`mock-test-2`,section:`Vocabulary in Context`,order:5,skill:`Synonym recognition in context`,skillTag:`vocabulary`,difficulty:`Standard`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`The math test was extremely difficult, so most students found it ______.`,options:[`challenging`,`simple`,`boring`,`cheap`],correctAnswer:0,explanationEnglish:`The word 'so' shows a result that matches the first idea. Because the test was 'extremely difficult,' the word describing how students found it should mean the same as difficult.`,explanationThai:`คำว่า 'so' บอกผลลัพธ์ที่สอดคล้องกับความหมายแรกของประโยค เมื่อข้อสอบ 'ยากมาก' คำที่ตามมาจึงควรมีความหมายใกล้เคียงกับคำว่ายาก`,keyClue:`extremely difficult, so...`,optionExplanations:[`Correct — 'challenging' means difficult, which matches 'extremely difficult' in the first part of the sentence.`,`Wrong — 'simple' means easy, which contradicts 'extremely difficult.'`,`Wrong — 'boring' describes something uninteresting, not something hard to understand.`,`Wrong — 'cheap' describes price, which has nothing to do with test difficulty.`],hints:[`Look at the connecting word 'so' — it links two matching ideas.`,`Find the word closest in meaning to 'difficult.'`,`'Cheap' is about money, not about how hard a test is.`],hint3EliminateIndex:3,vocabulary:[{term:`challenging`,meaningEnglish:`difficult in a way that tests your ability`,meaningThai:`ท้าทาย/ยาก`}],tags:[`vocabulary`,`synonyms`,`context-clues`]},{id:`MT2-Q06`,testId:`mock-test-2`,section:`Grammar and Usage`,order:6,skill:`Present perfect with 'yet'`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Choose the correct word or phrase to complete the sentence.`,stimulus:{type:`none`},question:`I ______ my homework yet. I need thirty more minutes.`,options:[`didn't finish`,`haven't finished`,`don't finish`,`won't finish`],correctAnswer:1,explanationEnglish:`The word 'yet' is a strong signal for the present perfect tense in negative sentences, showing something expected has not happened up to now: have/has + not + past participle.`,explanationThai:`คำว่า 'yet' เป็นสัญญาณสำคัญของ Present Perfect ในประโยคปฏิเสธ ใช้บอกว่าสิ่งที่คาดว่าจะเกิดขึ้นยังไม่เกิดขึ้นจนถึงตอนนี้ โครงสร้างคือ have/has + not + กริยาช่องที่ 3`,keyClue:`yet`,optionExplanations:[`Wrong — "didn't finish" is simple past, which doesn't fit naturally with 'yet' describing an ongoing situation up to now.`,`Correct — "haven't finished ... yet" is the present perfect negative form used for actions not completed up to now.`,`Wrong — "don't finish" is simple present, which does not describe an unfinished action connected to now.`,`Wrong — "won't finish" is future, but the sentence describes something already in progress, not a future refusal.`],hints:[`Look at the time word at the end of the sentence.`,`This word usually pairs with the present perfect tense in negative sentences.`,`Simple present doesn't fit here because the sentence is about something not yet completed.`],hint3EliminateIndex:2,vocabulary:[{term:`yet`,meaningEnglish:`used in negative sentences to say something expected has not happened up to now`,meaningThai:`ยัง(ไม่)...เลย`}],grammarRule:`Present perfect (haven't/hasn't + past participle) with 'yet' for uncompleted actions`,tags:[`grammar`,`present-perfect`,`tense`]},{id:`MT2-Q07`,testId:`mock-test-2`,section:`Grammar and Usage`,order:7,skill:`Past continuous with 'while'`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Choose the correct word or phrase to complete the sentence.`,stimulus:{type:`none`},question:`While I ______ dinner, the phone suddenly rang.`,options:[`cook`,`cooked`,`was cooking`,`have cooked`],correctAnswer:2,explanationEnglish:`Past continuous (was/were + verb-ing) describes a longer action in progress in the past that gets interrupted by a shorter action in simple past — often signaled by 'while' or 'when.'`,explanationThai:`Past Continuous (was/were + กริยาเติม ing) ใช้บอกเหตุการณ์ที่กำลังดำเนินอยู่ในอดีต แล้วถูกขัดจังหวะด้วยเหตุการณ์สั้นๆ ที่เกิดขึ้นแทรก มักสังเกตได้จากคำว่า while หรือ when`,keyClue:`While ... suddenly rang`,optionExplanations:[`Wrong — simple present doesn't show an action in progress in the past.`,`Wrong — simple past suggests a completed action, not one interrupted midway.`,`Correct — past continuous ("was cooking") describes an action in progress when another action ("rang") interrupted it.`,`Wrong — present perfect doesn't fit the past time clue "suddenly rang."`],hints:[`Notice the word 'while' at the start of the sentence.`,`This word usually introduces a longer action that was in progress when something else happened.`,`Simple present doesn't describe a past situation, so that option is out.`],hint3EliminateIndex:0,grammarRule:`Past continuous for an action in progress interrupted by another action`,tags:[`grammar`,`past-continuous`,`tense`]},{id:`MT2-Q08`,testId:`mock-test-2`,section:`Grammar and Usage`,order:8,skill:`Future form: be going to`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Choose the correct word or phrase to complete the sentence.`,stimulus:{type:`none`},question:`Look at those dark clouds! It ______ rain soon.`,options:[`will`,`is`,`going to`,`is going to`],correctAnswer:3,explanationEnglish:`'Going to' + verb is used for predictions based on something we can see or know right now, such as dark clouds signaling rain. The full structure needs a form of 'be' before 'going to.'`,explanationThai:`โครงสร้าง 'going to' + กริยา ใช้ทำนายเหตุการณ์จากหลักฐานที่เห็นอยู่ตอนนี้ เช่น เมฆดำที่บ่งบอกว่าฝนจะตก โครงสร้างที่ถูกต้องต้องมี be (is/am/are) นำหน้า going to เสมอ`,keyClue:`Look at those dark clouds!`,optionExplanations:[`Wrong — "will" alone is missing the verb "rain" structure needed here, and evidence-based predictions usually use "going to."`,`Wrong — "is" alone cannot form the future without "going to."`,`Wrong — "going to" needs the auxiliary "is" before it to be grammatically correct.`,`Correct — "is going to" is used for predictions based on present evidence, like dark clouds in the sky.`],hints:[`Think about why we can predict rain — we can see evidence right now.`,`This future form needs a 'be' verb before it: am/is/are + going to.`,`'Will' alone doesn't complete the sentence the way it's written here.`],hint3EliminateIndex:0,grammarRule:`'be going to' for predictions based on present evidence`,tags:[`grammar`,`future-tense`,`predictions`]},{id:`MT2-Q09`,testId:`mock-test-2`,section:`Grammar and Usage`,order:9,skill:`Superlative adjectives`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Choose the correct word or phrase to complete the sentence.`,stimulus:{type:`none`},question:`This is ______ museum in the whole city — millions of people visit it every year.`,options:[`the most famous`,`more famous`,`famous`,`the more famous`],correctAnswer:0,explanationEnglish:`Superlative adjectives (the most/the -est) compare one thing to all others in a group of three or more, often signaled by phrases like 'in the whole city' or 'in the world.'`,explanationThai:`คำคุณศัพท์ขั้นสุด (the most / the -est) ใช้เปรียบเทียบสิ่งหนึ่งกับสิ่งอื่นทั้งหมดในกลุ่มตั้งแต่สามสิ่งขึ้นไป มักสังเกตได้จากวลีอย่าง 'in the whole city' หรือ 'in the world'`,keyClue:`in the whole city`,optionExplanations:[`Correct — "the most famous" is the superlative form, used to compare one thing with all others in a group ("in the whole city").`,`Wrong — "more famous" is comparative, used to compare two things only, not one thing to a whole group.`,`Wrong — the plain adjective "famous" cannot show the highest degree without "the most."`,`Wrong — "the more famous" mixes "the" with the comparative form incorrectly; superlatives use "the most."`],hints:[`Look at the phrase 'in the whole city' — how many things are being compared?`,`When comparing one thing to an entire group, use 'the most' + adjective.`,`Plain 'famous' without 'the most' cannot show the highest degree, so that option is wrong.`],hint3EliminateIndex:2,grammarRule:`Superlative form: the most + adjective for comparing one to a whole group`,tags:[`grammar`,`superlatives`,`comparison`]},{id:`MT2-Q10`,testId:`mock-test-2`,section:`Grammar and Usage`,order:10,skill:`Gerund after verbs of preference`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Choose the correct word or phrase to complete the sentence.`,stimulus:{type:`none`},question:`My little sister loves ______ picture books before bedtime.`,options:[`read`,`reading`,`to reading`,`reads`],correctAnswer:1,explanationEnglish:`Verbs like 'love,' 'enjoy,' and 'like' are commonly followed by a gerund (verb + -ing) to describe an activity someone enjoys doing.`,explanationThai:`คำกริยาอย่าง love, enjoy, like มักตามด้วย gerund (กริยาเติม ing) เพื่อบอกกิจกรรมที่ชอบทำ`,keyClue:`loves ______ picture books`,optionExplanations:[`Wrong — "read" is the base form, which cannot follow "loves" directly without -ing or "to."`,`Correct — "love" is often followed by a gerund (verb + -ing) when describing an enjoyable habit or activity.`,`Wrong — "to reading" mixes the infinitive marker "to" with the -ing form, which is incorrect.`,`Wrong — "reads" agrees with a subject but cannot directly follow another verb like "loves."`],hints:[`Think about what form usually follows the verb 'love.'`,`'Love' + verb-ing is a common pattern for describing enjoyable activities.`,`'To reading' mixes two different structures together, so it can't be correct.`],hint3EliminateIndex:2,grammarRule:`Gerund (verb+-ing) after verbs of preference like love/enjoy/like`,tags:[`grammar`,`gerunds`,`verb-patterns`]},{id:`MT2-Q11`,testId:`mock-test-2`,section:`Grammar and Usage`,order:11,skill:`Modal verbs: must vs. should`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Choose the correct word or phrase to complete the sentence.`,stimulus:{type:`none`},question:`Students ______ wear their school uniform on Mondays — it is a strict rule.`,options:[`can`,`might`,`must`,`should`],correctAnswer:2,explanationEnglish:`'Must' expresses strong obligation or a rule that cannot be broken. 'Should' is weaker and used for advice, so it doesn't match a sentence that specifically calls something a 'strict rule.'`,explanationThai:`'Must' ใช้แสดงข้อบังคับที่หนักแน่นหรือกฎที่ต้องทำตาม ส่วน 'should' ใช้ให้คำแนะนำซึ่งมีน้ำหนักเบากว่า จึงไม่เหมาะกับประโยคที่ระบุชัดว่าเป็น 'กฎที่เข้มงวด'`,keyClue:`it is a strict rule`,optionExplanations:[`Wrong — "can" expresses ability or permission, not a strict obligation.`,`Wrong — "might" expresses possibility, which doesn't match a strict rule.`,`Correct — "must" expresses strong obligation or a rule that has to be followed, matching "it is a strict rule."`,`Wrong — "should" expresses advice or a suggestion, which is weaker than a strict, required rule.`],hints:[`Look at the phrase at the end of the sentence describing how strict this is.`,`This modal verb shows strong obligation, stronger than a suggestion.`,`'Should' is used for advice, which is too weak for a strict rule, so it's not the answer.`],hint3EliminateIndex:3,vocabulary:[{term:`strict`,meaningEnglish:`followed very carefully and firmly, with no exceptions`,meaningThai:`เข้มงวด`}],grammarRule:`Modal 'must' for strong obligation vs. 'should' for advice`,tags:[`grammar`,`modal-verbs`,`obligation`]},{id:`MT2-Q12`,testId:`mock-test-2`,section:`Everyday Conversation`,order:12,skill:`Matching a reply to a 'where are you from' question`,skillTag:`conversation`,difficulty:`Standard`,instruction:`Choose the best reply to complete the conversation.`,stimulus:{type:`dialogue`,setting:`At a new school`,lines:[{speaker:`Anna`,text:`Hi! I don't think we've met before. Where are you from?`},{speaker:`Somchai`,text:`______`}]},question:`What is Somchai's best reply?`,options:[`I like pizza very much.`,`I'm fine, thank you.`,`I'm going to the market.`,`I'm from Thailand. I moved here last year.`],correctAnswer:3,explanationEnglish:`In conversation, replies must match the question type. A question asking about origin ('Where are you from?') needs an answer naming a place, not a feeling or an unrelated fact.`,explanationThai:`ในบทสนทนา คำตอบต้องสอดคล้องกับประเภทของคำถาม คำถามเรื่องถิ่นกำเนิด (Where are you from?) ต้องตอบด้วยชื่อสถานที่ ไม่ใช่ความรู้สึกหรือเรื่องอื่นที่ไม่เกี่ยวข้อง`,keyClue:`Where are you from?`,optionExplanations:[`Wrong — this is unrelated to the question about where someone is from.`,`Wrong — this answers "How are you?" not "Where are you from?"`,`Wrong — this answers a question about a destination, not nationality.`,`Correct — this directly answers the question "Where are you from?" with a country and extra detail.`],hints:[`Focus on what kind of information the question is asking for.`,`A 'where' question about origin needs a place name in the answer.`,`'I'm fine, thank you' answers a different kind of question, not this one.`],hint3EliminateIndex:1,tags:[`conversation`,`nationality`,`dialogue`]},{id:`MT2-Q13`,testId:`mock-test-2`,section:`Everyday Conversation`,order:13,skill:`Responding naturally to an invitation`,skillTag:`conversation`,difficulty:`Standard`,instruction:`Choose the best reply.`,stimulus:{type:`none`},question:`Ben: "Are you free on Saturday afternoon? Let's go swimming!" Mei: ______`,options:[`No, I am not swimming now.`,`I have been to Japan twice.`,`That sounds great! What time should we meet?`,`Yes, I went swimming yesterday.`],correctAnswer:2,explanationEnglish:`A good reply to an invitation should show whether you accept or decline, and often continues the conversation naturally, such as asking about details like time or place.`,explanationThai:`คำตอบที่ดีต่อคำเชิญควรแสดงว่าตอบรับหรือปฏิเสธ และมักต่อบทสนทนาต่อไปอย่างเป็นธรรมชาติ เช่น ถามรายละเอียดเรื่องเวลาและสถานที่`,keyClue:`Are you free on Saturday afternoon? Let's go swimming!`,optionExplanations:[`Wrong — this misunderstands the question, as if it were asking about swimming right now instead of an invitation.`,`Wrong — this is completely unrelated to the invitation about Saturday swimming.`,`Correct — this accepts the invitation and naturally continues the conversation by asking about the time.`,`Wrong — this talks about the past, but Ben is inviting Mei to swim in the future, not asking what happened yesterday.`],hints:[`Think about whether this reply accepts or continues the invitation naturally.`,`A natural reply to an invitation often confirms details like time or place.`,`An answer about the past doesn't fit an invitation for the future, so rule that one out.`],hint3EliminateIndex:3,tags:[`conversation`,`invitations`,`dialogue`]},{id:`MT2-Q14`,testId:`mock-test-2`,section:`Everyday Conversation`,order:14,skill:`Responding to a suggestion`,skillTag:`conversation`,difficulty:`Standard`,instruction:`Choose the best reply.`,stimulus:{type:`none`},question:`Nok: "I think we should study together for the science test." Tom: ______`,options:[`That's a good idea. Let's meet at the library after school.`,`I don't like science museums.`,`The test was very easy.`,`She studies English every day.`],correctAnswer:0,explanationEnglish:`When someone makes a suggestion, a natural reply either agrees or disagrees clearly, often followed by a practical detail like a time or place to meet.`,explanationThai:`เมื่อมีคนเสนอความคิดเห็น คำตอบที่เป็นธรรมชาติควรแสดงว่าเห็นด้วยหรือไม่เห็นด้วยอย่างชัดเจน และมักตามด้วยรายละเอียดที่เป็นประโยชน์ เช่น เวลาหรือสถานที่นัดพบ`,keyClue:`I think we should study together`,optionExplanations:[`Correct — this agrees with the suggestion and adds a natural detail about when and where to meet.`,`Wrong — this confuses "science test" with "science museum," which is unrelated.`,`Wrong — the test hasn't happened yet, so talking about it in the past tense doesn't make sense here.`,`Wrong — this talks about someone else entirely, not responding to Nok's suggestion.`],hints:[`Check whether the reply responds to the idea of studying together.`,`A good reply to a suggestion often agrees and adds a helpful detail.`,`The test hasn't happened yet, so a past-tense comment about it doesn't fit.`],hint3EliminateIndex:2,tags:[`conversation`,`suggestions`,`agreeing`]},{id:`MT2-Q15`,testId:`mock-test-2`,section:`Everyday Conversation`,order:15,skill:`Responding on the telephone`,skillTag:`conversation`,difficulty:`Standard`,instruction:`Choose the best reply to complete the conversation.`,stimulus:{type:`dialogue`,setting:`On the phone`,lines:[{speaker:`Receptionist`,text:`Good morning, Bright Clinic. How can I help you?`},{speaker:`Caller`,text:`______`}]},question:`What is the caller's best reply?`,options:[`I'd like to close the door, please.`,`I'd like to make an appointment with the dentist, please.`,`I'm sorry, I can't hear the radio.`,`Yes, I finished my homework already.`],correctAnswer:1,explanationEnglish:`Telephone conversations usually open with the receiver asking how they can help. The caller's reply should state the reason for the call clearly and politely.`,explanationThai:`บทสนทนาทางโทรศัพท์มักเริ่มด้วยฝ่ายรับสายถามว่าจะช่วยอะไรได้บ้าง ผู้โทรควรตอบด้วยเหตุผลที่โทรมาอย่างชัดเจนและสุภาพ`,keyClue:`How can I help you?`,optionExplanations:[`Wrong — this has nothing to do with a phone call to a clinic.`,`Correct — this is a natural response to a receptionist asking how they can help, stating the reason for the call.`,`Wrong — mishears the situation as being about a radio, which was never mentioned.`,`Wrong — talking about homework doesn't answer "How can I help you?" at a clinic.`],hints:[`Think about why someone would call a clinic.`,`The reply should directly state the purpose of the phone call.`,`Talking about homework doesn't answer a receptionist's offer to help, so that's wrong.`],hint3EliminateIndex:3,tags:[`conversation`,`telephone`,`dialogue`]},{id:`MT2-Q16`,testId:`mock-test-2`,section:`Cloze Dialogue or Short Message`,order:16,skill:`Modal verbs for possibility in a message`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Read the message and choose the best word for the first blank.`,stimulus:Th,question:`Which word best fits the first blank: 'I ______ be home late tonight...'?`,options:[`am`,`can`,`must`,`might`],correctAnswer:3,explanationEnglish:`The modal 'might' expresses possibility — something that may or may not happen. The phrase 'if needed' shows Mom is not 100% certain about being late, so 'might' fits best.`,explanationThai:`'Might' ใช้แสดงความเป็นไปได้ที่อาจเกิดขึ้นหรือไม่ก็ได้ วลี 'if needed' แสดงว่าคุณแม่ไม่แน่ใจร้อยเปอร์เซ็นต์ว่าจะกลับบ้านช้า จึงเหมาะกับคำว่า might มากที่สุด`,keyClue:`if needed`,optionExplanations:[`Wrong — "am" alone cannot be followed directly by the base verb "be"; it needs another form.`,`Wrong — "can" expresses ability or permission, not future possibility.`,`Wrong — "must" expresses obligation, but arriving home late isn't something Mom is required to do.`,`Correct — "might" shows something is possible but not certain, which matches the advice to "start dinner without me if needed."`],hints:[`Look at the phrase 'if needed' later in the message — what does it suggest about certainty?`,`This modal verb expresses possibility, not certainty or obligation.`,`'Am' by itself can't be followed directly by 'be,' so that option doesn't work grammatically.`],hint3EliminateIndex:0,vocabulary:[{term:`might`,meaningEnglish:`used to show that something is possible but not certain`,meaningThai:`อาจจะ`}],grammarRule:`Modal 'might' for future possibility`,tags:[`grammar`,`modal-verbs`,`cloze`,`message`]},{id:`MT2-Q17`,testId:`mock-test-2`,section:`Cloze Dialogue or Short Message`,order:17,skill:`Verb form after 'please' in a request`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Read the message and choose the best word for the second blank.`,stimulus:Th,question:`Which word best fits the second blank: 'Please ______ your brother do his homework...'?`,options:[`helps`,`to help`,`help`,`helping`],correctAnswer:2,explanationEnglish:`Polite requests and imperatives starting with 'please' are followed directly by the base form of the verb, with no 'to' and no -s or -ing ending.`,explanationThai:`ประโยคขอร้องหรือคำสั่งที่ขึ้นต้นด้วย 'please' จะตามด้วยกริยาช่องที่ 1 (base form) ทันที ไม่ต้องมี to และไม่เติม s หรือ ing`,keyClue:`Please ______ your brother`,optionExplanations:[`Wrong — "helps" adds -s for third person singular, but commands/requests use the base form.`,`Wrong — "please to help" is incorrect; "please" is followed directly by the base verb, without "to."`,`Correct — after "please," we use the base form of the verb: "help your brother do his homework."`,`Wrong — "helping" (-ing form) doesn't fit after "please" in a request like this.`],hints:[`Think about what verb form follows the word 'please' in a request.`,`Requests with 'please' use the base form of the verb, no 'to' needed.`,`'Helping' with -ing doesn't fit directly after 'please' in this kind of sentence.`],hint3EliminateIndex:3,grammarRule:`Base verb form after 'please' in requests/imperatives`,tags:[`grammar`,`imperatives`,`cloze`,`message`]},{id:`MT2-Q18`,testId:`mock-test-2`,section:`Cloze Dialogue or Short Message`,order:18,skill:`Subject-verb agreement with uncountable nouns`,skillTag:`grammar`,difficulty:`Standard`,instruction:`Read the message and choose the best word for the third blank.`,stimulus:Th,question:`Which word best fits the third blank: 'There ______ some fruit in the fridge...'?`,options:[`is`,`are`,`be`,`have`],correctAnswer:0,explanationEnglish:`'Fruit' is usually an uncountable noun when talking about fruit in general, so it takes a singular verb: 'There is some fruit...' This is different from countable nouns like 'apples,' which would need 'are.'`,explanationThai:`คำว่า 'fruit' มักใช้เป็นคำนามนับไม่ได้เมื่อพูดถึงผลไม้โดยรวม จึงใช้กริยารูปเอกพจน์ 'is' เช่น 'There is some fruit...' ต่างจากคำนามนับได้อย่าง 'apples' ที่ต้องใช้ 'are'`,keyClue:`some fruit`,optionExplanations:[`Correct — "fruit" is often used as an uncountable noun meaning "fruit in general," so it takes the singular verb "is."`,`Wrong — "are" would be correct with countable plural nouns, but "fruit" here is treated as uncountable.`,`Wrong — "be" is the base form and cannot be used directly after "there" in a statement like this.`,`Wrong — "There have" is not a correct structure in English; "there" pairs with "is/are," not "have."`],hints:[`Think about whether 'fruit' is being used as countable or uncountable here.`,`Uncountable nouns pair with the singular verb 'is,' not 'are.'`,`'There have' is not a correct structure in English, so that option is wrong.`],hint3EliminateIndex:3,grammarRule:`'There is' with uncountable nouns like 'fruit'`,tags:[`grammar`,`quantifiers`,`cloze`,`message`]},{id:`MT2-Q19`,testId:`mock-test-2`,section:`Reading Comprehension`,order:19,skill:`Identifying the main idea of a passage`,skillTag:`reading`,difficulty:`Standard`,instruction:`Read the passage and answer the question.`,stimulus:wh,question:`What is this email mainly about?`,options:[`A request for parents to donate old books`,`An announcement about the school's upcoming Book Fair`,`A change in the school's reading period schedule`,`An invitation to meet new teachers at the school`],correctAnswer:1,explanationEnglish:`Main idea questions ask what the whole passage is about, not just one detail. Every paragraph here connects back to the Book Fair — its dates, activities, and purpose.`,explanationThai:`คำถามใจความสำคัญถามถึงเนื้อหาโดยรวมของทั้งเรื่อง ไม่ใช่แค่รายละเอียดเดียว ทุกย่อหน้าของอีเมลนี้เชื่อมโยงกับงาน Book Fair ทั้งวันที่ กิจกรรม และจุดประสงค์`,keyClue:`our annual Book Fair will take place`,optionExplanations:[`Wrong — the email doesn't ask parents to donate books; it announces an event where books are sold.`,`Correct — the whole email describes the dates, activities, and purpose of the Book Fair.`,`Wrong — the reading period is mentioned only briefly as when classes will visit, not as a schedule change.`,`Wrong — the email is about a book fair, not about meeting new teachers.`],hints:[`Think about what every paragraph in the email has in common.`,`The main idea is usually stated early and supported by the rest of the passage.`,`The email never asks parents to give away their own books, so that option is wrong.`],hint3EliminateIndex:0,tags:[`reading`,`main-idea`,`email`]},{id:`MT2-Q20`,testId:`mock-test-2`,section:`Reading Comprehension`,order:20,skill:`Locating a supporting detail in a passage`,skillTag:`reading`,difficulty:`Standard`,instruction:`Read the passage and answer the question.`,stimulus:wh,question:`According to the email, what should students bring if they want to buy books?`,options:[`A signed permission letter`,`Cash`,`A credit card`,`Their library card`],correctAnswer:1,explanationEnglish:`Detail questions require finding one exact fact stated in the passage. The email clearly says cash is needed and cards will not be accepted.`,explanationThai:`คำถามรายละเอียดต้องหาข้อเท็จจริงที่ระบุไว้ตรงๆ ในเนื้อเรื่อง อีเมลระบุชัดเจนว่าต้องใช้เงินสดและจะไม่รับบัตร`,keyClue:`should bring cash, as the fair does not accept cards`,optionExplanations:[`Wrong — the email never mentions needing a permission letter.`,`Correct — the email states, "Students who wish to buy books should bring cash."`,`Wrong — the email specifically says the fair does not accept cards this year.`,`Wrong — a library card is not mentioned anywhere in the email.`],hints:[`Look in the second paragraph for what students need to bring.`,`This detail question has one exact answer stated directly in the text.`,`The passage clearly says cards will NOT be accepted, so that option is wrong.`],hint3EliminateIndex:2,tags:[`reading`,`detail`,`email`]},{id:`MT2-Q21`,testId:`mock-test-2`,section:`Reading Comprehension`,order:21,skill:`Vocabulary in context`,skillTag:`reading`,difficulty:`Standard`,instruction:`Read the passage and answer the question.`,stimulus:wh,question:`In the email, the word 'feature' is closest in meaning to ______.`,options:[`include`,`remove`,`repair`,`forget`],correctAnswer:0,explanationEnglish:`In context, 'feature' means to include or highlight something as an important part of an event, similar to 'include' or 'have.'`,explanationThai:`ในบริบทนี้ 'feature' หมายถึงการนำเสนอหรือรวมสิ่งใดสิ่งหนึ่งไว้เป็นส่วนสำคัญของงาน มีความหมายใกล้เคียงกับ 'include' หรือ 'have'`,keyClue:`the fair will feature more than two thousand books`,optionExplanations:[`Correct — "feature" here means to have or include something as a special part, matching "will feature more than two thousand books."`,`Wrong — "remove" means the opposite of including something.`,`Wrong — "repair" means to fix something, unrelated to showing off books.`,`Wrong — "forget" has no connection to displaying or including books at a fair.`],hints:[`Look at how the word is used with the number of books.`,`This word means to include or show something as a highlight.`,`'Remove' means the opposite of what the fair is doing with the books, so it's wrong.`],hint3EliminateIndex:1,vocabulary:[{term:`feature`,meaningEnglish:`to include something as a special or important part`,meaningThai:`มี/นำเสนอเป็นจุดเด่น`}],tags:[`reading`,`vocabulary-in-context`,`email`]},{id:`MT2-Q22`,testId:`mock-test-2`,section:`Reading Comprehension`,order:22,skill:`Making an inference from passage details`,skillTag:`reading`,difficulty:`Standard`,instruction:`Read the passage and answer the question.`,stimulus:wh,question:`Based on the email, why does the library need the profits from the fair?`,options:[`To hire more teachers for reading lessons`,`To pay the local authors who visit the fair`,`To build a brand new school hall`,`To buy new furniture, because the current furniture needs repair`],correctAnswer:3,explanationEnglish:`Inference and detail questions often require connecting two parts of a passage: here, the reason (old, damaged furniture) and the result (using profits to replace it).`,explanationThai:`คำถามเชิงอนุมานมักต้องเชื่อมโยงสองส่วนของเนื้อเรื่องเข้าด้วยกัน ในที่นี้คือสาเหตุ (เฟอร์นิเจอร์เก่าชำรุด) กับผลลัพธ์ (นำเงินกำไรไปซื้อของใหม่)`,keyClue:`profits ... will go toward buying new furniture for our library, which badly needs repair`,optionExplanations:[`Wrong — hiring teachers is never mentioned in the email.`,`Wrong — the email doesn't mention paying the visiting authors.`,`Wrong — the fair takes place in the existing school hall; there's no mention of building a new one.`,`Correct — the email states, "All profits ... will go toward buying new furniture for our library, which badly needs repair."`],hints:[`Look at the last sentence of the second-to-last paragraph.`,`The passage gives a clear reason connected to the word 'repair.'`,`The email never talks about paying the authors, so that option is wrong.`],hint3EliminateIndex:1,tags:[`reading`,`inference`,`email`]},{id:`MT2-Q23`,testId:`mock-test-2`,section:`Functional Language and Error Recognition`,order:23,skill:`Choosing the grammatically correct sentence`,skillTag:`functional`,difficulty:`Standard`,instruction:`Choose the grammatically correct sentence.`,stimulus:{type:`none`},question:`Which sentence is grammatically correct?`,options:[`She don't like spicy food.`,`She doesn't likes spicy food.`,`She doesn't like spicy food.`,`She not like spicy food.`],correctAnswer:2,explanationEnglish:`For third-person singular subjects (he/she/it) in the simple present negative, use 'doesn't' + the base form of the verb, without an extra -s.`,explanationThai:`สำหรับประธานเอกพจน์บุรุษที่สาม (he/she/it) ในประโยคปฏิเสธ Present Simple ให้ใช้ 'doesn't' ตามด้วยกริยาช่องที่ 1 (base form) โดยไม่ต้องเติม s ซ้ำอีก`,keyClue:`She ... spicy food`,optionExplanations:[`Wrong — with "she" (third person singular), the negative auxiliary should be "doesn't," not "don't."`,`Wrong — once "doesn't" is used, the main verb returns to its base form; "likes" incorrectly keeps the -s ending twice.`,`Correct — "doesn't" + base verb "like" is the correct third-person singular negative form.`,`Wrong — this sentence is missing the auxiliary verb needed to form a negative statement in English.`],hints:[`Focus on the subject 'she' — what form of 'do' matches it?`,`Once you use 'doesn't,' the main verb goes back to its base form, no -s.`,`Option A uses 'don't' with 'she,' which doesn't match in number, so it's wrong.`],hint3EliminateIndex:0,grammarRule:`Simple present negative: doesn't + base verb for third-person singular`,tags:[`functional`,`grammar`,`error-recognition`]},{id:`MT2-Q24`,testId:`mock-test-2`,section:`Functional Language and Error Recognition`,order:24,skill:`Finding a grammar error in a sentence`,skillTag:`functional`,difficulty:`Standard`,instruction:`Find the incorrect part of the sentence.`,stimulus:{type:`none`},question:`Find the incorrect part of this sentence: "My father drive to work every morning because the office is far from our house."`,options:[`My father`,`drive to work`,`every morning`,`is far from`],correctAnswer:1,explanationEnglish:`In the simple present tense, third-person singular subjects (he/she/it, or a name like 'my father') require a verb ending in -s: 'drives,' not 'drive.'`,explanationThai:`ใน Present Simple ประธานเอกพจน์บุรุษที่สาม (he/she/it หรือชื่อเฉพาะอย่าง my father) ต้องใช้กริยาเติม s คือ 'drives' ไม่ใช่ 'drive'`,keyClue:`My father drive`,optionExplanations:[`Wrong — "My father" is the subject and is written correctly.`,`Correct — with the third-person singular subject "My father," the verb should be "drives," not "drive."`,`Wrong — "every morning" is a correct time expression and doesn't contain an error.`,`Wrong — "is far from" is used correctly to describe distance.`],hints:[`Check subject-verb agreement at the start of the sentence.`,`Third-person singular subjects need an -s on the present-tense verb.`,`'Every morning' is a normal time phrase with nothing wrong in it, so rule that out.`],hint3EliminateIndex:2,grammarRule:`Subject-verb agreement in the simple present (-s ending)`,tags:[`functional`,`error-recognition`,`subject-verb-agreement`]},{id:`MT2-Q25`,testId:`mock-test-2`,section:`Functional Language and Error Recognition`,order:25,skill:`Choosing the natural response to an apology`,skillTag:`functional`,difficulty:`Standard`,instruction:`Choose the most natural response.`,stimulus:{type:`none`},question:`Someone bumps into you by accident and says, "Oh, I'm so sorry!" What is the most natural reply?`,options:[`No problem, don't worry about it.`,`You're welcome.`,`Nice to meet you too.`,`I don't think so.`],correctAnswer:0,explanationEnglish:`Functional language pairs specific phrases with specific situations. An apology like 'I'm so sorry' is naturally followed by a phrase accepting it, such as 'No problem' or 'That's okay.'`,explanationThai:`ภาษาเชิงหน้าที่ (functional language) จะจับคู่วลีเฉพาะกับสถานการณ์เฉพาะ คำขอโทษอย่าง 'I'm so sorry' มักตามด้วยวลีที่ตอบรับคำขอโทษ เช่น 'No problem' หรือ 'That's okay'`,keyClue:`I'm so sorry!`,optionExplanations:[`Correct — this is a na

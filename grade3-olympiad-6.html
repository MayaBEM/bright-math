,{label:`Thu`,icons:[{icon:`🍌`,count:4}]},{label:`Fri`,icons:[{icon:`🍎`,count:2},{icon:`🍇`,count:1}]}]}},choices:[`6`,`7`,`5`,`8`,`4`],choicesTh:[`6`,`7`,`5`,`8`,`4`],correctAnswer:0,explanation:`Wednesday = 1🍎(5) + 2🍌(6) + 1🍇(7) = 18. Thursday = 4🍌 (4×3) = 12. Difference: 18 − 12 = 6.`,explanationTh:`วันพุธ = 1🍎(5) + 2🍌(6) + 1🍇(7) = 18 ผล วันพฤหัสบดี = 4🍌 (4×3) = 12 ผล ผลต่าง = 18 − 12 = 6 ผล`,hint:`Work out each day's real fruit total using the key before subtracting.`,hintTh:`หาจำนวนผลไม้จริงของแต่ละวันโดยใช้ตัวเลขในคำอธิบายสัญลักษณ์ก่อน แล้วค่อยลบกัน`,commonMistake:`Subtracting the number of pictures shown instead of converting to real fruit counts first.`},{id:`v6t1-q2`,setId:1,section:`warmup`,questionNumber:2,points:3,difficulty:`comfortable`,skill:`Number Patterns`,question:`Look at this number pattern: 3, 7, 11, 15, 19, ___. What comes next?`,questionTh:`ดูแบบรูปตัวเลขนี้: 3, 7, 11, 15, 19, ___ ตัวเลขถัดไปคือเท่าไร?`,choices:[`23`,`22`,`24`,`25`,`21`],choicesTh:[`23`,`22`,`24`,`25`,`21`],correctAnswer:0,explanation:`Each number increases by exactly 4: 19 + 4 = 23.`,explanationTh:`แต่ละจำนวนเพิ่มขึ้นทีละ 4 เท่ากันทุกครั้ง: 19 + 4 = 23`,hint:`Find the constant gap between consecutive numbers.`,hintTh:`หาผลต่างที่คงที่ระหว่างจำนวนที่อยู่ติดกัน`,commonMistake:`Adding the wrong amount without checking that the gap is the same every time.`},{id:`v6t1-q3`,setId:1,section:`warmup`,questionNumber:3,points:3,difficulty:`moderate`,skill:`Arithmetic`,question:`Start with the number 15, then: add 8, multiply by 2, then subtract 6. What is the final result?`,questionTh:`เริ่มจากจำนวน 15 แล้วทำตามขั้นตอน: บวก 8, คูณ 2, แล้วลบ 6 ผลลัพธ์สุดท้ายคือเท่าไร?`,visual:{kind:`operation-chain`,props:{start:15,steps:[{op:`+`,value:8},{op:`×`,value:2},{op:`−`,value:6}]}},choices:[`40`,`38`,`42`,`46`,`36`],choicesTh:[`40`,`38`,`42`,`46`,`36`],correctAnswer:0,explanation:`15 + 8 = 23, then 23 × 2 = 46, then 46 − 6 = 40.`,explanationTh:`15 + 8 = 23, 23 × 2 = 46, 46 − 6 = 40`,explanationVisual:{kind:`operation-chain`,props:{start:15,steps:[{op:`+`,value:8},{op:`×`,value:2},{op:`−`,value:6}],revealFinal:!0}},hint:`Follow the chain one box at a time, left to right.`,hintTh:`ทำตามลูกศรทีละขั้น จากซ้ายไปขวา`,commonMistake:`Doing the operations in the wrong order, e.g. multiplying before adding.`},{id:`v6t1-q4`,setId:1,section:`warmup`,questionNumber:4,points:3,difficulty:`moderate`,skill:`Time`,question:`Nan's birthday is on a Tuesday this year. What day of the week will it be 23 days later?`,questionTh:`วันเกิดของน้ำหนึ่งปีนี้ตรงกับวันอังคาร อีก 23 วันข้างหน้าจะตรงกับวันอะไร?`,choices:[`Thursday`,`Wednesday`,`Friday`,`Monday`,`Saturday`],choicesTh:[`วันพฤหัสบดี`,`วันพุธ`,`วันศุกร์`,`วันจันทร์`,`วันเสาร์`],correctAnswer:0,explanation:`23 ÷ 7 = 3 remainder 2, so 23 days later is the same weekday as 2 days later. Tuesday + 2 = Thursday.`,explanationTh:`23 ÷ 7 = 3 เศษ 2 ดังนั้น 23 วันข้างหน้าเหมือนกับอีก 2 วันข้างหน้า วันอังคาร + 2 วัน = วันพฤหัสบดี`,hint:`Divide the number of days by 7 and look only at the remainder.`,hintTh:`หารจำนวนวันด้วย 7 แล้วดูเฉพาะเศษที่เหลือ`,commonMistake:`Counting all 23 days one by one instead of using the remainder after dividing by 7.`},{id:`v6t1-q5`,setId:1,section:`warmup`,questionNumber:5,points:3,difficulty:`moderate`,skill:`Visual Patterns`,question:`This pattern repeats in a cycle of 4: 🔴, 🔵, 🟡, 🟢, then repeats the same way forever. What color is the 20th shape in this pattern?`,questionTh:`แบบรูปนี้วนซ้ำเป็นชุดสี่แบบ: 🔴, 🔵, 🟡, 🟢 แล้ววนซ้ำแบบเดิมไปเรื่อยๆ รูปที่ 20 ในแบบรูปนี้คือสีอะไร?`,visual:{kind:`repeating-strip`,props:{cycle:[`🔴`,`🔵`,`🟡`,`🟢`],displayCount:9}},choices:[`🟢`,`🔴`,`🔵`,`🟡`,`Cannot tell`],choicesTh:[`🟢`,`🔴`,`🔵`,`🟡`,`บอกไม่ได้`],correctAnswer:0,explanation:`The pattern repeats every 4 shapes: 🔴, 🔵, 🟡, 🟢. 20 ÷ 4 = 5 remainder 0. A remainder of 0 means position 20 lands exactly on the LAST shape in the cycle, which is 🟢.`,explanationTh:`แบบรูปวนซ้ำทุก 4 รูป: 🔴,🔵,🟡,🟢 นำ 20 ÷ 4 = 5 เศษ 0 การที่เศษเป็น 0 หมายความว่าตำแหน่งนั้นตรงกับรูปสุดท้ายในชุด นั่นคือ 🟢`,hint:`Divide the position number by the cycle length (4) and look at the remainder.`,hintTh:`นำตำแหน่งหารด้วยความยาวของชุดที่วนซ้ำ (4) แล้วดูเศษที่เหลือ`,commonMistake:`Treating remainder 0 as meaning 'the first shape' instead of 'the last shape in the cycle.'`},{id:`v6t1-q6`,setId:1,section:`warmup`,questionNumber:6,points:3,difficulty:`moderate`,skill:`Visual Patterns`,question:`Look at how the star moves from one grid to the next. Where will the star be in the next grid?`,questionTh:`ดูว่าดาวเคลื่อนที่จากภาพหนึ่งไปอีกภาพอย่างไร ภาพถัดไปดาวจะอยู่ตำแหน่งไหน?`,visual:{kind:`icon-grid-sequence`,props:{rows:3,cols:3,frames:[[{icon:`⭐`,position:[0,0]}],[{icon:`⭐`,position:[1,1]}]]}},choices:[`Bottom-right corner`,`Bottom row, middle column`,`Middle row, right column`,`Top row, right column`,`Bottom-left corner`],choicesTh:[`มุมล่างขวา`,`แถวล่าง คอลัมน์กลาง`,`แถวกลาง คอลัมน์ขวา`,`แถวบน คอลัมน์ขวา`,`มุมล่างซ้าย`],choiceVisuals:[{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`⭐`,position:[2,2]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`⭐`,position:[2,1]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`⭐`,position:[1,2]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`⭐`,position:[0,2]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`⭐`,position:[2,0]}]}}],correctAnswer:0,explanation:`The star moves one row down and one column right each time: (row 0, col 0) → (row 1, col 1) → (row 2, col 2), which is the bottom-right corner.`,explanationTh:`ดาวเลื่อนลง 1 ช่องและไปทางขวา 1 ช่องทุกครั้ง: (แถว0,คอลัมน์0) → (แถว1,คอลัมน์1) → (แถว2,คอลัมน์2) ซึ่งคือมุมล่างขวา`,hint:`Compare how far the star moves in rows and in columns each time.`,hintTh:`เปรียบเทียบว่าดาวเลื่อนแถวและคอลัมน์ไปเท่าไรในแต่ละครั้ง`,commonMistake:`Only tracking the row (or only the column) instead of both directions of movement.`},{id:`v6t1-q7`,setId:1,section:`warmup`,questionNumber:7,points:3,difficulty:`comfortable`,skill:`Data Interpretation`,question:`The bar graph shows how many books each class read in one week. What is the total number of books read by all 5 classes?`,questionTh:`แผนภูมิแท่งแสดงจำนวนหนังสือที่แต่ละห้องอ่านได้ในหนึ่งสัปดาห์ ทั้ง 5 ห้องอ่านหนังสือรวมกันทั้งหมดกี่เล่ม?`,visual:{kind:`bar-graph`,props:{categories:[{label:`Mon`,value:5},{label:`Tue`,value:3},{label:`Wed`,value:6},{label:`Thu`,value:4},{label:`Fri`,value:2}],yMax:8,yStep:2,unit:`books`}},choices:[`20`,`18`,`22`,`19`,`21`],choicesTh:[`20`,`18`,`22`,`19`,`21`],correctAnswer:0,explanation:`5 + 3 + 6 + 4 + 2 = 20 books.`,explanationTh:`5 + 3 + 6 + 4 + 2 = 20 เล่ม`,hint:`Add up the height of every bar.`,hintTh:`บวกความสูงของแท่งกราฟทุกแท่งเข้าด้วยกัน`,commonMistake:`Missing a bar or misreading a bar height off the scale.`},{id:`v6t1-q8`,setId:1,section:`warmup`,questionNumber:8,points:3,difficulty:`moderate`,skill:`Geometry`,question:`The shape below is made of three identical squares, each with side length 3 cm, joined edge to edge. What is the perimeter of the whole shape?`,questionTh:`รูปด้านล่างประกอบจากสี่เหลี่ยมจัตุรัส 3 รูปที่เหมือนกัน แต่ละรูปมีด้านยาว 3 เซนติเมตร นำมาต่อกัน เส้นรอบรูปของรูปทั้งหมดยาวเท่าไร?`,visual:{kind:`perimeter-shape`,props:{squareSide:3,cells:[[0,0],[0,1],[1,0]],unit:`cm`}},choices:[`24`,`21`,`27`,`18`,`30`],choicesTh:[`24`,`21`,`27`,`18`,`30`],correctAnswer:0,explanation:`The shape has 8 outer edges, each 3 cm long — the two shared inner edges are hidden inside the shape and don't count. 8 × 3 = 24 cm.`,explanationTh:`รูปนี้มีด้านรอบนอกทั้งหมด 8 ด้าน แต่ละด้านยาว 3 ซม. (ด้านที่ชนกันตรงกลาง 2 ด้านซ่อนอยู่ข้างในและไม่นับ) 8 × 3 = 24 ซม.`,explanationVisual:{kind:`perimeter-shape`,props:{squareSide:3,cells:[[0,0],[0,1],[1,0]],unit:`cm`,highlightOuterOnly:!0}},hint:`Count only the edges on the outside of the whole shape.`,hintTh:`นับเฉพาะด้านที่อยู่รอบนอกของรูปทั้งหมด ด้านที่ชนกันระหว่างสี่เหลี่ยมจะซ่อนอยู่ข้างใน`,commonMistake:`Counting every edge of every square (4×3=12) without removing the 2 shared inner edges.`},{id:`v6t1-q9`,setId:1,section:`warmup`,questionNumber:9,points:3,difficulty:`moderate`,skill:`Problem Solving`,question:`Beam has 42 marbles and Nok has 18 marbles. If Beam gives some marbles to Nok so that they both end up with the same number, how many marbles does Beam give away?`,questionTh:`บีมมีลูกแก้ว 42 เม็ด และนกมีลูกแก้ว 18 เม็ด ถ้าบีมแบ่งลูกแก้วให้นกจนทั้งสองคนมีลูกแก้วเท่ากัน บีมต้องให้ลูกแก้วนกกี่เม็ด?`,choices:[`12`,`10`,`14`,`15`,`8`],choicesTh:[`12`,`10`,`14`,`15`,`8`],correctAnswer:0,explanation:`Total marbles = 42 + 18 = 60. Equal share = 60 ÷ 2 = 30 each. Beam must give 42 − 30 = 12 marbles to Nok.`,explanationTh:`ลูกแก้วรวมทั้งหมด = 42 + 18 = 60 เม็ด แบ่งเท่าๆ กัน = 60 ÷ 2 = 30 เม็ด บีมต้องให้ 42 − 30 = 12 เม็ด`,hint:`Find the total first, then split it evenly in half.`,hintTh:`หาผลรวมทั้งหมดก่อน แล้วแบ่งครึ่งให้เท่ากัน`,commonMistake:`Giving away half of Beam's own marbles (21) instead of the amount needed to make both totals equal.`},{id:`v6t1-q10`,setId:1,section:`warmup`,questionNumber:10,points:3,difficulty:`moderate`,skill:`Time`,question:`Buses leave the station every 15 minutes, and the first bus leaves at 7:00 a.m. What time does the 6th bus leave?`,questionTh:`รถบัสออกจากสถานีทุก 15 นาที โดยคันแรกออกเวลา 7:00 น. คันที่ 6 จะออกเวลาใด?`,visual:{kind:`timeline`,props:{startLabel:`7:00`,intervalMinutes:15,count:6}},choices:[`8:15 a.m.`,`8:00 a.m.`,`8:30 a.m.`,`7:45 a.m.`,`8:45 a.m.`],choicesTh:[`8:15 น.`,`8:00 น.`,`8:30 น.`,`7:45 น.`,`8:45 น.`],correctAnswer:0,explanation:`The 6th bus is 5 intervals after the 1st (not 6), since the 1st bus is already at 7:00. 5 × 15 = 75 minutes = 1 hour 15 minutes. 7:00 + 1:15 = 8:15 a.m.`,explanationTh:`คันที่ 6 ห่างจากคันแรกเพียง 5 ช่วงเวลา (ไม่ใช่ 6 ช่วง) เพราะคันแรกคือคันที่ 1 อยู่แล้ว 5 × 15 = 75 นาที = 1 ชั่วโมง 15 นาที 7:00 + 1:15 = 8:15 น.`,explanationVisual:{kind:`timeline`,props:{startLabel:`7:00`,intervalMinutes:15,count:6,highlightIndex:6}},hint:`The first bus is already bus #1 — count only the gaps that come after it.`,hintTh:`คันแรกคือคันที่ 1 อยู่แล้ว ให้นับเฉพาะช่วงเวลาที่ตามหลังคันแรก`,commonMistake:`Multiplying 6 × 15 = 90 minutes instead of using only 5 gaps after the first bus.`},{id:`v6t1-q11`,setId:1,section:`speedup`,questionNumber:11,points:5,difficulty:`moderate`,skill:`Problem Solving`,question:`Fah is 3 times as old as her brother Ice. In 4 years, Fah will be twice as old as Ice. How old is Fah now?`,questionTh:`ฟ้ามีอายุมากกว่าน้องชายไอซ์ 3 เท่า อีก 4 ปีข้างหน้า ฟ้าจะมีอายุมากกว่าไอซ์ 2 เท่า ปัจจุบันฟ้าอายุเท่าไร?`,choices:[`12`,`9`,`15`,`8`,`16`],choicesTh:[`12`,`9`,`15`,`8`,`16`],correctAnswer:0,explanation:`Let Ice's age now = x, so Fah = 3x. In 4 years: 3x + 4 = 2(x + 4) → 3x + 4 = 2x + 8 → x = 4. Fah is now 3 × 4 = 12.`,explanationTh:`ให้ไอซ์อายุ = x ดังนั้นฟ้าอายุ = 3x อีก 4 ปีข้างหน้า: 3x+4 = 2(x+4) → 3x+4 = 2x+8 → x = 4 ฟ้าอายุปัจจุบัน = 3×4 = 12 ปี`,hint:`Write Fah's age in terms of Ice's age now, then write the 'in 4 years' equation.`,hintTh:`เขียนอายุฟ้าในรูปของอายุไอซ์ก่อน แล้วเขียนสมการของ "อีก 4 ปีข้างหน้า"`,commonMistake:`Applying the ×3 or ×2 ratio directly without first adding 4 years to both ages.`},{id:`v6t1-q12`,setId:1,section:`speedup`,questionNumber:12,points:5,difficulty:`moderate`,skill:`Logical Reasoning`,question:`Ben starts with the number 18 and follows the flowchart below. What number does he end with?`,questionTh:`เบนเริ่มจากจำนวน 18 แล้วทำตามผังงานด้านล่าง ผลลัพธ์สุดท้ายคือเท่าไร?`,visual:{kind:`flowchart`,props:{start:18,question1:`Is the number even?`,yes1:{op:`÷`,value:2},no1:{op:`+`,value:1},question2:`Is the result greater than 12?`,yes2:{op:`−`,value:5},no2:{op:`×`,value:3}}},choices:[`27`,`13`,`4`,`22`,`9`],choicesTh:[`27`,`13`,`4`,`22`,`9`],correctAnswer:0,explanation:`18 is even, so follow YES: 18 ÷ 2 = 9. Is 9 greater than 12? No, so follow NO: 9 × 3 = 27.`,explanationTh:`18 เป็นเลขคู่ จึงไปทาง YES: 18 ÷ 2 = 9 ถามว่า 9 มากกว่า 12 หรือไม่? ไม่ใช่ จึงไปทาง NO: 9 × 3 = 27`,explanationVisual:{kind:`flowchart`,props:{start:18,question1:`Is the number even?`,yes1:{op:`÷`,value:2},no1:{op:`+`,value:1},question2:`Is the result greater than 12?`,yes2:{op:`−`,value:5},no2:{op:`×`,value:3},path:[`yes`,`no`]}},hint:`Answer each question about the CURRENT number at that step, not the original starting number.`,hintTh:`ตอบคำถามแต่ละข้อโดยดูจากจำนวนปัจจุบันในขั้นตอนนั้น ไม่ใช่จำนวนเริ่มต้น`,commonMistake:`Checking whether the ORIGINAL number (18) is greater than 12 at the second question, instead of the number produced after step one (9).`},{id:`v6t1-q13`,setId:1,section:`speedup`,questionNumber:13,points:5,difficulty:`moderate`,skill:`Arithmetic`,question:`A printer prints 45 pages in 5 minutes at a steady speed. How many pages can it print in 12 minutes?`,questionTh:`เครื่องพิมพ์พิมพ์ได้ 45 แผ่นใน 5 นาที ด้วยความเร็วคงที่ ใน 12 นาที เครื่องนี้จะพิมพ์ได้กี่แผ่น?`,choices:[`108`,`100`,`90`,`117`,`96`],choicesTh:[`108`,`100`,`90`,`117`,`96`],correctAnswer:0,explanation:`45 ÷ 5 = 9 pages per minute. 9 × 12 = 108 pages.`,explanationTh:`45 ÷ 5 = 9 แผ่นต่อนาที 9 × 12 = 108 แผ่น`,hint:`First find how many pages are printed in ONE minute.`,hintTh:`หาก่อนว่าใน 1 นาทีพิมพ์ได้กี่แผ่น`,commonMistake:`Multiplying 45 × 12 directly instead of finding the per-minute rate first.`},{id:`v6t1-q14`,setId:1,section:`speedup`,questionNumber:14,points:5,difficulty:`moderate`,skill:`Problem Solving`,question:`The picture shows a 4×4 tiled floor. The marked squares (?) still need tiles. Light tiles cost 15 baht each and dark tiles cost 25 baht each. What is the total cost to tile all 4 marked squares?`,questionTh:`ภาพแสดงพื้นกระเบื้อง 4×4 ช่อง ช่องที่มีเครื่องหมาย (?) ยังไม่ได้ปูกระเบื้อง กระเบื้องสีอ่อนราคาช่องละ 15 บาท กระเบื้องสีเข้มราคาช่องละ 25 บาท ต้องใช้เงินทั้งหมดเท่าไรเพื่อปูกระเบื้อง 4 ช่องที่มีเครื่องหมาย?`,visual:{kind:`checkerboard`,props:{rows:4,cols:4,blanks:[[0,1],[1,2],[2,0],[3,3]],lightCost:15,darkCost:25}},choices:[`80`,`90`,`70`,`100`,`60`],choicesTh:[`80`,`90`,`70`,`100`,`60`],correctAnswer:0,explanation:`Of the 4 marked squares, 2 sit on light squares (2×15=30) and 2 sit on dark squares (2×25=50), using the checkerboard rule that a square is dark when (row+column) is even. Total = 30 + 50 = 80 baht.`,explanationTh:`ใน 4 ช่องที่มีเครื่องหมาย มี 2 ช่องเป็นสีอ่อน (2×15=30) และ 2 ช่องเป็นสีเข้ม (2×25=50) รวมทั้งหมด = 30+50 = 80 บาท`,explanationVisual:{kind:`checkerboard`,props:{rows:4,cols:4,blanks:[[0,1],[1,2],[2,0],[3,3]],lightCost:15,darkCost:25,revealCosts:!0}},hint:`Work out which marked squares are light and which are dark, then add the two costs separately.`,hintTh:`ดูก่อนว่าช่องที่มีเครื่องหมายแต่ละช่องเป็นสีอ่อนหรือสีเข้มตามลายกระดานหมากรุก แล้วจึงบวกราคาแยกกัน`,commonMistake:`Assuming all 4 marked squares cost the same instead of checking each one against the checkerboard pattern.`},{id:`v6t1-q15`,setId:1,section:`speedup`,questionNumber:15,points:5,difficulty:`challenging`,skill:`Logical Reasoning`,question:`Using the two clues below, find the value of one 🧁 (cupcake).`,questionTh:`ใช้เงื่อนไขสองข้อด้านล่างนี้ หาค่าของ 🧁 (คัพเค้ก) หนึ่งชิ้น`,visual:{kind:`picture-equation`,props:{clues:[{left:[{icon:`🍩`,count:2},{icon:`🧁`,count:1}],rightValue:16},{left:[{icon:`🍩`,count:1},{icon:`🧁`,count:3}],rightValue:13}]}},choices:[`2`,`3`,`4`,`1`,`5`],choicesTh:[`2`,`3`,`4`,`1`,`5`],correctAnswer:0,explanation:`From Clue 1: 🧁 = 16 − 2×🍩. Substitute into Clue 2: 🍩 + 3×(16 − 2×🍩) = 13 → 🍩 + 48 − 6🍩 = 13 → −5🍩 = −35 → 🍩 = 7. Then 🧁 = 16 − 2×7 = 2.`,explanationTh:`จากเงื่อนไข 1: 🧁 = 16 − 2×🍩 แทนค่าในเงื่อนไข 2: 🍩+3×(16−2×🍩)=13 → 🍩+48−6🍩=13 → −5🍩=−35 → 🍩=7 ดังนั้น 🧁=16−2×7=2`,hint:`Use one clue to write 🧁 in terms of 🍩, then substitute into the other clue.`,hintTh:`ใช้เงื่อนไขหนึ่งเขียน 🧁 ในรูปของ 🍩 ก่อน แล้วแทนค่าลงในอีกเงื่อนไขหนึ่ง`,commonMistake:`Assuming each icon has a fixed 'default' value instead of solving the two clues together.`},{id:`v6t1-q16`,setId:1,section:`challenge`,questionNumber:16,points:7,difficulty:`challenging`,skill:`Visual Patterns`,question:`Look at the square-grid pattern below. How many small squares are in figure 6 of this pattern?`,questionTh:`ดูแบบรูปตารางสี่เหลี่ยมจัตุรัสด้านล่าง รูปที่ 6 ในแบบรูปนี้จะมีสี่เหลี่ยมเล็กๆ กี่ช่อง?`,visual:{kind:`growing-pattern`,props:{groups:[2,3,4,5],shape:`square-grid`}},choices:[`49`,`42`,`45`,`54`,`36`],choicesTh:[`49`,`42`,`45`,`54`,`36`],correctAnswer:0,explanation:`Each figure is a square grid whose side length is one more than the figure number: figure 1 → 2×2, figure 2 → 3×3, figure 3 → 4×4, figure 4 → 5×5 ... figure 6 → 7×7 = 49 small squares.`,explanationTh:`แต่ละรูปเป็นตารางสี่เหลี่ยมจัตุรัสที่มีด้านยาวเพิ่มขึ้นเรื่อยๆ โดยรูปที่ k มีด้านยาว (k+1) ช่อง: รูปที่ 1 → 2×2, รูปที่ 2 → 3×3, ... รูปที่ 6 → 7×7 = 49 ช่อง`,hint:`Find how the side length grows from one figure to the next, then apply that rule to figure 6.`,hintTh:`หาว่าความยาวด้านของตารางสี่เหลี่ยมเพิ่มขึ้นจากรูปหนึ่งไปอีกรูปอย่างไร แล้วนำกฎนั้นไปใช้กับรูปที่ 6`,commonMistake:`Assuming figure 6 has side length 6 (36 squares) instead of noticing the side length is always one more than the figure number.`},{id:`v6t1-q17`,setId:1,section:`challenge`,questionNumber:17,points:7,difficulty:`challenging`,skill:`Spatial Reasoning`,question:`The tile shown is made of 3 small squares joined in an L-shape. You may use as many copies of this tile as you like, and you may rotate them, but they cannot overlap or leave gaps. Which of these could NOT be built using only copies of this tile?`,questionTh:`แผ่นกระเบื้องรูปตัวหนึ่งประกอบด้วยสี่เหลี่ยมเล็ก 3 ช่องเรียงเป็นรูปตัว L (ดังภาพ) คุณสามารถใช้แผ่นกระเบื้องนี้กี่แผ่นก็ได้ หมุนได้ แต่ห้ามซ้อนทับหรือมีช่องว่าง พื้นที่ใดต่อไปนี้ "ไม่สามารถ" ปูให้เต็มพอดีได้?`,visual:{kind:`tiling-puzzle`,props:{tileCells:[[0,0],[1,0],[1,1]],targets:[]}},choices:[`A region of 6 squares`,`A region of 9 squares`,`A region of 12 squares`,`A region of 15 squares`,`A region of 7 squares`],choicesTh:[`พื้นที่ 6 ช่อง`,`พื้นที่ 9 ช่อง`,`พื้นที่ 12 ช่อง`,`พื้นที่ 15 ช่อง`,`พื้นที่ 7 ช่อง`],correctAnswer:4,explanation:`Every tile covers exactly 3 small squares, so any region built only from whole copies of this tile must have an area that is a multiple of 3. 6, 9, 12, and 15 are all multiples of 3 (2, 3, 4, and 5 tiles), but 7 is NOT a multiple of 3, so a 7-square region can never be built this way — no matter how the tiles are rotated or arranged.`,explanationTh:`กระเบื้องแต่ละแผ่นปิดพื้นที่ 3 ช่องเสมอ ดังนั้นพื้นที่รวมของรูปที่ปูด้วยกระเบื้องนี้เท่านั้นต้องเป็นจำนวนที่หารด้วย 3 ลงตัว 6, 9, 12 และ 15 ล้วนหารด้วย 3 ลงตัว (ใช้ 2, 3, 4 และ 5 แผ่นตามลำดับ) แต่ 7 หารด้วย 3 ไม่ลงตัว จึงไม่มีทางปูพื้นที่ 7 ช่องให้พอดีได้ไม่ว่าจะหมุนหรือจัดวางอย่างไร`,hint:`Every tile always covers exactly 3 squares — what do all the possible total areas have in common?`,hintTh:`กระเบื้องแต่ละแผ่นปิดพื้นที่ 3 ช่องเสมอ พื้นที่รวมทั้งหมดที่เป็นไปได้มีอะไรที่เหมือนกัน?`,commonMistake:`Trying to picture whether the L-shape 'looks like it fits' instead of using the rule that the total area must be a multiple of 3.`},{id:`v6t1-q18`,setId:1,section:`challenge`,questionNumber:18,points:7,difficulty:`challenging`,skill:`Logical Reasoning`,question:`The three balance scales below compare the weights of 4 fruits. Put the four fruits in order from heaviest to lightest.`,questionTh:`ตาชั่งสามอันด้านล่างเปรียบเทียบน้ำหนักผลไม้ 4 ชนิด เรียงลำดับผลไม้จากหนักที่สุดไปเบาที่สุด`,visual:{kind:`balance-scale-set`,props:{scales:[{left:[`🍉`],right:[`🍊`],tilt:`left`},{left:[`🍊`],right:[`🍋`],tilt:`left`},{left:[`🍋`],right:[`🍏`],tilt:`left`}]}},choices:[`🍉 > 🍊 > 🍋 > 🍏`,`🍊 > 🍉 > 🍋 > 🍏`,`🍉 > 🍋 > 🍊 > 🍏`,`🍏 > 🍋 > 🍊 > 🍉`,`🍉 > 🍊 > 🍏 > 🍋`],choicesTh:[`🍉 > 🍊 > 🍋 > 🍏`,`🍊 > 🍉 > 🍋 > 🍏`,`🍉 > 🍋 > 🍊 > 🍏`,`🍏 > 🍋 > 🍊 > 🍉`,`🍉 > 🍊 > 🍏 > 🍋`],correctAnswer:0,explanation:`Scale 1 shows 🍉 is heavier than 🍊. Scale 2 shows 🍊 is heavier than 🍋. Scale 3 shows 🍋 is heavier than 🍏. Chaining the three clues together: 🍉 > 🍊 > 🍋 > 🍏.`,explanationTh:`ตาชั่งที่ 1 แสดงว่า 🍉 หนักกว่า 🍊 ตาชั่งที่ 2 แสดงว่า 🍊 หนักกว่า 🍋 ตาชั่งที่ 3 แสดงว่า 🍋 หนักกว่า 🍏 เมื่อนำมาต่อกัน: 🍉 > 🍊 > 🍋 > 🍏`,hint:`Chain the three clues together, from heaviest down to lightest.`,hintTh:`นำเงื่อนไขทั้งสามมาต่อกันตามลำดับ จากหนักที่สุดไปเบาที่สุด`,commonMistake:`Guessing an order from how the fruits "look" instead of tracing each tilt direction one clue at a time.`},{id:`v6t1-q19`,setId:1,section:`challenge`,questionNumber:19,points:7,difficulty:`challenging`,skill:`Spatial Reasoning`,question:`The picture shows the front view of a cube tower Wei built, with each column showing its height. How many unit cubes did Wei use in total?`,questionTh:`ภาพแสดงมุมมองด้านหน้าของหอคอยลูกบาศก์ที่เว่ยสร้างขึ้น แต่ละแท่งแสดงความสูงของแต่ละแถว เว่ยใช้ลูกบาศก์ทั้งหมดกี่ก้อน?`,visual:{kind:`cube-stack`,props:{heights:[5,2,7,3,6,1,4]}},choices:[`28`,`26`,`30`,`25`,`32`],choicesTh:[`28`,`26`,`30`,`25`,`32`],correctAnswer:0,explanation:`Add every column height: 5 + 2 + 7 + 3 + 6 + 1 + 4 = 28.`,explanationTh:`บวกความสูงของทั้ง 7 แท่งเข้าด้วยกัน: 5+2+7+3+6+1+4 = 28`,explanationVisual:{kind:`cube-stack`,props:{heights:[5,2,7,3,6,1,4],revealTotal:!0}},hint:`Add all seven numbers carefully — try grouping some to make tens.`,hintTh:`บวกตัวเลขทั้งเจ็ดจำนวนอย่างละเอียด ลองจับกลุ่มให้ครบสิบ (เช่น 5+2+3=10) เพื่อไม่ให้พลาด`,commonMistake:`Skipping a column or double-counting one while adding a longer list of numbers.`},{id:`v6t1-q20`,setId:1,section:`challenge`,questionNumber:20,points:7,difficulty:`challenging`,skill:`Geometry`,question:`The picture shows a crab made only from straight lines (its round eyes and its curved legs are NOT made of straight lines, so they should not be counted). How many triangles of ANY size can you count in the picture in total?`,questionTh:`ภาพแสดงปูที่วาดจากเส้นตรงเท่านั้น (ตาที่กลมและขาที่โค้งไม่ได้สร้างจากเส้นตรง จึงไม่ต้องนับ) มีรูปสามเหลี่ยมทุกขนาดรวมกันทั้งหมดกี่รูปในภาพนี้?`,visual:{kind:`shape-count-crab`,props:{highlight:!1}},choices:[`6`,`7`,`8`,`9`,`10`],choicesTh:[`6`,`7`,`8`,`9`,`10`],correctAnswer:2,explanation:`The shell marking is one big triangle split by two lines from its top corner into 3 sections, giving 3+2+1=6 triangles (the 3 small ones, the 2 pairs that combine, and the whole shell). Each claw is 1 more standalone triangle, and there are 2 claws. Total: 6 + 2 = 8 triangles. (The round eyes and the curved leg lines never form triangles.)`,explanationTh:`ลายบนกระดองเป็นรูปสามเหลี่ยมใหญ่ที่ถูกแบ่งด้วยเส้น 2 เส้นจากมุมบนออกเป็น 3 ส่วน ทำให้ได้ 3+2+1=6 รูปสามเหลี่ยม (รูปเล็ก 3 รูป + รูปที่รวมกัน 2 คู่ + รูปทั้งหมด 1 รูป) ก้ามปูแต่ละข้างเป็นรูปสามเหลี่ยมเดี่ยวอีก 1 รูป มี 2 ก้าม รวมทั้งหมด: 6 + 2 = 8 รูป (ตากลมและขาที่เป็นเส้นโค้งไม่ทำให้เกิดรูปสามเหลี่ยม)`,explanationVisual:{kind:`shape-count-crab`,props:{highlight:!0}},hint:`Count the small triangles inside the shell first, then the pairs that combine into bigger triangles, then add the claws.`,hintTh:`นับรูปสามเหลี่ยมเล็กในกระดองก่อน จากนั้นนับรูปที่รวมกันเป็นรูปใหญ่ขึ้น แล้วจึงบวกก้ามปูทั้งสองข้าง`,commonMistake:`Only counting the 3 smallest triangles inside the shell (or forgetting the 2 claws), and missing the 2 larger combined triangles and the whole-shell triangle.`}],$n=[{id:`v6t2-q1`,setId:2,section:`warmup`,questionNumber:1,points:3,difficulty:`comfortable`,skill:`Number Patterns`,question:`Look at this number pattern: 100, 91, 82, 73, 64, ___. What comes next?`,questionTh:`ดูแบบรูปตัวเลขนี้: 100, 91, 82, 73, 64, ___ ตัวเลขถัดไปคือเท่าไร?`,choices:[`55`,`54`,`56`,`63`,`46`],choicesTh:[`55`,`54`,`56`,`63`,`46`],correctAnswer:0,explanation:`Each number decreases by exactly 9: 64 − 9 = 55.`,explanationTh:`แต่ละจำนวนลดลงทีละ 9 เท่ากันทุกครั้ง: 64 − 9 = 55`,hint:`Find the constant gap between consecutive numbers — this time it decreases.`,hintTh:`หาผลต่างที่คงที่ระหว่างจำนวนที่อยู่ติดกัน (ครั้งนี้เป็นการลดลง)`,commonMistake:`Assuming the pattern must increase and adding 9 instead of subtracting.`},{id:`v6t2-q2`,setId:2,section:`warmup`,questionNumber:2,points:3,difficulty:`comfortable`,skill:`Data Interpretation`,question:`A bookshop recorded its sales in the pictograph below. How many more books were sold on Thursday than on Friday?`,questionTh:`ร้านหนังสือบันทึกยอดขายหนังสือเป็นแผนภาพภาพดังรูป วันพฤหัสบดีขายหนังสือได้มากกว่าวันศุกร์กี่เล่ม?`,visual:{kind:`pictograph-multi`,props:{legend:[{icon:`📕`,value:6},{icon:`📗`,value:4},{icon:`📘`,value:9}],rows:[{label:`Mon`,icons:[{icon:`📕`,count:2}]},{label:`Tue`,icons:[{icon:`📗`,count:3}]},{label:`Wed`,icons:[{icon:`📘`,count:1},{icon:`📕`,count:1}]},{label:`Thu`,icons:[{icon:`📘`,count:2}]},{label:`Fri`,icons:[{icon:`📕`,count:1},{icon:`📗`,count:2}]}]}},choices:[`4`,`6`,`5`,`3`,`2`],choicesTh:[`4`,`6`,`5`,`3`,`2`],correctAnswer:0,explanation:`Thursday = 2📘 (2×9=18). Friday = 1📕(6) + 2📗(8) = 14. Difference: 18 − 14 = 4.`,explanationTh:`วันพฤหัสบดี = 2📘 (2×9=18) วันศุกร์ = 1📕(6)+2📗(8)=14 ผลต่าง: 18−14=4`,hint:`Convert each day's pictures into real book counts using the key before subtracting.`,hintTh:`แปลงจำนวนรูปภาพของแต่ละวันเป็นจำนวนหนังสือจริงโดยใช้ตัวเลขในคำอธิบายสัญลักษณ์ก่อนจะลบกัน`,commonMistake:`Subtracting the number of pictures (2 vs 3) instead of the real book counts.`},{id:`v6t2-q3`,setId:2,section:`warmup`,questionNumber:3,points:3,difficulty:`moderate`,skill:`Time`,question:`Today is Friday. What day of the week was it 17 days ago?`,questionTh:`วันนี้เป็นวันศุกร์ ย้อนไป 17 วันก่อนหน้านี้เป็นวันอะไร?`,choices:[`Tuesday`,`Monday`,`Wednesday`,`Thursday`,`Saturday`],choicesTh:[`วันอังคาร`,`วันจันทร์`,`วันพุธ`,`วันพฤหัสบดี`,`วันเสาร์`],correctAnswer:0,explanation:`17 ÷ 7 = 2 remainder 3, so 17 days ago is the same weekday as 3 days before today. Friday − 3 = Tuesday.`,explanationTh:`17 ÷ 7 = 2 เศษ 3 ดังนั้น 17 วันก่อนเหมือนกับการนับถอยหลัง 3 วันจากวันนี้ วันศุกร์ − 3 วัน = วันอังคาร`,hint:`Divide by 7 and use only the remainder, then count backwards that many days.`,hintTh:`หารด้วย 7 แล้วใช้เฉพาะเศษ จากนั้นนับถอยหลังตามจำนวนเศษนั้น`,commonMistake:`Counting forward instead of backward, or forgetting to use only the remainder.`},{id:`v6t2-q4`,setId:2,section:`warmup`,questionNumber:4,points:3,difficulty:`moderate`,skill:`Arithmetic`,question:`Start with the number 6, then: multiply by 5, add 9, then divide by 3. What is the final result?`,questionTh:`เริ่มจากจำนวน 6 แล้วทำตามขั้นตอน: คูณ 5, บวก 9, แล้วหาร 3 ผลลัพธ์สุดท้ายคือเท่าไร?`,visual:{kind:`operation-chain`,props:{start:6,steps:[{op:`×`,value:5},{op:`+`,value:9},{op:`÷`,value:3}]}},choices:[`13`,`12`,`14`,`15`,`11`],choicesTh:[`13`,`12`,`14`,`15`,`11`],correctAnswer:0,explanation:`6 × 5 = 30, then 30 + 9 = 39, then 39 ÷ 3 = 13.`,explanationTh:`6×5=30, 30+9=39, 39÷3=13`,explanationVisual:{kind:`operation-chain`,props:{start:6,steps:[{op:`×`,value:5},{op:`+`,value:9},{op:`÷`,value:3}],revealFinal:!0}},hint:`Follow each operation in order, left to right.`,hintTh:`ทำตามลูกศรทีละขั้น จากซ้ายไปขวา`,commonMistake:`Doing a later step before an earlier one, instead of following the chain in order.`},{id:`v6t2-q5`,setId:2,section:`warmup`,questionNumber:5,points:3,difficulty:`moderate`,skill:`Visual Patterns`,question:`Look at how the moon moves from one grid to the next. Where will the moon be in the next grid?`,questionTh:`ดูว่าดวงจันทร์เคลื่อนที่จากภาพหนึ่งไปอีกภาพอย่างไร ภาพถัดไปดวงจันทร์จะอยู่ตำแหน่งไหน?`,visual:{kind:`icon-grid-sequence`,props:{rows:3,cols:3,frames:[[{icon:`🌙`,position:[0,2]}],[{icon:`🌙`,position:[1,1]}]]}},choices:[`Bottom-left corner`,`Bottom row, middle column`,`Middle row, left column`,`Top-left corner`,`Bottom-right corner`],choicesTh:[`มุมล่างซ้าย`,`แถวล่าง คอลัมน์กลาง`,`แถวกลาง คอลัมน์ซ้าย`,`มุมบนซ้าย`,`มุมล่างขวา`],choiceVisuals:[{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🌙`,position:[2,0]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🌙`,position:[2,1]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🌙`,position:[1,0]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🌙`,position:[0,0]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🌙`,position:[2,2]}]}}],correctAnswer:0,explanation:`The moon moves one row down and one column left each time: (row 0, col 2) → (row 1, col 1) → (row 2, col 0), the bottom-left corner.`,explanationTh:`ดวงจันทร์เลื่อนลง 1 ช่องและไปทางซ้าย 1 ช่องทุกครั้ง: (แถว0,คอลัมน์2)→(แถว1,คอลัมน์1)→(แถว2,คอลัมน์0) ซึ่งคือมุมล่างซ้าย`,hint:`Track both the row shift and the column shift together.`,hintTh:`ติดตามทั้งแถวและคอลัมน์ไปพร้อมกัน`,commonMistake:`Only tracking one direction (row or column) instead of both.`},{id:`v6t2-q6`,setId:2,section:`warmup`,questionNumber:6,points:3,difficulty:`moderate`,skill:`Visual Patterns`,question:`This pattern repeats in a cycle of 3: 🟦, 🟧, 🟪, then repeats the same way forever. What shape is in position 26?`,questionTh:`แบบรูปนี้วนซ้ำเป็นชุดสามแบบ: 🟦, 🟧, 🟪 แล้ววนซ้ำไปเรื่อยๆ ตำแหน่งที่ 26 ในแบบรูปนี้คือรูปอะไร?`,visual:{kind:`repeating-strip`,props:{cycle:[`🟦`,`🟧`,`🟪`],displayCount:9}},choices:[`🟧`,`🟦`,`🟪`,`Cannot tell`,`🟩`],choicesTh:[`🟧`,`🟦`,`🟪`,`บอกไม่ได้`,`🟩`],correctAnswer:0,explanation:`The cycle repeats every 3 shapes: 🟦, 🟧, 🟪. (26 − 1) ÷ 3 = 25 ÷ 3 = 8 remainder 1, and remainder 1 corresponds to the 2nd shape in the cycle, 🟧.`,explanationTh:`ชุดวนซ้ำทุก 3 รูป: 🟦,🟧,🟪 ตำแหน่งที่ 26: (26−1) ÷ 3 = 25÷3 = 8 เศษ 1 เศษ 1 ตรงกับรูปที่ 2 ในชุด คือ 🟧`,hint:`Subtract 1 from the position number first, then divide by the cycle length (3) and look at the remainder.`,hintTh:`ลบ 1 จากตำแหน่งก่อน แล้วจึงหารด้วยความยาวชุด (3) และดูเศษที่เหลือ`,commonMistake:`Dividing the position number directly by 3 without subtracting 1 first, which shifts every answer by one position.`},{id:`v6t2-q7`,setId:2,section:`warmup`,questionNumber:7,points:3,difficulty:`moderate`,skill:`Geometry`,question:`The shape below is made of four identical squares, each with side length 4 cm, joined edge to edge in a T-shape. What is the perimeter of the whole shape?`,questionTh:`รูปด้านล่างประกอบจากสี่เหลี่ยมจัตุรัส 4 รูปที่เหมือนกัน แต่ละรูปมีด้านยาว 4 เซนติเมตร ต่อกันเป็นรูปตัว T เส้นรอบรูปของรูปทั้งหมดยาวเท่าไร?`,visual:{kind:`perimeter-shape`,props:{squareSide:4,cells:[[0,1],[1,0],[1,1],[1,2]],unit:`cm`}},choices:[`40`,`36`,`44`,`32`,`48`],choicesTh:[`40`,`36`,`44`,`32`,`48`],correctAnswer:0,explanation:`The shape has 10 outer edges, each 4 cm long (3 shared inner edges, hidden inside, are not counted). 10 × 4 = 40 cm.`,explanationTh:`รูปนี้มีด้านรอบนอก 10 ด้าน แต่ละด้านยาว 4 ซม. (ด้านที่ชนกัน 3 คู่ซ่อนอยู่ข้างในไม่นับ) 10×4=40 ซม.`,explanationVisual:{kind:`perimeter-shape`,props:{squareSide:4,cells:[[0,1],[1,0],[1,1],[1,2]],unit:`cm`,highlightOuterOnly:!0}},hint:`Count only the outside edges of the whole T-shape.`,hintTh:`นับเฉพาะด้านรอบนอกของรูปตัว T ทั้งหมด`,commonMistake:`Counting all 16 edges of the four separate squares without removing the 6 hidden shared edges.`},{id:`v6t2-q8`,setId:2,section:`warmup`,questionNumber:8,points:3,difficulty:`comfortable`,skill:`Data Interpretation`,question:`The bar graph shows how many medals each team won. What is the total number of medals won by all 5 teams?`,questionTh:`แผนภูมิแท่งแสดงจำนวนเหรียญรางวัลที่แต่ละทีมได้รับ ทั้ง 5 ทีมได้เหรียญรวมกันทั้งหมดกี่เหรียญ?`,visual:{kind:`bar-graph`,props:{categories:[{label:`A`,value:7},{label:`B`,value:4},{label:`C`,value:9},{label:`D`,value:2},{label:`E`,value:6}],yMax:10,yStep:2,unit:`medals`}},choices:[`28`,`26`,`30`,`24`,`32`],choicesTh:[`28`,`26`,`30`,`24`,`32`],correctAnswer:0,explanation:`7 + 4 + 9 + 2 + 6 = 28 medals.`,explanationTh:`7+4+9+2+6=28 เหรียญ`,hint:`Add up all five bar heights.`,hintTh:`บวกความสูงของแท่งกราฟทั้งห้าแท่งเข้าด้วยกัน`,commonMistake:`Misreading one bar's height against the scale.`},{id:`v6t2-q9`,setId:2,section:`warmup`,questionNumber:9,points:3,difficulty:`moderate`,skill:`Time`,question:`Trains arrive at a platform every 12 minutes, and the first train arrives at 9:05 a.m. What time does the 7th train arrive?`,questionTh:`รถไฟเข้าสถานีทุก 12 นาที โดยขบวนแรกมาถึงเวลา 9:05 น. ขบวนที่ 7 จะมาถึงเวลาใด?`,visual:{kind:`timeline`,props:{startLabel:`9:05`,intervalMinutes:12,count:7}},choices:[`10:17 a.m.`,`10:05 a.m.`,`10:29 a.m.`,`9:57 a.m.`,`10:41 a.m.`],choicesTh:[`10:17 น.`,`10:05 น.`,`10:29 น.`,`9:57 น.`,`10:41 น.`],correctAnswer:0,explanation:`The 7th train is 6 gaps after the 1st. 6 × 12 = 72 minutes = 1 hour 12 minutes. 9:05 + 1:12 = 10:17 a.m.`,explanationTh:`ขบวนที่ 7 ห่างจากขบวนแรก 6 ช่วงเวลา 6×12=72 นาที=1 ชั่วโมง 12 นาที 9:05+1:12=10:17 น.`,explanationVisual:{kind:`timeline`,props:{startLabel:`9:05`,intervalMinutes:12,count:7,highlightIndex:7}},hint:`Count only the gaps AFTER the first train — the 7th train has 6 gaps, not 7.`,hintTh:`นับเฉพาะช่วงเวลาที่ตามหลังขบวนแรก ขบวนที่ 7 มี 6 ช่วง ไม่ใช่ 7 ช่วง`,commonMistake:`Multiplying 7 × 12 = 84 minutes instead of using only 6 gaps.`},{id:`v6t2-q10`,setId:2,section:`warmup`,questionNumber:10,points:3,difficulty:`moderate`,skill:`Problem Solving`,question:`Two tanks hold water: Tank A has 85 liters and Tank B has 35 liters. How many liters of water must be poured from Tank A into Tank B so that Tank A has exactly 10 liters more than Tank B?`,questionTh:`ถังน้ำสองใบ: ถัง A มีน้ำ 85 ลิตร และถัง B มีน้ำ 35 ลิตร ต้องเทน้ำจากถัง A ไปยังถัง B กี่ลิตร เพื่อให้ถัง A มีน้ำมากกว่าถัง B อยู่ 10 ลิตร?`,choices:[`20`,`15`,`25`,`10`,`30`],choicesTh:[`20`,`15`,`25`,`10`,`30`],correctAnswer:0,explanation:`Let x = liters poured. A becomes 85 − x, B becomes 35 + x. We need 85 − x = (35 + x) + 10 → 85 − x = 45 + x → 40 = 2x → x = 20.`,explanationTh:`ให้ x คือลิตรที่เท ถัง A จะเหลือ 85−x ถัง B จะได้ 35+x ต้องการให้ 85−x = (35+x)+10 → 85−x=45+x → 40=2x → x=20`,hint:`Set up an equation: Tank A's new amount equals Tank B's new amount plus 10.`,hintTh:`ตั้งสมการ: ปริมาณใหม่ของถัง A เท่ากับปริมาณใหม่ของถัง B บวก 10`,commonMistake:`Finding half the difference between the two tanks (25) without accounting for the required 10-liter gap afterward.`},{id:`v6t2-q11`,setId:2,section:`speedup`,questionNumber:11,points:5,difficulty:`moderate`,skill:`Logical Reasoning`,question:`Start with the number 27 and follow the flowchart below. What number do you end with?`,questionTh:`เริ่มจากจำนวน 27 แล้วทำตามผังงานด้านล่าง ผลลัพธ์สุดท้ายคือเท่าไร?`,visual:{kind:`flowchart`,props:{start:27,question1:`Is the number a multiple of 3?`,yes1:{op:`÷`,value:3},no1:{op:`+`,value:2},question2:`Is the result less than 10?`,yes2:{op:`×`,value:4},no2:{op:`−`,value:3}}},choices:[`36`,`12`,`6`,`33`,`30`],choicesTh:[`36`,`12`,`6`,`33`,`30`],correctAnswer:0,explanation:`27 is a multiple of 3, so YES: 27 ÷ 3 = 9. Is 9 less than 10? Yes, so YES: 9 × 4 = 36.`,explanationTh:`27 หารด้วย 3 ลงตัว จึงไปทาง YES: 27÷3=9 ถามว่า 9 น้อยกว่า 10 หรือไม่? ใช่ จึงไปทาง YES: 9×4=36`,explanationVisual:{kind:`flowchart`,props:{start:27,question1:`Is the number a multiple of 3?`,yes1:{op:`÷`,value:3},no1:{op:`+`,value:2},question2:`Is the result less than 10?`,yes2:{op:`×`,value:4},no2:{op:`−`,value:3},path:[`yes`,`yes`]}},hint:`Check divisibility by 3 carefully, then re-evaluate the SECOND question using the new number, not the original.`,hintTh:`ตรวจสอบว่าหารด้วย 3 ลงตัวหรือไม่อย่างละเอียด แล้วตอบคำถามที่สองโดยใช้จำนวนใหม่ ไม่ใช่จำนวนเดิม`,commonMistake:`Checking whether the ORIGINAL number (27) is less than 10 at the second question, instead of the number produced by step one (9).`},{id:`v6t2-q12`,setId:2,section:`speedup`,questionNumber:12,points:5,difficulty:`moderate`,skill:`Problem Solving`,question:`Ploy is 4 times as old as her cousin Gap. 6 years ago, Ploy was 7 times as old as Gap. How old is Gap now?`,questionTh:`พลอยมีอายุมากกว่าลูกพี่ลูกน้องชื่อกัป 4 เท่า เมื่อ 6 ปีก่อน พลอยมีอายุมากกว่ากัป 7 เท่า ปัจจุบันกัปอายุเท่าไร?`,choices:[`12`,`9`,`8`,`15`,`10`],choicesTh:[`12`,`9`,`8`,`15`,`10`],correctAnswer:0,explanation:`Let Gap's age now = x, so Ploy = 4x. 6 years ago: 4x − 6 = 7(x − 6) → 4x − 6 = 7x − 42 → 36 = 3x → x = 12.`,explanationTh:`ให้กัปอายุปัจจุบัน = x พลอยอายุ = 4x เมื่อ 6 ปีก่อน: 4x−6 = 7(x−6) → 4x−6=7x−42 → 36=3x → x=12`,hint:`Write both ages 6 years ago in terms of x, then set up the ratio equation.`,hintTh:`เขียนอายุทั้งสองคนเมื่อ 6 ปีก่อนในรูปของ x ก่อน แล้วตั้งสมการอัตราส่วน`,commonMistake:`Forgetting to subtract 6 from BOTH ages when writing the 'years ago' equation.`},{id:`v6t2-q13`,setId:2,section:`speedup`,questionNumber:13,points:5,difficulty:`moderate`,skill:`Problem Solving`,question:`The picture shows a 5×5 tiled floor. The marked squares (?) still need tiles. Light tiles cost 12 baht each and dark tiles cost 20 baht each. What is the total cost to tile all 5 marked squares?`,questionTh:`ภาพแสดงพื้นกระเบื้อง 5×5 ช่อง ช่องที่มีเครื่องหมาย (?) ยังไม่ได้ปูกระเบื้อง กระเบื้องสีอ่อนราคาช่องละ 12 บาท กระเบื้องสีเข้มราคาช่องละ 20 บาท ต้องใช้เงินทั้งหมดเท่าไรเพื่อปูกระเบื้อง 5 ช่องที่มีเครื่องหมาย?`,visual:{kind:`checkerboard`,props:{rows:5,cols:5,blanks:[[0,0],[0,1],[2,3],[3,3],[4,1]],lightCost:12,darkCost:20}},choices:[`76`,`80`,`72`,`84`,`68`],choicesTh:[`76`,`80`,`72`,`84`,`68`],correctAnswer:0,explanation:`Of the 5 marked squares, 3 are light (3×12=36) and 2 are dark (2×20=40). Total = 36 + 40 = 76 baht.`,explanationTh:`ใน 5 ช่องที่มีเครื่องหมาย มี 3 ช่องเป็นสีอ่อน (3×12=36) และ 2 ช่องเป็นสีเข้ม (2×20=40) รวม=36+40=76 บาท`,explanationVisual:{kind:`checkerboard`,props:{rows:5,cols:5,blanks:[[0,0],[0,1],[2,3],[3,3],[4,1]],lightCost:12,darkCost:20,revealCosts:!0}},hint:`Check each marked square's position against the checkerboard pattern before adding costs.`,hintTh:`ตรวจสอบตำแหน่งของแต่ละช่องที่มีเครื่องหมายกับลายกระดานหมากรุกก่อนบวกราคา`,commonMistake:`Assuming there must be an equal number of light and dark squares among the marked ones.`},{id:`v6t2-q14`,setId:2,section:`speedup`,questionNumber:14,points:5,difficulty:`moderate`,skill:`Arithmetic`,question:`A watering can fills 8 flower pots in 10 minutes at a steady rate. How many flower pots can it fill in 25 minutes?`,questionTh:`บัวรดน้ำรดต้นไม้ได้ 8 กระถางใน 10 นาที ด้วยอัตราคงที่ ใน 25 นาที จะรดน้ำได้กี่กระถาง?`,choices:[`20`,`18`,`22`,`16`,`24`],choicesTh:[`20`,`18`,`22`,`16`,`24`],correctAnswer:0,explanation:`8 ÷ 10 = 0.8 pots per minute. 0.8 × 25 = 20 pots.`,explanationTh:`8÷10=0.8 กระถางต่อนาที 0.8×25=20 กระถาง`,hint:`Find the rate per minute first — it may not be a whole number, and that is OK.`,hintTh:`หาอัตราต่อนาทีก่อน (ไม่จำเป็นต้องเป็นจำนวนเต็ม)`,commonMistake:`Multiplying 8 × 25 directly instead of finding the per-minute rate first.`},{id:`v6t2-q15`,setId:2,section:`speedup`,questionNumber:15,points:5,difficulty:`challenging`,skill:`Logical Reasoning`,question:`Using the two clues below, find the value of one 🍭 (lollipop).`,questionTh:`ใช้เงื่อนไขสองข้อด้านล่างนี้ หาค่าของ 🍭 (อมยิ้ม) หนึ่งอัน`,visual:{kind:`picture-equation`,props:{clues:[{left:[{icon:`🍭`,count:3},{icon:`🍬`,count:1}],rightValue:19},{left:[{icon:`🍭`,count:1},{icon:`🍬`,count:2}],rightValue:13}]}},choices:[`5`,`4`,`3`,`6`,`7`],choicesTh:[`5`,`4`,`3`,`6`,`7`],correctAnswer:0,explanation:`From Clue 1: 🍬 = 19 − 3×🍭. Substitute into Clue 2: 🍭 + 2×(19 − 3×🍭) = 13 → 🍭 + 38 − 6🍭 = 13 → −5🍭 = −25 → 🍭 = 5.`,explanationTh:`จากเงื่อนไข 1: 🍬=19−3×🍭 แทนค่าในเงื่อนไข 2: 🍭+2×(19−3×🍭)=13 → 🍭+38−6🍭=13 → −5🍭=−25 → 🍭=5`,hint:`Use one clue to write 🍬 in terms of 🍭, then substitute into the other clue.`,hintTh:`ใช้เงื่อนไขหนึ่งเขียน 🍬 ในรูปของ 🍭 ก่อน แล้วแทนค่าลงในอีกเงื่อนไขหนึ่ง`,commonMistake:`Guessing small numbers by trial and error instead of solving the two clues algebraically.`},{id:`v6t2-q16`,setId:2,section:`challenge`,questionNumber:16,points:7,difficulty:`challenging`,skill:`Spatial Reasoning`,question:`The tile shown is a 2×2 square made of 4 small squares. You may use as many copies of this tile as you like, and you may rotate them, but they cannot overlap or leave gaps. Which of these could NOT be built using only copies of this tile?`,questionTh:`แผ่นกระเบื้องรูปหนึ่งเป็นสี่เหลี่ยมจัตุรัสขนาด 2×2 ช่อง (รวม 4 ช่องเล็ก ดังภาพ) คุณสามารถใช้แผ่นกระเบื้องนี้กี่แผ่นก็ได้ หมุนได้ แต่ห้ามซ้อนทับหรือมีช่องว่าง พื้นที่ใดต่อไปนี้ "ไม่สามารถ" ปูให้เต็มพอดีได้?`,visual:{kind:`tiling-puzzle`,props:{tileCells:[[0,0],[0,1],[1,0],[1,1]],targets:[]}},choices:[`A region of 8 squares`,`A region of 12 squares`,`A region of 16 squares`,`A region of 20 squares`,`A region of 10 squares`],choicesTh:[`พื้นที่ 8 ช่อง`,`พื้นที่ 12 ช่อง`,`พื้นที่ 16 ช่อง`,`พื้นที่ 20 ช่อง`,`พื้นที่ 10 ช่อง`],correctAnswer:4,explanation:`Every tile covers exactly 4 small squares, so any region built only from whole copies of this tile must have an area that is a multiple of 4. 8, 12, 16, and 20 are all multiples of 4, but 10 is NOT a multiple of 4 (10÷4 is not a whole number), so a 10-square region can never be built this way.`,explanationTh:`กระเบื้องแต่ละแผ่นปิดพื้นที่ 4 ช่องเสมอ (บล็อก 2×2) ดังนั้นพื้นที่รวมต้องหารด้วย 4 ลงตัว 8,12,16 และ 20 ล้วนหารด้วย 4 ลงตัว แต่ 10 หารด้วย 4 ไม่ลงตัว จึงไม่มีทางปูพื้นที่ 10 ช่องให้พอดีได้`,hint:`Every tile always covers exactly 4 squares — what must be true about the total area?`,hintTh:`กระเบื้องแต่ละแผ่นปิดพื้นที่ 4 ช่องเสมอ พื้นที่รวมทั้งหมดต้องเป็นอย่างไร?`,commonMistake:`Trying to picture whether the square tile 'looks like it fits' instead of using the rule that the total area must be a multiple of 4.`},{id:`v6t2-q17`,setId:2,section:`challenge`,questionNumber:17,points:7,difficulty:`challenging`,skill:`Logical Reasoning`,question:`The three balance scales below compare the weights of 4 fruits. Put the four fruits in order from heaviest to lightest.`,questionTh:`ตาชั่งสามอันด้านล่างเปรียบเทียบน้ำหนักผลไม้ 4 ชนิด เรียงลำดับผลไม้จากหนักที่สุดไปเบาที่สุด`,visual:{kind:`balance-scale-set`,props:{scales:[{left:[`🥭`],right:[`🍑`],tilt:`left`},{left:[`🍑`],right:[`🍒`],tilt:`left`},{left:[`🍒`],right:[`🥑`],tilt:`left`}]}},choices:[`🥭 > 🍑 > 🍒 > 🥑`,`🍑 > 🥭 > 🍒 > 🥑`,`🥭 > 🍒 > 🍑 > 🥑`,`🥑 > 🍒 > 🍑 > 🥭`,`🥭 > 🍑 > 🥑 > 🍒`],choicesTh:[`🥭 > 🍑 > 🍒 > 🥑`,`🍑 > 🥭 > 🍒 > 🥑`,`🥭 > 🍒 > 🍑 > 🥑`,`🥑 > 🍒 > 🍑 > 🥭`,`🥭 > 🍑 > 🥑 > 🍒`],correctAnswer:0,explanation:`Scale 1: 🥭 heavier than 🍑. Scale 2: 🍑 heavier than 🍒. Scale 3: 🍒 heavier than 🥑. Chained together: 🥭 > 🍑 > 🍒 > 🥑.`,explanationTh:`ตาชั่งที่ 1: 🥭 หนักกว่า 🍑 ตาชั่งที่ 2: 🍑 หนักกว่า 🍒 ตาชั่งที่ 3: 🍒 หนักกว่า 🥑 เมื่อนำมาต่อกัน: 🥭 > 🍑 > 🍒 > 🥑`,hint:`Chain the three clues together, from heaviest down to lightest.`,hintTh:`นำเงื่อนไขทั้งสามมาต่อกันตามลำดับ จากหนักที่สุดไปเบาที่สุด`,commonMistake:`Assuming the fruit shown in the most clues must be heaviest or lightest, without tracing each tilt direction.`},{id:`v6t2-q18`,setId:2,section:`challenge`,questionNumber:18,points:7,difficulty:`challenging`,skill:`Geometry`,question:`The picture shows a bird made only from straight lines (the beak and eye are not made of straight lines, so do not count them). How many triangles of any size can you count in total?`,questionTh:`ภาพแสดงนกที่วาดจากเส้นตรงเท่านั้น (ปากและตาไม่ได้สร้างจากเส้นตรง) มีรูปสามเหลี่ยมทุกขนาดรวมกันทั้งหมดกี่รูป?`,visual:{kind:`shape-count-bird`,props:{highlight:!1}},choices:[`5`,`4`,`6`,`7`,`3`],choicesTh:[`5`,`4`,`6`,`7`,`3`],correctAnswer:0,explanation:`The body is one triangle split by a centre line into 2 halves, plus the whole body triangle = 3. Each wing is 1 more standalone triangle, and there are 2 wings. Total: 3 + 2 = 5.`,explanationTh:`ลำตัวเป็นรูปสามเหลี่ยมที่ถูกแบ่งด้วยเส้นกึ่งกลางออกเป็น 2 ครึ่ง บวกกับรูปทั้งหมด = 3 รูป ปีกแต่ละข้างเป็นรูปสามเหลี่ยมเดี่ยวอีก 1 รูป มี 2 ปีก รวม: 3+2=5`,explanationVisual:{kind:`shape-count-bird`,props:{highlight:!0}},hint:`Count the body's small halves and the whole body triangle first, then add the two wings.`,hintTh:`นับรูปครึ่งลำตัวและรูปทั้งหมดก่อน แล้วจึงบวกปีกทั้งสองข้าง`,commonMistake:`Forgetting to count the WHOLE body triangle in addition to its two halves.`},{id:`v6t2-q19`,setId:2,section:`challenge`,questionNumber:19,points:7,difficulty:`challenging`,skill:`Spatial Reasoning`,question:`Nam built a two-row-deep tower using unit cubes: a FRONT row and a BACK row, one stack at each of 5 positions. The picture shows the tower from the front — at each position, you only see the TALLER of the front and back stacks (the shorter one is completely hidden behind or below it — no cube ever floats, and a hidden cube never disappears, it is simply not the tallest one at that position). Nam says the true heights of the front stacks are 3, 5, 2, 4, 6 and the true heights of the back stacks are 5, 3, 6, 2, 1 — matching the picture, since the taller of the two at each position is exactly what the picture shows. How many unit cubes did Nam use in total, counting BOTH the front row and the back row?`,questionTh:`น้ำสร้างหอคอยลูกบาศก์แบบสองแถวลึก: แถวหน้า และแถวหลัง อย่างละหนึ่งกองในแต่ละตำแหน่งจากทั้งหมด 5 ตำแหน่ง ภาพแสดงหอคอยที่มองจากด้านหน้า ซึ่งในแต่ละตำแหน่งจะเห็นเฉพาะกองที่ "สูงกว่า" ระหว่างแถวหน้ากับแถวหลัง (กองที่เตี้ยกว่าจะถูกบังจนมองไม่เห็นเลย ไม่มีลูกบาศก์ลอยได้ และลูกบาศก์ที่ถูกบังก็ไม่ได้หายไปไหน เพียงแต่ไม่ใช่กองที่สูงที่สุดในตำแหน่งนั้น) น้ำบอกว่าความสูงจริงของแถวหน้าคือ 3, 5, 2, 4, 6 และความสูงจริงของแถวหลังคือ 5, 3, 6, 2, 1 (ตรงกับภาพ เพราะกองที่สูงกว่าในแต่ละตำแหน่งเท่ากับค่าที่ภาพแสดงพอดี) น้ำใช้ลูกบาศก์ทั้งหมดกี่ก้อน นับทั้งแถวหน้าและแถวหลัง?`,visual:{kind:`cube-stack`,props:{heights:[5,5,6,4,6]}},choices:[`37`,`26`,`39`,`35`,`30`],choicesTh:[`37`,`26`,`39`,`35`,`30`],correctAnswer:0,explanation:`The picture only shows the taller stack at each position (5,5,6,4,6). Simply adding those visible numbers (5+5+6+4+6=26) misses every hidden shorter stack completely — a hidden cube is still part of the tower, just tucked behind or below the taller one, so it must still be counted. The true total is front + back: front=3+5+2+4+6=20, back=5+3+6+2+1=17. Total=20+17=37.`,explanationTh:`ภาพแสดงเฉพาะกองที่สูงกว่าในแต่ละตำแหน่ง (5,5,6,4,6) ถ้าบวกแค่ตัวเลขเหล่านี้ (5+5+6+4+6=26) จะพลาดกองที่ถูกบังไปทั้งหมด ลูกบาศก์ที่ถูกบังไม่ได้หายไปไหน มันยังคงอยู่ ถูกซ่อนอยู่ด้านหลังหรือด้านล่างกองที่สูงกว่าเท่านั้น จึงยังต้องนับรวมด้วย คำตอบที่แท้จริงคือ แถวหน้า+แถวหลัง: แถวหน้า=3+5+2+4+6=20 แถวหลัง=5+3+6+2+1=17 รวม=20+17=37`,explanationVisual:{kind:`cube-stack`,props:{heights:[3,5,2,4,6],revealTotal:!0}},hint:`The picture only shows the taller of the front/back stack at each position — the shorter one is still there, just hidden. Add BOTH rows.`,hintTh:`ภาพแสดงเฉพาะกองที่สูงกว่าระหว่างแถวหน้ากับแถวหลังในแต่ละตำแหน่ง กองที่เตี้ยกว่ายังคงอยู่ เพียงแต่ถูกบัง ให้บวกทั้งสองแถว ไม่ใช่แค่ส่วนที่มองเห็น`,commonMistake:`Adding only the visible silhouette heights (5+5+6+4+6=26) and forgetting that a shorter, completely hidden stack still exists at every position.`},{id:`v6t2-q20`,setId:2,section:`challenge`,questionNumber:20,points:7,difficulty:`challenging`,skill:`Visual Patterns`,question:`Each figure below is a square border frame (only the outer ring of squares is filled in, not the inside). If this pattern continues, how many squares would be in the frame where each side has 10 squares?`,questionTh:`แต่ละรูปด้านล่างเป็นกรอบสี่เหลี่ยมจัตุรัส (มีเฉพาะขอบรอบนอก ไม่มีสี่เหลี่ยมด้านใน) ถ้าแบบรูปนี้ดำเนินต่อไป กรอบที่มีด้านละ 10 ช่อง จะมีสี่เหลี่ยมเล็กกี่ช่อง?`,visual:{kind:`growing-pattern`,props:{groups:[3,4,5,6],shape:`border-frame`}},choices:[`36`,`40`,`32`,`44`,`30`],choicesTh:[`36`,`40`,`32`,`44`,`30`],correctAnswer:0,explanation:`Each frame's total follows the rule 4n − 4, where n is the number of squares along one side (multiplying 4n directly would double-count the 4 corners). For n = 10: 4×10 − 4 = 36.`,explanationTh:`ผลรวมของแต่ละกรอบเป็นไปตามกฎ 4n−4 โดย n คือจำนวนช่องในแต่ละด้าน (เพราะถ้าคูณ 4n ตรงๆ มุมทั้ง 4 จะถูกนับซ้ำ) เมื่อ n=10: 4×10−4=36`,hint:`Compare each frame's total to 4 times its side length — the pattern is always 4 less than that.`,hintTh:`เทียบผลรวมของแต่ละกรอบกับ 4 เท่าของความยาวด้าน จะเห็นว่าน้อยกว่าเสมออยู่ 4`,commonMistake:`Multiplying 4×10=40 without subtracting the 4 corners that would otherwise be counted twice.`}],er=[{id:`v6t3-q1`,setId:3,section:`warmup`,questionNumber:1,points:3,difficulty:`moderate`,skill:`Time`,question:`This year, Songkran Festival falls on a Sunday. What day of the week will it be 40 days later?`,questionTh:`ปีนี้วันสงกรานต์ตรงกับวันอาทิตย์ อีก 40 วันข้างหน้าจะตรงกับวันอะไร?`,choices:[`Friday`,`Thursday`,`Saturday`,`Wednesday`,`Monday`],choicesTh:[`วันศุกร์`,`วันพฤหัสบดี`,`วันเสาร์`,`วันพุธ`,`วันจันทร์`],correctAnswer:0,explanation:`40 ÷ 7 = 5 remainder 5, so 40 days later is the same weekday as 5 days later. Sunday + 5 = Friday.`,explanationTh:`40÷7=5 เศษ5 ดังนั้น 40 วันข้างหน้าเหมือนกับอีก 5 วันข้างหน้า วันอาทิตย์+5วัน=วันศุกร์`,hint:`Divide by 7 and use only the remainder.`,hintTh:`หารด้วย 7 แล้วใช้เฉพาะเศษที่เหลือ`,commonMistake:`Miscounting the order of weekdays when adding the remainder.`},{id:`v6t3-q2`,setId:3,section:`warmup`,questionNumber:2,points:3,difficulty:`comfortable`,skill:`Number Patterns`,question:`Look at this number pattern: 5, 11, 23, 47, 95, ___. What comes next?`,questionTh:`ดูแบบรูปตัวเลขนี้: 5, 11, 23, 47, 95, ___ ตัวเลขถัดไปคือเท่าไร?`,choices:[`191`,`190`,`189`,`192`,`188`],choicesTh:[`191`,`190`,`189`,`192`,`188`],correctAnswer:0,explanation:`Each number is double the previous number, plus 1: 95 × 2 + 1 = 191.`,explanationTh:`แต่ละจำนวนเกิดจากนำจำนวนก่อนหน้าคูณ 2 แล้วบวก 1: 95×2+1=191`,hint:`Try doubling each number and adding 1.`,hintTh:`ลองคูณแต่ละจำนวนด้วย 2 แล้วบวก 1 ดูว่าตรงกับจำนวนถัดไปหรือไม่`,commonMistake:`Only checking the gaps between numbers instead of noticing the simpler doubling-plus-1 rule.`},{id:`v6t3-q3`,setId:3,section:`warmup`,questionNumber:3,points:3,difficulty:`comfortable`,skill:`Data Interpretation`,question:`A stationery shop recorded its sales in the pictograph below. How many more items were sold on Wednesday than on Friday?`,questionTh:`ร้านเครื่องเขียนบันทึกยอดขายเป็นแผนภาพภาพดังรูป วันพุธขายเครื่องเขียนได้มากกว่าวันศุกร์กี่ชิ้น?`,visual:{kind:`pictograph-multi`,props:{legend:[{icon:`✏️`,value:4},{icon:`📏`,value:8},{icon:`📐`,value:6}],rows:[{label:`Mon`,icons:[{icon:`✏️`,count:2},{icon:`📏`,count:1}]},{label:`Tue`,icons:[{icon:`📐`,count:1},{icon:`✏️`,count:1}]},{label:`Wed`,icons:[{icon:`📏`,count:3}]},{label:`Thu`,icons:[{icon:`✏️`,count:1},{icon:`📐`,count:1},{icon:`📏`,count:1}]},{label:`Fri`,icons:[{icon:`📐`,count:2}]}]}},choices:[`12`,`10`,`14`,`8`,`16`],choicesTh:[`12`,`10`,`14`,`8`,`16`],correctAnswer:0,explanation:`Wednesday = 3📏 (3×8=24). Friday = 2📐 (2×6=12). Difference: 24 − 12 = 12.`,explanationTh:`วันพุธ=3📏(3×8=24) วันศุกร์=2📐(2×6=12) ผลต่าง:24−12=12`,hint:`Convert pictures to real item counts using the key before subtracting.`,hintTh:`แปลงรูปภาพเป็นจำนวนจริงโดยใช้ตัวเลขในคำอธิบายสัญลักษณ์ก่อนจะลบกัน`,commonMistake:`Comparing the number of pictures (3 vs 2) instead of the real item counts.`},{id:`v6t3-q4`,setId:3,section:`warmup`,questionNumber:4,points:3,difficulty:`moderate`,skill:`Visual Patterns`,question:`This pattern repeats in a cycle of 5: 🍎, 🍌, 🍊, 🍇, 🍉, then repeats the same way forever. What fruit is in position 33?`,questionTh:`แบบรูปนี้วนซ้ำเป็นชุดห้าแบบ: 🍎, 🍌, 🍊, 🍇, 🍉 แล้ววนซ้ำไปเรื่อยๆ ตำแหน่งที่ 33 คือผลไม้อะไร?`,visual:{kind:`repeating-strip`,props:{cycle:[`🍎`,`🍌`,`🍊`,`🍇`,`🍉`],displayCount:11}},choices:[`🍊`,`🍎`,`🍌`,`🍇`,`🍉`],choicesTh:[`🍊`,`🍎`,`🍌`,`🍇`,`🍉`],correctAnswer:0,explanation:`The cycle repeats every 5 fruits: 🍎,🍌,🍊,🍇,🍉. (33−1) ÷ 5 = 32 ÷ 5 = 6 remainder 2, and remainder 2 corresponds to the 3rd fruit in the cycle, 🍊.`,explanationTh:`ชุดวนซ้ำทุก 5 รูป: 🍎,🍌,🍊,🍇,🍉 (33−1)÷5=32÷5=6 เศษ2 เศษ2 ตรงกับผลไม้ลำดับที่ 3 ในชุด คือ 🍊`,hint:`Subtract 1 from the position, divide by the cycle length (5), and look at the remainder.`,hintTh:`ลบ 1 จากตำแหน่งก่อน หารด้วยความยาวชุด (5) แล้วดูเศษที่เหลือ`,commonMistake:`Forgetting to subtract 1 before dividing, which shifts the answer by one position.`},{id:`v6t3-q5`,setId:3,section:`warmup`,questionNumber:5,points:3,difficulty:`moderate`,skill:`Arithmetic`,question:`The diagram shows a chain of operations. The starting number is hidden, but every result along the way is shown. What is the missing starting number?`,questionTh:`แผนภาพแสดงลำดับการดำเนินการ จำนวนเริ่มต้นถูกซ่อนไว้ แต่ผลลัพธ์ในทุกขั้นตอนแสดงให้เห็น จำนวนเริ่มต้นที่หายไปคือเท่าไร?`,visual:{kind:`operation-chain`,props:{start:10,steps:[{op:`×`,value:4},{op:`−`,value:6},{op:`+`,value:8}],hideStart:!0}},choices:[`10`,`9`,`11`,`12`,`8`],choicesTh:[`10`,`9`,`11`,`12`,`8`],correctAnswer:0,explanation:`Work backward from the first shown result: since start × 4 = 40, start = 40 ÷ 4 = 10. (Check: 10×4=40, 40−6=34, 34+8=42 ✓, matching every shown number.)`,explanationTh:`ย้อนกลับจากผลลัพธ์แรกที่แสดง: เนื่องจากเริ่มต้น×4=40 จึงได้ เริ่มต้น=40÷4=10 (ตรวจสอบ: 10×4=40, 40−6=34, 34+8=42 ✓ ตรงกับทุกตัวเลขที่แสดง)`,hint:`Use the very first shown result together with its operation to work backward to the missing start.`,hintTh:`ใช้ผลลัพธ์แรกที่แสดงพร้อมกับการดำเนินการของมัน แล้วย้อนกลับเพื่อหาจำนวนเริ่มต้นที่ซ่อนไว้`,commonMistake:`Trying to work backward through every operation from the LAST number instead of noticing the first shown result already reveals the start.`},{id:`v6t3-q6`,setId:3,section:`warmup`,questionNumber:6,points:3,difficulty:`moderate`,skill:`Geometry`,question:`The shape below is made of four identical squares, each with side length 5 cm, joined edge to edge in an S-shape. What is the perimeter of the whole shape?`,questionTh:`รูปด้านล่างประกอบจากสี่เหลี่ยมจัตุรัส 4 รูปที่เหมือนกัน แต่ละรูปมีด้านยาว 5 เซนติเมตร ต่อกันเป็นรูปตัว S เส้นรอบรูปของรูปทั้งหมดยาวเท่าไร?`,visual:{kind:`perimeter-shape`,props:{squareSide:5,cells:[[0,1],[0,2],[1,0],[1,1]],unit:`cm`}},choices:[`50`,`45`,`55`,`40`,`60`],choicesTh:[`50`,`45`,`55`,`40`,`60`],correctAnswer:0,explanation:`The shape has 10 outer edges, each 5 cm long (3 shared inner edges are hidden inside). 10 × 5 = 50 cm.`,explanationTh:`รูปนี้มีด้านรอบนอก 10 ด้าน แต่ละด้านยาว 5 ซม. (ด้านที่ชนกัน 3 คู่ซ่อนอยู่ข้างในไม่นับ) 10×5=50 ซม.`,explanationVisual:{kind:`perimeter-shape`,props:{squareSide:5,cells:[[0,1],[0,2],[1,0],[1,1]],unit:`cm`,highlightOuterOnly:!0}},hint:`Count only the outside edges of the whole S-shape.`,hintTh:`นับเฉพาะด้านรอบนอกของรูปตัว S ทั้งหมด`,commonMistake:`Counting all 16 edges of the four separate squares without removing the 6 hidden shared edges.`},{id:`v6t3-q7`,setId:3,section:`warmup`,questionNumber:7,points:3,difficulty:`moderate`,skill:`Visual Patterns`,question:`Look at how the bee moves from one grid to the next. Where will the bee be in the next grid?`,questionTh:`ดูว่าผึ้งเคลื่อนที่จากภาพหนึ่งไปอีกภาพอย่างไร ภาพถัดไปผึ้งจะอยู่ตำแหน่งไหน?`,visual:{kind:`icon-grid-sequence`,props:{rows:3,cols:3,frames:[[{icon:`🐝`,position:[2,0]}],[{icon:`🐝`,position:[1,1]}]]}},choices:[`Top row, right column`,`Top row, middle column`,`Middle row, right column`,`Top-left corner`,`Bottom-right corner`],choicesTh:[`แถวบน คอลัมน์ขวา`,`แถวบน คอลัมน์กลาง`,`แถวกลาง คอลัมน์ขวา`,`มุมบนซ้าย`,`มุมล่างขวา`],choiceVisuals:[{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🐝`,position:[0,2]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🐝`,position:[0,1]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🐝`,position:[1,2]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🐝`,position:[0,0]}]}},{kind:`icon-grid-sequence`,props:{rows:3,cols:3,choiceFrame:[{icon:`🐝`,position:[2,2]}]}}],correctAnswer:0,explanation:`The bee moves one row up and one column right each time: (row 2, col 0) → (row 1, col 1) → (row 0, col 2), the top row, right column.`,explanationTh:`ผึ้งเลื่อนขึ้น 1 ช่องและไปทางขวา 1 ช่องทุกครั้ง: (แถว2,คอลัมน์0)→(แถว1,คอลัมน์1)→(แถว0,คอลัมน์2) ซึ่งคือแถวบน คอลัมน์ขวา`,hint:`Compare the row and column shift each time.`,hintTh:`เปรียบเทียบว่าผึ้งเลื่อนแถวและคอลัมน์ไปเท่าไรในแต่ละครั้ง`,commonMistake:`Only tracking one direction of movement instead of both.`},{id:`v6t3-q8`,setId:3,section:`warmup`,questionNumber:8,points:3,difficulty:`moderate`,skill:`Problem Solving`,question:`Three friends have stickers: Add has 25, Bua has 13, and Cee has 40. They want to redistribute all the stickers so every friend ends up with the same number. How many stickers does Cee give away in total?`,questionTh:`เพื่อนสามคนมีสติกเกอร์: แอดมี 25 ชิ้น บัวมี 13 ชิ้น และซีมี 40 ชิ้น พวกเขาต้องการแบ่งสติกเกอร์ทั้งหมดใหม่ให้แต่ละคนมีเท่ากัน ซีต้องให้สติกเกอร์ไปทั้งหมดกี่ชิ้น?`,choices:[`14`,`13`,`15`,`12`,`16`],choicesTh:[`14`,`13`,`15`,`12`,`16`],correctAnswer:0,explanation:`Total stickers = 25+13+40 = 78. Equal share = 78 ÷ 3 = 26 each. Cee currently has 40, so Cee gives away 40 − 26 = 14.`,explanationTh:`สติกเกอร์รวม=25+13+40=78 แบ่งเท่าๆกัน=78÷3=26 ชิ้นต่อคน ซีมีอยู่ 40 ชิ้น จึงต้องให้ 40−26=14 ชิ้น`,hint:`Find the total, divide by the number of friends, then compare to what each person currently has.`,hintTh:`หาผลรวมทั้งหมดก่อน หารด้วยจำนวนเพื่อน แล้วเทียบกับจำนวนที่แต่ละคนมีอยู่ในปัจจุบัน`,commonMistake:`Comparing Cee to only one other friend instead of the equal three-way share.`},{id:`v6t3-q9`,setId:3,section:`warmup`,questionNumber:9,points:3,difficulty:`comfortable`,skill:`Data Interpretation`,question:`The bar graph shows how many votes each color received. What is the total number of votes for all 5 colors?`,questionTh:`แผนภูมิแท่งแสดงจำนวนคะแนนโหวตแต่ละสี ทั้งหมดรวมกันได้กี่คะแนน?`,visual:{kind:`bar-graph`,props:{categories:[{label:`Red`,value:8},{label:`Blue`,value:5},{label:`Green`,value:3},{label:`Yellow`,value:7},{label:`Purple`,value:2}],yMax:10,yStep:2,unit:`votes`}},choices:[`25`,`24`,`26`,`23`,`27`],choicesTh:[`25`,`24`,`26`,`23`,`27`],correctAnswer:0,explanation:`8 + 5 + 3 + 7 + 2 = 25 votes.`,explanationTh:`8+5+3+7+2=25 คะแนน`,hint:`Add up all five bar heights.`,hintTh:`บวกความสูงของแท่งกราฟทั้งห้าแท่งเข้าด้วยกัน`,commonMistake:`Missing a bar or misreading one bar's value.`},{id:`v6t3-q10`,setId:3,section:`warmup`,questionNumber:10,points:3,difficulty:`moderate`,skill:`Time`,question:`Ferries leave the pier every 20 minutes, and the first ferry leaves at 8:10 a.m. What time does the 5th ferry leave?`,questionTh:`เรือข้ามฟากออกจากท่าทุก 20 นาที โดยลำแรกออกเวลา 8:10 น. ลำที่ 5 จะออกเวลาใด?`,visual:{kind:`timeline`,props:{startLabel:`8:10`,intervalMinutes:20,count:5}},choices:[`9:30 a.m.`,`9:10 a.m.`,`9:50 a.m.`,`9:00 a.m.`,`10:10 a.m.`],choicesTh:[`9:30 น.`,`9:10 น.`,`9:50 น.`,`9:00 น.`,`10:10 น.`],correctAnswer:0,explanation:`The 5th ferry is 4 gaps after the 1st. 4 × 20 = 80 minutes = 1 hour 20 minutes. 8:10 + 1:20 = 9:30 a.m.`,explanationTh:`ลำที่ 5 ห่างจากลำแรก 4 ช่วงเวลา 4×20=80 นาที=1 ชั่วโมง 20 นาที 8:10+1:20=9:30 น.`,explanationVisual:{kind:`timeline`,props:{startLabel:`8:10`,intervalMinutes:20,count:5,highlightIndex:5}},hint:`Count only the gaps after the first ferry — the 5th ferry has 4 gaps, not 5.`,hintTh:`นับเฉพาะช่วงเวลาที่ตามหลังลำแรก ลำที่ 5 มี 4 ช่วง ไม่ใช่ 5 ช่วง`,commonMistake:`Multiplying 5 × 20 = 100 minutes instead of using only 4 gaps.`},{id:`v6t3-q11`,setId:3,section:`speedup`,questionNumber:11,points:5,difficulty:`moderate`,skill:`Arithmetic`,question:`A factory machine makes 63 toy cars in 7 hours at a steady rate. How many toy cars can it make in 11 hours?`,questionTh:`เครื่องจักรในโรงงานผลิตรถของเล่นได้ 63 คันใน 7 ชั่วโมง ด้วยอัตราคงที่ ใน 11 ชั่วโมง จะผลิตได้กี่คัน?`,choices:[`99`,`90`,`108`,`88`,`97`],choicesTh:[`99`,`90`,`108`,`88`,`97`],correctAnswer:0,explanation:`63 ÷ 7 = 9 toy cars per hour. 9 × 11 = 99 toy cars.`,explanationTh:`63÷7=9 คันต่อชั่วโมง 9×11=99 คัน`,hint:`Find the hourly rate first.`,hintTh:`หาอัตราต่อชั่วโมงก่อน`,commonMistake:`Multiplying 63 × 11 directly instead of finding the per-hour rate first.`},{id:`v6t3-q12`,setId:3,section:`speedup`,questionNumber:12,points:5,difficulty:`moderate`,skill:`Logical Reasoning`,question:`Start with the number 40 and follow the flowchart below. What number do you end with?`,questionTh:`เริ่มจากจำนวน 40 แล้วทำตามผังงานด้านล่าง ผลลัพธ์สุดท้ายคือเท่าไร?`,visual:{kind:`flowchart`,props:{start:40,question1:`Is the number greater than 30?`,yes1:{op:`−`,value:15},no1:{op:`+`,value:20},question2:`Is the result an even number?`,yes2:{op:`÷`,value:5},no2:{op:`×`,value:2}}},choices:[`50`,`5`,`45`,`30`,`10`],choicesTh:[`50`,`5`,`45`,`30`,`10`],correctAnswer:0,explanation:`40 is greater than 30, so YES: 40 − 15 = 25. Is 25 even? No, so NO: 25 × 2 = 50.`,explanationTh:`40 มากกว่า 30 จึงไปทาง YES: 40−15=25 ถามว่า 25 เป็นเลขคู่หรือไม่? ไม่ใช่ จึงไปทาง NO: 25×2=50`,explanationVisual:{kind:`flowchart`,props:{start:40,question1:`Is the number greater than 30?`,yes1:{op:`−`,value:15},no1:{op:`+`,value:20},question2:`Is the result an even number?`,yes2:{op:`÷`,value:5},no2:{op:`×`,value:2},path:[`yes`,`no`]}},hint:`Check whether the NEW number (after step one) is even, not the original number.`,hintTh:`ตรวจสอบว่าจำนวนใหม่ (หลังขั้นตอนแรก) เป็นเลขคู่หรือไม่ ไม่ใช่จำนวนเดิม`,commonMistake:`Checking whether the original 40 is even, instead of checking 25 (the number produced after the first step).`},{id:`v6t3-q13`,setId:3,section:`speedup`,questionNumber:13,points:5,difficulty:`moderate`,skill:`Problem Solving`,question:`Two years ago, Toon was 5 times as old as his sister Ann. Now, Toon is 3 times as old as Ann. How old is Toon now?`,questionTh:`เมื่อ 2 ปีก่อน ตุ๊นมีอายุมากกว่าน้องสาวชื่อแอน 5 เท่า ปัจจุบัน ตุ๊นมีอายุมากกว่าแอน 3 เท่า ปัจจุบันตุ๊นอายุเท่าไร?`,choices:[`12`,`10`,`14`,`15`,`9`],choicesTh:[`12`,`10`,`14`,`15`,`9`],correctAnswer:0,explanation:`Let Ann's age 2 years ago = x, so Toon's age 2 years ago = 5x. Now: Toon = 5x+2, Ann = x+2. We need 5x+2 = 3(x+2) → 5x+2=3x+6 → 2x=4 → x=2. Toon now = 5(2)+2 = 12.`,explanationTh:`ให้แอนอายุเมื่อ 2 ปีก่อน = x ดังนั้นตุ๊นอายุเมื่อ 2 ปีก่อน = 5x ปัจจุบัน: ตุ๊น=5x+2, แอน=x+2 ต้องการให้ 5x+2=3(x+2) → 5x+2=3x+6 → 2x=4 → x=2 ตุ๊นปัจจุบัน=5(2)+2=12`,hint:`Write both ages 2 years ago in terms of x, then use the CURRENT ratio to set up the equation.`,hintTh:`เขียนอายุทั้งสองคนเมื่อ 2 ปีก่อนในรูปของ x ก่อน แล้วใช้อัตราส่วนปัจจุบันตั้งสมการ`,commonMistake:`Applying the ×3 ratio to the ages from 2 years ago instead of to the current ages.`},{id:`v6t3-q14`,setId:3,section:`speedup`,questionNumber:14,points:5,difficulty:`challenging`,skill:`Logical Reasoning`,question:`Using the two clues below, find the value of one 🥛 (milk box).`,questionTh:`ใช้เงื่อนไขสองข้อด้านล่างนี้ หาค่าของ 🥛 (นม) หนึ่งกล่อง`,visual:{kind:`picture-equation`,props:{clues:[{left:[{icon:`🍪`,count:3},{icon:`🥛`,count:2}],rightValue:24},{left:[{icon:`🍪`,count:1},{icon:`🥛`,count:2}],rightValue:12}]}},choices:[`3`,`2`,`4`,`5`,`6`],choicesTh:[`3`,`2`,`4`,`5`,`6`],correctAnswer:0,explanation:`Subtract Clue 2 from Clue 1: (3🍪+2🥛) − (1🍪+2🥛) = 24 − 12 → 2🍪 = 12 → 🍪 = 6. Substitute into Clue 2: 6 + 2🥛 = 12 → 2🥛 = 6 → 🥛 = 3.`,explanationTh:`นำเงื่อนไข 1 ลบเงื่อนไข 2: (3🍪+2🥛) − (1🍪+2🥛) = 24 − 12 → 2🍪 = 12 → 🍪 = 6 แทนค่าในเงื่อนไข 2: 6 + 2🥛 = 12 → 2🥛 = 6 → 🥛 = 3`,hint:`Notice both clues have the same number of 🥛 — try subtracting one whole clue from the other to cancel it out.`,hintTh:`สังเกตว่าทั้งสองเงื่อนไขมีจำนวน 🥛 เท่ากัน ลองนำเงื่อนไขหนึ่งลบอีกเงื่อนไขหนึ่งเพื่อตัด 🥛 ออก`,commonMistake:`Not noticing that subtracting the two clues directly cancels 🥛, and instead using a slower, more error-prone method.`},{id:`v6t3-q15`,setId:3,section:`speedup`,questionNumber:15,points:5,difficulty:`moderate`,skill:`Problem Solving`,question:`The picture shows a 4×5 tiled floor. The marked squares (?) still need tiles. Light tiles cost 18 baht each and dark tiles cost 22 baht each. What is the total cost to tile all 4 marked squares?`,questionTh:`ภาพแสดงพื้นกระเบื้อง 4×5 ช่อง ช่องที่มีเครื่องหมาย (?) ยังไม่ได้ปูกระเบื้อง กระเบื้องสีอ่อนราคาช่องละ 18 บาท กระเบื้องสีเข้มราคาช่องละ 22 บาท ต้องใช้เงินทั้งหมดเท่าไรเพื่อปูกระเบื้อง 4 ช่องที่มีเครื่องหมาย?`,visual:{kind:`checkerboard`,props:{rows:4,cols:5,blanks:[[0,2],[1,4],[2,0],[3,3]],lightCost:18,darkCost:22}},choices:[`84`,`80`,`88`,`76`,`92`],choicesTh:[`84`,`80`,`88`,`76`,`92`],correctAnswer:0,explanation:`Of the 4 marked squares, 1 is light (1×18=18) and 3 are dark (3×22=66). Total = 18 + 66 = 84 baht.`,explanationTh:`ใน 4 ช่องที่มีเครื่องหมาย มี 1 ช่องเป็นสีอ่อน (1×18=18) และ 3 ช่องเป็นสีเข้ม (3×22=66) รวม=18+66=84 บาท`,explanationVisual:{kind:`checkerboard`,props:{rows:4,cols:5,blanks:[[0,2],[1,4],[2,0],[3,3]],lightCost:18,darkCost:22,revealCosts:!0}},hint:`Check each marked square's position against the checkerboard pattern before adding costs.`,hintTh:`ตรวจสอบตำแหน่งของแต่ละช่องที่มีเครื่องหมายกับลายกระดานหมากรุกก่อนบวกราคา`,commonMistake:`Assuming the marked squares are evenly split between light and dark without checking each one.`},{id:`v6t3-q16`,setId:3,section:`challenge`,questionNumber:16,points:7,difficulty:`challenging`,skill:`Geometry`,question:`The picture shows an owl made only from straight lines (the round body and eyes are not made of straight lines, so do not count them). How many triangles of any size can you count in total?`,questionTh:`ภาพแสดงนกฮูกที่วาดจากเส้นตรงเท่านั้น (ลำตัวและตาที่กลมไม่ได้สร้างจากเส้นตรง จึงไม่ต้องนับ) มีรูปสามเหลี่ยมทุกขนาดรวมกันทั้งหมดกี่รูป?`,visual:{kind:`shape-count-owl`,props:{highlight:!1}},choices:[`9`,`8`,`10`,`7`,`11`],choicesTh:[`9`,`8`,`10`,`7`,`11`],correctAnswer:0,explanation:`The chest marking is one big triangle split by two lines into 3 sections, giving 3+2+1=6 triangles. The two ear tufts are 2 more standalone triangles, and the beak is 1 more. Total: 6+2+1=9.`,explanationTh:`ลายหน้าอกเป็นรูปสามเหลี่ยมใหญ่ที่ถูกแบ่งด้วยเส้น 2 เส้นออกเป็น 3 ส่วน ได้ 3+2+1=6 รูป กระจุกหูทั้งสองข้างเป็นรูปสามเหลี่ยมเดี่ยวอีก 2 รูป และปากเป็นอีก 1 รูป รวม: 6+2+1=9`,explanationVisual:{kind:`shape-count-owl`,props:{highlight:!0}},hint:`Count the chest triangles first (small ones, then combined pairs, then the whole marking), then add the ears and the beak.`,hintTh:`นับรูปสามเหลี่ยมที่หน้าอกก่อน (รูปเล็ก แล้วรูปที่รวมกัน แล้วรูปทั้งหมด) จากนั้นจึงบวกหูและปาก`,commonMistake:`Forgetting to count the 2 larger combined triangles inside the chest marking, only counting the 3 smallest ones.`},{id:`v6t3-q17`,setId:3,section:`challenge`,questionNumber:17,points:7,difficulty:`challenging`,skill:`Spatial Reasoning`,question:`The picture shows the front view of a cube tower, with each column showing its height. How many unit cubes were used to build this tower in total?`,questionTh:`ภาพแสดงมุมมองด้านหน้าของหอคอยลูกบาศก์ แต่ละแท่งแสดงความสูงของแต่ละแถว หอคอยนี้ใช้ลูกบาศก์ทั้งหมดกี่ก้อน?`,visual:{kind:`cube-stack`,props:{heights:[8,3,5,9,2,6]}},choices:[`33`,`31`,`35`,`30`,`36`],choicesTh:[`33`,`31`,`35`,`30`,`36`],correctAnswer:0,explanation:`Add every column height: 8 + 3 + 5 + 9 + 2 + 6 = 33.`,explanationTh:`บวกความสูงของทั้ง 6 แท่งเข้าด้วยกัน: 8+3+5+9+2+6=33`,explanationVisual:{kind:`cube-stack`,props:{heights:[8,3,5,9,2,6],revealTotal:!0}},hint:`Add all six numbers carefully, grouping to make tens where you can.`,hintTh:`บวกตัวเลขทั้งหกจำนวนอย่างละเอียด ลองจับกลุ่มให้ครบสิบ`,commonMistake:`Skipping a column or mis-adding while adding a longer list of numbers.`},{id:`v6t3-q18`,setId:3,section:`challenge`,questionNumber:18,points:7,difficulty:`challenging`,skill:`Visual Patterns`,question:`Each figure below is a plus-shaped cross of small squares. If this pattern continues, how many small squares would be in the figure whose arms are 8 squares long?`,questionTh:`แต่ละรูปด้านล่างเป็นรูปกากบาท (เครื่องหมายบวก) ถ้าแบบรูปนี้ดำเนินต่อไป รูปที่มีแขนยาว 8 ช่อง จะมีสี่เหลี่ยมเล็กกี่ช่อง?`,visual:{kind:`growing-pattern`,props:{groups:[1,2,3,4],shape:`plus-cross`}},choices:[`33`,`32`,`36`,`29`,`34`],choicesTh:[`33`,`32`,`36`,`29`,`34`],correctAnswer:0,explanation:`Each figure follows the rule 4n+1, where n is the arm length (the +1 accounts for the centre square). For n = 8: 4×8+1 = 33.`,explanationTh:`แต่ละรูปเป็นไปตามกฎ 4n+1 โดย n คือความยาวแขนของกากบาท เมื่อ n=8: 4×8+1=33`,hint:`Compare each total to 4 times its arm length, then notice what still needs to be added.`,hintTh:`เทียบผลรวมของแต่ละรูปกับ 4 เท่าของความยาวแขน แล้วดูว่าต้องบวกเพิ่มอีกเท่าไร`,commonMistake:`Forgetting to add the extra +1 for the centre square, e.g. answering 4×8=32.`},{id:`v6t3-q19`,setId:3,section:`challenge`,questionNumber:19,points:7,difficulty:`challenging`,skill:`Spatial Reasoning`,question:`The tile shown is a plus-shaped pentomino made of 5 small squares. You may use as many copies of this tile as you like, and you may rotate them, but they cannot overlap or leave gaps. Which of these could NOT be built using only copies of this tile?`,questionTh:`แผ่นกระเบื้องรูปหนึ่งเป็นรูปกากบาท ประกอบจากสี่เหลี่ยมเล็ก 5 ช่อง (ดังภาพ) คุณสามารถใช้แผ่นกระเบื้องนี้กี่แผ่นก็ได้ หมุนได้ แต่ห้ามซ้อนทับหรือมีช่องว่าง พื้นที่ใดต่อไปนี้ "ไม่สามารถ" ปูให้เต็มพอดีได้?`,visual:{kind:`tiling-puzzle`,props:{tileCells:[[0,1],[1,0],[1,1],[1,2],[2,1]],targets:[]}},choices:[`A region of 15 squares`,`A region of 20 squares`,`A region of 25 squares`,`A region of 30 squares`,`A region of 22 squares`],choicesTh:[`พื้นที่ 15 ช่อง`,`พื้นที่ 20 ช่อง`,`พื้นที่ 25 ช่อง`,`พื้นที่ 30 ช่อง`,`พื้นที่ 22 ช่อง`],correctAnswer:4,explanation:`Every tile covers exactly 5 small squares, so any region built only from whole copies of this tile must have an area that is a multiple of 5. 15, 20, 25, and 30 are all multiples of 5, but 22 is NOT (22÷5 is not a whole number), so a 22-square region can never be built this way.`,explanationTh:`กระเบื้องแต่ละแผ่นปิดพื้นที่ 5 ช่องเสมอ ดังนั้นพื้นที่รวมต้องหารด้วย 5 ลงตัว 15,20,25 และ 30 ล้วนหารด้วย 5 ลงตัว แต่ 22 หารด้วย 5 ไม่ลงตัว จึงไม่มีทางปูพื้นที่ 22 ช่องให้พอดีได้`,hint:`Every tile always covers exactly 5 squares — what must be true about the total area?`,hintTh:`กระเบื้องแต่ละแผ่นปิดพื้นที่ 5 ช่องเสมอ พื้นที่รวมทั้งหมดต้องเป็นอย่างไร?`,commonMistake:`Trying to picture whether the plus-shape 'looks like it fits' instead of using the rule that the total area must be a multiple of 5.`},{id:`v6t3-q20`,setId:3,section:`challenge`,questionNumber:20,points:7,difficulty:`challenging`,skill:`Logical Reasoning`,question:`The three balance scales below give clues about the weights of cheese (🧀), bread (🥖), honey (🍯), and an egg (🥚). Based ONLY on these three clues, which single item is the heaviest?`,questionTh:`ตาชั่งสามอันด้านล่างให้เงื่อนไขเกี่ยวกับน้ำหนักของเนยแข็ง (🧀) ขนมปัง (🥖) น้ำผึ้ง (🍯) และไข่ (🥚) จากเงื่อนไขทั้งสามนี้เท่านั้น สิ่งใดหนักที่สุด?`,visual:{kind:`balance-scale-set`,props:{scales:[{left:[`🧀`,`🥖`],right:[`🍯`,`🥚`],tilt:`left`},{left:[`🧀`],right:[`🥖`],tilt:`left`},{left:[`🍯`],right:[`🥚`],tilt:`left`}]}},choices:[`🧀`,`🥖`,`🍯`,`🥚`,`Cannot be determined`],choicesTh:[`🧀`,`🥖`,`🍯`,`🥚`,`บอกไม่ได้แน่ชัด`],correctAnswer:4,explanation:`Clue 2 tells us 🧀 is heavier than 🥖, and Clue 3 tells us 🍯 is heavier than 🥚. Clue 1 tells us 🧀+🥖 TOGETHER outweigh 🍯+🥚 TOGETHER — but that does not mean 🧀 alone outweighs 🍯 alone. For example, weights 🧀=10, 🥖=1, 🍯=6, 🥚=1 satisfy all three clues, and here 🧀 is heaviest. But weights 🧀=5, 🥖=4, 🍯=8, 🥚=0.5 ALSO satisfy all three clues (5>4, 8>0.5, and 9>8.5) — and here 🍯 is heaviest instead! Since two different weight assignments both fit every clue but give different heaviest items, the heaviest item cannot be determined from these three clues alone.`,explanationTh:`เงื่อนไขที่ 2 บอกว่า 🧀 หนักกว่า 🥖 และเงื่อนไขที่ 3 บอกว่า 🍯 หนักกว่า 🥚 เงื่อนไขที่ 1 บอกว่า 🧀+🥖 รวมกันหนักกว่า 🍯+🥚 รวมกัน แต่นั่นไม่ได้แปลว่า 🧀 เพียงชิ้นเดียวจะหนักกว่า 🍯 เพียงชิ้นเดียว ตัวอย่างเช่น น้ำหนัก 🧀=10,🥖=1,🍯=6,🥚=1 ตรงกับทั้งสามเงื่อนไข และ 🧀 หนักที่สุด แต่น้ำหนัก 🧀=5,🥖=4,🍯=8,🥚=0.5 ก็ตรงกับทั้งสามเงื่อนไขเช่นกัน (5>4, 8>0.5, และ 9>8.5) แต่คราวนี้ 🍯 หนักที่สุดแทน เมื่อน้ำหนักสองชุดที่ต่างกันต่างก็ตรงกับทุกเงื่อนไข แต่ให้คำตอบต่างกัน จึงสรุปได้ว่าไม่สามารถบอกได้แน่ชัดว่าสิ่งใดหนักที่สุดจากเงื่อนไขทั้งสามนี้`,hint:`Try to find two different sets of weights that both fit all three clues — if they give different answers, it cannot be determined.`,hintTh:`ลองหาน้ำหนักสองชุดที่ต่างกันแต่ตรงกับทั้งสามเงื่อนไข ถ้าให้คำตอบต่างกัน แสดงว่าบอกไม่ได้แน่ชัด`,commonMistake:`Assuming that because 🧀+🥖 together outweigh 🍯+🥚 together, 🧀 by itself must be heavier than 🍯 by itself.`}],tr=[{id:1,slug:`morning-sparks`,title:`Mock Test 1`,subtitle:`Morning Sparks`,difficultyLabel:`Mixed`},{id:2,slug:`curious-climbers`,title:`Mock Test 2`,subtitle:`Curious Climbers`,difficultyLabel:`Medium`},{id:3,slug:`golden-summit`,title:`Mock Test 3`,subtitle:`Golden Summit`,difficultyLabel:`Medium–Hard`}],nr={1:Qn,2:$n,3:er},rr=Object.values(nr).flat(),ir=o((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),A=o(((e,t)=>{t.exports=ir()}))(),ar=`g3o-progress-v1`,or=`g3o6-lang-v1`;function sr(){try{return localStorage.getItem(or)===`th`?`th`:`en`}catch(e){return`en`}}function cr(){return{attempts:{},results:{},mistakesBySet:{}}}function lr(){try{let e=localStorage.getItem(ar);if(!e)return cr();let t=JSON.parse(e);return{...cr(),...t}}catch(e){return cr()}}var ur=(0,v.createContext)(null);function dr({children:e}){let[t,n]=(0,v.useState)(lr),[r,i]=(0,v.useState)(sr);(0,v.useEffect)(()=>{localStorage.setItem(ar,JSON.stringify(t))},[t]),(0,v.useEffect)(()=>{try{localStorage.setItem(or,r)}catch(e){}},[r]);let a=(0,v.useCallback)(e=>{var n;return(n=t.attempts[e])==null?{setId:e,answers:{},checked:{},startedAt:Date.now()}:n},[t.attempts]),o=(0,v.useCallback)((e,t,r)=>{n(n=>{var i;let a=(i=n.attempts[e])==null?{setId:e,answers:{},checked:{},startedAt:Date.now()}:i;return a.checked[t]?n:{...n,attempts:{...n.attempts,[e]:{...a,answers:{...a.answers,[t]:r}}}}})},[]),s=(0,v.useCallback)((e,t)=>{n(n=>{var r;let i=(r=n.attempts[e])==null?{setId:e,answers:{},checked:{},startedAt:Date.now()}:r;return{...n,attempts:{...n.attempts,[e]:{...i,checked:{...i.checked,[t]:!0}}}}})},[]),c=(0,v.useC

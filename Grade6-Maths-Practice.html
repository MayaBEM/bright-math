erimeter = 14 + 6 + 8 + 4 + 6 + 10 = 48 cm.","scheme":["M1 finding 8 cm and 4 cm","A1 48 cm"],"watch":"Adding only the four marked sides (36 cm).","ans":"48 cm","check":{"type":"numeric","nums":[48.0],"unit":"cm","display":"48 cm"}},{"n":15,"s":"B","m":2,"text":"The shape below is a <b>trapezium</b>. Find its <b>area</b> by splitting it into a rectangle and a triangle.","fig":"<svg class=\"fig\" viewBox=\"-54.0 -40.5 258.0 171.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 120.0,0.0 180.0,90.0 0.0,90.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"11.0,90.0 11.0,79.0 0.0,79.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"60.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text><text x=\"-30.0\" y=\"45.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 cm</text><text x=\"90.0\" y=\"106.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text></svg>","sol":"Rectangle = 8 cm × 6 cm = 48 cm<sup>2</sup>. The triangle has a base of 12 − 8 = 4 cm and a height of 6 cm, so it is <sup>1</sup>⁄<sub>2</sub> × 4 × 6 = 12 cm<sup>2</sup>. Area = 48 + 12 = 60 cm<sup>2</sup>.","scheme":["M1 rectangle 48 cm<sup>2</sup> and triangle 12 cm<sup>2</sup>","A1 60 cm<sup>2</sup>"],"watch":"Treating the whole shape as a 12 cm by 6 cm rectangle (72 cm<sup>2</sup>).","ans":"60 cm<sup>2</sup>","check":{"type":"numeric","nums":[60.0],"unit":"cm2","display":"60 cm²"}},{"n":16,"s":"B","m":2,"text":"A rectangular sheet of card measures 15 cm by 9 cm. A square hole of side 5 cm is cut out of the middle. Find the <b>area of the card that is left</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 288.0 190.5\" style=\"width:54mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 210.0,0.0 210.0,126.0 0.0,126.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"70.0\" y1=\"28.0\" x2=\"140.0\" y2=\"28.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"28.0\" x2=\"140.0\" y2=\"98.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"98.0\" x2=\"70.0\" y2=\"98.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"70.0\" y1=\"98.0\" x2=\"70.0\" y2=\"28.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"105.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 cm</text><text x=\"240.0\" y=\"63.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text><text x=\"105.0\" y=\"63.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 cm</text></svg>","sol":"Card = 15 × 9 = 135 cm<sup>2</sup>. Hole = 5 × 5 = 25 cm<sup>2</sup>. Area left = 135 − 25 = 110 cm<sup>2</sup>.","scheme":["M1 135 − 25","A1 110 cm<sup>2</sup>"],"watch":"Forgetting to take the hole away (135 cm<sup>2</sup>), or subtracting the hole's perimeter (20) instead of its area.","ans":"110 cm<sup>2</sup>","check":{"type":"numeric","nums":[110.0],"unit":"cm2","display":"110 cm²"}},{"n":17,"s":"B","m":2,"text":"Somchai puts a fence all the way around the rectangular garden below. The fence costs <b>฿85</b> for each metre. Find the total cost of the fence.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 276.0 185.5\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 198.0,0.0 198.0,121.0 0.0,121.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"99.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">18 m</text><text x=\"228.0\" y=\"60.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">11 m</text></svg>","sol":"Perimeter = 2 × (18 + 11) = 58 m. Cost = 58 × ฿85 = ฿4 930.","scheme":["M1 perimeter = 58 m","A1 ฿4 930"],"watch":"Using the area (198 m<sup>2</sup>) instead of the perimeter.","ans":"฿4 930","check":{"type":"numeric","nums":[4930.0],"unit":"","display":"฿4 930"}},{"n":18,"s":"B","m":2,"text":"A rectangular swimming pool is 10 m long and 6 m wide. A path 2 m wide is built all the way around the pool. Find the <b>area of the path</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 258.0 198.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 210.0,0.0 210.0,150.0 0.0,150.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"30.0\" y1=\"30.0\" x2=\"180.0\" y2=\"30.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"180.0\" y1=\"30.0\" x2=\"180.0\" y2=\"120.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"180.0\" y1=\"120.0\" x2=\"30.0\" y2=\"120.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"30.0\" y1=\"120.0\" x2=\"30.0\" y2=\"30.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"105.0\" y=\"15.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">2 m</text><text x=\"105.0\" y=\"44.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 m</text><text x=\"50.0\" y=\"78.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 m</text><text x=\"115.0\" y=\"100.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Pool</text></svg>","sol":"Outside rectangle = (10 + 2 + 2) × (6 + 2 + 2) = 14 × 10 = 140 m<sup>2</sup>. Pool = 10 × 6 = 60 m<sup>2</sup>. Path = 140 − 60 = 80 m<sup>2</sup>.","scheme":["M1 outside rectangle 14 m × 10 m = 140 m<sup>2</sup>","A1 80 m<sup>2</sup>"],"watch":"Adding only one lot of 2 m to each side, giving 12 × 8 = 96 and a path of 36 m<sup>2</sup>.","ans":"80 m<sup>2</sup>","check":{"type":"numeric","nums":[80.0],"unit":"m2","display":"80 m²"}},{"n":19,"s":"B","m":2,"text":"The perimeter of the rectangle below is 54 cm. Find its <b>area</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 268.0 196.5\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 204.0,0.0 204.0,132.0 0.0,132.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"102.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">17 cm</text><text x=\"220.0\" y=\"66.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"102.0\" y=\"66.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Perimeter = 54 cm</text></svg>","sol":"Length + width = 54 ÷ 2 = 27 cm, so the width = 27 − 17 = 10 cm. Area = 17 × 10 = 170 cm<sup>2</sup>.","scheme":["M1 width = 54 ÷ 2 − 17 = 10 cm","A1 170 cm<sup>2</sup>"],"watch":"Taking 17 from 54 to get a width of 37 cm.","ans":"170 cm<sup>2</sup>","check":{"type":"numeric","nums":[170.0],"unit":"cm2","display":"170 cm²"}},{"n":20,"s":"B","m":2,"text":"The floor of a hall is a rectangle 9 m long and 6 m wide. It is covered completely with square tiles of side <b>50 cm</b>. How many tiles are used?","fig":"","sol":"50 cm = 0.5 m. Along the length: 9 ÷ 0.5 = 18 tiles. Along the width: 6 ÷ 0.5 = 12 tiles. Total = 18 × 12 = 216 tiles.","scheme":["M1 18 tiles by 12 tiles (or 54 m<sup>2</sup> ÷ 0.25 m<sup>2</sup>)","A1 216 tiles"],"watch":"Mixing the units and dividing 54 m<sup>2</sup> by 50.","ans":"216 tiles","check":{"type":"numeric","nums":[216.0],"unit":"","display":"216 tiles"}},{"n":21,"s":"C","m":4,"text":"The shape below is a <b>regular polygon with 9 sides</b>.","fig":"<svg class=\"fig\" viewBox=\"-92.9 -94.0 185.9 183.8\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,-70.0 45.0,-53.6 68.9,-12.2 60.6,35.0 23.9,65.8 -23.9,65.8 -60.6,35.0 -68.9,-12.2 -45.0,-53.6\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"-22.6,-61.8 -21.2,-58.8 -19.5,-56.0 -17.5,-53.5 -15.1,-51.3 -12.4,-49.5 -9.5,-48.0 -6.4,-46.9 -3.2,-46.2 0.0,-46.0 3.2,-46.2 6.4,-46.9 9.5,-48.0 12.4,-49.5 15.1,-51.3 17.5,-53.5 19.5,-56.0 21.2,-58.8 22.6,-61.8\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"-32.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text></svg>","sol":"","scheme":["M1 (9 − 2) × 180°","A1 1 260°","M1 dividing the sum by 9","A1 140°"],"watch":"Dividing by 7 instead of 9 in part (b).","parts":[{"label":"(a)","text":"Work out the sum of its interior angles.","fig":"","m":2,"ans":"1 260°","sol":"(9 − 2) × 180° = 7 × 180° = 1 260°.","check":{"type":"numeric","nums":[1260.0],"unit":"deg","display":"1 260°"}},{"label":"(b)","text":"Hence find the size of the angle marked <b>x</b>.","fig":"","m":2,"ans":"140°","sol":"1 260° ÷ 9 = 140°.","check":{"type":"numeric","nums":[140.0],"unit":"deg","display":"140°"}}]},{"n":22,"s":"C","m":4,"text":"Malee's lawn is the L-shape shown below. Two of the sides are not marked.","fig":"<svg class=\"fig\" viewBox=\"-54.0 -40.5 316.0 220.5\" style=\"width:56mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 208.0,0.0 208.0,156.0 117.0,156.0 117.0,91.0 0.0,91.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"197.0,0.0 197.0,11.0 208.0,11.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"208.0,145.0 197.0,145.0 197.0,156.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"128.0,156.0 128.0,145.0 117.0,145.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"11.0,91.0 11.0,80.0 0.0,80.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"104.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">16 m</text><text x=\"238.0\" y=\"78.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 m</text><text x=\"58.5\" y=\"107.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 m</text><text x=\"-30.0\" y=\"45.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 m</text></svg>","sol":"","scheme":["M1 unmarked sides 7 m and 5 m","A1 56 m","M1 splitting into two rectangles","A1 147 m<sup>2</sup>"],"watch":"Using the whole 16 m by 12 m rectangle (192 m<sup>2</sup>) for the area.","parts":[{"label":"(a)","text":"Find the perimeter of the lawn.","fig":"","m":2,"ans":"56 m","sol":"Unmarked sides are 16 − 9 = 7 m and 12 − 7 = 5 m. Perimeter = 16 + 12 + 7 + 5 + 9 + 7 = 56 m.","check":{"type":"numeric","nums":[56.0],"unit":"m","display":"56 m"}},{"label":"(b)","text":"Find the area of the lawn.","fig":"","m":2,"ans":"147 m<sup>2</sup>","sol":"Split it into 16 m × 7 m = 112 m<sup>2</sup> and 7 m × 5 m = 35 m<sup>2</sup>. Area = 112 + 35 = 147 m<sup>2</sup>.","check":{"type":"numeric","nums":[147.0],"unit":"m2","display":"147 m²"}}]},{"n":23,"s":"C","m":4,"text":"Ben starts with a rectangular card 12 cm long and 7 cm wide. He cuts a square of side 3 cm from one corner. The shape that is left is shown below.","fig":"<svg class=\"fig\" viewBox=\"-54.0 -40.5 312.0 200.0\" style=\"width:58mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 153.0,0.0 153.0,51.0 204.0,51.0 204.0,119.0 0.0,119.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"142.0,0.0 142.0,11.0 153.0,11.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"193.0,51.0 193.0,62.0 204.0,62.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"204.0,108.0 193.0,108.0 193.0,119.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"11.0,119.0 11.0,108.0 0.0,108.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"76.5\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text><text x=\"161.0\" y=\"16.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">3 cm</text><text x=\"178.5\" y=\"40.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">3 cm</text><text x=\"234.0\" y=\"85.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 cm</text><text x=\"102.0\" y=\"135.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"-30.0\" y=\"59.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text></svg>","sol":"","scheme":["M1 84 − 9","A1 75 cm<sup>2</sup>","B1 says No, both perimeters are 38 cm","C1 the two cut edges replace the two pieces removed"],"watch":"Assuming a smaller area always means a smaller perimeter.","parts":[{"label":"(a)","text":"Find the area of the shape that is left.","fig":"","m":2,"ans":"75 cm<sup>2</sup>","sol":"Whole card = 12 × 7 = 84 cm<sup>2</sup>. Square cut off = 3 × 3 = 9 cm<sup>2</sup>. Area left = 84 − 9 = 75 cm<sup>2</sup>.","check":{"type":"numeric","nums":[75.0],"unit":"cm2","display":"75 cm²"}},{"label":"(b)","text":"Ben says, “The perimeter of my shape must be smaller than the perimeter of the card I started with, because I have cut a piece off.” Is Ben correct? Explain your answer.","fig":"","m":2,"ans":"No — both perimeters are 38 cm","sol":"Card: 2 × (12 + 7) = 38 cm. Shape: 9 + 3 + 3 + 4 + 12 + 7 = 38 cm. The two new 3&nbsp;cm edges replace the 3&nbsp;cm taken off the top and the 3&nbsp;cm taken off the side, so the perimeter does not change.","check":{"type":"self"}}]},{"n":24,"s":"C","m":4,"text":"Anong is fitting out her kitchen. The floor is the rectangle shown below.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 234.0 181.5\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 156.0,0.0 156.0,117.0 0.0,117.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"78.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 m</text><text x=\"186.0\" y=\"58.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4.5 m</text></svg>","sol":"","scheme":["M1 area = 27 m<sup>2</sup>","A1 ฿11 340","M1 perimeter = 21 m","A1 20 m"],"watch":"Forgetting to take the 1 m doorway away in part (b).","parts":[{"label":"(a)","text":"Floor tiles cost ฿420 for each square metre. Find the cost of tiling the whole floor.","fig":"","m":2,"ans":"฿11 340","sol":"Area = 6 × 4.5 = 27 m<sup>2</sup>. Cost = 27 × ฿420 = ฿11 340.","check":{"type":"numeric","nums":[11340.0],"unit":"","display":"฿11 340"}},{"label":"(b)","text":"Anong fixes a wooden strip along the edge of the floor, all the way round, except across a doorway 1 m wide. Find the length of strip she needs.","fig":"","m":2,"ans":"20 m","sol":"Perimeter = 2 × (6 + 4.5) = 21 m. Strip = 21 − 1 = 20 m.","check":{"type":"numeric","nums":[20.0],"unit":"m","display":"20 m"}}]},{"n":25,"s":"C","m":4,"text":"The shape below is a hexagon.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 304.0 246.1\" style=\"width:68mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"91.1,198.1 0.0,120.8 64.7,29.4 176.7,0.0 256.0,80.1 200.3,175.4\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"114.6,193.2 113.9,190.3 112.7,187.6 111.3,185.0 109.5,182.6 107.4,180.4 105.1,178.6 102.6,177.0 99.9,175.7 97.1,174.8 94.1,174.3 91.2,174.1 88.2,174.3 85.3,174.8 82.4,175.7 79.7,177.0 77.2,178.5 74.9,180.4 72.8,182.6\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"101.0\" y=\"161.3\" font-size=\"1 .3 177.4,168.2 176.7,171.2 176.4,174.2 176.4,177.3 176.8,180.3\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"177.0\" y=\"144.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text></svg>","sol":"","scheme":["M1 720 − 588","A1 132°","C1 explains that (n − 2) must be used, not n","B1 720°"],"watch":"Multiplying the number of sides by 180° instead of using (n − 2) × 180°.","parts":[{"label":"(a)","text":"Find the size of the angle marked <b>x</b>.","fig":"","m":2,"ans":"132°","sol":"Sum of the angles = (6 − 2) × 180° = 720°. 128° + 95° + 140° + 120° + 105° = 588°, so x = 720° − 588° = 132°.","check":{"type":"numeric","nums":[132.0],"unit":"deg","display":"132°"}},{"label":"(b)","text":"Mei says, “The interior angles of a hexagon add up to 1 080°, because 6 × 180° = 1 080°.” Explain the mistake Mei has made, and write down the correct sum.","fig":"","m":2,"ans":"720°","sol":"Mei multiplied by the number of sides. A hexagon splits into (6 − 2) = 4 triangles, not 6, so the sum is 4 × 180° = 720°.","check":{"type":"numeric","nums":[720.0],"unit":"deg","display":"720°"}}]}]},{"id":"11_Circumference-Area-Circles","code":"Chapter 11","title":"Circumference and Area of Circles","colour":"#C0442E","blurb":"C = πd and A = πr²","sub":"Circumference of a circle · Area of a circle · Word problems","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"Find the circumference of the circle below. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text></svg>","sol":"C = π × d = 3.14 × 10 = 31.4 cm","scheme":[],"watch":"Using 2 × π × d instead of π × d and doubling the answer (62.8 cm).","opts":["15.7 cm","31.4 cm","62.8 cm","78.5 cm"],"ans":1,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"The radius of the circle below is 7 cm. Work out its circumference. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm        </text></svg>","sol":"C = 2 × π × r = 2 × <sup>22</sup>⁄<sub>7</sub> × 7 = 44 cm","scheme":[],"watch":"Treating 7 cm as the diameter and then doubling again (88 cm).","opts":["154 cm","88 cm","44 cm","22 cm"],"ans":2,"check":{"type":"mcq"}},{"n":3,"s":"A","m":1,"text":"Which of these is the formula for the <b>area</b> of a circle?","fig":"","sol":"Area = π × r × r (that is, π × r<sup>2</sup>). The other three are circumference formulas or nonsense.","scheme":[],"watch":"Choosing π × d, which gives the circumference, not the area.","opts":["π × r × r","π × d","2 × π × r","π × d × d"],"ans":0,"check":{"type":"mcq"}},{"n":4,"s":"A","m":1,"text":"Find the area of the circle below. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 cm        </text></svg>","sol":"A = π × r × r = 3.14 × 5 × 5 = 78.5 cm<sup>2</sup>","scheme":[],"watch":"Working out 2 × π × r (31.4) instead of π × r × r.","opts":["157 cm<sup>2</sup>","78.5 cm<sup>2</sup>","31.4 cm<sup>2</sup>","15.7 cm<sup>2</sup>"],"ans":1,"check":{"type":"mcq"}},{"n":5,"s":"A","m":1,"text":"The circumference of a circle is 88 cm. Find its diameter. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"","sol":"d = C ÷ π = 88 ÷ <sup>22</sup>⁄<sub>7</sub> = 88 × <sup>7</sup>⁄<sub>22</sub> = 28 cm","scheme":[],"watch":"Going one step too far and giving the radius (14 cm).","opts":["56 cm","28 cm","22 cm","14 cm"],"ans":1,"check":{"type":"mcq"}},{"n":6,"s":"A","m":1,"text":"The semicircle below has a diameter of 14 cm. Find its area. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-92.0 -92.0 184.0 130.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M-70,0 A70,70 0 0 1 70,0 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"16.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text></svg>","sol":"r = 7 cm. Whole circle: <sup>22</sup>⁄<sub>7</sub> × 7 × 7 = 154 cm<sup>2</sup>. Semicircle = 154 ÷ 2 = 77 cm<sup>2</sup>","scheme":[],"watch":"Halving the area of the whole circle twice instead of once (38.5 cm<sup>2</sup>).","opts":["22 cm<sup>2</sup>","38.5 cm<sup>2</sup>","44 cm<sup>2</sup>","77 cm<sup>2</sup>"],"ans":3,"check":{"type":"mcq"}},{"n":7,"s":"A","m":1,"text":"A bicycle wheel has a diameter of 70 cm. How far does it travel in <b>one</b> complete turn? (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">70 cm</text></svg>","sol":"One turn = the circumference = <sup>22</sup>⁄<sub>7</sub> × 70 = 220 cm","scheme":[],"watch":"Using the radius in place of the diameter (110 cm).","opts":["70 cm","110 cm","140 cm","220 cm"],"ans":3,"check":{"type":"mcq"}},{"n":8,"s":"A","m":1,"text":"The area of the circle below is 154 cm<sup>2</sup>. Find its radius. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">r = ?         </text></svg>","sol":"r × r = 154 ÷ <sup>22</sup>⁄<sub>7</sub> = 154 × <sup>7</sup>⁄<sub>22</sub> = 49, so r = 7 cm","scheme":[],"watch":"Stopping at r × r = 49 and writing 49 cm.","opts":["49 cm","14 cm","7 cm","3.5 cm"],"ans":2,"check":{"type":"mcq"}},{"n":9,"s":"A","m":1,"text":"The quarter circle below has a radius of 6 cm. Find its area. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-22.0 -92.0 114.0 130.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L70,0 A70,70 0 0 0 0,-70 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"14,0 14,-14 0,-14\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"35.0\" y=\"16.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 cm</text></svg>","sol":"Whole circle: 3.14 × 6 × 6 = 113.04 cm<sup>2</sup>. Quarter circle = 113.04 ÷ 4 = 28.26 cm<sup>2</sup>","scheme":[],"watch":"Forgetting to divide the area of the whole circle by 4 (113.04 cm<sup>2</sup>).","opts":["9.42 cm<sup>2</sup>","18.84 cm<sup>2</sup>","28.26 cm<sup>2</sup>","113.04 cm<sup>2</sup>"],"ans":2,"check":{"type":"mcq"}},{"n":10,"s":"A","m":1,"text":"The <b>perimeter</b> of a semicircle is found by adding together …","fig":"","sol":"A semicircle is bounded by the curved edge (half the circumference) and the straight edge (the diameter).","scheme":[],"watch":"Giving only the curved part and forgetting the straight edge.","opts":["half the circumference of the circle and the diameter","half the circumference of the circle only","the whole circumference of the circle and the diameter","half the circumference of the circle and the radius"],"ans":0,"check":{"type":"mcq"}},{"n":11,"s":"B","m":2,"text":"A round badge has a radius of 4 cm. Find the circumference of the badge. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 cm        </text></svg>","sol":"C = 2 × π × r = 2 × 3.14 × 4 = 25.12 cm","scheme":["M1 2 × 3.14 × 4","A1 25.12 cm"],"watch":"Using π × r and getting 12.56 cm.","ans":"25.12 cm","check":{"type":"numeric","nums":[25.12],"unit":"cm","display":"25.12 cm"}},{"n":12,"s":"B","m":2,"text":"A dinner plate has a diameter of 20 cm. Find the area of the plate. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text></svg>","sol":"r = 20 ÷ 2 = 10 cm. A = 3.14 × 10 × 10 = 314 cm<sup>2</sup>","scheme":["M1 r = 10 cm and 3.14 × 10 × 10","A1 314 cm<sup>2</sup>"],"watch":"Squaring the diameter instead of the radius (1256 cm<sup>2</sup>).","ans":"314 cm<sup>2</sup>","check":{"type":"numeric","nums":[314.0],"unit":"cm2","display":"314 cm²"}},{"n":13,"s":"B","m":2,"text":"The circumference of a circular running lane is 132 m. Find the radius of the lane. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"","sol":"d = 132 × <sup>7</sup>⁄<sub>22</sub> = 42 m, so r = 42 ÷ 2 = 21 m","scheme":["M1 d = 132 × 7 ÷ 22 = 42 m","A1 21 m"],"watch":"Stopping at the diameter (42 m) instead of halving it.","ans":"21 m","check":{"type":"numeric","nums":[21.0],"unit":"m","display":"21 m"}},{"n":14,"s":"B","m":2,"text":"The wheel of Krit’s cart has a diameter of 56 cm. The wheel makes 25 complete turns. How far does the cart travel? Give your answer in metres. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">56 cm</text></svg>","sol":"One turn = <sup>22</sup>⁄<sub>7</sub> × 56 = 176 cm. 176 × 25 = 4400 cm = 44 m","scheme":["M1 circumference = 176 cm and × 25","A1 4400 cm = 44 m"],"watch":"Leaving the answer in centimetres (4400 cm).","ans":"44 m","check":{"type":"numeric","nums":[44.0],"unit":"m","display":"44 m"}},{"n":15,"s":"B","m":2,"text":"Find the <b>perimeter</b> of the semicircle below. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-92.0 -92.0 184.0 130.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M-70,0 A70,70 0 0 1 70,0 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"16.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">28 cm</text></svg>","sol":"Curved edge = <sup>1</sup>⁄<sub>2</sub> × <sup>22</sup>⁄<sub>7</sub> × 28 = 44 cm. Perimeter = 44 + 28 = 72 cm","scheme":["M1 curved edge = 44 cm","A1 44 + 28 = 72 cm"],"watch":"Forgetting to add the straight edge (44 cm).","ans":"72 cm","check":{"type":"numeric","nums":[72.0],"unit":"cm","display":"72 cm"}},{"n":16,"s":"B","m":2,"text":"The quarter circle below has a radius of 14 cm. Find its <b>perimeter</b>. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-22.0 -92.0 114.0 130.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L70,0 A70,70 0 0 0 0,-70 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"14,0 14,-14 0,-14\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"35.0\" y=\"16.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text></svg>","sol":"Curved edge = <sup>1</sup>⁄<sub>4</sub> × 2 × <sup>22</sup>⁄<sub>7</sub> × 14 = 22 cm. Perimeter = 22 + 14 + 14 = 50 cm","scheme":["M1 curved edge = 22 cm","A1 22 + 14 + 14 = 50 cm"],"watch":"Adding only one straight edge (36 cm).","ans":"50 cm","check":{"type":"numeric","nums":[50.0],"unit":"cm","display":"50 cm"}},{"n":17,"s":"B","m":2,"text":"A circle just fits inside a square of side 20 cm. Find the area of the <b>shaded</b> part — the part of the square that is <b>outside</b> the circle. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-92.0 -92.0 184.0 200.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"-70\" y=\"-70\" width=\"140\" height=\"140\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#fff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><text x=\"0.0\" y=\"86.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text></svg>","sol":"Square = 20 × 20 = 400 cm<sup>2</sup>. Circle: r = 10 cm, area = 3.14 × 10 × 10 = 314 cm<sup>2</sup>. Shaded = 400 − 314 = 86 cm<sup>2</sup>","scheme":["M1 400 − area of circle","A1 86 cm<sup>2</sup>"],"watch":"Using r = 20 cm for the circle instead of r = 10 cm.","ans":"86 cm<sup>2</sup>","check":{"type":"numeric","nums":[86.0],"unit":"cm2","display":"86 cm²"}},{"n":18,"s":"B","m":2,"text":"The area of a circular table top is 254.34 cm<sup>2</sup>. Find its radius. (Take π = 3.14)","fig":"","sol":"r × r = 254.34 ÷ 3.14 = 81, so r = 9 cm","scheme":["M1 254.34 ÷ 3.14 = 81","A1 9 cm"],"watch":"Writing 81 cm and forgetting to take the square root.","ans":"9 cm","check":{"type":"numeric","nums":[9.0],"unit":"cm","display":"9 cm"}},{"n":19,"s":"B","m":2,"text":"The circumference of a circular badge is 44 cm. Find the area of the badge. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"","sol":"2 × <sup>22</sup>⁄<sub>7</sub> × r = 44, so r = 7 cm. A = <sup>22</sup>⁄<sub>7</sub> × 7 × 7 = 154 cm<sup>2</sup>","scheme":["M1 finding r = 7 cm","A1 154 cm<sup>2</sup>"],"watch":"Using the diameter 14 cm as the radius (616 cm<sup>2</sup>).","ans":"154 cm<sup>2</sup>","check":{"type":"numeric","nums":[154.0],"unit":"cm2","display":"154 cm²"}},{"n":20,"s":"B","m":2,"text":"The minute hand of a clock is 10.5 cm long. How far does the tip of the hand travel in one hour? (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"","sol":"In one hour the tip goes once round a circle of radius 10.5 cm. C = 2 × <sup>22</sup>⁄<sub>7</sub> × 10.5 = 66 cm","scheme":["M1 2 × 22 ÷ 7 × 10.5","A1 66 cm"],"watch":"Treating 10.5 cm as the diameter (33 cm).","ans":"66 cm","check":{"type":"numeric","nums":[66.0],"unit":"cm","display":"66 cm"}},{"n":21,"s":"C","m":4,"text":"Sofia bakes a round cake with a radius of 8 cm. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm        </text></svg>","sol":"","scheme":["M1 2 × 3.14 × 8","A1 50.24 cm","M1 3.14 × 8 × 8","A1 200.96 cm<sup>2</sup>"],"watch":"Mixing the two formulas up and giving the area in cm instead of cm<sup>2</sup>.","parts":[{"label":"(a)","text":"She ties a ribbon once round the edge of the cake. How long is the ribbon?","fig":"","m":2,"ans":"50.24 cm","sol":"C = 2 × 3.14 × 8 = 50.24 cm","check":{"type":"numeric","nums":[50.24],"unit":"cm","display":"50.24 cm"}},{"label":"(b)","text":"Find the area of the top of the cake.","fig":"","m":2,"ans":"200.96 cm<sup>2</sup>","sol":"A = 3.14 × 8 × 8 = 200.96 cm<sup>2</sup>","check":{"type":"numeric","nums":[200.96],"unit":"cm2","display":"200.96 cm²"}}]},{"n":22,"s":"C","m":4,"text":"Mei makes a card in the shape of a rectangle with a semicircle on top. The rectangle is 14 cm wide and 20 cm high. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-22.0 -78.0 186.0 280.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"112\" height=\"160\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><path d=\"M0,0 A56.0,56.0 0 0 1 112,0\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><text x=\"56.0\" y=\"178.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text><text x=\"128.0\" y=\"80.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text></svg>","sol":"","scheme":["M1 280 + area of semicircle","A1 357 cm<sup>2</sup>","M1 curved edge = 22 cm","A1 76 cm"],"watch":"Including the straight top of the rectangle in the perimeter — it is inside the card, not on its edge.","parts":[{"label":"(a)","text":"Find the total area of the card.","fig":"","m":2,"ans":"357 cm<sup>2</sup>","sol":"Rectangle = 14 × 20 = 280 cm<sup>2</sup>. Semicircle: r = 7 cm, area = <sup>1</sup>⁄<sub>2</sub> × <sup>22</sup>⁄<sub>7</sub> × 7 × 7 = 77 cm<sup>2</sup>. Total = 280 + 77 = 357 cm<sup>2</sup>","check":{"type":"numeric","nums":[357.0],"unit":"cm2","display":"357 cm²"}},{"label":"(b)","text":"Mei glues a strip of gold tape all the way round the edge of the card. Find the length of tape she needs.","fig":"","m":2,"ans":"76 cm","sol":"Curved edge = <sup>1</sup>⁄<sub>2</sub> × <sup>22</sup>⁄<sub>7</sub> × 14 = 22 cm. Perimeter = 22 + 20 + 20 + 14 = 76 cm","check":{"type":"numeric","nums":[76.0],"unit":"cm","display":"76 cm"}}]},{"n":23,"s":"C","m":4,"text":"Malee works out the area of a circle with a radius of 6 cm. She writes:<br><b>Area = 3.14 × 6 × 2 = 37.68 cm<sup>2</sup></b> (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 cm        </text></svg>","sol":"","scheme":["C1 says she doubled the radius instead of squaring it","C1 names π × r × r as the correct formula","M1 3.14 × 6 × 6","A1 113.04 cm<sup>2</sup>"],"watch":"Saying only “she used the wrong numbers” without naming the correct formula.","parts":[{"label":"(a)","text":"Explain the mistake Malee has made.","fig":"","m":2,"ans":"She multiplied the radius by 2 instead of by itself, so she used the circumference formula.","sol":"3.14 × 6 × 2 is 2 × π × r, which gives the circumference. For area she must use π × r × r, so the 2 should be a second 6.","check":{"type":"self"}},{"label":"(b)","text":"Work out the correct area of the circle.","fig":"","m":2,"ans":"113.04 cm<sup>2</sup>","sol":"A = 3.14 × 6 × 6 = 113.04 cm<sup>2</sup>","check":{"type":"numeric","nums":[113.04],"unit":"cm2","display":"113.04 cm²"}}]},{"n":24,"s":"C","m":4,"text":"A circular pond has a radius of 7 m. A stone path 3.5 m wide is built all the way round the pond, so the outer edge of the path is a circle of radius 10.5 m. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-92.0 -92.0 184.0 184.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M-70,0 A70,70 0 1 0 70,0 A70,70 0 1 0 -70,0 Z M-38.5,0 A38.5,38.5 0 1 1 38.5,0 A38.5,38.5 0 1 1 -38.5,0 Z\" fill=\"#c7d2fe\" fill-rule=\"evenodd\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"38.5\" y2=\"0.0\" stroke=\"#0f766e\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"19.2\" y=\"14.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#0f766e\" font-weight=\"600\" dominant-baseline=\"middle\">7 m     </text></svg>","sol":"","scheme":["M1 2 × 22 ÷ 7 × 10.5","A1 66 m","M1 346.5 − 154","A1 192.5 m<sup>2</sup>"],"watch":"Working out π × 3.5 × 3.5 for the path instead of subtracting the two circles.","parts":[{"label":"(a)","text":"Find the distance all the way round the outer edge of the path.","fig":"","m":2,"ans":"66 m","sol":"C = 2 × <sup>22</sup>⁄<sub>7</sub> × 10.5 = 66 m","check":{"type":"numeric","nums":[66.0],"unit":"m","display":"66 m"}},{"label":"(b)","text":"Find the area of the shaded path (the ring between the two circles).","fig":"","m":2,"ans":"192.5 m<sup>2</sup>","sol":"Large circle = <sup>22</sup>⁄<sub>7</sub> × 10.5 × 10.5 = 346.5 m<sup>2</sup>. Pond = <sup>22</sup>⁄<sub>7</sub> × 7 × 7 = 154 m<sup>2</sup>. Path = 346.5 − 154 = 192.5 m<sup>2</sup>","check":{"type":"numeric","nums":[192.5],"unit":"m2","display":"192.5 m²"}}]},{"n":25,"s":"C","m":4,"text":"The diagram shows a decorative border made from two equal semicircles joined end to end. The dashed straight line joining the two ends is 28 cm long. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-92.0 -57.0 184.0 101.0\" style=\"width:58mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M-70,0 A35.0,35.0 0 0 1 0,0 A35.0,35.0 0 0 0 70,0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#94a3b8\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/></svg>","sol":"","scheme":["M1 each curved edge = 22 cm","A1 44 cm","B1 says No","B1 compares 44 cm with 2 × 28 = 56 cm"],"watch":"Using 28 cm as the diameter of each semicircle instead of 14 cm.","parts":[{"label":"(a)","text":"Find the total length of the curved border.","fig":"","m":2,"ans":"44 cm","sol":"Each semicircle has a diameter of 28 ÷ 2 = 14 cm. Each curved edge = <sup>1</sup>⁄<sub>2</sub> × <sup>22</sup>⁄<sub>7</sub> × 14 = 22 cm. Total = 22 + 22 = 44 cm","check":{"type":"numeric","nums":[44.0],"unit":"cm","display":"44 cm"}},{"label":"(b)","text":"Ben says, “The curved border is twice as long as the dashed line.” Is Ben correct? Explain how you know.","fig":"","m":2,"ans":"No","sol":"Twice the dashed line would be 2 × 28 = 56 cm, but the border is only 44 cm, so Ben is wrong.","check":{"type":"yesno","value":"no"}}]}]},{"id":"12_Volume-Capacity","code":"Chapter 12","title":"Volume and Capacity","colour":"#2A3A70","blurb":"Cuboids, cubes and litres","sub":"Volume of solids made up of cubes and cuboids · Capacity · Word problems","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"Find the <b>volume</b> of the cube below.","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 272.0 208.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,34 100,34 100,134 0,134\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,34 34,0 134,0 100,34\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"100,34 134,0 134,100 100,134\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,134 34,100 134,100\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"34\" y1=\"0\" x2=\"34\" y2=\"100\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"50.0\" y=\"152.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 cm</text></svg>","sol":"Volume of a cube = edge × edge × edge = 5 × 5 × 5 = 125 cm<sup>3</sup>","scheme":[],"watch":"Working out 5 × 3 = 15 or 5 × 5 = 25 instead of multiplying by 5 three times.","opts":["15 cm<sup>3</sup>","25 cm<sup>3</sup>","125 cm<sup>3</sup>","150 cm<sup>3</sup>"],"ans":2,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"Find the <b>volume</b> of this cuboid.","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 304.0 188.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,36 130,36 130,114 0,114\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,36 36,0 166,0 130,36\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"130,36 166,0 166,78 130,114\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,114 36,78 166,78 =\"0,106 44,62 194,62\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"124.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">50 cm</text><text x=\"-14.0\" y=\"75.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text><text x=\"204.0\" y=\"24.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">30 cm</text></svg>","sol":"","scheme":["C1 states that 1 litre = 1000 cm<sup>3</sup>, not 100 cm<sup>3</sup>","B1 30 litres","M1 30 ÷ 2","A1 15 bottles"],"watch":"Mixing up 1 litre = 1000 cm<sup>3</sup> with the length fact 1 m = 100 cm.","parts":[{"label":"(a)","text":"Explain the mistake Malee has made, and write the correct capacity of the tank in litres.","fig":"","m":2,"ans":"She divided by 100 instead of 1000; 30 litres","sol":"Her multiplication is right, but 1 litre = 1000 cm<sup>3</sup>, not 100 cm<sup>3</sup>. The correct capacity is 30,000 ÷ 1000 = 30 litres.","check":{"type":"numeric","nums":[100.0,1000.0,30.0],"unit":"l","display":"She divided by 100 instead of 1000; 30 litres"}},{"label":"(b)","text":"How many 2-litre bottles can be filled from the full tank?","fig":"","m":2,"ans":"15 bottles","sol":"Number of bottles = 30 ÷ 2 = 15","check":{"type":"numeric","nums":[15.0],"unit":"","display":"15 bottles"}}]},{"n":24,"s":"C","m":4,"text":"The tank below is 60 cm long, 40 cm wide and 50 cm high. It holds water to a depth of <b>30 cm</b>.","fig":"<svg class=\"fig\" viewBox=\"-52.0 -14.0 310.0 192.0\" style=\"width:50mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,42 146,42 146,142 0,142\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,42 42,0 188,0 146,42\" fill=\"#f8fafc\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"146,42 188,0 188,100 146,142\" fill=\"#f1f5f9\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,82.0 146,82.0 146,142 0,142\" fill=\"#bae6fd\" fill-opacity=\"0.85\" stroke=\"none\"/><polygon points=\"146,82.0 188,40.0 188,100 146,142\" fill=\"#7dd3fc\" fill-opacity=\"0.85\" stroke=\"none\"/><polygon points=\"0,82.0 42,40.0 188,40.0 146,82.0\" fill=\"#38bdf8\" fill-opacity=\"0.6\" stroke=\"#1f2937\" stroke-width=\"1.2\"/><polygon points=\"0,42 146,42 146,142 0,142\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,142 42,100 188,100\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"73.0\" y=\"160.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">60 cm</text><text x=\"-14.0\" y=\"92.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">50 cm</text><text x=\"198.0\" y=\"23.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">40 cm</text></svg>","sol":"","scheme":["M1 60 × 40 × 30 = 72,000 cm<sup>3</sup>","A1 72 litres","M1 (120 − 72) ÷ 12","A1 4 minutes"],"watch":"Filling the whole tank (10 minutes) instead of only the empty part.","parts":[{"label":"(a)","text":"Find the volume of the water in litres.","fig":"","m":2,"ans":"72 litres","sol":"Volume = 60 × 40 × 30 = 72,000 cm<sup>3</sup> = 72 litres","check":{"type":"numeric","nums":[72.0],"unit":"l","display":"72 litres"}},{"label":"(b)","text":"A tap is turned on and fills the tank at 12 litres per minute. How long does it take to fill the tank to the top?","fig":"","m":2,"ans":"4 minutes","sol":"Capacity = 60 × 40 × 50 = 120,000 cm<sup>3</sup> = 120 litres. Water still needed = 120 − 72 = 48 litres. Time = 48 ÷ 12 = 4 minutes","check":{"type":"numeric","nums":[4.0],"unit":"","display":"4 minutes"}}]},{"n":25,"s":"C","m":4,"text":"Tank A, drawn below, is full of water. Anong pours <b>all</b> of the water into empty Tank B. The base of Tank B is 30 cm long and 20 cm wide.","fig":"<svg class=\"fig\" viewBox=\"-52.0 -14.0 294.0 156.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,40 132,40 132,106 0,106\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,40 40,0 172,0 132,40\" fill=\"#f8fafc\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"132,40 172,0 172,66 132,106\" fill=\"#f1f5f9\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,40 132,40 132,106 0,106\" fill=\"#bae6fd\" fill-opacity=\"0.85\" stroke=\"none\"/><polygon points=\"132,40 172,0 172,66 132,106\" fill=\"#7dd3fc\" fill-opacity=\"0.85\" stroke=\"none\"/><polygon points=\"0,40 40,0 172,0 132,40\" fill=\"#38bdf8\" fill-opacity=\"0.6\" stroke=\"#1f2937\" stroke-width=\"1.2\"/><polygon points=\"0,40 132,40 132,106 0,106\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,106 40,66 172,66\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"66.0\" y=\"124.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">25 cm</text><text x=\"-14.0\" y=\"73.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"182.0\" y=\"22.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text></svg>","sol":"","scheme":["M1 6,000 ÷ (30 × 20)","A1 10 cm","B1 says the volume of water does not change","C1 a larger base spreads the same water more thinly, so it is shallower (10 cm < 12 cm)"],"watch":"Thinking a larger container always gives a deeper water level.","parts":[{"label":"(a)","text":"Find the depth of the water in Tank B.","fig":"","m":2,"ans":"10 cm","sol":"Water in Tank A = 25 × 20 × 12 = 6,000 cm<sup>3</sup>. Base of Tank B = 30 × 20 = 600. Depth = 6,000 ÷ 600 = 10 cm","check":{"type":"numeric","nums":[10.0],"unit":"cm","display":"10 cm"}},{"label":"(b)","text":"Ben says, “The water must be deeper in Tank B, because the base of Tank B is longer.” Explain why Ben is wrong.","fig":"","m":2,"ans":"Ben is wrong","sol":"Pouring does not change the amount of water: it is still 6,000 cm<sup>3</sup>. The base of Tank B is larger (600 cm<sup>2</sup> instead of 500 cm<sup>2</sup>), so the same water spreads out more and is shallower — 10 cm in Tank B instead of 12 cm in Tank A.","check":{"type":"self"}}]}]},{"id":"13_Patterns","code":"Chapter 13","title":"Patterns","colour":"#B8457E","blurb":"Sequences and growing patterns","sub":"Problem solving involving number and figure patterns","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"Look at this number sequence.<br><b>4, &nbsp;11, &nbsp;18, &nbsp;25, &nbsp;___</b><br>What is the next number?","fig":"","sol":"Each number is 7 more than the one before. 25 + 7 = <b>32</b>.","scheme":[],"watch":"Adding 6 or 8 because the difference was not checked between every pair.","opts":["31","32","33","35"],"ans":1,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"Look at this number sequence.<br><b>96, &nbsp;87, &nbsp;78, &nbsp;69, &nbsp;…</b><br>Which sentence describes the rule?","fig":"","sol":"96 − 87 = 9, 87 − 78 = 9 and 78 − 69 = 9. The numbers go down, so the rule is <b>subtract 9 each time</b>.","scheme":[],"watch":"Saying “add 9” because the difference is 9, without noticing the sequence is going down.","opts":["Add 9 each time","Subtract 7 each time","Divide by 9 each time","Subtract 9 each time"],"ans":3,"check":{"type":"mcq"}},{"n":3,"s":"A","m":1,"text":"Look at this number sequence.<br><b>3, &nbsp;6, &nbsp;12, &nbsp;24, &nbsp;___</b><br>What is the next number?","fig":"","sol":"Each number is <b>double</b> the one before. 24 × 2 = <b>48</b>.","scheme":[],"watch":"Adding a difference instead of doubling (24 + 6 = 30, or 24 + 12 = 36).","opts":["30","36","48","96"],"ans":2,"check":{"type":"mcq"}},{"n":4,"s":"A","m":1,"text":"The pattern below is made of dots.<br>How many dots are in <b>Figure 5</b>?","fig":"<svg class=\"fig\" viewBox=\"-16.0 -62.0 180.0 112.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"44.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"44.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"64.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"64.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"108.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"108.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"108.0\" cy=\"-40.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"128.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"128.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"128.0\" cy=\"-40.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"148.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"148.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"148.0\" cy=\"-40.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><text x=\"0.0\" y=\"26.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 1</text><text x=\"54.0\" y=\"26.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 2</text><text x=\"128.0\" y=\"26.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 3</text></svg>","sol":"Figure <i>n</i> is a square with <i>n</i> rows of <i>n</i> dots: 1, 4, 9, 16, 25. Figure 5 = 5 × 5 = <b>25</b> dots.","scheme":[],"watch":"Multiplying 5 × 4 = 20 or 5 × 6 = 30 instead of 5 × 5.","opts":["20","25","30","36"],"ans":1,"check":{"type":"mcq"}},{"n":5,"s":"A","m":1,"text":"The pattern below is made of matchsticks.<br>How many matchsticks are needed for <b>Figure 4</b>?","fig":"<svg class=\"fig\" viewBox=\"-14.0 -14.0 229.6 82.0\" style=\"width:58mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><rect x=\"52.8\" y=\"0\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><rect x=\"76.8\" y=\"0\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><rect x=\"129.6\" y=\"0\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><rect x=\"153.6\" y=\"0\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><rect x=\"177.6\" y=\"0\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.2\"/><text x=\"12.0\" y=\"46.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 1</text><text x=\"76.8\" y=\"46.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 2</text><text x=\"165.6\" y=\"46.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Figure 3</text></svg>","sol":"The counts are 4, 7, 10, so 3 more matchsticks are added each time. Figure 4 = 10 + 3 = <b>13</b>.","scheme":[],"watch":"Working out 4 × 4 = 16 because Figure 1 uses 4 matchsticks.","opts":["11","12","13","16"],"ans":2,"check":{"type":"mcq"}},{"n":6,"s":"A","m":1,"text":"The table shows the number of tiles in each figure of a pattern.<br>How many tiles are in <b>Figure 10</b>?","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:center\">Figure</th><th style=\"text-align:center\">1</th><th style=\"text-align:center\">2</th><th style=\"text-align:center\">3</th><th style=\"text-align:center\">4</th></tr></thead><tbody><tr><td style=\"text-align:center\">Number of tiles</td><td style=\"text-align:center\">5</td><td style=\"text-align:center\">8</td><td style=\"text-align:center\">11</td><td style=\"text-align:center\">14</td></tr></tbody></table></div>","sol":"3 tiles are added each time. From Figure 1 to Figure 10 is 9 steps: 5 + 9 × 3 = <b>32</b> tiles.","scheme":[],"watch":"Multiplying 3 × 10 = 30 and forgetting the 2 extra tiles that Figure 1 starts with.","opts":["30","32","35","50"],"ans":1,"check":{"type":"mcq"}},{"n":7,"s":"A","m":1,"text":"A path is tiled in this repeating pattern:<br><b>white, black, red, blue, white, black, red, blue, …</b><br>What colour is <b>tile 27</b>?","fig":"","sol":"The pattern repeats every 4 tiles. 27 ÷ 4 = 6 remainder 3, so tile 27 is the <b>3rd</b> colour in the pattern: <b>red</b>.","scheme":[],"watch":"Reading the remainder 3 as “blue” by counting from 0 instead of from the first tile.","opts":["Black","Blue","Red","White"],"ans":2,"check":{"type":"mcq"}},{"n":8,"s":"A","m":1,"text":"Today is <b>Tuesday</b>. What day of the week will it be in <b>40 days’ time</b>?","fig":"","sol":"The days repeat every 7. 40 ÷ 7 = 5 remainder 5, so the day is 5 days after Tuesday: <b>Sunday</b>.","scheme":[],"watch":"Dividing 40 by 7 and using the 5 whole weeks instead of the remainder of 5 days.","opts":["Monday","Thursday","Saturday","Sunday"],"ans":3,"check":{"type":"mcq"}},{"n":9,"s":"A","m":1,"text":"One number is missing from this sequence.<br><b>4, &nbsp;10, &nbsp;___, &nbsp;22, &nbsp;28</b><br>What is the missing number?","fig":"","sol":"The numbers go up by 6 each time. 10 + 6 = <b>16</b> (and 16 + 6 = 22 ✓).","scheme":[],"watch":"Guessing a number between 10 and 22 without checking that the difference stays the same.","opts":["15","16","17","18"],"ans":1,"check":{"type":"mcq"}},{"n":10,"s":"A","m":1,"text":"The pattern below is made of dots.<br>How many dots are in <b>Figure 6</b>?","fig":"<svg class=\"fig\" viewBox=\"-16.0 -62.0 180.0 112.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"44.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"64.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"54.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"108.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"128.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"148.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"118.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"138.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"128.0\" cy=\"-40.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke  31, ฿ 39, … Week 1 is ฿ 15 and the 11 weeks after it add ฿ 8 each: 15 + 11 × 8 = 15 + 88 = <b>฿ 103</b>.","scheme":["M1 15 + 11 × 8","A1 ฿ 103"],"watch":"Using 12 lots of ฿ 8 and giving ฿ 111.","ans":"฿ 103","check":{"type":"numeric","nums":[103.0],"unit":"","display":"฿ 103"}},{"n":20,"s":"B","m":2,"text":"Krit folds a sheet of paper in half again and again. Each fold <b>doubles</b> the number of layers, so 1 fold gives 2 layers and 2 folds give 4 layers.<br>How many layers are there after <b>7 folds</b>?","fig":"","sol":"The layers double each time: 1 fold 2, 2 folds 4, 3 folds 8, 4 folds 16, 5 folds 32, 6 folds 64, 7 folds <b>128</b>. After 7 folds there are <b>128</b> layers.","scheme":["M1 doubling seven times (2, 4, 8, 16, 32, 64, 128)","A1 128 layers"],"watch":"Multiplying 2 × 7 = 14 instead of doubling seven times.","ans":"128 layers","check":{"type":"numeric","nums":[128.0],"unit":"","display":"128 layers"}},{"n":21,"s":"C","m":4,"text":"The dot pattern below grows in the same way each time. Each figure is a rectangle of dots.","fig":"<svg class=\"fig\" viewBox=\"-16.0 -62.0 240.0 112.0\" style=\"width:80mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"20.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"64.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"64.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"84.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"84.0\" cy=\"-20.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" stroke=\"#1f2937\" stroke-width=\"1\"/><circle cx=\"104.0\" cy=\"0.0\" r=\"6\" fill=\"#4338ca\" fill-opacity=\"0.85\" s re number, which ignores the constant difference.","parts":[{"label":"(a)","text":"Explain the mistake Mei has made.","fig":"","m":2,"ans":"The pattern adds 3 dots each time; it does not multiply","sol":"The numbers of dots are 5, 8, 11, so the pattern goes up by <b>3</b> dots each time, not by 5. Mei’s rule already fails at Figure 2: it gives 5 × 2 = 10 dots, but Figure 2 has only <b>8</b> dots.","check":{"type":"self"}},{"label":"(b)","text":"Work out the correct number of dots in <b>Figure 20</b>.","fig":"","m":2,"ans":"62 dots","sol":"From Figure 1 to Figure 20 is 19 steps of 3 dots: 5 + 19 × 3 = 5 + 57 = <b>62</b> dots.","check":{"type":"numeric","nums":[62.0],"unit":"","display":"62 dots"}}]},{"n":25,"s":"C","m":4,"text":"Two young plants are measured at the end of every week. Plant A grows 4 cm each week. Plant B <b>doubles</b> its height each week.","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:center\">Week</th><th style=\"text-align:center\">1</th><th style=\"text-align:center\">2</th><th style=\"text-align:center\">3</th><th style=\"text-align:center\">4</th><th style=\"text-align:center\">5</th></tr></thead><tbody><tr><td style=\"text-align:center\">Plant A (cm)</td><td style=\"text-align:center\">5</td><td style=\"text-align:center\">9</td><td style=\"text-align:center\">13</td><td style=\"text-align:center\">17</td><td style=\"text-align:center\">21</td></tr><tr><td style=\"text-align:center\">Plant B (cm)</td><td style=\"text-align:center\">1</td><td style=\"text-align:center\">2</td><td style=\"text-align:center\">4</td><td style=\"text-align:center\">8</td><td style=\"text-align:center\">16</td></tr></tbody></table></div>","sol":"","scheme":["B1 Plant A = 25 cm","B1 Plant B = 32 cm","B1 says Sofia is wrong","C1 doubling grows faster than adding 4 cm, and B is taller by week 6"],"watch":"Comparing only the starting heights instead of comparing how fast each pattern grows.","parts":[{"label":"(a)","text":"How tall is each plant at the end of <b>week 6</b>?","fig":"","m":2,"ans":"A = 25 cm, B = 32 cm","sol":"Plant A: 21 + 4 = <b>25 cm</b>. Plant B: 16 × 2 = <b>32 cm</b>.","check":{"type":"numeric","nums":[25.0,32.0],"unit":"cm","display":"A = 25 cm, B = 32 cm"}},{"label":"(b)","text":"Sofia says, “Plant A started taller, so Plant A will always be the taller plant.” Explain why Sofia is wrong.","fig":"","m":2,"ans":"Sofia is wrong","sol":"Plant B doubles, so it grows by a larger amount every week while Plant A always grows by 4 cm. By week 6 Plant B is 32 cm and Plant A is only 25 cm, so Plant B has overtaken it.","check":{"type":"self"}}]}]},{"id":"14_Presentation-of-Data","code":"Chapter 14","title":"Presentation of Data","colour":"#7E4A34","blurb":"Reading pie charts","sub":"Reading and interpreting pie charts","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"The pie chart shows how <b>200 pupils</b> travel to school. How many pupils travel by <b>bus</b>?","fig":"<div class=\"figbox\"><svg class=\"fig\" viewBox=\"-76.0 -76.0 152.0 152.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L0.00,-64.00 A64,64 0 0 1 37.62,51.78 Z\" fill=\"#4338ca\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"37.7\" y=\"-12.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">40%</text><path d=\"M0,0 L37.62,51.78 A64,64 0 0 1 -19.78,60.87 Z\" fill=\"#0d9488\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"6.2\" y=\"39.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">15%</text><path d=\"M0,0 L-19.78,60.87 A64,64 0 0 1 -51.78,-37.62 Z\" fill=\"#c2410c\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-37.7\" y=\"12.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">30%</text><path d=\"M0,0 L-51.78,- s the number of lorries.","ans":"26 lorries","check":{"type":"numeric","nums":[26.0],"unit":"","display":"26 lorries"}},{"n":19,"s":"B","m":2,"text":"The pie chart shows the rubbish collected on a clean-up day. What <b>fraction</b> of the rubbish were the <b>two smallest</b> sectors together? Give your answer in its simplest form.","fig":"<div class=\"figbox\"><svg class=\"fig\" viewBox=\"-78.0 -78.0 156.0 156.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L0.00,-66.00 A66,66 0 0 1 42.42,50.56 Z\" fill=\"#4338ca\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"38.5\" y=\"-14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">140°</text><path d=\"M0,0 L42.42,50.56 A66,66 0 0 1 -57.16,33.00 Z\" fill=\"#0d9488\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-7.1\" y=\"40.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">100°</text><path d=\"M0,0 L-57.16,33.00 A66,66 0 0 1 -42.42,-50.56 Z\" fill=\"#c2410c\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-40.3\" y=\"-7.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">80°</text><path d=\"M0,0 L-42.42,-50.56 A66,66 0 0 1 -0.00,-66.00 Z\" fill=\"#a21caf\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"-14.0\" y=\"-38.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" dominant-baseline=\"middle\">40°</text><circle cx=\"0\" cy=\"0\" r=\"66\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.6\"/></svg><div class=\"legend\"><span class=\"lgi\"><i style=\"background:#4338ca\"></i>Paper</span><span class=\"lgi\"><i style=\"background:#0d9488\"></i>Plastic</span><span class=\"lgi\"><i style=\"background:#c2410c\"></i>Glass</span><span class=\"lgi\"><i style=\"background:#a21caf\"></i>Metal</span></div></div>","sol":"The two smallest sectors are glass (80°) and metal (40°). 80° + 40° = 120°. Fraction = <sup>120</sup>⁄<sub>360</sub> = <sup>1</sup>⁄<sub>3</sub>.","scheme":["M1 80° + 40° = 120°","A1 <sup>1</sup>⁄<sub>3</sub>"],"watch":"Choosing the two largest sectors, or leaving the answer as <sup>120</sup>⁄<sub>360</sub>.","ans":"<sup>1</sup>⁄<sub>3</sub>","check":{"type":"numeric","nums":[1.0,3.0],"unit":"","display":"1 ⁄ 3"}},{"n":20,"s":"B","m":2,"text":"The pie chart shows the medals won by four teams on sports day. What <b>percentage</b> of the medals were won by the <b>Tigers</b>?","fig":"<div class=\"figbox\"><svg class=\"fig\" viewBox=\"-72.0 -72.0 144.0 144.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 L0.00,-60.00 A60,60 0 0 1 18.54,57.06 Z\" fill=\"#4338ca\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><path d=\"M0,0 L18.54,57.06 A60,60 0 0 1 -60.00,0.00 Z\" fill=\"#0d9488\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><path d=\"M0,0 L-60.00,0.00 A60,60 0 0 1 -35.27,-48.54 Z\" fill=\"#c2410c\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><path d=\"M0,0 L-35.27,-48.54 A60,60 0 0 1 -0.00,-60.00 Z\" fill=\"#a21caf\" fill-opacity=\"0.82\" stroke=\"#fff\" stroke-width=\"2\"/><circle cx=\"0\" cy=\"0\" r=\"60\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.6\"/></svg><div class=\"legend\"><span class=\"lgi\"><i style=\"background:#4338ca\"></i>Falcons (18)</span><span class=\"lgi\"><i style=\"background:#0d9488\"></i>Tigers (12)</span><span class=\"lgi\"><i style=\"background:#c2410c\"></i>Dolphins (6)</span><span class=\"lgi\"><i style=\"background:#a21caf\"></i>Eagles (4)</span></div></div>","sol":"Total = 18 + 12 + 6 + 4 = 40 medals. <sup>12</sup>⁄<sub>40</sub> × 100% = 30%.","scheme":["M1 total = 40 medals","A1 30%"],"watch":"Writing 12% because the Tigers won 12 medals.","ans":"30%","check":{"type":"numeric","nums":

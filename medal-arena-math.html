round\"/><text x=\"80.0\" y=\"128.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">6</text><line x1=\"51.000000000000014\" y1=\"130.22947341949745\" x2=\"47.000000000000014\" y2=\"137.15767664977295\" stroke=\"#1C2340\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"56.500000000000014\" y=\"121.70319397786862\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">7</text><line x1=\"29.770526580502555\" y1=\"109.0\" x2=\"22.842323350227048\" y2=\"113.0\" stroke=\"#1C2340\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"39.29680602213138\" y=\"104.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">8</text><line x1=\"22.0\" y1=\"80.0\" x2=\"14.0\" y2=\"80.00000000000001\" stroke=\"#1C2340\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"33.0\" y=\"81.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">9</text><line x1=\"29.770526580502562\" y1=\"50.99999999999999\" x2=\"22.842323350227055\" y2=\"46.99999999999999\" stroke=\"#1C2340\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"39.296806022131385\" y=\"57.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">10</text><line x1=\"50.99999999999997\" y1=\"29.770526580502576\" x2=\"46.99999999999997\" y2=\"22.84232335022707\" stroke=\"#1C2340\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"56.49999999999998\" y=\"40.2968060221314\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">11</text><line x1=\"80\" y1=\"80\" x2=\"80\" y2=\"28\" stroke=\"#1C2340\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"80\" y1=\"80\" x2=\"50.55513627132909\" y2=\"63.0\" stroke=\"#1C2340\" stroke-width=\"4.5\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"80\" r=\"4\" fill=\"#1C2340\"/></svg>", "steps": ["There are 30° between neighboring numbers on a clock (360° ÷ 12).", "At 10:00 the hands point to 10 and 12, which are 2 spaces apart.", "2 × 30° = 60°."], "tip": "Each hour mark is 30° apart.", "unit": "", "options": ["60°", "30°", "90°", "120°", "300°"], "correct": 0, "ansText": "60°"}, {"n": 17, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "Which fraction is equal to <span class=\"fr\"><span class=\"nu\">2</span><span class=\"de\">5</span></span>?", "fig": "", "steps": ["Multiply the top and bottom of <span class=\"fr\"><span class=\"nu\">2</span><span class=\"de\">5</span></span> by 3: <span class=\"fr\"><span class=\"nu\">6</span><span class=\"de\">15</span></span>.", "The others are <span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">3</span></span>, <span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">2</span></span>, <span class=\"fr\"><span class=\"nu\">3</span><span class=\"de\">8</span></span> and <span class=\"fr\"><span class=\"nu\">8</span><span class=\"de\">25</span></span> — none equal <span class=\"fr\"><span class=\"nu\">2</span><span class=\"de\">5</span></span>."], "tip": "Equal fractions: do the same to the top and the bottom.", "unit": "", "options": ["<span class=\"fr\"><span class=\"nu\">6</span><span class=\"de\">15</span></span>", "<span class=\"fr\"><span class=\"nu\">4</span><span class=\"de\">12</span></span>", "<span class=\"fr\"><span class=\"nu\">5</span><span class=\"de\">10</span></span>", "<span class=\"fr\"><span class=\"nu\">3</span><span class=\"de\">8</span></span>", "<span class=\"fr\"><span class=\"nu\">8</span><span class=\"de\">25</span></span>"], "correct": 0, "ansText": "<span class=\"fr\"><span class=\"nu\">6</span><span class=\"de\">15</span></span>"}, {"n": 18, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "The pages of a book are numbered from 1 to 120. How many digits are printed in total?", "fig": "", "steps": ["Pages 1–9: 9 digits.", "Pages 10–99: 90 pages × 2 = 180 digits.", "Pages 100–120: 21 pages × 3 = 63 digits.", "9 + 180 + 63 = 252."], "tip": "Split into one-, two- and three-digit page numbers.", "unit": "", "options": ["240", "252", "360", "249", "243"], "correct": 1, "ansText": "252"}, {"n": 19, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "On a balance, 3 cups weigh the same as 2 bowls, and 1 bowl weighs the same as 6 spoons. How many spoons weigh the same as 6 cups?", "fig": "", "steps": ["6 cups = 2 × (3 cups) = 2 × 2 bowls = 4 bowls.", "4 bowls = 4 × 6 spoons = 24 spoons."], "tip": "Swap one item for another step by step.", "unit": "", "options": ["12", "24", "18", "36", "9"], "correct": 1, "ansText": "24"}, {"n": 20, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "How many rectangles of any size are in this row of 5 squares? (Squares count as rectangles.)", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 208 48\" width=\"208\" height=\"48\"><rect x=\"4\" y=\"4\" width=\"200\" height=\"40\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><line x1=\"44\" y1=\"4\" x2=\"44\" y2=\"44\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"84\" y1=\"4\" x2=\"84\" y2=\"44\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"124\" y1=\"4\" x2=\"124\" y2=\"44\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"164\" y1=\"4\" x2=\"164\" y2=\"44\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["1 square wide: 5. 2 wide: 4. 3 wide: 3. 4 wide: 2. 5 wide: 1.", "5 + 4 + 3 + 2 + 1 = 15."], "tip": "Row of n squares: n + (n − 1) + … + 1.", "unit": "", "options": ["5", "10", "14", "15", "20"], "correct": 3, "ansText": "15"}, {"n": 21, "sec": "C", "pts": 5, "topic": "Number Sense", "kind": "fill", "text": "What is 11 + 13 + 15 + … + 27 + 29?", "fig": "", "steps": ["The odd numbers from 11 to 29: there are 10 of them.", "Pair them: 11 + 29 = 40, 13 + 27 = 40, … → 5 pairs.", "5 × 40 = 200."], "tip": "Pair the first and last numbers.", "unit": "", "correct": "200", "ansText": "200"}, {"n": 22, "sec": "C", "pts": 5, "topic": "Word Problems", "kind": "fill", "text": "A water tank is <span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">4</span></span> full. After 45 liters of water are added, the tank is <span class=\"fr\"><span class=\"nu\">3</span><span class=\"de\">4</span></span> full. How many liters does the tank hold when it is completely full?", "fig": "", "steps": ["From <span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">4</span></span> full to <span class=\"fr\"><span class=\"nu\">3</span><span class=\"de\">4</span></span> full is an increase of <span class=\"fr\"><span class=\"nu\">2</span><span class=\"de\">4</span></span> = <span class=\"fr\"><span class=\"nu\">1</span><span class=\"de\">2</span></span> of the tank.", "So half the tank = 45 liters.", "The full tank holds 2 × 45 = 90 liters."], "tip": "Work out what fraction the added water fills.", "unit": "liters", "correct": "90", "ansText": "90 liters"}, {"n": 23, "sec": "C", "pts": 5, "topic": "Geometry", "kind": "fill", "text": "A 4 × 4 × 4 cube is made from 64 small cubes. The outside of the big cube is painted blue. How many small cubes have exactly 1 blue face?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 205\" width=\"170\" height=\"174\"><polygon points=\"100.0,12.0 183.1384387633061,60.0 100.0,108.0 16.861561236693888,60.0\" fill=\"#F4F6FB\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><polygon points=\"183.1384387633061,156.0 100.0,204.0 100.0,108.0 183.1384387633061,60.0\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><polygon points=\"16.861561236693888,156.0 100.0,204.0 100.0,108.0 16.861561236693888,60.0\" fill=\"#D5DAEE\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"120.78460969082653\" y1=\"24.0\" x2=\"37.646170927520416\" y2=\"72.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"79.21539030917347\" y1=\"24.0\" x2=\"162.35382907247958\" y2=\"72.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"162.35382907247958\" y1=\"168.0\" x2=\"162.35382907247958\" y2=\"72.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"183.1384387633061\" y1=\"132.0\" x2=\"100.0\" y2=\"180.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"37.646170927520416\" y1=\"168.0\" x2=\"37.646170927520416\" y2=\"72.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"16.861561236693888\" y1=\"132.0\" x2=\"100.0\" y2=\"180.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"141.56921938165306\" y1=\"36.0\" x2=\"58.430780618346944\" y2=\"84.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"58.430780618346944\" y1=\"36.0\" x2=\"141.56921938165306\" y2=\"84.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"141.56921938165306\" y1=\"180.0\" x2=\"141.56921938165306\" y2=\"84.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"183.1384387633061\" y1=\"108.0\" x2=\"100.0\" y2=\"156.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"58.430780618346944\" y1=\"180.0\" x2=\"58.430780618346944\" y2=\"84.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"16.861561236693888\" y1=\"108.0\" x2=\"100.0\" y2=\"156.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"162.35382907247958\" y1=\"48.0\" x2=\"79.21539030917347\" y2=\"96.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"37.646170927520416\" y1=\"48.0\" x2=\"120.78460969082653\" y2=\"96.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"120.78460969082653\" y1=\"192.0\" x2=\"120.78460969082653\" y2=\"96.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"183.1384387633061\" y1=\"84.0\" x2=\"100.0\" y2=\"132.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"79.21539030917347\" y1=\"192.0\" x2=\"79.21539030917347\" y2=\"96.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"16.861561236693888\" y1=\"84.0\" x2=\"100.0\" y2=\"132.0\" stroke=\"#1C2340\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><polygon points=\"100.0,12.0 183.1384387633061,60.0 100.0,108.0 16.861561236693888,60.0\" fill=\"none\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><polygon points=\"183.1384387633061,156.0 100.0,204.0 100.0,108.0 183.1384387633061,60.0\" fill=\"none\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><polygon points=\"16.861561236693888,156.0 100.0,204.0 100.0,108.0 16.861561236693888,60.0\" fill=\"none\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/></svg>", "steps": ["Cubes with exactly 1 painted face are in the middle of each face, away from the edges.", "Each face of the big cube has a 2 × 2 middle: 4 cubes.", "The cube has 6 faces: 6 × 4 = 24."], "tip": "One painted face = the inside part of each face.", "unit": "", "correct": "24", "ansText": "24"}, {"n": 24, "sec": "C", "pts": 5, "topic": "Patterns", "kind": "fill", "text": "What is the 50th number in the pattern 7, 11, 15, 19, …?", "fig": "", "steps": ["The pattern starts at 7 and adds 4 each time.", "To reach the 50th number, we add 4 a total of 49 times.", "7 + 49 × 4 = 7 + 196 = 203."], "tip": "nth number = first number + (n − 1) × jump.", "unit": "", "correct": "203", "ansText": "203"}, {"n": 25, "sec": "C", "pts": 5, "topic": "Counting", "kind": "fill", "text": "How many three-digit numbers have digits that multiply to 12? (For example, 126, because 1 × 2 × 6 = 12.)", "fig": "", "steps": ["Find the digit groups that multiply to 12: {1, 2, 6}, {1, 3, 4} and {2, 2, 3}.", "{1, 2, 6} can be arranged in 6 ways, and {1, 3, 4} in 6 ways.", "{2, 2, 3} has a repeated digit: 223, 232, 322 → 3 ways.", "6 + 6 + 3 = 15."], "tip": "Find the digit groups first, then count the arrangements.", "unit": "", "correct": "15", "ansText": "15"}]}, {"id": 5, "medal": "Diamond", "level": "Champion", "grade": "Grade 4", "color": "#2AA7B8", "blurb": "The top rung: our hardest mixed set for confident Grade 4 problem solvers.", "qs": [{"n": 1, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "What is 99 × 7?", "fig": "", "steps": ["99 × 7 = 100 × 7 − 1 × 7.", "700 − 7 = 693."], "tip": "Multiplying by 99? Multiply by 100, then subtract once.", "unit": "", "options": ["700", "693", "707", "683", "630"], "correct": 1, "ansText": "693"}, {"n": 2, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>100, 91, 83, 76, 70, ___</b>", "fig": "", "steps": ["The jumps are −9, −8, −7, −6.", "The next jump is −5.", "70 − 5 = 65."], "tip": "Write the jumps underneath each pair.", "unit": "", "options": ["64", "66", "60", "69", "65"], "correct": 4, "ansText": "65"}, {"n": 3, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "A diagonal joins two corners of a shape that are not next to each other. How many diagonals does a pentagon have?", "fig": "", "steps": ["From each corner you can draw a diagonal to 5 − 3 = 2 other corners.", "5 corners × 2 = 10, but each diagonal was counted twice.", "10 ÷ 2 = 5 diagonals."], "tip": "Count from every corner, then divide by 2.", "unit": "", "options": ["10", "4", "5", "3", "6"], "correct": 2, "ansText": "5"}, {"n": 4, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "Sara has $24. She saves $5 every week. After how many weeks will she have $64?", "fig": "", "steps": ["She needs $64 − $24 = $40 more.", "$40 ÷ $5 = 8 weeks."], "tip": "Find how much more is needed before dividing.", "unit": "", "options": ["9", "7", "13", "8", "40"], "correct": 3, "ansText": "8"}, {"n": 5, "sec": "A", "pts": 3, "topic": "Number Sense", "kind": "mc", "text": "Which number is a multiple of both 6 and 8?", "fig": "", "steps": ["Common multiples of 6 and 8 are multiples of 24: 24, 48, 72, …", "Only 48 is in the list."], "tip": "Find the smallest common multiple first (24).", "unit": "", "options": ["48", "36", "32", "30", "56"], "correct": 0, "ansText": "48"}, {"n": 6, "sec": "A", "pts": 3, "topic": "Logic", "kind": "mc", "text": "The day before yesterday was Monday. What day will it be tomorrow?", "fig": "", "steps": ["The day before yesterday was Monday, so yesterday was Tuesday.", "Today is Wednesday.", "Tomorrow is Thursday."], "tip": "Write the days in a row and move one step at a time.", "unit": "", "options": ["Wednesday", "Friday", "Tuesday", "Thursday", "Saturday"], "correct": 3, "ansText": "Thursday"}, {"n": 7, "sec": "A", "pts": 3, "topic": "Counting", "kind": "mc", "text": "How many two-digit numbers are multiples of 8?", "fig": "", "steps": ["The smallest is 16 (8 × 2) and the largest is 96 (8 × 12).", "From 8 × 2 to 8 × 12 there are 12 − 2 + 1 = 11 multiples."], "tip": "Count the multipliers, not the multiples.", "unit": "", "options": ["12", "10", "11", "13", "96"], "correct": 2, "ansText": "11"}, {"n": 8, "sec": "A", "pts": 3, "topic": "Patterns", "kind": "mc", "text": "Figure 1 has 3 squares, Figure 2 has 5 squares and Figure 3 has 7 squares, as shown. The pattern continues. How many squares are in Figure 10?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 262 110\" width=\"262\" height=\"110\"><rect x=\"12\" y=\"46\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"12\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"30\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><text x=\"30.0\" y=\"98\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">Figure 1</text><rect x=\"84\" y=\"28\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"84\" y=\"46\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"84\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"102\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"120\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><text x=\"111.0\" y=\"98\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">Figure 2</text><rect x=\"174\" y=\"10\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"174\" y=\"28\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"174\" y=\"46\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"174\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"192\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"210\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><rect x=\"228\" y=\"64\" width=\"18\" height=\"18\" fill=\"#FCEFD0\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><text x=\"210.0\" y=\"98\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:500;fill:#1C2340\">Figure 3</text></svg>", "steps": ["Each new figure adds 2 squares (one on each arm).", "Figure 10 = 3 + 9 × 2 = 21."], "tip": "Rule: squares = 2 × (figure number) + 1. Check: 2 × 3 + 1 = 7. <span class=\"ok\">✓</span>", "unit": "", "options": ["20", "21", "23", "19", "30"], "correct": 1, "ansText": "21"}, {"n": 9, "sec": "A", "pts": 3, "topic": "Word Problems", "kind": "mc", "text": "Adult tickets cost $9 and child tickets cost $5. A family of 2 adults and some children paid $43 altogether. How many children were there?", "fig": "", "steps": ["2 adult tickets: 2 × $9 = $18.", "Child tickets: $43 − $18 = $25.", "$25 ÷ $5 = 5 children."], "tip": "Take away the known part first.", "unit": "", "options": ["4", "6", "7", "3", "5"], "correct": 4, "ansText": "5"}, {"n": 10, "sec": "A", "pts": 3, "topic": "Geometry", "kind": "mc", "text": "A rectangle has a perimeter of 32 cm. Its length is 3 times its width. What is its area?", "fig": "", "steps": ["Length + width = half the perimeter = 16 cm.", "Length = 3 parts and width = 1 part, so 4 parts = 16 cm and 1 part = 4 cm.", "Width 4 cm, length 12 cm. Area = 12 × 4 = 48 cm²."], "tip": "Use parts: length + width = half the perimeter.", "unit": "", "options": ["64 cm²", "32 cm²", "36 cm²", "96 cm²", "48 cm²"], "correct": 4, "ansText": "48 cm²"}, {"n": 11, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "What is 1 + 2 − 3 + 4 + 5 − 6 + 7 + 8 − 9 + … + 28 + 29 − 30?", "fig": "", "steps": ["Group the numbers in threes: (1 + 2 − 3) + (4 + 5 − 6) + … + (28 + 29 − 30).", "The groups equal 0, 3, 6, 9, …, 27 (each group is 3 more than the one before).", "0 + 3 + 6 + … + 27 = 3 × (0 + 1 + 2 + … + 9) = 3 × 45 = 135."], "tip": "Find the repeating group and look for a pattern in the group totals.", "unit": "", "options": ["145", "135", "120", "150", "165"], "correct": 1, "ansText": "135"}, {"n": 12, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "Ivy, Jon and Kit are each either a knight, who always tells the truth, or a knave, who always lies. Ivy says, “Exactly one of us is a knight.” Jon says, “Ivy is a knave.” Kit says, “Ivy and Jon are different types.” Who are the knights?", "fig": "", "steps": ["Suppose Ivy is a knight. Then she is the only knight, so Jon and Kit are knaves. But Kit’s words “Ivy and Jon are different types” would then be true — a knave cannot say something true. <span class=\"no\">✗</span>", "So Ivy is a knave. Jon’s words “Ivy is a knave” are true, so Jon is a knight.", "Ivy (knave) and Jon (knight) are different types, so Kit’s words are true: Kit is a knight.", "Check Ivy: “Exactly one of us is a knight” is false (there are two) <span class=\"ok\">✓</span>. The knights are Jon and Kit."], "tip": "Assume one case, follow it, and look for a contradiction.", "unit": "", "options": ["Jon and Kit", "Only Jon", "Only Kit", "Ivy and Kit", "Nobody"], "correct": 0, "ansText": "Jon and Kit"}, {"n": 13, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "How many triangles of any size are in this figure?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 180\" width=\"260\" height=\"180\"><polygon points=\"130,10 10,170 250,170\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"130\" y1=\"10\" x2=\"90.0\" y2=\"170\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"130\" y1=\"10\" x2=\"170.0\" y2=\"170\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"82.0\" y1=\"74.0\" x2=\"178.0\" y2=\"74.0\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"46.0\" y1=\"122.0\" x2=\"214.0\" y2=\"122.0\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["Every triangle uses the top point. Its bottom side lies on the base or on one of the two lines across.", "Each of these 3 lines is cut into 3 pieces, giving 3 + 2 + 1 = 6 triangles per line.", "3 × 6 = 18 triangles."], "tip": "Count one line at a time, then multiply by the number of lines.", "unit": "", "options": ["12", "6", "15", "24", "18"], "correct": 4, "ansText": "18"}, {"n": 14, "sec": "B", "pts": 4, "topic": "Patterns", "kind": "mc", "text": "What number comes next?<br><b class='seq'>1, 2, 5, 14, 41, ___</b>", "fig": "", "steps": ["Each number is 3 times the one before, minus 1: 1 × 3 − 1 = 2, 2 × 3 − 1 = 5, 5 × 3 − 1 = 14, 14 × 3 − 1 = 41.", "41 × 3 − 1 = 122."], "tip": "The jumps are 1, 3, 9, 27 — they multiply by 3.", "unit": "", "options": ["122", "123", "82", "121", "164"], "correct": 0, "ansText": "122"}, {"n": 15, "sec": "B", "pts": 4, "topic": "Word Problems", "kind": "mc", "text": "A farm has ducks and cows. Together they have 15 heads and 44 legs. How many cows are there?", "fig": "", "steps": ["Pretend all 15 animals are ducks: 15 × 2 = 30 legs.", "Extra legs: 44 − 30 = 14. Each cow has 2 extra legs.", "14 ÷ 2 = 7 cows. Check: 7 × 4 + 8 × 2 = 28 + 16 = 44 <span class=\"ok\">✓</span>."], "tip": "Assume they are all the 2-legged animal first.", "unit": "", "options": ["8", "6", "9", "7", "14"], "correct": 3, "ansText": "7"}, {"n": 16, "sec": "B", "pts": 4, "topic": "Geometry", "kind": "mc", "text": "A 2 cm by 3 cm notch is cut from the middle of the top side of an 8 cm by 8 cm square, as shown. What is the perimeter of the new shape?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 206 192\" width=\"206\" height=\"192\"><polygon points=\"40,26 91,26 91,77 125,77 125,26 176,26 176,162 40,162\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><text x=\"108\" y=\"177\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:13px;font-weight:600;fill:#1C2340\">8 cm</text><text x=\"18\" y=\"94\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:13px;font-weight:600;fill:#1C2340\">8 cm</text><text x=\"108\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:600;fill:#E4572E\">2 cm</text><text x=\"145\" y=\"51.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font-family:Sora,sans-serif;font-size:11px;font-weight:600;fill:#E4572E\">3 cm</text></svg>", "steps": ["The square’s perimeter is 4 × 8 = 32 cm.", "The notch removes 2 cm of the top edge but adds a 2 cm bottom edge — no change.", "It also adds two new 3 cm sides: 32 + 3 + 3 = 38 cm."], "tip": "A notch in the middle of a side adds its two depth sides to the perimeter.", "unit": "", "options": ["38 cm", "32 cm", "26 cm", "35 cm", "40 cm"], "correct": 0, "ansText": "38 cm"}, {"n": 17, "sec": "B", "pts": 4, "topic": "Number Sense", "kind": "mc", "text": "Two whole numbers multiply to 48 and add up to 14. What is the difference between them?", "fig": "", "steps": ["Factor pairs of 48: 1 × 48, 2 × 24, 3 × 16, 4 × 12, 6 × 8.", "Only 6 + 8 = 14.", "Difference: 8 − 6 = 2."], "tip": "List factor pairs in order, then check the sum.", "unit": "", "options": ["4", "6", "2", "8", "14"], "correct": 2, "ansText": "2"}, {"n": 18, "sec": "B", "pts": 4, "topic": "Counting", "kind": "mc", "text": "Seven friends each send one card to every other friend. How many cards are sent in total?", "fig": "", "steps": ["Each friend sends 6 cards (to everyone except themself).", "7 × 6 = 42 cards."], "tip": "Careful: card A → B and card B → A are two different cards, so don’t divide by 2.", "unit": "", "options": ["21", "49", "14", "42", "36"], "correct": 3, "ansText": "42"}, {"n": 19, "sec": "B", "pts": 4, "topic": "Logic", "kind": "mc", "text": "In 6 years, Ben will be 3 times as old as he was 6 years ago. How old is Ben now?", "fig": "", "steps": ["From “6 years ago” to “in 6 years” is 12 years.", "His future age is 3 times his past age, so the 12-year gap equals 2 times his past age.", "His age 6 years ago was 6, so he is 12 now. Check: in 6 years, 18 = 3 × 6 <span class=\"ok\">✓</span>."], "tip": "The gap between two ages never changes.", "unit": "", "options": ["18", "6", "12", "9", "24"], "correct": 2, "ansText": "12"}, {"n": 20, "sec": "B", "pts": 4, "topic": "Geometry", "kind": "mc", "text": "A square is cut into 3 identical rectangles, as shown. Each rectangle has a perimeter of 24 cm. What is the perimeter of the square?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 140 140\" width=\"140\" height=\"140\"><rect x=\"10\" y=\"10\" width=\"120\" height=\"120\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><line x1=\"10\" y1=\"50.0\" x2=\"130\" y2=\"50.0\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"10\" y1=\"90.0\" x2=\"130\" y2=\"90.0\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["Each rectangle is as long as the square’s side, and 3 widths make one side.", "Try a side of 9 cm: each rectangle is 9 cm by 3 cm, with perimeter 9 + 3 + 9 + 3 = 24 cm <span class=\"ok\">✓</span>.", "Perimeter of the square: 4 × 9 = 36 cm."], "tip": "Write every length in terms of the square’s side.", "unit": "", "options": ["72 cm", "36 cm", "48 cm", "24 cm", "27 cm"], "correct": 1, "ansText": "36 cm"}, {"n": 21, "sec": "C", "pts": 5, "topic": "Counting", "kind": "fill", "text": "How many whole numbers from 1 to 60 are multiples of 4 or 6 (or both)?", "fig": "", "steps": ["Multiples of 4: 60 ÷ 4 = 15.", "Multiples of 6: 60 ÷ 6 = 10.", "Multiples of both (multiples of 12) were counted twice: 60 ÷ 12 = 5.", "15 + 10 − 5 = 20."], "tip": "Add the two groups, then subtract the overlap.", "unit": "", "correct": "20", "ansText": "20"}, {"n": 22, "sec": "C", "pts": 5, "topic": "Patterns", "kind": "fill", "text": "The whole numbers are written in order with no spaces:<br><b class='seq'>12345678910111213…</b><br>What is the 40th digit?", "fig": "", "steps": ["Digits 1–9 come from the numbers 1 to 9.", "40 − 9 = 31 more digits. Two-digit numbers use 2 digits each: 15 numbers use 30 digits (10 to 24).", "The 31st of these digits is the first digit of the next number, 25: it is 2."], "tip": "Count the one-digit numbers first, then jump in pairs of digits.", "unit": "", "correct": "2", "ansText": "2"}, {"n": 23, "sec": "C", "pts": 5, "topic": "Counting", "kind": "fill", "text": "How many squares of any size are in this 3 × 4 grid?", "fig": "<svg class=\"fig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 144 110\" width=\"144\" height=\"110\"><rect x=\"4\" y=\"4\" width=\"136\" height=\"102\" fill=\"#E9ECF7\" stroke=\"#1C2340\" stroke-width=\"2.2\"/><line x1=\"38\" y1=\"4\" x2=\"38\" y2=\"106\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"72\" y1=\"4\" x2=\"72\" y2=\"106\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"106\" y1=\"4\" x2=\"106\" y2=\"106\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"4\" y1=\"38\" x2=\"140\" y2=\"38\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"4\" y1=\"72\" x2=\"140\" y2=\"72\" stroke=\"#1C2340\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "steps": ["1 × 1 squares: 12.", "2 × 2 squares: 2 rows × 3 columns = 6.", "3 × 3 squares: 1 row × 2 columns = 2.", "12 + 6 + 2 = 20."], "tip": "Count by size. Bigger squares have fewer positions.", "unit": "", "correct": "20", "ansText": "20"}, {"n": 24, "sec": "C", "pts": 5, "topic": "Word Problems", "kind": "fill", "text": "The price of 5 oranges is the same as the price of 3 mangoes. A mango costs 30 cents more than an orange. How many cents does one orange cost?", "fig": "", "steps": ["3 mangoes = 3 oranges + 3 × 30 cents = 3 oranges + 90 cents.", "5 oranges = 3 oranges + 90 cents, so 2 oranges = 90 cents.", "1 orange = 45 cents. Check: mango = 75; 5 × 45 = 225 and 3 × 75 = 225 <span class=\"ok\">✓</span>."], "tip": "Write a mango as “orange + 30”, then compare both sides.", "unit": "cents", "correct": "45", "ansText": "45 cents"}, {"n": 25, "sec": "C", "pts": 5, "topic": "Number Sense", "kind": "fill", "text": "What is the smallest whole number that has exactly 8 factors?", "fig": "", "steps": ["Check numbers with many factors: 12 has 6, 18 has 6, 20 has 6.", "24 has factors 1, 2, 3, 4, 6, 8, 12 and 24 — that is 8.", "No number smaller than 24 has 8 factors, so the answer is 24."], "tip": "List factors in pairs (1 × 24, 2 × 12, 3 × 8, 4 × 6) so none are missed.", "unit": "", "correct": "24", "ansText": "24"}]}];
const LETTERS = "ABCDE";
const SECS = {A:{pts:3,range:"1–10",kind:"Multiple choice"},B:{pts:4,range:"11–20",kind:"Multiple choice"},C:{pts:5,range:"21–25",kind:"Write your answer"}};
const TOPICS = ["Number Sense","Patterns","Logic","Geometry","Counting","Word Problems"];
const SECCOL = {A:["#22306B","#fff"],B:["#E8B23A","#1C2340"],C:["#E4572E","#fff"]};
const app = document.getElementById("app");
let S = {view:"home"};
let timerId = null;

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function medalFor(p){ return p>=75?"Gold":p>=55?"Silver":p>=35?"Bronze":null; }
const MEDALCOL = {Gold:"#E8B23A",Silver:"#9AA3B5",Bronze:"#B87333"};
function secStyle(sec){ const c=SECCOL[sec]; return `--sc:${c[0]};--sct:${c[1]}`; }
function norm(v){ return String(v||"").replace(/[,\s]/g,""); }
function isRight(q,a){ if(a===undefined||a===null||a==="") return false; return q.kind==="mc" ? a===q.correct : norm(a)===norm(q.correct); }
function answered(a){ return a!==undefined && a!==null && a!==""; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function stripTags(h){ const d=document.createElement("div"); d.innerHTML=h.replace(/<br\s*\/?>/g," "); return d.textContent; }

function topbar(extra=""){
  return `<div class="topbar"><div class="brand"><i></i>MEDAL ARENA MATH</div><div class="sp"></div>${extra}</div>`;
}

/* ---------------- HOME ---------------- */
function renderHome(){
  stopTimer();
  const cards = TESTS.map(t=>{
    const best = store.get("ma-best-"+t.id);
    const bestTxt = best ? `<span class="pill">Best: ${best.pts} / 95</span>${best.medal?`<span>${best.medal}</span>`:""}` : `<span class="pill">Not tried yet</span>`;
    return `<button class="tcard" data-test="${t.id}" style="--mc:${t.color}">
      <div class="medal"><b>${t.id}</b></div>
      <h3>${t.medal}</h3>
      <div class="meta">${t.level} · ${t.grade}</div>
      <div class="best">${bestTxt}</div></button>`;
  }).join("");
  app.innerHTML = topbar() + `
  <section class="hero"><div class="ring"></div><div class="sq"></div><div class="tri"></div>
    <div class="lab" style="color:var(--gold)">Olympiad-style practice · Grade 3–4</div>
    <h1 style="margin-top:10px">Climb from Bronze to <em>Diamond</em></h1>
    <p>Five mock tests with 25 original questions each. Take a timed test like the real thing, or practice with instant feedback, step-by-step solutions and a shortcut tip for every question.</p>
    <div class="facts"><span>25 questions per test</span><span>95 points</span><span>60 minutes</span><span>No calculator</span></div>
  </section>
  <div class="ladder-head"><h2>Choose a test</h2><span class="lab">Test 1 is the easiest · Test 5 is the hardest</span></div>
  <div class="ladder">${cards}</div>
  <div class="how">
    <div style="--sc:#22306B"><b>Section A</b><p>Questions 1–10 · multiple choice · 3 points each</p></div>
    <div style="--sc:#E8B23A"><b>Section B</b><p>Questions 11–20 · multiple choice · 4 points each</p></div>
    <div style="--sc:#E4572E"><b>Section C</b><p>Questions 21–25 · write the answer · 5 points each</p></div>
  </div>
  <p class="foot">Topics: number sense, patterns, logic, geometry, counting and word problems. © Bright EngMath</p>`;
  app.querySelectorAll(".tcard").forEach(b=>b.onclick=()=>{ S={view:"intro",test:+b.dataset.test}; render(); });
}

/* ---------------- INTRO ---------------- */
function renderIntro(){
  const t = TESTS[S.test-1];
  const counts = TOPICS.map(tp=>`<tr><td>${tp}</td><td style="text-align:right">${t.qs.filter(q=>q.topic===tp).length}</td></tr>`).join("");
  app.innerHTML = topbar(`<button class="btn btn-ghost" id="back">← All tests</button>`) + `
  <div class="intro" style="--mc:${t.color}">
    <div class="panel">
      <div class="medal" style="--mc:${t.color}"><b>${t.id}</b></div>
      <h2 style="margin-top:14px">Mock Test ${t.id}</h2>
      <div class="lvl"><span>${t.medal.toUpperCase()}</span>${t.level} · ${t.grade}</div>
      <p style="margin:0;color:var(--ink2)">${t.blurb}</p>
      <table class="sc"><tr><th>Section</th><th>Questions</th><th>Points</th></tr>
        <tr><td><b>A</b> · Multiple choice</td><td>1–10</td><td>10 × 3 = 30</td></tr>
        <tr><td><b>B</b> · Multiple choice</td><td>11–20</td><td>10 × 4 = 40</td></tr>
        <tr><td><b>C</b> · Write the answer</td><td>21–25</td><td>5 × 5 = 25</td></tr>
        <tr><td><b>Total</b></td><td>25</td><td><b>95</b></td></tr></table>
      <table class="sc" style="margin-top:14px"><tr><th>Topic</th><th style="text-align:right">Questions</th></tr>${counts}</table>
    </div>
    <div class="modes">
      <div class="lab">How do you want to play?</div>
      <button class="mode primary" id="m-test"><h3>Timed test</h3>
        <p>60 minutes, just like a real competition. Move between questions freely. You see your score, your medal and every solution when you finish.</p>
        <span class="go">Start the test →</span></button>
      <button class="mode" id="m-prac"><h3>Practice</h3>
        <p>No timer. Check each answer as you go and see the step-by-step solution and a shortcut tip right away.</p>
        <span class="go">Start practicing →</span></button>
      <div class="panel" style="padding:16px"><div class="lab">Tips</div>
        <ul style="margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:14.5px">
          <li>Read each question twice.</li><li>Draw a picture or make a list.</li>
          <li>Stuck? Skip it and come back later.</li><li>Wrong answers don’t lose points, so answer every question.</li></ul></div>
    </div>
  </div>`;
  document.getElementById("back").onclick=()=>{S={view:"home"};render();};
  document.getElementById("m-test").onclick=()=>startQuiz("test");
  document.getElementById("m-prac").onclick=()=>startQuiz("practice");
}

/* ---------------- QUIZ ---------------- */
function startQuiz(mode){
  S = {view:"quiz", test:S.test, mode, i:0, ans:{}, checked:{}, confirm:false, end: mode==="test" ? Date.now()+60*60*1000 : null};
  render(); window.scrollTo({top:0});
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function tick(){
  const el=document.getElementById("timer"); if(!el||!S.end) return;
  const left=Math.max(0,S.end-Date.now()); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  el.classList.toggle("low", left<5*60000);
  if(left<=0){ stopTimer(); S.timeUp=true; finish(); }
}
function renderQuiz(){
  const t=TESTS[S.test-1], q=t.qs[S.i], a=S.ans[q.n], chk=S.checked[q.n];
  const practice=S.mode==="practice";
  const done=Object.keys(S.ans).filter(k=>answered(S.ans[k])).length;
  const timer = practice ? `<span class="chip">Practice mode</span>` : `<span class="timer" id="timer" aria-label="Time left">60:00</span>`;
  let body="";
  if(q.kind==="mc"){
    body=`<div class="opts" role="group" aria-label="Answer choices">`+q.options.map((o,k)=>{
      let cls="opt", tag="";
      if(practice&&chk){ if(k===q.correct){cls+=" right";tag=`<span class="tag ok">✓ Correct answer</span>`;} else if(k===a){cls+=" wrong";tag=`<span class="tag no">✗ Your answer</span>`;} }
      else if(k===a) cls+=" sel";
      return `<button class="${cls}" data-k="${k}" ${practice&&chk?"disabled":""} aria-pressed="${k===a}"><span class="L">${LETTERS[k]}</span><span>${o}</span>${tag}</button>`;
    }).join("")+`</div>`;
  } else {
    const st = practice&&chk ? (isRight(q,a)?"right":"wrong") : "";
    body=`<div class="fill"><label class="lab" for="fill-${q.n}" style="width:100%">Your answer</label>
      <input id="fill-${q.n}" class="${st}" inputmode="numeric" autocomplete="off" value="${esc(a||"")}" ${practice&&chk?"disabled":""} placeholder="Type a number">
      ${q.unit?`<span class="unit">${q.unit}</span>`:""}</div><div class="hint">Write a whole number. Press Enter to ${practice?"check":"go to the next question"}.</div>`;
  }
  let fb="";
  if(practice&&chk){
    const ok=isRight(q,a);
    fb=`<div class="feedback ${ok?"good":"bad"}" role="status"><div class="fh">${ok?'<span class="ok">✓</span> Correct! +'+q.pts+' points':'<span class="no">✗</span> Not quite. The answer is '+(q.kind==="mc"?LETTERS[q.correct]+" ("+q.ansText+")":q.ansText)+"."}</div>
      <div class="sol"><ol class="steps">${q.steps.map(s=>`<li>${s}</li>`).join("")}</ol><div class="tip"><b>Shortcut tip</b>${q.tip}</div></div></div>`;
  }
  const last=S.i===t.qs.length-1;
  let nav;
  if(practice){
    nav = `<button class="btn btn-ghost" id="prev" ${S.i===0?"disabled":""}>← Previous</button>` +
      (chk ? (last?`<button class="btn btn-gold" id="finish">See my results</button>`:`<button class="btn btn-primary" id="next">Next question →</button>`)
           : `<button class="btn btn-primary" id="check" ${answered(a)?"":"disabled"}>Check answer</button>`);
  } else {
    nav = `<button class="btn btn-ghost" id="prev" ${S.i===0?"disabled":""}>← Previous</button>` +
      (last?`<button class="btn btn-gold" id="submit">Finish test</button>`:`<button class="btn btn-primary" id="next">Next →</button>`);
  }
  const pal=t.qs.map((qq,k)=>{
    let c="pg"; const aa=S.ans[qq.n];
    if(practice&&S.checked[qq.n]) c+= isRight(qq,aa)?" r":" w"; else if(answered(aa)) c+=" done";
    if(k===S.i) c+=" cur";
    return `<button class="${c}" data-go="${k}" aria-label="Question ${qq.n}">${qq.n}</button>`;
  }).join("");
  const confirm = S.confirm ? (()=>{ const un=t.qs.filter(qq=>!answered(S.ans[qq.n])).length;
      return `<div class="confirm" role="alertdialog"><p>${un?`You have ${un} unanswered question${un>1?"s":""}. `:""}Finish the test and see your score?</p>
      <div class="row"><button class="btn btn-gold" id="yes">Yes, finish</button><button class="btn btn-ghost" id="no">Keep working</button></div></div>`; })() : "";
  const secBadge=`<span class="chip sec">Section ${q.sec}</span>`;
  app.innerHTML = topbar(`<button class="btn btn-ghost" id="quit">Quit</button>`) + `
  <div class="qhead"><div class="title">Mock Test ${t.id} · ${t.medal}<small>${practice?"Practice":"Timed test"} · Question ${q.n} of 25</small></div><div style="flex:1"></div>${timer}</div>
  <div class="progress" aria-hidden="true"><i style="width:${(practice?Object.keys(S.checked).length:done)/25*100}%"></i></div>
  <div class="qlayout">
    <article class="qcard" style="${secStyle(q.sec)}">
      <div class="qmeta"><div class="qnum">${q.n}</div>${secBadge}<span class="chip">${q.pts} points</span>${practice?`<span class="chip">${q.topic}</span>`:""}</div>
      <div class="qtext">${q.text}</div>
      ${q.fig?`<div class="qfig">${q.fig}</div>`:""}
      ${body}${fb}
      <div class="qnav">${nav}</div>
    </article>
    <aside class="side">
      <div class="palette"><div class="lab">Questions</div><div class="pgrid">${pal}</div>
        <div class="legend">${practice?'<span><span class="ok">✓</span> correct</span><span><span class="no">✗</span> wrong</span>':'<span>Shaded = answered</span>'}<span>Gold ring = current</span></div></div>
      ${practice?`<button class="btn btn-ghost" id="finishNow">Finish and see results</button>`:`<button class="btn btn-gold" id="submitSide">Finish test</button>`}
      ${confirm}
    </aside>
  </div>`;
  // events
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ S.ans[q.n]=+b.dataset.k; renderQuiz(); });
  const inp=document.getElementById("fill-"+q.n);
  if(inp){ inp.oninput=()=>{ S.ans[q.n]=inp.value.trim(); const c=document.getElementById("check"); if(c) c.disabled=!answered(S.ans[q.n]); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); if(practice){ if(answered(S.ans[q.n])&&!chk){S.checked[q.n]=true;renderQuiz();} } else if(!last){go(S.i+1);} else {S.confirm=true;renderQuiz();} } };
    if(!(practice&&chk)) inp.focus({preventScroll:true}); }
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f;};
  on("prev",()=>go(S.i-1)); on("next",()=>go(S.i+1));
  on("check",()=>{ S.checked[q.n]=true; renderQuiz(); });
  on("finish",()=>finish()); on("finishNow",()=>finish());
  on("submit",()=>{S.confirm=true;renderQuiz();}); on("submitSide",()=>{S.confirm=true;renderQuiz();});
  on("yes",()=>finish()); on("no",()=>{S.confirm=false;renderQuiz();});
  on("quit",()=>{ S={view:"intro",test:S.test}; stopTimer(); render(); });
  app.querySelectorAll(".pg").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  if(!practice){ if(!timerId) timerId=setInterval(tick,1000); tick(); }
}
function go(i){ S.i=Math.max(0,Math.min(24,i)); S.confirm=false; renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------------- RESULTS ---------------- */
function finish(){
  stopTimer();
  const t=TESTS[S.test-1]; let pts=0; const sec={A:0,B:0,C:0}; const top={};
  TOPICS.forEach(tp=>top[tp]=[0,0]);
  t.qs.forEach(q=>{ top[q.topic][1]++; if(isRight(q,S.ans[q.n])){ pts+=q.pts; sec[q.sec]+=q.pts; top[q.topic][0]++; } });
  const medal=medalFor(pts);
  const prev=store.get("ma-best-"+t.id);
  if(!prev||pts>prev.pts) store.set("ma-best-"+t.id,{pts,medal});
  S={view:"results",test:S.test,mode:S.mode,ans:S.ans,pts,sec,top,medal,timeUp:S.timeUp};
  render(); window.scrollTo({top:0});
}
function renderResults(){
  const t=TESTS[S.test-1]; const right=t.qs.filter(q=>isRight(q,S.ans[q.n])).length;
  const mcol = S.medal?MEDALCOL[S.medal]:"#7C84A6";
  const msg = S.medal==="Gold"?"Outstanding! That is a gold-medal score.":S.medal==="Silver"?"Great work — a silver-medal score.":S.medal==="Bronze"?"Nice job — you earned bronze. Review the solutions to climb higher.":"Keep training! Read the solutions below and try again.";
  const topics=TOPICS.map(tp=>{const [r,n]=S.top[tp]; return `<div class="trow"><span>${tp}</span><div class="bar"><i style="width:${n?r/n*100:0}%"></i></div><span>${r}/${n}</span></div>`;}).join("");
  const rv=t.qs.map(q=>{
    const a=S.ans[q.n], ok=isRight(q,a), has=answered(a);
    const yours = has ? (q.kind==="mc"?`${LETTERS[a]} (${q.options[a]})`:esc(a)+(q.unit?" "+q.unit:"")) : "No answer";
    const correct = q.kind==="mc"?`${LETTERS[q.correct]} (${q.ansText})`:q.ansText;
    return `<details class="rv"><summary><span class="st ${ok?"r":has?"w":"s"}" aria-label="${ok?"Correct":has?"Wrong":"Skipped"}">${ok?"✓":has?"✗":"–"}</span>
      <span class="sm">${q.n}. ${esc(stripTags(q.text))} <small>· ${q.topic} · ${q.pts} pts</small></span></summary>
      <div class="body"><div class="qtext" style="font-size:17px">${q.text}</div>${q.fig?`<div class="qfig">${q.fig}</div>`:""}
      <div class="cmp"><span>Your answer: ${yours}</span><span class="ok">Correct answer: ${correct}</span></div>
      <ol class="steps">${q.steps.map(s=>`<li>${s}</li>`).join("")}</ol><div class="tip"><b>Shortcut tip</b>${q.tip}</div></div></details>`;
  }).join("");
  app.innerHTML = topbar(`<button class="btn btn-ghost" id="home">All tests</button>`) + `
  <section class="panel">
    <div class="res-top"><div class="bigmedal" style="--mc:${mcol}"><div>${S.medal?S.medal.toUpperCase():"SCORE"}<b>${S.pts}</b>/ 95</div></div>
      <div><div class="lab">Mock Test ${t.id} · ${t.medal} · ${S.mode==="test"?"Timed test":"Practice"}</div>
        <h2 style="margin-top:6px">${S.pts} points</h2>
        <p>${S.timeUp?"Time is up! ":""}${msg} You answered ${right} of 25 questions correctly.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-primary" id="again">Try this test again</button>
          ${S.test<5?`<button class="btn btn-ghost" id="nextT">Go to Test ${S.test+1}</button>`:""}</div></div></div>
    <div class="scores"><div>Section A<b>${S.sec.A}<small style="font-size:15px"> / 30</small></b></div><div>Section B<b>${S.sec.B}<small style="font-size:15px"> / 40</small></b></div>
      <div>Section C<b>${S.sec.C}<small style="font-size:15px"> / 25</small></b></div><div class="tot">Total<b>${S.pts}<small style="font-size:15px"> / 95</small></b></div></div>
  </section>
  <h3 class="sectitle">Topics</h3><div class="panel"><div class="topics">${topics}</div></div>
  <h3 class="sectitle">Review every question</h3><p style="margin:0;color:var(--ink2)">Tap a question to see the step-by-step solution and shortcut tip.</p>
  <div class="review">${rv}</div>
  <p class="foot">Medal guide: Gold 75–95 · Silver 55–74 · Bronze 35–54. © Bright EngMath</p>`;
  document.getElementById("home").onclick=()=>{S={view:"home"};render();};
  document.getElementById("again").onclick=()=>{ S={view:"intro",test:t.id}; render(); };
  const n=document.getElementById("nextT"); if(n) n.onclick=()=>{ S={view:"intro",test:t.id+1}; render(); window.scrollTo({top:0}); };
}

function render(){ ({home:renderHome,intro:renderIntro,quiz:renderQuiz,results:renderResults})[S.view](); }
render();
</script>

</body>
</html>

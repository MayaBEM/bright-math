ght=\"500\" dominant-baseline=\"middle\">12</text><line x1=\"-5.0\" y1=\"-175.0\" x2=\"340.0\" y2=\"-175.0\" stroke=\"#e2e8f0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"-10.0\" y=\"-175.0\" font-size=\"11\" text-anchor=\"end\" fill=\"#1f2937\" font-weight=\"500\" dominant-baseline=\"middle\">14</text><line x1=\"-5.0\" y1=\"-200.0\" x2=\"340.0\" y2=\"-200.0\" stroke=\"#e2e8f0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"-10.0\" y=\"-200.0\" font-size=\"11\" text-anchor=\"end\" fill=\"#1f2937\" font-weight=\"500\" dominant-baseline=\"middle\">16</text><rect x=\"17.5\" y=\"-187.5\" width=\"50.0\" height=\"187.5\" fill=\"#4338ca\" fill-opacity=\"0.8\" stroke=\"#1f2937\" stroke-width=\"1.2\"/><text x=\"42.5\" y=\"18.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"500\" dominant-baseline=\"middle\">Fruit</text><rect x=\"102.5\" y=\"-150.0\" width=\"50.0\" height=\"150.0\" fill=\"#4338ca\" fill-opacity=\"0.8\" stroke=\"#1f2937\" stroke-width=\"1.2\"/><text x=\"127.5\" y=\"18.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"500\" dominant-baseline=\"middle\">Cake</text><rect x=\"187.5\" y=\"-75.0\" width=\"50.0\" height=\"75.0\" fill=\"#4338ca\" fill-opacity=\"0.8\" stroke=\"#1f2937\" stroke-width=\"1.2\"/><text x=\"212.5\" y=\"18.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"500\" dominant-baseline=\"middle\">Nuts</text><rect x=\"272.5\" y=\"-37.5\" width=\"50.0\" height=\"37.5\" fill=\"#4338ca\" fill-opacity=\"0.8\" stroke=\"#1f2937\" stroke-width=\"1.2\"/><text x=\"297.5\" y=\"18.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"500\" dominant-baseline=\"middle\">Crisps</text><text x=\"-46\" y=\"-100.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" transform=\"rotate(-90 -46 -100.0)\">Number of pupils</text></svg>","sol":"","scheme":["M1 <sup>15</sup>⁄<sub>36</sub> × 360","A1 150°","M1 cake = <sup>12</sup>⁄<sub>36</sub> × 360° = 120°","C1 says 120° is not a right angle (90°), so Krit is wrong"],"watch":"Sharing 360° equally between the four bars instead of using the totals.","parts":[{"label":"(a)","text":"Sofia draws a pie chart of this data. Find the <b>angle</b> of the sector for <b>fruit</b>.","fig":"","m":2,"ans":"150°","sol":"Total = 15 + 12 + 6 + 3 = 36 pupils. Angle = <sup>15</sup>⁄<sub>36</sub> × 360° = 150°.","check":{"type":"numeric","nums":[150.0],"unit":"deg","display":"150°"}},{"label":"(b)","text":"Krit says, “The cake sector will be a right angle.” Explain why Krit is <b>wrong</b>.","fig":"","m":2,"ans":"No — the cake sector is 120°","sol":"Cake is 12 pupils out of 36, which is <sup>1</sup>⁄<sub>3</sub> of the pupils. Its angle is <sup>12</sup>⁄<sub>36</sub> × 360° = 120°. A right angle is 90°, so Krit is wrong.","check":{"type":"self"}}]},{"n":25,"s":"C","m":4,"text":"Two classes each drew a pie chart of their favourite fruit. The table shows the size of the <b>mango</b> sector in each chart.","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:left\">Class</th><th style=\"text-align:center\">Number of pupils</th><th style=\"text-align:center\">Angle of the mango sector</th></tr></thead><tbody><tr><td style=\"text-align:left\">Anong’s class</td><td style=\"text-align:center\">30</td><td style=\"text-align:center\">120°</td></tr><tr><td style=\"text-align:left\">Krit’s class</td><td style=\"text-align:center\">45</td><td style=\"text-align:center\">96°</td></tr></tbody></table></div>","sol":"","scheme":["M1 <sup>120</sup>⁄<sub>360</sub> × 30 or <sup>96</sup>⁄<sub>360</sub> × 45","A1 10 pupils and 12 pupils","B1 says Malee is wrong","C1 explains that the class totals are different, so a sector shows a fraction, not a number"],"watch":"Comparing the two angles alone when the class totals are not the same.","parts":[{"label":"(a)","text":"Work out how many pupils chose mango in <b>each</b> class.","fig":"","m":2,"ans":"Anong’s class 10, Krit’s class 12","sol":"Anong’s class: <sup>120</sup>⁄<sub>360</sub> × 30 = 10 pupils. Krit’s class: <sup>96</sup>⁄<sub>360</sub> × 45 = 12 pupils.","check":{"type":"numeric","nums":[10.0,12.0],"unit":"","display":"Anong’s class 10, Krit’s class 12"}},{"label":"(b)","text":"Malee says, “Anong’s class has the bigger mango sector, so more pupils in her class chose mango.” Explain why Malee is <b>wrong</b>.","fig":"","m":2,"ans":"Malee is wrong","sol":"A sector shows the <i>fraction</i> of a class, not the number of pupils. The two classes have different totals, so a bigger sector can still mean fewer pupils: 10 pupils in Anong’s class but 12 in Krit’s class.","check":{"type":"self"}}]}]},{"id":"PA_Mid-Term-Exam","code":"Paper A","title":"Mid-Term Examination","colour":"#1F2846","blurb":"Chapters 7–10 · 100 marks","sub":"Chapters 7–10 · 2-D shapes · 3-D shapes · Perimeter and area of triangles · Area and perimeter of polygons","marks":100,"qs":[{"n":1,"s":"A","m":1,"text":"Find the value of <b>∠x</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 98.9 272.0 117.1\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,192.0 224.0,192.0 88.3,122.9\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"18.9,177.2 19.4,177.9 19.9,178.6 20.4,179.4 20.9,180.1 21.3,180.9 21.7,181.7 22.1,182.5 22.4,183.3 22.7,184.2 23.0,185.0 23.2,185.9 23.4,186.7 23.6,187.6 23.7,188.5 23.9,189.3 23.9,190.2 24.0,191.1 24.0,192.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"37.8\" y=\"179.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">38°</text><polyline points=\"200.0,192.0 200.0,191.4 200.0,190.7 200.1,190.1 200.1,189.5 200.2,188.9 200.3,188.2 200.4,187.6 200.5,187.0 200.7,186.4 200.8,185.8 201.0,185.2 201.2,184.6 201.4,184.0 201.6,183.4 201.8,182.8 202.1,182.2 202.3,181.7 202.6,181.1\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"185.1\" y=\"183.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">27°</text><polyline points=\"109.7,133.8 108.3,136.1 106.7,138.2 104.9,140.2 102.9,141.9 100.7,143.5 98.3,144.7 95.8,145.7 93.3,146.4 90.6,146.8 87.9,146.9 85.3,146.7 82.6,146.2 80.1,145.4 77.6,144.4 75.3,143.1 73.1,141.5 71.2,139.7 69.4,137.7\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"92.2\" y=\"160.7\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text></svg>","sol":"The angles of a triangle add up to 180°. x = 180° − 38° − 27° = 115°.","scheme":[],"watch":"Adding the two given angles and stopping there (65°).","opts":["65°","115°","125°","153°"],"ans":1,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"Krit is going to draw triangle <i>DEF</i> with <i>DE</i> = 8 cm, ∠<i>EDF</i> = 50° and ∠<i>DEF</i> = 60°. Which step should he do <b>first</b>?","fig":"","sol":"Both angles are measured from the line DE, so DE must be drawn first. The 50° angle is then drawn at D and the 60° angle at E.","scheme":[],"watch":"Starting with an angle before the side it is measured from has been drawn.","opts":["Draw the 50° angle","Draw the 60° angle","Draw the line DE 8 cm long","Draw an arc with compasses"],"ans":2,"check":{"type":"mcq"}},{"n":3,"s":"A","m":1,"text":"Anong draws a <b>chord</b> in a circle of radius <b>6 cm</b>. Which of these <b>cannot</b> be the length of her chord?","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"-58.5\" y1=\"-38.5\" x2=\"58.5\" y2=\"-38.5\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"-51.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">chord</text></svg>","sol":"The longest chord of a circle is a diameter, and a diameter is itself a chord. Here the diameter is 2 × 6 = 12 cm, so 12 cm is possible but a chord of 13 cm is not.","scheme":[],"watch":"Comparing the chord with the radius (6 cm) instead of with the diameter.","opts":["4 cm","9 cm","12 cm","13 cm"],"ans":3,"check":{"type":"mcq"}},{"n":4,"s":"A","m":1,"text":"In triangle <i>PQR</i>, <i>PQ</i> = <i>PR</i> and ∠<i>QPR</i> = 44°. Find ∠<i>PQR</i>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 178.0 208.9\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,160.9 130.0,160.9 65.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"74.0,22.3 73.0,22.6 72.1,22.9 71.1,23.2 70.1,23.5 69.1,23.7 68.1,23.8 67.0,23.9 66.0,24.0 65.0,24.0 64.0,24.0 63.0,23.9 61.9,23.8 60.9,23.7 59.9,23.5 58.9,23.2 57.9,22.9 57.0,22.6 56.0,22.3\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"65.0\" y=\"38.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">44°</text><line x1=\"92.9\" y1=\"82.3\" x2=\"102.1\" y2=\"78.6\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"37.1\" y1=\"82.3\" x2=\"27.9\" y2=\"78.6\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"-11.6\" y=\"170.4\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text><text x=\"141.6\" y=\"170.4\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">R</text><text x=\"65.0\" y=\"-15.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text></svg>","sol":"180° − 44° = 136° is shared by the two equal base angles. ∠PQR = 136° ÷ 2 = 68°.","scheme":[],"watch":"Giving 136°, the total of both base angles, instead of one of them.","opts":["44°","68°","88°","136°"],"ans":1,"check":{"type":"mcq"}},{"n":5,"s":"A","m":1,"text":"What is the best description of the triangle below?","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 168.0 168.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,120.0 120.0,120.0 0.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,109.0 11.0,109.0 11.0,120.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><line x1=\"60.0\" y1=\"115.0\" x2=\"60.0\" y2=\"125.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"5.0\" y1=\"60.0\" x2=\"-5.0\" y2=\"60.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"The small square shows a right angle and the tick marks show that two sides are equal, so the triangle is right-angled and isosceles.","scheme":[],"watch":"Choosing equilateral because two sides are marked equal — all three must be equal for that.","opts":["Right-angled and isosceles","Right-angled and scalene","Isosceles and obtuse-angled","Equilateral"],"ans":0,"check":{"type":"mcq"}},{"n":6,"s":"A","m":1,"text":"How many <b>edges</b> does the square pyramid below have?","fig":"<svg class=\"fig\" viewBox=\"-26.0 -26.0 194.0 198.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"71.0,0 0,146 108,146\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"71.0,0 108,146 142,112\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><poly "/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 136.0 110.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"52\" y=\"52\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"78\" y=\"52\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">C</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 200.0 148.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"32\" y=\"0\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"84\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"116\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"84\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">D</div><svg class=\"fig\" viewBox=\"-16.0 -22.0 196.0 116.0\" style=\"width:27mm\" xmlns=\"

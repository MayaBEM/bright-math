 "feels like talking" response can be eliminated as it breaks formal register.`],hint3EliminateIndex:3,tags:[`conversation`,`telephone`,`formal-register`,`school-context`]},{id:`MT4-Q16`,testId:`mock-test-4`,section:`Cloze Dialogue or Short Message`,order:16,skill:`Filling a blank in a formal email using contextual clues`,skillTag:`conversation`,difficulty:`Advanced`,instruction:`Read the email and choose the best word or phrase for blank (1).`,stimulus:{type:`message`,channel:`email`,from:`Somchai Panya (Parent)`,to:`Admissions Office`,subject:`Question about Entrance Exam Schedule`,body:[`Dear Admissions Office,`,`I am writing to ask about the entrance exam date for my daughter, Nara. I understand the exam was originally scheduled for August 10th, but I recently heard it might be (1) ______ to August 17th because of the school renovation.`,`Could you please confirm the correct date? Since Nara will need to prepare her transport arrangements, an early confirmation would be greatly appreciated.`,`Thank you very much for your time.`,`Best regards,`,`Somchai Panya`]},question:`Choose the best word for blank (1).`,options:[`cancelled`,`forgotten`,`invented`,`postponed`],correctAnswer:3,explanationEnglish:`"Postponed" means moved to a later date, which fits the context of the exam possibly being moved from August 10th to August 17th due to renovation, not cancelled entirely.`,explanationThai:`"Postponed" หมายถึงการเลื่อนไปวันหลัง ตรงกับบริบทที่สอบอาจถูกเลื่อนจากวันที่ 10 ไปเป็นวันที่ 17 สิงหาคม เนื่องจากการปรับปรุงอาคาร ไม่ใช่การยกเลิกทั้งหมด`,keyClue:`"scheduled for August 10th... might be (1) to August 17th"`,optionExplanations:[`Incorrect — "cancelled" means called off entirely, but a new date (August 17th) is given, so it is not cancelled.`,`Incorrect — "forgotten" means not remembered, which does not fit the context of a rescheduled date.`,`Incorrect — "invented" means created for the first time, which makes no sense with an exam date.`,`Correct — "postponed" fits perfectly since a new, later date is mentioned.`],hints:[`Notice that a new date, August 17th, is mentioned right after the blank.`,`A word describing a schedule change to a later date is needed here.`,`"Invented" can be eliminated because it makes no logical sense with a date.`],hint3EliminateIndex:2,tags:[`cloze`,`email`,`vocabulary-in-context`,`school-context`]},{id:`MT4-Q17`,testId:`mock-test-4`,section:`Cloze Dialogue or Short Message`,order:17,skill:`Filling a blank in a formal email using grammar clues`,skillTag:`grammar`,difficulty:`Advanced`,instruction:`Read the same email from question 16 again. Now choose the best word or phrase for blank (2), found in the reply below.`,stimulus:{type:`message`,channel:`email`,from:`Admissions Office`,to:`Somchai Panya (Parent)`,subject:`RE: Question about Entrance Exam Schedule`,body:[`Dear Mr. Panya,`,`Thank you for your message. I can confirm that the exam date (2) ______ changed to August 17th due to the ongoing renovation work in the main hall.`,`We apologize for any inconvenience this may cause and appreciate your understanding.`,`Kind regards,`,`Admissions Office`]},question:`Choose the best word for blank (2).`,options:[`has been`,`is being`,`was`,`will`],correctAnswer:0,explanationEnglish:`Present perfect passive ("has been changed") is used because the change happened at an unspecified recent time and the result (new date) is relevant now, which the office is confirming.`,explanationThai:`ใช้ present perfect passive ("has been changed") เพราะการเปลี่ยนแปลงเกิดขึ้นในช่วงเวลาที่ไม่ระบุแน่ชัดและผลลัพธ์ (วันที่ใหม่) ยังมีความเกี่ยวข้องกับปัจจุบัน ซึ่งทางโรงเรียนกำลังยืนยัน`,keyClue:`"I can confirm that the exam date (2) ______ changed"`,optionExplanations:[`Correct — "has been changed" is present perfect passive, confirming a completed change relevant now.`,`Incorrect — "is being changed" (present continuous passive) suggests the change is happening right now, not already completed.`,`Incorrect — "was" alone is not a complete passive form; it would need "was changed," and even then loses the present-relevance meaning of confirming a current fact.`,`Incorrect — "will" alone is not a complete verb form here and would incorrectly suggest a future, unconfirmed change.`],hints:[`Look at the word "confirm" — this suggests the change has already happened.`,`Present perfect passive (has/have been + past participle) reports a completed action still relevant now.`,`"Is being" can be eliminated because it implies an action still in progress, not something being confirmed as done.`],hint3EliminateIndex:1,grammarRule:`Present perfect passive (has/have been + past participle) reports a completed change or action that remains relevant to the present moment.`,tags:[`cloze`,`email`,`grammar`,`passive-voice`]},{id:`MT4-Q18`,testId:`mock-test-4`,section:`Cloze Dialogue or Short Message`,order:18,skill:`Filling a blank in a formal email using inference across sentences`,skillTag:`conversation`,difficulty:`Advanced`,instruction:`Read the same reply email again. Now choose the best word or phrase for blank (3).`,stimulus:{type:`message`,channel:`email`,from:`Admissions Office`,to:`Somchai Panya (Parent)`,subject:`RE: Question about Entrance Exam Schedule`,body:[`Dear Mr. Panya,`,`Thank you for your message. I can confirm that the exam date has been changed to August 17th due to the ongoing renovation work in the main hall.`,`We (3) ______ for any inconvenience this may cause and appreciate your understanding.`,`Kind regards,`,`Admissions Office`]},question:`Choose the best phrase for blank (3).`,options:[`look forward`,`complain`,`congratulate you`,`apologize`],correctAnswer:3,explanationEnglish:`Since the sentence continues "for any inconvenience this may cause," a phrase expressing regret is needed. "Apologize" fits this formal, polite context perfectly.`,explanationThai:`เนื่องจากประโยคต่อท้ายว่า "for any inconvenience this may cause" จึงต้องใช้คำที่แสดงความเสียใจหรือขอโทษ คำว่า "apologize" เหมาะสมที่สุดกับบริบทที่เป็นทางการนี้`,keyClue:`"______ for any inconvenience this may cause"`,optionExplanations:[`Incorrect — "look forward" expresses anticipation of something positive, which does not fit "inconvenience."`,`Incorrect — "complain" would mean the school is complaining, which contradicts the polite, apologetic tone of the email.`,`Incorrect — "congratulate" expresses praise for an achievement, unrelated to causing inconvenience.`,`Correct — "apologize for" is the standard formal phrase used before mentioning inconvenience caused.`],hints:[`Read to the end of the sentence: "...for any inconvenience this may cause."`,`A formal apology phrase is typically followed by "for" plus the problem caused.`,`"Congratulate you" can be eliminated because it has a positive meaning that does not fit an apology context.`],hint3EliminateIndex:2,tags:[`cloze`,`email`,`formal-phrases`,`inference`]},{id:`MT4-Q19`,testId:`mock-test-4`,section:`Reading Comprehension`,order:19,skill:`Identifying the main idea of a passage`,skillTag:`reading`,difficulty:`Advanced`,instruction:`Read the passage and answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Mapped the Reef`,paragraphs:[`When Malee was ten, she began sketching the coral reef near her family's fishing village, filling notebook after notebook with drawings of fish, coral shapes, and the shifting colors she saw underwater. Her neighbors thought it was simply a child's hobby, something she would eventually outgrow.`,`But Malee kept at it. Every weekend, she swam out with her father's old snorkel mask and recorded what had changed since her last visit — which coral had turned pale, which fish had disappeared, which areas seemed healthier than before. By the time she was fifteen, her notebooks had become an unofficial record spanning five years, something no scientist had ever documented for that particular reef.`,`A marine biologist visiting the village noticed her drawings pinned to the wall of her family's shop and was startled by their accuracy and detail. He arranged for Malee's observations to be included in a regional coral survey, crediting her as a contributing researcher. What had once been dismissed as a hobby turned out to be the most complete record of that reef's health that anyone possessed.`],wordCount:180},question:`What is the main idea of this passage?`,options:[`A marine biologist taught Malee how to draw coral accurately.`,`A young girl's long-term personal habit of recording the reef turned out to have real scientific value.`,`Malee's village decided to fund a new study of the coral reef.`,`Fishing in Malee's village became difficult because of damaged coral.`],correctAnswer:1,explanationEnglish:`The passage traces how Malee's childhood habit of drawing the reef, dismissed by neighbors as a hobby, became a valuable five-year scientific record — this progression is the main idea.`,explanationThai:`เรื่องราวเล่าถึงนิสัยวาดรูปแนวปะการังตั้งแต่เด็กของมาลี ซึ่งเพื่อนบ้านมองว่าเป็นแค่งานอดิเรก แต่กลับกลายเป็นบันทึกทางวิทยาศาสตร์ที่มีค่าตลอดห้าปี นี่คือใจความหลักของเรื่อง`,keyClue:`the shift from "hobby" to "the most complete record"`,optionExplanations:[`Incorrect — the biologist did not teach her to draw; he discovered her existing work.`,`Correct — this captures the overall arc: a personal habit becoming scientifically valuable.`,`Incorrect — there is no mention of the village funding a study.`,`Incorrect — the passage never states that fishing became difficult.`],hints:[`Think about what changes from the beginning of the passage to the end.`,`A main idea question asks what the whole passage is fundamentally about, not just one detail.`,`The option about the village funding a study can be eliminated because it is never mentioned.`],hint3EliminateIndex:2,tags:[`reading`,`main-idea`,`passage`]},{id:`MT4-Q20`,testId:`mock-test-4`,section:`Reading Comprehension`,order:20,skill:`Making an inference from passage details`,skillTag:`reading`,difficulty:`Advanced`,instruction:`Read the passage again and answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Mapped the Reef`,paragraphs:[`When Malee was ten, she began sketching the coral reef near her family's fishing village, filling notebook after notebook with drawings of fish, coral shapes, and the shifting colors she saw underwater. Her neighbors thought it was simply a child's hobby, something she would eventually outgrow.`,`But Malee kept at it. Every weekend, she swam out with her father's old snorkel mask and recorded what had changed since her last visit — which coral had turned pale, which fish had disappeared, which areas seemed healthier than before. By the time she was fifteen, her notebooks had become an unofficial record spanning five years, something no scientist had ever documented for that particular reef.`,`A marine biologist visiting the village noticed her drawings pinned to the wall of her family's shop and was startled by their accuracy and detail. He arranged for Malee's observations to be included in a regional coral survey, crediting her as a contributing researcher. What had once been dismissed as a hobby turned out to be the most complete record of that reef's health that anyone possessed.`],wordCount:180},question:`What can be inferred about the condition of the reef during the five years Malee recorded it?`,options:[`The reef remained exactly the same the whole time, with no changes at all.`,`The reef improved dramatically every single year without exception.`,`The reef went through noticeable changes, including some decline, since she recorded coral turning pale and fish disappearing.`,`The reef was too damaged for any fish to survive there by the end.`],correctAnswer:2,explanationEnglish:`The passage mentions she recorded "which coral had turned pale, which fish had disappeared, which areas seemed healthier," implying mixed changes including decline, not total stability, constant improvement, or total collapse.`,explanationThai:`ข้อความระบุว่าเธอบันทึก "ปะการังที่ซีดลง ปลาที่หายไป และพื้นที่ที่ดูสมบูรณ์ขึ้น" แสดงถึงการเปลี่ยนแปลงแบบผสมทั้งดีขึ้นและแย่ลง ไม่ใช่คงที่ ดีขึ้นตลอด หรือพังทลายทั้งหมด`,keyClue:`"which coral had turned pale, which fish had disappeared"`,optionExplanations:[`Incorrect — the passage explicitly describes changes, so nothing stayed exactly the same.`,`Incorrect — the mention of coral turning pale and fish disappearing rules out constant improvement.`,`Correct — this reflects the mixed picture of decline and improvement described in the passage.`,`Incorrect — the passage never states that no fish survived; it says some areas seemed healthier.`],hints:[`Look closely at paragraph 2 for the specific details Malee recorded.`,`An inference must be supported by evidence in the text, combining multiple details.`,`The option claiming no fish survived can be eliminated because healthier areas are also mentioned.`],hint3EliminateIndex:3,tags:[`reading`,`inference`,`passage`]},{id:`MT4-Q21`,testId:`mock-test-4`,section:`Reading Comprehension`,order:21,skill:`Identifying pronoun reference in context`,skillTag:`reading`,difficulty:`Advanced`,instruction:`Read the passage again and answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Mapped the Reef`,paragraphs:[`When Malee was ten, she began sketching the coral reef near her family's fishing village, filling notebook after notebook with drawings of fish, coral shapes, and the shifting colors she saw underwater. Her neighbors thought it was simply a child's hobby, something she would eventually outgrow.`,`But Malee kept at it. Every weekend, she swam out with her father's old snorkel mask and recorded what had changed since her last visit — which coral had turned pale, which fish had disappeared, which areas seemed healthier than before. By the time she was fifteen, her notebooks had become an unofficial record spanning five years, something no scientist had ever documented for that particular reef.`,`A marine biologist visiting the village noticed her drawings pinned to the wall of her family's shop and was startled by their accuracy and detail. He arranged for Malee's observations to be included in a regional coral survey, crediting her as a contributing researcher. What had once been dismissed as a hobby turned out to be the most complete record of that reef's health that anyone possessed.`],wordCount:180},question:`In the final paragraph, who does "He" refer to?`,options:[`Malee's father`,`A neighbor from the village`,`The marine biologist`,`A regional government official`],correctAnswer:2,explanationEnglish:`"He" refers back to "a marine biologist visiting the village," the closest and only male individual mentioned right before the pronoun in that sentence.`,explanationThai:`"He" อ้างอิงถึง "a marine biologist visiting the village" ซึ่งเป็นบุคคลเพศชายที่กล่าวถึงก่อนหน้าคำสรรพนามนี้ในประโยคเดียวกัน`,keyClue:`"A marine biologist... He arranged..."`,optionExplanations:[`Incorrect — Malee's father is mentioned earlier in paragraph 2, not in this sentence.`,`Incorrect — no specific neighbor is named or described as taking this action.`,`Correct — "he" directly follows and refers to "a marine biologist" in the same paragraph.`,`Incorrect — no government official is mentioned anywhere in the passage.`],hints:[`Look at the sentence immediately before the pronoun "He."`,`Pronouns usually refer to the nearest matching noun mentioned before them.`,`Malee's father can be eliminated because he is not mentioned in this paragraph at all.`],hint3EliminateIndex:0,tags:[`reading`,`pronoun-reference`,`passage`]},{id:`MT4-Q22`,testId:`mock-test-4`,section:`Reading Comprehension`,order:22,skill:`Identifying the writer's purpose`,skillTag:`reading`,difficulty:`Advanced`,instruction:`Read the passage again and answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Mapped the Reef`,paragraphs:[`When Malee was ten, she began sketching the coral reef near her family's fishing village, filling notebook after notebook with drawings of fish, coral shapes, and the shifting colors she saw underwater. Her neighbors thought it was simply a child's hobby, something she would eventually outgrow.`,`But Malee kept at it. Every weekend, she swam out with her father's old snorkel mask and recorded what had changed since her last visit — which coral had turned pale, which fish had disappeared, which areas seemed healthier than before. By the time she was fifteen, her notebooks had become an unofficial record spanning five years, something no scientist had ever documented for that particular reef.`,`A marine biologist visiting the village noticed her drawings pinned to the wall of her family's shop and was startled by their accuracy and detail. He arranged for Malee's observations to be included in a regional coral survey, crediting her as a contributing researcher. What had once been dismissed as a hobby turned out to be the most complete record of that reef's health that anyone possessed.`],wordCount:180},question:`What is most likely the writer's purpose in telling this story?`,options:[`To warn readers about the dangers of snorkeling without proper equipment`,`To inspire readers by showing how ordinary dedication can lead to meaningful, unexpected achievement`,`To explain the scientific process of coral reef surveys in technical detail`,`To criticize villagers for not appreciating Malee's work sooner`],correctAnswer:1,explanationEnglish:`The passage frames Malee's persistence — turning a dismissed "hobby" into valuable scientific work — in an uplifting way, suggesting the writer's purpose is to inspire readers about dedication and unexpected achievement.`,explanationThai:`เรื่องราวนำเสนอความมุ่งมั่นของมาลี ที่เปลี่ยนจาก "งานอดิเรก" ที่ถูกมองข้ามให้กลายเป็นงานวิจัยที่มีคุณค่า ในโทนที่สร้างแรงบันดาลใจ แสดงว่าจุดประสงค์ของผู้เขียนคือการสร้างแรงบันดาลใจเรื่องความทุ่มเทและความสำเร็จที่ไม่คาดคิด`,keyClue:`overall uplifting tone and structure of the story`,optionExplanations:[`Incorrect — safety concerns about snorkeling are never mentioned or emphasized in the passage.`,`Correct — the story's positive, inspiring arc about persistence leading to recognition supports this purpose.`,`Incorrect — the passage does not go into technical detail about how coral surveys are conducted.`,`Incorrect — the passage does not criticize the villagers; it simply notes their initial assumption.`],hints:[`Think about the emotional tone the writer creates from beginning to end.`,`Writer's purpose questions ask why the passage was written — to inform, persuade, entertain, or inspire.`,`The option about criticizing villagers can be eliminated because the tone toward them is neutral, not critical.`],hint3EliminateIndex:3,tags:[`reading`,`writers-purpose`,`passage`]},{id:`MT4-Q23`,testId:`mock-test-4`,section:`Functional Language and Error Recognition`,order:23,skill:`Finding the subtly incorrect word in a sentence`,skillTag:`functional`,difficulty:`Advanced`,instruction:`Choose the option that contains a grammatical error.`,stimulus:{type:`none`},question:`Which sentence contains an error?`,options:[`Neither of the answers were correct, so the teacher explained the problem again.`,`She is one of the most careful students in the entire class.`,`By the time the bell rang, we had already finished the test.`,`Although he was tired, he continued practicing the piano.`],correctAnswer:0,explanationEnglish:`"Neither" is a singular subject and requires a singular verb, so it should be "Neither of the answers was correct," not "were."`,explanationThai:`"Neither" เป็นประธานเอกพจน์ ต้องใช้กริยาเอกพจน์ ดังนั้นต้องเป็น "Neither of the answers was correct" ไม่ใช่ "were"`,keyClue:`"Neither of the answers were"`,optionExplanations:[`Correct choice — "neither" requires a singular verb ("was"), so "were" is a subject-verb agreement error.`,`Incorrect — this sentence is grammatically correct; superlative structure is used properly.`,`Incorrect — this sentence correctly uses past perfect ("had already finished") for an action completed before another past action.`,`Incorrect — this sentence correctly uses "although" to introduce a contrast, with no grammatical error.`],hints:[`Look closely at the subject-verb agreement in each sentence.`,`"Neither" and "either" are always treated as singular subjects in formal grammar.`,`The sentence about the piano can be eliminated because "although... continued" is a correctly formed contrast.`],hint3EliminateIndex:3,grammarRule:`"Neither" and "either" take a singular verb even when followed by a plural noun phrase (e.g., "of the answers").`,tags:[`functional`,`error-recognition`,`subject-verb-agreement`]},{id:`MT4-Q24`,testId:`mock-test-4`,section:`Functional Language and Error Recognition`,order:24,skill:`Choosing the correctly ordered sentence from jumbled options`,skillTag:`functional`,difficulty:`Advanced`,instruction:`Choose the sentence with the correct word order.`,stimulus:{type:`none`},question:`Which sentence is correctly ordered?`,options:[`Despite the heavy rain, the match continued as planned.`,`Despite rain the heavy, the match continued as planned.`,`The match, despite continued heavy the rain, as planned.`,`Despite continued the match, the heavy rain, as planned.`],correctAnswer:0,explanationEnglish:`"Despite" is followed directly by a noun phrase, and adjectives must come before the noun they describe: "despite the heavy rain." This is the only option with correct word order.`,explanationThai:`"Despite" ตามด้วย noun phrase โดยตรง และคำคุณศัพท์ต้องอยู่หน้าคำนามที่ขยาย คือ "despite the heavy rain" ตัวเลือกนี้เป็นตัวเดียวที่เรียงลำดับคำถูกต้อง`,keyClue:`"Despite + the + adjective + noun"`,optionExplanations:[`Correct — this follows the proper structure: Despite + article + adjective + noun, then the main clause.`,`Incorrect — the adjective "heavy" is placed after the noun "rain," which is wrong word order.`,`Incorrect — the sentence structure is jumbled and does not form a coherent clause.`,`Incorrect — the sentence structure is jumbled, placing words in an illogical, ungrammatical order.`],hints:[`Focus on where the adjective "heavy" should go in relation to "rain."`,`In English, descriptive adjectives are placed directly before the noun they modify.`,`The most scrambled option, with "continued" appearing right after "Despite," can be eliminated as clearly illogical.`],hint3EliminateIndex:3,grammarRule:`After "despite" or "in spite of," use a noun phrase with adjectives placed before the noun (despite + article + adjective + noun).`,tags:[`functional`,`word-order`,`sentence-arrangement`]},{id:`MT4-Q25`,testId:`mock-test-4`,section:`Functional Language and Error Recognition`,order:25,skill:`Recognizing meaning-equivalent sentences`,skillTag:`functional`,difficulty:`Advanced`,instruction:`Choose the sentence that is closest in meaning to the sentence given.`,stimulus:{type:`none`},question:`Original: "It was such a difficult exam that many students failed to finish it in time."

Which sentence means the same thing?`,options:[`The exam was so easy that most students finished it quickly.`,`The exam was so difficult that many students could not complete it within the time given.`,`A few students found the exam difficult, but most finished on time.`,`The exam was difficult, so it was cancelled before students could finish.`],correctAnswer:1,explanationEnglish:`The original uses "such... that" to show the exam's extreme difficulty caused many students to fail to finish. Option B expresses this same cause-and-result meaning using "so... that," with equivalent difficulty and outcome.`,explanationThai:`ประโยคเดิมใช้โครงสร้าง "such... that" เพื่อแสดงว่าความยากของข้อสอบทำให้นักเรียนหลายคนทำไม่เสร็จ ตัวเลือก B สื่อความหมายเดียวกันด้วยโครงสร้าง "so... that" ที่แสดงเหตุและผลเทียบเท่ากัน`,keyClue:`"such a difficult exam that... failed to finish"`,optionExplanations:[`Incorrect — this reverses the meaning completely, describing an easy exam instead of a difficult one.`,`Correct — this preserves the same meaning: extreme difficulty caused many students to not finish in time.`,`Incorrect — this understates the number of students affected and contradicts "many students failed to finish."`,`Incorrect — the original never mentions the exam being cancelled.`],hints:[`Focus on the cause-and-result relationship shown by "such... that."`,`"Such + adjective + noun + that" and "so + adjective + that" often express the same cause-and-result meaning.`,`The option describing an easy exam can be eliminated because it directly contradicts the original meaning.`],hint3EliminateIndex:0,grammarRule:`"Such (a/an) + adjective + noun + that" and "so + adjective + that" both express a result caused by an extreme degree of a quality.`,tags:[`functional`,`meaning-equivalence`,`paraphrasing`]}],kh=[{id:`MT5-Q01`,testId:`mock-test-5`,section:`Signs and Notices`,order:1,skill:`Reading a multi-clause examination notice`,skillTag:`signs`,difficulty:`Entrance Challenge`,instruction:`Read the notice outside the examination hall. Then answer the question.`,stimulus:{type:`notice`,title:`EXAMINATION HALL REGULATIONS`,lines:[`Candidates must arrive at least 15 minutes before the start time.`,`Mobile phones must be switched off and placed in your bag, not on the desk.`,`Candidates who arrive more than 30 minutes late will not be allowed to enter, unless they have a medical certificate.`,`Extra paper will be provided only if you raise your hand and wait quietly.`],footer:`By order of the Examinations Office`},question:`A candidate arrives 35 minutes late with no medical certificate. According to the notice, what will happen?`,options:[`She will be allowed in if she apologises to the supervisor.`,`She will not be allowed to enter the hall.`,`She will be allowed in but will lose 15 minutes of writing time.`,`She will be allowed in only if she sits at the back.`],correctAnswer:1,explanationEnglish:`The notice states candidates over 30 minutes late are refused entry "unless they have a medical certificate." Since she has none, the exception does not apply, so she is simply not admitted — no other condition (apology, lost time, seating) is mentioned.`,explanationThai:`ป้ายระบุว่าถ้ามาสายเกิน 30 นาทีจะไม่ได้รับอนุญาตให้เข้าห้องสอบ ยกเว้นมีใบรับรองแพทย์ ในเมื่อผู้เข้าสอบคนนี้ไม่มีใบรับรองแพทย์ เงื่อนไขยกเว้นจึงใช้ไม่ได้ ดังนั้นคำตอบที่ถูกคือไม่ได้รับอนุญาตให้เข้าห้องสอบ โดยไม่มีทางเลือกอื่นตามที่ป้ายระบุ`,keyClue:`"unless they have a medical certificate"`,vocabulary:[{term:`candidate`,meaningEnglish:`a person taking an examination`,meaningThai:`ผู้เข้าสอบ`}],optionExplanations:[`Not mentioned anywhere in the notice — an apology is never named as a way around the rule.`,`Correct — the only exception to the 30-minute rule is a medical certificate, which she does not have.`,`A tempting invention, but the notice never offers a "reduced time" compromise.`,`Also invented — no seating arrangement is mentioned as an alternative.`],hints:[`Focus on the third line of the notice — it names one specific exception.`,`"Unless" introduces the only condition that changes the rule; if that condition is not met, the rule applies exactly as stated.`,`The notice never mentions losing time as a punishment, so that option can be ruled out.`],hint3EliminateIndex:2,tags:[`notice`,`conditional-reading`,`exam-context`]},{id:`MT5-Q02`,testId:`mock-test-5`,section:`Signs and Notices`,order:2,skill:`Interpreting a sign with a conditional exception`,skillTag:`signs`,difficulty:`Entrance Challenge`,instruction:`Read the sign at the school library entrance. Then answer the question.`,stimulus:{type:`sign`,heading:`QUIET STUDY ZONE`,body:`No food or drink beyond this point, except bottled water with a closed lid. Group discussion is permitted only in the side room, and only before 3 p.m.`,tone:`instruction`,location:`Library entrance`,icon:`no-food`},question:`Which student is following the rules on the sign?`,options:[`Ploy eats a sandwich quietly at a corner desk at 2 p.m.`,`Nut opens a can of juice in the side room at 2 p.m.`,`Beam discusses a project loudly in the main hall at 1 p.m.`,`Tan drinks from a closed water bottle while reading at 4 p.m.`],correctAnswer:3,explanationEnglish:`The sign allows only "bottled water with a closed lid" as an exception to the no food/drink rule, with no time restriction attached to that exception — so drinking closed-lid water at any time is fine. Food, juice cans, and loud discussion outside the side room all break separate rules on the sign.`,explanationThai:`ป้ายอนุญาตข้อยกเว้นเดียวคือน้ำขวดที่ปิดฝาสนิท และไม่ได้จำกัดเวลาสำหรับข้อยกเว้นนี้ ดังนั้นดื่มน้ำขวดปิดฝาเวลาใดก็ได้ถือว่าถูกกฎ ส่วนกินแซนด์วิช เปิดกระป๋องน้ำผลไม้ หรือคุยงานเสียงดังนอกห้องข้าง ล้วนผิดกฎอื่นบนป้าย`,keyClue:`"except bottled water with a closed lid"`,optionExplanations:[`Wrong — a sandwich is food, and no exception covers food at all, regardless of how quiet the student is.`,`Wrong — a juice can is not "bottled water," so it breaks the no-food-or-drink rule.`,`Wrong on two counts — discussion must be in the side room, and only before 3 p.m.`,`Correct — closed-lid bottled water is the one named exception, with no time limit attached.`],hints:[`Look closely at exactly what kind of drink the sign exempts.`,`An exception in a rule usually applies only to the precise item named — not to similar items.`,`Beam breaks two separate parts of the rule at once, so that option is out.`],hint3EliminateIndex:2,tags:[`sign`,`exception-rule`,`careful-reading`]},{id:`MT5-Q03`,testId:`mock-test-5`,section:`Vocabulary in Context`,order:3,skill:`Choosing the word that fits the full sentence meaning`,skillTag:`vocabulary`,difficulty:`Entrance Challenge`,instruction:`Choose the best word to complete the sentence.`,stimulus:{type:`none`},question:`Even though the two brothers argued about almost everything, they always managed to _______ a compromise before their parents got involved.`,options:[`reach`,`catch`,`hold`,`win`],correctAnswer:0,explanationEnglish:`"Reach a compromise/agreement" is the fixed collocation meaning to arrive at a solution both sides accept. "Catch," "hold," and "win" do not combine naturally with "compromise" in English.`,explanationThai:`"Reach a compromise" เป็นคำที่ใช้คู่กันตายตัว หมายถึงหาข้อตกลงที่ทั้งสองฝ่ายยอมรับได้ ส่วน catch, hold, win ไม่ใช่คำที่ใช้คู่กับ compromise ตามธรรมชาติของภาษาอังกฤษ`,keyClue:`collocation with "a compromise"`,optionExplanations:[`Correct — "reach a compromise/agreement" is the natural, fixed collocation in English.`,`"Catch" pairs with things like a ball, a cold, or a bus — not with "compromise."`,`"Hold" a compromise is not idiomatic; you can "hold a meeting" but not "hold a compromise."`,`"Win" suggests one side defeats the other, which contradicts the idea of a shared compromise.`],vocabulary:[{term:`compromise`,meaningEnglish:`an agreement reached when each side gives up something`,meaningThai:`การประนีประนอม, ข้อตกลงที่ต่างฝ่ายต่างยอมกันคนละครึ่ง`}],hints:[`Think about which verb regularly pairs with the noun "compromise" in everyday English.`,`Certain nouns have one "partner" verb that native speakers almost always use — this is called a collocation.`,`"Win" implies a winner and a loser, which does not match the idea of two sides meeting in the middle.`],hint3EliminateIndex:3,tags:[`collocation`,`vocabulary-in-context`,`word-choice`]},{id:`MT5-Q04`,testId:`mock-test-5`,section:`Vocabulary in Context`,order:4,skill:`Distinguishing near-synonyms by nuance`,skillTag:`vocabulary`,difficulty:`Entrance Challenge`,instruction:`Choose the word closest in meaning to the underlined word.`,stimulus:{type:`none`},question:`The coach was <u>reluctant</u> to let the injured player continue, even though the boy insisted he felt fine.`,options:[`excited`,`unwilling`,`confident`,`forbidden`],correctAnswer:1,explanationEnglish:`"Reluctant" means not wanting to do something, hesitating because of doubt or worry — closest to "unwilling." "Excited" and "confident" are near-opposite feelings, and "forbidden" describes something not allowed, not a feeling of hesitation.`,explanationThai:`"Reluctant" หมายถึงลังเล ไม่อยากทำเพราะมีความกังวลหรือสงสัย ใกล้เคียงกับ "unwilling" มากที่สุด ส่วน excited และ confident เป็นความรู้สึกตรงข้ามเกือบทั้งหมด และ forbidden หมายถึงถูกห้าม ไม่ใช่ความรู้สึกลังเล`,keyClue:`"reluctant" = hesitant, not wanting to`,optionExplanations:[`Wrong — "excited" is an enthusiastic feeling, the opposite of hesitation.`,`Correct — "reluctant" and "unwilling" both describe hesitating because of doubt or worry.`,`Wrong — "confident" suggests certainty, which contradicts the coach's hesitation.`,`Wrong — "forbidden" means not allowed by a rule, not a personal feeling of hesitation.`],vocabulary:[{term:`reluctant`,meaningEnglish:`not willing to do something; hesitant`,meaningThai:`ลังเล, ไม่เต็มใจ`}],hints:[`Notice that the coach hesitates even though the player insists he is fine — this tells you the coach's attitude.`,`"Reluctant" describes an inner hesitation caused by doubt, not an outside rule stopping someone.`,`"Forbidden" describes something blocked by a rule, which is not the situation described here.`],hint3EliminateIndex:3,tags:[`synonym`,`nuance`,`context-clue`]},{id:`MT5-Q05`,testId:`mock-test-5`,section:`Vocabulary in Context`,order:5,skill:`Choosing the correct opposite based on sentence context`,skillTag:`vocabulary`,difficulty:`Entrance Challenge`,instruction:`Choose the word that is opposite in meaning to the underlined word, as it is used in the sentence.`,stimulus:{type:`none`},question:`Unlike her <u>cautious</u> older sister, who checked every answer twice, Mai finished the test in half the time and handed it in first.`,options:[`careful`,`clever`,`reckless`,`patient`],correctAnswer:2,explanationEnglish:`In this sentence "cautious" describes someone who is careful and checks things twice before acting. Its opposite is "reckless," meaning acting quickly without thinking about consequences — which matches Mai's behaviour of rushing through the test.`,explanationThai:`ในประโยคนี้ "cautious" หมายถึงคนที่ระมัดระวัง ตรวจคำตอบซ้ำสองครั้งก่อนทำอะไร คำตรงข้ามคือ "reckless" หมายถึงทำอะไรเร็วโดยไม่คิดถึงผลที่ตามมา ซึ่งตรงกับพฤติกรรมของไมที่รีบทำข้อสอบเสร็จโดยไม่ตรวจทาน`,keyClue:`sister checks twice vs. Mai rushes and hands in first`,optionExplanations:[`Wrong — "careful" is a synonym of "cautious," not its opposite.`,`Wrong — "clever" describes intelligence, not carefulness, so it is not a true opposite.`,`Correct — "reckless" means acting without careful thought, the opposite of double-checking everything.`,`Wrong — "patient" is unrelated to carefulness and does not oppose "cautious" here.`],vocabulary:[{term:`cautious`,meaningEnglish:`careful to avoid danger or mistakes`,meaningThai:`ระมัดระวัง, รอบคอบ`}],hints:[`Compare the sister's behaviour (checking twice) with Mai's behaviour (rushing) — the sentence sets up a contrast.`,`An opposite must reverse the core meaning, not just be a different word in the same topic area.`,`"Clever" is about intelligence, which the sentence never discusses, so it can be eliminated.`],hint3EliminateIndex:1,tags:[`antonym`,`context-clue`,`contrast-signal`]},{id:`MT5-Q06`,testId:`mock-test-5`,section:`Grammar and Usage`,order:6,skill:`Present perfect vs. past simple with a finished time reference`,skillTag:`grammar`,difficulty:`Entrance Challenge`,instruction:`Choose the correct verb form to complete the sentence.`,stimulus:{type:`none`},question:`My grandmother _______ in this village since 1998, long before I was born.`,options:[`lived`,`has lived`,`is living`,`lives`],correctAnswer:1,explanationEnglish:`"Since 1998" marks the starting point of an action that continues into the present, which requires the present perfect ("has lived"). The past simple ("lived") would wrongly suggest she no longer lives there.`,explanationThai:`"Since 1998" บอกจุดเริ่มต้นของเหตุการณ์ที่ยังดำเนินต่อเนื่องมาจนถึงปัจจุบัน จึงต้องใช้ present perfect ("has lived") ถ้าใช้ past simple ("lived") จะสื่อผิดว่าเธอไม่ได้อาศัยอยู่ที่นั่นแล้ว`,keyClue:`"since 1998" + still continuing`,optionExplanations:[`Wrong — past simple implies the living arrangement is finished, which contradicts the ongoing sense of "since."`,`Correct — "since + a point in the past" with an unfinished, continuing action needs the present perfect.`,`Wrong — present continuous doesn't combine with "since 1998" to describe a long-term habitual state like this.`,`Wrong — simple present alone cannot carry the "from 1998 until now" time span; it needs the perfect form.`],grammarRule:`Use present perfect ("has/have + past participle") with "since + past time point" for actions continuing into the present.`,hints:[`Look at the time expression "since 1998" — does it describe a finished moment or an ongoing span?`,`"Since" pairs with present perfect when the action started in the past and is still true now.`,`Present continuous is for temporary actions happening right now, not a 25+ year habit — so that option is out.`],hint3EliminateIndex:2,tags:[`present-perfect`,`past-simple`,`time-expressions`]},{id:`MT5-Q07`,testId:`mock-test-5`,section:`Grammar and Usage`,order:7,skill:`Choosing the correct relative pronoun`,skillTag:`grammar`,difficulty:`Entrance Challenge`,instruction:`Choose the correct word to complete the sentence.`,stimulus:{type:`none`},question:`The scientist _______ research helped cure the disease was awarded a medal last month.`,options:[`who`,`which`,`whose`,`that`],correctAnswer:2,explanationEnglish:`The gap shows possession: it is the scientist's research, not the scientist herself, that helped cure the disease. "Whose" is the possessive relative pronoun used for people (and things), linking "the scientist" to "her research."`,explanationThai:`ช่องว่างแสดงความเป็นเจ้าของ คือ "งานวิจัยของนักวิทยาศาสตร์" ไม่ใช่ตัวนักวิทยาศาสตร์เองที่ช่วยรักษาโรค "Whose" เป็นคำสรรพนามแสดงความเป็นเจ้าของที่ใช้กับคน (และสิ่งของ) เพื่อเชื่อม "the scientist" กับ "her research"`,keyClue:`possession: the scientist's research`,optionExplanations:[`"Who" would replace the subject "the scientist" itself, but here the subject of "helped" is "research," not the scientist.`,`"Which" refers to things, but does not show possession the way this sentence requires.`,`Correct — "whose" shows that the research belongs to the scientist, linking the two ideas correctly.`,`"That" cannot show possession and also cannot easily follow a comma-free clause needing "research" as a possessed noun here.`],grammarRule:`"Whose" is the possessive relative pronoun, used to show that a following noun belongs to the person or thing just mentioned.`,hints:[`Ask yourself: who does the "research" belong to?`,`When a relative clause shows ownership ("X's Y"), English uses the possessive relative pronoun.`,`"Which" never expresses possession, so it cannot be the answer here.`],hint3EliminateIndex:1,tags:[`relative-clause`,`possessive`,`pronoun-choice`]},{id:`MT5-Q08`,testId:`mock-test-5`,section:`Grammar and Usage`,order:8,skill:`First conditional with correct tense sequencing`,skillTag:`grammar`,difficulty:`Entrance Challenge`,instruction:`Choose the correct verb forms to complete the sentence.`,stimulus:{type:`none`},question:`If the rain _______ before six o'clock, we _______ the match as planned.`,options:[`stops / will start`,`will stop / start`,`stops / started`,`stopped / will start`],correctAnswer:0,explanationEnglish:`The first conditional (for real, likely future situations) uses present simple in the if-clause and "will + base verb" in the main clause: "If the rain stops... we will start..." Mixing in "will" in the if-clause or a past tense breaks this pattern.`,explanationThai:`First conditional (สำหรับเหตุการณ์ในอนาคตที่มีโอกาสเกิดขึ้นจริง) ใช้ present simple ในประโยคเงื่อนไข (if-clause) และ "will + กริยาช่องที่ 1" ในประโยคหลัก คือ "If the rain stops... we will start..." การใส่ will ใน if-clause หรือใช้อดีตกาลจะทำให้โครงสร้างผิด`,keyClue:`if + present simple, ... will + base verb`,optionExplanations:[`Correct — present simple ("stops") in the if-clause, "will" + base verb ("will start") in the main clause.`,`Wrong — "will" should not appear in the if-clause of a first conditional.`,`Wrong — the main clause needs "will start," not the past tense "started."`,`Wrong — the if-clause needs present simple "stops," not past tense "stopped."`],grammarRule:`First conditional: If + present simple, ... will + base verb (for realistic future outcomes).`,hints:[`Identify which clause is the "if" (condition) clause and which is the result clause.`,`The classic first-conditional pattern never puts "will" inside the if-clause itself.`,`The option starting "will stop..." breaks the rule by putting "will" in the if-clause, so it can be ruled out.`],hint3EliminateIndex:1,tags:[`first-conditional`,`tense-sequencing`,`if-clause`]},{id:`MT5-Q09`,testId:`mock-test-5`,section:`Grammar and Usage`,order:9,skill:`Modal verbs of deduction (present situation)`,skillTag:`grammar`,difficulty:`Entrance Challenge`,instruction:`Choose the best modal verb to complete the sentence.`,stimulus:{type:`none`},question:`The classroom lights are off and nobody answers the door. The teacher _______ still be at the meeting.`,options:[`needn't`,`can`,`should`,`must`],correctAnswer:3,explanationEnglish:`Given strong evidence (lights off, no answer), the speaker makes a confident logical deduction. "Must" expresses near-certainty based on evidence. "Can" is not used for positive deductions, "should" implies expectation rather than near-certainty, and "needn't" means something is unnecessary, not a deduction.`,explanationThai:`เมื่อมีหลักฐานชัดเจน (ไฟดับ ไม่มีคนตอบ) ผู้พูดสรุปอย่างมั่นใจ "Must" ใช้แสดงการอนุมานที่มั่นใจสูงจากหลักฐาน ส่วน "can" ไม่ใช้กับการอนุมานเชิงบวกแบบนี้ "should" สื่อถึงสิ่งที่คาดว่าจะเป็นมากกว่าความมั่นใจสูง และ "needn't" หมายถึงไม่จำเป็น ไม่ใช่การอนุมาน`,keyClue:`strong evidence → confident deduction`,optionExplanations:[`Wrong — "needn't" means "it is not necessary to," which does not fit a deduction about location at all.`,`Wrong — "can" is not used to make a positive logical deduction like this in modern English.`,`Wrong — "should" suggests a milder expectation ("is probably supposed to be"), weaker than the certainty implied here.`,`Correct — "must" expresses a confident conclusion drawn from clear evidence.`],grammarRule:`Use "must" for confident positive deductions based on evidence; use "can't" for confident negative deductions.`,hints:[`Think about how certain the speaker sounds, based on the clues given (dark room, no answer).`,`For strong, evidence-based conclusions about the present, English typically uses one specific modal verb.`,`"Needn't" is about lack of necessity, which has nothing to do with guessing where someone is — rule it out.`],hint3EliminateIndex:0,tags:[`modal-verbs`,`deduction`,`present-speculation`]},{id:`MT5-Q10`,testId:`mock-test-5`,section:`Grammar and Usage`,order:10,skill:`Recognising the passive voice (past simple)`,skillTag:`grammar`,difficulty:`Entrance Challenge`,instruction:`Choose the sentence that is correctly written in the passive voice.`,stimulus:{type:`none`},question:`Which sentence correctly rewrites "A famous architect designed the new library" in the passive voice?`,options:[`A famous architect was designed the new library.`,`The new library designed by a famous architect.`,`The new library is designed by a famous architect.`,`The new library was designed by a famous architect.`],correctAnswer:3,explanationEnglish:`The passive voice moves the object ("the new library") to the subject position and uses "was/were + past participle" for a past simple action, keeping the original doer after "by": "The new library was designed by a famous architect."`,explanationThai:`Passive voice ย้ายกรรม ("the new library") มาเป็นประธาน และใช้ "was/were + กริยาช่องที่ 3" สำหรับเหตุการณ์อดีต โดยยังคงผู้กระทำเดิมไว้หลัง "by" คือ "The new library was designed by a famous architect."`,keyClue:`object → subject, was/were + past participle`,optionExplanations:[`Wrong — this keeps "a famous architect" as the subject but passivises it incorrectly; the architect is the doer, not the one acted upon.`,`Wrong — this is missing the auxiliary verb "was," so it is not a complete sentence.`,`Wrong — "is designed" uses present tense, but the original sentence is past tense ("designed").`,`Correct — subject and object are swapped correctly, with "was designed" as the past passive form.`],grammarRule:`Passive voice: object + be (matching the original tense) + past participle + by + original subject.`,hints:[`Identify which noun receives the action (the object) in the original sentence — that becomes the new subject.`,`The passive form needs a "be" verb matching the original tense, plus the past participle of the main verb.`,`The option missing "was" entirely is not even a grammatically complete sentence, so it can be eliminated.`],hint3EliminateIndex:1,tags:[`passive-voice`,`past-simple`,`sentence-transformation`]},{id:`MT5-Q11`,testId:`mock-test-5`,section:`Grammar and Usage`,order:11,skill:`Question tags with modal and negative main clauses`,skillTag:`grammar`,difficulty:`Entrance Challenge`,instruction:`Choose the correct question tag to complete the sentence.`,stimulus:{type:`none`},question:`You wouldn't tell anyone about the surprise party, _______?`,options:[`would you`,`wouldn't you`,`will you`,`do you`],correctAnswer:0,explanationEnglish:`Question tags reverse the polarity of the main clause but keep the same modal verb. The main clause is negative ("wouldn't"), so the tag must be positive and use the same modal: "would you."`,explanationThai:`Question tag จะสลับขั้ว (บวก-ลบ) จากประโยคหลัก แต่ใช้กริยาช่วยตัวเดิม ประโยคหลักเป็นปฏิเสธ ("wouldn't") ดังนั้น tag ต้องเป็นบวกและใช้กริยาช่วยตัวเดียวกันคือ "would you"`,keyClue:`negative main clause → positive tag, same modal`,optionExplanations:[`Correct — negative main clause needs a positive tag, and the modal "would" is repeated, not changed.`,`Wrong — this keeps the tag negative, but tags must have opposite polarity from the main clause.`,`Wrong — "will" is a different modal verb from "would" in the main clause; tags must reuse the same auxiliary.`,`Wrong — "do you" does not match the modal verb "would" used in the main sentence at all.`],grammarRule:`Question tags reverse polarity (positive/negative) but repeat the exact auxiliary or modal verb from the main clause.`,hints:[`Check whether the main clause is positive or negative, then think about the opposite.`,`A question tag must reuse the same helping verb as the main clause, just with reversed polarity.`,`The tag using "will" introduces a different modal than the sentence started with, so it can be eliminated.`],hint3EliminateIndex:2,tags:[`question-tags`,`modal-verbs`,`polarity`]},{id:`MT5-Q12`,testId:`mock-test-5`,section:`Everyday Conversation`,order:12,skill:`Inferring polite disagreement from tone`,skillTag:`conversation`,difficulty:`Entrance Challenge`,instruction:`Read the dialogue and choose the best response.`,stimulus:{type:`dialogue`,setting:`Two classmates planning a group project`,lines:[{speaker:`Fon`,text:`I think we should present our project first, before anyone else finishes their slides.`},{speaker:`Ice`,text:`I see your point, but wouldn't it be safer to go last, so we can fix mistakes we notice in other groups' presentations?`}]},question:`What is Ice really doing in her response?`,options:[`Agreeing completely with Fon's plan`,`Politely disagreeing and suggesting an alternative`,`Refusing to take part in the project at all`,`Asking Fon to explain the plan again`],correctAnswer:1,explanationEnglish:`"I see your point, but..." is a common softening phrase used before disagreeing politely. Ice acknowledges Fon's idea first, then proposes a different approach ("go last") — this is polite disagreement plus a suggestion, not agreement or refusal.`,explanationThai:`"I see your point, but..." เป็นวลีที่ใช้ลดความรุนแรงก่อนแสดงความไม่เห็นด้วยอย่างสุภาพ ไอซ์รับฟังความเห็นของฝนก่อน แล้วเสนอแนวทางอื่น ("go last") นี่คือการไม่เห็นด้วยอย่างสุภาพพร้อมข้อเสนอแนะ ไม่ใช่การเห็นด้วยหรือปฏิเสธ`,keyClue:`"I see your point, but..."`,optionExplanations:[`Wrong — the word "but" signals a shift away from agreement, not full acceptance of Fon's plan.`,`Correct — Ice softens her disagreement with "I see your point" before offering a different plan.`,`Wrong — Ice is still actively engaging with the project plan, not withdrawing from it.`,`Wrong — Ice understood the plan clearly enough to propose an alternative; she is not confused.`],hints:[`Pay attention to the small word right after "I see your point" — it often signals a turn in meaning.`,`"I see your point, but..." is a common polite way to disagree without sounding rude.`,`Ice clearly understood Fon's plan (she responds to it directly), so "asking to explain again" does not fit.`],hint3EliminateIndex:3,tags:[`inference`,`polite-disagreement`,`tone`]},{id:`MT5-Q13`,testId:`mock-test-5`,section:`Everyday Conversation`,order:13,skill:`Understanding implied meaning in a school-office exchange`,skillTag:`conversation`,difficulty:`Entrance Challenge`,instruction:`Read the dialogue and choose the best answer.`,stimulus:{type:`dialogue`,setting:`School office, a student speaking to the office staff`,lines:[{speaker:`Student`,text:`Excuse me, is it possible to hand in my permission form a little late? My parents are both travelling this week.`},{speaker:`Staff`,text:`Well, the deadline is quite firm, but I suppose one more day wouldn't hurt, given the circumstances.`}]},question:`What does the staff member mean?`,options:[`The form must be handed in today with no exceptions.`,`The student should ask a teacher instead.`,`The student may have one extra day because of the special situation.`,`The deadline has been cancelled completely.`],correctAnswer:2,explanationEnglish:`"I suppose one more day wouldn't hurt, given the circumstances" is an indirect way of granting a small, specific exception — one extra day — because of the student's particular situation, not a full cancellation of the deadline.`,explanationThai:`"I suppose one more day wouldn't hurt, given the circumstances" เป็นวิธีพูดอ้อมๆ เพื่ออนุญาตข้อยกเว้นเล็กน้อย คือให้เวลาเพิ่มอีกหนึ่งวัน เนื่องจากสถานการณ์พิเศษของนักเรียน ไม่ใช่การยกเลิกกำหนดส่งทั้งหมด`,keyClue:`"one more day wouldn't hurt"`,vocabulary:[{term:`circumstances`,meaningEnglish:`the particular conditions or facts connected with a situation`,meaningThai:`สถานการณ์, พฤติการณ์เฉพาะ`}],optionExplanations:[`Wrong — this contradicts the staff member's willingness to allow a short extension.`,`Wrong — the staff member is handling the request directly, not redirecting the student elsewhere.`,`Correct — the staff member indirectly grants exactly one extra day due to the special circumstances.`,`Wrong — this overstates the response; only one day of flexibility is offered, not a full cancellation.`],hints:[`Look closely at the exact amount of extra time the staff member mentions.`,`Phrases like "I suppose X wouldn't hurt" are a soft, indirect way of granting permission.`,`The staff member never suggests the student speak to someone else, so that option can be eliminated.`],hint3EliminateIndex:1,tags:[`inference`,`indirect-meaning`,`formal-register`]},{id:`MT5-Q14`,testId:`mock-test-5`,section:`Everyday Conversation`,order:14,skill:`Choosing a natural response in a negotiation exchange`,skillTag:`conversation`,difficulty:`Entrance Challenge`,instruction:`Choose the best response to complete the conversation.`,stimulus:{type:`none`},question:`A: "Could we possibly move our badminton match to Saturday morning instead of Friday? I have a dentist appointment." B: "_______"`,options:[`No, never mind.`,`You should have told me earlier.`,`I don't play badminton.`,`Saturday morning works for me, actually — let's do that.`],correctAnswer:3,explanationEnglish:`A makes a polite request to reschedule with a clear, reasonable explanation. The natural, cooperative response confirms the new time politely — matching the polite register of the request. The other options are either dismissive, off-topic, or unnecessarily critical.`,explanationThai:`A ขอเลื่อนนัดอย่างสุภาพพร้อมให้เหตุผลที่สมเหตุสมผล คำตอบที่เป็นธรรมชาติและร่วมมือคือการยืนยันเวลาที่นัดใหม่ด้วยน้ำเสียงสุภาพ สอดคล้องกับระดับความสุภาพของคำขอ ตัวเลือกอื่นๆ ล้วนดูปัดปฏิเสธ ไม่เกี่ยวข้อง หรือตำหนิโดยไม่จำเป็น`,keyClue:`polite request → polite, cooperative reply`,optionExplanations:[`Wrong — this is dismissive and does not respond to the reasonable request at all.`,`Wrong — this is unnecessarily critical and does not fit the polite tone of A's request.`,`Wrong — this is off-topic; B is clearly involved in the match already, since A is asking to reschedule with him/her.`,`Correct — this directly and politely confirms the new time, matching the cooperative tone of the request.`],hints:[`Notice how politely and reasonably A explains the reason for the request.`,`A cooperative reply to a polite request usually matches its tone and gives a clear answer.`,`B is clearly part of the match already (A is asking B to reschedule it), so claiming not to play badminton makes no sense here.`],hint3EliminateIndex:2,tags:[`register`,`negotiation`,`polite-request`]},{id:`MT5-Q15`,testId:`mock-test-5`,section:`Everyday Conversation`,order:15,skill:`Recognising formal telephone register`,skillTag:`conversation`,difficulty:`Entrance Challenge`,instruction:`Choose the most appropriate phrase for a formal telephone call.`,stimulus:{type:`none`},question:`A student is calling the school office to ask about a lost report card. Which opening is the most appropriate?`,options:[`Hey, it's me, where's my report card?`,`Good afternoon, this is Ananya from Grade 6B. I'm calling about my report card, which seems to be missing.`,`What happened to my report card? This is annoying.`,`Yo, do you have my report card or not?`],correctAnswer:1,explanationEnglish:`A formal telephone call to a school office calls for a polite greeting, full self-identification, and a clearly stated, calm reason for calling — exactly what option B provides. The other options are too casual, rude, or lack necessary identification for a formal context.`,explanationThai:`การโทรศัพท์ทางการไปที่สำนักงานโรงเรียนต้องมีคำทักทายสุภาพ แนะนำตัวให้ครบถ้วน และบอกเหตุผลที่โทรมาอย่างชัดเจนและใจเย็น ซึ่งตรงกับตัวเลือก B ส่วนตัวเลือกอื่นเป็นกันเองเกินไป หยาบคาย หรือขาดการแนะนำตัวที่จำเป็นสำหรับบริบททางการ`,keyClue:`formal greeting + full self-identification + clear reason`,optionExplanations:[`Wrong — "Hey, it's me" is far too casual and gives no identification for a formal office call.`,`Correct — a polite greeting, full name and class, and a clear, calm reason for calling fit formal telephone register.`,`Wrong — this sounds impatient and rude, unsuitable for a formal request.`,`Wrong — "Yo" and the abrupt question are much too informal for calling a school office.`],hints:[`Think about who is being called (a school office) and what tone is expected in that setting.`,`Formal phone calls typically open with a greeting, full self-identification, and a clear reason for calling.`,`Any option missing the caller's name and class is not suitable for this formal context, which rules one out immediately.`],hint3EliminateIndex:0,tags:[`register`,`formal-telephone`,`politeness`]},{id:`MT5-Q16`,testId:`mock-test-5`,section:`Cloze Dialogue or Short Message`,order:16,skill:`Tracking context across an announcement email to fill a blank`,skillTag:`conversation`,difficulty:`Entrance Challenge`,instruction:`Read the email announcement. Choose the best word or phrase for each blank (1), (2), and (3). This question is for blank (1).`,stimulus:{type:`message`,channel:`email`,from:`School Office`,to:`Grade 6 Parents and Students`,subject:`Change of Sports Day Schedule`,body:[`Dear Parents and Students,`,`We are writing to inform you that Sports Day, originally planned for Friday, (1) _______ to the following Monday because of the forecast of heavy rain.`,`All events will remain the same, but the closing ceremony (2) _______ take place indoors this year, in the main hall, instead of on the field.`,`If your child cannot attend on the new date, please (3) _______ the office in writing before Wednesday so that alternative arrangements can be made.`,`Thank you for your understanding.`,`School Office`]},question:`Choose the best word or phrase for blank (1).`,options:[`has been moved`,`is moving`,`will move`,`was moved`],correctAnswer:0,explanationEnglish:`The email is announcing a decision that has already been made and now affects the future event — this needs the present perfect passive, "has been moved," showing a completed change with present relevance. A simple future ("will move") would suggest the decision is not yet final.`,explanationThai:`อีเมลนี้ประกาศการตัดสินใจที่เกิดขึ้นแล้วและส่งผลต่องานในอนาคต จึงต้องใช้ present perfect passive คือ "has been moved" ซึ่งแสดงการเปลี่ยนแปลงที่เสร็จสิ้นแล้วและยังมีผลอยู่ในปัจจุบัน ถ้าใช้ future simple ("will move") จะสื่อว่ายังไม่ได้ตัดสินใจแน่นอน`,keyClue:`announcing a decision already made`,optionExplanations:[`Correct — "has been moved" (present perfect passive) shows the decision is already finalised and now stands.`,`Wrong — "is moving" (present continuous) suggests an action in progress now, not a completed scheduling decision.`,`Wrong — "will move" implies the decision is not yet certain, but the email is announcing a firm change.`,`Wrong — "was moved" (simple past passive) needs a specific past time reference and reads oddly without one, unlike the present-relevance perfect form.`],grammarRule:`Present perfect passive ("has/have been + past participle") announces a completed change that still affects the present/future.`,hints:[`Think about whether this is a firm, already-made decision or something still uncertain.`,`Formal announcements of finalised changes often use present perfect passive, not simple future.`,`The future form "will move" would suggest the change isn't decided yet, which contradicts the confident tone of the email.`],hint3EliminateIndex:2,vocabulary:[{term:`forecast`,meaningEnglish:`a prediction of future weather`,meaningThai:`การพยากรณ์ (อากาศ)`}],tags:[`cloze`,`passive-voice`,`announcement-email`]},{id:`MT5-Q17`,testId:`mock-test-5`,section:`Cloze Dialogue or Short Message`,order:17,skill:`Tracking context across an announcement email to fill a blank`,skillTag:`grammar`,difficulty:`Entrance Challenge`,instruction:`Look at the same email announcement above. Choose the best word or phrase for blank (2).`,stimulus:{type:`message`,channel:`email`,from:`School Office`,to:`Grade 6 Parents and Students`,subject:`Change of Sports Day Schedule`,body:[`Dear Parents and Students,`,`We are writing to inform you that Sports Day, originally planned for Friday, (1) _______ to the following Monday because of the forecast of heavy rain.`,`All events will remain the same, but the closing ceremony (2) _______ take place indoors this year, in the main hall, instead of on the field.`,`If your child cannot attend on the new date, please (3) _______ the office in writing before Wednesday so that alternative arrangements can be made.`,`Thank you for your understanding.`,`School Office`]},question:`Choose the best word or phrase for blank (2).`,options:[`should have`,`would`,`must have`,`will`],correctAnswer:3,explanationEnglish:`The sentence describes a planned future arrangement (this year's ceremony location) stated as a fact about what is going to happen — "will take place" is the standard way to state a scheduled future event in formal announcements. The other modals suggest hypothetical, obligatory-past, or advisory-past meanings that don't fit.`,explanationThai:`ประโยคนี้บอกแผนการในอนาคตที่กำหนดไว้แล้ว (สถานที่จัดพิธีปิดปีนี้) โดยระบุเป็นข้อเท็จจริงว่าจะเกิดอะไรขึ้น "will take place" เป็นวิธีมาตรฐานในการบอกเหตุการณ์ในอนาคตที่กำหนดไว้แล้วในประกาศทางการ ส่วนกริยาช่วยตัวอื่นสื่อความหมายสมมติ ภาระผูกพันในอดีต หรือคำแนะนำในอดีต ซึ่งไม่ตรงกับบริบท`,keyClue:`stating a scheduled future fact`,optionExplanations:[`Wrong — "should have" implies an unfulfilled past obligation ("should have happened but didn't"), which contradicts describing this year's upcoming ceremony.`,`Wrong — "would" suggests a hypothetical or reported-speech context, not a direct scheduled fact.`,`Wrong — "must have take place" is not even grammatical, and "must have" implies a past deduction, not a future plan.`,`Correct — "will take place" states a scheduled future event as a straightforward fact, fitting a formal announcement.`],grammarRule:`"Will" states a scheduled or decided future event as a plain fact, common in formal announcements.`,hints:[`Consider whether the sentence is talking about this year's upcoming event as a settled fact.`,`For scheduled future events stated confidently, "will + base verb" is the standard structure.`,`"Must have" and "should have" both refer to the past, which cannot describe this year's upcoming ceremony — ruling one of them out immediately.`],hint3EliminateIndex:2,tags:[`cloze`,`modal-verbs`,`future-plans`]},{id:`MT5-Q18`,testId:`mock-test-5`,section:`Cloze Dialogue or Short Message`,order:18,skill:`Tracking context across an announcement email to fill a blank`,skillTag:`conversation`,difficulty:`Entrance Challenge`,instruction:`Look at the same email announcement above. Choose the best word or phrase for blank (3).`,stimulus:{type:`message`,channel:`email`,from:`School Office`,to:`Grade 6 Parents and Students`,subject:`Change of Sports Day Schedule`,body:[`Dear Parents and Students,`,`We are writing to inform you that Sports Day, originally planned for Friday, (1) _______ to the following Monday because of the forecast of heavy rain.`,`All events will remain the same, but the closing ceremony (2) _______ take place indoors this year, in the main hall, instead of on the field.`,`If your child cannot attend on the new date, please (3) _______ the office in writing before Wednesday so that alternative arrangements can be made.`,`Thank you for your understanding.`,`School Office`]},question:`Choose the best word or phrase for blank (3).`,options:[`informing`,`informed`,`inform`,`be informed`],correctAnswer:2,explanationEnglish:`After "please," a polite instruction, the sentence needs a base-form (imperative) verb: "please inform the office." The parents are the ones doing the informing (an active action), so the passive "be informed" is wrong, and "informed"/"informing" don't fit grammatically after "please."`,explanationThai:`หลัง "please" ซึ่งเป็นคำสั่งเชิงสุภาพ ต้องตามด้วยกริยารูปฐาน (imperative) คือ "please inform the office" ผู้ปกครองเป็นผู้กระทำการแจ้ง (active) ดังนั้น passive "be informed" จึงผิด ส่วน "informed" และ "informing" ก็ไม่เข้ากับไวยากรณ์หลัง "please"`,keyClue:`"please" + base-form imperative verb`,optionExplanations:[`Wrong — "informing" (a gerund/participle) cannot follow "please" in an imperative instruction.`,`Wrong — "informed" is a past form and cannot follow "please" directly.`,`Correct — "please inform" uses the base-form verb needed after the polite imperative "please."`,`Wrong — "be informed" is passive, but it is the parents who must actively inform the office, not the other way round.`],grammarRule:`"Please" is followed by the base form of the verb (imperative structure), e.g. "please inform," "please contact."`,hints:[`Think about who is doing the action of informing — the parent, or the office?`,`"Please" introduces a polite command, which always takes the base form of the verb.`,`The passive option reverses who is informing whom, so it doesn't match the sentence's logic — that option can be eliminated.`],hint3EliminateIndex:3,tags:[`cloze`,`imperative`,`formal-request`]},{id:`MT5-Q19`,testId:`mock-test-5`,section:`Reading Comprehension`,order:19,skill:`Identifying the main idea of a passage`,skillTag:`reading`,difficulty:`Entrance Challenge`,instruction:`Read the passage. Then answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Fixed the Well`,paragraphs:[`When Nok was ten, her village's only well stopped working in the dry season. The adults argued for weeks about whose job it was to repair it, while everyone carried water from a stream two kilometres away. Nok had watched her uncle repair bicycles for years and wondered whether the well's problem was like a blocked bicycle pump.`,`One afternoon, instead of joining the other children at the stream, she borrowed her uncle's tools and climbed down into the dry well with a rope tied around her waist. She found the pipe was clogged with mud and small stones, not broken as everyone had assumed. It took her three hours to clear it, working carefully in the dark, narrow space.`,`When water rushed back through the pipe, the villagers who had gathered above cheered, though a few adults admitted they felt embarrassed that a child had solved a problem they had argued over for a month. Nok did not think she had done anything extraordinary; she said simply that nobody else had bothered to check what was actually wrong.`,`Today, the villagers still tell the story to new families who move in, not just because the well matters, but because it shows how a fresh pair of eyes, however young, can see what a room full of arguing adults cannot.`],wordCount:220},question:`What is the main idea of this passage?`,options:[`Bicycles and wells are repaired using exactly the same tools.`,`Village adults should never be trusted to fix anything.`,`Careful observation and fresh thinking can solve a problem that arguing fails to solve.`,`Children are always better at practical tasks than adults.`],correctAnswer:2,explanationEnglish:`The passage centres on Nok noticing what the arguing adults never checked — the actual cause of the problem — and fixing it through careful observation, not just youth or luck. The final paragraph explicitly draws this lesson: "a fresh pair of eyes... can sometimes see what a room full of arguing adults cannot."`,explanationThai:`เนื้อเรื่องเน้นที่นกสังเกตเห็นสิ่งที่ผู้ใหญ่ที่ทะเลาะกันไม่เคยตรวจสอบ คือสาเหตุที่แท้จริงของปัญหา และแก้ไขได้ด้วยการสังเกตอย่างรอบคอบ ไม่ใช่แค่เพราะความเยาว์วัยหรือโชค ย่อหน้าสุดท้ายบอกบทเรียนนี้ตรงๆ ว่า "สายตาคู่ใหม่ๆ... บางครั้งก็มองเห็นสิ่งที่ผู้ใหญ่ทั้งห้องที่กำลังทะเลาะกันมองไม่เห็น"`,keyClue:`closing sentence states the lesson directly`,optionExplanations:[`Wrong — this is a minor detail (her inspiration from bicycle repair), not the overall message, and overstates the similarity.`,`Wrong — the passage never suggests adults in general cannot be trusted; only that this particular group argued instead of checking.`,`Correct — the whole story and its closing line emphasise careful checking and fresh perspective over arguing.`,`Wrong — this over-generalises from one story to all children and all adults, which the passage does not claim.`],hints:[`Look at how the story ends — passages often state their main lesson in the final paragraph.`,`A main idea should summarise the whole passage, not just one detail from the middle.`,`The passage never claims children are generally better than adults at practical tasks — only that Nok noticed something the adults missed, so that option overreaches.`],hint3EliminateIndex:3,tags:[`main-idea`,`passage`,`inference`]},{id:`MT5-Q20`,testId:`mock-test-5`,section:`Reading Comprehension`,order:20,skill:`Making an inference not directly stated in the passage`,skillTag:`reading`,difficulty:`Entrance Challenge`,instruction:`Read the same passage above. Then answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Fixed the Well`,paragraphs:[`When Nok was ten, her village's only well stopped working in the dry season. The adults argued for weeks about whose job it was to repair it, while everyone carried water from a stream two kilometres away. Nok had watched her uncle repair bicycles for years and wondered whether the well's problem was like a blocked bicycle pump.`,`One afternoon, instead of joining the other children at the stream, she borrowed her uncle's tools and climbed down into the dry well with a rope tied around her waist. She found the pipe was clogged with mud and small stones, not broken as everyone had assumed. It took her three hours to clear it, working carefully in the dark, narrow space.`,`When water rushed back through the pipe, the villagers who had gathered above cheered, though a few adults admitted they felt embarrassed that a child had solved a problem they had argued over for a month. Nok did not think she had done anything extraordinary; she said simply that nobody else had bothered to check what was actually wrong.`,`Today, the villagers still tell the story to new families who move in, not just because the well matters, but because it shows how a fresh pair of eyes, however young, can see what a room full of arguing adults cannot.`],wordCount:220},question:`What can be inferred about why the adults had not fixed the well themselves?`,options:[`They believed the well was permanently and completely broken, so they never actually examined the pipe.`,`They did not know that wells needed to be repaired at all.`,`They were too busy carrying water from the stream to think about it.`,`They had already tried Nok's exact method and it had failed.`],correctAnswer:0,explanationEnglish:`The passage says Nok found the pipe "clogged... not broken as everyone assumed," and that "nobody else had bothered to check." Together, these details imply the adults assumed the well was unfixable and never actually investigated the real cause — an inference built from two separate clues, not stated as one sentence.`,explanationThai:`ข้อความระบุว่านกพบว่าท่อ "อุดตัน... ไม่ได้พังอย่างที่ทุกคนคิด" และ "ไม่มีใครลำบากตรวจสอบ" เมื่อรวมสองจุดนี้เข้าด้วยกัน แสดงว่าผู้ใหญ่คิดไปเองว่าบ่อน้ำซ่อมไม่ได้แล้ว และไม่เคยตรวจสอบสาเหตุที่แท้จริงเลย เป็นการอนุมานที่ต้องรวมเบาะแสสองจุดเข้าด้วยกัน ไม่ได้เขียนไว้ตรงๆในประโยคเดียว`,keyClue:`"not broken as everyone assumed" + "nobody else had bothered to check"`,optionExplanations:[`Correct — combining "everyone assumed" it was broken with "nobody... bothered to check" implies they gave up without investigating.`,`Wrong — the adults clearly knew the well needed fixing; they argued about whose job it was, which shows awareness of the problem.`,`Wrong — the passage says they argued for weeks before the water-carrying routine was even established as normal; being "busy" is not given as the reason.`,`Wrong — the passage never mentions any adult attempting Nok's method; this is not supported anywhere in the text.`],hints:[`Look for two separate clues in different paragraphs that, combined, explain the adults' inaction.`,`An inference question asks you to combine clues the text implies, not find one sentence that states the answer directly.`,`The text never mentions anyone trying and failing with Nok's method, so that option is not supported by the passage.`],hint3EliminateIndex:3,tags:[`inference`,`passage`,`evidence-based-reading`]},{id:`MT5-Q21`,testId:`mock-test-5`,section:`Reading Comprehension`,order:21,skill:`Identifying the writer's purpose`,skillTag:`reading`,difficulty:`Entrance Challenge`,instruction:`Read the same passage above. Then answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Fixed the Well`,paragraphs:[`When Nok was ten, her village's only well stopped working in the dry season. The adults argued for weeks about whose job it was to repair it, while everyone carried water from a stream two kilometres away. Nok had watched her uncle repair bicycles for years and wondered whether the well's problem was like a blocked bicycle pump.`,`One afternoon, instead of joining the other children at the stream, she borrowed her uncle's tools and climbed down into the dry well with a rope tied around her waist. She found the pipe was clogged with mud and small stones, not broken as everyone had assumed. It took her three hours to clear it, working carefully in the dark, narrow space.`,`When water rushed back through the pipe, the villagers who had gathered above cheered, though a few adults admitted they felt embarrassed that a child had solved a problem they had argued over for a month. Nok did not think she had done anything extraordinary; she said simply that nobody else had bothered to check what was actually wrong.`,`Today, the villagers still tell the story to new families who move in, not just because the well matters, but because it shows how a fresh pair of eyes, however young, can see what a room full of arguing adults cannot.`],wordCount:220},question:`Why did the writer most likely include the detail that Nok "did not think she had done anything extraordinary"?`,options:[`To prove that fixing the well was actually very easy for anyone to do`,`To suggest that Nok did not understand the seriousness of the water shortage`,`To show that Nok was modest and focused on the practical solution rather than seeking praise`,`To criticise the villagers for cheering too loudly`],correctAnswer:2,explanationEnglish:`This detail, combined with Nok's matter-of-fact explanation ("nobody else had bothered to check"), reveals her humble, practical character — she is more interested in the plain cause-and-effect than in receiving credit. The writer uses it to build Nok's character, not to comment on the task's difficulty or the villagers' reaction.`,explanationThai:`รายละเอียดนี้ ประกอบกับคำอธิบายที่ตรงไปตรงมาของนก ("ไม่มีใครลำบากตรวจสอบ") สะท้อนนิสัยถ่อมตัวและเน้นการปฏิบัติจริงมากกว่าการรับคำชม ผู้เขียนใช้รายละเอียดนี้เพื่อสร้างลักษณะนิสัยของนก ไม่ใช่เพื่อบอกว่างานนี้ง่ายหรือวิจารณ์ปฏิกิริยาของชาวบ้าน`,keyClue:`humble tone despite solving a month-long problem`,vocabulary:[{term:`extraordinary`,meaningEnglish:`very unusual or remarkable`,meaningThai:`พิเศษ, ไม่ธรรมดา`}],optionExplanations:[`Wrong — the passage emphasises how difficult and careful the three-hour task was, not that it was easy for anyone.`,`Wrong — Nok clearly understood the problem's seriousness; she is the one who solved it after weeks of failed argument.`,`Correct — this detail, paired with her calm explanation, is used to characterise Nok as modest and practical.`,`Wrong — the passage does not criticise the cheering; it is presented as a natural, positive reaction.`],hints:[`Think about what this detail tells you about Nok's personality, not about the well itself.`,`Writers often include a character's reaction to reveal personality traits like humility or confidence.`,`The passage never frames the cheering negatively, so a "criticising the villagers" purpose does not fit.`],hint3EliminateIndex:3,tags:[`writers-purpose`,`characterisation`,`passage`]},{id:`MT5-Q22`,testId:`mock-test-5`,section:`Reading Comprehension`,order:22,skill:`Distinguishing a true detail from a close paraphrase trap`,skillTag:`reading`,difficulty:`Entrance Challenge`,instruction:`Read the same passage above. Then answer the question.`,stimulus:{type:`passage`,title:`The Girl Who Fixed the Well`,paragraphs:[`When Nok was ten, her village's only well stopped working in the dry season. The adults argued for weeks about whose job it was to repair it, while everyone carried water from a stream two kilometres away. Nok had watched her uncle repair bicycles for years and wondered whether the well's problem was like a blocked bicycle pump.`,`One afternoon, instead of joining the other children at the stream, she borrowed her uncle's tools and climbed down into the dry well with a rope tied around her waist. She found the pipe was clogged with mud and small stones, not broken as everyone had assumed. It took her three hours to clear it, working carefully in the dark, narrow space.`,`When water rushed back through the pipe, the villagers who had gathered above cheered, though a few adults admitted they felt embarrassed that a child had solved a problem they had argued over for a month. Nok did not think she had done anything extraordinary; she said simply that nobody else had bothered to check what was actually wrong.`,`Today, the villagers still tell the story to new families who move in, not just because the well matters, but because it shows how a fresh pair of eyes, however young, can see what a room full of arguing adults cannot.`],wordCount:220},question:`Which statement is TRUE according to the passage?`,options:[`The well had been broken for exactly ten years before Nok fixed it.`,`Nok worked alone in the well for about three hours.`,`The villagers refused to believe the well was fixed even after the water returned.`,`Nok's uncle helped her climb down into the well and clear the pipe.`],correctAnswer:1,explanationEnglish:`The passage states clearly: "It took her three hours to clear it, working carefully in the dark, narrow space," and earlier that she climbed down with a rope, alone. The other options twist details: "ten years" confuses Nok's age with the well's downtime, the villagers actually cheered (not refused to believe), and her uncle only lent tools — he did not physically help her in the well.`,explanationThai:`ข้อความระบุชัดว่า "ใช้เวลาสามชั่วโมงในการเคลียร์ท่อ ทำงานอย่างระมัดระวังในพื้นที่มืดแคบ" และก่อนหน้านั้นเธอปีนลงไปคนเดียวโดยผูกเชือกรอบเอว ตัวเลือกอื่นบิดเบือนรายละเอียด: "สิบปี" สับสนระหว่างอายุของนกกับระยะเวลาที่บ่อพัง ชาวบ้านจริงๆ แล้วเชียร์ (ไม่ใช่ไม่เชื่อ) และลุงของเธอแค่ให้ยืมเครื่องมือ ไม่ได้ลงไปช่วยในบ่อจริงๆ`,keyClue:`"three hours... in the dark, narrow space" (alone, with rope)`,optionExplanations:[`Wrong — "ten" refers to Nok's age, not the number of years the well was broken; this confuses two separate numbers in the text.`,`Correct — the passage directly states she worked for three hours alone in the well, having climbed down by herself with a rope.`,`Wrong — the passage says villagers "cheered" when water returned, the opposite of refusing to believe it was fixed.`,`Wrong — her uncle only lent his tools; the passage says Nok climbed down herself with a rope, with no mention of him entering the well.`],hints:[`Check each option against a specific sentence in the passage — one number or detail may be swapped from elsewhere in the text.`,`True/false detail questions often disguise a wrong answer by reusing a real number or name from a different part of the passage.`,`The passage describes cheering, not disbelief, when the water returned — so that option can be eliminated.`],hint3EliminateIndex:2,tags:[`detail-question`,`close-paraphrase`,`passage`]},{id:`MT5-Q23`,testId:`mock-test-5`,section:`Functional Language and Error Recognition`,order:23,skill:`Spotting a subtle grammatical error in an almost-correct sentence`,skillTag:`functional`,difficulty:`Entrance Challenge`,instruction:`Choose the sentence that contains a grammatical error.`,stimulus:{type:`none`},question:`Which sentence contains an error?`,options:[`By the time we arrived, the meeting had already started.`,`She has been studying Engl

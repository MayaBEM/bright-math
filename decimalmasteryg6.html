title:`Whole numbers, decimals, powers of ten`,skill:`multiply`,blurb:`Multiply decimals using the standard algorithm — and understand exactly why the point lands where it does.`,lessons:[`u4-mul-whole`,`u4-mul-placement`,`u4-mul-decimal`,`u4-mul-powers10`]},{id:5,code:`05`,title:`Dividing Decimals`,subtitle:`Long division, whole-number divisors, powers of ten`,skill:`divide`,blurb:`The hardest unit, taken slowly: keep the point in line, and turn any divisor into a whole number.`,lessons:[`u5-div-whole`,`u5-div-by-decimal`,`u5-div-dec-by-dec`,`u5-div-powers10`]},{id:6,code:`06`,title:`Decimal Word Problems`,subtitle:`Money, measures, multi-step reasoning`,skill:`word`,blurb:`Read a real situation, decide which operation it needs, and work through problems that take more than one step.`,lessons:[`u6-word-choose`,`u6-word-money`,`u6-word-measure`,`u6-word-multistep`]}],_i={convert:`Fractions ↔ Decimals`,add:`Addition`,subtract:`Subtraction`,multiply:`Multiplication`,divide:`Division`,word:`Word Problems`},vi={1:`Foundation`,2:`Standard`,3:`Challenge`},yi=[{id:`u1-place-value`,unit:1,title:`Decimal Place Value`,goal:`Read, write and compare the value of each digit in a decimal.`,standard:`Review of Grade 5 place value (5.NBT.A.3) — needed before 6.NS.B.3`,thai:`หลังจุดทศนิยม หลักที่ 1 คือ ส่วนสิบ (0.1) หลักที่ 2 คือ ส่วนร้อย (0.01) หลักที่ 3 คือ ส่วนพัน (0.001) ค่าของเลขแต่ละตัวขึ้นอยู่กับหลักที่มันอยู่`,learn:[{heading:`A decimal point separates wholes from parts`,body:[`Every digit in a number has a value that depends on the column it sits in. Moving one column to the left multiplies the value by 10; moving one column to the right divides it by 10.`,`The decimal point marks the boundary between whole ones and parts of one. The first three columns after the point are tenths, hundredths and thousandths.`],visual:{kind:`place-value`,value:`3.472`,highlight:2}},{heading:`The same digit, different values`,body:[`In 3.472 the digit 4 means 4 tenths (0.4), the digit 7 means 7 hundredths (0.07) and the digit 2 means 2 thousandths (0.002).`,`Written out in full: 3.472 = 3 + 0.4 + 0.07 + 0.002.`],callout:{tone:`note`,text:`A zero after the last decimal digit changes nothing: 0.5 = 0.50 = 0.500. A zero in front of the digits changes everything: 0.5 is ten times 0.05.`}}],examples:[{title:`Naming the value of a digit`,problem:`What is the value of the digit 9 in 12.093?`,steps:[{label:`Name the columns`,detail:`0 is in the tenths place, 9 is in the hundredths place, 3 is in the thousandths place.`},{label:`State the value`,detail:`The 9 stands for 9 hundredths.`}],answer:`0.09`},{title:`Regrouping between places`,problem:`How many hundredths are there in 0.4?`,steps:[{label:`Rewrite with two places`,detail:`0.4 = 0.40 — the extra zero does not change the value.`},{label:`Read it as hundredths`,detail:`0.40 means 40 hundredths.`}],answer:`40 hundredths`},{title:`Building a number from its parts`,problem:`Write the number that is 6 ones, 0 tenths and 5 hundredths.`,steps:[{label:`Place each digit`,detail:`The 6 goes in the ones column, a 0 holds the tenths column, the 5 goes in the hundredths column.`},{label:`Write it`,detail:`Without the placeholder zero the 5 would slide into the tenths column and the number would be ten times too big.`}],answer:`6.05`}]},{id:`u1-frac-to-dec`,unit:1,title:`Fractions to Decimals`,goal:`Turn a fraction into a decimal using equivalent fractions or division.`,standard:`Review of 4.NF.C.6 and 5.NF.B.3 — needed before 6.NS.B.3`,thai:`มีสองวิธี: (1) ทำตัวส่วนให้เป็น 10, 100 หรือ 1000 แล้วอ่านเป็นทศนิยม (2) หารเศษด้วยส่วน เช่น 5/8 = 5 ÷ 8 = 0.625`,learn:[{heading:`Method 1 — make the denominator 10, 100 or 1000`,body:[`Decimals are just fractions whose denominators are 10, 100, 1000 and so on. If you can rename a fraction with one of those denominators, you can read the decimal straight off.`,`To rename, multiply the numerator and the denominator by the same number: 3/5 = (3 × 2)/(5 × 2) = 6/10 = 0.6.`],visual:{kind:`fraction-bar`,n:3,d:5}},{heading:`Method 2 — a fraction is a division`,body:[`The fraction bar means "divide". 5/8 means 5 ÷ 8.`,`Write the 5 as 5.000 so there are thousandths to share out, then divide: 5000 thousandths ÷ 8 = 625 thousandths = 0.625.`],callout:{tone:`note`,text:`Use Method 1 when the denominator divides into 10, 100 or 1000 (2, 4, 5, 8, 20, 25, 50). Use Method 2 for anything else.`}}],examples:[{title:`Renaming to hundredths`,problem:`Write 3/4 as a decimal.`,steps:[{label:`Choose the multiplier`,detail:`4 × 25 = 100, so multiply the top and bottom by 25.`},{label:`Rename`,detail:`3/4 = 75/100.`},{label:`Read the decimal`,detail:`75 hundredths = 0.75.`}],answer:`0.75`},{title:`Renaming to tenths`,problem:`Write 2/5 as a decimal.`,steps:[{label:`Choose the multiplier`,detail:`5 × 2 = 10, so multiply the top and bottom by 2.`},{label:`Rename`,detail:`2/5 = 4/10.`},{label:`Read the decimal`,detail:`4 tenths = 0.4.`}],answer:`0.4`},{title:`Dividing instead`,problem:`Write 7/8 as a decimal.`,steps:[{label:`Rewrite as a division`,detail:`7/8 = 7 ÷ 8.`},{label:`Add placeholder zeros`,detail:`Write 7 as 7.000, which is 7000 thousandths.`},{label:`Divide`,detail:`7000 ÷ 8 = 875, so the answer is 875 thousandths.`}],answer:`0.875`,visual:{kind:`long-division`,dividend:`7.000`,divisor:`8`,quotient:`0.875`}}]},{id:`u1-dec-to-frac`,unit:1,title:`Decimals to Fractions`,goal:`Write a decimal as a fraction and simplify it fully.`,standard:`Review of 4.NF.C.6 — needed before 6.NS.B.3`,thai:`นับจำนวนตำแหน่งทศนิยมเพื่อหาตัวส่วน: 1 ตำแหน่ง = ส่วน 10, 2 ตำแหน่ง = ส่วน 100, 3 ตำแหน่ง = ส่วน 1000 แล้วจึงทำเศษส่วนอย่างต่ำ`,learn:[{heading:`Count the decimal places`,body:[`The number of decimal places tells you the denominator. One place means tenths, two places means hundredths, three places means thousandths.`,`0.7 = 7/10 · 0.47 = 47/100 · 0.125 = 125/1000.`],visual:{kind:`grid`,value:`0.47`}},{heading:`Then simplify`,body:[`Divide the numerator and the denominator by their greatest common factor. 75/100 both divide by 25, giving 3/4.`,`Halving twice is a useful shortcut: 8/100 → 4/50 → 2/25. Keep going until the only common factor left is 1.`],callout:{tone:`warn`,text:`A fraction is only in its simplest form when nothing except 1 divides into both numbers. 4/50 is equal to 0.08 but it is not simplest — 2/25 is.`}}],examples:[{title:`Two decimal places`,problem:`Write 0.35 as a fraction in its simplest form.`,steps:[{label:`Write over 100`,detail:`Two decimal places, so 0.35 = 35/100.`},{label:`Find the common factor`,detail:`35 and 100 both divide by 5.`},{label:`Simplify`,detail:`35 ÷ 5 = 7 and 100 ÷ 5 = 20.`}],answer:`7/20`},{title:`Three decimal places`,problem:`Write 0.125 as a fraction in its simplest form.`,steps:[{label:`Write over 1000`,detail:`Three decimal places, so 0.125 = 125/1000.`},{label:`Find the common factor`,detail:`125 × 8 = 1000, so the greatest common factor is 125.`},{label:`Simplify`,detail:`125 ÷ 125 = 1 and 1000 ÷ 125 = 8.`}],answer:`1/8`},{title:`A decimal greater than 1`,problem:`Write 2.6 as a mixed number in its simplest form.`,steps:[{label:`Split off the whole part`,detail:`2.6 = 2 wholes and 6 tenths = 2 6/10.`},{label:`Simplify the fraction`,detail:`6 ÷ 2 = 3 and 10 ÷ 2 = 5.`}],answer:`2 3/5`}]},{id:`u1-compare-order`,unit:1,title:`Comparing & Ordering`,goal:`Compare and order decimals and fractions using place value and the number line.`,standard:`Review of 5.NBT.A.3.B — needed before 6.NS.B.3`,thai:`เปรียบเทียบทศนิยมให้เทียบทีละหลักจากซ้ายไปขวา ไม่ใช่ดูว่าตัวเลขยาวกว่า เช่น 0.7 > 0.68 เพราะ 7 ส่วนสิบ มากกว่า 6 ส่วนสิบ`,learn:[{heading:`Compare from the left, one column at a time`,body:[`Give both numbers the same number of decimal places by writing zeros on the right, then compare the ones, then the tenths, then the hundredths, stopping as soon as the digits differ.`,`0.7 against 0.68: write 0.70 and 0.68. The tenths are 7 and 6, so 0.7 is greater — even though 0.68 has more digits.`],visual:{kind:`number-line`,from:`0.6`,to:`0.8`,step:`0.02`,marks:[`0.68`,`0.7`],labels:[`0.68`,`0.7`]}},{heading:`Mixing fractions and decimals`,body:[`When a list mixes fractions and decimals, change everything into decimals first. Then every number is written in the same language and can be compared column by column.`,`For example 1/2 = 0.5 and 3/5 = 0.6, so 0.45 < 1/2 < 3/5.`],callout:{tone:`warn`,text:`The commonest mistake is "longer means bigger". 0.125 has three digits and 0.4 has one, but 0.125 is smaller.`}}],examples:[{title:`Comparing two decimals`,problem:`Which is greater, 0.409 or 0.41?`,steps:[{label:`Match the decimal places`,detail:`Write 0.41 as 0.410.`},{label:`Compare left to right`,detail:`Tenths: 4 = 4. Hundredths: 0 against 1.`},{label:`Decide`,detail:`1 > 0, so 0.41 is greater.`}],answer:`0.41`},{title:`Ordering a list`,problem:`Order 0.3, 0.25, 0.09 and 0.7 from smallest to largest.`,steps:[{label:`Match the decimal places`,detail:`0.30, 0.25, 0.09, 0.70.`},{label:`Compare the tenths`,detail:`The tenths digits are 3, 2, 0 and 7.`},{label:`Write in order`,detail:`Smallest tenths first.`}],answer:`0.09, 0.25, 0.3, 0.7`},{title:`Finding a number in between`,problem:`Name a decimal between 0.27 and 0.28.`,steps:[{label:`Go one place further`,detail:`Write them as thousandths: 0.270 and 0.280.`},{label:`Choose a value between`,detail:`Anything from 271 to 279 thousandths works.`}],answer:`0.275`}]},{id:`u2-add-align`,unit:2,title:`Lining Up to Add`,goal:`Add decimals with the same number of decimal places using the standard algorithm.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`เขียนจุดทศนิยมให้ตรงกันเป็นแนวเดียว แล้วบวกจากขวาไปซ้าย เมื่อครบ 10 ให้ทดไปหลักถัดไป`,learn:[{heading:`One column, one place value`,body:[`Written addition works because each column holds a single place value. Lining up the decimal points puts ones under ones, tenths under tenths and hundredths under hundredths.`,`Then add from the right. Whenever a column reaches 10, carry 1 into the column on its left — exactly as with whole numbers.`],visual:{kind:`column`,op:`+`,a:`4.56`,b:`3.28`,result:`7.84`}},{heading:`The decimal point comes straight down`,body:[`The point in the answer sits directly below the points in the question. It never moves, because the columns never move.`],callout:{tone:`note`,text:`Estimate before you start. 4.56 + 3.28 is about 5 + 3 = 8, so an answer of 7.84 makes sense and an answer of 78.4 does not.`}}],examples:[{title:`Adding hundredths`,problem:`4.56 + 3.28`,steps:[{label:`Hundredths`,detail:`6 + 8 = 14. Write 4, carry 1.`},{label:`Tenths`,detail:`5 + 2 + 1 carried = 8.`},{label:`Ones`,detail:`4 + 3 = 7.`}],answer:`7.84`,visual:{kind:`column`,op:`+`,a:`4.56`,b:`3.28`,result:`7.84`}},{title:`Carrying into the ones`,problem:`6.8 + 5.7`,steps:[{label:`Tenths`,detail:`8 + 7 = 15 tenths. That is 1 one and 5 tenths, so write 5 and carry 1.`},{label:`Ones`,detail:`6 + 5 + 1 carried = 12.`}],answer:`12.5`,visual:{kind:`column`,op:`+`,a:`6.8`,b:`5.7`,result:`12.5`}}]},{id:`u2-add-ragged`,unit:2,title:`Placeholder Zeros`,goal:`Add decimals that have different numbers of decimal places.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`ถ้าทศนิยมไม่เท่ากัน ให้เติมศูนย์ "ท้ายสุด" ให้เท่ากันก่อน เช่น 4.7 = 4.70 (ไม่ใช่ 4.07) แล้วจึงบวก`,learn:[{heading:`Make the columns match`,body:[`When one number has fewer decimal places than the other, write zeros on the right-hand end until they match. 4.7 becomes 4.70; a whole number like 9 becomes 9.00.`,`This changes nothing about the value — 4 ones and 7 tenths and 0 hundredths is still 4.7 — but it gives every column a digit to work with.`],visual:{kind:`column`,op:`+`,a:`4.70`,b:`2.35`,result:`7.05`}},{heading:`Zeros go on the right, never on the left`,body:[`Writing 4.7 as 4.07 is the single most common error in this topic. It moves the 7 out of the tenths column and into the hundredths column, making the number ten times too small.`],callout:{tone:`warn`,text:`4.7 = 4.70 ✓  ·  4.7 ≠ 4.07 ✗`}}],examples:[{title:`One place plus two places`,problem:`4.7 + 2.35`,steps:[{label:`Match the places`,detail:`Write 4.7 as 4.70.`},{label:`Hundredths`,detail:`0 + 5 = 5.`},{label:`Tenths`,detail:`7 + 3 = 10 tenths. Write 0, carry 1.`},{label:`Ones`,detail:`4 + 2 + 1 carried = 7.`}],answer:`7.05`,visual:{kind:`column`,op:`+`,a:`4.70`,b:`2.35`,result:`7.05`}},{title:`A whole number in the sum`,problem:`9 + 4.08 + 0.6`,steps:[{label:`Match the places`,detail:`Write them as 9.00, 4.08 and 0.60.`},{label:`Hundredths`,detail:`0 + 8 + 0 = 8.`},{label:`Tenths`,detail:`0 + 0 + 6 = 6.`},{label:`Ones`,detail:`9 + 4 + 0 = 13.`}],answer:`13.68`}]},{id:`u2-add-estimate`,unit:2,title:`Estimating & Missing Numbers`,goal:`Estimate a total to check reasonableness, and find a missing addend.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`ประมาณค่าโดยปัดเป็นจำนวนเต็มก่อนคำนวณ เพื่อตรวจว่าคำตอบสมเหตุสมผลไหม และใช้การลบเพื่อหาตัวที่หายไป`,learn:[{heading:`Estimate first, calculate second`,body:[`Round each number to the nearest whole number and add. The estimate will not be the exact answer, but it tells you roughly where the answer should be — and it catches misplaced decimal points immediately.`,`12.6 + 7.85 ≈ 13 + 8 = 21. An answer of 20.45 passes the check; an answer of 2.045 or 204.5 does not.`]},{heading:`Missing numbers: work backwards`,body:[`Addition and subtraction undo each other. If 3.45 + ? = 8.2, then ? = 8.2 − 3.45.`,`Always check your answer by putting it back into the original: 3.45 + 4.75 = 8.20 ✓.`],callout:{tone:`note`,text:`Complements to a whole number are worth knowing by heart: 7.6 + 2.4 = 10, 0.35 + 0.65 = 1.`}}],examples:[{title:`Checking with an estimate`,problem:`Is 6.45 + 4.2 = 10.65 reasonable?`,steps:[{label:`Round`,detail:`6.45 ≈ 6 and 4.2 ≈ 4.`},{label:`Estimate`,detail:`6 + 4 = 10.`},{label:`Compare`,detail:`10.65 is close to 10, so the answer is reasonable.`}],answer:`Yes — 10.65 is sensible`},{title:`Finding a missing addend`,problem:`3.45 + ______ = 8.2`,steps:[{label:`Work backwards`,detail:`The missing number is 8.2 − 3.45.`},{label:`Match the places`,detail:`Write 8.2 as 8.20.`},{label:`Subtract`,detail:`8.20 − 3.45 = 4.75.`},{label:`Check`,detail:`3.45 + 4.75 = 8.20 ✓`}],answer:`4.75`}]},{id:`u3-sub-align`,unit:3,title:`Lining Up to Subtract`,goal:`Subtract decimals using the standard algorithm, regrouping where needed.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`เรียงจุดทศนิยมให้ตรงกัน แล้วลบจากขวาไปซ้าย ถ้าหลักไหนลบไม่ได้ ให้ยืมจากหลักซ้ายมือ 1 หน่วย`,learn:[{heading:`Same rule, opposite direction`,body:[`Subtraction uses exactly the same column setup as addition: points in a line, one place value per column, working from the right.`,`When a column will not subtract, regroup one unit from the column to its left. One whole becomes 10 tenths; one tenth becomes 10 hundredths.`],visual:{kind:`column`,op:`-`,a:`6.34`,b:`2.58`,result:`3.76`}},{heading:`The smaller-from-larger trap`,body:[`If a column shows 0 − 8, you cannot simply write 8. That is the most common subtraction bug and it turns 7.03 − 2.8 into 5.83 instead of 4.23.`,`Regroup instead: borrow from the column on the left and carry on.`],callout:{tone:`warn`,text:`Never swap a column round to make it easier. Take the digits in the order they are written and regroup when you need to.`}}],examples:[{title:`Regrouping once`,problem:`6.34 − 2.58`,steps:[{label:`Hundredths`,detail:`4 − 8 will not work. Regroup 1 tenth into 10 hundredths: 14 − 8 = 6.`},{label:`Tenths`,detail:`The 3 tenths became 2 tenths. 2 − 5 will not work either, so regroup 1 one into 10 tenths: 12 − 5 = 7.`},{label:`Ones`,detail:`The 6 became 5. 5 − 2 = 3.`}],answer:`3.76`,visual:{kind:`column`,op:`-`,a:`6.34`,b:`2.58`,result:`3.76`}},{title:`Checking by adding`,problem:`Check that 9.2 − 3.7 = 5.5`,steps:[{label:`Add the answer back`,detail:`5.5 + 3.7 = 9.2.`},{label:`Compare`,detail:`It matches the number you started with, so the subtraction is correct.`}],answer:`Correct ✓`}]},{id:`u3-sub-regroup`,unit:3,title:`Subtracting from Whole Numbers`,goal:`Subtract a decimal from a whole number by writing placeholder zeros first.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`ก่อนลบ ต้องเขียนจำนวนเต็มให้มีทศนิยมครบก่อน เช่น 20 − 4.685 ให้เขียน 20 เป็น 20.000 แล้วจึงยืมทีละหลัก`,learn:[{heading:`Give the whole number some decimal places`,body:[`You cannot borrow from a column that has not been written down. Before subtracting, write the whole number with as many decimal places as the other number: 20 becomes 20.000.`,`This is the same idea as placeholder zeros in addition — the value does not change, but every column now has a digit.`],visual:{kind:`column`,op:`-`,a:`20.000`,b:`4.685`,result:`15.315`}},{heading:`Regrouping across a row of zeros`,body:[`With 20.000 − 4.685, the thousandths column needs 0 − 5. There are no hundredths or tenths to borrow from either, so the regrouping travels left until it reaches the 20.`,`One whole is exchanged for 10 tenths, one tenth for 10 hundredths, one hundredth for 10 thousandths — then every column can subtract.`],callout:{tone:`note`,text:`Always finish by checking: 15.315 + 4.685 = 20.000 ✓`}}],examples:[{title:`A whole number minus a decimal`,problem:`20 − 4.685`,steps:[{label:`Write placeholder zeros`,detail:`20 = 20.000.`},{label:`Regroup`,detail:`Exchange one whole for 10 tenths, then a tenth for 10 hundredths, then a hundredth for 10 thousandths.`},{label:`Subtract each column`,detail:`10 − 5 = 5 thousandths, 9 − 8 = 1 hundredth, 9 − 6 = 3 tenths, 19 − 4 = 15 ones.`}],answer:`15.315`,visual:{kind:`column`,op:`-`,a:`20.000`,b:`4.685`,result:`15.315`}},{title:`Ragged decimals`,problem:`7.03 − 2.8`,steps:[{label:`Match the places`,detail:`Write 2.8 as 2.80.`},{label:`Hundredths`,detail:`3 − 0 = 3.`},{label:`Tenths`,detail:`0 − 8 will not work, so regroup 1 one into 10 tenths: 10 − 8 = 2.`},{label:`Ones`,detail:`The 7 became 6. 6 − 2 = 4.`}],answer:`4.23`}]},{id:`u3-sub-check`,unit:3,title:`Estimating & Checking`,goal:`Estimate a difference and check a subtraction by adding.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`ตรวจคำตอบของการลบด้วยการบวกกลับ: ถ้า a − b = c แล้ว c + b ต้องเท่ากับ a`,learn:[{heading:`Addition is the check`,body:[`Subtraction and addition are inverse operations. If 8.5 − 3.27 = 5.23, then 5.23 + 3.27 must give 8.5 back.`,`This check takes ten seconds and catches almost every regrouping slip.`]},{heading:`Estimating a difference`,body:[`Round both numbers to the nearest whole number before you subtract. 20.4 − 9.7 ≈ 20 − 10 = 10, so the exact answer should be near 10.`,`Estimation is especially useful for spotting an answer that is ten times too big or too small.`],callout:{tone:`note`,text:`"Find the difference" means subtract the smaller number from the larger one.`}}],examples:[{title:`Estimate, calculate, check`,problem:`12.5 − 4.75`,steps:[{label:`Estimate`,detail:`13 − 5 = 8, so expect an answer near 8.`},{label:`Calculate`,detail:`Write 12.5 as 12.50, then 12.50 − 4.75 = 7.75.`},{label:`Check`,detail:`7.75 + 4.75 = 12.50 ✓`}],answer:`7.75`},{title:`Finding the starting number`,problem:`______ − 2.6 = 4.85`,steps:[{label:`Work backwards`,detail:`The starting number is 4.85 + 2.6.`},{label:`Match the places`,detail:`4.85 + 2.60 = 7.45.`},{label:`Check`,detail:`7.45 − 2.6 = 4.85 ✓`}],answer:`7.45`}]},{id:`u4-mul-whole`,unit:4,title:`Multiplying by a Whole Number`,goal:`Multiply a decimal by a whole number and place the decimal point correctly.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`การคูณด้วยจำนวนเต็มคือการบวกซ้ำ ๆ ให้คูณเหมือนจำนวนเต็มก่อน แล้วใส่ทศนิยมเท่ากับจำนวนตำแหน่งทศนิยมของตัวตั้ง`,learn:[{heading:`Multiplying is repeated adding`,body:[`3.4 × 5 means five lots of 3.4. That is 15 ones and 20 tenths — and 20 tenths is 2 more ones, so the answer is 17.`,`You would not want to add five times for every question, so use the standard algorithm instead: multiply as if there were no decimal point, then put it back.`]},{heading:`Multiply, then count the places`,body:[`For 3.4 × 5: ignore the point and work out 34 × 5 = 170. The number 3.4 has one decimal place, so the answer needs one: 170 ÷ 10 = 17.0 = 17.`,`Estimate to check: 3.4 is about 3, and 3 × 5 = 15, so 17 is sensible.`],callout:{tone:`note`,text:`Multiplying by a whole number bigger than 1 always makes a positive number larger. If your answer is smaller, something has gone wrong.`}}],examples:[{title:`One decimal place`,problem:`4.25 × 3`,steps:[{label:`Ignore the point`,detail:`425 × 3 = 1275.`},{label:`Count the places`,detail:`4.25 has 2 decimal places, so the answer needs 2.`},{label:`Place the point`,detail:`1275 ÷ 100 = 12.75.`}],answer:`12.75`},{title:`When the answer is a whole number`,problem:`2.5 × 4`,steps:[{label:`Ignore the point`,detail:`25 × 4 = 100.`},{label:`Count the places`,detail:`2.5 has 1 decimal place.`},{label:`Place the point`,detail:`100 ÷ 10 = 10.0, which is written 10.`}],answer:`10`}]},{id:`u4-mul-placement`,unit:4,title:`Why the Point Lands There`,goal:`Explain decimal placement using powers of ten rather than a memorised rule.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`เหตุผลที่ต้องนับตำแหน่งทศนิยม: 2.6 × 1.4 = (26 ÷ 10) × (14 ÷ 10) = 364 ÷ 100 = 3.64 คือหารด้วย 10 สองครั้ง`,learn:[{heading:`Turn the decimals into whole numbers`,body:[`Every decimal can be written as a whole number divided by a power of ten: 2.6 = 26 ÷ 10 and 1.4 = 14 ÷ 10.`,`So 2.6 × 1.4 = (26 ÷ 10) × (14 ÷ 10) = (26 × 14) ÷ 100 = 364 ÷ 100 = 3.64.`]},{heading:`That is where the counting rule comes from`,body:[`You divided by 10 once for each decimal place in each factor. One place plus one place means dividing by 100, which shifts the digits two columns to the right.`,`The familiar rule — "add up the decimal places in the question" — is just a short way of saying that.`],callout:{tone:`warn`,text:`0.4 × 0.2 is not 0.8. It is (4 × 2) ÷ 100 = 0.08. Both factors are less than 1, so the product must be smaller than either of them.`}}],examples:[{title:`Using a known fact`,problem:`26 × 14 = 364. What is 2.6 × 1.4?`,steps:[{label:`Rewrite the factors`,detail:`2.6 = 26 ÷ 10 and 1.4 = 14 ÷ 10.`},{label:`Combine`,detail:`(26 × 14) ÷ 100 = 364 ÷ 100.`},{label:`Shift the digits`,detail:`Dividing by 100 moves every digit two places right.`}],answer:`3.64`},{title:`Predicting the size of an answer`,problem:`Is 6 × 0.9 more or less than 6?`,steps:[{label:`Look at the multiplier`,detail:`0.9 is less than 1, so you are taking 9 tenths of 6.`},{label:`Decide`,detail:`Part of 6 must be less than 6.`},{label:`Confirm`,detail:`6 × 0.9 = 5.4.`}],answer:`Less than 6`}]},{id:`u4-mul-decimal`,unit:4,title:`Decimal × Decimal`,goal:`Multiply two decimals using the standard algorithm.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`คูณเลขโดยไม่สนใจจุดก่อน แล้วนับตำแหน่งทศนิยมของทั้งสองจำนวนรวมกัน นั่นคือจำนวนตำแหน่งทศนิยมของคำตอบ`,learn:[{heading:`Three steps, every time`,body:[`Step 1 — estimate, so you know roughly what to expect. Step 2 — multiply the digits as whole numbers. Step 3 — count the decimal places in both factors and put that many in the answer.`,`For 12.75 × 2.4: estimate 13 × 2 = 26; multiply 1275 × 24 = 30600; count 2 + 1 = 3 places, giving 30.600 = 30.6.`]},{heading:`Trailing zeros can be dropped`,body:[`If the last digits of the answer are zeros they can be removed without changing the value: 30.600 = 30.6 and 0.280 = 0.28.`,`Count the places first, then tidy the answer — never the other way round.`],callout:{tone:`note`,text:`Multiplying by a number less than 1 makes the answer smaller; multiplying by a number greater than 1 makes it larger. Use this to sanity-check every answer.`}}],examples:[{title:`Two small decimals`,problem:`0.35 × 0.8`,steps:[{label:`Multiply the digits`,detail:`35 × 8 = 280.`},{label:`Count the places`,detail:`0.35 has 2 and 0.8 has 1, so 3 in total.`},{label:`Place the point`,detail:`280 ÷ 1000 = 0.280 = 0.28.`}],answer:`0.28`},{title:`A larger product`,problem:`12.75 × 2.4`,steps:[{label:`Estimate`,detail:`13 × 2 = 26.`},{label:`Multiply the digits`,detail:`1275 × 24 = 30600.`},{label:`Count the places`,detail:`2 + 1 = 3 decimal places.`},{label:`Place the point`,detail:`30600 ÷ 1000 = 30.6, which is close to the estimate ✓`}],answer:`30.6`}]},{id:`u4-mul-powers10`,unit:4,title:`Multiplying by Powers of Ten`,goal:`Multiply by 10, 100, 1000, 0.1 and 0.01 using place-value reasoning.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`คูณด้วย 10 = ตัวเลขทุกตัวเลื่อนไปทางซ้าย 1 หลัก, คูณด้วย 0.1 = เลื่อนไปทางขวา 1 หลัก จุดทศนิยมไม่ได้ย้าย`,learn:[{heading:`The digits move, not the point`,body:[`Multiplying by 10 makes every part of a number ten times bigger, so every digit moves one column to the left: 3 tenths become 3 ones, 6 hundredths become 6 tenths.`,`It looks as though the point has hopped to the right, but the point always stays between the ones and the tenths.`],visual:{kind:`place-value`,value:`3.6`,highlight:1}},{heading:`Multiplying by 0.1 or 0.01`,body:[`0.1 is one tenth, so multiplying by 0.1 is the same as dividing by 10 — each digit moves one column to the right.`,`0.4 × 0.1 = 0.04 and 12.5 × 0.1 = 1.25.`],callout:{tone:`warn`,text:`"Add a zero" only works for whole numbers. 3.6 × 10 is 36, not 3.60.`}}],examples:[{title:`Multiplying by 100`,problem:`5.62 × 100`,steps:[{label:`How far do the digits move?`,detail:`100 has two zeros, so every digit moves two columns left.`},{label:`Move them`,detail:`5 ones become 5 hundreds, 6 tenths become 6 tens, 2 hundredths become 2 ones.`}],answer:`562`},{title:`Multiplying by 0.01`,problem:`7.3 × 0.01`,steps:[{label:`What does 0.01 mean?`,detail:`0.01 is one hundredth, so this is the same as dividing by 100.`},{label:`Move the digits right`,detail:`7 ones become 7 hundredths and 3 tenths become 3 thousandths.`}],answer:`0.073`}]},{id:`u5-div-whole`,unit:5,title:`Dividing by a Whole Number`,goal:`Divide a decimal by a whole number, keeping the point in line.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`หารทศนิยมด้วยจำนวนเต็ม: วางจุดทศนิยมของผลหารให้ตรงกับตัวตั้ง แล้วหารตามปกติ ถ้าหารไม่ลงตัวให้เติมศูนย์ต่อท้าย`,learn:[{heading:`The point comes straight up`,body:[`In long division the columns keep their place values, so the decimal point in the answer sits directly above the point in the number being divided.`,`8.4 ÷ 4: 8 ones ÷ 4 = 2 ones, and 4 tenths ÷ 4 = 1 tenth, giving 2.1.`],visual:{kind:`long-division`,dividend:`8.4`,divisor:`4`,quotient:`2.1`}},{heading:`Add zeros when the division does not stop`,body:[`3 ÷ 4 does not give a whole number, so write 3 as 3.00. Now you have 300 hundredths, and 300 ÷ 4 = 75 hundredths = 0.75.`,`You can keep adding zeros on the right for as long as you need them, because they do not change the value of the dividend.`],callout:{tone:`note`,text:`Check any division by multiplying back: 0.75 × 4 = 3 ✓`}}],examples:[{title:`A clean division`,problem:`15.75 ÷ 5`,steps:[{label:`Think in hundredths`,detail:`15.75 is 1575 hundredths.`},{label:`Divide`,detail:`1575 ÷ 5 = 315.`},{label:`Convert back`,detail:`315 hundredths = 3.15.`}],answer:`3.15`,visual:{kind:`long-division`,dividend:`15.75`,divisor:`5`,quotient:`3.15`}},{title:`Adding placeholder zeros`,problem:`3 ÷ 4`,steps:[{label:`Write extra zeros`,detail:`3 = 3.00, which is 300 hundredths.`},{label:`Divide`,detail:`300 ÷ 4 = 75.`},{label:`Convert back`,detail:`75 hundredths = 0.75.`}],answer:`0.75`}]},{id:`u5-div-by-decimal`,unit:5,title:`Making the Divisor Whole`,goal:`Divide by a decimal by scaling both numbers by the same power of ten.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`ถ้าตัวหารเป็นทศนิยม ให้คูณทั้งตัวตั้งและตัวหารด้วย 10 หรือ 100 เท่ากัน ผลหารจะไม่เปลี่ยน เช่น 7.2 ÷ 0.6 = 72 ÷ 6 = 12`,learn:[{heading:`A division is a fraction`,body:[`7.2 ÷ 0.6 can be written as the fraction 7.2/0.6. Multiplying the numerator and denominator by the same number gives an equivalent fraction with exactly the same value.`,`Multiply both by 10: 7.2/0.6 = 72/6 = 12. Nothing about the answer has changed — only the way the question is written.`]},{heading:`How far to scale`,body:[`Scale by whatever makes the divisor a whole number: ×10 for one decimal place, ×100 for two, ×1000 for three. The dividend must be scaled by the same amount.`,`This is why the classroom instruction "move both points the same number of places" works — but the reason is equivalent fractions, not a trick.`],callout:{tone:`warn`,text:`Dividing by a number smaller than 1 gives an answer larger than you started with. 4 ÷ 0.5 = 8, not 2 — you are counting how many halves fit into 4.`}}],examples:[{title:`Scaling by 10`,problem:`8.4 ÷ 0.7`,steps:[{label:`Make the divisor whole`,detail:`0.7 has one decimal place, so multiply both numbers by 10.`},{label:`Rewrite`,detail:`8.4 ÷ 0.7 = 84 ÷ 7.`},{label:`Divide`,detail:`84 ÷ 7 = 12.`}],answer:`12`},{title:`Scaling by 100`,problem:`9 ÷ 0.25`,steps:[{label:`Make the divisor whole`,detail:`0.25 has two decimal places, so multiply both numbers by 100.`},{label:`Rewrite`,detail:`9 ÷ 0.25 = 900 ÷ 25.`},{label:`Divide`,detail:`900 ÷ 25 = 36.`},{label:`Check`,detail:`36 × 0.25 = 9 ✓`}],answer:`36`}]},{id:`u5-div-dec-by-dec`,unit:5,title:`Decimal ÷ Decimal`,goal:`Divide one decimal by another and check the result.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`ทำตัวหารให้เป็นจำนวนเต็มก่อน แล้วหารยาวตามปกติ อย่าลืมตรวจคำตอบด้วยการคูณกลับ`,learn:[{heading:`Same method, both numbers decimal`,body:[`Scale both numbers until the divisor is a whole number, then divide normally. The dividend is allowed to stay a decimal.`,`12.48 ÷ 2.4 → multiply both by 10 → 124.8 ÷ 24. Then 1248 tenths ÷ 24 = 52 tenths = 5.2.`],visual:{kind:`long-division`,dividend:`124.8`,divisor:`24`,quotient:`5.2`}},{heading:`Estimate to place the answer`,body:[`Before dividing, round: 12.48 ÷ 2.4 ≈ 12 ÷ 2 = 6. An answer of 5.2 is sensible; 52 or 0.52 is not.`,`Finish by multiplying back: 5.2 × 2.4 = 12.48 ✓`],callout:{tone:`note`,text:`It does not matter how many decimal places the dividend has — only the divisor has to become a whole number.`}}],examples:[{title:`Both numbers to one place`,problem:`2.4 ÷ 0.8`,steps:[{label:`Scale both by 10`,detail:`2.4 ÷ 0.8 = 24 ÷ 8.`},{label:`Divide`,detail:`24 ÷ 8 = 3.`},{label:`Check`,detail:`3 × 0.8 = 2.4 ✓`}],answer:`3`},{title:`Scaling by 100`,problem:`6.25 ÷ 0.25`,steps:[{label:`Scale both by 100`,detail:`6.25 ÷ 0.25 = 625 ÷ 25.`},{label:`Divide`,detail:`625 ÷ 25 = 25.`},{label:`Check`,detail:`25 × 0.25 = 6.25 ✓`}],answer:`25`}]},{id:`u5-div-powers10`,unit:5,title:`Dividing by Powers of Ten`,goal:`Divide by 10, 100, 1000, 0.1 and 0.01 using place-value reasoning.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3`,thai:`หารด้วย 10 = เลื่อนตัวเลขไปทางขวา 1 หลัก, หารด้วย 0.1 = เหมือนคูณด้วย 10 เพราะถามว่ามีกี่ "ส่วนสิบ"`,learn:[{heading:`Dividing by 10, 100 and 1000`,body:[`Dividing by 10 makes every part of the number ten times smaller, so every digit moves one column to the right: 4.5 ÷ 10 = 0.45.`,`Dividing by 100 moves the digits two columns and by 1000 three columns, filling any empty places with zeros: 8.2 ÷ 1000 = 0.0082.`]},{heading:`Dividing by 0.1 makes numbers bigger`,body:[`3.6 ÷ 0.1 asks how many tenths fit into 3.6. Each whole holds 10 tenths, so the answer is 36 — ten times larger than the number you started with.`,`Dividing by 0.1 is the same as multiplying by 10; dividing by 0.01 is the same as multiplying by 100.`],callout:{tone:`warn`,text:`Dividing does not always make numbers smaller. It only does when the divisor is greater than 1.`}}],examples:[{title:`Dividing by 1000`,problem:`8.2 ÷ 1000`,steps:[{label:`How far do the digits move?`,detail:`1000 has three zeros, so every digit moves three columns right.`},{label:`Fill the empty places`,detail:`8 ones become 8 thousandths and 2 tenths become 2 ten-thousandths; zeros hold the tenths and hundredths.`}],answer:`0.0082`},{title:`Dividing by 0.01`,problem:`0.45 ÷ 0.01`,steps:[{label:`Read the question`,detail:`How many hundredths are there in 0.45?`},{label:`Count them`,detail:`0.45 is 45 hundredths.`},{label:`Confirm`,detail:`Dividing by 0.01 is the same as multiplying by 100.`}],answer:`45`}]},{id:`u6-word-choose`,unit:6,title:`Choosing the Operation`,goal:`Read a situation and decide which calculation answers it.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3 applied in context`,thai:`อย่าจำคำใบ้ ให้ถามตัวเองว่า "จำนวนกำลังรวมกัน แยกออก เพิ่มเป็นชุด หรือถูกแบ่ง" แล้วเลือกวิธีคิดจากสถานการณ์`,learn:[{heading:`Ask what is happening to the numbers`,body:[`Add when two or more amounts are being combined. Subtract when an amount is removed, or when two amounts are being compared.`,`Multiply when there are several equal groups. Divide when a total is being shared equally, or when you are counting how many equal portions fit inside a total.`]},{heading:`Do not trust keywords`,body:[`Words like "altogether", "each" and "left" appear in problems that need all four operations, so they are not reliable clues.`,`"A rope 12.6 m long is cut into 0.9 m pieces" contains no keyword at all, but it clearly needs division: you are counting how many 0.9s fit into 12.6.`],callout:{tone:`warn`,text:`Before calculating, say the answer sentence out loud: "each piece is ___ metres long". It usually makes the operation obvious.`}}],examples:[{title:`Sharing equally`,problem:`A plank 5.4 m long is cut into 4 equal pieces. How long is each piece?`,steps:[{label:`What is happening?`,detail:`One length is being split into equal shares, so divide.`},{label:`Calculate`,detail:`5.4 ÷ 4 = 1.35.`},{label:`Answer in context`,detail:`Each piece is 1.35 m long.`}],answer:`1.35 m`},{title:`Counting portions`,problem:`A jug holds 1.5 L. Each glass holds 0.25 L. How many glasses can be filled?`,steps:[{label:`What is happening?`,detail:`You are counting how many 0.25 L portions fit into 1.5 L, so divide.`},{label:`Make the divisor whole`,detail:`1.5 ÷ 0.25 = 150 ÷ 25.`},{label:`Calculate`,detail:`150 ÷ 25 = 6.`}],answer:`6 glasses`}]},{id:`u6-word-money`,unit:6,title:`Money Problems`,goal:`Solve shopping, change and pricing problems with decimals.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3 applied in context`,thai:`เงินเขียนทศนิยม 2 ตำแหน่งเสมอ เช่น ฿6.9 ต้องเขียนเป็น ฿6.90 ก่อนบวกลบ`,learn:[{heading:`Money always has two decimal places`,body:[`Prices are written in whole units and hundredths: ฿6.90, not ฿6.9. Before adding or subtracting, write every amount with two decimal places so the columns line up.`,`This is the same placeholder-zero rule from Unit 2, applied to a context you meet every day.`]},{heading:`Change, totals and unit prices`,body:[`Total cost of identical items: multiply the price by the number of items. Change: subtract the total spent from the amount handed over.`,`Unit price: divide the total cost by the number of items. Comparing unit prices is how you decide which pack is better value.`],callout:{tone:`note`,text:`Always write the final money answer with two decimal places: ฿26.5 should be written ฿26.50.`}}],examples:[{title:`Total and change`,problem:`Three notebooks cost ฿24.50 each. How much change from ฿100?`,steps:[{label:`Total cost`,detail:`24.50 × 3 = ฿73.50.`},{label:`Change`,detail:`100.00 − 73.50 = ฿26.50.`}],answer:`฿26.50`},{title:`Comparing value`,problem:`Pack A: 0.5 kg for ฿42.50. Pack B: 1 kg for ฿82. Which is better value?`,steps:[{label:`Price per kilogram, Pack A`,detail:`42.50 × 2 = ฿85 for 1 kg.`},{label:`Price per kilogram, Pack B`,detail:`฿82 for 1 kg.`},{label:`Compare`,detail:`฿82 < ฿85, so Pack B is better value.`}],answer:`Pack B`}]},{id:`u6-word-measure`,unit:6,title:`Measurement Problems`,goal:`Solve length, mass, capacity and time problems, converting units where needed.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3 applied in context`,thai:`ก่อนเปรียบเทียบหรือคำนวณ ต้องเปลี่ยนให้เป็นหน่วยเดียวกันก่อน เช่น 1 m = 100 cm, 1 kg = 1000 g, 1 L = 1000 mL`,learn:[{heading:`One unit at a time`,body:[`Measurements can only be added, subtracted or compared when they are in the same unit. Convert first, then calculate.`,`The common conversions are 1 m = 100 cm, 1 cm = 10 mm, 1 kg = 1000 g, 1 L = 1000 mL and 1 hour = 60 minutes.`]},{heading:`Converting is multiplying or dividing by a power of ten`,body:[`Going to a smaller unit means more of them, so multiply: 0.75 kg × 1000 = 750 g.`,`Going to a larger unit means fewer of them, so divide: 1450 mL ÷ 1000 = 1.45 L.`],callout:{tone:`warn`,text:`Time is the exception — hours are divided into 60 minutes, not 100. 1.75 hours is 1.75 × 60 = 105 minutes, not 175 minutes.`}}],examples:[{title:`Converting then comparing`,problem:`Which is longer, 0.7 m or 690 mm?`,steps:[{label:`Choose one unit`,detail:`Work in millimetres.`},{label:`Convert`,detail:`0.7 m = 0.7 × 1000 = 700 mm.`},{label:`Compare`,detail:`700 mm > 690 mm.`}],answer:`0.7 m is longer`},{title:`A rate problem`,problem:`A car travels 12.5 km on 1 litre. How far on 6.4 litres?`,steps:[{label:`What is happening?`,detail:`6.4 equal groups of 12.5 km, so multiply.`},{label:`Multiply the digits`,detail:`125 × 64 = 8000.`},{label:`Place the point`,detail:`1 + 1 = 2 decimal places, so 8000 ÷ 100 = 80.`}],answer:`80 km`}]},{id:`u6-word-multistep`,unit:6,title:`Multi-Step Problems`,goal:`Break a problem into steps and keep the intermediate answers exact.`,standard:`CCSS.MATH.CONTENT.6.NS.B.3 applied in context`,thai:`โจทย์หลายขั้นตอน: เขียนสิ่งที่ต้องหาทีละขั้น อย่าปัดเศษระหว่างทาง และตรวจว่าคำตอบสมเหตุสมผลกับโจทย์`,learn:[{heading:`Plan the steps before you calculate`,body:[`Write down what you need to find first, and what you need it for. "Total cost, then change" or "fuel used, then price of that fuel".`,`Each step produces a number you will use in the next one, so keep it exact — never round in the middle of a problem.`]},{heading:`Check against the story`,body:[`When you have an answer, read the problem again. Change must be less than the money handed over; the ribbon left must be less than the ribbon you started with.`,`An answer that fails this check is wrong even if the arithmetic looks tidy.`],callout:{tone:`note`,text:`Label every intermediate answer with what it means. "73.50 = cost of the notebooks" stops you subtracting the wrong number later.`}}],examples:[{title:`Two steps`,problem:`A tank holds 20 L. 4.75 L is used in the morning and 6.8 L in the evening. How much is left?`,steps:[{label:`Step 1 — water used`,detail:`4.75 + 6.80 = 11.55 L.`},{label:`Step 2 — water left`,detail:`20.00 − 11.55 = 8.45 L.`},{label:`Check`,detail:`8.45 L is less than 20 L ✓`}],answer:`8.45 L`},{title:`Three steps`,problem:`Ploy buys 2 pens at ฿15.75 and 3 erasers at ฿8.50. How much does she spend?`,steps:[{label:`Step 1 — pens`,detail:`15.75 × 2 = ฿31.50.`},{label:`Step 2 — erasers`,detail:`8.50 × 3 = ฿25.50.`},{label:`Step 3 — total`,detail:`31.50 + 25.50 = ฿57.00.`}],answer:`฿57.00`}]}],bi=new Map(yi.map(e=>[e.id,e]));function xi(e){return bi.get(e)}function Si({value:e,size:t=108}){let n=(t-9)/2,r=2*Math.PI*n,i=r*(1-Math.min(Math.max(e,0),100)/100);return(0,A.jsxs)(`div`,{className:`dg6-ring`,style:{width:t,height:t},children:[(0,A.jsxs)(`svg`,{width:t,height:t,"aria-hidden":`true`,children:[(0,A.jsx)(`circle`,{cx:t/2,cy:t/2,r:n,fill:`none`,stroke:`#f0eae2`,strokeWidth:9}),(0,A.jsx)(`circle`,{cx:t/2,cy:t/2,r:n,fill:`none`,stroke:`var(--brand)`,strokeWidth:9,strokeLinecap:`round`,strokeDasharray:r,strokeDashoffset:i,style:{transition:`stroke-dashoffset 0.5s ease`}})]}),(0,A.jsxs)(`div`,{className:`dg6-ring-label`,children:[(0,A.jsxs)(`div`,{className:`dg6-ring-value`,children:[e,`%`]}),(0,A.jsx)(`div`,{className:`dg6-ring-cap`,children:`Overall`})]})]})}function Ci({value:e,tone:t}){return(0,A.jsx)(`div`,{className:`dg6-bar`,children:(0,A.jsx)(`div`,{className:`dg6-bar-fill${t?` is-${t}`:``}`,style:{width:`${e}%`}})})}function wi({count:e,total:t=3}){return(0,A.jsx)(`span`,{className:`dg6-stars`,"aria-label":`${e} of ${t} stars`,children:Array.from({length:t},(t,n)=>(0,A.jsx)(si,{className:n<e?``:`is-off`,fill:n<e?

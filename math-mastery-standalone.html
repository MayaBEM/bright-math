ามเหลี่ยมมีฐาน 14 ซม. และสูง 6 ซม. พื้นที่ของมันคือเท่าไร`,options:[`36`,`40`,`42`,`48`,`84`],hint1:`ใช้สูตรพื้นที่สามเหลี่ยม`,hint2:`พื้นที่ = ½ × ฐาน × สูง`,quickIdea:`พื้นที่สามเหลี่ยม = ½ × ฐาน × สูง`,steps:[`พื้นที่ = ½ × 14 × 6`,`½ × 14 = 7 จากนั้น 7 × 6 = 42`],competitionTip:`ลดครึ่งฐานหรือสูงตัวที่เป็นเลขคู่ก่อนเสมอ มักทำให้ตัวเลขเล็กลงและคำนวณง่ายขึ้น`,commonMistake:`ลืม ½ คำนวณ 14 × 6 = 84 เป็นคำตอบสุดท้าย`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M4-A-08`,mockSet:4,section:`A`,questionNumber:8,marks:3,difficulty:`foundation`,topic:`Angles & Triangles`,subskill:`exterior angle theorem`,type:`mc`,en:{question:`In triangle ABC, angle A = 48° and angle B = 72°. What is the size of the EXTERIOR angle at C?`,options:[`108`,`112`,`116`,`120`,`124`],hint1:`You could find interior angle C first, then subtract from 180°.`,hint2:`There is also a shortcut: the exterior angle at any vertex equals the sum of the OTHER two interior angles.`,quickIdea:`The exterior angle theorem: an exterior angle equals the sum of the two remote (non-adjacent) interior angles.`,steps:[`Method 1: interior C = 180° − 48° − 72° = 60°, so exterior C = 180° − 60° = 120°.`,`Method 2 (shortcut): exterior C = angle A + angle B = 48° + 72° = 120°.`],competitionTip:`The exterior angle theorem shortcut saves a step — use it whenever you need an exterior angle and already know the two remote interior angles.`,commonMistake:`Computing interior angle C (60°) and forgetting to subtract from 180° to get the exterior angle.`},th:{question:`ในรูปสามเหลี่ยม ABC มุม A = 48° และมุม B = 72° มุมภายนอกที่ C มีขนาดเท่าไร`,options:[`108`,`112`,`116`,`120`,`124`],hint1:`อาจหามุมภายใน C ก่อน แล้วลบออกจาก 180°`,hint2:`มีทางลัดด้วย: มุมภายนอกที่จุดยอดใดๆ เท่ากับผลบวกของมุมภายในอีกสองมุมที่เหลือ`,quickIdea:`ทฤษฎีบทมุมภายนอก: มุมภายนอกเท่ากับผลบวกของมุมภายในสองมุมที่ไม่ติดกัน`,steps:[`วิธี1: มุมภายใน C = 180° − 48° − 72° = 60° ดังนั้นมุมภายนอก C = 180° − 60° = 120°`,`วิธี2 (ทางลัด): มุมภายนอก C = มุม A + มุม B = 48° + 72° = 120°`],competitionTip:`ทางลัดทฤษฎีบทมุมภายนอกช่วยประหยัดขั้นตอน ใช้เมื่อต้องการมุมภายนอกและรู้มุมภายในอีกสองมุมที่ไม่ติดกันแล้ว`,commonMistake:`คำนวณมุมภายใน C (60°) แล้วลืมลบออกจาก 180° เพื่อให้ได้มุมภายนอก`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M4-A-09`,mockSet:4,section:`A`,questionNumber:9,marks:3,difficulty:`foundation`,topic:`Cube & Spatial Reasoning`,subskill:`faces of a cut block`,type:`mc`,en:{question:`A cube is cut by a single straight flat cut, parallel to one of its faces, splitting it into two identical rectangular blocks. How many faces does EACH new block have?`,options:[`4`,`5`,`6`,`7`,`8`],hint1:`Think about what shape each piece is after the cut — is it still a box shape?`,hint2:`Every box shape (rectangular block), no matter its proportions, has the same number of faces.`,quickIdea:`A flat cut parallel to a face turns one box into two smaller boxes — and every box has the same number of faces.`,steps:[`Each piece is still a rectangular block (just shorter in one direction).`,`Every rectangular block has 6 faces: top, bottom, and 4 sides.`],competitionTip:`Cutting a box parallel to a face never changes the FACE COUNT of the resulting pieces — it only changes their proportions.`,commonMistake:`Counting only the "new" cut faces (2 of them, one per piece) instead of all 6 faces of each resulting block.`},th:{question:`ลูกบาศก์ถูกตัดด้วยรอยตัดแบนตรงหนึ่งรอย ขนานกับหน้าหนึ่ง แบ่งเป็นบล็อกสี่เหลี่ยมเหมือนกันสองชิ้น แต่ละบล็อกใหม่มีกี่หน้า`,options:[`4`,`5`,`6`,`7`,`8`],hint1:`ลองคิดดูว่าแต่ละชิ้นหลังตัดเป็นรูปทรงอะไร ยังเป็นรูปกล่องอยู่หรือไม่`,hint2:`รูปกล่องใดๆ (บล็อกสี่เหลี่ยม) ไม่ว่าสัดส่วนจะเป็นอย่างไร มีจำนวนหน้าเท่ากันเสมอ`,quickIdea:`รอยตัดแบนขนานกับหน้าเปลี่ยนกล่องหนึ่งเป็นกล่องเล็กสองกล่อง และกล่องทุกใบมีจำนวนหน้าเท่ากัน`,steps:[`แต่ละชิ้นยังเป็นบล็อกสี่เหลี่ยม (เพียงแค่สั้นลงในทิศทางเดียว)`,`บล็อกสี่เหลี่ยมทุกอันมี 6 หน้า: บน ล่าง และด้านข้าง 4 หน้า`],competitionTip:`การตัดกล่องขนานกับหน้าไม่เปลี่ยนจำนวนหน้าของชิ้นที่ได้เลย เปลี่ยนแค่สัดส่วนเท่านั้น`,commonMistake:`นับเฉพาะหน้าที่เกิดจากรอยตัดใหม่ (2 หน้า หน้าละชิ้น) แทนที่จะนับทั้ง 6 หน้าของแต่ละบล็อกที่ได้`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M4-A-10`,mockSet:4,section:`A`,questionNumber:10,marks:3,difficulty:`foundation`,topic:`Visual Patterns`,subskill:`3×3 shape matrix (fill by row, shape by column)`,type:`mc`,en:{question:`Look at the pattern in the grid. Each ROW uses the same fill (solid, then striped, then outline), and the SHAPE changes across each row in the same order: circle, square, triangle. What belongs in the missing cell?`,options:[`outline triangle`,`outline square`,`striped triangle`,`solid triangle`,`outline circle`],hint1:`First figure out the fill rule (how fill changes row to row).`,hint2:`Then figure out the shape rule (how shape changes column to column).`,quickIdea:`Check the row rule and the column rule separately, then combine them for the missing cell.`,steps:[`Row rule (fill): row 1 is solid, row 2 is striped, row 3 is outline.`,`Column rule (shape): column 1 is circle, column 2 is square, column 3 is triangle.`,`The missing cell is row 3 (outline), column 3 (triangle) — so it must be an outline triangle.`],competitionTip:`When a grid mixes two rules, check whether each rule runs by ROW or by COLUMN before combining them for the missing cell.`,commonMistake:`Mixing up which rule (fill or shape) runs by row and which runs by column.`},th:{question:`สังเกตรูปแบบในตาราง แต่ละแถวใช้ลวดลายเดียวกัน (ทึบ แล้วลายเส้น แล้วเส้นขอบ) และรูปทรงเปลี่ยนไปในแต่ละแถวตามลำดับเดียวกัน: วงกลม สี่เหลี่ยม สามเหลี่ยม ช่องที่หายไปควรเป็นอะไร`,options:[`สามเหลี่ยมเส้นขอบ`,`สี่เหลี่ยมเส้นขอบ`,`สามเหลี่ยมลายเส้น`,`สามเหลี่ยมทึบ`,`วงกลมเส้นขอบ`],hint1:`หากฎลวดลายก่อน (ลวดลายเปลี่ยนอย่างไรระหว่างแถว)`,hint2:`จากนั้นหากฎรูปทรง (รูปทรงเปลี่ยนอย่างไรระหว่างคอลัมน์)`,quickIdea:`ตรวจกฎแถวและกฎคอลัมน์แยกกัน แล้วนำมารวมกันสำหรับช่องที่หายไป`,steps:[`กฎแถว (ลวดลาย): แถว1 ทึบ แถว2 ลายเส้น แถว3 เส้นขอบ`,`กฎคอลัมน์ (รูปทรง): คอลัมน์1 วงกลม คอลัมน์2 สี่เหลี่ยม คอลัมน์3 สามเหลี่ยม`,`ช่องที่หายไปอยู่แถว3 (เส้นขอบ) คอลัมน์3 (สามเหลี่ยม) จึงต้องเป็นสามเหลี่ยมเส้นขอบ`],competitionTip:`เมื่อตารางผสมสองกฎ ตรวจว่าแต่ละกฎวิ่งตามแถวหรือคอลัมน์ก่อนนำมารวมกันสำหรับช่องที่หายไป`,commonMistake:`สลับกันว่ากฎใด (ลวดลายหรือรูปทรง) วิ่งตามแถว และกฎใดวิ่งตามคอลัมน์`},correctAnswer:`A`,diagram:{kind:`shape-matrix`,props:{cells:[{shape:`circle`,fill:`solid`},{shape:`square`,fill:`solid`},{shape:`triangle`,fill:`solid`},{shape:`circle`,fill:`striped`},{shape:`square`,fill:`striped`},{shape:`triangle`,fill:`striped`},{shape:`circle`,fill:`outline`},{shape:`square`,fill:`outline`},{shape:null,fill:`outline`}]}},verificationStatus:`verified`},{id:`M4-B-11`,mockSet:4,section:`B`,questionNumber:11,marks:4,difficulty:`competition`,topic:`Number Patterns`,subskill:`geometric (doubling) sequence`,type:`mc`,en:{question:`In the sequence 3, 6, 12, 24, 48, ..., each term is double the previous term. What is the 10th term?`,options:[`768`,`1536`,`1024`,`3072`,`1280`],hint1:`Write the rule as term_n = 3 × 2^(n−1).`,hint2:`Substitute n = 10 into the rule.`,quickIdea:`A doubling sequence has the form (first term) × 2^(position − 1).`,steps:[`term_n = 3 × 2^(n−1).`,`term_10 = 3 × 2^9.`,`2^9 = 512, so term_10 = 3 × 512 = 1536.`],competitionTip:`For doubling/tripling sequences, always use the exponent formula rather than doubling term by term ten times — it is much faster and less error-prone.`,commonMistake:`Using 2^10 instead of 2^9 (an off-by-one error in the exponent).`},th:{question:`ในลำดับ 3, 6, 12, 24, 48, ... แต่ละพจน์เป็นสองเท่าของพจน์ก่อนหน้า พจน์ที่ 10 คือเท่าไร`,options:[`768`,`1536`,`1024`,`3072`,`1280`],hint1:`เขียนกฎเป็น พจน์ที่n = 3 × 2^(n−1)`,hint2:`แทน n = 10 ลงในกฎ`,quickIdea:`ลำดับที่เพิ่มเป็นสองเท่ามีรูปแบบ (พจน์แรก) × 2^(ตำแหน่ง−1)`,steps:[`พจน์ที่n = 3 × 2^(n−1)`,`พจน์ที่10 = 3 × 2^9`,`2^9 = 512 ดังนั้นพจน์ที่10 = 3 × 512 = 1536`],competitionTip:`สำหรับลำดับที่เพิ่มเป็นสอง/สามเท่า ใช้สูตรเลขชี้กำลังแทนการเพิ่มเป็นสองเท่าทีละพจน์สิบครั้ง เร็วกว่าและผิดพลาดน้อยกว่า`,commonMistake:`ใช้ 2^10 แทน 2^9 (ข้อผิดพลาดเลื่อนหนึ่งตำแหน่งในเลขชี้กำลัง)`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M4-B-12`,mockSet:4,section:`B`,questionNumber:12,marks:4,difficulty:`competition`,topic:`Remainders`,subskill:`three simultaneous remainder conditions`,type:`mc`,en:{question:`A number between 30 and 50 leaves remainder 2 when divided by 3, remainder 3 when divided by 5, and remainder 2 when divided by 4. What is the number?`,options:[`32`,`35`,`41`,`44`,`38`],hint1:`Start with the strictest condition (the one with the fewest candidates in this range) and test each candidate against the others.`,hint2:`Numbers leaving remainder 2 when divided by 4, between 30 and 50: 34, 38, 42, 46 — check each against the other two conditions.`,quickIdea:`When several remainder conditions apply at once, list candidates for one condition and test each against the rest.`,steps:[`Candidates with remainder 2 mod 4 in range: 34, 38, 42, 46.`,`Check remainder 2 mod 3: 34→1(no), 38→2(yes), 42→0(no), 46→1(no). Only 38 survives.`,`Check 38 against remainder 3 mod 5: 38 = 35+3, remainder 3. ✓`,`So the number is 38.`],competitionTip:`With three conditions, testing the shortest candidate list against the other two is faster than solving all three algebraically.`,commonMistake:`Stopping after satisfying only one or two of the three conditions instead of checking all three.`},th:{question:`จำนวนหนึ่งระหว่าง 30 กับ 50 หาร 3 เหลือเศษ 2, หาร 5 เหลือเศษ 3, และหาร 4 เหลือเศษ 2 จำนวนนั้นคือเท่าไร`,options:[`32`,`35`,`41`,`44`,`38`],hint1:`เริ่มจากเงื่อนไขที่มีตัวเลือกน้อยที่สุดในช่วงนี้ก่อน แล้วตรวจแต่ละตัวกับเงื่อนไขอื่น`,hint2:`เลขที่หาร 4 เหลือเศษ 2 ระหว่าง 30 กับ 50: 34, 38, 42, 46 ตรวจแต่ละตัวกับอีกสองเงื่อนไข`,quickIdea:`เมื่อมีเงื่อนไขเศษเหลือหลายข้อพร้อมกัน ให้ไล่รายการจากเงื่อนไขหนึ่งแล้วตรวจกับที่เหลือ`,steps:[`ตัวเลือกที่หาร4เหลือเศษ2 ในช่วง: 34, 38, 42, 46`,`ตรวจหาร3เหลือเศษ2: 34→1(ไม่ใช่), 38→2(ใช่), 42→0(ไม่ใช่), 46→1(ไม่ใช่) เหลือเพียง 38`,`ตรวจ 38 กับหาร5เหลือเศษ3: 38 = 35+3 เศษ3 ✓`,`ดังนั้นจำนวนคือ 38`],competitionTip:`เมื่อมีสามเงื่อนไข การทดสอบรายการที่สั้นที่สุดกับอีกสองเงื่อนไขเร็วกว่าการแก้สมการทั้งสามข้อ`,commonMistake:`หยุดหลังจากผ่านเพียงหนึ่งหรือสองเงื่อนไขจากสามข้อ แทนที่จะตรวจทั้งสามข้อ`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M4-B-13`,mockSet:4,section:`B`,questionNumber:13,marks:4,difficulty:`competition`,topic:`Speed, Distance & Time`,subskill:`delayed start, opposite directions`,type:`mc`,en:{question:`At 9:00 am, a train leaves Station P heading toward Station Q at 80 km/h, along a straight 300 km route. At 9:45 am, another train leaves Station Q heading toward Station P at 100 km/h. At what time do the two trains meet?`,options:[`11:05 am`,`10:45 am`,`11:00 am`,`11:15 am`,`11:20 am`],hint1:`First find how far the first train has travelled by 9:45 am, when the second train starts.`,hint2:`From 9:45 am onward, the gap between the trains closes at their COMBINED speed.`,quickIdea:`Find the head-start distance, then divide the remaining gap by the combined closing speed.`,steps:[`By 9:45 am (0.75 h after 9:00), the first train has travelled 80 × 0.75 = 60 km.`,`Remaining gap at 9:45 am = 300 − 60 = 240 km.`,`Combined speed from 9:45 am onward = 80 + 100 = 180 km/h.`,`Time to close the gap = 240 ÷ 180 = 4/3 hours = 1 hour 20 minutes.`,`Meeting time = 9:45 am + 1:20 = 11:05 am.`],competitionTip:`Draw a simple timeline marking both start times — it prevents applying the combined speed too early (before both trains are moving).`,commonMistake:`Using the combined speed for the FULL 300 km instead of only the 240 km remaining after the head start.`},th:{question:`เวลา 9:00 น. รถไฟออกจากสถานี P มุ่งหน้าสถานี Q ด้วยความเร็ว 80 กม./ชม. ตามเส้นทางตรง 300 กม. เวลา 9:45 น. รถไฟอีกขบวนออกจากสถานี Q มุ่งหน้าสถานี P ด้วยความเร็ว 100 กม./ชม. รถไฟทั้งสองขบวนจะพบกันเวลาใด`,options:[`11:05 น.`,`10:45 น.`,`11:00 น.`,`11:15 น.`,`11:20 น.`],hint1:`หาก่อนว่ารถไฟขบวนแรกเดินทางไปได้ไกลแค่ไหนเมื่อถึง 9:45 น. ตอนที่ขบวนที่สองเริ่มออก`,hint2:`ตั้งแต่ 9:45 น. เป็นต้นไป ระยะห่างระหว่างรถไฟจะปิดลงด้วยความเร็วรวมของทั้งสอง`,quickIdea:`หาระยะที่นำหน้าก่อน แล้วนำระยะห่างที่เหลือไปหารด้วยความเร็วรวมที่ปิดระยะ`,steps:[`เมื่อถึง 9:45 น. (0.75 ชม.หลัง9:00) ขบวนแรกเดินทางไปแล้ว 80 × 0.75 = 60 กม.`,`ระยะห่างที่เหลือตอน 9:45 น. = 300 − 60 = 240 กม.`,`ความเร็วรวมตั้งแต่ 9:45 น. = 80 + 100 = 180 กม./ชม.`,`เวลาที่ใช้ปิดระยะ = 240 ÷ 180 = 4/3 ชม. = 1 ชม. 20 นาที`,`เวลาที่พบกัน = 9:45 น. + 1:20 = 11:05 น.`],competitionTip:`วาดเส้นเวลาแสดงเวลาเริ่มของทั้งสองขบวน ช่วยไม่ให้ใช้ความเร็วรวมเร็วเกินไป (ก่อนที่รถไฟทั้งคู่จะเคลื่อนที่)`,commonMistake:`ใช้ความเร็วรวมกับระยะทางเต็ม 300 กม. แทนที่จะใช้เพียง 240 กม. ที่เหลือหลังระยะนำหน้า`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M4-B-14`,mockSet:4,section:`B`,questionNumber:14,marks:4,difficulty:`competition`,topic:`Word Problems`,subskill:`common remainder from two divisors (LCM)`,type:`mc`,en:{question:`A shopkeeper has between 100 and 150 eggs. When packed into boxes of 12, there are 7 eggs left over. When packed into boxes of 18, there are also 7 eggs left over. How many eggs does the shopkeeper have?`,options:[`109`,`112`,`118`,`115`,`121`],hint1:`If both groupings leave the SAME remainder, then (the number − that remainder) must divide evenly by both 12 and 18.`,hint2:`Find the LCM of 12 and 18, then look for a value of the right form in the given range.`,quickIdea:`A shared remainder across two divisors means the number, minus that remainder, is a common multiple of both divisors.`,steps:[`Since both groupings leave remainder 7, the number minus 7 is divisible by both 12 and 18.`,`LCM(12, 18) = 36.`,`So the number has the form 36k + 7. Between 100 and 150: 36×3+7 = 115 (36×2+7=79 too small, 36×4+7=151 too big).`,`The number is 115.`],competitionTip:`A "same remainder from two different divisors" clue is a strong signal to find the LCM of those divisors.`,commonMistake:`Using the HCF of 12 and 18 (which is 6) instead of the LCM (36).`},th:{question:`ร้านค้ามีไข่ระหว่าง 100 ถึง 150 ฟอง เมื่อบรรจุกล่องละ 12 ฟอง เหลือ 7 ฟอง เมื่อบรรจุกล่องละ 18 ฟอง ก็เหลือ 7 ฟองเช่นกัน ร้านค้ามีไข่กี่ฟอง`,options:[`109`,`112`,`118`,`115`,`121`],hint1:`ถ้าทั้งสองการบรรจุเหลือเศษเท่ากัน แสดงว่า (จำนวนไข่ − เศษนั้น) ต้องหารด้วยทั้ง 12 และ 18 ลงตัว`,hint2:`หา ค.ร.น. ของ 12 และ 18 แล้วหาค่าที่มีรูปแบบถูกต้องในช่วงที่กำหนด`,quickIdea:`เศษที่เท่ากันจากตัวหารสองตัว หมายความว่าจำนวนนั้นลบเศษ เป็นตัวคูณร่วมของตัวหารทั้งสอง`,steps:[`เนื่องจากทั้งสองการบรรจุเหลือเศษ 7 จำนวนไข่ลบ 7 ต้องหารด้วย 12 และ 18 ลงตัว`,`ค.ร.น.(12, 18) = 36`,`ดังนั้นจำนวนไข่มีรูปแบบ 36k + 7 ระหว่าง 100 ถึง 150: 36×3+7 = 115 (36×2+7=79 น้อยไป, 36×4+7=151 มากไป)`,`จำนวนไข่คือ 115`],competitionTip:`เงื่อนไข "เศษเท่ากันจากตัวหารสองตัว" เป็นสัญญาณที่ชัดเจนให้หา ค.ร.น. ของตัวหารเหล่านั้น`,commonMistake:`ใช้ HCF ของ 12 และ 18 (ซึ่งคือ 6) แทนที่จะเป็น ค.ร.น. (36)`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M4-B-15`,mockSet:4,section:`B`,questionNumber:15,marks:4,difficulty:`competition`,topic:`Area`,subskill:`union of two overlapping squares`,type:`mc`,en:{question:`A square of side 9 cm overlaps a square of side 6 cm so that the overlapping region is a rectangle 4 cm by 3 cm. What is the total area covered by the two squares (counting the overlap only once)?`,options:[`93`,`99`,`105`,`111`,`117`],hint1:`Find the area of each square separately, then the area of the overlap.`,hint2:`Total = Area(square 1) + Area(square 2) − Area(overlap).`,quickIdea:`Total covered area = Area(A) + Area(B) − Area(overlap), the same rule as for any two overlapping regions.`,steps:[`Area of the 9 cm square = 81 cm². Area of the 6 cm square = 36 cm².`,`Overlap area = 4 × 3 = 12 cm².`,`Total = 81 + 36 − 12 = 105 cm².`],competitionTip:`This overlap formula works the same whether the two shapes are the same type (square/square) or different (rectangle/square, etc).`,commonMistake:`Adding 81 + 36 = 117 without subtracting the overlap.`},th:{question:`สี่เหลี่ยมจัตุรัสด้าน 9 ซม. ทับซ้อนกับสี่เหลี่ยมจัตุรัสด้าน 6 ซม. โดยบริเวณทับซ้อนเป็นสี่เหลี่ยมขนาด 4 ซม. × 3 ซม. พื้นที่รวมที่ถูกครอบคลุมโดยสี่เหลี่ยมทั้งสอง (นับส่วนทับซ้อนเพียงครั้งเดียว) คือเท่าไร`,options:[`93`,`99`,`105`,`111`,`117`],hint1:`หาพื้นที่สี่เหลี่ยมแต่ละรูปแยกกันก่อน แล้วหาพื้นที่ส่วนทับซ้อน`,hint2:`พื้นที่รวม = พื้นที่(รูป1) + พื้นที่(รูป2) − พื้นที่ส่วนทับซ้อน`,quickIdea:`พื้นที่รวมที่ถูกครอบคลุม = พื้นที่(A) + พื้นที่(B) − พื้นที่ส่วนทับซ้อน เป็นกฎเดียวกับบริเวณทับซ้อนใดๆ`,steps:[`พื้นที่สี่เหลี่ยม 9 ซม. = 81 ตร.ซม. พื้นที่สี่เหลี่ยม 6 ซม. = 36 ตร.ซม.`,`พื้นที่ส่วนทับซ้อน = 4 × 3 = 12 ตร.ซม.`,`รวม = 81 + 36 − 12 = 105 ตร.ซม.`],competitionTip:`สูตรทับซ้อนนี้ใช้ได้เหมือนกันไม่ว่ารูปทั้งสองจะเป็นชนิดเดียวกัน (จัตุรัส/จัตุรัส) หรือต่างกัน (ผืนผ้า/จัตุรัส ฯลฯ)`,commonMistake:`บวก 81 + 36 = 117 โดยไม่ลบส่วนทับซ้อนออก`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M4-B-16`,mockSet:4,section:`B`,questionNumber:16,marks:4,difficulty:`competition`,topic:`Perimeter`,subskill:`comparing perimeters of equal-area rectangles`,type:`mc`,en:{question:`Two different rectangles both have an area of 36 cm². Rectangle X measures 4 cm by 9 cm. Rectangle Y measures 6 cm by 6 cm. What is the SMALLER of the two perimeters?`,options:[`20`,`22`,`24`,`26`,`28`],hint1:`Find both perimeters separately, then compare.`,hint2:`A shape closer to a square tends to have a smaller perimeter for the same area.`,quickIdea:`For a fixed area, the shape closest to a square has the smallest perimeter.`,steps:[`Perimeter of X = 2 × (4 + 9) = 26 cm.`,`Perimeter of Y = 2 × (6 + 6) = 24 cm.`,`The smaller perimeter is 24 cm (Rectangle Y, the one closer to a square).`],competitionTip:`This is a useful invariant: among all rectangles with a given area, the square always has the least perimeter.`,commonMistake:`Assuming the more "stretched out" rectangle automatically has the smaller perimeter, without actually computing both.`},th:{question:`สี่เหลี่ยมผืนผ้าสองรูปต่างกันมีพื้นที่ 36 ตร.ซม. เท่ากัน รูป X ขนาด 4 ซม. × 9 ซม. รูป Y ขนาด 6 ซม. × 6 ซม. เส้นรอบรูปที่เล็กกว่าของทั้งสองคือเท่าไร`,options:[`20`,`22`,`24`,`26`,`28`],hint1:`หาเส้นรอบรูปทั้งสองแยกกันก่อน แล้วเปรียบเทียบ`,hint2:`รูปที่ใกล้เคียงสี่เหลี่ยมจัตุรัสมากกว่ามักมีเส้นรอบรูปเล็กกว่าสำหรับพื้นที่เท่ากัน`,quickIdea:`สำหรับพื้นที่คงที่ รูปที่ใกล้เคียงสี่เหลี่ยมจัตุรัสที่สุดจะมีเส้นรอบรูปเล็กที่สุด`,steps:[`เส้นรอบรูป X = 2 × (4 + 9) = 26 ซม.`,`เส้นรอบรูป Y = 2 × (6 + 6) = 24 ซม.`,`เส้นรอบรูปที่เล็กกว่าคือ 24 ซม. (รูป Y ซึ่งใกล้เคียงสี่เหลี่ยมจัตุรัสมากกว่า)`],competitionTip:`นี่เป็นข้อเท็จจริงที่มีประโยชน์: ในบรรดาสี่เหลี่ยมผืนผ้าทั้งหมดที่มีพื้นที่กำหนด สี่เหลี่ยมจัตุรัสจะมีเส้นรอบรูปน้อยที่สุดเสมอ`,commonMistake:`สมมติว่ารูปที่ "ยืดออก" มากกว่าต้องมีเส้นรอบรูปเล็กกว่าโดยอัตโนมัติ โดยไม่คำนวณทั้งสองจริงๆ`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M4-B-17`,mockSet:4,section:`B`,questionNumber:17,marks:4,difficulty:`competition`,topic:`Counting Shapes`,subskill:`counting squares in a non-square grid`,type:`mc`,en:{question:`How many squares of ALL sizes are there in a grid that is 3 rows by 5 columns of unit squares?`,options:[`20`,`23`,`26`,`29`,`32`],hint1:`Count by size: how many 1×1 squares fit? How many 2×2? How many 3×3?`,hint2:`For a k×k square in a 3-row, 5-column grid, count positions as (3−k+1) × (5−k+1).`,quickIdea:`For a non-square grid, count each size using (rows−k+1) × (columns−k+1), since the row and column limits differ.`,steps:[`1×1 squares: (3−1+1) × (5−1+1) = 3 × 5 = 15.`,`2×2 squares: (3−2+1) × (5−2+1) = 2 × 4 = 8.`,`3×3 squares: (3−3+1) × (5−3+1) = 1 × 3 = 3. (No 4×4 or larger fits, since the grid is only 3 rows tall.)`,`Total = 15 + 8 + 3 = 26.`],competitionTip:`In a non-square grid, the largest square size is limited by the SHORTER dimension — here, no square bigger than 3×3 can fit.`,commonMistake:`Using the same formula as a square grid, (n−k+1)², which only works when rows and columns are equal.`},th:{question:`มีสี่เหลี่ยมจัตุรัสทุกขนาดกี่รูป ในตารางสี่เหลี่ยมหน่วยขนาด 3 แถว 5 คอลัมน์`,options:[`20`,`23`,`26`,`29`,`32`],hint1:`นับตามขนาด: สี่เหลี่ยม 1×1 มีกี่รูป, 2×2 มีกี่รูป, 3×3 มีกี่รูป`,hint2:`สำหรับสี่เหลี่ยมขนาด k×k ในตาราง 3 แถว 5 คอลัมน์ นับตำแหน่งเป็น (3−k+1) × (5−k+1)`,quickIdea:`สำหรับตารางที่ไม่ใช่จัตุรัส นับแต่ละขนาดด้วย (แถว−k+1) × (คอลัมน์−k+1) เพราะขีดจำกัดแถวและคอลัมน์ต่างกัน`,steps:[`สี่เหลี่ยม 1×1: (3−1+1) × (5−1+1) = 3 × 5 = 15`,`สี่เหลี่ยม 2×2: (3−2+1) × (5−2+1) = 2 × 4 = 8`,`สี่เหลี่ยม 3×3: (3−3+1) × (5−3+1) = 1 × 3 = 3 (ไม่มี 4×4 หรือใหญ่กว่า เพราะตารางสูงเพียง 3 แถว)`,`รวม = 15 + 8 + 3 = 26`],competitionTip:`ในตารางที่ไม่ใช่จัตุรัส ขนาดสี่เหลี่ยมที่ใหญ่ที่สุดถูกจำกัดด้วยมิติที่ "สั้นกว่า" ที่นี่ไม่มีสี่เหลี่ยมใหญ่กว่า 3×3 พอดี`,commonMistake:`ใช้สูตรเดียวกับตารางจัตุรัส (n−k+1)² ซึ่งใช้ได้เฉพาะเมื่อแถวและคอลัมน์เท่ากัน`},correctAnswer:`E`,diagram:{kind:`grid-path`,props:{cols:5,rows:3}},verificationStatus:`verified`},{id:`M4-B-18`,mockSet:4,section:`B`,questionNumber:18,marks:4,difficulty:`competition`,topic:`Angles & Triangles`,subskill:`sum of interior angles of a polygon`,type:`mc`,en:{question:`What is the sum of the interior angles of a hexagon (a 6-sided polygon)?`,options:[`720`,`540`,`600`,`660`,`900`],hint1:`There is a formula connecting the number of sides of a polygon to its angle sum.`,hint2:`The formula is (number of sides − 2) × 180°.`,quickIdea:`The interior angle sum of an n-sided polygon is (n − 2) × 180°.`,steps:[`n = 6 sides.`,`(6 − 2) × 180° = 4 × 180° = 720°.`],competitionTip:`You can derive this formula by splitting any polygon into triangles from one vertex — an n-sided polygon always splits into (n−2) triangles.`,commonMistake:`Using n × 180° instead of (n−2) × 180°, forgetting to subtract 2.`},th:{question:`ผลรวมมุมภายในของหกเหลี่ยม (รูปหลายเหลี่ยม 6 ด้าน) คือเท่าไร`,options:[`720`,`540`,`600`,`660`,`900`],hint1:`มีสูตรเชื่อมโยงจำนวนด้านของรูปหลายเหลี่ยมกับผลรวมมุม`,hint2:`สูตรคือ (จำนวนด้าน − 2) × 180°`,quickIdea:`ผลรวมมุมภายในของรูปหลายเหลี่ยม n ด้าน คือ (n − 2) × 180°`,steps:[`n = 6 ด้าน`,`(6 − 2) × 180° = 4 × 180° = 720°`],competitionTip:`สามารถพิสูจน์สูตรนี้ได้โดยแบ่งรูปหลายเหลี่ยมใดๆ เป็นสามเหลี่ยมจากจุดยอดเดียว รูปหลายเหลี่ยม n ด้านแบ่งได้เป็น (n−2) สามเหลี่ยมเสมอ`,commonMistake:`ใช้ n × 180° แทนที่จะเป็น (n−2) × 180° ลืมลบ 2`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M4-B-19`,mockSet:4,section:`B`,questionNumber:19,marks:4,difficulty:`competition`,topic:`Cube & Spatial Reasoning`,subskill:`deducing the hidden face from three rotated views`,type:`mc`,en:{question:`A cube has six different colors on its faces: Red, Blue, Green, Yellow, White, and Black. Three views of the same cube are shown, and between views the cube was simply spun around the vertical axis (Red always stays on top): View 1 — top Red, front Blue, right Green. View 2 — top Red, front Green, right Yellow. View 3 — top Red, front Yellow, right White. Which color is on the BOTTOM face (opposite Red)?`,options:[`Blue`,`Green`,`Yellow`,`Black`,`White`],hint1:`Since the cube only spins around the vertical axis, the top and bottom colors never change — only the four side colors rotate through the front/right/back/left positions.`,hint2:`List every color that appears in a front or right position across all three views — one color will never appear.`,quickIdea:`The four side positions must show exactly 4 distinct colors across enough views — whichever color never appears must be on the bottom.`,steps:[`Side colors seen (front or right) across the three views: Blue, Green, Green, Yellow, Yellow, White.`,`Distinct side colors observed: Blue, Green, Yellow, White — exactly 4, matching the 4 side positions.`,`Colors accounted for: Red (top) + Blue, Green, Yellow, White (sides) = 5 of the 6 colors.`,`The only unseen color, Black, must be on the bottom (opposite Red).`],competitionTip:`When a cube only spins around one axis across several views, the top and bottom are "frozen" — focus on which colors appear in the rotating side positions, and whichever is missing is opposite the frozen top color.`,commonMistake:`Trying to track the cube’s orientation in 3D space instead of simply listing which colors have and have not appeared in a side position.`},th:{question:`ลูกบาศก์มีสีที่แตกต่างกัน 6 สีบนแต่ละหน้า: แดง น้ำเงิน เขียว เหลือง ขาว และดำ มีสามภาพของลูกบาศก์เดียวกัน โดยระหว่างภาพลูกบาศก์เพียงหมุนรอบแกนตั้ง (แดงอยู่บนเสมอ): ภาพ1 — บนแดง หน้าน้ำเงิน ขวาเขียว ภาพ2 — บนแดง หน้าเขียว ขวาเหลือง ภาพ3 — บนแดง หน้าเหลือง ขวาขาว สีใดอยู่ด้านล่าง (ตรงข้ามแดง)`,options:[`น้ำเงิน`,`เขียว`,`เหลือง`,`ดำ`,`ขาว`],hint1:`เนื่องจากลูกบาศก์หมุนรอบแกนตั้งเท่านั้น สีบนและล่างไม่เปลี่ยนเลย มีเพียงสีด้านข้างสี่สีที่หมุนผ่านตำแหน่งหน้า/ขวา/หลัง/ซ้าย`,hint2:`ลิสต์ทุกสีที่ปรากฏในตำแหน่งหน้าหรือขวาตลอดทั้งสามภาพ จะมีสีหนึ่งที่ไม่เคยปรากฏเลย`,quickIdea:`ตำแหน่งด้านข้างทั้งสี่ต้องแสดงสีที่แตกต่างกัน 4 สีพอดีเมื่อดูหลายภาพพอ สีที่ไม่เคยปรากฏต้องอยู่ด้านล่าง`,steps:[`สีด้านข้างที่เห็น (หน้าหรือขวา) ตลอดสามภาพ: น้ำเงิน เขียว เขียว เหลือง เหลือง ขาว`,`สีด้านข้างที่แตกต่างกันที่พบ: น้ำเงิน เขียว เหลือง ขาว ครบ 4 สีพอดี ตรงกับตำแหน่งด้านข้าง 4 ตำแหน่ง`,`สีที่นับได้แล้ว: แดง (บน) + น้ำเงิน เขียว เหลือง ขาว (ด้านข้าง) = 5 จาก 6 สี`,`สีที่ไม่เคยปรากฏเลยคือดำ ต้องอยู่ด้านล่าง (ตรงข้ามแดง)`],competitionTip:`เมื่อลูกบาศก์หมุนรอบแกนเดียวตลอดหลายภาพ สีบนและล่าง "ไม่เปลี่ยน" ให้สนใจว่าสีใดปรากฏในตำแหน่งด้านข้างที่หมุน สีที่ขาดหายไปคือสีตรงข้ามกับสีบนที่ตรึงอยู่`,commonMistake:`พยายามติดตามทิศทางของลูกบาศก์ในปริภูมิ 3 มิติ แทนที่จะลิสต์ง่ายๆ ว่าสีใดปรากฏและไม่ปรากฏในตำแหน่งด้านข้างบ้าง`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M4-B-20`,mockSet:4,section:`B`,questionNumber:20,marks:4,difficulty:`competition`,topic:`Logic & Elimination`,subskill:`set overlap (inclusion-exclusion)`,type:`mc`,en:{question:`In a group of 30 students, every student plays at least one of chess or checkers. 22 students play chess, and 15 students play checkers. How many students play BOTH games?`,options:[`5`,`9`,`7`,`11`,`13`],hint1:`If you simply add the chess players and checkers players, students who play both get counted twice.`,hint2:`Total = (chess) + (checkers) − (both), since "every student plays at least one" means there is no one left uncounted.`,quickIdea:`When two groups overlap and everyone belongs to at least one, use Total = A + B − Both.`,steps:[`30 = 22 + 15 − Both.`,`30 = 37 − Both.`,`Both = 37 − 30 = 7.`],competitionTip:`This is the same "add both, subtract the overlap" idea used for overlapping areas — it works for counting people, shapes, or anything grouped into overlapping sets.`,commonMistake:`Adding 22 + 15 = 37 and treating that as the number who play chess OR checkers, without accounting for the double-counted overlap.`},th:{question:`ในกลุ่มนักเรียน 30 คน ทุกคนเล่นหมากรุกหรือหมากฮอสอย่างน้อยหนึ่งอย่าง มี 22 คนเล่นหมากรุก และ 15 คนเล่นหมากฮอส มีนักเรียนกี่คนที่เล่นทั้งสองอย่าง`,options:[`5`,`9`,`7`,`11`,`13`],hint1:`ถ้าบวกจำนวนคนเล่นหมากรุกกับหมากฮอสตรงๆ คนที่เล่นทั้งสองอย่างจะถูกนับซ้ำสองครั้ง`,hint2:`ผลรวม = (หมากรุก) + (หมากฮอส) − (ทั้งสองอย่าง) เพราะ "ทุกคนเล่นอย่างน้อยหนึ่งอย่าง" หมายความไม่มีใครตกหล่น`,quickIdea:`เมื่อสองกลุ่มทับซ้อนกันและทุกคนอยู่ในอย่างน้อยหนึ่งกลุ่ม ใช้ ผลรวม = A + B − ทั้งสอง`,steps:[`30 = 22 + 15 − ทั้งสอง`,`30 = 37 − ทั้งสอง`,`ทั้งสอง = 37 − 30 = 7`],competitionTip:`นี่คือแนวคิด "บวกทั้งสอง ลบส่วนทับซ้อน" เดียวกับพื้นที่ทับซ้อน ใช้ได้กับการนับคน รูปทรง หรือสิ่งใดๆ ที่จัดกลุ่มทับซ้อนกัน`,commonMistake:`บวก 22 + 15 = 37 แล้วถือว่าเป็นจำนวนคนที่เล่นหมากรุกหรือหมากฮอส โดยไม่คำนึงถึงส่วนทับซ้อนที่นับซ้ำ`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M4-C-21`,mockSet:4,section:`C`,questionNumber:21,marks:6,difficulty:`challenge`,topic:`Custom Operations`,subskill:`custom operation involving division`,type:`free-response`,en:{question:`For any two positive numbers a and b with a ≠ b, define a ⊕ b = (a + b) ÷ (a − b). Find the value of 7 ⊕ 3. (Enter your answer as a decimal.)`,hint1:`Substitute a = 7 and b = 3 directly into the definition.`,hint2:`Compute the top (a+b) and bottom (a−b) separately before dividing.`,quickIdea:`Translate the symbol into ordinary arithmetic using the definition, computing numerator and denominator separately.`,steps:[`a + b = 7 + 3 = 10.`,`a − b = 7 − 3 = 4.`,`7 ⊕ 3 = 10 ÷ 4 = 2.5.`],competitionTip:`When a custom operation produces a fraction, simplify or convert to a decimal carefully — check whether the question wants a fraction or a decimal.`,commonMistake:`Computing (a−b) ÷ (a+b) instead of (a+b) ÷ (a−b) — reading the definition in the wrong order.`},th:{question:`สำหรับจำนวนบวกสองจำนวน a และ b ที่ a ≠ b ใดๆ กำหนดให้ a ⊕ b = (a + b) ÷ (a − b) จงหาค่าของ 7 ⊕ 3 (ตอบเป็นทศนิยม)`,hint1:`แทน a = 7 และ b = 3 ลงในนิยามโดยตรง`,hint2:`คำนวณตัวเศษ (a+b) และตัวส่วน (a−b) แยกกันก่อนหาร`,quickIdea:`แปลงสัญลักษณ์เป็นเลขคณิตปกติตามนิยาม คำนวณเศษและส่วนแยกกัน`,steps:[`a + b = 7 + 3 = 10`,`a − b = 7 − 3 = 4`,`7 ⊕ 3 = 10 ÷ 4 = 2.5`],competitionTip:`เมื่อการดำเนินการที่คิดขึ้นให้ผลเป็นเศษส่วน ให้ลดรูปหรือแปลงเป็นทศนิยมอย่างระมัดระวัง ตรวจว่าโจทย์ต้องการเศษส่วนหรือทศนิยม`,commonMistake:`คำนวณ (a−b) ÷ (a+b) แทนที่จะเป็น (a+b) ÷ (a−b) อ่านนิยามผิดลำดับ`},correctAnswer:`2.5`,acceptedAnswers:[`2.5`,`2.50`],verificationStatus:`verified`},{id:`M4-C-22`,mockSet:4,section:`C`,questionNumber:22,marks:6,difficulty:`challenge`,topic:`Strategy Games`,subskill:`winning move with a different move set`,type:`free-response`,en:{question:`Two players alternately remove 2 or 3 stones from a pile of 39 stones. The player who removes the last stone(s) wins. (A player who cannot move — because 0 or 1 stones remain — loses.) If Player A goes first and both play perfectly, how many stones should A remove on the first turn — 2 or 3? (Enter 2 or 3.)`,hint1:`Build a table of Win/Lose for small pile sizes, starting from 0 and 1 stones (both are losing, since no move is possible).`,hint2:`Find the repeating pattern in the losing positions before jumping to 39.`,quickIdea:`Build the Win/Lose table by hand for small piles, spot the repeating pattern, then apply it to the target pile size.`,steps:[`Building the table (L = losing for the player to move): L-positions occur at 0, 1, 5, 6, 10, 11, ... — a pattern of "remainder 0 or 1 when divided by 5."`,`39 ÷ 5 = 7 remainder 4, so 39 is a Winning position — a good first move exists.`,`From 39, removing 2 leaves 37 (37 ÷ 5 remainder 2 — a Winning position for the opponent, bad). Removing 3 leaves 36 (36 ÷ 5 remainder 1 — a Losing position for the opponent).`,`So Player A should remove 3 stones, leaving 36 for the opponent.`],competitionTip:`For moves {2, 3}, both 0 and 1 stones are automatically losing positions because NEITHER move is legal there — always check the smallest cases carefully before trusting a pattern.`,commonMistake:`Only marking 0 stones as losing and forgetting that 1 stone is ALSO a losing position (since neither a 2-stone nor 3-stone move is possible from 1 stone).`},th:{question:`ผู้เล่นสองคนผลัดกันหยิบก้อนหิน 2 หรือ 3 ก้อน จากกองที่มี 39 ก้อน ผู้ที่หยิบก้อนสุดท้ายเป็นผู้ชนะ (ผู้ที่เดินไม่ได้ — เพราะเหลือ 0 หรือ 1 ก้อน — เป็นผู้แพ้) ถ้า A เริ่มก่อนและทั้งสองเล่นสมบูรณ์แบบ A ควรหยิบกี่ก้อนในตาแรก — 2 หรือ 3 (ตอบ 2 หรือ 3)`,hint1:`สร้างตารางแพ้/ชนะสำหรับกองขนาดเล็ก เริ่มจาก 0 และ 1 ก้อน (ทั้งคู่แพ้ เพราะเดินไม่ได้เลย)`,hint2:`หารูปแบบที่วนซ้ำในสถานะแพ้ก่อนที่จะกระโดดไปที่ 39`,quickIdea:`สร้างตารางแพ้/ชนะด้วยมือสำหรับกองเล็ก หารูปแบบที่วนซ้ำ แล้วนำไปใช้กับขนาดกองเป้าหมาย`,steps:[`สร้างตาราง (L = แพ้สำหรับผู้ที่ต้องเดิน): สถานะแพ้เกิดที่ 0, 1, 5, 6, 10, 11, ... รูปแบบคือ "เศษ 0 หรือ 1 เมื่อหารด้วย 5"`,`39 ÷ 5 = 7 เศษ 4 ดังนั้น 39 เป็นสถานะชนะ มีการเดินแรกที่ดีอยู่`,`จาก 39 หยิบ 2 เหลือ 37 (37÷5 เศษ2 เป็นสถานะชนะของคู่ต่อสู้ ไม่ดี) หยิบ 3 เหลือ 36 (36÷5 เศษ1 เป็นสถานะแพ้ของคู่ต่อสู้)`,`ดังนั้น A ควรหยิบ 3 ก้อน เหลือ 36 ให้คู่ต่อสู้`],competitionTip:`สำหรับการเดิน {2, 3} ทั้ง 0 และ 1 ก้อนเป็นสถานะแพ้โดยอัตโนมัติ เพราะเดินไม่ได้เลยทั้งคู่ ตรวจกรณีเล็กที่สุดอย่างละเอียดก่อนเชื่อรูปแบบเสมอ`,commonMistake:`ทำเครื่องหมายเฉพาะ 0 ก้อนว่าแพ้ ลืมว่า 1 ก้อนก็เป็นสถานะแพ้ด้วย (เพราะหยิบ2หรือ3ก้อนจาก1ก้อนไม่ได้เลย)`},correctAnswer:`3`,acceptedAnswers:[`3`,`3.0`],verificationStatus:`verified`},{id:`M4-C-23`,mockSet:4,section:`C`,questionNumber:23,marks:6,difficulty:`challenge`,topic:`Intersections`,subskill:`maximum intersections of lines and circles combined`,type:`free-response`,en:{question:`What is the maximum number of points at which 5 distinct straight lines and 2 distinct circles can intersect each other, all together? (Count line-line, line-circle, and circle-circle intersections. Do not count a curve crossing itself.) (Enter a whole number.)`,hint1:`Handle each pair type separately: line-line pairs, line-circle pairs, and circle-circle pairs.`,hint2:`Two lines cross at most 1 point; a line and a circle cross at most 2 points; two circles cross at most 2 points.`,quickIdea:`Split into pair types, find the maximum for each type, then add all totals.`,steps:[`Line-line: C(5,2) = 10 pairs, 1 point each → 10.`,`Line-circle: 5 lines × 2 circles = 10 pairs, 2 points each → 20.`,`Circle-circle: C(2,2) = 1 pair, 2 points → 2.`,`Maximum total = 10 + 20 + 2 = 32.`],competitionTip:`With three different curve/line types mixed together, always make a small table of pair-types before adding — it prevents missing a category.`,commonMistake:`Forgetting the circle-circle intersection entirely when there are "only" 2 circles, undercounting the total by 2.`},th:{question:`จำนวนจุดตัดที่มากที่สุดที่เป็นไปได้ เมื่อเส้นตรง 5 เส้นที่แตกต่างกันและวงกลม 2 วงที่แตกต่างกันตัดกันทั้งหมด คือเท่าไร (นับจุดตัดเส้น-เส้น, เส้น-วงกลม, และวงกลม-วงกลม ไม่นับเส้นโค้งตัดตัวเอง) (ตอบเป็นจำนวนเต็ม)`,hint1:`จัดการแต่ละประเภทคู่แยกกัน: คู่เส้น-เส้น, คู่เส้น-วงกลม, และคู่วงกลม-วงกลม`,hint2:`เส้นสองเส้นตัดกันได้มากที่สุด 1 จุด เส้นกับวงกลมตัดกันได้มากที่สุด 2 จุด วงกลมสองวงตัดกันได้มากที่สุด 2 จุด`,quickIdea:`แบ่งเป็นประเภทคู่ หาค่าสูงสุดของแต่ละประเภท แล้วบวกผลรวมทั้งหมด`,steps:[`เส้น-เส้น: C(5,2) = 10 คู่ คู่ละ 1 จุด → 10`,`เส้น-วงกลม: เส้น5×วงกลม2 = 10 คู่ คู่ละ2จุด → 20`,`วงกลม-วงกลม: C(2,2) = 1 คู่ 2 จุด → 2`,`ผลรวมสูงสุด = 10 + 20 + 2 = 32`],competitionTip:`เมื่อมีเส้น/เส้นโค้งหลายประเภทผสมกัน ให้ทำตารางประเภทคู่เล็กๆ ก่อนบวกเสมอ ช่วยป้องกันการลืมหมวดใดหมวดหนึ่ง`,commonMistake:`ลืมจุดตัดวงกลม-วงกลมไปเลยเมื่อมีวงกลม "แค่" 2 วง ทำให้นับผลรวมต่ำกว่าความเป็นจริงไป 2`},correctAnswer:`32`,acceptedAnswers:[`32`,`32.0`],verificationStatus:`verified`},{id:`M4-C-24`,mockSet:4,section:`C`,questionNumber:24,marks:6,difficulty:`challenge`,topic:`Cube & Spatial Reasoning`,subskill:`painted cuboid: counting fully interior pieces`,type:`free-response`,en:{question:`A rectangular block is built from unit cubes in a 6×5×4 arrangement (120 unit cubes total). The outside is completely painted, then it is taken apart. How many unit cubes have NO paint on any face (fully interior)? (Enter a whole number.)`,hint1:`A fully interior cube must be at least one layer away from every outer face, in all three directions.`,hint2:`The interior forms a smaller block with each dimension reduced by 2 (one layer removed from each side).`,quickIdea:`Interior cubes form a smaller (a−2)×(b−2)×(c−2) block, one layer in from every face.`,steps:[`Interior dimensions: (6−2) × (5−2) × (4−2) = 4 × 3 × 2.`,`4 × 3 × 2 = 24.`],whyOthersFail:`Full check: corners = 8, edges (2-face) = 4×[(6−2)+(5−2)+(4−2)] = 4×9 = 36, faces (1-face) = 2×[(4×3)+(3×2)+(4×2)] = 2×26 = 52, interior = 24. Sum = 8+36+52+24 = 120 ✓.`,competitionTip:`For an a×b×c block, the fully-interior count is always (a−2)(b−2)(c−2) — the same reduction rule used for a cube, just with three different dimensions.`,commonMistake:`Forgetting to subtract 2 from EVERY dimension, e.g. using (6−2)×5×4 instead of (6−2)×(5−2)×(4−2).`},th:{question:`บล็อกสี่เหลี่ยมสร้างจากลูกบาศก์หน่วยจัดเรียงเป็น 6×5×4 (รวม 120 ก้อน) ผิวด้านนอกถูกทาสีทั้งหมด แล้วแยกออกจากกัน มีลูกบาศก์กี่ก้อนที่ไม่มีสีทาเลยแม้แต่หน้าเดียว (ตอบเป็นจำนวนเต็ม)`,hint1:`ลูกบาศก์ที่ไม่ถูกทาสีเลยต้องห่างจากทุกหน้านอกอย่างน้อยหนึ่งชั้นทั้งสามทิศทาง`,hint2:`ส่วนที่อยู่ข้างในสร้างบล็อกเล็กกว่าที่แต่ละมิติลดลง 2 (ตัดชั้นออกจากแต่ละด้าน)`,quickIdea:`ลูกบาศก์ที่อยู่ข้างในสร้างบล็อกเล็กขนาด (a−2)×(b−2)×(c−2) ห่างจากทุกหน้าหนึ่งชั้น`,steps:[`มิติด้านใน: (6−2) × (5−2) × (4−2) = 4 × 3 × 2`,`4 × 3 × 2 = 24`],whyOthersFail:`ตรวจสอบครบถ้วน: มุม = 8, ขอบ (2หน้า) = 4×[(6−2)+(5−2)+(4−2)] = 4×9 = 36, หน้า (1หน้า) = 2×[(4×3)+(3×2)+(4×2)] = 2×26 = 52, ข้างใน = 24 รวม = 8+36+52+24 = 120 ✓`,competitionTip:`สำหรับบล็อกขนาด a×b×c จำนวนที่อยู่ข้างในทั้งหมดเท่ากับ (a−2)(b−2)(c−2) เสมอ กฎการลดเดียวกับลูกบาศก์ เพียงมีสามมิติต่างกัน`,commonMistake:`ลืมลบ 2 ออกจากทุกมิติ เช่นใช้ (6−2)×5×4 แทนที่จะเป็น (6−2)×(5−2)×(4−2)`},correctAnswer:`24`,acceptedAnswers:[`24`,`24.0`],verificationStatus:`verified`},{id:`M4-C-25`,mockSet:4,section:`C`,questionNumber:25,marks:6,difficulty:`challenge`,topic:`Word Problems`,subskill:`two-time age-ratio system`,type:`free-response`,en:{question:`Five years ago, the ratio of Mother’s age to Daughter’s age was 7:2. Five years from now, the ratio will be 8:3. What is Mother’s CURRENT age? (Enter a whole number.)`,hint1:`Let M and D be their current ages. Write two equations using the two ratio conditions.`,hint2:`Remember: "5 years ago" means subtract 5 from the current ages; "5 years from now" means add 5.`,quickIdea:`Set up one equation per time condition using current ages, then solve the pair of equations together.`,steps:[`5 years ago: (M−5) : (D−5) = 7:2, so 2(M−5) = 7(D−5), giving 2M = 7D − 25.`,`5 years from now: (M+5) : (D+5) = 8:3, so 3(M+5) = 8(D+5), giving 3M = 8D + 25.`,`From the first equation, M = (7D−25)/2. Substitute into the second: 3×(7D−25)/2 = 8D + 25 → 21D − 75 = 16D + 50 → 5D = 125 → D = 25.`,`Then M = (7×25 − 25)/2 = (175−25)/2 = 150/2 = 75.`],whyOthersFail:`Check: 5 years ago, ages were 70:20 = 7:2 ✓. 5 years from now, ages will be 80:30 = 8:3 ✓.`,competitionTip:`For two-time ratio problems, always define variables as CURRENT ages, then shift by the same amount for both people in each condition — never solve using the "X years ago" ages directly as your main variables.`,commonMistake:`Setting up the ratio equations using "M−5 : D−5 = 7:2" but then forgetting to shift by the SAME amount when substituting the second condition, mixing up which age belongs to which time.`},th:{question:`5 ปีที่แล้ว อัตราส่วนอายุแม่ต่ออายุลูกสาวคือ 7:2 อีก 5 ปีข้างหน้า อัตราส่วนจะเป็น 8:3 ปัจจุบันแม่อายุเท่าไร (ตอบเป็นจำนวนเต็ม)`,hint1:`ให้ M และ D เป็นอายุปัจจุบันของทั้งสองคน เขียนสองสมการจากสองเงื่อนไขอัตราส่วน`,hint2:`จำไว้: "5 ปีที่แล้ว" คือลบ 5 จากอายุปัจจุบัน "อีก 5 ปีข้างหน้า" คือบวก 5`,quickIdea:`ตั้งหนึ่งสมการต่อเงื่อนไขเวลา โดยใช้อายุปัจจุบัน แล้วแก้สองสมการไปพร้อมกัน`,steps:[`5 ปีที่แล้ว: (M−5) : (D−5) = 7:2 ดังนั้น 2(M−5) = 7(D−5) ได้ 2M = 7D − 25`,`อีก 5 ปี: (M+5) : (D+5) = 8:3 ดังนั้น 3(M+5) = 8(D+5) ได้ 3M = 8D + 25`,`จากสมการแรก M = (7D−25)/2 แทนในสมการที่สอง: 3×(7D−25)/2 = 8D + 25 → 21D − 75 = 16D + 50 → 5D = 125 → D = 25`,`จากนั้น M = (7×25 − 25)/2 = (175−25)/2 = 150/2 = 75`],whyOthersFail:`ตรวจสอบ: 5 ปีที่แล้ว อายุคือ 70:20 = 7:2 ✓ อีก 5 ปี อายุจะเป็น 80:30 = 8:3 ✓`,competitionTip:`สำหรับโจทย์อัตราส่วนสองช่วงเวลา ให้ตั้งตัวแปรเป็นอายุปัจจุบันเสมอ แล้วเลื่อนเท่ากันทั้งสองคนในแต่ละเงื่อนไข อย่าแก้โดยใช้อายุ "X ปีที่แล้ว" เป็นตัวแปรหลักโดยตรง`,commonMistake:`ตั้งสมการอัตราส่วนด้วย "M−5 : D−5 = 7:2" แต่ลืมเลื่อนเท่ากันเมื่อแทนเงื่อนไขที่สอง ทำให้สับสนว่าอายุใดเป็นของช่วงเวลาใด`},correctAnswer:`75`,acceptedAnswers:[`75`,`75.0`],verificationStatus:`verified`}],zr={set:4,title:{en:`Mock Test 4`,th:`ข้อสอบจำลองชุดที่ 4`},estimatedMinutes:60},Br=[{id:`M5-A-01`,mockSet:5,section:`A`,questionNumber:1,marks:3,difficulty:`foundation`,topic:`Number Sense`,subskill:`inverse operations without solving`,type:`mc`,en:{question:`If 17 + x = 42, what is the value of 42 − x, WITHOUT first solving for x?`,options:[`17`,`25`,`59`,`8`,`34`],hint1:`Rearrange the given equation directly — you don’t need to know x itself.`,hint2:`If 17 + x = 42, then moving x to the other side gives 42 − x = ?`,quickIdea:`Addition and subtraction are inverse operations — rearranging an equation can answer a question without ever finding the unknown.`,steps:[`The equation 17 + x = 42 can be rearranged to 42 − x = 17.`,`So the answer is 17, with no need to solve for x at all.`],whyOthersFail:`Solving for x first (x = 25) and then computing 42 − 25 = 17 also works, but it takes an unnecessary extra step.`,competitionTip:`Before solving an equation, check whether the question can be answered by rearranging it directly — this saves valuable time.`,commonMistake:`Solving for x the long way and occasionally making an arithmetic slip in the extra step, when a direct rearrangement was possible.`},th:{question:`ถ้า 17 + x = 42 ค่าของ 42 − x คือเท่าไร โดยไม่ต้องแก้หา x ก่อน`,options:[`17`,`25`,`59`,`8`,`34`],hint1:`จัดสมการที่ให้มาใหม่โดยตรง ไม่จำเป็นต้องรู้ค่า x เอง`,hint2:`ถ้า 17 + x = 42 การย้าย x ไปอีกด้านจะได้ 42 − x = ?`,quickIdea:`การบวกและการลบเป็นการดำเนินการผกผันกัน การจัดสมการใหม่สามารถตอบคำถามได้โดยไม่ต้องหาค่าที่ไม่รู้เลย`,steps:[`สมการ 17 + x = 42 จัดใหม่ได้เป็น 42 − x = 17`,`ดังนั้นคำตอบคือ 17 โดยไม่ต้องแก้หา x เลย`],whyOthersFail:`การแก้หา x ก่อน (x = 25) แล้วคำนวณ 42 − 25 = 17 ก็ใช้ได้เช่นกัน แต่เสียขั้นตอนเพิ่มโดยไม่จำเป็น`,competitionTip:`ก่อนแก้สมการ ตรวจสอบว่าคำถามตอบได้จากการจัดสมการใหม่โดยตรงหรือไม่ ช่วยประหยัดเวลาที่มีค่า`,commonMistake:`แก้หา x แบบยาวและบางครั้งพลาดในขั้นตอนเพิ่มเติม ทั้งที่จัดสมการใหม่ได้โดยตรง`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M5-A-02`,mockSet:5,section:`A`,questionNumber:2,marks:3,difficulty:`foundation`,topic:`Factors & Primes`,subskill:`prime condition with a digit relationship`,type:`mc`,en:{question:`N is a two-digit prime number. Its units digit is 3 more than its tens digit. What is N?`,options:[`14`,`47`,`25`,`58`,`69`],hint1:`List two-digit numbers where the units digit is 3 more than the tens digit.`,hint2:`Check each candidate for primality.`,quickIdea:`Build the list of numbers matching the digit rule first, then test each for the second condition.`,steps:[`Tens digit t, units digit t+3 (t from 1 to 6): candidates are 14, 25, 36, 47, 58, 69.`,`Check each for being prime: 14 no, 25 no, 36 no, 47 YES, 58 no (even), 69 no (3×23).`,`Only 47 is prime, so N = 47.`],competitionTip:`When a digit-relationship clue is given, generate the short candidate list first — it is usually much shorter than testing every two-digit number.`,commonMistake:`Checking primality first across all two-digit numbers instead of using the digit-relationship clue to shrink the list first.`},th:{question:`N เป็นจำนวนเฉพาะสองหลัก หลักหน่วยของ N มากกว่าหลักสิบอยู่ 3 N คือเท่าไร`,options:[`14`,`47`,`25`,`58`,`69`],hint1:`ลิสต์เลขสองหลักที่หลักหน่วยมากกว่าหลักสิบอยู่ 3`,hint2:`ตรวจแต่ละตัวเลือกว่าเป็นจำนวนเฉพาะหรือไม่`,quickIdea:`สร้างรายการเลขตามกฎความสัมพันธ์ของหลักก่อน แล้วจึงตรวจเงื่อนไขที่สอง`,steps:[`หลักสิบ t หลักหน่วย t+3 (t จาก 1 ถึง 6): ตัวเลือกคือ 14, 25, 36, 47, 58, 69`,`ตรวจว่าแต่ละตัวเป็นจำนวนเฉพาะหรือไม่: 14 ไม่ใช่, 25 ไม่ใช่, 36 ไม่ใช่, 47 ใช่, 58 ไม่ใช่ (เลขคู่), 69 ไม่ใช่ (3×23)`,`มีเพียง 47 ที่เป็นจำนวนเฉพาะ ดังนั้น N = 47`],competitionTip:`เมื่อมีเงื่อนไขความสัมพันธ์ของหลัก ให้สร้างรายการตัวเลือกสั้นๆ ก่อน มักสั้นกว่าการตรวจเลขสองหลักทุกตัว`,commonMistake:`ตรวจความเป็นจำนวนเฉพาะก่อนกับเลขสองหลักทุกตัว แทนที่จะใช้เงื่อนไขความสัมพันธ์ของหลักลดรายการก่อน`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M5-A-03`,mockSet:5,section:`A`,questionNumber:3,marks:3,difficulty:`foundation`,topic:`Remainders`,subskill:`direct remainder calculation`,type:`mc`,en:{question:`What is the remainder when 2024 is divided by 6?`,options:[`0`,`1`,`2`,`3`,`4`],hint1:`Find the largest multiple of 6 that is less than or equal to 2024.`,hint2:`6 × 337 = 2022.`,quickIdea:`Subtract the largest multiple of the divisor to find the remainder.`,steps:[`6 × 337 = 2022.`,`2024 − 2022 = 2.`],competitionTip:`For a quick check, remember 2024 is even (so remainder isn’t affected by that) and use the digit-sum trick for divisibility by 3 alongside direct division for the factor of 2 in 6 = 2×3.`,commonMistake:`Miscounting the multiple of 6 closest to 2024, e.g. using 6×338=2028 (too big) and getting a negative or wrong remainder.`},th:{question:`เศษที่เหลือเมื่อหาร 2024 ด้วย 6 คือเท่าไร`,options:[`0`,`1`,`2`,`3`,`4`],hint1:`หาพหุคูณของ 6 ที่มากที่สุดที่ไม่เกิน 2024`,hint2:`6 × 337 = 2022`,quickIdea:`ลบพหุคูณที่มากที่สุดของตัวหารออกเพื่อหาเศษ`,steps:[`6 × 337 = 2022`,`2024 − 2022 = 2`],competitionTip:`ตรวจสอบเร็วๆ: 2024 เป็นเลขคู่ และใช้เทคนิคผลบวกหลักสำหรับหาร 3 ควบคู่กับการหารตรงสำหรับตัวประกอบ 2 ใน 6 = 2×3`,commonMistake:`นับพหุคูณของ 6 ที่ใกล้ 2024 ผิด เช่นใช้ 6×338=2028 (มากไป) แล้วได้เศษติดลบหรือผิด`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M5-A-04`,mockSet:5,section:`A`,questionNumber:4,marks:3,difficulty:`foundation`,topic:`Word Problems`,subskill:`grouping into equal rows`,type:`mc`,en:{question:`A cinema has rows of seats with 14 seats in each row. If there are 238 seats in total, how many rows are there?`,options:[`15`,`16`,`18`,`17`,`19`],hint1:`Total seats = seats per row × number of rows.`,hint2:`Divide the total by the number of seats in one row.`,quickIdea:`When items are arranged in equal groups, divide the total by the group size to find the number of groups.`,steps:[`Number of rows = 238 ÷ 14.`,`238 ÷ 14 = 17.`],competitionTip:`Check your division by multiplying back: 17 × 14 = 238 ✓.`,commonMistake:`Dividing 14 by 238 instead of 238 by 14, inverting the operation.`},th:{question:`โรงภาพยนตร์มีที่นั่งแถวละ 14 ที่นั่ง ถ้ามีที่นั่งทั้งหมด 238 ที่นั่ง มีกี่แถว`,options:[`15`,`16`,`18`,`17`,`19`],hint1:`ที่นั่งทั้งหมด = ที่นั่งต่อแถว × จำนวนแถว`,hint2:`นำผลรวมหารด้วยจำนวนที่นั่งในหนึ่งแถว`,quickIdea:`เมื่อสิ่งของถูกจัดเป็นกลุ่มเท่าๆ กัน หารผลรวมด้วยขนาดกลุ่มเพื่อหาจำนวนกลุ่ม`,steps:[`จำนวนแถว = 238 ÷ 14`,`238 ÷ 14 = 17`],competitionTip:`ตรวจการหารโดยคูณย้อนกลับ: 17 × 14 = 238 ✓`,commonMistake:`หาร 14 ด้วย 238 แทนที่จะหาร 238 ด้วย 14 สลับการดำเนินการ`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M5-A-05`,mockSet:5,section:`A`,questionNumber:5,marks:3,difficulty:`foundation`,topic:`Average`,subskill:`average after removing a value`,type:`mc`,en:{question:`The average of 6 numbers is 20. If one of the numbers, which is 32, is removed, what is the average of the remaining 5 numbers?`,options:[`16`,`17`,`18`,`18.5`,`17.6`],hint1:`Find the total of all 6 numbers first.`,hint2:`Subtract the removed number, then divide by the new count.`,quickIdea:`Work through totals: find the original total, remove the value, then divide by the new count.`,steps:[`Total of 6 numbers = 6 × 20 = 120.`,`Total of remaining 5 numbers = 120 − 32 = 88.`,`New average = 88 ÷ 5 = 17.6.`],competitionTip:`Removing a number ABOVE the average always pulls the new average down — a quick check that 17.6 < 20 makes sense here.`,commonMistake:`Dividing 120 by 6 again instead of by the new count of 5.`},th:{question:`ค่าเฉลี่ยของตัวเลข 6 จำนวนคือ 20 ถ้าตัวเลขหนึ่งซึ่งคือ 32 ถูกเอาออก ค่าเฉลี่ยของ 5 จำนวนที่เหลือคือเท่าไร`,options:[`16`,`17`,`18`,`18.5`,`17.6`],hint1:`หาผลรวมของทั้ง 6 จำนวนก่อน`,hint2:`ลบจำนวนที่เอาออก แล้วหารด้วยจำนวนตัวใหม่`,quickIdea:`คำนวณผ่านผลรวม: หาผลรวมเดิม เอาค่าที่ถูกลบออก แล้วหารด้วยจำนวนตัวใหม่`,steps:[`ผลรวมของ 6 จำนวน = 6 × 20 = 120`,`ผลรวมของ 5 จำนวนที่เหลือ = 120 − 32 = 88`,`ค่าเฉลี่ยใหม่ = 88 ÷ 5 = 17.6`],competitionTip:`การเอาตัวเลขที่ "สูงกว่า" ค่าเฉลี่ยออก จะดึงค่าเฉลี่ยใหม่ให้ต่ำลงเสมอ ตรวจสอบเร็วๆ ว่า 17.6 < 20 สมเหตุสมผล`,commonMistake:`หาร 120 ด้วย 6 อีกครั้งแทนที่จะหารด้วยจำนวนตัวใหม่คือ 5`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M5-A-06`,mockSet:5,section:`A`,questionNumber:6,marks:3,difficulty:`foundation`,topic:`Perimeter`,subskill:`summing given boundary segments`,type:`mc`,en:{question:`An L-shaped room has these wall lengths in order going all the way around the shape: 8 m, 5 m, 3 m, 2 m, 5 m, 3 m. What is the total perimeter of the room?`,options:[`22`,`26`,`24`,`28`,`30`],hint1:`The perimeter is simply the total length of every wall segment going around the shape once.`,hint2:`You don’t need to know the exact shape — just add every given length.`,quickIdea:`For any closed shape, the perimeter is the sum of ALL the boundary segments, no matter how irregular the shape.`,steps:[`Add all six segments: 8 + 5 + 3 + 2 + 5 + 3.`,`8+5=13, +3=16, +2=18, +5=23, +3=26.`],competitionTip:`For irregular shapes given as a list of wall lengths, perimeter is always just the sum — no special formula is needed.`,commonMistake:`Trying to use a rectangle-style formula (2×(length+width)) on a shape that isn’t a simple rectangle.`},th:{question:`ห้องรูปตัว L มีความยาวผนังเรียงตามลำดับรอบรูปดังนี้: 8 ม., 5 ม., 3 ม., 2 ม., 5 ม., 3 ม. เส้นรอบรูปทั้งหมดของห้องคือเท่าไร`,options:[`22`,`26`,`24`,`28`,`30`],hint1:`เส้นรอบรูปคือผลรวมความยาวของผนังทุกส่วนรอบรูปหนึ่งรอบ`,hint2:`ไม่จำเป็นต้องรู้รูปทรงที่แน่นอน เพียงบวกความยาวที่ให้มาทั้งหมด`,quickIdea:`สำหรับรูปปิดใดๆ เส้นรอบรูปคือผลบวกของทุกส่วนขอบเขต ไม่ว่ารูปทรงจะไม่สม่ำเสมอเพียงใด`,steps:[`บวกทั้งหกส่วน: 8 + 5 + 3 + 2 + 5 + 3`,`8+5=13, +3=16, +2=18, +5=23, +3=26`],competitionTip:`สำหรับรูปทรงไม่สม่ำเสมอที่ให้เป็นรายการความยาวผนัง เส้นรอบรูปคือผลบวกเสมอ ไม่ต้องใช้สูตรพิเศษ`,commonMistake:`พยายามใช้สูตรแบบสี่เหลี่ยมผืนผ้า (2×(ยาว+กว้าง)) กับรูปที่ไม่ใช่สี่เหลี่ยมผืนผ้าธรรมดา`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M5-A-07`,mockSet:5,section:`A`,questionNumber:7,marks:3,difficulty:`foundation`,topic:`Area`,subskill:`area of a plus-shaped crossing path`,type:`mc`,en:{question:`A rectangular field measures 20 m by 15 m. Two straight paths, each 2 m wide, cross through the middle — one running the full length, one running the full width — forming a plus-sign shape. What is the total area of the two paths, counting the overlapping middle square only once?`,options:[`60`,`62`,`66`,`70`,`74`],hint1:`Find the area of each path separately, as if it were its own rectangle.`,hint2:`The two paths share a small square where they cross — don’t count that square twice.`,quickIdea:`Total path area = Area(path 1) + Area(path 2) − Area(the overlapping crossing square).`,steps:[`Path along the length: 20 × 2 = 40 m².`,`Path along the width: 15 × 2 = 30 m².`,`Overlapping crossing square: 2 × 2 = 4 m².`,`Total path area = 40 + 30 − 4 = 66 m².`],competitionTip:`A plus-sign (crossing paths) problem is really just an overlap problem in disguise — apply the same "add both, subtract the overlap" rule.`,commonMistake:`Adding 40 + 30 = 70 without subtracting the 4 m² crossing square that was counted in both paths.`},th:{question:`สนามสี่เหลี่ยมผืนผ้าขนาด 20 ม. × 15 ม. มีทางเดินตรงสองเส้น กว้างเส้นละ 2 ม. ตัดผ่านกลางสนาม เส้นหนึ่งวิ่งตลอดความยาว อีกเส้นวิ่งตลอดความกว้าง เป็นรูปเครื่องหมายบวก พื้นที่รวมของทางเดินทั้งสอง (นับบริเวณตรงกลางที่ทับซ้อนกันเพียงครั้งเดียว) คือเท่าไร`,options:[`60`,`62`,`66`,`70`,`74`],hint1:`หาพื้นที่ของแต่ละทางเดินแยกกัน เหมือนเป็นสี่เหลี่ยมผืนผ้าของตัวเอง`,hint2:`ทางเดินทั้งสองมีสี่เหลี่ยมเล็กที่ตัดกันร่วมกัน อย่านับสี่เหลี่ยมนั้นซ้ำสองครั้ง`,quickIdea:`พื้นที่ทางเดินรวม = พื้นที่(ทางเดิน1) + พื้นที่(ทางเดิน2) − พื้นที่สี่เหลี่ยมตรงกลางที่ทับซ้อน`,steps:[`ทางเดินตามความยาว: 20 × 2 = 40 ตร.ม.`,`ทางเดินตามความกว้าง: 15 × 2 = 30 ตร.ม.`,`สี่เหลี่ยมตรงกลางที่ทับซ้อน: 2 × 2 = 4 ตร.ม.`,`พื้นที่ทางเดินรวม = 40 + 30 − 4 = 66 ตร.ม.`],competitionTip:`โจทย์รูปเครื่องหมายบวก (ทางเดินตัดกัน) แท้จริงคือโจทย์ทับซ้อนที่แฝงอยู่ ใช้กฎ "บวกทั้งสอง ลบส่วนทับซ้อน" เดียวกัน`,commonMistake:`บวก 40 + 30 = 70 โดยไม่ลบสี่เหลี่ยมตรงกลาง 4 ตร.ม. ที่ถูกนับในทางเดินทั้งสองเส้น`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M5-A-08`,mockSet:5,section:`A`,questionNumber:8,marks:3,difficulty:`foundation`,topic:`Angles & Triangles`,subskill:`basic isosceles base angles`,type:`mc`,en:{question:`In an isosceles triangle, the apex angle is 70°. What is the size of each base angle?`,options:[`50`,`60`,`65`,`55`,`70`],hint1:`The two base angles of an isosceles triangle are always equal.`,hint2:`All three angles still sum to 180°.`,quickIdea:`Subtract the apex angle from 180°, then split the rest equally between the two equal base angles.`,steps:[`180° − 70° = 110°.`,`110° ÷ 2 = 55°.`],competitionTip:`Always identify the APEX angle (the one between the two equal sides) first — the other two are automatically equal.`,commonMistake:`Dividing 180° by 3 as if all three angles were equal, instead of subtracting the apex angle first.`},th:{question:`สามเหลี่ยมหน้าจั่วมีมุมยอด 70° มุมฐานแต่ละมุมมีขนาดเท่าไร`,options:[`50`,`60`,`65`,`55`,`70`],hint1:`มุมฐานทั้งสองของสามเหลี่ยมหน้าจั่วเท่ากันเสมอ`,hint2:`มุมทั้งสามยังคงรวมกันได้ 180°`,quickIdea:`ลบมุมยอดออกจาก 180° แล้วแบ่งที่เหลือเท่าๆ กันให้มุมฐานทั้งสอง`,steps:[`180° − 70° = 110°`,`110° ÷ 2 = 55°`],competitionTip:`ระบุมุมยอด (มุมระหว่างสองด้านที่เท่ากัน) ก่อนเสมอ อีกสองมุมจะเท่ากันโดยอัตโนมัติ`,commonMistake:`หาร 180° ด้วย 3 เหมือนมุมทั้งสามเท่ากันหมด แทนที่จะลบมุมยอดออกก่อน`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M5-A-09`,mockSet:5,section:`A`,questionNumber:9,marks:3,difficulty:`foundation`,topic:`Cube & Spatial Reasoning`,subskill:`consistent opposite-face products`,type:`mc`,en:{question:`A cube’s six faces are numbered 1 to 6. Two pairs of opposite faces are known to have EQUAL products: (2, 6) and (3, 4). What is that equal product?`,options:[`10`,`14`,`16`,`18`,`12`],hint1:`Multiply one of the given pairs.`,hint2:`Check your answer against the OTHER given pair too.`,quickIdea:`If two pairs are said to share a property (like equal products), compute it from either pair and confirm with the other.`,steps:[`2 × 6 = 12.`,`Check: 3 × 4 = 12. ✓`,`The equal product is 12.`],competitionTip:`Always verify a claimed pattern against ALL given data, not just one piece — here, checking both pairs confirms the product really is consistent.`,commonMistake:`Computing only one product and not checking it against the second given pair.`},th:{question:`ลูกบาศก์มีหน้ากำกับเลข 1 ถึง 6 คู่หน้าตรงข้ามสองคู่ทราบว่ามีผลคูณเท่ากัน: (2, 6) และ (3, 4) ผลคูณที่เท่ากันนั้นคือเท่าไร`,options:[`10`,`14`,`16`,`18`,`12`],hint1:`คูณคู่ที่ให้มาคู่หนึ่งดู`,hint2:`ตรวจคำตอบกับอีกคู่ที่ให้มาด้วย`,quickIdea:`ถ้าสองคู่มีคุณสมบัติร่วมกัน (เช่นผลคูณเท่ากัน) คำนวณจากคู่ใดคู่หนึ่งแล้วยืนยันกับอีกคู่`,steps:[`2 × 6 = 12`,`ตรวจสอบ: 3 × 4 = 12 ✓`,`ผลคูณที่เท่ากันคือ 12`],competitionTip:`ตรวจสอบรูปแบบที่อ้างกับข้อมูลที่ให้มาทั้งหมดเสมอ ไม่ใช่แค่ส่วนเดียว การตรวจทั้งสองคู่ยืนยันว่าผลคูณสอดคล้องกันจริง`,commonMistake:`คำนวณผลคูณเพียงคู่เดียว โดยไม่ตรวจกับคู่ที่สองที่ให้มา`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M5-A-10`,mockSet:5,section:`A`,questionNumber:10,marks:3,difficulty:`foundation`,topic:`Visual Patterns`,subskill:`magic square missing value`,type:`mc`,en:{question:`In this 3×3 grid of numbers, every row, every column, and both diagonals add up to 15: Row 1: 4, 9, 2. Row 2: 3, 5, 7. Row 3: 8, 1, ?. What is the missing number?`,options:[`6`,`4`,`5`,`7`,`8`],hint1:`Use Row 3 alone: 8 + 1 + ? = 15.`,hint2:`Double-check using Column 3 instead: 2 + 7 + ? should also equal 15.`,quickIdea:`Use any row, column, or diagonal that contains the missing cell and already has two known numbers.`,steps:[`Row 3: 8 + 1 + ? = 15, so ? = 15 − 9 = 6.`,`Check with Column 3: 2 + 7 + 6 = 15. ✓`],competitionTip:`In a magic square, you can always find a missing cell using whichever row, column, or diagonal has the fewest unknowns — usually just one.`,commonMistake:`Trying to find the missing number by guessing a pattern in the whole grid instead of just using the row/column sum rule.`},th:{question:`ในตาราง 3×3 นี้ ทุกแถว ทุกคอลัมน์ และเส้นทแยงมุมทั้งสองรวมกันได้ 15: แถว1: 4, 9, 2 แถว2: 3, 5, 7 แถว3: 8, 1, ? เลขที่หายไปคือเท่าไร`,options:[`6`,`4`,`5`,`7`,`8`],hint1:`ใช้แถว3อย่างเดียว: 8 + 1 + ? = 15`,hint2:`ตรวจสอบซ้ำโดยใช้คอลัมน์3แทน: 2 + 7 + ? ก็ควรเท่ากับ 15 ด้วย`,quickIdea:`ใช้แถว คอลัมน์ หรือเส้นทแยงมุมใดๆ ที่มีช่องที่หายไปและมีเลขที่รู้ค่าแล้วสองตัว`,steps:[`แถว3: 8 + 1 + ? = 15 ดังนั้น ? = 15 − 9 = 6`,`ตรวจกับคอลัมน์3: 2 + 7 + 6 = 15 ✓`],competitionTip:`ในตารางกล ค้นหาช่องที่หายไปได้เสมอโดยใช้แถว คอลัมน์ หรือเส้นทแยงมุมที่มีตัวไม่ทราบค่าน้อยที่สุด มักเหลือเพียงตัวเดียว`,commonMistake:`พยายามหาเลขที่หายไปโดยเดารูปแบบของตารางทั้งหมด แทนที่จะใช้กฎผลรวมแถว/คอลัมน์`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M5-B-11`,mockSet:5,section:`B`,questionNumber:11,marks:4,difficulty:`competition`,topic:`Number Patterns`,subskill:`triangular numbers`,type:`mc`,en:{question:`A pattern of dots forms triangles: 1 dot, 3 dots, 6 dots, 10 dots, ... (the triangular numbers). How many dots are in the 12th triangular number?`,options:[`66`,`72`,`84`,`78`,`91`],hint1:`The nth triangular number has a direct formula: n(n+1)/2.`,hint2:`Substitute n = 12 into the formula.`,quickIdea:`Triangular numbers follow T(n) = n(n+1)/2 — a very common competition formula.`,steps:[`T(12) = 12 × 13 ÷ 2.`,`12 × 13 = 156.`,`156 ÷ 2 = 78.`],competitionTip:`Triangular numbers connect to combinations too: T(n) = C(n+1, 2) — useful if you already know combination notation.`,commonMistake:`Using n(n−1)/2 (the combination formula for choosing 2 from n) instead of n(n+1)/2.`},th:{question:`รูปแบบจุดที่เรียงเป็นสามเหลี่ยม: 1 จุด, 3 จุด, 6 จุด, 10 จุด, ... (จำนวนสามเหลี่ยม) จำนวนสามเหลี่ยมที่ 12 มีกี่จุด`,options:[`66`,`72`,`84`,`78`,`91`],hint1:`จำนวนสามเหลี่ยมที่ n มีสูตรตรงคือ n(n+1)/2`,hint2:`แทน n = 12 ลงในสูตร`,quickIdea:`จำนวนสามเหลี่ยมเป็นไปตาม T(n) = n(n+1)/2 สูตรที่พบบ่อยมากในการแข่งขัน`,steps:[`T(12) = 12 × 13 ÷ 2`,`12 × 13 = 156`,`156 ÷ 2 = 78`],competitionTip:`จำนวนสามเหลี่ยมเชื่อมโยงกับคอมบิเนชันด้วย: T(n) = C(n+1, 2) มีประโยชน์ถ้ารู้จักสัญลักษณ์คอมบิเนชันแล้ว`,commonMistake:`ใช้ n(n−1)/2 (สูตรคอมบิเนชันเลือก2จาก n) แทนที่จะเป็น n(n+1)/2`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M5-B-12`,mockSet:5,section:`B`,questionNumber:12,marks:4,difficulty:`competition`,topic:`Remainders`,subskill:`units digit of a sum of powers`,type:`mc`,en:{question:`What is the units digit of the sum 7¹ + 7² + 7³ + ⋯ + 7¹⁰ (the first 10 powers of 7 added together)?`,options:[`0`,`3`,`8`,`9`,`6`],hint1:`The units digit of a sum depends only on the units digits of the terms being added.`,hint2:`Write out the units digits of 7¹ through 7¹⁰ using the repeating cycle (7, 9, 3, 1), then add just those units digits.`,quickIdea:`Find each term’s units digit using the power cycle, then sum just those digits and take the units digit of THAT sum.`,steps:[`Units digits of 7¹ to 7¹⁰ (cycle 7,9,3,1 repeating): 7,9,3,1,7,9,3,1,7,9.`,`Sum of these ten digits: (7+9+3+1)×2 + 7+9 = 20×2 + 16 = 56.`,`The units digit of 56 is 6, so the units digit of the full sum is 6.`],competitionTip:`You never need the actual huge sum — just track units digits throughout, since only the units digit of each step matters for the final units digit.`,commonMistake:`Trying to add the actual (very large) powers of 7 instead of working only with their units digits.`},th:{question:`หลักหน่วยของผลบวก 7¹ + 7² + 7³ + ⋯ + 7¹⁰ (เลขยกกำลังของ 7 สิบตัวแรกรวมกัน) คือเท่าไร`,options:[`0`,`3`,`8`,`9`,`6`],hint1:`หลักหน่วยของผลบวกขึ้นอยู่กับหลักหน่วยของพจน์ที่บวกกันเท่านั้น`,hint2:`เขียนหลักหน่วยของ 7¹ ถึง 7¹⁰ โดยใช้รอบที่วนซ้ำ (7, 9, 3, 1) แล้วบวกเฉพาะหลักหน่วยเหล่านั้น`,quickIdea:`หาหลักหน่วยของแต่ละพจน์โดยใช้รอบเลขยกกำลัง แล้วบวกเฉพาะหลักเหล่านั้น และหาหลักหน่วยของผลบวกนั้นอีกที`,steps:[`หลักหน่วยของ 7¹ ถึง 7¹⁰ (รอบ 7,9,3,1 วนซ้ำ): 7,9,3,1,7,9,3,1,7,9`,`ผลบวกของสิบหลักนี้: (7+9+3+1)×2 + 7+9 = 20×2 + 16 = 56`,`หลักหน่วยของ 56 คือ 6 ดังนั้นหลักหน่วยของผลบวกทั้งหมดคือ 6`],competitionTip:`ไม่จำเป็นต้องหาผลบวกจริงที่มหาศาล เพียงติดตามหลักหน่วยตลอด เพราะมีเพียงหลักหน่วยของแต่ละขั้นที่สำคัญต่อหลักหน่วยสุดท้าย`,commonMistake:`พยายามบวกเลขยกกำลังของ 7 จริง (ที่ใหญ่มาก) แทนที่จะทำงานกับหลักหน่วยเท่านั้น`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M5-B-13`,mockSet:5,section:`B`,questionNumber:13,marks:4,difficulty:`competition`,topic:`Word Problems`,subskill:`combined fill-and-drain rate`,type:`mc`,en:{question:`A tap can fill a tank in 10 hours. A drain can empty the same full tank in 15 hours. If both the tap and the drain are left open at the same time on an empty tank, how many hours will it take to fill the tank?`,options:[`30`,`20`,`25`,`35`,`40`],hint1:`Convert both rates to "tank per hour," treating the drain as a NEGATIVE rate.`,hint2:`Combine the rates by subtracting the drain’s rate from the tap’s rate.`,quickIdea:`A fill-and-drain problem combines rates just like a work-together problem, except the drain’s rate is subtracted, not added.`,steps:[`Tap’s rate = 1/10 tank per hour. Drain’s rate = 1/15 tank per hour (removing).`,`Net rate = 1/10 − 1/15 = 3/30 − 2/30 = 1/30 tank per hour.`,`Time to fill = 1 ÷ (1/30) = 30 hours.`],competitionTip:`Whenever a problem mixes "filling" and "draining" (or "adding" and "removing"), treat the draining rate as negative before combining.`,commonMistake:`Adding the two rates as if both were filling (1/10 + 1/15), which ignores that the drain works against the tap.`},th:{question:`ก๊อกน้ำเติมถังเต็มได้ใน 10 ชั่วโมง ท่อระบายน้ำสามารถระบายถังเต็มถังเดียวกันได้ใน 15 ชั่วโมง ถ้าเปิดทั้งก๊อกและท่อระบายพร้อมกันบนถังเปล่า จะใช้เวลากี่ชั่วโมงในการเติมถังให้เต็ม`,options:[`30`,`20`,`25`,`35`,`40`],hint1:`แปลงทั้งสองอัตราเป็น "ถังต่อชั่วโมง" โดยถือว่าท่อระบายเป็นอัตราติดลบ`,hint2:`รวมอัตราโดยลบอัตราของท่อระบายออกจากอัตราของก๊อกน้ำ`,quickIdea:`โจทย์เติม-ระบายรวมอัตราแบบเดียวกับโจทย์ทำงานร่วมกัน ยกเว้นอัตราของท่อระบายต้องลบ ไม่ใช่บวก`,steps:[`อัตราก๊อกน้ำ = 1/10 ถังต่อชั่วโมง อัตราท่อระบาย = 1/15 ถังต่อชั่วโมง (เอาออก)`,`อัตราสุทธิ = 1/10 − 1/15 = 3/30 − 2/30 = 1/30 ถังต่อชั่วโมง`,`เวลาที่เติมเต็ม = 1 ÷ (1/30) = 30 ชั่วโมง`],competitionTip:`เมื่อโจทย์ผสม "เติม" กับ "ระบาย" (หรือ "เพิ่ม" กับ "เอาออก") ให้ถือว่าอัตราการระบายเป็นลบก่อนรวมกัน`,commonMistake:`บวกทั้งสองอัตราเหมือนทั้งคู่เติม (1/10 + 1/15) ซึ่งละเลยว่าท่อระบายทำงานสวนทางกับก๊อกน้ำ`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M5-B-14`,mockSet:5,section:`B`,questionNumber:14,marks:4,difficulty:`competition`,topic:`Average`,subskill:`finding a removed value from two averages`,type:`mc`,en:{question:`The average of 8 numbers is 15. After removing one number, the average of the remaining 7 numbers becomes 14. What number was removed?`,options:[`18`,`22`,`20`,`24`,`26`],hint1:`Find the total of the original 8 numbers, and the total of the remaining 7.`,hint2:`The removed number is the difference between the two totals.`,quickIdea:`Convert both averages to totals, then subtract to find the removed value.`,steps:[`Total of 8 numbers = 8 × 15 = 120.`,`Total of remaining 7 numbers = 7 × 14 = 98.`,`Removed number = 120 − 98 = 22.`],competitionTip:`Since the average DROPPED after removal, the removed number must have been ABOVE the original average (15) — 22 fits that check.`,commonMistake:`Subtracting the two averages (15 − 14 = 1) and mistaking that small difference for the removed number.`},th:{question:`ค่าเฉลี่ยของตัวเลข 8 จำนวนคือ 15 หลังจากเอาตัวเลขหนึ่งออก ค่าเฉลี่ยของ 7 จำนวนที่เหลือกลายเป็น 14 ตัวเลขที่ถูกเอาออกคือเท่าไร`,options:[`18`,`22`,`20`,`24`,`26`],hint1:`หาผลรวมของ 8 จำนวนเดิม และผลรวมของ 7 จำนวนที่เหลือ`,hint2:`ตัวเลขที่ถูกเอาออกคือผลต่างระหว่างผลรวมทั้งสอง`,quickIdea:`แปลงค่าเฉลี่ยทั้งสองเป็นผลรวม แล้วลบเพื่อหาค่าที่ถูกเอาออก`,steps:[`ผลรวมของ 8 จำนวน = 8 × 15 = 120`,`ผลรวมของ 7 จำนวนที่เหลือ = 7 × 14 = 98`,`ตัวเลขที่ถูกเอาออก = 120 − 98 = 22`],competitionTip:`เนื่องจากค่าเฉลี่ย "ลดลง" หลังเอาออก ตัวเลขที่ถูกเอาออกต้อง "สูงกว่า" ค่าเฉลี่ยเดิม (15) — 22 สอดคล้องกับการตรวจนี้`,commonMistake:`ลบค่าเฉลี่ยทั้งสอง (15 − 14 = 1) แล้วเข้าใจผิดว่าผลต่างเล็กน้อยนั้นคือตัวเลขที่ถูกเอาออก`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M5-B-15`,mockSet:5,section:`B`,questionNumber:15,marks:4,difficulty:`competition`,topic:`Speed, Distance & Time`,subskill:`moving apart in opposite directions`,type:`mc`,en:{question:`Two cyclists start from the same point at the same time, one heading north at 18 km/h and the other heading south at 24 km/h. After 2.5 hours, how far apart are they?`,options:[`90`,`95`,`105`,`100`,`110`],hint1:`Since they move in opposite directions, the distance between them grows at their COMBINED speed.`,hint2:`Multiply the combined speed by the time.`,quickIdea:`For two objects starting together and moving apart in opposite directions, distance apart = combined speed × time.`,steps:[`Combined speed = 18 + 24 = 42 km/h.`,`Distance apart = 42 × 2.5 = 105 km.`],competitionTip:`This is the mirror image of a "moving toward each other" problem — both use combined speed, but one closes a gap and the other opens one.`,commonMistake:`Subtracting the speeds (24 − 18 = 6) as if they were moving in the same direction, instead of adding them.`},th:{question:`นักปั่นจักรยานสองคนออกจากจุดเดียวกันในเวลาเดียวกัน คนหนึ่งมุ่งหน้าเหนือด้วยความเร็ว 18 กม./ชม. อีกคนมุ่งหน้าใต้ด้วยความเร็ว 24 กม./ชม. หลังจาก 2.5 ชั่วโมง ทั้งสองห่างกันเท่าไร`,options:[`90`,`95`,`105`,`100`,`110`],hint1:`เนื่องจากเคลื่อนที่คนละทิศทาง ระยะห่างระหว่างทั้งสองจะเพิ่มขึ้นด้วยความเร็วรวม`,hint2:`นำความเร็วรวมคูณด้วยเวลา`,quickIdea:`สำหรับวัตถุสองชิ้นที่เริ่มจากจุดเดียวกันแล้วเคลื่อนที่ห่างกันคนละทิศทาง ระยะห่าง = ความเร็วรวม × เวลา`,steps:[`ความเร็วรวม = 18 + 24 = 42 กม./ชม.`,`ระยะห่าง = 42 × 2.5 = 105 กม.`],competitionTip:`นี่คือภาพสะท้อนของโจทย์ "เคลื่อนที่เข้าหากัน" ทั้งคู่ใช้ความเร็วรวม แต่แบบหนึ่งปิดระยะ อีกแบบเปิดระยะ`,commonMistake:`ลบความเร็ว (24 − 18 = 6) เหมือนเคลื่อนที่ทิศทางเดียวกัน แทนที่จะบวกกัน`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M5-B-16`,mockSet:5,section:`B`,questionNumber:16,marks:4,difficulty:`competition`,topic:`Perimeter`,subskill:`total perimeter after cutting a shape apart`,type:`mc`,en:{question:`A square of side 12 cm is cut into 4 identical smaller squares (one cut horizontally and one cut vertically through the middle). What is the SUM of the perimeters of all 4 small squares?`,options:[`48`,`72`,`108`,`120`,`96`],hint1:`Find the side length of one small square first.`,hint2:`Find the perimeter of one small square, then multiply by 4.`,quickIdea:`Cutting a shape apart INCREASES the total perimeter, since the new cut edges become boundary for the new pieces.`,steps:[`Each small square has side 12 ÷ 2 = 6 cm.`,`Perimeter of one small square = 4 × 6 = 24 cm.`,`Sum of all 4 perimeters = 4 × 24 = 96 cm.`],whyOthersFail:`The original square’s perimeter was only 48 cm — cutting it apart DOUBLES the total perimeter to 96 cm, since every new cut line becomes boundary twice (once for each adjacent piece).`,competitionTip:`This is the opposite of the "joining shapes loses perimeter" rule — cutting a shape apart always gains perimeter, for the same reason in reverse.`,commonMistake:`Assuming the total perimeter stays the same as the original square (48 cm) since "no material is added or removed."`},th:{question:`สี่เหลี่ยมจัตุรัสด้าน 12 ซม. ถูกตัดเป็นสี่เหลี่ยมจัตุรัสเล็กเหมือนกัน 4 รูป (ตัดหนึ่งครั้งแนวนอนและหนึ่งครั้งแนวตั้งผ่านกลาง) ผลรวมเส้นรอบรูปของสี่เหลี่ยมเล็กทั้ง 4 รูปคือเท่าไร`,options:[`48`,`72`,`108`,`120`,`96`],hint1:`หาความยาวด้านของสี่เหลี่ยมเล็กหนึ่งรูปก่อน`,hint2:`หาเส้นรอบรูปของสี่เหลี่ยมเล็กหนึ่งรูป แล้วคูณด้วย 4`,quickIdea:`การตัดรูปทรงออกจากกันทำให้เส้นรอบรูปรวมเพิ่มขึ้นเสมอ เพราะขอบที่ตัดใหม่กลายเป็นขอบเขตของชิ้นใหม่`,steps:[`สี่เหลี่ยมเล็กแต่ละรูปมีด้าน 12 ÷ 2 = 6 ซม.`,`เส้นรอบรูปของสี่เหลี่ยมเล็กหนึ่งรูป = 4 × 6 = 24 ซม.`,`ผลรวมเส้นรอบรูปทั้ง 4 รูป = 4 × 24 = 96 ซม.`],whyOthersFail:`เส้นรอบรูปเดิมของสี่เหลี่ยมใหญ่มีเพียง 48 ซม. การตัดออกจากกันทำให้เส้นรอบรูปรวมเพิ่มเป็นสองเท่าเป็น 96 ซม. เพราะเส้นตัดใหม่ทุกเส้นกลายเป็นขอบเขตสองครั้ง (ครั้งละหนึ่งชิ้นที่ติดกัน)`,competitionTip:`นี่คือด้านตรงข้ามของกฎ "รวมรูปแล้วเส้นรอบรูปลด" การตัดรูปออกจากกันทำให้เส้นรอบรูปเพิ่มเสมอ ด้วยเหตุผลย้อนกลับ`,commonMistake:`สมมติว่าเส้นรอบรูปรวมเท่าเดิมกับสี่เหลี่ยมเดิม (48 ซม.) เพราะ "ไม่มีวัสดุเพิ่มหรือหายไป"`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M5-B-17`,mockSet:5,section:`B`,questionNumber:17,marks:4,difficulty:`competition`,topic:`Area`,subskill:`area by subtraction with a triangular notch`,type:`mc`,en:{question:`A rectangle 16 cm by 10 cm has a triangular notch cut from the middle of one long side, with the triangle having a base of 6 cm (along the rectangle’s edge) and a height of 4 cm (extending inward). What is the area of the remaining shape?`,options:[`148`,`136`,`142`,`154`,`160`],hint1:`Find the area of the whole rectangle, and the area of the triangular notch, separately.`,hint2:`Subtract the notch’s area from the rectangle’s area.`,quickIdea:`Remaining area = whole shape’s area − the area of the removed piece.`,steps:[`Rectangle area = 16 × 10 = 160 cm².`,`Triangle notch area = ½ × 6 × 4 = 12 cm².`,`Remaining area = 160 − 12 = 148 cm².`],competitionTip:`Whenever a "notch" or "bite" is cut from a shape, the subtraction method applies — find both areas, then subtract.`,commonMistake:`Forgetting the ½ in the triangle area formula, using 6 × 4 = 24 instead of 12.`},th:{question:`สี่เหลี่ยมผืนผ้าขนาด 16 ซม. × 10 ซม. ถูกตัดรอยหยักรูปสามเหลี่ยมออกจากกลางด้านยาวด้านหนึ่ง สามเหลี่ยมมีฐาน 6 ซม. (ตามขอบสี่เหลี่ยม) และสูง 4 ซม. (ยื่นเข้าไปด้านใน) พื้นที่ของรูปที่เหลือคือเท่าไร`,options:[`148`,`136`,`142`,`154`,`160`],hint1:`หาพื้นที่สี่เหลี่ยมทั้งหมดและพื้นที่รอยหยักสามเหลี่ยมแยกกันก่อน`,hint2:`ลบพื้นที่รอยหยักออกจากพื้นที่สี่เหลี่ยม`,quickIdea:`พื้นที่ที่เหลือ = พื้นที่รูปทั้งหมด − พื้นที่ส่วนที่ถูกตัดออก`,steps:[`พื้นที่สี่เหลี่ยม = 16 × 10 = 160 ตร.ซม.`,`พื้นที่รอยหยักสามเหลี่ยม = ½ × 6 × 4 = 12 ตร.ซม.`,`พื้นที่ที่เหลือ = 160 − 12 = 148 ตร.ซม.`],competitionTip:`เมื่อ "รอยหยัก" หรือส่วนที่ถูกกัดออกจากรูป ใช้วิธีลบเสมอ หาพื้นที่ทั้งสองแล้วลบกัน`,commonMistake:`ลืม ½ ในสูตรพื้นที่สามเหลี่ยม ใช้ 6 × 4 = 24 แทนที่จะเป็น 12`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M5-B-18`,mockSet:5,section:`B`,questionNumber:18,marks:4,difficulty:`competition`,topic:`Angles & Triangles`,subskill:`exterior angle combined with isosceles triangle`,type:`mc`,en:{question:`Triangle DEF is isosceles with DE = DF. The exterior angle at F measures 130°. What is the size of angle D (the apex)?`,options:[`70`,`80`,`75`,`85`,`90`],hint1:`Find the interior angle at F first, using the exterior angle.`,hint2:`Since DE = DF, the base angles at E and F are equal.`,quickIdea:`Combine the exterior-angle rule with the isosceles base-angle rule, one step at a time.`,steps:[`Interior angle F = 180° − 130° = 50°.`,`Since DE = DF, angle E = angle F = 50°.`,`Angle D = 180° − 50° − 50° = 80°.`],competitionTip:`When a problem combines two rules (exterior angle + isosceles), apply them one at a time and don’t try to skip a step.`,commonMistake:`Using the exterior angle (130°) directly as the base angle E, instead of first converting it to the interior angle at F.`},th:{question:`สามเหลี่ยม DEF เป็นหน้าจั่วโดย DE = DF มุมภายนอกที่ F มีขนาด 130° มุม D (มุมยอด) มีขนาดเท่าไร`,options:[`70`,`80`,`75`,`85`,`90`],hint1:`หามุมภายในที่ F ก่อน โดยใช้มุมภายนอก`,hint2:`เนื่องจาก DE = DF มุมฐานที่ E และ F เท่ากัน`,quickIdea:`รวมกฎมุมภายนอกกับกฎมุมฐานหน้าจั่วเข้าด้วยกัน ทำทีละขั้น`,steps:[`มุมภายใน F = 180° − 130° = 50°`,`เนื่องจาก DE = DF มุม E = มุม F = 50°`,`มุม D = 180° − 50° − 50° = 80°`],competitionTip:`เมื่อโจทย์รวมสองกฎเข้าด้วยกัน (มุมภายนอก + หน้าจั่ว) ให้ใช้ทีละขั้น อย่าข้ามขั้นตอน`,commonMistake:`ใช้มุมภายนอก (130°) เป็นมุมฐาน E โดยตรง แทนที่จะแปลงเป็นมุมภายใน F ก่อน`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M5-B-19`,mockSet:5,section:`B`,questionNumber:19,marks:4,difficulty:`competition`,topic:`Grid Paths`,subskill:`shortest paths avoiding two blocked points`,type:`mc`,en:{question:`On a grid, moving only RIGHT or UP, how many shortest paths are there from (0,0) to (4,4) that avoid BOTH point (1,1) AND point (3,3)?`,options:[`10`,`12`,`16`,`14`,`18`],hint1:`First find the total number of paths, and the number passing through each blocked point separately.`,hint2:`Since a path could pass through BOTH points, use the "add both, subtract what’s counted twice" rule to avoid double-subtracting.`,quickIdea:`Paths avoiding two points = total − (through point 1) − (through point 2) + (through both, added back once).`,steps:[`Total paths (0,0)→(4,4): C(8,4) = 70.`,`Paths through (1,1): C(2,1) × C(6,3) = 2 × 20 = 40. Paths through (3,3): C(6,3) × C(2,1) = 20 × 2 = 40.`,`Paths through BOTH (any path reaching (3,3) after (1,1) automatically could pass through both): (0,0)→(1,1)→(3,3)→(4,4) = 2 × C(4,2) × 2 = 2 × 6 × 2 = 24.`,`Paths through either point = 40 + 40 − 24 = 56. Paths avoiding both = 70 − 56 = 14.`],competitionTip:`When avoiding TWO points, always check whether a path could pass through both — if so, you need inclusion-exclusion, not simple subtraction twice.`,commonMistake:`Computing 70 − 40 − 40 = −10 (subtracting both point-counts directly), which double-subtracts the paths that go through both points.`},th:{question:`บนตาราง เคลื่อนที่ได้เฉพาะขวาหรือขึ้น มีเส้นทางสั้นที่สุดจาก (0,0) ไป (4,4) กี่เส้นทางที่หลีกเลี่ยงทั้งจุด (1,1) และจุด (3,3)`,options:[`10`,`12`,`16`,`14`,`18`],hint1:`หาจำนวนเส้นทางทั้งหมดก่อน และจำนวนที่ผ่านแต่ละจุดที่ถูกปิดกั้นแยกกัน`,hint2:`เนื่องจากเส้นทางหนึ่งอาจผ่านทั้งสองจุด ใช้กฎ "บวกทั้งสอง ลบส่วนที่นับซ้ำ" เพื่อไม่ให้ลบซ้ำ`,quickIdea:`เส้นทางที่หลีกเลี่ยงสองจุด = ทั้งหมด − (ผ่านจุด1) − (ผ่านจุด2) + (ผ่านทั้งสองจุด บวกกลับหนึ่งครั้ง)`,steps:[`เส้นทางทั้งหมด (0,0)→(4,4): C(8,4) = 70`,`เส้นทางที่ผ่าน (1,1): C(2,1) × C(6,3) = 2 × 20 = 40 เส้นทางที่ผ่าน (3,3): C(6,3) × C(2,1) = 20 × 2 = 40`,`เส้นทางที่ผ่านทั้งสองจุด (เส้นทางที่ไปถึง(3,3)หลัง(1,1)อาจผ่านทั้งคู่): (0,0)→(1,1)→(3,3)→(4,4) = 2 × C(4,2) × 2 = 2 × 6 × 2 = 24`,`เส้นทางที่ผ่านจุดใดจุดหนึ่ง = 40 + 40 − 24 = 56 เส้นทางที่หลีกเลี่ยงทั้งสอง = 70 − 56 = 14`],competitionTip:`เมื่อหลีกเลี่ยงสองจุด ตรวจสอบเสมอว่าเส้นทางอาจผ่านทั้งคู่ได้หรือไม่ ถ้าใช่ต้องใช้หลักการรวม-แยก ไม่ใช่ลบตรงๆสองครั้ง`,commonMistake:`คำนวณ 70 − 40 − 40 = −10 (ลบจำนวนที่ผ่านแต่ละจุดตรงๆ) ซึ่งลบเส้นทางที่ผ่านทั้งสองจุดซ้ำสองครั้ง`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M5-B-20`,mockSet:5,section:`B`,questionNumber:20,marks:4,difficulty:`competition`,topic:`Logic & Elimination`,subskill:`multi-clue positional deduction`,type:`mc`,en:{question:`Four houses in a row are painted red, blue, green, and yellow (one color each). The green house is at the leftmost (1st) position. The red house is immediately to the left of the blue house. The yellow house is NOT next to the green house. In which position (from the left) is the yellow house?`,options:[`2nd`,`1st`,`4th`,`3rd`,`Cannot be determined`],hint1:`Green is fixed at position 1 — figure out where red and blue can go among the remaining positions.`,hint2:`Test each possible red-blue placement against the "yellow not next to green" clue.`,quickIdea:`Fix every directly-stated position first, then test the remaining possibilities against the leftover clues one at a time.`,steps:[`Green = position 1. Positions 2, 3, 4 remain for red, blue, yellow.`,`Red is immediately left of blue, so (red, blue) could be (2,3) or (3,4).`,`If (red,blue) = (2,3): yellow = 4th, which is NOT next to green (1st) — this works.`,`If (red,blue) = (3,4): yellow = 2nd, which IS next to green (1st) — this breaks the clue, so it’s invalid.`,`Only the first case works: yellow is in the 4th position.`],competitionTip:`For positional-logic puzzles, test every remaining valid arrangement against ALL the clues — don’t stop at the first arrangement that satisfies just one clue.`,commonMistake:`Stopping after finding ONE arrangement that satisfies the red-blue clue, without checking it against the "yellow not next to green" clue too.`},th:{question:`บ้านสี่หลังเรียงกันทาสีแดง น้ำเงิน เขียว และเหลือง (สีละหลัง) บ้านสีเขียวอยู่ตำแหน่งซ้ายสุด (ที่1) บ้านสีแดงอยู่ถัดจากบ้านสีน้ำเงินไปทางซ้ายทันที บ้านสีเหลืองไม่อยู่ติดกับบ้านสีเขียว บ้านสีเหลืองอยู่ตำแหน่งใด (นับจากซ้าย)`,options:[`ที่2`,`ที่1`,`ที่4`,`ที่3`,`ไม่สามารถระบุได้`],hint1:`เขียวอยู่ตำแหน่ง1แน่นอนแล้ว หาว่าแดงและน้ำเงินอยู่ตำแหน่งใดได้บ้างในที่เหลือ`,hint2:`ทดสอบตำแหน่งแดง-น้ำเงินที่เป็นไปได้แต่ละแบบกับเงื่อนไข "เหลืองไม่ติดกับเขียว"`,quickIdea:`กำหนดตำแหน่งที่ระบุแน่ชัดทุกตำแหน่งก่อน แล้วทดสอบความเป็นไปได้ที่เหลือกับเงื่อนไขที่เหลือทีละข้อ`,steps:[`เขียว = ตำแหน่ง1 ตำแหน่ง2, 3, 4 เหลือสำหรับแดง น้ำเงิน เหลือง`,`แดงอยู่ถัดจากน้ำเงินไปทางซ้ายทันที ดังนั้น (แดง,น้ำเงิน) อาจเป็น (2,3) หรือ (3,4)`,`ถ้า (แดง,น้ำเงิน) = (2,3): เหลือง = ที่4 ซึ่งไม่ติดกับเขียว (ที่1) — ใช้ได้`,`ถ้า (แดง,น้ำเงิน) = (3,4): เหลือง = ที่2 ซึ่งติดกับเขียว (ที่1) — ขัดเงื่อนไข จึงใช้ไม่ได้`,`มีเพียงกรณีแรกที่ใช้ได้: เหลืองอยู่ตำแหน่งที่4`],competitionTip:`สำหรับปริศนาตรรกะตำแหน่ง ทดสอบทุกการจัดที่เหลือกับเงื่อนไขทั้งหมด อย่าหยุดที่การจัดแรกที่ผ่านเพียงเงื่อนไขเดียว`,commonMistake:`หยุดหลังจากพบการจัดหนึ่งที่ผ่านเงื่อนไขแดง-น้ำเงิน โดยไม่ตรวจกับเงื่อนไข "เหลืองไม่ติดกับเขียว" ด้วย`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M5-C-21`,mockSet:5,section:`C`,questionNumber:21,marks:6,difficulty:`challenge`,topic:`Custom Operations`,subskill:`custom operation with exponents`,type:`free-response`,en:{question:`For any two positive integers a and b, define a ∘ b = aᵇ − bᵃ. Find the value of 2 ∘ 3. (Enter your answer, which may be negative.)`,hint1:`Substitute a = 2 and b = 3 directly into the definition — be careful which number gets the exponent.`,hint2:`Compute 2³ and 3² separately before subtracting.`,quickIdea:`Translate the symbol into ordinary arithmetic using the definition, keeping careful track of which value is the base and which is the exponent.`,steps:[`a = 2, b = 3, so a∘b = a^b − b^a = 2³ − 3².`,`2³ = 8. 3² = 9.`,`2∘3 = 8 − 9 = −1.`],competitionTip:`Custom operations with exponents are NOT symmetric — always double check which number is being raised to which power, using the definition’s exact order.`,commonMistake:`Computing 3² − 2³ (swapping the subtraction order) or 2^3 with 3 as the base by mistake.`},th:{question:`สำหรับจำนวนเต็มบวกสองจำนวน a และ b ใดๆ กำหนดให้ a ∘ b = aᵇ − bᵃ จงหาค่าของ 2 ∘ 3 (ตอบคำตอบซึ่งอาจเป็นลบได้)`,hint1:`แทน a = 2 และ b = 3 ลงในนิยามโดยตรง ระวังว่าตัวใดเป็นฐานตัวใดเป็นเลขชี้กำลัง`,hint2:`คำนวณ 2³ และ 3² แยกกันก่อนลบ`,quickIdea:`แปลงสัญลักษณ์เป็นเลขคณิตปกติตามนิยาม ติดตามอย่างระมัดระวังว่าตัวใดเป็นฐานตัวใดเป็นเลขชี้กำลัง`,steps:[`a = 2, b = 3, ดังนั้น a∘b = a^b − b^a = 2³ − 3²`,`2³ = 8, 3² = 9`,`2∘3 = 8 − 9 = −1`],competitionTip:`การดำเนินการที่คิดขึ้นใหม่ซึ่งมีเลขชี้กำลังไม่สมมาตร ตรวจสอบเสมอว่าตัวใดถูกยกกำลังด้วยตัวใด ตามลำดับที่นิยามกำหนดพอดี`,commonMistake:`คำนวณ 3² − 2³ (สลับลำดับการลบ) หรือใช้ 2^3 โดยให้ 3 เป็นฐานโดยไม่ตั้งใจ`},correctAnswer:`-1`,acceptedAnswers:[`-1`,`-1.0`],verificationStatus:`verified`},{id:`M5-C-22`,mockSet:5,section:`C`,questionNumber:22,marks:6,difficulty:`challenge`,topic:`Strategy Games`,subskill:`winning move with a third move-set variant`,type:`free-response`,en:{question:`Two players alternately remove 3 or 5 stones from a pile of 28 stones. The player who removes the last stone(s) wins. (A player who cannot move — because 0, 1, or 2 stones remain — loses.) If Player A goes first and both play perfectly, how many stones should A remove on the first turn — 3 or 5? (Enter 3 or 5.)`,hint1:`Build a Win/Lose table for small pile sizes, starting from 0, 1, and 2 stones (all losing, since no move is possible).`,hint2:`Find the repeating pattern in the losing positions before jumping to 28.`,quickIdea:`Build the Win/Lose table by hand, spot the repeating pattern, then apply it to the target pile size.`,steps:[`Building the table (L = losing for the player to move): L-positions occur at 0, 1, 2, 8, 9, 10, 16, 17, 18, 24, 25, 26 — a pattern of "remainder 0, 1, or 2 when divided by 8."`,`28 ÷ 8 = 3 remainder 4, so 28 is a Winning position — a good first move exists.`,`From 28, removing 3 leaves 25 (25 ÷ 8 remainder 1 — a Losing position for the opponent, good). Removing 5 leaves 23 (23 ÷ 8 remainder 7 — a Winning position for the opponent, bad).`,`So Player

}
function railHTML(){
  const p=prog(S.year);
  const chips=qs(S.year).map((q,i)=>{const s=p[q.n]||"";const mk=s==="c"?"✓":s==="w"?"✗":s==="r"?"•":"";
    return `<button class="chip" type="button" data-q="${i}" data-s="${s}" aria-current="${i===S.qi}" aria-label="${t("q")} ${q.n}">${q.n}<span class="m" aria-hidden="true">${mk}</span></button>`}).join("");
  return `<aside class="rail"><h3>${t("nav")}</h3><div class="chips">${chips}</div>
    <div class="legend"><span class="lc">${t("legC")}</span><span class="lw">${t("legW")}</span><span class="lr">${t("legR")}</span></div>${vocabHTML(S.year,qs(S.year)[S.qi].n)}</aside>`;
}
function img(id){return id&&IMGS[id]?`<div class="fig"><img src="${IMGS[id]}" alt=""></div>`:"";}
function qHTML(){
  const y=S.year,q=qs(y)[S.qi],n=q.n,key=sk(y,n),f=FIGS[y][n]||{};
  const all=q.steps.reduce((a,[l,h])=>{if(l===0)a.push({h,sub:[]});else if(a.length)a[a.length-1].sub.push(h);return a;},[]);
  const open=S.teacher||S.steps[key]||S.fb[key]==="ok";
  const fb=S.fb[key]; const st=prog(y)[n];
  let fbHTML="";
  if(fb==="ok") fbHTML=`<div class="fb ok" role="status"><span class="ic">✓</span><span>${t("okMsg")}</span></div>`;
  else if(fb==="bad") fbHTML=`<div class="fb bad" role="status"><span class="ic">✗</span><span>${t("badMsg")}</span></div>`;
  else if(fb==="empty") fbHTML=`<div class="fb bad" role="status"><span class="ic">!</span><span>${t(S.mode==="mc"?"pickFirst":"empty")}</span></div>`;
  else if(st==="r"&&!S.teacher) fbHTML=`<div class="fb" style="background:var(--mari-soft);border:1.5px solid var(--mari);color:var(--mari-ink)"><span class="ic">•</span><span>${t("revealNote")}</span></div>`;
  const fmt=h=>h.split(" · ").map(x=>`<span class="ln">${x.replace(/→/g,'<span class="ar">→</span>')}</span>`).join("");
  const steps=all.map(s=>`<li data-l="${t("stepL")}"><div>${fmt(s.h)}${s.sub.length?`<ul>${s.sub.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`:""}</div></li>`).join("");
  const last=S.qi===qs(y).length-1;
  return `<article class="sheet" aria-labelledby="qh">
    <div class="qtop"><h2 class="qnum" id="qh">${t("q")} ${n}</h2><span class="badge">${n<=10?t("secA"):t("secB")}</span></div>
    ${q.q.map(x=>`<p class="qtext">${esc(x)}</p>`).join("")}
    ${q.pre?`<pre class="pre">${esc(q.pre.replace(/\n+$/,""))}</pre>`:""}
    ${img(f.q)}
    <form class="answer" id="aform" autocomplete="off">
      ${S.mode==="mc"?optsHTML(y,n,key):`<label for="ans">${t("yourAns")}</label>
      <div class="arow"><input id="ans" inputmode="text" placeholder="${t("ph")}"><button class="btn" type="submit">${t("check")}</button></div>`}
      ${fbHTML}
    </form>
    ${open?`<section class="method">
      <h2 class="soltitle">${t("sol")}</h2>
      <div class="final"><span class="lbl">${t("ansIs")}:</span><span class="val">${esc(q.ans)}</span></div>
      <h3 class="mh">${esc(q.mt)}:</h3>
      ${img(f.m)}
      <ol class="steps">${steps}</ol>
      <div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span class="tl">${t("tip")}</span><div>${q.tip.replace(/→/g,"<b>→</b>")}</div></div>
    </section>`:`<div class="mbtns"><button class="btn ghost" type="button" id="all">${t("showSol")}</button></div>`}
    <div class="nav"><button class="btn ghost" type="button" id="prev" ${S.qi===0?"disabled":""}>← ${t("prev")}</button>
      <button class="btn" type="button" id="next">${last?t("finish"):t("next")+" →"}</button></div>
  </article>`;
}
function vocabHTML(y,n){
  const v=(VOCAB[y]||[])[n-1]||[]; if(!v.length) return "";
  const k=sk(y,n);
  return `<details class="vocab" data-k="${k}" ${S.vopen[k]?"open":""}><summary><h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>${t("vocabT")} <span class="vc">${t("q")} ${n}, ${v.length} ${t("words")}</span></h3><span class="vt">${S.vopen[k]?t("hide"):t("tapOpen")}</span></summary>
    <ul>${v.map(([w,th,en])=>`<li><span class="w">${esc(w)}</span><span>${S.lang==="th"?esc(th):esc(en)}</span>${S.lang==="en"?`<span class="th">(${esc(th)})</span>`:""}</li>`).join("")}</ul></details>`;
}
function vocabTabHTML(){
  const y=S.year;
  const rows=qs(y).map((q,i)=>((VOCAB[y]||[])[i]||[]).map(([w,th,en],j)=>`<tr>${j===0?`<td class="qn" rowspan="${VOCAB[y][i].length}"><button class="chip" type="button" data-goto="${i}" style="width:40px">${q.n}</button></td>`:""}<td class="w">${esc(w)}</td><td>${esc(th)}</td><td>${esc(en)}</td></tr>`).join("")).join("");
  return `<p style="margin:0 0 12px;color:var(--muted)">${t("vocabP")}</p><div class="vwrap"><table class="vtable"><thead><tr><th>${t("q")}</th><th>${t("vWord")}</th><th>${t("vTh")}</th><th>${t("vEn")}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function optsHTML(y,n,key){
  const [opts,ci]=CHOICES[y][n-1], pick=S.pick[key], wr=S.wrongs[key]||[], solved=S.fb[key]==="ok", reveal=S.teacher;
  const plain=opts.join("")==="ABCDE";
  const b=opts.map((o,i)=>{let c="";if((solved&&i===ci)||(reveal&&i===ci))c="ok";else if(wr.includes(i))c="no";
    return `<button type="button" class="opt ${c}" data-opt="${i}" aria-pressed="${pick===i&&!c}" ${c==="no"?"disabled":""}><span class="L">${LET[i]}</span>${plain?"":`<span class="v">${esc(o)}</span>`}</button>`}).join("");
  return `<span style="font-weight:700">${t("pickAns")}</span><div class="opts">${b}</div><div><button class="btn" type="submit">${t("check")}</button></div>`;
}
function tipsHTML(){
  return `<p style="margin:0 0 12px;color:var(--muted)">${t("tipsP")}</p><div class="list">${qs(S.year).map((q,i)=>`
    <button class="tiprow" type="button" data-goto="${i}"><span class="n">${q.n}</span><span>${q.tip}</span></button>`).join("")}</div>`;
}
function resultHTML(){
  const y=S.year,c=count(y),p=prog(y);
  const miss=qs(y).map((q,i)=>({q,i})).filter(o=>p[o.q.n]!=="c");
  const msg=c>=12?t("resGood"):c>=7?t("resMid"):t("resLow");
  return `<section class="result"><h2>${t("resT")}</h2>
    <div class="big">${c}<small> / 15</small></div><p style="margin:0;font-size:18px">${msg}</p>
    <div class="bar" aria-hidden="true"><span style="width:${c/15*100}%"></span></div>
    <h3 style="font-size:18px">${t("retryT")}</h3>
    ${miss.length?`<div class="rchips">${miss.map(o=>`<button class="chip" type="button" data-goto="${o.i}" data-s="${p[o.q.n]||""}">${o.q.n}</button>`).join("")}</div>`:`<p style="margin:0">${t("none")}</p>`}
    <div class="mbtns">${miss.length?`<button class="btn" type="button" data-goto="${miss[0].i}">${t("retry")}</button>`:""}
      <button class="btn ghost" type="button" id="back">${t("back")}</button>
      <button class="btn ghost" type="button" id="reset">${t("reset")}</button></div>
    ${S.confirm?`<div class="confirm"><span>${t("sure")}</span><button class="btn" type="button" id="yes">${t("yes")}</button><button class="btn ghost" type="button" id="no">${t("no")}</button></div>`:""}
  </section>`;
}
function openSet(y,tab){S.view="set";S.year=y;S.tab=tab||"practice";S.confirm=false;if(location.hash!=="#set-"+y)history.replaceState(null,"","#set-"+y);render();window.scrollTo(0,0);}
function goQ(i){S.tab="practice";S.qi=i;render();const sh=$(".sheet");if(sh&&sh.getBoundingClientRect().top<0)sh.scrollIntoView({block:"start"});}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const y=S.year,q=S.view==="set"?qs(y)[S.qi]:null,key=q?sk(y,q.n):null;
  if(b.dataset.mode){S.mode=b.dataset.mode;save();render();return;}
  if(b.dataset.opt){S.pick[key]=+b.dataset.opt;if(S.fb[key]!=="ok")S.fb[key]=null;render();return;}
  if(b.dataset.lang){S.lang=b.dataset.lang;save();render();return;}
  if(b.id==="teacher"){S.teacher=!S.teacher;render();return;}
  if(b.id==="home-btn"||b.id==="back"){S.view="home";history.replaceState(null,"",location.pathname+location.search);render();window.scrollTo(0,0);return;}
  if(b.dataset.open){openSet(b.dataset.open);return;}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.confirm=false;render();return;}
  if(b.dataset.q){S.qi=+b.dataset.q;render();return;}
  if(b.dataset.goto){goQ(+b.dataset.goto);return;}
  if(b.id==="all"){
    S.steps[key]=true;
    if(prog(y)[q.n]!=="c"){prog(y)[q.n]="r";S.fb[key]=null;save();}
    render();const m=$(".method");if(m)m.scrollIntoView({block:"nearest",behavior:"smooth"});return;}
  if(b.id==="prev"&&S.qi>0){goQ(S.qi-1);return;}
  if(b.id==="next"){if(S.qi<qs(y).length-1)goQ(S.qi+1);else{S.tab="result";render();window.scrollTo(0,0);}return;}
  if(b.id==="reset"){S.confirm=true;render();return;}
  if(b.id==="no"){S.confirm=false;render();return;}
  if(b.id==="yes"){S.prog[y]={};Object.keys(S.steps).forEach(k=>{if(k.startsWith(y+"-"))delete S.steps[k]});Object.keys(S.fb).forEach(k=>{if(k.startsWith(y+"-"))delete S.fb[k]});Object.keys(S.typed).forEach(k=>{if(k.startsWith(y+"-"))delete S.typed[k]});[S.pick,S.wrongs].forEach(o=>Object.keys(o).forEach(k=>{if(k.startsWith(y+"-"))delete o[k]}));S.confirm=false;save();render();return;}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("vocab")){S.vopen[d.dataset.k]=d.open;const v=d.querySelector(".vt");if(v)v.textContent=d.open?t("hide"):t("tapOpen");}},true);
document.addEventListener("input",e=>{if(e.target.id==="ans")S.typed[sk(S.year,qs(S.year)[S.qi].n)]=e.target.value;});
document.addEventListener("submit",e=>{
  e.preventDefault(); if(e.target.id!=="aform") return;
  const y=S.year,q=qs(y)[S.qi],key=sk(y,q.n);
  if(S.mode==="mc"){
    const p=S.pick[key]; if(p==null){S.fb[key]="empty";render();return;}
    const ok=p===CHOICES[y][q.n-1][1], cur=prog(y)[q.n];
    S.fb[key]=ok?"ok":"bad";
    if(ok){if(cur!=="r"&&!(S.wrongs[key]||[]).length)prog(y)[q.n]="c";}else{(S.wrongs[key]=S.wrongs[key]||[]).push(p);S.pick[key]=null;if(!cur)prog(y)[q.n]="w";}
    save();render();return;
  }
  const v=$("#ans").value;
  if(!v.trim()){S.fb[key]="empty";render();$("#ans").focus();return;}
  const ok=isRight(y,q.n,v); const cur=prog(y)[q.n];
  S.fb[key]=ok?"ok":"bad";
  if(ok&&cur!=="r")prog(y)[q.n]="c"; else if(!ok&&!cur)prog(y)[q.n]="w";
  save(); render(); const a=$("#ans"); if(a&&!ok)a.select();
});
function fromHash(){const m=location.hash.match(/^#set-(2020|2024|2025)$/);if(m)openSet(m[1]);else render();}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>

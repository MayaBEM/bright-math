 4 เศษ 6 หมายความว่า จำนวนข้อของกลุ่ม A = 4 × จำนวนข้อของกลุ่ม B + 6`},{en:`Substitute this into the sum equation to find both counts, then list the factors of each number to find the greatest one they share.`,th:`แทนค่านี้ลงในสมการผลรวมเพื่อหาจำนวนข้อของทั้งสองกลุ่ม แล้วหาตัวประกอบของแต่ละจำนวน เพื่อหาตัวประกอบร่วมที่มากที่สุด`}],visual:null,estimatedSeconds:70},{id:`E-06`,testId:`samsen-mock-e`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing Number Patterns`,th:`แบบรูปที่เพิ่มขึ้น`},difficulty:I(6),prompt:{en:`The exam-countdown board in Room 6/1 is covered with rows of sticky notes that grow larger each day. The picture shows Figure 3 of the pattern: Figure 1 has 1 row of 2 notes, Figure 2 has 2 rows of 2 and 4 notes, and Figure 3 (shown) has 3 rows of 2, 4, and 6 notes, for 12 notes total. Each new figure adds one more row, and each row has 2 more notes than the row before it. How many sticky notes will Figure 9 have?`,th:`บอร์ดนับถอยหลังก่อนสอบของห้อง 6/1 ติดสติกเกอร์โน้ตเป็นแถวที่ขยายใหญ่ขึ้นทุกวัน ภาพแสดงรูปที่ 3 ของแบบรูปนี้: รูปที่ 1 มี 1 แถว มีโน้ต 2 ใบ รูปที่ 2 มี 2 แถว มีโน้ต 2 และ 4 ใบ และรูปที่ 3 (ในภาพ) มี 3 แถว มีโน้ต 2, 4 และ 6 ใบ รวม 12 ใบ แต่ละรูปใหม่จะเพิ่มขึ้นอีก 1 แถว และแต่ละแถวจะมีโน้ตมากกว่าแถวก่อนหน้าอยู่ 2 ใบ รูปที่ 9 จะมีสติกเกอร์โน้ตกี่ใบ`},options:[{id:`A`,label:{en:`72`,th:`72`}},{id:`B`,label:{en:`110`,th:`110`}},{id:`C`,label:{en:`90`,th:`90`}},{id:`D`,label:{en:`48`,th:`48`}}],correctOptionId:`C`,explanation:{en:`Figure n has rows of 2, 4, 6, ..., 2n notes, so the total is 2+4+6+...+2n = n(n+1). Figure 9 has 9×10 = 90 sticky notes.`,th:`รูปที่ n มีแถวโน้ต 2, 4, 6, ..., 2n ใบ ดังนั้นผลรวมทั้งหมดคือ 2+4+6+...+2n = n(n+1) รูปที่ 9 จะมีสติกเกอร์โน้ต 9×10 = 90 ใบ`},distractorNotes:{A:{en:`72 is the count for Figure 8 (8×9), one figure too early.`,th:`72 คือจำนวนโน้ตของรูปที่ 8 (8×9) ซึ่งเร็วไปหนึ่งรูป`},B:{en:`110 is the count for Figure 10 (10×11), one figure too late.`,th:`110 คือจำนวนโน้ตของรูปที่ 10 (10×11) ซึ่งช้าไปหนึ่งรูป`},D:{en:`This assumes the pattern grows by a constant 6 notes each time (the last row added in Figure 3), giving 12 + 6×6 = 48, but the growth amount itself increases each time.`,th:`สมมติผิดว่าแบบรูปเพิ่มขึ้นครั้งละ 6 ใบคงที่ (จากแถวสุดท้ายที่เพิ่มในรูปที่ 3) จึงได้ 12 + 6×6 = 48 แต่จริง ๆ แล้วจำนวนที่เพิ่มขึ้นในแต่ละครั้งไม่คงที่`}},hints:[{en:`Look at how many notes are added each time you move to the next figure.`,th:`สังเกตว่าจำนวนโน้ตที่เพิ่มขึ้นในแต่ละรูปถัดไปเป็นเท่าไร`},{en:`The number of notes added each time itself increases by 2 (add 4, then add 6, then add 8, ...).`,th:`จำนวนที่เพิ่มขึ้นในแต่ละครั้งเองก็เพิ่มขึ้นทีละ 2 (เพิ่ม 4 แล้วเพิ่ม 6 แล้วเพิ่ม 8 ...)`},{en:`Continue the sequence 2, 6, 12, 20, 30, ... up to the 9th term, or use the formula n(n+1) with n = 9.`,th:`ไล่ลำดับ 2, 6, 12, 20, 30, ... ต่อไปจนถึงพจน์ที่ 9 หรือใช้สูตร n(n+1) แทน n = 9`}],visual:{kind:`gridPattern`,gridSize:6,cells:[{row:0,col:0},{row:0,col:1},{row:1,col:0},{row:1,col:1},{row:1,col:2},{row:1,col:3},{row:2,col:0},{row:2,col:1},{row:2,col:2},{row:2,col:3},{row:2,col:4},{row:2,col:5}],alt:{en:`Figure 3 of the growing sticky-note pattern, showing 12 shaded squares arranged in three rows of 2, 4, and 6 squares.`,th:`รูปที่ 3 ของแบบรูปสติกเกอร์โน้ตที่เพิ่มขึ้น แสดงสี่เหลี่ยมแรเงา 12 ช่อง เรียงเป็นสามแถว แถวละ 2, 4 และ 6 ช่อง`}},estimatedSeconds:75},{id:`E-07`,testId:`samsen-mock-e`,number:7,skill:`Word Problems & Logic`,topic:{en:`Speed, Distance & Time (Circular Track)`,th:`อัตราเร็ว ระยะทาง และเวลา (ลู่วิ่งวงกลม)`},difficulty:I(7),prompt:{en:`To calm their nerves on exam morning, Kai and Fon jog in OPPOSITE directions around a circular track, starting from the same point at the same time, at speeds of 180 m/min and 150 m/min. They meet again for the first time after 6 minutes. Find the length of the track.`,th:`เพื่อคลายความตื่นเต้นในเช้าวันสอบ ไกและฝนวิ่งจ๊อกกิ้งไปคนละทิศทางรอบลู่วิ่งวงกลม โดยเริ่มจากจุดเดียวกันในเวลาเดียวกัน ด้วยความเร็ว 180 เมตรต่อนาที และ 150 เมตรต่อนาที ตามลำดับ ทั้งสองคนพบกันครั้งแรกหลังจากผ่านไป 6 นาที ลู่วิ่งนี้มีความยาวเท่าใด`},options:[{id:`A`,label:{en:`1,080 m`,th:`1,080 เมตร`}},{id:`B`,label:{en:`900 m`,th:`900 เมตร`}},{id:`C`,label:{en:`180 m`,th:`180 เมตร`}},{id:`D`,label:{en:`1,980 m`,th:`1,980 เมตร`}}],correctOptionId:`D`,explanation:{en:`Since Kai and Fon jog in opposite directions around a loop, they meet when the distances they have covered together add up to one full lap. Combined speed = 180 + 150 = 330 m/min. In 6 minutes they cover 330 × 6 = 1,980 m together, so the track is 1,980 m long.`,th:`เนื่องจากไกและฝนวิ่งไปคนละทิศทางรอบลู่วิ่ง ทั้งสองจะพบกันเมื่อระยะทางที่วิ่งไปรวมกันเท่ากับความยาวลู่วิ่งพอดี 1 รอบ ความเร็วรวม = 180 + 150 = 330 เมตรต่อนาที ใน 6 นาที ทั้งสองวิ่งรวมกันได้ 330 × 6 = 1,980 เมตร ดังนั้นลู่วิ่งยาว 1,980 เมตร`},distractorNotes:{A:{en:`This is only Kai's distance (180 × 6), forgetting to add Fon's distance to complete the loop.`,th:`1,080 เมตร เป็นระยะทางที่ไกวิ่งได้เพียงคนเดียว (180 × 6) ลืมบวกระยะทางของฝนเพื่อให้ครบหนึ่งรอบ`},B:{en:`This is only Fon's distance (150 × 6), forgetting to add Kai's distance to complete the loop.`,th:`900 เมตร เป็นระยะทางที่ฝนวิ่งได้เพียงคนเดียว (150 × 6) ลืมบวกระยะทางของไกเพื่อให้ครบหนึ่งรอบ`},C:{en:`This uses the DIFFERENCE in their speeds (180 − 150) instead of the sum, as if one were chasing to catch up rather than meeting head-on.`,th:`180 เมตร ใช้ผลต่างของความเร็ว (180 − 150) แทนที่จะเป็นผลบวก ราวกับว่าคนหนึ่งกำลังวิ่งไล่ตามอีกคนแทนที่จะวิ่งสวนทางมาเจอกัน`}},hints:[{en:`Think about what "meeting for the first time" means when two people jog in opposite directions around a loop.`,th:`ลองคิดดูว่า "พบกันครั้งแรก" หมายความว่าอย่างไร เมื่อสองคนวิ่งไปคนละทิศทางรอบลู่วิ่ง`},{en:`When moving in opposite directions, the two people close the gap between them at a combined speed equal to the SUM of their speeds.`,th:`เมื่อวิ่งไปคนละทิศทาง ระยะห่างระหว่างสองคนจะลดลงด้วยอัตราเร็วรวมซึ่งเท่ากับผลบวกของความเร็วทั้งสอง`},{en:`Add the two speeds together to get the combined speed, then multiply by the meeting time to find the full length of the track.`,th:`นำความเร็วทั้งสองมาบวกกันเพื่อหาความเร็วรวม แล้วคูณด้วยเวลาที่พบกัน จะได้ความยาวลู่วิ่งทั้งหมด`}],visual:null,estimatedSeconds:90},{id:`E-08`,testId:`samsen-mock-e`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing in a Ratio`,th:`การแบ่งตามอัตราส่วน`},difficulty:I(8),prompt:{en:`Wan, Ohm, and Bee shared a good-luck gift fund from their teacher in the ratio 2 : 5 : 7. Bee received 250 baht more than Wan. Ohm then spent his share buying highlighter pens at 35 baht each. How many highlighter pens could Ohm buy, and how much money was left over?`,th:`วัน โอม และผึ้ง แบ่งเงินขวัญถุงจากคุณครูตามอัตราส่วน 2 : 5 : 7 ผึ้งได้รับเงินมากกว่าวันอยู่ 250 บาท จากนั้นโอมนำเงินส่วนของตนไปซื้อปากกาไฮไลต์ราคาด้ามละ 35 บาท โอมซื้อปากกาไฮไลต์ได้กี่ด้าม และเหลือเงินเท่าไร`},options:[{id:`A`,label:{en:`7 pens, with 5 baht left over`,th:`ปากกา 7 ด้าม เหลือเงิน 5 บาท`}},{id:`B`,label:{en:`2 pens, with 30 baht left over`,th:`ปากกา 2 ด้าม เหลือเงิน 30 บาท`}},{id:`C`,label:{en:`10 pens, with 0 baht left over`,th:`ปากกา 10 ด้าม เหลือเงิน 0 บาท`}},{id:`D`,label:{en:`35 pens, with 25 baht left over`,th:`ปากกา 35 ด้าม เหลือเงิน 25 บาท`}}],correctOptionId:`A`,explanation:{en:`Bee − Wan = 7 parts − 2 parts = 5 parts = 250 baht, so 1 part = 50 baht. Ohm's share = 5 parts = 5 × 50 = 250 baht. 250 ÷ 35 = 7 remainder 5, so Ohm can buy 7 highlighter pens with 5 baht left over.`,th:`ผึ้ง − วัน = 7 ส่วน − 2 ส่วน = 5 ส่วน = 250 บาท ดังนั้น 1 ส่วน = 50 บาท เงินส่วนของโอม = 5 ส่วน = 5 × 50 = 250 บาท นำ 250 ÷ 35 = 7 เศษ 5 ดังนั้นโอมซื้อปากกาไฮไลต์ได้ 7 ด้าม เหลือเงิน 5 บาท`},distractorNotes:{B:{en:`This uses Wan's share (2 parts = 100 baht) instead of Ohm's share.`,th:`ใช้ส่วนของวัน (2 ส่วน = 100 บาท) แทนที่จะเป็นส่วนของโอม`},C:{en:`This uses Bee's share (7 parts = 350 baht) instead of Ohm's share.`,th:`ใช้ส่วนของผึ้ง (7 ส่วน = 350 บาท) แทนที่จะเป็นส่วนของโอม`},D:{en:`This treats the 250-baht difference as equal to 1 ratio part instead of 5 parts, making Ohm's share far too large (5 × 250 = 1,250 baht).`,th:`เข้าใจผิดว่าผลต่าง 250 บาทเท่ากับ 1 ส่วนของอัตราส่วน แทนที่จะเป็น 5 ส่วน ทำให้คำนวณเงินของโอมมากเกินไป (5 × 250 = 1,250 บาท)`}},hints:[{en:`Work out how many ratio parts separate Bee and Wan, and what one part is worth in baht.`,th:`หาว่าผึ้งกับวันห่างกันกี่ส่วนของอัตราส่วน แล้วหาว่า 1 ส่วนมีค่ากี่บาท`},{en:`Bee has 7 parts and Wan has 2 parts, so the gap between them is 5 parts, not 1.`,th:`ผึ้งมี 7 ส่วน วันมี 2 ส่วน ดังนั้นผลต่างระหว่างทั้งสองคือ 5 ส่วน ไม่ใช่ 1 ส่วน`},{en:`Once you know the baht value of 1 part, find Ohm's share (5 parts), then divide by 35 to see how many pens he can buy and what remains.`,th:`เมื่อรู้ค่าของ 1 ส่วนเป็นบาทแล้ว หาส่วนของโอม (5 ส่วน) แล้วนำไปหารด้วย 35 เพื่อดูว่าซื้อปากกาได้กี่ด้ามและเหลือเงินเท่าไร`}],visual:null,estimatedSeconds:90},{id:`E-09`,testId:`samsen-mock-e`,number:9,skill:`Geometry & Angles`,topic:{en:`Angles & Exterior Angle Theorem`,th:`มุมภายนอกของสามเหลี่ยม`},difficulty:I(9),prompt:{en:`In the figure, l₁ ∥ l₂. Triangle ABC has vertex A on l₁, and side BC lies along l₂, extended to point D beyond C. The angle between l₁ and AB is 48°, and the exterior angle ACD is 126°. Find the size of angle BAC.`,th:`จากรูป l₁ ขนานกับ l₂ รูปสามเหลี่ยม ABC มีจุดยอด A อยู่บน l₁ และด้าน BC อยู่บนเส้น l₂ ซึ่งลากต่อไปถึงจุด D ที่อยู่เลยจุด C ออกไป มุมระหว่าง l₁ กับ AB เท่ากับ 48° และมุมภายนอก ACD เท่ากับ 126° จงหาขนาดของมุม BAC`},options:[{id:`A`,label:{en:`48°`,th:`48°`}},{id:`B`,label:{en:`78°`,th:`78°`}},{id:`C`,label:{en:`174°`,th:`174°`}},{id:`D`,label:{en:`54°`,th:`54°`}}],correctOptionId:`B`,explanation:{en:`Since l₁ ∥ l₂ and AB is a transversal, the angle between l₁ and AB (48°) equals angle ABC by alternate interior angles, so angle ABC = 48°. By the Exterior Angle Theorem, the exterior angle ACD equals the sum of the two remote interior angles: ACD = ABC + BAC, so 126° = 48° + BAC, giving BAC = 78°.`,th:`เนื่องจาก l₁ ขนานกับ l₂ และ AB เป็นเส้นตัด มุมระหว่าง l₁ กับ AB (48°) จะเท่ากับมุม ABC โดยสมบัติมุมแย้ง ดังนั้นมุม ABC = 48° ตามทฤษฎีมุมภายนอกของสามเหลี่ยม มุมภายนอก ACD จะเท่ากับผลบวกของมุมภายในที่ไม่ประชิดสองมุม: ACD = ABC + BAC จะได้ 126° = 48° + BAC ดังนั้น BAC = 78°`},distractorNotes:{A:{en:`This just repeats the given 48° (angle ABC) instead of applying the Exterior Angle Theorem to find angle BAC.`,th:`48° เป็นเพียงการนำมุมที่กำหนดให้ (มุม ABC) มาตอบซ้ำ โดยไม่ได้ใช้ทฤษฎีมุมภายนอกเพื่อหามุม BAC`},C:{en:`This adds the two given angles (126° + 48°) instead of subtracting, reversing the Exterior Angle Theorem relationship.`,th:`174° เกิดจากการนำมุมที่กำหนดทั้งสองมาบวกกัน (126° + 48°) แทนที่จะลบกัน ซึ่งสลับความสัมพันธ์ของทฤษฎีมุมภายนอก`},D:{en:`This treats angle BAC as simply supplementary to the exterior angle (180° − 126°), ignoring the Exterior Angle Theorem and the 48° angle entirely.`,th:`54° สมมติว่ามุม BAC เป็นมุมประกอบกับมุมภายนอกเพียง 180° − 126° โดยไม่ได้ใช้ทฤษฎีมุมภายนอกและไม่ได้ใช้มุม 48° เลย`}},hints:[{en:`Since l₁ ∥ l₂, use the alternate angle property to find angle ABC from the 48° angle given at A.`,th:`เนื่องจาก l₁ ขนานกับ l₂ ใช้สมบัติมุมแย้งเพื่อหามุม ABC จากมุม 48° ที่กำหนดไว้ที่จุด A`},{en:`Recall the Exterior Angle Theorem: an exterior angle of a triangle equals the sum of the two interior angles that are NOT next to it.`,th:`ทบทวนทฤษฎีมุมภายนอกของสามเหลี่ยม: มุมภายนอกของสามเหลี่ยมมีค่าเท่ากับผลบวกของมุมภายในสองมุมที่ไม่ประชิดกับมันนั้น`},{en:`Set 126° = angle ABC + angle BAC. Once you know angle ABC = 48°, solve for angle BAC.`,th:`ตั้งสมการ 126° = มุม ABC + มุม BAC เมื่อรู้มุม ABC = 48° แล้ว ให้แก้หามุม BAC`}],visual:{kind:`geometryFigure`,width:260,height:200,segments:[{x1:20,y1:30,x2:240,y2:30,ticks:1},{x1:20,y1:170,x2:240,y2:170,ticks:1},{x1:90,y1:30,x2:30,y2:170},{x1:90,y1:30,x2:150,y2:170}],points:[{x:90,y:30,label:`A`,labelOffset:[0,-10]},{x:30,y:170,label:`B`,labelOffset:[-14,10]},{x:150,y:170,label:`C`,labelOffset:[-4,14]},{x:220,y:170,label:`D`,labelOffset:[8,10]}],angleMarks:[{x:90,y:30,fromDeg:180,toDeg:228,radius:18,label:`48°`,color:`var(--coral)`},{x:90,y:30,fromDeg:228,toDeg:320,radius:26,label:`x`,color:`var(--gold)`},{x:150,y:170,fromDeg:0,toDeg:126,radius:20,label:`126°`,color:`var(--navy)`}],labels:[{x:30,y:24,text:`l₁`},{x:30,y:164,text:`l₂`}],alt:{en:`Two parallel lines l1 and l2, with triangle ABC having vertex A on l1 and side BC on l2 extended to point D. The 48-degree angle between l1 and AB is marked at A, and the 126-degree exterior angle ACD is marked at C.`,th:`เส้นขนานสองเส้น l1 และ l2 โดยรูปสามเหลี่ยม ABC มีจุดยอด A อยู่บน l1 และด้าน BC อยู่บน l2 ซึ่งลากต่อไปถึงจุด D มีมุม 48 องศาระหว่าง l1 กับ AB กำกับที่จุด A และมุมภายนอก ACD ขนาด 126 องศากำกับที่จุด C`}},estimatedSeconds:90},{id:`E-10`,testId:`samsen-mock-e`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Volume of a Cylinder`,th:`ปริมาตรทรงกระบอก`},difficulty:I(10),prompt:{en:`Two water-cooler tanks at the exam venue hold the same volume of water. Tank X has base radius 9 cm and is filled to a height of 20 cm. Tank Y has base radius 6 cm. What height is the water filled to in Tank Y?`,th:`ถังน้ำดื่มสองถังที่สนามสอบมีปริมาตรน้ำเท่ากัน ถัง X มีรัศมีฐาน 9 เซนติเมตร มีน้ำสูง 20 เซนติเมตร ถัง Y มีรัศมีฐาน 6 เซนติเมตร น้ำในถัง Y สูงเท่าใด`},options:[{id:`A`,label:{en:`30 cm`,th:`30 เซนติเมตร`}},{id:`B`,label:{en:`5 cm`,th:`5 เซนติเมตร`}},{id:`C`,label:{en:`45 cm`,th:`45 เซนติเมตร`}},{id:`D`,label:{en:`270 cm`,th:`270 เซนติเมตร`}}],correctOptionId:`C`,explanation:{en:`Equal volumes mean r₁²h₁ = r₂²h₂. So 9² × 20 = 6² × h₂, giving 1,620 = 36h₂, so h₂ = 45 cm.`,th:`ปริมาตรเท่ากันหมายความว่า r₁²h₁ = r₂²h₂ จะได้ 9² × 20 = 6² × h₂ นั่นคือ 1,620 = 36h₂ ดังนั้น h₂ = 45 เซนติเมตร`},distractorNotes:{A:{en:`This scales the height directly by the radius ratio (20 × \\frac{9}{6} = 30), but volume depends on the SQUARE of the radius, not a simple linear scaling.`,th:`30 เซนติเมตร ปรับความสูงตามอัตราส่วนรัศมีโดยตรง (20 × \\frac{9}{6} = 30) แต่ปริมาตรขึ้นอยู่กับรัศมียกกำลังสอง ไม่ใช่การปรับแบบเชิงเส้นตรง ๆ`},B:{en:`This forgets to square Tank X's radius when computing its volume (using 9 × 20 instead of 9² × 20), leading to 180 ÷ 36 = 5.`,th:`5 เซนติเมตร ลืมยกกำลังสองรัศมีของถัง X ตอนคำนวณปริมาตร (ใช้ 9 × 20 แทนที่จะเป็น 9² × 20) ทำให้ได้ 180 ÷ 36 = 5`},D:{en:`This forgets to square Tank Y's radius when solving for h₂ (dividing by 6 instead of 36), leading to 1,620 ÷ 6 = 270.`,th:`270 เซนติเมตร ลืมยกกำลังสองรัศมีของถัง Y ตอนแก้หา h₂ (หารด้วย 6 แทนที่จะเป็น 36) ทำให้ได้ 1,620 ÷ 6 = 270`}},hints:[{en:`Write the volume of each tank using the formula π × radius² × height.`,th:`เขียนปริมาตรของแต่ละถังโดยใช้สูตร π × รัศมี² × ความสูง`},{en:`Since the two volumes are equal, you can cancel π from both sides and set radius²×height equal for both tanks.`,th:`เนื่องจากปริมาตรทั้งสองเท่ากัน จึงตัด π ออกจากทั้งสองข้างได้ แล้วให้รัศมี²×ความสูงของถังทั้งสองเท่ากัน`},{en:`Solve 9² × 20 = 6² × h₂ for h₂, making sure both radii are squared before dividing.`,th:`แก้สมการ 9² × 20 = 6² × h₂ เพื่อหา h₂ โดยต้องยกกำลังสองรัศมีทั้งสองข้างก่อนแล้วจึงหาร`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:18,height:20,label:`Tank X`},{baseSide:12,height:45,heightLabel:`h`,label:`Tank Y`}],alt:{en:`Two cylindrical water tanks, Tank X with base radius 9 cm filled to height 20 cm, and Tank Y with base radius 6 cm filled to an unknown height h, holding the same volume of water.`,th:`ถังน้ำทรงกระบอกสองถัง ถัง X มีรัศมีฐาน 9 เซนติเมตร มีน้ำสูง 20 เซนติเมตร และถัง Y มีรัศมีฐาน 6 เซนติเมตร มีน้ำสูง h ที่ยังไม่ทราบค่า โดยมีปริมาตรน้ำเท่ากัน`}},estimatedSeconds:100},{id:`E-11`,testId:`samsen-mock-e`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area`,th:`พื้นที่รูปประกอบ`},difficulty:I(11),prompt:{en:`The design team is cutting a commemorative plaque for the exam hall from a rectangular sheet measuring 24 cm by 16 cm. A right-triangle corner with legs 6 cm and 5 cm is cut from one corner, and a right-triangle corner with legs 9 cm and 4 cm is cut from the opposite corner, as shown. What is the area of the remaining shaded plaque?`,th:`ทีมออกแบบกำลังตัดแผ่นป้ายที่ระลึกสำหรับสนามสอบจากแผ่นวัสดุรูปสี่เหลี่ยมผืนผ้าขนาด 24 × 16 เซนติเมตร โดยตัดมุมสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว 6 ซม. และ 5 ซม. ออกจากมุมหนึ่ง และตัดมุมสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว 9 ซม. และ 4 ซม. ออกจากมุมตรงข้าม ดังภาพ ชิ้นส่วนที่แรเงาที่เหลืออยู่มีพื้นที่เท่าใด`},options:[{id:`A`,label:{en:`369 cm²`,th:`369 ตร.ซม.`}},{id:`B`,label:{en:`366 cm²`,th:`366 ตร.ซม.`}},{id:`C`,label:{en:`318 cm²`,th:`318 ตร.ซม.`}},{id:`D`,label:{en:`351 cm²`,th:`351 ตร.ซม.`}}],correctOptionId:`D`,explanation:{en:`Rectangle area = 24×16 = 384 cm². The two triangle corners have areas ½×6×5 = 15 cm² and ½×9×4 = 18 cm². Remaining area = 384 − 15 − 18 = 351 cm².`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 24×16 = 384 ตร.ซม. มุมสามเหลี่ยมทั้งสองมีพื้นที่ ½×6×5 = 15 ตร.ซม. และ ½×9×4 = 18 ตร.ซม. พื้นที่ที่เหลือ = 384 − 15 − 18 = 351 ตร.ซม.`},distractorNotes:{A:{en:`This forgets to subtract the second triangle (9 cm by 4 cm): 384 − 15 = 369.`,th:`ลืมลบสามเหลี่ยมมุมที่สอง (9 ซม. และ 4 ซม.) ออก: 384 − 15 = 369`},B:{en:`This forgets to subtract the first triangle (6 cm by 5 cm): 384 − 18 = 366.`,th:`ลืมลบสามเหลี่ยมมุมแรก (6 ซม. และ 5 ซม.) ออก: 384 − 18 = 366`},C:{en:`This uses base × height instead of ½ × base × height for both triangle areas: 384 − 30 − 36 = 318.`,th:`ใช้ฐาน × สูง แทนที่จะเป็น ½ × ฐาน × สูง สำหรับพื้นที่สามเหลี่ยมทั้งสองรูป: 384 − 30 − 36 = 318`}},hints:[{en:`First find the area of the full rectangle before any corners are cut.`,th:`หาพื้นที่ของสี่เหลี่ยมผืนผ้าทั้งแผ่นก่อนที่จะตัดมุมออก`},{en:`Each cut-off corner is a right triangle — its area is half the product of its two legs.`,th:`มุมที่ถูกตัดออกแต่ละมุมเป็นรูปสามเหลี่ยมมุมฉาก พื้นที่ของมันคือครึ่งหนึ่งของผลคูณด้านประกอบมุมฉากทั้งสองด้าน`},{en:`Subtract both triangle areas from the rectangle's area to get the shaded region.`,th:`นำพื้นที่สามเหลี่ยมทั้งสองรูปไปลบออกจากพื้นที่สี่เหลี่ยมผืนผ้า จะได้พื้นที่ส่วนที่แรเงา`}],visual:{kind:`geometryFigure`,width:240,height:160,showGrid:!0,gridStep:20,polygons:[{points:[[60,0],[240,0],[240,120],[150,160],[0,160],[0,50]],fill:`shaded`}],segments:[{x1:0,y1:0,x2:60,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:50,style:`dashed`},{x1:240,y1:120,x2:240,y2:160,style:`dashed`},{x1:150,y1:160,x2:240,y2:160,style:`dashed`}],labels:[{x:30,y:12,text:`6 cm`},{x:12,y:26,text:`5 cm`},{x:195,y:152,text:`9 cm`},{x:230,y:140,text:`4 cm`}],alt:{en:`A 24 cm by 16 cm rectangle with a right-triangle corner (6 cm by 5 cm) cut from the top-left and a right-triangle corner (9 cm by 4 cm) cut from the bottom-right, leaving a shaded hexagon.`,th:`สี่เหลี่ยมผืนผ้าขนาด 24 x 16 เซนติเมตร ถูกตัดมุมสามเหลี่ยมมุมฉาก (6 x 5 ซม.) ออกจากมุมบนซ้าย และตัดมุมสามเหลี่ยมมุมฉาก (9 x 4 ซม.) ออกจากมุมล่างขวา เหลือเป็นรูปหกเหลี่ยมที่แรเงา`}},estimatedSeconds:105},{id:`E-12`,testId:`samsen-mock-e`,number:12,skill:`Geometry & Angles`,topic:{en:`Angle Chasing with Algebra`,th:`การหามุมด้วยพีชคณิต`},difficulty:I(12),prompt:{en:`In the figure, l₁ ∥ l₂. A zig-zag corridor runs from point A on l₁ to point B on l₂, bending at point C between them. The angle between l₁ and AC is (4x − 8)°, the angle between l₂ and BC is (2x + 15)°, and angle ACB = 157°. Find the size of the angle between l₁ and AC.`,th:`จากรูป l₁ ขนานกับ l₂ ทางเดินหักมุมเริ่มจากจุด A บน l₁ หักมุมที่จุด C ซึ่งอยู่ระหว่างเส้นทั้งสอง แล้วไปสิ้นสุดที่จุด B บน l₂ มุมระหว่าง l₁ กับ AC เท่ากับ (4x − 8)° มุมระหว่าง l₂ กับ BC เท่ากับ (2x + 15)° และมุม ACB เท่ากับ 157° จงหาขนาดของมุมระหว่าง l₁ กับ AC`},options:[{id:`A`,label:{en:`92°`,th:`92°`}},{id:`B`,label:{en:`65°`,th:`65°`}},{id:`C`,label:{en:`25°`,th:`25°`}},{id:`D`,label:{en:`112°`,th:`112°`}}],correctOptionId:`A`,explanation:{en:`Using an auxiliary line through C parallel to l₁ and l₂, angle ACB equals the sum of the two given angles: (4x−8) + (2x+15) = 157, so 6x + 7 = 157, 6x = 150, x = 25. The angle between l₁ and AC is 4(25) − 8 = 92°.`,th:`โดยใช้เส้นเสริมขนานผ่านจุด C มุม ACB จะเท่ากับผลบวกของมุมที่กำหนดทั้งสองมุม: (4x−8) + (2x+15) = 157 จะได้ 6x + 7 = 157 นั่นคือ 6x = 150 ดังนั้น x = 25 มุมระหว่าง l₁ กับ AC คือ 4(25) − 8 = 92°`},distractorNotes:{B:{en:`This finds the angle at B, (2×25+15) = 65°, instead of the angle at A that was asked for.`,th:`หามุมที่จุด B ได้ (2×25+15) = 65° แต่โจทย์ถามหามุมที่จุด A ไม่ใช่มุมที่จุด B`},C:{en:`This gives the value of x (25) itself, not the angle measure that was asked for.`,th:`ตอบเป็นค่า x (25) เฉย ๆ ไม่ใช่ขนาดของมุมที่โจทย์ถาม`},D:{en:`This comes from a sign slip while combining the equation (treating +15 as −15), giving 6x − 23 = 157, x = 30, and 4(30) − 8 = 112°.`,th:`เกิดจากผิดพลาดเรื่องเครื่องหมายตอนรวมสมการ (ใช้ +15 เป็น −15) ทำให้ได้ 6x − 23 = 157, x = 30 และ 4(30) − 8 = 112°`}},hints:[{en:`As with a bent transversal between parallel lines, angle ACB equals the sum of the angle at A and the angle at B.`,th:`เช่นเดียวกับเส้นหักมุมระหว่างเส้นขนาน มุม ACB เท่ากับผลบวกของมุมที่ A และมุมที่ B`},{en:`Write the equation (4x−8) + (2x+15) = 157 and simplify to solve for x.`,th:`เขียนสมการ (4x−8) + (2x+15) = 157 แล้วจัดรูปเพื่อหาค่า x`},{en:`After finding x = 25, substitute it back into the expression (4x − 8), not (2x + 15) — read carefully which angle is being asked for.`,th:`เมื่อหา x = 25 ได้แล้ว ให้แทนกลับในนิพจน์ (4x − 8) ไม่ใช่ (2x + 15) — อ่านโจทย์ให้ดีว่าถามมุมไหน`}],visual:{kind:`geometryFigure`,width:260,height:200,segments:[{x1:20,y1:30,x2:240,y2:30,ticks:1},{x1:20,y1:170,x2:240,y2:170,ticks:1},{x1:128,y1:30,x2:90,y2:100},{x1:90,y1:100,x2:108,y2:170},{x1:60,y1:100,x2:130,y2:100,style:`dashed`}],points:[{x:128,y:30,label:`A`,labelOffset:[6,-8]},{x:108,y:170,label:`B`,labelOffset:[8,14]},{x:90,y:100,label:`C`,labelOffset:[-20,18]}],angleMarks:[{x:128,y:30,fromDeg:180,toDeg:254,radius:18,label:`(4x-8)°`,color:`var(--coral)`},{x:108,y:170,fromDeg:108,toDeg:180,radius:18,label:`(2x+15)°`,color:`var(--navy)`},{x:90,y:100,fromDeg:-72,toDeg:74,radius:22,label:`157°`,color:`var(--gold)`}],labels:[{x:30,y:24,text:`l₁`},{x:30,y:164,text:`l₂`}],alt:{en:`Two parallel lines l1 and l2 with a zig-zag corridor from A on l1 to B on l2 through bend point C, with angles (4x-8)° and (2x+15)° marked at A and B, and angle ACB marked as 157° at C.`,th:`เส้นขนานสองเส้น l1 และ l2 พร้อมทางเดินหักมุมจาก A บน l1 ไปยัง B บน l2 ผ่านจุดหักมุม C มีมุม (4x-8)° และ (2x+15)° กำกับที่จุด A และ B และมุม ACB กำกับเป็น 157° ที่จุด C`}},estimatedSeconds:130},{id:`E-13`,testId:`samsen-mock-e`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Concentric Circles`,th:`วงกลมร่วมศูนย์กลาง`},difficulty:I(13),prompt:{en:`Two circles share the same centre. The area of the shaded ring between them is 8 times the area of the inner circle. Find the ratio of the outer radius to the inner radius.`,th:`วงกลมสองวงมีจุดศูนย์กลางร่วมกัน พื้นที่วงแหวนที่แรเงาระหว่างวงกลมทั้งสองมีค่าเป็น 8 เท่าของพื้นที่วงกลมวงใน จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน`},options:[{id:`A`,label:{en:`8 : 1`,th:`8 : 1`}},{id:`B`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`C`,label:{en:`9 : 1`,th:`9 : 1`}},{id:`D`,label:{en:`1 : 3`,th:`1 : 3`}}],correctOptionId:`B`,explanation:{en:`Let the inner radius be r and outer radius R. Ring area = πR² − πr² = 8×πr², so R² − r² = 8r², giving R² = 9r². Taking the square root, R = 3r, so R : r = 3 : 1.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R พื้นที่วงแหวน = πR² − πr² = 8×πr² จะได้ R² − r² = 8r² ดังนั้น R² = 9r² ถอดรากที่สอง จะได้ R = 3r ดังนั้น R : r = 3 : 1`},distractorNotes:{A:{en:`This uses the area ratio (8) directly as the radius ratio, skipping the "+1" step and the square root entirely.`,th:`นำอัตราส่วนพื้นที่ (8) มาใช้เป็นอัตราส่วนรัศมีโดยตรง โดยข้ามขั้นตอนการบวก 1 และการถอดรากที่สองไปเลย`},C:{en:`This correctly finds R² : r² = 9 : 1 but forgets to take the square root to get the actual radius ratio.`,th:`หา R² : r² = 9 : 1 ได้ถูกต้อง แต่ลืมถอดรากที่สองเพื่อหาอัตราส่วนรัศมีที่แท้จริง`},D:{en:`This finds the correct numbers but writes the ratio backwards — inner to outer instead of outer to inner.`,th:`หาค่าได้ถูกต้องแต่เขียนอัตราส่วนกลับด้าน คือรัศมีวงในต่อวงนอก แทนที่จะเป็นวงนอกต่อวงใน`}},hints:[{en:`Write the ring's area as (outer circle area) − (inner circle area).`,th:`เขียนพื้นที่วงแหวนเป็น (พื้นที่วงกลมวงนอก) − (พื้นที่วงกลมวงใน)`},{en:`Since ring area = 8 × inner area, the outer circle's area must be 9 times the inner circle's area (ring + inner = outer).`,th:`เนื่องจากพื้นที่วงแหวน = 8 × พื้นที่วงใน พื้นที่วงกลมวงนอกจึงต้องเป็น 9 เท่าของพื้นที่วงใน (วงแหวน + วงใน = วงนอก)`},{en:`Area scales with the square of the radius, so if the area ratio is 9 : 1, the radius ratio is the square root of that: 3 : 1.`,th:`พื้นที่แปรผันตามรัศมียกกำลังสอง ดังนั้นถ้าอัตราส่วนพื้นที่เป็น 9 : 1 อัตราส่วนรัศมีคือรากที่สองของค่านั้น คือ 3 : 1`}],visual:{kind:`concentricCircles`,outerRadius:9,innerRadius:3,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles, outer radius R and inner radius r, with the ring between them shaded.`,th:`วงกลมร่วมศูนย์กลางสองวง รัศมีวงนอก R และรัศมีวงใน r โดยวงแหวนระหว่างวงกลมทั้งสองถูกแรเงา`}},estimatedSeconds:110},{id:`E-14`,testId:`samsen-mock-e`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Arc-Shaded Area`,th:`พื้นที่ที่แรเงาด้วยส่วนโค้ง`},difficulty:I(14),prompt:{en:`The student council is designing a square exam-survivor sticker with side length 28 cm. Two quarter-circle arcs, each with radius equal to the side length, are drawn inside the square from opposite corners, creating the shaded leaf shape shown. Using π ≈ \\frac{22}{7}, find the area of the shaded leaf.`,th:`สภานักเรียนกำลังออกแบบสติกเกอร์ที่ระลึก "รอดสอบ" รูปสี่เหลี่ยมจัตุรัสยาวด้านละ 28 เซนติเมตร มีการลากส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้น แต่ละเส้นมีรัศมีเท่ากับความยาวด้าน จากมุมตรงข้ามกันภายในสี่เหลี่ยมจัตุรัส เกิดเป็นรูปใบไม้ที่แรเงาดังภาพ กำหนด π ≈ \\frac{22}{7} จงหาพื้นที่รูปใบไม้ที่แรเงา`},options:[{id:`A`,label:{en:`616 cm²`,th:`616 ตร.ซม.`}},{id:`B`,label:{en:`168 cm²`,th:`168 ตร.ซม.`}},{id:`C`,label:{en:`448 cm²`,th:`448 ตร.ซม.`}},{id:`D`,label:{en:`1,232 cm²`,th:`1,232 ตร.ซม.`}}],correctOptionId:`C`,explanation:{en:`Each quarter circle has area ¼ × \\frac{22}{7} × 28² = 616 cm². The two quarter circles together cover the square once plus the leaf shape a second time, so leaf area = 616 + 616 − 784 = 448 cm².`,th:`ส่วนโค้งหนึ่งในสี่ของวงกลมแต่ละเส้นมีพื้นที่ ¼ × \\frac{22}{7} × 28² = 616 ตร.ซม. เมื่อรวมพื้นที่ของทั้งสองส่วนโค้งเข้าด้วยกัน จะครอบคลุมพื้นที่สี่เหลี่ยมจัตุรัสหนึ่งครั้ง บวกกับพื้นที่รูปใบไม้อีกครั้งหนึ่ง ดังนั้นพื้นที่ใบไม้ = 616 + 616 − 784 = 448 ตร.ซม.`},distractorNotes:{A:{en:`This is the area of just one quarter circle (616 cm²), not the combined leaf shape.`,th:`นี่คือพื้นที่ของส่วนโค้งหนึ่งในสี่ของวงกลมเพียงเส้นเดียว (616 ตร.ซม.) ไม่ใช่พื้นที่รูปใบไม้ที่รวมกัน`},B:{en:`This subtracts one quarter-circle area from the square (784 − 616 = 168) instead of combining both quarter-circles and subtracting the square once.`,th:`นำพื้นที่ส่วนโค้งหนึ่งในสี่ไปลบออกจากสี่เหลี่ยมจัตุรัส (784 − 616 = 168) แทนที่จะรวมพื้นที่ส่วนโค้งทั้งสองแล้วลบด้วยพื้นที่สี่เหลี่ยมจัตุรัสเพียงครั้งเดียว`},D:{en:`This adds the two quarter-circle areas (616 + 616 = 1,232) but forgets to subtract the square's area.`,th:`นำพื้นที่ส่วนโค้งทั้งสองมาบวกกัน (616 + 616 = 1,232) แต่ลืมลบด้วยพื้นที่สี่เหลี่ยมจัตุรัส`}},hints:[{en:`Start by finding the area of one quarter circle with radius 28 cm.`,th:`เริ่มจากหาพื้นที่ของส่วนโค้งหนึ่งในสี่ของวงกลมที่มีรัศมี 28 ซม.`},{en:`The two quarter circles overlap exactly in the leaf shape, and together they cover the whole square plus the leaf a second time.`,th:`ส่วนโค้งทั้งสองซ้อนทับกันพอดีตรงบริเวณรูปใบไม้ และเมื่อรวมกันจะครอบคลุมสี่เหลี่ยมจัตุรัสทั้งหมดบวกกับรูปใบไม้อีกครั้งหนึ่ง`},{en:`Leaf area = (quarter circle 1) + (quarter circle 2) − (square area).`,th:`พื้นที่ใบไม้ = (ส่วนโค้งที่ 1) + (ส่วนโค้งที่ 2) − (พื้นที่สี่เหลี่ยมจัตุรัส)`}],visual:{kind:`leafShape`,width:28,height:28,corners:`topLeft-bottomRight`,sideLabel:`28 cm`,alt:{en:`A 28 cm square with two quarter-circle arcs from opposite corners creating a shaded leaf shape in the middle.`,th:`สี่เหลี่ยมจัตุรัสด้านละ 28 เซนติเมตร มีส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้นจากมุมตรงข้ามกัน เกิดเป็นรูปใบไม้แรเงาตรงกลาง`}},estimatedSeconds:120},{id:`E-15`,testId:`samsen-mock-e`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a Remainder`,th:`เศษส่วนของส่วนที่เหลือ`},difficulty:I(15),prompt:{en:`The school's print shop has 300 ml of ink for printing exam papers. On Monday, \\frac{1}{4} of the ink is used. On Tuesday, \\frac{2}{5} of the remaining ink is used. How much ink is left after Tuesday?`,th:`ห้องพิมพ์เอกสารของโรงเรียนมีหมึกพิมพ์สำหรับพิมพ์ข้อสอบอยู่ 300 มิลลิลิตร วันจันทร์ใช้หมึกไป \\frac{1}{4} ของหมึกทั้งหมด วันอังคารใช้หมึกที่เหลืออยู่ไปอีก \\frac{2}{5} ของหมึกที่เหลือ หลังวันอังคาร เหลือหมึกอยู่กี่มิลลิลิตร`},options:[{id:`A`,label:{en:`90 ml`,th:`90 มิลลิลิตร`}},{id:`B`,label:{en:`225 ml`,th:`225 มิลลิลิตร`}},{id:`C`,label:{en:`15 ml`,th:`15 มิลลิลิตร`}},{id:`D`,label:{en:`135 ml`,th:`135 มิลลิลิตร`}}],correctOptionId:`D`,explanation:{en:`Monday's use = \\frac{1}{4} × 300 = 75 ml, leaving 300 − 75 = 225 ml. Tuesday's use = \\frac{2}{5} × 225 = 90 ml. Ink left = 225 − 90 = 135 ml.`,th:`หมึกที่ใช้วันจันทร์ = \\frac{1}{4} × 300 = 75 มิลลิลิตร เหลือหมึก 300 − 75 = 225 มิลลิลิตร หมึกที่ใช้วันอังคาร = \\frac{2}{5} × 225 = 90 มิลลิลิตร หมึกที่เหลือ = 225 − 90 = 135 มิลลิลิตร`},distractorNotes:{A:{en:`This gives only Tuesday's usage (90 ml), mistaking the amount USED for the amount LEFT.`,th:`90 มิลลิลิตร เป็นเพียงปริมาณหมึกที่ใช้ในวันอังคาร ไม่ใช่ปริมาณที่เหลืออยู่`},B:{en:`This gives the remainder after Monday only (225 ml), forgetting to subtract Tuesday's usage as well.`,th:`225 มิลลิลิตร เป็นปริมาณหมึกที่เหลือหลังวันจันทร์เท่านั้น ลืมลบปริมาณที่ใช้ในวันอังคารออกไปด้วย`},C:{en:`This gives the DIFFERENCE between the two days' usage (90 − 75 = 15) instead of the amount of ink left.`,th:`15 มิลลิลิตร เป็นผลต่างระหว่างปริมาณหมึกที่ใช้ในสองวัน (90 − 75 = 15) ไม่ใช่ปริมาณหมึกที่เหลืออยู่`}},hints:[{en:`Work out how much ink is used on Monday, and how much is left after Monday.`,th:`หาว่าใช้หมึกไปเท่าไรในวันจันทร์ และเหลือหมึกเท่าไรหลังจากวันจันทร์`},{en:`Tuesday's fraction (2/5) applies to what is LEFT after Monday, not to the original 300 ml.`,th:`เศษส่วนของวันอังคาร (2/5) ใช้กับหมึกที่เหลืออยู่หลังวันจันทร์ ไม่ใช่หมึกเดิม 300 มิลลิลิตร`},{en:`Subtract Tuesday's usage from the amount left after Monday to find the final amount of ink remaining.`,th:`นำปริมาณหมึกที่ใช้วันอังคารไปลบออกจากปริมาณที่เหลือหลังวันจันทร์ เพื่อหาปริมาณหมึกที่เหลืออยู่สุดท้าย`}],visual:null,estimatedSeconds:100},{id:`E-16`,testId:`samsen-mock-e`,number:16,skill:`Algebra & Patterns`,topic:{en:`Area Equations`,th:`สมการพื้นที่`},difficulty:I(16),prompt:{en:`Praew is folding exam-day care-package boxes from square sheets of cardboard with side length 32 cm. A small square of side x cm is cut from each of the four corners so the sheet can be folded into an open box. The remaining cross-shaped area (before folding) is 924 cm². Find x.`,th:`แพรวกำลังพับกล่องของขวัญวันสอบจากแผ่นกระดาษแข็งรูปสี่เหลี่ยมจัตุรัสยาวด้านละ 32 เซนติเมตร โดยตัดสี่เหลี่ยมจัตุรัสเล็กด้านยาว x เซนติเมตรออกจากทั้งสี่มุม เพื่อพับเป็นกล่องแบบเปิดฝา พื้นที่รูปกากบาทที่เหลืออยู่ (ก่อนพับ) เท่ากับ 924 ตารางเซนติเมตร จงหาค่าของ x`},options:[{id:`A`,label:{en:`5 cm`,th:`5 เซนติเมตร`}},{id:`B`,label:{en:`10 cm`,th:`10 เซนติเมตร`}},{id:`C`,label:{en:`25 cm`,th:`25 เซนติเมตร`}},{id:`D`,label:{en:`20 cm`,th:`20 เซนติเมตร`}}],correctOptionId:`A`,explanation:{en:`Remaining area = (side)² − 4x² = 1,024 − 4x² = 924. So 4x² = 100, x² = 25, and x = 5 cm.`,th:`พื้นที่ที่เหลือ = (ด้าน)² − 4x² = 1,024 − 4x² = 924 จะได้ 4x² = 100 นั่นคือ x² = 25 ดังนั้น x = 5 เซนติเมตร`},distractorNotes:{B:{en:`This forgets to divide by 4 before taking the square root, computing √100 = 10 directly instead of √25.`,th:`ลืมหารด้วย 4 ก่อนถอดรากที่สอง คำนวณ √100 = 10 โดยตรง แทนที่จะเป็น √25`},C:{en:`This correctly finds x² = 25 but forgets to take the square root, giving x² instead of x.`,th:`หา x² = 25 ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงตอบเป็น x² แทนที่จะเป็น x`},D:{en:`This comes from a division slip, such as dividing 100 by 5 instead of by 4.`,th:`เกิดจากการหารผิดพลาด เช่น นำ 100 ไปหารด้วย 5 แทนที่จะหารด้วย 4`}},hints:[{en:`Write the remaining cross-shaped area as the big square's area minus the four small corner squares.`,th:`เขียนพื้นที่รูปกากบาทที่เหลือเป็นพื้นที่สี่เหลี่ยมจัตุรัสใหญ่ลบด้วยสี่เหลี่ยมจัตุรัสเล็กทั้งสี่มุม`},{en:`Each corner square has area x², and there are 4 of them, so the total removed is 4x².`,th:`สี่เหลี่ยมจัตุรัสเล็กแต่ละมุมมีพื้นที่ x² และมีทั้งหมด 4 มุม ดังนั้นพื้นที่ที่ถูกตัดออกทั้งหมดคือ 4x²`},{en:`Solve 1,024 − 4x² = 924 for x², then remember to take the square root at the end to find x.`,th:`แก้สมการ 1,024 − 4x² = 924 เพื่อหา x² แล้วอย่าลืมถอดรากที่สองในขั้นตอนสุดท้ายเพื่อหาค่า x`}],visual:{kind:`geometryFigure`,width:192,height:192,polygons:[{points:[[30,0],[162,0],[162,30],[192,30],[192,162],[162,162],[162,192],[30,192],[30,162],[0,162],[0,30],[30,30]],fill:`shaded`}],labels:[{x:96,y:-4,text:`32 cm`,bold:!0},{x:10,y:19,text:`x`}],alt:{en:`A 32 cm square with a small square of side x cut from each corner, leaving a shaded cross shape.`,th:`สี่เหลี่ยมจัตุรัสด้านละ 32 เซนติเมตร ถูกตัดสี่เหลี่ยมจัตุรัสเล็กด้านยาว x ออกจากทุกมุม เหลือเป็นรูปกากบาทที่แรเงา`}},estimatedSeconds:135},{id:`E-17`,testId:`samsen-mock-e`,number:17,skill:`Graphs & Data`,topic:{en:`Reading Grouped Bar Charts`,th:`การอ่านกราฟแท่งกลุ่ม`},difficulty:I(17),prompt:{en:`The bar chart shows the number of mock exams completed by two Grade 6 homerooms, Room 6/1 and Room 6/2, during the four weeks leading up to the SAMSEN exam. Which of these statements is INCORRECT?`,th:`แผนภูมิแท่งแสดงจำนวนข้อสอบจำลองที่นักเรียนสองห้อง คือ ห้อง 6/1 และห้อง 6/2 ทำเสร็จในแต่ละสัปดาห์ตลอดสี่สัปดาห์ก่อนสอบ SAMSEN ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Week 2 had the highest combined (Room 6/1 + Room 6/2) mock-exam count of all four weeks.`,th:`สัปดาห์ที่ 2 มีจำนวนข้อสอบจำลองรวม (6/1 + 6/2) มากที่สุดในทั้งสี่สัปดาห์`}},{id:`B`,label:{en:`In Week 3, Room 6/1 completed more mock exams than Room 6/2.`,th:`ในสัปดาห์ที่ 3 ห้อง 6/1 ทำข้อสอบจำลองเสร็จมากกว่าห้อง 6/2`}},{id:`C`,label:{en:`Room 6/1's total mock-exam count across all four weeks was 80.`,th:`จำนวนข้อสอบจำลองรวมของห้อง 6/1 ตลอดสี่สัปดาห์เท่ากับ 80 ข้อ`}},{id:`D`,label:{en:`Room 6/2's average weekly mock-exam count was 20.`,th:`จำนวนข้อสอบจำลองเฉลี่ยต่อสัปดาห์ของห้อง 6/2 เท่ากับ 20 ข้อ`}}],correctOptionId:`B`,explanation:{en:`In Week 3, Room 6/1 completed 18 mock exams and Room 6/2 completed 22, so Room 6/2 actually completed more, not Room 6/1. This makes statement B the incorrect one; the other three statements all match the chart's data.`,th:`ในสัปดาห์ที่ 3 ห้อง 6/1 ทำข้อสอบจำลองเสร็จ 18 ข้อ และห้อง 6/2 ทำเสร็จ 22 ข้อ ดังนั้นห้อง 6/2 จึงทำเสร็จมากกว่า ไม่ใช่ห้อง 6/1 ทำให้ข้อความ B ไม่ถูกต้อง ส่วนข้อความอีกสามข้อสอดคล้องกับข้อมูลในแผนภูมิทั้งหมด`},distractorNotes:{A:{en:`This statement is actually true — Week 2's combined total (26+24=50) is the highest of all four weeks (30, 50, 40, 40), so it is not the answer.`,th:`ข้อความนี้เป็นจริง เพราะยอดรวมของสัปดาห์ที่ 2 (26+24=50) มากที่สุดในทั้งสี่สัปดาห์ (30, 50, 40, 40) จึงไม่ใช่คำตอบที่ถูกต้อง`},C:{en:`This statement is actually true — 14+26+18+22 = 80, so it is not the answer.`,th:`ข้อความนี้เป็นจริง เพราะ 14+26+18+22 = 80 จึงไม่ใช่คำตอบที่ถูกต้อง`},D:{en:`This statement is actually true — (16+24+22+18)÷4 = 80÷4 = 20, so it is not the answer.`,th:`ข้อความนี้เป็นจริง เพราะ (16+24+22+18)÷4 = 80÷4 = 20 จึงไม่ใช่คำตอบที่ถูกต้อง`}},hints:[{en:`Check each statement against the chart one at a time, starting with the easiest to verify.`,th:`ตรวจสอบข้อความแต่ละข้อเทียบกับแผนภูมิทีละข้อ เริ่มจากข้อที่ตรวจสอบง่ายที่สุดก่อน`},{en:`Pay close attention to Week 3 — compare the two bars carefully.`,th:`สังเกตสัปดาห์ที่ 3 ให้ดี เปรียบเทียบแท่งทั้งสองอย่างละเอียด`},{en:`In Week 3, read the exact height of the Room 6/1 bar and the Room 6/2 bar and compare which is really taller.`,th:`ในสัปดาห์ที่ 3 อ่านความสูงที่แท้จริงของแท่งห้อง 6/1 และแท่งห้อง 6/2 แล้วเปรียบเทียบว่าแท่งใดสูงกว่ากันจริง ๆ`}],visual:{kind:`barChart`,categories:[`Week 1`,`Week 2`,`Week 3`,`Week 4`],series:[{name:{en:`Room 6/1`,th:`ห้อง 6/1`},color:`coral`,values:[14,26,18,22]},{name:{en:`Room 6/2`,th:`ห้อง 6/2`},color:`teal`,values:[16,24,22,18]}],yStep:10,yMax:30,alt:{en:`Grouped bar chart of Room 6/1 and Room 6/2 mock-exam completions across four weeks.`,th:`แผนภูมิแท่งกลุ่มแสดงจำนวนข้อสอบจำลองที่ทำเสร็จของห้อง 6/1 และห้อง 6/2 ตลอดสี่สัปดาห์`}},estimatedSeconds:150},{id:`E-18`,testId:`samsen-mock-e`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Charts in Degrees`,th:`แผนภูมิวงกลมเป็นองศา`},difficulty:I(18),prompt:{en:`In a school-wide survey, students were asked what they plan to do right after finishing the SAMSEN exam. The pie chart shows the results by angle: Sleep 150°, Sports 70°, Gaming 100°, and Reading 40°. If 35 students chose Sports, how many students chose Gaming?`,th:`ในการสำรวจทั้งโรงเรียน นักเรียนถูกถามว่าจะทำอะไรทันทีหลังสอบ SAMSEN เสร็จ แผนภูมิวงกลมแสดงผลเป็นมุมองศา ได้แก่ นอนหลับ 150°, เล่นกีฬา 70°, เล่นเกม 100° และอ่านหนังสือ 40° ถ้ามีนักเรียน 35 คนเลือกเล่นกีฬา จะมีนักเรียนกี่คนที่เลือกเล่นเกม`},options:[{id:`A`,label:{en:`75 students`,th:`75 คน`}},{id:`B`,label:{en:`100 students`,th:`100 คน`}},{id:`C`,label:{en:`50 students`,th:`50 คน`}},{id:`D`,label:{en:`20 students`,th:`20 คน`}}],correctOptionId:`C`,explanation:{en:`Sports's slice is 70° and represents 35 students, so 70° = 35 students, meaning 1° = 0.5 student. Gaming's slice is 100°, so it represents 100 × 0.5 = 50 students.`,th:`มุมของเล่นกีฬาเท่ากับ 70° แทนนักเรียน 35 คน ดังนั้น 70° = 35 คน หมายความว่า 1° = 0.5 คน มุมของเล่นเกมเท่ากับ 100° ดังนั้นมีนักเรียน 100 × 0.5 = 50 คน`},distractorNotes:{A:{en:`This is the count for Sleep (150 × 0.5 = 75), from reading the wrong slice's angle by mistake.`,th:`นี่คือจำนวนนักเรียนของนอนหลับ (150 × 0.5 = 75) ซึ่งเกิดจากอ่านมุมของสไลซ์ผิดโดยไม่ตั้งใจ`},B:{en:`This uses the degree value itself (100) as the number of students, without converting degrees into a count at all.`,th:`นำค่าองศา (100) มาใช้เป็นจำนวนนักเรียนโดยตรง โดยไม่ได้แปลงจากองศาเป็นจำนวนคนเลย`},D:{en:`This is the count for Reading (40 × 0.5 = 20), from confusing Gaming's 100° with Reading's 40°.`,th:`นี่คือจำนวนนักเรียนของอ่านหนังสือ (40 × 0.5 = 20) ซึ่งเกิดจากสับสนระหว่างมุม 100° ของเล่นเกมกับมุม 40° ของอ่านหนังสือ`}},hints:[{en:`Use Sports's angle and count together to find how many students correspond to one degree.`,th:`ใช้มุมและจำนวนคนของเล่นกีฬาเพื่อหาว่า 1 องศาแทนนักเรียนกี่คน`},{en:`Once you know the value of 1 degree in students, you can convert any slice's angle into a count.`,th:`เมื่อรู้ค่าของ 1 องศาเป็นจำนวนคนแล้ว ก็สามารถแปลงมุมของสไลซ์ใดก็ได้ให้เป็นจำนวนคน`},{en:`Gaming's angle is 100°. Multiply 100 by the "students per degree" value you found from the Sports slice.`,th:`มุมของเล่นเกมคือ 100° นำ 100 ไปคูณกับค่า "จำนวนคนต่อ 1 องศา" ที่หาได้จากสไลซ์เล่นกีฬา`}],visual:{kind:`pieChart`,slices:[{label:`Sleep`,degrees:150,color:`coral`},{label:`Sports`,degrees:70,color:`sage`},{label:`Gaming`,degrees:100,color:`teal`},{label:`Reading`,degrees:40,color:`gold`}],alt:{en:`Pie chart of after-exam plans survey results: Sleep 150°, Sports 70°, Gaming 100°, Reading 40°.`,th:`แผนภูมิวงกลมแสดงผลสำรวจแผนหลังสอบ: นอนหลับ 150°, เล่นกีฬา 70°, เล่นเกม 100°, อ่านหนังสือ 40°`}},estimatedSeconds:160},{id:`E-19`,testId:`samsen-mock-e`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Profit & Loss Percentage`,th:`ร้อยละกำไรขาดทุน`},difficulty:I(19),prompt:{en:`A bookstore near the school bought SAMSEN prep guides for 250 baht each. The owner marked up the price to make a profit of 40%, but during exam-countdown week had to sell them at a 30% discount off the marked price. Find the shop's actual profit or loss on each guide.`,th:`ร้านหนังสือใกล้โรงเรียนซื้อคู่มือติวสอบ SAMSEN มาในราคาเล่มละ 250 บาท เจ้าของร้านตั้งราคาขายเพื่อให้ได้กำไร 40% แต่ในสัปดาห์นับถอยหลังก่อนสอบต้องลดราคา 30% จากราคาที่ตั้งไว้ จงหากำไรหรือขาดทุนที่ได้จริงต่อเล่ม`},options:[{id:`A`,label:{en:`a profit of 100 baht`,th:`กำไร 100 บาท`}},{id:`B`,label:{en:`a profit of 245 baht`,th:`กำไร 245 บาท`}},{id:`C`,label:{en:`a profit of 25 baht`,th:`กำไร 25 บาท`}},{id:`D`,label:{en:`a loss of 5 baht`,th:`ขาดทุน 5 บาท`}}],correctOptionId:`D`,explanation:{en:`Marked price = 250 × 1.4 = 350 baht. Selling price after a 30% discount = 350 × 0.7 = 245 baht. Since 245 < 250, this is a loss of 250 − 245 = 5 baht.`,th:`ราคาที่ตั้งไว้ = 250 × 1.4 = 350 บาท ราคาขายหลังลด 30% = 350 × 0.7 = 245 บาท เนื่องจาก 245 < 250 จึงเป็นการขาดทุน 250 − 245 = 5 บาท`},distractorNotes:{A:{en:`This only computes the intended 40% profit on the cost price (40% of 250 = 100), ignoring the later 30% discount entirely.`,th:`คำนวณเพียงกำไร 40% ที่ตั้งใจไว้จากราคาทุน (40% ของ 250 = 100) โดยไม่ได้นำส่วนลด 30% ในภายหลังมาคิดเลย`},B:{en:`This gives the final selling price itself (245 baht) as a "profit", forgetting to compare it against the 250-baht cost price and recognise it is actually less.`,th:`ตอบเป็นราคาขายสุดท้าย (245 บาท) โดยเรียกว่าเป็น "กำไร" โดยลืมเปรียบเทียบกับราคาทุน 250 บาท ซึ่งจริง ๆ แล้วน้อยกว่า`},C:{en:`This combines the percentages by simple subtraction (40% − 30% = 10%) and applies that directly to the cost price (10% of 250 = 25) as a profit, instead of applying the two percentage changes one after another.`,th:`รวมร้อยละโดยการลบกันตรง ๆ (40% − 30% = 10%) แล้วนำไปคิดกับราคาทุนโดยตรงเป็นกำไร (10% ของ 250 = 25) แทนที่จะคำนวณการเปลี่ยนแปลงร้อยละทั้งสองครั้งตามลำดับ`}},hints:[{en:`First find the marked price after adding the intended 40% profit to the cost price.`,th:`หาราคาที่ตั้งไว้ก่อน โดยบวกกำไรที่ตั้งใจไว้ 40% เข้ากับราคาทุน`},{en:`The 30% discount is taken off the MARKED price, not off the original cost price — apply the two percentages one after th

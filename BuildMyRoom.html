:root{
  --ink:#2D3A4F;--ink2:#56677D;--paper:#FFF9EE;--cream:#FCEFD6;--line:#EAD9B4;--wood:#E9BE82;
  --sky:#3E8FCB;--skyD:#2A6E9F;--honey:#F7B733;--honeyD:#D9921A;--coral:#EF6F55;--coralD:#C94B34;--teal:#2FA7A0;--sage:#5AAE68;--pink:#EE7FA0;
  --good:#2B8A44;--bad:#C24A36;--accent:#3E8FCB;--tint:#DCEEFA;--fs:clamp(16px,.55vw + 10px,22px);
  --r:18px;--shadow:0 3px 0 rgba(45,58,79,.16),0 10px 24px rgba(45,58,79,.12);--hdr:120px;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr) + 8px)}
html.big{--fs:clamp(18px,.7vw + 11px,26px)}
body{margin:0;font-family:'Andika','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--cream);
  background-image:repeating-linear-gradient(90deg,rgba(62,143,203,.07) 0 30px,transparent 30px 60px),radial-gradient(circle at 15px 15px,rgba(247,183,51,.18) 3px,transparent 4px);background-size:auto,60px 60px;line-height:1.35;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.work,.qcard,.rcard,.top{-webkit-user-select:none;user-select:none}
.modal{-webkit-user-select:text;user-select:text}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:4px solid #1D6FB8;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:block;flex:none;overflow:visible}
svg.ui{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;min-width:0;padding-bottom:1rem}
[hidden]{display:none!important}

/* ---------- pennant header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:4px solid var(--ink)}
.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;pointer-events:none;
  background:linear-gradient(135deg,var(--accent) 25%,transparent 25%) -14px 0,linear-gradient(225deg,var(--accent) 25%,transparent 25%) -14px 0;background-size:28px 28px;background-position:0 0,0 0;background-repeat:repeat-x;filter:drop-shadow(0 2px 0 var(--ink))}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--accent)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;min-height:64px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;line-height:1;white-space:nowrap}
.brand b{color:var(--coral)}.brand i{font-style:normal;color:var(--sky)}
.brand svg{width:34px;height:34px}
.ktitle{font-size:1.45rem;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0}
.ktitle span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:inline-flex;background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.lvl button{border:0;background:#fff;padding:.3rem .75rem;font-weight:700;min-height:44px;min-width:56px}
.lvl button[aria-pressed=true]{background:var(--ink);color:#fff}
.lvl button+button{border-left:3px solid var(--ink)}

   One source of truth: every sentence the app shows about "where things are" comes from these predicates,
   and tools/qa.js re-checks them against the real positions on screen. */
(function (g) {
  const BEM = g.BEM = g.BEM || {};
  const W = 800, H = 500, WALL = 330, ROW = { b: 395, f: 468 }, FLATY = 474;

  const room = (rid) => BEM.rooms[rid] || { s0: {} };

  /** Layout L = { id: { x, row:'b'|'f', s:'n'|'s'|'b', c:colorId|null, at:{prep,ref,dx}|null, yb?:number } }

      let x = p.x, y, z, row = p.row || 'b', at = p.at || null;

        if (!r) at = null;
        else {
          x = r.x + (at.dx || 0);
          if (at.prep === 'on') { y = r.top + r.d.sup.sy * r.sc; z = r.kind === 'flat' ? y + order[id] * 0.001 : r.z + 0.5; row = r.row; }
          else if (at.prep === 'under') { y = r.y; z = r.z - 0.5; row = r.row; }

    under: (A, B) => A !== B && !!B.d.und && Math.abs(A.y - B.y) <= 3 && A.x >= B.x0 + B.d.und.x0 * B.sc - 3 && A.x <= B.x0 + B.d.und.x1 * B.sc + 3 && A.h <= B.d.und.h * B.sc + 14 && !isWall(A) && B.kind !== 'wall',

  const switchRow = (key, label, note) => `<div class="switch"><div><b>${label}</b>${note ? `<div class="muted" style="font-size:.8rem">${note}</div>` : ''}</div><button class="btn sm" data-act="setting" data-k="${key}" aria-pressed="${A.D.settings[key]}">${A.D.settings[key] ? 'On' : 'Off'}</button></div>`;
  A.acts.settings = () => {
    A.modal(`<h2>Settings <button class="iconbtn" data-act="closem" aria-label="Close">${U.ico('x')}</button></h2>
      ${switchRow('sound', 'Sound effects', 'Original little sounds')}${U.tts.supported ? switchRow('voice', 'Read aloud (browser voice)', 'Uses the voice built into this browser') : '<p class="muted">This browser has no built-in voice. Say the words with your student.</p>'}${U.stt.supported ? switchRow('say', '“Say it” voice check', 'May need internet and the microphone. The tutor ✓ always works.') : ''}${switchRow('big', 'Large text')}${switchRow('reduce', 'Reduce motion')}
      <div class="row" style="margin-top:.8rem">${U.tts.supported ? `<button class="btn sm" data-act="testvoice">${U.ico('speaker')} Test voice</button>` : ''}<button class="btn sm" data-act="export">${U.ico('down')} Export backup</button><label class="btn sm" style="cursor:pointer">${U.ico('up')} Import backup<input type="file" id="impf" accept=".json,application/json" class="sr"></label></div>
      <p class="muted" style="font-size:.85rem">Progress is saved in this browser for each student. Recordings stay on this device and are not part of the backup.</p>
      <div class="row"><button class="btn sm coral" data-act="resetstud">${U.ico('trash')} Reset ${esc(A.P().name)}'s progress</button></div><p class="muted" style="font-size:.8rem;margin-bottom:0">Build My Room · Bright EngMath · Andika font (SIL Open Font License)</p>`);
    $('#impf').addEventListener('change', importFile);
  };
  A.acts.setting = (b) => { const k = b.dataset.k; A.D.settings[k] = !A.D.settings[k]; A.save(); A.applySettings(); b.textContent = A.D.settings[k] ? 'On' : 'Off'; b.setAttribute('aria-pressed', A.D.settings[k]); if (k === 'sound' || k === 'reduce' || k === 'big') { A.fitHdr(); } };
  A.acts.testvoice = () => A.say('Hello! Where is the lamp? The lamp is on the desk.');
  A.acts.export = () => { U.download(`build-my-room-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'build-my-room', v: 1, data: A.D }, null, 1)); A.toast('Backup saved to your downloads.', 2400); };
  const importFile = (e) => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result), d = j.data || j; if (!d.profiles || !d.cur || !d.profiles[d.cur]) throw new Error('bad'); A.modal(`<h2>Import this backup?</h2><p>It has ${Object.keys(d.profiles).length} student(s). It will replace the progress in this browser.</p><div class="actions"><button class="btn" data-act="closem">Cancel</button><button class="btn ok" id="impgo">${U.ico('check')} Import</button></div>`); $('#impgo').addEventListener('click', () => { Object.keys(d.profiles).forEach((k) => { d.profiles[k].r = d.profiles[k].r || {}; d.profiles[k].level = d.profiles[k].level || 1; }); d.settings = Object.assign({}, A.D.settings, d.settings); A.setD(d); A.save(); A.applySettings(); A.closeModal(); A.go('home'); A.toast('Backup imported.', 2200); }); } catch (err) { A.toast('That file is not a Build My Room backup.', 3000); } };
    r.readAsText(f);
  };
  A.acts.resetstud = () => A.modal(`<h2>Reset ${esc(A.P().name)}?</h2><p>This clears stars, badges and rooms for this student only.</p><div class="actions"><button class="btn" data-act="closem">Cancel</button><button class="btn coral" data-act="resetstud2">${U.ico('trash')} Reset</button></div>`);
  A.acts.resetstud2 = () => { A.P().r = {}; A.save(); A.closeModal(); A.go('home'); A.toast('Progress cleared.', 2000); };

  const studHtml = () => `<h2>Students <button class="iconbtn" data-act="closem" aria-label="Close">${U.ico('x')}</button></h2><div class="studs">${Object.values(A.D.profiles).map((p) => { const stars = Object.values(p.r || {}).reduce((s, r) => s + (r.best || 0), 0), badges = Object.values(p.r || {}).filter((r) => r.badge).length; return `<div class="stud${p.id === A.D.cur ? ' cur' : ''}"><div class="grow"><b>${esc(p.name)}</b><div class="muted" style="font-size:.8rem">${BEM.LEVELS[p.level || 1].name} · ${stars} stars · ${badges} badges</div></div><button class="btn sm" data-act="studpick" data-id="${p.id}" ${p.id === A.D.cur ? 'disabled' : ''}>Use</button><button class="btn sm" data-act="studren" data-id="${p.id}" aria-label="Rename">Rename</button>${Object.keys(A.D.profiles).length > 1 ? `<button class="btn sm" data-act="studdel" data-id="${p.id}" aria-label="Delete">${U.ico('trash')}</button>` : ''}</div>`; }).join('')}</div><div class="field"><label for="newname">New student</label><div class="row"><input id="newname" maxlength="24" placeholder="Name" style="flex:1;min-width:10rem;font:inherit;padding:.5rem .7rem;border:3px solid var(--ink);border-radius:12px"><button class="btn sm pri" data-act="studadd">${U.ico('plus')} Add</button></div></div>`;
  A.acts.students = () => A.modal(studHtml());
  A.acts.studpick = (b) => { A.D.cur = b.dataset.id; A.save(); A.closeModal(); A.go(S.screen === 'room' ? 'room' : 'home'); A.toast(`Hi, ${A.P().name}!`, 1600); };
  A.acts.studadd = () => { const inp = $('#newname'), name = (inp.value || '').trim().slice(0, 24); if (!name) { inp.focus(); return; } const id = 'p' + Date.now().toString(36); A.D.profiles[id] = { id, name, level: A.level(), r: {} }; A.D.cur = id; A.save(); A.closeModal(); A.go('home'); A.toast(`Welcome, ${name}!`, 1800); };
  A.acts.studren = (b) => { const p = A.D.profiles[b.dataset.id]; A.modal(`<h2>Rename</h2><div class="field"><label for="rnm">Name</label><input id="rnm" maxlength="24" value="${esc(p.name)}"></div><div class="actions"><button class="btn" data-act="students">Back</button><button class="btn pri" data-act="studren2" data-id="${p.id}">${U.ico('check')} Save</button></div>`); };
  A.acts.studren2 = (b) => { const n = ($('#rnm').value || '').trim().slice(0, 24); if (n) { A.D.profiles[b.dataset.id].name = n; A.save(); } A.closeModal(); A.render(); };
  A.acts.studdel = (b) => { const id = b.dataset.id, p = A.D.profiles[id]; A.modal(`<h2>Delete ${esc(p.name)}?</h2><p>Their stars and badges will be removed from this browser. You can export a backup first in Settings.</p><div class="actions"><button class="btn" data-act="students">Cancel</button><button class="btn coral" data-act="studdel2" data-id="${id}">${U.ico('trash')} Delete</button></div>`); };
  A.acts.studdel2 = (b) => { const id = b.dataset.id; U.db.ok && Object.keys(A.D.profiles[id].r || {}).forEach((r) => U.db.del(`${id}|${r}`)); delete A.D.profiles[id]; if (A.D.cur === id) A.D.cur = Object.keys(A.D.profiles)[0]; A.save(); A.closeModal(); A.go('home'); };

  // =====================================================================
  // EVENTS · KEYBOARD · INIT
  // =====================================================================
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b || b.disabled || b.tagName === 'SELECT') return; const f = A.acts[b.dataset.act]; if (f) { f(b, e); } });
  const speakCurrent = () => { const n = $('#dsb .big') || $('#gmb .big') || $('.qprompt') || $('#dcb .big') || $('#wsb .w'); if (n) A.say(n.textContent); };
  document.addEventListener('keydown', (e) => {
    const t = e.target, typing = t && (/^(input|textarea|select)$/i.test(t.tagName) || t.isContentEditable);
    if (e.key === 'Escape') { if ($('#modal')) { A.closeModal(); e.preventDefault(); } return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#modal')) return;
    const k = e.key, inRoom = S.screen === 'room', onBtn = t && /^(button|a)$/i.test(t.tagName);
    if (inRoom && /^[1-5]$/.test(k)) { A.go('room', S.room, +k); e.preventDefault(); return; }
    if (inRoom && k === 'ArrowRight' && S.step < 5 && !onBtn) { A.go('room', S.room, S.step + 1); e.preventDefault(); return; }
    if (inRoom && k === 'ArrowLeft' && S.step > 1 && !onBtn) { A.go('room', S.room, S.step - 1); e.preventDefault(); return; }
    if ((k === 'Enter' || k === ' ') && !onBtn) { const ok = $('[data-act="dsok"]') || $('[data-act="gmnext"]') || $('[data-act="qcnext"]'); if (ok) { ok.click(); e.preventDefault(); } return; }
    const kk = k.toLowerCase();
    if (kk === 'v') speakCurrent(); else if (kk === 't') A.openTutor(); else if (kk === 'l') A.cycleLevel(); else if (kk === 'm') A.acts.sound(); else if (kk === 'f') U.fullscreen(); else if (kk === 'h') A.go('home'); else if (k === '?') A.openTutor('keys');
  });
  window.addEventListener('resize', () => A.fitHdr());
  window.addEventListener('pagehide', () => U.tts.cancel());
  const boot = () => { const app = document.getElementById('app'); if (!app) return; A.render(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  BEM.test = { A, DS: A.DS, GM: A.GM, QC: A.QC, DC: A.DC };
})();

</script></body></html>

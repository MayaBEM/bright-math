<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoop Shop Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF9F1; --cream:#FFF1DE; --ink:#3B2A22; --soft:#7A6656; --line:#E8D9C4;
  --mint:#6DBF9E; --mintD:#2F8A68; --mintT:#E2F4EC;
  --berry:#E0607A; --berryD:#B83A55; --berryT:#FCE6EA;
  --butter:#F5C85C; --butterT:#FFF4D6;
  --ok:#2F8A68; --no:#C2412D;
}
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Andika,system-ui,sans-serif;font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block}
.awn{height:28px;background:repeating-linear-gradient(90deg,var(--mint) 0 44px,#FFFDF8 44px 88px);position:relative;border-bottom:2px solid var(--ink)}
.awn:after{content:'';position:absolute;left:0;right:0;top:100%;height:14px;background:radial-gradient(circle at 22px -6px,var(--mint) 0 20px,transparent 21px) 0 0/88px 14px repeat-x,radial-gradient(circle at 22px -6px,#FFFDF8 0 20px,transparent 21px) 44px 0/88px 14px repeat-x;pointer-events:none}
.wrap{max-width:1040px;margin:0 auto;padding:30px 20px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:Sniglet;font-size:20px;display:flex;align-items:center;gap:8px}
.brand img{width:34px;height:34px}
.pill{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;background:#fff}
.pill:hover{background:var(--cream)}
h1,h2,h3{font-family:Sniglet;font-weight:800;line-height:1.08}
.kick{font-family:Sniglet;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--berryD)}
.btn{font-family:Sniglet;font-size:20px;padding:12px 26px;border-radius:14px;border:2.5px solid var(--ink);background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.mint{background:var(--mint);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.pill:focus-visible,.nb:focus-visible,.key:focus-visible,.menu-row:focus-visible,.op:focus-visible{outline:3px solid var(--butter);outline-offset:3px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(46px,8vw,88px);margin:8px 0 10px}
.hero p.lead{font-size:20px;max-width:30em}
.heroimg{position:relative;aspect-ratio:1.15;border-radius:22px;overflow:hidden;border:2.5px solid var(--ink);background:var(--mintT)}
.heroimg img.bg{width:100%;height:100%;object-fit:cover}
.namebox{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.namebox input{font:inherit;font-size:20px;padding:11px 14px;border:2.5px solid var(--ink);border-radius:12px;width:240px;max-width:100%;background:#fff}
.menu{margin-top:36px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden}
.menu-h{background:var(--ink);color:var(--paper);padding:12px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.menu-h h2{font-size:26px}.menu-h span{font-size:15px;opacity:.85}
.menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;width:100%;text-align:left;padding:12px 22px;border-top:1.5px dashed var(--line)}
.menu-row:first-of-type{border-top:0}
.menu-row:hover{background:var(--cream)}
.menu-row img{width:56px;height:56px;object-fit:contain}
.menu-row b{font-family:Sniglet;font-weight:400;font-size:22px;display:block}
.menu-row small{color:var(--soft);font-size:15px}
.stars{display:flex;gap:3px;font-size:0}
.stars i{width:22px;height:22px;display:block;background:var(--line);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--butter)}
.tag{font-size:14px;font-family:Sniglet;padding:3px 10px;border-radius:999px;background:var(--mintT);color:var(--mintD);border:1.5px solid var(--mint)}

/* lesson */
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2.5px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.lhead h2{font-size:clamp(30px,5vw,44px)}
.dots{display:flex;gap:6px}.dots span{width:30px;height:8px;border-radius:4px;background:var(--line)}.dots span.on{background:var(--mint)}.dots span.cur{background:var(--ink)}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:22px 24px;position:relative}
.say{font-family:Sniglet;color:var(--berryD);font-size:22px}
.prompt{font-size:21px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.prompt img{width:62px;height:62px;object-fit:contain;flex:none}
.scene{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end;padding:10px 0 4px;min-height:120px}
.it{width:var(--s,44px);height:var(--s,44px);object-fit:contain;filter:drop-shadow(0 2px 2px rgba(60,40,30,.25))}
.pop{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.grp{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:3px;position:relative;transition:transform .15s}
.grp.plate{background:radial-gradient(ellipse at center,#fff 0 56%,#F1ECE6 58%,#fff 64%,#E5DED5 100%);border:1.5px solid #CFC6BC;border-radius:50%;padding:14px 18px;min-height:86px;min-width:110px;box-shadow:0 4px 0 #E2D9CE}
.grp.jar{background:linear-gradient(90deg,rgba(255,255,255,.75) 0 12%,transparent 20%),#E6F3F6;border:2px solid #9CC3CC;border-radius:10px 10px 18px 18px;padding:18px 10px 10px;min-height:96px;min-width:84px;margin-top:12px}
.grp.jar:before{content:'';position:absolute;left:10%;right:10%;top:-13px;height:12px;background:var(--mint);border:2px solid var(--mintD);border-radius:4px}
.grp.box{background:#FCE6EA;border:2px solid #D58F9E;border-radius:6px;padding:20px 10px 10px;min-height:92px;min-width:96px}
.grp.box:before{content:'';position:absolute;left:-2px;right:-2px;top:-2px;height:12px;background:#F2B6C2;border:2px solid #D58F9E;border-radius:6px 6px 0 0}
.grp.bowl{background:linear-gradient(#fff 0 0) top/100% 10px no-repeat,linear-gradient(180deg,#DCEEF3,#BFDDE6);border:2px solid #7FB0BE;border-radius:12px 12px 70px 70px/12px 12px 44px 44px;padding:16px 14px 18px;min-height:84px;min-width:110px;box-shadow:0 4px 0 #A9CBD4}
.grp.tap{cursor:pointer}.grp.tap:hover{transform:translateY(-3px)}
.grp .cnt{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-family:Sniglet;font-size:18px;color:var(--soft)}
.tray{display:inline-grid;gap:5px;padding:12px;background:#F7E7C6;box-shadow:inset 0 0 0 5px #fff;border:2.5px solid var(--ink);border-radius:12px;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.tray .c{width:var(--s,46px);height:var(--s,46px);border-radius:50%;background:radial-gradient(circle,#E9C37C 0 55%,#D9A85A 70%,#C99446 100%);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.tray .c img{width:86%;height:86%}
.pile{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:320px;min-height:50px}
.math{font-family:Sniglet;font-size:clamp(26px,4vw,34px);text-align:center;margin:8px 0}
.math .hl{color:var(--berryD)}
.steps{display:grid;gap:8px;margin-top:14px;font-size:19px}
.steps div{display:flex;gap:10px;align-items:center}
.num{font-family:Sniglet;font-weight:800;width:32px;height:32px;border-radius:50%;background:var(--butterT);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.stepper{display:flex;align-items:center;gap:10px;font-size:19px}
.stepper button{width:44px;height:44px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-family:Sniglet;font-size:26px;line-height:1}
.stepper b{font-family:Sniglet;font-size:28px;min-width:30px;text-align:center}
.note{background:var(--butterT);border-left:6px solid var(--butter);padding:10px 16px;border-radius:0 10px 10px 0;margin-top:16px;font-size:18px}

/* practice */
.play{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.sentence{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-family:Sniglet;font-size:30px;margin-top:22px}
.sentence .w{font-family:Andika;font-size:19px}
.nb{min-width:76px;height:62px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:Sniglet;font-size:32px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;position:relative}
.nb.sel{border-color:var(--berry);box-shadow:0 0 0 4px var(--berryT)}
.nb.ok{border-color:var(--ok);background:var(--mintT)}
.nb.bad{border-color:var(--no);background:#FDECE8}
.nb.ok:after,.nb.bad:after{position:absolute;top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;font-family:Andika;font-weight:700}
.nb.ok:after{content:'\2713';background:var(--ok)}.nb.bad:after{content:'\2715';background:var(--no)}
.nb.fixed{border-style:dashed;color:var(--soft)}
.pad{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;position:sticky;top:14px}
.key{height:58px;border-radius:12px;border:2px solid var(--ink);background:var(--cream);font-family:Sniglet;font-size:28px;box-shadow:0 3px 0 var(--ink)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.key.sm{font-family:Andika;font-size:17px;font-weight:700}
.pad .btn{grid-column:1/-1;margin-top:4px}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;font-size:18px;display:none;gap:10px;align-items:flex-start}
.fb.show{display:flex}
.fb.ok{background:var(--mintT);border:2px solid var(--mint)}
.fb.no{background:#FDECE8;border:2px solid #E8A598}
.fb b{font-family:Sniglet;font-weight:400}
.ops{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.op{min-width:150px;padding:12px 18px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:18px;text-align:center}
.op big{display:block;font-family:Sniglet;font-size:38px;line-height:1}
.op.sel{background:var(--butterT);border-color:var(--berry)}
.op.ok{background:var(--mintT);border-color:var(--ok)}.op.bad{background:#FDECE8;border-color:var(--no)}
.qcount{font-size:16px;color:var(--soft)}

/* end */
.done{text-align:center;padding:30px 20px}
.done h2{font-size:clamp(34px,6vw,52px);margin:10px 0}
.done .stars{justify-content:center;margin:14px 0}.done .stars i{width:46px;height:46px}
.cert{max-width:720px;margin:0 auto;border:3px solid var(--ink);border-radius:20px;padding:34px;background:#fff;text-align:center;position:relative;overflow:hidden}
.cert:before{content:'';position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,var(--berry) 0 40px,#FFFDF8 40px 80px)}
.cert h2{font-size:clamp(34px,6vw,54px);margin:20px 0 6px}
.cert .nm{font-family:Sniglet;font-size:clamp(30px,5vw,44px);color:var(--berryD);border-bottom:2px solid var(--ink);display:inline-block;padding:0 20px;margin:10px 0}
.treats{display:flex;justify-content:center;gap:10px;margin-top:16px}.treats img{width:56px;height:56px;object-fit:contain}

/* teacher */
table.res{width:100%;border-collapse:collapse;font-size:17px;margin-top:10px}
table.res th{text-align:left;font-family:Sniglet;font-weight:400;border-bottom:2.5px solid var(--ink);padding:8px}
table.res td{border-bottom:1px solid var(--line);padding:8px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.tgrid h3{font-size:22px;margin-bottom:6px}
.tgrid ul{padding-left:20px}.tgrid li{margin:4px 0}
.credits{font-size:13px;color:var(--soft);margin-top:30px;line-height:1.5}
.credits a{color:var(--soft)}

@media (max-width:760px){
  html,body{font-size:17px}
  .wrap{padding:22px 14px 50px}
  .hero{grid-template-columns:1fr}
  .heroimg{aspect-ratio:1.6}
  .play{grid-template-columns:1fr}
  .pad{position:static;grid-template-columns:repeat(10,1fr);padding:10px;gap:7px}
  .key{height:50px;font-size:24px;grid-column:span 2}
  .key[data-k="0"]{order:1}
  .key.sm{grid-column:span 5;order:2}
  .pad .btn{order:3}
  .card{padding:16px}
  .menu-row{grid-template-columns:48px 1fr;padding:10px 14px}
  .menu-row img{width:46px;height:46px}
  .menu-row .stars{grid-column:2}
  .sentence{font-size:24px;gap:7px}
  .nb{min-width:62px;height:54px;font-size:27px}
  .grp.plate{min-width:92px;padding:12px}
  .tgrid{grid-template-columns:1fr}
  .op{min-width:130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.ctrl,.noprint{display:none!important}.wrap{padding:0}body{background:#fff}}
</style>
</head>

let S = null; // current station state
function topBar(back=true){

}
function home(){

function startFirst(){

function openStation(i){
  const st = STATIONS[i];
  S = {i, st, q:0, score:0, tries:0, phase: st.learn ? 'learn' : 'q'};

  window.scrollTo({top:0});
}
function head(sub){
  const st = S.st; const total = st.qs.length + (st.learn ? 1 : 0);
  const cur = S.phase === 'learn' ? 0 : S.q + (st.learn ? 1 : 0);
  const dots = Array.from({length: total}, (_, k) => `<span class="${k < cur ? 'on' : k === cur ? 'cur' : ''}"></span>`).join('');
  return `${topBar()}<div class="lhead"><div><div class="kick">${S.i+1} &middot; ${sub}</div><h2>${st.title}</h2></div><div class="dots" aria-hidden="true">${dots}</div></div>`;
}

     <li>Ask &ldquo;How many groups? How many in each group?&rdquo; before any &times; question.</li>
     <li>For &divide;, ask &ldquo;Is it fair? How do you know?&rdquo;</li>
     <li>Use Rows in a Box to show that 3 &times; 5 and 5 &times; 3 give the same total.</li>
     <li>Standards: 2.OA.C.3, 2.OA.C.4; builds readiness for 3.OA.A.1, 3.OA.A.2 and 3.OA.B.6.</li></ul></div></div>
   <div class="card" style="margin-top:18px"><h3 style="font-size:22px">Answer key</h3><ul style="padding-left:20px;margin-top:6px;font-size:16px">${key}</ul></div>`;
  window.scrollTo({top:0});
}
function keyOf(q){
  if (q.type === 'groups') return `${q.g} groups of ${q.n} = ${q.g*q.n}`;
  if (q.type === 'array') return `${q.r} &times; ${q.c} = ${q.r*q.c}`;
  if (q.type === 'share') return `${q.t} &divide; ${q.g} = ${q.t/q.g}`;
  if (q.type === 'fact') return `${q.r*q.c} &divide; ${q.r} = ${q.c}, ${q.r*q.c} &divide; ${q.c} = ${q.r}`;
  return `${q.op === 'x' ? '&times;' : '&divide;'} ${q.op === 'x' ? q.a*q.b : q.a/q.b} ${q.unit}`;
}

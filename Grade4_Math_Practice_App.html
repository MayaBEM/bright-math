ef6' stroke='#1d2b44' stroke-width='1.5'/><polygon points='77.0,3 87,23 67,23' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><rect x='99' y='3' width='20' height='20' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><polygon points='141.0,3 151,23 131,23' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><polygon points='173.0,3 183,23 163,23' fill='#e8eef6' stroke='#1d2b44' stroke-width='1.5'/><rect x='195' y='3' width='20' height='20' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><text x='230' y='20' font-size='18' font-weight='bold' font-family='Nunito' fill='#e8603c'>?</text></svg>", "pts": 1, "a": "triangle, triangle &nbsp;(the pattern unit is square, triangle, triangle)", "l": 1}, {"q": "Look at the pattern <b>5, 11, 17, 23, &hellip;</b><br><span class='cmp'>a) What is the rule? ____________</span><span class='cmp'>b) Write the next two numbers. ________, ________</span>", "pts": 2, "a": "a) add 6 &nbsp; b) 29, 35 &nbsp;(1 point each)", "l": 2}, {"q": "Write the next number in the pattern. <b>1, 2, 4, 8, 16, ______</b>", "pts": 1, "a": "32 &nbsp;(rule: multiply by 2)", "l": 2}, {"q": "A sequence starts at <b>100</b> and follows the rule <b>subtract 9</b>.<br><span class='cmp'>a) Write the first five terms. ______________________</span><span class='cmp'>b) Will 46 be a term in this sequence? Explain.</span>", "pts": 2, "a": "a) 100, 91, 82, 73, 64 &nbsp; b) Yes. Keep subtracting 9: 64, 55, 46 — so 46 is the 7th term. (1 point each)", "l": 3}, {"q": "Look at the sequence <b>6, 12, 18, 24, 30, 36</b>.<br><span class='cmp'>a) What is the rule? ____________</span><span class='cmp'>b) Write one thing that is true about every term but is not part of the rule.</span>", "pts": 2, "a": "a) add 6 (start at 6) &nbsp; b) Any valid feature, e.g. every term is even, every term is a multiple of 6 (or of 3), the ones digits repeat 6, 2, 8, 4, 0. (1 point each)", "l": 3}, {"q": "The rule is <b>add 17</b>. Complete the table.<br><table class='mini'><tr><th>Input</th><th>8</th><th>25</th><th>?</th><th>60</th></tr><tr><td>Output</td><td>25</td><td>42</td><td>59</td><td>?</td></tr></table>", "pts": 2, "a": "Missing input: 42 (59 − 17) &nbsp; Missing output: 77 (60 + 17) &nbsp;(1 point each)", "l": 5}, {"q": "Find the rule, then complete the table.<br><table class='mini'><tr><th>Input</th><th>6</th><th>9</th><th>?</th><th>15</th></tr><tr><td>Output</td><td>42</td><td>63</td><td>84</td><td>?</td></tr></table>Rule: ____________", "pts": 2, "a": "Rule: multiply by 7. Missing input: 12 (84 ÷ 7) &nbsp; Missing output: 105 (15 × 7) &nbsp;(1 pt rule, 1 pt both missing values)", "l": 6}, {"q": "Find the value of each expression.<br><span class='cmp'>a) 36 ÷ (4 + 2) × 3 = ________</span><span class='cmp'>b) 50 − 8 × 5 + 7 = ________</span>", "pts": 2, "a": "a) 18 &nbsp;(36 ÷ 6 = 6, then 6 × 3 = 18) &nbsp; b) 17 &nbsp;(8 × 5 = 40; 50 − 40 + 7 = 17) &nbsp;(1 point each)", "l": 7}, {"q": "Mia's number machine uses the rule <b>multiply by 3, then add 2</b>.<br><span class='cmp'>a) What is the output when the input is 6? ________</span><span class='cmp'>b) What is the input when the output is 29? ________</span>", "pts": 2, "a": "a) 6 × 3 + 2 = 20 &nbsp; b) 9 &nbsp;(work backward: 29 − 2 = 27, 27 ÷ 3 = 9) &nbsp;(1 point each)", "l": 8}, {"q": "What value of <b>y</b> makes the equation true? Show how you checked your answer.<br><b>4 × y − 6 ÷ 2 = 21</b>", "pts": 2, "a": "y = 6. &nbsp;6 ÷ 2 = 3, so 4 × y − 3 = 21 and 4 × y = 24. Check: 4 × 6 − 6 ÷ 2 = 24 − 3 = 21 ✓ (1 pt value, 1 pt check)", "l": 9}], "wp": [{"q": "Ravi builds figures with tiles. Each figure has 3 more tiles than the one before it.<br><div class='figrow'><div><svg xmlns='http://www.w3.org/2000/svg' width='50' height='14' viewBox='0 0 50 14' style='vertical-align:middle;display:inline-block'><rect x='1' y='1' width='12' height='12' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1'/><rect x='13' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='25' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='37' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/></svg><div class='cap'>Figure 1</div></div><div><svg xmlns='http://www.w3.org/2000/svg' width='86' height='14' viewBox='0 0 86 14' style='vertical-align:middle;display:inline-block'><rect x='1' y='1' width='12' height='12' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1'/><rect x='13' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='25' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='37' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='49' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='61' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='73' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/></svg><div class='cap'>Figure 2</div></div><div><svg xmlns='http://www.w3.org/2000/svg' width='122' height='14' viewBox='0 0 122 14' style='vertical-align:middle;display:inline-block'><rect x='1' y='1' width='12' height='12' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1'/><rect x='13' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='25' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='37' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='49' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='61' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='73' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='85' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='97' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/><rect x='109' y='1' width='12' height='12' fill='#e8eef6' stroke='#1d2b44' stroke-width='1'/></svg><div class='cap'>Figure 3</div></div></div>How many tiles will Ravi need for <b>Figure 8</b>? Explain the pattern you used.", "a": "Figure 1 = 4, Figure 2 = 7, Figure 3 = 10, &hellip; Each figure adds 3 tiles, so Figure 8 = 4 + 3 × 7 = <b>25 tiles</b>. Rubric: 1 pt identifies the add-3 pattern, 1 pt organized list or table, 1 pt correct answer.", "l": 4}, {"q": "In a theater, Row 1 has 12 seats. Each row has 3 more seats than the row in front of it. How many seats are in <b>Row 10</b>? How many seats are in the <b>first four rows</b> altogether?", "a": "Rows: 12, 15, 18, 21, 24, 27, 30, 33, 36, 39. Row 10 = <b>39 seats</b>. First four rows: 12 + 15 + 18 + 21 = <b>66 seats</b>. Rubric: 1 pt pattern/table, 1 pt Row 10, 1 pt total of first four rows.", "l": 4}, {"q": "Lena saves $8 in Week 1. Each week she saves <b>double</b> the amount she saved the week before. How much does she save in <b>Week 5</b>? In which week does she first save <b>more than $200</b>?", "a": "Weekly amounts: $8, $16, $32, $64, $128, $256. Week 5 = <b>$128</b>. She first saves more than $200 in <b>Week 6</b> ($256). Rubric: 1 pt doubling pattern shown, 1 pt Week 5 amount, 1 pt correct week.", "l": 4}, {"q": "A shuttle bus leaves the airport at 6:15, 6:40, and 7:05 and keeps leaving at equal time intervals. At what time does the <b>6th</b> bus leave? Explain how you found the pattern.", "a": "The buses leave every 25 minutes: 6:15, 6:40, 7:05, 7:30, 7:55, <b>8:20</b>. Rubric: 1 pt finds the 25-minute interval, 1 pt lists the times, 1 pt correct 6th time.", "l": 4}, {"q": "Look at the number pattern <b>3, 7, 15, 31, &hellip;</b> Find the rule, then write the <b>next two</b> numbers.", "a": "Rule: multiply by 2, then add 1 (or: the differences 4, 8, 16 double each time). Next two: <b>63</b> and <b>127</b>. Rubric: 1 pt rule, 1 pt each next number.", "l": 4}], "pt": {"title": "The Function Machines", "intro": "<div class='clues'><h4>Math Fair Function Machines</h4><p>At the math fair, each function machine changes an input number into an output number using a <b>two-step rule</b>. Machine A's rule is a secret. Machine B's rule is <b>divide by 3, then add 7</b>.</p><div class='figrow'><div><table class='mini'><tr><th>Machine A: Input</th><th>2</th><th>5</th><th>8</th></tr><tr><td>Output</td><td>11</td><td>26</td><td>41</td></tr></table></div><div><table class='mini'><tr><th>Machine B: Input</th><th>9</th><th>15</th><th>27</th></tr><tr><td>Output</td><td></td><td></td><td></td></tr></table></div></div></div>", "items": [{"q": "Find Machine A's secret rule. Then find Machine A's output when the input is <b>12</b>.", "pts": 2, "a": "Rule: <b>multiply by 5, then add 1</b> (2 → 11, 5 → 26, 8 → 41). Input 12 → 12 × 5 + 1 = <b>61</b>. (1 pt each)"}, {"q": "Complete Machine B's table above. Then find the <b>input</b> that gives Machine B an output of <b>15</b>.", "pts": 2, "a": "Outputs: 9 → <b>10</b>, 15 → <b>12</b>, 27 → <b>16</b>. Output 15: work backward, 15 − 7 = 8 and 8 × 3 = <b>24</b>. (1 pt table, 1 pt input)"}, {"q": "Create your own machine, Machine C, with a two-step rule that uses <b>two different operations</b>. Write the rule and make a table with three input/output pairs that follow it.", "pts": 1, "a": "Any valid two-operation rule with a correct table, e.g. <b>multiply by 2, then subtract 3</b>: 4 → 5, 6 → 9, 10 → 17. (1 pt: rule uses two different operations and all three pairs are correct)"}]}}, {"n": 8, "title": "Fractions", "color": "#e09a1a", "light": "#fff0cc", "dark": "#9c6a0f", "lessons": ["Factors and Multiples", "Prime and Composite Numbers", "Hands On: Model Equivalent Fractions", "Equivalent Fractions", "Simplest Form", "Compare and Order Fractions", "Use Benchmark Fractions to Compare and Order", "Problem-Solving Investigation: Use Logical Reasoning", "Mixed Numbers", "Mixed Numbers and Improper Fractions"], "standards": ["4.OA.B.4", "4.NF.A.1", "4.NF.A.2", "4.NF.B.3"], "mc": [{"q": "Which list shows <b>all</b> the factors of 24?", "o": ["1, 2, 3, 4, 6, 8, 12, 24", "1, 2, 3, 4, 6, 12, 24", "1, 2, 4, 6, 8, 12, 24", "2, 3, 4, 6, 8, 12"], "a": 0, "e": "Factor pairs of 24: 1 × 24, 2 × 12, 3 × 8, 4 × 6, so the factors are 1, 2, 3, 4, 6, 8, 12, 24.", "l": 1}, {"q": "Which number is a <b>multiple</b> of 7?", "o": ["27", "42", "50", "57"], "a": 1, "e": "42 = 7 × 6, so 42 is a multiple of 7. The others are not in the 7s count.", "l": 1}, {"q": "Which number is <b>prime</b>?", "o": ["21", "27", "29", "33"], "a": 2, "e": "29 has exactly two factors, 1 and 29. The others have more factors (21 = 3 × 7, 27 = 3 × 9, 33 = 3 × 11).", "l": 2}, {"q": "Which number is <b>composite</b>?", "o": ["17", "23", "31", "39"], "a": 3, "e": "39 = 3 × 13, so it has more than two factors and is composite. 17, 23 and 31 are prime.", "l": 2}, {"q": "The model shows <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span> shaded. Which fraction is <b>equivalent</b> to the shaded part?<div class='figrow'><div><svg xmlns='http://www.w3.org/2000/svg' width='202' height='28' viewBox='0 0 202 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='50.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='51.0' y='1' width='50.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='101.0' y='1' width='50.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='151.0' y='1' width='50.0' height='26' fill='#fff' stroke='#1d2b44' stroke-width='1.5'/></svg><div class='cap'>3 of 4 equal parts shaded</div></div></div>", "o": ["<span class='fr'><span class='nu'>3</span><span class='de'>8</span></span>", "<span class='fr'><span class='nu'>6</span><span class='de'>8</span></span>", "<span class='fr'><span class='nu'>4</span><span class='de'>6</span></span>", "<span class='fr'><span class='nu'>3</span><span class='de'>6</span></span>"], "a": 1, "e": "Doubling the number of parts and the shaded parts gives the same amount: <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span> = <span class='fr'><span class='nu'>6</span><span class='de'>8</span></span>.", "l": 3}, {"q": "Which fraction is equivalent to <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span>?", "o": ["<span class='fr'><span class='nu'>4</span><span class='de'>9</span></span>", "<span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>", "<span class='fr'><span class='nu'>6</span><span class='de'>9</span></span>", "<span class='fr'><span class='nu'>4</span><span class='de'>5</span></span>"], "a": 2, "e": "Multiply the numerator and denominator by 3: <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> = <span class='fr'><span class='nu'>6</span><span class='de'>9</span></span>.", "l": 4}, {"q": "What is <span class='fr'><span class='nu'>8</span><span class='de'>12</span></span> written in <b>simplest form</b>?", "o": ["<span class='fr'><span class='nu'>2</span><span class='de'>3</span></span>", "<span class='fr'><span class='nu'>4</span><span class='de'>6</span></span>", "<span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>", "<span class='fr'><span class='nu'>2</span><span class='de'>4</span></span>"], "a": 0, "e": "Divide the numerator and denominator by 4: <span class='fr'><span class='nu'>8</span><span class='de'>12</span></span> = <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span>.", "l": 5}, {"q": "Which symbol makes the statement true?<br><span class='fr'><span class='nu'>3</span><span class='de'>5</span></span> &#9675; <span class='fr'><span class='nu'>7</span><span class='de'>10</span></span>", "o": ["&gt;", "&lt;", "=", "cannot be compared"], "a": 1, "e": "Rename <span class='fr'><span class='nu'>3</span><span class='de'>5</span></span> as <span class='fr'><span class='nu'>6</span><span class='de'>10</span></span>. Since <span class='fr'><span class='nu'>6</span><span class='de'>10</span></span> &lt; <span class='fr'><span class='nu'>7</span><span class='de'>10</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>5</span></span> &lt; <span class='fr'><span class='nu'>7</span><span class='de'>10</span></span>.", "l": 6}, {"q": "Which list shows the fractions in order from <b>least to greatest</b>?<br><span class='fr'><span class='nu'>5</span><span class='de'>8</span></span>&nbsp;&nbsp; <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>&nbsp;&nbsp; <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>", "o": ["<span class='fr'><span class='nu'>5</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>", "<span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>, <span class='fr'><span class='nu'>5</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>", "<span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>, <span class='fr'><span class='nu'>5</span><span class='de'>8</span></span>", "<span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, <span class='fr'><span class='nu'>5</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>"], "a": 3, "e": "Use eighths: <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span> = <span class='fr'><span class='nu'>4</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>5</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span> = <span class='fr'><span class='nu'>6</span><span class='de'>8</span></span>. So the order is <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, <span class='fr'><span class='nu'>5</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>.", "l": 6}, {"q": "Which fraction is <b>less than</b> <span class='fr'><span class='nu'>5</span><span class='de'>6</span></span>?", "o": ["<span class='fr'><span class='nu'>7</span><span class='de'>8</span></span>", "<span class='fr'><span class='nu'>11</span><span class='de'>12</span></span>", "<span class='fr'><span class='nu'>6</span><span class='de'>6</span></span>", "<span class='fr'><span class='nu'>2</span><span class='de'>3</span></span>"], "a": 3, "e": "<span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> = <span class='fr'><span class='nu'>4</span><span class='de'>6</span></span>, which is less than <span class='fr'><span class='nu'>5</span><span class='de'>6</span></span>. The others are greater than <span class='fr'><span class='nu'>5</span><span class='de'>6</span></span> (<span class='fr'><span class='nu'>7</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>11</span><span class='de'>12</span></span>) or equal to it (<span class='fr'><span class='nu'>6</span><span class='de'>6</span></span> is a whole).", "l": 6}, {"q": "Each strip is one whole. What mixed number does the model show?<div class='figrow'><div><svg xmlns='http://www.w3.org/2000/svg' width='86' height='28' viewBox='0 0 86 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='22.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='43.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='64.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/></svg></div><div><svg xmlns='http://www.w3.org/2000/svg' width='86' height='28' viewBox='0 0 86 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='22.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='43.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='64.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/></svg></div><div><svg xmlns='http://www.w3.org/2000/svg' width='86' height='28' viewBox='0 0 86 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='22.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='43.0' y='1' width='21.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='64.0' y='1' width='21.0' height='26' fill='#fff' stroke='#1d2b44' stroke-width='1.5'/></svg></div></div>", "o": ["<span class='mx'>2<span class='fr'><span class='nu'>1</span><span class='de'>4</span></span></span>", "<span class='mx'>3<span class='fr'><span class='nu'>1</span><span class='de'>4</span></span></span>", "<span class='mx'>2<span class='fr'><span class='nu'>3</span><span class='de'>4</span></span></span>", "<span class='mx'>3<span class='fr'><span class='nu'>3</span><span class='de'>4</span></span></span>"], "a": 2, "e": "Two whole strips plus 3 of 4 parts of the third strip: <span class='mx'>2<span class='fr'><span class='nu'>3</span><span class='de'>4</span></span></span>.", "l": 9}, {"q": "Which improper fraction is equal to <span class='mx'>3<span class='fr'><span class='nu'>2</span><span class='de'>5</span></span></span>?", "o": ["<span class='fr'><span class='nu'>17</span><span class='de'>5</span></span>", "<span class='fr'><span class='nu'>11</span><span class='de'>5</span></span>", "<span class='fr'><span class='nu'>32</span><span class='de'>5</span></span>", "<span class='fr'><span class='nu'>15</span><span class='de'>5</span></span>"], "a": 0, "e": "<span class='mx'>3<span class='fr'><span class='nu'>2</span><span class='de'>5</span></span></span> = 3 wholes (<span class='fr'><span class='nu'>15</span><span class='de'>5</span></span>) + <span class='fr'><span class='nu'>2</span><span class='de'>5</span></span> = <span class='fr'><span class='nu'>17</span><span class='de'>5</span></span>.", "l": 10}], "sa": [{"q": "List <b>all</b> the factors of 36.", "pts": 1, "a": "1, 2, 3, 4, 6, 9, 12, 18, 36 (all nine factors for the point)", "l": 1}, {"q": "Write the first <b>four</b> multiples of 9. (Do not count 0.)", "pts": 1, "a": "9, 18, 27, 36", "l": 1}, {"q": "Write <b>yes</b> or <b>no</b>.<br><span class='cmp'>a) Is 7 a factor of 93? ______</span><span class='cmp'>b) Is 56 a multiple of 8? ______</span>", "pts": 2, "a": "a) no (93 ÷ 7 = 13 R2; 93 = 3 × 31) &nbsp; b) yes (8 × 7 = 56) &nbsp;(1 point each)", "l": 1}, {"q": "Use the model.<div class='figrow'><div><svg xmlns='http://www.w3.org/2000/svg' width='212' height='28' viewBox='0 0 212 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='35.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='36.0' y='1' width='35.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='71.0' y='1' width='35.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='106.0' y='1' width='35.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='141.0' y='1' width='35.0' height='26' fill='#fff' stroke='#1d2b44' stroke-width='1.5'/><rect x='176.0' y='1' width='35.0' height='26' fill='#fff' stroke='#1d2b44' stroke-width='1.5'/></svg></div></div><span class='cmp'>a) What fraction of the strip is shaded? ______</span><span class='cmp'>b) Write an equivalent fraction with denominator 3. ______</span>", "pts": 2, "a": "a) <span class='fr'><span class='nu'>4</span><span class='de'>6</span></span> &nbsp; b) <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> (4 ÷ 2 = 2 and 6 ÷ 2 = 3) &nbsp;(1 point each)", "l": 4}, {"q": "Fill in the missing number to make each pair equivalent.<br><span class='cmp'>a) <span class='fr'><span class='nu'>3</span><span class='de'>5</span></span> = <span class='fr'><span class='nu'>__</span><span class='de'>10</span></span></span><span class='cmp'>b) <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> = <span class='fr'><span class='nu'>8</span><span class='de'>__</span></span></span>", "pts": 2, "a": "a) 6 (multiply numerator and denominator by 2) &nbsp; b) 12 (multiply by 4) &nbsp;(1 point each)", "l": 4}, {"q": "Write each fraction in <b>simplest form</b>.<br><span class='cmp'>a) <span class='fr'><span class='nu'>6</span><span class='de'>8</span></span> = ______</span><span class='cmp'>b) <span class='fr'><span class='nu'>10</span><span class='de'>12</span></span> = ______</span>", "pts": 2, "a": "a) <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span> (divide by 2) &nbsp; b) <span class='fr'><span class='nu'>5</span><span class='de'>6</span></span> (divide by 2) &nbsp;(1 point each)", "l": 5}, {"q": "Compare. Write <b>&lt;</b>, <b>&gt;</b>, or <b>=</b> in each circle. Use <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span> as a benchmark.<br><span class='cmp'>a) <span class='fr'><span class='nu'>3</span><span class='de'>8</span></span> &#9675; <span class='fr'><span class='nu'>5</span><span class='de'>6</span></span></span><span class='cmp'>b) <span class='fr'><span class='nu'>4</span><span class='de'>8</span></span> &#9675; <span class='fr'><span class='nu'>2</span><span class='de'>4</span></span></span><span class='cmp'>c) <span class='fr'><span class='nu'>7</span><span class='de'>12</span></span> &#9675; <span class='fr'><span class='nu'>2</span><span class='de'>5</span></span></span>", "pts": 3, "a": "a) &lt; (<span class='fr'><span class='nu'>3</span><span class='de'>8</span></span> &lt; <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span> &lt; <span class='fr'><span class='nu'>5</span><span class='de'>6</span></span>) &nbsp; b) = (both equal <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>) &nbsp; c) &gt; (<span class='fr'><span class='nu'>7</span><span class='de'>12</span></span> &gt; <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span> &gt; <span class='fr'><span class='nu'>2</span><span class='de'>5</span></span>) &nbsp;(1 point each)", "l": 7}, {"q": "Use the benchmarks 0, <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, and 1 to order the fractions from <b>least to greatest</b>.<br><span class='fr'><span class='nu'>7</span><span class='de'>8</span></span>&nbsp;&nbsp; <span class='fr'><span class='nu'>2</span><span class='de'>5</span></span>&nbsp;&nbsp; <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>&nbsp;&nbsp; <span class='fr'><span class='nu'>1</span><span class='de'>10</span></span>", "pts": 2, "a": "<span class='fr'><span class='nu'>1</span><span class='de'>10</span></span>, <span class='fr'><span class='nu'>2</span><span class='de'>5</span></span>, <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, <span class='fr'><span class='nu'>7</span><span class='de'>8</span></span> &nbsp;(<span class='fr'><span class='nu'>1</span><span class='de'>10</span></span> is close to 0, <span class='fr'><span class='nu'>2</span><span class='de'>5</span></span> is a little less than <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, <span class='fr'><span class='nu'>7</span><span class='de'>8</span></span> is close to 1) &nbsp;(2 pts all correct, 1 pt if one fraction is misplaced)", "l": 7}, {"q": "Each strip is one whole. Write the amount shown by the model two ways.<div class='figrow'><div><svg xmlns='http://www.w3.org/2000/svg' width='92' height='28' viewBox='0 0 92 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='30.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='31.0' y='1' width='30.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='61.0' y='1' width='30.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/></svg></div><div><svg xmlns='http://www.w3.org/2000/svg' width='92' height='28' viewBox='0 0 92 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='30.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='31.0' y='1' width='30.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='61.0' y='1' width='30.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/></svg></div><div><svg xmlns='http://www.w3.org/2000/svg' width='92' height='28' viewBox='0 0 92 28' style='vertical-align:middle;display:inline-block'><rect x='1.0' y='1' width='30.0' height='26' fill='#b9dcf5' stroke='#1d2b44' stroke-width='1.5'/><rect x='31.0' y='1' width='30.0' height='26' fill='#fff' stroke='#1d2b44' stroke-width='1.5'/><rect x='61.0' y='1' width='30.0' height='26' fill='#fff' stroke='#1d2b44' stroke-width='1.5'/></svg></div></div><span class='cmp'>a) as a mixed number ______</span><span class='cmp'>b) as an improper fraction ______</span>", "pts": 2, "a": "a) <span class='mx'>2<span class='fr'><span class='nu'>1</span><span class='de'>3</span></span></span> (two whole strips and 1 of 3 parts) &nbsp; b) <span class='fr'><span class='nu'>7</span><span class='de'>3</span></span> (2 × 3 + 1 = 7 thirds) &nbsp;(1 point each)", "l": 10}, {"q": "Write <span class='fr'><span class='nu'>17</span><span class='de'>6</span></span> as a mixed number.", "pts": 1, "a": "<span class='mx'>2<span class='fr'><span class='nu'>5</span><span class='de'>6</span></span></span> (17 ÷ 6 = 2 R5, so 2 wholes and <span class='fr'><span class='nu'>5</span><span class='de'>6</span></span>)", "l": 10}], "wp": [{"q": "Mrs. Lee has <b>36</b> desks. She wants to arrange them in equal rows with <b>more than 2</b> and <b>fewer than 10</b> desks in each row. List every possible number of desks in a row. Explain how you know your list is complete.", "a": "<b>3, 4, 6, or 9 desks in a row.</b> The factors of 36 are 1, 2, 3, 4, 6, 9, 12, 18, 36; only 3, 4, 6, and 9 are between 2 and 10. Rubric: 2 pts all four numbers (1 pt if one is missing or extra), 1 pt explanation using factors.", "l": 8}, {"q": "Use logical reasoning to find the mystery number.<br><i>I am a whole number between 20 and 30. I am a multiple of 4. I am also a factor of 48.</i><br>What is the mystery number? Show how you eliminated the other possibilities.", "a": "<b>24.</b> Multiples of 4 between 20 and 30: 20, 24, 28. Factors of 48 are 1, 2, 3, 4, 6, 8, 12, 16, 24, 48, so only 24 works. Rubric: 1 pt correct number, 1 pt listing multiples of 4 (20, 24, 28), 1 pt eliminating 20 and 28 using factors of 48.", "l": 8}, {"q": "Three friends each ate part of a same-size pizza. Jamal ate <span class='fr'><span class='nu'>3</span><span class='de'>8</span></span> of his pizza, Keira ate <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span> of hers, and Luis ate <span class='fr'><span class='nu'>1</span><span class='de'>4</span></span> of his. Who ate the <b>most</b>? Order the three fractions from greatest to least and explain your reasoning.", "a": "<b>Keira ate the most.</b> Use eighths: <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span> = <span class='fr'><span class='nu'>4</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>1</span><span class='de'>4</span></span> = <span class='fr'><span class='nu'>2</span><span class='de'>8</span></span>. Order: <span class='fr'><span class='nu'>1</span><span class='de'>2</span></span>, <span class='fr'><span class='nu'>3</span><span class='de'>8</span></span>, <span class='fr'><span class='nu'>1</span><span class='de'>4</span></span>. Rubric: 1 pt correct person, 1 pt correct order, 1 pt reasoning with a common denominator or benchmark.", "l": 8}, {"q": "A community garden is divided into <b>12</b> equal sections. Tomatoes are planted in <b>8</b> of the sections. Noah says that <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> of the garden is tomatoes. Is Noah correct? Use equivalent fractions to explain.", "a": "<b>Yes, Noah is correct.</b> <span class='fr'><span class='nu'>8</span><span class='de'>12</span></span> of the garden is tomatoes, and 8 ÷ 4 = 2, 12 ÷ 4 = 3, so <span class='fr'><span class='nu'>8</span><span class='de'>12</span></span> = <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span>. Rubric: 1 pt \"yes\", 1 pt writing 8/12, 1 pt showing the equivalent fraction.", "l": 8}, {"q": "Ava, Ben, and Cal each had the same number of math problems. Ava finished <span class='fr'><span class='nu'>4</span><span class='de'>6</span></span> of hers, Ben finished <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> of his, and Cal finished <span class='fr'><span class='nu'>5</span><span class='de'>8</span></span> of his. Which two students finished the <b>same</b> amount? Who finished the <b>least</b>? Explain.", "a": "<b>Ava and Ben finished the same amount; Cal finished the least.</b> <span class='fr'><span class='nu'>4</span><span class='de'>6</span></span> = <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> (divide by 2). Compare <span class='fr'><span class='nu'>2</span><span class='de'>3</span></span> and <span class='fr'><span class='nu'>5</span><span class='de'>8</span></span> using 24ths: <span class='fr'><span class='nu'>16</span><span class='de'>24</span></span> &gt; <span class='fr'><spa ff' stroke='#1d2b44' stroke-width='1'/><rect x='72' y='81' width='9' height='9' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='81' y='81' width='9' height='9' fill='#fff' stroke='#1d2b44' stroke-width='1'/></svg>", "pts": 1, "a": "42 squares shaded; <span class='fr'><span class='nu'>42</span><span class='de'>100</span></span>. (Accept <span class='fr'><span class='nu'>21</span><span class='de'>50</span></span>.)", "l": 3}, {"q": "Write the decimal that names the same amount as <span class='mx'>1<span class='fr'><span class='nu'>9</span><span class='de'>10</span></span></span>.", "pts": 1, "a": "1.9", "l": 4}, {"q": "Complete the table.<br><table class='mini'><tr><th>Fraction</th><th>Decimal</th></tr><tr><td><span class='fr'><span class='nu'>1</span><span class='de'>4</span></span></td><td>____</td></tr><tr><td>____</td><td>0.75</td></tr></table>", "pts": 2, "a": "a) <span class='fr'><span class='nu'>1</span><span class='de'>4</span></span> = 0.25 &nbsp; b) 0.75 = <span class='fr'><span class='nu'>75</span><span class='de'>100</span></span> (or <span class='fr'><span class='nu'>3</span><span class='de'>4</span></span>) &nbsp;(1 pt each)", "l": 5}, {"q": "Add. Write each sum as a fraction with a denominator of 100 and as a decimal.<br><span class='cmp'>a) <span class='fr'><span class='nu'>2</span><span class='de'>10</span></span> + <span class='fr'><span class='nu'>15</span><span class='de'>100</span></span></span><span class='cmp'>b) <span class='fr'><span class='nu'>6</span><span class='de'>10</span></span> + <span class='fr'><span class='nu'>9</span><span class='de'>100</span></span></span><span class='cmp'>c) <span class='fr'><span class='nu'>5</span><span class='de'>10</span></span> + <span class='fr'><span class='nu'>50</span><span class='de'>100</span></span></span>", "pts": 3, "a": "a) <span class='fr'><span class='nu'>35</span><span class='de'>100</span></span> = 0.35 &nbsp; b) <span class='fr'><span class='nu'>69</span><span class='de'>100</span></span> = 0.69 &nbsp; c) <span class='fr'><span class='nu'>100</span><span class='de'>100</span></span> = 1.00 (or 1) &nbsp;(1 pt each)", "l": 6}, {"q": "Compare. Write <b>&lt;</b>, <b>&gt;</b>, or <b>=</b>.<br><span class='cmp'>a) 0.3 &#9675; 0.30</span><span class='cmp'>b) 0.52 &#9675; 0.5</span><span class='cmp'>c) 0.09 &#9675; 0.9</span>", "pts": 3, "a": "a) = &nbsp; b) &gt; &nbsp; c) &lt; &nbsp;(1 pt each)", "l": 7}, {"q": "Order from <b>greatest to least</b>: &nbsp;1.5&nbsp;&nbsp; 1.05&nbsp;&nbsp; 1.55&nbsp;&nbsp; 0.95", "pts": 2, "a": "1.55; 1.5; 1.05; 0.95 &nbsp;(2 pts all correct, 1 pt if one number is misplaced)", "l": 7}, {"q": "Lena says 0.8 is less than 0.75 because 8 is less than 75. Is she correct? Explain using place value.", "pts": 2, "a": "<b>No.</b> 0.8 = 0.80 = 80 hundredths, and 80 hundredths &gt; 75 hundredths, so 0.8 &gt; 0.75. You must compare the same place (tenths first: 8 &gt; 7). (1 pt \"no\", 1 pt explanation)", "l": 7}], "wp": [{"q": "Jun walked <span class='fr'><span class='nu'>4</span><span class='de'>10</span></span> of a kilometer to the library and <span class='fr'><span class='nu'>35</span><span class='de'>100</span></span> of a kilometer from the library to the park. How far did Jun walk in all? Write the answer as a fraction with a denominator of 100 and as a decimal.", "a": "<span class='fr'><span class='nu'>40</span><span class='de'>100</span></span> + <span class='fr'><span class='nu'>35</span><span class='de'>100</span></span> = <b><span class='fr'><span class='nu'>75</span><span class='de'>100</span></span> km = 0.75 km</b>. Rubric: 1 pt rewriting tenths as hundredths, 1 pt fraction sum, 1 pt decimal.", "l": 8}, {"q": "Three seeds were measured. The sunflower seed is 1.2 cm long, the pumpkin seed is 1.15 cm long, and the bean seed is 1.21 cm long. Which seed is the longest? Which is the shortest? Explain how you compared.", "a": "<b>Longest: bean (1.21 cm). Shortest: pumpkin (1.15 cm).</b> 1.21 &gt; 1.20 &gt; 1.15 — compare tenths first (2 &gt; 1), then hundredths (1 &gt; 0). Rubric: 1 pt longest, 1 pt shortest, 1 pt explanation.", "l": 8}, {"q": "A juice bottle holds 2 liters. Mia pours out <span class='fr'><span class='nu'>5</span><span class='de'>10</span></span> of a liter for herself and 0.25 liter for her brother. <b>Extra or missing information?</b> Decide whether the problem below has extra information, and then solve it: <i>How much juice did Mia pour out altogether?</i>", "a": "<b>Extra information:</b> the bottle size (2 liters) is not needed. <span class='fr'><span class='nu'>5</span><span class='de'>10</span></span> = 0.5, and 0.5 + 0.25 = <b>0.75 liter</b> poured out. Rubric: 1 pt identifying the extra fact, 1 pt converting, 1 pt correct total.", "l": 8}, {"q": "Omar says he ran 0.6 of a mile on Monday and \"a little more\" on Tuesday. He wants to know his total for both days. What information is <b>missing</b>? Write a reasonable Tuesday distance as a decimal and use it to find a total.", "a": "<b>Missing:</b> the exact distance Omar ran on Tuesday. Any reasonable value &gt; 0.6 works, e.g. 0.75 mile → 0.6 + 0.75 = 1.35 miles. Rubric: 1 pt naming the missing information, 1 pt reasonable decimal, 1 pt correct addition.", "l": 8}, {"q": "A ribbon is 1 meter long. Priya uses <span class='fr'><span class='nu'>3</span><span class='de'>10</span></span> of a meter for a bow and <span class='fr'><span class='nu'>45</span><span class='de'>100</span></span> of a meter for a border. How much of the meter is <b>left</b>? Write the answer as a decimal.", "a": "<span class='fr'><span class='nu'>30</span><span class='de'>100</span></span> + <span class='fr'><span class='nu'>45</span><span class='de'>100</span></span> = <span class='fr'><span class='nu'>75</span><span class='de'>100</span></span> used; 1 − 0.75 = <b>0.25 meter left</b> (<span class='fr'><span class='nu'>25</span><span class='de'>100</span></span>). Rubric: 1 pt total used, 1 pt subtracting from 1, 1 pt decimal answer.", "l": 8}], "pt": {"title": "The Relay Race", "intro": "<div class='clues'><h4>Relay race times</h4><p>Four friends ran one lap each in a relay race. Their times are shown below. The whole team wants to know who was fastest and how long the first two runners took together.</p><table class='mini'><tr><th>Runner</th><th>Time (seconds)</th></tr><tr><td>Ava</td><td>12.4</td></tr><tr><td>Ben</td><td>12.09</td></tr><tr><td>Cara</td><td>12.40</td></tr><tr><td>Dev</td><td>12.9</td></tr></table></div>", "items": [{"q": "Order the four runners from <b>fastest to slowest</b>. Which two runners had the <b>same</b> time? Explain how you know.", "pts": 2, "a": "<b>Ben (12.09), Ava (12.4) = Cara (12.40), Dev (12.9).</b> Ava and Cara ran the same time because 12.4 = 12.40 (4 tenths = 40 hundredths). (1 pt order, 1 pt explanation)"}, {"q": "Write Ben's time as a mixed number. Then write Dev's time as a fraction greater than 1 with a denominator of 10.", "pts": 2, "a": "Ben: <b><span class='mx'>12<span class='fr'><span class='nu'>9</span><span class='de'>100</span></span></span></b> seconds. Dev: <b><span class='fr'><span class='nu'>129</span><span class='de'>10</span></span></b> seconds. (1 pt each)"}, {"q": "Find the total time for Ava and Ben together. Show how you lined up the tenths and hundredths.", "pts": 1, "a": "12.4 + 12.09 → 12.40 + 12.09 = <b>24.49 seconds</b>. (1 pt: correct sum with hundredths lined up)"}]}}, {"n": 11, "title": "Customary Measurement", "color": "#7cae1f", "light": "#eaf6cf", "dark": "#557a12", "lessons": ["Customary Units of Length", "Convert Customary Units of Length", "Customary Units of Capacity", "Convert Customary Units of Capacity", "Customary Units of Weight", "Convert Customary Units of Weight", "Convert Units of Time", "Display Measurement Data in a Line Plot", "Solve Measurement Problems", "Problem-Solving Investigation: Guess, Check, and Revise"], "standards": ["4.MD.A.1", "4.MD.A.2", "4.MD.B.4", "4.OA.A.3"], "mc": [{"q": "Which customary unit is the <b>best</b> choice to measure the distance between two cities?", "o": ["inch", "foot", "yard", "mile"], "a": 3, "e": "Distances between cities are measured in miles; inches, feet and yards are too small.", "l": 1}, {"q": "Which is the best <b>estimate</b> for the height of a classroom door?", "o": ["7 inches", "7 feet", "7 yards", "7 miles"], "a": 1, "e": "A classroom door is about 7 feet tall. 7 inches is tiny and 7 yards or 7 miles is far too big.", "l": 1}, {"q": "How many inches are in <b>4 feet</b>?", "o": ["40 inches", "44 inches", "48 inches", "52 inches"], "a": 2, "e": "1 foot = 12 inches, so 4 feet = 4 × 12 = 48 inches.", "l": 2}, {"q": "How many feet are in <b>3 yards</b>?", "o": ["9 feet", "6 feet", "12 feet", "36 feet"], "a": 0, "e": "1 yard = 3 feet, so 3 yards = 3 × 3 = 9 feet.", "l": 2}, {"q": "Which is the best <b>estimate</b> for the amount of water a bathtub can hold?", "o": ["2 cups", "3 pints", "4 quarts", "40 gallons"], "a": 3, "e": "A bathtub holds about 40 gallons. 2 cups, 3 pints or 4 quarts would barely cover the bottom.", "l": 3}, {"q": "A pot holds <b>3 quarts</b> of soup. How many <b>cups</b> is that?", "o": ["12 cups", "6 cups", "9 cups", "24 cups"], "a": 0, "e": "1 quart = 4 cups, so 3 quarts = 3 × 4 = 12 cups.", "l": 4}, {"q": "How many pints are in <b>2 gallons</b>?", "o": ["8 pints", "10 pints", "16 pints", "32 pints"], "a": 2, "e": "1 gallon = 8 pints, so 2 gallons = 2 × 8 = 16 pints.", "l": 4}, {"q": "Which object weighs about <b>1 ounce</b>?", "o": ["a slice of bread", "a bicycle", "a watermelon", "a car"], "a": 0, "e": "A slice of bread weighs about 1 ounce. The other objects weigh pounds or more.", "l": 5}, {"q": "A bag of apples weighs <b>5 pounds</b>. How many <b>ounces</b> does it weigh?", "o": ["60 ounces", "80 ounces", "85 ounces", "50 ounces"], "a": 1, "e": "1 pound = 16 ounces, so 5 pounds = 5 × 16 = 80 ounces.", "l": 6}, {"q": "A delivery truck can carry <b>3 tons</b>. How many <b>pounds</b> is that?", "o": ["300 pounds", "3,000 pounds", "60,000 pounds", "6,000 pounds"], "a": 3, "e": "1 ton = 2,000 pounds, so 3 tons = 3 × 2,000 = 6,000 pounds.", "l": 6}, {"q": "A science camp lasts <b>4 hours</b>. How many <b>minutes</b> is that?", "o": ["24 minutes", "240 minutes", "400 minutes", "200 minutes"], "a": 1, "e": "1 hour = 60 minutes, so 4 hours = 4 × 60 = 240 minutes.", "l": 7}, {"q": "A song is <b>3 minutes</b> long. How many <b>seconds</b> is that?", "o": ["300 seconds", "120 seconds", "180 seconds", "30 seconds"], "a": 2, "e": "1 minute = 60 seconds, so 3 minutes = 3 × 60 = 180 seconds.", "l": 7}], "sa": [{"q": "How many <b>inches</b> are in <b>1 yard</b>?", "pts": 1, "a": "<b>36 inches</b> (1 yard = 3 feet = 3 × 12 inches)", "l": 2}, {"q": "Complete the conversion table.<br><table class='mini'><tr><th>Yards</th><th>1</th><th>2</th><th>4</th><th>7</th></tr><tr><td>Feet</td><td>3</td><td>6</td><td>______</td><td>______</td></tr></table>", "pts": 2, "a": "4 yards = <b>12 feet</b>; 7 yards = <b>21 feet</b> (multiply yards by 3). (1 pt each)", "l": 2}, {"q": "Compare. Write <b>&lt;</b>, <b>&gt;</b>, or <b>=</b> in each circle.<br><span class='cmp'>a) 50 inches &#9675; 4 feet</span><span class='cmp'>b) 2 yards &#9675; 7 feet</span>", "pts": 2, "a": "a) &gt; (4 ft = 48 in, 50 &gt; 48) &nbsp;&nbsp; b) &lt; (2 yd = 6 ft, 6 &lt; 7) &nbsp;(1 pt each)", "l": 2}, {"q": "Complete each conversion.<br><span class='cmp'>a) 24 cups = ______ pints</span><span class='cmp'>b) 5 gallons = ______ quarts</span>", "pts": 2, "a": "a) <b>12 pints</b> (24 ÷ 2) &nbsp;&nbsp; b) <b>20 quarts</b> (5 × 4) &nbsp;(1 pt each)", "l": 4}, {"q": "A pitcher holds <b>2 quarts</b> of juice. How many <b>fluid ounces</b> is that?", "pts": 1, "a": "<b>64 fluid ounces</b> (2 quarts = 8 cups; 8 × 8 fl oz = 64 fl oz)", "l": 4}, {"q": "Complete each conversion.<br><span class='cmp'>a) 4 pounds = ______ ounces</span><span class='cmp'>b) 2 tons = ______ pounds</span>", "pts": 2, "a": "a) <b>64 ounces</b> (4 × 16) &nbsp;&nbsp; b) <b>4,000 pounds</b> (2 × 2,000) &nbsp;(1 pt each)", "l": 6}, {"q": "Which is heavier: <b>90 ounces</b> or <b>5 pounds</b>? Explain how you know.", "pts": 1, "a": "<b>90 ounces</b>. 5 pounds = 5 × 16 = 80 ounces, and 90 &gt; 80.", "l": 6}, {"q": "Complete each conversion.<br><span class='cmp'>a) 3 hours 20 minutes = ______ minutes</span><span class='cmp'>b) 2 weeks = ______ days</span>", "pts": 2, "a": "a) <b>200 minutes</b> (3 × 60 + 20) &nbsp;&nbsp; b) <b>14 days</b> (2 × 7) &nbsp;(1 pt each)", "l": 7}, {"q": "Mr. Lee's class measured crayons to the nearest half inch and made this line plot.<br><div class='figrow'><div><svg xmlns='http://www.w3.org/2000/svg' width='260' height='114' viewBox='0 0 260 114' style='vertical-align:middle;display:inline-block'><line x1='20' y1='82' x2='240' y2='82' stroke='#1d2b44' stroke-width='2'/><line x1='20.0' y1='78' x2='20.0' y2='86' stroke='#1d2b44' stroke-width='2'/><text x='20.0' y='100' font-size='11' font-family='Nunito' text-anchor='middle'>2</text><text x='20.0' y='74' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><line x1='75.0' y1='78' x2='75.0' y2='86' stroke='#1d2b44' stroke-width='2'/><text x='75.0' y='100' font-size='11' font-family='Nunito' text-anchor='middle'>2½</text><text x='75.0' y='74' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><text x='75.0' y='60' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><line x1='130.0' y1='78' x2='130.0' y2='86' stroke='#1d2b44' stroke-width='2'/><text x='130.0' y='100' font-size='11' font-family='Nunito' text-anchor='middle'>3</text><text x='130.0' y='74' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><text x='130.0' y='60' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><text x='130.0' y='46' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><text x='130.0' y='32' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><line x1='185.0' y1='78' x2='185.0' y2='86' stroke='#1d2b44' stroke-width='2'/><text x='185.0' y='100' font-size='11' font-family='Nunito' text-anchor='middle'>3½</text><text x='185.0' y='74' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><text x='185.0' y='60' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><line x1='240.0' y1='78' x2='240.0' y2='86' stroke='#1d2b44' stroke-width='2'/><text x='240.0' y='100' font-size='11' font-family='Nunito' text-anchor='middle'>4</text><text x='240.0' y='74' font-size='14' font-weight='bold' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>X</text><text x='130.0' y='14' font-size='11' font-family='Nunito' text-anchor='middle' font-weight='bold'>Crayon Lengths</text><text x='130.0' y='111' font-size='10' font-family='Nunito' text-anchor='middle'>Length (inches)</text></svg></div></div><span class='cmp'>a) How many crayons were measured? ______</span><span class='cmp'>b) Most common length: ______ in.</span><span class='cmp'>c) Longest − shortest = ______ in.</span>", "pts": 3, "a": "a) <b>10 crayons</b> (count the Xs: 1 + 2 + 4 + 2 + 1) &nbsp; b) <b>3 inches</b> (4 Xs) &nbsp; c) <b>2 inches</b> (4 − 2) &nbsp;(1 pt each)", "l": 8}, {"q": "Nora has a ribbon that is <b>3 yards</b> long. She cuts off <b>4 feet</b> to wrap a gift. How many <b>feet</b> of ribbon are left?", "pts": 2, "a": "<b>5 feet</b>. 3 yards = 9 feet; 9 − 4 = 5 feet. (1 pt conversion, 1 pt answer)", "l": 9}], "wp": [{"q": "Jada needs to fill a <b>3-gallon</b> water cooler. She uses a pitcher that holds <b>1 quart</b>. How many times must she fill the pitcher? Show how you converted the units.", "a": "<b>12 times.</b> 1 gallon = 4 quarts, so 3 gallons = 12 quarts; 12 ÷ 1 = 12 pitchers. Rubric: 1 pt correct conversion (12 quarts), 1 pt correct answer, 1 pt work shown.", "l": 10}, {"q": "A box holds 6 identical books. The books together weigh <b>4 pounds 8 ounces</b>. How many <b>ounces</b> does each book weigh?", "a": "<b>12 ounces.</b> 4 pounds = 64 ounces; 64 + 8 = 72 ounces; 72 ÷ 6 = 12 ounces. Rubric: 1 pt converting to 72 ounces, 1 pt dividing by 6, 1 pt correct answer with unit.", "l": 10}, {"q": "Soccer practice starts at <b>3:45 p.m.</b> and lasts <b>1 hour 30 minutes</b>. After practice, Sam takes <b>25 minutes</b> to walk home. What time does Sam get home?", "a": "<b>5:40 p.m.</b> 3:45 + 1 h 30 min = 5:15 p.m.; 5:15 + 25 min = 5:40 p.m. Rubric: 1 pt end of practice (5:15), 1 pt adding 25 minutes, 1 pt correct final time.", "l": 10}, {"q": "Mia bought <b>9 jars</b> of honey: some <b>1-pint</b> jars and some <b>1-quart</b> jars. Together they hold <b>26 cups</b>. How many jars of each size did she buy? Use guess, check, and revise.", "a": "<b>5 pint jars and 4 quart jars.</b> 1 pint = 2 cups, 1 quart = 4 cups. Check: 5 × 2 + 4 × 4 = 10 + 16 = 26 cups and 5 + 4 = 9 jars. Rubric: 1 pt guesses checked against both clues, 2 pts correct pair.", "l": 10}, {"q": "Carlos has a board that is <b>12 feet</b> long. He cuts it into shelves that are each <b>2 feet 6 inches</b> long. How many shelves can he cut? How many <b>inches</b> of board are left over?", "a": "<b>4 shelves</b>, with <b>24 inches</b> left over. 12 ft = 144 in; 2 ft 6 in = 30 in; 144 ÷ 30 = 4 R 24. Rubric: 1 pt converting both lengths to inches, 1 pt 4 shelves, 1 pt 24 inches left over.", "l": 10}], "pt": {"title": "Planning Field Day", "intro": "<div class='clues'><h4>Field Day Supplies</h4><table class='mini'><tr><th>Item</th><th>Amount</th></tr><tr><td>Lemonade</td><td>3 coolers, each holds 2 gallons; served in 1-cup paper cups</td></tr><tr><td>Tug-of-war rope</td><td>10 yards long</td></tr><tr><td>Events</td><td>3 events, 25 minutes each, 10-minute break between events</td></tr></table></div>", "items": [{"q": "How many <b>1-cup</b> servings of lemonade are in the 3 coolers? If each of the 85 students gets one cup, how many cups are left?", "pts": 2, "a": "<b>96 cups</b> (1 gallon = 16 cups; 3 × 2 × 16 = 96). Left over: 96 − 85 = <b>11 cups</b>. (1 pt each)"}, {"q": "The rope must be <b>at least 28 feet</b> long. Is the 10-yard rope long enough? By how many feet?", "pts": 2, "a": "<b>Yes.</b> 10 yards = 30 feet, which is <b>2 feet longer</b> than 28 feet. (1 pt conversion to 30 ft, 1 pt comparison)"}, {"q": "Field Day begins at <b>9:30 a.m.</b> Create a schedule showing the start and end time of each event. When does Field Day end?", "pts": 1, "a": "Event 1: <b>9:30–9:55</b>; break; Event 2: <b>10:05–10:30</b>; break; Event 3: <b>10:40–11:05 a.m.</b> Field Day ends at <b>11:05 a.m.</b> (1 pt: all three events correct with breaks, total 95 minutes)"}]}}, {"n": 12, "title": "Metric Measurement", "color": "#5b6b8a", "light": "#e3e8f1", "dark": "#3b475e", "lessons": ["Metric Units of Length", "Metric Units of Capacity", "Metric Units of Mass", "Problem-Solving Investigation: Make an Organized List", "Convert Metric Units", "Solve Measurement Problems"], "standards": ["4.MD.A.1", "4.MD.A.2", "4.OA.A.3"], "mc": [{"q": "Which metric unit is the <b>best</b> choice to measure the length of a pencil?", "o": ["millimeter", "centimeter", "meter", "kilometer"], "a": 1, "e": "A pencil is about 15–20 cm long, so centimeters are the best unit.", "l": 1}, {"q": "Which is the best <b>estimate</b> for the width of a classroom door?", "o": ["1 millimeter", "1 centimeter", "1 meter", "1 kilometer"], "a": 2, "e": "A door is about 1 meter wide. 1 cm or 1 mm is far too small; 1 km is huge.", "l": 1}, {"q": "Which length is the <b>greatest</b>?", "o": ["7 meters", "6,000 millimeters", "650 centimeters", "5 meters 90 centimeters"], "a": 0, "e": "Convert everything to meters: 6,000 mm = 6 m, 650 cm = 6.5 m, 5 m 90 cm = 5.9 m. The greatest is 7 m.", "l": 1}, {"q": "Which is the best <b>estimate</b> for the amount of juice in a small juice box?", "o": ["2 milliliters", "2 liters", "20 liters", "200 milliliters"], "a": 3, "e": "A small juice box holds about 200 mL. 2 mL is a few drops; 2 L or 20 L is far too much.", "l": 2}, {"q": "Which container holds about <b>1 liter</b>?", "o": ["a teaspoon", "a large water bottle", "a bathtub", "a swimming pool"], "a": 1, "e": "A large water bottle holds about 1 liter. A teaspoon is tiny; a bathtub or pool holds much more.", "l": 2}, {"q": "Which object has a mass of about <b>1 kilogram</b>?", "o": ["a paper clip", "a feather", "a school bus", "a dictionary"], "a": 3, "e": "A dictionary has a mass of about 1 kg. A paper clip or feather is about 1 gram; a bus is many tonnes.", "l": 3}, {"q": "Which is the best <b>estimate</b> for the mass of an apple?", "o": ["150 grams", "150 kilograms", "1 gram", "15 kilograms"], "a": 0, "e": "An apple has a mass of about 150 grams. 1 gram is far too light and 15 or 150 kg is far too heavy.", "l": 3}, {"q": "A trail is <b>3 kilometers</b> long. How many <b>meters</b> is that?", "o": ["300 meters", "30 meters", "3,000 meters", "30,000 meters"], "a": 2, "e": "1 km = 1,000 m, so 3 km = 3 × 1,000 = 3,000 m.", "l": 5}, {"q": "How many centimeters are in <b>5 meters</b>?", "o": ["5,000 centimeters", "50 centimeters", "5 centimeters", "500 centimeters"], "a": 3, "e": "1 m = 100 cm, so 5 m = 5 × 100 = 500 cm.", "l": 5}, {"q": "A fish tank holds <b>4 liters</b> of water. How many <b>milliliters</b> is that?", "o": ["4,000 milliliters", "400 milliliters", "40 milliliters", "40,000 milliliters"], "a": 0, "e": "1 L = 1,000 mL, so 4 L = 4 × 1,000 = 4,000 mL.", "l": 5}, {"q": "A watermelon has a mass of <b>7 kilograms</b>. How many <b>grams</b> is that?", "o": ["700 grams", "70 grams", "7,000 grams", "70,000 grams"], "a": 2, "e": "1 kg = 1,000 g, so 7 kg = 7 × 1,000 = 7,000 g.", "l": 5}, {"q": "A rope is <b>2 meters</b> long. Ana cuts off <b>75 centimeters</b>. How many <b>centimeters</b> of rope are left?", "o": ["75 centimeters", "125 centimeters", "275 centimeters", "195 centimeters"], "a": 1, "e": "2 m = 200 cm. Then 200 − 75 = 125 cm left.", "l": 6}], "sa": [{"q": "Complete: <b>1 meter</b> = ______ centimeters.", "pts": 1, "a": "<b>100</b> centimeters", "l": 1}, {"q": "Write the best metric unit (<i>millimeter, centimeter, meter,</i> or <i>kilometer</i>) to measure the thickness of a coin.", "pts": 1, "a": "millimeter", "l": 1}, {"q": "Circle the better estimate for the amount of water a bucket holds: &nbsp;<b>8 liters</b> &nbsp;or&nbsp; <b>8 milliliters</b>. Explain your choice.", "pts": 1, "a": "<b>8 liters</b>. A milliliter is tiny (a few drops); 8 milliliters would not even fill a spoon.", "l": 2}, {"q": "Write <b>gram</b> or <b>kilogram</b> as the best unit to measure the mass of each object.<br><span class='cmp'>a) a bicycle ____________</span><span class='cmp'>b) a strawberry ____________</span>", "pts": 2, "a": "a) <b>kilogram</b> &nbsp;&nbsp; b) <b>gram</b> &nbsp;(1 pt each)", "l": 3}, {"q": "Complete the conversion table.<br><table class='mini'><tr><th>Kilometers</th><th>1</th><th>2</th><th>5</th><th>8</th></tr><tr><td>Meters</td><td>1,000</td><td>2,000</td><td>______</td><td>______</td></tr></table>", "pts": 2, "a": "5 km = <b>5,000 m</b>; 8 km = <b>8,000 m</b> (multiply kilometers by 1,000). (1 pt each)", "l": 5}, {"q": "Complete each conversion.<br><span class='cmp'>a) 6 meters = ______ centimeters</span><span class='cmp'>b) 9 liters = ______ milliliters</span>", "pts": 2, "a": "a) <b>600 centimeters</b> (6 × 100) &nbsp;&nbsp; b) <b>9,000 milliliters</b> (9 × 1,000) &nbsp;(1 pt each)", "l": 5}, {"q": "Complete each conversion.<br><span class='cmp'>a) 2 kilograms = ______ grams</span><span class='cmp'>b) 40 centimeters = ______ millimeters</span>", "pts": 2, "a": "a) <b>2,000 grams</b> (2 × 1,000) &nbsp;&nbsp; b) <b>400 millimeters</b> (40 × 10) &nbsp;(1 pt each)", "l": 5}, {"q": "Compare. Write <b>&lt;</b>, <b>&gt;</b>, or <b>=</b> in each circle.<br><span class='cmp'>a) 350 cm &#9675; 4 m</span><span class='cmp'>b) 2 kg &#9675; 1,900 g</span>", "pts": 2, "a": "a) &lt; (4 m = 400 cm, 350 &lt; 400) &nbsp;&nbsp; b) &gt; (2 kg = 2,000 g, 2,000 &gt; 1,900) &nbsp;(1 pt each)", "l": 5}, {"q": "A water bottle holds <b>500 milliliters</b>. How many bottles are needed to fill a <b>2-liter</b> pitcher?", "pts": 2, "a": "<b>4 bottles</b>. 2 L = 2,000 mL; 2,000 ÷ 500 = 4. (1 pt conversion, 1 pt answer)", "l": 6}, {"q": "Liam's three long jumps measured <b>1 m 20 cm</b>, <b>95 cm</b>, and <b>1 m 5 cm</b>.<br><span class='cmp'>a) Write each jump in centimeters: ______, ______, ______</span><span class='cmp'>b) Longest jump: ______ cm</span><span class='cmp'>c) Longest − shortest: ______ cm</span>", "pts": 3, "a": "a) <b>120 cm, 95 cm, 105 cm</b> &nbsp; b) <b>120 cm</b> &nbsp; c) <b>25 cm</b> (120 − 95) &nbsp;(1 pt each)", "l": 6}], "wp": [{"q": "A recipe needs <b>1 kilogram</b> of flour. Maya has small bags of flour that each hold <b>250 grams</b>. How many bags does she need? Show how you converted the units.", "a": "<b>4 bags.</b> 1 kg = 1,000 g; 1,000 ÷ 250 = 4. Rubric: 1 pt converting to 1,000 g, 1 pt dividing by 250, 1 pt correct answer.", "l": 4}, {"q": "A juice stand sells cups of <b>250 mL</b> and <b>500 mL</b>. Priya wants to buy <b>exactly 1 liter</b> of juice. Make an organized list of all the ways she can do it. How many ways are there?", "a": "<b>3 ways.</b> 1 L = 1,000 mL: 4 × 250 mL; 2 × 250 mL + 1 × 500 mL; 2 × 500 mL. Rubric: 1 pt organized list, 1 pt all three ways with no repeats, 1 pt correct count.", "l": 4}, {"q": "Ella runs <b>1,500 meters</b> every day. How many <b>kilometers</b> does she run in <b>4 days</b>?", "a": "<b>6 kilometers.</b> 1,500 × 4 = 6,000 m; 6,000 m = 6 km. Rubric: 1 pt multiplying (6,000 m), 1 pt converting to km, 1 pt correct answer with unit.", "l": 4}, {"q": "A package has a total mass of <b>3 kilograms</b>. Inside are two gifts with masses of <b>850 grams</b> and <b>1,200 grams</b>. The rest is the mass of the box. What is the mass of the box in <b>grams</b>?", "a": "<b>950 grams.</b> 3 kg = 3,000 g; 850 + 1,200 = 2,050 g; 3,000 − 2,050 = 950 g. Rubric: 1 pt converting to 3,000 g, 1 pt adding the gifts (2,050 g), 1 pt correct subtraction.", "l": 4}, {"q": "Noah has a ribbon that is <b>3 meters</b> long. He cuts it into pieces that are each <b>40 centimeters</b> long. How many pieces can he cut? How many <b>centimeters</b> of ribbon are left over?", "a": "<b>7 pieces</b>, with <b>20 centimeters</b> left over. 3 m = 300 cm; 300 ÷ 40 = 7 R 20. Rubric: 1 pt converting to 300 cm, 1 pt 7 pieces, 1 pt 20 cm left over.", "l": 4}], "pt": {"title": "The Class Garden", "intro": "<div class='clues'><h4>Garden Plan</h4><table class='mini'><tr><th>Item</th><th>Fact</th></tr><tr><td>Garden bed</td><td>4 meters long</td></tr><tr><td>Plant spacing</td><td>each plant needs 50 centimeters of the bed</td></tr><tr><td>Water</td><td>each plant gets 250 milliliters a day; watering can holds 1 liter</td></tr><tr><td>Soil</td><td>each plant needs 1,500 grams; the class has one 10-kilogram bag</td></tr></table></div>", "items": [{"q": "Write the length of the garden bed in <b>centimeters</b>. Then find how many plants fit in the bed.", "pts": 2, "a": "<b>400 cm</b>; 400 ÷ 50 = <b>8 plants</b>. (1 pt each)"}, {"q": "How many <b>milliliters</b> of water do all the plants need each day? How many times must the class fill the 1-liter watering can?", "pts": 2, "a": "8 × 250 = <b>2,000 mL</b>; 2,000 mL = 2 L, so the can is filled <b>2 times</b>. (1 pt each)"}, {"q": "Is one 10-kilogram bag of soil enough for all the plants? Justify your answer with a calculation.", "pts": 1, "a": "<b>No.</b> 8 × 1,500 g = 12,000 g = 12 kg, which is more than 10 kg; the class needs 2 kg more. (1 pt: correct decision with calculation)"}]}}, {"n": 13, "title": "Perimeter and Area", "color": "#9c6b3f", "light": "#f1e4d6", "dark": "#6a4727", "lessons": ["Measure Perimeter", "Problem-Solving Investigation: Solve a Simpler Problem", "Hands On: Model Area", "Measure Area", "Relate Area and Perimeter"], "standards": ["4.MD.A.3", "4.OA.A.3", "4.NBT.B.5"], "mc": [{"q": "What is the <b>perimeter</b> of this rectangle?<br><svg xmlns='http://www.w3.org/2000/svg' width='184' height='100' viewBox='0 0 184 100' style='vertical-align:middle;display:inline-block'><rect x='30' y='8' width='144' height='64' fill='#e8eef6' stroke='#1d2b44' stroke-width='2'/><text x='102.0' y='92' font-size='13' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>9 cm</text><text x='18' y='45.0' font-size='13' font-family='Nunito' text-anchor='end' fill='#1d2b44'>4 cm</text></svg>", "o": ["13 cm", "22 cm", "26 cm", "36 cm"], "a": 2, "e": "Perimeter = 9 + 4 + 9 + 4 = 26 cm (add all four sides).", "l": 1}, {"q": "A square tile has sides that are <b>7 inches</b> long. What is the perimeter of the tile?", "o": ["14 inches", "21 inches", "49 inches", "28 inches"], "a": 3, "e": "A square has 4 equal sides: 4 × 7 = 28 inches.", "l": 1}, {"q": "A rectangle has a perimeter of <b>30 meters</b>. Its length is <b>10 meters</b>. What is its width?", "o": ["5 meters", "10 meters", "20 meters", "15 meters"], "a": 0, "e": "Two lengths = 20 m, so the two widths total 30 − 20 = 10 m. Each width is 5 m.", "l": 1}, {"q": "Split the figure into rectangles to find its <b>area</b>.<br><svg xmlns='http://www.w3.org/2000/svg' width='194' height='116' viewBox='0 0 194 116' style='vertical-align:middle;display:inline-block'><polygon points='34,10 90,10 90,52 146,52 146,94 34,94' fill='#e8eef6' stroke='#1d2b44' stroke-width='2'/><text x='62.0' y='8.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>4 cm</text><text x='28.0' y='56.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='end' fill='#1d2b44'>6 cm</text><text x='90.0' y='108.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>8 cm</text><text x='151.0' y='77.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='start' fill='#1d2b44'>3 cm</text><text x='95.0' y='35.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='start' fill='#1d2b44'>3 cm</text><text x='118.0' y='65.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>4 cm</text></svg>", "o": ["48 sq cm", "36 sq cm", "24 sq cm", "30 sq cm"], "a": 1, "e": "Split into a 4 × 6 rectangle (24) and a 4 × 3 rectangle (12): 24 + 12 = 36 sq cm. Or 8 × 6 = 48 minus the 4 × 3 notch (12).", "l": 2}, {"q": "Each square is <b>1 square unit</b>. What is the area of the rectangle?<br><svg xmlns='http://www.w3.org/2000/svg' width='82' height='50' viewBox='0 0 82 50' style='vertical-align:middle;display:inline-block'><rect x='0' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/></svg>", "o": ["15 square units", "16 square units", "8 square units", "30 square units"], "a": 0, "e": "The rectangle is 5 squares wide and 3 squares tall: 5 × 3 = 15 square units.", "l": 3}, {"q": "Each square is <b>1 square unit</b>. What is the area of the <b>shaded</b> figure?<br><svg xmlns='http://www.w3.org/2000/svg' width='66' height='50' viewBox='0 0 66 50' style='vertical-align:middle;display:inline-block'><rect x='0' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='0' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='16' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='16' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='32' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='32' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/></svg>", "o": ["12 square units", "7 square units", "5 square units", "14 square units"], "a": 1, "e": "Count the shaded unit squares: 7 square units.", "l": 3}, {"q": "What is the <b>area</b> of a rectangle that is <b>8 meters</b> long and <b>6 meters</b> wide?", "o": ["28 sq m", "14 sq m", "48 sq m", "24 sq m"], "a": 2, "e": "Area = length × width = 8 × 6 = 48 square meters.", "l": 4}, {"q": "A square garden has sides that are <b>9 feet</b> long. What is its area?", "o": ["36 sq ft", "18 sq ft", "72 sq ft", "81 sq ft"], "a": 3, "e": "Area of a square = side × side = 9 × 9 = 81 square feet.", "l": 4}, {"q": "A rectangular rug has an area of <b>54 square feet</b>. Its width is <b>6 feet</b>. What is its length?", "o": ["48 feet", "9 feet", "21 feet", "324 feet"], "a": 1, "e": "Length = area ÷ width = 54 ÷ 6 = 9 feet.", "l": 4}, {"q": "Which rectangle has the <b>same area</b> as a 4-by-6 rectangle but a <b>different perimeter</b>?", "o": ["2 by 12", "3 by 7", "4 by 6", "5 by 5"], "a": 0, "e": "A 4-by-6 rectangle has area 24 and perimeter 20. A 2-by-12 rectangle also has area 24 but its perimeter is 28.", "l": 5}, {"q": "A rectangle has a perimeter of <b>20 units</b>. Which side lengths give the <b>greatest</b> area?", "o": ["1 by 9", "2 by 8", "4 by 6", "5 by 5"], "a": 3, "e": "Rectangles with perimeter 20: 1×9 (area 9), 2×8 (16), 3×7 (21), 4×6 (24), 5×5 (25). The square gives the greatest area.", "l": 5}, {"q": "Rectangle P is <b>3 by 8</b>. Rectangle Q is <b>5 by 6</b>. Which statement is true?", "o": ["They have the same area.", "P has the greater area.", "They have the same perimeter.", "Q has the greater perimeter."], "a": 2, "e": "P: perimeter 22, area 24. Q: perimeter 22, area 30. They have the same perimeter but Q has the greater area.", "l": 5}], "sa": [{"q": "Find the <b>perimeter</b> of the rectangle.<br><svg xmlns='http://www.w3.org/2000/svg' width='216' height='84' viewBox='0 0 216 84' style='vertical-align:middle;display:inline-block'><rect x='30' y='8' width='176' height='48' fill='#e8eef6' stroke='#1d2b44' stroke-width='2'/><text x='118.0' y='76' font-size='13' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>11 cm</text><text x='18' y='37.0' font-size='13' font-family='Nunito' text-anchor='end' fill='#1d2b44'>3 cm</text></svg>", "pts": 1, "a": "<b>28 cm</b> (11 + 3 + 11 + 3)", "l": 1}, {"q": "A square playground has a perimeter of <b>48 meters</b>. How long is one side? Explain how you know.", "pts": 2, "a": "<b>12 meters</b>. A square has 4 equal sides, so 48 ÷ 4 = 12. (1 pt answer, 1 pt explanation)", "l": 1}, {"q": "Solve a simpler problem: split the figure into two rectangles and find the <b>total area</b>.<br><svg xmlns='http://www.w3.org/2000/svg' width='222' height='130' viewBox='0 0 222 130' style='vertical-align:middle;display:inline-block'><polygon points='34,10 90,10 90,66 174,66 174,108 34,108' fill='#e8eef6' stroke='#1d2b44' stroke-width='2'/><text x='62.0' y='8.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>4 m</text><text x='28.0' y='63.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='end' fill='#1d2b44'>7 m</text><text x='104.0' y='122.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>10 m</text><text x='179.0' y='91.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='start' fill='#1d2b44'>3 m</text><text x='95.0' y='42.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='start' fill='#1d2b44'>4 m</text><text x='132.0' y='79.0' font-size='11' font-family='Nunito' font-weight='700' text-anchor='middle' fill='#1d2b44'>6 m</text></svg>", "pts": 2, "a": "<b>46 sq m</b>. For example, 4 × 7 = 28 and 6 × 3 = 18; 28 + 18 = 46. (Or 10 × 7 − 6 × 4 = 70 − 24 = 46.) (1 pt splitting, 1 pt area)", "l": 2}, {"q": "Each square is <b>1 square unit</b>. Shade a rectangle with an area of <b>12 square units</b>.<br><svg xmlns='http://www.w3.org/2000/svg' width='98' height='66' viewBox='0 0 98 66' style='vertical-align:middle;display:inline-block'><rect x='0' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width ": "Any rectangle with 12 unit squares: <b>3 × 4, 2 × 6, or 1 × 12</b> (1 × 12 does not fit, so 3 × 4 or 2 × 6).", "l": 3}, {"q": "Each square is <b>1 square unit</b>. Find the <b>area</b> and the <b>perimeter</b> of the shaded rectangle.<br><svg xmlns='http://www.w3.org/2000/svg' width='82' height='98' viewBox='0 0 82 98' style='vertical-align:middle;display:inline-block'><rect x='0' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='0' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='16' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='16' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='16' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='32' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='32' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='32' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='48' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='48' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='48' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='48' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='48' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='64' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='64' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='64' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='64' width='16' height='16' fill='#cfe3f7' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='64' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='0' y='80' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='16' y='80' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='32' y='80' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='48' y='80' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/><rect x='64' y='80' width='16' height='16' fill='#fff' stroke='#1d2b44' stroke-width='1'/></svg><span class='cmp'>a) Area = ______ square units</span><span class='cmp'>b) Perimeter = ______ units</span>", "pts": 2, "a": "a) <b>12 square units</b> (3 × 4) &nbsp;&nbsp; b) <b>14 units</b> (3 + 4 + 3 + 4) &nbsp;(1 pt each)", "l": 3}, {"q": "Find each <b>area</b>.<br><span class='cmp'>a) a rectangle 12 in. long and 7 in. wide: ______</span><span class='cmp'>b) a square with 10 m sides: ______</span>", "pts": 2, "a": "a) <b>84 sq in</b> (12 × 7) &nbsp;&nbsp; b) <b>100 sq m</b> (10 × 10) &nbsp;(1 pt each)", "l": 4}, {"q": "A rectangular poster has an area of <b>72 square inches</b>. Its length is <b>9 inches</b>.<br><span class='cmp'>a) Width = ______ in.</span><span class='cmp'>b) Perimeter = ______ in.</span>", "pts": 2, "a": "a) <b>8 inches</b> (72 ÷ 9) &nbsp;&nbsp; b) <b>34 inches</b> (9 + 8 + 9 + 8) &nbsp;(1 pt each)", "l": 4}, {"q": "A floor is <b>6 meters</b> long and <b>5 meters</b> wide. Each square meter of carpet costs <b>$4</b>.<br><span class='cmp'>a) Area of the floor = ______ sq m</span><span class='cmp'>b) Cost of carpet = $______</span>", "pts": 2, "a": "a) <b>30 sq m</b> (6 × 5) &nbsp;&nbsp; b) <b>$120</b> (30 × 4) &nbsp;(1 pt each)", "l": 4}, {"q": "Rectangle A is <b>2 units by 10 units</b>. Rectangle B is <b>5 units by 6 units</b>.<br><span class='cmp'>a) Which has the greater perimeter? ______</span><span class='cmp'>b) Which has the greater area? ______</span>", "pts": 2, "a": "a) <b>A</b> (24 units vs. 22 units) &nbsp;&nbsp; b) <b>B</b> (30 sq units vs. 20 sq units) &nbsp;(1 pt each)", "l": 5}, {"q": "List the side lengths of <b>every</b> rectangle with whole-number sides and a perimeter of <b>16 units</b>. Which one has the greatest area?", "pts": 2, "a": "<b>1 × 7, 2 × 6, 3 × 5, 4 × 4</b>. The <b>4 × 4</b> square has the greatest area, 16 square units. (1 pt complete list, 1 pt greatest area)", "l": 5}], "wp": [{"q": "A rectangular yard is <b>24 meters</b> long and <b>18 meters</b> wide. Fencing costs <b>$6 per meter</b>. How much will it cost to fence the whole yard?", "a": "<b>$504.</b> Perimeter = 24 + 18 + 24 + 18 = 84 m; 84 × $6 = $504. Rubric: 1 pt perimeter (84 m), 1 pt multiplying by $6, 1 pt correct answer.", "l": 2}, {"q": "A wall is <b>12 feet</b> wide and <b>8 feet</b> tall. It has one window that is <b>3 feet</b> wide and <b>2 feet</b> tall. Solve a simpler problem to find the area of the wall that will be painted (not the window).", "a": "<b>90 square feet.</b> Wall: 12 × 8 = 96 sq ft; window: 3 × 2 = 6 sq ft; 96 − 6 = 90 sq ft. Rubric: 1 pt wall area, 1 pt window area, 1 pt correct subtraction.", "l": 2}, {"q": "A classroom rug is <b>6 meters</b> long and <b>2 meters</b> wide. Mrs. Kim orders a second rug with the <b>same perimeter</b> but the <b>greatest possible area</b> (whole-number sides). What are its dimensions and its area?", "a": "<b>4 m by 4 m, area 16 sq m.</b> Perimeter = 16 m; rectangles with perimeter 16: 1 × 7, 2 × 6, 3 × 5, 4 × 4; the 4 × 4 has the greatest area. Rubric: 1 pt perimeter (16 m), 1 pt dimensions, 1 pt area.", "l": 2}, {"q": "Mr. Ruiz covers a floor that is <b>9 feet</b> by <b>7 feet</b> with square tiles that are <b>1 foot</b> on each side. Tiles come in boxes of <b>10</b>. How many boxes does he need? How many tiles will be left over?", "a": "<b>7 boxes</b>, <b>7 tiles</b> left over. Area = 9 × 7 = 63 tiles; 63 ÷ 10 = 6 R 3, so 7 boxes (70 tiles); 70 − 63 = 7 left over. Rubric: 1 pt 63 tiles, 1 pt 7 boxes, 1 pt 7 left over.", "l": 2}, {"q": "A rectangular banner has a perimeter of <b>40 inches</b>. Its length is <b>14 inches</b>. What is the <b>area</b> of the banner?", "a": "<b>84 square inches.</b> 14 + 14 = 28; 40 − 28 = 12; width = 12 ÷ 2 = 6 in; area = 14 × 6 = 84 sq in. Rubric: 1 pt finding the width (6 in), 1 pt area formula, 1 pt correct answer.", "l": 2}], "pt": {"title": "Design a Playground", "intro": "<div class='clues'><h4>Playground Plan</h4><div class='figrow'><div><svg xmlns='http://www.w3.org/2000/svg' width='180' height='120' viewBox='0 0 180 120' style='vertical-align:middle;display:inline-block'><rect x='30' y='8' width='140' height='84' fill='#cfe3f7' stroke='#1d2b44' stroke-width='2'/><text x='100.0' y='112' font-size='13' font-family='Nunito' text-anchor='middle' fill='#1d2b44'>20 m</text><text x='18' y='55.0' font-size='13' font-family='Nunito' text-anchor='end' fill='#1d2b44'>12 m</text></svg><div class='cap'>Playground</div></div><div><table class='mini'><tr><th>Area</th><th>Size</th></tr><tr><td>Whole playground</td><td>20 m by 12 m rectangle</td></tr><tr><td>Sandbox</td><td>4 m by 3 m</td></tr><tr><td>Basketball court</td><td>10 m by 6 m</td></tr><tr><td>Fence</td><td>$5 per meter, all the way around</td></tr></table></div></div></div>", "items": [{"q": "How many meters of fence go around the playground? How much will the fence cost?", "pts": 2, "a": "Perimeter = 20 + 12 + 20 + 12 = <b>64 m</b>; cost = 64 × $5 = <b>$320</b>. (1 pt each)"}, {"q": "What is the <b>area</b> of the whole playground? How many square meters are <b>not</b> covered by the sandbox or the basketball court?", "pts": 2, "a": "Area = 20 × 12 = <b>240 sq m</b>. Sandbox 4 × 3 = 12 sq m; court 10 × 6 = 60 sq m; 240 − 12 − 60 = <b>168 sq m</b>. (1 pt each)"}, {"q": "Design a new sandbox with an area of <b>24 square meters</b> and the <b>smallest possible perimeter</b> (whole-number sides). Give its length, width, and perimeter, and explain why it is the smallest.", "pts": 1, "a": "<b>6 m by 4 m, perimeter 20 m.</b> Rectangles with area 24: 1 × 24 (P = 50), 2 × 12 (P = 28), 3 × 8 (P = 22), 4 × 6 (P = 20); 4 × 6 is closest to a square, so its perimeter is smallest. (1 pt: correct design with explanation)"}]}}, {"n": 14, "title": "Geometry", "color": "#1bb3a5", "light": "#d6f6f2", "dark": "#127a71", "lessons": ["Draw Points, Lines, and Rays", "Draw Parallel and Perpendicular Lines", "Hands On: Model Angles", "Classify Angles", "Measure Angles", "Draw Angles", "Solve Problems with Angles", "Triangles", "Quadrilaterals", "Draw Lines of Symmetry", "Problem-Solving Investigation: Make a Model"], "standards": ["4.G.A.1", "4.G.A.2", "4.G.A.3", "4.MD.C.5–7"], "mc": [{"q": "Which is the correct name for this figure?<br><svg xmlns='http://www.w3.org/2000/svg' width='150' height='46' viewBox='0 0 150 46' style='vertical-align:middle;display:inline-block'><line x1='40.0' y1='30.0' x2='127.0' y2='30.0' stroke='#1d2b44' stroke-width='2.2' stroke-linecap='round'/><polygon points='127.0,30.0 118.0,34.0 118.0,25.9' fill='#1d2b44'/><circle cx='40.0' cy='30.0' r='3' fill='#1d2b44'/><circle cx='105.0' cy='30.0' r='3' fill='#1d2b44'/><text x='40.0' y='21.0' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44' font-weight=\"700\">M</text><text x='105.0' y='21.0' font-size='12' font-family='Nunito' text-anchor='middle' fill='#1d2b44' font-weight=\"700\">N</text></svg>", "o": ["line MN", "ray MN", "line segm

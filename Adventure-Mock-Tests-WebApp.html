h=\"1.5\"/><circle cx=\"32.0\" cy=\"48.0\" r=\"4\" fill=\"#F4C95D\" stroke=\"#1F3350\" stroke-width=\"1.5\"/><circle cx=\"17.9\" cy=\"42.1\" r=\"4\" fill=\"#F4C95D\" stroke=\"#1F3350\" stroke-width=\"1.5\"/><circle cx=\"12.0\" cy=\"28.0\" r=\"4\" fill=\"#F4C95D\" stroke=\"#1F3350\" stroke-width=\"1.5\"/><circle cx=\"17.9\" cy=\"13.9\" r=\"4\" fill=\"#F4C95D\" stroke=\"#1F3350\" stroke-width=\"1.5\"/><circle cx=\"32.0\" cy=\"8.0\" r=\"4\" fill=\"#F4C95D\" stroke=\"#1F3350\" stroke-width=\"1.5\"/><circle cx=\"46.1\" cy=\"13.9\" r=\"4\" fill=\"#F4C95D\" stroke=\"#1F3350\" stroke-width=\"1.5\"/><circle cx=\"32\" cy=\"28\" r=\"3.5\" fill=\"#1F3350\"/><\/svg><\/span><span style=\"background:#8A5A3B\"><svg viewBox=\"0 0 64 64\" width=\"44\" height=\"44\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M8 58 L8 22 L14 22 L14 28 L20 28 L20 22 L26 22 L26 28 L38 28 L38 22 L44 22 L44 28 L50 28 L50 22 L56 22 L56 58 Z\" fill=\"#FFFFFF\"/><path d=\"M26 58 L26 44 Q32 36 38 44 L38 58 Z\" fill=\"#1F3350\"/><path d=\"M32 22 L32 6 L44 10 L32 14\" fill=\"#F4C95D\" stroke=\"#FFFFFF\" stroke-width=\"2\"/><\/svg><\/span><\/div>"};
const BRAND = "Bright EngMath";
const CATS = ["Logical Thinking","Arithmetic","Number Theory","Geometry","Combinatorics"];
const CAT_NOTE = ["Patterns, ages, calendars, logic","Mental-math tricks and sums","Operations, remainders, factors","Shapes, solids, counting figures","Digits, counting, pigeonhole"];
const KEY = "bem-olympiad-adventure-g3-v2";
const TIME_LIMIT = 90*60;
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");

/* ---------- storage (optional; app works without it) ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
let store = load(); store.best = store.best || {}; store.progress = store.progress || {};
let prefs = Object.assign({mode:"test", timer:false}, store.prefs || {});

/* ---------- answer checking ---------- */
function norm(s){
  s = String(s ?? "").trim().toLowerCase().replace(/,/g,"").replace(/\s+/g,"");
  s = s.replace(/^\$/,"").replace(/^day/,"");
  s = s.replace(/(cm²|cm2|sqcm|cm|°|degrees?|days?|cents?|minutes?|mins?|seconds?|secs?|years?|yrs?|m|c|\$)$/,"");
  return s;
}
function isRight(q, val){
  if (val == null || String(val).trim() === "") return false;
  if (q.choices) return val === q.ans;
  const a = norm(q.ans), v = norm(val);
  if (/^\d+$/.test(a) && /^\d+$/.test(v)) return Number(a) === Number(v);
  return a === v;
}
const catIdx = i => Math.floor(i/6);
const col = i => `var(--c${catIdx(i)+1})`;
const tint = i => `var(--t${catIdx(i)+1})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- session state ---------- */
let S = null;   // {t, mode, idx, vals[], st[], first[], timer, endAt, started}
let tick = null;

function startTest(t, resume){
  const pk = `${t}-${prefs.mode}`;
  const saved = store.progress[pk];
  if (resume && saved){ S = saved; }
  else {
    S = {t, mode:prefs.mode, idx:0, vals:Array(30).fill(""), st:Array(30).fill("open"), first:Array(30).fill(null),
         timer: prefs.mode==="test" && prefs.timer, endAt:null, started:Date.now(), finished:false};
    if (S.timer) S.endAt = Date.now() + TIME_LIMIT*1000;
  }
  persist(); renderQuiz();
}
function persist(){ if(!S) return; store.progress[`${S.t}-${S.mode}`] = S; store.prefs = prefs; save(); }
function clearProgress(){ delete store.progress[`${S.t}-${S.mode}`]; save(); }

/* ---------- HOME ---------- */
function renderHome(){
  stopTick(); S = null; window.scrollTo(0,0);
  const cards = DATA.tests.map((T, ti) => {
    const t = ti+1, b = store.best[t];
    const resT = store.progress[`${t}-test`], resP = store.progress[`${t}-practice`];
    const res = prefs.mode==="test" ? resT : resP;
    const answered = res ? (res.mode==="test" ? res.vals.filter(v=>String(v).trim()).length : res.st.filter(s=>s!=="open").length) : 0;
    return `<article class="tcard">
      <div class="top"><div><div class="lab">Mock Test ${t}</div><div class="tname">${DATA.themes[ti].name}</div></div>
        <span class="ticon" style="background:${DATA.themes[ti].color}">${DATA.themes[ti].icon}</span></div>
      <p class="intro">${DATA.themes[ti].intro}</p>
      <div class="stripes" aria-hidden="true">${CATS.map((c,k)=>`<i style="background:var(--c${k+1})"></i>`).join("")}</div>
      <div class="best">${b ? `Best score: <b class="tnum">${b.score} / 150</b>` : "Not tried yet"}${res && answered ? ` · ${answered}/30 in progress` : ""}</div>
      <div class="acts">
        ${res && answered ? `<button class="btn primary small" data-go="${t}" data-resume="1">Continue</button><button class="btn small" data-go="${t}">Start again</button>`
                          : `<button class="btn primary small" data-go="${t}">Start Test ${t}</button>`}
        <button class="link" data-key="${t}">Answer key</button>
      </div></article>`;
  }).join("");
  app.innerHTML = `
  <header class="hero"><div class="wrap">
    <div><div class="brand">${BRAND} · Grade 3 · Volume 2</div>
      <h1>Math Olympiad<br>Adventure Tests</h1>
      <p>Five themed final-round practice tests: Space Station, Ocean Reef, Jungle Expedition, Fun Fair and Royal Castle. 150 original questions, each with a step-by-step solution.</p>
      <div class="facts"><span>30 questions per test</span><span>5 points each</span><span>5 strands</span><span>Works offline</span></div></div>
    <div class="art" aria-hidden="true">${DATA.art}</div>
  </div></header>
  <main class="wrap">
    <div class="modes" role="radiogroup" aria-label="Choose a mode">
      <button class="mode" role="radio" aria-checked="${prefs.mode==="test"}" data-mode="test"><b><span class="tick"></span>Test mode</b><span>Answer all 30 questions, then see your score and the solutions. Just like competition day.</span></button>
      <button class="mode" role="radio" aria-checked="${prefs.mode==="practice"}" data-mode="practice"><b><span class="tick"></span>Practice mode</b><span>Check each answer as you go. Get a second try and a full explanation.</span></button>
    </div>
    <div class="timerrow" ${prefs.mode==="test"?"":"hidden"}>
      <button class="switch" id="timer" role="switch" aria-checked="${prefs.timer}" aria-label="90-minute timer"></button>
      <span>90-minute timer (the test ends when time runs out)</span>
    </div>
    <div class="sechead"><h2>Choose a test</h2><span class="muted" style="font-size:14px">All five tests are the same level, so any order works.</span></div>
    <div class="tests">${cards}</div>
    <div class="sechead"><h2>Five strands in every test</h2></div>
    <div class="strands">${CATS.map((c,k)=>`<div class="strand" style="background:var(--t${k+1})"><b style="color:var(--c${k+1})">${c}</b><span>Questions ${k*6+1}–${k*6+6} · ${CAT_NOTE[k]}</span></div>`).join("")}</div>
    <div class="sechead"><h2>For teachers and parents</h2></div>
    <div class="howto">
      <div class="panel"><h3>Scoring</h3><p>5 points for each correct answer, 150 in total. Wrong answers lose no points. Units like “cm” are optional.</p></div>
      <div class="panel"><h3>On screen or projected</h3><p>Large type and clear figures work on a tablet, laptop or classroom screen.</p></div>
      <div class="panel"><h3>Saved on this device</h3><p>Progress and best scores are kept in this browser, so a student can stop and continue later.</p></div>
    </div>
  </main>
  <footer><div class="wrap"><span>© ${BRAND}. Licensed for one teacher or family. Questions are original and not affiliated with any competition organizer.</span>
    <button class="link" id="reset">Clear saved scores</button></div></footer>`;
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { prefs.mode = b.dataset.mode; store.prefs = prefs; save(); renderHome(); });
  const tm = $("#timer"); if (tm) tm.onclick = () => { prefs.timer = !prefs.timer; store.prefs = prefs; save(); tm.setAttribute("aria-checked", prefs.timer); };
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => startTest(+b.dataset.go, !!b.dataset.resume));
  app.querySelectorAll("[data-key]").forEach(b => b.onclick = () => showKey(+b.dataset.key));
  $("#reset").onclick = confirmReset;
}

function sheet(html){
  const d = document.createElement("div"); d.className = "sheet"; d.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener("click", e => { if (e.target === d) d.remove(); });
  document.body.appendChild(d); const f = d.querySelector("button"); if (f) f.focus();
  return d;
}
function showKey(t){
  const T = DATA.tests[t-1];
  const d = sheet(`<h3>Answer key · Test ${t}</h3><p class="muted" style="margin:0;font-size:14px">For teachers and parents. Full solutions appear after a test is finished.</p>
    <div class="keylist tnum">${T.map((q,i)=>`<div><b style="color:${col(i)}">${i+1}.</b> ${esc(q.ans)}</div>`).join("")}</div>
    <div class="acts"><button class="btn primary small" data-x>Close</button></div>`);
  d.querySelector("[data-x]").onclick = () => d.remove();
}
function confirmReset(){
  const d = sheet(`<h3>Clear saved scores?</h3><p class="muted" style="margin:0">This removes best scores and unfinished tests saved in this browser.</p>
    <div class="acts"><button class="btn small ghost" data-x>Keep them</button><button class="btn primary small" data-y>Clear scores</button></div>`);
  d.querySelector("[data-x]").onclick = () => d.remove();
  d.querySelector("[data-y]").onclick = () => { store = {best:{}, progress:{}, prefs}; save(); d.remove(); renderHome(); };
}

/* ---------- QUIZ ---------- */
function stopTick(){ if (tick){ clearInterval(tick); tick = null; } }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; }
function updateClock(){
  const el = $("#clock"); if (!el || !S || !S.timer) return;
  const left = (S.endAt - Date.now())/1000;
  el.textContent = fmt(left); el.classList.toggle("low", left < 300);
  if (left <= 0){ stopTick(); finish(true); }
}

function renderQuiz(){
  stopTick();
  const T = DATA.tests[S.t-1], i = S.idx, q = T[i], practice = S.mode === "practice";
  const st = S.st[i], locked = practice && (st === "ok" || st === "shown");
  const answered = practice ? S.st.filter(s=>s!=="open" && s!=="retry").length : S.vals.filter(v=>String(v).trim()).length;
  const input = q.choices
    ? `<div class="choices" role="radiogroup" aria-label="Your answer">${q.choices.map(c=>`<button class="choice" role="radio" aria-checked="${S.vals[i]===c}" data-c="${esc(c)}" ${locked?"disabled":""}>${esc(c)}</button>`).join("")}</div>`
    : `<div class="answer"><label for="ans">Answer</label><input id="ans" inputmode="numeric" autocomplete="off" value="${esc(S.vals[i])}" ${locked?"disabled":""} aria-label="Your answer for question ${i+1}"></div>`;
  let fb = "";
  if (practice){
    if (st === "ok") fb = feedback(q, true);
    else if (st === "wrong") fb = `<div class="feedback no" role="status"><div class="head">✗ Not quite. Have another go!</div>
       <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="retry">Try again</button><button class="btn small ghost" id="show">Show solution</button></div></div>`;
    else if (st === "shown") fb = feedback(q, false);
  }
  const primary = practice
    ? (locked ? (i < 29 ? `<button class="btn primary" id="next">Next question →</button>` : `<button class="btn primary" id="fin">See my results</button>`)
              : (st==="wrong" ? "" : `<button class="btn primary" id="check">Check answer</button>`))
    : (i < 29 ? `<button class="btn primary" id="next">Next →</button>` : `<button class="btn primary" id="fin">Finish test</button>`);
  const gridCls = k => {
    let c = k===i ? "cur" : "";
    if (practice){ if (S.st[k]==="ok") c += " ok"; else if (S.st[k]==="shown") c += " no"; else if (S.st[k]==="wrong") c += " done"; }
    else if (String(S.vals[k]).trim()) c += " done";
    return c;
  };
  app.innerHTML = `
  <div class="bar"><div class="wrap">
    <button class="btn small ghost" id="exit" aria-label="Save and exit to all tests">← Tests</button>
    <div class="title">Test ${S.t} · ${DATA.themes[S.t-1].name}<small>${practice?"Practice mode":"Test mode"} · ${answered}/30 answered</small></div>
    <div class="grow"></div>
    ${S.timer ? `<span class="clock tnum" id="clock" aria-label="Time left"></span>` : ""}
    ${practice ? "" : `<button class="btn small" id="fin2">Finish</button>`}
  </div><div class="progress" aria-hidden="true"><i style="width:${(answered/30)*100}%"></i></div></div>
  <main class="wrap" style="padding-block:0 40px">
    <div class="qmeta"><span class="chip" style="background:${tint(i)};color:${col(i)}"><i style="background:${col(i)}">${i+1}</i>${CATS[catIdx(i)]}</span>
      <span class="muted tnum" style="font-size:14px">Question ${i+1} of 30</span></div>
    <section class="qcard" aria-live="polite">
      <div class="qtext">${q.q}</div>
      ${q.fig ? `<div class="figbox">${q.fig}</div>` : ""}
      ${input}
      ${fb}
    </section>
    <div class="navrow">
      <button class="btn ghost" id="prev" ${i===0?"disabled":""}>← Back</button>
      ${primary}
    </div>
    <nav aria-label="All questions"><div class="grid30">${T.map((qq,k)=>`<button class="${gridCls(k)}" data-j="${k}" aria-label="Question ${k+1}" ${k===i?'aria-current="step"':""}>${k+1}<span class="dot" style="background:${col(k)}"></span></button>`).join("")}</div>
    <div class="legend">${practice ? "<span>Green: correct</span><span>Red: solution shown</span>" : "<span>Grey: answered</span><span>White: not answered yet</span>"}<span>Colored line: strand</span></div></nav>
  </main>`;

  const inp = $("#ans");
  if (inp){
    inp.oninput = () => { S.vals[i] = inp.value; if (!practice) persistLight(); };
    inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); const b = $("#check") || $("#next") || $("#fin"); if (b) b.click(); } };
    if (!locked && st !== "wrong" && matchMedia("(min-width: 700px)").matches) inp.focus();
  }
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { S.vals[i] = b.dataset.c; persist(); renderQuiz(); });
  app.querySelectorAll("[data-j]").forEach(b => b.onclick = () => go(+b.dataset.j));
  $("#exit").onclick = () => { persist(); renderHome(); };
  $("#prev").onclick = () => go(i-1);
  const nx = $("#next"); if (nx) nx.onclick = () => go(i+1);
  const ck = $("#check"); if (ck) ck.onclick = check;
  const rt = $("#retry"); if (rt) rt.onclick = () => { S.st[i] = "retry"; S.vals[i] = ""; persist(); renderQuiz(); };
  const sh = $("#show"); if (sh) sh.onclick = () => { S.st[i] = "shown"; persist(); renderQuiz(); };
  [$("#fin"), $("#fin2")].forEach(b => b && (b.onclick = askFinish));
  if (S.timer){ updateClock(); tick = setInterval(updateClock, 1000); }
}
let lightT = null;
function persistLight(){ clearTimeout(lightT); lightT = setTimeout(persist, 400); }
function go(j){ if (j<0 || j>29) return; S.idx = j; persist(); renderQuiz(); window.scrollTo({top:0}); }
function feedback(q, ok){
  return `<div class="feedback ${ok?"ok":"no"}" role="status"><div class="head">${ok?"✓ Correct!":"Answer: "+esc(q.ans)}</div>
    <ol class="steps">${q.sol.map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
}
function check(){
  const i = S.idx, q = DATA.tests[S.t-1][i];
  if (String(S.vals[i]).trim() === ""){ const el = $("#ans") || $(".choice"); if (el) el.focus(); return; }
  const ok = isRight(q, S.vals[i]);
  if (S.first[i] === null) S.first[i] = ok;
  S.st[i] = ok ? "ok" : (S.st[i] === "retry" ? "shown" : "wrong");
  persist(); renderQuiz();
}
function askFinish(){
  const practice = S.mode === "practice";
  const left = practice ? S.st.filter(s=>s!=="ok" && s!=="shown").length : S.vals.filter(v=>!String(v).trim()).length;
  if (left === 0) return finish(false);
  const d = sheet(`<h3>Finish the test?</h3><p class="muted" style="margin:0">You have <b>${left}</b> question${left>1?"s":""} ${practice?"not checked":"without an answer"}. ${practice?"They will count as not correct.":"Blank answers score 0."}</p>
    <div class="acts"><button class="btn small ghost" data-x>Keep working</button><button class="btn primary small" data-y>Finish and see results</button></div>`);
  d.querySelector("[data-x]").onclick = () => d.remove();
  d.querySelector("[data-y]").onclick = () => { d.remove(); finish(false); };
}

/* ---------- RESULTS ---------- */
function finish(timeUp){
  stopTick();
  const T = DATA.tests[S.t-1], practice = S.mode === "practice";
  const right = T.map((q,i) => practice ? S.first[i] === true : isRight(q, S.vals[i]));
  const score = right.filter(Boolean).length * 5;
  const used = Math.round((Date.now() - S.started)/1000);
  const prev = store.best[S.t];
  if (!prev || score > prev.score) store.best[S.t] = {score, at:Date.now()};
  const R = {t:S.t, mode:S.mode, vals:S.vals.slice(), right, score, timeUp, used, wasTimed:S.timer, newBest: !prev || score > prev.score};
  clearProgress(); save(); S = null;
  renderResults(R, "all");
}
function verdict(s){
  if (s >= 130) return ["Gold standard!", "Competition ready. Keep sharpening speed and checking."];
  if (s >= 100) return ["Strong work!", "Look at your lowest strand below and review those solutions."];
  if (s >= 70) return ["Growing nicely", "Read every solution for the questions you missed, then try again."];
  return ["Good start", "Try Practice mode next: it gives a second try and explains every step."];
}
function renderResults(R, filter){
  window.scrollTo(0,0);
  const T = DATA.tests[R.t-1], n = R.right.filter(Boolean).length, [h, sub] = verdict(R.score);
  const C = 2*Math.PI*62, frac = R.score/150;
  const bars = CATS.map((c,k) => { const got = R.right.slice(k*6, k*6+6).filter(Boolean).length;
    return `<div class="brow"><span>${c}</span><div class="btrack"><i style="width:${got/6*100}%;background:var(--c${k+1})"></i></div><span class="tnum" style="text-align:right">${got}/6</span></div>`; }).join("");
  const items = T.map((q,i) => ({q,i})).filter(o => filter==="all" || !R.right[o.i]).map(({q,i}) => {
    const ok = R.right[i], your = R.vals[i] && String(R.vals[i]).trim() ? esc(R.vals[i]) : "<i>blank</i>";
    return `<details class="ritem" ${ok?"":"open"}><summary>
      <span class="n" style="background:${col(i)}">${i+1}</span>
      <span class="s">${q.q.replace(/<div class="seq">[\s\S]*?<\/div>/,"").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ")}</span>
      <span class="mark ${ok?"ok":"no"}">${ok?"✓ Correct":"✗ Missed"}</span></summary>
      <div class="body"><div class="qtext">${q.q}</div>${q.fig?`<div class="figbox">${q.fig}</div>`:""}
        <div class="ans2"><span>${R.mode==="practice"?"First try":"Your answer"}: <b>${your}</b></span><span>Correct answer: <b>${esc(q.ans)}</b></span></div>
        ${q.solfig?`<div class="figbox">${q.solfig}</div>`:""}
        <ol class="steps">${q.sol.map(s=>`<li>${s}</li>`).join("")}</ol></div></details>`;
  }).join("") || `<div class="panel">No missed questions. Every answer was correct!</div>`;
  app.innerHTML = `
  <div class="bar"><div class="wrap"><button class="btn small ghost" id="home">← Tests</button>
    <div class="title">${DATA.themes[R.t-1].name} results<small>${R.mode==="practice"?"Practice mode · first-try answers":"Test mode"}</small></div></div></div>
  <main class="wrap" style="padding-block:0 48px">
    ${R.timeUp ? `<div class="feedback no" style="margin-top:20px"><div class="head">Time's up. Your answers were marked automatically.</div></div>` : ""}
    <div class="score">
      <div class="ring" role="img" aria-label="Score ${R.score} out of 150"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--sunk)" stroke-width="14"/>
        <circle cx="75" cy="75" r="62" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}"/></svg>
        <div class="v"><b class="tnum">${R.score}</b><span>out of 150</span></div></div>
      <div><h2>${h}</h2><p>${sub}</p>
        <p class="tnum"><b style="color:var(--ink)">${n}</b> of 30 correct${R.wasTimed?` · time used ${fmt(Math.min(R.used, TIME_LIMIT))}`:""}${R.newBest?" · new best score!":""}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" id="again">Try Test ${R.t} again</button><button class="btn" id="home2">All tests</button></div></div>
    </div>
    <div class="sechead"><h2>By strand</h2></div>
    <div class="panel"><div class="bars">${bars}</div></div>
    <div class="sechead"><h2>Solutions</h2><div class="filters">
      <button class="btn small ghost" aria-pressed="${filter==="all"}" data-f="all">All 30</button>
      <button class="btn small ghost" aria-pressed="${filter==="missed"}" data-f="missed">Missed only (${30-n})</button></div></div>
    <div class="review">${items}</div>
  </main>`;
  $("#home").onclick = renderHome; $("#home2").onclick = renderHome;
  $("#again").onclick = () => { prefs.mode = R.mode; startTest(R.t, false); };
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => renderResults(R, b.dataset.f));
}

renderHome();
</script>

</body>
</html>

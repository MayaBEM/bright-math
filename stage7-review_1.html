   + '<h3 class="dash-sec">Finished runs <small>score out of 60</small></h3>'
   + hist
   + '<footer class="site-foot"><span>Bright EngMath · Stage 7 whole-year review</span><span>Progress is stored in this browser only.</span></footer>'
   + '</div>';

  document.getElementById("dashgo").onclick = function(){
    state.idx = resumeAt >= 0 ? resumeAt : 0; save(); renderQuestion();
  };
  var wipe = document.getElementById("wipe");
  if(wipe) wipe.onclick = function(){
    if(wipe.dataset.armed){
      state = {idx:0,res:{},runs:[],timeMs:0,streakBest:0,streakCur:0,best:0};
      pending = {}; save(); renderDash();
    } else { wipe.dataset.armed = "1"; wipe.textContent = "Tap again to erase"; wipe.classList.add("warn"); }
  };
  app.querySelectorAll("[data-jump]").forEach(function(b){
    b.onclick = function(){ state.idx = +b.dataset.jump; save(); renderQuestion(); };
  });
  app.querySelectorAll("[data-strand]").forEach(function(b){
    b.onclick = function(){
      var qn = +b.dataset.strand;
      for(var i=0;i<Q.length;i++){ if(Q[i].n === qn) state.idx = i; }
      save(); renderQuestion();
    };
  });

  stagger(); growBars();
  requestAnimationFrame(function(){
    app.querySelectorAll("[data-grow2]").forEach(function(el){ el.style.height = el.dataset.grow2 + "%"; });
    var rb = app.querySelector(".ringbar");
    if(rb) rb.style.strokeDashoffset = reduced() ? rb.dataset.off : rb.dataset.off;
    app.querySelectorAll("[data-count]").forEach(function(el){ countUp(el, +el.dataset.count, ""); });
  });
  window.scrollTo(0,0);
}

/* ============ results ============ */
function renderResults(){
  view = "results"; syncChrome();
  document.getElementById("qcount").textContent = "Finished";
  updateScore();

  var e = earnedTotal();
  var pct = Math.round(e/TOTAL_MARKS*100);
  var verdict = pct>=85 ? "Secure across the whole chapter." :
                pct>=70 ? "Solid — a few topics to tighten up." :
                pct>=50 ? "Halfway there. Re-do the missed questions." :
                          "Worth working through the chapter again with a teacher.";

  var stamp = new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"});
  var last = state.runs[state.runs.length-1];
  if(!last || last.score !== e || last.at !== stamp){
    state.runs.push({score:e, at:stamp, timeMs:state.timeMs, answered:answeredCount()});
    if(state.runs.length > 20) state.runs.shift();
  }
  if(e > state.best) state.best = e;
  save();

  var secStats = {A:{e:0,m:0},B:{e:0,m:0},C:{e:0,m:0}};
  var missed = [];
  for(var i=0;i<Q.length;i++){
    var qm = qMarks(i), qe = qEarned(i) || 0;
    secStats[Q[i].sec].e += qe; secStats[Q[i].sec].m += qm;
    if(qe < qm) missed.push(i);
  }
  var secHTML = "";
  ["A","B","C"].forEach(function(s){
    var st = secStats[s];
    secHTML += '<div class="brow rise"><div class="nm">Section '+s+' — '+SECTIONS[s].name+'<small>'+SECTIONS[s].range+'</small></div>'
      + '<div class="meter"><i data-grow="'+(st.m?st.e/st.m*100:0).toFixed(1)+'"></i></div>'
      + '<div class="val">'+st.e+'/'+st.m+'</div></div>';
  });

  var missHTML = missed.length
    ? '<h3 class="dash-sec">Go back to these</h3><div class="misses">'
      + missed.map(function(i){ return '<button class="miss rise" data-jump="'+i+'">Q'+Q[i].n+'</button>'; }).join("")
      + '</div>'
    : '<p class="allgood rise">Full marks on every question — nothing left to revisit.</p>';

  app.innerHTML = '<div class="wrap view">'
    + '<div class="dash-head">'
      + '<div><p class="eyebrow gold">Practice complete</p><h2 class="dash-h">'+(pct>=85?"Outstanding":pct>=70?"Nicely done":"Good effort")+'</h2>'
      + '<p class="dash-sub">'+verdict+' You spent '+fmtTime(state.timeMs)+' on this paper.</p>'
      + '<div class="cta-row" style="margin-top:16px">'
        + '<button class="btn-primary btn-sm" data-nav-go="dash">Open dashboard</button>'
        + '<button class="btn-ghost btn-sm" id="again">Practise again</button>'
      + '</div></div>'
      + ring(e/TOTAL_MARKS, e, "of "+TOTAL_MARKS+" marks")
    + '</div>'
    + '<h3 class="dash-sec">By section</h3><div class="panel">'+secHTML+'</div>'
    + missHTML
    + '<footer class="site-foot"><span>Marks are awarded for first-attempt answers.</span><span>60 questions · 120 marks · 15 chapters.</span></footer>'
    + '</div>';

  app.querySelectorAll("[data-jump]").forEach(function(b){
    b.onclick = function(){ state.idx = +b.dataset.jump; save(); renderQuestion(); };
  });
  document.getElementById("again").onclick = function(){
    state.idx = 0; state.res = {}; state.timeMs = 0; state.streakCur = 0;
    pending = {}; save(); renderQuestion();
  };
  stagger(); growBars();
  requestAnimationFrame(function(){
    var rb = app.querySelector(".ringbar");
    if(rb) rb.style.strokeDashoffset = rb.dataset.off;
    app.querySelectorAll("[data-count]").forEach(function(el){ countUp(el, +el.dataset.count, ""); });
  });
  if(pct >= 70) confetti();
  window.scrollTo(0,0);
}

/* ============ confetti ============ */
function confetti(){
  if(reduced()) return;
  var cv = document.createElement("canvas");
  cv.className = "confetti";
  document.body.appendChild(cv);
  var w = cv.width = window.innerWidth, h = cv.height = window.innerHeight;
  var ctx = cv.getContext("2d");
  var cols = ["#E5A82E","#F4C3CB","#2E8355","#FBE7C4","#C0392B"];
  var bits = [];
  for(var i=0;i<90;i++){
    bits.push({x:Math.random()*w, y:-20-Math.random()*h*0.4, r:4+Math.random()*5,
      vy:2+Math.random()*3, vx:-1+Math.random()*2, a:Math.random()*Math.PI,
      va:-0.15+Math.random()*0.3, c:cols[i%cols.length]});
  }
  var t0 = Date.now();
  (function frame(){
    ctx.clearRect(0,0,w,h);
    bits.forEach(function(b){
      b.x += b.vx; b.y += b.vy; b.a += b.va;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
      ctx.fillStyle = b.c; ctx.fillRect(-b.r/2,-b.r/2,b.r,b.r*1.5); ctx.restore();
    });
    if(Date.now()-t0 < 2600) requestAnimationFrame(frame);
    else cv.remove();
  })();
}

/* ============ navigation ============ */
elPrev.onclick = function(){ if(state.idx>0){ state.idx--; save(); renderQuestion(); } };
elNext.onclick = function(){
  if(state.idx < Q.length-1){ state.idx++; save(); renderQuestion(); }
  else { spend(); renderResults(); }
};
elCheck.onclick = function(){ checkQuestion(state.idx); };

document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-nav],[data-nav-go]") : null;
  if(!b) return;
  var to = b.dataset.nav || b.dataset.navGo;
  if(view === "practice") spend();
  if(to === "home") renderHome();
  else if(to === "dash") renderDash();
  else if(to === "practice") renderQuestion();
});

document.addEventListener("keydown", function(e){
  if(view !== "practice") return;
  var tag = (e.target.tagName||"").toLowerCase();
  if(tag === "input") return;
  if(e.key === "ArrowRight"){ elNext.click(); }
  if(e.key === "ArrowLeft" && !elPrev.disabled){ elPrev.click(); }
});

/* pause the clock when the tab is hidden */
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ if(view === "practice") spend(); }
  else { qStart = Date.now(); }
});

/* ============ text size (exam view) ============ */
(function(){
  var STEPS = [1, 1.12, 1.26, 1.42];
  var i = 1;
  try{ var v = parseInt(localStorage.getItem("stage7rev-qsize"),10); if(v>=0 && v<STEPS.length) i = v; }catch(e){}
  var minus = document.getElementById("tminus"), plus = document.getElementById("tplus");
  function apply(){
    document.documentElement.style.setProperty("--qs", STEPS[i]);
    minus.disabled = (i === 0);
    plus.disabled = (i === STEPS.length-1);
    try{ localStorage.setItem("stage7rev-qsize", i); }catch(e){}
  }
  minus.onclick = function(){ if(i>0){ i--; apply(); } };
  plus.onclick  = function(){ if(i<STEPS.length-1){ i++; apply(); } };
  apply();
})();

/* ============ theme ============ */
(function(){
  var btn = document.getElementById("themebtn");
  var root = document.documentElement;
  var stored = null;
  try{ stored = localStorage.getItem("stage7rev-theme"); }catch(e){}
  if(stored) root.setAttribute("data-theme", stored);
  function isDark(){
    return root.getAttribute("data-theme") === "dark"
      || (!root.getAttribute("data-theme") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function label(){
    btn.textContent = isDark() ? "☀" : "☽";
    btn.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode");
  }
  label();
  btn.onclick = function(){
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("stage7rev-theme", next); }catch(e){}
    label();
  };
})();

/* ============ boot ============ */
load();
paintStreak();
renderHome();

})();
</script>

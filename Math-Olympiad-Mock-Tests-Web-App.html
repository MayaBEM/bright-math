<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;background:#F2F1EC}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Olympiad Mock Test Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
/* Layout: an exam room — a printed answer booklet on the left, a bubble answer sheet on the right; each paper wears its own ink colour. */
:root{
  --bg:#F2F3EF; --sheet:#FFFFFF; --ink:#1C2430; --muted:#596472; --line:#D7DBD4; --soft:#F7F8F5;
  --good:#1E7A4C; --good-bg:#E3F3EA; --bad:#B3261E; --bad-bg:#FBE6E4; --warn:#8A5A00;
  --p:#1D4E89; --a:#D9482F; --t:#E6EEF7; --t2:#C7D6EA; --ap:#FBE1DA;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.btn{border:2px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;padding:10px 18px;font-weight:700;min-height:46px}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn.accent{background:var(--a);border-color:var(--a);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.06)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:2px solid var(--ink);margin-bottom:26px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.brand b{color:var(--a)}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end;margin-bottom:30px}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:800}
.hero p{max-width:60ch;color:var(--muted);margin:14px 0 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.facts div{padding:12px 10px 4px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--display);font-size:34px;line-height:1}
.facts span{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.papers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.booklet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.booklet .cv{background:var(--bp);color:#fff;padding:16px 16px 18px;position:relative}
.booklet .cv .no{font-family:var(--display);font-size:54px;font-weight:800;line-height:.9}
.booklet .cv .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.85}
.booklet .stripe{height:7px;background:var(--ba)}
.booklet .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.booklet ul{margin:0;padding-left:18px;font-size:14.5px;color:var(--muted)}
.booklet .best{font-size:14px;font-weight:700;color:var(--ink);border-top:1px dashed var(--line);padding-top:8px;font-variant-numeric:tabular-nums}
.booklet .acts{display:grid;gap:8px;margin-top:auto}
.booklet .acts .btn{width:100%}
.how{margin-top:34px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:20px}
.how h3{font-size:20px;margin-bottom:6px}
.how p{margin:0;color:var(--muted);font-size:15.5px}

/* test room */
.room{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .who{display:flex;align-items:center;gap:10px;font-weight:800}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.04em}
.chip.p{background:var(--p);color:#fff}
.chip.mode{border:1.5px solid var(--ink)}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;font-family:var(--display)}
.clock.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:22px 24px 22px;min-width:0}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qno{width:46px;height:46px;border-radius:8px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px}
.qmeta{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a)}
.qtopic{font-size:14px;color:var(--muted)}
.stem{font-size:19px;line-height:1.55}
.fig{display:flex;justify-content:center;margin:14px 0 4px;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.choices{display:grid;gap:10px;margin-top:18px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;font-size:18px;min-height:52px}
.choice .bub{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.choice:hover{border-color:var(--ink)}
.choice:disabled{color:var(--ink);cursor:default}
.choice:disabled:not(.right):not(.wrong){color:var(--muted)}
.choice:disabled:hover:not(.right):not(.wrong){border-color:var(--line)}
.choice.sel{border-color:var(--p);background:var(--t)}
.choice.sel .bub{background:var(--p);border-color:var(--p);color:#fff}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.choice .tag{margin-left:auto;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.open{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.open label{font-weight:800}
.open input{font:inherit;font-size:22px;font-weight:700;width:min(240px,100%);padding:8px 12px;border:2px solid var(--ink);border-radius:8px;font-variant-numeric:tabular-nums}
.open input.right{border-color:var(--good);background:var(--good-bg)}
.open input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.nav .r{display:flex;gap:10px;flex-wrap:wrap}
.flag.on{background:var(--ap);border-color:var(--a)}
.verdict{margin-top:16px;padding:12px 16px;border-radius:8px;font-weight:700;display:flex;gap:10px;align-items:center}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.no{background:var(--bad-bg);color:var(--bad)}
.verdict .sym{font-size:22px}

/* answer sheet */
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:700;position:relative;padding:0}
.cell b{font-size:16px;color:var(--ink);line-height:1}
.cell.done{border-color:var(--p);background:var(--t)}
.cell.cur{outline:2.5px solid var(--a);outline-offset:1px}
.cell.flagged::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--a)}
.cell.right{border-color:var(--good);background:var(--good-bg)}
.cell.wrong{border-color:var(--bad);background:var(--bad-bg)}
.legend{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.4}
.confirm{margin-top:12px;border:1.5px solid var(--a);background:var(--ap);border-radius:8px;padding:12px;font-size:15px}
.confirm .r{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* solution */
.sol{margin-top:20px;border-top:2px solid var(--ink);padding-top:18px;display:grid;gap:16px}
.sol h3{font-size:22px}
.kf{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kfh{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--p);margin-bottom:6px}
.kf ul{margin:0;padding-left:20px}
.kf p{margin:0;font-weight:700}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:start}
.step .sn{background:var(--t);color:var(--p);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:4px 0;text-align:center}
.step .ln+.ln{margin-top:4px}
.vis{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;background:var(--soft)}
.vis svg{max-width:100%;height:auto}
.vcap{font-size:14px;color:var(--muted);text-align:center}
.ansline{border:2px solid var(--a);border-radius:8px;padding:10px 14px;font-size:18px}
.ansline span{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a);margin-right:8px}
.notes{display:grid;gap:8px;font-size:15.5px}
.notes b{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.notes .ck{color:var(--good)}
.notes .tip{background:var(--t);border-radius:6px;padding:8px 12px}
.notes .trap{color:var(--bad)}

/* results */
.res-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:22px 24px;margin-bottom:18px}
.score{font-family:var(--display);font-weight:800;font-size:clamp(56px,10vw,96px);line-height:.9;color:var(--p);font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--muted)}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.secs div{border-top:3px solid var(--p);padding-top:6px}
.secs b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.secs span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.review{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-size:16px}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--soft)}
.rrow .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--p)}
.rrow .st{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.st.ok{background:var(--good-bg);color:var(--good)} .st.no{background:var(--bad-bg);color:var(--bad)} .st.skip{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.rrow .mk{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:14px}
.topicbox{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:16px 18px}
.topicbox h3{font-size:20px;margin-bottom:8px}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* content from the papers */
.eq{text-align:center;margin:10px 0;font-size:20px}
.eqs{text-align:center;margin:10px 0;line-height:1.7}
.quote{margin:10px 0 10px 4px;padding-left:12px;border-left:4px solid var(--a)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px;font-size:.9em}
.frac span:last-child{border-top:1.5px solid currentColor;padding:0 3px}
.brace{display:inline-block;border-bottom:2px solid var(--ink);padding:0 10px 2px}
.bracelab{display:block;font-size:14px;color:var(--muted)}
.fig-row{display:flex;gap:22px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.fig-item{text-align:center}.figcap{font-size:13px;color:var(--muted)}
.numtri{display:flex;flex-direction:column;align-items:center;gap:6px}
.numtri span{display:inline-block;min-width:32px;text-align:center;border:1px solid var(--line);margin:0 3px;border-radius:4px;font-weight:700;background:var(--sheet)}
.numtri span.dots{border:none;background:none}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin:8px 0}
.pyr div{display:flex;gap:4px}
.pyr span{width:58px;height:36px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--sheet)}
.pyr span.q{background:var(--ap);color:var(--a)}
table.grid3{margin:12px auto;border-collapse:collapse;font-size:19px}
table.grid3 td{border:1px solid var(--line);width:56px;text-align:center;padding:6px 0;background:var(--sheet)}
table.grid3 td.blank{color:var(--a);font-weight:800}
table.kt{border-collapse:collapse;font-size:15px;max-width:100%}
table.kt th{background:var(--p);color:#fff;padding:6px 10px;font-weight:700}
table.kt td{border:1px solid var(--line);padding:5px 10px;text-align:center;background:var(--sheet)}
i{font-family:Georgia,"Times New Roman",serif}

@media (max-width:980px){
  .papers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .room,.res-grid{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
  .hero{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{font-size:16px}
  .papers{grid-template-columns:minmax(0,1fr)}
  .how{grid-template-columns:1fr}
  .qcard{padding:16px}
  .bar{padding:8px 10px;gap:8px}
  .bar .who{gap:6px;font-size:14px;flex-wrap:wrap}
  .bar .chip{font-size:11.5px;padding:2px 8px;white-space:nowrap}
  .bar .btn{padding:8px 12px;font-size:14px}
  .stem{font-size:17.5px}
  .kf{grid-template-columns:1fr}
  .step{grid-template-columns:1fr;gap:4px}
  .step .sn{justify-self:start;padding:3px 10px}
  .res-top{grid-template-columns:1fr}
  .rrow{grid-template-columns:36px minmax(0,1fr) auto}
  .rrow .mk{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .choice,.cell,.btn{transition:background-color .15s,border-color .15s}
  .verdict{animation:pop .25s ease-out}
  @keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<div class="wrap" id="app"></div>

<script>
const PAPERS = [{"id": 1, "name": "Paper 1", "p": "#1D4E89", "a": "#D9482F", "t": "#E6EEF7", "t2": "#C7D6EA", "ap": "#FBE1DA", "qs": [{"n": 1, "marks": 3, "topic": "Number patterns", "skill": "Adding a run of numbers", "stem": "Find the value of<div class=\"eq\">101 + 102 + 103 + ⋯ + 110</div>", "fig": "", "opts": ["1010", "1045", "1050", "1055", "1100"], "ans": "D", "val": "1055", "know": ["We add the 10 numbers from 101 to 110."], "find": "The total.", "steps": ["Split each number into 100 + a small number: 101 = 100 + 1, 102 = 100 + 2, … 110 = 100 + 10.", "Ten lots of 100 make 1000.", "The small parts: 1 + 2 + … + 10 = 55.", "Total: 1000 + 55 = <b>1055</b>."], "vis": "<table class=\"kt\"><tr><th>Part</th><th>Sum</th></tr><tr><td>10 × 100</td><td>1000</td></tr><tr><td>1 + 2 + … + 10</td><td>55</td></tr><tr><td>Total</td><td><b>1055</b></td></tr></table>", "check": "", "tip": "Split big numbers into a round part and a small part.", "trap": ""}, {"n": 2, "marks": 3, "topic": "Word problems", "skill": "Replacing with units", "stem": "A bag of rice weighs the same as 5 bags of sugar. One bag of rice and 3 bags of sugar weigh 24 kg altogether. How much does the bag of rice weigh, in kg?", "fig": "", "opts": ["3", "8", "12", "15", "18"], "ans": "D", "val": "15", "know": ["1 rice bag = 5 sugar bags.", "1 rice bag + 3 sugar bags = 24 kg."], "find": "The weight of the rice bag.", "steps": ["Swap the rice bag for 5 sugar bags: 5 + 3 = 8 sugar bags weigh 24 kg.", "1 sugar bag = 24 ÷ 8 = 3 kg.", "1 rice bag = 5 × 3 = <b>15 kg</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>Weight</th></tr><tr><td>8 sugar bags</td><td>24 kg</td></tr><tr><td>1 sugar bag</td><td>3 kg</td></tr><tr><td>1 rice bag (5 sugar)</td><td><b>15 kg</b></td></tr></table>", "check": "15 + 3 × 3 = 24 ✓", "tip": "Swap one thing for its equal in the other unit.", "trap": "3 kg is a sugar bag."}, {"n": 3, "marks": 3, "topic": "Geometry", "skill": "Area to perimeter", "stem": "A rectangle has an area of 48 cm². Its length is 3 times its width. What is its perimeter, in cm?", "fig": "", "opts": ["16", "24", "28", "32", "48"], "ans": "D", "val": "32", "know": ["Area = 48 cm².", "Length = 3 × width."], "find": "The perimeter.", "steps": ["The rectangle is like 3 squares in a row, each with side = the width.", "3 squares = 48 cm², so 1 square = 16 cm² and the width is 4 cm.", "Length = 3 × 4 = 12 cm.", "Perimeter = 12 + 4 + 12 + 4 = <b>32 cm</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>cm</th></tr><tr><td>Width</td><td>4</td></tr><tr><td>Length</td><td>12</td></tr><tr><td>Area check</td><td>4 × 12 = 48 ✓</td></tr><tr><td>Perimeter</td><td><b>32</b></td></tr></table>", "check": "", "tip": "A “3 times as long” rectangle is 3 squares in a row.", "trap": "48 is the area, not the perimeter."}, {"n": 4, "marks": 3, "topic": "Arithmetic", "skill": "Clever multiplying", "stem": "Evaluate<div class=\"eq\">125 × 88</div>", "fig": "", "opts": ["10 000", "10 500", "11 000", "11 500", "12 000"], "ans": "C", "val": "11 000", "know": ["125 × 88."], "find": "The answer, found the quick way.", "steps": ["125 × 8 = 1000 is a friendly pair.", "88 = 8 × 11, so 125 × 88 = 125 × 8 × 11.", "1000 × 11 = <b>11 000</b>."], "vis": "", "check": "", "tip": "Know your friends: 125 × 8 = 1000 and 25 × 4 = 100.", "trap": ""}, {"n": 5, "marks": 3, "topic": "Arithmetic", "skill": "Defined operations", "stem": "A new operation is defined as<div class=\"eq\"><i>a</i> ▽ <i>b</i> = <i>a</i> + <i>b</i> − 2</div>If (<i>x</i> ▽ 3) ▽ 4 = 10, what is <i>x</i>?", "fig": "", "opts": ["3", "5", "6", "7", "9"], "ans": "D", "val": "7", "know": ["<i>a</i> ▽ <i>b</i> = <i>a</i> + <i>b</i> − 2.", "(<i>x</i> ▽ 3) ▽ 4 = 10."], "find": "The number <i>x</i>.", "steps": ["Inside the bracket: <i>x</i> ▽ 3 = <i>x</i> + 3 − 2 = <i>x</i> + 1.", "Then (<i>x</i> + 1) ▽ 4 = <i>x</i> + 1 + 4 − 2 = <i>x</i> + 3.", "<i>x</i> + 3 = 10, so <i>x</i> = <b>7</b>."], "vis": "", "check": "7 ▽ 3 = 8, then 8 ▽ 4 = 10 ✓", "tip": "Write the rule out with the numbers you know.", "trap": ""}, {"n": 6, "marks": 3, "topic": "Word problems", "skill": "Working backwards (tripling)", "stem": "The number of bacteria in a dish triples every hour. After 4 hours there are 405 bacteria. How many were there at the start?", "fig": "", "opts": ["3", "5", "15", "45", "135"], "ans": "B", "val": "5", "know": ["The number triples every hour.", "After 4 hours: 405."], "find": "The number at the start.", "steps": ["Going backwards, divide by 3 each hour.", "405 → 135 → 45 → 15 → 5.", "There were <b>5</b> bacteria at the start."], "vis": "<table class=\"kt\"><tr><th>Hour</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>Bacteria</td><td><b>5</b></td><td>15</td><td>45</td><td>135</td><td>405</td></tr></table>", "check": "", "tip": "Tripling backwards is dividing by 3.", "trap": "135 is only one hour back."}, {"n": 7, "marks": 3, "topic": "Logic", "skill": "Seating clues", "stem": "Ann, Bob, Cid and Dee sit on 4 chairs in a row.<div class=\"quote\">Ann sits at one end.<br>Bob sits next to Ann.<br>Cid does not sit next to Bob.</div>Who sits at the <b>other</b> end of the row?", "fig": "", "opts": ["Ann", "Bob", "Cid", "Dee", "It cannot be determined"], "ans": "C", "val": "Cid", "know": ["Ann sits at an end. Bob is next to Ann.", "Cid is not next to Bob."], "find": "Who sits at the other end.", "steps": ["Put Ann in chair 1 (an end). Bob must be in chair 2.", "Chair 3 is next to Bob, so Cid can’t sit there. Cid must be in chair 4.", "Dee takes chair 3. The other end (chair 4) is <b>Cid</b>."], "vis": "<table class=\"kt\"><tr><th>Chair</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>Who</td><td>Ann</td><td>Bob</td><td>Dee</td><td><b>Cid</b></td></tr></table>", "check": "", "tip": "Fill in the seats one clue at a time.", "trap": ""}, {"n": 8, "marks": 3, "topic": "Word problems", "skill": "Assumption method", "stem": "A test has 15 questions. Some are worth 2 marks and the rest are worth 5 marks. The test is worth 45 marks altogether. How many 5-mark questions are there?", "fig": "", "opts": ["3", "4", "5", "6", "7"], "ans": "C", "val": "5", "know": ["15 questions: 2 marks or 5 marks.", "45 marks altogether."], "find": "How many 5-mark questions.", "steps": ["Pretend all 15 are 2-mark questions: 15 × 2 = 30 marks.", "45 − 30 = 15 marks are missing.", "Each 5-mark question adds 3 more: 15 ÷ 3 = <b>5</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>Marks</th></tr><tr><td>All 2-mark</td><td>30</td></tr><tr><td>Real</td><td>45</td></tr><tr><td>Missing</td><td>15</td></tr><tr><td>5-mark questions</td><td>15 ÷ 3 = <b>5</b></td></tr></table>", "check": "5 × 5 + 10 × 2 = 25 + 20 = 45 ✓", "tip": "Pretend they are all the same, then fix the difference.", "trap": ""}, {"n": 9, "marks": 3, "topic": "Number sense", "skill": "Common multiples", "stem": "What is the largest 3-digit number that can be divided exactly by both 4 and 9?", "fig": "", "opts": ["936", "960", "972", "990", "996"], "ans": "C", "val": "972", "know": ["A 3-digit number.", "It divides exactly by 4 and by 9."], "find": "The largest such number.", "steps": ["Dividing by 4 and by 9 means dividing by 36.", "999 ÷ 36 = 27 remainder 27.", "The largest multiple is 36 × 27 = <b>972</b>."], "vis": "<table class=\"kt\"><tr><th>Try</th><th>÷ 4</th><th>÷ 9</th></tr><tr><td>996</td><td>✓</td><td>✗</td></tr><tr><td>990</td><td>✗</td><td>✓</td></tr><tr><td><b>972</b></td><td>✓</td><td>✓</td></tr></table>", "check": "", "tip": "Numbers in both times tables are in the times table of their common multiple.", "trap": "996 is in the 4 times table only."}, {"n": 10, "marks": 3, "topic": "Counting", "skill": "Choices for each place", "stem": "How many 3-digit <b>even</b> numbers can be made using only the digits 1, 2 and 3? (Digits may be used more than once.)", "fig": "", "opts": ["5", "6", "7", "8", "9"], "ans": "E", "val": "9", "know": ["Digits 1, 2, 3 (may repeat).", "The number must be even."], "find": "How many 3-digit even numbers.", "steps": ["An even number ends in an even digit. The only even digit here is 2, so the ones digit is 2: 1 choice.", "Hundreds: 3 choices. Tens: 3 choices.", "3 × 3 × 1 = <b>9</b>."], "vis": "<table class=\"kt\"><tr><th>Hundreds</th><th>Tens</th><th>Ones</th></tr><tr><td>1, 2 or 3</td><td>1, 2 or 3</td><td>2 only</td></tr><tr><td>3</td><td>3</td><td>1</td></tr></table>", "check": "", "tip": "Start with the place that has a rule.", "trap": "27 counts the odd numbers too."}, {"n": 11, "marks": 4, "topic": "Data", "skill": "Combining two averages", "stem": "In a class, the 10 boys have an average height of 130 cm and the 15 girls have an average height of 125 cm. What is the average height of the whole class, in cm?", "fig": "", "opts": ["126", "127", "127.5", "128", "129"], "ans": "B", "val": "127", "know": ["10 boys, average 130 cm.", "15 girls, average 125 cm."], "find": "The average of the whole class.", "steps": ["Boys’ total: 10 × 130 = 1300 cm. Girls’ total: 15 × 125 = 1875 cm.", "Class total: 1300 + 1875 = 3175 cm for 25 children.", "Average = 3175 ÷ 25 = <b>127 cm</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>Total</th></tr><tr><td>Boys</td><td>1300</td></tr><tr><td>Girls</td><td>1875</td></tr><tr><td>Class (25)</td><td>3175 → 3175 ÷ 25 = <b>127</b></td></tr></table>", "check": "", "tip": "Combine totals, not averages.", "trap": "127.5 is the middle of 130 and 125, but there are more girls."}, {"n": 12, "marks": 4, "topic": "Word problems", "skill": "Age problems", "stem": "When Tim was born, his mum was 28 years old. Now his mum is 3 times as old as Tim. How old is Tim now?", "fig": "", "opts": ["7", "10", "12", "13", "14"], "ans": "E", "val": "14", "know": ["Mum is 28 years older than Tim.", "Now Mum = 3 × Tim."], "find": "Tim’s age now.", "steps": ["The difference in age is always 28 years.", "Mum = 3 units, Tim = 1 unit, so the difference is 2 units = 28.", "1 unit = 14. Tim is <b>14</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>Age</th></tr><tr><td>Tim (1 unit)</td><td><b>14</b></td></tr><tr><td>Mum (3 units)</td><td>42</td></tr><tr><td>Difference</td><td>28 ✓</td></tr></table>", "check": "", "tip": "The age difference never changes.", "trap": ""}, {"n": 13, "marks": 4, "topic": "Fractions", "skill": "Fractions of a shape", "stem": "What fraction of the big square is shaded?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 176 176\" width=\"176\" height=\"176\"  style=\"font-family:Source Sans 3, sans-serif\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1B2430\"/></marker><pattern id=\"hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"6\" height=\"6\" fill=\"#E6EEF7\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#1D4E89\" stroke-width=\"1.6\"/></pattern></defs><rect x=\"8\" y=\"8\" width=\"160\" height=\"160\" fill=\"#fff\" stroke=\"#1B2430\" stroke-width=\"1.8\"/><rect x=\"8\" y=\"8\" width=\"80.0\" height=\"80.0\" fill=\"url(#hatch)\" stroke=\"#1B2430\" stroke-width=\"1.4\"/><rect x=\"128.0\" y=\"128.0\" width=\"40.0\" height=\"40.0\" fill=\"url(#hatch)\" stroke=\"#1B2430\" stroke-width=\"1.4\"/><line x1=\"88.0\" y1=\"8.0\" x2=\"88.0\" y2=\"168.0\" stroke=\"#1B2430\" stroke-width=\"1.6\" /><line x1=\"8.0\" y1=\"88.0\" x2=\"168.0\" y2=\"88.0\" stroke=\"#1B2430\" stroke-width=\"1.6\" /><line x1=\"128.0\" y1=\"88.0\" x2=\"128.0\" y2=\"168.0\" stroke=\"#1B2430\" stroke-width=\"1.2\" /><line x1=\"88.0\" y1=\"128.0\" x2=\"168.0\" y2=\"128.0\" stroke=\"#1B2430\" stroke-width=\"1.2\" /></svg>", "opts": ["<span class=\"frac\"><span>1</span><span>4</span></span>", "<span class=\"frac\"><span>5</span><span>16</span></span>", "<span class=\"frac\"><span>1</span><span>3</span></span>", "<span class=\"frac\"><span>3</span><span>8</span></span>", "<span class=\"frac\"><span>1</span><span>2</span></span>"], "ans": "B", "val": "<span class=\"frac\"><span>5</span><span>16</span></span>", "know": ["The big square is split into 4 quarters.", "One quarter is shaded, and one small piece (a quarter of a quarter)."], "find": "The shaded fraction.", "steps": ["The big shaded piece is 1/4 of the square = 4/16.", "The small piece is 1/4 of a quarter = 1/16.", "4/16 + 1/16 = <b>5/16</b>."], "vis": "<table class=\"kt\"><tr><th>Piece</th><th>Fraction</th></tr><tr><td>Big shaded quarter</td><td>1/4 = 4/16</td></tr><tr><td>Small shaded piece</td><td>1/16</td></tr><tr><td>Total</td><td><b>5/16</b></td></tr></table>", "check": "", "tip": "Change to the smallest piece (sixteenths) before adding.", "trap": ""}, {"n": 14, "marks": 4, "topic": "Number puzzles", "skill": "Cryptarithm (addition)", "stem": "<i>A</i>, <i>B</i> and <i>C</i> are different digits (<i>AB</i> means a 2-digit number, not <i>A</i> × <i>B</i>) and<div class=\"eq\"><i>AB</i> + <i>BA</i> = <i>AAC</i></div>What is the 2-digit number <i>AB</i>?", "fig": "", "opts": ["19", "28", "37", "46", "55"], "ans": "A", "val": "19", "know": ["<i>AB</i> + <i>BA</i> = <i>AAC</i>.", "Different digits."], "find": "The number <i>AB</i>.", "steps": ["Two 2-digit numbers add up to less than 200, so <i>A</i> = 1 and the answer is 11<i>C</i>.", "<i>AB</i> + <i>BA</i> = 11 × (<i>A</i> + <i>B</i>). It is between 110 and 119, so it must be 110.", "11 × 10 = 110, so <i>A</i> + <i>B</i> = 10 and <i>B</i> = 9.", "<i>AB</i> = <b>19</b>: 19 + 91 = 110 ✓."], "vis": "", "check": "", "tip": "A number plus its swap is always in the 11 times table.", "trap": ""}, {"n": 15, "marks": 4, "topic": "Geometry", "skill": "Angles in a right-angled triangle", "stem": "A ladder leans against a wall that stands straight up from the ground. The ladder makes an angle of 70° with the ground. What angle <i>x</i> does it make with the wall?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 194\" width=\"240\" height=\"194\"  style=\"font-family:Source Sans 3, sans-serif\"><line x1=\"20.0\" y1=\"170.0\" x2=\"210.0\" y2=\"170.0\" stroke=\"#1B2430\" stroke-width=\"2\" /><line x1=\"190.0\" y1=\"20.0\" x2=\"190.0\" y2=\"170.0\" stroke=\"#1B2430\" stroke-width=\"2\" /><rect x=\"190\" y=\"20\" width=\"12\" height=\"150\" fill=\"#E9E4DA\" stroke=\"none\"/><line x1=\"80.0\" y1=\"170.0\" x2=\"190.0\" y2=\"30.0\" stroke=\"#D9482F\" stroke-width=\"3.2\" /><path d=\"M108,170 A28,28 0 0 0 97,148\" fill=\"none\" stroke=\"#1D4E89\" stroke-width=\"2\"/><text x=\"118\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1D4E89\">70°</text><rect x=\"178\" y=\"158\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#1B2430\"/><path d=\"M190,58 A28,28 0 0 1 172,51\" fill=\"none\" stroke=\"#D9482F\" stroke-width=\"2\"/><text x=\"170\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#D9482F\"><tspan font-style=\"italic\">x</tspan></text><text x=\"60\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"400\" fill=\"#5B6670\">ground</text><text x=\"205\" y=\"100\" font-size=\"10\" text-anchor=\"start\" font-weight=\"400\" fill=\"#5B6670\">wall</text></svg>", "opts": ["10°", "20°", "30°", "70°", "110°"], "ans": "B", "val": "20°", "know": ["The wall and the ground make a right angle (90°).", "The ladder makes 70° with the ground."], "find": "The angle <i>x</i> with the wall.", "steps": ["The ladder, the wall and the ground make a triangle.", "Its angles add up to 180°: 70° + 90° + <i>x</i> = 180°.", "<i>x</i> = 180° − 160° = <b>20°</b>."], "vis": "", "check": "", "tip": "In a right-angled triangle, the two other angles add up to 90°.", "trap": "110° is the angle on the other side of the ladder."}, {"n": 16, "marks": 4, "topic": "Number patterns", "skill": "Add the two before", "stem": "Find the next number in the sequence.<div class=\"eq\">3, 4, 7, 11, 18, ___</div>", "fig": "", "opts": ["25", "26", "27", "28", "29"], "ans": "E", "val": "29", "know": ["3, 4, 7, 11, 18, …"], "find": "The next number.", "steps": ["3 + 4 = 7, 4 + 7 = 11, 7 + 11 = 18.", "Each number is the sum of the two before it.", "11 + 18 = <b>29</b>."], "vis": "", "check": "", "tip": "If the jumps don’t help, try adding the two numbers before.", "trap": ""}, {"n": 17, "marks": 4, "topic": "Number theory", "skill": "Remainders", "stem": "What is the remainder when 1 + 2 + 3 + ⋯ + 100 is divided by 7?", "fig": "", "opts": ["3", "4", "5", "6", "7"], "ans": "A", "val": "3", "know": ["1 + 2 + … + 100.", "Divide by 7."], "find": "The remainder.", "steps": ["1 + 2 + … + 100 = 50 pairs of 101 = 5050.", "7 × 721 = 5047.", "5050 − 5047 = <b>3</b>."], "vis": "<table class=\"kt\"><tr><th>Step</th><th>Work</th></tr><tr><td>Sum</td><td>50 × 101 = 5050</td></tr><tr><td>Nearest multiple of 7</td><td>7 × 721 = 5047</td></tr><tr><td>Remainder</td><td><b>3</b></td></tr></table>", "check": "", "tip": "Find the total first, then divide.", "trap": ""}, {"n": 18, "marks": 4, "topic": "Counting", "skill": "Gaps between floors", "stem": "Walking up the stairs from floor 1 to floor 4 of a building takes 36 seconds. At the same speed, how many seconds does it take to walk from floor 1 to floor 7?", "fig": "", "opts": ["72", "76", "84", "96", "108"], "ans": "A", "val": "72", "know": ["Floor 1 to floor 4: 36 seconds."], "find": "The time from floor 1 to floor 7.", "steps": ["From floor 1 to floor 4 you climb 3 flights of stairs (1→2, 2→3, 3→4).", "1 flight = 36 ÷ 3 = 12 seconds.", "Floor 1 to floor 7 is 6 flights: 6 × 12 = <b>72 seconds</b>."], "vis": "<table class=\"kt\"><tr><th>Trip</th><th>Flights</th><th>Seconds</th></tr><tr><td>1 → 4</td><td>3</td><td>36</td></tr><tr><td>1 flight</td><td>1</td><td>12</td></tr><tr><td>1 → 7</td><td>6</td><td><b>72</b></td></tr></table>", "check": "", "tip": "Count the gaps between floors, not the floors.", "trap": "63 uses 4 floors instead of 3 flights."}, {"n": 19, "marks": 4, "topic": "Geometry", "skill": "Perimeter after cutting", "stem": "A 10 cm × 6 cm rectangle is cut into the biggest possible square and a smaller rectangle, as shown. What is the perimeter of the smaller rectangle, in cm?", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 130\" width=\"220\" height=\"130\"  style=\"font-family:Source Sans 3, sans-serif\"><rect x=\"14\" y=\"14\" width=\"160\" height=\"96\" fill=\"#fff\" stroke=\"#1B2430\" stroke-width=\"1.8\"/><rect x=\"14\" y=\"14\" width=\"96\" height=\"96\" fill=\"#E6EEF7\" stroke=\"#1B2430\" stroke-width=\"1.6\"/><rect x=\"110\" y=\"14\" width=\"64\" height=\"96\" fill=\"#FBE1DA\" stroke=\"#1B2430\" stroke-width=\"1.6\"/><text x=\"62\" y=\"66\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1B2430\">square</text><text x=\"94\" y=\"126\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"400\" fill=\"#1B2430\">10 cm</text><text x=\"180\" y=\"66\" font-size=\"11\" text-anchor=\"start\" font-weight=\"400\" fill=\"#1B2430\">6 cm</text></svg>", "opts": ["20", "21", "24", "28", "32"], "ans": "A", "val": "20", "know": ["The rectangle is 10 cm × 6 cm.", "The biggest square is cut off."], "find": "The perimeter of the smaller rectangle.", "steps": ["The biggest square has sides of 6 cm (the short side).", "The rest is 10 − 6 = 4 cm wide and 6 cm tall.", "Perimeter = 4 + 6 + 4 + 6 = <b>20 cm</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>cm</th></tr><tr><td>Square</td><td>6 × 6</td></tr><tr><td>Small rectangle</td><td>4 × 6</td></tr><tr><td>Perimeter</td><td><b>20</b></td></tr></table>", "check": "", "tip": "The biggest square uses the shorter side.", "trap": ""}, {"n": 20, "marks": 4, "topic": "Counting", "skill": "Counting rectangles in a strip", "stem": "How many rectangles of all sizes are there in the strip of 6 squares? (Squares count as rectangles.)", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 192 42\" width=\"192\" height=\"42\"  style=\"font-family:Source Sans 3, sans-serif\"><line x1=\"6.0\" y1=\"6.0\" x2=\ s digit bigger than ones digit."], "find": "How many such numbers.", "steps": ["Tens digit 1: ones digit 0 → 1 number. Tens 2: ones 0, 1 → 2 numbers.", "Tens 3 → 3 numbers … Tens 9 → 9 numbers.", "1 + 2 + … + 9 = <b>45</b>."], "vis": "<table class=\"kt\"><tr><th>Tens</th><th>1</th><th>2</th><th>3</th><th>…</th><th>9</th></tr><tr><td>Numbers</td><td>10</td><td>20, 21</td><td>30, 31, 32</td><td>…</td><td>90 … 98</td></tr><tr><td>How many</td><td>1</td><td>2</td><td>3</td><td>…</td><td>9</td></tr></table>", "check": "", "tip": "Organise by the tens digit.", "trap": ""}, {"n": 24, "marks": 6, "topic": "Counting", "skill": "Arrangements with repeats", "stem": "How many different ways can the 4 letters of the word BOOK be arranged in a row? (For example, KOBO.)", "fig": "", "opts": null, "ans": "12", "val": "12", "know": ["The letters B, O, O, K (two Os are the same)."], "find": "How many different arrangements.", "steps": ["Place B first: it can go in 4 places. Then K: 3 places left.", "The two Os fill the last 2 places in just 1 way (they look the same).", "4 × 3 = <b>12</b>."], "vis": "<table class=\"kt\"><tr><th>Step</th><th>Choices</th></tr><tr><td>Where B goes</td><td>4</td></tr><tr><td>Where K goes</td><td>3</td></tr><tr><td>The Os</td><td>1</td></tr><tr><td>Total</td><td><b>12</b></td></tr></table>", "check": "", "tip": "Place the different letters first; the same letters fill the gaps.", "trap": "24 counts swapping the two Os as different."}, {"n": 25, "marks": 6, "topic": "Speed", "skill": "Comparing distances", "stem": "A hare and a tortoise race 1000 m. The hare runs 10 times as fast as the tortoise, but stops for a sleep on the way. When the tortoise finishes, the hare is still 100 m behind it. How many metres did the tortoise walk while the hare was asleep?", "fig": "", "opts": null, "ans": "910", "val": "910", "know": ["The race is 1000 m. The hare is 10 times as fast.", "When the tortoise finishes, the hare is 100 m behind."], "find": "How far the tortoise riangle has a right angle at the bottom-left corner.", "Its base is the bottom of both squares: 6 + 4 = 10 cm. Its height is the big square’s side: 6 cm.", "Area = 10 × 6 ÷ 2 = <b>30 cm²</b>."], "vis": "", "check": "", "tip": "A right-angled triangle is half of a rectangle.", "trap": "60 forgets to halve."}, {"n": 4, "marks": 3, "topic": "Arithmetic", "skill": "Clever multiplying", "stem": "Evaluate<div class=\"eq\">36 × 25</div>", "fig": "", "opts": ["750", "800", "850", "900", "950"], "ans": "D", "val": "900", "know": ["36 × 25."], "find": "The answer, found the quick way.", "steps": ["36 = 9 × 4, and 4 × 25 = 100.", "36 × 25 = 9 × 4 × 25 = 9 × 100.", "= <b>900</b>."], "vis": "", "check": "", "tip": "Look for 4 × 25 = 100.", "trap": ""}, {"n": 5, "marks": 3, "topic": "Arithmetic", "skill": "Defined operations", "stem": "A new operation is defined as<div class=\"eq\"><i>a</i> ⊙ <i>b</i> = <i>a</i> × <i>b</i> − <i>b</i></div>Find the value of 3 ⊙ (2 ⊙ 5).", "fig": "", "opts": ["5", "10", "12", "15", "25"], "ans": "B", "val": "10", "know": ["<i>a</i> ⊙ <i>b</i> = <i>a</i> × <i>b</i> − <i>b</i>."], "find": "3 ⊙ (2 ⊙ 5).", "steps": ["Brackets first: 2 ⊙ 5 = 2 × 5 − 5 = 5.", "Then 3 ⊙ 5 = 3 × 5 − 5 = 10.", "The answer is <b>10</b>."], "vis": "", "check": "", "tip": "Do the brackets first.", "trap": ""}, {"n": 6, "marks": 3, "topic": "Word problems", "skill": "Working backwards", "stem": "A shop sold half of its eggs and 3 more in the morning. In the afternoon it sold half of the eggs that were left and 3 more. Then 12 eggs were left. How many eggs did the shop have at first?", "fig": "", "opts": ["54", "60", "62", "66", "72"], "ans": "D", "val": "66", "know": ["Morning: half + 3 sold. Afternoon: half of the rest + 3 sold.", "12 eggs left."], "find": "The eggs at the start.", "steps": ["Afternoon backwards: 12 + 3 = 15 was half of what was there, so there were 30 at noon.", "Morning backwards: 30 + 3 = 33 was half of the eggs, so at first there were 66.", "The shop had <b>66</b> eggs."], "vis": "<table class=\"kt\"><tr><th>Step (backwards)</th><th>Eggs</th></tr><tr><td>End</td><td>12</td></tr><tr><td>Undo “3 more” (+3)</td><td>15</td></tr><tr><td>Undo “half” (×2)</td><td>30</td></tr><tr><td>Undo “3 more” (+3)</td><td>33</td></tr><tr><td>Undo “half” (×2)</td><td><b>66</b></td></tr></table>", "check": "66 → sell 33 + 3 → 30 left → sell 15 + 3 → 12 ✓", "tip": "Undo the last step first.", "trap": ""}, {"n": 7, "marks": 3, "topic": "Logic", "skill": "Logic grids", "stem": "Paul, Quin and Rob are 8, 9 and 10 years old (one age each).<div class=\"quote\">Paul is not 8.<br>Rob is older than Paul.</div>How old is Quin?", "fig": "", "opts": ["8", "9", "10", "8 or 9", "It cannot be determined"], "ans": "A", "val": "8", "know": ["Ages 8, 9 and 10.", "Paul is not 8. Rob is older than Paul."], "find": "Quin’s age.", "steps": ["Paul is 9 or 10. Rob is older than Paul, so Paul can’t be 10. Paul is 9.", "Rob is older than 9, so Rob is 10.", "Quin is <b>8</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>8</th><th>9</th><th>10</th></tr><tr><td>Paul</td><td>✗</td><td><b>✓</b></td><td>✗</td></tr><tr><td>Rob</td><td>✗</td><td>✗</td><td><b>✓</b></td></tr><tr><td>Quin</td><td><b>✓</b></td><td>✗</td><td>✗</td></tr></table>", "check": "", "tip": "Use a grid and cross out what can’t be true.", "trap": ""}, {"n": 8, "marks": 3, "topic": "Word problems", "skill": "Assumption method", "stem": "A frog jumps either 3 m or 5 m at a time. After 10 jumps it has travelled 38 m. How many 5 m jumps did it make?", "fig": "", "opts": ["2", "3", "4", "5", "6"], "ans": "C", "val": "4", "know": ["10 jumps of 3 m or 5 m.", "38 m altogether."], "find": "How many 5 m jumps.", "steps": ["Pretend all 10 jumps are 3 m: 30 m.", "38 − 30 = 8 m missing.", "Each 5 m jump adds 2 m more: 8 ÷ 2 = <b>4</b>."], "vis": "", "check": "4 × 5 + 6 × 3 = 20 + 18 = 38 ✓", "tip": "Pretend they are all the same, then fix the difference.", "trap": ""}, {"n": 9, "marks": 3, "topic": "Number sense", "skill": "Digit clues", "stem": "A 2-digit number is greater than 40. Its digits add up to 7 and multiply to give 12. What is the number?", "fig": "", "opts": ["34", "43", "52", "61", "70"], "ans": "B", "val": "43", "know": ["2-digit number above 40.", "Digit sum 7, digit product 12."], "find": "The number.", "steps": ["Two digits that multiply to 12 and add to 7: 3 and 4.", "The number is 34 or 43.", "It is greater than 40, so it is <b>43</b>."], "vis": "", "check": "", "tip": "Find the digits first, then their order.", "trap": "34 is less than 40."}, {"n": 10, "marks": 3, "topic": "Counting", "skill": "Multiples and overlaps", "stem": "How many whole numbers from 1 to 50 can be divided exactly by 2 or by 3 (or both)?", "fig": "", "opts": ["25", "29", "33", "37", "41"], "ans": "C", "val": "33", "know": ["Numbers 1 to 50.", "Divisible by 2 or 3 (or both)."], "find": "How many.", "steps": ["Divisible by 2: 25 numbers. Divisible by 3: 16 numbers.", "Divisible by both (by 6): 6, 12, … 48 → 8 numbers, counted twice.", "25 + 16 − 8 = <b>33</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>How many</th></tr><tr><td>÷ 2</td><td>25</td></tr><tr><td>÷ 3</td><td>16</td></tr><tr><td>Both (÷ 6)</td><td>− 8</td></tr><tr><td>Total</td><td><b>33</b></td></tr></table>", "check": "", "tip": "Take away the overlap once.", "trap": "41 forgets the overlap."}, {"n": 11, "marks": 4, "topic": "Data", "skill": "Averages (totals method)", "stem": "The average of 7 numbers is 10. One number is taken away, and the average of the other 6 numbers is 9. What number was taken away?", "fig": "", "opts": ["9", "10", "14", "16", "19"], "ans": "D", "val": "16", "know": ["7 numbers, average 10.", "After removing one, 6 numbers average 9."], "find": "The removed number.", "steps": ["7 numbers total: 7 × 10 = 70.", "6 numbers total: 6 × 9 = 54.", "Removed number: 70 − 54 = <b>16</b>."], "vis": "", "check": "", "tip": "Find the totals first.", "trap": ""}, {"n": 12, "marks": 4, "topic": "Word problems", "skill": "Age problems", "stem": "Dad is 4 times as old as Max. In 20 years’ time, Dad will be twice as old as Max. How old is Max now?", "fig": "", "opts": ["5", "7", "8", "9", "10"], "ans": "E", "val": "10", "know": ["Dad = 4 × Max now.", "In 20 years: Dad = 2 × Max."], "find": "Max’s age now.", "steps": ["Now: Max 1 unit, Dad 4 units, difference 3 units.", "In 20 years: Max is 1 unit + 20 and Dad is twice that, so the difference equals Max’s age then: 1 unit + 20.", "The difference never changes: 3 units = 1 unit + 20, so 2 units = 20 and 1 unit = 10.", "Max is <b>10</b>."], "vis": "<table class=\"kt\"><tr><th></th><th>Max</th><th>Dad</th></tr><tr><td>Now</td><td><b>10</b></td><td>40</td></tr><tr><td>In 20 years</td><td>30</td><td>60 ✓</td></tr></table>", "check": "", "tip": "The age difference stays the same.", "trap": ""}, {"n": 13, "marks": 4, "topic": "Fractions", "skill": "Fraction of the remainder", "stem": "Tim eats <span class=\"frac\"><span>1</span><span>4</span></span> of a cake. Jo eats <span class=\"frac\"><span>1</span><span>3</span></span> of what is left. Then Sam eats <span class=\"frac\"><span>1</span><span>2</span></span> of what is left after that. What fraction of the whole cake is left?", "fig": "", "opts": ["<span class=\"frac\"><span>1</span><span>6</span></span>", "<span class=\"frac\"><span>1</span><span>5</span></span>", "<span class=\"frac\"><span>1</span><span>4</span></span>", "<span class=\"frac\"><span>1</span><span>3</span></span>", "<span class=\"frac\"><span>1</span><span>2</span></span>"], "ans": "C", "val": "<span class=\"frac\"><span>1</span><span>4</span></span>", "know": ["Tim eats 1/4. Jo eats 1/3 of the rest.", "Sam eats 1/2 of what is then left."], "find": "The fraction left.", "steps": ["After Tim: 3/4 left.", "Jo eats 1/3 of it, so 2/3 of 3/4 = 1/2 is left.", "Sam eats half of that, so 1/2 of 1/2 = <b>1/4</b> is left."], "vis": "<table class=\"kt\"><tr><th>After</th><th>Left</th></tr><tr><td>Tim</td><td>3/4</td></tr><tr><td>Jo</td><td>1/2</td></tr><tr><td>Sam</td><td><b>1/4</b></td></tr></table>", "check": "Try 12 slices: 12 → 9 → 6 → 3 left = 3/12 = 1/4 ✓", "tip": "Use a number of slices that every fraction divides into.", "trap": ""}, {"n": 14, "marks": 4, "topic": "Number puzzles", "skill": "Cryptarithm (multiplication)", "stem": "<i>A</i>, <i>B</i> and <i>C</i> are different digits (<i>AB</i> means a 2-digit number, not <i>A</i> × <i>B</i>) and<div class=\"eq\"><i>AB</i> × 9 = <i>CBB</i></div>What is the 2-digit number <i>AB</i>?", "fig": "", "opts": ["45", "65", "75", "85", "95"], "ans": "E", "val": "95", "know": ["<i>AB</i> × 9 = <i>CBB</i>.", "Different digits."], "find": "The number <i>AB</i>.", "steps": ["The answer ends in <i>B</i>, and <i>B</i> × 9 must end in <i>B</i>. Only 5 works (5 × 9 = 45). So <i>B</i> = 5.", "The tens digit of the answer is also 5. Try the choices ending in 5: 75 × 9 = 675 ✗, 85 × 9 = 765 ✗, 95 × 9 = 855 ✓.", "<i>AB</i> = <b>95</b>."], "vis": "<table class=\"kt\"><tr><th>Try</th><th>× 9</th><th>Fits CBB?</th></tr><tr><td>45</td><td>405</td><td>✗</td></tr><tr><td>65</td><td>585</td><td>✗</td></tr><tr><td>75</td><td>675</td><td>✗</td></tr><tr><td>85</td><td>765</td><td>✗</td></tr><tr><td><b>95</b></td><td><b>855</b></td><td><b>✓</b></td></tr></table>", "check": "", "tip": "Look at the ones digit first.", "trap": ""}, {"n": 15, "marks": 4, "topic": "Geometry", "skill": "Angles in a triangle", "stem": "The three angles of a triangle are <i>x</i>, 2<i>x</i> and 3<i>x</i>. What is the size of the largest angle?", "fig": "", "opts": ["60°", "75°", "80°", "90°", "120°"], "ans": "D", "val": "90°", "know": ["The angles are <i>x</i>, 2<i>x</i> and 3<i>x</i>."], "find": "The largest angle.", "steps": ["Together they make 6 lots of <i>x</i> = 180°.", "<i>x</i> = 30°.", "Largest = 3 × 30° = <b>90°</b>."], "vis": "", "check": "30 + 60 + 90 = 180 ✓", "tip": "Angles in a triangle add up to 180°.", "trap": ""}, {"n": 16, "marks": 4, "topic": "Number patterns

alternate angles for b and co-interior angles for c.",explanation:[{text:"Angle a and the 113° angle lie side by side below the straight line AB, so they total 180°.",math:["a = 180° − 113°","a = 67°"],highlight:["given","a"]},{text:"Angle b is between the parallel lines and on the opposite side of EF from the 113° angle, so the two are alternate angles and therefore equal.",math:"b = 113°",highlight:["given","b"]},{text:"Angle c is between the parallel lines and on the same side of EF as the 113° angle, so the two are co-interior and total 180°.",math:["c = 180° − 113°","c = 67°"],highlight:["given","c"]},{text:"Check: b and c sit beside each other on the straight line CD, and 113° + 67° = 180°."}]},{id:"s4q10",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:4,type:"multi",prompt:"Find the sizes of the angles marked a, b and c.",given:"GH and JK are parallel. Two different transversals, LM and NP, cross them.",diagram:{kind:"lines",lines:[{id:"gh",through:[0,90],dir:0,arrows:1,ends:["G","H"]},{id:"jk",through:[0,-70],dir:0,arrows:1,ends:["J","K"]},{id:"lm",through:[-85,0],dir:47,ends:["L","M"]},{id:"np",through:[90,0],dir:112,ends:["N","P"]}],marks:[{at:["gh","lm"],sector:0,label:null,key:"g1"},{at:["jk","np"],sector:3,label:null,key:"g2"},{at:["jk","lm"],sector:1,label:"a"},{at:["gh","np"],sector:3,label:"b"},{at:["gh","np"],sector:0,label:"c"}]},answerLabels:["a","b","c"],correctAnswer:[133,68,112],hint1:"Work with one transversal at a time: the 47° angle belongs to LM and the 68° angle belongs to NP.",hint2:"Copy 47° down to JK with corresponding angles, then use the straight line JK to reach a.",hint3:"For a use 180° − 47°; for b copy 68° up to GH with corresponding angles; for c use the straight line NP.",explanation:[{text:"The 47° angle is above GH and to the right of LM. The angle above JK and to the right of LM is in the matching position, so corresponding angles make it 47° too.",math:"angle above JK, right of LM = 47°",highlight:["g1"]},{text:"Angle a lies beside that angle along the straight line JK.",math:["a = 180° − 47°","a = 133°"],highlight:["a"]},{text:"The 68° angle is below JK and to the right of NP, and angle b is below GH and to the right of NP, so b and 68° are corresponding angles.",math:"b = 68°",highlight:["g2","b"]},{text:"Angles b and c lie side by side along the straight transversal NP, so they total 180°.",math:["c = 180° − 68°","c = 112°"],highlight:["c"]}]},{id:"s4q11",set:4,topic:"parallel",skills:["parallel","intersecting"],difficulty:4,type:"multi",prompt:"Calculate the sizes of the three angles marked a, b and c.",given:"QR and ST are parallel. WV is perpendicular to both of them, and EF is a second transversal.",diagram:{kind:"lines",lines:[{id:"qr",through:[0,80],dir:0,arrows:1,ends:["Q","R"]},{id:"st",through:[0,-80],dir:0,arrows:1,ends:["S","T"]},{id:"wv",through:[-60,0],dir:90,ends:["W","V"]},{id:"ef",through:[-60,0],dir:38,ends:["E","F"]}],marks:[{at:["st","ef"],sector:0,label:null,key:"given"},{at:["qr","ef"],sector:2,label:"a"},{at:["qr","ef"],sector:3,label:"b"},{at:["wv","ef"],sector:1,label:"c"}],rightAngles:[["qr","wv"],["st","wv"]]},answerLabels:["a","b","c"],correctAnswer:[38,142,52],hint1:"The two small squares show that WV meets both parallel lines at 90°.",hint2:"Angle a is alternate to the 38° angle, and angle b sits beside a on the straight line QR.",hint3:"For c, look at the triangle made by WV, EF and ST: it already has a right angle and a 38° angle.",explanation:[{text:"Angle a and the 38° angle are both between the parallel lines and on opposite sides of EF, so they are alternate angles.",math:"a = 38°",highlight:["given","a"]},{text:"Angles a and b lie side by side below the straight line QR.",math:["b = 180° − 38°","b = 142°"],highlight:["b"]},{text:"WV, EF and ST enclose a triangle. The square marker shows the angle where WV meets ST is 90°, and the angle where EF meets ST is the given 38°.",highlight:["given"]},{text:"Angle c is the third angle of that triangle, and the angles of a triangle total 180°.",math:["c = 180° − (90° + 38°)","c = 52°"],highlight:["c"]}]},{id:"s4q12",set:4,topic:"parallel",skills:["parallel"],difficulty:3,type:"truefalse",prompt:"True or false: AB and CD are parallel.",given:"AB, CD and EF are straight lines. No arrows have been drawn on the diagram.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,58],dir:0,ends:["A","B"]},{id:"cd",through:[0,-58],dir:27,ends:["C","D"]},{id:"ef",through:[0,0],dir:108,ends:["E","F"]}],marks:[{at:["ab","ef"],sector:3,label:null,key:"u1"},{at:["cd","ef"],sector:3,label:null,key:"u2"}]},options:["True","False"],correctAnswer:1,reasonPrompt:"Which reason explains your answer?",reasonOptions:["The marked angles are in matching positions but are not equal, so the lines cannot be parallel.","The marked angles are co-interior and add to 180°, so the lines are parallel.","The marked angles are alternate, so they must be equal whatever the lines do.","Both lines run across the page, so they must be parallel."],reasonAnswer:0,hint1:"Never trust how a diagram looks — test the marked angles against a parallel-line rule.",hint2:"Both marked angles sit below their own line and on the same side of EF, so they are in matching positions.",hint3:"Angles in matching positions are equal only when the lines are parallel. Compare 72° with 99°.",explanation:[{text:"Each marked angle lies below its own line and to the right of the transversal EF, so the two are in corresponding positions.",highlight:["u1","u2"]},{text:"Corresponding angles are equal only when the two lines really are parallel, and here they are not equal.",math:"99° − 72° = 27°",highlight:["u1","u2"]},{text:"So AB and CD are not parallel. Extended far enough to the right they would meet. They look almost parallel on the page, which is exactly why the angle test matters."}]},{id:"s4q13",set:4,topic:"parallel",skills:["parallel"],difficulty:4,type:"truefalse",prompt:"True or false: PQ and RS must be parallel.",given:"PQ, RS and TU are straight lines. No chevron arrows are shown.",diagram:{kind:"lines",lines:[{id:"pq",through:[0,75],dir:0,ends:["P","Q"]},{id:"rs",through:[0,-75],dir:0,ends:["R","S"]},{id:"tu",through:[15,0],dir:126,ends:["T","U"]}],marks:[{at:["pq","tu"],sector:2,label:null,key:"u1"},{at:["rs","tu"],sector:1,label:null,key:"u2"}]},options:["True","False"],correctAnswer:0,reasonPrompt:"Which reason proves your answer?",reasonOptions:["The marked angles are co-interior and 126° + 54° = 180°, which happens only when the lines are parallel.","The marked angles are corresponding, and corresponding angles are always equal.","The marked angles are alternate, and 126° is bigger than 54°.","Both lines run straight across the page, so they must be parallel."],reasonAnswer:0,hint1:"Decide first where the two marked angles sit: inside or outside the strip, same side or opposite sides of TU.",hint2:"They are both inside the strip and both on the left of TU, so they are co-interior angles.",hint3:"Co-interior angles between parallel lines total 180°. Add 126° and 54° and see what you get.",explanation:[{text:"Both marked angles are between PQ and RS, and both are on the left-hand side of the transversal TU, so they are co-interior angles.",highlight:["u1","u2"]},{text:"Add them.",math:"126° + 54° = 180°",highlight:["u1","u2"]},{text:"A pair of co-interior angles totals 180° exactly when the two lines are parallel, so PQ and RS must be parallel. The statement is true even though no arrows are drawn."},{text:"The test works both ways: had the total been anything other than 180°, the lines could not have been parallel."}]},{id:"s4q14",set:4,topic:"parallel",skills:["parallel"],difficulty:4,type:"reasoning",prompt:"Which statement about AB and CD is correct?",given:"EF and GH are two different transversals. Nothing else is known about AB and CD.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,85],dir:0,ends:["A","B"]},{id:"cd",through:[0,-85],dir:0,ends:["C","D"]},{id:"ef",through:[-80,0],dir:57,ends:["E","F"]},{id:"gh",through:[80,0],dir:123,ends:["G","H"]}],marks:[{at:["ab","ef"],sector:0,label:null,key:"g1"},{at:["cd","gh"],sector:1,label:null,key:"g2"}]},options:["There is not enough information: the two marked angles belong to different transversals, so they cannot be compared.","AB and CD are parallel, because the two marked angles are equal corresponding angles.","AB and CD are parallel, because 57° and 123° add up to 180°.","AB and CD are not parallel, because the two transversals are not parallel."],correctAnswer:0,hint1:"Check carefully which transversal each marked angle belongs to.",hint2:"Corresponding, alternate and co-interior pairs are always made by the same transversal cutting both lines.",hint3:"One angle is made by EF and the other by GH, so ask yourself whether any parallel-line rule can link them.",explanation:[{text:"The first 57° angle is made where EF crosses AB. The second is made where GH crosses CD.",highlight:["g1","g2"]},{text:"Every parallel-line rule — corresponding, alternate and co-interior — compares two angles made by one transversal cutting both lines. These two angles come from different transversals."},{text:"Equal angles measured against different transversals say nothing at all about AB and CD, so no conclusion can be drawn. One angle where EF meets CD, or where GH meets AB, would settle it."}]},{id:"s4q15",set:4,topic:"parallel",skills:["parallel"],difficulty:4,type:"reasoning",prompt:"Which statement proves that MN and PQ are parallel?",given:"RS crosses the straight lines MN and PQ. No arrows are drawn on the diagram.",diagram:{kind:"lines",lines:[{id:"mn",through:[0,80],dir:0,ends:["M","N"]},{id:"pq",through:[0,-80],dir:0,ends:["P","Q"]},{id:"rs",through:[-5,0],dir:137,ends:["R","S"]}],marks:[{at:["mn","rs"],sector:3,label:null,key:"g1"},{at:["pq","rs"],sector:0,label:null,key:"g2"}]},options:["The marked angles are co-interior and 43° + 137° = 180°, so MN and PQ are parallel.","The marked angles are alternate, and alternate angles are always equal.","The marked angles are corresponding, so MN and PQ must be parallel.","The two lines stay the same distance apart on the page, so they are parallel."],correctAnswer:0,hint1:"Work out where the two marked angles sit before naming any rule.",hint2:"Both are between MN and PQ, and both are on the right of RS.",hint3:"That position has a name, and its rule involves a total rather than equality. Add the two values.",explanation:[{text:"Both marked angles lie between MN and PQ, and both are on the right-hand side of the transversal RS. That makes them co-interior angles.",highlight:["g1","g2"]},{text:"Co-interior angles total 180° exactly when the lines are parallel, and here they do.",math:"43° + 137° = 180°",highlight:["g1","g2"]},{text:'The other statements fail. The angles are neither alternate nor corresponding, and "alternate angles are always equal" assumes the very thing that has to be proved.'},{text:"Judging by eye is never a proof either — a diagram is not drawn accurately, so only the angle facts can settle the question."}]},{id:"s4q16",set:4,topic:"parallel",skills:["parallel"],difficulty:3,type:"error",prompt:"What mistake has Mia made?",given:"DE and FG are parallel. Mia wrote: “x = 118°, because corresponding angles are equal.”",diagram:{kind:"lines",lines:[{id:"de",through:[0,85],dir:0,arrows:1,ends:["D","E"]},{id:"fg",through:[0,-75],dir:0,arrows:1,ends:["F","G"]},{id:"hj",through:[-20,0],dir:118,ends:["H","J"]}],marks:[{at:["de","hj"],sector:2,label:null,key:"given"},{at:["fg","hj"],sector:1,label:"x"}]},options:["The two angles are co-interior, so they add to 180° instead of being equal.","She should have subtracted 118° from 360° rather than quoting it.","Corresponding angles are only equal when the transversal is perpendicular to the parallel lines.","She read the angle at the wrong end of the transversal HJ."],correctAnswer:0,hint1:"Check whether the two angles really are in matching positions.",hint2:"Both lie between the parallel lines and both are on the left of HJ, so they trace a C shape rather than an F shape.",hint3:"Angles in a C shape are co-interior. Work out 180° − 118°.",explanation:[{text:"Corresponding angles sit in matching positions, with one inside the strip and one outside it. Here both marked angles are inside the strip between DE and FG, and both are on the same side of HJ.",highlight:["given","x"]},{text:"That makes them co-interior angles, and co-interior angles between parallel lines total 180°.",math:"118° + x = 180°",highlight:["given","x"]},{text:"So the correct working is a subtraction, not a copy.",math:["x = 180° − 118°","x = 62°"],highlight:["x"]},{text:"The angle that really does equal 118° is the one above FG on the left of HJ; that one is corresponding to Mia’s 118°."}]},{id:"s4q17",set:4,topic:"parallel",skills:["parallel"],difficulty:4,type:"error",prompt:"What is wrong with Tom’s reasoning?",given:"KL, MN and PQ are straight lines. Tom wrote: “y = 116°, because alternate angles are equal.”",diagram:{kind:"lines",lines:[{id:"kl",through:[0,55],dir:0,ends:["K","L"]},{id:"mn",through:[0,-55],dir:28,ends:["M","N"]},{id:"pq",through:[0,0],dir:116,ends:["P","Q"]}],marks:[{at:["kl","pq"],sector:2,label:null,key:"given"},{at:["mn","pq"],sector:0,label:"y"}]},options:["Nothing on the diagram shows that KL and MN are parallel, so the alternate-angle rule cannot be used at all.","Alternate angles add to 180°, so he should have written y = 64°.","The pair is co-interior rather than alternate, so y = 64°.","He measured the angle on the wrong side of the transversal PQ."],correctAnswer:0,hint1:"Every parallel-line rule begins with the words “between parallel lines”.",hint2:"Look for chevron arrows, or a sentence in the question, that would tell you KL is parallel to MN.",hint3:"There are none, so ask whether the rule Tom used is available to him here at all.",explanation:[{text:"Tom has spotted the Z shape correctly: the two marked angles are in alternate positions across the transversal PQ.",highlight:["given","y"]},{text:"But alternate angles are equal only between parallel lines. The diagram carries no chevron arrows and the question never says KL is parallel to MN, so the rule is not available."},{text:"In fact the two lines slope differently and would meet if extended to the right, so y is not 116° at all. With no parallel fact and no second measurement, y cannot be found.",highlight:["y"]},{text:"The repair is to state the parallel fact first. Given “KL is parallel to MN”, the alternate-angle rule would then give y = 116° correctly."}]},{id:"s4q18",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:4,type:"mc",prompt:"Work out the size of the angle marked x.",given:"AB is parallel to CD (single arrows) and EF is parallel to GH (double arrows).",diagram:{kind:"lines",lines:[{id:"ab",through:[0,85],dir:12,arrows:1,ends:["A","B"]},{id:"cd",through:[0,-75],dir:12,arrows:1,ends:["C","D"]},{id:"ef",through:[-70,0],dir:128,arrows:2,ends:["E","F"]},{id:"gh",through:[75,0],dir:128,arrows:2,ends:["G","H"]}],marks:[{at:["ab","ef"],sector:3,label:null,key:"given"},{at:["cd","gh"],sector:0,label:"x"}]},options:["64°","106°","116°","244°"],correctAnswer:2,answerValue:116,hint1:"Two separate families of parallel lines are marked, so you can travel across the diagram in stages.",hint2:"First slide the 64° angle down from AB to CD along the transversal EF, then slide it across from EF to GH along CD.",hint3:"Two uses of corresponding angles put 64° at the crossing of CD and GH. Then use the straight line GH.",explanation:[{text:"AB is parallel to CD and EF cuts both, so the angle below CD on the same side of EF is corresponding to the given angle.",math:"angle at CD and EF = 64°",highlight:["given"]},{text:"EF is parallel to GH and CD cuts both, so sliding along CD from EF to GH is a second pair of corresponding angles.",math:"angle below CD, right of GH = 64°"},{text:"Angle x lies beside that 64° angle along the straight line GH, so the two total 180°.",math:["x = 180° − 64°","x = 116°"],highlight:["x"]},{text:"Answering 64° means stopping one step early and forgetting that x is on the other side of GH."}]},{id:"s4q19",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:4,type:"numeric",prompt:"Work out the size of angle x at the apex T of the triangle.",given:"AB and CD are parallel. Triangle TUV has its apex T on AB and its base UV on CD.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,95],dir:0,arrows:1,ends:["A","B"]},{id:"cd",through:[0,-75],dir:0,arrows:1,ends:["C","D"]},{id:"sa",through:[-10,95],dir:55,clipBetween:["ab","cd"]},{id:"sb",through:[-10,95],dir:130,clipBetween:["ab","cd"]}],marks:[{at:["cd","sa"],sector:0,label:null,key:"b1"},{at:["cd","sb"],sector:1,label:null,key:"b2"},{at:["sa","sb"],sector:2,label:"x"}],pointLabels:[{at:["sa","sb"],text:"T"},{at:["cd","sa"],text:"U"},{at:["cd","sb"],text:"V"}]},correctAnswer:75,hint1:"AB passes straight through the apex T, so all the angles at T along AB total 180°.",hint2:"Each base angle of the triangle has an alternate partner at T, on the far side of that sloping side.",hint3:"Copy 55° and 50° up to T using alternate angles, then work out 180° − (55° + 50°).",explanation:[{text:"The 55° angle at U and the angle at T on the left of TU are alternate angles between the parallel lines AB and CD, so the angle at T is also 55°.",math:"angle ATU = 55°",highlight:["b1"]},{text:"In the same way the 50° angle at V is alternate to the angle at T on the right of TV.",math:"angle BTV = 50°",highlight:["b2"]},{text:"Those two angles and angle x lie in a row along the straight line AB, so they total 180°.",math:["x = 180° − (55° + 50°)","x = 180° − 105°","x = 75°"],highlight:["x"]},{text:"This is exactly the argument that shows why the three angles of any triangle total 180°."}]},{id:"s4q20",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:4,type:"multi",prompt:"Work out the sizes of the three angles a, b and c at the apex.",given:"PQ and RS are parallel. The triangle has its base on PQ and its apex on RS.",diagram:{kind:"lines",lines:[{id:"pq",through:[0,90],dir:0,arrows:1,ends:["P","Q"]},{id:"rs",through:[0,-80],dir:0,arrows:1,ends:["R","S"]},{id:"sa",through:[15,-80],dir:63,clipBetween:["pq","rs"]},{id:"sb",through:[15,-80],dir:116,clipBetween:["pq","rs"]}],marks:[{at:["pq","sa"],sector:2,label:null,key:"g1"},{at:["pq","sb"],sector:3,label:null,key:"g2"},{at:["rs","sa"],sector:0,label:"a"},{at:["rs","sb"],sector:1,label:"b"},{at:["sa","sb"],sector:0,label:"c"}]},answerLabels:["a","b","c"],correctAnswer:[63,64,53],hint1:"Angles a, b and c all sit at the apex, in a row along the line RS.",hint2:"Each of a and b has an alternate partner among the two angles marked on the base PQ.",hint3:"Find a and b with alternate angles, then use the fact that a, c and b lie in a row along the straight line RS.",explanation:[{text:"Angle a and the 63° base angle are between the parallel lines and on opposite sides of the left-hand sloping side, so they are alternate angles.",math:"a = 63°",highlight:["g1","a"]},{text:"Angle b and the 64° base angle are alternate in the same way, across the right-hand sloping side.",math:"b = 64°",highlight:["g2","b"]},{text:"Angles a, c and b follow one another along the straight line RS, so they total 180°.",math:["c = 180° − (63° + 64°)","c = 180° − 127°","c = 53°"],highlight:["c"]},{text:"Angle c is also the apex angle of the triangle, and 63° + 64° + 53° = 180° confirms the angle sum of the triangle."}]},{id:"s4q21",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:4,type:"mc",prompt:"Find the size of the apex angle marked x.",given:"JK and LM are parallel. The triangle sits between them with its apex on JK.",diagram:{kind:"lines",lines:[{id:"jk",through:[0,88],dir:0,arrows:1,ends:["J","K"]},{id:"lm",through:[0,-82],dir:0,arrows:1,ends:["L","M"]},{id:"sa",through:[20,88],dir:48,clipBetween:["jk","lm"]},{id:"sb",through:[20,88],dir:122,clipBetween:["jk","lm"]}],marks:[{at:["jk","sa"],sector:2,label:null,key:"g1"},{at:["lm","sb"],sector:1,label:null,key:"g2"},{at:["sa","sb"],sector:2,label:"x"}]},options:["58°","74°","106°","132°"],correctAnswer:1,answerValue:74,hint1:"One marked angle is already at the apex; the other is at the far end of the base.",hint2:"Move the 58° base angle up to the apex using alternate angles.",hint3:"The apex then carries three angles in a row along JK: 48°, x and the copy of 58°. Use 180° − (48° + 58°).",explanation:[{text:"The 58° base angle and the angle at the apex on the right of the right-hand sloping side are alternate angles between the parallel lines JK and LM.",math:"angle at the apex, right of that side = 58°",highlight:["g2"]},{text:"At the apex the 48° angle, angle x and that 58° angle lie in a row along the straight line JK.",math:"48° + x + 58° = 180°",highlight:["g1","x"]},{text:"Subtract to finish.",math:["x = 180° − 106°","x = 74°"],highlight:["x"]},{text:"Choosing 106° means stopping after the addition, and 132° comes from using only the 48° angle."}]},{id:"s4q22",set:4,topic:"parallel",skills:["parallel","intersecting"],difficulty:3,type:"reasoning",prompt:"Which statement about the angle marked x is correct?",given:"AB and CD are parallel. EF meets AB at a right angle, as the square marker shows.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,80],dir:0,arrows:1,ends:["A","B"]},{id:"cd",through:[0,-80],dir:0,arrows:1,ends:["C","D"]},{id:"ef",through:[-15,0],dir:90,ends:["F","E"]}],marks:[{at:["cd","ef"],sector:0,label:"x"}],rightAngles:[["ab","ef"]]},options:["x = 90°, because a line perpendicular to one of two parallel lines is perpendicular to the other one as well.","x = 90°, because every transversal meets a pair of parallel lines at 90°.","x cannot be worked out, because only one right angle has been marked.","x = 45°, because the right angle at AB is shared between the two crossings."],correctAnswer:0,hint1:"The right angle at AB and the angle marked x are in matching positions.",hint2:"Corresponding angles between parallel lines are equal, whatever their size.",hint3:"Copy the 90° down from AB to CD, then decide which of the four statements says that correctly.",explanation:[{text:"The right angle where EF crosses AB and the angle x where EF crosses CD are in matching positions, so they are corresponding angles.",highlight:["x"]},{text:"Corresponding angles between parallel lines are equal, so x is a right angle too.",math:"x = 90°",highlight:["x"]},{text:"That gives a useful general fact: if a line is perpendicular to one of two parallel lines, it is perpendicular to the other one as well."},{text:"The second statement is far too strong — a transversal can cut a pair of parallel lines at any angle at all. Here it is the marked right angle, not the parallel lines on their own, that forces x to be 90°."}]},{id:"s4q23",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:3,type:"numeric",prompt:"Calculate the size of angle x on the line TU.",given:"PQ, RS and TU are all parallel. VW is a straight line crossing all three.",diagram:{kind:"lines",lines:[{id:"pq",through:[0,115],dir:0,arrows:1,ends:["P","Q"]},{id:"rs",through:[0,0],dir:0,arrows:1,ends:["R","S"]},{id:"tu",through:[0,-115],dir:0,arrows:1,ends:["T","U"]},{id:"vw",through:[30,0],dir:127,ends:["V","W"]}],marks:[{at:["pq","vw"],sector:0,label:null,key:"given"},{at:["tu","vw"],sector:1,label:"x"}]},correctAnswer:53,hint1:"All three lines carry the same chevron arrows, so each one is parallel to the other two.",hint2:"The 127° angle is above PQ on the right of VW; find the angle above TU on the right of VW first.",hint3:"Corresponding angles carry the 127° all the way down to TU. Then work out 180° − 127°.",explanation:[{text:"PQ and TU are parallel and VW cuts both. The 127° angle is above PQ and to the right of VW, so the angle above TU and to the right of VW is corresponding to it.",math:"angle above TU, right of VW = 127°",highlight:["given"]},{text:"Angle x lies beside that angle along the straight line TU, so the pair totals 180°.",math:["x = 180° − 127°","x = 53°"],highlight:["x"]},{text:"The middle line RS gives the same answer in two shorter hops: 127° is co-interior with the angle below RS on the right, and that angle is corresponding to x."}]},{id:"s4q24",set:4,topic:"quadrilateral",skills:["quadrilateral","parallel"],difficulty:3,type:"mc",prompt:"Work out the size of angle x in the trapezium.",given:"ABCD is a trapezium. The arrows show that AB is parallel to DC.",diagram:{kind:"quad",angles:[{deg:68,key:"a68"},{deg:125,label:"y"},{deg:55,key:"c55"},{deg:112,label:"x"}],shape:"trapezium",rotation:10,vertexLabels:["A","B","C","D"],sideArrows:[1,0,1,0]},options:["92°","112°","125°","292°"],correctAnswer:1,answerValue:112,hint1:"The side AD is a transversal crossing the two parallel sides AB and DC.",hint2:"Angle A and angle x are both inside the trapezium and both on the same side of AD.",hint3:"That makes them co-interior angles. Work out 180° − 68°.",explanation:[{text:"AB is parallel to DC, and the side AD crosses both of them, so AD acts as a transversal.",highlight:["a68","x"]},{text:"Angle A and angle x are both inside the shape and both on the same side of AD, so they are co-interior angles and total 180°.",math:"68° + x = 180°",highlight:["a68","x"]},{text:"Subtract to finish.",math:["x = 180° − 68°","x = 112°"],highlight:["x"]},{text:"The same rule along the side BC gives y: 55° + y = 180°, so y = 125°. Choosing 125° for x means pairing angle x with the wrong side of the trapezium.",highlight:["c55","y"]}]},{id:"s4q25",set:4,topic:"parallel",skills:["parallel"],difficulty:4,type:"numeric",prompt:"Work out the size of angle PMR, marked x.",given:"AB and CD are parallel. P lies on AB, R lies on CD, and the path from P to R bends at the point M between the two lines.",diagram:{kind:"custom",points:[{name:"A",x:-170,y:120,labelDir:180},{name:"P",x:93.75427,y:120,labelDir:90},{name:"B",x:250,y:120,labelDir:0},{name:"C",x:-170,y:-120,labelDir:180},{name:"R",x:184.78379,y:-120,labelDir:270},{name:"D",x:250,y:-120,labelDir:0},{name:"M",x:0,y:0,labelDir:180}],segments:[{a:"A",b:"B",arrows:1},{a:"C",b:"D",arrows:1},{a:"P",b:"M"},{a:"M",b:"R"}],arcs:[{at:"P",from:"A",to:"M",key:"top"},{at:"R",from:"C",to:"M",key:"bot"},{at:"M",from:"P",to:"R",label:"x"}]},correctAnswer:85,hint1:"M lies on neither parallel line, so imagine drawing a new line through M parallel to AB and CD.",hint2:"That helper line splits angle x into two parts, and each part is alternate to one of the marked angles.",hint3:"The upper part equals the angle at P and the lower part equals the angle at R. Add 52° and 33°.",explanation:[{text:"Draw a helper line through M parallel to AB and CD. It splits angle PMR into an upper part and a lower part.",highlight:["x"]},{text:"The upper part and the 52° angle at P are alternate angles between AB and the helper line, so the upper part is 52°.",math:"upper part = 52°",highlight:["top"]},{text:"The lower part and the 33° angle at R are alternate angles between the helper line and CD, so the lower part is 33°.",math:"lower part = 33°",highlight:["bot"]},{text:"Angle x is the two parts added together.",math:["x = 52° + 33°","x = 85°"],highlight:["x"]}]}],ap=[{id:"s5q1",set:5,topic:"construction",skills:["construction","parallel"],difficulty:3,type:"mc",prompt:"Which statement do the markings on the drawing tell you?",given:"PQ and RS have been drawn with chevrons, and MN has been drawn joining them.",diagram:{kind:"custom",points:[{name:"P",x:0,y:0,labelDir:200},{name:"Q",x:150,y:0,labelDir:340},{name:"R",x:0,y:85,labelDir:160},{name:"S",x:150,y:85,labelDir:20},{name:"M",x:55,y:0,labelDir:260},{name:"N",x:55,y:85,labelDir:100}],segments:[{a:"P",b:"Q",arrows:1},{a:"R",b:"S",arrows:1},{a:"M",b:"N"}],arcs:[{at:"M",from:"Q",to:"N",right:!0},{at:"N",from:"S",to:"M",right:!0}]},options:["The chevrons show PQ is parallel to RS, and the small squares show MN is perpendicular to both.","The chevrons show PQ and RS are the same length, and the small squares show MN cuts them in half.","The chevrons show PQ is parallel to MN, and the small squares show MN is as long as PQ.","The chevrons show the angles at P and R are equal, and the small squares show MN is parallel to RS."],correctAnswer:0,hint1:"Two different marks are used here: matching chevrons on two of the lines, and small squares where MN meets them.",hint2:'Chevrons are the "same direction" mark, not the "same length" mark — ticks are used for equal lengths.',hint3:"Decide first what each small square at M and at N is telling you about the angle there, then read the chevrons.",explanation:[{text:"Matching chevrons on PQ and RS mean those two lines run in exactly the same direction, so they are parallel. Equal lengths would be shown with tick marks instead."},{text:"A small square at a crossing means the angle there is a right angle, and both ends of MN carry one.",math:"angle at M = 90°   and   angle at N = 90°"},{text:"So MN is perpendicular to PQ and perpendicular to RS. That is exactly what you build when you drop a perpendicular between two parallel lines."}]},{id:"s5q2",set:5,topic:"construction",skills:["construction","intersecting"],difficulty:3,type:"construction",prompt:"Complete the construction so that CD is at right angles to AB.",given:"AB is drawn level across the grid and C is fixed above it. Only D can be moved.",construction:{task:"perpendicular",instruction:"Drag D until CD is perpendicular to AB.",readout:"Angle between CD and AB",target:90,tol:2,fixed:[{name:"A",x:14,y:26},{name:"B",x:80,y:26},{name:"C",x:50,y:72}],drag:{name:"D",x:74,y:44},segments:[["A","B"],["C","D"]]},correctAnswer:0,hint1:'Perpendicular means the two lines meet at exactly 90°, not just "near enough".',hint2:"The readout above the grid updates as you drag: it is showing the angle CD makes with AB.",hint3:"AB runs level across the grid, so a line at right angles to it must run straight up and down the grid squares.",explanation:[{text:"AB is horizontal, so any line perpendicular to it must be vertical — it climbs the grid without moving sideways at all."},{text:"Once D sits directly below C the segment CD is vertical, and the protractor reads exactly 90°.",math:"angle between CD and AB = 90°"},{text:"That single reading is the whole check: 88° or 92° would look almost right on the page, but the construction would not be perpendicular."}]},{id:"s5q3",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:3,type:"numeric",prompt:"Work out the size of angle x.",given:"ABCD is a square of side 6.8 cm that has been constructed accurately, and the diagonal AC has been drawn.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:96,y:0},{name:"C",x:96,y:96},{name:"D",x:0,y:96}],segments:[{a:"A",b:"B",ticks:1,length:"6.8 cm"},{a:"B",b:"C",ticks:1},{a:"C",b:"D",ticks:1},{a:"D",b:"A",ticks:1},{a:"A",b:"C",dashed:!0,muted:!0}],arcs:[{at:"B",from:"C",to:"A",right:!0},{at:"A",from:"B",to:"C",label:"x"}]},correctAnswer:45,hint1:"Look at triangle ABC on its own. Two of its sides are sides of the square.",hint2:"AB and BC are equal, so triangle ABC is isosceles, and the angle between them at B is a right angle.",hint3:"Take the 90° at B away from 180°, then share what is left equally between the two base angles.",explanation:[{text:"The diagonal cuts the square into triangle ABC, in which AB and BC are both sides of the square, so they are equal.",highlight:["x"]},{text:"The angles at A and at C in that triangle are therefore equal, and the angle at B is the 90° corner of the square.",math:"x + x + 90° = 180°"},{text:"Share the remainder between the two equal angles.",math:["2x = 180° − 90°","x = 90° ÷ 2","x = 45°"],highlight:["x"]},{text:"This is why the diagonal of a square always cuts each corner exactly in half — a useful check when you construct one."}]},{id:"s5q4",set:5,topic:"construction",skills:["construction","parallel"],difficulty:3,type:"construction",prompt:"Complete the pair of parallel lines.",given:"EF is already drawn and G is fixed below it. Only H can be moved.",construction:{task:"parallel",instruction:"Drag H until GH is parallel to EF.",readout:"Angle between GH and EF",target:0,tol:2,fixed:[{name:"E",x:14,y:64},{name:"F",x:74,y:84},{name:"G",x:18,y:20}],drag:{name:"H",x:70,y:26},segments:[["E","F"],["G","H"]]},correctAnswer:0,hint1:"Parallel lines never meet, because they point in exactly the same direction.",hint2:"The readout gives the angle between the two segments, so being parallel means driving that reading down to 0°.",hint3:"Count the grid squares along EF: it climbs 1 square upwards for every 3 squares across. Make GH climb at the same rate.",explanation:[{text:"Two segments are parallel exactly when they have the same direction, so the angle between them is zero."},{text:"EF rises 20 grid squares while it travels 60 across, which is 1 up for every 3 across.",math:"slope of EF = 20 ÷ 60"},{text:"Placing H so that GH has that same 1-in-3 slope makes the readout show 0°, and the two lines then stay the same distance apart for ever.",math:"angle between GH and EF = 0°"}]},{id:"s5q5",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:3,type:"mc",prompt:"Which instruction should come next?",given:"Aisha is constructing square ABCD of side 6.4 cm. She has drawn AB and a dashed line through A at right angles to AB.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0,labelDir:225},{name:"B",x:88,y:0,labelDir:315},{name:"H",x:0,y:74,show:!1}],segments:[{a:"A",b:"B",length:"6.4 cm"},{a:"A",b:"H",dashed:!0,muted:!0}],arcs:[{at:"A",from:"B",to:"H",right:!0}],notes:[{x:10,y:84,text:"dashed line drawn at 90° to AB"}]},options:["Mark D on the dashed line so that AD = 6.4 cm.","Mark D on the dashed line so that AD = 12.8 cm, twice the base.","Draw a line from A at 45° and mark C on it 6.4 cm from A.","Measure an angle of 60° at B and draw the second side from there."],correctAnswer:0,hint1:"In a square every side is the same length as the base you started with.",hint2:"The dashed line already guarantees the corner at A is 90°, so the only thing still to fix along it is a distance.",hint3:"Decide how far up the dashed line the next vertex must be marked if all four sides are to match AB.",explanation:[{text:"A square is fixed by one side length together with its right angles, and the dashed line has already taken care of the right angle at A."},{text:"The side AD runs along that dashed line, so it must be marked off equal to AB.",math:"AD = AB = 6.4 cm"},{text:"Doubling to 12.8 cm would build a rectangle instead, and the 45° step measures the wrong line: the diagonal of this square is longer than a side, so C cannot be 6.4 cm from A."}]},{id:"s5q6",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:3,type:"construction",prompt:"Complete the square ABCD.",given:"Three vertices of the square are already fixed on the grid.",construction:{task:"square",instruction:"Drag D until ABCD is a perfect square.",readout:"Lengths of CD and DA",tol:2.5,fixed:[{name:"A",x:24,y:20},{name:"B",x:60,y:20},{name:"C",x:60,y:56}],drag:{name:"D",x:30,y:44},segments:[["A","B"],["B","C"],["C","D"],["D","A"]]},correctAnswer:0,hint1:"A square needs four equal sides and four right angles — both conditions at once.",hint2:"Measure the part that is already built: AB is 36 grid squares long, and BC matches it.",hint3:"From C, count the same number of squares across that AB covers, and check that DA then closes the shape without changing length.",explanation:[{text:"AB runs 36 squares across and BC runs 36 squares up, so every side of the finished square must be 36 squares long.",math:"AB = BC = 36 units"},{text:"D therefore has to sit level with C and directly above A, so that CD runs 36 across and DA runs 36 down.",math:"CD = DA = 36 units"},{text:"With all four sides equal and every corner reading 90°, the readout confirms a square rather than a rhombus leaning over."}]},{id:"s5q7",set:5,topic:"construction",skills:["construction","quadrilateral","parallel"],difficulty:3,type:"multi",prompt:"Work out the sizes of angles a and b.",given:"ABCD has been constructed from AB = 9 cm, AD = 6 cm and an angle of 63° at A.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:90,y:0},{name:"C",x:117.23942998,y:53.46039145},{name:"D",x:27.23942998,y:53.46039145}],segments:[{a:"A",b:"B",arrows:1,length:"9 cm"},{a:"B",b:"C",arrows:2},{a:"C",b:"D",arrows:1},{a:"D",b:"A",arrows:2,length:"6 cm"}],arcs:[{at:"A",from:"B",to:"D",key:"given"},{at:"B",from:"C",to:"A",label:"a"},{at:"C",from:"D",to:"B",label:"b"}]},correctAnswer:[117,63],answerLabels:["a","b"],hint1:"The chevrons show AB is parallel to DC and AD is parallel to BC, so this is a parallelogram.",hint2:"Angles A and B sit at the two ends of the side AB, between the same pair of parallel lines, so they total 180°. Angle C is the one facing A.",hint3:"Take 63° from 180° for angle a, then use the opposite-angle rule to write down b with no further working.",explanation:[{text:"AD and BC are parallel and AB crosses them both, so the angles at A and at B are co-interior and add to 180°.",highlight:["given","a"]},{text:"Subtract to find a.",math:["a = 180° − 63°","a = 117°"],highlight:["a"]},{text:"Angle b faces angle A across the parallelogram, and opposite angles of a parallelogram are equal.",math:"b = 63°",highlight:["b"]},{text:"Adding all four is a quick way to test a construction like this.",math:"63° + 117° + 63° + 117° = 360°"}]},{id:"s5q8",set:5,topic:"construction",skills:["construction","quadrilateral","parallel"],difficulty:3,type:"construction",prompt:"Find the fourth vertex of parallelogram PQRS.",given:"P, Q and R are fixed. Only S can be moved.",construction:{task:"parallelogram",instruction:"Drag S until PQRS is a parallelogram.",readout:"Direction and length of RS compared with QP",tol:2.5,fixed:[{name:"P",x:16,y:26},{name:"Q",x:58,y:26},{name:"R",x:74,y:60}],drag:{name:"S",x:46,y:52},segments:[["P","Q"],["Q","R"],["R","S"],["S","P"]]},correctAnswer:0,hint1:"In a parallelogram each side is parallel to the side facing it, and the same length as it.",hint2:"SP has to copy QR exactly: same direction, same length. Look at how QR steps across and up the grid.",hint3:"QR moves 16 squares right and 34 squares up. Take the same step from P and see where S has to land.",explanation:[{text:"A parallelogram is built by copying one side onto the opposite corner. Here SP has to be a copy of QR."},{text:"QR steps 16 squares right and 34 squares up, so starting at P and taking exactly that step fixes S.",math:"step from P = 16 right and 34 up"},{text:"The check is that RS then becomes an exact copy of QP, parallel to it and equal in length, so both pairs of opposite sides match."}]},{id:"s5q9",set:5,topic:"construction",skills:["construction","around-point","straight-line"],difficulty:4,type:"numeric",prompt:"Calculate the size of angle x.",given:"ABCD is a rectangle drawn accurately, and its two diagonals cross at O.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:100,y:0},{name:"C",x:100,y:57.735027},{name:"D",x:0,y:57.735027},{name:"O",x:50,y:28.8675135,labelDir:250}],segments:[{a:"A",b:"B"},{a:"B",b:"C"},{a:"C",b:"D"},{a:"D",b:"A"},{a:"A",b:"C",dashed:!0,muted:!0},{a:"B",b:"D",dashed:!0,muted:!0}],arcs:[{at:"O",from:"A",to:"B",key:"aob"},{at:"O",from:"B",to:"C",label:"x"}]},correctAnswer:60,hint1:"Four angles meet at the point O where the two diagonals cross.",hint2:"Angle AOB and angle x sit side by side along the diagonal AC, which is a straight line.",hint3:"Take the 120° away from the angles on the straight line AOC.",explanation:[{text:"AOC is a straight line, because it is one whole diagonal of the rectangle, and angle AOB and angle x sit next to each other along it.",highlight:["aob","x"]},{text:"Angles on a straight line total 180°.",math:["x = 180° − 120°","x = 60°"],highlight:["x"]},{text:"The four angles round O confirm it: the pairs facing each other are equal, and everything round a point totals 360°.",math:"120° + 60° + 120° + 60° = 360°"}]},{id:"s5q10",set:5,topic:"construction",skills:["construction","intersecting"],difficulty:4,type:"construction",prompt:"Construct a line through L that is perpendicular to the sloping line JK.",given:"JK is drawn at a slant and L is fixed above it. Only M can be moved.",construction:{task:"perpendicular",instruction:"Drag M until LM meets JK at 90°.",readout:"Angle between LM and JK",target:90,tol:2,fixed:[{name:"J",x:16,y:18},{name:"K",x:76,y:58},{name:"L",x:30,y:80}],drag:{name:"M",x:68,y:84},segments:[["J","K"],["L","M"]]},correctAnswer:0,hint1:"A slanted line still has a perpendicular direction; it just is not the vertical any more.",hint2:"Read the slope of JK off the grid first: how far up does it climb for every step across?",hint3:"JK climbs 2 squares for every 3 across, so a perpendicular must drop 3 squares for every 2 across — swap the two steps and reverse one of them.",explanation:[{text:"JK travels 60 squares across while it climbs 40, which simplifies to 2 up for every 3 across.",math:"slope of JK = 40 ÷ 60"},{text:"To turn a direction through 90° you swap the across-step and the up-step and reverse one of them, giving 3 down for every 2 across.",math:"slope of LM = −3 ÷ 2"},{text:"With M placed on that line from L the readout shows exactly 90°, and that reading is the only proof that the construction is perpendicular.",math:"angle between LM and JK = 90°"}]},{id:"s5q11",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"reasoning",prompt:"What does the total of 358° tell Ivy?",given:"Ivy constructs a quadrilateral, then measures all four of its angles with a protractor and records 96°, 74°, 111° and 77°.",options:["Nothing useful, because the angles of a quadrilateral do not have to total 360°.","Her measuring is slightly out, because the four angles of any quadrilateral must total 360° and she is 2° short.","Her drawing is impossible, because no four-sided shape can have angles anywhere near those sizes.","One reading is exactly 2° too large, so she should take 2° off her biggest angle."],correctAnswer:1,hint1:"There is a fact about the four angles of any quadrilateral that acts as a built-in check on a construction.",hint2:"Add her four readings and compare the total with the total she should have got.",hint3:"Work out 360° − 358°, then think about how that small gap is spread across four separate protractor readings.",explanation:[{text:"Every quadrilateral, however oddly shaped, has interior angles totalling 360°, which makes the total a free check on any construction."},{text:"Add Ivy’s four readings.",math:"96° + 74° + 111° + 77° = 358°"},{text:"She is 2° short of the total she must reach.",math:"360° − 358° = 2°"},{text:"A 2° gap spread over four separate readings is only about half a degree each, which is ordinary protractor error rather than a broken drawing. Nothing tells her which reading is out, so shrinking the largest angle would just be a guess."}]},{id:"s5q12",set:5,topic:"construction",skills:["construction","parallel"],difficulty:4,type:"construction",prompt:"Construct a line through P that is parallel to MN.",given:"MN slopes downwards across the grid and P is fixed below it. Only Q can be moved.",construction:{task:"parallel",instruction:"Drag Q until PQ points in exactly the same direction as MN.",readout:"Angle between PQ and MN",target:0,tol:2,fixed:[{name:"M",x:14,y:86},{name:"N",x:74,y:46},{name:"P",x:20,y:44}],drag:{name:"Q",x:58,y:58},segments:[["M","N"],["P","Q"]]},correctAnswer:0,hint1:"Q currently sits higher than P, but MN goes downhill as it goes right, so the two cannot be parallel yet.",hint2:"A parallel copy must fall at the same rate as the original, not merely look similar to it.",hint3:"MN drops 2 squares for every 3 it moves right. Step away from P using that same pattern.",explanation:[{text:"MN moves 60 squares right while dropping 40, which is 2 down for every 3 across.",math:"slope of MN = −40 ÷ 60"},{text:"Parallel means an identical direction, so PQ must drop at exactly the same rate: moving 36 right and 24 down from P does it.",math:"slope of PQ = −24 ÷ 36"},{text:"Both fractions simplify to the same value, the readout falls to 0°, and the two lines would never meet however far they were extended."}]},{id:"s5q13",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:3,type:"mc",prompt:"Which statement about the two diagonals must be true?",given:"Nia constructs a parallelogram that is not a rectangle, then joins both of its diagonals.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:110,y:0},{name:"C",x:148,y:66},{name:"D",x:38,y:66}],segments:[{a:"A",b:"B",arrows:1},{a:"B",b:"C",arrows:2},{a:"C",b:"D",arrows:1},{a:"D",b:"A",arrows:2},{a:"A",b:"C",dashed:!0,muted:!0},{a:"B",b:"D",dashed:!0,muted:!0}]},options:["The two diagonals are equal in length.","The two diagonals cut each other exactly in half.","The two diagonals cross at right angles.","Each diagonal splits the parallelogram into two right-angled triangles."],correctAnswer:1,hint1:"Test each statement against the drawing: one diagonal here is clearly longer than the other.",hint2:"Equal diagonals belong to rectangles, and diagonals crossing at 90° belong to rhombuses and kites.",hint3:"Think about the crossing point instead, and ask what happens to each diagonal at the place where they meet.",explanation:[{text:"In every parallelogram the diagonals bisect each other, so the crossing point is the midpoint of both of them. That is the property that always holds."},{text:"Equal diagonals only happen when the parallelogram is a rectangle, and this one is not. Diagonals crossing at 90° only happen when all four sides are equal, as in a rhombus."},{text:"A diagonal does cut the parallelogram into two identical triangles, but they are right-angled only in a rectangle. So the reliable check after constructing a parallelogram is to measure both halves of each diagonal and confirm they match."}]},{id:"s5q14",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"construction",prompt:"Complete the rhombus WXYZ.",given:"WX and XY are already drawn and are equal in length. Only Z can be moved.",construction:{task:"rhombus",instruction:"Drag Z until all four sides of WXYZ are the same length.",readout:"Lengths of YZ and ZW",tol:2.5,fixed:[{name:"W",x:20,y:30},{name:"X",x:60,y:30},{name:"Y",x:84,y:62}],drag:{name:"Z",x:60,y:68},segments:[["W","X"],["X","Y"],["Y","Z"],["Z","W"]]},correctAnswer:0,hint1:"A rhombus is a parallelogram whose four sides are all equal; its corners do not have to be right angles.",hint2:"Measure WX with the ruler first, then make YZ and ZW match that reading.",hint3:"WX is 40 units long, and XY steps 24 right and 32 up. Take that same step from W to find where Z belongs.",explanation:[{text:"WX measures 40 units, and XY measures 40 units too, because a step of 24 across and 32 up has a length of 40.",math:"XY = 40 units"},{text:"For a rhombus, WZ must be a copy of XY and ZY a copy of WX, so Z is found by stepping 24 right and 32 up from W.",math:"WZ = XY = 40 units"},{text:"When both readouts show 40, all four sides match and the opposite sides are automatically parallel — that is what makes it a rhombus rather than a random four-sided shape."}]},{id:"s5q15",set:5,topic:"construction",skills:["construction","quadrilateral","intersecting"],difficulty:4,type:"numeric",prompt:"Work out the size of angle x at the corner B.",given:"ABCD is a kite. Its two diagonals have been drawn and they cross at M.",diagram:{kind:"custom",points:[{name:"A",x:0,y:60},{name:"B",x:60,y:0},{name:"C",x:0,y:-103.9230485},{name:"D",x:-60,y:0},{name:"M",x:0,y:0,labelDir:200}],segments:[{a:"A",b:"B",ticks:1},{a:"B",b:"C",ticks:2},{a:"C",b:"D",ticks:2},{a:"D",b:"A",ticks:1},{a:"A",b:"C",dashed:!0,muted:!0},{a:"B",b:"D",dashed:!0,muted:!0}],arcs:[{at:"M",from:"B",to:"A",right:!0},{at:"A",from:"B",to:"M",key:"atA"},{at:"C",from:"M",to:"B",key:"atC"},{at:"B",from:"A",to:"C",label:"x"}]},correctAnswer:105,hint1:"The diagonals of a kite always cross at right angles, so triangles ABM and CBM each contain a 90° angle.",hint2:"Angle x is made of two smaller angles, ABM and MBC. Find each one from its own triangle.",hint3:"In triangle ABM work out 180° − 90° − 45°, do the same kind of subtraction in triangle CBM, then combine the two results.",explanation:[{text:"The diagonal BD meets AC at right angles at M, so both triangle ABM and triangle CBM are right-angled.",highlight:["atA","atC"]},{text:"In triangle ABM the three angles total 180°.",math:["angle ABM = 180° − 90° − 45°","angle ABM = 45°"],highlight:["atA"]},{text:"In triangle CBM the same rule applies.",math:["angle MBC = 180° − 90° − 30°","angle MBC = 60°"],highlight:["atC"]},{text:"Angle x is the whole corner at B, so add the two parts.",math:["x = 45° + 60°","x = 105°"],highlight:["x"]}]},{id:"s5q16",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"construction",prompt:"Finish the tilted square CDEF.",given:"This square is not lined up with the grid, but C, D and E are fixed.",construction:{task:"square",instruction:"Drag F until CDEF is a square.",readout:"Lengths of EF and FC",tol:2.5,fixed:[{name:"C",x:38,y:16},{name:"D",x:66,y:37},{name:"E",x:45,y:65}],drag:{name:"F",x:30,y:58},segments:[["C","D"],["D","E"],["E","F"],["F","C"]]},correctAnswer:0,hint1:"A tilted square obeys exactly the same rules: four equal sides and four right angles.",hint2:"Follow the sides as grid steps. CD steps 28 right and 21 up; DE steps 21 left and 28 up.",hint3:"Each side is the previous step turned through 90°. Apply that same turn once more, starting from E.",explanation:[{text:"CD steps 28 right and 21 up, a length of 35 units. DE steps 21 left and 28 up, also 35 units, and it is CD turned through 90°.",math:"CD = DE = 35 units"},{text:"Continuing the same quarter-turn, EF must step 28 left and 21 down from E, and FC then steps 21 right and 28 down back to C.",math:"EF = FC = 35 units"},{text:"All four sides read 35 and every corner reads 90°, so the shape is a genuine square even though none of its sides follows a grid line."}]},{id:"s5q17",set:5,topic:"construction",skills:["construction","quadrilateral","parallel"],difficulty:4,type:"error",prompt:"What has Ravi done wrong?",given:"Ravi is constructing parallelogram JKLM. He draws JK = 7 cm, measures 58° at K, and then writes: “The angle at L is opposite the angle at K, so it is 58° as well.” He draws 58° at L.",options:["The angle at L should be 122°, because K and L are next to each other and neighbouring angles of a parallelogram total 180°.","All four angles should be 58°, because a parallelogram has four equal angles.","The angle at L should be 32°, because the two angles at one end of a side must total 90°.","Nothing is wrong: in parallelogram JKLM the angle at L really is opposite the angle at K."],correctAnswer:0,hint1:"Write the letters J, K, L, M round the shape in order and see which corner really faces K.",hint2:"Going round in order, L comes straight after K, so K and L are neighbours joined by the side KL, not opposite corners.",hint3:"Neighbouring angles of a parallelogram lie between the same pair of parallel sides, so subtract 58° from 180°.",explanation:[{text:"Ravi has confused opposite corners with neighbouring ones. Reading J, K, L, M round the shape, the corner facing K is M, not L."},{text:"K and L sit at the two ends of the side KL, between the parallel sides JK and ML, so they are co-interior and add to 180°.",math:["angle L = 180° − 58°","angle L = 122°"]},{text:"His rule was not wrong, only misapplied: opposite angles really are equal, which gives angle M = 58° and angle J = 122°."},{text:"The angle-sum check confirms the corrected figure.",math:"58° + 122° + 58° + 122° = 360°"}]},{id:"s5q18",set:5,topic:"construction",skills:["construction","quadrilateral","parallel"],difficulty:4,type:"construction",prompt:"Place H so that EFGH becomes a parallelogram.",given:"E, F and G are fixed high on the grid. Only H can be moved.",construction:{task:"parallelogram",instruction:"Drag H until EFGH is a parallelogram.",readout:"Direction and length of GH compared with FE",tol:2.5,fixed:[{name:"E",x:22,y:72},{name:"F",x:70,y:84},{name:"G",x:84,y:44}],drag:{name:"H",x:56,y:40},segments:[["E","F"],["F","G"],["G","H"],["H","E"]]},correctAnswer:0,hint1:"Opposite sides of a parallelogram are parallel and equal, so GH has to match FE exactly.",hint2:"Work with grid steps rather than eye-judgement: FE steps 48 squares left and 12 squares down.",hint3:"Start at G and take that same left-and-down step to see where H must sit.",explanation:[{text:"GH must be an exact copy of FE, so find the step from F to E first: 48 squares left and 12 squares down.",math:"step from F to E = 48 left and 12 down"},{text:"Taking that same step from G places H, and HE then automatically copies GF.",math:"GH = FE   and   HE = GF"},{text:"Both pairs of opposite sides now match in direction and length, which is the definition of a parallelogram. Nudging H even slightly breaks one of those pairs, so the readout is the only reliable judge."}]},{id:"s5q19",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:3,type:"numeric",prompt:"Work out the size that angle x must be.",given:"Dan constructs quadrilateral EFGH from three given angles of 88°, 76° and 121°.",diagram:{kind:"quad",angles:[{deg:88},{deg:76},{deg:121},{deg:75,label:"x"}],shape:"generic",rotation:-8,vertexLabels:["E","F","G","H"]},correctAnswer:75,hint1:"Once three angles of a quadrilateral are fixed, the fourth one is not free to choose.",hint2:"The four interior angles must total 360°, so the last angle is whatever is left over.",hint3:"Add 88°, 76° and 121°, then take that total away from 360°.",explanation:[{text:"When you construct a quadrilateral, the fourth angle is forced by the other three.",highlight:["88","76","121"]},{text:"Add the three angles Dan was given.",math:"88° + 76° + 121° = 285°",highlight:["88","76","121"]},{text:"Subtract from the full turn to find the angle the last corner has to close at.",math:["x = 360° − 285°","x = 75°"],highlight:["x"]},{text:"If Dan measures that corner afterwards and reads something like 79°, his drawing has drifted and one of the earlier steps needs redoing."}]},{id:"s5q20",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"construction",prompt:"Open the corner at A until the protractor reads the target angle.",given:"A, B and C are fixed. D can be moved anywhere on the grid.",construction:{task:"quadAngle",instruction:"Drag D until angle DAB measures 65°.",readout:"Angle DAB",target:65,tol:2,measure:["D","A","B"],fixed:[{name:"A",x:16,y:20},{name:"B",x:70,y:20},{name:"C",x:80,y:58}],drag:{name:"D",x:52,y:50},segments:[["A","B"],["B","C"],["C","D"],["D","A"]]},correctAnswer:0,hint1:"The angle being measured is at A, between the fixed side AB and the side AD you are creating.",hint2:"AB is level, so the reading really tells you how steeply AD rises above the horizontal.",hint3:"The reading starts below the target, so AD needs to be steeper: swing D upwards and watch the readout climb.",explanation:[{text:"Only the direction of AD affects the reading. Sliding D further out along the same line leaves the angle untouched, which is worth testing while you drag."},{text:"AB runs horizontally, so angle DAB is measured up from the horizontal, and the starting position reads about 40°.",math:"angle DAB must rise from about 40° to 65°"},{text:"Every point on the ray leaving A at 65° above AB works, so there is a whole line of correct positions — the readout, not the look of the picture, decides.",math:"angle DAB = 65°"}]},{id:"s5q21",set:5,topic:"construction",skills:["construction"],difficulty:3,type:"truefalse",prompt:"Is Ben right?",given:"Ben and Priya each measure the same drawn line with a ruler. Ben records 8.4 cm and Priya records 8.5 cm. Ben says that one of them must have measured it wrongly.",options:["True","False"],correctAnswer:1,reasonPrompt:"Choose the reason that supports your answer.",reasonOptions:["A length read to the nearest millimetre can easily differ by 1 mm between two people, so both readings are reasonable.","A ruler always gives the exact length, so the line must really be 8.45 cm long.","Priya must have started her ruler at the 1 cm mark instead of at 0 cm.","The line was drawn by hand, so it does not have a true length at all."],reasonAnswer:0,hint1:"Think about how finely a ruler can actually be read.",hint2:"The two readings differ by one millimetre, which is one small division on the ruler.",hint3:"Decide whether a gap of that size counts as a mistake or as the ordinary uncertainty of reading to the nearest millimetre.",explanation:[{text:"Ben is not right. The two readings differ by only one millimetre.",math:"8.5 cm − 8.4 cm = 0.1 cm, which is 1 mm"},{text:"A ruler is read to the nearest millimetre, so every measurement carries an uncertainty of about half a division either way, and two careful people can honestly land on neighbouring marks."},{text:"The line does have one true length, but neither reading is a mistake. That is why constructions are checked with an angle sum or a repeated measurement, not by demanding identical readings."}]},{id:"s5q22",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"construction",prompt:"Stretch the diagonal of the quadrilateral to the target length.",given:"T, U and V are fixed. The diagonal UW is drawn inside quadrilateral TUVW.",construction:{task:"diagonal",instruction:"Drag W until the diagonal UW measures 50 grid units.",readout:"Length of diagonal UW",target:50,tol:2.5,measure:["U","W",""],fixed:[{name:"T",x:18,y:26},{name:"U",x:64,y:20},{name:"V",x:84,y:54}],drag:{name:"W",x:40,y:52},segments:[["T","U"],["U","V"],["V","W"],["W","T"],["U","W"]]},correctAnswer:0,hint1:"This time the readout is a distance, so use the ruler rather than the protractor.",hint2:"Check the starting length first: from U, the point W lies 24 squares left and 32 squares up.",hint3:"That start gives a diagonal of 40 units, so decide how much further from U the point W has to move before you drag.",explanation:[{text:"The diagonal starts too short. From U to W is 24 squares across and 32 squares up, which gives a length of 40 units.",math:"starting UW = 40 units"},{text:"The target is longer, so W must move away from U.",math:"50 units − 40 units = 10 units further"},{text:"Every point 50 units from U lies on a circle centred at U, so many positions of W are correct — but only the ones that keep TUVW a sensible four-sided shape are useful, which is why the diagonal is drawn in as you drag."}]},{id:"s5q23",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"reasoning",prompt:"Which set of measurements can actually be constructed?",given:"Four students each write down the angles they intend to draw.",options:["A triangle with angles 62°, 71° and 52°.","A quadrilateral with angles 100°, 115°, 90° and 65°.","A quadrilateral with angles 95°, 108°, 87° and 70°.","A parallelogram with one angle 74° and the angle next to it 96°."],correctAnswer:2,hint1:"Each option can be tested by adding, before any pencil touches the paper.",hint2:"Triangles must total 180° and quadrilaterals 360°, and in a parallelogram two neighbouring angles must total 180°.",hint3:"Add up each set in turn and compare it with the total that shape is allowed to have.",explanation:[{text:"The triangle fails, because its three angles come to more than 180°.",math:"62° + 71° + 52° = 185°"},{text:"The first quadrilateral fails, because four interior angles must total exactly 360°.",math:"100° + 115° + 90° + 65° = 370°"},{text:"The second quadrilateral is fine, so it is the one that can be drawn.",math:"95° + 108° + 87° + 70° = 360°"},{text:"The parallelogram fails, because neighbouring angles lie between parallel sides and must total 180°.",math:"74° + 96° = 170°"}]},{id:"s5q24",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"reasoning",prompt:"Which statement about these instructions is correct?",given:"Kofi is told to construct quadrilateral WXYZ with WX = 7 cm, XY = 5 cm, YZ = 6 cm and ZW = 4 cm. He is given no angles.",diagram:{kind:"custom",points:[{name:"W",x:0,y:0},{name:"X",x:70,y:0},{name:"Y",x:82.941,y:48.296},{name:"Z",x:25.557,y:30.771}],segments:[{a:"W",b:"X",length:"7 cm"},{a:"X",b:"Y",length:"5 cm"},{a:"Y",b:"Z",length:"6 cm"},{a:"Z",b:"W",length:"4 cm"}],notes:[{x:4,y:66,text:"one possible drawing"}]},options:["The four side lengths fix the quadrilateral completely, so only one drawing is possible.","There is not enough information: many quadrilaterals have those four sides, so an angle or a diagonal is needed as well.","The quadrilateral cannot be drawn at all, because all four sides are different lengths.","The quadrilateral is fixed as soon as Kofi remembers that its angles must total 360°."],correctAnswer:1,hint1:"Imagine the four sides as rods joined at the corners by hinges.",hint2:"Push on one corner of that hinged frame: the side lengths never change, but the shape does.",hint3:"Compare it with a triangle made of three rods, which cannot be pushed out of shape, and decide what one extra measurement would lock the quadrilateral.",explanation:[{text:"Three rods hinged together make a rigid triangle, but four rods make a frame that can be squashed, so the side lengths stay the same while every angle changes."},{text:"The four given lengths therefore describe a whole family of quadrilaterals rather than one. Knowing the angles total 360° does not help, because that is true of every member of the family.",math:"angle sum = 360° for all of them"},{text:"One extra measurement locks it: an angle, or the length of a diagonal such as WY, which splits the shape into two triangles that are each rigid."}]},{id:"s5q25",set:5,topic:"construction",skills:["construction","quadrilateral"],difficulty:3,type:"numeric",prompt:"Work out how long LM must be.",given:"Rectangle KLMN is to be constructed with KL = 9.5 cm and a perimeter of 34 cm.",unit:"cm",diagram:{kind:"custom",points:[{name:"K",x:0,y:0},{name:"L",x:95,y:0},{name:"M",x:95,y:62},{name:"N",x:0,y:62}],segments:[{a:"K",b:"L",length:"9.5 cm"},{a:"L",b:"M",length:"? cm"},{a:"M",b:"N"},{a:"N",b:"K"}],arcs:[{at:"K",from:"L",to:"N",right:!0},{at:"L",from:"M",to:"K",right:!0}],notes:[{x:2,y:80,text:"not to scale"}]},correctAnswer:7.5,hint1:"A rectangle has two pairs of equal sides, so MN is 9.5 cm as well.",hint2:"The perimeter is the whole way round, so the two long sides and the two short sides together make 34 cm.",hint3:"Work out 34 − 2 × 9.5, then share what is left between the two remaining sides.",explanation:[{text:"Opposite sides of a rectangle are equal, so the two sides of length 9.5 cm account for part of the perimeter.",math:"9.5 + 9.5 = 19 cm"},{text:"Take that away from the perimeter to find the two remaining sides together.",math:"34 − 19 = 15 cm"},{text:"LM and NK are equal, so halve what is left.",math:["LM = 15 ÷ 2","LM = 7.5 cm"]},{text:"Setting the ruler to 7.5 cm along each of the right angles already drawn at K and L completes the construction."}]}],rp=[{id:"s6q1",set:6,topic:"quadrilateral",skills:["quadrilateral","straight-line"],difficulty:5,type:"numeric",prompt:"Work out the size of angle x.",given:"PQRST is a pentagon. The dashed line PR splits it into the triangle PQR and the quadrilateral PRST.",diagram:{kind:"custom",points:[{name:"P",x:0,y:0},{name:"Q",x:111.109484,y:-54.191716},{name:"R",x:260,y:0},{name:"S",x:223.711716,y:145.544359},{name:"T",x:13.836566,y:197.872111}],segments:[{a:"P",b:"Q"},{a:"Q",b:"R"},{a:"R",b:"S"},{a:"S",b:"T"},{a:"T",b:"P"},{a:"P",b:"R",dashed:!0,muted:!0}],arcs:[{at:"P",from:"Q",to:"R",key:"qpr"},{at:"P",from:"R",to:"T",key:"rpt"},{at:"Q",from:"P",to:"R",key:"q"},{at:"S",from:"R",to:"T",key:"s"},{at:"T",from:"S",to:"P",key:"t"},{at:"R",from:"Q",to:"S",label:"x"}]},correctAnswer:96,hint1:"The diagonal PR belongs to two different shapes: a triangle on one side of it and a quadrilateral on the other.",hint2:"Angle x is the whole angle at R, so it is the triangle part PRQ added to the quadrilateral part PRS.",hint3:"Find angle PRQ from the triangle PQR, then find angle PRS from the four angles of PRST, and combine them.",explanation:[{text:"Start in the triangle PQR. Its three angles total 180°, and two of them are marked.",math:["angle PRQ = 180° − 134° − 26°","angle PRQ = 20°"],highlight:["q","qpr"]},{text:"Now move to the quadrilateral PRST. Its four angles total 360°, and three of them are marked.",math:["angle PRS = 360° − (86° + 118° + 80°)","angle PRS = 76°"],highlight:["rpt","s","t"]},{text:"The diagonal PR cuts the angle at R into exactly those two pieces, so put them back together.",math:["x = 20° + 76°","x = 96°"],highlight:["x"]},{text:"Check with the pentagon rule: five angles total (5 − 2) × 180° = 540°, and 112° + 134° + 96° + 118° + 80° = 540°."}]},{id:"s6q2",set:6,topic:"quadrilateral",skills:["quadrilateral","around-point","construction"],difficulty:5,type:"numeric",prompt:"Calculate the size of angle x.",given:"ABCD is a square and BCE is an equilateral triangle drawn on the outside of the side BC. The ticks show sides of equal length.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:130,y:0},{name:"C",x:130,y:130},{name:"D",x:0,y:130},{name:"E",x:242.583302,y:65}],segments:[{a:"A",b:"B",ticks:1},{a:"B",b:"C",ticks:1},{a:"C",b:"D",ticks:1},{a:"D",b:"A",ticks:1},{a:"B",b:"E",ticks:1},{a:"C",b:"E",ticks:1},{a:"A",b:"E"},{a:"D",b:"E"}],arcs:[{at:"B",from:"A",to:"C",right:!0,key:"sq"},{at:"E",from:"A",to:"D",label:"x"}]},correctAnswer:30,hint1:"Look first at angle ABE, which is a corner of the square and a corner of the triangle joined together.",hint2:"AB and BE carry the same tick, so triangle ABE is isosceles and its two base angles are equal.",hint3:"Find angle AEB, use the symmetry of the figure to get angle DEC, then take both away from the 60° angle BEC.",explanation:[{text:"The square gives angle ABC = 90° and the equilateral triangle gives angle CBE = 60°, so the whole angle at B is their sum.",math:"angle ABE = 90° + 60° = 150°",highlight:["sq"]},{text:"Every marked side is the same length, so AB = BE and triangle ABE is isosceles. Its two equal base angles share whatever is left of 180°.",math:["angle AEB = (180° − 150°) ÷ 2","angle AEB = 15°"]},{text:"The whole figure is symmetrical about the line through E and the midpoint of BC, so angle DEC is 15° as well."},{text:"Angle BEC is 60° because BCE is equilateral, and it is made of angle AEB, angle x and angle DEC.",math:["x = 60° − 15° − 15°","x = 30°"],highlight:["x"]}]},{id:"s6q3",set:6,topic:"quadrilateral",skills:["quadrilateral","straight-line"],difficulty:5,type:"multi",prompt:"Work out the sizes of angles a, b and c.",given:"The figure is made from two quadrilaterals, ABEF and BCDE, that share the edge BE. A, B and C lie on a straight line.",diagram:{kind:"custom",points:[{name:"A",x:-205.472134,y:83.016131},{name:"B",x:0,y:0,labelDir:250},{name:"C",x:111.262063,y:-44.952791},{name:"D",x:154.74816,y:74.524279},{name:"E",x:0,y:150,labelDir:100},{name:"F",x:-132.372601,y:195.579542}],segments:[{a:"A",b:"B"},{a:"B",b:"C"},{a:"C",b:"D"},{a:"D",b:"E"},{a:"E",b:"F"},{a:"F",b:"A"},{a:"B",b:"E"}],arcs:[{at:"B",from:"A",to:"E",key:"abe"},{at:"A",from:"B",to:"F",key:"ga"},{at:"F",from:"A",to:"E",key:"gf"},{at:"C",from:"B",to:"D",key:"gc"},{at:"D",from:"C",to:"E",key:"gd"},{at:"B",from:"E",to:"C",label:"a"},{at:"E",from:"B",to:"F",label:"b"},{at:"E",from:"B",to:"D",label:"c"}]},answerLabels:["a","b","c"],correctAnswer:[112,109,64],hint1:"Only one of the three unknowns can be found straight away — look for the straight line.",hint2:"Angle a sits next to the 68° angle along ABC; after that each quadrilateral hands you one more angle.",hint3:"Get a from 180° − 68°, then b from the four angles of ABEF, then c from the four angles of BCDE using your value of a.",explanation:[{text:"A, B and C lie on a straight line, so the two angles at B above that line total 180°.",math:["a = 180° − 68°","a = 112°"],highlight:["abe","a"]},{text:"ABEF is a quadrilateral, so its four angles total 360°. Three of them are 79°, 68° and 104°.",math:["b = 360° − (79° + 68° + 104°)","b = 109°"],highlight:["ga","gf","b"]},{text:"BCDE is a quadrilateral too, and its angle at B is the angle a you have just worked out.",math:["c = 360° − (112° + 88° + 96°)","c = 64°"],highlight:["gc","gd","c"]},{text:"Check: round the outline of the whole figure the angle at E is b + c = 109° + 64° = 173°, which is under 180°, so the outline really does bend at E."}]},{id:"s6q4",set:6,topic:"parallel",skills:["parallel","quadrilateral","straight-line"],difficulty:5,type:"numeric",prompt:"Calculate the size of angle x at G.",given:"ABCD and DCEF are parallelograms and FEG is a triangle. C, E and G lie on a straight line.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:150,y:0},{name:"C",x:182.446784,y:99.860934},{name:"D",x:32.446784,y:99.860934,labelDir:200},{name:"E",x:121.415481,y:214.644121,labelDir:340},{name:"F",x:-28.584519,y:214.644121},{name:"G",x:66.945409,y:317.087427}],segments:[{a:"A",b:"B",arrows:1},{a:"B",b:"C"},{a:"C",b:"E",arrows:2},{a:"E",b:"G"},{a:"G",b:"F"},{a:"D",b:"F",arrows:2},{a:"D",b:"A"},{a:"D",b:"C",arrows:1},{a:"F",b:"E",arrows:1}],arcs:[{at:"A",from:"D",to:"B",key:"ga"},{at:"C",from:"B",to:"E",key:"gc"},{at:"F",from:"E",to:"G",key:"gf"},{at:"G",from:"F",to:"E",label:"x"}]},correctAnswer:71,hint1:"The 134° angle at C is made of two pieces: one belongs to ABCD and the other belongs to DCEF.",hint2:"Opposite angles of a parallelogram are equal, so the angle BCD in ABCD matches the 72° angle at A.",hint3:"Peel 72° off the 134° to get angle DCE, use it to find angle CEF, then use the straight line CEG and the triangle FEG.",explanation:[{text:"In the parallelogram ABCD the angle BCD is opposite angle DAB, so it is also 72°. Take that piece off the whole 134° angle at C.",math:["angle DCE = 134° − 72°","angle DCE = 62°"],highlight:["ga","gc"]},{text:"In the parallelogram DCEF the sides DC and FE are parallel, so angles DCE and CEF are co-interior and total 180°.",math:["angle CEF = 180° − 62°","angle CEF = 118°"]},{text:"C, E and G form a straight line, so angle FEG takes up the rest of that 180°.",math:["angle FEG = 180° − 118°","angle FEG = 62°"]},{text:"Finish in the triangle FEG, whose three angles total 180°.",math:["x = 180° − 62° − 47°","x = 71°"],highlight:["gf","x"]}]},{id:"s6q5",set:6,topic:"parallel",skills:["parallel","intersecting","straight-line"],difficulty:5,type:"numeric",prompt:"Work out the size of angle x at V.",given:"AB and CD are parallel. EF and GH are straight lines that cross both of them and meet each other at V.",diagram:{kind:"lines",lines:[{id:"p1",through:[0,90],dir:0,arrows:1,ends:["A","B"]},{id:"p2",through:[0,-90],dir:0,arrows:1,ends:["C","D"]},{id:"t1",through:[0,0],dir:125,ends:["E","F"]},{id:"t2",through:[60,0],dir:40,ends:["G","H"]}],marks:[{at:["p1","t1"],sector:0,key:"g125"},{at:["p2","t2"],sector:0,key:"g40"},{at:["t1","t2"],sector:1,label:"x"}],pointLabels:[{at:["t1","t2"],text:"V"}]},correctAnswer:85,hint1:"The two crossing lines and the line CD enclose a triangle with V at the top of it.",hint2:"Use the parallel lines to carry the 125° angle down to where EF meets CD, then find the triangle angle there.",hint3:"The triangle angle under EF is 180° − 125°, the other base angle is 40°, and the three angles total 180°.",explanation:[{text:"AB and CD are parallel and EF crosses both, so the 125° angle at AB and the angle in the matching position at CD are corresponding angles, and therefore equal.",highlight:["g125"]},{text:"That 125° angle sits next to the triangle angle along the straight line CD.",math:["first base angle = 180° − 125°","first base angle = 55°"]},{text:"The 40° angle where GH meets CD is the second base angle of the same triangle.",highlight:["g40"]},{text:"The three angles of a triangle total 180°, so take both base angles away.",math:["x = 180° − 55° − 40°","x = 85°"],highlight:["x"]}]},{id:"s6q6",set:6,topic:"parallel",skills:["parallel","intersecting"],difficulty:4,type:"reasoning",prompt:"Which fact proves that AB and CD are parallel?",given:"EF is a straight line crossing AB and CD. The two marked angles have been measured accurately.",diagram:{kind:"lines",lines:[{id:"m",through:[0,80],dir:0,ends:["A","B"]},{id:"n",through:[0,-80],dir:0,ends:["C","D"]},{id:"t",through:[0,0],dir:68,ends:["E","F"]}],marks:[{at:["m","t"],sector:3,key:"g112"},{at:["n","t"],sector:0,key:"g68"}]},options:["They are corresponding angles, and corresponding angles are always equal.","They are co-interior angles on the same side of EF, and they total 180°.","They are vertically opposite angles, and vertically opposite angles are always equal.","EF makes an acute angle with each of the two lines, so the lines can never meet."],correctAnswer:1,hint1:"Decide first where each marked angle sits: inside or outside the pair of lines, and on which side of EF.",hint2:"Both marked angles lie between AB and CD, and both lie to the right of EF.",hint3:"Angles in that position have a special name, and the test for parallel lines is what their total comes to.",explanation:[{text:"Both marked angles lie in the space between AB and CD, and both lie to the right of the line EF. A pair in that position is called co-interior, or allied.",highlight:["g112","g68"]},{text:"Two lines cut by a transversal are parallel exactly when a pair of co-interior angles totals 180°.",math:"112° + 68° = 180°",highlight:["g112","g68"]},{text:'The other options fail. The two angles are not equal, so they are neither a corresponding pair nor a vertically opposite pair, and "both angles are acute" is not a test for parallel lines at all.'}]},{id:"s6q7",set:6,topic:"quadrilateral",skills:["quadrilateral","parallel"],difficulty:4,type:"reasoning",prompt:"Which statement about ABCD must be true?",given:"ABCD is a quadrilateral. No sides have been marked as parallel and none have been marked as equal.",diagram:{kind:"quad",angles:[{deg:124,key:"a"},{deg:56,key:"b"},{deg:91,key:"c"},{deg:89,key:"d"}],shape:"generic",rotation:8,vertexLabels:["A","B","C","D"]},options:["AD is parallel to BC, because the angles at A and B are co-interior angles that total 180°.","AB is parallel to DC, because the angles at A and D are the two largest angles in the shape.","ABCD is a parallelogram, because one pair of its opposite sides is parallel.","No pair of sides can be parallel, because no two of the four angles are equal."],correctAnswer:0,hint1:"Two sides of a quadrilateral are parallel when the angles at the two ends of the side joining them total 180°.",hint2:"Test each side in turn: add the two angles at its ends and watch for a total of 180°.",hint3:"Work out 124° + 56°, then 56° + 91°, then 91° + 89°, then 89° + 124°, and decide what each result is telling you.",explanation:[{text:"The side AB joins the angles at A and B. If those two angles total 180° they are co-interior, which forces AD and BC to be parallel.",math:"124° + 56° = 180°",highlight:["a","b"]},{text:"Running the same test along the side AD gives a different result, so AB and DC are not parallel.",math:"124° + 89° = 213°",highlight:["a","d"]},{text:"So ABCD has exactly one pair of parallel sides: it is a trapezium, not a parallelogram. And the claim that nothing can be parallel is wrong — parallel sides do not need equal angles, only angles that total 180°.",highlight:["c"]}]},{id:"s6q8",set:6,topic:"around-point",skills:["around-point","straight-line"],difficulty:4,type:"reasoning",prompt:"Is there enough information to work out angle x?",given:"Four rays are drawn from one point. Only two of the four angles have been measured.",diagram:{kind:"aroundPoint",angles:[{deg:63,key:"g63"},{deg:74,label:"x"},{deg:106,key:"g106"},{deg:117,label:"z"}],rotation:21},options:["Yes — two of the rays lie in a straight line, so x and the 106° angle must total 180°.","No — the angle z is unknown, so x can never be pinned down.","Yes — the four angles at a point are all equal, so each one is 90°.","No — angles at a point total 360°, and that single equation contains two unknowns."],correctAnswer:0,hint1:"Before you start counting unknowns, check whether any two of the rays continue straight through the point.",hint2:"The ray between the 63° angle and x lines up exactly with the ray between the 106° angle and z.",hint3:"Once you have spotted that straight line, decide which two angles lie on one side of it and what they must total.",explanation:[{text:"The ray separating the 63° angle from x and the ray separating the 106° angle from z point in exactly opposite directions, so together they make one straight line through the point.",highlight:["g63","g106"]},{text:"Angle x and the 106° angle both sit on the same side of that straight line, so the pair totals 180°.",math:["x = 180° − 106°","x = 74°"],highlight:["x","g106"]},{text:"So there is enough information after all. The full turn then delivers z as well, because 63° + 74° + 106° + z = 360°.",highlight:["z"]}]},{id:"s6q9",set:6,topic:"quadrilateral",skills:["quadrilateral","around-point"],difficulty:5,type:"reasoning",prompt:"Is there enough information to work out angle x?",given:"ABCD is a quadrilateral. Nothing is marked as parallel and no sides are marked as equal.",diagram:{kind:"quad",angles:[{deg:88,key:"g88"},{deg:134,key:"g134"},{deg:76,label:"x"},{deg:62,label:"y"}],shape:"generic",rotation:-7,vertexLabels:["A","B","C","D"]},options:["Yes — the four angles total 360°, so x = 360° − 88° − 134°.","No — the angle sum only tells you that x and y together must make 138°.","Yes — opposite angles of a quadrilateral are always equal, so x = 88°.","No — the lengths of the sides would have to be given before any angle could be found."],correctAnswer:1,hint1:"Write down the only rule that links all four angles of this quadrilateral together.",hint2:"Putting the two known angles into that rule leaves one equation containing both x and y.",hint3:"Ask whether anything else in the figure — a parallel marking, equal sides, three points in a line — pins x down on its own.",explanation:[{text:"The four angles of any quadrilateral total 360°, so that is the rule to start from.",math:"88° + 134° + x + y = 360°",highlight:["g88","g134"]},{text:"It rearranges to a single equation with two unknowns in it.",math:"x + y = 138°",highlight:["x","y"]},{text:"Nothing else fixes x. No sides are marked parallel, no sides are marked equal and no three points are marked as a straight line, so x could be 76°, or 100°, or 40°, with y taking up the rest."},{text:"One extra fact would be enough — the size of y, or that AB and DC are parallel — but as it stands there is not enough information."}]},{id:"s6q10",set:6,topic:"parallel",skills:["parallel","intersecting"],difficulty:5,type:"reasoning",prompt:"Which statement must be true?",given:"PQ is a straight line crossing AB and CD. Each marked angle is below its own line and to the right of PQ.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,60],dir:0,ends:["A","B"]},{id:"cd",through:[0,-60],dir:8,ends:["C","D"]},{id:"t",through:[0,0],dir:115,ends:["P","Q"]}],marks:[{at:["ab","t"],sector:3,key:"m65"},{at:["cd","t"],sector:3,key:"m73"}]},options:["AB and CD are parallel, because PQ makes an acute angle with each of them.","AB and CD are not parallel, because the two c

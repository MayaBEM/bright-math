ominant-baseline=\"middle\">K</text><rect x=\"0\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"18.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">L</text><rect x=\"36\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">M</text><rect x=\"72\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">N</text><rect x=\"108\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"126.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text><rect x=\"36\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text></svg>","sol":"L, M, N and P form a strip of four faces that wraps right round the cube, so L faces N and M faces P. (K is opposite Q.)","scheme":[],"watch":"Choosing N, which is joined to M, so it folds to sit next to M and not opposite it.","opts":["K","L","N","P"],"ans":3,"check":{"type":"mcq"}},{"n":11,"s":"A","m":1,"text":"Find the <b>area</b> of the triangle below.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 202.0 147.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,99.0 154.0,99.0 108.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"96.0\" y1=\"99.0\" x2=\"96.0\" y2=\"87.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"96.0\" y1=\"87.0\" x2=\"108.0\" y2=\"87.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"108.0\" y1=\"99.0\" x2=\"108.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"77.0\" y=\"117.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text><text x=\"102.0\" y=\"50.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text></svg>","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × base × height = <sup>1</sup>⁄<sub>2</sub> × 14 × 9 = 63 cm<sup>2</sup>","scheme":[],"watch":"Forgetting to halve, giving 14 × 9 = 126 cm<sup>2</sup>.","opts":["23 cm<sup>2</sup>","31.5 cm<sup>2</sup>","63 cm<sup>2</sup>","126 cm<sup>2</sup>"],"ans":2,"check":{"type":"mcq"}},{"n":12,"s":"A","m":1,"text":"Find the perimeter of the triangle below. Give your answer in <b>centimetres</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 112.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,64.0 150.0,64.0 50.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"75.0\" y=\"86.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"111.9\" y=\"13.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9.5 cm</text><text x=\"7.7\" y=\"18.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">65 mm</text></svg>","sol":"65 mm = 6.5 cm. Perimeter = 12 + 9.5 + 6.5 = 28 cm","scheme":[],"watch":"Adding 65 as if it were centimetres (86.5 cm), or leaving out the side given in millimetres.","opts":["21.5 cm","28 cm","86.5 cm","280 cm"],"ans":1,"check":{"type":"mcq"}},{"n":13,"s":"A","m":1,"text":"An isosceles triangle has a perimeter of 44 cm. Each of its two equal sides is 15 cm. Find the length of the <b>base</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 160.0 154.1\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,106.1 112.0,106.1 56.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"56.0\" y=\"126.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"101.7\" y=\"43.7\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 cm</text><text x=\"10.3\" y=\"43.7\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 cm</text><line x1=\"79.6\" y1=\"55.4\" x2=\"88.4\" y2=\"50.7\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"32.4\" y1=\"55.4\" x2=\"23.6\" y2=\"50.7\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"The two equal sides total 15 + 15 = 30 cm. Base = 44 − 30 = 14 cm.","scheme":[],"watch":"Subtracting only one of the equal sides, giving 29 cm.","opts":["7 cm","14 cm","22 cm","29 cm"],"ans":1,"check":{"type":"mcq"}},{"n":14,"s":"A","m":1,"text":"The table shows the base and the height of two triangles. How much <b>larger</b> is the area of Q than the area of P?","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:center\">Triangle</th><th style=\"text-align:center\">Base</th><th style=\"text-align:center\">Height</th></tr></thead><tbody><tr><td style=\"text-align:center\">P</td><td style=\"text-align:center\">10 cm</td><td style=\"text-align:center\">6 cm</td></tr><tr><td style=\"text-align:center\">Q</td><td style=\"text-align:center\">10 cm</td><td style=\"text-align:center\">9 cm</td></tr></tbody></table></div>","sol":"P = <sup>1</sup>⁄<sub>2</sub> × 10 × 6 = 30 cm<sup>2</sup>. Q = <sup>1</sup>⁄<sub>2</sub> × 10 × 9 = 45 cm<sup>2</sup>. 45 − 30 = 15 cm<sup>2</sup>","scheme":[],"watch":"Subtracting the two heights and answering 3 cm<sup>2</sup>.","opts":["3 cm<sup>2</sup>","15 cm<sup>2</sup>","30 cm<sup>2</sup>","45 cm<sup>2</sup>"],"ans":1,"check":{"type":"mcq"}},{"n":15,"s":"A","m":1,"text":"The right-angled triangle below has an area of <b>36 cm<sup>2</sup></b>. One of the two sides that meet at the right angle is 9 cm. Find the length of the <b>other</b> one.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 144.0 156.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,108.0 96.0,108.0 0.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,97.0 11.0,97.0 11.0,108.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"48.0\" y=\"128.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"-20.0\" y=\"54.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text></svg>","sol":"base × height = 2 × 36 = 72. Other side = 72 ÷ 9 = 8 cm.","scheme":[],"watch":"Working out 36 ÷ 9 = 4 cm and forgetting to double the area first.","opts":["4 cm","8 cm","18 cm","324 cm"],"ans":1,"check":{"type":"mcq"}},{"n":16,"s":"A","m":1,"text":"The polygon below has <b>12</b> sides. What is the <b>sum</b> of its interior angles?","fig":"<svg class=\"fig\" viewBox=\"-91.6 -91.6 183.2 183.2\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"18.1,-67.6 49.5,-49.5 67.6,-18.1 67.6,18.1 49.5,49.5 18.1,67.6 -18.1,67.6 -49.5,49.5 -67.6,18.1 -67.6,-18.1 -49.5,-49.5 -18.1,-67.6\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/></svg>","sol":"Sum = (n − 2) × 180° = (12 − 2) × 180° = 10 × 180° = 1 800°.","scheme":[],"watch":"Using 12 × 180° = 2 160° instead of (n − 2) × 180°.","opts":["1 620°","1 800°","1 980°","2 160°"],"ans":1,"check":{"type":"mcq"}},{"n":17,"s":"A","m":1,"text":"The shape below is a <b>regular octagon</b>. Find the size of one interior angle, <b>y</b>.","fig":"<svg class=\"fig\" viewBox=\"-88.7 -88.7 177.3 177.3\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"26.8,-64.7 64.7,-26.8 64.7,26.8 26.8,64.7 -26.8,64.7 -64.7,26.8 -64.7,-26.8 -26.8,-64.7\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"2.8,-64.7 3.0,-61.5 3.6,-58.5 4.6,-55.5 6.0,-52.7 7.7,-50.1 9.8,-47.7 12.2,-45.6 14.8,-43.9 17.6,-42.5 20.6,-41.5 23.7,-40.9 26.8,-40.7 29.9,-40.9 33.0,-41.5 36.0,-42.5 38.8,-43.9 41.4,-45.6 43.8,-47.7\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"11.5\" y=\"-29.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">y</text></svg>","sol":"Sum = (8 − 2) × 180° = 1 080°. One interior angle = 1 080° ÷ 8 = 135°.","scheme":[],"watch":"Giving the angle sum (1 080°) instead of one angle.","opts":["45°","120°","135°","1 080°"],"ans":2,"check":{"type":"mcq"}},{"n":18,"s":"A","m":1,"text":"A <b>regular pentagon</b> has a perimeter of 60 cm. Find the length of <b>one side</b>.","fig":"<svg class=\"fig\" viewBox=\"-90.6 -94.0 181.1 174.6\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,-70.0 66.6,-21.6 41.1,56.6 -41.1,56.6 -66.6,-21.6\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"42.1\" y=\"-58.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text></svg>","sol":"A regular pentagon has 5 equal sides. One side = 60 ÷ 5 = 12 cm.","scheme":[],"watch":"Dividing by 4 as if the shape were a square, giving 15 cm.","opts":["5 cm","12 cm","15 cm","300 cm"],"ans":1,"check":{"type":"mcq"}},{"n":19,"s":"A","m":1,"text":"The rectangle below has an area of 84 cm<sup>2</sup> and a length of 14 cm. Find its <b>perimeter</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 216.0 136.5\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 168.0,0.0 168.0,72.0 0.0,72.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"84.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text><text x=\"84.0\" y=\"36.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Area = 84 cm²</text></svg>","sol":"Width = 84 ÷ 14 = 6 cm. Perimeter = 2 × (14 + 6) = 40 cm.","scheme":[],"watch":"Adding only one length and one width (20 cm), or stopping at the width.","opts":["20 cm","28 cm","40 cm","84 cm"],"ans":2,"check":{"type":"mcq"}},{"n":20,"s":"A","m":1,"text":"The shape below is a <b>trapezium</b>. Find its <b>area</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 248.0 128.0\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,80.0 200.0,80.0 200.0,0.0 80.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"189.0,80.0 189.0,69.0 200.0,69.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"200.0,11.0 189.0,11.0 189.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"100.0\" y=\"98.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text><text x=\"218.0\" y=\"40.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 cm</text><text x=\"140.0\" y=\"-18.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 cm</text></svg>","sol":"Rectangle = 6 × 4 = 24 cm<sup>2</sup>. Triangle: base = 10 − 6 = 4 cm, height = 4 cm, so <sup>1</sup>⁄<sub>2</sub> × 4 × 4 = 8 cm<sup>2</sup>. Area = 24 + 8 = 32 cm<sup>2</sup>","scheme":[],"watch":"Treating the shape as a rectangle and working out 10 × 4 = 40 cm<sup>2</sup>.","opts":["24 cm<sup>2</sup>","32 cm<sup>2</sup>","40 cm<sup>2</sup>","64 cm<sup>2</sup>"],"ans":1,"check":{"type":"mcq"}},{"n":21,"s":"B","m":2,"text":"In triangle <i>ABC</i>, <i>AB</i> = <i>AC</i>. ∠<i>BAC</i> is 30° <b>more than</b> ∠<i>ABC</i>. Find ∠<i>BAC</i>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 188.0 131.4\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,83.4 140.0,83.4 70.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"101.2\" y1=\"44.9\" x2=\"108.8\" y2=\"38.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"38.8\" y1=\"44.9\" x2=\"31.2\" y2=\"38.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"-13.9\" y=\"88.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"153.9\" y=\"88.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><text x=\"70.0\" y=\"-15.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text></svg>","sol":"The two base angles are equal. Take one base angle as 1 part. Then 1 part + 1 part + (1 part + 30°) = 180°, so 3 parts = 150° and 1 part = 50°. ∠BAC = 50° + 30° = 80°.","scheme":["M1 3 parts = 180° − 30° = 150°","A1 80°"],"watch":"Giving 50°, the size of a base angle, instead of ∠BAC.","ans":"80°","check":{"type":"numeric","nums":[80.0],"unit":"deg","display":"80°"}},{"n":22,"s":"B","m":2,"text":"In a triangle, the second angle is <b>twice</b> the first angle and the third angle is <b>three times</b> the first angle. Find the size of the <b>largest</b> angle.","fig":"","sol":"1 part + 2 parts + 3 parts = 6 parts = 180°, so 1 part = 30°. The largest angle = 3 × 30° = 90°.","scheme":["M1 6 parts = 180°, so 1 part = 30°","A1 90°"],"watch":"Giving 30°, the smallest angle, instead of the largest one.","ans":"90°","check":{"type":"numeric","nums":[90.0],"unit":"deg","display":"90°"}},{"n":23,"s":"B","m":2,"text":"Mei draws the circle below. She then draws a second circle whose <b>radius</b> is the same length as the <b>diameter</b> of the first circle. Find the diameter of the second circle.","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:30mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">36 cm</text></svg>","sol":"The radius of the second circle is 36 cm. Its diameter = 2 × 36 = 72 cm.","scheme":["M1 radius of the second circle = 36 cm","A1 72 cm"],"watch":"Halving 36 cm first, so the second circle comes out the same size as the first.","ans":"72 cm","check":{"type":"numeric","nums":[72.0],"unit":"cm","display":"72 cm"}},{"n":24,"s":"B","m":2,"text":"The circle below touches all four sides of the square. The <b>radius</b> of the circle is 6.5 cm. Find the <b>perimeter</b> of the square.","fig":"<svg class=\"fig\" viewBox=\"-92.0 -92.0 184.0 200.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"-70\" y=\"-70\" width=\"140\" height=\"140\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#fff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><text x=\"0.0\" y=\"86.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text></svg>","sol":"The circle touches both sides, so the side of the square equals the diameter: 2 × 6.5 = 13 cm. Perimeter = 4 × 13 = 52 cm.","scheme":["M1 side of the square = 13 cm","A1 52 cm"],"watch":"Using the radius as the side of the square, giving 4 × 6.5 = 26 cm.","ans":"52 cm","check":{"type":"numeric","nums":[52.0],"unit":"cm","display":"52 cm"}},{"n":25,"s":"B","m":2,"text":"In the diagram, <i>PQR</i> is a straight line. ∠<i>SQR</i> = 115° and ∠<i>PSQ</i> = 70°. Find <b>∠x</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 6.9 300.0 167.1\" style=\"width:54mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,140.0 160.0,140.0 109.1,30.9\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"160.0\" y1=\"140.0\" x2=\"244.0\" y2=\"140.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"17.0,123.0 17.7,123.8 18.4,124.6 19.0,125.4 19.7,126.2 20.2,127.1 20.8,128.0 21.3,128.9 21.8,129.9 22.2,130.8 22.6,131.8 22.9,132.8 23.2,133.8 23.4,134.8 23.6,135.8 23.8,136.9 23.9,137.9 24.0,139.0 24.0,140.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"37.0\" y=\"125.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text><polyline points=\"119.2,52.6 117.7,53.3 116.2,53.8 114.6,54.3 113.0,54.6 111.4,54.8 109.8,54.9 108.2,54.9 106.5,54.8 104.9,54.5 103.3,54.2 101.8,53.8 100.2,53.2 98.7,52.6 97.3,51.8 95.9,51.0 94.6,50.0 93.3,49.0 92.1,47.9\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"102.2\" y=\"68.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">70°</text><text x=\"-13.9\" y=\"145.6\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text><text x=\"173.3\" y=\"146.9\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text><text x=\"113.0\" y=\"16.4\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">S</text><text x=\"186.0\" y=\"100.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">115°</text><text x=\"252.0\" y=\"150.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">R</text></svg>","sol":"PQR is a straight line, so ∠PQS = 180° − 115° = 65°. In triangle PQS, x = 180° − 65° − 70° = 45°.","scheme":["M1 ∠PQS = 180° − 115° = 65°","A1 45°"],"watch":"Using 115° as an angle inside the triangle instead of finding ∠PQS first.","ans":"45°","check":{"type":"numeric","nums":[45.0],"unit":"deg","display":"45°"}},{"n":26,"s":"B","m":2,"text":"A solid has 6 faces, 10 edges and 6 vertices. <b>Five</b> of its faces are triangles. Write down the <b>name</b> of the solid and the <b>shape</b> of its sixth face.","fig":"","sol":"Five triangles meet at one point above a base, so the solid is a pyramid. The base must have 5 sides for 5 triangles to fit round it, so the sixth face is a pentagon and the solid is a pentagonal pyramid.","scheme":["B1 pentagonal pyramid","B1 pentagon"],"watch":"Answering “hexagonal pyramid” by using the 6 faces instead of the 5 triangles round the base.","ans":"Pentagonal pyramid; the sixth face is a pentagon","check":{"type":"self"}},{"n":27,"s":"B","m":2,"text":"Ben has drawn five equal squares in a row, as shown. He wants to add <b>one</b> more square somewhere so that the shape folds into a cube. Explain why this is impossible.","fig":"<svg class=\"fig\" viewBox=\"-8.0 -8.0 166.0 46.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"30\" height=\"30\" fill=\"#c7d2fe\"/><rect x=\"30\" y=\"0\" width=\"30\" height=\"30\" fill=\"#c7d2fe\"/><rect x=\"60\" y=\"0\" width=\"30\" height=\"30\" fill=\"#c7d2fe\"/><rect x=\"90\" y=\"0\" width=\"30\" height=\"30\" fill=\"#c7d2fe\"/><rect x=\"120\" y=\"0\" width=\"30\" height=\"30\" fill=\"#c7d2fe\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"0.0\" y2=\"30.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"30.0\" y1=\"0.0\" x2=\"30.0\" y2=\"30.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"60.0\" y1=\"0.0\" x2=\"60.0\" y2=\"30.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"90.0\" y1=\"0.0\" x2=\"90.0\" y2=\"30.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"120.0\" y1=\"0.0\" x2=\"120.0\" y2=\"30.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"0.0\" x2=\"150.0\" y2=\"30.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"150.0\" y2=\"0.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"30.0\" x2=\"150.0\" y2=\"30.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><rect x=\"0\" y=\"0\" width=\"150\" height=\"30\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2\"/></svg>","sol":"When a net is folded, a row of squares wraps round the cube. Four squares go all the way round and meet again, so the fifth square in the row folds on top of the first one. Two faces would overlap whatever is added, so no sixth square can make it work.","scheme":["C1 four squares in a row already wrap right round the cube","C1 the fifth square folds on top of the first, so two faces overlap"],"watch":"Trying different places for the sixth square instead of seeing that the row of five is already impossible.","ans":"A row in a cube net can hold at most four squares","check":{"type":"self"}},{"n":28,"s":"B","m":2,"text":"The net below folds to make a dice. On a dice the numbers on <b>opposite</b> faces add up to <b>7</b>. Work out the numbers that belong on face <b>X</b> and face <b>Y</b>.","fig":"<svg class=\"fig\" viewBox=\"-16.0 -16.0 140.0 176.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"36\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"18.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">4</text><rect x=\"0\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"18.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">2</text><rect x=\"36\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">1</text><rect x=\"72\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">5</text><rect x=\"36\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">X</text><rect x=\"36\" y=\"108\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"126.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Y</text></svg>","sol":"The upright strip of four faces wraps round the cube, so 4 is opposite X and 1 is opposite Y. X = 7 − 4 = 3 and Y = 7 − 1 = 6. (The 2 and the 5 already add to 7.)","scheme":["B1 X = 3","B1 Y = 6"],"watch":"Pairing X with the face it is joined to (1) instead of the face two steps away in the strip.","ans":"X = 3, Y = 6","check":{"type":"numeric","nums":[3.0,6.0],"unit":"","display":"X = 3, Y = 6"}},{"n":29,"s":"B","m":2,"text":"Krit makes a skeleton model of a <b>hexagonal prism</b>. He uses one straw for each edge and one ball of clay for each vertex. How many straws and how many balls does he need?","fig":"","sol":"Each hexagonal end has 6 edges, and 6 more edges join the two ends: 6 + 6 + 6 = 18 edges. Each end has 6 corners, so there are 6 + 6 = 12 vertices.","scheme":["B1 18 straws","B1 12 balls"],"watch":"Giving 12 straws by forgetting the six edges that join the two hexagonal ends.","ans":"18 straws and 12 balls","check":{"type":"numeric","nums":[18.0,12.0],"unit":"","display":"18 straws and 12 balls"}},{"n":30,"s":"B","m":2,"text":"Sofia has the two solids below. She glues the square base of the square pyramid <b>B</b> exactly on to the top face of the cube <b>A</b>. How many <b>faces</b> does the new solid have?","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-60.0 -26.0 272.0 208.0\" style=\"width:31mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,34 100,34 100,134 0,134\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,34 34,0 134,0 100,34\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"100,34 134,0 134,100 100,134\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,134 34,100 134,100\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"34\" y1=\"0\" x2=\"34\" y2=\"100\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-26.0 -26.0 194.0 198.0\" style=\"width:31mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"71.0,0 0,146 108,146\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"71.0,0 108,146 142,112\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,146 34,112 142,112\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"71.0\" y1=\"0\" x2=\"34\" y2=\"112\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div></div>","sol":"The cube has 6 faces, but its top face is now covered, leaving 5 on the outside. The pyramid adds its 4 triangles. 5 + 4 = 9 faces.","scheme":["M1 only 5 faces of the cube are still on the outside","A1 9 faces"],"watch":"Adding 6 + 5 = 11 and forgetting that the two glued faces are now inside the solid.","ans":"9 faces","check":{"type":"numeric","nums":[9.0],"unit":"","display":"9 faces"}},{"n":31,"s":"B","m":2,"text":"A triangular sunshade has a base of 1.2 m and a height of 90 cm. Find its area in <b>square metres</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 160.5\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,112.5 150.0,112.5 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"93.0\" y1=\"112.5\" x2=\"93.0\" y2=\"100.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"93.0\" y1=\"100.5\" x2=\"105.0\" y2=\"100.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"112.5\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"130.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">1.2 m</text><text x=\"99.0\" y=\"58.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">90 cm</text></svg>","sol":"90 cm = 0.9 m. Area = <sup>1</sup>⁄<sub>2</sub> × 1.2 × 0.9 = 0.54 m<sup>2</sup>","scheme":["M1 changing 90 cm to 0.9 m and using <sup>1</sup>⁄<sub>2</sub> × base × height","A1 0.54 m<sup>2</sup>"],"watch":"Multiplying 1.2 by 90 without changing the units to match first.","ans":"0.54 m<sup>2</sup>","check":{"type":"numeric","nums":[0.54],"unit":"m2","display":"0.54 m²"}},{"n":32,"s":"B","m":2,"text":"A square has sides of 9 cm. An <b>equilateral triangle</b> has the same perimeter as the square. Find the length of one side of the triangle.","fig":"","sol":"Perimeter of the square = 4 × 9 = 36 cm. The triangle has 3 equal sides, so one side = 36 ÷ 3 = 12 cm.","scheme":["M1 perimeter = 4 × 9 = 36 cm","A1 12 cm"],"watch":"Dividing the perimeter by 4 instead of by 3, or just dividing 9 by 3.","ans":"12 cm","check":{"type":"numeric","nums":[12.0],"unit":"cm","display":"12 cm"}},{"n":33,"s":"B","m":2,"text":"The rectangle below is 12 cm long and 8 cm wide. A triangle is shaded inside it. The base of the triangle is 5 cm of the top side and its tip touches the bottom side. Find the area of the part of the rectangle that is <b>not</b> shaded.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -49.0 306.0 255.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"60.0,0.0 160.0,0.0 120.0,160.0\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"240.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"240.0\" y1=\"0.0\" x2=\"240.0\" y2=\"160.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"240.0\" y1=\"160.0\" x2=\"0.0\" y2=\"160.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"160.0\" x2=\"0.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"60.0\" y1=\"-11.0\" x2=\"160.0\" y2=\"-11.0\" stroke=\"#b45309\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"60.0\" y1=\"-5.0\" x2=\"60.0\" y2=\"-17.0\" stroke=\"#b45309\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"160.0\" y1=\"-5.0\" x2=\"160.0\" y2=\"-17.0\" stroke=\"#b45309\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"110.0\" y=\"-25.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 cm</text><text x=\"120.0\" y=\"182.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"258.0\" y=\"80.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text></svg>","sol":"Rectangle = 12 × 8 = 96 cm<sup>2</sup>. Shaded triangle = <sup>1</sup>⁄<sub>2</sub> × 5 × 8 = 20 cm<sup>2</sup>. Unshaded area = 96 − 20 = 76 cm<sup>2</sup>","scheme":["M1 96 − 20","A1 76 cm<sup>2</sup>"],"watch":"Giving the area of the shaded triangle (20 cm<sup>2</sup>) instead of the rest of the rectangle.","ans":"76 cm<sup>2</sup>","check":{"type":"numeric","nums":[76.0],"unit":"cm2","display":"76 cm²"}},{"n":34,"s":"B","m":2,"text":"Malee cuts out two paper triangles. Triangle <b>A</b> has a base of 16 cm and a height of 5 cm. Triangle <b>B</b> has a base of 8 cm and a height of 10 cm. <b>Show</b> that the two triangles have the same area.","fig":"","sol":"A: <sup>1</sup>⁄<sub>2</sub> × 16 × 5 = 40 cm<sup>2</sup>. B: <sup>1</sup>⁄<sub>2</sub> × 8 × 10 = 40 cm<sup>2</sup>. The two areas are equal.","scheme":["M1 <sup>1</sup>⁄<sub>2</sub> × base × height used for both triangles","A1 both shown to be 40 cm<sup>2</sup>"],"watch":"Comparing only the bases and deciding that triangle A must be the bigger one.","ans":"Both areas are 40 cm<sup>2</sup>","check":{"type":"self"}},{"n":35,"s":"B","m":2,"text":"Somchai cuts a rectangular sheet of metal 60 cm long and 40 cm wide into two equal triangles by cutting along a diagonal. Find the area of <b>one</b> triangle.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 258.0 184.5\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 180.0,0.0 180.0,120.0 0.0,120.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"180.0\" y1=\"0.0\" x2=\"0.0\" y2=\"120.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"90.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">60 cm</text><text x=\"210.0\" y=\"60.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">40 cm</text></svg>","sol":"The whole sheet = 60 × 40 = 2 400 cm<sup>2</sup>. The diagonal cuts it into two equal triangles, so one triangle = 2 400 ÷ 2 = 1 200 cm<sup>2</sup>. (Or <sup>1</sup>⁄<sub>2</sub> × 60 × 40 = 1 200 cm<sup>2</sup>.)","scheme":["M1 2 400 ÷ 2 or <sup>1</sup>⁄<sub>2</sub> × 60 × 40","A1 1 200 cm<sup>2</sup>"],"watch":"Giving the area of the whole rectangular sheet (2 400 cm<sup>2</sup>).","ans":"1 200 cm<sup>2</sup>","check":{"type":"numeric","nums":[1200.0],"unit":"cm2","display":"1 200 cm²"}},{"n":36,"s":"B","m":2,"text":"Malee cuts a tile in the shape of a <b>pentagon</b>. Four of its interior angles are 102°, 118°, 90° and 134°. Find the size of the <b>fifth</b> angle.","fig":"","sol":"The interior angles of a pentagon add up to (5 − 2) × 180° = 540°. The four given angles add up to 102° + 118° + 90° + 134° = 444°. The fifth angle = 540° − 444° = 96°.","scheme":["M1 angle sum = (5 − 2) × 180° = 540°","A1 96°"],"watch":"Adding the four given angles and stopping there (444°).","ans":"96°","check":{"type":"numeric","nums":[96.0],"unit":"deg","display":"96°"}},{"n":37,"s":"B","m":2,"text":"The shape below is made from five squares, each with sides of <b>4 cm</b>. Find the <b>perimeter</b> of the shape.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 168.0 168.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"40.0,0.0 80.0,0.0 80.0,40.0 120.0,40.0 120.0,80.0 80.0,80.0 80.0,120.0 40.0,120.0 40.0,80.0 0.0,80.0 0.0,40.0 40.0,40.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"40.0\" y1=\"40.0\" x2=\"80.0\" y2=\"40.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><line x1=\"40.0\" y1=\"80.0\" x2=\"80.0\" y2=\"80.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><line x1=\"40.0\" y1=\"40.0\" x2=\"40.0\" y2=\"80.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><line x1=\"80.0\" y1=\"40.0\" x2=\"80.0\" y2=\"80.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/></svg>","sol":"Going round the outside there are 12 sides, and each one is 4 cm long. Perimeter = 12 × 4 = 48 cm.","scheme":["M1 counting 12 sides of 4 cm round the outside","A1 48 cm"],"watch":"Counting only 8 sides, or working out the area (80 cm<sup>2</sup>) by mistake.","ans":"48 cm","check":{"type":"numeric","nums":[48.0],"unit":"cm","display":"48 cm"}},{"n":38,"s":"B","m":2,"text":"A rectangular garden is 18 m long and 12 m wide. A square pond of side 4 m is dug in the garden. The rest of the garden is sown with grass seed. One bag of seed covers 25 m<sup>2</sup>. How many bags are needed?","fig":"","sol":"Garden = 18 × 12 = 216 m<sup>2</sup>. Pond = 4 × 4 = 16 m<sup>2</sup>. Grass = 216 − 16 = 200 m<sup>2</sup>. Bags = 200 ÷ 25 = 8.","scheme":["M1 216 − 16 = 200 m<sup>2</sup>","A1 8 bags"],"watch":"Forgetting to take the pond away and buying seed for 216 m<sup>2</sup> (9 bags).","ans":"8 bags","check":{"type":"numeric","nums":[8.0],"unit":"","display":"8 bags"}},{"n":39,"s":"B","m":2,"text":"The shape below is a parallelogram. Find its <b>area</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 348.0 188.0\" style=\"width:54mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,140.0 240.0,140.0 300.0,0.0 60.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"60.0\" y1=\"128.0\" x2=\"72.0\" y2=\"128.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"72.0\" y1=\"128.0\" x2=\"72.0\" y2=\"140.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"60.0\" y1=\"140.0\" x2=\"60.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"120.0\" y=\"160.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"180.0\" y=\"-20.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"68.0\" y=\"70.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text></svg>","sol":"Cut off the right-angled triangle at the left-hand end and slide it to the right-hand end. This makes a rectangle 12 cm long and 7 cm high. Area = 12 × 7 = 84 cm<sup>2</sup>","scheme":["M1 rearranging into a 12 cm by 7 cm rectangle (or splitting into a rectangle and two triangles)","A1 84 cm<sup>2</sup>"],"watch":"Adding the side lengths to find the perimeter instead of working out the area.","ans":"84 cm<sup>2</sup>","check":{"type":"numeric","nums":[84.0],"unit":"cm2","display":"84 cm²"}},{"n":40,"s":"B","m":2,"text":"The plan below shows the floor of Malee's shop. Carpet costs <b>฿ 380</b> for each square metre. Find the total cost of carpeting the floor.","fig":"<svg class=\"fig\" viewBox=\"-50.0 -40.5 380.0 322.5\" style=\"width:54mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 120.0,0.0 120.0,80.0 280.0,80.0 280.0,240.0 0.0,240.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"109.0,0.0 109.0,11.0 120.0,11.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"269.0,80.0 269.0,91.0 280.0,91.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"280.0,229.0 269.0,229.0 269.0,240.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"11.0,240.0 11.0,229.0 0.0,229.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"60.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">3 m</text><text x=\"150.0\" y=\"46.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">2 m</text><text x=\"200.0\" y=\"66.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 m</text><text x=\"306.0\" y=\"162.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 m</text><text x=\"140.0\" y=\"258.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 m</text><text x=\"-26.0\" y=\"122.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 m</text></svg>","sol":"Split the floor into a 3 m × 6 m rectangle (18 m<sup>2</sup>) and a 4 m × 4 m rectangle (16 m<sup>2</sup>). Area = 18 + 16 = 34 m<sup>2</sup>. Cost = 34 × ฿ 380 = ฿ 12 920.","scheme":["M1 area = 34 m<sup>2</sup>","A1 ฿ 12 920"],"watch":"Using the whole 7 m by 6 m rectangle (42 m<sup>2</sup>) and paying for the corner that is not there.","ans":"฿ 12 920","check":{"type":"numeric","nums":[12920.0],"unit":"","display":"฿ 12 920"}},{"n":41,"s":"C","m":4,"text":"In the diagram, <i>DBC</i> is a straight line. Triangle <i>ABC</i> is isosceles with <i>AB</i> = <i>AC</i>, and ∠<i>ABC</i> = 58°.","fig":"<svg class=\"fig\" viewBox=\"-124.0 -12.0 308.0 186.0\" style=\"width:56mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,140.0 160.0,140.0 80.0,12.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"0.0\" y1=\"140.0\" x2=\"-90.0\" y2=\"140.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"12.7,119.6 13.8,120.4 14.9,121.2 16.0,122.1 16.9,123.0 17.9,124.0 18.7,125.0 19.6,126.1 20.3,127.2 21.0,128.4 21.6,129.6 22.2,130.8 22.6,132.1 23.1,133.3 23.4,134.6 23.7,136.0 23.8,137.3 24.0,138.7 24.0,140.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"35.0\" y=\"121.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">58°</text><line x1=\"115.8\" y1=\"78.6\" x2=\"124.2\" y2=\"73.4\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"44.2\" y1=\"78.6\" x2=\"35.8\" y2=\"73.4\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"-13.2\" y=\"147.1\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><text x=\"173.2\" y=\"147.1\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><text x=\"80.0\" y=\"-3.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><text x=\"-100.0\" y=\"150.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">D</text></svg>","sol":"","scheme":["M1 ∠ACB = 58° because the base angles are equal","A1 64°","M1 180° − 58°","A1 122°"],"watch":"Using ∠BAC in part (b) and working out 180° − 64° = 116°.","parts":[{"label":"(a)","text":"Find ∠<i>BAC</i>.","fig":"","m":2,"ans":"64°","sol":"The base angles of an isosceles triangle are equal, so ∠ACB = 58°. ∠BAC = 180° − 58° − 58° = 64°.","check":{"type":"numeric","nums":[64.0],"unit":"deg","display":"64°"}},{"label":"(b)","text":"Find ∠<i>ABD</i>.","fig":"","m":2,"ans":"122°","sol":"∠ABC = 58°, and DBC is a straight line, so ∠ABD = 180° − 58° = 122°.","check":{"type":"numeric","nums":[122.0],"unit":"deg","display":"122°"}}]},{"n":42,"s":"C","m":4,"text":"Malee is drawing a design of <b>three</b> circles in a straight row. Each circle has a radius of 4 cm, and each circle touches the next one at exactly one point.","fig":"","sol":"","scheme":["M1 the centres of two touching circles are 8 cm apart","A1 16 cm","C1 Ben has left out the radius at each end","B1 24 cm"],"watch":"Adding three radii instead of three diameters, giving 12 cm.","parts":[{"label":"(a)","text":"Find the distance from the centre of the <b>first</b> circle to the centre of the <b>last</b> circle.","fig":"","m":2,"ans":"16 cm","sol":"Each circle has a diameter of 2 × 4 = 8 cm, and the centres of two touching circles are one diameter apart. Distance = 8 + 8 = 16 cm.","check":{"type":"numeric","nums":[16.0],"unit":"cm","display":"16 cm"}},{"label":"(b)","text":"Malee wants to draw the whole design inside a rectangular frame. Ben says the frame must be at least 16 cm long. Explain why Ben is wrong, and write down the shortest length of frame that works.","fig":"","m":2,"ans":"24 cm","sol":"Ben has used only the distance between the two outside centres. The design also reaches 4 cm further to the left of the first centre and 4 cm further to the right of the last centre, so it is 16 + 4 + 4 = 24 cm long. (That is the same as three diameters, 3 × 8 cm.)","check":{"type":"numeric","nums":[24.0],"unit":"cm","display":"24 cm"}}]},{"n":43,"s":"C","m":4,"text":"Here are four nets.","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 200.0 148.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"32\" y=\"0\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"84\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"116\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"84\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 136.0 110.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"78\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"78\" y=\"52\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">C</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 167.0 167.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"54\" y=\"54\" width=\"54\" height=\"54\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,54 108,54 81.0,0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,54 54,108 0,81.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"108,54 108,108 135.0,81.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,108 108,108 81.0,135.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">D</div><svg class=\"fig\" viewBox=\"-16.0 -56.0 170.0 190.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"46\" height=\"78\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"46\" y=\"0\" width=\"46\" height=\"78\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"92\" y=\"0\" width=\"46\" height=\"78\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"46,0 92,0 69.0,-40\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"46,78 92,78 69.0,118\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div></div>","sol":"","scheme":["B1 nets A and B","B1 cuboid and cube both named","B1 says No","C1 the cube has 6 faces but the square pyramid has 5"],"watch":"Counting the pieces of a net without checking that every piece becomes exactly one face.","parts":[{"label":"(a)","text":"Two of these nets fold to make solids that have <b>only flat faces</b> and <b>8 vertices</b>. Write down their letters and name the two solids.","fig":"","m":2,"ans":"Nets A and B — a cuboid and a cube","sol":"Net A is made of rectangles that are not all the same size, so it folds to make a cuboid. Net B is six equal squares, so it folds to make a cube. Each of these solids has 8 vertices. Net C makes a square pyramid (5 vertices) and net D makes a triangular prism (6 vertices).","check":{"type":"self"}},{"label":"(b)","text":"Anong says, “Net B and net C fold to make solids with the same number of faces.” Is Anong correct? Explain your answer.","fig":"","m":2,"ans":"No","sol":"No. Net B is six squares, so it makes a cube, which has 6 faces. Net C is one square and four triangles, so it makes a square pyramid, which has 5 faces. 6 and 5 are not the same.","check":{"type":"yesno","value":"no"}}]},{"n":44,"s":"C","m":4,"text":"Krit is making a closed box in the shape of a <b>cuboid</b>. The box is 12 cm long, 4 cm wide and 7 cm high. He cuts the whole net out of one piece of card.","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 304.0 188.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,36 130,36 130,114 0,114\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,36 36,0 166,0 130,36\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"130,36 166,0 166,78 130,114\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,114 36,78 166,78\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"36\" y1=\"0\" x2=\"36\" y2=\"78\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"65.0\" y=\"132.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"-14.0\" y=\"75.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text><text x=\"176.0\" y=\"20.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 cm</text></svg>","sol":"","scheme":["B1 all three sizes correct","B1 two of each","B1 the faces come in matching opposite pairs","C1 so only three different rectangles are needed"],"watch":"Listing six different rectangles by treating every face of the cuboid as a different size.","parts":[{"label":"(a)","text":"The net is made of 6 rectangles. Write down the size of each of the <b>three different</b> rectangles Krit needs, and how many of each he must cut.","fig":"","m":2,"ans":"12 cm × 4 cm, 12 cm × 7 cm and 4 cm × 7 cm — two of each","sol":"Opposite faces of a cuboid are identical. The top and the bottom are 12 cm by 4 cm, the front and the back are 12 cm by 7 cm, and the two ends are 4 cm by 7 cm. Krit cuts two of each.","check":{"type":"self"}},{"label":"(b)","text":"Ben says, “A cuboid has 6 faces, so its net must be made of 6 <b>different</b> rectangles.” Explain why Ben is wrong.","fig":"","m":2,"ans":"The 6 faces form 3 matching pairs, so only 3 different rectangles are needed","sol":"Every face of a cuboid has an identical face opposite it, so the 6 rectangles form 3 matching pairs. Only 3 different sizes are needed and each one is used twice. (For a cube all six would be the same square.)","check":{"type":"self"}}]},{"n":45,"s":"C","m":4,"text":"Krit is making a triangular kite. The kite is an isosceles triangle with a base of 80 cm and two equal sides of 85 cm. Its height, measured from the base, is 75 cm.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 208.0 198.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,150.0 160.0,150.0 80.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"68.0\" y1=\"150.0\" x2=\"68.0\" y2=\"138.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"68.0\" y1=\"138.0\" x2=\"80.0\" y2=\"138.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"80.0\" y1=\"150.0\" x2=\"80.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"80.0\" y=\"172.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">80 cm</text><text x=\"139.4\" y=\"64.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">85 cm</text><text x=\"20.6\" y=\"64.6\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">85 cm</text><text x=\"88.0\" y=\"95.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">75 cm</text></svg>","sol":"","scheme":["M1 80 + 85 + 85","A1 250 cm","M1 area = 3 000 cm<sup>2</sup>","A1 ฿ 450"],"watch":"Using the 85 cm slanting side as the height in (b), giving an area of 3 400 cm<sup>2</sup>.","parts":[{"label":"(a)","text":"Find the perimeter of the kite.","fig":"","m":2,"ans":"250 cm","sol":"Perimeter = 80 + 85 + 85 = 250 cm.","check":{"type":"numeric","nums":[250.0],"unit":"cm","display":"250 cm"}},{"label":"(b)","text":"Krit covers the kite with cloth. The cloth costs <b>฿ 15</b> for every 100 cm<sup>2</sup>. Find the cost of the cloth for one kite.","fig":"","m":2,"ans":"฿ 450","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × 80 × 75 = 3 000 cm<sup>2</sup>. 3 000 ÷ 100 = 30 lots of 100 cm<sup>2</sup>. Cost = 30 × ฿ 15 = ฿ 450.","check":{"type":"numeric","nums":[450.0],"unit":"","display":"฿ 450"}}]},{"n":46,"s":"C","m":4,"text":"Somchai is tiling a triangular patio. The patio has a base of 9 m and a height of 6 m. Somchai writes:<br><b>Area = 9 × 6 = 54 m<sup>2</sup></b>","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 228.0 168.0\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,120.0 180.0,120.0 126.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"114.0\" y1=\"120.0\" x2=\"114.0\" y2=\"108.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"114.0\" y1=\"108.0\" x2=\"126.0\" y2=\"108.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"126.0\" y1=\"120.0\" x2=\"126.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"90.0\" y=\"138.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 m</text><text x=\"120.0\" y=\"62.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 m</text></svg>","sol":"","scheme":["C1 says he used the rectangle rule and forgot to halve","A1 27 m<sup>2</sup>","M1 27 ÷ 5 = 5.4","A1 6 boxes"],"watch":"Rounding 5.4 down to 5 boxes, which would leave part of the patio untiled.","parts":[{"label":"(a)","text":"Explain the mistake Somchai has made, and work out the correct area of the patio.","fig":"","m":2,"ans":"27 m<sup>2</sup>","sol":"9 × 6 is the rule for a rectangle. The triangle covers only half of that rectangle, so the answer must be halved. Correct area = <sup>1</sup>⁄<sub>2</sub> × 9 × 6 = 27 m<sup>2</sup>.","check":{"type":"numeric","nums":[27.0],"unit":"m2","display":"27 m²"}},{"label":"(b)","text":"Tiles are sold in boxes. One box covers 5 m<sup>2</sup>. How many boxes must Somchai buy?","fig":"","m":2,"ans":"6 boxes","sol":"27 ÷ 5 = 5.4. Five boxes would cover only 25 m<sup>2</sup>, which is not enough, so he must buy 6 boxes.","check":{"type":"numeric","nums":[6.0],"unit":"","display":"6 boxes"}}]},{"n":47,"s":"C","m":4,"text":"A triangular garden bed has an area of <b>45 m<sup>2</sup></b>. Its base is 15 m.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 108.0\" style=\"width:48mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,60.0 150.0,60.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"94.0\" y1=\"60.0\" x2=\"94.0\" y2=\"49.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"94.0\" y1=\"49.0\" x2=\"105.0\" y2=\"49.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"60.0\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"78.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 m</text><text x=\"99.0\" y=\"34.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text></svg>","sol":"","scheme":["M1 2 × 45 ÷ 15","A1 6 m","C1 tripling both would make the area much larger, so the height must get smaller","A1 2 m"],"watch":"Multiplying the height by 3 to get 18 m instead of dividing by 3.","parts":[{"label":"(a)","text":"Find the height of the garden bed.","fig":"","m":2,"ans":"6 m","sol":"base × height = 2 × 45 = 90. Height = 90 ÷ 15 = 6 m.","check":{"type":"numeric","nums":[6.0],"unit":"m","display":"6 m"}},{"label":"(b)","text":"Malee makes a second triangular bed with the <b>same</b> area of 45 m<sup>2</sup>, but its base is <b>3 times</b> as long. Ben says the height must be 3 times as long as well. Explain why Ben is wrong, and find the correct height of the second bed.","fig":"","m":2,"ans":"2 m","sol":"If the base and the height were both 3 times as long, the area would be 9 times as large, not the same. To keep the same area, a base 3 times as long needs a height 3 times shorter. New base = 3 × 15 = 45 m, so height = 90 ÷ 45 = 2 m.","check":{"type":"numeric","nums":[2.0],"unit":"m","display":"2 m"}}]},{"n":48,"s":"C","m":4,"text":"A <b>regular</b> polygon has an interior angle of <b>162°</b>.","fig":"","sol":"","scheme":["M1 exterior angle = 180° − 162° = 18°","A1 20 sides","M1 360° ÷ 80° = 4.5","C1 says No because the number of sides is not a whole number"],"watch":"Dividing 360° by the interior angle instead of by the exterior angle.","parts":[{"label":"(a)","text":"Work out how many sides the polygon has.","fig":"","m":2,"ans":"20 sides","sol":"Each exterior angle = 180° − 162° = 18°. The exterior angles of any polygon add up to 360°, so the number of sides = 360° ÷ 18° = 20.","check":{"type":"numeric","nums":[20.0],"unit":"","display":"20 sides"}},{"label":"(b)","text":"Anong says, “A regular polygon can have an interior angle of 100°.” Is Anong correct? Explain your answer.","fig":"","m":2,"ans":"No","sol":"If the interior angle were 100°, each exterior angle would be 180° − 100° = 80°, and the number of sides would be 360° ÷ 80° = 4.5. A polygon must have a whole number of sides, so no regular polygon has an interior angle of 100°.","check":{"type":"yesno","value":"no"}}]},{"n":49,"s":"C","m":4,"text":"The plan shows a school playground. It is a rectangle 20 m long and 14 m wide, with a rectangular extension 6 m by 4 m built on to the <b>middle</b> of one of the long sides.","fig":"<svg class=\"fig\" viewBox=\"-50.0 -70.0 260.0 224.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 56.0,0.0 56.0,-32.0 104.0,-32.0 104.0,0.0 160.0,0.0 160.0,112.0 0.0,112.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"56.0,-21.0 67.0,-21.0 67.0,-32.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"93.0,-32.0 93.0,-21.0 104.0,-21.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"149.0,0.0 149.0,11.0 160.0,11.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"160.0,101.0 149.0,101.0 149.0,112.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><polyline points=\"11.0,112.0 11.0,101.0 0.0,101.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"40.0\" y=\"-12.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 m</text><text x=\"80.0\" y=\"-46.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 m</text><text x=\"120.0\" y=\"-12.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">4 m</text><text x=\"186.0\" y=\"58.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 m</text><text x=\"80.0\" y=\"130.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 m</text><text x=\"-26.0\" y=\"58.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 m</text></svg>","sol":"","scheme":["M1 280 + 24","A1 304 m<sup>2</sup>","M1 each unmarked side = (20 − 6) ÷ 2 = 7 m","A1 76 m"],"watch":"Using 2 × (20 + 14) = 68 m in part (b) and ignoring the extension altogether.","parts":[{"label":"(a)","text":"Find the total area of the playground.","fig":"","m":2,"ans":"304 m<sup>2</sup>","sol":"Main rectangle = 20 × 14 = 280 m<sup>2</sup>. Extension = 6 × 4 = 24 m<sup>2</sup>. Total = 280 + 24 = 304 m<sup>2</sup>.","check":{"type":"numeric","nums":[304.0],"unit":"m2","display":"304 m²"}},{"label":"(b)","text":"A fence is put all the way round the edge of the playground. Find the total length of the fence.","fig":"","m":2,"ans":"76 m","sol":"The extension sits in the middle, so each unmarked side is (20 − 6) ÷ 2 = 7 m. Fence = 7 + 4 + 6 + 4 + 7 + 14 + 20 + 14 = 76 m.","check":{"type":"numeric","nums":[76.0],"unit":"m","display":"76 m"}}]},{"n":50,"s":"C","m":4,"text":"Ben has 36 m of fencing. He is going to make a rectangular pen for his rabbits, using <b>all</b> of the fencing.","fig":"","sol":"","scheme":["M1 width = 36 ÷ 2 − 12","A1 width 6 m and area 72 m<sup>2</sup>","M1 a 9 m by 9 m pen","A1 says Yes, because 81 m<sup>2</sup> is larger than 72 m<sup>2</sup>"],"watch":"Thinking that the same perimeter must always give the same area.","parts":[{"label":"(a)","text":"Ben makes the pen 12 m long. Find its width and its area.","fig":"","m":2,"ans":"Width 6 m, area 72 m<sup>2</sup>","sol":"Length + width = 36 ÷ 2 = 18 m, so the width = 18 − 12 = 6 m. Area = 12 × 6 = 72 m<sup>2</sup>.","check":{"type":"numeric","nums":[6.0,72.0],"unit":"m2","display":"Width 6 m, area 72 m²"}},{"label":"(b)","text":"Sofia says a pen 9 m long uses all the fencing and gives a <b>larger</b> area. Is she correct? Explain your answer.","fig":"","m":2,"ans":"Yes","sol":"If the length is 9 m, the width is 18 − 9 = 9 m and the area is 9 × 9 = 81 m<sup>2</sup>. 81 m<sup>2</sup> is larger than 72 m<sup>2</sup>, so Sofia is correct. The same perimeter can give different areas.","check":{"type":"yesno","value":"yes"}}]}]},{"id":"PB_End-of-Term-Exam","code":"Paper B","title":"End-of-Term Examination","colour":"#7A2E42","blurb":"Chapters 7–14 · 100 marks","sub":"Chapters 7–14 · 2-D and 3-D shapes · Perimeter, area and volume · Patterns · Pie charts","marks":100,"qs":[{"n":1,"s":"A","m":1,"text":"The diagram shows triangle <i>PQR</i>. The line <i>QRS</i> is straight. Find the value of <b>∠x</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -3.7 310.0 174.7\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,140.0 160.0,140.0 111.6,20.3\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"160.0\" y1=\"140.0\" x2=\"252.0\" y2=\"140.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><polyline points=\"16.4,122.4 17.1,123.2 17.9,124.0 18.6,124.8 19.3,125.7 19.9,126.6 20.5,127.5 21.0,128.5 21.6,129.4 22.0,130.4 22.4,131.4 22.8,132.5 23.1,133.5 23.4,134.6 23.6,135.6 23.8,136.7 23.9,137.8 24.0,138.9 24.0,140.0\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"36.7\" y=\"124.8\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">47°</text><polyline points=\"120.6,42.5 119.2,43.1 117.7,43.5 116.3,43.8 114.8,44.1 113.3,44.2 111.7,44.3 110.2,44.3 108.7,44.1 107.2,43.9 105.8,43.6 104.3,43.2 102.9,42.7 101.5,42.1 100.1,41.4 98.8,40.6 97.6,39.8 96.4,38.9 95.2,37.9\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"104.3\" y=\"57.7\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">65°</text><text x=\"-13.7\" y=\"146.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text><text x=\"173.0\" y=\"147.5\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">R</text><text x=\"115.4\" y=\"5.8\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text><text x=\"262.0\" y=\"147.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">S</text><text x=\"168.0\" y=\"102.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text></svg>","sol":"∠PRQ = 180° − 47° − 65° = 68°. QRS is a straight line, so x = 180° − 68° = 112°. (Or: the exterior angle equals the two opposite interior angles, 47° + 65° = 112°.)","scheme":[],"watch":"Stopping at ∠PRQ = 68° instead of going on to the angle outside the triangle.","opts":["68°","112°","115°","133°"],"ans":1,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"The circle below has a diameter of <b>18 cm</b>. A second, larger circle has a <b>radius</b> that is 3 cm longer than the radius of this circle. Find the <b>diameter</b> of the second circle.","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:32mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"-70.0\" y1=\"0.0\" x2=\"70.0\" y2=\"0.0\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"0.0\" y=\"14.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">18 cm</text></svg>","sol":"Radius of the first circle = 18 ÷ 2 = 9 cm. The second radius = 9 + 3 = 12 cm, so the second diameter = 2 × 12 = 24 cm.","scheme":[],"watch":"Adding 3 cm to the diameter instead of to the radius (21 cm).","opts":["12 cm","21 cm","24 cm","36 cm"],"ans":2,"check":{"type":"mcq"}},{"n":3,"s":"A","m":1,"text":"Ben is going to draw triangle <i>XYZ</i> with <i>XY</i> = 9 cm, <i>YZ</i> = 6 cm and <i>XZ</i> = 7 cm. Which sentence is correct?","fig":"","sol":"Three sides are given and no angle, so a protractor is not needed. He draws XY = 9 cm with a ruler, then swings an arc of 7 cm from X and an arc of 6 cm from Y with compasses. Z is the point where the two arcs cross.","scheme":[],"watch":"Reaching for a protractor when no angle has been given.","opts":["He needs a ruler only, because all three measurements are lengths.","He needs a ruler and a protractor, because he must measure an angle.","He needs a protractor and a pair of compasses, because no angle is given.","He needs a ruler and a pair of compasses, because <i>Z</i> is found where two arcs cross."],"ans":3,"check":{"type":"mcq"}},{"n":4,"s":"A","m":1,"text":"Krit folds the net below into a cube. He then writes a number on every face, so that the numbers on each pair of <b>opposite</b> faces add up to <b>11</b>. He writes <b>4</b> on face <b>P</b>. What number does he write on face <b>S</b>?","fig":"<svg class=\"fig\" viewBox=\"-16.0 -16.0 176.0 140.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"18.0\" y=\"18.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">P</text><rect x=\"36\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"18.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">Q</text><rect x=\"36\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">R</text><rect x=\"72\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">S</text><rect x=\"72\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">T</text><rect x=\"108\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"126.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">U</text></svg>","sol":"When the net is folded, faces P and S end up opposite each other. So the number on S is 11 − 4 = 7.","scheme":[],"watch":"Adding 4 to 11 instead of subtracting, and writing 15.","opts":["4","6","7","15"],"ans":2,"check":{"type":"mcq"}},{"n":5,"s":"A","m":1,"text":"The base of a pyramid is an <b>octagon</b> (8 sides). How many <b>edges</b> does the pyramid have?","fig":"","sol":"The base has 8 edges. One more edge joins each corner of the base to the point at the top, giving 8 more. Total = 8 + 8 = 16 edges.","scheme":[],"watch":"Counting only the 8 edges of the base and forgetting the 8 sloping edges.","opts":["8","9","16","24"],"ans":2,"check":{"type":"mcq"}},{"n":6,"s":"A","m":1,"text":"Which of these nets folds to make a <b>square pyramid</b>?","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-16.0 -22.0 196.0 116.0\" style=\"width:29mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 A72,72 0 0 1 96,52 L36,64 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><circle cx=\"128\" cy=\"34\" r=\"34\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 200.0 148.0\" style=\"width:29mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"32\" y=\"0\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"84\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"116\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"84\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">C</div><svg class=\"fig\" viewBox=\"-16.0 -56.0 170.0 190.0\" style=\"width:29mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"46\" height=\"78\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"46\" y=\"0\" width=\"46\" height=\"78\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"92\" y=\"0\" width=\"46\" height=\"78\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"46,0 92,0 69.0,-40\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"46,78 92,78 69.0,118\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">D</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 167.0 167.0\" style=\"width:29mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"54\" y=\"54\" width=\"54\" height=\"54\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,54 108,54 81.0,0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,54 54,108 0,81.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"108,54 108,108 135.0,81.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,108 108,108 81.0,135.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div></div>","sol":"A square pyramid has one square base and four triangular faces. Net D is the only net made of one square and four triangles.","scheme":[],"watch":"Choosing net C, the triangular prism, because it also contains triangles.","opts":["Net A","Net B","Net C","Net D"],"ans":3,"check":{"type":"mcq"}},{"n":7,"s":"A","m":1,"text":"Malee draws the triangle below. She then draws a second triangle with the <b>same base</b> but <b>twice the height</b>. Find the area of Malee's <b>second</b> triangle.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 192.0 132.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,84.0 144.0,84.0 102.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"90.0\" y1=\"84.0\" x2=\"90.0\" y2=\"72.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"90.0\" y1=\"72.0\" x2=\"102.0\" y2=\"72.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"102.0\" y1=\"84.0\" x2=\"102.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"72.0\" y=\"102.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"96.0\" y=\"42.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text></svg>","sol":"The second triangle has a base of 12 cm and a height of 2 × 7 = 14 cm. Area = <sup>1</sup>⁄<sub>2</sub> × 12 × 14 = 84 cm<sup>2</sup>.","scheme":[],"watch":"Finding the area of the first triangle (42 cm²) and forgetting to double it.","opts":["21 cm<sup>2</sup>","42 cm<sup>2</sup>","84 cm<sup>2</sup>","168 cm<sup>2</sup>"],"ans":2,"check":{"type":"mcq"}},{"n":8,"s":"A","m":1,"text":"An <b>equilateral</b> triangular road sign has a perimeter of <b>4.8 m</b>. Find the length of one side. Give your answer in <b>centimetres</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -50.2 188.0 169.2\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,95.0 140.0,95.0 70.0,-26.2\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"70.0\" y1=\"90.0\" x2=\"70.0\" y2=\"100.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"100.7\" y1=\"36.9\" x2=\"109.3\" y2=\"31.9\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"39.3\" y1=\"36.9\" x2=\"30.7\" y2=\"31.9\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"One side = 4.8 ÷ 3 = 1.6 m. Since 1 m = 100 cm, 1.6 m = 160 cm.","scheme":[],"watch":"Multiplying by 10 instead of by 100 when changing metres to centimetres.","opts":["1.6 cm","16 cm","160 cm","1 600 cm"],"ans":2,"check":{"type":"mcq"}},{"n":9,"s":"A","m":1,"text":"The interior angles of the <b>regular</b> polygon below add up to <b>1 440°</b>. Find the size of one interior angle, <b>x</b>.","fig":"<svg class=\"fig\" viewBox=\"-94.0 -90.6 188.0 181.1\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"21.6,-66.6 56.6,-41.1 70.0,0.0 56.6,41.1 21.6,66.6 -21.6,66.6 -56.6,41.1 -70.0,0.0 -56.6,-41.1 -21.6,-66.6\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"-2.4,-66.6 -2.1,-63.2 -1.4,-60.0 -0.3,-56.8 1.3,-53.9 3.2,-51.1 5.6,-48.7 8.2,-46.7 11.1,-45.0 14.2,-43.7 17.5,-42.9 20.8,-42.6 24.1,-42.7 27.4,-43.3 30.6,-44.3 33.6,-45.8 36.4,-47.7 38.9,-49.9 41.0,-52.5\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"1.5\"/><text x=\"9.3\" y=\"-30.4\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">x</text></svg>","sol":"1 440° ÷ 180° = 8, so the polygon has 8 + 2 = 10 sides. All 10 angles are equal, so one angle = 1 440° ÷ 10 = 144°.","scheme":[],"watch":"Dividing 1 440° by 8 or by 9 instead of by 10.","opts":["144°","160°","180°","1 440°"],"ans":0,"check":{"type":"mcq"}},{"n":10,"s":"A","m":1,"text":"The shape below is a rectangle with one corner cut out. Find its <b>area</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 192.0 156.0\" style=\"width:52mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\" text":"A square tile has a perimeter of <b>36 cm</b>. How many of these tiles are needed to cover a rectangular tray 45 cm long and 27 cm wide, with no gaps?","fig":"","sol":"One side of a tile = 36 ÷ 4 = 9 cm. Along the tray: 45 ÷ 9 = 5 tiles; across it: 27 ÷ 9 = 3 tiles. Total = 5 × 3 = 15 tiles.","scheme":[],"watch":"Dividing the area of the tray by 9 cm instead of by the area of one tile (135).","opts":["15","27","45","135"],"ans":0,"check":{"type":"mcq"}},{"n":12,"s":"A","m":1,"text":"A round mirror has a radius of <b>10 cm</b>. Braid is glued all the way round the edge of the mirror, and one more piece of braid is glued straight across a diameter. Find the <b>total</b> length of braid. (Take π = 3.14)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><circle cx=\"0\" cy=\"0\" r=\"3\" fill=\"#1f2937\"/><text x=\"-12.0\" y=\"12.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">O</text><line x1=\"0.0\" y1=\"0.0\" x2=\"55.2\" y2=\"-43.1\" stroke=\"#b45309\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"31.6\" y=\"-33.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm            </text></svg>","sol":"Circumference = 2 × 3.14 × 10 = 62.8 cm. Diameter = 2 × 10 = 20 cm. Total braid = 62.8 + 20 = 82.8 cm.","scheme":[],"watch":"Giving only the distance round the edge (62.8 cm) and forgetting the piece across the middle.","opts":["20 cm","42.8 cm","62.8 cm","82.8 cm"],"ans":3,"check":{"type":"mcq"}},{"n":13,"s":"A","m":1,"text":"A round table mat has a diameter of <b>28 cm</b>. Find its <b>area</b>. (Take π = <sup>22</sup>⁄<sub>7</sub>)","fig":"<svg class=\"fig\" viewBox=\"-90.0 -90.0 180.0 180.0\" style=\"width:30mm\" xmlns=\"http:

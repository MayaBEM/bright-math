/* Division Pods — Bright EngMath — Space Pod Launch theme */
:root{
  --teal:#134E4A; --teal-2:#0F3F3B; --teal-3:#1E6B65; --sun:#FDBA21; --sun-2:#E5A50F; --coral:#FB6F5B; --coral-2:#E35642;
  --sky:#7DD3FC; --sky-2:#38BDF8; --cream:#FFF8ED; --ink:#1F2937;
  --bg:#FFF8ED; --panel:#FFFFFF; --panel-2:#FFF1D6; --text:#1F2937; --muted:#5B6472; --line:#E6DCC8; --line-2:#CBD5E1;
  --ok:#2E8B57; --ok-bg:#E3F6EA; --bad:#D9452F; --bad-bg:#FFE1DB; --shadow:0 4px 0 rgba(31,41,55,.18);
  --radius:14px; --focus:0 0 0 3px rgba(125,211,252,.9);
  --pod-fill:#FFFFFF; --pod-stroke:#134E4A; --dot:#FDBA21; --dot-stroke:#1F2937; --pad:#FFF1C9; --grid:#E6DCC8;
}
html[data-theme="dark"]{
  --bg:#0B2F2C; --panel:#134E4A; --panel-2:#0F3F3B; --text:#FFF8ED; --muted:#BFD6D2; --line:#1E6B65; --line-2:#2B7F78;
  --ok:#7CD9A2; --ok-bg:#14503A; --bad:#FF9A8C; --bad-bg:#5B2A24; --shadow:0 4px 0 rgba(0,0,0,.35);
  --pod-fill:#0F3F3B; --pod-stroke:#7DD3FC; --dot:#FDBA21; --dot-stroke:#0B2F2C; --pad:#2B5A1F; --grid:#1E6B65;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;color:var(--text);background:var(--bg);min-height:100vh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.display,.btn,.pill,.tab,.patch-num,.eq{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600;letter-spacing:.01em}
h1{font-size:30px;margin:0 0 6px;font-weight:700} h2{font-size:24px;margin:0 0 6px;font-weight:700} h3{font-size:19px;margin:0 0 4px}
p{margin:0 0 10px} button{font:inherit;color:inherit}
.sr{position:absolute;left:-9999px}

.icon-btn:hover{background:rgba(255,248,237,.22)} .icon-btn:focus-visible,.btn:focus-visible,.tab:focus-visible,.key:focus-visible,.choice:focus-visible,.mcard:focus-visible,input:focus-visible{outline:none;box-shadow:var(--focus)}

.mcard.locked{opacity:.55;cursor:not-allowed} .mcard.done{border-color:var(--ok)}

.pb-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:2px solid var(--line-2);border-radius:10px;overflow:hidden}

.eq{font-size:30px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.ans{width:92px;height:56px;font-size:28px;font-family:Fredoka;font-weight:700;text-align:center;border:2.5px solid var(--line-2);border-radius:12px;background:var(--panel);color:var(--text);caret-color:var(--teal)}
.ans.sm{width:72px;height:50px;font-size:24px}
.ans.focus{border-color:var(--teal);box-shadow:var(--focus)} .ans.ok{border-color:var(--ok);background:var(--ok-bg)} .ans.bad{border-color:var(--bad);background:var(--bad-bg)}

.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:14px 0}
.key{min-height:54px;border-radius:12px;border:2px solid var(--ink);background:var(--panel);font-family:Fredoka;font-weight:700;font-size:24px;cursor:pointer;box-shadow:0 3px 0 var(--ink);color:var(--text)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)} .key.op{background:var(--sky);color:var(--ink)} .key.del{background:var(--coral);color:#fff}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.choice{min-height:56px;padding:10px 14px;border-radius:12px;border:2px solid var(--line-2);background:var(--panel);font-size:18px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;color:var(--text)}
.choice:hover{border-color:var(--teal)} .choice.sel{border-color:var(--teal);background:rgba(125,211,252,.25)} .choice.ok{border-color:var(--ok);background:var(--ok-bg)} .choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.choice .k{width:30px;height:30px;border-radius:8px;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-family:Fredoka;font-weight:700;flex:none}
.choice svg{max-width:100%;height:auto}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;border:2px solid;font-size:17px}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)} .fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb .model{margin-top:10px;background:var(--panel);border-radius:10px;padding:6px;border:1.5px solid var(--line)}
.fb .model svg{width:100%;height:auto;max-height:260px;display:block}
.hint{background:rgba(253,186,33,.18);border:2px dashed var(--sun-2);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:16px}
.hint b{font-family:Fredoka}
.ff{display:grid;grid-template-columns:repeat(2,minmax(200px,1fr));gap:10px;margin:8px 0}
@media (max-width:520px){.ff{grid-template-columns:1fr}}
.ff .eq{font-size:24px;gap:6px;background:var(--panel-2);border-radius:10px;padding:8px 10px;margin:0}

.scoreline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;font-weight:700}
.timer{font-family:Fredoka;font-weight:700;font-size:24px;padding:4px 12px;border-radius:10px;background:var(--panel-2);border:2px solid var(--line)}
.timer.low{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.bigscore{font-family:Fredoka;font-weight:700;font-size:60px;line-height:1}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel-2);border-radius:12px;padding:12px;text-align:center} .stat b{display:block;font-family:Fredoka;font-size:26px;font-weight:700} .stat span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800}

}

const fmtDate = d => new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});

/* ---------- state ---------- */
const KEY = DP.FREEBIE ? "divisionPods.freebie.v1" : "divisionPods.v1";
function defaultState(){
  const missions = {}; for (const m of DP.MISSIONS) missions[m.n] = {learn:false, explore:false, practice:null, practiceBest:0, check:null, passed:false, attempts:0, passedAt:null, reviews:[]};
  return {v:1, name:"", klass:"", xp:0, streak:0, lastDay:null, missions, diag:{done:false, score:null, rec:1, detail:[]},
    factBest:0, boss:null, settings:{sound:true, theme:"light", unlockAll:false, enabled:[1,2,3,4,5,6,7,8], pin:"2468"}, reviewLog:[]};
}
DP.state = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v===1) { const d = defaultState(); return Object.assign(d, s, {settings:Object.assign(d.settings, s.settings||{}), missions:Object.assign(d.missions, s.missions||{})}); } } catch(e){} return defaultState(); })();
DP.save = () => { try { localStorage.setItem(KEY, JSON.stringify(DP.state)); } catch(e){} };
DP.reset = () => { localStorage.removeItem(KEY); DP.state = defaultState(); DP.save(); };
DP.touchStreak = () => {
  const s = DP.state, t = todayISO();
  if (s.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  s.streak = (s.lastDay === y.toISOString().slice(0,10)) ? s.streak+1 : 1; s.lastDay = t; DP.save();
};
DP.addXP = (n, x, y) => { DP.state.xp += n; DP.save(); DP.updateTop(); const p = h("div",{class:"xp-pop"},"+"+n+" XP"); p.style.left=(x||window.innerWidth/2)+"px"; p.style.top=(y||window.innerHeight*0.4)+"px"; document.body.append(p); setTimeout(()=>p.remove(),1000); };
DP.isEnabled = n => DP.FREEBIE ? n<=2 : DP.state.settings.enabled.includes(n);
DP.isUnlocked = n => { if (!DP.isEnabled(n)) return false; if (DP.state.settings.unlockAll || n===1) return true;
  // unlocked when previous enabled mission is passed (or previous not enabled)
  let p = n-1; while (p>=1 && !DP.isEnabled(p)) p--; return p<1 ? true : !!DP.state.missions[p].passed; };

/* ---------- sound (synth, no files) ---------- */
let actx = null;
function tone(f, d=0.12, type="sine", g=0.18, when=0){
  if (!DP.state.settings.sound) return;
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==="suspended") actx.resume();
    const o = actx.createOscillator(), v = actx.createGain(); o.type = type; o.frequency.value = f; v.gain.value = g;
    o.connect(v); v.connect(actx.destination); const t = actx.currentTime + when; o.start(t); v.gain.setValueAtTime(g,t); v.gain.exponentialRampToValueAtTime(0.001, t+d); o.stop(t+d+0.02); } catch(e){}
}
DP.snd = {
  tap: () => tone(520, .06, "triangle", .08),
  snap: () => tone(660, .08, "square", .06),
  launch: () => { tone(330,.12,"sawtooth",.08); tone(660,.18,"triangle",.1,.1); },
  ok: () => { tone(523,.1,"triangle",.12); tone(659,.1,"triangle",.12,.1); tone(784,.18,"triangle",.12,.2); },
  bad: () => { tone(220,.18,"sawtooth",.07); },
  win: () => { [523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.12,i*.12)); },
  tick: () => tone(880,.03,"square",.04)
};

/* ---------- confetti ---------- */
DP.confetti = (n=140) => {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = h("canvas",{class:"confetti"}); document.body.append(c); const ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight; const cols = ["#FDBA21","#FB6F5B","#7DD3FC","#134E4A","#FFF8ED"];
  const ps = Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,r:4+Math.random()*6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,col:pick(cols)}));
  let t0 = performance.now();
  (function step(now){ const dt = now - t0; ctx.clearRect(0,0,c.width,c.height);
    for (const p of ps){ p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.col; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore(); }
    if (dt < 2600) requestAnimationFrame(step); else c.remove(); })(t0);
};

/* ===== Pod Builder: the key visual tool (SVG) =====
   PodBuilder(mount, opts) opts: {a, b, mode:'group'|'share', view:'pods'|'array'|'line', auto:true, speed:1, interactive:true,
   drag:false, showEq:true, controls:true, onDone(fn), compact:false, big:false}
   Correct for all a in 1..100, b in 1..10 (asserted by tests). */
(function(){
const {h,$} = DP;
const SVGNS = "http://www.w3.org/2000/svg";
const S = (tag, attrs={}) => { const el = document.createElementNS(SVGNS, tag); for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

/* geometry: layout pods for a ÷ b. returns {W,H, pods:[{x,y,w,h,slots:[{x,y}]}], pad:{x,y,w,h,slots:[]}, scatter:[{x,y}]} */
function layout(a, b, mode, W){
  const q = Math.floor(a/b), r = a % b;
  const nPods = mode==="group" ? q : b;           // grouping: q pods of b ; sharing: b pods of q
  const per   = mode==="group" ? b : q;
  const dotR = 9, gap = dotR*2.5;
  // pod inner grid: columns for `per` dots
  let pc = per<=0 ? 1 : (per<=5 ? per : (per<=10 ? Math.ceil(per/2) : Math.ceil(per/3)));
  pc = Math.max(1, Math.min(pc, Math.floor((W-24-14)/gap)));
  const pr = per<=0 ? 1 : Math.ceil(per/pc);
  const pw = Math.max(54, pc*gap+14), ph = Math.max(44, pr*gap+14);
  const cols = Math.max(1, Math.min(nPods, Math.floor((W-24)/(pw+12))));
  const rows = nPods ? Math.ceil(nPods/cols) : 0;
  const top = 58; // room for the boarding area (scattered crew)
  const pods = [];
  for (let i=0;i<nPods;i++){
    const c = i%cols, rr = Math.floor(i/cols);
    const x = 12 + c*(pw+12), y = top + rr*(ph+22);
    const slots = []; for (let k=0;k<per;k++){ const kc=k%pc, kr=Math.floor(k/pc); slots.push({x:x+7+dotR+kc*gap+ (pw-14-pc*gap)/2, y:y+7+dotR+kr*gap + (ph-14-pr*gap)/2}); }
    pods.push({x,y,w:pw,h:ph,slots,i});
  }
  const podsBottom = rows ? top + rows*(ph+22) : top;
  // launch pad for remainder (always present)
  const padH = 52, pad = {x:12, y:podsBottom+10, w:W-24, h:padH, slots:[]};
  const padCap = Math.max(r, 0);
  for (let k=0;k<padCap;k++) pad.slots.push({x: pad.x+130+k*gap, y: pad.y+padH/2});
  // dot holding area ("boarding area") — scatter above pods; stage height
  const H = pad.y+padH+12;
  // scatter positions: deterministic pseudo-random inside a band at top (y 8..40) and spread across W
  const scatter = []; let seed = a*31+b*7+(mode==="group"?3:5);
  const rnd = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
  for (let i=0;i<a;i++) scatter.push({x: 20 + rnd()*(W-40), y: 10 + rnd()*30});
  return {W,H,q,r,nPods,per,pods,pad,scatter,dotR,gap};
}

function PodBuilder(mount, opts){
  const o = Object.assign({a:17,b:5,mode:"group",view:"pods",auto:false,speed:1,interactive:true,drag:false,showEq:true,controls:true,compact:false,big:true,onDone:null,onCheck:null,allowModeSwitch:true,allowViewSwitch:true,allowInput:true}, opts);
  const api = {};
  const root = h("div",{class:"pb"+(o.compact?" compact":"")});
  const topRow = h("div",{class:"pb-top"});
  const eqEl = h("div",{class:"pb-eq", "aria-live":"polite"});
  const stage = h("div",{class:"pb-stage"});
  const ctl = h("div",{class:"pb-ctl noprint"});

  let L, svg, dots = [], podEls = [], anim = null, timer = null;

  /* ---- equation ---- */
  function renderEq(){
    const {q,r} = L; const fq = st.step>=L.nPods && (L.nPods>0 || st.step>0) ; // quotient known when all pods done
    const showQ = st.dragMode ? false : (st.step >= L.nPods);
    const showR = st.dragMode ? false : (st.step > L.nPods || (st.step>=L.nPods && r===0 && L.nPods>0) || (L.nPods===0 && st.step>=1));
    eqEl.innerHTML = `<span>${st.a}</span><span>÷</span><span>${st.b}</span><span>=</span><span class="slot${showQ?" filled":""}" data-k="q">${showQ?q:"?"}</span>` +
      (r>0 || st.dragMode || !showR ? `<span>R</span><span class="slot rem${showR?" filled":""}" data-k="r">${showR?r:"?"}</span>` : `<span class="muted" style="font-size:.6em">R 0</span>`);
  }
  /* ---- build stage ---- */
  function build(){
    const sw = stage.clientWidth || 640; L = layout(st.a, st.b, st.mode, sw && sw < 480 ? 400 : 640);
    stage.innerHTML = ""; dots = []; podEls = [];
    if (st.view === "array") return buildArray();
    if (st.view === "line") return buildLine();
    svg = S("svg",{viewBox:`0 0 ${L.W} ${L.H}`, role:"img", "aria-label":`Pod model for ${st.a} divided by ${st.b}`});
    stage.append(svg);
    // pods
    L.pods.forEach((p,i)=>{
      const g = S("g",{class:"pod-g"});
      const rect = S("rect",{class:"pod-r", x:p.x, y:p.y, width:p.w, height:p.h, rx:12});
      const fin = S("polygon",{class:"pod-fin", points:`${p.x+p.w/2-8},${p.y} ${p.x+p.w/2+8},${p.y} ${p.x+p.w/2},${p.y-9}`});
      const lab = S("text",{class:"pod-lab", x:p.x+p.w/2, y:p.y+p.h+15, "text-anchor":"middle"}); lab.textContent = `Pod ${i+1}`;
      g.append(rect, fin, lab);

      p.slots.forEach(s=>{ g.append(S("circle",{cx:s.x, cy:s.y, r:L.dotR, fill:"none", stroke:"var(--line-2)", "stroke-width":1.2, "stroke-dasharray":"3 3"})); });
      svg.append(g); podEls.push({g,rect,fin,p});
    });
    // launch pad
    const pad = L.pad;
    svg.append(S("rect",{class:"pad-r", x:pad.x, y:pad.y, width:pad.w, height:pad.h, rx:8}));
    const pl = S("text",{class:"pad-lab", x:pad.x+12, y:pad.y+pad.h/2+5}); pl.textContent = "Launch pad:"; svg.append(pl);
    const plr = S("text",{class:"pad-lab", id:"padcount", x:pad.x+pad.w-12, y:pad.y+pad.h/2+5, "text-anchor":"end"}); svg.append(plr);
    // dots
    for (let i=0;i<st.a;i++){
      const s = L.scatter[i];
      const g = S("g",{class:"dot-g", transform:`translate(${s.x},${s.y})`});
      const c = S("circle",{class:"dot-c", r:L.dotR}); const hi = S("circle",{cx:-3,cy:-3,r:2.4,fill:"#fff",opacity:.8});

    if (st.dragMode) enableDrag();

  }
  function setPos(d, x, y){ d.x=x; d.y=y; d.g.setAttribute("transform",`translate(${x},${y})`); }

  /* ---- animation: move a set of dots to targets, then cb ---- */
  function glide(moves, cb){

      if (t<1) anim = requestAnimationFrame(frame); else { anim=null; cb && cb(); } };
    anim = requestAnimationFrame(frame);
  }
  /* ---- one animation step ---- */
  function doStep(cb){
    if (st.view!=="pods" || st.dragMode) { cb && cb(); return; }
    const free = dots.filter(d=>d.pod===-1);
    if (st.step < L.nPods){

      if (st.mode==="group"){ const p = L.pods[st.step]; const take = free.slice(0, L.per);

        DP.snd.snap();
        glide(moves, ()=>{ markFull(st.step); st.step++; renderEq(); message(st.step<L.nPods ? `Pod ${st.step} full — launch!` : (L.r? `All pods full. ${L.r} crew can't fill a pod.` : "All pods full — no one left over!")); cb && cb(); });
      } else { // share: deal one dot to each pod = one round; round index = st.step
        const round = st.step; // rounds 0..q-1
        moves = L.pods.map((p,i)=>{ const d = free[i]; if (!d) return null; d.pod=i; d.slot=round; return {d, x:p.slots[round].x, y:p.slots[round].y}; }).filter(Boolean);
        DP.snd.snap();
        glide(moves, ()=>{ st.step++; if (st.step===L.nPods) {L.pods.forEach((_,i)=>markFull(i));} renderEq();
          message(st.step<L.nPods ? `Round ${st.step}: one crew to each pod.` : `Every pod has ${L.q}. ${L.r? L.r+" crew can't be shared equally.":"No one left over!"}`); cb && cb(); });

      glide(moves, ()=>{ st.step++; renderEq(); updatePad(); st.done=true; if (L.r) DP.snd.launch(); else DP.snd.ok();
        message(L.r ? `${L.r} crew wait on the launch pad. That's the remainder: R ${L.r}.` : "Mission complete — no remainder."); o.onDone && o.onDone({q:L.q,r:L.r}); cb && cb(); });
    } else { cb && cb(); }
  }
  function markFull(i){ const pe = podEls[i]; if (!pe) return; pe.rect.classList.add("full"); pe.g.classList.add("launching"); setTimeout(()=>pe.g.classList.remove("launching"), 600); DP.snd.launch(); }
  function message(t, cls){ msg.textContent = t; msg.className = "pb-msg"+(cls?" "+cls:""); }

  /* ---- share mode fix: steps = q rounds, so override nPods-based counters ---- */

  // layout.nPods is q for group, b for share — so for share we need st.step compared with q. Patch doStep via wrapper:
  const stepsTotal = () => L.q;
  function doStep2(cb){
    if (st.view!=="pods" || st.dragMode) { cb && cb(); return; }
    const free = dots.filter(d=>d.pod===-1);
    if (st.step < stepsTotal()){
      if (st.mode==="group"){ const p = L.pods[st.step]; const take = free.slice(0, L.per);
        const moves = take.map((d,k)=>{ d.pod=st.step; d.slot=k; return {d, x:p.slots[k].x, y:p.slots[k].y}; });
        DP.snd.snap();
        glide(moves, ()=>{ markFull(st.step); st.step++; renderEq2(); message(st.step<L.q ? `Pod ${st.step} full — launch!` : (L.r? `All ${L.q} pods full. ${L.r} crew can't fill a pod.` : `All ${L.q} pods full — no one left over!`)); cb && cb(); });
      } else { const round = st.step;
        const moves = L.pods.map((p,i)=>{ const d = free[i]; if (!d) return null; d.pod=i; d.slot=round; return {d, x:p.slots[round].x, y:p.slots[round].y}; }).filter(Boolean);
        DP.snd.snap();
        glide(moves, ()=>{ st.step++; if (st.step===L.q) L.pods.forEach((_,i)=>markFull(i)); renderEq2();
          message(st.step<L.q ? `Round ${st.step}: one crew to each pod.` : `Every pod has ${L.q}. ${L.r? L.r+" crew can't be shared equally.":"No one left over!"}`); cb && cb(); });
      }

    const extra = r; // leftover dots drawn as partial row

  return {type:"mc", mission:7, a, b, text:`${a} ÷ ${b} = ${q} R ${r}. What do you do with the remainder? <br><i>${qs[0].t}</i>`, choices:ch, correct:ch.indexOf(qs[0].k), model:{a,b,mode:"group"}, hints:[`Read the question word: needed? full? left over?`,`\"Needed\" → round up. \"Full\" → drop. \"Left over\" → remainder.`,`${qs[0].k}.`], explain:`${qs[0].k}.`}; };
// Mission 8: bigger numbers
G[8] = () => { const t = pick(["two","two","three","pq","word","blocks"]);
  if (t==="two" || t==="blocks"){ const b = ri(2,6), q = ri(11,19), r = ri(0,b-1), a = b*q+r; if (a>99) return G[8]();
    return {type:"qr", mission:8, a, b, text: t==="blocks" ? `Use tens and ones. ${Math.floor(a/10)} tens and ${a%10} ones shared among ${b}.` : `Divide. Share the tens, trade, then share the ones.`, eq:`${a} ÷ ${b} =`, answer:{q,r}, model:{a,b,mode:"group",view:"line"}, big:true, hints:[`Share the tens first: ${Math.floor(a/10)} tens ÷ ${b} = ${Math.floor(Math.floor(a/10)/b)} ten each, ${Math.floor(a/10)%b} ten${Math.floor(a/10)%b===1?"":"s"} left.`,`Trade the leftover tens for ones: ${(Math.floor(a/10)%b)*10 + a%10} ones ÷ ${b}.`,`${b} × ${q} = ${b*q}; ${a} − ${b*q} = ${r}. Answer ${q}${r?" R "+r:""}.`]}; }
  if (t==="three"){ const b = ri(3,8), q = ri(21,99), r = ri(0,b-1), a = b*q+r; const q10 = Math.floor(q/10)*10;

  const b = ri(3,6), q = ri(21,48), r = ri(1,b-1), a = b*q+r; const [ppl,veh,vehs] = pick(BUS_CTX);

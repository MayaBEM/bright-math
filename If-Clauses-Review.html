:root{--ink:#121A3A;--ink2:#0A1028;--muted:#4F5874;--bg:#F3F4F8;--pink:#FF8FB8;--pinkd:#F0679A;--gold:#F7C548;--line:#D3D8E2;--ok:#17834A;--okbg:#E2F3E8;--no:#C03A2B;--nobg:#FBE4E1;--brand:#FF914D;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 Lexend,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.btn,.title,.pagetitle{font-family:Poppins,system-ui,sans-serif}
button{font:inherit;color:inherit}
.app-head{background:#fff;color:var(--ink);position:sticky;top:0;z-index:20;border-bottom:3px solid var(--ink)}
.head-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brandlogo{height:58px;width:auto;display:block;margin:-4px 0}
.brand{font:600 14px Poppins,sans-serif;letter-spacing:.2px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:2px;background:var(--brand);display:inline-block}
.apptitle{font:700 17px Poppins,sans-serif;margin-left:6px;padding-left:14px;border-left:2px solid var(--line);display:flex;align-items:center;gap:8px}
.apptitle svg{width:34px;height:31px}
.head-sp{flex:1}
#who{font-size:15px;display:flex;align-items:center;gap:7px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-dot{width:10px;height:10px;border-radius:50%;background:var(--pink);flex:none;border:2px solid var(--ink)}
#homeBtn{background:#fff;border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:6px 14px;font:600 15px Poppins,sans-serif;cursor:pointer;min-height:40px}
#homeBtn:hover{background:var(--gold)}
.stripe{display:flex;height:6px}.stripe span{flex:1}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:26px 20px 40px}
footer{text-align:center;font-size:14px;color:var(--muted);padding:18px 20px 26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:2px;padding:10px 22px;min-height:52px;font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;transition:transform .12s,background .12s}
.btn:hover{background:var(--ink2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.big{min-height:60px;font-size:18px;padding:12px 26px}
.btn.big:hover{background:#26315C}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:#F7F8FB;border-color:var(--c,var(--ink));color:var(--c,var(--ink))}
.btn.danger{background:var(--no);border-color:var(--no)}
.link{background:none;border:0;padding:4px 2px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
.link.danger{color:var(--no)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:28px}
/* HOME */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;margin-bottom:26px}
.eyebrow-line{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.eyebrow-line{gap:0!important;font-size:16px;font-weight:600;color:var(--muted)}
.eyebrow-line span+span:before{content:", "}
.title .ifw{background:var(--gold);padding:0 .14em;border:4px solid var(--ink);border-radius:2px;display:inline-block;margin-right:.12em}
.title{font-size:clamp(52px,9vw,92px);line-height:1;margin:10px 0 8px;font-weight:800;letter-spacing:-2px}
.sub{font-size:20px;margin:0 0 18px;color:var(--muted);max-width:30ch}
.hello{font-size:20px;margin:0}
.nameform label{display:block;font-weight:600;margin-bottom:6px}
.nameform input{font:inherit;font-size:19px;padding:10px 14px;border:3px solid var(--ink);border-radius:2px;min-height:52px;width:min(320px,100%);background:#fff}
.heroart{justify-self:end;position:relative;width:100%;max-width:330px}
.heroart .iffy{width:100%;height:auto;display:block}
.heroart .say{position:absolute;right:-6px;top:-8px;background:var(--gold);border:3px solid var(--ink);border-radius:2px;padding:6px 14px;font:700 20px Poppins;}
.heroart .dots{display:flex;gap:10px;justify-content:center;margin-top:6px}
.heroart .dots i{width:40px;height:40px;border-radius:2px;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font:800 17px Poppins;font-style:normal}
.lineart{width:100%;max-width:340px;justify-self:end}
.lineart path{fill:none;stroke-width:9;stroke-linecap:round}
.lineart text{font:800 17px Poppins,sans-serif;fill:var(--ink)}
.lineart .iftxt{font-size:44px;font-weight:800}
.route{position:relative;display:flex;flex-direction:column;gap:16px}
.route:before{content:"";position:absolute;left:31px;top:30px;bottom:30px;width:8px;background:var(--ink);border-radius:2px}
.route{gap:20px}
.stop{position:relative;display:grid;grid-template-columns:70px 1fr auto;gap:18px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:2px;padding:16px 20px 16px 0;margin-left:0}
.stop-node{width:50px;height:50px;border-radius:2px;background:var(--gold);border:4px solid var(--ink);display:grid;place-items:center;font:800 19px Poppins,sans-serif;justify-self:center;position:relative;z-index:1}
.stop h2{margin:0;font-size:24px}
.stop p{margin:2px 0 0;color:var(--muted);font-size:16px}
.stop .prog{color:var(--ink);font-weight:500;font-size:15px;margin-top:4px}
.bar{height:14px;background:#fff;border:2px solid var(--ink);border-radius:2px;overflow:hidden;margin-top:8px;max-width:340px}
.bar span{display:block;height:100%;background:var(--gold);border-right:2px solid var(--ink)}
.bar span[style="width:0%"]{border:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:24px;font-size:15px}
.lg{display:flex;align-items:center;gap:8px}
.lg i{width:30px;height:30px;border-radius:2px;color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font:800 14px Poppins;font-style:normal}
.resetrow{margin-top:26px;text-align:right}
/* common page */
.crumbs{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:8px;color:var(--muted)}
.crumbs .link{font-size:15px}
.pagetitle{font-size:clamp(32px,5vw,44px);margin:4px 0 6px;line-height:1.1}
.lead{font-size:19px;color:var(--muted);margin:0 0 22px;max-width:62ch}
.kick{margin:0;font:600 15px Poppins,sans-serif;color:var(--muted)}
.chal{font-style:normal;background:#BC2B4B;color:#fff;border-radius:2px;padding:1px 8px;font:600 13px Poppins,sans-serif;vertical-align:2px;margin-left:4px}
.card{background:#fff;border:3px solid var(--ink);border-radius:2px;padding:24px}
/* learn list */
.lessonlist{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.lrow{width:100%;display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--ink);border-radius:2px;padding:14px 18px;cursor:pointer;text-align:left;min-height:72px}
.lrow:hover{background:#F7F8FB;transform:translateY(-2px)}
.lrow{transition:transform .12s}
.lrow .iffy{width:52px;height:48px;flex:none}
.lnum{width:44px;height:44px;flex:none;border-radius:2px;display:grid;place-items:center;font:800 19px Poppins;border:3px solid var(--c)}
.ltext{flex:1;display:flex;flex-direction:column}
.lkick{font-size:14px;color:var(--muted)}
.ltitle{font:700 20px Poppins}
.lstate{font-size:15px;font-weight:500;border:2px solid var(--line);border-radius:2px;padding:3px 12px;white-space:nowrap}
.lstate.done{border-color:var(--ink);color:var(--ink);background:var(--gold)}
/* lesson */
.lesson{background:#fff;border:3px solid var(--ink);border-top:14px solid var(--c);border-radius:2px;padding:26px clamp(18px,4vw,36px) 30px}
.lhead{display:flex;gap:16px;align-items:center}
.lhead h1{margin:0;font-size:clamp(28px,4.4vw,40px);line-height:1.1}
.lhead .iffy{width:86px;height:79px;flex:none}
.badge{flex:none;min-width:62px;height:62px;padding:0 10px;border-radius:2px;color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font:800 26px Poppins}
.badge:not(:empty){font-size:clamp(14px,3vw,26px)}
.use{font-size:20px;margin:18px 0 6px;max-width:64ch}
.block{margin-top:24px}
.block h3,.qc h3{font-size:16px;margin:0 0 10px;color:var(--muted);font-weight:600}
.formula{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-bottom:10px}
.fbk{font:600 clamp(16px,2.4vw,20px) Poppins;padding:12px 18px;border-radius:2px;border:3px solid var(--c)}
.fbk.if{background:var(--tint);color:var(--ink)}
.fbk.res{background:var(--c);color:#fff}
.fcomma{font:800 40px/1 Poppins;color:var(--c);align-self:flex-end;margin:0 -2px}
.fnote{margin:6px 0 0;font-size:17px;color:var(--muted)}
.examples{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.examples li{font-size:20px;padding:10px 16px;border:2px solid var(--ink);border-left:8px solid var(--c);background:#fff;border-radius:2px}
.hl{color:var(--c);font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.tl{width:100%;max-width:640px;display:block}
.tl .ax{font:600 14px Lexend;fill:#566079}
.tl .vt{font:700 17px Poppins}
.tl .vs{font:500 14px Lexend}
.vcap{margin:4px 0 0;font-size:17px;color:var(--muted)}
.swap{display:grid;gap:10px;max-width:640px}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sb{padding:10px 16px;border-radius:2px;font:600 18px Poppins;border:3px solid var(--ink)}
.sb.if{background:#fff}.sb.res{background:var(--ink);color:#fff}
.scomma{font:800 36px/1 Poppins;color:var(--brand);align-self:flex-end}
.stag{font-size:14px;border:2px dashed var(--ink);border-radius:2px;padding:2px 8px;margin-left:6px}
.sarrow{font-size:15px;color:var(--muted);padding-left:6px}
.eq{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.eqb{font:700 22px Poppins;padding:10px 18px;border:3px solid var(--ink);border-radius:2px;background:#fff}
.eqb.u{background:var(--ink);color:#fff}
.eqs{font:800 30px Poppins}
.qa{display:grid;gap:10px;max-width:600px}
.qline{display:flex;gap:12px;align-items:center;font-size:19px;border:2px solid var(--ink);border-radius:2px;padding:10px 14px;background:#fff}
.qline.a{margin-left:clamp(10px,6vw,60px);background:#F7F8FA}
.ql{width:34px;height:34px;flex:none;border-radius:2px;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 16px Poppins}
.watch{margin-top:26px;border:3px solid var(--ink);border-radius:2px;padding:16px 20px 16px 20px;background:#FFF8DC;position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.watch .iffy{width:78px;height:72px}
.watch>div{min-width:0}
.watch h3{margin:0 0 8px;font-size:19px;color:var(--ink)}
.watch p{margin:6px 0;font-size:19px;display:flex;gap:10px;align-items:flex-start}
.wr{text-decoration:line-through;text-decoration-color:rgba(192,58,43,.6);text-decoration-thickness:2px}
.wnote{font-size:17px!important;color:var(--muted);display:block!important}
.mark{flex:none;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:16px;color:#fff;text-decoration:none}
.mark.yes{background:var(--ok)}.mark.no{background:var(--no)}
.qc{margin-top:30px;border-top:3px dashed var(--line);padding-top:22px}
.qcount{margin:0 0 4px;font-size:15px;color:var(--muted)}
.qcdone{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#FFF8DC;border:3px solid var(--ink);border-radius:2px;padding:14px 18px}
.qcdone .iffy{width:64px;height:59px}
.qcdone p{margin:0;font-size:19px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
/* lesson v2 */
.lesson{padding-top:0!important;border-top-width:2px!important;overflow:hidden}
.lband{background:var(--c);color:#fff;margin:0 calc(-1*clamp(18px,4vw,36px));padding:16px clamp(18px,4vw,36px) 22px}
.lband .lprog{color:#fff;margin:0 0 12px}
.lband .lprog .dots i{background:rgba(255,255,255,.35)}
.lband .lprog .dots i.on{background:#fff}
.lband .lhead h1{color:#fff}
.lband .kick{color:#fff;opacity:.9}
.lband .badge{background:#fff!important;color:var(--c);border:0}
.step>h3 b{background:var(--c)!important}
.cl-res{border-bottom:3px solid var(--ink);padding:1px 2px}
/* intro order visual */
.order{display:grid;gap:12px;max-width:680px}
.orow{border:2px solid var(--ink);padding:12px 14px;background:#fff}
.orow h4{margin:0 0 10px;font:700 16px Poppins;display:flex;align-items:center;gap:8px}
.orow h4 span{background:var(--c);color:#fff;font-size:13px;padding:2px 8px}
.oline{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;font:600 19px Poppins}
.oline .p{padding:8px 12px;border:2px solid var(--ink)}
.oline .p small{display:block;font:500 12px Lexend;color:var(--muted);margin-top:2px}
.oline .p.ifc{background:var(--tint);border-color:var(--c)}
.oline .p.res{background:#fff}
.oline .cm{font:800 34px/1 Poppins;color:var(--c);padding:0 6px;align-self:flex-end}
.oline .gap{width:10px}
.lesson{max-width:820px;margin:0 auto}
.lprog{display:flex;align-items:center;gap:10px;margin:2px 0 18px;font:600 15px Poppins;color:var(--muted)}
.lprog .dots{display:flex;gap:5px;flex:1;max-width:260px}
.lprog .dots i{flex:1;height:8px;background:#E3E6EE;border-radius:2px}
.lprog .dots i.on{background:var(--c)}
.keyidea{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;background:var(--tint);border:2px solid var(--ink);border-left:8px solid var(--c);border-radius:2px;padding:14px 18px;margin:18px 0 6px}
.keyidea .iffy{width:96px;height:auto}
.keyidea p{margin:0;font:600 21px/1.45 Poppins}
.keyidea small{display:block;font:600 13px Poppins;color:var(--muted);letter-spacing:.3px;margin-bottom:2px}
.step{margin-top:30px}
.step>h3{display:flex;align-items:center;gap:10px;font:700 20px Poppins!important;color:var(--ink)!important;margin:0 0 12px!important}
.step>h3 b{width:30px;height:30px;flex:none;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:16px;border-radius:2px}
.step .use{margin:0}
.exlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin:0 0 10px}
.exlegend span{display:flex;align-items:center;gap:6px}
.exlegend i{width:26px;height:16px;border:2px solid var(--ink);border-radius:2px}
.cl-if{background:var(--tint);border-bottom:3px solid var(--c);padding:1px 4px;border-radius:2px}
/* illustrations */
.ilrow{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;align-items:stretch;max-width:700px;margin-bottom:14px}
.ilrow.three{grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.ilcard{margin:0;border:2px solid var(--ink);background:#fff;display:flex;flex-direction:column}
.ilcard.ilif{background:var(--tint)}
.ilsvg{width:100%;height:auto;display:block;background:#F7F9FC;border-bottom:2px solid var(--ink)}
.ilcard figcaption{padding:8px 12px;font:600 17px/1.35 Poppins}
.ilrow.three figcaption{font-size:15px;display:flex;flex-direction:column}
.tagc{display:block;font:600 12px Lexend;color:var(--muted);margin-bottom:2px}
.ilarrow{display:grid;place-items:center}.ilarrow svg{width:36px;height:36px}
.ilvis{margin-top:6px}
.ilreal{display:block;background:var(--ink);color:#fff;font:600 13px Poppins;padding:4px 10px}
.ilnote{margin:0 0 10px;font-weight:500;color:var(--ink)}
/* compare */
.subh{font:700 17px Poppins;margin:18px 0 8px}
.tablewrap{overflow-x:auto}
.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:18px;border:2px solid var(--ink);border-radius:2px;overflow:hidden}
.cmp th,.cmp td{padding:12px 14px;text-align:left;border-bottom:2px solid #E1E5EC}
.cmp thead th{background:var(--ink);color:#fff;font:600 16px Poppins}
.cmp tbody tr:last-child th,.cmp tbody tr:last-child td{border-bottom:0}
.cmp tbody th{font:700 18px Poppins;color:var(--c);white-space:nowrap}
.cmp .pat{font-weight:500}
.dot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:2px;color:#fff;font:800 14px Poppins;margin-right:8px}
.guide{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:g}
.guide li{border:2px solid var(--ink);border-left:10px solid var(--c);border-radius:2px;padding:12px 16px;display:grid;gap:2px;background:#fff}
.gq{font:600 19px Poppins}
.ga{color:var(--c);font-size:18px}
.gno{font-size:15px;color:var(--muted)}
/* runner */
.rtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rtitle{margin:0;font-size:clamp(26px,4vw,36px)}
.rdesc{margin:2px 0 0;color:var(--muted);font-size:17px}
.qnum{margin:0;font:600 16px Poppins}
.segs{display:flex;gap:6px;margin:14px 0 16px}
.seg{flex:1;height:14px;border-radius:2px;background:#fff;border:2px solid var(--ink)}
.seg.ok{background:var(--ok)}.seg.no{background:var(--no)}
.seg.cur{background:var(--gold)}
.q{font-size:clamp(20px,3vw,25px);line-height:1.5;margin:0 0 18px;font-weight:500}
.q.src{border-left:5px solid var(--ink);padding-left:14px}
.blank{display:inline-block;width:4.2em;border-bottom:3px solid var(--ink);vertical-align:-2px;margin:0 3px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:2px;padding:12px 16px;min-height:58px;cursor:pointer;font-size:19px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--ink);background:#F7F8FB;transform:translateY(-1px)}
.opt:disabled{cursor:default}
.ol{flex:none;width:34px;height:34px;border-radius:2px;border:2px solid var(--ink);display:grid;place-items:center;font:700 16px Poppins}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .ol{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt.wrong .ol{background:var(--no);border-color:var(--no);color:#fff}
.opt.chosen{border-color:var(--ink);background:#FFF3CC}
.opt.chosen .ol{background:var(--ink);color:#fff}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.topt{flex-direction:column;justify-content:center;gap:6px;font:700 19px Poppins;border-color:var(--c);border-width:3px;min-height:100px}
.tnum{width:42px;height:42px;border-radius:2px;color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font:800 19px Poppins}
.topt.right{background:var(--okbg);border-color:var(--ok)}
.topt.wrong{background:var(--nobg);border-color:var(--no)}
input.typed,textarea.typed{font:inherit;font-size:20px;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;background:#fff;color:var(--ink)}
input.inl{width:min(12em,70%);min-height:46px;margin:4px 2px}
textarea.rw{width:100%;min-height:90px;resize:vertical;line-height:1.45;margin:6px 0 4px}
.typed.right{border-color:var(--ok);background:var(--okbg)}
.typed.wrong{border-color:var(--no);background:var(--nobg)}
.hintw{color:var(--muted);font-size:.9em}
.startlbl{display:block;font-size:18px;margin-top:4px}
.typedform .row{margin-top:10px}
.hint{color:var(--muted);font-size:17px;margin:0 0 12px;transition:color .2s}
.hint.flash{color:var(--no)}
.errq{line-height:2.3}
.ul{background:none;border:0;border-bottom:3px solid var(--ink);padding:0 3px;margin:0 1px;cursor:pointer;font-size:inherit;font-weight:inherit;border-radius:2px 4px 0 0;display:inline;line-height:1.3}
.ul sub{font:700 13px Poppins;color:var(--muted);margin-left:2px}
.ul:hover:not(:disabled){background:#E8ECF3}
.ul:disabled{cursor:default;color:inherit}
.ul.picked,.ul.chosen{background:#E8ECF3;border-bottom-color:var(--brand)}
.ul.right{background:var(--okbg);border-bottom-color:var(--ok)}
.ul.wrong{background:var(--nobg);border-bottom-color:var(--no)}
#fixArea{margin-top:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{text-align:left;background:#fff;border:3px solid var(--line);border-radius:2px;padding:12px 14px;font-size:18px;cursor:pointer;min-height:60px}
.mi:hover:not(:disabled){border-color:var(--ink)}
.mi.sel{border-color:var(--ink);background:var(--gold);color:var(--ink);font-weight:600}
.mi.locked{border-color:var(--c);border-width:2px;border-left-width:10px;background:#F7F8FA;color:var(--ink);cursor:default;opacity:.9}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fb .fb,#fb>.fb{margin-top:18px}
div.fb.good,div.fb.bad{border:3px solid var(--ink);border-left:12px solid var(--c);background:var(--tint);border-radius:2px;padding:14px 18px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:start;font:400 18px Lexend;color:var(--ink)}
.fb.bad{background:#FFF1EF!important}
.fb .fbface{grid-row:1/span 6}.fb .fbface .iffy{width:62px;height:57px}
.fb>*:not(.fbface){grid-column:2}
.fb>.btn{justify-self:start}
.fbh{display:flex;gap:10px;align-items:center;font:700 20px Poppins;margin:0 0 6px}
.fbc{margin:4px 0;font-size:19px}
.fbn{margin:4px 0;font-size:17px;font-style:italic}
.fbx{margin:6px 0 12px;font-size:18px}
.tpill{display:inline-block;color:#fff;font:600 13px Poppins;border-radius:2px;padding:2px 9px;margin-right:8px;vertical-align:2px}
/* sets */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.setcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:2px;transition:transform .12s;padding:18px 20px;cursor:pointer;min-height:190px}
.setcard:hover{background:#F7F8FB;transform:translateY(-2px)}
.setn{display:inline-block;width:fit-content;background:var(--gold);border:2px solid var(--ink);border-radius:2px;padding:0 10px;color:var(--ink)!important}
.setn{font:600 15px Poppins;color:var(--muted)}
.sett{font:700 22px Poppins;line-height:1.2}
.setd{font-size:16px;color:var(--muted);flex:1}
.setf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.stars{display:inline-flex;gap:3px}
.star{fill:#fff;stroke:var(--ink);stroke-width:1.6}.star.on{fill:var(--gold)}
.donebox{background:#fff;border:3px solid var(--ink);border-radius:2px;padding:26px clamp(18px,4vw,36px)}
.bigscore{display:flex;align-items:baseline;gap:8px;margin:8px 0;font-family:Poppins}
.bigscore b{font-size:72px;line-height:1;font-weight:800}
.bigscore span{font-size:28px;font-weight:600;color:var(--muted)}
.bigscore em{font-style:normal;font-size:24px;font-weight:700;margin-left:12px;border:2px solid var(--ink);border-radius:10px;padding:2px 10px}
.scorerow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.scorerow .iffy{width:110px;height:101px}
.misslist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.misslist li{border-left:6px solid var(--c);background:#F7F8FA;border-radius:0 10px 10px 0;padding:10px 14px;font-size:17px}
.misslist .fix{color:var(--ok);font-weight:500}
/* tests */
.testgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.testcard{background:#fff;border:3px solid var(--ink);border-radius:2px;padding:20px 22px}
.testcard h2{margin:0 0 6px;font-size:28px}
.tparts{margin:0;padding-left:20px;font-size:17px;color:var(--muted)}
.tbest{margin:10px 0 0;font-size:17px}
.timerset{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:2px;padding:14px 18px;width:fit-content;max-width:100%}
.switch{position:relative;width:58px;height:32px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.slider{position:absolute;inset:0;background:#B9C1CE;border-radius:2px;transition:background .15s}
.slider:before{content:"";position:absolute;width:24px;height:24px;left:4px;top:4px;border-radius:1px;background:#fff;transition:transform .15s}
.switch input:checked+.slider{background:var(--ok)}
.switch input:checked+.slider:before{transform:translateX(26px)}
.switch input:focus-visible+.slider{outline:3px solid var(--brand);outline-offset:2px}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tq{margin:0;font:700 22px Poppins}
.tclock{display:flex;align-items:center;gap:12px}
.clock{font:700 26px Poppins;border:3px solid var(--ink);background:var(--gold)!important;border-radius:10px;padding:2px 14px;background:#fff;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.clock.low{background:var(--no);color:#fff;border-color:var(--no)}
.nav30{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin:14px 0}
.nav30 .n{min-height:38px;border:2px solid var(--line);background:#fff;border-radius:2px;font:600 14px Poppins;cursor:pointer;padding:0}
.nav30 .n.filled{background:#FFF3CC;border-color:var(--gold)}
.nav30 .n.cur{border-color:var(--ink);background:var(--ink);color:#fff}
.part{margin:0 0 6px;font:600 16px Poppins;color:var(--muted)}
.tqn{margin:0;font:800 22px Poppins}
.tfoot{margin-top:14px;font-size:16px;color:var(--muted)}
.report{background:#fff;border:3px solid var(--ink);border-radius:2px;padding:26px clamp(18px,4vw,36px)}
.rephead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:3px dashed var(--line);padding-bottom:14px;margin-bottom:16px}
.meta{margin:0;color:var(--muted);font-size:16px}
.report h3{font-size:18px;margin:0 0 10px}
.breakdown{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(150px,280px) 1fr 70px;gap:12px;align-items:center;font-size:17px}
.bname{display:flex;gap:8px;align-items:center}
.bname i{width:26px;height:26px;border-radius:2px;color:#fff;display:grid;place-items:center;font:800 13px Poppins;font-style:normal;flex:none}
.bbar{height:16px;background:#E6EAF0;border-radius:2px;overflow:hidden}
.bbar span{display:block;height:100%;border-radius:2px}
.bnum{font-weight:600;text-align:right}
.advice{margin-top:18px;background:#F7F8FA;border-radius:2px;padding:12px 16px}
.advice p{margin:0}
.advice .btnrow{margin-top:10px}
.retrynote{font-size:18px}
.revlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.revpart{font:700 18px Poppins;margin-top:12px}
.rev{background:#fff;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:2px;padding:12px 16px}
.revq{display:flex;gap:10px;font-size:19px;font-weight:500}
.revq u{text-decoration-thickness:2px;text-underline-offset:4px}
.revq sub{font:700 12px Poppins;color:var(--muted)}
.revn{font:800 17px Poppins;min-width:28px}
.revy,.revr,.revx,.revnote{margin:6px 0 0;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.revr{color:var(--ok)}
.revnote{font-style:italic;color:var(--muted)}
.revy .mark{width:24px;height:24px;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(15,24,41,.55);display:grid;place-items:center;z-index:50;padding:20px}
#modal[hidden]{display:none}
.mbox{background:#fff;border:3px solid var(--ink);border-radius:2px;padding:24px;max-width:440px;width:100%}
.mbox h2{margin:0 0 8px}
.mbox p{margin:0;font-size:18px}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;border:2px solid var(--ink);animation:fall 2.4s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .heroart{justify-self:center;max-width:220px;order:-1}
  .heroart .say{font-size:16px}
  .lineart{display:none}
  .stop{grid-template-columns:56px 1fr;padding:14px 16px 16px 0}
  .stop .btn{grid-column:2;justify-self:start}
  .route:before{left:24px}
  .stop-node{width:40px;height:40px;border-width:6px;font-size:16px}
  .testgrid{grid-template-columns:1fr}
  .nav30{grid-template-columns:repeat(10,1fr)}
  .apptitle{display:none}
}
@media (max-width:560px){
  body{font-size:17px}
  main{padding:18px 14px 30px}
  .head-in{padding:8px 14px}
  .typegrid{grid-template-columns:1fr 1fr}
  .match{grid-template-columns:1fr}
  .mcol+.mcol{border-top:3px dashed var(--line);padding-top:12px}
  .brow{grid-template-columns:1fr 60px}
  .brow .bbar{grid-column:1/-1;grid-row:2}
  .card{padding:18px 16px}
  .examples li{font-size:18px}
  .lhead .iffy{width:60px;height:55px}
  .watch{grid-template-columns:1fr}.watch .iffy{display:none}
  .lrow .iffy{width:42px;height:39px}
  .use{font-size:18px}
  .q{font-size:20px}
  .opt{font-size:17px}
  .bigscore b{font-size:58px}
  #who{max-width:110px}
  .keyidea{grid-template-columns:58px 1fr;gap:10px;padding:12px 14px}.keyidea .iffy{width:58px}.keyidea p{font-size:17px}
  .cmp thead{display:none}.cmp,.cmp tbody,.cmp tr,.cmp th,.cmp td{display:block;width:100%}
  .cmp tr{border-bottom:2px solid var(--ink);padding:8px 0}.cmp tbody tr:last-child{border-bottom:0}
  .cmp th,.cmp td{border:0!important;padding:3px 12px!important}
  .brandlogo{height:48px}
  .ilrow{grid-template-columns:1fr 26px 1fr;gap:4px}.ilarrow svg{width:22px}.ilcard figcaption{font-size:14px;padding:6px 8px}
  .ilrow.three{gap:6px}.ilrow.three figcaption{font-size:13px}
  .nav30{grid-template-columns:repeat(6,1fr)}
  .pager .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.app-head,footer,.btnrow,.pager,#modal{display:none!important}body{background:#fff}}

:root{--ink:#14284B;--coral:#FF6B57;--coral2:#E8503D;--sand:#F3DFC1;--bg:#F6F4F1;--line:#D6D3CE}
body{background:var(--bg)}
.app-head{border-bottom:3px solid var(--ink)}
#homeBtn{background:#fff}
.btn.big{background:var(--coral);border-color:var(--ink);color:var(--ink)}
.btn.big:hover{background:var(--coral2);color:#fff}
.hero{display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:center;margin-bottom:24px}
.eyebrow{margin:0;font:600 16px Poppins;color:var(--coral2)}
.title{font:800 clamp(44px,8vw,80px)/1.02 Poppins;margin:6px 0 10px;letter-spacing:-1.5px}
.title span{display:inline-block;background:var(--coral);color:var(--ink);padding:0 .15em;border:4px solid var(--ink)}
.sub{font-size:19px;color:var(--muted);margin:0 0 16px;max-width:34ch}
.nameform .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.nameform label{display:flex;flex-direction:column;font:600 15px Poppins;gap:4px}
.nameform input{font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--ink);min-height:50px;width:220px;background:#fff}
.nameform input.sm{width:110px}
.hello{font-size:20px;margin:0}
.herobox{background:var(--sand);border:3px solid var(--ink);padding:18px;text-align:center}
.herobox .iffy{width:150px;height:auto}
.herobox p{margin:6px 0 0;font:600 18px Poppins}.herobox b{font-size:30px}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{position:relative;display:flex;flex-direction:column;background:#fff;border:3px solid var(--ink);padding:0;text-align:left;cursor:pointer;transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile .ilsvg{width:100%;height:auto;display:block;background:#FBF8F4;border-bottom:3px solid var(--ink)}
.tnum{position:absolute;left:-3px;top:-3px;background:var(--coral);color:var(--ink);font:800 18px Poppins;width:38px;height:38px;display:grid;place-items:center;border:3px solid var(--ink)}
.tbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.tt{font:700 18px/1.2 Poppins}.td{font-size:14px;color:var(--muted)}
.tf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}.tf em{font-style:normal;color:var(--muted)}
.finalbar{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--ink);color:#fff;border:3px solid var(--ink);padding:20px 24px}
.finalbar h2{margin:0;font-size:28px}.finalbar p{margin:4px 0 0;color:#D8DEEA}.finalbar .fb2 b{color:#fff}
.finalbar .btn.ghost{background:transparent;color:#fff;border-color:#fff}
.finalbar .btnrow{margin:0}
.qwrap.haspic{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.qpic{margin:0;border:2px solid var(--ink);background:#FBF8F4}
.qpic .ilsvg{width:100%;height:auto;display:block}
.q.words{line-height:2.4}
.wd{background:#fff;border:2px solid var(--line);padding:2px 8px;font:inherit;cursor:pointer;margin:2px 0}
.wd:hover:not(:disabled){border-color:var(--ink)}
.wd.right{background:var(--okbg);border-color:var(--ok)}
.wd.commaafter::after{content:",";color:var(--ok);font-weight:800;margin-left:2px}
.wd.wrong{background:var(--nobg);border-color:var(--no)}
.built{min-height:70px;border:3px dashed var(--ink);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FBF8F4}
.built.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.built.wrong{border-style:solid;border-color:var(--no);background:var(--nobg)}
.built .ph{color:var(--muted);font-size:16px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.tile2{font:600 19px Poppins;padding:8px 14px;border:2px solid var(--ink);background:#fff;cursor:pointer;min-height:48px}
.tile2.in{background:var(--sand)}
.tile2.used{border:2px dashed var(--line);background:transparent;min-width:44px;cursor:default}
.tile2:hover:not(:disabled):not(.used){background:#FFE9E4}
.typegrid .tn{width:42px;height:42px;color:#fff;display:grid;place-items:center;font:800 19px Poppins;border:2px solid var(--ink)}
.rtable{width:100%;border-collapse:collapse;margin:10px 0 20px;font-size:17px}
.rtable th,.rtable td{border:2px solid var(--ink);padding:8px 12px;text-align:left}
.rtable th{background:var(--ink);color:#fff;font-family:Poppins}
.rephead{display:flex;gap:18px;align-items:center}
.replogo{height:80px}
.advice{background:var(--sand);padding:10px 14px;font-size:17px}
.small{font-size:13px;color:var(--muted)}
.blank{display:inline-block;width:4em;border-bottom:3px solid var(--ink);margin:0 4px}
.tests{margin-top:26px}
.tests-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.tests-head h2{margin:0;font-size:28px}.tests-head p{margin:2px 0 0;color:var(--muted)}
.tswitch{display:flex;align-items:center;gap:10px;font:600 15px Poppins;cursor:pointer}
.tswitch input{position:absolute;opacity:0;width:1px;height:1px}
.tswitch span{width:52px;height:28px;background:#B9C1CE;border:2px solid var(--ink);position:relative;flex:none}
.tswitch span:before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.tswitch input:checked+span{background:var(--ok)}.tswitch input:checked+span:before{transform:translateX(22px)}
.tswitch input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{border:3px solid var(--ink);background:#fff}
.tcbar{background:var(--tc);color:#fff;font:800 24px Poppins;padding:10px 16px;border-bottom:3px solid var(--ink)}
.tcbody{padding:12px 16px 16px}.tcbody p{margin:0 0 8px;font-size:15px;color:var(--muted);line-height:1.6}.tcbody .tbest{color:var(--ink);font-size:16px}
.tcbody .btnrow{margin-top:8px}.tcbody .btn{min-height:46px;font-size:16px;padding:8px 14px}
.testrun .tbar{border-top:8px solid var(--tc);padding-top:10px}
.testrun .kick{color:var(--tc)}
.nav30 .n.cur{background:var(--tc)!important;border-color:var(--ink)!important;color:#fff}
.nav30 .n.nok{background:var(--okbg);border-color:var(--ok)}
.nav30 .n.nno{background:var(--nobg);border-color:var(--no)}
.qcard form .btn{margin-top:6px}
.donebox[style*="--tc"]{border-top:10px solid var(--tc)}
@media (max-width:900px){.map{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.tgrid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.herobox{display:flex;align-items:center;gap:14px;text-align:left}.herobox .iffy{width:80px}.qwrap.haspic{grid-template-columns:1fr}.qpic{max-width:360px}}
@media (max-width:560px){.map{gap:10px}.tt{font-size:15px}.td{font-size:12px}.tile2{font-size:17px;padding:6px 10px}.finalbar h2{font-size:22px}}
@media print{.noprint,.crumbs{display:none!important}.report{border:0}}
</style>
</head>

function markNav() { const it = TT.T.items[TT.idx]; const b = document.querySelectorAll('.nav30 .n')[TT.idx]; if (b) b.classList.toggle('filled', TT.ans[it.id] !== undefined && TT.ans[it.id] !== ''); const c = $('#ansCount'); if (c) c.textContent = answered(); }
function gradeTest(T, ans) {
  const per = {}; let score = 0;
  const rows = T.items.map(it => { const a = ans[it.id]; let ok = false, note = '';
    if (it.kind === 'mc') ok = a === it.ci; else if (it.kind === 'errorL') ok = a === it.w; else { const r = checkTyped(a || '', it); ok = !!r.ok; note = r.note || ''; }
    per[it.t] = per[it.t] || { ok: 0, n: 0 }; per[it.t].n++; if (ok) { per[it.t].ok++; score++; } return { ok, note }; });
  return { score, per, rows };
}
function submitTest(auto) {
  if (timerId) { clearInterval(timerId); timerId = null; }
  const g = gradeTest(TT.T, TT.ans), prev = S.tests[TT.T.id];
  S.tests[TT.T.id] = { best: Math.max(prev ? prev.best : 0, g.score), last: { ans: TT.ans, score: g.score, date: new Date().toISOString(), time: Math.round((Date.now() - TT.start) / 1000) } }; save();
  if (g.score >= 24) afterFns.push(() => confetti(90));
  go('testDone', { id: TT.T.id, auto });
}
function testDone() {
  const T = TESTS.find(x => x.id === view.id), rec = S.tests[T.id].last, g = gradeTest(T, rec.ans), pct = Math.round(g.score / 30 * 100);
  const weak = ['zero', 'first', 'second', 'third', 'mixed'].filter(t => g.per[t] && g.per[t].ok / g.per[t].n < 0.8);
  const wrongN = g.rows.filter(r => !r.ok).length;
  return '<nav class="crumbs"><button class="link" data-act="home">Home</button><span>/</span><b>' + T.name + '</b></nav><section class="donebox" style="--tc:' + T.color + '"><p class="kick">' + T.name + ' result' + (view.auto ? ' (time is up)' : '') + '</p>' +
    '<div class="scorerow"><div><p class="bigscore"><b>' + g.score + '</b><span>/ 30</span><em>' + pct + '%</em></p><p class="meta">' + (S.name ? esc(S.name) + '. ' : '') + new Date(rec.date).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) + (rec.time ? '. Time used: ' + Math.floor(rec.time / 60) + ' min ' + rec.time % 60 + ' s' : '') + '</p></div>' + iffy(pct >= 80 ? 'wow' : pct >= 50 ? 'happy' : 'think') + '</div>' +
    '<h3>Score by type</h3>' + breakdown(g.per) + '<p class="advice">' + (weak.length ? 'Review next: <b>' + weak.map(t => TYPES[t].name).join(', ') + '</b>' : 'Excellent! You scored 80% or more in every type.') + '</p>' +
    (view.retryRes ? '<p class="meta">Retry practice: <b>' + view.retryRes.filter(x => x.ok).length + ' / ' + view.retryRes.length + '</b> correct this time.</p>' : '') +
    '<div class="btnrow"><button class="btn" data-act="testReview" data-arg="' + T.id + '">See all answers</button>' + (wrongN ? '<button class="btn ghost" data-act="retryTest" data-arg="' + T.id + '">Retry wrong answers (' + wrongN + ')</button>' : '') + '<button class="btn ghost" data-act="home">Back to the map</button></div></section>';
}
function testReview() {
  const T = TESTS.find(x => x.id === view.id), rec = S.tests[T.id].last, g = gradeTest(T, rec.ans); let part = '';
  let h = '<nav class="crumbs"><button class="link" data-act="home">Home</button><span>/</span><b>' + T.name + ' answers</b></nav><h1 class="pagetitle">' + T.name + ': Answers</h1><p class="lead">' + g.score + ' / 30 correct.</p><ol class="revlist">';
  T.items.forEach((it, i) => {
    if (it.part !== part) { part = it.part; h += '<li class="revpart">' + TPARTS[part] + '</li>'; }
    const row = g.rows[i], a = rec.ans[it.id], TY = TYPES[it.t]; let q, yours, right;
    if (it.kind === 'mc') { q = fmt(it.q); yours = a === undefined ? '(no answer)' : L(a) + '. ' + it.opts[a]; right = L(it.ci) + '. ' + it.opts[it.ci]; }
    else if (it.kind === 'errorL') { let k = 0; q = it.s.replace(/\{([^}]+)\}|([^{}]+)/g, (mm, u, p) => p ? esc(p) : '<u>' + esc(u) + '</u><sub>' + L(k++) + '</sub>'); yours = a === undefined ? '(no answer)' : 'Part ' + L(a); right = 'Part ' + L(it.w) + '. ' + it.full; }
    else { q = fmt(it.q); yours = a || '(no answer)'; right = it.ans[0].replace('does not', 'doesn’t').replace('do not', 'don’t'); }
    h += '<li class="rev" style="--c:' + TY.color + '"><div class="revq"><span class="revn">' + (i + 1) + '</span><span>' + q + '</span></div><p class="revy"><span class="mark ' + (row.ok ? 'yes' : 'no') + '">' + (row.ok ? '✓' : '✗') + '</span>Your answer: ' + esc(yours) + '</p>' +
      (row.ok ? '' : '<p class="revr">Correct answer: <b>' + esc(right) + '</b></p>') + (row.note ? '<p class="revnote">' + esc(row.note) + '</p>' : '') + '<p class="revx"><span class="tpill" style="background:' + TY.color + '">' + TY.short + '</span>' + esc(it.ex) + '</p></li>';
  });
  return h + '</ol><div class="btnrow"><button class="btn" data-act="testResult" data-arg="' + T.id + '">Back to score</button><button class="btn ghost" data-act="home">Back to the map</button></div>';
}
Object.assign(ACT, {
  startTest: a => startTest(a),
  tPick: a => { const it = TT.T.items[TT.idx]; if (TT.lock[it.id]) return; TT.ans[it.id] = +a; TT.lock[it.id] = true; render(); },
  tNext: () => { if (TT.idx < 29) { TT.idx++; render(); } }, tPrev: () => { if (TT.idx > 0) { TT.idx--; render(); } }, jump: a => { TT.idx = +a; render(); },
  toggleClock: () => { TT.timer = !TT.timer; S.timer = TT.timer; save(); if (TT.timer) startClock(); else if (timerId) { clearInterval(timerId); timerId = null; } render(); },
  askSubmit: () => { const n = 30 - answered(); modal('<h2>Finish the test?</h2><p>' + (n ? 'You have <b>' + n + '</b> unanswered question' + (n > 1 ? 's' : '') + '.' : 'You answered all 30 questions.') + '</p><div class="btnrow"><button class="btn" data-act="doSubmit">Yes, finish</button><button class="btn ghost" data-act="closeModal">Keep working</button></div>'); },
  doSubmit: () => { closeModal(); submitTest(false); },
  testResult: a => go('testDone', { id: a }), testReview: a => go('testReview', { id: a }),
  retryTest: a => {
    const T = TESTS.find(x => x.id === a), g = gradeTest(T, S.tests[a].last.ans);
    const items = T.items.filter((_, i) => !g.rows[i].ok).map(it => Object.assign({}, it, { _step: 0, _built: [] }));
    view = { name: 'round', title: T.name + ': Retry Wrong Answers', desc: 'Practice mode: you get feedback after each answer.', kick: 'Retry' }; render();
    R = { mode: 'testretry', testId: a, items, idx: 0, res: [], answered: false }; drawQ(); window.scrollTo(0, 0);
  }
});
const _home = ACT.home;
ACT.home = () => { if (view.name === 'test') { modal('<h2>Leave the test?</h2><p>Your answers for this test will not be saved.</p><div class="btnrow"><button class="btn danger" data-act="leaveRun">Leave test</button><button class="btn ghost" data-act="closeModal">Stay</button></div>'); return; } _home(); };
document.addEventListener('change', e => { if (e.target.dataset.change === 'timer') { S.timer = e.target.checked; save(); render(); } });

const _draw = drawQ; drawQ = function () { _draw(); if (R.items[R.idx].kind === 'build') drawBuild(); };
window.__RV = { ROUNDS, ALL, TESTS, gradeTest, get TT() { return TT; }, checkTyped, buildNorm, get R() { return R; }, get S() { return S; } };
render();
})();

</script>

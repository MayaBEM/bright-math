ish for six years, and she still enjoys it.`,`Although the test was difficult, most students managed to finish it on time.`,`Neither of the two answers were correct, so the teacher gave the class another chance.`],correctAnswer:3,explanationEnglish:`"Neither of" is followed by a singular verb in formal, correct English, because "neither" itself is the (singular) subject: "Neither of the two answers was correct." Using "were" is a common error caused by the nearby plural noun "answers."`,explanationThai:`"Neither of" ตามด้วยกริยาเอกพจน์ในภาษาอังกฤษที่ถูกต้องแบบทางการ เพราะ "neither" เองคือประธาน (เอกพจน์) ที่ถูกต้องคือ "Neither of the two answers was correct." การใช้ "were" เป็นความผิดพลาดที่พบบ่อย เกิดจากคำนามพหูพจน์ที่อยู่ใกล้ ("answers") ทำให้เข้าใจผิด`,keyClue:`"neither of" + singular verb`,optionExplanations:[`No error — past perfect "had already started" correctly shows an action completed before another past action.`,`No error — present perfect continuous "has been studying" is correctly used with "for six years."`,`No error — "although" correctly introduces a contrast clause, and the tense/structure is accurate.`,`Correct choice (contains the error) — "were" should be "was" because "neither" takes a singular verb.`],grammarRule:`"Neither" (and "either," "each," "every") is grammatically singular and takes a singular verb, even when followed by "of + plural noun."`,hints:[`Check subject-verb agreement carefully in each sentence, especially near words like "neither" or "each."`,`"Neither," "either," and "each" are singular subjects, even when the noun right after "of" is plural.`,`The sentence with "although" correctly balances a contrast with no verb agreement issues, so it can be ruled out.`],hint3EliminateIndex:2,tags:[`error-recognition`,`subject-verb-agreement`,`quantifiers`]},{id:`MT5-Q24`,testId:`mock-test-5`,section:`Functional Language and Error Recognition`,order:24,skill:`Arranging jumbled whole sentences into a logical paragraph`,skillTag:`functional`,difficulty:`Entrance Challenge`,instruction:`Choose the order that arranges the sentences into the most logical short paragraph.`,stimulus:{type:`none`},question:`(1) As a result, she decided to volunteer at the local animal shelter every weekend.
(2) At first, she was only allowed to clean cages, which she found disappointing.
(3) Mint had always loved animals, but she had never had the chance to work with them closely.
(4) However, after a few months of hard work, the staff let her help care for the sick puppies.

Which order is correct?`,options:[`3, 1, 2, 4`,`1, 3, 2, 4`,`3, 2, 1, 4`,`4, 2, 1, 3`],correctAnswer:0,explanationEnglish:`Sentence 3 introduces Mint and her situation (background). Sentence 1 gives the result of that background ("As a result"). Sentence 2 describes what happened when she started volunteering. Sentence 4 shows a contrast to sentence 2 using "However." The logical chain is 3 → 1 → 2 → 4.`,explanationThai:`ประโยคที่ 3 แนะนำมิ้นท์และสถานการณ์ของเธอ (ข้อมูลพื้นหลัง) ประโยคที่ 1 บอกผลลัพธ์จากพื้นหลังนั้น ("As a result") ประโยคที่ 2 บรรยายสิ่งที่เกิดขึ้นเมื่อเธอเริ่มอาสาสมัคร ประโยคที่ 4 แสดงความขัดแย้งกับประโยคที่ 2 โดยใช้ "However" ลำดับที่ถูกต้องตามเหตุผลคือ 3 → 1 → 2 → 4`,keyClue:`"As a result" (1) and "However" (4) are logical connectors`,vocabulary:[{term:`volunteer`,meaningEnglish:`to offer to do something without being paid or forced`,meaningThai:`อาสาสมัคร, อาสาทำโดยไม่มีค่าตอบแทน`}],optionExplanations:[`Correct — background (3), result (1), initial disappointment (2), contrasting improvement (4) forms a logical chain.`,`Wrong — starting with "As a result" (1) before introducing Mint's background (3) leaves the result with no cause yet.`,`Wrong — placing sentence 2 before 1 breaks the cause-and-effect link that "As a result" signals from sentence 3.`,`Wrong — starting with sentence 4 ("However...") makes no sense with nothing earlier to contrast against.`],hints:[`Look for connector words like "As a result" and "However" — they show how sentences relate to their neighbours.`,`A logical paragraph usually starts with background information before showing results or contrasts.`,`Any order that starts with "However" (4) cannot be correct, since there is nothing yet to contrast — that option is out.`],hint3EliminateIndex:3,tags:[`sentence-arrangement`,`cohesion`,`logical-order`]},{id:`MT5-Q25`,testId:`mock-test-5`,section:`Functional Language and Error Recognition`,order:25,skill:`Matching two sentences with equivalent meaning`,skillTag:`functional`,d

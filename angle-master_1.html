orresponding angles are different sizes.","AB and CD can never meet, because two straight lines cross at most once.","The two marked angles must total 180°, because they both lie along the line PQ."],correctAnswer:1,hint1:"Both marked angles sit in exactly the same position at their own crossing point.",hint2:"Angles in matching positions at two different crossings are called corresponding angles.",hint3:"Compare 65° with 73° and recall what corresponding angles do when — and only when — the two lines are parallel.",explanation:[{text:"Both marked angles lie below their own line and to the right of the transversal PQ, so they form a pair of corresponding angles.",highlight:["m65","m73"]},{text:"Corresponding angles are equal if, and only if, the two lines are parallel. Here they differ by 8°.",math:"73° − 65° = 8°",highlight:["m65","m73"]},{text:"So AB and CD are not parallel; extended far enough to the left they would meet. Looking parallel is never a reason, and because the two marked angles are at different points there is nothing forcing them to total 180°."}]},{id:"s6q11",set:6,topic:"parallel",skills:["parallel","straight-line"],difficulty:4,type:"error",prompt:"What mistake has Marcus made?",given:"AB and CD are parallel and EF crosses both of them. Marcus wrote: “x = 74°, because alternate angles are equal.”",diagram:{kind:"lines",lines:[{id:"p1",through:[0,75],dir:0,arrows:1,ends:["A","B"]},{id:"p2",through:[0,-75],dir:0,arrows:1,ends:["C","D"]},{id:"t",through:[0,0],dir:74,ends:["E","F"]}],marks:[{at:["p1","t"],sector:2,key:"g74"},{at:["p2","t"],sector:1,label:"x"}]},options:["Both angles lie on the same side of EF, so they are co-interior angles totalling 180°, not a pair of equal alternate angles.","Alternate angles are only equal when the transversal meets the two parallel lines at 90°.","He should have worked out 360° − 74°, because all the angles meet at one point.","AB and CD are not really parallel, so no parallel-line rule can be used in this diagram."],correctAnswer:0,hint1:"Alternate angles make a Z shape; co-interior angles make a C or U shape. Which shape do these two make?",hint2:"Both marked angles are between the parallel lines, and both are on the left of EF, so they are on the same side of the transversal.",hint3:"Angles in that position total 180°, so the calculation Marcus needed was 180° − 74°.",explanation:[{text:"Both angles lie between AB and CD, and both lie to the left of EF. An alternate pair has to be on opposite sides of the transversal, so this is not an alternate pair.",highlight:["g74","x"]},{text:"Angles in this position are co-interior, and between parallel lines a co-interior pair totals 180°.",math:["x = 180° − 74°","x = 106°"],highlight:["x"]},{text:"Marcus used a correct rule on the wrong pair. The angle that really is 74° is the one on the other side of EF, just above CD."}]},{id:"s6q12",set:6,topic:"quadrilateral",skills:["quadrilateral","construction"],difficulty:4,type:"error",prompt:"What is wrong with Nadia’s reasoning?",given:"ABCD is a kite. Nadia wrote: “x = 132°, because opposite angles of a kite are equal.”",diagram:{kind:"quad",angles:[{deg:132,key:"ka"},{deg:87,key:"kb"},{deg:54,label:"x"},{deg:87,key:"kd"}],shape:"kite",rotation:0,vertexLabels:["A","B","C","D"],sideTicks:[1,2,2,1]},options:["Only one pair of opposite angles in a kite is equal — the pair either side of the axis of symmetry — so x has to come from the 360° total instead.","All four angles of a kite are equal, so each one of them is 90°.","She should have used 180° as the total of the four angles of the kite.","The two 87° angles cannot really be equal, because a kite has no line of symmetry."],correctAnswer:0,hint1:"Check which pair of angles a kite forces to be equal, and which pair it says nothing about.",hint2:"The axis of symmetry runs through A and C, so it is the angles at B and D that have to match, not the ones at A and C.",hint3:"Use the fact that the four angles total 360°: work out 360° − 132° − 87° − 87°.",explanation:[{text:"The ticks show AB = AD and CB = CD, so the kite is symmetrical about the line AC. Reflecting in AC swaps B with D, which is exactly why the angles at B and D are equal.",highlight:["kb","kd"]},{text:"A and C both sit on the axis, so nothing forces them to match. The angle at C has to come from the angle sum instead.",math:["x = 360° − 132° − 87° − 87°","x = 54°"],highlight:["ka","x"]},{text:"Nadia has borrowed a parallelogram rule and used it on a kite. In a kite the equal pair is the one either side of the axis, and the two angles on the axis are usually different sizes."}]},{id:"s6q13",set:6,topic:"quadrilateral",skills:["quadrilateral"],difficulty:4,type:"error",prompt:"What has gone wrong in Elin’s working?",given:"ABCDEF is a hexagon. Elin wrote: “A hexagon has six sides, so its angles total 6 × 180° = 1080°. That gives x = 1080° − 610° = 470°.”",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:182,y:0},{name:"C",x:198.30644,y:155.145416},{name:"D",x:127.483922,y:294.142433},{name:"E",x:-26.595459,y:269.738657},{name:"F",x:-108.427203,y:138.780491}],segments:[{a:"A",b:"B"},{a:"B",b:"C"},{a:"C",b:"D"},{a:"D",b:"E"},{a:"E",b:"F"},{a:"F",b:"A"}],arcs:[{at:"A",from:"B",to:"F",key:"ha"},{at:"B",from:"C",to:"A",key:"hb"},{at:"C",from:"D",to:"B",key:"hc"},{at:"D",from:"E",to:"C",key:"hd"},{at:"E",from:"F",to:"D",key:"he"},{at:"F",from:"A",to:"E",label:"x"}]},options:["A hexagon splits into only four triangles, so its angles total (6 − 2) × 180° = 720°, not 1080°.","The angles of every closed shape total 360°, so she should have subtracted from 360°.","She has added the five given angles wrongly; they do not come to 610°.","A hexagon splits into five triangles, so the correct total is 900°."],correctAnswer:0,hint1:"Her arithmetic is fine — the trouble is the total she started from.",hint2:"Pick one corner of the hexagon and join it to every corner it is not already joined to. Count the triangles that appear.",hint3:"Use (n − 2) × 180° with n = 6 to get the correct total, then take 610° away from it.",explanation:[{text:"Joining one vertex of a hexagon to the three vertices it is not already joined to cuts the shape into four triangles, not six.",highlight:["ha"]},{text:"So the angle sum comes from (n − 2) × 180°, not from n × 180°.",math:"(6 − 2) × 180° = 720°"},{text:"The five given angles do come to 128° + 96° + 147° + 108° + 131° = 610°, so subtract that from the right total.",math:["x = 720° − 610°","x = 110°"],highlight:["x"]},{text:"Elin’s answer of 470° should have set off an alarm on its own: her diagram shows x as an ordinary angle, comfortably under 180°."}]},{id:"s6q14",set:6,topic:"intersecting",skills:["intersecting","parallel"],difficulty:4,type:"oddone",prompt:"In three of these diagrams the two marked angles must always be equal. Which diagram is the odd one out?",given:"In diagrams B, C and D the lines carrying chevrons are parallel.",diagram:{kind:"group",items:[{tag:"A",diagram:{kind:"lines",lines:[{id:"a1",through:[0,0],dir:0},{id:"a2",through:[0,0],dir:55}],marks:[{at:["a1","a2"],sector:0,label:"p"},{at:["a1","a2"],sector:2,label:"q"}]}},{tag:"B",diagram:{kind:"lines",lines:[{id:"b1",through:[0,55],dir:0,arrows:1},{id:"b2",through:[0,-55],dir:0,arrows:1},{id:"bt",through:[0,0],dir:63}],marks:[{at:["b1","bt"],sector:3,label:"p"},{at:["b2","bt"],sector:0,label:"q"}]}},{tag:"C",diagram:{kind:"lines",lines:[{id:"c1",through:[0,55],dir:0,arrows:1},{id:"c2",through:[0,-55],dir:0,arrows:1},{id:"ct",through:[0,0],dir:41}],marks:[{at:["c1","ct"],sector:3,label:"p"},{at:["c2","ct"],sector:3,label:"q"}]}},{tag:"D",diagram:{kind:"lines",lines:[{id:"d1",through:[0,55],dir:0,arrows:1},{id:"d2",through:[0,-55],dir:0,arrows:1},{id:"dt",through:[0,0],dir:52}],marks:[{at:["d1","dt"],sector:2,label:"p"},{at:["d2","dt"],sector:0,label:"q"}]}}]},options:["A","B","C","D"],correctAnswer:1,hint1:"Name the relationship in each picture: vertically opposite, corresponding, alternate or co-interior.",hint2:"Three of those four relationships guarantee equal angles; the fourth guarantees a total of 180° instead.",hint3:"Hunt for the diagram in which both marked angles are inside the parallel lines and on the same side of the crossing line.",explanation:[{text:"In A the two lines simply cross, and p and q face each other across the crossing point, so they are vertically opposite and equal."},{text:"In C the two angles are in matching positions at the two crossings, so they are corresponding angles. In D they are inside the parallels but on opposite sides of the crossing line, so they are alternate angles. Both pairs are equal."},{text:"In B both angles are inside the parallel lines and on the same side of the crossing line, so they are co-interior. A co-interior pair totals 180°, so the two angles are only equal in the special case when both happen to be 90°.",math:"p + q = 180°"},{text:"B is therefore the odd one out."}]},{id:"s6q15",set:6,topic:"quadrilateral",skills:["quadrilateral"],difficulty:4,type:"oddone",prompt:"In three of these quadrilaterals a pair of opposite angles is equal. Which one is the odd one out?",given:"All four angles are printed on each shape. Opposite angles are the two that do not share a side.",diagram:{kind:"group",items:[{tag:"A",diagram:{kind:"quad",angles:[{deg:84},{deg:121},{deg:84},{deg:71}],shape:"generic",rotation:4}},{tag:"B",diagram:{kind:"quad",angles:[{deg:106},{deg:93},{deg:68},{deg:93}],shape:"kite",rotation:0}},{tag:"C",diagram:{kind:"quad",angles:[{deg:77},{deg:138},{deg:62},{deg:83}],shape:"generic",rotation:-6}},{tag:"D",diagram:{kind:"quad",angles:[{deg:115},{deg:65},{deg:115},{deg:65}],shape:"parallelogram",rotation:5}}]},options:["A","B","C","D"],correctAnswer:2,hint1:"Ignore what each shape looks like and read the four numbers printed round it instead.",hint2:"Opposite angles are the first and the third you meet going round, and the second and the fourth.",hint3:"For each shape compare both pairs of opposite angles, and find the shape where neither pair matches.",explanation:[{text:"In A the two 84° angles sit opposite each other, so A is not the odd one out."},{text:"In B the two 93° angles lie opposite each other, either side of the kite’s axis. In D both pairs match, because a parallelogram has equal opposite angles: 115° with 115° and 65° with 65°."},{text:"In C the opposite pairs are 77° with 62° and 138° with 83°. Neither pair matches, so C is the odd one out.",math:["77° ≠ 62°","138° ≠ 83°"]},{text:"Notice that all four shapes have angles totalling 360°, so the angle sum on its own could never separate them."}]},{id:"s6q16",set:6,topic:"parallel",skills:["parallel","quadrilateral"],difficulty:4,type:"truefalse",prompt:"True or false: the angle marked x is 118°.",given:"PQRS is a quadrilateral in which the sides PQ and SR are parallel.",diagram:{kind:"custom",points:[{name:"P",x:0,y:0},{name:"Q",x:210,y:0},{name:"R",x:188.049023,y:208.849598},{name:"S",x:-111.047301,y:208.849598}],segments:[{a:"P",b:"Q",arrows:1},{a:"Q",b:"R"},{a:"S",b:"R",arrows:1},{a:"S",b:"P"}],arcs:[{at:"P",from:"Q",to:"S",key:"gp"},{at:"Q",from:"R",to:"P",key:"gq"},{at:"S",from:"P",to:"R",label:"x"}]},options:["True","False"],correctAnswer:1,reasonPrompt:"Which reason explains your answer?",reasonOptions:["PS crosses the two parallel sides, so the angles at P and S are co-interior and total 180°, making x = 62°.","The angles at P and S are alternate angles, so they are equal and x really is 118°.","PQRS is a parallelogram, so opposite angles are equal and x matches the angle at P.","The four angles total 360°, and the other three angles are each 118°."],reasonAnswer:0,hint1:"The side PS joins the two parallel sides, so it behaves exactly like a transversal.",hint2:"The angle at P and angle x are both inside the shape, at the two ends of PS, on the same side of it.",hint3:"Angles in that position total 180°, so compare 118° with 180° − 118°.",explanation:[{text:"PQ and SR are parallel and PS crosses both of them, so the angle at P and the angle at S are co-interior.",highlight:["gp","x"]},{text:"Between parallel lines a co-interior pair totals 180°, so x is the supplement of 118°, not a copy of it.",math:["x = 180° − 118°","x = 62°"],highlight:["x"]},{text:"The statement is therefore false. Only one pair of sides is parallel here, so PQRS is a trapezium and there is no rule making its opposite angles equal — the 84° angle at Q does not match x either.",highlight:["gq"]}]},{id:"s6q17",set:6,topic:"construction",skills:["construction","quadrilateral"],difficulty:4,type:"truefalse",prompt:"True or false: the diagonal AC cuts the 104° angle at A into two angles of 52°.",given:"ABCD has been drawn with compasses so that all four sides are exactly the same length. The diagonal AC is dashed.",diagram:{kind:"quad",angles:[{deg:104,key:"ra"},{deg:76,key:"rb"},{deg:104,key:"rc"},{deg:76,key:"rd"}],shape:"rhombus",rotation:12,vertexLabels:["A","B","C","D"],diagonals:[[0,2]],sideTicks:[1,1,1,1]},options:["True","False"],correctAnswer:0,reasonPrompt:"Which reason explains your answer?",reasonOptions:["AB = AD and CB = CD, so AC is a line of symmetry of the shape and must split the angle at A into two equal halves.","The diagonals of every quadrilateral cut its corner angles exactly in half.","AC is the same length as a side, so triangle ABC is equilateral and all its angles are 60°.","The angles at A and B total 180°, and half of 104° happens to be 52°."],reasonAnswer:0,hint1:"Equal compass radii mean all four sides are equal, and that is a much stronger fact than it first looks.",hint2:"Fold the shape along AC: B lands exactly on D, because AB = AD and CB = CD.",hint3:"A fold that maps one half onto the other must split the angle at A into two equal parts, so work out 104° ÷ 2.",explanation:[{text:"All four sides are equal, so AB = AD and CB = CD. That makes AC an axis of symmetry: reflecting the shape in AC swaps B and D while leaving A and C where they are.",highlight:["ra","rc"]},{text:"The reflection maps angle BAC onto angle DAC, so those two parts of the 104° angle are equal.",math:["angle BAC = 104° ÷ 2","angle BAC = 52°"],highlight:["ra"]},{text:"So the statement is true. Be careful though: this works only because the four sides are equal. In a general quadrilateral a diagonal does not bisect the angle it is drawn from.",highlight:["rb","rd"]}]},{id:"s6q18",set:6,topic:"parallel",skills:["parallel","intersecting","straight-line"],difficulty:5,type:"multi",prompt:"Work out the sizes of the three angles a, b and c.",given:"AB and CD are parallel. EF and GH are two more straight lines; each of them crosses CD, and they also cross each other.",diagram:{kind:"lines",lines:[{id:"p",through:[0,85],dir:0,arrows:1,ends:["A","B"]},{id:"q",through:[0,-85],dir:0,arrows:1,ends:["C","D"]},{id:"t",through:[0,0],dir:116,ends:["E","F"]},{id:"r",through:[140,0],dir:34,ends:["G","H"]}],marks:[{at:["p","t"],sector:0,key:"g116"},{at:["p","r"],sector:0,key:"g34"},{at:["q","t"],sector:1,label:"a"},{at:["q","r"],sector:0,label:"b"},{at:["t","r"],sector:1,label:"c"}]},answerLabels:["a","b","c"],correctAnswer:[64,34,82],hint1:"Carry each angle down from AB to CD first, using the fact that those two lines are parallel.",hint2:"The 116° angle has a corresponding partner at CD, and a sits next to that partner on the line CD; b is corresponding to the 34° angle.",hint3:"Once a and b are known, notice that a, b and c are the three angles of the triangle below CD and use the angle sum.",explanation:[{text:"AB and CD are parallel, so the 116° angle at AB and the angle in the same position at CD are corresponding and equal. Angle a sits next to that 116° angle on the straight line CD.",math:["a = 180° − 116°","a = 64°"],highlight:["g116","a"]},{text:"The 34° angle at AB and angle b are also a corresponding pair, so b needs no calculation at all.",math:"b = 34°",highlight:["g34","b"]},{text:"Angles a, b and c are the three angles of the triangle cut off below CD, so they total 180°.",math:["c = 180° − 64° − 34°","c = 82°"],highlight:["c"]},{text:"Check at the crossing of EF and GH: the neighbouring angle there is 180° − 82° = 98°, and 82° + 98° + 82° + 98° = 360°, one full turn."}]},{id:"s6q19",set:6,topic:"intersecting",skills:["intersecting","quadrilateral","straight-line"],difficulty:5,type:"multi",prompt:"Calculate the sizes of angles a, b and c.",given:"ABCD is a quadrilateral. Its diagonals AC and BD are dashed, and they cross at M.",diagram:{kind:"custom",points:[{name:"A",x:-187.618091,y:0},{name:"B",x:11.766025,y:134.486284},{name:"C",x:172.188715,y:0},{name:"D",x:-15.295833,y:-174.83217},{name:"M",x:0,y:0,labelDir:300}],segments:[{a:"A",b:"B"},{a:"B",b:"C"},{a:"C",b:"D"},{a:"D",b:"A"},{a:"A",b:"M",dashed:!0,muted:!0},{a:"M",b:"C",dashed:!0,muted:!0},{a:"B",b:"M",dashed:!0,muted:!0},{a:"M",b:"D",dashed:!0,muted:!0}],arcs:[{at:"A",from:"B",to:"C",key:"g34"},{at:"B",from:"A",to:"D",key:"g51"},{at:"C",from:"A",to:"D",key:"g43"},{at:"M",from:"A",to:"B",label:"a"},{at:"M",from:"B",to:"C",label:"b"},{at:"D",from:"B",to:"C",label:"c"}]},answerLabels:["a","b","c"],correctAnswer:[95,85,42],hint1:"The two diagonals cut the quadrilateral into four triangles; start with the one that already has two angles marked.",hint2:"Triangle ABM has the 34° angle at A and the 51° angle at B, and angle a completes it.",hint3:"Get a from that triangle, get b from the straight line AMC, then use triangle CMD, remembering that angle CMD faces a across M.",explanation:[{text:"M lies on AC and on BD, so in triangle ABM the angle at A is 34° and the angle at B is 51°. The three angles of a triangle total 180°.",math:["a = 180° − 34° − 51°","a = 95°"],highlight:["g34","g51","a"]},{text:"A, M and C lie on the straight diagonal AC, so angles a and b sit side by side on a straight line.",math:["b = 180° − 95°","b = 85°"],highlight:["a","b"]},{text:"Angle CMD faces angle a across the crossing point, so it is vertically opposite a and

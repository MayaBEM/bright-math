<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle Lab – Everything About Angles</title>
<style>
:root{
  /* Lime & Lavender (default): pastel playful, white cards with ink outlines and solid offset shadows */
  --bg:#E6F2A8; --bg2:#D9EA8F; --surface:#FFFFFF; --ink:#1C1C28; --muted:#5B5F6E;
  --accent:#B9AEF9; --accent-ink:#1C1C28; --accent2:#FF86B0; --line:#1C1C28; --soft:#FFF5B8; --soft2:#EDE9FF;
  --ok:#2E9E5B; --bad:#E0477B; --warn:#E8A317;
  --pairF:#FF6F9C; --pairZ:#6C5CE7; --pairC:#2EB872; --c3:#E8A317; --c4:#7B5EA7;
  --proFill:rgba(255,245,184,.8); --proInk:#1C1C28; --proOuter:#1C1C28; --proInner:#E0477B; --proEdge:#1C1C28;
  --grid:rgba(28,28,40,.05);
  --radius:18px; --shadow:4px 4px 0 var(--line); --bshadow:3px 3px 0 var(--line); --bw:2px;
  --font:"Avenir Next","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --head:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
html[data-theme="peach"]{
  --bg:#FFE7D3; --bg2:#FFD9BC; --surface:#FFFFFF; --ink:#1C1C28; --muted:#5B5F6E;
  --accent:#8BE0C7; --accent-ink:#1C1C28; --accent2:#FF8A65; --line:#1C1C28; --soft:#FFF4C2; --soft2:#E3F7F0;
  --ok:#2E9E5B; --bad:#E0477B; --warn:#E8A317;
  --pairF:#FF7A59; --pairZ:#3E8ED0; --pairC:#2EB872; --c3:#E8A317; --c4:#7B5EA7;
  --proFill:rgba(255,244,194,.8); --proInk:#1C1C28; --proOuter:#1C1C28; --proInner:#D9480F; --proEdge:#1C1C28;
  --grid:rgba(28,28,40,.05);
}
html[data-theme="blueprint"]{
  --bg:#0E2138; --bg2:#0A1A2C; --surface:#163453; --ink:#EEF4FA; --muted:#A7B9CC;
  --accent:#F4B52E; --accent-ink:#1A1A1A; --accent2:#5CC8F5; --line:#2C4F74; --soft:#1C3D5F; --soft2:#1C3D5F;
  --ok:#5FD39A; --bad:#FF7A6B; --warn:#F4B52E;
  --pairF:#F4B52E; --pairZ:#5CC8F5; --pairC:#7EE08A; --c3:#FF9F7A; --c4:#C9A6FF;
  --proFill:rgba(92,200,245,.22); --proInk:#EEF4FA; --proOuter:#EEF4FA; --proInner:#F4B52E; --proEdge:#5CC8F5;
  --grid:rgba(255,255,255,.07);
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 12px 30px rgba(0,0,0,.35); --bshadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.45}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0 0 .4em}
h1{font-size:2.4rem;letter-spacing:-.01em} h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:.35em 0 .7em}
.muted{color:var(--muted)}
.hidden{display:none!important}
body:not(.th) .th{display:none!important}
header.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:1.15rem;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:38px;height:38px}
nav.main{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.navbtn{background:transparent;border:2px solid transparent;color:var(--ink);padding:8px 14px;border-radius:12px;font-weight:700}
.navbtn:hover{border-color:var(--line);background:var(--soft)}
.navbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--line)}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 16px 40px}
footer{padding:18px;text-align:center;color:var(--muted);font-size:.95rem;border-top:2px solid var(--line);background:var(--surface)}
footer b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:var(--bw) solid var(--line);border-radius:14px;padding:12px 22px;font-weight:700;font-size:1.05rem;min-height:50px;box-shadow:var(--bshadow);transition:transform .08s,box-shadow .08s,filter .12s}
.btn:hover{filter:brightness(1.04)} .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.secondary{background:var(--surface);color:var(--ink)}
.btn.secondary:hover{background:var(--soft)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none}
.btn.ghost.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.small{padding:8px 14px;min-height:40px;font-size:.95rem;border-radius:10px}
.btn.big{font-size:1.2rem;padding:16px 28px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--soft);color:var(--ink);border:2px solid var(--line)}
.pill.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.thbtn{font-size:.85rem;padding:5px 11px;min-height:34px;border-radius:8px;letter-spacing:.05em}
/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;margin-bottom:28px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.hero .kicker{display:inline-block;font-weight:700;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:4px 12px;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
.hero svg{width:100%;max-width:440px;display:block;margin:0 auto}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 26px}
@media(max-width:700px){.themes{grid-template-columns:1fr}}
.theme-card{border:3px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.theme-card.on{box-shadow:var(--shadow);background:var(--soft2)}
.theme-card .sw{display:flex;gap:6px;margin-bottom:8px}
.theme-card .sw i{display:block;width:28px;height:28px;border-radius:7px;border:1px solid rgba(0,0,0,.15)}
.theme-card b{display:block;font-size:1.05rem} .theme-card small{color:var(--muted)}
.modlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.mod:hover{box-shadow:var(--bshadow);transform:translate(-1px,-1px)}
.mod .num{width:40px;height:40px;border-radius:12px;background:var(--soft2);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none}
.mod.done .num{background:var(--ok);color:#fff}
.mod b{display:block;font-size:1rem;line-height:1.2} .mod small{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0 26px}
.quick .card{padding:16px 18px;cursor:pointer}
.quick .card:hover{border-color:var(--accent2)}
.quick .card b{display:block;font-size:1.1rem;margin-bottom:4px}
/* stage / figures */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media(max-width:980px){.lab{grid-template-columns:1fr}}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-top:2px solid var(--line);background:var(--soft);align-items:center}
.toolbar .sep{width:2px;height:28px;background:var(--line);margin:0 4px}
.fig{width:100%;height:auto;display:block}
.fig text{font-family:var(--font);font-weight:700;fill:var(--ink)}
.fig .ln{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.fig .thin{stroke:var(--ink);stroke-width:2;fill:none}
.fig .arc{fill:none;stroke:var(--ink);stroke-width:2.5}
.fig .lbl{font-size:20px;text-anchor:middle;dominant-baseline:middle}
.fig .vlab{font-size:20px;text-anchor:middle;dominant-baseline:middle}
.fig .pt{fill:var(--ink)}
.fig .arrow{fill:var(--ink)}
.fig .hl{stroke-width:14;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.35}
.fig .hlarc{opacity:.35;stroke:none}
.fig .handle{fill:var(--accent2);stroke:var(--line);stroke-width:2.5;cursor:grab}
.fig .handle2{fill:var(--accent);stroke:var(--line);stroke-width:2.5;cursor:grab}
.anim .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:drawln 1.2s ease forwards}
.anim .fadein{opacity:0;animation:fadein .6s ease forwards;animation-delay:.9s}
.anim .fadein2{opacity:0;animation:fadein .6s ease forwards;animation-delay:1.5s}
.anim .sweep{transform-box:fill-box;transform-origin:center;animation:fadein .8s ease forwards}
@keyframes drawln{to{stroke-dashoffset:0}} @keyframes fadein{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.anim .draw,.anim .fadein,.anim .fadein2{animation:none;stroke-dashoffset:0;opacity:1}}
.panel h3{margin-bottom:8px}
.panel .ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.num-in{width:120px;font-size:1.4rem;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center}
.num-in:focus{outline:3px solid var(--accent2);border-color:var(--accent2)}
.txt-in{font-size:1.05rem;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--soft);font-size:1rem;line-height:1.4}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.fb b.t{display:block;font-size:1.1rem;margin-bottom:4px}
.th{display:block;margin-top:8px;padding:8px 10px;border-left:4px solid var(--accent2);background:var(--soft);border-radius:0 8px 8px 0;font-size:.98rem;font-weight:400}
.steps{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.steps i{display:block;height:10px;flex:1;min-width:14px;border-radius:5px;background:var(--line)}
.steps i.done{background:var(--ok)} .steps i.cur{background:var(--accent)} .steps i.wrong{background:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tab{flex:1;min-width:120px;padding:12px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:8px}
.tab .k{width:30px;height:30px;border-radius:9px;background:var(--soft);border:1.5px solid var(--line);display:grid;place-items:center;font-size:.9rem}
.tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--line);box-shadow:var(--bshadow)}
.tab.active .k{background:var(--surface);color:var(--ink)}
.tab.done .k{background:var(--ok);color:#fff}
.reasons,.choices{display:grid;gap:8px;margin:8px 0}
.reason,.choice{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:1rem;line-height:1.3}
.reason input,.choice input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.reason.on,.choice.on{background:var(--soft2);box-shadow:var(--bshadow)}
.reason.right,.choice.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.reason.wrongpick,.choice.wrongpick{border-color:var(--bad)}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hintbox{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft);border:2px dashed var(--line);font-size:1rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem;margin:8px 0}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--c)}
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.95rem;margin-top:8px}
.values div{padding:6px 8px;border-radius:10px;background:var(--soft);border:1.5px solid var(--line);text-align:center}
.values div b{display:block;font-size:1.15rem}
.result{text-align:center;padding:30px 18px}
.result .score{font-size:3.4rem;font-weight:800;font-family:var(--head);line-height:1}
.review{margin-top:18px;text-align:left;display:grid;gap:8px}
.review .item{padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:.98rem}
.review .item.ok{border-color:var(--ok)} .review .item.bad{border-color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
table.rep{width:100%;border-collapse:collapse;font-size:1rem;margin:10px 0}
table.rep th,table.rep td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:left}
table.rep th{font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gloss .term{padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.gloss .term b{display:block;font-size:1.05rem}
.gloss .term small{display:block;color:var(--muted);font-size:.9rem}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rules .rule{padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);display:flex;gap:12px;align-items:center}
.rules .rule svg{width:96px;height:72px;flex:none}
.rules .rule b{display:block}
.kbd{display:inline-block;padding:1px 7px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font-size:.9em}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
@media(max-width:640px){
  header.top{flex-wrap:wrap;padding:10px 12px;gap:8px}
  .brand{font-size:1.05rem}
  nav.main{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .thbtn{min-height:40px;padding:4px}
  .navbtn{padding:8px 4px;font-size:.9rem;text-align:center;border-color:var(--line)}
  html,body{font-size:17px} h1{font-size:2rem} h2{font-size:1.4rem}
  .tab{min-width:0;padding:10px 6px;font-size:.95rem}
}
@media print{
  header.top,footer,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:14px}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#999}
}
</style>
</head>

<header class="top">
  <button class="brand" data-go="home" aria-label="Angle Lab home">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 32 L34 32 L10 10 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 32 A12 12 0 0 0 14.5 22.5" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="6" cy="32" r="3" fill="var(--accent)"/></svg>
    <span>Angle Lab</span>

  <nav class="main">
    <button class="navbtn" data-go="home">Home</button>

  </nav>
</header>
<main id="app"></main>

<script>
'use strict';
/* ===================== core utilities ===================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const NS = 'http://www.w3.org/2000/svg';
const DEG = Math.PI/180;
const norm360 = a => { a %= 360; if (a < 0) a += 360; return a; };
const norm180 = a => { a = norm360(a); return a > 180 ? a - 360 : a; };
const angDiff = (a,b) => { const d = norm360(a-b); return d > 180 ? 360-d : d; };
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const el = (tag, attrs={}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const polar = (cx, cy, r, a) => ({x: cx + r*Math.cos(a*DEG), y: cy - r*Math.sin(a*DEG)});   // math angle (anticlockwise)
const dirOf = (from, to) => norm360(Math.atan2(-(to.y-from.y), to.x-from.x)/DEG);           // math angle from→to
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
const fmt = n => (Math.round(n*10)/10) + '°';
/* angle colours (same meaning everywhere) */
const COL = { blue:'#3B82C4', pink:'#E2558A', orange:'#F08A24', green:'#3C9D5A', purple:'#8B5CF6', teal:'#1FA3A3', x:'#F08A24' };
const TYPE_COL = { acute:COL.blue, right:COL.green, obtuse:COL.orange, straight:COL.pink, reflex:COL.purple, full:COL.teal };
const PAIR_COLOR = { corresponding:'var(--pairF)', alternate:'var(--pairZ)', cointerior:'var(--pairC)', vertical:COL.purple };

/* ---------- settings & progress (local only) ---------- */
const DEFAULTS = { theme:'lime', helper:false, th:false, name:'', cls:'' };
const store = {
  get(){ try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('anglelab.settings')||'{}')); } catch(e){ return {...DEFAULTS}; } },
  set(obj){ const s = Object.assign(store.get(), obj); try { localStorage.setItem('anglelab.settings', JSON.stringify(s)); } catch(e){} return s; },
  prog(){ try { return JSON.parse(localStorage.getItem('anglelab.progress')||'{}'); } catch(e){ return {}; } },
  setProg(obj){ const p = Object.assign(store.prog(), obj); try { localStorage.setItem('anglelab.progress', JSON.stringify(p)); } catch(e){} return p; },
  reset(){ try { localStorage.removeItem('anglelab.settings'); localStorage.removeItem('anglelab.progress'); } catch(e){} }
};
let settings = store.get();
if (!['lime','peach','blueprint'].includes(settings.theme)) settings = store.set({theme:'lime'});
document.documentElement.dataset.theme = settings.theme;
document.body.classList.toggle('th', !!settings.th);
const thSpan = th => th ? `<span class="th">${th}</span>` : '';

/* ---------- SVG coordinate + drag helpers ---------- */
function svgPoint(svg, ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function makeDraggable(svg, target, onMove, onEnd){
  let active = null;
  target.addEventListener('pointerdown', ev => { ev.preventDefault(); active = ev.pointerId; try { svg.setPointerCapture(ev.pointerId); } catch(e){} });
  svg.addEventListener('pointermove', ev => { if (active !== ev.pointerId) return; onMove(svgPoint(svg, ev), ev); });
  const end = ev => { if (active !== ev.pointerId) return; active = null; onEnd && onEnd(svgPoint(svg, ev)); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}

/* ===================== PROTRACTOR ===================== */
class Protractor {
  constructor(svg, opts={}){
    this.svg = svg; this.R = 230; this.x = opts.x||380; this.y = opts.y||480; this.rot = 0;
    this.onChange = opts.onChange || (()=>{}); this.enabled = true;
    this.g = el('g', {class:'protractor'}, svg);
    this.build(); this.bind(); this.update();
  }
  build(){
    const R = this.R, g = this.g, Rin = R - 100;
    const c = a => Math.cos(a*DEG), s = a => Math.sin(a*DEG);

/* ---------- angle figure for the protractor canvas (screen angles) ---------- */
function drawAngleFigure(g, V, dirA, dirC, len, opts={}){
  const A = {x: V.x + len*Math.cos(dirA*DEG), y: V.y + len*Math.sin(dirA*DEG)};
  const C = {x: V.x + len*Math.cos(dirC*DEG), y: V.y + len*Math.sin(dirC*DEG)};
  if (opts.arc !== false && !opts.noArmC){
    const cw = norm360(dirC - dirA); const useCW = opts.reflex ? cw > 180 : cw <= 180;
    const sweep = useCW ? cw : 360 - cw; const a2 = useCW ? dirA + cw : dirA - (360-cw);

    const p1 = {x: V.x + r*Math.cos(dirA*DEG), y: V.y + r*Math.sin(dirA*DEG)}, p2 = {x: V.x + r*Math.cos(a2*DEG), y: V.y + r*Math.sin(a2*DEG)};
    const col = opts.color || COL.blue;
    el('path', {d:`M ${V.x} ${V.y} L ${p1.x} ${p1.y} A ${r} ${r} 0 ${sweep>180?1:0} ${useCW?1:0} ${p2.x} ${p2.y} Z`, fill:col, opacity:.35}, g);
    el('path', {d:`M ${p1.x} ${p1.y} A ${r} ${r} 0 ${sweep>180?1:0} ${useCW?1:0} ${p2.x} ${p2.y}`, fill:'none', stroke:col, 'stroke-width':3}, g);
  }
  el('line', {x1:V.x, y1:V.y, x2:A.x, y2:A.y, class:'ln'}, g);
  if (!opts.noArmC) el('line', {x1:V.x, y1:V.y, x2:C.x, y2:C.y, class:'ln'}, g);
  el('circle', {cx:V.x, cy:V.y, r:5, class:'pt'}, g);
  el('circle', {cx:A.x, cy:A.y, r:4, class:'pt'}, g);
  if (!opts.noArmC) el('circle', {cx:C.x, cy:C.y, r:4, class:'pt'}, g);

}
function makeMeasureTask(opts={}){
  const reflex = opts.reflex ?? (Math.random() < 0.3);
  let m = rnd(14, 166); if (m%10===0) m += rnd(1,4);
  if (reflex) m = rnd(25, 150);

  const base = {x: 380 - (minx+maxx)/2, y: 300 - (miny+maxy)/2};

  for (let i=0;i<40;i++){ const cand = {x: base.x + rnd(-120,120), y: base.y + rnd(-50,50)}; if ([cand,{x:cand.x+oa.x,y:cand.y+oa.y},{x:cand.x+oc.x,y:cand.y+oc.y}].every(p => p.x>36 && p.x<724 && p.y>36 && p.y<564)){ V = cand; break; } }

function makeDrawTask(opts={}){

}

function simpleAngleFig(svg, size, letters, opts={}){
  const a1 = rnd(0,359), a2 = a1 + size;
  const reflex = size > 180; let len = 165;
  const extent = L => { const e = [a1, a2].map(a => polar(0,0, L+26, a)); return {minx:Math.min(0,...e.map(p=>p.x)), maxx:Math.max(0,...e.map(p=>p.x)), miny:Math.min(0,...e.map(p=>p.y)), maxy:Math.max(0,...e.map(p=>p.y))}; };
  let ex = extent(len); const h = ex.maxy-ex.miny, w = ex.maxx-ex.minx;
  if (h > 330 || w > 570){ len = Math.floor(len * Math.min(330/h, 570/w)); ex = extent(len); }
  const O = {x: 300-(ex.minx+ex.maxx)/2, y: 180-(ex.miny+ex.maxy)/2};
  const r = opts.r || (size < 25 ? 70 : size < 40 ? 55 : 40);
  const cfg = {O, rays:[{a:a1, label:letters[0], len},{a:a2, label:letters[2], len}], angles:[{from:a1, to:a2, color: opts.color || (opts.typeColor ? TYPE_COL[typeOf(size).k] : COL.blue), label: opts.label, r}], Olabel: letters[1]};
  rayFigure(svg, cfg);
  return {a1, a2, reflex, O};
}

      return {type:'choice', prompt:`Which coloured angle is <b>${names[which]}</b>?`, fig:svg=>rayFigure(svg,{O:Oc,rays:[{a:base,label:R,len:lenP},{a:base+s1,label:Q,len:lenP},{a:base+s1+s2,label:P,len:lenP}],angles:[{from:base+s1,to:base+s1+s2,color:COL.blue,label:map.small1,r:58,lr:82,lrFixed:true},{from:base,to:base+s1,color:COL.pink,label:map.small2,r:58,lr:82,lrFixed:true},{from:base,to:base+s1+s2,color:COL.orange,r:112,fillOpacity:0,label:map.big,lr:134,lrFixed:true,labelAt:0.22}],Olabel:O}),
        options:['a','b','c'].map(l=>({k:l,text:'Angle '+l})), answer:map[which],
        explain: which==='big' ? `${names[which]} goes from arm ${O}${P} all the way to arm ${O}${R}, so it is the large orange angle <b>${map[which]}</b>.` : `${names[which]} is between arm ${O}${names[which][1]} and arm ${O}${names[which][3]}: angle <b>${map[which]}</b>.`,
        th:`ดูตัวอักษรแรกและตัวสุดท้าย แล้วหามุมที่อยู่ระหว่างแขนสองข้างนั้น`, hints:[{en:'The first and last letters name the two arms.',th:'ตัวอักษรแรกและตัวสุดท้ายคือชื่อแขนสองข้าง'},{en:`Find arm ${O}${names[which][1]} and arm ${O}${names[which][3]}; the angle is between them.`}]};
    };
    ['vertex','vertex','name','name','arms','arms','pick','pick','pick','same'].forEach(k => qs.push(Object.assign(mk(k), {mod:1})));

  }
});

}

  rayFigure(svg, {O:{x:300,y:185}, rays, angles, Olabel:opts.Olabel, OlabelDir:opts.OlabelDir, anim:opts.anim});
}

/* ===================== QUIZ RUNNER ===================== */
/* qs: question objects. opts: {title, hints:boolean, timer:boolean, onFinish(score, results, elapsed)} */
function runQuiz(container, qs, opts){
  let i = 0, score = 0, answered = false; const results = []; const t0 = Date.now(); let timerId = null; let stage = null;
  container.innerHTML = `<div class="steps" id="qsteps"></div><div class="lab"><div id="qstage"><div class="stage"><svg id="qSvg" class="fig" viewBox="0 0 600 360"></svg></div></div>
    <div class="card panel"><div class="row" style="justify-content:space-between"><span class="pill accent">${opts.title}</span><span class="pill" id="qnum"></span>${opts.timer ? '<span class="pill timer" id="qtimer">0:00</span>' : ''}</div>
    <h3 id="qprompt" style="margin-top:10px"></h3><div id="qans"></div><div id="qreasons" class="reasons"></div>
    ${opts.hints ? '<div class="hints" id="qhints"></div><div id="hintbox"></div>' : ''}
    <div id="qfb"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="qcheck">Check answer</button><button class="btn secondary hidden" id="qnext">Next ▶</button></div></div></div>`;
  if (opts.timer){ timerId = setInterval(() => { const s = Math.floor((Date.now()-t0)/1000); const e = $('#qtimer'); if (e) e.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; else clearInterval(timerId); }, 1000); }
  const steps = () => { $('#qsteps').innerHTML = qs.map((_,k)=>`<i class="${results[k]===true?'done':results[k]===false?'wrong':k===i?'cur':''}"></i>`).join(''); };
  function show(){
    const q = qs[i]; answered = false; steps();
    $('#qnum').textContent = `Question ${i+1} of ${qs.length}`;
    $('#qprompt').innerHTML = q.prompt;
    const host = $('#qstage');
    if (q.type === 'measure' || q.type === 'draw'){
      host.innerHTML = ''; stage = new ProtractorStage(host); const task = q.type==='measure' ? makeMeasureTask({reflex:q.reflex}) : makeDrawTask({reflex:q.reflex}); q.task = task; stage.setTask(task);
      $('#qprompt').innerHTML = q.type==='measure' ? `Measure <b>∠ABC</b>.${task.reflex ? ' It is a <b>reflex</b> angle: measure the smaller angle and subtract from 360°.' : ''}` : `Draw <b>∠ABC = ${task.target}°</b>.${task.reflex ? ` Reflex: draw 360° − ${task.target}° = ${360-task.target}°; the reflex angle is on the other side.` : ''} Arm BA is given.`;
      $('#qans').innerHTML = q.type==='measure' ? `<div class="ans"><label>∠ABC =</label><input class="num-in" id="qx" type="number" inputmode="numeric"><span>°</span></div>` : `<p class="muted" style="font-size:.95rem">Place the protractor, switch to <b>Mark &amp; draw</b>, tap a dot, drag from B through it, then press Check.</p>`;
    } else {
      stage = null; host.innerHTML = q.fig ? '<div class="stage"><svg id="qSvg" class="fig" viewBox="0 0 600 360"></svg></div>' : '<div class="card" style="min-height:120px;display:grid;place-items:center;color:var(--muted)">No diagram – read the question.</div>';
      if (q.fig) q.fig($('#qSvg'));
      if (q.type==='yesno') $('#qans').innerHTML = `<div class="ans"><button class="btn ghost" data-yn="yes">Yes, parallel</button><button class="btn ghost" data-yn="no">No, not parallel</button></div>`;
      else if (q.type==='number') $('#qans').innerHTML = `<div class="ans"><label>x =</label><input class="num-in" id="qx" type="number" inputmode="numeric"><span>°</span></div>`;
      else $('#qans').innerHTML = `<div class="choices">${q.options.map(o => `<label class="choice"><input type="radio" name="choice" value="${o.k}"><span>${o.text}</span></label>`).join('')}</div>`;
    }
    $('#qreasons').innerHTML = q.reasonOpts ? `<div style="font-weight:700;margin-top:4px">Reason:</div>` + q.reasonOpts.map(k => `<label class="reason"><input type="radio" name="reason" value="${k}"><span>${REASONS[k].en}${thSpan(REASONS[k].th)}</span></label>`).join('') : '';
    $$('[data-yn]').forEach(b => b.onclick = () => $$('[data-yn]').forEach(x => x.classList.toggle('on', x===b)));
    $$('.reason input, .choice input').forEach(r => r.onchange = () => $$('.reason, .choice').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)));
    if (opts.hints){ const hb = $('#qhints'); hb.innerHTML = (q.hints||[]).map((h,n) => `<button class="btn small ghost" data-h="${n+1}" ${n>0?'disabled':''}>Hint ${n+1}${n===0?': where to look':n===1?': the rule':': working'}</button>`).join(''); $('#hintbox').innerHTML=''; $$('[data-h]').forEach(b => b.onclick = () => { const n = +b.dataset.h; b.classList.add('on'); b.disabled = true; const nx = $(`[data-h="${n+1}"]`); if (nx) nx.disabled = false; $('#hintbox').innerHTML += `<div class="hintbox"><b>Hint ${n}:</b> ${q.hints[n-1].en}${thSpan(q.hints[n-1].th)}</div>`; }); }
    $('#qfb').innerHTML=''; $('#qnext').classList.add('hidden'); $('#qcheck').classList.remove('hidden'); $('#qcheck').textContent = q.type==='draw' ? 'Check my angle' : 'Check answer';
    const x = $('#qx'); if (x){ x.onkeydown = e => { if (e.key==='Enter') check(); }; }
  }
  function check(){
    if (answered) return; const q = qs[i];
    const reason = ($('input[name=reason]:checked')||{}).value || null;
    let ans, ansOK, feedbackBody = '';
    if (q.type==='measure'){ const r = stage.checkMeasure($('#qx').value); if (r.pending){ $('#qfb').innerHTML = `<div class="fb warn">${r.body}</div>`; return; } ansOK = r.ok; ans = Number($('#qx').value); feedbackBody = `<b class="t">${r.title}</b><div>${r.body}</div>${thSpan(r.th)}`; q.answer = q.task.value; q.explainText = `∠ABC = ${q.task.value}°`; }
    else if (q.type==='draw'){ const r = stage.checkDraw(); if (r.pending){ $('#qfb').innerHTML = `<div class="fb warn">${r.body}</div>`; return; } ansOK = r.ok; ans = r.title; feedbackBody = `<b class="t">${r.title}</b><div>${r.body}</div>`; q.answer = q.task.target; q.explainText = `Draw ${q.task.target}°`; }
    else {
      if (q.type==='yesno'){ const b = $('[data-yn].on'); ans = b ? b.dataset.yn : null; if (!ans){ $('#qfb').innerHTML = `<div class="fb warn">Choose Yes or No first.</div>`; return; } }
      else if (q.type==='number'){ const v = $('#qx').value; if (v===''){ $('#qfb').innerHTML = `<div class="fb warn">Type a value for x first.</div>`; return; } ans = Number(v); }
      else { const c = $('input[name=choice]:checked'); if (!c){ $('#qfb').innerHTML = `<div class="fb warn">Choose an answer first.</div>`; return; } ans = c.value; }
      if (q.reasonOpts && !reason){ $('#qfb').innerHTML = `<div class="fb warn">Choose a reason too.</div>`; return; }
      ansOK = String(ans) === String(q.answer);
    }
    answered = true;
    const reasonOK = !q.reasonOpts || reason === q.reasonKey;
    const ok = ansOK && reasonOK; if (ok) score++;
    results[i] = ok; q.result = ok; q.given = ans; steps();
    $$('.reason').forEach(l => { const v = l.querySelector('input').value; l.classList.toggle('right', v===q.reasonKey); l.classList.toggle('wrongpick', v===reason && !reasonOK); l.querySelector('input').disabled = true; });
    $$('.choice').forEach(l => { const v = l.querySelector('input').value; l.classList.toggle('right', v===String(q.answer)); l.classList.toggle('wrongpick', v===String(ans) && !ansOK); l.querySelector('input').disabled = true; });
    $$('[data-yn]').forEach(b => b.disabled = true); if ($('#qx')) $('#qx').disabled = true;
    if (q.type==='measure' || q.type==='draw'){ $('#qfb').innerHTML = `<div class="fb ${ok?'ok':'bad'}">${feedbackBody}</div>`; }
    else {
      const answerLine = q.type==='yesno' ? (q.answer==='yes' ? 'Yes, the lines are parallel' : 'No, not parallel') : q.type==='number' ? `x = ${q.answer}°` : q.options.find(o=>o.k===String(q.answer)).text;
      const why = ok ? [] : (q.diagnose ? q.diagnose(ans, reason) : []);
      if (!ok && q.reasonOpts && reason && reason !== q.reasonKey && !why.length) why.push(`The reason is “${REASONS[q.reasonKey].en}”.`);
      $('#qfb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b class="t">${ok ? 'Correct!' : ansOK ? 'Value right, reason wrong' : (q.reasonOpts && reasonOK) ? 'Reason right, value wrong' : 'Not correct'}</b>${why.map(w=>`<div>• ${w}</div>`).join('')}<div style="margin-top:6px"><b>Answer: ${answerLine}</b>${q.reasonOpts ? ' — ' + REASONS[q.reasonKey].en : ''}</div><div style="margin-top:4px">${q.explain||''}</div>${thSpan(q.th || (q.reasonKey ? REASONS[q.reasonKey].th : ''))}</div>`;
      if (q.figAfter && $('#qSvg')) q.figAfter($('#qSvg'));
    }
    $('#qcheck').classList.add('hidden'); $('#qnext').classList.remove('hidden'); $('#qnext').textContent = i===qs.length-1 ? 'See results ▶' : 'Next ▶';
    $('#qnext').focus();
  }
  $('#qcheck').onclick = check;
  $('#qnext').onclick = () => { if (i<qs.length-1){ i++; show(); } else { if (timerId) clearInterval(timerId); opts.onFinish(score, results, Math.floor((Date.now()-t0)/1000)); } };
  show();
  window.__quiz = { get q(){ return qs[i]; }, get i(){ return i; }, qs, check, next:()=>$('#qnext').click(), setX:v=>{ $('#qx').value=v; }, setYN:v=>$(`[data-yn="${v}"]`).click(), setChoice:k=>{ const r=$(`input[name=choice][value="${k}"]`); r.checked=true; r.onchange(); }, setReason:k=>{ const r=$(`input[name=reason][value="${k}"]`); r.checked=true; r.onchange(); }, hint:n=>$(`[data-h="${n}"]`)?.click(), get score(){return score;}, get stage(){ return stage; } };
  return { stop(){ if (timerId) clearInterval(timerId); } };
}
function reviewList(qs){

}

    body.innerHTML = `<div class="card" style="max-width:720px"><span class="pill accent">Quiz</span><h3 style="margin-top:8px">${m.title} – 10 questions</h3><p>New random questions every time. Three hints are available on each question; the answer and explanation appear as soon as you check. ${p ? `<br>Best score: <b>${p.best}/10</b> · Last: ${p.last}/10` : ''}</p><button class="btn big" id="startQuiz">Start the quiz</button></div>`;
    $('#startQuiz').onclick = () => { const qs = m.quiz(); quiz = runQuiz(body, qs, {title:`Module ${m.id} quiz`, hints:true, onFinish:(score)=>{ const prev = store.prog()['quiz'+m.id]; store.setProg({['quiz'+m.id]:{best:Math.max(score, prev?.best||0), last:score, date:new Date().toISOString()}}); markTabs();
      body.innerHTML = `<div class="card result"><div class="pill ${score>=8?'ok':''}">${score>=8?'Great work':'Keep practising'}</div><div class="score">${score}/10</div><p style="font-size:1.1rem">${score>=8?'You know this topic well.':score>=5?'Good start. Look at the questions you missed, then try again.':'Go back to Learn and Explore, then try again.'}</p><div class="row noprint" style="justify-content:center"><button class="btn secondary" id="again">Try again</button>${m.id<10?`<button class="btn" data-go="module" data-arg="${m.id+1}">Next module ▶</button>`:`<button class="btn" data-go="challenge">Take the Challenge ▶</button>`}</div>${reviewList(qs)}</div>`;
      $('#again').onclick = quizTab; }}); };
  }
  render();
  window.__m = { setTab:(t)=>{ tab=t; render(); }, module:m, startQuiz:()=>$('#startQuiz')?.click() };
  return { destroy(){ if (quiz) quiz.stop(); delete window.__m; delete window.__quiz; delete window.__stage; delete window.__explore; } };
};

/* ---------- CHALLENGE ---------- */
function challengeSet(){
  const take = (id, n) => { const m = MODULES.find(x=>x.id===id); let pool = m.quiz(); const out=[]; while (out.length<n){ if (!pool.length) pool = m.quiz(); out.push(pool.shift()); } return out; };
  const qs = [...take(1,2), ...take(2,2), ...take(3,2), ...take(4,1), ...take(5,3), ...take(6,2), ...take(7,4), ...take(8,3), ...take(9,2), ...take(10,4)];
  return shuffle(qs);
}
SCREENS.challenge = () => {
  let quiz = null; const p = store.prog().challenge;
  app.innerHTML = `<div class="card" style="max-width:760px"><span class="pill accent">Challenge</span><h3 style="margin-top:8px">End-of-course Challenge – 25 questions</h3><p>Mixed questions from all 10 modules, including measuring and drawing with the protractor. <b>No hints.</b> You get the answer and the explanation after each question, and a full review at the end. The clock shows how long you take.</p>${p ? `<p>Best: <b>${p.best}/25</b> · Last: ${p.last}/25 (${p.date.slice(0,10)})</p>` : ''}${thSpan('ข้อสอบรวมทุกเรื่อง 25 ข้อ ไม่มีคำใบ้ ตอบแล้วเห็นเฉลยและคำอธิบายทันที')}<button class="btn big" id="startC">Start the Challenge</button></div>`;
  $('#startC').onclick = () => { const qs = challengeSet(); quiz = runQuiz(app, qs, {title:'Challenge', hints:false, timer:true, onFinish:(score, results, elapsed) => {
    const perMod = {}; qs.forEach(q => { perMod[q.mod] = perMod[q.mod] || {n:0, ok:0}; perMod[q.mod].n++; if (q.result) perMod[q.mod].ok++; });
    const prev = store.prog().challenge; store.setProg({challenge:{best:Math.max(score, prev?.best||0), last:score, date:new Date().toISOString(), elapsed, perMod}});
    const weak = Object.keys(perMod).filter(k => perMod[k].ok < perMod[k].n).map(k => MODULES.find(m=>m.id===+k).title);
    app.innerHTML = `<div class="card result"><div class="pill ${score>=20?'ok':''}">${score>=20?'Excellent':score>=15?'Good':'Keep going'}</div><div class="score">${score}/25</div><p style="font-size:1.1rem">Time: ${Math.floor(elapsed/60)} min ${elapsed%60} s · ${Math.round(score/25*100)}%</p>${weak.length ? `<p><b>Review:</b> ${weak.join(' · ')}</p>` : '<p>No weak topics. Well done!</p>'}<div class="row noprint" style="justify-content:center"><button class="btn secondary" data-go="challenge">Try again</button><button class="btn" data-go="report">See My Report ▶</button></div>${reviewList(qs)}</div>`; }}); };
  return { destroy(){ if (quiz) quiz.stop(); delete window.__quiz; } };
};

/* ---------- REPORT ---------- */
SCREENS.report = () => {
  const p = store.prog();
  const rows = MODULES.map(m => { const q = p['quiz'+m.id]; const c = p.challenge?.perMod?.[m.id]; return {m, q, c}; });
  const weak = rows.filter(r => !r.q || r.q.best < 8 || (r.c && r.c.ok < r.c.n)).map(r => r.m.title);
  app.innerHTML = `<div class="card" id="reportCard" style="max-width:860px;margin:0 auto"><div class="row" style="justify-content:space-between"><div><div class="kicker" style="font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem">Bright EngMath · Angle Lab</div><h2 style="margin:4px 0">My Report</h2></div><div class="muted">${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div></div>
    <div class="row" style="margin:10px 0 16px"><label style="flex:1;min-width:200px">Name<input class="txt-in" id="repName" value="${settings.name||''}" placeholder="Your name"></label><label style="flex:1;min-width:140px">Class<input class="txt-in" id="repCls" value="${settings.cls||''}" placeholder="e.g. 7/2"></label></div>
    <table class="rep"><thead><tr><th>#</th><th>Module</th><th>Quiz best</th><th>Challenge</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.m.id}</td><td>${r.m.title}</td><td>${r.q ? `<b>${r.q.best}/10</b>${r.q.best>=8?' ✓':''}` : '—'}</td><td>${r.c ? `${r.c.ok}/${r.c.n}` : '—'}</td></tr>`).join('')}</tbody></table>
    <div class="row" style="justify-content:space-between;margin-top:10px"><div><b>Challenge:</b> ${p.challenge ? `${p.challenge.last}/25 (best ${p.challenge.best}/25) · ${Math.floor(p.challenge.elapsed/60)} min` : 'not taken yet'}</div><div><b>Quizzes passed (8+):</b> ${rows.filter(r=>r.q&&r.q.best>=8).length}/10</div></div>
    <div class="fb" style="margin-top:14px"><b>Topics to review:</b> ${weak.length ? weak.join(' · ') : 'none – everything is at 8/10 or better'}</div>
    <div class="row noprint" style="margin-top:16px"><button class="btn" id="printBtn">Print / Save as PDF</button><button class="btn ghost" id="resetBtn">Reset all progress</button></div></div>`;
  $('#repName').oninput = e => settings = store.set({name:e.target.value}); $('#repCls').oninput = e => settings = store.set({cls:e.target.value});
  $('#printBtn').onclick = () => window.print();
  $('#resetBtn').onclick = () => { if (confirm('Reset all progress on this device?')){ store.reset(); settings = store.get(); document.documentElement.dataset.theme = settings.theme; toast('Progress reset'); go('home'); } };
};

/* ---------- GLOSSARY + RULES ---------- */
const RULES = [
  {t:'Acute angle', r:'< 90°', c:COL.blue, f:g=>{ angleMark(g,{x:30,y:56},0,45,{color:COL.blue,r:22}); ray(g,30,56,0,60); ray(g,30,56,45,60);} },
  {t:'Right angle', r:'= 90°', c:COL.green, f:g=>{ angleMark(g,{x:30,y:60},0,90,{color:COL.green,r:22}); ray(g,30,60,0,60); ray(g,30,60,90,52);} },
  {t:'Obtuse angle', r:'90° < θ < 180°', c:COL.orange, f:g=>{ angleMark(g,{x:48,y:58},0,135,{color:COL.orange,r:22}); ray(g,48,58,0,46); ray(g,48,58,135,50);} },
  {t:'Straight angle', r:'= 180°', c:COL.pink, f:g=>{ angleMark(g,{x:48,y:50},0,180,{color:COL.pink,r:20}); ray(g,48,50,0,44); ray(g,48,50,180,44);} },
  {t:'Reflex angle', r:'180° < θ < 360°', c:COL.purple, f:g=>{ angleMark(g,{x:48,y:40},0,250,{color:COL.purple,r:22}); ray(g,48,40,0,44); ray(g,48,40,250,30);} },
  {t:'Full turn', r:'= 360°', c:COL.teal, f:g=>{ angleMark(g,{x:48,y:38},0,359.9,{color:COL.teal,r:22}); ray(g,48,38,0,44);} },
  {t:'Complementary', r:'a + b = 90°', c:COL.blue, f:g=>{ angleMark(g,{x:30,y:60},0,35,{color:COL.blue,r:26}); angleMark(g,{x:30,y:60},35,90,{color:COL.pink,r:26}); ray(g,30,60,0,60); ray(g,30,60,35,60); ray(g,30,60,90,52);} },
  {t:'Supplementary', r:'a + b = 180°', c:COL.blue, f:g=>{ angleMark(g,{x:48,y:52},0,120,{color:COL.blue,r:22}); angleMark(g,{x:48,y:52},120,180,{color:COL.pink,r:22}); ray(g,48,52,0,44); ray(g,48,52,180,44); ray(g,48,52,120,44);} },
  {t:'Angles on a straight line', r:'a + b + c = 180°', c:COL.green, f:g=>{ angleMark(g,{x:48,y:52},0,60,{color:COL.blue,r:22}); angleMark(g,{x:48,y:52},60,120,{color:COL.pink,r:22}); angleMark(g,{x:48,y:52},120,180,{color:COL.green,r:22}); ray(g,48,52,0,44); ray(g,48,52,180,44); ray(g,48,52,60,44); ray(g,48,52,120,44);} },
  {t:'Angles around a point', r:'sum = 360°', c:COL.purple, f:g=>{ [[0,130,COL.blue],[130,250,COL.pink],[250,360,COL.green]].forEach(([a,b,c])=>angleMark(g,{x:48,y:38},a,b,{color:c,r:22})); [0,130,250].forEach(a=>ray(g,48,38,a,34));} },
  {t:'Vertically opposite', r:'a = a, b = b', c:COL.blue, f:g=>{ [[0,60,COL.blue],[60,180,COL.pink],[180,240,COL.blue],[240,360,COL.pink]].forEach(([a,b,c])=>angleMark(g,{x:48,y:38},a,b,{color:c,r:16})); line(g,48,38,0,44); line(g,48,38,60,44);} },
  {t:'Corresponding (F)', r:'a = a', c:'var(--pairF)', f:g=>par(g,'corresponding') },
  {t:'Alternate (Z)', r:'a = a', c:'var(--pairZ)', f:g=>par(g,'alternate') },
  {t:'Co-interior (C)', r:'a + b = 180°', c:'var(--pairC)', f:g=>par(g,'cointerior') },
  {t:'Lines are parallel if…', r:'F equal, Z equal, or C = 180°', c:COL.teal, f:g=>par(g,'corresponding') },
  {t:'Triangle', r:'a + b + c = 180°', c:COL.blue, f:g=>{ const pts=[{x:48,y:8},{x:6,y:66},{x:90,y:66}]; const g2=el('g',{},g); [[0,COL.blue],[1,COL.pink],[2,COL.green]].forEach(([i,c])=>{ const V=pts[i]; const a=dirOf(V,pts[(i+1)%3]), b=dirOf(V,pts[(i+2)%3]); const s=norm360(b-a); const [f,t]= s<=180?[a,b]:[b,a]; angleMark(g2,V,f,t,{color:c,r:14}); }); el('path',{d:`M ${pts.map(p=>p.x+' '+p.y).join(' L ')} Z`,fill:'none',stroke:'var(--ink)','stroke-width':2},g); } },
  {t:'Exterior angle', r:'e = a + b', c:COL.orange, f:g=>{ const pts=[{x:40,y:8},{x:6,y:62},{x:66,y:62}]; const V=pts[2]; const E={x:92,y:62}; el('path',{d:`M ${pts.map(p=>p.x+' '+p.y).join(' L ')} Z`,fill:'none',stroke:'var(--ink)','stroke-width':2},g); el('line',{x1:V.x,y1:V.y,x2:E.x,y2:E.y,stroke:'var(--ink)','stroke-width':2},g); const a=dirOf(V,E), b=dirOf(V,pts[0]); angleMark(g,V,a,b,{color:COL.orange,r:14}); } },
  {t:'Quadrilateral', r:'a + b + c + d = 360°', c:COL.purple, f:g=>{ const pts=[{x:14,y:10},{x:88,y:14},{x:80,y:66},{x:6,y:62}]; const g2=el('g',{},g); [[0,COL.blue],[1,COL.pink],[2,COL.green],[3,COL.purple]].forEach(([i,c])=>{ const V=pts[i]; const a=dirOf(V,pts[(i+1)%4]), b=dirOf(V,pts[(i+3)%4]); const s=norm360(b-a); const [f,t]= s<=180?[a,b]:[b,a]; angleMark(g2,V,f,t,{color:c,r:12}); }); el('path',{d:`M ${pts.map(p=>p.x+' '+p.y).join(' L ')} Z`,fill:'none',stroke:'var(--ink)','stroke-width':2},g); } },
];
function ray(g,x,y,a,len){ const e = polar(x,y,len,a); el('line',{x1:x,y1:y,x2:e.x,y2:e.y,stroke:'var(--ink)','stroke-width':2},g); }
function line(g,x,y,a,len){ const e = polar(x,y,len,a), s = polar(x,y,len,a+180); el('line',{x1:s.x,y1:s.y,x2:e.x,y2:e.y,stroke:'var(--ink)','stroke-width':2},g); }
function par(g, kind){ const col = PAIR_COLOR[kind]; const y1=22, y2=56; el('line',{x1:4,y1:y1,x2:92,y2:y1,stroke:'var(--ink)','stroke-width':2},g); el('line',{x1:4,y1:y2,x2:92,y2:y2,stroke:'var(--ink)','stroke-width':2},g); const P1={x:58,y:y1}, P2={x:38,y:y2}; const phi = dirOf(P2,P1); el('line',{x1:P2.x-14,y1:y2+20,x2:P1.x+14,y2:y1-20,stroke:'var(--ink)','stroke-width':2},g);
  const marks = {corresponding:[[P1,0,phi],[P2,0,phi]], alternate:[[P1,180,phi+180],[P2,0,phi]], cointerior:[[P1,180,phi+180],[P2,phi,180]]}[kind]; marks.forEach(([P,a,b]) => angleMark(g,P,a,b,{color:col,r:13})); }
SCREENS.glossary = () => {
  app.innerHTML = `<h2>Rules Summary</h2><p class="muted">Every rule in Angle Lab on one page.</p><div class="rules">${RULES.map((r,i) => `<div class="rule"><svg viewBox="0 0 96 72" data-rule="${i}"></svg><div><b style="color:${r.c}">${i+1}. ${r.t}</b><span>${r.r}</span></div></div>`).join('')}</div>
    <h2 style="margin-top:30px">Glossary</h2><div class="gloss">${GLOSSARY.map(([en,th,d]) => `<div class="term"><b>${en}</b><small>${th}</small>${d}</div>`).join('')}</div>`;
  $$('[data-rule]').forEach(svg => { svg.classList.add('fig'); const g = el('g',{},svg); RULES[+svg.dataset.rule].f(g); });
};

go('home');
</script>

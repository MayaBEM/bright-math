:root{
  --paper:#FFF9F1; --cream:#FFF1DE; --ink:#3B2A22; --soft:#7A6656; --line:#E8D9C4;
  --mint:#6DBF9E; --mintD:#2F8A68; --mintT:#E2F4EC;
  --berry:#E0607A; --berryD:#B83A55; --berryT:#FCE6EA;
  --butter:#F5C85C; --butterT:#FFF4D6;
  --ok:#2F8A68; --no:#C2412D;
}
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Andika,system-ui,sans-serif;font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block}
.awn{height:28px;background:repeating-linear-gradient(90deg,var(--mint) 0 44px,#FFFDF8 44px 88px);position:relative;border-bottom:2px solid var(--ink)}
.awn:after{content:'';position:absolute;left:0;right:0;top:100%;height:14px;background:radial-gradient(circle at 22px -6px,var(--mint) 0 20px,transparent 21px) 0 0/88px 14px repeat-x,radial-gradient(circle at 22px -6px,#FFFDF8 0 20px,transparent 21px) 44px 0/88px 14px repeat-x;pointer-events:none}
.wrap{max-width:1040px;margin:0 auto;padding:30px 20px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:Sniglet;font-size:20px;display:flex;align-items:center;gap:8px}
.brand img{height:56px;width:auto}
.pill{border:2px solid var(--ink);border-radius:0;padding:6px 14px;font-size:15px;background:#fff}
.pill:hover{background:var(--cream)}
h1,h2,h3{font-family:Sniglet;font-weight:800;line-height:1.08}
.kick{font-family:Sniglet;font-size:16px;color:var(--berryD)}
.btn{font-family:Sniglet;font-size:20px;padding:12px 26px;border-radius:0;border:2.5px solid var(--ink);background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.mint{background:var(--mint);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.pill:focus-visible,.nb:focus-visible,.key:focus-visible,.menu-row:focus-visible,.op:focus-visible{outline:3px solid var(--butter);outline-offset:3px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(46px,8vw,88px);margin:8px 0 10px}
.hero p.lead{font-size:20px;max-width:30em}
.heroimg{position:relative;aspect-ratio:1.15;border-radius:0;overflow:hidden;border:2.5px solid var(--ink);background:var(--mintT)}
.heroimg img.bg{width:100%;height:100%;object-fit:cover}
.namebox{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.namebox input{font:inherit;font-size:20px;padding:11px 14px;border:2.5px solid var(--ink);border-radius:0;width:240px;max-width:100%;background:#fff}
.menu{margin-top:36px;border:2.5px solid var(--ink);border-radius:0;background:#fff;overflow:hidden}
.menu-h{background:var(--ink);color:var(--paper);padding:12px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.menu-h h2{font-size:26px}.menu-h span{font-size:15px;opacity:.85}
.menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;width:100%;text-align:left;padding:12px 22px;border-top:1.5px dashed var(--line)}
.menu-row:first-of-type{border-top:0}
.menu-row:hover{background:var(--cream)}
.menu-row img{width:56px;height:56px;object-fit:contain}
.menu-row b{font-family:Sniglet;font-weight:400;font-size:22px;display:block}
.menu-row small{color:var(--soft);font-size:15px}
.stars{display:flex;gap:3px;font-size:0}
.stars i{width:22px;height:22px;display:block;background:var(--line);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--butter)}
.tag{font-size:14px;font-family:Sniglet;padding:3px 10px;border-radius:0;background:var(--mintT);color:var(--mintD);border:1.5px solid var(--mint)}

/* lesson */
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2.5px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.lhead h2{font-size:clamp(30px,5vw,44px)}
.dots{display:flex;gap:6px}.dots span{width:30px;height:8px;border-radius:0;background:var(--line)}.dots span.on{background:var(--mint)}.dots span.cur{background:var(--ink)}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:0;padding:22px 24px;position:relative}
.say{font-family:Sniglet;color:var(--berryD);font-size:22px}
.prompt{font-size:21px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.prompt img{width:62px;height:62px;object-fit:contain;flex:none}
.scene{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end;padding:10px 0 4px;min-height:120px}
.it{width:var(--s,44px);height:var(--s,44px);object-fit:contain;filter:drop-shadow(0 2px 2px rgba(60,40,30,.25))}
.pop{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.grp{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:3px;position:relative;transition:transform .15s}
.grp.plate{background:radial-gradient(ellipse at center,#fff 0 56%,#F1ECE6 58%,#fff 64%,#E5DED5 100%);border:1.5px solid #CFC6BC;border-radius:50%;padding:14px 18px;min-height:86px;min-width:110px;box-shadow:0 4px 0 #E2D9CE}
.grp.jar{background:linear-gradient(90deg,rgba(255,255,255,.75) 0 12%,transparent 20%),#E6F3F6;border:2px solid #9CC3CC;border-radius:0;padding:18px 10px 10px;min-height:96px;min-width:84px;margin-top:12px}
.grp.jar:before{content:'';position:absolute;left:10%;right:10%;top:-13px;height:12px;background:var(--mint);border:2px solid var(--mintD);border-radius:0}
.grp.box{background:#FCE6EA;border:2px solid #D58F9E;border-radius:0;padding:20px 10px 10px;min-height:92px;min-width:96px}
.grp.box:before{content:'';position:absolute;left:-2px;right:-2px;top:-2px;height:12px;background:#F2B6C2;border:2px solid #D58F9E;border-radius:0}
.grp.bowl{background:linear-gradient(#7FB0BE 0 0) top/100% 3px no-repeat,linear-gradient(180deg,#DCEEF3,#BFDDE6);border:0;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);padding:16px 14px 18px;min-height:84px;min-width:110px;}
.grp.tap{cursor:pointer}.grp.tap:hover{transform:translateY(-3px)}
.grp .cnt{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-family:Sniglet;font-size:18px;color:var(--soft)}
.tray{display:inline-grid;gap:5px;padding:12px;background:#F7E7C6;box-shadow:inset 0 0 0 5px #fff;border:2.5px solid var(--ink);border-radius:0;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.tray .c{width:var(--s,46px);height:var(--s,46px);border-radius:50%;background:radial-gradient(circle,#E9C37C 0 55%,#D9A85A 70%,#C99446 100%);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.tray .c img{width:86%;height:86%}
.pile{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:320px;min-height:50px}
.math{font-family:Sniglet;font-size:clamp(26px,4vw,34px);text-align:center;margin:8px 0}
.math .hl{color:var(--berryD)}
.steps{display:grid;gap:8px;margin-top:14px;font-size:19px}
.steps div{display:flex;gap:10px;align-items:center}
.num{font-family:Sniglet;font-weight:800;width:32px;height:32px;background:var(--butterT);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.stepper{display:flex;align-items:center;gap:10px;font-size:19px}
.stepper button{width:44px;height:44px;border-radius:0;border:2.5px solid var(--ink);background:#fff;font-family:Sniglet;font-size:26px;line-height:1}
.stepper b{font-family:Sniglet;font-size:28px;min-width:30px;text-align:center}
.note{background:var(--butterT);border-left:6px solid var(--butter);padding:10px 16px;border-radius:0;margin-top:16px;font-size:18px}

/* practice */
.play{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.sentence{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-family:Sniglet;font-size:30px;margin-top:22px}
.sentence .w{font-family:Andika;font-size:19px}
.nb{min-width:76px;height:62px;border:3px solid var(--ink);border-radius:0;background:#fff;font-family:Sniglet;font-size:32px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;position:relative}
.nb.sel{border-color:var(--berry);box-shadow:0 0 0 4px var(--berryT)}
.nb.ok{border-color:var(--ok);background:var(--mintT)}
.nb.bad{border-color:var(--no);background:#FDECE8}
.nb.ok:after,.nb.bad:after{position:absolute;top:-12px;right:-12px;width:24px;height:24px;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;font-family:Andika;font-weight:700}
.nb.ok:after{content:'\2713';background:var(--ok)}.nb.bad:after{content:'\2715';background:var(--no)}
.nb.fixed{border-style:dashed;color:var(--soft)}
.pad{background:#fff;border:2.5px solid var(--ink);border-radius:0;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;position:sticky;top:14px}
.key{height:58px;border-radius:0;border:2px solid var(--ink);background:var(--cream);font-family:Sniglet;font-size:28px;box-shadow:0 3px 0 var(--ink)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.key.sm{font-family:Andika;font-size:17px;font-weight:700}
.pad .btn{grid-column:1/-1;margin-top:4px}
.fb{margin-top:16px;border-radius:0;padding:12px 16px;font-size:18px;display:none;gap:10px;align-items:flex-start}
.fb.show{display:flex}
.fb.ok{background:var(--mintT);border:2px solid var(--mint)}
.fb.no{background:#FDECE8;border:2px solid #E8A598}
.fb b{font-family:Sniglet;font-weight:400}
.ops{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.op{min-width:150px;padding:12px 18px;border:3px solid var(--ink);border-radius:0;background:#fff;font-size:18px;text-align:center}
.op big{display:block;font-family:Sniglet;font-size:38px;line-height:1}
.op.sel{background:var(--butterT);border-color:var(--berry)}
.op.ok{background:var(--mintT);border-color:var(--ok)}.op.bad{background:#FDECE8;border-color:var(--no)}
.qcount{font-size:16px;color:var(--soft)}

/* end */
.done{text-align:center;padding:30px 20px}
.done h2{font-size:clamp(34px,6vw,52px);margin:10px 0}
.done .stars{justify-content:center;margin:14px 0}.done .stars i{width:46px;height:46px}
.cert{max-width:720px;margin:0 auto;border:3px solid var(--ink);border-radius:0;padding:34px;background:#fff;text-align:center;position:relative;overflow:hidden}
.cert:before{content:'';position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,var(--berry) 0 40px,#FFFDF8 40px 80px)}
.cert h2{font-size:clamp(34px,6vw,54px);margin:20px 0 6px}
.cert .nm{font-family:Sniglet;font-size:clamp(30px,5vw,44px);color:var(--berryD);border-bottom:2px solid var(--ink);display:inline-block;padding:0 20px;margin:10px 0}
.treats{display:flex;justify-content:center;gap:10px;margin-top:16px}.treats img{width:56px;height:56px;object-fit:contain}

/* teacher */
table.res{width:100%;border-collapse:collapse;font-size:17px;margin-top:10px}
table.res th{text-align:left;font-family:Sniglet;font-weight:400;border-bottom:2.5px solid var(--ink);padding:8px}
table.res td{border-bottom:1px solid var(--line);padding:8px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.tgrid h3{font-size:22px;margin-bottom:6px}
.tgrid ul{padding-left:20px}.tgrid li{margin:4px 0}
.credits{font-size:13px;color:var(--soft);margin-top:30px;line-height:1.5}
.credits a{color:var(--soft)}

@media (max-width:760px){
  html,body{font-size:17px}
  .wrap{padding:22px 14px 50px}
  .hero{grid-template-columns:1fr}
  .heroimg{aspect-ratio:1.6}
  .play{grid-template-columns:1fr}
  .pad{position:static;grid-template-columns:repeat(10,1fr);padding:10px;gap:7px}
  .key{height:50px;font-size:24px;grid-column:span 2}
  .key[data-k="0"]{order:1}
  .key.sm{grid-column:span 5;order:2}
  .pad .btn{order:3}
  .card{padding:16px}
  .menu-row{grid-template-columns:48px 1fr;padding:10px 14px}
  .menu-row img{width:46px;height:46px}
  .menu-row .stars{grid-column:2}
  .sentence{font-size:24px;gap:7px}
  .nb{min-width:62px;height:54px;font-size:27px}
  .grp.plate{min-width:92px;padding:12px}
  .tgrid{grid-template-columns:1fr}
  .op{min-width:130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.ctrl,.noprint{display:none!important}.wrap{padding:0}body{background:#fff}}
</style>

let Q = null; // {boxes:[{ans, val, fixed}], sel, op?}
function buildQ(q){
  const it = q.item;

    return {prompt:`How many ${PL[it]}? Count the groups first.`,

      sentence:[['b', q.g], ['w','groups of'], ['b', q.n], ['t','='], ['b', q.g*q.n]], second:[['b',q.g], ['t','&times;'], ['b',q.n], ['t','='], ['b',q.g*q.n]],
      explain:`There are ${q.g} groups with ${q.n} in each. ${Array(q.g).fill(q.n).join(' + ')} = ${q.g*q.n}, so ${q.g} &times; ${q.n} = ${q.g*q.n}.`};
  }
  if (q.type === 'array') return {prompt:`Look at the rows of ${PL[it]}.`, scene:`<div class="scene">${tray(it, q.r, q.c, q.c > 5 ? 38 : 44)}</div>`,
      sentence:[['b', q.r], ['w','rows of'], ['b', q.c], ['t','&rarr;'], ['b', q.r], ['t','&times;'], ['b', q.c], ['t','='], ['b', q.r*q.c]],
      explain:`${q.r} rows with ${q.c} in each row. ${q.r} &times; ${q.c} = ${q.r*q.c}.`};
  if (q.type === 'share') return {prompt:`Share ${q.t} ${PL[it]} equally into ${q.g} ${{plate:'plates', jar:'jars', box:'boxes', bowl:'bowls'}[q.kind]}.`, share:true,
      sentence:[['b', q.t], ['t','&divide;'], ['b', q.g], ['t','='], ['b', q.t/q.g], ['w', `in each ${q.kind}`]],
      explain:`Give one to each ${q.kind} until none are left. Each ${q.kind} gets ${q.t/q.g}. ${q.t} &divide; ${q.g} = ${q.t/q.g}.`};
  if (q.type === 'fact') { const p = q.r*q.c;
    return {prompt:`Use the box to finish all four facts.`, scene:`<div class="scene">${tray(it, q.r, q.c, 40)}</div>`, facts:true,
      sentence:[['b',q.r,1],['t','&times;'],['b',q.c,1],['t','='],['b',p],['br'],['b',q.c,1],['t','&times;'],['b',q.r,1],['t','='],['b',p],['br'],['b',p,1],['t','&divide;'],['b',q.r,1],['t','='],['b',q.c],['br'],['b',p,1],['t','&divide;'],['b',q.c,1],['t','='],['b',q.r]],
      explain:`The three numbers are ${q.r}, ${q.c} and ${p}. ${q.r} &times; ${q.c} = ${p}, so ${p} &divide; ${q.r} = ${q.c} and ${p} &divide; ${q.c} = ${q.r}.`}; }

}
function question(){

function paint(){
  app.querySelectorAll('[data-b]').forEach(el => { const b = Q.boxes[+el.dataset.b]; el.textContent = b.val; el.classList.toggle('sel', +el.dataset.b === Q.sel && !Q.checked); });

function key(k){

document.addEventListener('keydown', e => {

function check(){
  const fb = $('#fb');

  let allOk = true;

  allOk = allOk && opOk; S.tries++;

}
function hint(){

   ${pic(st.icon, 110, 'pop')}<h2>${n === 3 ? 'Perfect scoop!' : n === 2 ? 'Nicely done!' : 'Good effort!'}</h2>
   ${starsHTML(n)}
   <p style="font-size:20px">You got <b>${S.score} of ${total}</b> right on the first try.</p>
   <p style="color:var(--soft)">${n === 3 ? 'You are ready for the next station.' : 'You can try this station again to earn more stars.'}</p>
   <div class="ctrl"><button class="btn alt" onclick="openStation(${S.i})">Try again</button>${nextI < STATIONS.length ? `<button class="btn" onclick="openStation(${nextI})">Next: ${STATIONS[nextI].title}</button>` : ''}<button class="btn alt" onclick="home()">Menu</button></div></div>`;
  if (n === 3) burst(20);
}
function cert(){
  const r = P.res.check;
  app.innerHTML = `${topBar()}<div class="cert">
   <img src="${LOGO}" alt="Bright EngMath" style="height:70px;margin:22px auto 0"><div class="kick" style="margin-top:8px">Scoop Shop Math</div><h2>Master Scooper</h2>
   <p>This certificate goes to</p><div class="nm">${esc(P.name || 'A great learner')}</div>
   <p style="font-size:19px;max-width:32em;margin:8px auto">for learning that multiplication means <b>equal groups</b> and division means <b>sharing equally</b>.</p>
   <p style="font-family:Sniglet;font-size:24px;margin-top:10px">Big Scoop Check: ${r.score} of ${r.total}</p>
   <div class="treats">${['cone','scoop','truffle','cinnamon','popsicle','cakepop'].map(k => pic(k,56)).join('')}</div>
   <p style="color:var(--soft);font-size:15px;margin-top:14px">${r.when}</p></div>
   <div class="ctrl noprint"><button class="btn" onclick="window.print()">Print certificate</button><button class="btn alt" onclick="home()">Menu</button></div>`;
  burst(26);
}
function burst(n=10){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const keys = ['cone','scoop','gummy','truffle','popsicle','cakepop'];
  for (let i = 0; i < n; i++) {
    const im = document.createElement('img'); im.src = IMG[keys[i % keys.length]]; im.alt = '';
    const x = 10 + Math.random() * 80, d = 900 + Math.random() * 700;
    im.style.cssText = `position:fixed;left:${x}vw;top:-60px;width:40px;height:40px;object-fit:contain;pointer-events:none;z-index:50;transition:transform ${d}ms cubic-bezier(.3,.6,.5,1),opacity ${d}ms`;
    document.body.appendChild(im);
    requestAnimationFrame(() => requestAnimationFrame(() => { im.style.transform = `translateY(${60 + Math.random()*50}vh) rotate(${Math.random()*360-180}deg)`; im.style.opacity = 0; }));
    setTimeout(() => im.remove(), d + 60);
  }
}

/* ---------------- teacher ---------------- */
function teacher(){
  Q = null;
  const rows = STATIONS.map((st, i) => { const r = P.res[st.id]; return `<tr><td>${i+1}. ${st.title}</td><td>${r ? `${r.score} / ${r.total}` : '&ndash;'}</td><td>${r ? starsHTML(starsFor(r.score, r.total)) : ''}</td><td>${r ? r.when : ''}</td></tr>`; }).join('');
  const key = STATIONS.map((st, i) => `<li><b>${st.title}:</b> ${st.qs.map((q, k) => `${k+1}) ${keyOf(q)}`).join('; ')}</li>`).join('');
  app.innerHTML = `${topBar()}<div class="lhead"><div><div class="kick">For teachers</div><h2>Teacher Corner</h2></div></div>
   <div class="card"><h3 style="font-size:24px">Results on this device${P.name ? ` &middot; ${esc(P.name)}` : ''}</h3>
   <table class="res"><tr><th>Station</th><th>First-try score</th><th>Stars</th><th>Date</th></tr>${rows}</table>
   <div class="ctrl" style="justify-content:flex-start"><button class="btn alt" onclick="resetAll()">Reset progress</button><button class="btn alt" onclick="window.print()">Print results</button></div></div>
   <div class="tgrid">
    <div class="card"><h3>How it works</h3><ul>
     <li>Six stations: four teach a big idea with something to tap, then 3&ndash;4 practice questions.</li>
     <li>Children get two tries. After the second try the app shows the answer and explains it.</li>
     <li>The Big Scoop Check gives one try per question and ends with a printable certificate.</li>
     <li>Scores are first-try scores, saved only in this browser.</li>
     <li>Works on a tablet, a laptop, or shared on Zoom. Children can type with the keyboard: numbers, Backspace, Tab to move, Enter to check.</li></ul></div>
    <div class="card"><h3>Teaching tips</h3><ul>
     <li>Ask &ldquo;How many groups? How many in each group?&rdquo; before any &times; question.</li>
     <li>For &divide;, ask &ldquo;Is it fair? How do you know?&rdquo;</li>
     <li>Use Rows in a Box to show that 3 &times; 5 and 5 &times; 3 give the same total.</li>
     <li>Standards: 2.OA.C.3, 2.OA.C.4; builds readiness for 3.OA.A.1, 3.OA.A.2 and 3.OA.B.6.</li></ul></div></div>
   <div class="card" style="margin-top:18px"><h3 style="font-size:22px">Answer key</h3><ul style="padding-left:20px;margin-top:6px;font-size:16px">${key}</ul></div>`;
  window.scrollTo({top:0});
}
function keyOf(q){
  if (q.type === 'groups') return `${q.g} groups of ${q.n} = ${q.g*q.n}`;
  if (q.type === 'array') return `${q.r} &times; ${q.c} = ${q.r*q.c}`;
  if (q.type === 'share') return `${q.t} &divide; ${q.g} = ${q.t/q.g}`;
  if (q.type === 'fact') return `${q.r*q.c} &divide; ${q.r} = ${q.c}, ${q.r*q.c} &divide; ${q.c} = ${q.r}`;
  return `${q.op === 'x' ? '&times;' : '&divide;'} ${q.op === 'x' ? q.a*q.b : q.a/q.b} ${q.unit}`;
}
function resetAll(){ P.res = {}; save(); teacher(); }
home();
</script>

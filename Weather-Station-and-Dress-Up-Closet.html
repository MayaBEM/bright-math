:root{
 --ink:#1B2F4B;--ink2:#4A5F7C;--paper:#FFFFFF;--cream:#FFF9EC;--bg:#DCEEF8;--bgline:#C9E2F1;
 --sky:#56B0E6;--skyD:#2F86BD;--skyL:#CFE9F7;--sun:#FFC83D;--sunD:#E8A312;--coral:#F2694B;--pri:#C94A2E;--mint:#3DB59A;--mintD:#2A8C75;
 --good:#2E7D32;--bad:#B93A28;--warn:#9A6200;
 --fs:clamp(16px,.55vw + 10px,22px);--r:18px;--shadow:0 3px 0 rgba(27,47,75,.18),0 10px 24px rgba(27,47,75,.12);
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html.big{--fs:clamp(18px,.7vw + 11px,26px)}
body{margin:0;font-family:'Andika','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);
 background-image:linear-gradient(var(--bgline) 2px,transparent 2px),linear-gradient(90deg,var(--bgline) 2px,transparent 2px);background-size:84px 84px;line-height:1.35;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:4px solid #0B5FA8;outline-offset:3px}
h1,h2,h3,h4,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{display:block;flex:none;overflow:visible}
svg.ui{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
svg.ui.on{fill:var(--sun);stroke:var(--ink)}
#app{position:relative;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;min-width:0}main:focus{outline:none}
.muted{color:var(--ink2)}.c{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.c{justify-content:center}.row.act{margin:.6rem 0}
.note{font-size:.9rem;color:var(--ink2);margin:.4rem 0}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:4px solid var(--ink);box-shadow:0 6px 0 var(--sky)}
.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;margin-top:6px;background:radial-gradient(circle at 16px 0,var(--sky) 15px,transparent 16px) 0 0/32px 16px repeat-x;filter:drop-shadow(0 2px 0 var(--ink));pointer-events:none}
.top-in{display:flex;align-items:center;gap:10px 14px;padding:6px 16px;min-height:62px;flex-wrap:wrap}
.top .grow{flex:1}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:2px;text-align:left}
.brand svg{width:40px;height:40px}
.bt{display:flex;flex-direction:column;line-height:1.05}
.b1{font-weight:700;font-size:1.2rem}.b1 b{color:var(--skyD)}.b1 i{font-style:normal;color:var(--pri)}
.bt small{font-size:.78rem;color:var(--ink2);font-weight:700;letter-spacing:.04em}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.grp{display:inline-flex;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.glabel{padding:0 .5rem;font-size:.8rem;font-weight:700;color:var(--ink2);background:var(--skyL);align-self:stretch;display:flex;align-items:center;border-right:3px solid var(--ink)}
.seg{border:0;background:#fff;padding:.3rem .75rem;font-weight:700;min-height:44px;min-width:44px}
.seg+.seg{border-left:3px solid var(--ink)}
.seg[aria-pressed=true]{background:var(--ink);color:#fff}

/* pair icons: feet items are shown as a pair, toes outward is mirrored on the stand; icon uses same pair spacing */
function iconInner(id){
 const a=ART_ITEMS[id];
 if(a.icon)return a.icon();
 if(!a.local)return a.worn();
 if(a.pair==='feet')return `<g transform="translate(0 0)">${a.art()}</g><g transform="translate(212 0) scale(-1 1)">${a.art()}</g>`;
 if(a.pair==='hands')return `<g>${a.art()}</g><g transform="translate(136 0) scale(-1 1)">${a.art()}</g>`;
 return a.art();
}
function wornPlaced(id){
 const a=ART_ITEMS[id];
 if(!a.local)return a.worn();
 if(id==='umbrella')return `<g transform="translate(214.5 53.4) rotate(-3.4) scale(.95) translate(-60 -34)">${UMBR(false)}</g>`+L('M216,78 L233,362',5)+L('M233,362 C235,376 249,376 250,364',6,C.brown)+`<rect x="221" y="336" width="22" height="24" rx="8" fill="${SK.f}" ${o()} transform="rotate(7 232 348)"/>`;
 if(a.pair==='feet')return feetPair(a.art());
 if(a.pair==='hands')return handPairR(a.art());
 return `<g transform="${a.place}">${a.art()}</g>`;
}
let VBMAP={}; // overridden by measured bounds (vb.json) when present
function itemIcon(id,cls='ic',title=''){
 const a=ART_ITEMS[id];const vb=(typeof VB!=='undefined'&&VB[id])||a.vb;
 return `<svg class="${cls}" viewBox="${vb}" role="img" aria-label="${title||id}" focusable="false">${iconInner(id)}</svg>`;

 const hat=items.some(i=>i.slot==='head');

 const hasTop=items.some(i=>['top','whole'].includes(i.slot)),hasBot=items.some(i=>['bottom','whole'].includes(i.slot));

 const bf=`<g transform="${FEET_L}">${bareFoot()}</g><g transform="${FEET_R}">${bareFoot()}</g>`;
 const wornSvg=items.map(i=>`<g data-worn="${i.id}">${wornPlaced(i.id)}</g>`).join('');
 const bg=opt.base===false?'':standBase();

  keys.forEach(k=>{if(ht.some(x=>x===k||(k.length>3&&x.length>3&&(x.startsWith(k.slice(0,4))||k.startsWith(x.slice(0,4))))))hit++});

/* games */
function gameStart(type){
 const n=lvl()===1?3:4;
 if(type==='g1'){
  const rounds=sample([...POOL_WX,...POOL_CL],6).map(t=>{const pool=t.k==='cl'?POOL_CL:POOL_WX.filter(o=>o.k===t.k||o.k==='wx');const opts=shuffle([t,...sample(pool.filter(o=>o.id!==t.id),n-1)]);return{t,opts}});
  S.words.g={type,rounds,i:0,score:0,tries:0,fb:null,hint:false,done:false,first:true};
 }else{
  const rounds=[...Array(5)].map((_,i)=>{const pool=i%2?POOL_WX:POOL_CL;const items=sample(pool,5);const miss=items[Math.floor(Math.random()*5)];return{items,miss}});
  S.words.g={type,rounds,i:0,score:0,tries:0,fb:null,phase:'look',done:false};
 }
}
function gameHTML(){
 const W=S.words;if(!W.g||W.g.type!==W.tab){return `<div class="game card"><h2 class="h2">${W.tab==='g1'?'Listen & tap':"What's missing?"}</h2><p class="lead2">${W.tab==='g1'?'Listen to the word. Tap the right picture.':'Look at the pictures. Cover your eyes. Which one is missing?'}</p><button class="btn pri xl" data-act="gstart">${ui('play')}<span>Play</span></button></div>`}
 const g=W.g;
 if(g.done){const max=g.type==='g1'?6:5;return `<div class="game card pop"><h2 class="h2">Great job!</h2>${starsHTML(g.score>=max-1?3:g.score>=Math.ceil(max/2)?2:1)}<p class="lead2">${g.score} of ${max} on the first try.</p><div class="row c"><button class="btn pri" data-act="gstart">${ui('reset')}<span>Play again</span></button><button class="btn" data-act="wtab" data-v="${g.type==='g1'?'g2':'cl'}"><span>${g.type==='g1'?"Next game":'Back to words'}</span></button></div></div>`}
 const r=g.rounds[g.i];const prog=`<p class="prog2">Round ${g.i+1} of ${g.rounds.length}</p>`;
 if(g.type==='g1'){
  const showWord=!Voice.avail||g.hint||g.fb==='good';
  return `<div class="game card">${prog}<div class="prompt">${Voice.avail?`<button class="btn xl pri" data-act="say" data-t="${esc(r.t.word)}">${ui('speaker')}<span>Listen</span></button>`:''}${showWord?`<div class="pw">${cap1(r.t.word)}</div>`:`<button class="btn sm" data-act="ghint">${ui('eye')}<span>Show the word</span></button>`}</div>
  <div class="opts">${r.opts.map(o=>`<button class="opt ${g.marks&&g.marks[o.id]||''}" data-act="gpick" data-id="${o.id}" ${g.fb==='good'?'disabled':''} aria-label="${esc(o.word)}">${wordPic(o)}${g.marks&&g.marks[o.id]?`<span class="mk">${g.marks[o.id]==='good'?ui('check')+' '+cap1(o.word):ui('x')+' Try again'}</span>`:''}</button>`).join('')}</div>
  <div class="fb" aria-live="polite">${g.fb==='good'?`Yes! ${cap1(r.t.word)}.`:g.fb==='bad'?'Not quite. Listen again.':''}</div>${g.fb==='good'?`<button class="btn pri xl" data-act="gnext">${ui('right')}<span>${g.i+1===g.rounds.length?'Finish':'Next'}</span></button>`:''}</div>`;
 }
 const cells=r.items.map(o=>{const gone=g.phase!=='look'&&o.id===r.miss.id&&g.fb!=='good';return gone?`<div class="mcard q" aria-label="Missing card"><span>?</span></div>`:`<div class="mcard">${wordPic(o)}<span>${cap1(o.word)}</span></div>`}).join('');
 return `<div class="game card">${prog}<div class="mrow">${cells}</div>
  ${g.phase==='look'?`<p class="lead2">Look and say each word. Then cover your eyes!</p><button class="btn pri xl" data-act="mhide">${ui('eye')}<span>Hide one</span></button>`
   :`<p class="lead2">Open your eyes. What's missing?</p><div class="opts">${shuffleStable(r.items,g.i).map(o=>`<button class="opt ${g.marks&&g.marks[o.id]||''}" data-act="mpick" data-id="${o.id}" ${g.fb==='good'?'disabled':''} aria-label="${esc(o.word)}">${wordPic(o)}<span class="mk">${cap1(o.word)}${g.marks&&g.marks[o.id]?(g.marks[o.id]==='good'?' '+ui('check'):' '+ui('x')):''}</span></button>`).join('')}</div>
   <div class="fb" aria-live="polite">${g.fb==='good'?`Yes! The ${r.miss.word} is missing.`:g.fb==='bad'?'Not quite. Look again.':''}</div>${g.fb==='good'?`<button class="btn pri xl" data-act="gnext">${ui('right')}<span>${g.i+1===g.rounds.length?'Finish':'Next'}</span></button>`:''}`}</div>`;
}
const shuffleStable=(a,seed)=>a.slice().sort((x,y)=>((x.id.charCodeAt(3)*7+seed)%11)-((y.id.charCodeAt(3)*7+seed)%11));
function gameAnswer(id,type){
 const g=S.words.g,r=g.rounds[g.i];const target=type==='g1'?r.t:r.miss;g.marks=g.marks||{};
 if(id===target.id){g.marks[id]='good';g.fb='good';if(g.tries===0)g.score++;Snd.fx('good')}
 else{g.marks[id]='bad';g.fb='bad';g.tries++;Snd.fx('bad')}
}
function gameNext(){
 const g=S.words.g;g.i++;g.tries=0;g.fb=null;g.marks=null;g.hint=false;g.phase='look';
 if(g.i>=g.rounds.length){g.done=true;const p=P0();const k=g.type==='g1'?'tap':'miss';p.best[k]=Math.max(p.best[k],g.score);calcStars(p);saveDB();Snd.fx('star')}
}
function markHeard(id){const p=P0();if(!p.heard.includes(id)){p.heard.push(id);calcStars(p);saveDB()}}

function wearItem(id,fromDrop){

/* ---------- 5. QUICK CHECK ---------- */
function goodFor(w){const r=RULES[w];return [...new Set([...r.need.flat(),...r.feet])].filter(id=>!r.bad[id])}
function badFor(w){return Object.keys(RULES[w].bad)}
function makeQuiz(){
 const L=lvl(),n=L===1?3:4,qs=[],W=shuffle(WEATHERS),ssn=w=>SCEN.find(x=>x.w===w);
 const wxScene=w=>`<div class="optscene">${sceneSVG({weather:w,season:ssn(w).s,crop:true,cls:'scene crop',label:w})}</div>`;
 // 1 listen: weather
 {const t=W[0],os=shuffle([t,...sample(WEATHERS.filter(x=>x!==t),n-1)]);
  qs.push({k:'hear',say:t,text:`Tap the weather: <b>${t}</b>.`,opts:os.map(o=>({id:o,html:wxScene(o),label:o})),ans:t,exp:`This is ${t}.`})}
 // 2 read the window
 {const t=W[1],sentOf=w=>plain(REPORT[L>1?2:1][w]),os=shuffle([t,...sample(WEATHERS.filter(x=>x!==t),n-1)]);
  qs.push({k:'read',pic:windowBlock(t,ssn(t).s,{cls:'mini'}),text:'What\'s the weather like?',opts:os.map(o=>({id:o,html:`<span class="otext">${esc(sentOf(o))}</span>`,label:sentOf(o),wide:1})),ans:t,exp:sentOf(t)})}
 // 3 clothes word
 {const t=sample(ITEMS,1)[0],os=shuffle([t,...sample(ITEMS.filter(x=>x.id!==t.id),n-1)]);
  qs.push({k:'word',say:t.w,text:`Tap the <b>${t.w}</b>.`,opts:os.map(o=>({id:o.id,html:icoI(o.id),label:o.w})),ans:t.id,exp:`This is ${np(t.id)}.`})}
 // 4 need
 {const t=W[2],g=sample(goodFor(t),1)[0],b=sample(badFor(t),n-1),os=shuffle([g,...b]);
  qs.push({k:'need',pic:windowBlock(t,ssn(t).s,{cls:'mini'}),text:`It's ${t}. What do you <b>need</b>?`,opts:os.map(o=>({id:o,html:icoI(o),label:IT[o].w})),ans:g,exp:`It's ${t}, so I need ${np(g)}.`})}
 // 5 temperature (never a boundary value; wrong options are never the neighbouring word)
 {const fs=[14,23,41,68,86,95],t=sample(fs,1)[0];const wd=tempWord(t);const order=['freezing','cold','cool','warm','hot'];const ix=order.indexOf(wd);
  const far=order.filter((x,i)=>Math.abs(i-ix)>=2);const os=shuffle([wd,...sample(far,Math.min(far.length,n-1))]);
  qs.push({k:'temp',pic:`<div class="tq">${thermoSVG(t,'F')}</div>`,text:`The thermometer says <b>${t}°F</b> (${toC(t)}°C). It's…`,opts:os.map(o=>({id:o,html:`<span class="otext">${cap1(o)}</span>`,label:o,wide:1})),ans:wd,exp:`${t}°F is ${wd}.`})}
 // 6 season (a clue sentence + a matching picture)
 {const CL={spring:["It's rainy and flowers grow.",'rainy'],summer:["It's hot and sunny.",'sunny'],fall:['Leaves fall down. It\'s windy.','windy'],winter:["It's cold and snowy.",'snowy']};
  const t=sample(SEASONS,1)[0],os=shuffle([t,...sample(SEASONS.filter(x=>x!==t),n-1)]);
  qs.push({k:'season',pic:`<div class="optscene big">${sceneSVG({weather:CL[t][1],season:t,crop:true,cls:'scene crop',label:'A '+t+' day'})}</div>`,text:`${CL[t][0]} Which season is it?`,opts:os.map(o=>({id:o,html:`${seaI(o)}<span class="otext">${cap1(o)}</span>`,label:o})),ans:t,exp:`It's ${t}.`})}
 // 7 odd one out
 {const t=W[3],g=sample(goodFor(t),2),b=sample(badFor(t),1)[0],os=shuffle([...g,b]);
  qs.push({k:'odd',pic:windowBlock(t,ssn(t).s,{cls:'mini'}),text:`It's ${t}. Which one do you <b>not</b> need?`,opts:os.map(o=>({id:o,html:icoI(o),label:IT[o].w})),ans:b,exp:`It's ${t}. You don't need ${np(b)}.`})}
 // 8 complete the sentence
 {const t=W[4],g=sample(goodFor(t),1)[0],b=sample(badFor(t),n-1),os=shuffle([g,...b]);
  qs.push({k:'fill',pic:windowBlock(t,ssn(t).s,{cls:'mini'}),text:`It's ${t}, so I need my <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>.`,opts:os.map(o=>({id:o,html:`${icoI(o)}<span class="otext">${cap1(IT[o].w)}</span>`,label:IT[o].w})),ans:g,exp:`It's ${t}, so I need my ${IT[g].w}.`})}
 return{qs,i:0,score:0,picked:null,fb:null,done:false};
}
function checkHTML(){
 const Q=S.chk;
 if(!Q)return `<section class="check"><div class="game card"><h2 class="h2">Quick Check</h2><p class="lead2">8 questions. Tap the right answer. You get a star or more!</p><button class="btn pri xl" data-act="cstart">${ui('play')}<span>Start</span></button></div></section>`;
 if(Q.done){const sc=Q.score,st=sc>=7?3:sc>=5?2:sc>=3?1:0;
  return `<section class="check"><div class="game card pop"><h2 class="h2">${st===3?'Wow! You are a Weather Expert!':st>=1?'Good job!':'Nice try!'}</h2>${starsHTML(st)}<p class="lead2 big3">${sc} of 8 correct</p>${st===3?`<div class="badgebig">${badgeSVG('#F58A33','check','badge')}<b>Weather Expert</b></div>`:''}
   <div class="row c"><button class="btn pri" data-act="cstart">${ui('reset')}<span>Try again</span></button>${st>=1?`<button class="btn gold" data-act="cert">${ui('star')}<span>Certificate</span></button>`:''}<button class="btn" data-act="home"><span>Home</span></button></div></div></section>`}
 const q=Q.qs[Q.i];const answered=Q.picked!==null;
 const opts=q.opts.map(o=>{const cls=answered?(o.id===q.ans?'good':o.id===Q.picked?'bad':''):'';return `<button class="opt ${o.wide?'wide':''} ${cls}" data-act="cpick" data-id="${esc(o.id)}" ${answered?'disabled':''} aria-label="${esc(o.label)}">${o.html}${answered&&(o.id===q.ans||o.id===Q.picked)?`<span class="mk">${o.id===q.ans?ui('check')+' Correct':ui('x')+' Not this one'}</span>`:''}</button>`}).join('');
 return `<section class="check"><div class="qwrap card"><div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${Q.i+(answered?1:0)}"><i style="width:${(Q.i+(answered?1:0))/8*100}%"></i></div><p class="prog2">Question ${Q.i+1} of 8 · Score ${Q.score}</p>
  <div class="qrow">${q.pic?`<div class="qpic">${q.pic}</div>`:''}<div class="qmain"><div class="qtext">${Voice.avail&&q.say?`<button class="btn pri" data-act="say" data-t="${esc(q.say)}">${ui('speaker')}<span>Listen</span></button> `:''}${q.text}</div><div class="opts ${q.k}">${opts}</div>
  <div class="fb ${answered?(Q.picked===q.ans?'good':'bad'):''}" aria-live="polite">${answered?`${Q.picked===q.ans?'Yes! ':'Not quite. '}${esc(q.exp)}`:''}</div>
  ${answered?`<div class="row"><button class="btn pri xl" data-act="cnext">${Q.i===7?'<span>See my stars</span>':'<span>Next</span>'}${ui('right')}</button>${spkBtn(q.exp,'Hear it')}</div>`:''}</div></div></div></section>`;
}
function checkPick(id){
 const Q=S.chk;if(Q.picked!==null)return;const q=Q.qs[Q.i];Q.picked=id;
 if(id===q.ans){Q.score++;Snd.fx('good')}else Snd.fx('bad');
}
function checkNext(){
 const Q=S.chk;if(Q.i>=7){Q.done=true;const p=P0();p.best.check=Math.max(p.best.check,Q.score);calcStars(p);saveDB();Snd.fx('star');return}
 Q.i++;Q.picked=null;
}

 return `<aside class="drawer ${S.drawer?'open':''}" id="drawer" aria-label="Tutor panel" ${S.drawer?'':'hidden'}><div class="dh"><h2>Tutor panel</h2><button class="iconbtn" data-act="tutor" aria-label="Close tutor panel">${ui('x')}</button></div>
  <div class="dtabs" role="tablist">${tabs.map(t=>`<button class="dtab" role="tab" data-act="dtab" data-v="${t[0]}" aria-selected="${T===t[0]}">${t[1]}</button>`).join('')}</div><div class="dbody">${body}</div></aside>`;
}

/* APP C: render, events, drag and drop, keyboard, init */

/* ---------- speaking helpers ---------- */

 if(ctx==='report'){const w=SCEN[S.rep.i].w,p=P0();if(!p.rep.includes(w)){p.rep.push(w);calcStars(p);saveDB();Snd.fx('star')}else Snd.fx('good')}

  else{const sc=scoreSpeech(currentSentence(ctx),got);if(sc>=.66){fb={kind:'good',text:'Great! I heard: “'+got[0]+'”'};markSaid(ctx)}else fb={kind:'bad',text:'Try again. I heard: “'+got[0]+'”'}}

}
/* ---------- recording ---------- */
window.onRecAutoStop=()=>{if(Recd.key)act('recstop',{dataset:{key:Recd.key}})};

  if(a==='recstop'){const r=await Recd.stop();Recd.key=null;if(r){await Recd.put(DB.current+':'+key,r);toast('Saved in this browser.')}fillRec(key)}

 }catch(e){Recd.key=null;Recd.release();toast(e&&e.name==='NotAllowedError'?'The microphone is blocked. Allow it in your browser, or skip recording.':'Recording is not available here.');fillRec(key)}

/* ---------- actions ---------- */
function act(a,el,ev){
 const v=el.dataset.v,id=el.dataset.id;
 switch(a){
  case'home':S.screen='home';S.cert=false;window.scrollTo(0,0);render();return;
  case'start':go('step',1);return;
  case'station':go('station');return;
  case'step':go('step',+v);return;
  case'level':DB.settings.level=+v;saveDB();S.rep.fb=null;S.dress.fb=null;S.pack.fb=null;if(S.chk&&!S.chk.done&&S.chk.i===0&&S.chk.picked===null)S.chk=null;Snd.fx('tap');break;
  case'unit':DB.settings.unit=v;saveDB();Snd.fx('tap');break;
  case'sound':DB.settings.sound=!DB.settings.sound;saveDB();if(DB.settings.sound){Snd.ctx=Snd.ctx||null;Snd.fx('on')}else{Snd.stopAmb();Snd.ambW=null}break;
  case'rm':DB.settings.rm=!DB.settings.rm;saveDB();break;
  case'big':DB.settings.big=!DB.settings.big;saveDB();break;
  case'full':{const d=document,r=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else (r.requestFullscreen||r.webkitRequestFullscreen).call(r);return}
  case'tutor':S.drawer=!S.drawer;break;
  case'student':S.drawer=true;S.tab='students';break;
  case'dtab':S.tab=v;break;
  case'say':{const t=el.dataset.t;Voice.say(t,t.length>14?.88:.8);return}
  case'print':window.print();return;
  case'cert':S.cert=true;break;
  case'certx':S.cert=false;break;
  /* station */
  case'swx':S.station.w=v;Snd.fx('tap');break;
  case'ssea':S.station.s=v;Snd.fx('tap');break;
  case'tour':{let i=0;const ws=[...WEATHERS];const tick=()=>{if(S.screen!=='station'||i>=ws.length)return;S.station.w=ws[i++];render();setTimeout(tick,2600)};tick();return}
  case'dressthis':{const sc=SCEN.findIndex(x=>x.w===S.station.w&&x.s===S.station.s);S.dress.custom=sc>=0?null:{w:S.station.w,s:S.station.s,f:tempF(S.station.w,S.station.s)};S.dress.i=sc>=0?sc:0;Object.assign(S.dress,{worn:[],msg:null,hint:false,done:false,fb:null,hist:[]});go('step',3);return}
  /* words */
  case'wtab':S.words.tab=v;if(v==='g1'||v==='g2'){if(S.words.g&&S.words.g.type!==v)S.words.g=null}break;
  case'wsel':S.words.sel=id;{const pool=[...POOL_WX,...POOL_CL,...POOL_ST],o=pool.find(x=>x.id===id);markHeard(id);Snd.fx('tap');if(o)Voice.say(o.word,.8)}break;
  case'gstart':gameStart(S.words.tab);break;
  case'ghint':S.words.g.hint=true;break;
  case'gpick':gameAnswer(id,'g1');break;
  case'mpick':gameAnswer(id,'g2');break;
  case'gnext':gameNext();break;
  case'mhide':S.words.g.phase='guess';Snd.fx('tap');break;
  /* report */
  case'rgo':S.rep.i=+v;S.rep.show=false;S.rep.fb=null;break;
  case'rprev':S.rep.i=Math.max(0,S.rep.i-1);S.rep.show=false;S.rep.fb=null;break;
  case'rnext':if(S.rep.i===8){go('step',3);return}S.rep.i++;S.rep.show=false;S.rep.fb=null;break;
  case'rshow':S.rep.show=!S.rep.show;break;
  case'rcheck':S.rep.fb={kind:'good',text:'Great speaking!'};markSaid('report');break;
  case'sayit':startListen(el.dataset.ctx);return;
  /* dress */
  case'pick':if(S.step===3)wearItem(id);else if(S.step===4)packItem(id);break;
  case'unwear':wearItem(id);break;
  case'ccat':S.dress.cat=v;break;
  case'hair':P0().look.hair=v;saveDB();Snd.fx('tap');break;
  case'hcolor':P0().look.hairColor=v;if(P0().look.hair==='none')P0().look.hair='short';saveDB();Snd.fx('tap');break;
  case'face':P0().look.face=v;saveDB();Snd.fx('tap');break;
  case'skin':P0().look.skin=v;saveDB();Snd.fx('tap');break;
  case'preset':{const L=P0().look,sk=L.skin==='stand'?'warm':L.skin;if(v==='stand')Object.assign(L,{skin:'stand',hair:'none',face:'none'});else if(v==='boy')Object.assign(L,{skin:sk,hair:'short',hairColor:L.hairColor||'brown',face:L.face==='none'?'smile':L.face});else Object.assign(L,{skin:sk,hair:'ponytail',hairColor:L.hairColor||'brown',face:L.face==='none'?'smile':L.face});saveDB();Snd.fx('good')}break;
  case'dundo':{const h=S.dress.hist||[];if(h.length){S.dress.worn=h.pop();S.dress.msg=null;S.dress.done=checkOutfit(S.dress.worn,curScen().w).done}}break;
  case'dclear':S.dress.hist=S.dress.hist||[];S.dress.hist.push(S.dress.worn.slice());S.dress.worn=[];S.dress.msg=null;S.dress.done=false;S.dress.fb=null;break;
  case'dhint':{const sc=curScen(),c=checkOutfit(S.dress.worn,sc.w);S.dress.hint=true;S.dress.msg=c.done?{kind:'good',text:'You are ready! Say it now.'}:c.bad.length?{kind:'hint',text:`Hint: take off ${joinList(c.bad,i=>IT[i].w)}. ${reactTo(c.bad[0],sc.w).text}`}:c.miss.length&&c.base?{kind:'hint',text:`Hint: it's ${sc.w}. Look for ${np(c.miss[0])}.`}:{kind:'hint',text:"Hint: add a top and bottoms, or a dress."};}break;
  case'dgo':S.dress.custom=null;S.dress.i=+v;Object.assign(S.dress,{worn:[],msg:null,hint:false,done:false,fb:null,hist:[]});break;
  case'dcheck':S.dress.fb={kind:'good',text:'Great speaking!'};Snd.fx('star');break;
  /* pack */
  case'unpack':packItem(id);break;
  case'pgo':Object.assign(S.pack,{i:+v,packed:[],res:null,say:-1,fb:null});break;
  case'pclear':Object.assign(S.pack,{packed:[],res:null,fb:null});break;
  case'pdone':{setTimeout(()=>{const b=$('.saybox');if(b&&!document.documentElement.classList.contains('rm'))b.scrollIntoView({block:'center',behavior:'smooth'})},80);const t=TRIPS[S.pack.i],r=tripCheck(S.pack.packed,t);S.pack.res=r;if(r.done){S.pack.say=0;Snd.fx('star');const p=P0();if(!p.pk.includes(t.id)){p.pk.push(t.id);calcStars(p);saveDB()}}else Snd.fx('bad')}break;
  case'pcheck':S.pack.fb={kind:'good',text:'Great speaking!'};Snd.fx('star');break;
  case'pnext':{const t=TRIPS[S.pack.i],lines=packLines(S.pack.packed,t,lvl());S.pack.fb=null;if(S.pack.say+1<lines.length)S.pack.say++;else{const n=(S.pack.i+1)%TRIPS.length;Object.assign(S.pack,{i:n,packed:[],res:null,say:-1,fb:null})}}break;
  /* check */
  case'cstart':S.chk=makeQuiz();Snd.fx('tap');break;
  case'cpick':checkPick(id);break;
  case'cnext':checkNext();break;
  /* students */
  case'pickstu':DB.current=id;saveDB();S.rep.fb=null;S.chk=null;break;
  case'rename':{const n=($('#stname').value||'').trim().slice(0,24);if(n){stu().name=n;saveDB();toast('Name saved.')}}break;
  case'addstu':{const n=DB.students.length+1;let nid='s'+Date.now().toString(36);DB.students.push({id:nid,name:'Student '+n});DB.prog[nid]=newProg();DB.current=nid;saveDB();S.chk=null;}break;
  case'delstu':{const s=stu();if(DB.students.length<2)break;if(confirm('Delete '+s.name+' and their progress?')){DB.students=DB.students.filter(x=>x.id!==s.id);delete DB.prog[s.id];DB.current=DB.students[0].id;saveDB();S.chk=null}}break;
  case'export':{const b=new Blob([exportJSON()],{type:'application/json'}),a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='weather-closet-backup.json';document.body.appendChild(a2);a2.click();setTimeout(()=>{URL.revokeObjectURL(a2.href);a2.remove()},500);toast('Backup downloaded.');return}
  case'import':{const f=$('#impf');if(f)f.click();return}
  case'resetp':if(confirm('Reset all progress for '+stu().name+'?')){DB.prog[DB.current]=newProg();saveDB();S.chk=null}break;
  case'recstart':case'recstop':case'recplay':case'recdel':recAction(a,el.dataset.key);return;
 }
 render();
}
document.addEventListener('click',e=>{
 if(window._noclick){return}
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 Snd.init();Snd.resume();act(el.dataset.act,el,e);
});

 if(e.target.id==='impf'&&e.target.files[0]){const rd=new FileReader();rd.onload=()=>{try{importJSON(rd.result);S.chk=null;toast('Backup imported.');render()}catch(er){toast(er.message||'Could not import this file.')}};rd.readAsText(e.target.files[0])}

/* ---------- drag and drop (pointer events: mouse, touch, pen) ---------- */
let drag=null;
function ghostEl(id){const g=document.createElement('div');g.className='dragghost';g.innerHTML=icoI(id);document.body.appendChild(g);return g}
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('.cl-item');if(!el||(e.pointerType==='mouse'&&e.button!==0))return;
 drag={id:el.dataset.id,x:e.clientX,y:e.clientY,on:false,g:null};
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.on&&Math.hypot(dx,dy)>8){drag.on=true;drag.g=ghostEl(drag.id);document.body.classList.add('dragging')}
 if(drag.on){e.preventDefault();drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest('[data-drop]');$$('[data-drop]').forEach(n=>n.classList.toggle('over',n===z))}
},{passive:false});
function endDrag(e,cancel){
 if(!drag)return;const d=drag;drag=null;
 if(d.on){document.body.classList.remove('dragging');d.g&&d.g.remove();$$('[data-drop]').forEach(n=>n.classList.remove('over'));
  window._noclick=true;setTimeout(()=>{window._noclick=false},60);
  if(!cancel){const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest('[data-drop]');
   if(z){Snd.init();Snd.resume();if(z.dataset.drop==='stand'&&S.step===3&&!S.dress.worn.includes(d.id))wearItem(d.id,true);else if(z.dataset.drop==='case'&&S.step===4)packItem(d.id,true);render()}}}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target,tag=tg&&tg.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
 const k=e.key;
 if(k==='Escape'){if(S.cert){S.cert=false;render()}else if(S.drawer){S.drawer=false;render()}return}
 if(/^[1-5]$/.test(k)){go('step',+k);return}
 const lk=k.toLowerCase();
 if(lk==='l'){DB.settings.level=lvl()%3+1;saveDB();render();return}
 if(lk==='u'){DB.settings.unit=unit()==='F'?'C':'F';saveDB();render();return}
 if(lk==='m'){act('sound',document.body);return}
 if(lk==='f'){act('full',document.body);return}
 if(lk==='t'){S.drawer=!S.drawer;render();return}
 if(lk==='h'){act('home',document.body);return}
 if(S.screen!=='step'&&S.screen!=='station')return;
 if(k==='ArrowRight'||k==='ArrowLeft'){const r=k==='ArrowRight';
  if(S.screen==='station'){const i=WEATHERS.indexOf(S.station.w);S.station.w=WEATHERS[(i+(r?1:8))%9];render();return}
  if(S.step===2){S.rep.i=Math.max(0,Math.min(8,S.rep.i+(r?1:-1)));S.rep.show=false;S.rep.fb=null;render()}
  else if(S.step===3){S.dress.custom=null;S.dress.i=(S.dress.i+(r?1:8))%9;Object.assign(S.dress,{worn:[],msg:null,hint:false,done:false,fb:null,hist:[]});render()}
  else if(S.step===4){Object.assign(S.pack,{i:(S.pack.i+(r?1:7))%8,packed:[],res:null,say:-1,fb:null});render()}
  return}
 if(k===' '&&(tag==='BODY'||tg===$('#main'))){e.preventDefault();
  let t='';if(S.step===2&&S.screen==='step')t=plain(REPORT[lvl()][SCEN[S.rep.i].w]);else if(S.step===3&&S.screen==='step')t=dressFrames(S.dress.worn,curScen().w,lvl()).join(' ').replace(/____/g,'blank');else if(S.screen==='station')t=`It's ${S.station.w}.`;
  if(t)Voice.say(t,.88);return}
 if(k==='Enter'&&(tag==='BODY'||tg===$('#main'))&&S.screen==='step'){if(S.step===2)act('rcheck',document.body);else if(S.step===3)act('dcheck',document.body);else if(S.step===4&&S.pack.res&&S.pack.res.done)act('pcheck',document.body)}
});
document.addEventListener('fullscreenchange',()=>render());
window.onVoiceFail=()=>render();

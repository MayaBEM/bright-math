tural, polite way to accept an apology in English.`,`Wrong — "You're welcome" is a reply to "thank you," not to an apology.`,`Wrong — "Nice to meet you too" is used when being introduced to someone, not after an apology.`,`Wrong — "I don't think so" disagrees with a statement or opinion; it doesn't fit as a response to an apology.`],hints:[`Think about what phrase naturally follows an apology.`,`Match the correct response type to the situation — this is an apology, not a thank-you or introduction.`,`'You're welcome' replies to 'thank you,' not to an apology, so that's wrong.`],hint3EliminateIndex:1,tags:[`functional`,`social-language`,`dialogue`]}],Dh=[{id:`MT3-Q01`,testId:`mock-test-3`,section:`Signs and Notices`,order:1,skill:`Understanding conditions in notices`,skillTag:`signs`,difficulty:`Standard Plus`,instruction:`Read the notice and choose the best answer to the question.`,stimulus:{type:`notice`,title:`Silent Study Room — Rules`,lines:[`This room is for silent, individual study only.`,`Group discussion is not allowed here, unless you have booked the Group Study Pod on the second floor.`,`Food and drinks (except water) are not permitted.`,`Please switch mobile phones to silent mode before entering.`],footer:`Thank you for helping others concentrate.`,badge:`Level 1 — Quiet Zone`},question:`According to the notice, when IS group discussion allowed in this room?`,options:[`Only after 6 p.m.`,`If students have booked the Group Study Pod on the second floor`,`Only during exam week`,`Never, under any circumstances`],correctAnswer:1,explanationEnglish:`The word 'unless' introduces an exception to a rule. The rule here is 'no group discussion', and the exception is 'if you have booked the Group Study Pod'. So discussion is allowed only under that one condition.`,explanationThai:`คำว่า 'unless' แปลว่า 'เว้นแต่' หรือ 'ถ้าไม่' ใช้บอกข้อยกเว้นของกฎ กฎหลักคือห้ามคุยกันในห้องนี้ ส่วนข้อยกเว้นคือถ้านักเรียนได้จองห้องกลุ่มไว้แล้วเท่านั้นถึงจะคุยกันได้`,keyClue:`unless`,optionExplanations:[`The notice does not mention any time restriction like this.`,`Correct — the notice states discussion is allowed only with a booked Group Study Pod upstairs.`,`Exam week is not mentioned anywhere in the notice.`,`Incorrect — the notice gives one clear exception, so it isn't 'never'.`],hints:[`Look for the word that introduces an exception to the main rule.`,`'Unless' means 'except if' — it tells you when the rule does NOT apply.`,`The notice never mentions exam week, so that can't be right.`],hint3EliminateIndex:2,vocabulary:[{term:`unless`,meaningEnglish:`except if; on the condition that not`,meaningThai:`เว้นแต่ / ถ้าไม่`}],tags:[`signs`,`notices`,`conditions`,`library`]},{id:`MT3-Q02`,testId:`mock-test-3`,section:`Signs and Notices`,order:2,skill:`Understanding rules in signs`,skillTag:`signs`,difficulty:`Standard Plus`,instruction:`Read the sign and choose the best answer to the question.`,stimulus:{type:`sign`,heading:`EXAMINATION IN PROGRESS`,body:`Please remain quiet in this corridor. Latecomers may enter only during the first fifteen minutes of the test.`,tone:`warning`,location:`Outside Examination Hall B`,icon:`quiet`},question:`What does the sign say about students who arrive late?`,options:[`They may enter at any time during the test.`,`They are not allowed to take the test at all.`,`They may enter only within the first fifteen minutes.`,`They must wait outside until the next test.`],correctAnswer:2,explanationEnglish:`The phrase 'only during the first fifteen minutes' sets a strict time limit — after that window closes, latecomers may not enter the exam room.`,explanationThai:`วลี 'only during the first fifteen minutes' หมายถึงมีเวลาจำกัดเฉพาะ 15 นาทีแรกเท่านั้น หลังจากนั้นนักเรียนที่มาสายจะเข้าห้องสอบไม่ได้อีก`,keyClue:`only during the first fifteen minutes`,optionExplanations:[`The sign limits late entry to a specific time window, not 'any time'.`,`The sign doesn't ban latecomers completely — it gives a time limit instead.`,`Correct — the sign states latecomers may enter only during the first fifteen minutes.`,`The sign never mentions waiting for 'the next test'.`],hints:[`Focus on the time expression in the second sentence.`,`'Only during X' means entry is restricted to that time period alone.`,`The sign never mentions 'the next test', so that option is not supported.`],hint3EliminateIndex:3,tags:[`signs`,`exam-rules`,`time-limits`]},{id:`MT3-Q03`,testId:`mock-test-3`,section:`Vocabulary in Context`,order:3,skill:`Verb-noun collocations`,skillTag:`vocabulary`,difficulty:`Standard Plus`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`Before the school trip, our teacher asked us to ______ a list of everything we needed to pack.`,options:[`do`,`make`,`take`,`have`],correctAnswer:1,explanationEnglish:`Some words are always used together — these fixed pairs are called collocations. 'List' collocates with 'make', as in 'make a list', 'make a plan', or 'make a decision'.`,explanationThai:`บางคำในภาษาอังกฤษต้องใช้คู่กับกริยาเฉพาะที่ตายตัว เรียกว่า collocation คำว่า 'list' จะใช้คู่กับ 'make' เช่น make a list, make a plan, make a decision`,keyClue:`make a list (collocation)`,optionExplanations:[`'Do a list' is not correct English — 'do' collocates with tasks or duties, not with 'list'.`,`Correct — 'make a list' is the standard collocation for creating a list.`,`'Take a list' does not fit the meaning of creating a list from nothing.`,`'Have a list' would mean already possessing one, not creating it — the sentence is about making a new one.`],hints:[`Think about which verb regularly pairs with the noun 'list'.`,`Certain nouns 'attach' to specific verbs — these fixed pairs are called collocations.`,`'Have a list' would mean you already own one, but the sentence is about creating a new one.`],hint3EliminateIndex:3,vocabulary:[{term:`make a list`,meaningEnglish:`to write down a series of items`,meaningThai:`ทำ/จดรายการ`}],tags:[`vocabulary`,`collocations`]},{id:`MT3-Q04`,testId:`mock-test-3`,section:`Vocabulary in Context`,order:4,skill:`Attitude adjectives in context`,skillTag:`vocabulary`,difficulty:`Standard Plus`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`Even though Ben had never tried Thai food before, he smiled happily and said he was ______ to taste everything on the table.`,options:[`reluctant`,`hesitant`,`nervous`,`eager`],correctAnswer:3,explanationEnglish:`Attitude adjectives carry emotional meaning. A positive body-language clue like 'smiled happily' points to a positive-attitude adjective such as 'eager', not a negative one like 'reluctant' or 'nervous'.`,explanationThai:`คำคุณศัพท์ที่บอกความรู้สึกต้องเลือกให้เข้ากับบรรยากาศของประโยค เมื่อประโยคบอกว่ายิ้มอย่างมีความสุข ('smiled happily') ต้องเลือกคำที่มีความหมายเชิงบวก เช่น 'eager' ไม่ใช่คำเชิงลบอย่าง 'reluctant' หรือ 'nervous'`,keyClue:`smiled happily`,optionExplanations:[`'Reluctant' means unwilling — this contradicts his happy smile.`,`'Hesitant' means unsure or slow to act — this doesn't match his enthusiastic smile.`,`'Nervous' suggests worry, which doesn't fit someone smiling happily.`,`Correct — 'eager' means very keen and enthusiastic, matching his happy smile and willingness to try everything.`],hints:[`Look at how Ben reacted — what does his body language tell you about his feeling?`,`Match the tone of the adjective to the tone of the surrounding sentence — happy body language needs a positive adjective.`,`'Reluctant' describes unwillingness, which doesn't fit a happy smile.`],hint3EliminateIndex:0,vocabulary:[{term:`eager`,meaningEnglish:`very keen and enthusiastic to do something`,meaningThai:`กระตือรือร้น`}],tags:[`vocabulary`,`attitude-adjectives`]},{id:`MT3-Q05`,testId:`mock-test-3`,section:`Vocabulary in Context`,order:5,skill:`Word choice in context`,skillTag:`vocabulary`,difficulty:`Standard Plus`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`The museum guide asked us to ______ our voices when we entered the ancient artifacts room, because loud noise could disturb other visitors.`,options:[`rise`,`raise`,`lower`,`increase`],correctAnswer:2,explanationEnglish:`The phrase 'lower your voice' is a fixed expression meaning 'speak more quietly'. The reason given after 'because' signals we need the opposite of loud, so 'lower' fits while 'raise' and 'increase' do not.`,explanationThai:`'lower your voice' เป็นวลีที่แปลว่าพูดเบาลง ส่วนเหตุผลที่ให้มาคือ 'เสียงดังอาจรบกวนผู้อื่น' ซึ่งบอกใบ้ว่าต้องการคำที่มีความหมายตรงข้ามกับเสียงดัง จึงต้องใช้ 'lower' ไม่ใช่ 'raise' หรือ 'increase'`,keyClue:`loud noise could disturb`,optionExplanations:[`'Rise' is an intransitive verb and cannot take a direct object like 'voices' — this is grammatically wrong here.`,`'Raise' means to make something louder or higher — the opposite of what the guide wants.`,`Correct — 'lower your voice' means to speak more quietly, matching the context of not disturbing others.`,`'Increase' means to make bigger or louder — the opposite of the intended meaning.`],hints:[`Read the reason given after 'because' — it tells you the opposite feeling to look for.`,`'Raise' and 'lower' are commonly confused — 'raise' means increase, 'lower' means decrease.`,`'Rise' cannot be followed directly by an object like 'voices', so it's grammatically impossible here.`],hint3EliminateIndex:0,tags:[`vocabulary`,`word-choice`]},{id:`MT3-Q06`,testId:`mock-test-3`,section:`Grammar and Usage`,order:6,skill:`Present perfect vs past simple`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Choose the option that best completes the sentence.`,stimulus:{type:`none`},question:`A: Have you finished the science project yet? B: Yes, I ______ it last night, actually.`,options:[`have finished`,`finished`,`had finished`,`was finishing`],correctAnswer:1,explanationEnglish:`Present perfect is used for actions without a specific finished time ('yet', 'already', 'ever'), while past simple is used with a specific past time expression like 'last night', 'yesterday', or 'in 2020'.`,explanationThai:`Present perfect ใช้กับเหตุการณ์ที่ไม่ระบุเวลาชัดเจนในอดีต (เช่น yet, already, ever) ส่วน past simple ใช้กับเวลาที่ระบุชัดเจนในอดีต เช่น 'last night', 'yesterday'`,keyClue:`last night`,optionExplanations:[`'Have finished' (present perfect) doesn't combine with a specific past time expression like 'last night'.`,`Correct — 'last night' is a definite, finished past time, so past simple ('finished') is correct.`,`Past perfect ('had finished') shows an action before another past action, but there's no second past event here.`,`Past continuous ('was finishing') suggests an interrupted or ongoing action, not a completed one.`],hints:[`Look for a specific time expression at the end of B's answer.`,`Present perfect never combines with a definite past time word like 'last night' or 'yesterday'.`,`There's no earlier past event mentioned, so the past perfect ('had finished') doesn't fit.`],hint3EliminateIndex:2,grammarRule:`Use past simple with specific past time expressions (yesterday, last night); use present perfect for unspecified past time (yet, already, ever, just).`,tags:[`grammar`,`tense-contrast`,`present-perfect`]},{id:`MT3-Q07`,testId:`mock-test-3`,section:`Grammar and Usage`,order:7,skill:`too vs enough`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Choose the option that best completes the sentence.`,stimulus:{type:`none`},question:`The soup was ______ hot for the little boy to eat, so his mother waited a few minutes before giving it to him.`,options:[`too`,`enough`,`so`,`very`],correctAnswer:0,explanationEnglish:`'Too + adjective + to + verb' expresses that something is excessive, preventing an action. 'Enough' follows the adjective in the same structure ('hot enough to eat') and shows a sufficient degree instead.`,explanationThai:`โครงสร้าง 'too + คำคุณศัพท์ + for someone + to + กริยา' ใช้บอกว่าสิ่งนั้นมากเกินไปจนทำให้ทำอะไรบางอย่างไม่ได้ ต่างจาก 'enough' ที่ต้องวางหลังคำคุณศัพท์และมีความหมายว่าเพียงพอ`,keyClue:`for the little boy to eat`,optionExplanations:[`Correct — 'too + adjective + for someone + to' shows the soup was hot beyond an acceptable degree, preventing the action.`,`'Enough' would need to come after the adjective ('hot enough'), and it would mean the opposite (sufficient, not excessive).`,`'So hot' needs a 'that' clause ('so hot that he couldn't eat it'), not an infinitive 'to eat'.`,`'Very hot' is grammatically possible, but it doesn't explain WHY his mother waited — 'too' shows a negative result.`],hints:[`Notice the structure '____ + adjective + for someone + to + verb'.`,`'Too' shows an excessive degree that stops an action; 'enough' comes AFTER the adjective and shows a sufficient degree.`,`'Enough' cannot go before the adjective in this pattern, so word order rules it out.`],hint3EliminateIndex:1,vocabulary:[{term:`too + adjective + to`,meaningEnglish:`more than needed or wanted, preventing something`,meaningThai:`...เกินไปจนทำให้ไม่สามารถ...`}],grammarRule:`too + adjective + (for someone) + to + verb = excessive, negative result. adjective + enough + (for someone) + to + verb = sufficient, positive result.`,tags:[`grammar`,`too-enough`,`adjective-patterns`]},{id:`MT3-Q08`,testId:`mock-test-3`,section:`Grammar and Usage`,order:8,skill:`Gerunds after stop`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Choose the option that best completes the sentence.`,stimulus:{type:`none`},question:`My little sister still can't stop ______ about her class trip to the zoo — she's told the story five times already!`,options:[`talk`,`to talk`,`talking`,`talked`],correctAnswer:2,explanationEnglish:`'Stop + gerund (-ing)' means to end an activity you are already doing. 'Stop + infinitive (to + verb)' means to pause one activity in order to do another. Since the sister keeps talking, we need the gerund form.`,explanationThai:`'stop + Ving' หมายถึงการหยุดสิ่งที่กำลังทำอยู่ ส่วน 'stop + to + กริยา' หมายถึงการหยุดเพื่อไปทำอีกอย่างหนึ่ง เนื่องจากน้องสาวพูดไม่หยุดอยู่แล้ว จึงต้องใช้ 'stop talking'`,keyClue:`can't stop`,optionExplanations:[`A bare verb like 'talk' cannot follow 'stop' directly without 'to' or '-ing'.`,`'Stop to talk' would mean 'pause in order to talk' — a different meaning from what the sentence intends.`,`Correct — 'stop + verb-ing' means to end an action that is already happening (she can't end her talking).`,`'Talked' is a past tense form and cannot follow 'stop' directly.`],hints:[`Think about whether the sister is currently doing the talking, or pausing to do something else.`,`'Stop doing something' means ending an ongoing action; 'stop to do something' means pausing for a new purpose.`,`A bare verb like 'talk' can never directly follow 'stop' without 'to' or '-ing'.`],hint3EliminateIndex:0,grammarRule:`stop + -ing = end an ongoing activity; stop + to + verb = pause to do something else.`,tags:[`grammar`,`gerunds`,`verb-patterns`]},{id:`MT3-Q09`,testId:`mock-test-3`,section:`Grammar and Usage`,order:9,skill:`Modal verbs for advice`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Choose the option that best completes the sentence.`,stimulus:{type:`none`},question:`You ______ bring your umbrella tomorrow — the weather forecast says it will definitely rain all day.`,options:[`might`,`should`,`may`,`could`],correctAnswer:1,explanationEnglish:`'Should' is the modal verb used for giving advice or recommendations. Since the forecast is certain ('definitely'), the speaker is confidently recommending an action, which calls for 'should' rather than a possibility modal like 'might', 'may', or 'could'.`,explanationThai:`'should' ใช้ให้คำแนะนำหรือคำแนะนำที่หนักแน่น เมื่อพยากรณ์อากาศบอกว่าฝนจะตกแน่นอน ('definitely') ประโยคจึงต้องการคำแนะนำที่มั่นใจ ไม่ใช่คำที่บอกความเป็นไปได้อย่าง 'might/may/could'`,keyClue:`the weather forecast says it will definitely rain`,optionExplanations:[`'Might' expresses a weak possibility, not advice — it doesn't match the certainty of 'definitely'.`,`Correct — 'should' is used to give strong advice or a recommendation, which fits a confident weather forecast.`,`'May' expresses possibility or permission, not advice, so it doesn't fit this context.`,`'Could' expresses ability or a weak possibility, not a recommendation.`],hints:[`Decide whether the sentence is giving advice or just describing a possibility.`,`'Should' means advice or recommendation; 'might/may/could' mean possibility, not certainty.`,`'May' is mainly used for permission or possibility, not for giving strong advice.`],hint3EliminateIndex:2,vocabulary:[{term:`should`,meaningEnglish:`used to give advice or a recommendation`,meaningThai:`ควรจะ (ใช้แนะนำ)`}],grammarRule:`Should = advice/recommendation. Might/May/Could = possibility (varying degrees), not advice.`,tags:[`grammar`,`modal-verbs`,`advice`]},{id:`MT3-Q10`,testId:`mock-test-3`,section:`Grammar and Usage`,order:10,skill:`First conditional`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Choose the option that best completes the sentence.`,stimulus:{type:`none`},question:`If it ______ raining before five o'clock, we will still go ahead with the outdoor sports day.`,options:[`doesn't stop`,`won't stop`,`didn't stop`,`hasn't stopped`],correctAnswer:0,explanationEnglish:`The first conditional describes a real, possible future situation: 'If + present simple, ... will + base verb'. The main clause 'we will still go ahead' shows this is first conditional, so the if-clause must use present simple, not future or past forms.`,explanationThai:`First conditional มีโครงสร้าง 'If + present simple, ... will + กริยาช่องที่ 1' ใช้พูดถึงสถานการณ์ในอนาคตที่มีความเป็นไปได้จริง ประโยคหลักใช้ 'will' แสดงว่าเป็น first conditional จึงต้องใช้ present simple ในประโยคเงื่อนไข`,keyClue:`we will still go ahead`,optionExplanations:[`Correct — in first conditional sentences, the 'if' clause uses present simple, even though it refers to the future.`,`'Won't stop' (future) cannot be used in the if-clause of a first conditional sentence.`,`'Didn't stop' (past simple) doesn't fit — the sentence is about a real future possibility, not the past.`,`'Hasn't stopped' (present perfect) doesn't fit the standard first conditional pattern of 'if + present simple'.`],hints:[`Look at the verb form used in the main clause after 'we'.`,`First conditional pattern: If + present simple, ... + will + base verb.`,`The if-clause of a first conditional never uses 'will', so the future form is impossible here.`],hint3EliminateIndex:1,grammarRule:`First conditional: If + present simple, ... will + base verb — used for real, possible future situations.`,tags:[`grammar`,`first-conditional`,`future`]},{id:`MT3-Q11`,testId:`mock-test-3`,section:`Grammar and Usage`,order:11,skill:`Question tags`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Choose the option that best completes the sentence.`,stimulus:{type:`none`},question:`Your parents haven't seen your report card yet, ______?`,options:[`haven't they`,`have they`,`don't they`,`do they`],correctAnswer:1,explanationEnglish:`Question tags follow the rule: negative statement + positive tag, and positive statement + negative tag. The tag must also repeat the same auxiliary verb used in the main sentence — here, 'have'.`,explanationThai:`Question tag มีกฎว่า ประโยคปฏิเสธต้องตามด้วย tag บวก และ tag ต้องใช้กริยาช่วยตัวเดียวกับประโยคหลัก ในที่นี้ประโยคใช้ 'haven't' จึง tag ต้องเป็น 'have they'`,keyClue:`haven't seen`,optionExplanations:[`The main sentence is negative ('haven't seen'), so the tag must be positive — 'haven't they' is also negative, which is wrong.`,`Correct — a negative statement takes a positive tag, and the auxiliary verb 'have' matches the main verb 'haven't seen'.`,`'Don't they' uses the wrong auxiliary verb — the sentence uses 'have', not 'do'.`,`'Do they' also uses the wrong auxiliary — it should match 'have', not 'do'.`],hints:[`Check whether the main sentence is positive or negative — the tag should be the opposite.`,`Question tags repeat the same auxiliary verb as the main sentence (here, 'have/has').`,`'Don't they' uses the auxiliary 'do', which doesn't match 'have' used in the sentence.`],hint3EliminateIndex:2,grammarRule:`Question tags: negative statement leads to a positive tag (and vice versa); the tag repeats the main sentence's auxiliary verb.`,tags:[`grammar`,`question-tags`]},{id:`MT3-Q12`,testId:`mock-test-3`,section:`Everyday Conversation`,order:12,skill:`Making plans / suggesting alternatives`,skillTag:`conversation`,difficulty:`Standard Plus`,instruction:`Read the dialogue and choose the best response.`,stimulus:{type:`dialogue`,setting:`Two classmates talking at lunchtime`,lines:[{speaker:`Ploy`,text:`Are you free this Saturday? I want to go to the new science museum downtown.`},{speaker:`Nick`,text:`I'd love to, but I promised to help my dad clean the garage in the morning.`},{speaker:`Ploy`,text:`No problem — ______`}]},question:`What is the best way for Ploy to complete her response, keeping the plan alive?`,options:[`so let's just forget about it then.`,`why don't we go in the afternoon instead?`,`you should have told me earlier.`,`I don't really want to go anyway.`],correctAnswer:1,explanationEnglish:`'No problem' signals that Ploy is staying positive and looking for a solution, not giving up. The natural next step in a planning conversation is to suggest an alternative — here, a different time of day.`,explanationThai:`คำว่า 'No problem' แสดงว่า Ploy ยังคิดบวกและอยากหาทางแก้ปัญหา ไม่ใช่ยอมแพ้ ขั้นตอนต่อไปที่เป็นธรรมชาติในบทสนทนาวางแผนคือการเสนอทางเลือกใหม่ เช่น เปลี่ยนเวลา`,keyClue:`No problem`,optionExplanations:[`This gives up on the plan entirely, but 'No problem' suggests Ploy wants to find a solution, not cancel.`,`Correct — this offers an alternative time that works around Nick's morning commitment, matching the friendly, solution-focused tone of 'No problem'.`,`This sounds like a complaint or criticism, which doesn't match the friendly tone of 'No problem'.`,`This contradicts Ploy's earlier enthusiasm about going to the museum.`],hints:[`Think about what 'No problem' signals about Ploy's attitude toward the change of plan.`,`In planning conversations, a positive response to an obstacle is often followed by an alternative suggestion.`,`Option D contradicts what Ploy said earlier about wanting to go, so it can't be right.`],hint3EliminateIndex:3,tags:[`conversation`,`making-plans`,`tone`]},{id:`MT3-Q13`,testId:`mock-test-3`,section:`Everyday Conversation`,order:13,skill:`Apologizing and taking responsibility`,skillTag:`conversation`,difficulty:`Standard Plus`,instruction:`Read the dialogue and choose the best response.`,stimulus:{type:`dialogue`,setting:`A student speaking to her teacher after class`,lines:[{speaker:`Fah`,text:`Ms. Anong, I'm really sorry I forgot to bring my permission slip today.`},{speaker:`Teacher`,text:`That's the third time this month, Fah. This is becoming a habit.`},{speaker:`Fah`,text:`______`}]},question:`Which response best shows Fah taking responsibility, not just apologizing again?`,options:[`I know, I'm sorry. I'll put a reminder on my phone tonight so it won't happen again.`,`Sorry, but my mom always forgets to sign it, not me.`,`It's not a big deal, I'll bring it eventually.`,`Everyone forgets things sometimes, Ms. Anong.`],correctAnswer:0,explanationEnglish:`Taking responsibility means acknowledging the issue and offering a concrete solution, not just repeating 'sorry' or blaming someone else. The teacher's comment about a 'habit' calls for a response that shows real change.`,explanationThai:`การแสดงความรับผิดชอบที่แท้จริงคือการยอมรับปัญหาและเสนอวิธีแก้ไขที่ชัดเจน ไม่ใช่แค่ขอโทษซ้ำๆ หรือโยนความผิดให้คนอื่น`,keyClue:`This is becoming a habit`,optionExplanations:[`Correct — this acknowledges the problem, apologizes, and offers a specific plan to prevent it from happening again.`,`This shifts the blame onto her mother instead of taking responsibility.`,`This dismisses the teacher's concern rather than addressing it seriously.`,`This generalizes the problem instead of addressing Fah's own repeated mistake.`],hints:[`Look for the response that offers an actual solution, not just another apology.`,`Taking responsibility means owning the mistake and showing a plan to fix it, not blaming others.`,`Blaming her mother avoids responsibility, so that option doesn't fit what the teacher is asking for.`],hint3EliminateIndex:1,tags:[`conversation`,`apologizing`,`responsibility`]},{id:`MT3-Q14`,testId:`mock-test-3`,section:`Everyday Conversation`,order:14,skill:`Asking for and giving directions`,skillTag:`conversation`,difficulty:`Standard Plus`,instruction:`Read the exchange and choose the best response.`,stimulus:{type:`none`},question:`Tourist: "Excuse me, could you tell me how to get to the nearest post office?" Local: "______"`,options:[`Yes, I could tell you.`,`Sure, go straight ahead and turn left at the traffic lights.`,`I don't know how to get anywhere.`,`It's a good idea to ask someone else.`],correctAnswer:1,explanationEnglish:`'Could you tell me...' is a polite request for information, not a literal yes/no question. A natural, helpful response gives the actual directions rather than commenting on the ability to tell them.`,explanationThai:`'Could you tell me...?' เป็นการขอข้อมูลอย่างสุภาพ ไม่ใช่คำถามใช่/ไม่ใช่ตามตัวอักษร คำตอบที่เป็นธรรมชาติคือการให้ทิศทางจริงๆ`,keyClue:`could you tell me how to get to`,optionExplanations:[`This literally answers the 'could you' question instead of giving directions — an overly literal, unhelpful reply.`,`Correct — this gives real, useful directions in response to the request for help.`,`This is unhelpful and doesn't match how a local would respond when asked for directions.`,`This deflects instead of helping, which doesn't fit the polite request.`],hints:[`Think about what the tourist actually wants — information, not a yes/no answer.`,`'Could you...?' is a polite request form; the expected reply directly provides what was asked for.`,`Saying 'I don't know how to get anywhere' is oddly unhelpful and unrealistic for someone being asked directions.`],hint3EliminateIndex:2,tags:[`conversation`,`directions`,`polite-requests`]},{id:`MT3-Q15`,testId:`mock-test-3`,section:`Everyday Conversation`,order:15,skill:`Agreeing and disagreeing on the phone`,skillTag:`conversation`,difficulty:`Standard Plus`,instruction:`Read the dialogue and choose the best response.`,stimulus:{type:`dialogue`,setting:`A phone call between two friends about a group project`,lines:[{speaker:`Arm`,text:`I think we should present our project first, before the other groups get nervous and rush us.`},{speaker:`Beam`,text:`Hmm, ______. If we go last, we'll have more time to prepare.`}]},question:`Which phrase best fits the blank in Beam's line?`,options:[`I totally agree with you`,`that's exactly what I was thinking`,`I'm not so sure about that`,`you're absolutely right`],correctAnswer:2,explanationEnglish:`The word 'Hmm' followed by a contrasting idea ('If we go last...') signals disagreement. Polite disagreement in English often starts with a softening phrase like 'I'm not so sure about that' rather than a blunt 'No'.`,explanationThai:`คำว่า 'Hmm' ตามด้วยประโยคที่ขัดแย้งกัน ('ถ้าไปทีหลังจะมีเวลาเตรียมตัวมากกว่า') เป็นสัญญาณของการไม่เห็นด้วย การไม่เห็นด้วยอย่างสุภาพในภาษาอังกฤษมักเริ่มด้วยวลีลดความรุนแรง เช่น 'I'm not so sure about that' แทนที่จะพูดปฏิเสธตรงๆ`,keyClue:`Hmm ... If we go last, we'll have more time to prepare`,optionExplanations:[`This shows agreement, but the following sentence gives a reason to go last — the opposite of Arm's suggestion.`,`This also shows agreement, contradicting the reason given afterward for preferring to go last.`,`Correct — 'I'm not so sure about that' politely signals disagreement, matching the following sentence that argues for a different plan.`,`This shows strong agreement, which contradicts the disagreement expressed in the next sentence.`],hints:[`Look at what Beam says right after the blank — does it support or contradict Arm's idea?`,`'Hmm' at the start of a reply often signals hesitation or disagreement is coming.`,`'You're absolutely right' shows full agreement, which doesn't match the contrasting idea that follows.`],hint3EliminateIndex:3,tags:[`conversation`,`agreeing-disagreeing`,`telephone`]},{id:`MT3-Q16`,testId:`mock-test-3`,section:`Cloze Dialogue or Short Message`,order:16,skill:`Present perfect in context`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Read the message and choose the best word to complete blank (16).`,stimulus:{type:`message`,channel:`text`,from:`Preem`,to:`Tar`,body:[`Hey Tar! Are you still coming to my birthday party on Saturday?`,`I ___(16)___ the invitations to everyone in our class already, so most people know the time now.`,`Could you also bring your speaker? Mine is ___(17)___ broken, so we won't have any music without yours.`,`By the way, if it rains, we ___(18)___ move the party inside my house instead.`,`Let me know soon — thanks so much!`]},question:`Choose the best word to complete blank (16).`,options:[`send`,`sent`,`have sent`,`was sending`],correctAnswer:2,explanationEnglish:`'Already' is commonly used with present perfect to show an action completed at an unspecified time before now, with a present result. Since no specific past time is given, present perfect ('have sent') fits best.`,explanationThai:`คำว่า 'already' มักใช้คู่กับ present perfect เพื่อแสดงว่าเหตุการณ์เสร็จสิ้นไปแล้วในเวลาที่ไม่ระบุชัดเจน และยังมีผลต่อเนื่องถึงปัจจุบัน เนื่องจากไม่มีการระบุเวลาที่ชัดเจนในอดีต จึงควรใช้ 'have sent'`,keyClue:`already ... so most people know the time now`,optionExplanations:[`'Send' is the base form and can't stand alone as the main verb after 'I' without an auxiliary.`,`'Sent' (past simple) is possible informally, but 'already' more naturally pairs with present perfect here.`,`Correct — 'have sent ... already' is present perfect, showing a completed action with present relevance.`,`'Was sending' (past continuous) suggests an interrupted, ongoing action, not a completed one.`],hints:[`Notice the word 'already' and the present-tense result described after it.`,`'Already' typically signals present perfect tense when there's no specific past time mentioned.`,`The base form 'send' cannot be the main verb by itself after 'I' — it needs an auxiliary.`],hint3EliminateIndex:0,grammarRule:`Present perfect (have/has + past participle) is used with 'already' to show a completed action with present relevance, when no specific past time is stated.`,tags:[`grammar`,`cloze`,`present-perfect`,`messages`]},{id:`MT3-Q17`,testId:`mock-test-3`,section:`Cloze Dialogue or Short Message`,order:17,skill:`Degree adverbs`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Read the message and choose the best word to complete blank (17).`,stimulus:{type:`message`,channel:`text`,from:`Preem`,to:`Tar`,body:[`Hey Tar! Are you still coming to my birthday party on Saturday?`,`I ___(16)___ the invitations to everyone in our class already, so most people know the time now.`,`Could you also bring your speaker? Mine is ___(17)___ broken, so we won't have any music without yours.`,`By the way, if it rains, we ___(18)___ move the party inside my house instead.`,`Let me know soon — thanks so much!`]},question:`Choose the best word to complete blank (17).`,options:[`completely`,`hardly`,`rarely`,`nearly`],correctAnswer:0,explanationEnglish:`Degree adverbs like 'completely', 'nearly', and 'hardly' show how much something applies. Since the result is 'no music without yours', the speaker must be totally unusable — 'completely' is the only word that matches.`,explanationThai:`คำวิเศษณ์บอกระดับ เช่น completely (สมบูรณ์), nearly (เกือบ), hardly (แทบจะไม่) ให้ความหมายต่างกัน เนื่องจากประโยคบอกว่าจะไม่มีเพลงเลยถ้าไม่มีลำโพงของเพื่อน แสดงว่าลำโพงเสียหายโดยสมบูรณ์ จึงต้องใช้ 'completely'`,keyClue:`we won't have any music without yours`,optionExplanations:[`Correct — 'completely broken' means totally unusable, matching 'we won't have any music without yours'.`,`'Hardly broken' would mean barely broken or almost working, which contradicts having no music at all.`,`'Rarely' means 'not often', which doesn't logically describe the state of being broken.`,`'Nearly broken' suggests it's not quite broken yet and might still work, contradicting 'we won't have any music'.`],hints:[`Check the consequence described after the blank — how badly broken must the speaker be?`,`Degree adverbs like 'completely' (100%), 'nearly' (almost, not yet), and 'hardly' (barely) show different amounts.`,`'Rarely' describes frequency (how often), not the condition of an object, so it doesn't fit here.`],hint3EliminateIndex:2,vocabulary:[{term:`completely`,meaningEnglish:`totally; in every way`,meaningThai:`อย่างสมบูรณ์/ทั้งหมด`}],grammarRule:`Degree adverbs like 'completely', 'nearly', and 'hardly' modify adjectives to show how much a quality applies.`,tags:[`grammar`,`cloze`,`degree-adverbs`,`messages`]},{id:`MT3-Q18`,testId:`mock-test-3`,section:`Cloze Dialogue or Short Message`,order:18,skill:`First conditional in context`,skillTag:`grammar`,difficulty:`Standard Plus`,instruction:`Read the message and choose the best word to complete blank (18).`,stimulus:{type:`message`,channel:`text`,from:`Preem`,to:`Tar`,body:[`Hey Tar! Are you still coming to my birthday party on Saturday?`,`I ___(16)___ the invitations to everyone in our class already, so most people know the time now.`,`Could you also bring your speaker? Mine is ___(17)___ broken, so we won't have any music without yours.`,`By the way, if it rains, we ___(18)___ move the party inside my house instead.`,`Let me know soon — thanks so much!`]},question:`Choose the best word to complete blank (18).`,options:[`would`,`might have`,`should have`,`will`],correctAnswer:3,explanationEnglish:`This is a first conditional sentence about a real, possible future situation (rain on the party day). The pattern is 'If + present simple, ... will + base verb', so 'will' is correct — not 'would' (hypothetical) or perfect modal forms (past reference).`,explanationThai:`ประโยคนี้เป็น first conditional พูดถึงเหตุการณ์ในอนาคตที่มีความเป็นไปได้จริง (ฝนอาจตกในวันงาน) จึงต้องใช้ 'will' ในประโยคหลัก ไม่ใช่ 'would' ซึ่งใช้กับเหตุการณ์สมมติที่ไม่น่าเป็นไปได้`,keyClue:`if it rains`,optionExplanations:[`'Would' is used in second conditional (hypothetical, unlikely situations), but this is a real possible future plan.`,`'Might have' + past participle refers to a past possibility, which doesn't fit a future plan.`,`'Should have' + past participle expresses regret about the past, which makes no sense for a future birthday party.`,`Correct — first conditional describes a real possible future event: 'if + present simple, ... will + base verb'.`],hints:[`Check whether this is about a realistic future possibility or an imaginary, unlikely one.`,`First conditional = If + present simple, ... will + base verb, for realistic future events.`,`'Should have' refers to past regret, which doesn't make sense for a future birthday party.`],hint3EliminateIndex:2,grammarRule:`First conditional: if + present simple, ... will + base verb — used for real, possible future events (contrast with second conditional 'would' for hypothetical situations).`,tags:[`grammar`,`cloze`,`first-conditional`,`messages`]},{id:`MT3-Q19`,testId:`mock-test-3`,section:`Reading Comprehension`,order:19,skill:`Identifying the main idea`,skillTag:`reading`,difficulty:`Standard Plus`,instruction:`Read the passage and answer the question.`,stimulus:{type:`passage`,title:`The Broken String`,paragraphs:[`Mali had dreamed of playing the violin in the school orchestra since she was eight years old. Every afternoon after school, she practiced in her bedroom until her fingers ached, determined to pass the audition for the annual spring concert.`,`On the morning of the audition, Mali arrived early, her violin case tucked under her arm. But just as she began to play her piece, one of the strings snapped with a sharp twang. The room went silent, and several students nearby began to whisper.`,`Instead of panicking, Mali borrowed a spare string from the music teacher, replaced it calmly, and started her piece again from the beginning. Her hands trembled slightly, but she finished the whole performance without another mistake.`,`Two days later, the results were posted outside the music room. Mali's name was at the top of the list. The teacher told her that her calm reaction to the broken string had impressed the judges even more than her playing.`],wordCount:162},question:`What is the main idea of this passage?`,options:[`A determined violinist stayed calm during a setback and still succeeded.`,`A music teacher taught her students how to fix broken violin strings.`,`A group of students whispered rudely during a violin performance.`,`A school orchestra needed a new violinist for its spring concert.`],correctAnswer:0,explanationEnglish:`The main idea is the central point the whole passage supports. Every paragraph connects to Mali's calm determination through a difficult moment — her practice, the broken string, her calm reaction, and her success — making that the main idea, not any single detail.`,explanationThai:`ใจความหลักคือประเด็นที่ทุกย่อหน้าในเรื่องสนับสนุน เรื่องราวทั้งหมดเชื่อมโยงกับความสงบและความมุ่งมั่นของ Mali เมื่อเจอปัญหาสายขาด ไม่ใช่รายละเอียดเล็กๆ น้อยๆ อย่างการกระซิบของเพื่อนหรือครูให้ยืมสาย`,keyClue:`impressed the judges even more than her playing`,optionExplanations:[`Correct — the whole passage centers on Mali's calm, determined response to her string breaking, which led to her success.`,`This is a minor detail (the teacher lent a string) but not what the passage is mainly about.`,`The whispering is a small detail showing other students' reaction, not the main idea.`,`The passage isn't about the orchestra's need for a violinist — it's about Mali's personal experience and reaction.`],hints:[`Ask yourself what point every paragraph in the passage supports.`,`The main idea covers the whole passage, not just one paragraph or detail.`,`The whispering students are mentioned only briefly and aren't the passage's focus.`],hint3EliminateIndex:2,tags:[`reading`,`main-idea`,`passage`]},{id:`MT3-Q20`,testId:`mock-test-3`,section:`Reading Comprehension`,order:20,skill:`Finding supporting details`,skillTag:`reading`,difficulty:`Standard Plus`,instruction:`Read the passage and answer the question.`,stimulus:{type:`passage`,title:`The Broken String`,paragraphs:[`Mali had dreamed of playing the violin in the school orchestra since she was eight years old. Every afternoon after school, she practiced in her bedroom until her fingers ached, determined to pass the audition for the annual spring concert.`,`On the morning of the audition, Mali arrived early, her violin case tucked under her arm. But just as she began to play her piece, one of the strings snapped with a sharp twang. The room went silent, and several students nearby began to whisper.`,`Instead of panicking, Mali borrowed a spare string from the music teacher, replaced it calmly, and started her piece again from the beginning. Her hands trembled slightly, but she finished the whole performance without another mistake.`,`Two days later, the results were posted outside the music room. Mali's name was at the top of the list. The teacher told her that her calm reaction to the broken string had impressed the judges even more than her playing.`],wordCount:162},question:`According to the passage, what did Mali do immediately after her string broke?`,options:[`She left the audition room in embarrassment.`,`She asked the judges for another audition date.`,`She continued playing on the broken string.`,`She borrowed a spare string from the music teacher and restarted her piece.`],correctAnswer:3,explanationEnglish:`This question asks for a specific detail directly stated in the text. Paragraph 3 clearly describes Mali's actions in order: she borrowed a string, replaced it, and restarted her piece.`,explanationThai:`คำถามนี้ถามหารายละเอียดที่ระบุไว้ตรงๆ ในเนื้อเรื่อง ย่อหน้าที่ 3 บอกไว้ชัดเจนว่า Mali ยืมสายไวโอลินสำรองจากครูดนตรีแล้วเริ่มเล่นเพลงใหม่ตั้งแต่ต้น`,keyClue:`borrowed a spare string from the music teacher`,optionExplanations:[`The passage doesn't say Mali left the room — she stayed calm and continued.`,`There is no mention of Mali requesting a new date; she handled the problem immediately.`,`The passage says she replaced the string, not that she kept playing on the broken one.`,`Correct — paragraph 3 states she borrowed a spare string from the teacher and started her piece again.`],hints:[`Reread paragraph 3 carefully for the exact sequence of Mali's actions.`,`Supporting-detail questions require you to find the exact information stated in the text, not guess.`,`The passage never mentions Mali asking for a new audition date.`],hint3EliminateIndex:1,tags:[`reading`,`supporting-detail`,`passage`]},{id:`MT3-Q21`,testId:`mock-test-3`,section:`Reading Comprehension`,order:21,skill:`Identifying writer's purpose`,skillTag:`reading`,difficulty:`Standard Plus`,instruction:`Read the passage and answer the question.`,stimulus:{type:`passage`,title:`The Broken String`,paragraphs:[`Mali had dreamed of playing the violin in the school orchestra since she was eight years old. Every afternoon after school, she practiced in her bedroom until her fingers ached, determined to pass the audition for the annual spring concert.`,`On the morning of the audition, Mali arrived early, her violin case tucked under her arm. But just as she began to play her piece, one of the strings snapped with a sharp twang. The room went silent, and several students nearby began to whisper.`,`Instead of panicking, Mali borrowed a spare string from the music teacher, replaced it calmly, and started her piece again from the beginning. Her hands trembled slightly, but she finished the whole performance without another mistake.`,`Two days later, the results were posted outside the music room. Mali's name was at the top of the list. The teacher told her that her calm reaction to the broken string had impressed the judges even more than her playing.`],wordCount:162},question:`Why did the writer most likely include the detail about the students whispering in paragraph 2?`,options:[`To show that the other students disliked Mali.`,`To explain why Mali decided to quit the audition.`,`To highlight the pressure and embarrassment Mali had to overcome.`,`To suggest that the audition rules were unfair.`],correctAnswer:2,explanationEnglish:`Writer's-purpose questions ask why an author included a specific detail. The whispering detail builds tension and shows the pressure Mali faced, which makes her calm, successful recovery in the next paragraph stand out even more.`,explanationThai:`คำถามเกี่ยวกับจุดประสงค์ของผู้เขียนมักถามว่าทำไมผู้เขียนถึงใส่รายละเอียดบางอย่างไว้ การที่เพื่อนกระซิบกันช่วยเน้นความกดดันและความอับอายที่ Mali ต้องเผชิญ ทำให้การที่เธอตั้งสติและเล่นจบได้อย่างสงบในภายหลังดูน่าประทับใจยิ่งขึ้น`,keyClue:`began to whisper`,optionExplanations:[`The passage gives no evidence that the other students disliked Mali personally.`,`Mali did not quit — she continued and finished her piece.`,`Correct — the whispering emphasizes the stressful, embarrassing situation Mali faced, making her calm recovery more impressive.`,`The passage never discusses whether the audition rules were fair or unfair.`],hints:[`Think about how this detail affects the reader's feeling about Mali's situation just before she recovers.`,`Writers often add small details like this to build tension before a turning point in the story.`,`The passage never states or suggests that Mali quit the audition.`],hint3EliminateIndex:1,tags:[`reading`,`writers-purpose`,`passage`]},{id:`MT3-Q22`,testId:`mock-test-3`,section:`Reading Comprehension`,order:22,skill:`Making inferences`,skillTag:`reading`,difficulty:`Standard Plus`,instruction:`Read the passage and answer the question.`,stimulus:{type:`passage`,title:`The Broken String`,paragraphs:[`Mali had dreamed of playing the violin in the school orchestra since she was eight years old. Every afternoon after school, she practiced in her bedroom until her fingers ached, determined to pass the audition for the annual spring concert.`,`On the morning of the audition, Mali arrived early, her violin case tucked under her arm. But just as she began to play her piece, one of the strings snapped with a sharp twang. The room went silent, and several students nearby began to whisper.`,`Instead of panicking, Mali borrowed a spare string from the music teacher, replaced it calmly, and started her piece again from the beginning. Her hands trembled slightly, but she finished the whole performance without another mistake.`,`Two days later, the results were posted outside the music room. Mali's name was at the top of the list. The teacher told her that her calm reaction to the broken string had impressed the judges even more than her playing.`],wordCount:162},question:`What can you infer about the music teacher from the passage?`,options:[`The teacher was strict and gave Mali a low score.`,`The teacher had never taught violin before that day.`,`The teacher was annoyed by the delay Mali caused.`,`The teacher was prepared and kept a spare string available to help students.`],correctAnswer:3,explanationEnglish:`Inference questions require using clues in the text to figure out something not directly stated. Since the teacher was able to immediately provide a spare string, we can reasonably infer that the teacher kept one on hand, showing preparedness.`,explanationThai:`คำถามแบบอนุมาน (inference) ต้องใช้เบาะแสในเนื้อเรื่องมาสรุปสิ่งที่ไม่ได้บอกไว้ตรงๆ การที่ครูสามารถหาสายไวโอลินสำรองมาให้ได้ทันที แสดงให้เห็นว่าครูน่าจะเตรียมอุปกรณ์สำรองไว้อยู่เสมอ`,keyClue:`borrowed a spare string from the music teacher`,optionExplanations:[`The passage never mentions the teacher scoring Mali or being strict.`,`There's no information suggesting the teacher was inexperienced.`,`The passage gives no sign that the teacher felt annoyed — this is not supported by the text.`,`Correct — the fact that the teacher had a spare string ready to lend suggests they were prepared for such problems.`],hints:[`Think about what having a spare string ready says about the teacher, even though it isn't directly stated.`,`Inference means using evidence in the text to draw a logical conclusion, not just restating facts.`,`Nothing in the passage suggests the teacher felt annoyed by the delay.`],hint3EliminateIndex:2,tags:[`reading`,`inference`,`passage`]},{id:`MT3-Q23`,testId:`mock-test-3`,section:`Functional Language and Error Recognition`,order:23,skill:`Error recognition`,skillTag:`functional`,difficulty:`Standard Plus`,instruction:`Read the sentence and choose the part that contains an error.`,stimulus:{type:`none`},question:`Read the sentence and choose the part that contains a grammatical error: 'Despite of the heavy rain (A), the football match (B) continued until (C) the final whistle (D).'`,options:[`Despite of the heavy rain`,`the football match`,`continued until`,`the final whistle`],correctAnswer:0,explanationEnglish:`'Despite' and 'in spite of' have the same meaning, but they follow different patterns: 'despite' is never followed by 'of', while 'in spite of' always includes 'of'. Learners often mix the two into the incorrect 'despite of'.`,explanationThai:`'despite' ไม่ตามด้วย 'of' ต้องใช้ 'despite + คำนาม' หรือ 'in spite of + คำนาม' เท่านั้น นักเรียนมักสับสนและเขียนผิดเป็น 'despite of'`,keyClue:`Despite of`,optionExplanations:[`Correct — 'despite' is never followed by 'of'; it should be simply 'Despite the heavy rain' or 'In spite of the heavy rain'.`,`'the football match' is a correct noun phrase with no error.`,`'continued until' is grammatically correct — 'continue' pairs naturally with 'until' to show duration.`,`'the final whistle' is a correct noun phrase with no error.`],hints:[`Focus on part (A) — check whether 'despite' is being used with an extra word it doesn't need.`,`Remember: 'despite' + noun, but 'in spite of' + noun — never mix them as 'despite of'.`,`Part (D), 'the final whistle', is a perfectly normal noun phrase with nothing wrong.`],hint3EliminateIndex:3,vocabulary:[{term:`despite`,meaningEnglish:`without being affected by; used directly before a noun, never with 'of'`,meaningThai:`แม้ว่า/ทั้งๆ ที่ (ตามด้วยคำนามโดยตรง ไม่มี of)`}],grammarRule:`'Despite' and 'although' are never followed by 'of'. Only 'in spite of' takes 'of'.`,tags:[`functional`,`error-recognition`,`prepositions`]},{id:`MT3-Q24`,testId:`mock-test-3`,section:`Functional Language and Error Recognition`,order:24,skill:`Polite requests`,skillTag:`functional`,difficulty:`Standard Plus`,instruction:`Choose the most appropriate response for the situation.`,stimulus:{type:`none`},question:`You want to politely ask your teacher to repeat something you didn't hear clearly. Which is the most appropriate thing to say?`,options:[`What? Say it again.`,`I didn't hear you, speak louder.`,`You need to repeat that.`,`Sorry, could you please say that again?`],correctAnswer:3,explanationEnglish:`Polite requests in English typically use modal verbs like 'could' or 'would' along with softening words like 'please' or 'sorry', especially when speaking to someone in authority, such as a teacher.`,explanationThai:`การขอร้องอย่างสุภาพในภาษาอังกฤษมักใช้กริยาช่วยอย่าง 'could' หรือ 'would' ร่วมกับคำลดความรุนแรง เช่น 'please' หรือ 'sorry' โดยเฉพาะเมื่อพูดกับผู้ใหญ่หรือครู`,keyClue:`politely ask your teacher`,optionExplanations:[`This is too blunt and informal for speaking politely to a teacher.`,`This sounds like a command rather than a polite request.`,`This also sounds like an order, not a polite request.`,`Correct — 'Sorry, could you please say that again?' is polite, using a softener ('Sorry') and a modal request form ('could you please').`],hints:[`Think about the level of formality needed when speaking to a teacher.`,`Polite requests often begin with a softener and use 'could you please...?' instead of a direct command.`,`'You need to repeat that' sounds like an order, which isn't appropriate for speaking to a teacher.`],hint3EliminateIndex:2,tags:[`functional`,`polite-requests`,`register`]},{id:`MT3-Q25`,testId:`mock-test-3`,section:`Functional Language and Error Recognition`,order:25,skill:`Meaning-equivalent sentences`,skillTag:`functional`,difficulty:`Standard Plus`,instruction:`Choose the sentence that means the same as the sentence given.`,stimulus:{type:`none`},question:`Which sentence means the same as: 'It's been three years since Somchai moved to Chiang Mai.'`,options:[`Somchai will move to Chiang Mai in three years.`,`Somchai moved to Chiang Mai three years from now.`,`Somchai used to live in Chiang Mai three years ago.`,`Somchai has lived in Chiang Mai for three years.`],correctAnswer:3,explanationEnglish:`'It's been + time period + since + past simple' is equivalent in meaning to 'have/has + past participle + for + time period', when the situation continues into the present. Both describe Somchai's move three years ago and his continued residence in Chiang Mai now.`,explanationThai:`'It's been + ระยะเวลา + since + past simple' มีความหมายเหมือนกับ 'have/has + กริยาช่อง 3 + for + ระยะเวลา' เมื่อเหตุการณ์นั้นยังคงดำเนินต่อเนื่องมาถึงปัจจุบัน ทั้งสองประโยคสื่อว่า Somchai ย้ายมาเชียงใหม่เมื่อสามปีก่อนและยังอาศัยอยู่ที่นั่น`,keyClue:`It's been three years since`,optionExplanations:[`This describes a future move, but the original sentence describes something that already happened in the past.`,`This phrase doesn't make logical sense and misrepresents the time reference of the original sentence.`,`'Used to live' implies Somchai no longer lives there, but the original sentence implies he still does.`,`Correct — 'It's been three years since X moved' means the same as 'X has lived there for three years', both describing an action that started three years ago and continues now.`],hints:[`Think about whether Somchai still lives in Chiang Mai now, or if he moved away.`,`'It's been + time + since + past simple' equals 'have/has + past participle + for + time' when the action continues to the present.`,`'Used to live' suggests Somchai no longer lives there, which contradicts the original sentence's meaning.`],hint3EliminateIndex:2,vocabulary:[{term:`used to`,meaningEnglish:`describes a past habit or state that is no longer true`,meaningThai:`เคย... (ในอดีต แต่ปัจจุบันไม่ใช่แล้ว)`}],grammarRule:`'It's been + time + since + past simple' = 'have/has + past participle + for + time', for a state that began in the past and continues now.`,tags:[`functional`,`meaning-equivalence`,`present-perfect`]}],Oh=[{id:`MT4-Q01`,testId:`mock-test-4`,section:`Signs and Notices`,order:1,skill:`Understanding conditions and exceptions in a formal notice`,skillTag:`signs`,difficulty:`Advanced`,instruction:`Read the notice and answer the question.`,stimulus:{type:`notice`,title:`Examination Hall Regulations`,lines:[`Candidates must arrive at least 15 minutes before the starting time.`,`Mobile phones are not permitted inside the hall, except when handed to an invigilator for safekeeping before the test begins.`,`Candidates who arrive more than 20 minutes late will not be allowed to sit the examination.`,`Extra answer sheets will be provided only on request; candidates may not bring their own paper.`],footer:`Failure to follow these rules may result in disqualification.`},question:`According to the notice, when is it acceptable for a candidate to have a mobile phone inside the hall?`,options:[`At any time, as long as it is switched to silent mode`,`Only if it has first been given to an invigilator to look after`,`Only during the last 15 minutes of the examination`,`Mobile phones are never allowed under any circumstances`],correctAnswer:1,explanationEnglish:`The notice states phones are "not permitted... except when handed to an invigilator for safekeeping before the test begins," which is a conditional exception, not a blanket ban.`,explanationThai:`ป้ายระบุว่าห้ามนำโทรศัพท์เข้าห้องสอบ "ยกเว้น" กรณีที่ฝากไว้กับกรรมการคุมสอบก่อนเริ่มสอบ ซึ่งเป็นเงื่อนไขพิเศษ ไม่ใช่การห้ามเด็ดขาดทุกกรณี`,keyClue:`"except when handed to an invigilator"`,optionExplanations:[`Incorrect — silent mode is never mentioned as an exception in the notice.`,`Correct — this matches the stated exception exactly.`,`Incorrect — no time-based exception is mentioned.`,`Incorrect — the notice does describe one specific exception, so this is too absolute.`],hints:[`Look carefully at the word "except" in the second line.`,`An exception clause describes a specific condition under which a general rule does not apply.`,`Option A is wrong because silent mode is never mentioned as a condition.`],hint3EliminateIndex:0,tags:[`signs`,`notice`,`exceptions`,`exam-context`]},{id:`MT4-Q02`,testId:`mock-test-4`,section:`Signs and Notices`,order:2,skill:`Interpreting a conditional sign with a warning tone`,skillTag:`signs`,difficulty:`Advanced`,instruction:`Read the sign and answer the question.`,stimulus:{type:`sign`,heading:`Platform Edge — Caution`,body:`Passengers must stand behind the yellow line until the train has come to a complete stop. Doors will not reopen once the train has begun to depart, even if a passenger is still boarding.`,tone:`safety`,location:`City Rail Station, Platform 3`,icon:`caution`},question:`What does the sign warn passengers about?`,options:[`The train doors can be reopened by pressing a button after departure`,`Standing behind the yellow line is only necessary during rush hour`,`Once the train starts to leave, the doors will stay shut even for someone still boarding`,`Passengers should stand on the yellow line to board more quickly`],correctAnswer:2,explanationEnglish:`The sign directly states the doors "will not reopen once the train has begun to depart, even if a passenger is still boarding," which is a firm warning with no exception.`,explanationThai:`ป้ายบอกตรงๆ ว่าประตูจะไม่เปิดอีกเมื่อรถไฟเริ่มออกจากชานชาลาแล้ว แม้จะมีผู้โดยสารกำลังขึ้นรถอยู่ก็ตาม เป็นคำเตือนที่ไม่มีข้อยกเว้น`,keyClue:`"will not reopen... even if"`,optionExplanations:[`Incorrect — no button or reopening method is mentioned anywhere on the sign.`,`Incorrect — the rule about the yellow line applies at all times, not just rush hour.`,`Correct — this restates the warning about doors closing during departure precisely.`,`Incorrect — the sign instructs passengers to stand behind, not on, the yellow line.`],hints:[`Focus on the second sentence and the phrase "even if."`,`"Even if" introduces a situation where the rule still applies despite circumstances that might suggest otherwise.`,`Option D is wrong because the sign says "behind" the line, not "on" it.`],hint3EliminateIndex:3,tags:[`signs`,`transportation`,`safety`,`warning`]},{id:`MT4-Q03`,testId:`mock-test-4`,section:`Vocabulary in Context`,order:3,skill:`Choosing the word that best fits a nuanced collocation`,skillTag:`vocabulary`,difficulty:`Advanced`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`Although the team lost the final match, their coach praised the players for their ______ effort throughout the tournament.`,options:[`careless`,`temporary`,`accidental`,`relentless`],correctAnswer:3,explanationEnglish:`"Relentless effort" is a strong collocation meaning continuous, determined effort that does not weaken, which fits praising players despite a loss.`,explanationThai:`"Relentless effort" หมายถึงความพยายามที่ไม่ลดละ ต่อเนื่อง เหมาะกับบริบทที่โค้ชชื่นชมนักกีฬาแม้จะแพ้ในนัดสุดท้าย`,keyClue:`"praised... for their ______ effort"`,optionExplanations:[`Incorrect — "careless" means lacking attention, which contradicts being praised.`,`Incorrect — "temporary" means lasting only a short time, which contradicts "throughout the tournament."`,`Incorrect — "accidental" means happening by chance, which does not describe sustained effort.`,`Correct — "relentless" means persistent and determined, matching the positive praise.`],hints:[`Think about what quality a coach would praise even after a loss.`,`Collocations pair certain adjectives with "effort" to mean sustained determination.`,`"Accidental" can be eliminated because effort cannot happen by chance.`],hint3EliminateIndex:2,vocabulary:[{term:`relentless`,meaningEnglish:`not stopping or becoming less intense; persistent`,meaningThai:`ไม่ลดละ, ต่อเนื่องไม่หยุด`}],tags:[`vocabulary`,`collocation`,`adjectives`]},{id:`MT4-Q04`,testId:`mock-test-4`,section:`Vocabulary in Context`,order:4,skill:`Distinguishing near-synonyms by connotation`,skillTag:`vocabulary`,difficulty:`Advanced`,instruction:`Choose the word closest in meaning to the underlined word.`,stimulus:{type:`none`},question:`The manager's decision to cancel the project at the last minute was widely criticized as reckless.`,options:[`thoughtful`,`popular`,`gradual`,`careless`],correctAnswer:3,explanationEnglish:`"Reckless" means acting without thinking about danger or consequences, which is closest in meaning to "careless." The other options describe opposite or unrelated qualities.`,explanationThai:`"Reckless" หมายถึงการกระทำโดยไม่คิดถึงผลที่ตามมาหรืออันตราย ใกล้เคียงกับคำว่า "careless" มากที่สุด ส่วนตัวเลือกอื่นมีความหมายตรงข้ามหรือไม่เกี่ยวข้อง`,keyClue:`"widely criticized as reckless"`,optionExplanations:[`Incorrect — "thoughtful" means careful and considerate, the opposite of reckless.`,`Incorrect — "popular" means well-liked, which contradicts being criticized.`,`Incorrect — "gradual" refers to a slow process, unrelated to recklessness.`,`Correct — "careless" shares the meaning of acting without proper thought or caution.`],hints:[`Notice that the decision was "criticized," which suggests something negative.`,`A near-synonym should share the same negative connotation as the target word.`,`"Popular" can be eliminated because it contradicts the idea of criticism.`],hint3EliminateIndex:1,vocabulary:[{term:`reckless`,meaningEnglish:`acting without thinking about danger or the results of an action`,meaningThai:`สะเพร่า, ประมาท, ไม่ยั้งคิด`}],tags:[`vocabulary`,`synonym`,`connotation`]},{id:`MT4-Q05`,testId:`mock-test-4`,section:`Vocabulary in Context`,order:5,skill:`Identifying attitude/opinion vocabulary in context`,skillTag:`vocabulary`,difficulty:`Advanced`,instruction:`Choose the word that best completes the sentence.`,stimulus:{type:`none`},question:`Many scientists remain ______ about the new theory, saying they will only accept it once more evidence is collected.`,options:[`enthusiastic`,`skeptical`,`delighted`,`convinced`],correctAnswer:1,explanationEnglish:`"Skeptical" describes an attitude of doubt, which matches "will only accept it once more evidence is collected." The other options describe acceptance or excitement, which contradicts the sentence.`,explanationThai:`"Skeptical" หมายถึงทัศนคติที่ยังไม่เชื่อหรือสงสัย สอดคล้องกับประโยคที่บอกว่าจะยอมรับก็ต่อเมื่อมีหลักฐานเพิ่มเติม ส่วนตัวเลือกอื่นสื่อถึงการยอมรับหรือความตื่นเต้นซึ่งขัดกับบริบท`,keyClue:`"will only accept it once more evidence is collected"`,optionExplanations:[`Incorrect — "enthusiastic" suggests eager support, which contradicts waiting for more evidence.`,`Correct — "skeptical" matches the doubtful attitude implied by needing more proof.`,`Incorrect — "delighted" means very pleased, unrelated to doubt about a theory.`,`Incorrect — "convinced" means already believing something, which contradicts the condition stated.`],hints:[`Look at the clause after the comma for a clue about the scientists' attitude.`,`Words describing doubt often pair with conditions like "only... once."`,`"Delighted" can be ruled out because it expresses pleasure, not doubt about evidence.`],hint3EliminateIndex:2,vocabulary:[{term:`skeptical`,meaningEnglish:`having doubts about whether something is true or effective`,meaningThai:`ไม่เชื่อง่าย, สงสัย, ยังไม่แน่ใจ`}],tags:[`vocabulary`,`attitude`,`opinion`]},{id:`MT4-Q06`,testId:`mock-test-4`,section:`Grammar and Usage`,order:6,skill:`Choosing between present perfect and past simple`,skillTag:`grammar`,difficulty:`Advanced`,instruction:`Choose the correct form to complete the sentence.`,stimulus:{type:`none`},question:`My grandmother ______ in this village since she was a young girl; she has never lived anywhere else.`,options:[`lived`,`lives`,`was living`,`has lived`],correctAnswer:3,explanationEnglish:`Present perfect ("has lived") is used with "since" to describe an action that began in the past and continues to the present, which fits "has never lived anywhere else."`,explanationThai:`ใช้ present perfect ("has lived") กับ "since" เพื่อบอกเหตุการณ์ที่เริ่มในอดีตและต่อเนื่องมาถึงปัจจุบัน สอดคล้องกับ "has never lived anywhere else"`,keyClue:`"since she was a young girl... has never"`,optionExplanations:[`Incorrect — simple past does not show the continuing connection to the present that "since" requires here.`,`Incorrect — simple present does not match the time clue "since she was a young girl."`,`Incorrect — past continuous describes an ongoing action at a specific past moment, not a lifelong state.`,`Correct — present perfect with "since" shows an action continuing from the past to now.`],hints:[`Look at the word "since" and what it usually pairs with.`,`"Since + a point in the past" combined with a state continuing to now signals present perfect.`,`Past continuous can be eliminated because it does not fit a state lasting many years.`],hint3EliminateIndex:2,grammarRule:`Use present perfect with "since + past time point" for actions/states that began in the past and continue now.`,tags:[`grammar`,`present-perfect`,`past-simple`,`tense`]},{id:`MT4-Q07`,testId:`mock-test-4`,section:`Grammar and Usage`,order:7,skill:`Choosing the correct relative pronoun`,skillTag:`grammar`,difficulty:`Advanced`,instruction:`Choose the correct relative pronoun to complete the sentence.`,stimulus:{type:`none`},question:`The scientist ______ research led to the new vaccine was awarded a national prize.`,options:[`who`,`which`,`whose`,`that`],correctAnswer:2,explanationEnglish:`"Whose" is a possessive relative pronoun used to show that the research belongs to the scientist. It links two ideas: the scientist and her research.`,explanationThai:`"Whose" เป็น relative pronoun แสดงความเป็นเจ้าของ ใช้เชื่อมว่างานวิจัยนั้นเป็นของนักวิทยาศาสตร์คนนั้น`,keyClue:`"______ research led to" (possession)`,optionExplanations:[`Incorrect — "who" refers to a person as subject or object, not possession.`,`Incorrect — "which" refers to things, not people, and does not show possession here.`,`Correct — "whose" shows that the research belongs to the scientist.`,`Incorrect — "that" cannot show possession and is not typically used with a possessive noun following it.`],hints:[`Ask yourself: whose research is being talked about?`,`A possessive relative pronoun links a person to something that belongs to them.`,`"Which" can be eliminated because it never refers to people.`],hint3EliminateIndex:1,grammarRule:`Use "whose" as a possessive relative pronoun to connect a person (or thing) to something they own or are associated with.`,tags:[`grammar`,`relative-clause`,`possessive`]},{id:`MT4-Q08`,testId:`mock-test-4`,section:`Grammar and Usage`,order:8,skill:`Forming a first conditional sentence correctly`,skillTag:`grammar`,difficulty:`Advanced`,instruction:`Choose the correct form to complete the sentence.`,stimulus:{type:`none`},question:`If it ______ heavily tomorrow, the outdoor sports day will be postponed until next week.`,options:[`rains`,`will rain`,`rained`,`would rain`],correctAnswer:0,explanationEnglish:`In a first conditional, the "if" clause uses the present simple ("rains") even though it refers to a future possibility, while the main clause uses "will."`,explanationThai:`ใน first conditional ประโยค "if" ใช้ present simple ("rains") แม้จะพูดถึงอนาคต ส่วนประโยคหลักใช้ "will" เช่น "will be postponed"`,keyClue:`"If it ______ ..., the... will be postponed"`,optionExplanations:[`Correct — the if-clause of a first conditional takes present simple.`,`Incorrect — "will" should not appear in the if-clause of a first conditional.`,`Incorrect — past simple is used for second conditional (unreal/hypothetical), not first conditional.`,`Incorrect — "would" belongs to the second conditional, not the first.`],hints:[`Notice the main clause already uses "will be postponed" — a sign of first conditional.`,`First conditional structure: If + present simple, ... will + base verb.`,`"Would rain" can be eliminated because "would" signals a hypothetical second conditional, not this real future possibility.`],hint3EliminateIndex:3,grammarRule:`First conditional: If + present simple, ... will + base verb — used for realistic future possibilities.`,tags:[`grammar`,`conditional`,`first-conditional`]},{id:`MT4-Q09`,testId:`mock-test-4`,section:`Grammar and Usage`,order:9,skill:`Using modal verbs of deduction correctly`,skillTag:`grammar`,difficulty:`Advanced`,instruction:`Choose the modal verb that best completes the sentence.`,stimulus:{type:`none`},question:`The lights are off and no one is answering the door, so the family ______ be out for the evening.`,options:[`must`,`can`,`should`,`need`],correctAnswer:0,explanationEnglish:`"Must" expresses a confident logical deduction based on evidence (lights off, no answer), meaning the speaker is almost certain the family is out.`,explanationThai:`"Must" ใช้แสดงการอนุมานที่มั่นใจสูงจากหลักฐานที่เห็น (ไฟดับ ไม่มีคนตอบ) หมายความว่าผู้พูดค่อนข้างมั่นใจว่าครอบครัวนั้นออกไปข้างนอก`,keyClue:`"lights off... no one answering... so ______ be out"`,optionExplanations:[`Correct — "must" shows a strong, confident deduction from clear evidence.`,`Incorrect — "can" is not typically used for positive deduction in this way.`,`Incorrect — "should" expresses expectation or advice, not a confident deduction from evidence.`,`Incorrect — "need" expresses necessity, not logical deduction.`],hints:[`Think about how confident the speaker sounds based on the clues given.`,`Modal verbs of deduction show how certain we are about a conclusion from evidence.`,`"Need" can be eliminated because it expresses necessity, not a conclusion drawn from clues.`],hint3EliminateIndex:3,grammarRule:`Use "must" for confident positive deduction based on evidence; use "can't" for confident negative deduction.`,tags:[`grammar`,`modal-verbs`,`deduction`]},{id:`MT4-Q10`,testId:`mock-test-4`,section:`Grammar and Usage`,order:10,skill:`Choosing the correct question tag`,skillTag:`grammar`,difficulty:`Advanced`,instruction:`Choose the correct question tag to complete the sentence.`,stimulus:{type:`none`},question:`Your sister hasn't finished her homework yet, ______?`,options:[`has she`,`hasn't she`,`does she`,`is she`],correctAnswer:0,explanationEnglish:`Question tags reverse the polarity of the main clause. Since the main clause is negative ("hasn't finished"), the tag must be positive: "has she."`,explanationThai:`Question tag จะสลับขั้ว (บวก-ลบ) กับประโยคหลัก เมื่อประโยคหลักเป็นปฏิเสธ ("hasn't finished") tag ต้องเป็นบวก คือ "has she"`,keyClue:`"hasn't finished... ______?"`,optionExplanations:[`Correct — the main clause is negative, so the tag must be positive: "has she."`,`Incorrect — a negative tag would be used only if the main clause were positive.`,`Incorrect — the auxiliary verb in the main clause is "has," so the tag must also use "has," not "does."`,`Incorrect — "is" does not match the auxiliary verb "has" used in the main clause.`],hints:[`Check whether the main clause is affirmative or negative.`,`Question tags follow the rule: negative statement, positive tag (and vice versa), matching the same auxiliary verb.`,`"Does she" can be eliminated because the main clause uses "has," not "does," as its auxiliary.`],hint3EliminateIndex:2,grammarRule:`Question tags use the opposite polarity of the main clause and repeat the same auxiliary verb (or its correct positive/negative form).`,tags:[`grammar`,`question-tags`]},{id:`MT4-Q11`,testId:`mock-test-4`,section:`Grammar and Usage`,order:11,skill:`Choosing the correct conjunction for purpose`,skillTag:`grammar`,difficulty:`Advanced`,instruction:`Choose the correct conjunction to complete the sentence.`,stimulus:{type:`none`},question:`She set two alarms ______ she would not oversleep and miss the entrance exam.`,options:[`although`,`because`,`so that`,`unless`],correctAnswer:2,explanationEnglish:`"So that" introduces a clause of purpose, explaining why she set two alarms — to make sure she would not oversleep. It fits the cause-and-purpose relationship in the sentence.`,explanationThai:`"So that" ใช้นำอนุประโยคแสดงจุดประสงค์ อธิบายเหตุผลที่เธอตั้งนาฬิกาปลุกสองเรือน คือเพื่อไม่ให้ตื่นสาย สอดคล้องกับความสัมพันธ์เชิงจุดประสงค์ในประโยค`,keyClue:`"set two alarms ______ she would not oversleep"`,optionExplanations:[`Incorrect — "although" introduces a contrast, which does not fit this purpose relationship.`,`Incorrect — "because" introduces a reason for a result already stated, but here the second clause states the goal of the action, which needs "so that."`,`Correct — "so that" correctly introduces the purpose of setting two alarms.`,`Incorrect — "unless" means "except if," which creates an illogical meaning here.`],hints:[`Think about why she set two alarms — what was her goal?`,`Purpose clauses answer the question "why," often introduced by "so that" plus a modal like "would" or "could."`,`"Although" can be eliminated because there is no contrast between the two ideas in this sentence.`],hint3EliminateIndex:0,grammarRule:`"So that" introduces a clause of purpose and is often followed by a modal verb such as "would," "could," or "can."`,tags:[`grammar`,`conjunctions`,`purpose-clause`]},{id:`MT4-Q12`,testId:`mock-test-4`,section:`Everyday Conversation`,order:12,skill:`Inferring tone in an apology with justification`,skillTag:`conversation`,difficulty:`Advanced`,instruction:`Read the dialogue and choose the best response.`,stimulus:{type:`dialogue`,setting:`After class, a student speaks to her teacher.`,lines:[{speaker:`Student`,text:`Mr. Adams, I'm really sorry my project is a day late. My laptop crashed last night and I lost most of my work.`},{speaker:`Mr. Adams`,text:`______`}]},question:`Which response shows the teacher accepting the apology while still setting an expectation?`,options:[`It doesn't matter at all — take as long as you like.`,`I understand technology can fail, but please back up your work in future and hand it in by tomorrow morning.`,`That's not a good enough excuse; you will receive a zero.`,`Why didn't you tell me this would happen?`],correctAnswer:1,explanationEnglish:`A balanced, professional response acknowledges the genuine reason for the delay while still giving a clear expectation for the future — showing understanding without abandoning standards.`,explanationThai:`คำตอบที่สมดุลและเป็นมืออาชีพจะยอมรับเหตุผลที่แท้จริงของความล่าช้า แต่ยังคงกำหนดความคาดหวังที่ชัดเจนสำหรับอนาคต แสดงถึงความเข้าใจโดยไม่ละทิ้งมาตรฐาน`,keyClue:`balance between understanding and expectation`,optionExplanations:[`Incorrect — this response is too lenient and sets no expectation at all, which is unrealistic for a teacher-student interaction.`,`Correct — this response acknowledges the reason and gives a clear, reasonable expectation, matching a natural teacher's tone.`,`Incorrect — this response is harsh and dismisses a genuine, understandable excuse, which does not fit a reasonable teacher's tone.`,`Incorrect — this question sounds accusatory and illogical, since a laptop crash cannot be predicted.`],hints:[`Think about how a fair, reasonable teacher would balance kindness and responsibility.`,`Good register in formal conversation often combines acknowledgment with a clear but polite expectation.`,`The harsh "zero" response can be eliminated because it ignores a genuine, understandable reason.`],hint3EliminateIndex:2,tags:[`conversation`,`apology`,`register`,`inference`]},{id:`MT4-Q13`,testId:`mock-test-4`,section:`Everyday Conversation`,order:13,skill:`Negotiating plans politely`,skillTag:`conversation`,difficulty:`Advanced`,instruction:`Read the dialogue and choose the best response.`,stimulus:{type:`dialogue`,setting:`Two classmates are planning a weekend study session.`,lines:[{speaker:`Ploy`,text:`Can we meet at 9 a.m. on Saturday to review for the science test?`},{speaker:`Kade`,text:`Actually, I have a family event in the morning. ______`}]},question:`Which response best continues Kade's sentence in a way that negotiates an alternative?`,options:[`So let's just forget about studying together.`,`I never agreed to Saturday in the first place.`,`You should have asked me before making plans.`,`Would it be possible to meet in the afternoon instead, maybe around 2?`],correctAnswer:3,explanationEnglish:`A polite negotiation proposes an alternative rather than rejecting the plan entirely or blaming the other person. "Would it be possible... instead" is a courteous way to suggest a change.`,explanationThai:`การต่อรองอย่างสุภาพคือการเสนอทางเลือกใหม่ แทนที่จะปฏิเสธแผนทั้งหมดหรือตำหนิอีกฝ่าย ประโยค "Would it be possible... instead" เป็นวิธีสุภาพในการขอเปลี่ยนแปลง`,keyClue:`"I have a family event in the morning."`,optionExplanations:[`Incorrect — this abandons the plan entirely instead of negotiating an alternative time.`,`Incorrect — this denies agreeing to Saturday at all, which contradicts the context of the conversation.`,`Incorrect — this blames Ploy unfairly, which does not fit a polite negotiation.`,`Correct — this politely proposes a new time, which is the natural way to negotiate around a conflict.`],hints:[`Think about what someone says next after explaining a scheduling conflict.`,`Polite negotiation offers an alternative rather than cancelling or blaming.`,`The blaming response can be eliminated because it does not match a cooperative, polite tone.`],hint3EliminateIndex:2,tags:[`conversation`,`negotiation`,`register`,`making-plans`]},{id:`MT4-Q14`,testId:`mock-test-4`,section:`Everyday Conversation`,order:14,skill:`Disagreeing politely in conversation`,skillTag:`conversation`,difficulty:`Advanced`,instruction:`Choose the best response to complete the conversation.`,stimulus:{type:`none`},question:`Anong says, "I think we should skip the museum and just go straight to the beach." Which is the most polite way for her friend to disagree?`,options:[`"No way, that's a terrible idea."`,`"Whatever you want, I don't really care."`,`"I see your point, but I'd actually prefer to visit the museum first if that's okay."`,`"You always want to skip the interesting places."`],correctAnswer:2,explanationEnglish:`Polite disagreement acknowledges the other person's view before stating a different preference, using softening language like "I see your point, but..." rather than blunt rejection or criticism.`,explanationThai:`การไม่เห็นด้วยอย่างสุภาพจะยอมรับความเห็นของอีกฝ่ายก่อน แล้วค่อยเสนอความเห็นที่ต่างออกไป โดยใช้ภาษาที่นุ่มนวลอย่าง "I see your point, but..." แทนการปฏิเสธหรือวิจารณ์อย่างตรงไปตรงมา`,keyClue:`"I see your point, but..."`,optionExplanations:[`Incorrect — this is a blunt, impolite rejection with no softening language.`,`Incorrect — this avoids expressing an actual opinion, which does not show polite disagreement.`,`Correct — this acknowledges Anong's idea first, then politely states a different preference.`,`Incorrect — this is a personal criticism ("you always"), which is impolite and off-topic.`],hints:[`Think about how people soften disagreement in friendly conversations.`,`Polite disagreement often starts by acknowledging the other view before adding "but."`,`The dismissive "whatever" response can be eliminated because it avoids disagreement altogether rather than expressing it politely.`],hint3EliminateIndex:1,tags:[`conversation`,`disagreement`,`register`,`politeness`]},{id:`MT4-Q15`,testId:`mock-test-4`,section:`Everyday Conversation`,order:15,skill:`Understanding register in a formal telephone conversation`,skillTag:`conversation`,difficulty:`Advanced`,instruction:`Read the dialogue and choose the best response.`,stimulus:{type:`dialogue`,setting:`A parent calls the school office.`,lines:[{speaker:`Office Staff`,text:`Good morning, Bright English School, how may I help you?`},{speaker:`Parent`,text:`Good morning. I'd like to speak with the principal about my son's enrollment, if that's possible.`},{speaker:`Office Staff`,text:`______`}]},question:`Which is the most appropriate response from the office staff?`,options:[`She's busy, call back some other time.`,`I'm afraid she's in a meeting right now, but I can schedule a call for this afternoon if that suits you.`,`What do you want to talk to her about? I probably can't help anyway.`,`Yeah, hold on, I'll go check if she feels like talking.`],correctAnswer:1,explanationEnglish:`A formal telephone register requires polite, complete sentences and helpful alternatives ("I'm afraid... but I can...") rather than curt or overly casual language.`,explanationThai:`การสนทนาทางโทรศัพท์แบบเป็นทางการต้องใช้ประโยคที่สุภาพและครบถ้วน พร้อมเสนอทางเลือกที่ช่วยเหลือได้ ("I'm afraid... but I can...") แทนการพูดห้วนหรือไม่เป็นทางการเกินไป`,keyClue:`"I'm afraid... but I can schedule..."`,optionExplanations:[`Incorrect — this is too curt and unhelpful for a formal school office setting.`,`Correct — this politely explains the situation and offers a helpful alternative, fitting formal register.`,`Incorrect — this sounds dismissive and unprofessional for office staff speaking to a parent.`,`Incorrect — the casual phrasing "feels like talking" is inappropriate for a formal telephone conversation.`],hints:[`Think about the level of formality expected between school staff and a parent.`,`Formal register uses polite softening phrases like "I'm afraid" and offers concrete alternatives.`,`The overly casual

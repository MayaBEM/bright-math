any rabbits are there?`,options:[`6`,`2`,`5`,`3`,`4`],hint1:`Each animal has exactly one head, so heads tell you the total number of animals: 9.`,hint2:`Imagine every animal is a chicken first (2 legs each), then see how many legs are missing.`,quickIdea:`Assume all animals are the type with fewer legs, then trade up one at a time to make up the leg difference.`,steps:[`If all 9 animals were chickens, there would be 9 × 2 = 18 legs.`,`The real total is 26 legs, which is 26 − 18 = 8 legs more.`,`Each chicken traded for a rabbit adds 4 − 2 = 2 extra legs, so the number of rabbits is 8 ÷ 2 = 4.`,`Check: 5 chickens + 4 rabbits = 9 heads; 5×2 + 4×4 = 10 + 16 = 26 legs. ✓`],competitionTip:`The "assume all one type" trick works for any two-leg-count mixture problem — it turns two unknowns into one.`,commonMistake:`Dividing the extra legs (8) by 4 instead of by the leg difference (2), which gives the wrong count.`},th:{question:`ชาวนามีไก่และกระต่ายอยู่ในคอกเดียวกัน รวมกันมี 9 หัวและ 26 ขา มีกระต่ายกี่ตัว`,options:[`6`,`2`,`5`,`3`,`4`],hint1:`สัตว์แต่ละตัวมีหัวเดียว ดังนั้นจำนวนหัวบอกจำนวนสัตว์ทั้งหมด: 9 ตัว`,hint2:`ลองสมมติว่าสัตว์ทุกตัวเป็นไก่ก่อน (ขาละ 2) แล้วดูว่าขาขาดไปเท่าไร`,quickIdea:`สมมติว่าสัตว์ทุกตัวเป็นชนิดที่มีขาน้อยกว่าก่อน แล้วค่อยๆ เปลี่ยนทีละตัวเพื่อชดเชยจำนวนขาที่ขาด`,steps:[`ถ้าสัตว์ทั้ง 9 ตัวเป็นไก่หมด จะมีขา 9 × 2 = 18 ขา`,`จำนวนขาจริงคือ 26 ขา ซึ่งมากกว่า 18 ขาอยู่ 26 − 18 = 8 ขา`,`ทุกครั้งที่เปลี่ยนไก่เป็นกระต่ายหนึ่งตัว จะได้ขาเพิ่ม 4 − 2 = 2 ขา ดังนั้นจำนวนกระต่าย = 8 ÷ 2 = 4`,`ตรวจสอบ: ไก่ 5 + กระต่าย 4 = 9 หัว; 5×2 + 4×4 = 10 + 16 = 26 ขา ✓`],competitionTip:`เทคนิค "สมมติว่าทุกตัวเป็นชนิดเดียว" ใช้ได้กับโจทย์ผสมที่มีจำนวนขาต่างกันทุกแบบ ช่วยลดตัวไม่ทราบค่าจากสองตัวเหลือตัวเดียว`,commonMistake:`นำขาส่วนเกิน (8) ไปหารด้วย 4 แทนที่จะหารด้วยผลต่างของจำนวนขา (2) ทำให้ได้คำตอบผิด`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M1-A-05`,mockSet:1,section:`A`,questionNumber:5,marks:3,difficulty:`foundation`,topic:`Average`,subskill:`finding the value added to a group`,type:`mc`,en:{question:`The average of 5 numbers is 18. If one more number is added, the new average becomes 19. What is the number that was added?`,options:[`19`,`29`,`24`,`20`,`21`],hint1:`Use Total = Average × Number of items to find the total before and after.`,hint2:`The added number equals the new total minus the old total.`,quickIdea:`Compare totals before and after adding a value — the difference in totals is the value added.`,steps:[`Total of the first 5 numbers = 5 × 18 = 90.`,`Total of all 6 numbers = 6 × 19 = 114.`,`The added number = 114 − 90 = 24.`],whyOthersFail:`Answering 19 confuses the added number with the new average — they are only equal by coincidence in some problems, not in general.`,competitionTip:`Whenever "average" changes after adding one value, convert both averages to totals first — averages cannot be added or compared directly.`,commonMistake:`Assuming the added number is simply the new average (19), without computing totals.`},th:{question:`ค่าเฉลี่ยของตัวเลข 5 จำนวนคือ 18 ถ้าเพิ่มอีกหนึ่งจำนวน ค่าเฉลี่ยใหม่กลายเป็น 19 จำนวนที่เพิ่มเข้าไปคือเท่าไร`,options:[`19`,`29`,`24`,`20`,`21`],hint1:`ใช้สูตร ผลรวม = ค่าเฉลี่ย × จำนวนตัว เพื่อหาผลรวมก่อนและหลัง`,hint2:`จำนวนที่เพิ่มเข้าไปเท่ากับผลรวมใหม่ลบผลรวมเดิม`,quickIdea:`เปรียบเทียบผลรวมก่อนและหลังเพิ่มค่า ผลต่างของผลรวมคือค่าที่เพิ่มเข้าไป`,steps:[`ผลรวมของ 5 จำนวนแรก = 5 × 18 = 90`,`ผลรวมของทั้ง 6 จำนวน = 6 × 19 = 114`,`จำนวนที่เพิ่มเข้าไป = 114 − 90 = 24`],whyOthersFail:`คำตอบ 19 สับสนระหว่างจำนวนที่เพิ่มกับค่าเฉลี่ยใหม่ ซึ่งไม่เท่ากันโดยทั่วไป`,competitionTip:`เมื่อ "ค่าเฉลี่ย" เปลี่ยนหลังเพิ่มค่าหนึ่งค่า ให้แปลงค่าเฉลี่ยทั้งสองเป็นผลรวมก่อนเสมอ ค่าเฉลี่ยนำมาบวกลบกันตรงๆ ไม่ได้`,commonMistake:`สมมติว่าจำนวนที่เพิ่มเข้าไปคือค่าเฉลี่ยใหม่ (19) โดยไม่คำนวณผลรวม`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M1-A-06`,mockSet:1,section:`A`,questionNumber:6,marks:3,difficulty:`foundation`,topic:`Perimeter`,subskill:`shared edges when joining shapes`,type:`mc`,en:{question:`Two identical squares of side 5 cm are placed edge-to-edge (without overlapping) to form a rectangle. What is the perimeter of the resulting rectangle?`,options:[`30`,`40`,`25`,`35`,`20`],hint1:`Work out the dimensions of the new rectangle first, then find its perimeter.`,hint2:`The shared edge between the two squares is inside the rectangle — it is not part of the outer boundary.`,quickIdea:`When shapes are joined, the shared edges disappear from the outer boundary.`,steps:[`Joining two 5 cm squares edge-to-edge makes a rectangle 10 cm long and 5 cm wide.`,`Perimeter of the rectangle = 2 × (10 + 5) = 2 × 15 = 30 cm.`],whyOthersFail:`Adding the two squares’ perimeters (4×5 + 4×5 = 40) double-counts the two shared-edge sides that are no longer on the boundary.`,competitionTip:`When shapes are combined, always redraw the new outline rather than adding the original perimeters.`,commonMistake:`Simply adding the two separate perimeters (20 + 20 = 40) without removing the hidden shared edges.`},th:{question:`สี่เหลี่ยมจัตุรัสด้านเท่ากันสองรูป ด้านละ 5 ซม. นำมาวางชิดขอบกัน (ไม่ทับซ้อน) เป็นรูปสี่เหลี่ยมผืนผ้า เส้นรอบรูปของสี่เหลี่ยมผืนผ้าที่ได้คือเท่าไร`,options:[`30`,`40`,`25`,`35`,`20`],hint1:`หาความกว้างและความยาวของสี่เหลี่ยมผืนผ้าใหม่ก่อน แล้วจึงหาเส้นรอบรูป`,hint2:`ขอบที่ใช้ร่วมกันระหว่างสี่เหลี่ยมสองรูปอยู่ภายในรูป ไม่ใช่ส่วนหนึ่งของเส้นรอบรูปด้านนอก`,quickIdea:`เมื่อนำรูปมาต่อกัน ขอบที่ใช้ร่วมกันจะหายไปจากเส้นรอบรูปด้านนอก`,steps:[`การนำสี่เหลี่ยมจัตุรัสด้านละ 5 ซม. สองรูปมาต่อกัน จะได้สี่เหลี่ยมผืนผ้ายาว 10 ซม. กว้าง 5 ซม.`,`เส้นรอบรูป = 2 × (10 + 5) = 2 × 15 = 30 ซม.`],whyOthersFail:`การบวกเส้นรอบรูปของสี่เหลี่ยมทั้งสอง (4×5 + 4×5 = 40) นับด้านที่ใช้ร่วมกันซ้ำสองครั้งทั้งที่ไม่ได้อยู่บนขอบนอกแล้ว`,competitionTip:`เมื่อรูปถูกนำมารวมกัน ให้วาดเส้นขอบใหม่ทุกครั้งแทนการบวกเส้นรอบรูปเดิม`,commonMistake:`บวกเส้นรอบรูปแยกกันตรงๆ (20 + 20 = 40) โดยไม่ตัดขอบที่ซ่อนอยู่ภายในออก`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M1-A-07`,mockSet:1,section:`A`,questionNumber:7,marks:3,difficulty:`foundation`,topic:`Area`,subskill:`area by subtraction (composite shape)`,type:`mc`,en:{question:`A rectangle measuring 8 cm by 6 cm has a smaller rectangle measuring 3 cm by 2 cm cut from one corner. What is the area of the remaining shape?`,options:[`36`,`48`,`39`,`42`,`45`],hint1:`Find the area of the big rectangle and the area of the cut-out piece separately.`,hint2:`Subtract the small area from the big area.`,quickIdea:`For a shape with a corner cut off, subtract the missing piece’s area from the whole rectangle’s area.`,steps:[`Area of the big rectangle = 8 × 6 = 48 cm².`,`Area of the cut-out corner = 3 × 2 = 6 cm².`,`Remaining area = 48 − 6 = 42 cm².`],competitionTip:`The subtraction method works whenever a shape is "a rectangle minus a bite" — always find both areas before subtracting.`,commonMistake:`Forgetting to subtract, and giving the full rectangle’s area (48) as the answer.`},th:{question:`สี่เหลี่ยมผืนผ้าขนาด 8 ซม. × 6 ซม. ถูกตัดมุมหนึ่งออกเป็นสี่เหลี่ยมเล็กขนาด 3 ซม. × 2 ซม. พื้นที่ของรูปที่เหลือคือเท่าไร`,options:[`36`,`48`,`39`,`42`,`45`],hint1:`หาพื้นที่สี่เหลี่ยมใหญ่และพื้นที่ส่วนที่ถูกตัดออกแยกกันก่อน`,hint2:`นำพื้นที่ส่วนเล็กไปลบออกจากพื้นที่สี่เหลี่ยมใหญ่`,quickIdea:`เมื่อรูปถูกตัดมุมออก ให้นำพื้นที่ส่วนที่หายไปลบออกจากพื้นที่สี่เหลี่ยมทั้งหมด`,steps:[`พื้นที่สี่เหลี่ยมใหญ่ = 8 × 6 = 48 ตร.ซม.`,`พื้นที่มุมที่ถูกตัดออก = 3 × 2 = 6 ตร.ซม.`,`พื้นที่ที่เหลือ = 48 − 6 = 42 ตร.ซม.`],competitionTip:`วิธีลบใช้ได้ทุกครั้งที่รูปเป็น "สี่เหลี่ยมลบส่วนที่ถูกกัดออก" หาพื้นที่ทั้งสองส่วนก่อนแล้วค่อยลบ`,commonMistake:`ลืมลบพื้นที่ส่วนที่ถูกตัดออก แล้วตอบพื้นที่สี่เหลี่ยมเต็ม (48) ไปเลย`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M1-A-08`,mockSet:1,section:`A`,questionNumber:8,marks:3,difficulty:`foundation`,topic:`Angles & Triangles`,subskill:`triangle angle sum`,type:`mc`,en:{question:`In triangle ABC, angle A = 52° and angle B = 65°. What is angle C?`,options:[`73`,`63`,`53`,`67`,`58`],hint1:`The three angles of any triangle always add up to the same total.`,hint2:`Add the two known angles, then subtract from that total.`,quickIdea:`The angles in every triangle sum to 180°.`,steps:[`Angle A + Angle B = 52° + 65° = 117°.`,`Angle C = 180° − 117° = 63°.`],competitionTip:`Memorise "180° in a triangle, 360° around a point, 180° on a straight line" — these three facts unlock most angle-chasing questions.`,commonMistake:`Using 360° instead of 180° as the total, since 360° is for angles around a point, not inside a triangle.`},th:{question:`ในรูปสามเหลี่ยม ABC มุม A = 52° และมุม B = 65° มุม C มีขนาดเท่าไร`,options:[`73`,`63`,`53`,`67`,`58`],hint1:`มุมทั้งสามของสามเหลี่ยมใดๆ รวมกันได้ผลรวมเท่ากันเสมอ`,hint2:`บวกมุมที่รู้ค่าทั้งสองมุมก่อน แล้วนำไปลบออกจากผลรวมนั้น`,quickIdea:`มุมภายในของสามเหลี่ยมทุกรูปรวมกันได้ 180°`,steps:[`มุม A + มุม B = 52° + 65° = 117°`,`มุม C = 180° − 117° = 63°`],competitionTip:`จำไว้ว่า "สามเหลี่ยมรวมกัน 180°, รอบจุดรวมกัน 360°, เส้นตรงรวมกัน 180°" ทั้งสามข้อนี้ไขโจทย์เรื่องมุมได้เกือบทั้งหมด`,commonMistake:`ใช้ 360° แทน 180° เป็นผลรวม เพราะ 360° ใช้กับมุมรอบจุด ไม่ใช่มุมภายในสามเหลี่ยม`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M1-A-09`,mockSet:1,section:`A`,questionNumber:9,marks:3,difficulty:`foundation`,topic:`Cube & Spatial Reasoning`,subskill:`finding an unused pair by elimination`,type:`mc`,en:{question:`A cube's six faces are numbered 1 to 6. The three pairs of opposite faces all have the same total. Two of the pairs are (1, 6) and (3, 4). What are the two numbers on the remaining pair of opposite faces?`,options:[`2 and 3`,`1 and 5`,`4 and 5`,`2 and 6`,`2 and 5`],hint1:`Which two numbers from 1–6 have not been used in the given pairs yet?`,hint2:`Check that your remaining pair also adds up to the same total as the other two pairs.`,quickIdea:`The numbers 1–6 are used exactly once each, so the missing pair must be the two numbers left over.`,steps:[`Numbers already paired: 1, 6, 3, 4. Numbers not yet used: 2 and 5.`,`So the remaining pair must be 2 and 5.`,`Check the totals match: 1+6 = 7, 3+4 = 7, and 2+5 = 7. ✓`],whyOthersFail:`Any option reusing a number already placed (like 1, 3, 4, or 6) is impossible, since each face number is used only once.`,competitionTip:`In "what’s left over" problems, cross out every number that has already been used before choosing an answer.`,commonMistake:`Picking an option that repeats a number already assigned to another face, without checking for reuse.`},th:{question:`ลูกบาศก์มีหน้าทั้งหกหน้ากำกับเลข 1 ถึง 6 คู่หน้าตรงข้ามทั้งสามคู่มีผลรวมเท่ากันทุกคู่ สองคู่ที่ทราบคือ (1, 6) และ (3, 4) คู่หน้าตรงข้ามที่เหลือคือเลขอะไรบ้าง`,options:[`2 กับ 3`,`1 กับ 5`,`4 กับ 5`,`2 กับ 6`,`2 กับ 5`],hint1:`เลขใน 1–6 ตัวไหนบ้างที่ยังไม่ถูกใช้ในคู่ที่ให้มา`,hint2:`ตรวจว่าคู่ที่เหลือมีผลรวมเท่ากับอีกสองคู่หรือไม่`,quickIdea:`เลข 1–6 ถูกใช้เพียงครั้งเดียวต่อตัว ดังนั้นคู่ที่เหลือต้องเป็นเลขสองตัวที่ยังไม่ถูกใช้`,steps:[`เลขที่ถูกจับคู่แล้ว: 1, 6, 3, 4 เลขที่ยังไม่ถูกใช้: 2 และ 5`,`ดังนั้นคู่ที่เหลือต้องเป็น 2 กับ 5`,`ตรวจผลรวม: 1+6 = 7, 3+4 = 7 และ 2+5 = 7 ✓`],whyOthersFail:`ตัวเลือกใดที่ใช้เลขซ้ำกับที่ถูกจับคู่ไปแล้ว (เช่น 1, 3, 4 หรือ 6) เป็นไปไม่ได้ เพราะแต่ละเลขใช้เพียงครั้งเดียว`,competitionTip:`ในโจทย์แบบ "เหลืออะไร" ให้ขีดฆ่าเลขที่ถูกใช้ไปแล้วทั้งหมดก่อนเลือกคำตอบ`,commonMistake:`เลือกตัวเลือกที่มีเลขซ้ำกับที่ถูกกำหนดไปแล้ว โดยไม่ได้ตรวจสอบการซ้ำ`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M1-A-10`,mockSet:1,section:`A`,questionNumber:10,marks:3,difficulty:`foundation`,topic:`Visual Patterns`,subskill:`3×3 shape matrix (shape + fill rule)`,type:`mc`,en:{question:`Look at the pattern in the grid. In each row, the shape stays the same across the row, and the fill changes from outline, to striped, to solid. What belongs in the missing cell (marked "?")?`,options:[`outline triangle`,`solid square`,`solid triangle`,`striped triangle`,`solid circle`],hint1:`First figure out the rule for how the SHAPE changes from row to row.`,hint2:`Then figure out the rule for how the FILL changes from column to column.`,quickIdea:`Check the shape rule and the fill rule separately, then combine them for the missing cell.`,steps:[`Row rule (shape): row 1 is circles, row 2 is squares, row 3 is triangles.`,`Column rule (fill): column 1 is outline, column 2 is striped, column 3 is solid.`,`The missing cell is in row 3 (triangle), column 3 (solid) — so it must be a solid triangle.`],competitionTip:`Split a two-part pattern (shape AND fill) into two separate one-part rules — it is much easier to track each rule on its own.`,commonMistake:`Matching only the shape or only the fill, instead of applying both rules together.`},th:{question:`สังเกตรูปแบบในตาราง แต่ละแถวใช้รูปทรงเดียวกันตลอดแถว ส่วนลวดลายเปลี่ยนจากเส้นขอบ เป็นลายเส้น เป็นทึบ ช่องที่หายไป (เครื่องหมาย "?") ควรเป็นอะไร`,options:[`สามเหลี่ยมเส้นขอบ`,`สี่เหลี่ยมทึบ`,`สามเหลี่ยมทึบ`,`สามเหลี่ยมลายเส้น`,`วงกลมทึบ`],hint1:`หากฎการเปลี่ยน "รูปทรง" ระหว่างแถวก่อน`,hint2:`จากนั้นหากฎการเปลี่ยน "ลวดลาย" ระหว่างคอลัมน์`,quickIdea:`ตรวจกฎรูปทรงและกฎลวดลายแยกกัน แล้วนำมารวมกันสำหรับช่องที่หายไป`,steps:[`กฎแถว (รูปทรง): แถว 1 วงกลม แถว 2 สี่เหลี่ยม แถว 3 สามเหลี่ยม`,`กฎคอลัมน์ (ลวดลาย): คอลัมน์ 1 เส้นขอบ คอลัมน์ 2 ลายเส้น คอลัมน์ 3 ทึบ`,`ช่องที่หายไปอยู่แถว 3 (สามเหลี่ยม) คอลัมน์ 3 (ทึบ) จึงต้องเป็นสามเหลี่ยมทึบ`],competitionTip:`แยกรูปแบบสองส่วน (รูปทรง และ ลวดลาย) ออกเป็นกฎเดี่ยวสองข้อ จะติดตามง่ายกว่ามองรวมกัน`,commonMistake:`จับคู่เพียงรูปทรงหรือเพียงลวดลายอย่างใดอย่างหนึ่ง แทนที่จะใช้ทั้งสองกฎร่วมกัน`},correctAnswer:`C`,diagram:{kind:`shape-matrix`,props:{cells:[{shape:`circle`,fill:`outline`},{shape:`circle`,fill:`striped`},{shape:`circle`,fill:`solid`},{shape:`square`,fill:`outline`},{shape:`square`,fill:`striped`},{shape:`square`,fill:`solid`},{shape:`triangle`,fill:`outline`},{shape:`triangle`,fill:`striped`},{shape:null,fill:`outline`}]}},verificationStatus:`verified`},{id:`M1-B-11`,mockSet:1,section:`B`,questionNumber:11,marks:4,difficulty:`competition`,topic:`Number Patterns`,subskill:`pairing terms in an alternating sum`,type:`mc`,en:{question:`Find the value of: 1 − 2 + 3 − 4 + 5 − 6 + ⋯ + 99 − 100.`,options:[`−100`,`0`,`50`,`−50`,`100`],hint1:`Group the terms into pairs: (1 − 2), (3 − 4), (5 − 6), and so on.`,hint2:`Every pair gives the same value. How many pairs are there in total?`,quickIdea:`Pairing consecutive terms turns a long alternating sum into a short multiplication.`,steps:[`Group into pairs: (1−2) + (3−4) + (5−6) + ⋯ + (99−100).`,`Each pair equals −1.`,`There are 100 ÷ 2 = 50 pairs, so the total is 50 × (−1) = −50.`],competitionTip:`Pairing works for any alternating sum with an even number of terms — always check the terms pair up evenly first.`,commonMistake:`Miscounting the number of pairs, or forgetting the negative sign on each pair’s value.`},th:{question:`จงหาผลลัพธ์ของ 1 − 2 + 3 − 4 + 5 − 6 + ⋯ + 99 − 100`,options:[`−100`,`0`,`50`,`−50`,`100`],hint1:`จัดกลุ่มเป็นคู่ๆ: (1 − 2), (3 − 4), (5 − 6), ไปเรื่อยๆ`,hint2:`แต่ละคู่มีค่าเท่ากันหมด มีทั้งหมดกี่คู่`,quickIdea:`การจับคู่พจน์ที่ติดกันช่วยเปลี่ยนผลบวกสลับเครื่องหมายที่ยาวให้เป็นการคูณสั้นๆ`,steps:[`จัดกลุ่มเป็นคู่: (1−2) + (3−4) + (5−6) + ⋯ + (99−100)`,`แต่ละคู่มีค่าเท่ากับ −1`,`มีทั้งหมด 100 ÷ 2 = 50 คู่ ดังนั้นผลรวมคือ 50 × (−1) = −50`],competitionTip:`การจับคู่ใช้ได้กับผลบวกสลับเครื่องหมายที่มีจำนวนพจน์เป็นคู่เสมอ ตรวจก่อนว่าจับคู่ได้พอดีหรือไม่`,commonMistake:`นับจำนวนคู่ผิด หรือลืมเครื่องหมายลบของแต่ละคู่`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M1-B-12`,mockSet:1,section:`B`,questionNumber:12,marks:4,difficulty:`competition`,topic:`Number Sense`,subskill:`digit counting across ranges`,type:`mc`,en:{question:`How many digits are used to write all the whole numbers from 1 to 150?`,options:[`300`,`342`,`321`,`450`,`351`],hint1:`Split the numbers into groups by how many digits they have: 1–9, 10–99, and 100–150.`,hint2:`Multiply the count of numbers in each group by the number of digits per number in that group.`,quickIdea:`Break the range into blocks of equal digit-length, then count digits block by block.`,steps:[`From 1 to 9: 9 numbers × 1 digit = 9 digits.`,`From 10 to 99: 90 numbers × 2 digits = 180 digits.`,`From 100 to 150: 51 numbers × 3 digits = 153 digits.`,`Total = 9 + 180 + 153 = 342 digits.`],competitionTip:`Always double-check how many numbers are in the last, partial block — here it’s 100 to 150, which is 51 numbers, not 50.`,commonMistake:`Counting 100 to 150 as 50 numbers instead of 51 (forgetting to include both endpoints).`},th:{question:`ต้องใช้ตัวเลขทั้งหมดกี่ตัว ในการเขียนจำนวนเต็มตั้งแต่ 1 ถึง 150`,options:[`300`,`342`,`321`,`450`,`351`],hint1:`แบ่งกลุ่มเลขตามจำนวนหลัก: 1–9, 10–99 และ 100–150`,hint2:`นำจำนวนตัวเลขในแต่ละกลุ่มคูณด้วยจำนวนหลักของกลุ่มนั้น`,quickIdea:`แบ่งช่วงเป็นกลุ่มที่มีจำนวนหลักเท่ากัน แล้วนับตัวเลขทีละกลุ่ม`,steps:[`จาก 1 ถึง 9: 9 จำนวน × 1 หลัก = 9 ตัวเลข`,`จาก 10 ถึง 99: 90 จำนวน × 2 หลัก = 180 ตัวเลข`,`จาก 100 ถึง 150: 51 จำนวน × 3 หลัก = 153 ตัวเลข`,`รวมทั้งหมด = 9 + 180 + 153 = 342 ตัวเลข`],competitionTip:`ตรวจสอบจำนวนตัวเลขในกลุ่มสุดท้ายที่ไม่ครบเสมอ ที่นี่คือ 100 ถึง 150 ซึ่งมี 51 จำนวน ไม่ใช่ 50`,commonMistake:`นับ 100 ถึง 150 เป็น 50 จำนวนแทนที่จะเป็น 51 (ลืมนับรวมทั้งจุดเริ่มต้นและจุดสิ้นสุด)`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M1-B-13`,mockSet:1,section:`B`,questionNumber:13,marks:4,difficulty:`competition`,topic:`Speed, Distance & Time`,subskill:`delayed start catch-up problem`,type:`mc`,en:{question:`Ann starts cycling from her house at 8:00 am at 12 km/h. Her brother Ben leaves the same house at 8:30 am, cycling the same road at 16 km/h to catch up with her. At what time does Ben catch up with Ann?`,options:[`9:00 am`,`10:30 am`,`9:30 am`,`11:00 am`,`10:00 am`],hint1:`First find how far ahead Ann is when Ben starts, at 8:30 am.`,hint2:`Ben closes the gap at a rate equal to the difference between their speeds.`,quickIdea:`In a catch-up problem, find the head-start distance, then divide by the difference in speeds.`,steps:[`By 8:30 am, Ann has been cycling for 0.5 hours: 12 × 0.5 = 6 km ahead.`,`Ben gains on Ann at (16 − 12) = 4 km/h.`,`Time for Ben to close the 6 km gap: 6 ÷ 4 = 1.5 hours = 1 hour 30 minutes.`,`Ben started at 8:30 am, so he catches up at 8:30 am + 1:30 = 10:00 am.`],competitionTip:`Draw a simple timeline showing both start times — it prevents mixing up whose head start you’re calculating.`,commonMistake:`Using the full 12 km/h or 16 km/h as the closing speed instead of the speed difference (4 km/h).`},th:{question:`แอนออกจากบ้านปั่นจักรยานเวลา 8:00 น. ด้วยความเร็ว 12 กม./ชม. เบน น้องชายของเธอ ออกจากบ้านเดียวกันเวลา 8:30 น. ปั่นตามถนนเดียวกันด้วยความเร็ว 16 กม./ชม. เพื่อตามให้ทัน เบนจะตามแอนทันเวลาใด`,options:[`9:00 น.`,`10:30 น.`,`9:30 น.`,`11:00 น.`,`10:00 น.`],hint1:`หาก่อนว่าแอนนำหน้าไปไกลแค่ไหนตอน 8:30 น. เมื่อเบนเริ่มออกเดิน`,hint2:`เบนไล่ตามด้วยอัตราเท่ากับผลต่างของความเร็วทั้งสอง`,quickIdea:`ในโจทย์ตามให้ทัน ให้หาระยะที่นำหน้าก่อน แล้วหารด้วยผลต่างของความเร็ว`,steps:[`เมื่อถึง 8:30 น. แอนปั่นมาแล้ว 0.5 ชม.: 12 × 0.5 = 6 กม. นำหน้าไป`,`เบนไล่ตามด้วยอัตรา (16 − 12) = 4 กม./ชม.`,`เวลาที่เบนใช้ไล่ตามระยะ 6 กม.: 6 ÷ 4 = 1.5 ชม. = 1 ชม. 30 นาที`,`เบนเริ่มเวลา 8:30 น. จึงตามทันเวลา 8:30 น. + 1:30 = 10:00 น.`],competitionTip:`วาดเส้นเวลาแสดงเวลาเริ่มของทั้งสองคน ช่วยไม่ให้สับสนว่ากำลังคำนวณระยะนำหน้าของใคร`,commonMistake:`ใช้ความเร็ว 12 หรือ 16 กม./ชม. เป็นอัตราไล่ตามโดยตรง แทนที่จะใช้ผลต่างของความเร็ว (4 กม./ชม.)`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M1-B-14`,mockSet:1,section:`B`,questionNumber:14,marks:4,difficulty:`competition`,topic:`Word Problems`,subskill:`finding a group size from two division conditions`,type:`mc`,en:{question:`A teacher has 87 pencils to give equally to a group of students, with 6 pencils left over. If she had 90 pencils instead, they would divide exactly, with none left over, among the same number of students. How many students are there?`,options:[`9`,`7`,`6`,`10`,`8`],hint1:`If 87 pencils leave a remainder of 6, then 87 − 6 = 81 must divide evenly among the students.`,hint2:`The number of students must divide both 81 and 90 exactly, and it must be greater than the remainder, 6.`,quickIdea:`Turn "divides with remainder r" into "divides exactly" by subtracting r first.`,steps:[`87 pencils leave remainder 6, so 87 − 6 = 81 pencils divide exactly among the students.`,`90 pencils also divide exactly among the same students.`,`The number of students must divide both 81 and 90 exactly. Common divisors of 81 and 90 are 1, 3, 9.`,`The remainder (6) must be smaller than the number of students, so only 9 works.`],whyOthersFail:`6, 7, and 10 do not divide 81 exactly, and any student count of 6 or less could not leave a remainder of 6.`,competitionTip:`When a remainder condition and an exact-division condition share the same unknown, convert the remainder condition into an exact-division condition first.`,commonMistake:`Trying to divide 87 directly by each option instead of first subtracting the remainder.`},th:{question:`ครูมีดินสอ 87 แท่ง แจกให้นักเรียนกลุ่มหนึ่งเท่าๆ กัน เหลือดินสอ 6 แท่ง ถ้ามีดินสอ 90 แท่งแทน จะแจกได้พอดีไม่มีเหลือ ให้กับนักเรียนจำนวนเท่าเดิม มีนักเรียนกี่คน`,options:[`9`,`7`,`6`,`10`,`8`],hint1:`ถ้าดินสอ 87 แท่งแบ่งแล้วเหลือ 6 แสดงว่า 87 − 6 = 81 ต้องแบ่งลงตัวพอดีให้นักเรียน`,hint2:`จำนวนนักเรียนต้องหาร 81 และ 90 ลงตัวทั้งคู่ และต้องมากกว่าเศษที่เหลือ (6)`,quickIdea:`เปลี่ยนเงื่อนไข "หารแล้วเหลือเศษ r" ให้เป็น "หารลงตัว" โดยลบ r ออกก่อน`,steps:[`ดินสอ 87 แท่งเหลือเศษ 6 ดังนั้น 87 − 6 = 81 แท่งแบ่งลงตัวพอดีให้นักเรียน`,`ดินสอ 90 แท่งก็แบ่งลงตัวพอดีให้นักเรียนจำนวนเท่าเดิม`,`จำนวนนักเรียนต้องหาร 81 และ 90 ลงตัวทั้งคู่ ตัวหารร่วมของ 81 และ 90 คือ 1, 3, 9`,`เศษที่เหลือ (6) ต้องน้อยกว่าจำนวนนักเรียน จึงมีเพียง 9 เท่านั้นที่ใช้ได้`],whyOthersFail:`6, 7 และ 10 ไม่หาร 81 ลงตัว และจำนวนนักเรียนที่ 6 หรือน้อยกว่าไม่สามารถเหลือเศษ 6 ได้`,competitionTip:`เมื่อเงื่อนไขเศษเหลือกับเงื่อนไขหารลงตัวใช้ตัวไม่ทราบค่าเดียวกัน ให้เปลี่ยนเงื่อนไขเศษเหลือเป็นหารลงตัวก่อน`,commonMistake:`นำ 87 ไปหารด้วยแต่ละตัวเลือกตรงๆ โดยไม่ลบเศษออกก่อน`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M1-B-15`,mockSet:1,section:`B`,questionNumber:15,marks:4,difficulty:`competition`,topic:`Area`,subskill:`union of two overlapping regions`,type:`mc`,en:{question:`Rectangle P is 10 cm by 6 cm. Rectangle Q is 7 cm by 4 cm. They overlap so that the overlapping region is a rectangle 4 cm by 3 cm. What is the total area covered by the two rectangles (counting the overlap only once)?`,options:[`64`,`88`,`76`,`100`,`70`],hint1:`Find the area of P, the area of Q, and the area of the overlapping region separately.`,hint2:`Adding P and Q counts the overlap twice — subtract it back out once.`,quickIdea:`Total covered area = Area(P) + Area(Q) − Area(overlap).`,steps:[`Area of P = 10 × 6 = 60 cm².`,`Area of Q = 7 × 4 = 28 cm².`,`Area of overlap = 4 × 3 = 12 cm².`,`Total covered area = 60 + 28 − 12 = 76 cm².`],whyOthersFail:`Simply adding 60 + 28 = 88 counts the 12 cm² overlap twice, since it belongs to both rectangles.`,competitionTip:`Whenever two regions overlap, the pattern is always "add both, then subtract the overlap once."`,commonMistake:`Forgetting to subtract the overlap at all, giving 88 instead of 76.`},th:{question:`สี่เหลี่ยมผืนผ้า P ขนาด 10 ซม. × 6 ซม. สี่เหลี่ยมผืนผ้า Q ขนาด 7 ซม. × 4 ซม. ทั้งสองทับซ้อนกันเป็นบริเวณสี่เหลี่ยมขนาด 4 ซม. × 3 ซม. พื้นที่รวมที่ถูกครอบคลุมโดยสี่เหลี่ยมทั้งสอง (นับส่วนทับซ้อนเพียงครั้งเดียว) คือเท่าไร`,options:[`64`,`88`,`76`,`100`,`70`],hint1:`หาพื้นที่ P, พื้นที่ Q และพื้นที่ส่วนทับซ้อนแยกกันก่อน`,hint2:`การบวก P กับ Q นับส่วนทับซ้อนซ้ำสองครั้ง ต้องลบออกหนึ่งครั้ง`,quickIdea:`พื้นที่รวมที่ถูกครอบคลุม = พื้นที่(P) + พื้นที่(Q) − พื้นที่ส่วนทับซ้อน`,steps:[`พื้นที่ P = 10 × 6 = 60 ตร.ซม.`,`พื้นที่ Q = 7 × 4 = 28 ตร.ซม.`,`พื้นที่ส่วนทับซ้อน = 4 × 3 = 12 ตร.ซม.`,`พื้นที่รวม = 60 + 28 − 12 = 76 ตร.ซม.`],whyOthersFail:`การบวก 60 + 28 = 88 ตรงๆ นับพื้นที่ส่วนทับซ้อน 12 ตร.ซม. ซ้ำสองครั้ง เพราะเป็นของทั้งสองรูป`,competitionTip:`เมื่อสองบริเวณทับซ้อนกัน รูปแบบเสมอคือ "บวกทั้งสอง แล้วลบส่วนทับซ้อนออกหนึ่งครั้ง"`,commonMistake:`ลืมลบส่วนทับซ้อนออกเลย ทำให้ได้ 88 แทนที่จะเป็น 76`},correctAnswer:`C`,diagram:{kind:`overlap-rectangles`,props:{rectA:{w:10,h:6,label:`P`},rectB:{w:7,h:4,label:`Q`},overlap:{w:4,h:3}}},verificationStatus:`verified`},{id:`M1-B-16`,mockSet:1,section:`B`,questionNumber:16,marks:4,difficulty:`competition`,topic:`Perimeter`,subskill:`perimeter invariance of a staircase cut`,type:`mc`,en:{question:`A rectangle 9 cm by 6 cm has a staircase-shaped piece cut from one corner, made of three unit steps (as shown). What is the perimeter of the remaining figure?`,options:[`24`,`36`,`27`,`30`,`33`],hint1:`Every rightward step "loses" some boundary length, but the step going the other way "gains" it right back.`,hint2:`Add up all the horizontal step lengths — do they total the same as the rectangle’s width? Try the same for vertical steps and the height.`,quickIdea:`A staircase cut that stays within one corner does not change the total perimeter — it only rearranges it.`,steps:[`The three horizontal step segments together still span exactly the same horizontal distance as before the cut.`,`The three vertical step segments together still span exactly the same vertical distance as before the cut.`,`So the staircase boundary has the same total length as the original straight corner — the perimeter is unchanged.`,`Perimeter = 2 × (9 + 6) = 2 × 15 = 30 cm.`],whyOthersFail:`It looks like cutting a corner off should shorten the perimeter, but a staircase cut adds back exactly what it removes.`,competitionTip:`When a shape changes but a total (like perimeter) might stay the same, check what stays invariant — here, the total horizontal and vertical "reach" never changes.`,commonMistake:`Assuming any corner cut must reduce the perimeter, without checking the staircase steps add length back.`},th:{question:`สี่เหลี่ยมผืนผ้าขนาด 9 ซม. × 6 ซม. ถูกตัดมุมหนึ่งออกเป็นรูปขั้นบันได 3 ขั้น (ดังภาพ) เส้นรอบรูปของรูปที่เหลือคือเท่าไร`,options:[`24`,`36`,`27`,`30`,`33`],hint1:`ทุกครั้งที่ขั้นบันไดหักไปทางหนึ่ง จะ "เสีย" ความยาวขอบไปส่วนหนึ่ง แต่ขั้นที่หักกลับทางตรงข้ามจะ "ได้" ความยาวกลับคืนมา`,hint2:`ลองรวมความยาวแนวนอนของทุกขั้นดู เท่ากับความกว้างเดิมหรือไม่ แล้วลองทำแบบเดียวกันกับแนวตั้ง`,quickIdea:`การตัดขั้นบันไดที่อยู่ภายในมุมเดียวไม่เปลี่ยนเส้นรอบรูปรวม เพียงแค่จัดเรียงใหม่เท่านั้น`,steps:[`ความยาวแนวนอนของขั้นบันไดทั้งสามรวมกันยังเท่ากับระยะแนวนอนเดิมก่อนตัด`,`ความยาวแนวตั้งของขั้นบันไดทั้งสามรวมกันยังเท่ากับระยะแนวตั้งเดิมก่อนตัด`,`ดังนั้นเส้นขอบขั้นบันไดมีความยาวรวมเท่ากับมุมตรงเดิม เส้นรอบรูปจึงไม่เปลี่ยนแปลง`,`เส้นรอบรูป = 2 × (9 + 6) = 2 × 15 = 30 ซม.`],whyOthersFail:`ดูเหมือนว่าการตัดมุมออกน่าจะทำให้เส้นรอบรูปสั้นลง แต่ขั้นบันไดเพิ่มความยาวกลับมาเท่ากับที่ตัดออกไปพอดี`,competitionTip:`เมื่อรูปเปลี่ยนไปแต่ผลรวม (เช่นเส้นรอบรูป) อาจไม่เปลี่ยน ให้ตรวจว่าอะไรที่ "ไม่เปลี่ยน" — ที่นี่คือระยะเอื้อมแนวนอนและแนวตั้งรวมไม่เปลี่ยนเลย`,commonMistake:`สรุปว่าการตัดมุมออกต้องทำให้เส้นรอบรูปสั้นลงเสมอ โดยไม่ตรวจว่าขั้นบันไดเพิ่มความยาวกลับมา`},correctAnswer:`D`,diagram:{kind:`polygon`,props:{points:[[0,0],[9,0],[9,3],[8,3],[8,4],[7,4],[7,5],[6,5],[6,6],[0,6]],labels:[{text:`9 cm`,x:4.5,y:-.5},{text:`6 cm`,x:-.9,y:3}]}},verificationStatus:`verified`},{id:`M1-B-17`,mockSet:1,section:`B`,questionNumber:17,marks:4,difficulty:`competition`,topic:`Angles & Triangles`,subskill:`angle chasing with an isosceles bisector`,type:`mc`,en:{question:`In triangle PQR, PQ = PR (isosceles) and angle QPR = 40°. Point S lies on QR such that PS bisects angle QPR. What is the size of angle PSQ?`,options:[`80`,`90`,`70`,`110`,`100`],hint1:`Since PQ = PR, the two base angles of the triangle are equal — find them first.`,hint2:`The bisector splits the 40° angle exactly in half. Now use the angle sum of the small triangle PQS.`,quickIdea:`Chase angles one triangle at a time: find the base angles first, then use the smaller triangle formed by the bisector.`,steps:[`Since PQ = PR, angles PQR and PRQ are equal: each is (180° − 40°) ÷ 2 = 70°.`,`PS bisects the 40° apex angle, so angle QPS = 20°.`,`In triangle PQS: angle PQS = 70°, angle QPS = 20°, so angle PSQ = 180° − 70° − 20° = 90°.`],competitionTip:`This is a classic result: the bisector from the apex of an isosceles triangle always meets the base at a right angle.`,commonMistake:`Using the full 40° apex angle instead of the bisected 20° inside triangle PQS.`},th:{question:`ในรูปสามเหลี่ยม PQR ซึ่ง PQ = PR (หน้าจั่ว) และมุม QPR = 40° จุด S อยู่บน QR โดยที่ PS แบ่งครึ่งมุม QPR มุม PSQ มีขนาดเท่าไร`,options:[`80`,`90`,`70`,`110`,`100`],hint1:`เนื่องจาก PQ = PR มุมที่ฐานทั้งสองมุมของสามเหลี่ยมเท่ากัน หาค่าก่อน`,hint2:`เส้นแบ่งครึ่งแบ่งมุม 40° ออกเป็นสองส่วนเท่ากัน จากนั้นใช้ผลรวมมุมของสามเหลี่ยมเล็ก PQS`,quickIdea:`ไล่มุมทีละสามเหลี่ยม: หามุมที่ฐานก่อน แล้วใช้สามเหลี่ยมเล็กที่เกิดจากเส้นแบ่งครึ่ง`,steps:[`เนื่องจาก PQ = PR มุม PQR และ PRQ เท่ากัน: แต่ละมุม = (180° − 40°) ÷ 2 = 70°`,`PS แบ่งครึ่งมุมยอด 40° ดังนั้นมุม QPS = 20°`,`ในสามเหลี่ยม PQS: มุม PQS = 70°, มุม QPS = 20° ดังนั้นมุม PSQ = 180° − 70° − 20° = 90°`],competitionTip:`นี่เป็นผลลัพธ์คลาสสิก: เส้นแบ่งครึ่งจากมุมยอดของสามเหลี่ยมหน้าจั่วจะตั้งฉากกับฐานเสมอ`,commonMistake:`ใช้มุมยอดเต็ม 40° แทนที่จะใช้ 20° ที่ถูกแบ่งครึ่งแล้วภายในสามเหลี่ยม PQS`},correctAnswer:`B`,diagram:{kind:`triangle-bisector`,props:{apexAngle:40,halfAngle:20,baseAngle:70,targetAngle:`?`}},verificationStatus:`verified`},{id:`M1-B-18`,mockSet:1,section:`B`,questionNumber:18,marks:4,difficulty:`competition`,topic:`Counting Shapes`,subskill:`counting all triangles by size in a triangular grid`,type:`mc`,en:{question:`A large equilateral triangle is divided into a triangular grid of 4 rows, giving 16 small triangles (as shown). How many triangles of ALL sizes — pointing up or down, every size — are in the figure?`,options:[`16`,`32`,`20`,`24`,`27`],hint1:`Count systematically by size: how many size-1 upward triangles, size-2, size-3, size-4?`,hint2:`Don’t forget the downward-pointing triangles — count those by size too, separately.`,quickIdea:`Count triangles by size, upward and downward separately, then add every group together.`,steps:[`Upward triangles: size 1 → 10, size 2 → 6, size 3 → 3, size 4 → 1. Upward total = 10+6+3+1 = 20.`,`Downward triangles: size 1 → 6, size 2 → 1. Downward total = 6+1 = 7.`,`Grand total = 20 + 7 = 27.`],whyOthersFail:`Counting only the 16 smallest triangles (size 1 upward + size 1 downward = 16) misses every larger triangle in the figure.`,competitionTip:`For counting-figures problems, always organise your count into a table by size and direction — it prevents double-counting and missed shapes.`,commonMistake:`Stopping after counting only the smallest triangles, forgetting the larger combined ones.`},th:{question:`สามเหลี่ยมด้านเท่าขนาดใหญ่ถูกแบ่งเป็นตารางสามเหลี่ยม 4 แถว ได้สามเหลี่ยมเล็ก 16 รูป (ดังภาพ) มีสามเหลี่ยมทุกขนาดรวมกันกี่รูป (ทั้งหงายขึ้นและคว่ำลง ทุกขนาด)`,options:[`16`,`32`,`20`,`24`,`27`],hint1:`นับอย่างเป็นระบบตามขนาด: สามเหลี่ยมหงายขนาด 1, 2, 3, 4 มีกี่รูป`,hint2:`อย่าลืมสามเหลี่ยมคว่ำ นับตามขนาดแยกต่างหากด้วย`,quickIdea:`นับสามเหลี่ยมตามขนาด แยกหงายกับคว่ำ แล้วรวมทุกกลุ่มเข้าด้วยกัน`,steps:[`สามเหลี่ยมหงาย: ขนาด1 → 10, ขนาด2 → 6, ขนาด3 → 3, ขนาด4 → 1 รวมหงาย = 10+6+3+1 = 20`,`สามเหลี่ยมคว่ำ: ขนาด1 → 6, ขนาด2 → 1 รวมคว่ำ = 6+1 = 7`,`รวมทั้งหมด = 20 + 7 = 27`],whyOthersFail:`การนับเฉพาะสามเหลี่ยมเล็กที่สุด 16 รูป (หงายขนาด1 + คว่ำขนาด1 = 16) พลาดสามเหลี่ยมขนาดใหญ่กว่าทั้งหมด`,competitionTip:`สำหรับโจทย์นับรูปทรง ให้จัดตารางนับตามขนาดและทิศทางเสมอ ช่วยป้องกันการนับซ้ำหรือนับตกหล่น`,commonMistake:`หยุดนับหลังจากนับเฉพาะสามเหลี่ยมเล็กที่สุด ลืมสามเหลี่ยมขนาดใหญ่ที่รวมกัน`},correctAnswer:`E`,diagram:{kind:`triangle-grid`,props:{n:4}},verificationStatus:`verified`},{id:`M1-B-19`,mockSet:1,section:`B`,questionNumber:19,marks:4,difficulty:`competition`,topic:`Grid Paths`,subskill:`shortest paths avoiding a blocked point`,type:`mc`,en:{question:`On the grid below, you may only move RIGHT or UP along the grid lines. How many different shortest paths are there from A to B if you are NOT allowed to pass through the marked point X?`,options:[`17`,`35`,`15`,`21`,`18`],hint1:`First find the total number of shortest paths from A to B with no restriction.`,hint2:`Then find how many of those paths pass through X, and subtract.`,quickIdea:`Paths avoiding a point = (all paths) − (paths that pass through that point).`,steps:[`Total shortest paths from A(0,0) to B(4,3): choose 3 of 7 moves to be "up", giving C(7,3) = 35.`,`Paths from A to X(2,1): C(3,1) = 3. Paths from X to B: C(4,2) = 6. Paths through X = 3 × 6 = 18.`,`Paths avoiding X = 35 − 18 = 17.`],competitionTip:`For "number of ways to a point," build up a small Pascal’s-triangle-style grid, adding the count from the left and from below at each point.`,commonMistake:`Forgetting to multiply the two path counts (A-to-X and X-to-B) when finding paths through X, and adding them instead.`},th:{question:`บนตารางด้านล่าง เคลื่อนที่ได้เฉพาะ "ขวา" หรือ "ขึ้น" ตามเส้นตาราง มีเส้นทางที่สั้นที่สุดจาก A ไป B กี่เส้นทาง ถ้าห้ามผ่านจุด X ที่กำหนดไว้`,options:[`17`,`35`,`15`,`21`,`18`],hint1:`หาจำนวนเส้นทางสั้นที่สุดทั้งหมดจาก A ไป B โดยไม่มีข้อจำกัดก่อน`,hint2:`จากนั้นหาว่ามีกี่เส้นทางที่ผ่าน X แล้วนำไปลบออก`,quickIdea:`เส้นทางที่หลีกเลี่ยงจุดหนึ่ง = (เส้นทางทั้งหมด) − (เส้นทางที่ผ่านจุดนั้น)`,steps:[`เส้นทางสั้นที่สุดทั้งหมดจาก A(0,0) ไป B(4,3): เลือก 3 จาก 7 การเดินให้เป็น "ขึ้น" ได้ C(7,3) = 35`,`เส้นทางจาก A ไป X(2,1): C(3,1) = 3 เส้นทางจาก X ไป B: C(4,2) = 6 เส้นทางที่ผ่าน X = 3 × 6 = 18`,`เส้นทางที่หลีกเลี่ยง X = 35 − 18 = 17`],competitionTip:`สำหรับ "จำนวนวิธีไปถึงจุดหนึ่ง" ให้สร้างตารางแบบสามเหลี่ยมปาสกาลย่อ โดยบวกจำนวนจากซ้ายกับจากล่างที่แต่ละจุด`,commonMistake:`ลืมคูณจำนวนเส้นทางสองช่วง (A ไป X และ X ไป B) เมื่อหาเส้นทางที่ผ่าน X แล้วนำไปบวกกันแทน`},correctAnswer:`A`,diagram:{kind:`grid-path`,props:{cols:4,rows:3,start:{x:0,y:0,label:`A`},end:{x:4,y:3,label:`B`},marker:{x:2,y:1,label:`X`,kind:`blocked`}}},verificationStatus:`verified`},{id:`M1-B-20`,mockSet:1,section:`B`,questionNumber:20,marks:4,difficulty:`competition`,topic:`Logic & Elimination`,subskill:`repeated elimination around a circle`,type:`mc`,en:{question:`Twelve children numbered 1 to 12 stand in a circle. Starting the count at child 1, every 2nd child is eliminated (child 2 first, then child 4, then child 6, and so on around the circle, skipping already-eliminated children), continuing around and around until only one child remains. What is the number of the last child remaining?`,options:[`7`,`11`,`9`,`12`,`8`],hint1:`Track eliminations round by round: which children are eliminated in the first trip around the circle?`,hint2:`After the first round removes all the even numbers, keep going — the counting continues without resetting.`,quickIdea:`Simulate the elimination carefully round by round, tracking exactly who is left after each pass.`,steps:[`Round 1 (counting continuously): eliminate 2, 4, 6, 8, 10, 12. Remaining: 1, 3, 5, 7, 9, 11.`,`Round 2 (counting continues from after 12, restarting the 1-2 count at child 1): eliminate 3, 7, 11. Remaining: 1, 5, 9.`,`Round 3: eliminate 5. Remaining: 1, 9.`,`Round 4: eliminate 1. The last child remaining is 9.`],competitionTip:`For elimination puzzles, write out the full circle and physically cross out names round by round — trying to jump straight to a formula often causes errors under time pressure.`,commonMistake:`Restarting the "1, 2" count from the beginning of the circle after each full lap instead of continuing it seamlessly.`},th:{question:`เด็ก 12 คนหมายเลข 1 ถึง 12 ยืนเป็นวงกลม เริ่มนับที่เด็กคนที่ 1 ทุกคนที่ 2 จะถูกคัดออก (คนที่ 2 ก่อน แล้วคนที่ 4, คนที่ 6 ไปเรื่อยๆ รอบวง โดยข้ามคนที่ถูกคัดออกไปแล้ว) ทำต่อไปเรื่อยๆ จนเหลือเด็กเพียงคนเดียว เด็กคนสุดท้ายที่เหลืออยู่คือหมายเลขอะไร`,options:[`7`,`11`,`9`,`12`,`8`],hint1:`ติดตามการคัดออกทีละรอบ: รอบแรกรอบวงคัดใครออกบ้าง`,hint2:`หลังจากรอบแรกคัดเลขคู่ออกหมด นับต่อไปเรื่อยๆ โดยไม่เริ่มนับใหม่`,quickIdea:`จำลองการคัดออกอย่างละเอียดทีละรอบ ติดตามว่าเหลือใครบ้างหลังแต่ละรอบ`,steps:[`รอบ1 (นับต่อเนื่อง): คัดออก 2, 4, 6, 8, 10, 12 เหลือ 1, 3, 5, 7, 9, 11`,`รอบ2 (นับต่อจากหลังคนที่12 เริ่มนับ 1-2 ใหม่ที่คนที่1): คัดออก 3, 7, 11 เหลือ 1, 5, 9`,`รอบ3: คัดออก 5 เหลือ 1, 9`,`รอบ4: คัดออก 1 เด็กคนสุดท้ายที่เหลือคือหมายเลข 9`],competitionTip:`สำหรับโจทย์คัดออก ให้เขียนวงกลมเต็มแล้วขีดฆ่าชื่อทีละรอบจริงๆ การพยายามข้ามไปใช้สูตรทันทีมักทำให้ผิดพลาดเมื่อเร่งเวลา`,commonMistake:`เริ่มนับ "1, 2" ใหม่จากจุดเริ่มต้นของวงทุกครั้งที่ครบรอบ แทนที่จะนับต่อเนื่องไปเรื่อยๆ`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M1-C-21`,mockSet:1,section:`C`,questionNumber:21,marks:6,difficulty:`challenge`,topic:`Custom Operations`,subskill:`evaluating a nested custom operation`,type:`free-response`,en:{question:`For any two numbers a and b, define a ★ b = a×b − a − b + 1. Find the value of 5 ★ (3 ★ 2). (Enter your answer as a whole number.)`,hint1:`Do NOT assume ★ means anything you already know — always compute using the given definition.`,hint2:`Work out the inner operation, 3 ★ 2, completely first, then use that result as one of the inputs to the outer operation.`,quickIdea:`Translate the invented symbol into ordinary arithmetic using the definition, then substitute carefully, innermost brackets first.`,steps:[`First compute the inner value: 3 ★ 2 = (3×2) − 3 − 2 + 1 = 6 − 3 − 2 + 1 = 2.`,`Now compute 5 ★ 2 = (5×2) − 5 − 2 + 1 = 10 − 5 − 2 + 1 = 4.`,`So 5 ★ (3 ★ 2) = 4.`],whyOthersFail:`A quick check: a★b = (a−1)(b−1) always, since ab−a−b+1 factors exactly that way — this confirms 3★2=(2)(1)=2 and 5★2=(4)(1)=4.`,competitionTip:`For custom-operation questions, always compute the innermost bracket first, exactly like normal order of operations.`,commonMistake:`Substituting a and b into the definition in the wrong order, e.g. computing 2 ★ 3 instead of 3 ★ 2 (though here the definition happens to be symmetric, it usually is not).`},th:{question:`สำหรับจำนวนสองจำนวน a และ b ใดๆ กำหนดให้ a ★ b = a×b − a − b + 1 จงหาค่าของ 5 ★ (3 ★ 2) (ตอบเป็นจำนวนเต็ม)`,hint1:`ห้ามสมมติว่า ★ หมายถึงสิ่งที่รู้จักอยู่แล้ว ต้องคำนวณตามนิยามที่กำหนดให้เท่านั้น`,hint2:`คำนวณการดำเนินการด้านในก่อนให้เสร็จสมบูรณ์ คือ 3 ★ 2 แล้วนำผลลัพธ์ไปใช้เป็นค่าหนึ่งในการดำเนินการด้านนอก`,quickIdea:`แปลงสัญลักษณ์ที่คิดขึ้นใหม่ให้เป็นเลขคณิตปกติตามนิยาม แล้วแทนค่าอย่างระมัดระวัง เริ่มจากวงเล็บในสุดก่อน`,steps:[`คำนวณค่าด้านในก่อน: 3 ★ 2 = (3×2) − 3 − 2 + 1 = 6 − 3 − 2 + 1 = 2`,`จากนั้นคำนวณ 5 ★ 2 = (5×2) − 5 − 2 + 1 = 10 − 5 − 2 + 1 = 4`,`ดังนั้น 5 ★ (3 ★ 2) = 4`],whyOthersFail:`ตรวจสอบเร็วๆ: a★b = (a−1)(b−1) เสมอ เพราะ ab−a−b+1 แยกตัวประกอบได้พอดี ยืนยันว่า 3★2=(2)(1)=2 และ 5★2=(4)(1)=4`,competitionTip:`สำหรับโจทย์สัญลักษณ์ใหม่ ให้คำนวณวงเล็บในสุดก่อนเสมอ เหมือนลำดับการดำเนินการปกติ`,commonMistake:`แทนค่า a และ b ผิดลำดับ เช่นคำนวณ 2 ★ 3 แทนที่จะเป็น 3 ★ 2 (แม้ในที่นี้นิยามจะสมมาตรพอดี แต่โดยทั่วไปมักไม่สมมาตร)`},correctAnswer:`4`,acceptedAnswers:[`4`,`4.0`],verificationStatus:`verified`},{id:`M1-C-22`,mockSet:1,section:`C`,questionNumber:22,marks:6,difficulty:`challenge`,topic:`Strategy Games`,subskill:`finding a winning first move`,type:`free-response`,en:{question:`Two players take turns removing 1, 2, or 3 stones from a pile of 17 stones. The player who removes the last stone wins. If Player A goes first and both play perfectly, how many stones should Player A remove on the first turn to guarantee a win? (Enter 1, 2, or 3.)`,hint1:`Work backwards from 0 stones. A pile of 0 is a losing position for the player about to move (they can’t move / have already lost).`,hint2:`Find the pattern of losing positions — piles where any move you make hands your opponent a winning position.`,quickIdea:`Work backwards from the target (0 stones) to find which pile sizes are "traps" for whoever must move next.`,steps:[`With max removal 3, a pile that is a multiple of 4 is always a losing position for the player to move — whatever they remove (1, 2, or 3), the opponent can always remove enough to return to a multiple of 4.`,`17 = 4 × 4 + 1, so 17 is one more than a multiple of 4 (16).`,`Player A should remove 1 stone, leaving 16 (a multiple of 4) for the opponent — a losing position for them.`],competitionTip:`For subtraction games with moves 1 to k, the losing positions are always multiples of (k+1) — spot the pattern by working out small cases first.`,commonMistake:`Removing 3 stones (the maximum allowed) by instinct, without checking which move actually creates a losing position for the opponent.`},th:{question:`ผู้เล่นสองคนผลัดกันหยิบก้อนหิน 1, 2 หรือ 3 ก้อน จากกองที่มี 17 ก้อน ผู้ที่หยิบก้อนสุดท้ายเป็นผู้ชนะ ถ้าผู้เล่น A เริ่มก่อนและทั้งสองเล่นอย่างสมบูรณ์แบบ A ควรหยิบกี่ก้อนในตาแรกเพื่อรับประกันชัยชนะ (ตอบ 1, 2 หรือ 3)`,hint1:`ย้อนคิดจาก 0 ก้อน กองที่มี 0 ก้อนเป็นสถานะแพ้สำหรับผู้ที่ต้องเดินต่อ (เดินไม่ได้ / แพ้ไปแล้ว)`,hint2:`หารูปแบบของสถานะแพ้ — กองที่ไม่ว่าจะหยิบเท่าไรก็ส่งผลให้คู่ต่อสู้ได้สถานะชนะ`,quickIdea:`ย้อนคิดจากเป้าหมาย (0 ก้อน) เพื่อหาว่ากองขนาดใดเป็น "กับดัก" สำหรับผู้ที่ต้องเดินต่อ`,steps:[`เมื่อหยิบได้สูงสุด 3 กองที่เป็นพหุคูณของ 4 จะเป็นสถานะแพ้เสมอสำหรับผู้ที่ต้องเดิน ไม่ว่าจะหยิบเท่าไร (1, 2 หรือ 3) คู่ต่อสู้จะหยิบให้กลับไปเป็นพหุคูณของ 4 ได้เสมอ`,`17 = 4 × 4 + 1 ดังนั้น 17 มากกว่าพหุคูณของ 4 (คือ 16) อยู่ 1`,`A ควรหยิบ 1 ก้อน เหลือ 16 ก้อน (พหุคูณของ 4) ให้คู่ต่อสู้ ซึ่งเป็นสถานะแพ้สำหรับเขา`],competitionTip:`สำหรับเกมลบเลขที่หยิบได้ 1 ถึง k กองที่เป็นสถานะแพ้จะเป็นพหุคูณของ (k+1) เสมอ ลองหารูปแบบจากกรณีเล็กๆ ก่อน`,commonMistake:`หยิบ 3 ก้อน (จำนวนสูงสุดที่หยิบได้) ตามสัญชาตญาณ โดยไม่ตรวจว่าการเดินนั้นทำให้คู่ต่อสู้อยู่ในสถานะแพ้จริงหรือไม่`},correctAnswer:`1`,acceptedAnswers:[`1`,`1.0`],verificationStatus:`verified`},{id:`M1-C-23`,mockSet:1,section:`C`,questionNumber:23,marks:6,difficulty:`challenge`,topic:`Intersections`,subskill:`maximum intersections of lines and a circle`,type:`free-response`,en:{question:`What is the maximum possible number of points at which 4 distinct straight lines and 1 circle can intersect each other, all together? (Count line-line intersections and line-circle intersections; there is only one circle, so there are no circle-circle intersections. Do not count a curve crossing itself.)`,hint1:`Work out the maximum for line-line intersections and line-circle intersections separately, then add them.`,hint2:`A straight line can cross a circle at most 2 points. Any two distinct lines cross at most 1 point.`,quickIdea:`Break the count into pair-types (line–line, line–circle) and maximise each type separately before adding.`,steps:[`Line–line intersections: with 4 lines, each pair can cross at most once. Number of pairs = C(4,2) = 6.`,`Line–circle intersections: each of the 4 lines can cross the circle at up to 2 points, giving 4 × 2 = 8.`,`There is only 1 circle, so there are 0 circle–circle intersections.`,`Maximum total = 6 + 8 + 0 = 14.`],competitionTip:`For maximum-intersection problems, always split by pair TYPE first (line-line, line-circle, circle-circle), find the per-pair maximum for each type, then add.`,commonMistake:`Forgetting that lines can also intersect each other, and only counting the line-circle crossings.`},th:{question:`จำนวนจุดตัดที่มากที่สุดที่เป็นไปได้ เมื่อเส้นตรง 4 เส้นที่แตกต่างกันและวงกลม 1 วง ตัดกันทั้งหมด คือเท่าไร (นับจุดตัดเส้น-เส้น และเส้น-วงกลม มีวงกลมเพียงวงเดียวจึงไม่มีจุดตัดวงกลม-วงกลม ไม่นับเส้นโค้งตัดตัวเอง)`,hint1:`หาจำนวนสูงสุดของจุดตัดเส้น-เส้น และเส้น-วงกลมแยกกันก่อน แล้วนำมาบวกกัน`,hint2:`เส้นตรงหนึ่งเส้นตัดวงกลมได้มากที่สุด 2 จุด เส้นตรงสองเส้นที่ต่างกันตัดกันได้มากที่สุด 1 จุด`,quickIdea:`แบ่งการนับตามประเภทคู่ (เส้น-เส้น, เส้น-วงกลม) หาค่าสูงสุดของแต่ละประเภทแยกกัน แล้วนำมาบวกกัน`,steps:[`จุดตัดเส้น-เส้น: เส้นตรง 4 เส้น แต่ละคู่ตัดกันได้มากที่สุด 1 จุด จำนวนคู่ = C(4,2) = 6`,`จุดตัดเส้น-วงกลม: แต่ละเส้นใน 4 เส้นตัดวงกลมได้มากที่สุด 2 จุด รวม 4 × 2 = 8`,`มีวงกลมเพียงวงเดียว จึงไม่มีจุดตัดวงกลม-วงกลม (0 จุด)`,`ผลรวมสูงสุด = 6 + 8 + 0 = 14`],competitionTip:`สำหรับโจทย์จุดตัดสูงสุด ให้แบ่งตาม "ประเภทคู่" ก่อนเสมอ (เส้น-เส้น, เส้น-วงกลม, วงกลม-วงกลม) หาค่าสูงสุดต่อคู่ของแต่ละประเภท แล้วบวกกัน`,commonMistake:`ลืมว่าเส้นตรงสามารถตัดกันเองได้ด้วย นับเฉพาะจุดตัดเส้น-วงกลมเพียงอย่างเดียว`},correctAnswer:`14`,acceptedAnswers:[`14`,`14.0`],verificationStatus:`verified`},{id:`M1-C-24`,mockSet:1,section:`C`,questionNumber:24,marks:6,difficulty:`challenge`,topic:`Cube & Spatial Reasoning`,subskill:`painted cube: counting pieces with exactly two painted faces`,type:`free-response`,en:{question:`A large cube is built from 27 unit cubes arranged in a 3×3×3 arrangement. The outside of the large cube is completely painted, then it is taken apart into the 27 unit cubes. How many unit cubes have paint on EXACTLY 2 faces? (Enter a whole number.)`,hint1:`Sort the 27 unit cubes into groups by position: corners, edges, face-centres, and the very centre.`,hint2:`Only the unit cubes sitting along an EDGE of the big cube (but not at a corner) get exactly 2 painted faces.`,quickIdea:`Classify every small cube by how many outer faces of the big cube it touches: 3 (corner), 2 (edge), 1 (face-centre), or 0 (hidden centre).`,steps:[`Corner cubes (3 faces painted): the big cube has 8 corners → 8 cubes.`,`Edge cubes (2 faces painted): the big cube has 12 edges, and each edge of a 3×3×3 cube has exactly 1 cube between the two corners → 12 × 1 = 12 cubes.`,`Face-centre cubes (1 face painted): 6 faces × 1 centre cube each = 6 cubes. The very middle cube (0 faces) = 1 cube.`,`Check: 8 + 12 + 6 + 1 = 27 ✓. So exactly 2 painted faces = 12 cubes.`],competitionTip:`For an n×n×n painted cube, the "exactly 2 faces" count is always 12×(n−2) — the 12 comes from the cube’s 12 edges.`,commonMistake:`Confusing "2 faces painted" (edge pieces) with "3 faces painted" (corner pieces) and answering 8 instead of 12.`},th:{question:`ลูกบาศก์ขนาดใหญ่สร้างจากลูกบาศก์เล็ก 27 ก้อน จัดเรียงเป็น 3×3×3 ผิวด้านนอกของลูกบาศก์ใหญ่ถูกทาสีทั้งหมด แล้วแยกออกเป็นลูกบาศก์เล็ก 27 ก้อน มีลูกบาศก์เล็กกี่ก้อนที่มีสีทาอยู่พอดี 2 หน้า (ตอบเป็นจำนวนเต็ม)`,hint1:`จัดกลุ่มลูกบาศก์เล็กทั้ง 27 ก้อนตามตำแหน่ง: มุม, ขอบ, กลางหน้า, และตรงกลางสุด`,hint2:`มีเพียงลูกบาศก์เล็กที่อยู่บน "ขอบ" ของลูกบาศก์ใหญ่ (แต่ไม่ใช่มุม) เท่านั้นที่มีสีพอดี 2 หน้า`,quickIdea:`จัดประเภทลูกบาศก์เล็กแต่ละก้อนตามจำนวนหน้านอกของลูกบาศก์ใหญ่ที่สัมผัส: 3 (มุม), 2 (ขอบ), 1 (กลางหน้า), หรือ 0 (ตรงกลางที่ซ่อนอยู่)`,steps:[`ลูกบาศก์มุม (สี 3 หน้า): ลูกบาศก์ใหญ่มี 8 มุม → 8 ก้อน`,`ลูกบาศก์ขอบ (สี 2 หน้า): ลูกบาศก์ใหญ่มี 12 ขอบ แต่ละขอบของลูกบาศก์ 3×3×3 มีลูกบาศก์อยู่ระหว่างมุมพอดี 1 ก้อน → 12 × 1 = 12 ก้อน`,`ลูกบาศก์กลางหน้า (สี 1 หน้า): 6 หน้า × 1 ก้อนกลางต่อหน้า = 6 ก้อน ลูกบาศก์กลางสุด (สี 0 หน้า) = 1 ก้อน`,`ตรวจสอบ: 8 + 12 + 6 + 1 = 27 ✓ ดังนั้นลูกบาศก์ที่มีสีพอดี 2 หน้า = 12 ก้อน`],competitionTip:`สำหรับลูกบาศก์ที่ทาสี n×n×n จำนวนที่มีสีพอดี 2 หน้าจะเท่ากับ 12×(n−2) เสมอ เลข 12 มาจากจำนวนขอบของลูกบาศก์`,commonMistake:`สับสนระหว่าง "สี 2 หน้า" (ชิ้นขอบ) กับ "สี 3 หน้า" (ชิ้นมุม) แล้วตอบ 8 แทนที่จะเป็น 12`},correctAnswer:`12`,acceptedAnswers:[`12`,`12.0`],verificationStatus:`verified`},{id:`M1-C-25`,mockSet:1,section:`C`,questionNumber:25,marks:6,difficulty:`challenge`,topic:`Word Problems`,subskill:`combined work-rate problem with a pipe switch`,type:`free-response`,en:{question:`A tank is filled by Pipe A alone in 12 minutes, or by Pipe B alone in 20 minutes. Both pipes are opened together to start filling the empty tank. After some time, Pipe A is turned off, and Pipe B alone finishes filling the rest of the tank. If the WHOLE tank took exactly 10 minutes to fill from empty to full, for how many minutes was Pipe A open? (Enter a whole number.)`,hint1:`Pipe A fills 1/12 of the tank each minute; Pipe B fills 1/20 of the tank each minute. Let t be the number of minutes both pipes are open together.`,hint2:`After Pipe A is turned off, Pipe B works alone for the rest of the 10 minutes — write an equation for the total tank filled and solve for t.`,quickIdea:`Split the 10 minutes into "both pipes open" (t minutes) and "Pipe B alone" (10 − t minutes), then set the total water filled equal to 1 whole tank.`,steps:[`Combined rate of A and B together = 1/12 + 1/20 = 5/60 + 3/60 = 8/60 = 2/15 of the tank per minute.`,`Amount filled while both are open: t × 2/15. Amount filled by B alone afterward: (10 − t) × 1/20.`,`Total: t×(2/15) + (10−t)×(1/20) = 1. Multiplying every term by 60: 8t + 3(10−t) = 60 → 8t + 30 − 3t = 60 → 5t = 30 → t = 6.`,`Check: 6 minutes both open fills 6×2/15 = 0.8 of the tank; then 4 minutes of B alone fills 4×1/20 = 0.2. Total = 0.8+0.2 = 1 full tank. ✓`],competitionTip:`For work-rate problems, always convert "time alone" into a "rate per minute" (1 ÷ time) before combining pipes — rates add, but times do not.`,commonMistake:`Trying to average the two times (12 and 20) directly, instead of converting to rates and combining those.`},th:{question:`ท่อ A เพียงท่อเดียวเติมถังน้ำเต็มใน 12 นาที ท่อ B เพียงท่อเดียวเติมเต็มใน 20 นาที เปิดทั้งสองท่อพร้อมกันเพื่อเริ่มเติมถังเปล่า ผ่านไประยะหนึ่งปิดท่อ A แล้วให้ท่อ B เติมส่วนที่เหลือจนเต็มถังเพียงลำพัง ถ้าใช้เวลาทั้งหมด 10 นาทีพอดีในการเติมถังจากว่างจนเต็ม ท่อ A เปิดอยู่กี่นาที (ตอบเป็นจำนวนเต็ม)`,hint1:`ท่อ A เติมได้ 1/12 ของถังต่อนาที ท่อ B เติมได้ 1/20 ของถังต่อนาที ให้ t เป็นจำนวนนาทีที่ทั้งสองท่อเปิดพร้อมกัน`,hint2:`หลังปิดท่อ A ท่อ B ทำงานเพียงลำพังในเวลาที่เหลือจาก 10 นาที เขียนสมการปริมาณน้ำรวมแล้วแก้หา t`,quickIdea:`แบ่ง 10 นาทีเป็นช่วง "สองท่อเปิดพร้อมกัน" (t นาที) กับ "ท่อ B เปิดคนเดียว" (10 − t นาที) แล้วให้น้ำรวมเท่ากับถังเต็ม 1 ถัง`,steps:[`อัตรารวมของ A และ B = 1/12 + 1/20 = 5/60 + 3/60 = 8/60 = 2/15 ของถังต่อนาที`,`ปริมาณที่เติมได้ขณะเปิดทั้งคู่: t × 2/15 ปริมาณที่ท่อ B เติมเพียงลำพังหลังจากนั้น: (10 − t) × 1/20`,`รวม: t×(2/15) + (10−t)×(1/20) = 1 คูณทุกพจน์ด้วย 60: 8t + 3(10−t) = 60 → 8t + 30 − 3t = 60 → 5t = 30 → t = 6`,`ตรวจสอบ: 6 นาทีที่เปิดทั้งคู่เติมได้ 6×2/15 = 0.8 ของถัง จากนั้น 4 นาทีที่ท่อ B เปิดคนเดียวเติมได้ 4×1/20 = 0.2 รวม = 0.8+0.2 = 1 ถังเต็มพอดี ✓`],competitionTip:`สำหรับโจทย์อัตราการทำงาน ให้แปลง "เวลาที่ใช้คนเดียว" เป็น "อัตราต่อนาที" (1 ÷ เวลา) ก่อนรวมท่อเสมอ เพราะอัตรารวมกันได้ แต่เวลารวมกันตรงๆ ไม่ได้`,commonMistake:`พยายามหาค่าเฉลี่ยของเวลาทั้งสอง (12 และ 20) ตรงๆ แทนที่จะแปลงเป็นอัตราแล้วรวมกัน`},correctAnswer:`6`,acceptedAnswers:[`6`,`6.0`],verificationStatus:`verified`}],Nr={set:1,title:{en:`Mock Test 1`,th:`ข้อสอบจำลองชุดที่ 1`},estimatedMinutes:60},Pr=[{id:`M2-A-01`,mockSet:2,section:`A`,questionNumber:1,marks:3,difficulty:`foundation`,topic:`Number Sense`,subskill:`working backwards through mixed operations`,type:`mc`,en:{question:`A number is doubled, then 5 is added, then the result is divided by 3 to give 7. What was the original number?`,options:[`6`,`7`,`8`,`9`,`11`],hint1:`Reverse the last step first: multiply 7 by 3.`,hint2:`Then undo the addition, then undo the doubling.`,quickIdea:`Reverse each operation in the opposite order it was applied.`,steps:[`Undo "÷3": 7 × 3 = 21.`,`Undo "+5": 21 − 5 = 16.`,`Undo "double": 16 ÷ 2 = 8.`,`Check: 8 × 2 = 16, +5 = 21, ÷3 = 7. ✓`],competitionTip:`Write the operations as a chain, then flip both the order and each operation to reverse it.`,commonMistake:`Undoing the steps in the same order they were applied instead of reverse order.`},th:{question:`จำนวนหนึ่งถูกเพิ่มเป็นสองเท่า แล้วบวก 5 แล้วหารด้วย 3 ได้ผลลัพธ์เป็น 7 จำนวนเดิมคือเท่าไร`,options:[`6`,`7`,`8`,`9`,`11`],hint1:`ย้อนขั้นตอนสุดท้ายก่อน: นำ 7 คูณด้วย 3`,hint2:`จากนั้นย้อนการบวก แล้วย้อนการเพิ่มเป็นสองเท่า`,quickIdea:`ย้อนแต่ละขั้นตอนโดยสลับลำดับจากที่ทำไปตอนแรก`,steps:[`ย้อน "÷3": 7 × 3 = 21`,`ย้อน "+5": 21 − 5 = 16`,`ย้อน "คูณสอง": 16 ÷ 2 = 8`,`ตรวจสอบ: 8 × 2 = 16, +5 = 21, ÷3 = 7 ✓`],competitionTip:`เขียนขั้นตอนเป็นลูกโซ่ แล้วสลับทั้งลำดับและการกระทำเพื่อย้อนกลับ`,commonMistake:`ย้อนขั้นตอนตามลำดับเดิมแทนที่จะสลับลำดับ`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M2-A-02`,mockSet:2,section:`A`,questionNumber:2,marks:3,difficulty:`foundation`,topic:`Factors & Primes`,subskill:`highest common factor`,type:`mc`,en:{question:`What is the highest common factor (HCF) of 36 and 84?`,options:[`12`,`6`,`9`,`18`,`24`],hint1:`Break each number down into prime factors.`,hint2:`The HCF uses the LOWEST power of each prime that appears in BOTH numbers.`,quickIdea:`Prime-factorise both numbers, then multiply the shared prime factors at their smallest shared power.`,steps:[`36 = 2² × 3². 84 = 2² × 3 × 7.`,`Shared primes: 2 (smallest power 2² in both) and 3 (smallest power 3¹).`,`HCF = 2² × 3 = 4 × 3 = 12.`],competitionTip:`Prime factorisation is the most reliable way to find HCF for larger numbers — listing all factors can miss one.`,commonMistake:`Multiplying every shared prime at its HIGHEST power instead of its lowest shared power.`},th:{question:`ตัวหารร่วมมาก (HCF) ของ 36 และ 84 คือเท่าไร`,options:[`12`,`6`,`9`,`18`,`24`],hint1:`แยกตัวประกอบเฉพาะของแต่ละจำนวนก่อน`,hint2:`HCF ใช้เลขยกกำลังที่ต่ำที่สุดของแต่ละจำนวนเฉพาะที่ปรากฏในทั้งสองจำนวน`,quickIdea:`แยกตัวประกอบเฉพาะของทั้งสองจำนวน แล้วคูณตัวประกอบร่วมที่กำลังต่ำสุดร่วมกัน`,steps:[`36 = 2² × 3² และ 84 = 2² × 3 × 7`,`ตัวประกอบร่วม: 2 (กำลังต่ำสุดคือ 2² ทั้งคู่) และ 3 (กำลังต่ำสุดคือ 3¹)`,`HCF = 2² × 3 = 4 × 3 = 12`],competitionTip:`การแยกตัวประกอบเฉพาะเป็นวิธีที่แม่นยำที่สุดในการหา HCF ของจำนวนใหญ่ การไล่หาตัวประกอบทั้งหมดอาจพลาดบางตัว`,commonMistake:`คูณตัวประกอบร่วมด้วยกำลังสูงสุดแทนที่จะเป็นกำลังต่ำสุดร่วมกัน`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M2-A-03`,mockSet:2,section:`A`,questionNumber:3,marks:3,difficulty:`foundation`,topic:`Factors & Primes`,subskill:`lowest common multiple word problem`,type:`mc`,en:{question:`Two flashing lights start flashing together. One flashes every 8 seconds, the other every 12 seconds. After how many seconds will they flash together again?`,options:[`16`,`20`,`32`,`24`,`96`],hint1:`They flash together again after a time that is a multiple of BOTH 8 and 12.`,hint2:`You want the SMALLEST such time — the lowest common multiple.`,quickIdea:`Repeating-together problems ask for the LCM of the individual cycle lengths.`,steps:[`8 = 2³. 12 = 2² × 3.`,`LCM = 2³ × 3 = 24.`,`They flash together again after 24 seconds.`],competitionTip:`"How often does X happen again together" is almost always an LCM question.`,commonMistake:`Multiplying 8 × 12 = 96 directly, without removing the shared factors — that gives a common multiple, but not the lowest one.`},th:{question:`ไฟกะพริบสองดวงเริ่มกะพริบพร้อมกัน ดวงหนึ่งกะพริบทุก 8 วินาที อีกดวงกะพริบทุก 12 วินาที อีกกี่วินาทีจึงจะกะพริบพร้อมกันอีกครั้ง`,options:[`16`,`20`,`32`,`24`,`96`],hint1:`ทั้งสองจะกะพริบพร้อมกันอีกครั้งเมื่อเวลานั้นเป็นพหุคูณของทั้ง 8 และ 12`,hint2:`ต้องการเวลาที่น้อยที่สุดเช่นนั้น คือตัวคูณร่วมน้อย`,quickIdea:`โจทย์ "เกิดพร้อมกันอีกครั้งเมื่อไร" มักเป็นโจทย์ ค.ร.น. เสมอ`,steps:[`8 = 2³ และ 12 = 2² × 3`,`ค.ร.น. = 2³ × 3 = 24`,`ทั้งสองจะกะพริบพร้อมกันอีกครั้งหลังจาก 24 วินาที`],competitionTip:`"เกิด X พร้อมกันอีกครั้งเมื่อไร" มักเป็นโจทย์ ค.ร.น. เกือบทุกครั้ง`,commonMistake:`คูณ 8 × 12 = 96 ตรงๆ โดยไม่ตัดตัวประกอบร่วมออก ซึ่งได้ตัวคูณร่วมแต่ไม่ใช่ตัวที่น้อยที่สุด`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M2-A-04`,mockSet:2,section:`A`,questionNumber:4,marks:3,difficulty:`foundation`,topic:`Remainders`,subskill:`last-digit cyclic pattern for powers`,type:`mc`,en:{question:`What is the last digit (units digit) of 7²³?`,options:[`1`,`3`,`7`,`9`,`5`],hint1:`Write out the last digits of 7¹, 7², 7³, 7⁴, 7⁵ — you should spot a repeating cycle.`,hint2:`Once you know the cycle length, find where 23 lands in the cycle.`,quickIdea:`The units digit of powers of a number repeats in a short cycle — find the cycle, then use the remainder when the exponent is divided by the cycle length.`,steps:[`Last digits of powers of 7: 7¹→7, 7²→9, 7³→3, 7⁴→1, 7⁵→7 — the cycle length is 4.`,`23 ÷ 4 = 5 remainder 3, so 7²³ ends in the same digit as 7³.`,`7³ ends in 3, so 7²³ ends in 3.`],competitionTip:`Cyclic last-digit patterns almost always have length 1, 2, or 4 — write out the first 5 powers to find the exact cycle before trusting it.`,commonMistake:`Using the remainder 3 to mean "3rd digit in a different cycle," or miscounting the cycle length.`},th:{question:`เลขหลักหน่วยของ 7²³ คือเท่าไร`,options:[`1`,`3`,`7`,`9`,`5`],hint1:`เขียนหลักหน่วยของ 7¹, 7², 7³, 7⁴, 7⁵ ออกมา จะเห็นรูปแบบที่วนซ้ำ`,hint2:`เมื่อรู้ความยาวของรอบแล้ว หาว่า 23 ตกอยู่ตรงไหนในรอบ`,quickIdea:`หลักหน่วยของเลขยกกำลังจะวนซ้ำเป็นรอบสั้นๆ หารอบก่อน แล้วใช้เศษจากการหารเลขชี้กำลังด้วยความยาวรอบ`,steps:[`หลักหน่วยของ 7 ยกกำลัง: 7¹→7, 7²→9, 7³→3, 7⁴→1, 7⁵→7 ความยาวรอบคือ 4`,`23 ÷ 4 = 5 เศษ 3 ดังนั้น 7²³ ลงท้ายด้วยหลักเดียวกับ 7³`,`7³ ลงท้ายด้วย 3 ดังนั้น 7²³ ลงท้ายด้วย 3`],competitionTip:`รูปแบบหลักหน่วยที่วนซ้ำมักมีความยาวรอบ 1, 2 หรือ 4 เขียนเลขยกกำลัง 5 ตัวแรกก่อนเพื่อหารอบที่แน่นอน`,commonMistake:`ใช้เศษ 3 หมายถึง "หลักที่ 3 ในรอบอื่น" หรือนับความยาวรอบผิด`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M2-A-05`,mockSet:2,section:`A`,questionNumber:5,marks:3,difficulty:`foundation`,topic:`Number Sense`,subskill:`consecutive-number sum reasoning`,type:`mc`,en:{question:`The sum of five consecutive whole numbers is 100. What is the smallest of the five numbers?`,options:[`16`,`17`,`19`,`20`,`18`],hint1:`Let the smallest number be n, and write the other four in terms of n.`,hint2:`Add all five expressions together and set the total equal to 100.`,quickIdea:`For consecutive numbers, name the smallest as n and express the rest as n+1, n+2, and so on.`,steps:[`Let the numbers be n, n+1, n+2, n+3, n+4.`,`Sum = 5n + 10 = 100.`,`5n = 90, so n = 18.`],competitionTip:`For consecutive-number sums, the middle number always equals the average — here 100 ÷ 5 = 20 is the middle number, so the smallest is 20 − 2 = 18. A fast cross-check!`,commonMistake:`Forgetting the "+10" from adding 0+1+2+3+4 when setting up the equation.`},th:{question:`ผลบวกของจำนวนเต็มติดต่อกันห้าจำนวนเท่ากับ 100 จำนวนที่น้อยที่สุดในห้าจำนวนนี้คือเท่าไร`,options:[`16`,`17`,`19`,`20`,`18`],hint1:`ให้จำนวนที่น้อยที่สุดเป็น n แล้วเขียนอีกสี่จำนวนในรูปของ n`,hint2:`บวกทั้งห้านิพจน์เข้าด้วยกัน แล้วให้เท่ากับ 100`,quickIdea:`สำหรับจำนวนติดต่อกัน ให้ตั้งจำนวนน้อยที่สุดเป็น n แล้วเขียนที่เหลือเป็น n+1, n+2 ไปเรื่อยๆ`,steps:[`ให้จำนวนทั้งห้าเป็น n, n+1, n+2, n+3, n+4`,`ผลรวม = 5n + 10 = 100`,`5n = 90 ดังนั้น n = 18`],competitionTip:`สำหรับผลบวกจำนวนติดต่อกัน จำนวนกลางเท่ากับค่าเฉลี่ยเสมอ ที่นี่ 100 ÷ 5 = 20 คือจำนวนกลาง ดังนั้นจำนวนน้อยที่สุดคือ 20 − 2 = 18 ใช้ตรวจคำตอบได้เร็ว`,commonMistake:`ลืมบวก "+10" ที่มาจาก 0+1+2+3+4 เมื่อตั้งสมการ`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M2-A-06`,mockSet:2,section:`A`,questionNumber:6,marks:3,difficulty:`foundation`,topic:`Number Patterns`,subskill:`sum of the first n odd numbers`,type:`mc`,en:{question:`What is the sum of the first 9 odd numbers (1 + 3 + 5 + ⋯ + 17)?`,options:[`64`,`72`,`81`,`90`,`100`],hint1:`There is a famous shortcut for adding the first n odd numbers — no need to add them one by one.`,hint2:`The sum of the first n odd numbers always equals a perfect square.`,quickIdea:`The sum of the first n odd numbers is always n² — a classic identity worth memorising.`,steps:[`1 + 3 + 5 + ⋯ + (2n−1) = n².`,`Here n = 9 (since there are 9 odd numbers from 1 to 17).`,`Sum = 9² = 81.`],competitionTip:`This identity has a beautiful visual proof: each new odd number added forms an "L-shape" that grows a square by one more row and column.`,commonMistake:`Using n = 17 (the last term) instead of n = 9 (the number of terms) in the formula n².`},th:{question:`ผลบวกของเลขคี่ 9 ตัวแรก (1 + 3 + 5 + ⋯ + 17) คือเท่าไร`,options:[`64`,`72`,`81`,`90`,`100`],hint1:`มีทางลัดที่มีชื่อเสียงสำหรับการบวกเลขคี่ n ตัวแรก ไม่ต้องบวกทีละตัว`,hint2:`ผลบวกของเลขคี่ n ตัวแรกจะเป็นจำนวนกำลังสองเสมอ`,quickIdea:`ผลบวกของเลขคี่ n ตัวแรกเท่ากับ n² เสมอ เป็นเอกลักษณ์คลาสสิกที่ควรจำ`,steps:[`1 + 3 + 5 + ⋯ + (2n−1) = n²`,`ที่นี่ n = 9 (เพราะมีเลขคี่ 9 ตัวจาก 1 ถึง 17)`,`ผลบวก = 9² = 81`],competitionTip:`เอกลักษณ์นี้มีการพิสูจน์ด้วยภาพที่สวยงาม: เลขคี่แต่ละตัวที่เพิ่มเข้ามาเป็นรูปตัว L ที่ทำให้สี่เหลี่ยมจัตุรัสโตขึ้นอีกหนึ่งแถวและหนึ่งคอลัมน์`,commonMistake:`ใช้ n = 17 (พจน์สุดท้าย) แทนที่จะเป็น n = 9 (จำนวนพจน์) ในสูตร n²`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M2-A-07`,mockSet:2,section:`A`,questionNumber:7,marks:3,difficulty:`foundation`,topic:`Word Problems`,subskill:`age problem with a future condition`,type:`mc`,en:{question:`Tom is 4 years older than his sister Mia. In 6 years, the sum of their ages will be 40. How old is Mia now?`,options:[`12`,`8`,`10`,`14`,`16`],hint1:`Let Mia’s age now be m. Write Tom’s current age in terms of m.`,hint2:`In 6 years, each of them will be 6 years older — add 6 to each of their current ages before summing.`,quickIdea:`Set up one variable for the younger person, express the other in terms of it, then apply the future condition.`,steps:[`Let Mia = m now, so Tom = m + 4 now.`,`In 6 years: Mia = m+6, Tom = m+4+6 = m+10.`,`(m+6) + (m+10) = 40 → 2m + 16 = 40 → 2m = 24 → m = 12.`],competitionTip:`For age problems, always define the variable for the CURRENT age, then shift by the same amount for every person when a future or past time is mentioned.`,commonMistake:`Forgetting to add 6 years to BOTH people, or adding it only once to the total instead of once per person.`},th:{question:`ทอมอายุมากกว่ามีอา น้องสาวของเขา 4 ปี อีก 6 ปีข้างหน้า ผลรวมอายุของทั้งสองจะเป็น 40 ปี ปัจจุบันมีอาอายุเท่าไร`,options:[`12`,`8`,`10`,`14`,`16`],hint1:`ให้อายุมีอาปัจจุบันเป็น m เขียนอายุทอมปัจจุบันในรูปของ m`,hint2:`อีก 6 ปีข้างหน้า แต่ละคนจะแก่ขึ้น 6 ปี บวก 6 เข้ากับอายุปัจจุบันของแต่ละคนก่อนรวม`,quickIdea:`ตั้งตัวแปรสำหรับอายุปัจจุบันของคนที่อายุน้อยกว่า เขียนอีกคนในรูปของตัวแปรนั้น แล้วใช้เงื่อนไขอนาคต`,steps:[`ให้มีอา = m ปัจจุบัน ดังนั้นทอม = m + 4 ปัจจุบัน`,`อีก 6 ปี: มีอา = m+6, ทอม = m+4+6 = m+10`,`(m+6) + (m+10) = 40 → 2m + 16 = 40 → 2m = 24 → m = 12`],competitionTip:`สำหรับโจทย์อายุ ให้ตั้งตัวแปรสำหรับอายุปัจจุบันเสมอ แล้วเลื่อนเท่ากันทุกคนเมื่อกล่าวถึงอนาคตหรืออดีต`,commonMistake:`ลืมบวก 6 ปีให้ทั้งสองคน หรือบวกเพียงครั้งเดียวกับผลรวมแทนที่จะบวกให้แต่ละคน`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M2-A-08`,mockSet:2,section:`A`,questionNumber:8,marks:3,difficulty:`foundation`,topic:`Perimeter`,subskill:`comparing boundaries with equal perimeter`,type:`mc`,en:{question:`A square has a perimeter of 40 cm. A rectangle has the same perimeter, but its length is 4 cm more than its width. What is the width of the rectangle?`,options:[`6`,`7`,`9`,`8`,`10`],hint1:`Find the rectangle’s "length + width" total first, using the perimeter formula.`,hint2:`Use "length is 4 more than width" to write both sides using one variable.`,quickIdea:`Equal perimeter means equal "length + width" totals — use that total together with the length–width relationship.`,steps:[`Rectangle perimeter = 40, so length + width = 20.`,`Let width = w, so length = w + 4.`,`w + (w+4) = 20 → 2w + 4 = 20 → 2w = 16 → w = 8.`],competitionTip:`Perimeter problems almost always reduce to "half the perimeter = length + width" — write that down first before using any other clue.`,commonMistake:`Using the square’s side length (10 cm) as the rectangle’s width by mistake, ignoring that the shapes are different.`},th:{question:`สี่เหลี่ยมจัตุรัสมีเส้นรอบรูป 40 ซม. สี่เหลี่ยมผืนผ้ามีเส้นรอบรูปเท่ากัน แต่ความยาวมากกว่าความกว้าง 4 ซม. ความกว้างของสี่เหลี่ยมผืนผ้าคือเท่าไร`,options:[`6`,`7`,`9`,`8`,`10`],hint1:`หาผลรวม "ความยาว + ความกว้าง" ของสี่เหลี่ยมผืนผ้าก่อน โดยใช้สูตรเส้นรอบรูป`,hint2:`ใช้ "ความยาวมากกว่าความกว้าง 4" เขียนทั้งสองด้านด้วยตัวแปรเดียว`,quickIdea:`เส้นรอบรูปเท่ากันหมายถึงผลรวม "ความยาว+ความกว้าง" เท่ากัน ใช้ผลรวมนั้นร่วมกับความสัมพันธ์ของด้าน`,steps:[`เส้นรอบรูปสี่เหลี่ยมผืนผ้า = 40 ดังนั้นความยาว + ความกว้าง = 20`,`ให้ความกว้าง = w ดังนั้นความยาว = w + 4`,`w + (w+4) = 20 → 2w + 4 = 20 → 2w = 16 → w = 8`],competitionTip:`โจทย์เส้นรอบรูปมักลดรูปเป็น "ครึ่งหนึ่งของเส้นรอบรูป = ความยาว+ความกว้าง" เขียนไว้ก่อนใช้เงื่อนไขอื่น`,commonMistake:`ใช้ด้านของสี่เหลี่ยมจัตุรัส (10 ซม.) เป็นความกว้างของสี่เหลี่ยมผืนผ้าโดยไม่ตั้งใจ ทั้งที่เป็นคนละรูป`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M2-A-09`,mockSet:2,section:`A`,questionNumber:9,marks:3,difficulty:`foundation`,topic:`Area`,subskill:`area by decomposition (L-shape addition)`,type:`mc`,en:{question:`An L-shaped figure is made of two rectangles: one measuring 7 cm by 3 cm, and another measuring 4 cm by 5 cm, joined together with no overlap. What is the total area of the L-shape?`,options:[`35`,`41`,`38`,`44`,`47`],hint1:`Find the area of each rectangle separately.`,hint2:`Since there is no overlap, simply add the two areas together.`,quickIdea:`When a shape is made of non-overlapping pieces, its total area is the sum of the pieces’ areas.`,steps:[`Area of first rectangle = 7 × 3 = 21 cm².`,`Area of second rectangle = 4 × 5 = 20 cm².`,`Total area = 21 + 20 = 41 cm².`],competitionTip:`Decomposition (splitting into simple pieces and adding) works for any L-shape, T-shape, or staircase figure.`,commonMistake:`Multiplying the two areas together instead of adding them.`},th:{question:`รูปตัว L ประกอบด้วยสี่เหลี่ยมผืนผ้าสองรูป: รูปแรกขนาด 7 ซม. × 3 ซม. และรูปที่สองขนาด 4 ซม. × 5 ซม. นำมาต่อกันโดยไม่ทับซ้อน พื้นที่รวมของรูปตัว L คือเท่าไร`,options:[`35`,`41`,`38`,`44`,`47`],hint1:`หาพื้นที่ของสี่เหลี่ยมแต่ละรูปแยกกันก่อน`,hint2:`เนื่องจากไม่มีการทับซ้อน เพียงนำพื้นที่ทั้งสองมาบวกกัน`,quickIdea:`เมื่อรูปประกอบด้วยชิ้นส่วนที่ไม่ทับซ้อนกัน พื้นที่รวมคือผลบวกของพื้นที่แต่ละชิ้น`,steps:[`พื้นที่สี่เหลี่ยมรูปแรก = 7 × 3 = 21 ตร.ซม.`,`พื้นที่สี่เหลี่ยมรูปที่สอง = 4 × 5 = 20 ตร.ซม.`,`พื้นที่รวม = 21 + 20 = 41 ตร.ซม.`],competitionTip:`วิธีแยกส่วน (แบ่งเป็นชิ้นง่ายๆ แล้วบวกกัน) ใช้ได้กับรูปตัว L, ตัว T หรือรูปขั้นบันไดใดๆ`,commonMistake:`นำพื้นที่ทั้งสองไปคูณกันแทนที่จะบวกกัน`},correctAnswer:`B`,verificationStatus:`verified`},{id:`M2-A-10`,mockSet:2,section:`A`,questionNumber:10,marks:3,difficulty:`foundation`,topic:`Angles & Triangles`,subskill:`angles around a point`,type:`mc`,en:{question:`Four angles meet at a single point and together make a full turn. Three of the angles measure 95°, 80°, and 110°. What is the fourth angle?`,options:[`65`,`70`,`80`,`85`,`75`],hint1:`Angles that meet at a single point and go all the way around always add up to the same total.`,hint2:`Add the three known angles, then subtract from that total.`,quickIdea:`Angles around a point always sum to 360°.`,steps:[`95° + 80° + 110° = 285°.`,`Fourth angle = 360° − 285° = 75°.`],competitionTip:`Don’t confuse "around a point" (360°) with "on a straight line" (180°) — check whether the angles form a full circle or just a straight line.`,commonMistake:`Using 180° as the total instead of 360°, since these angles go all the way around a point, not along a straight line.`},th:{question:`มุมสี่มุมพบกันที่จุดหนึ่ง รวมกันครบหนึ่งรอบ สามมุมมีขนาด 95°, 80° และ 110° มุมที่สี่มีขนาดเท่าไร`,options:[`65`,`70`,`80`,`85`,`75`],hint1:`มุมที่พบกันที่จุดหนึ่งและรอบครบหนึ่งรอบ จะรวมกันได้ผลรวมเท่ากันเสมอ`,hint2:`บวกสามมุมที่รู้ค่าก่อน แล้วนำไปลบออกจากผลรวมนั้น`,quickIdea:`มุมรอบจุดรวมกันได้ 360° เสมอ`,steps:[`95° + 80° + 110° = 285°`,`มุมที่สี่ = 360° − 285° = 75°`],competitionTip:`อย่าสับสนระหว่าง "รอบจุด" (360°) กับ "บนเส้นตรง" (180°) ตรวจว่ามุมเหล่านี้ครบรอบวงกลมหรือเป็นเพียงเส้นตรง`,commonMistake:`ใช้ 180° เป็นผลรวมแทน 360° เพราะมุมเหล่านี้รอบจุดครบวง ไม่ใช่อยู่บนเส้นตรง`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M2-B-11`,mockSet:2,section:`B`,questionNumber:11,marks:4,difficulty:`competition`,topic:`Number Sense`,subskill:`working backwards through four operations`,type:`mc`,en:{question:`Sam thought of a number. He added 12, then multiplied the result by 3, then subtracted 9, and finally divided by 5 to get 15. What number did Sam start with?`,options:[`16`,`12`,`14`,`18`,`20`],hint1:`Reverse the four steps one at a time, starting from the LAST operation Sam performed.`,hint2:`Undo "÷5" first, then "−9", then "×3", then "+12".`,quickIdea:`For a long chain of operations, reverse them one at a time in exactly the opposite order.`,steps:[`Undo "÷5": 15 × 5 = 75.`,`Undo "−9": 75 + 9 = 84.`,`Undo "×3": 84 ÷ 3 = 28.`,`Undo "+12": 28 − 12 = 16.`],competitionTip:`Check your final answer by running it forward through all four original steps — it should land exactly back on 15.`,commonMistake:`Reversing the multiply and subtract steps in the wrong order (undoing ×3 before −9).`},th:{question:`แซมคิดเลขจำนวนหนึ่ง เขาบวก 12 แล้วคูณผลลัพธ์ด้วย 3 แล้วลบ 9 แล้วหารด้วย 5 ได้ผลลัพธ์เป็น 15 แซมเริ่มต้นด้วยเลขอะไร`,options:[`16`,`12`,`14`,`18`,`20`],hint1:`ย้อนทั้งสี่ขั้นตอนทีละขั้น เริ่มจากขั้นตอนสุดท้ายที่แซมทำ`,hint2:`ย้อน "÷5" ก่อน แล้ว "−9" แล้ว "×3" แล้ว "+12"`,quickIdea:`สำหรับลูกโซ่ขั้นตอนยาวๆ ให้ย้อนทีละขั้นโดยสลับลำดับตรงข้ามพอดี`,steps:[`ย้อน "÷5": 15 × 5 = 75`,`ย้อน "−9": 75 + 9 = 84`,`ย้อน "×3": 84 ÷ 3 = 28`,`ย้อน "+12": 28 − 12 = 16`],competitionTip:`ตรวจคำตอบสุดท้ายโดยเดินหน้าผ่านทั้งสี่ขั้นตอนเดิม ควรได้ผลลัพธ์ 15 พอดี`,commonMistake:`ย้อนขั้นตอนคูณกับลบผิดลำดับ (ย้อน ×3 ก่อน −9)`},correctAnswer:`A`,verificationStatus:`verified`},{id:`M2-B-12`,mockSet:2,section:`B`,questionNumber:12,marks:4,difficulty:`competition`,topic:`Factors & Primes`,subskill:`HCF applied to a cutting problem`,type:`mc`,en:{question:`Three ribbons measuring 18 m, 24 m, and 30 m are to be cut into equal-length pieces with no ribbon left over, using the greatest possible piece length. How many pieces will there be in total?`,options:[`9`,`10`,`12`,`11`,`15`],hint1:`"Greatest possible length with nothing left over" means you need the HCF of the three lengths.`,hint2:`Once you know the piece length, divide each ribbon by it and add the results.`,quickIdea:`Find the HCF first to get the piece length, then count how many pieces come from each ribbon.`,steps:[`18 = 2×3², 24 = 2³×3, 30 = 2×3×5. HCF = 2×3 = 6.`,`Each piece is 6 m long.`,`Pieces from each ribbon: 18÷6=3, 24÷6=4, 30÷6=5.`,`Total pieces = 3 + 4 + 5 = 12.`],competitionTip:`"Greatest length, nothing left over, from several different totals" is a strong signal to find the HCF.`,commonMistake:`Using the LCM instead of the HCF, or forgetting to add the piece-counts from all three ribbons.`},th:{question:`ริบบิ้นสามเส้นยาว 18 ม., 24 ม. และ 30 ม. จะถูกตัดเป็นชิ้นยาวเท่ากันโดยไม่เหลือเศษ ใช้ความยาวชิ้นมากที่สุดที่เป็นไปได้ จะได้ริบบิ้นทั้งหมดกี่ชิ้น`,options:[`9`,`10`,`12`,`11`,`15`],hint1:`"ความยาวมากที่สุดโดยไม่เหลือเศษ" หมายถึงต้องหา HCF ของความยาวทั้งสาม`,hint2:`เมื่อรู้ความยาวชิ้นแล้ว นำริบบิ้นแต่ละเส้นไปหารแล้วบวกผลลัพธ์`,quickIdea:`หา HCF ก่อนเพื่อให้ได้ความยาวชิ้น แล้วนับว่าแต่ละเส้นได้กี่ชิ้น`,steps:[`18 = 2×3², 24 = 2³×3, 30 = 2×3×5 HCF = 2×3 = 6`,`แต่ละชิ้นยาว 6 ม.`,`จำนวนชิ้นจากแต่ละเส้น: 18÷6=3, 24÷6=4, 30÷6=5`,`รวมทั้งหมด = 3 + 4 + 5 = 12 ชิ้น`],competitionTip:`"ความยาวมากที่สุด ไม่เหลือเศษ จากผลรวมหลายจำนวน" เป็นสัญญาณว่าต้องหา HCF`,commonMistake:`ใช้ ค.ร.น. แทน HCF หรือลืมบวกจำนวนชิ้นจากริบบิ้นทั้งสามเส้น`},correctAnswer:`C`,verificationStatus:`verified`},{id:`M2-B-13`,mockSet:2,section:`B`,questionNumber:13,marks:4,difficulty:`competition`,topic:`Average`,subskill:`updating an average after adding a value`,type:`mc`,en:{question:`The average score of 8 students in a quiz is 72. A ninth student joins and scores 90. What is the new average score of all 9 students?`,options:[`72`,`73`,`75`,`76`,`74`],hint1:`Find the total score of the original 8 students first.`,hint2:`Add the new student’s score, then divide by the new total number of students.`,quickIdea:`Convert to totals, update the total, then convert back to an average.`,steps:[`Total of 8 students = 8 × 72 = 576.`,`New total of 9 students = 576 + 90 = 666.`,`New average = 666 ÷ 9 = 74.`],competitionTip:`Whenever one value joins a group, always work through totals — never try to average two averages directly.`,commonMistake:`Averaging 72 and 90 directly (getting 81) instead of properly weighting by the number of students.`},th:{question:`คะแนนเฉลี่ยของนักเรียน 8 คนในแบบทดสอบคือ 72 นักเรียนคนที่ 9 เข้าร่วมและได้คะแนน 90 คะแนนเฉลี่ยใหม่ของนักเรียนทั้ง 9 คนคือเท่าไร`,options:[`72`,`73`,`75`,`76`,`74`],hint1:`หาผลรวมคะแนนของนักเรียน 8 คนเดิมก่อน`,hint2:`บวกคะแนนของนักเรียนคนใหม่ แล้วหารด้วยจำนวนนักเรียนทั้งหมดใหม่`,quickIdea:`แปลงเป็นผลรวมก่อน ปรับผลรวมใหม่ แล้วแปลงกลับเป็นค่าเฉลี่ย`,steps:[`ผลรวมของนักเรียน 8 คน = 8 × 72 = 576`,`ผลรวมใหม่ของนักเรียน 9 คน = 576 + 90 = 666`,`ค่าเฉลี่ยใหม่ = 666 ÷ 9 = 74`],competitionTip:`เมื่อมีค่าหนึ่งเข้าร่วมกลุ่ม ให้คำนวณผ่านผลรวมเสมอ อย่าพยายามหาค่าเฉลี่ยของค่าเฉลี่ยสองค่าตรงๆ`,commonMistake:`หาค่าเฉลี่ยของ 72 กับ 90 ตรงๆ (ได้ 81) แทนที่จะถ่วงน้ำหนักด้วยจำนวนนักเรียนอย่างถูกต้อง`},correctAnswer:`E`,verificationStatus:`verified`},{id:`M2-B-14`,mockSet:2,section:`B`,questionNumber:14,marks:4,difficulty:`competition`,topic:`Speed, Distance & Time`,subskill:`two objects moving toward each other`,type:`mc`,en:{question:`Two towns are 210 km apart. A car leaves Town X toward Town Y at 60 km/h, and at the same time another car leaves Town Y toward Town X at 45 km/h. After how many minutes will the two cars meet?`,options:[`60`,`90`,`100`,`120`,`140`],hint1:`When two objects move toward each other, their speeds combine to close the gap between them.`,hint2:`Find the combined speed first, then divide the distance by it to get the time.`,quickIdea:`For objects moving toward each other, add the speeds; for one chasing another, subtract them.`,steps:[`Combined speed = 60 + 45 = 105 km/h.`,`Time to meet = 210 ÷ 105 = 2 hours.`,`2 hours = 120 minutes.`],competitionTip:`Always check the direction of motion first — "toward each other" means add speeds, "same direction, one chasing" means subtract speeds.`,commonMistake:`Using only one car’s speed (e.g. 60 km/h) to find the time, instead of the combined closing speed.`},th:{question:`เมืองสองเมืองห่างกัน 210 กม. รถคันหนึ่งออกจากเมือง X มุ่งหน้าเมือง Y ด้วยความเร็ว 60 กม./ชม. ในเวลาเดียวกันอีกคันออกจากเมือง Y มุ่งหน้าเมือง X ด้วยความเร็ว 45 กม./ชม. อีกกี่นาทีรถทั้งสองคันจะพบกัน`,options:[`60`,`90`,`100`,`120`,`140`],hint1:`เมื่อวัตถุสองชิ้นเคลื่อนที่เข้าหากัน ความเร็วของทั้งสองจะรวมกันเพื่อปิดระยะห่าง`,hint2:`หาความเร็วรวมก่อน แล้วนำระยะทางไปหารด้วยความเร็วรวมเพื่อหาเวลา`,quickIdea:`เมื่อวัตถุเคลื่อนที่เข้าหากัน ให้บวกความเร็ว เมื่อวัตถุหนึ่งไล่ตามอีกวัตถุ ให้ลบความเร็ว`,steps:[`ความเร็วรวม = 60 + 45 = 105 กม./ชม.`,`เวลาที่พบกัน = 210 ÷ 105 = 2 ชั่วโมง`,`2 ชั่วโมง = 120 นาที`],competitionTip:`ตรวจทิศทางการเคลื่อนที่ก่อนเสมอ "เข้าหากัน" หมายถึงบวกความเร็ว "ทิศทางเดียวกัน ไล่ตาม" หมายถึงลบความเร็ว`,commonMistake:`ใช้ความเร็วของรถเพียงคันเดียว (เช่น 60 กม./ชม.) ในการหาเวลา แทนที่จะใช้ความเร็วรวม`},correctAnswer:`D`,verificationStatus:`verified`},{id:`M2-B-15`,mockSet:2,section:`B`,questionNumber:15,marks:4,difficulty:`competition`,topic:`Area`,subskill:`shaded region by subtraction (triangle in rectangle)`,type:`mc`,en:{question:`A rectangle measures 12 cm by 8 cm. A triangle is drawn inside it so that the triangle’s base is the full 12 cm bottom side of the rectangle, and its apex touches the midpoint of the top side. What is the area of the shaded region OUTSIDE the triangle but inside the rectangle?`,options:[`36`,`48`,`42`,`54`,`60`],hint1:`Find the area of the whole rectangle, and the area of the triangle, separately.`,hint2:`The triangle’s height equals the full height of the rectangle, since its apex touches the top side.`,quickIdea:`Shaded area outside a shape = area of the outer figure − area of the inner shape.`,steps:[`Area of rectangle = 12 × 8 = 96 cm².`,`The triangle has base 12 cm and height 8 cm (full rectangle height): area = ½ × 12 × 8 = 48 cm².`,`Shaded area = 96 − 48 = 48 cm².`],competitionTip:`A triangle whose base is a full side and apex touches the opposite side always has exactly half the area of the surrounding rectangle — worth remembering as a shortcut.`,commonMistake:`Using only part of the rectangle’s height as the triangle’s height, instead of the full 8 cm.`},th:{question:`สี่เหลี่ยมผืนผ้าขนาด 12 ซม. × 8 ซม. มีสามเหลี่ยมวาดอยู่ภายใน โดยฐานของสามเหลี่ยมคือด้านล่างเต็มความยาว 12 ซม. ของสี่เหลี่ยม และยอดแตะจุดกึ่งกลางของด้านบน พื้นที่บริเวณแรเงาที่อยู่นอกสามเหลี่ยมแต่ในสี่เหลี่ยมคือเท่าไร`,options:[`36`,`48`,`42`,`54`,`60`],hint1:`หาพื้นที่สี่เหลี่ยมทั้งหมดและพื้นที่สามเหลี่ยมแยกกันก่อน`,hint2:`ความสูงของสามเหลี่ยมเท่ากับความสูงเต็มของสี่เหลี่ยม เพราะยอดแตะด้านบนพอดี`,quickIdea:`พื้นที่แรเงานอกรูป = พื้นที่รูปนอก − พื้นที่รูปใน`,steps:[`พื้นที่สี่เหลี่ยม = 12 × 8 = 96 ตร.ซม.`,`สามเหลี่ยมมีฐาน 12 ซม. และสูง 8 ซม. (สูงเต็มของสี่เหลี่ยม): พื้นที่ = ½ × 12 × 8 = 48 ตร.ซม.`,`พื้นที่แรเงา = 96 − 48 = 48 ตร.ซม.`],competitionTip:`สามเหลี่ยมที่ฐานเป็นด้านเต็มและยอดแตะด้านตรงข้ามพอดี จะมีพื้นที่เท่ากับครึ่งหนึ่งของสี่เหลี่ยมที่ล้อมรอบเสมอ จำไว้เป็นทางลัดได้`,commonMistake:`ใช้เพียงบางส่วนของความสูงสี่เหลี่ยมเป็นความสูงสามเหลี่ยม แทนที่จะใช้ความสูงเต็ม 8 ซม.`},correctAnswer:`B`,diagram:{kind:`rectangle-triangle`,props:{w:12,h:8}},verificationStatus:`verified`},{id:`M2-B-16`,mockSet:2,section:`B`,questionNumber:16,marks:4,difficulty:`competition`,topic:`Grid Paths`,subskill:`shortest paths through a required point`,type:`mc`,en:{question:`On a grid, you may only move RIGHT or UP. How many shortest paths are there from A(0,0) to B(5,4) that MUST pass through point M(3,2)?`,options:[`60`,`45`,`50`,`56`,`70`],hint1:`Split the journey into two parts: A to M, and M to B.`,hint2:`Find the number of shortest paths for each part, then multiply them together.`,quickIdea:`Paths that must pass through a point = (paths to that point) × (paths from that point onward).`,steps:[`A(0,0) to M(3,2): needs 3 right, 2 up moves. Number of paths = C(5,2) = 10.`,`M(3,2) to B(5,4): needs 2 right, 2 up moves. Number of paths = C(4,2) = 6.`,`Total paths through M = 10 × 6 = 60.`],competitionTip:`Multiplying (not adding) is the key idea for "must pass through" path-counting — each A-to-M path can be combined with every M-to-B path.`,commonMistake:`Adding the two path counts (10 + 6 = 16) instead of multiplying them.`},th:{question:`บนตาราง เคลื่อนที่ได้เฉพาะ "ขวา" หรือ "ขึ้น" มีเส้นทางสั้นที่สุดจาก A(0,0) ไป B(5,4) กี่เส้นทางที่ต้องผ่านจุด M(3,2)`,options:[`60`,`45`,`50`,`56`,`70`],hint1:`แบ่งการเดินทางเป็นสองช่วง: A ไป M และ M ไป B`,hint2:`หาจำนวนเส้นทางสั้นที่สุดของแต่ละช่วง แล้วนำมาคูณกัน`,quickIdea:`เส้นทางที่ต้องผ่านจุดหนึ่ง = (เส้นทางไปจุดนั้น) × (เส้นทางจากจุดนั้นต่อไป)`,steps:[`A(0,0) ไป M(3,2): ต้องเดินขวา 3 ขึ้น 2 จำนวนเส้นทาง = C(5,2) = 10`,`M(3,2) ไป B(5,4): ต้องเดินขวา 2 ขึ้น 2 จำนวนเส้นทาง = C(4,2) = 6`,`เส้นทางรวมที่ผ่าน M = 10 × 6 = 60`],competitionTip:`การคูณ (ไม่ใช่บวก) เป็นแนวคิดหลักของการนับเส้นทาง "ต้องผ่าน" — แต่ละเส้นทาง A-ไป-M รวมกับทุกเส้นทาง M-ไป-B ได้`,commonMistake:`นำจำนวนเส้นทางทั้งสองมาบวกกัน (10 + 6 = 16) แทนที่จะคูณกัน`},correctAnswer:`A`,diagram:{kind:`grid-path`,props:{cols:5,rows:4,start:{x:0,y:0,label:`A`},end:{x:5,y:4,label:`B`},marker:{x:3,y:2,label:`M`,kind:`required`}}},verificationStatus:`verified`},{id:`M2-B-17`,mockSet:2,section:`B`,questionNumber:17,marks:4,difficulty:`competition`,topic:`Counting Shapes`,subskill:`counting all squares by size in a grid`,type:`mc`,en:{question:`How many squares of ALL sizes (including the large square itself) are there in a 4×4 grid of unit squares?`,options:[`16`,`20`,`30`,`25`,`36`],hint1:`Count systematically by size: how many 1×1 squares fit? How many 2×2? And so on.`,hint2:`For a k×k square inside a 4×4 grid, count how many DIFFERENT positions it can sit in.`,quickIdea:`The number of k×k squares that fit in an n×n grid is (n−k+1)², for each size k from 1 to n.`,steps:[`1×1 squares: (4−1+1)² = 4² = 16.`,`2×2 squares: (4−2+1)² = 3² = 9.`,`3×3 squares: (4−3+1)² = 2² = 4.`,`4×4 squares: (4−4+1)² = 1² = 1.`,`Total = 16 + 9 + 4 + 1 = 30.`],whyOthersFail:`Counting only the 16 smallest unit squares misses every larger square (2×2, 3×3, and the 4×4 grid itself).`,competitionTip:`The pattern (n−k+1)² also explains why the total for an n×n grid is always a sum of consecutive squares — a useful shortcut to check your work.`,commonMistake:`Stopping after counting only the 1×1 squares, forgetting to also count 2×2, 3×3, and 4×4 squares.`},th:{question:`มีสี่เหลี่ยมจัตุรัสทุกขนาด

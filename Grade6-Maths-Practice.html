oke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"34.0\" y1=\"0.0\" x2=\"34.0\" y2=\"136.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"68.0\" y1=\"0.0\" x2=\"68.0\" y2=\"136.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"102.0\" y1=\"0.0\" x2=\"102.0\" y2=\"136.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"102.0\" y2=\"0.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"34.0\" x2=\"102.0\" y2=\"34.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"68.0\" x2=\"102.0\" y2=\"68.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"102.0\" x2=\"102.0\" y2=\"102.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"136.0\" x2=\"102.0\" y2=\"136.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><rect x=\"34\" y=\"0\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2\"/><rect x=\"0\" y=\"34\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2\"/><rect x=\"34\" y=\"34\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2\"/><rect x=\"68\" y=\"34\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2\"/><rect x=\"34\" y=\"68\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2\"/><text x=\"17.0\" y=\"17.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">P</text><text x=\"85.0\" y=\"85.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">Q</text><text x=\"51.0\" y=\"119.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"600\" dominant-baseline=\"middle\">R</text></svg>","sol":"Adding R makes a cross-shaped net, which folds to a cube. A square at P (or at Q) folds onto a face that is already covered, so two squares overlap and one face of the cube is left open.","scheme":["B1 R","C1 a square at P (or Q) overlaps a face that is already covered"],"watch":"Choosing P or Q because the squares still touch — touching is not enough, the faces must not overlap.","ans":"R","check":{"type":"self"}},{"n":16,"s":"B","m":2,"text":"Solid <b>A</b> is a triangular pyramid and solid <b>B</b> is a triangular prism. How many <b>more edges</b> does solid B have than solid A?","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-26.0 -26.0 202.0 172.0\" style=\"width:28mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"70,0 0,120 120,120\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"70,0 120,120 150,86\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"0\" y1=\"120\" x2=\"150\" y2=\"86\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-26.0 -44.0 212.0 180.0\" style=\"width:28mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,110 60,10 120,110\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"60,10 100,-18 160,82 120,110\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"0\" y1=\"110\" x2=\"40\" y2=\"82\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"40\" y1=\"82\" x2=\"160\" y2=\"82\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"40\" y1=\"82\" x2=\"100\" y2=\"-18\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div></div>","sol":"The triangular prism has 9 edges and the triangular pyramid has 6 edges. 9 − 6 = 3.","scheme":["M1 9 edges and 6 edges both correct","A1 3"],"watch":"Comparing faces (5 and 4) instead of edges and answering 1.","ans":"3 more edges","check":{"type":"self"}},{"n":17,"s":"B","m":2,"text":"The hexagon below is the base of a pyramid. Work out <b>(i)</b> the number of faces and <b>(ii)</b> the number of edges of this pyramid.","fig":"<svg class=\"fig\" viewBox=\"-94.0 -84.6 188.0 169.2\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"35.0,-60.6 70.0,-0.0 35.0,60.6 -35.0,60.6 -70.0,0.0 -35.0,-60.6\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/></svg>","sol":"There are 6 triangular faces plus the hexagonal base, so 7 faces. There are 6 edges round the base and 6 sloping edges, so 12 edges.","scheme":["B1 7 faces","B1 12 edges"],"watch":"Forgetting to count the base as a face (answering 6).","ans":"(i) 7 faces  (ii) 12 edges","check":{"type":"numeric","nums":[7.0,12.0],"unit":"","display":"(i) 7 faces (ii) 12 edges"}},{"n":18,"s":"B","m":2,"text":"Here is a net. <b>(i)</b> Name the solid it folds to make. <b>(ii)</b> How many <b>flat faces</b> will that solid have?","fig":"<svg class=\"fig\" viewBox=\"-16.0 -22.0 196.0 116.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 A72,72 0 0 1 96,52 L36,64 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><circle cx=\"128\" cy=\"34\" r=\"34\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg>","sol":"The circle becomes the flat base and the curved piece wraps round to make the curved surface, so the net makes a cone. It has 1 flat face.","scheme":["B1 cone","B1 1 flat face"],"watch":"Answering 2 flat faces by counting the curved piece as a face.","ans":"(i) Cone  (ii) 1 flat face","check":{"type":"numeric","nums":[1.0],"unit":"","display":"(i) Cone (ii) 1 flat face"}},{"n":19,"s":"B","m":2,"text":"The net below folds to make a cuboid. <b>(i)</b> How many faces will the cuboid have? <b>(ii)</b> How many edges meet at each vertex of the cuboid?","fig":"<svg class=\"fig\" viewBox=\"-16.0 -16.0 200.0 148.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"32\" y=\"0\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"84\" y=\"32\" width=\"32\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"116\" y=\"32\" width=\"52\" height=\"52\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"32\" y=\"84\" width=\"52\" height=\"32\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg>","sol":"The net has 6 rectangles, so the cuboid has 6 faces. At every corner of a cuboid three edges meet.","scheme":["B1 6 faces","B1 3 edges"],"watch":"Answering 4 for part (ii) by counting the edges round one face instead of at one corner.","ans":"(i) 6 faces  (ii) 3 edges","check":{"type":"numeric","nums":[6.0,3.0],"unit":"","display":"(i) 6 faces (ii) 3 edges"}},{"n":20,"s":"B","m":2,"text":"Malee sorts the five solids below. Write down the <b>letters</b> of the solids that have a <b>curved surface</b>.","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-60.0 -26.0 272.0 208.0\" style=\"width:23mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,34 100,34 100,134 0,134\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,34 34,0 134,0 100,34\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"100,34 134,0 134,100 100,134\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,134 34,100 134,100\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"34\" y1=\"0\" x2=\"34\" y2=\"100\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-26.0 -26.0 152.0 206.0\" style=\"width:23mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M50.0,0 L0,120 A50.0,22 0 0 0 100,120 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><path d=\"M0,120 A50.0,22 0 0 1 100,120\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">C</div><svg class=\"fig\" viewBox=\"-26.0 -44.0 212.0 180.0\" style=\"width:23mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,110 60,10 120,110\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"60,10 100,-18 160,82 120,110\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"0\" y1=\"110\" x2=\"40\" y2=\"82\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"40\" y1=\"82\" x2=\"160\" y2=\"82\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"40\" y1=\"82\" x2=\"100\" y2=\"-18\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">D</div><svg class=\"fig\" viewBox=\"-88.0 -88.0 176.0 176.0\" style=\"width:23mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><circle cx=\"0\" cy=\"0\" r=\"62\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><ellipse cx=\"0\" cy=\"0\" rx=\"62\" ry=\"17.360000000000003\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">E</div><svg class=\"fig\" viewBox=\"-26.0 -26.0 194.0 198.0\" style=\"width:23mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"71.0,0 0,146 108,146\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"71.0,0 108,146 142,112\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,146 34,112 142,112\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"71.0\" y1=\"0\" x2=\"34\" y2=\"112\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div></div>","sol":"B is a cone and D is a sphere; each has a curved surface. The cube, the triangular prism and the square pyramid have flat faces only.","scheme":["B1 B (cone)","B1 D (sphere)"],"watch":"Including the square pyramid because its faces slope — sloping faces are still flat.","ans":"B and D","check":{"type":"self"}},{"n":21,"s":"C","m":4,"text":"The net below folds to make a cube. Each face is labelled with a letter.","fig":"<svg class=\"fig\" viewBox=\"-16.0 -16.0 176.0 140.0\" style=\"width:46mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"0\" y=\"0\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"18.0\" y=\"18.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">A</text><rect x=\"0\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"18.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">B</text><rect x=\"36\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"54.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">C</text><rect x=\"72\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"90.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">D</text><rect x=\"108\" y=\"36\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"126.0\" y=\"54.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">E</text><rect x=\"108\" y=\"72\" width=\"36\" height=\"36\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><text x=\"126.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1f2937\" font-weight=\"700\" dominant-baseline=\"middle\">F</text></svg>","sol":"","scheme":["B1 any two correct pairs","B1 all three pairs correct","C1 joined faces fold to meet at an edge, so they are next to each other","C1 states A is opposite F"],"watch":"Assuming faces that touch in the net are opposite, when touching faces are always next to each other.","parts":[{"label":"(a)","text":"Write down the three pairs of opposite faces.","fig":"","m":2,"ans":"A and F, B and D, C and E","sol":"B, C, D and E form a strip of four, so B is opposite D and C is opposite E. That leaves A opposite F.","check":{"type":"self"}},{"label":"(b)","text":"Ben says, “Face A and face B must be opposite each other, because they are joined together in the net.” Explain why Ben is wrong.","fig":"","m":2,"ans":"Faces joined in the net end up next to each other","sol":"Two faces joined along a line in the net fold along that line, so they meet at an edge of the cube and sit next to each other. Opposite faces never touch. A is actually opposite F.","check":{"type":"self"}}]},{"n":22,"s":"C","m":4,"text":"Look at the four solids below.","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-26.0 -26.0 194.0 198.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"71.0,0 0,146 108,146\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"71.0,0 108,146 142,112\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,146 34,112 142,112\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"71.0\" y1=\"0\" x2=\"34\" y2=\"112\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-26.0 -44.0 212.0 180.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,110 60,10 120,110\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"60,10 100,-18 160,82 120,110\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><line x1=\"0\" y1=\"110\" x2=\"40\" y2=\"82\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"40\" y1=\"82\" x2=\"160\" y2=\"82\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"40\" y1=\"82\" x2=\"100\" y2=\"-18\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">C</div><svg class=\"fig\" viewBox=\"-26.0 -40.0 196.0 226.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,22 L0,138 A48.0,22 0 0 0 96,138 L96,22 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><ellipse cx=\"48.0\" cy=\"22\" rx=\"48.0\" ry=\"22\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><path d=\"M0,138 A48.0,22 0 0 1 96,138\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">D</div><svg class=\"fig\" viewBox=\"-26.0 -26.0 152.0 206.0\" style=\"width:25mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M50.0,0 L0,120 A50.0,22 0 0 0 100,120 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><path d=\"M0,120 A50.0,22 0 0 1 100,120\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg></div></div>","sol":"","scheme":["B1 letter B","B1 triangular prism","B1 says No","C1 the cylinder has 2 flat circular ends, not 1"],"watch":"Choosing solid A because it also has 5 faces, without checking the vertices and edges.","parts":[{"label":"(a)","text":"One solid has 5 faces, 6 vertices and 9 edges. Write down its letter and its name.","fig":"","m":2,"ans":"B, triangular prism","sol":"The triangular prism has 2 triangular faces and 3 rectangular faces (5 faces), 6 vertices and 9 edges. Solid A, the square pyramid, has 5 faces but only 5 vertices and 8 edges.","check":{"type":"self"}},{"label":"(b)","text":"Krit says, “Solid C and solid D each have exactly one flat face.” Is Krit correct? Explain your answer.","fig":"","m":2,"ans":"No","sol":"No. Solid D, the cone, does have one flat face, but solid C, the cylinder, has two flat faces — a circle at each end.","check":{"type":"yesno","value":"no"}}]},{"n":23,"s":"C","m":4,"text":"Here are four nets.","fig":"<div class=\"figrow\"><div class=\"figcell\"><div class=\"figcap\">A</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 110.0 136.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"52\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><rect x=\"26\" y=\"78\" width=\"26\" height=\"26\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">B</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 206.0 98.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"30\" y=\"0\" width=\"110\" height=\"66\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><ellipse cx=\"17\" cy=\"33\" rx=\"17\" ry=\"17\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><ellipse cx=\"157\" cy=\"33\" rx=\"17\" ry=\"17\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">C</div><svg class=\"fig\" viewBox=\"-16.0 -16.0 167.0 167.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><rect x=\"54\" y=\"54\" width=\"54\" height=\"54\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,54 108,54 81.0,0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,54 54,108 0,81.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"108,54 108,108 135.0,81.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><polygon points=\"54,108 108,108 81.0,135.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div><div class=\"figcell\"><div class=\"figcap\">D</div><svg class=\"fig\" viewBox=\"-16.0 -22.0 196.0 116.0\" style=\"width:27mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><path d=\"M0,0 A72,72 0 0 1 96,52 L36,64 Z\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/><circle cx=\"128\" cy=\"34\" r=\"34\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.7\"/></svg></div></div>","sol":"","scheme":["B1 any two nets matched correctly","B1 all four nets matched correctly","B1 2 flat faces","C1 the two circles become the two flat ends"],"watch":"Counting the rectangle in net B as a third flat face, when it rolls into the curved surface.","parts":[{"label":"(a)","text":"Match each net to the solid it makes: cone, cube, cylinder, square pyramid.","fig":"","m":2,"ans":"A cube, B cylinder, C square pyramid, D cone","sol":"A is six squares (cube), B is two circles and a rectangle (cylinder), C is a square with four triangles (square pyramid), D is a circle with a curved piece (cone).","check":{"type":"self"}},{"label":"(b)","text":"How many flat faces will the solid made from net <b>B</b> have? Explain how you can tell from the net.","fig":"","m":2,"ans":"2 flat faces","sol":"Net B has two circles, and each circle folds to become one flat end. The rectangle rolls round to make the curved surface, which is not a flat face.","check":{"type":"numeric","nums":[2.0],"unit":"","display":"2 flat faces"}}]},{"n":24,"s":"C","m":4,"text":"Malee is making a gift box. The box is the cuboid shown below.","fig":"<svg class=\"fig\" viewBox=\"-60.0 -26.0 304.0 188.0\" style=\"width:54mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0,36 130,36 130,114 0,114\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"0,36 36,0 166,0 130,36\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polygon points=\"130,36 166,0 166,78 130,114\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\"/><polyline points=\"0,114 36,78 166,78\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"36\" y1=\"0\" x2=\"36\" y2=\"78\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"65.0\" y=\"132.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text><text x=\"-14.0\" y=\"75.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"176.0\" y=\"20.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text></svg>","sol":"","scheme":["B1 3 different sizes","B1 all three sizes correct: 20 × 10, 20 × 12 and 10 × 12","C1 six equal squares would fold into a cube","C1 this box is a cuboid, so its faces are not all the same size"],"watch":"Thinking that any net made of six pieces will fold into any box.","parts":[{"label":"(a)","text":"Malee draws a net for the box. The net is made of 6 rectangles. How many <b>different sizes</b> of rectangle does the net need? Write down the measurements of each size.","fig":"","m":2,"ans":"3 different sizes: 20 cm × 10 cm, 20 cm × 12 cm, 10 cm × 12 cm","sol":"The faces of a cuboid come in matching pairs: two 20 cm × 10 cm, two 20 cm × 12 cm and two 10 cm × 12 cm. That is 3 different sizes.","check":{"type":"self"}},{"label":"(b)","text":"Sofia says, “I could make the same box from a net of six equal squares.” Explain why Sofia is wrong.","fig":"","m":2,"ans":"Six equal squares make a cube, not this box","sol":"Six equal squares fold into a cube, and every edge of a cube is the same length. This box is a cuboid with edges of 20 cm, 10 cm and 12 cm, so its faces are rectangles of three different sizes, not six equal squares.","check":{"type":"self"}}]},{"n":25,"s":"C","m":4,"text":"Krit is looking for a pattern in prisms. He starts this table.","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:left\">Prism</th><th style=\"text-align:center\">Faces</th><th style=\"text-align:center\">Edges</th><th style=\"text-align:center\">Vertices</th></tr></thead><tbody><tr><td style=\"text-align:left\">Triangular prism</td><td style=\"text-align:center\">5</td><td style=\"text-align:center\">9</td><td style=\"text-align:center\">6</td></tr><tr><td style=\"text-align:left\">Rectangular prism</td><td style=\"text-align:center\">6</td><td style=\"text-align:center\">12</td><td style=\"text-align:center\">8</td></tr><tr><td style=\"text-align:left\">Pentagonal prism</td><td style=\"text-align:center\">?</td><td style=\"text-align:center\">?</td><td style=\"text-align:center\">?</td></tr></tbody></table></div>","sol":"","scheme":["B1 7 faces","B1 15 edges and 10 vertices","M1 24 ÷ 3 = 8 sides on each end","A1 16 vertices"],"watch":"Dividing 24 by 2 instead of 3, because each end shape is counted with the joining edges as well.","parts":[{"label":"(a)","text":"Work out the three numbers for the pentagonal prism (its two end faces are pentagons).","fig":"","m":2,"ans":"7 faces, 15 edges, 10 vertices","sol":"A pentagon has 5 sides, so there are 5 rectangular faces plus 2 pentagons = 7 faces. Edges: 5 + 5 round the two ends and 5 joining them = 15. Vertices: 5 at each end = 10.","check":{"type":"numeric","nums":[7.0,15.0,10.0],"unit":"","display":"7 faces, 15 edges, 10 vertices"}},{"label":"(b)","text":"A different prism has 24 edges. Work out how many vertices it has. Explain your method.","fig":"","m":2,"ans":"16 vertices","sol":"A prism has 3 edges for every side of its end shape, so the end shape has 24 ÷ 3 = 8 sides. Each end has 8 corners, so there are 2 × 8 = 16 vertices.","check":{"type":"numeric","nums":[16.0],"unit":"","display":"16 vertices"}}]}]},{"id":"09_Perimeter-Area-Triangles","code":"Chapter 9","title":"Perimeter and Area of Triangles","colour":"#1F7A54","blurb":"½ × base × height","sub":"Finding the perimeter of a triangle · Finding the area of a triangle · Word problems","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"Find the <b>perimeter</b> of the triangle below.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"75.0\" y=\"112.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"147.2\" y=\"35.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text><text x=\"38.2\" y=\"28.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">11 cm</text></svg>","sol":"Perimeter = 12 + 8 + 11 = 31 cm","scheme":[],"watch":"Adding only two of the three sides (19 cm, 20 cm or 23 cm).","opts":["19 cm","20 cm","23 cm","31 cm"],"ans":3,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"The triangle below has a base of 14 cm and a height of 8 cm. Find its <b>area</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"93.0\" y1=\"90.0\" x2=\"93.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"93.0\" y1=\"78.0\" x2=\"105.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"90.0\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"108.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text><text x=\"99.0\" y=\"46.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text></svg>","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × base × height = <sup>1</sup>⁄<sub>2</sub> × 14 × 8 = 56 cm<sup>2</sup>","scheme":[],"watch":"Forgetting to halve, giving 14 × 8 = 112 cm<sup>2</sup>.","opts":["11 cm<sup>2</sup>","22 cm<sup>2</sup>","56 cm<sup>2</sup>","112 cm<sup>2</sup>"],"ans":2,"check":{"type":"mcq"}},{"n":3,"s":"A","m":1,"text":"An equilateral triangle has a perimeter of 27 cm. How long is <b>each side</b>?","fig":"<svg class=\"fig\" viewBox=\"-24.0 -50.2 188.0 169.2\" style=\"width:30mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,95.0 140.0,95.0 70.0,-26.2\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"70.0\" y1=\"90.0\" x2=\"70.0\" y2=\"100.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"100.7\" y1=\"36.9\" x2=\"109.3\" y2=\"31.9\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"39.3\" y1=\"36.9\" x2=\"30.7\" y2=\"31.9\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"All three sides are equal, so each side = 27 ÷ 3 = 9 cm.","scheme":[],"watch":"Dividing by 2 instead of 3 (13.5 cm), or multiplying instead of dividing.","opts":["9 cm","13.5 cm","54 cm","81 cm"],"ans":0,"check":{"type":"mcq"}},{"n":4,"s":"A","m":1,"text":"Find the <b>perimeter</b> of this isosceles triangle.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 188.0 143.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,95.0 140.0,95.0 70.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"70.0\" y=\"117.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"122.7\" y=\"34.4\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text><text x=\"17.3\" y=\"34.4\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text><line x1=\"101.0\" y1=\"50.5\" x2=\"109.0\" y2=\"44.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"39.0\" y1=\"50.5\" x2=\"31.0\" y2=\"44.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"Perimeter = 12 + 10 + 10 = 32 cm","scheme":[],"watch":"Treating it as equilateral and working out 3 × 10 = 30 cm or 3 × 12 = 36 cm.","opts":["22 cm","30 cm","32 cm","36 cm"],"ans":2,"check":{"type":"mcq"}},{"n":5,"s":"A","m":1,"text":"Find the <b>area</b> of the right-angled triangle below.","fig":"<svg class=\"fig\" viewBox=\"-70.0 -24.0 229.0 148.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,100.0 135.0,100.0 0.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,89.0 11.0,89.0 11.0,100.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"67.5\" y=\"122.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text><text x=\"80.6\" y=\"32.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text><text x=\"-22.0\" y=\"50.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6 cm</text><text x=\"-46.0\" y=\"50.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\"></text></svg>","sol":"The two sides that meet at the right angle are the base and the height. Area = <sup>1</sup>⁄<sub>2</sub> × 8 × 6 = 24 cm<sup>2</sup>","scheme":[],"watch":"Using the sloping 10 cm side as the height (30 cm<sup>2</sup> or 40 cm<sup>2</sup>).","opts":["24 cm<sup>2</sup>","30 cm<sup>2</sup>","40 cm<sup>2</sup>","48 cm<sup>2</sup>"],"ans":0,"check":{"type":"mcq"}},{"n":6,"s":"A","m":1,"text":"The height of this triangle falls <b>outside</b> the triangle. Find its area.","fig":"<svg class=\"fig\" viewBox=\"-110.0 -19.0 284.0 133.0\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 -40.0,5.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"-48.0\" y1=\"90.0\" x2=\"0.0\" y2=\"90.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><line x1=\"-40.0\" y1=\"78.0\" x2=\"-28.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"-28.0\" y1=\"78.0\" x2=\"-28.0\" y2=\"90.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"-40.0\" y1=\"90.0\" x2=\"-40.0\" y2=\"5.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"108.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">16 cm</text><text x=\"-48.0\" y=\"47.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text><text x=\"-86.0\" y=\"47.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\"></text></svg>","sol":"The rule still works. Area = <sup>1</sup>⁄<sub>2</sub> × 16 × 9 = 72 cm<sup>2</sup>","scheme":[],"watch":"Thinking the rule does not apply when the height is outside, or forgetting to halve (144 cm<sup>2</sup>).","opts":["144 cm<sup>2</sup>","72 cm<sup>2</sup>","25 cm<sup>2</sup>","12.5 cm<sup>2</sup>"],"ans":1,"check":{"type":"mcq"}},{"n":7,"s":"A","m":1,"text":"Find the perimeter of this triangle. Give your answer in <b>centimetres</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"75.0\" y=\"112.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text><text x=\"147.2\" y=\"35.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">60 mm</text><text x=\"38.2\" y=\"28.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text></svg>","sol":"60 mm = 6 cm. Perimeter = 9 + 6 + 8 = 23 cm","scheme":[],"watch":"Adding 60 as if it were centimetres, or leaving out the side given in millimetres (17 cm).","opts":["14 cm","15 cm","17 cm","23 cm"],"ans":3,"check":{"type":"mcq"}},{"n":8,"s":"A","m":1,"text":"A triangle has an area of 30 cm<sup>2</sup> and a base of 10 cm. Find its <b>height</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"93.0\" y1=\"90.0\" x2=\"93.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"93.0\" y1=\"78.0\" x2=\"105.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"90.0\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"108.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text><text x=\"99.0\" y=\"46.0\" font-size=\"13\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text></svg>","sol":"Base × height = 2 × 30 = 60. Height = 60 ÷ 10 = 6 cm","scheme":[],"watch":"Working out 30 ÷ 10 = 3 cm and forgetting to double the area first.","opts":["3 cm","6 cm","20 cm","60 cm"],"ans":1,"check":{"type":"mcq"}},{"n":9,"s":"A","m":1,"text":"Which calculation gives the <b>area</b> of the triangle below?","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"93.0\" y1=\"90.0\" x2=\"93.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"93.0\" y1=\"78.0\" x2=\"105.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"90.0\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"110.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text><text x=\"39.5\" y=\"29.8\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">11 cm</text><text x=\"99.0\" y=\"46.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text></svg>","sol":"The height must meet the base at right angles. Here the base is 12 cm and the matching height is 7 cm, so the area = <sup>1</sup>⁄<sub>2</sub> × 12 × 7 = 42 cm<sup>2</sup>.","scheme":[],"watch":"Using the slanting 11 cm side as the height, or forgetting to halve (12 × 7).","opts":["<sup>1</sup>⁄<sub>2</sub> × 12 × 11","<sup>1</sup>⁄<sub>2</sub> × 12 × 7","<sup>1</sup>⁄<sub>2</sub> × 11 × 7","12 × 7"],"ans":1,"check":{"type":"mcq"}},{"n":10,"s":"A","m":1,"text":"The grid below is made of centimetre squares. Find the <b>area</b> of the triangle drawn on it.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 224.0 180.0\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 176.0,0.0 176.0,132.0 0.0,132.0\" fill=\"#ffffff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"0.0\" x2=\"22.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"66.0\" y1=\"0.0\" x2=\"66.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"110.0\" y1=\"0.0\" x2=\"110.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"132.0\" y1=\"0.0\" x2=\"132.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"154.0\" y1=\"0.0\" x2=\"154.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"22.0\" x2=\"176.0\" y2=\"22.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"44.0\" x2=\"176.0\" y2=\"44.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"66.0\" x2=\"176.0\" y2=\"66.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"88.0\" x2=\"176.0\" y2=\"88.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"110.0\" x2=\"176.0\" y2=\"110.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"22.0\" y1=\"110.0\" x2=\"154.0\" y2=\"110.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"154.0\" y1=\"110.0\" x2=\"110.0\" y2=\"22.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"110.0\" y1=\"22.0\" x2=\"22.0\" y2=\"110.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"Base = 6 cm, height = 4 cm. Area = <sup>1</sup>⁄<sub>2</sub> × 6 × 4 = 12 cm<sup>2</sup>","scheme":[],"watch":"Counting whole squares only, or giving 6 × 4 = 24 cm<sup>2</sup> without halving.","opts":["10 cm<sup>2</sup>","12 cm<sup>2</sup>","13 cm<sup>2</sup>","24 cm<sup>2</sup>"],"ans":1,"check":{"type":"mcq"}},{"n":11,"s":"B","m":2,"text":"Work out the perimeter of the triangle below.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -16.0 238.0 130.0\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 140.0,90.0 190.0,8.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"70.0\" y=\"117.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9.5 cm</text><text x=\"188.1\" y=\"63.1\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">6.5 cm</text><text x=\"84.3\" y=\"24.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">14 cm</text></svg>","sol":"Perimeter = 9.5 + 6.5 + 14 = 30 cm","scheme":["M1 adding all three sides","A1 30 cm"],"watch":"Lining the decimal points up wrongly and adding 14 as 1.4 (17.4 cm).","ans":"30 cm","check":{"type":"numeric","nums":[30.0],"unit":"cm","display":"30 cm"}},{"n":12,"s":"B","m":2,"text":"The perimeter of the triangle below is <b>39 cm</b>. Find the length of the side marked <b>?</b>. Give your answer in centimetres.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"75.0\" y=\"112.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 cm</text><text x=\"147.2\" y=\"35.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"38.2\" y=\"28.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">140 mm</text></svg>","sol":"140 mm = 14 cm. Missing side = 39 − 15 − 14 = 10 cm","scheme":["M1 changing 140 mm to 14 cm and subtracting from 39","A1 10 cm"],"watch":"Subtracting 140 from 39, or adding the two known sides instead of subtracting them.","ans":"10 cm","check":{"type":"numeric","nums":[10.0],"unit":"cm","display":"10 cm"}},{"n":13,"s":"B","m":2,"text":"The triangle below is isosceles. Its base is 20 cm and its perimeter is 54 cm. Find the length of <b>one</b> of the two equal sides.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 188.0 143.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,95.0 140.0,95.0 70.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"70.0\" y=\"113.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text><line x1=\"101.0\" y1=\"50.5\" x2=\"109.0\" y2=\"44.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"39.0\" y1=\"50.5\" x2=\"31.0\" y2=\"44.5\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"The two equal sides together = 54 − 20 = 34 cm. One side = 34 ÷ 2 = 17 cm","scheme":["M1 54 − 20 = 34","A1 17 cm"],"watch":"Giving 34 cm, which is the total of both equal sides, not one of them.","ans":"17 cm","check":{"type":"numeric","nums":[17.0],"unit":"cm","display":"17 cm"}},{"n":14,"s":"B","m":2,"text":"Find the area of the triangle below.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"93.0\" y1=\"90.0\" x2=\"93.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"93.0\" y1=\"78.0\" x2=\"105.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"90.0\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"108.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">11 cm</text><text x=\"99.0\" y=\"46.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">7 cm</text></svg>","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × 11 × 7 = 77 ÷ 2 = 38.5 cm<sup>2</sup>","scheme":["M1 <sup>1</sup>⁄<sub>2</sub> × 11 × 7","A1 38.5 cm<sup>2</sup>"],"watch":"Rounding 38.5 to 38 or 39; a half is an exact answer here.","ans":"38.5 cm<sup>2</sup>","check":{"type":"numeric","nums":[38.5],"unit":"cm2","display":"38.5 cm²"}},{"n":15,"s":"B","m":2,"text":"The dashed line shows the height of this triangle. Find the area of the triangle.","fig":"<svg class=\"fig\" viewBox=\"-114.0 -19.0 288.0 133.0\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 -40.0,5.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"-48.0\" y1=\"90.0\" x2=\"0.0\" y2=\"90.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><line x1=\"-40.0\" y1=\"78.0\" x2=\"-28.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"-28.0\" y1=\"78.0\" x2=\"-28.0\" y2=\"90.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"-40.0\" y1=\"90.0\" x2=\"-40.0\" y2=\"5.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"108.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">20 cm</text><text x=\"-48.0\" y=\"47.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">11 cm</text><text x=\"-90.0\" y=\"47.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\"></text></svg>","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × 20 × 11 = 110 cm<sup>2</sup>","scheme":["M1 <sup>1</sup>⁄<sub>2</sub> × 20 × 11","A1 110 cm<sup>2</sup>"],"watch":"Deciding the rule cannot be used because the height is outside the triangle.","ans":"110 cm<sup>2</sup>","check":{"type":"numeric","nums":[110.0],"unit":"cm2","display":"110 cm²"}},{"n":16,"s":"B","m":2,"text":"A triangle has an area of <b>120 cm<sup>2</sup></b> and a height of 12 cm. Find the length of its base.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"93.0\" y1=\"90.0\" x2=\"93.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"93.0\" y1=\"78.0\" x2=\"105.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"90.0\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"108.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"99.0\" y=\"46.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">12 cm</text></svg>","sol":"Base × height = 2 × 120 = 240. Base = 240 ÷ 12 = 20 cm","scheme":["M1 doubling the area to get 240","A1 20 cm"],"watch":"Working out 120 ÷ 12 = 10 cm and forgetting to double the area first.","ans":"20 cm","check":{"type":"numeric","nums":[20.0],"unit":"cm","display":"20 cm"}},{"n":17,"s":"B","m":2,"text":"A triangular road sign has sides of 1.2 m, 105 cm and 75 cm. Find its perimeter in <b>metres</b>.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"75.0\" y=\"112.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">1.2 m</text><text x=\"147.2\" y=\"35.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">75 cm</text><text x=\"38.2\" y=\"28.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">105 cm</text></svg>","sol":"105 cm = 1.05 m and 75 cm = 0.75 m. Perimeter = 1.2 + 1.05 + 0.75 = 3 m","scheme":["M1 changing both centimetre lengths to metres","A1 3 m"],"watch":"Adding 1.2 + 105 + 75 without changing the units first.","ans":"3 m","check":{"type":"numeric","nums":[3.0],"unit":"m","display":"3 m"}},{"n":18,"s":"B","m":2,"text":"The shaded triangle is drawn inside a rectangle 15 cm long and 8 cm wide. Its base is the left-hand side of the rectangle and its tip touches the opposite side. Find the <b>area of the shaded triangle</b>.","fig":"<svg class=\"fig\" viewBox=\"-74.0 -24.0 323.0 188.0\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 0.0,120.0 225.0,45.0\" fill=\"#c7d2fe\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"225.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"225.0\" y1=\"0.0\" x2=\"225.0\" y2=\"120.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"120.0\" x2=\"225.0\" y2=\"120.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"112.0\" y=\"140.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 cm</text><text x=\"-16.0\" y=\"60.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text><text x=\"-50.0\" y=\"60.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\"></text></svg>","sol":"The base is the 8 cm side and the matching height is the 15 cm width of the rectangle. Area = <sup>1</sup>⁄<sub>2</sub> × 8 × 15 = 60 cm<sup>2</sup>","scheme":["M1 <sup>1</sup>⁄<sub>2</sub> × 8 × 15","A1 60 cm<sup>2</sup>"],"watch":"Giving the area of the whole rectangle, 120 cm<sup>2</sup>.","ans":"60 cm<sup>2</sup>","check":{"type":"numeric","nums":[60.0],"unit":"cm2","display":"60 cm²"}},{"n":19,"s":"B","m":2,"text":"Malee makes a triangular sail with a base of 2 m and a height of 3.5 m. Sailcloth costs <b>฿ 180</b> for each square metre. How much does the cloth for one sail cost?","fig":"","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × 2 × 3.5 = 3.5 m<sup>2</sup>. Cost = 3.5 × ฿ 180 = ฿ 630","scheme":["M1 area = 3.5 m<sup>2</sup>","A1 ฿ 630"],"watch":"Forgetting to halve and paying for 7 m<sup>2</sup> of cloth (฿ 1,260).","ans":"฿ 630","check":{"type":"numeric","nums":[630.0],"unit":"","display":"฿ 630"}},{"n":20,"s":"B","m":2,"text":"The grid below is made of centimetre squares. Work out the area of the triangle shown on it.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 246.0 202.0\" style=\"width:44mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 198.0,0.0 198.0,154.0 0.0,154.0\" fill=\"#ffffff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"22.0\" y1=\"0.0\" x2=\"22.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"44.0\" y1=\"0.0\" x2=\"44.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"66.0\" y1=\"0.0\" x2=\"66.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"88.0\" y1=\"0.0\" x2=\"88.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"110.0\" y1=\"0.0\" x2=\"110.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"132.0\" y1=\"0.0\" x2=\"132.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"154.0\" y1=\"0.0\" x2=\"154.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"176.0\" y1=\"0.0\" x2=\"176.0\" y2=\"154.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"22.0\" x2=\"198.0\" y2=\"22.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"44.0\" x2=\"198.0\" y2=\"44.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"66.0\" x2=\"198.0\" y2=\"66.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"88.0\" x2=\"198.0\" y2=\"88.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"110.0\" x2=\"198.0\" y2=\"110.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"132.0\" x2=\"198.0\" y2=\"132.0\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"22.0\" y1=\"22.0\" x2=\"22.0\" y2=\"132.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"22.0\" y1=\"132.0\" x2=\"176.0\" y2=\"88.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"176.0\" y1=\"88.0\" x2=\"22.0\" y2=\"22.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>","sol":"The base is the upright side, 5 cm long. The height is measured across from that side to the tip: 7 cm. Area = <sup>1</sup>⁄<sub>2</sub> × 5 × 7 = 17.5 cm<sup>2</sup>","scheme":["M1 base 5 cm and height 7 cm read from the grid","A1 17.5 cm<sup>2</sup>"],"watch":"Looking only for a horizontal base; here the base is upright and the height is measured across.","ans":"17.5 cm<sup>2</sup>","check":{"type":"numeric","nums":[17.5],"unit":"cm2","display":"17.5 cm²"}},{"n":21,"s":"C","m":4,"text":"Somchai is making a triangular flower bed in his garden. The base is 8 m and the height is 5 m.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:38mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"93.0\" y1=\"90.0\" x2=\"93.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"93.0\" y1=\"78.0\" x2=\"105.0\" y2=\"78.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"105.0\" y1=\"90.0\" x2=\"105.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"75.0\" y=\"108.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 m</text><text x=\"99.0\" y=\"46.0\" font-size=\"12.5\" text-anchor=\"end\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 m</text></svg>","sol":"","scheme":["M1 <sup>1</sup>⁄<sub>2</sub> × 8 × 5","A1 20 m<sup>2</sup>","M1 20 ÷ 4","A1 5 bags"],"watch":"Forgetting to halve and buying compost for 40 m<sup>2</sup> (10 bags).","parts":[{"label":"(a)","text":"Find the area of the flower bed.","fig":"","m":2,"ans":"20 m<sup>2</sup>","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × 8 × 5 = 20 m<sup>2</sup>","check":{"type":"numeric","nums":[20.0],"unit":"m2","display":"20 m²"}},{"label":"(b)","text":"One bag of compost covers 4 m<sup>2</sup> of soil. How many bags does Somchai need for the whole flower bed?","fig":"","m":2,"ans":"5 bags","sol":"20 ÷ 4 = 5 bags","check":{"type":"numeric","nums":[5.0],"unit":"","display":"5 bags"}}]},{"n":22,"s":"C","m":4,"text":"A triangular vegetable plot has a perimeter of <b>46 m</b>. Two of its sides are 18 m and 16 m.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 198.0 138.0\" style=\"width:36mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,90.0 150.0,90.0 105.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><text x=\"75.0\" y=\"112.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">18 m</text><text x=\"147.2\" y=\"35.2\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">?</text><text x=\"38.2\" y=\"28.3\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">16 m</text></svg>","sol":"","scheme":["M1 46 − 18 − 16","A1 12 m","M1 46 × 250","A1 ฿ 11,500"],"watch":"Fencing only the third side (฿ 3,000) instead of the whole perimeter.","parts":[{"label":"(a)","text":"Find the length of the third side.","fig":"","m":2,"ans":"12 m","sol":"46 − 18 − 16 = 12 m","check":{"type":"numeric","nums":[12.0],"unit":"m","display":"12 m"}},{"label":"(b)","text":"Krit puts a fence all the way round the plot. The fence costs ฿ 250 for each metre. Find the total cost of the fence.","fig":"","m":2,"ans":"฿ 11,500","sol":"46 × ฿ 250 = ฿ 11,500","check":{"type":"numeric","nums":[11500.0],"unit":"","display":"฿ 11,500"}}]},{"n":23,"s":"C","m":4,"text":"Krit is finding the area of the triangle below. He writes:<br><b>Area = <sup>1</sup>⁄<sub>2</sub> × 15 × 10 = 75 cm<sup>2</sup></b>","fig":"<svg class=\"fig\" viewBox=\"-24.0 -24.0 228.0 144.0\" style=\"width:40mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,96.0 180.0,96.0 72.0,0.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><line x1=\"72.0\" y1=\"84.0\" x2=\"84.0\" y2=\"84.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"84.0\" y1=\"84.0\" x2=\"84.0\" y2=\"96.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"72.0\" y1=\"96.0\" x2=\"72.0\" y2=\"0.0\" stroke=\"#1f2937\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><text x=\"90.0\" y=\"116.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">15 cm</text><text x=\"20.0\" y=\"36.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">10 cm</text><text x=\"88.0\" y=\"48.0\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">8 cm</text></svg>","sol":"","scheme":["C1 says he used the 10 cm slanting side","C1 the height must be at right angles to the base (8 cm)","M1 <sup>1</sup>⁄<sub>2</sub> × 15 × 8","A1 60 cm<sup>2</sup>"],"watch":"Believing any side of a triangle can be used as its height.","parts":[{"label":"(a)","text":"Explain the mistake Krit has made.","fig":"","m":2,"ans":"He used a slanting side instead of the height","sol":"10 cm is a slanting side, not the height. The height must be measured at right angles to the base, and here it is 8 cm.","check":{"type":"self"}},{"label":"(b)","text":"Work out the correct area of the triangle.","fig":"","m":2,"ans":"60 cm<sup>2</sup>","sol":"Area = <sup>1</sup>⁄<sub>2</sub> × 15 × 8 = 60 cm<sup>2</sup>","check":{"type":"numeric","nums":[60.0],"unit":"cm2","display":"60 cm²"}}]},{"n":24,"s":"C","m":4,"text":"The grid below is made of centimetre squares. A rectangle 8 cm long and 5 cm wide is outlined on it.","fig":"<svg class=\"fig\" viewBox=\"-8.0 -8.0 236.0 170.0\" style=\"width:56mm\" xmlns=\"http://www.w3.org/2000/svg\" fon "220.0\" y2=\"110.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"132.0\" x2=\"220.0\" y2=\"132.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"154.0\" x2=\"220.0\" y2=\"154.0\" stroke=\"#9aa8bd\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><rect x=\"22\" y=\"22\" width=\"176\" height=\"110\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2\"/></svg>","sol":"","scheme":["M1 <sup>1</sup>⁄<sub>2</sub> × 8 × 5 for a correctly drawn triangle","A1 20 cm<sup>2</sup>","B1 says No","C1 base and height are unchanged, so the area stays 20 cm<sup>2</sup>"],"watch":"Thinking a leaning triangle covers less of the rectangle than an upright one.","parts":[{"label":"(a)","text":"On the grid, draw a triangle whose base is the <b>whole bottom side</b> of the rectangle and whose tip is on the top side. Then find the area of your triangle.","fig":"","m":2,"ans":"20 cm<sup>2</sup>","sol":"Base = 8 cm, height = 5 cm. Area = <sup>1</sup>⁄<sub>2</sub> × 8 × 5 = 20 cm<sup>2</sup>","check":{"type":"numeric","nums":[20.0],"unit":"cm2","display":"20 cm²"}},{"label":"(b)","text":"Malee says, “If I slide the tip of the triangle along the top side, the area changes.” Is Malee correct? Explain your answer.","fig":"","m":2,"ans":"No","sol":"No. Wherever the tip is on the top side, the base is still 8 cm and the height is still 5 cm, so the area is always 20 cm<sup>2</sup>.","check":{"type":"yesno","value":"no"}}]},{"n":25,"s":"C","m":4,"text":"Ben makes two triangular banners for sports day. The table shows the base and the height of each banner.","fig":"<div class=\"tscroll\"><table class=\"dtab \"><thead><tr><th style=\"text-align:center\">Banner</th><th style=\"text-align:center\">Base</th><th style=\"text-align:center\">Height</th></tr></thead><tbody><tr><td style=\"text-align:center\">A</td><td style=\"text-align:center\">60 cm</td><td style=\"text-align:center\">40 cm</td></tr><tr><td style=\"text-align:center\">B</td><td style=\"text-align:center\">50 cm</td><td style=\"text-align:center\">60 cm</td></tr></tbody></table></div>","sol":"","scheme":["M1 <sup>1</sup>⁄<sub>2</sub> × base × height used for a banner","A1 1,200 cm<sup>2</sup> and 1,500 cm<sup>2</sup>","B1 says Ben is wrong","C1 refers to B's greater height as well as its shorter base"],"watch":"Comparing only the bases and ignoring the heights.","parts":[{"label":"(a)","text":"Find the area of each banner.","fig":"","m":2,"ans":"A = 1,200 cm<sup>2</sup>, B = 1,500 cm<sup>2</sup>","sol":"A: <sup>1</sup>⁄<sub>2</sub> × 60 × 40 = 1,200 cm<sup>2</sup> &nbsp; B: <sup>1</sup>⁄<sub>2</sub> × 50 × 60 = 1,500 cm<sup>2</sup>","check":{"type":"numeric","nums":[1200.0,1500.0],"unit":"cm2","display":"A = 1,200 cm², B = 1,500 cm²"}},{"label":"(b)","text":"Ben says, “The banner with the longer base must need more cloth.” Use your answers to explain why Ben is wrong.","fig":"","m":2,"ans":"Ben is wrong","sol":"Banner B has the shorter base (50 cm) but the larger area (1,500 cm<sup>2</sup>), because its height is 60 cm. The area depends on the base <i>and</i> the height, not on the base alone.","check":{"type":"self"}}]}]},{"id":"10_Area-Perimeter-Polygons","code":"Chapter 10","title":"Area and Perimeter of Polygons","colour":"#A25812","blurb":"Interior angles and compound shapes","sub":"Interior angles of polygons · Perimeter of a polygon · Area of a polygon · Word problems","marks":50,"qs":[{"n":1,"s":"A","m":1,"text":"Find the <b>perimeter</b> of the rectangle below.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 222.0 144.5\" style=\"width:42mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 144.0,0.0 144.0,80.0 0.0,80.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"72.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text><text x=\"174.0\" y=\"40.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">5 cm</text></svg>","sol":"Perimeter = 2 × (9 + 5) = 2 × 14 = 28 cm.","scheme":[],"watch":"Adding only one length and one width (14 cm), or working out the area instead (45 cm).","opts":["14 cm","23 cm","28 cm","45 cm"],"ans":2,"check":{"type":"mcq"}},{"n":2,"s":"A","m":1,"text":"Find the <b>area</b> of the square below.","fig":"<svg class=\"fig\" viewBox=\"-24.0 -40.5 152.0 168.5\" style=\"width:34mm\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\"><polygon points=\"0.0,0.0 104.0,0.0 104.0,104.0 0.0,104.0\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.9\" stroke-linejoin=\"round\"/><polyline points=\"0.0,11.0 11.0,11.0 11.0,0.0\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><line x1=\"52.0\" y1=\"-5.0\" x2=\"52.0\" y2=\"5.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"109.0\" y1=\"52.0\" x2=\"99.0\" y2=\"52.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"52.0\" y1=\"109.0\" x2=\"52.0\" y2=\"99.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"-5.0\" y1=\"52.0\" x2=\"5.0\" y2=\"52.0\" stroke=\"#1f2937\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"52.0\" y=\"-16.5\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b45309\" font-weight=\"600\" dominant-baseline=\"middle\">9 cm</text></svg>","sol":"Area of a square = side × side = 9 × 9 = 81 cm<sup>2</sup>.","scheme":[],"watch":"Working out the perimeter (36 cm) instead of the area, or slipping to 9 × 8 = 72.","opts":["18 cm<sup>2</sup>","36 cm<sup>2</sup>","72 cm<sup>2</sup>","81 cm<sup>2</sup>"],"ans":3,"check":{"type":"mcq"}},{"n":3,"s":"A","m":1,"text":"The area of a square is 121 cm<sup>2</sup>. What is its <b>perimeter</b>?",

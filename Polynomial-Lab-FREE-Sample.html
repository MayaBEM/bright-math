/* Polynomial Lab — Block City Builder */
:root{
  --navy:#1E3A8A; --navy-2:#2A4AA8; --navy-ink:#13265E;
  --yellow:#FBBF24; --mint:#34D399; --sky:#60A5FA; --coral:#FB7185; --white:#FFFFFF;
  --bg:#EEF2FA; --grid:rgba(30,58,138,.075); --grid-major:rgba(30,58,138,.13);
  --panel:#FFFFFF; --panel-2:#F6F8FD; --line:#C9D3EA; --line-strong:#1E3A8A;
  --text:#14204A; --muted:#55628A; --good:#0F8A5F; --bad:#C2334D; --focus:#FBBF24;
  --u:34px; --radius:6px;
  --disp:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0D1838; --grid:rgba(160,190,255,.06); --grid-major:rgba(160,190,255,.11);
  --panel:#142659; --panel-2:#1A2F6B; --line:#2E4A96; --line-strong:#8FB0FF;
  --text:#EEF2FF; --muted:#A9B8E0; --good:#4ADE9F; --bad:#FF8FA3; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);font-size:18px;line-height:1.5;color:var(--text);background-color:var(--bg);
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--disp);line-height:1.1;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-weight:800;font-size:clamp(32px,6vw,58px)} h2{font-weight:800;font-size:clamp(24px,3.6vw,34px)} h3{font-weight:700;font-size:21px}
p{margin:0 0 .7em}
.m{white-space:nowrap;font-variant-numeric:lining-nums}
.m i{font-style:italic;font-family:var(--body);padding-right:.04em}
.m sup{font-size:.68em;line-height:0;position:relative;top:-.05em;font-style:normal}
.m .op{padding:0 .26em}
.m .dot{padding:0 .14em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15}
.frac .fn{border-bottom:2px solid currentColor;padding:0 .2em .05em}
.frac .fd{padding:.05em .2em 0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--yellow)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;color:#fff;padding:4px 0;text-align:left}
.brand b{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.02em}
.brand span{font-size:13px;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:6px 10px;border:1.5px solid rgba(255,255,255,.35);border-radius:4px;white-space:nowrap}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:4px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:0}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="false"]{opacity:.6}
.ib:hover{background:rgba(255,255,255,.1)}

main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.foot{max-width:1180px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:var(--radius);font-weight:700;border:2px solid var(--line-strong);background:var(--panel);color:var(--text);text-decoration:none;transition:transform .08s ease}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--yellow);border-color:var(--navy-ink);color:var(--navy-ink);box-shadow:3px 3px 0 var(--navy-ink)}
.btn.pri:active{box-shadow:1px 1px 0 var(--navy-ink);transform:translate(2px,2px)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 14px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
:root[data-theme="dark"] .btn.pri{box-shadow:3px 3px 0 #050B20}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:22px}
.panel.strong{border-color:var(--line-strong)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1.5px solid currentColor}

/* ---------- welcome ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:stretch}
.hero .panel{padding:30px}
.hero h1{margin-bottom:.15em}
.hero .lede{font-size:20px;max-width:34em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.field input{min-height:50px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--radius);background:var(--panel-2)}
.skyline{position:relative;min-height:300px;background:var(--navy);border-radius:var(--radius);overflow:hidden;border:2px solid var(--navy-ink)}
.skyline .gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:30px 30px}
.skyline .bld{position:absolute;bottom:0}

/* ---------- map ---------- */
.maphead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.city{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#2B3A5E;padding:14px;border-radius:var(--radius);border:2px solid var(--navy-ink);
  background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.18) 22px 34px);background-size:56px 4px;background-repeat:repeat-x;background-position:0 50%}
.plot{position:relative;background:var(--panel);border:2px solid var(--navy-ink);border-radius:4px;padding:12px 12px 0;display:flex;flex-direction:column;min-height:200px;text-align:left;overflow:hidden;color:var(--text)}
.plot:not([disabled]):hover{outline:3px solid var(--yellow);outline-offset:-3px}
.plot .num{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--muted)}
.plot .nm{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.05;margin:2px 0 2px}
.plot .sk{font-size:14px;color:var(--muted);line-height:1.25}
.plot .lot{margin-top:auto;height:100px;position:relative;border-top:2px dashed var(--line);display:flex;align-items:flex-end;justify-content:center;gap:6px}
.plot .status{position:absolute;top:10px;right:10px;font-size:11px}
.plot[disabled]{cursor:not-allowed}
.plot[disabled] .nm,.plot[disabled] .sk{opacity:.55}
.plot.cityhall{grid-column:span 2;background:var(--navy);color:#fff}
.plot.cityhall .sk,.plot.cityhall .num{color:rgba(255,255,255,.75)}
.tower{width:34px;background:var(--navy);border:2px solid var(--navy-ink);border-bottom:0;position:relative;transition:height .9s cubic-bezier(.2,.8,.2,1);
  background-image:linear-gradient(rgba(255,255,255,.55) 0 0);background-size:8px 8px}
.tower .win{position:absolute;left:5px;right:5px;top:6px;bottom:4px;background-image:linear-gradient(90deg,var(--sky) 0 9px,transparent 9px 11px,var(--sky) 11px 20px);background-size:20px 12px;opacity:.9;
  -webkit-mask:repeating-linear-gradient(transparent 0 3px,#000 3px 10px,transparent 10px 12px);mask:repeating-linear-gradient(transparent 0 3px,#000 3px 10px,transparent 10px 12px)}
.tower.b{background:var(--mint)} .tower.c{background:var(--yellow)} .tower.d{background:var(--sky)}
.tower.ghost{background:transparent;border:2px dashed var(--line);border-bottom:0;background-image:linear-gradient(var(--grid-major) 1px,transparent 1px);background-size:100% 10px}
.flag{position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--navy-ink)}
.flag::after{content:"";position:absolute;left:2px;top:0;width:12px;height:8px;background:var(--coral)}
.crane{position:absolute;right:10px;top:0;width:2px;background:var(--navy-ink);height:40px}
.crane::before{content:"";position:absolute;top:0;right:0;width:46px;height:3px;background:var(--yellow);border:1px solid var(--navy-ink)}
.lic{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good)}
.toolsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.toolcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px 18px;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);color:var(--text)}
.toolcard b{font-family:var(--disp);font-size:19px}
.toolcard span{font-size:15px;color:var(--muted)}
.toolcard:hover{border-color:var(--line-strong)}

/* ---------- district ---------- */
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;background:var(--panel)}
.stages button{border:0;border-right:2px solid var(--line-strong);background:transparent;padding:12px 8px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;min-height:54px}
.stages button:last-child{border-right:0}
.stages button[aria-current="step"]{background:var(--navy);color:#fff}
.stages .dotn{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:13px;flex:none}
.stages .done .dotn{background:var(--mint);border-color:var(--navy-ink);color:var(--navy-ink)}

/* lesson */
.lesson{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.lesson .txt p{font-size:20px}
.lesson .vis{min-height:260px;display:flex;align-items:center;justify-content:center;padding:18px;background:var(--panel-2);border:2px solid var(--line);border-radius:var(--radius);overflow:auto}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;background:var(--line);border-radius:2px}
.dots i.on{background:var(--navy)}
:root[data-theme="dark"] .dots i.on{background:var(--yellow)}
.mistake{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mistake .wr,.mistake .rt{padding:18px;border-radius:var(--radius);border:2px solid}
.mistake .wr{border-color:var(--bad);background:color-mix(in srgb,var(--coral) 12%,transparent)}
.mistake .rt{border-color:var(--good);background:color-mix(in srgb,var(--mint) 14%,transparent)}
.mistake .lbl{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.mistake .why{grid-column:1/-1;padding:14px 18px;border-left:6px solid var(--yellow);background:var(--panel-2)}
.reveal>*{opacity:0;transform:translateY(8px);animation:rv .5s ease forwards}
@keyframes rv{to{opacity:1;transform:none}}
.steps{display:flex;flex-direction:column;gap:10px;font-size:22px}
.steps div{padding:6px 12px;border-left:4px solid var(--sky)}
.labelled{display:flex;flex-direction:column;align-items:center;gap:16px}
.labelled .big{font-size:40px}
.labelled ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:17px}
.labelled ul li{display:contents}
.labelled ul b{justify-self:end}
.pw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:22px}
.chip{min-width:40px;height:44px;padding:0 10px;display:inline-grid;place-items:center;border:2px solid var(--navy-ink);border-radius:4px;background:var(--mint);color:var(--navy-ink);font-weight:700}
.chip.n{background:var(--yellow)}
.chip.o{background:transparent;border-color:transparent;color:var(--text);min-width:auto;padding:0 2px}
.brk{display:inline-flex;gap:4px;padding:6px;border:2px dashed var(--line);border-radius:6px}

/* ---------- tiles ---------- */
.tile{position:relative;display:inline-grid;place-items:center;border:2px solid var(--navy-ink);border-radius:3px;font-weight:700;font-size:14px;color:var(--navy-ink);user-select:none;-webkit-user-select:none;touch-action:none;flex:none}
.tile.x2{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);background:var(--yellow)}
.tile.xv{width:var(--u);height:calc(var(--u)*3.4);background:var(--mint)}
.tile.xh{width:calc(var(--u)*3.4);height:var(--u);background:var(--mint)}
.tile.u{width:var(--u);height:var(--u);background:var(--sky);font-size:12px}
.tile.neg{background-color:var(--coral);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 4px,transparent 4px 9px)}
.tile .tl{background:rgba(255,255,255,.82);padding:0 3px;border-radius:2px;line-height:1.2}
.tile.u .tl{padding:0 1px}
.tile.sel{outline:4px solid var(--navy);outline-offset:2px}
:root[data-theme="dark"] .tile.sel{outline-color:var(--yellow)}
.tray{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:12px;border:2px solid var(--line);border-radius:var(--radius);background:var(--panel-2)}
.tray .slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px}
.tray .slot small{font-size:12px;color:var(--muted);font-weight:700}
.trayname{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:100%}
.mat{position:relative;min-height:330px;border:2px solid var(--line-strong);border-radius:var(--radius);background-color:var(--panel);overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--u) var(--u)}
.mat .tile{position:absolute;transition:left .35s ease,top .35s ease}
.mat .tile.dragging{transition:none}
.mat .cable{position:absolute;width:2px;background:var(--navy-ink);top:0;transform-origin:top;pointer-events:none}
.drop-in{animation:crane .5s cubic-bezier(.3,1.3,.5,1)}
@keyframes crane{from{transform:translateY(-120px)}to{transform:none}}
.poof{animation:poof .55s ease forwards}
@keyframes poof{50%{transform:scale(1.1)}to{transform:scale(.1);opacity:0}}
.zero{position:absolute;font-family:var(--disp);font-weight:800;font-size:30px;color:var(--navy);pointer-events:none;animation:zf .8s ease forwards}
@keyframes zf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
.readout{font-size:24px;padding:10px 14px;border:2px dashed var(--line);border-radius:var(--radius);min-height:56px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ghostdrag{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:scale(1.05)}
.toolgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px}

/* area model */
.plotwrap{overflow:auto;padding:8px 4px}
.areagrid{display:inline-grid;gap:0;align-items:stretch;justify-items:stretch}
.areagrid .hd{display:flex;align-items:center;justify-content:center;padding:3px}
.areagrid .cell{position:relative;border:2px dashed var(--line);background:color-mix(in srgb,var(--panel-2) 70%,transparent);display:flex;align-items:center;justify-content:center;margin:1px}
.areagrid .cell.hot{border-color:var(--navy);background:color-mix(in srgb,var(--yellow) 25%,transparent)}
.areagrid .cell .tile{width:100%;height:100%;border-radius:2px}
.sidelabel{font-size:20px;font-weight:700;padding:4px 8px;white-space:nowrap}
.sidelabel.st{text-align:center}
.areamul,.areafactor{--u:38px}
@media (max-width:900px){.areamul,.areafactor{--u:32px}}
@media (max-width:560px){.areamul,.areafactor{--u:24px}}
.zone{border:2px dashed var(--navy);background:color-mix(in srgb,var(--sky) 12%,transparent);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700;text-align:center;line-height:1.1}
.zone.hot{background:color-mix(in srgb,var(--yellow) 30%,transparent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border:2px solid var(--line-strong);background:var(--panel);border-radius:4px;font-weight:800;font-size:22px;line-height:1}
.stepper output{min-width:46px;text-align:center;font-weight:700;font-size:20px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:15px}
.msg{min-height:30px;font-weight:700;font-size:17px}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}

/* ---------- items ---------- */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;height:12px;border:2px solid var(--line-strong);border-radius:3px;overflow:hidden;background:var(--panel)}
.prog i{display:block;height:100%;background:var(--mint);transition:width .4s ease}
.qcard{background:var(--panel);border:2px solid var(--line-strong);border-radius:var(--radius);padding:24px}
.qprompt{font-size:21px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qexpr{font-size:clamp(28px,4.4vw,40px);padding:14px 0 6px;overflow-x:auto}
.speak{flex:none;width:44px;height:44px;border-radius:4px;border:2px solid var(--line);background:var(--panel-2);display:grid;place-items:center;padding:0}
.speak svg{width:22px;height:22px}
.ans{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-top:12px}
.ans input{flex:1;min-width:200px;min-height:56px;padding:10px 14px;font-size:24px;border:2px solid var(--line-strong);border-radius:var(--radius);background:var(--panel-2)}
.preview{font-size:24px;min-height:40px;margin-top:8px;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.keys button{min-width:48px;height:46px;border:2px solid var(--line);border-radius:4px;background:var(--panel-2);font-weight:700;font-size:18px;padding:0 10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;min-height:64px;padding:12px 16px;border:2px solid var(--line);border-radius:var(--radius);background:var(--panel-2);font-size:20px}
.choice .lt{flex:none;width:32px;height:32px;border-radius:4px;border:2px solid var(--line-strong);display:grid;place-items:center;font-weight:800;font-size:15px;font-family:var(--disp)}
.choice:hover:not([disabled]){border-color:var(--line-strong)}
.choice.picked{border-color:var(--navy);background:color-mix(in srgb,var(--sky) 18%,var(--panel))}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--mint) 22%,var(--panel))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--coral) 16%,var(--panel))}
.work{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.work .ln{display:flex;gap:14px;align-items:center;text-align:left;padding:12px 16px;border:2px solid var(--line);border-radius:var(--radius);background:var(--panel-2);font-size:20px}
.work .ln b{font-family:var(--disp);flex:none;width:72px;font-size:15px;letter-spacing:.04em}
.problem{font-size:20px;padding:12px 16px;border-left:6px solid var(--navy);background:var(--panel-2);margin-top:8px}
.fb{margin-top:16px;padding:14px 18px;border-radius:var(--radius);border:2px solid;font-size:18px;display:none}
.fb.show{display:block;animation:rv .3s ease}
.fb.good{border-color:var(--good);background:color-mix(in srgb,var(--mint) 16%,var(--panel))}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--coral) 12%,var(--panel))}
.fb.info{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,var(--panel))}
.fb b.h{font-family:var(--disp);font-size:20px;display:block;margin-bottom:2px}
.hints{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.hint{padding:10px 14px;border-left:5px solid var(--yellow);background:var(--panel-2);font-size:18px}
.qbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.reviewtag{color:var(--navy);border-color:var(--navy)}
:root[data-theme="dark"] .reviewtag{color:var(--yellow);border-color:var(--yellow)}

/* ---------- results / report ---------- */
.res{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.score{font-family:var(--disp);font-weight:800;font-size:76px;line-height:1}
.licence{display:flex;gap:16px;align-items:center;padding:16px 20px;border:3px double var(--navy-ink);background:var(--yellow);color:var(--navy-ink);border-radius:4px;max-width:520px}
.licence .seal{width:62px;height:62px;flex:none;border-radius:50%;border:3px solid var(--navy-ink);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;background:#fff}
.licence b{font-family:var(--disp);font-size:22px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1.5px solid var(--line);padding:6px 8px;text-align:left}
.tbl th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.report{max-width:980px;margin:0 auto}
.rephead{display:grid;grid-template-columns:repeat(4,auto);gap:4px 26px;justify-content:start;margin-bottom:12px;font-size:15px}
.rephead b{display:block;font-size:19px}
.repgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.bar{height:10px;border:1.5px solid var(--line-strong);border-radius:2px;background:var(--panel-2);min-width:60px}
.bar i{display:block;height:100%;background:var(--mint)}
.bar i.low{background:var(--coral)}
.cheat{columns:3 280px;column-gap:18px}
.cheat section{break-inside:avoid;border:2px solid var(--line-strong);border-radius:4px;padding:10px 14px;margin-bottom:14px;background:var(--panel)}
.cheat h3{font-size:17px;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.cheat h3 span{font-size:12px;background:var(--navy);color:#fff;border-radius:3px;padding:1px 6px}
.cheat ul{margin:0;padding-left:18px;font-size:15.5px}
.timer{font-family:var(--disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:40px;height:40px;border:2px solid var(--line);border-radius:4px;background:var(--panel);font-weight:700;font-size:14px;padding:0}
.qnav button.done{background:var(--sky);border-color:var(--navy-ink);color:var(--navy-ink)}
.qnav button.cur{outline:3px solid var(--yellow)}
.qnav button.flag{border-color:var(--coral);border-width:3px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,16,40,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border:2px solid var(--line-strong);border-radius:var(--radius);padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.pin{display:flex;gap:10px;justify-content:center;margin:12px 0}
.pin input{width:200px;text-align:center;font-size:30px;letter-spacing:.4em;min-height:56px;border:2px solid var(--line-strong);border-radius:var(--radius);background:var(--panel-2)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow select{min-height:44px;border:2px solid var(--line);border-radius:4px;background:var(--panel-2);padding:0 10px}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:4px;border:2px solid var(--yellow);z-index:70;font-weight:700;animation:rv .3s ease}
.lockline{font-size:14px;color:var(--muted);margin-top:8px}
.diagtbl td:first-child{font-weight:700;width:56px}

@media (max-width:900px){
  .hero,.lesson,.toolgrid,.repgrid,.mistake{grid-template-columns:1fr}
  .city{grid-template-columns:repeat(2,1fr)}
  .toolsrow{grid-template-columns:1fr}
}
@media (max-width:560px){
  :root{--u:24px}
  body{font-size:17px}
  .brand span,.stat .k{display:none}
  .top-in{gap:6px;padding:6px 10px}
  .ib{width:38px;height:38px}
  .stat{padding:5px 7px;font-size:14px}
  .choices{grid-template-columns:1fr}
  .stages button{flex-direction:column;gap:2px;font-size:13px;padding:8px 2px}
  .qcard,.panel{padding:16px}
  .plot{min-height:200px}
  .plot .nm{font-size:17px}
  .rephead{grid-template-columns:1fr 1fr}
  .lesson .txt p{font-size:18px}
  .steps{font-size:19px}
  .score{font-size:56px}
  .res{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{
  @page{margin:12mm}
  body{background:#fff!important;color:#000;font-size:12pt}
  .top,.foot .noprint,.noprint,.btn{display:none!important}
  main{padding:0;max-width:none}
  .panel,.qcard{border-color:#999}
  .cheat section{border-color:#1E3A8A}

}

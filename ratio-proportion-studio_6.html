<style>/* ── Ratio & Proportion Studio — retro pixel-desktop theme ─────────────── */
:root{
  color-scheme:light;
  /* page */
  --sky:#C6D8F6; --sky-2:#B7CDF2; --grid:#E4EDFC;
  /* paper */
  --cream:#FBEDD8; --cream-2:#F3DFC2; --cream-3:#EBD2AE; --white:#FFFCF4;
  /* ink */
  --ink:#48301F; --ink-2:#6B4A32; --muted:#8A6A52;
  /* accents */
  --teal:#4FB3A5; --teal-d:#3B9587; --teal-soft:#DCF0EC;
  --gold:#E8B84B; --gold-soft:#FAEBC4; --orange:#E5892E;
  --coral:#E4695C; --coral-soft:#FBDDD6; --pink:#EE6FA0;
  --green:#5FAF6E; --green-d:#3F8B51; --green-soft:#DFF2E1;
  --red:#D2483C; --red-d:#A93529; --red-soft:#FBDCD6;
  --blue:#6B8FE0; --blue-soft:#E0E8FB; --lilac:#EDE4F6;
  /* geometry */
  --r-s:4px; --r-m:6px; --r-l:8px; --r-xl:10px;
  --bd:2px solid var(--ink);
  --sh-1:3px 3px 0 var(--ink);
  --sh-2:5px 5px 0 var(--ink);
  --sh-in:inset 0 0 0 2px var(--ink);
  --f-head:'Manrope','Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter','Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-th:'Noto Sans Thai','Sarabun',var(--f-body);
  --max:1080px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--sky);
  background-image:
    linear-gradient(var(--grid) 1.5px,transparent 1.5px),
    linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:28px 28px;
  background-position:-1px -1px;
  color:var(--ink);
  font-family:var(--f-body); font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body.lang-th{font-family:var(--f-th)}
h1,h2,h3,h4{font-family:var(--f-head); color:var(--ink); line-height:1.25; margin:0 0 .4em; text-wrap:balance}
h1{font-size:clamp(1.6rem,4.4vw,2.35rem); font-weight:800; letter-spacing:-.02em}
h2{font-size:clamp(1.2rem,3.2vw,1.6rem); font-weight:800; letter-spacing:-.01em}
h3{font-size:1.06rem; font-weight:800}
.card>h3 svg,h3>svg{vertical-align:-4px;margin-right:.35rem;color:var(--teal-d)}
p{margin:0 0 .8em}
a{color:var(--teal-d)}
button{font-family:inherit; font-size:1rem}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px; border-radius:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;z-index:60;background:var(--ink);color:var(--cream);padding:.6rem 1rem;border-radius:0 0 var(--r-s) 0}
.skip:focus{left:0}

/* ── header: a desktop menu bar ── */
.top{position:sticky;top:0;z-index:40;background:var(--cream);border-bottom:3px solid var(--ink)}
.top-in{max-width:var(--max);margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.75rem}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1;min-height:44px;border-radius:var(--r-s)}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:var(--r-s);background:var(--teal);border:var(--bd);box-shadow:2px 2px 0 var(--ink);color:var(--ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:.92rem}
.brand-txt{min-width:0;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.brand-name{display:block;max-width:46vw;font-family:var(--f-head);font-weight:800;font-size:.98rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{display:block;max-width:46vw;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.brand-sub{display:none}.brand-name{max-width:32vw;font-size:.92rem}}
@media(max-width:380px){.brand-name{max-width:26vw}}
.top-actions{display:flex;align-items:center;gap:.45rem}
.iconbtn{min-width:44px;min-height:44px;display:inline-grid;place-items:center;background:var(--white);border:var(--bd);border-radius:var(--r-s);box-shadow:2px 2px 0 var(--ink);color:var(--ink);cursor:pointer;transition:transform .1s,background .12s}
.iconbtn:hover{background:var(--gold-soft)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.langtoggle{display:inline-flex;border:var(--bd);border-radius:var(--r-s);overflow:hidden;background:var(--white);box-shadow:2px 2px 0 var(--ink)}
.langtoggle button{min-height:44px;padding:0 .7rem;border:0;background:transparent;color:var(--ink-2);font-weight:800;font-size:.85rem;cursor:pointer}
.langtoggle button+button{border-left:2px solid var(--ink)}
.langtoggle button[aria-pressed="true"]{background:var(--teal);color:var(--ink)}

.wrap{max-width:var(--max);margin:0 auto;padding:1.1rem 1rem 4rem}
.wrap>h1,.wrap>h2{display:flex;align-items:center;gap:.6rem;margin:1.7rem 0 .95rem;text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.wrap>h1:first-of-type,.wrap>h2:first-of-type{margin-top:.2rem}
.wrap>h1::before,.wrap>h2::before{content:"";flex:0 0 auto;width:14px;height:14px;background:var(--gold);border:2px solid var(--ink);border-radius:2px}
.wrap>h2+p,.wrap>h1+p{margin-top:-.4rem}
.crumb{display:flex;align-items:center;gap:.5rem;margin:0 0 .9rem;flex-wrap:wrap}
.backbtn{min-height:44px;display:inline-flex;align-items:center;gap:.4rem;padding:0 .9rem;background:var(--white);border:var(--bd);border-radius:var(--r-s);box-shadow:var(--sh-1);color:var(--ink);font-weight:800;font-size:.9rem;cursor:pointer}
.backbtn:hover{background:var(--gold-soft)}
.backbtn:active{transform:translate(3px,3px);box-shadow:none}

/* ── cards: paper windows ── */
.card{background:var(--cream);border:var(--bd);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:1.1rem}
.card+.card{margin-top:1.1rem}
.grid{display:grid;gap:1.1rem}
@media(min-width:640px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}}

/* hero = an open application window; .eyebrow is its title bar */
.hero{background:var(--cream);border:var(--bd);border-radius:var(--r-m);box-shadow:var(--sh-2);padding:0 1.15rem 1.3rem;overflow:hidden}
.hero .eyebrow{display:flex;align-items:center;gap:.5rem;margin:0 -1.15rem 1.1rem;padding:.5rem .8rem;background:var(--teal);border-bottom:var(--bd);
  font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:800}
.hero .eyebrow::after{content:"_ □ ✕";margin-left:auto;letter-spacing:.16em;font-weight:800;opacity:.9}
.hero h1{margin-top:.2rem}
.hero p{color:var(--ink-2);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.chip{font-size:.8rem;font-weight:800;padding:.34rem .7rem;border-radius:var(--r-s);background:var(--teal-soft);color:var(--ink);border:var(--bd);box-shadow:2px 2px 0 var(--ink)}
.chip.m{background:var(--gold-soft)}
.chip.c{background:var(--coral-soft)}

.topic{display:flex;flex-direction:column;gap:.6rem;text-align:left;background:var(--cream);border:var(--bd);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:1.05rem;cursor:pointer;transition:transform .12s,box-shadow .12s}
.topic:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-2);background:var(--white)}
.topic:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.topic .n{width:34px;height:34px;border-radius:var(--r-s);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;background:var(--gold);border:var(--bd);color:var(--ink);font-size:.92rem}
.topic h3{margin:0}
.topic .desc{font-size:.92rem;color:var(--ink-2);margin:0}
.meter{height:14px;border-radius:var(--r-s);background:var(--cream-2);overflow:hidden;border:var(--bd);padding:2px}
.meter>i{display:block;height:100%;background:var(--teal);transition:width .5s steps(12,end)}
.meter.g>i{background:var(--green)} .meter.m>i{background:var(--gold)}
.metarow{display:flex;justify-content:space-between;gap:.6rem;font-size:.8rem;color:var(--ink-2);font-weight:800}

.tiles{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--white);border:var(--bd);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:.9rem;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-2)}
.tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.tile .v{font-family:var(--f-head);font-size:1.55rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .s{font-size:.85rem;color:var(--ink-2)}

/* ── buttons: chunky pixel keys ── */
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 1.15rem;border-radius:var(--r-s);border:var(--bd);box-shadow:var(--sh-1);font-weight:800;color:var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s,filter .12s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn-p{background:var(--gold)}
.btn-s{background:var(--white)}
.btn-t{background:var(--teal)}
.btn-d{background:var(--coral)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-1);filter:none}
.btnrow{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.05rem}

/* ── lesson blocks ── */
.blk{border:var(--bd);border-radius:var(--r-m);background:var(--cream);box-shadow:var(--sh-1);margin-bottom:.9rem;overflow:hidden}
.blk>summary{list-style:none;cursor:pointer;padding:.75rem .9rem;display:flex;align-items:center;gap:.7rem;font-family:var(--f-head);font-weight:800;color:var(--ink);min-height:52px;background:var(--cream-2)}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary:hover{background:var(--cream-3)}
.blk>summary .cara{margin-left:auto;color:var(--ink-2);transition:transform .2s}
.blk[open]>summary{border-bottom:var(--bd)}
.blk[open]>summary .cara{transform:rotate(180deg)}
.blk .body{padding:.9rem 1rem 1rem;background:var(--cream)}
.blk .body p{font-size:1.02rem;max-width:70ch}
.tag{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.24rem .5rem;border:var(--bd);border-radius:3px;color:var(--ink);white-space:nowrap}
.t-concept{background:var(--teal-soft)}
.t-example{background:var(--gold-soft)}
.t-tip{background:var(--blue-soft)}
.t-mistake{background:var(--coral-soft)}
.t-tryit{background:var(--green-soft)}
.t-check{background:var(--lilac)}
.t-challenge{background:var(--cream-3)}
.kw{display:grid;gap:.65rem}
@media(min-width:620px){.kw{grid-template-columns:1fr 1fr}}
.kw div{background:var(--white);border:var(--bd);border-radius:var(--r-s);padding:.6rem .75rem;box-shadow:2px 2px 0 var(--ink)}
.kw b{color:var(--ink)} .kw span{display:block;font-size:.9rem;color:var(--ink-2)}

/* ── question card: window title bar + keys ── */
.card .qhead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;
  margin:-1.1rem -1.1rem 1rem;padding:.45rem .75rem;background:var(--teal);border-bottom:var(--bd);min-height:42px}
.card .qhead::after{content:"_ □ ✕";letter-spacing:.16em;font-weight:800;font-size:.8rem;color:var(--ink);opacity:.9;margin-left:auto}
.qcount{font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.card .qhead .btn{margin-left:auto;min-height:34px;padding:.1rem .55rem;font-size:.78rem;box-shadow:2px 2px 0 var(--ink)}
.card .qhead .tag{background:var(--white)}
.qstem{font-size:clamp(1.08rem,2.4vw,1.28rem);font-weight:700;color:var(--ink);line-height:1.5;margin:0 0 1rem;max-width:62ch}
.opts{display:grid;gap:.65rem;margin:0}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;min-height:56px;text-align:left;padding:.65rem .85rem;background:var(--white);border:var(--bd);border-radius:var(--r-s);box-shadow:var(--sh-1);cursor:pointer;font-size:1.05rem;color:var(--ink);transition:transform .1s,box-shadow .1s,background .12s}
.opt:hover:not([disabled]){background:var(--gold-soft);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt .ltr{flex:0 0 30px;width:30px;height:30px;border-radius:3px;display:grid;place-items:center;background:var(--cream-2);border:var(--bd);font-weight:800;font-size:.85rem;color:var(--ink)}
.opt[aria-checked="true"]{background:var(--blue-soft);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt[aria-checked="true"] .ltr{background:var(--blue);color:var(--white)}
.opt.ok{background:var(--green-soft);transform:none;box-shadow:var(--sh-1)}
.opt.ok .ltr{background:var(--green);color:var(--ink)}
.opt.bad{background:var(--red-soft);transform:none;box-shadow:var(--sh-1)}
.opt.bad .ltr{background:var(--red);color:var(--white)}
.opt .mark{margin-left:auto;font-weight:800;font-size:.8rem;display:inline-flex;align-items:center;gap:.3rem;text-align:right}
.opt.ok .mark{color:var(--green-d)} .opt.bad .mark{color:var(--red-d)}
.opt[disabled]{cursor:default}
.numin{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.numin input{min-height:52px;font-size:1.2rem;font-family:var(--f-head);font-weight:800;padding:.5rem .8rem;border:var(--bd);border-radius:var(--r-s);box-shadow:var(--sh-1);background:var(--white);color:var(--ink);width:min(220px,100%);font-variant-numeric:tabular-nums}
.numin .unit{font-weight:800;color:var(--ink-2)}
.fb{margin-top:1rem;border-radius:var(--r-m);border:var(--bd);box-shadow:var(--sh-1);padding:.85rem .95rem}
.fb.ok{background:var(--green-soft)}
.fb.bad{background:var(--red-soft)}
.fb .fbh{display:flex;align-items:center;gap:.5rem;font-family:var(--f-head);font-weight:800;margin-bottom:.4rem}
.fb.ok .fbh{color:var(--green-d)} .fb.bad .fbh{color:var(--red-d)}
.fb summary{list-style:none} .fb summary::-webkit-details-marker{display:none}
.fb summary::before{content:"▸ ";font-weight:800}
.fb details[open] summary::before{content:"▾ "}
.steps{margin:.55rem 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:2.1rem;margin-bottom:.5rem;font-size:.98rem}
.steps li::before{content:counter(s);position:absolute;left:0;top:.1rem;width:1.5rem;height:1.5rem;border-radius:3px;background:var(--gold);border:2px solid var(--ink);color:var(--ink);font-size:.74rem;font-weight:800;display:grid;place-items:center}
.hintbox{margin-top:.8rem;background:var(--gold-soft);border:var(--bd);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:.75rem .9rem;font-size:.97rem;color:var(--ink)}
.checkline{margin-top:.65rem;font-weight:800;color:var(--green-d);font-size:.95rem}

/* ── progress + navigator ── */
.pbar{height:20px;background:var(--cream-2);border:var(--bd);border-radius:var(--r-s);overflow:hidden;margin:.25rem 0 1rem;padding:2px}
.pbar>i{display:block;height:100%;background:
  repeating-linear-gradient(90deg,var(--teal) 0 10px,var(--cream) 10px 13px);
  transition:width .45s steps(14,end)}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:.45rem;max-width:520px}
.nav-grid button{min-height:44px;border-radius:var(--r-s);border:var(--bd);background:var(--white);box-shadow:2px 2px 0 var(--ink);font-weight:800;cursor:pointer;color:var(--ink)}
.nav-grid button:hover{background:var(--gold-soft)}
.nav-grid button.done{background:var(--teal)}
.nav-grid button.cur{outline:3px solid var(--orange);outline-offset:1px}
.nav-grid button.flag{background:var(--coral-soft);box-shadow:inset 0 -5px 0 var(--coral),2px 2px 0 var(--ink)}

/* ── visuals ── */
.vis{width:fit-content;max-width:100%;margin:0 0 1rem;padding:.85rem;background:var(--white);border:var(--bd);border-radius:var(--r-m);box-shadow:var(--sh-1);overflow-x:auto}
.vis svg{display:block;width:100%;max-width:460px;height:auto}
.vis figcaption{font-size:.82rem;color:var(--ink-2);margin-top:.55rem;font-weight:600}

/* ── lab ── */
.lab{display:grid;gap:1.1rem;align-items:start}
.lab .vis{width:auto}
@media(min-width:900px){.lab{grid-template-columns:1fr 1fr}}
.ctrl{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:.5rem 0}
.ctrl label{font-weight:800;font-size:.9rem;color:var(--ink);min-width:96px}
.ctrl output{font-family:var(--f-head);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:120px;max-width:340px;accent-color:var(--teal-d);height:44px}
.big{font-family:var(--f-head);font-weight:800;font-size:clamp(1.5rem,5vw,2.05rem);color:var(--teal-d);letter-spacing:.01em;font-variant-numeric:tabular-nums}
table.dt{width:100%;max-width:460px;border-collapse:collapse;font-size:.98rem;background:var(--white);border:var(--bd)}
.vis>table.dt{border:0}
table.dt th,table.dt td{border:2px solid var(--ink);padding:.5rem .6rem;text-align:left}
table.dt th{background:var(--cream-2);font-family:var(--f-head);color:var(--ink)}

/* ── badges ── */
.bgrid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.badge{border:var(--bd);border-radius:var(--r-m);padding:.75rem;background:var(--cream-2);opacity:.6}
.badge.on{background:var(--white);opacity:1;box-shadow:var(--sh-1);animation:pop .45s steps(6,end)}
.badge .bn{font-family:var(--f-head);font-weight:800;color:var(--ink);font-size:.95rem}
.badge .bd{font-size:.84rem;color:var(--ink-2)}

/* ── modal + toast ── */
.modal{position:fixed;inset:0;z-index:70;background:rgba(72,48,31,.42);display:grid;place-items:center;padding:1rem}
.modal .box{background:var(--cream);border:3px solid var(--ink);border-radius:var(--r-m);max-width:460px;width:100%;padding:1.25rem;box-shadow:6px 6px 0 var(--ink)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:80;background:var(--gold);color:var(--ink);padding:.65rem 1.1rem;border:var(--bd);border-radius:var(--r-s);font-weight:800;box-shadow:var(--sh-1);font-size:.92rem;max-width:92vw;text-align:center}

/* ── footer ── */
.foot{border-top:3px solid var(--ink);background:var(--cream);margin-top:2rem;padding:1.1rem 1rem 1.4rem;color:var(--ink-2);font-size:.84rem;text-align:center}

@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(2px)}50%{transform:translateX(-2px)}}
@keyframes pulseok{0%{box-shadow:3px 3px 0 var(--ink)}50%{box-shadow:3px 3px 0 var(--ink),0 0 0 6px var(--green-soft)}100%{box-shadow:3px 3px 0 var(--ink)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.anim-rise{animation:rise .3s steps(6,end) both}
.anim-shake{animation:shake .36s steps(4,end)}
.anim-pulse{animation:pulseok .9s steps(8,end)}
.grow{transform-origin:left center;animation:grow .45s steps(8,end) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

<script>window.__DATA__={"lessons":[{"id":1,"code":"1","title":{"en":"Simplifying Ratios","th":"การลดรูปอัตราส่วน"},"tagline":{"en":"Compare two amounts and write the comparison in its cleanest form.","th":"เปรียบเทียบสองปริมาณ แล้วเขียนให้อยู่ในรูปที่ง่ายที่สุด"},"icon":"scale","keywords":[{"term":{"en":"ratio","th":"อัตราส่วน"},"def":{"en":"A comparison of one amount with another, written a : b.","th":"การเปรียบเทียบปริมาณหนึ่งกับอีกปริมาณ เขียนเป็น a : b"}},{"term":{"en":"simplest form","th":"รูปอย่างต่ำ"},"def":{"en":"A ratio where the parts share no common factor except 1.","th":"อัตราส่วนที่ทุกส่วนไม่มีตัวประกอบร่วมอื่นนอกจาก 1"}},{"term":{"en":"proportion","th":"สัดส่วน"},"def":{"en":"How large one part is compared with the whole.","th":"ขนาดของส่วนหนึ่งเมื่อเทียบกับทั้งหมด"}},{"term":{"en":"highest common factor","th":"ห.ร.ม."},"def":{"en":"The largest number that divides exactly into every part.","th":"จำนวนที่มากที่สุดที่หารทุกส่วนลงตัว"}}],"blocks":[{"type":"concept","title":{"en":"What a ratio really says","th":"อัตราส่วนบอกอะไร"},"body":[{"en":"A ratio compares one amount with another. If a tray holds 2 dark tiles and 3 cream tiles, the ratio of dark : cream is 2 : 3.","th":"อัตราส่วนคือการเปรียบเทียบปริมาณหนึ่งกับอีกปริมาณ ถ้าถาดหนึ่งมีกระเบื้องสีเข้ม 2 แผ่น และสีครีม 3 แผ่น อัตราส่วนสีเข้ม : สีครีม คือ 2 : 3"},{"en":"Order is part of the answer. The ratio of cream : dark for the same tray is 3 : 2 — the same tray, a different ratio.","th":"ลำดับเป็นส่วนหนึ่งของคำตอบ อัตราส่วนสีครีม : สีเข้ม ของถาดเดียวกันคือ 3 : 2 — ถาดเดิม แต่อัตราส่วนต่างกัน"},{"en":"A ratio has no units. It only says \"for every ▪ of this, there are ▫ of that\".","th":"อัตราส่วนไม่มีหน่วย บอกเพียงว่า \"ทุก ▪ ของสิ่งนี้ จะมี ▫ ของสิ่งนั้น\""}],"visual":{"kind":"squares","black":2,"white":3}},{"type":"example","title":{"en":"Grouping shows the simplest form","th":"การจัดกลุ่มทำให้เห็นรูปอย่างต่ำ"},"body":[{"en":"A tray has 2 dark tiles and 6 cream tiles, so dark : cream = 2 : 6.","th":"ถาดหนึ่งมีกระเบื้องสีเข้ม 2 แผ่น สีครีม 6 แผ่น ดังนั้น สีเข้ม : สีครีม = 2 : 6"},{"en":"Split the tray into 2 equal groups. Each group is 1 dark tile and 3 cream tiles.","th":"แบ่งถาดเป็น 2 กลุ่มเท่ากัน แต่ละกลุ่มมีสีเข้ม 1 แผ่น และสีครีม 3 แผ่น"},{"en":"So 2 : 6 is the same comparison as 1 : 3. We say 1 : 3 is the simplest form.","th":"ดังนั้น 2 : 6 คือการเปรียบเทียบเดียวกันกับ 1 : 3 เรียก 1 : 3 ว่ารูปอย่างต่ำ"}],"visual":{"kind":"squares","black":2,"white":6,"group":2}},{"type":"concept","title":{"en":"The rule: divide every part by the HCF","th":"กฎ: หารทุกส่วนด้วย ห.ร.ม."},"body":[{"en":"Find the highest common factor of the parts, then divide every part by it.","th":"หา ห.ร.ม. ของทุกส่วน แล้วหารทุกส่วนด้วยจำนวนนั้น"},{"en":"24 : 4 → HCF is 4 → 24 ÷ 4 = 6 and 4 ÷ 4 = 1 → 6 : 1.","th":"24 : 4 → ห.ร.ม. คือ 4 → 24 ÷ 4 = 6 และ 4 ÷ 4 = 1 → 6 : 1"},{"en":"This works for three parts too: 12 : 8 : 10 → divide by 2 → 6 : 4 : 5.","th":"ใช้ได้กับสามส่วนด้วย: 12 : 8 : 10 → หารด้วย 2 → 6 : 4 : 5"}]},{"type":"tip","title":{"en":"Same unit first, then simplify","th":"ทำหน่วยให้เหมือนกันก่อน แล้วลดรูป"},"body":[{"en":"3 km : 21 km already share a unit, so compare 3 : 21 → 1 : 7.","th":"3 กม. : 21 กม. มีหน่วยเดียวกันแล้ว จึงเทียบ 3 : 21 → 1 : 7"},{"en":"2 m : 50 cm do NOT share a unit. Convert first: 200 cm : 50 cm → 4 : 1.","th":"2 ม. : 50 ซม. หน่วยไม่เหมือนกัน ต้องแปลงก่อน: 200 ซม. : 50 ซม. → 4 : 1"},{"en":"Write the finished ratio without units. \"4 cm : 1 cm\" is not correct notation.","th":"เขียนอัตราส่วนสุดท้ายโดยไม่ใส่หน่วย \"4 ซม. : 1 ซม.\" ไม่ใช่รูปแบบที่ถูกต้อง"}]},{"type":"mistake","title":{"en":"Watch out: proportion is not the first number","th":"ระวัง: สัดส่วนไม่ใช่ตัวเลขตัวแรก"},"body":[{"en":"Two mango drinks: mango : water = 3 : 4 and mango : water = 2 : 3. Which is stronger?","th":"น้ำมะม่วงสองแก้ว: มะม่วง : น้ำ = 3 : 4 และ มะม่วง : น้ำ = 2 : 3 แก้วไหนเข้มกว่า"},{"en":"Do not compare 3 with 2. Compare the fraction of the WHOLE drink: 3/7 ≈ 0.43 against 2/5 = 0.40.","th":"อย่าเทียบ 3 กับ 2 ให้เทียบเศษส่วนของทั้งแก้ว: 3/7 ≈ 0.43 กับ 2/5 = 0.40"},{"en":"3/7 is bigger, so the first drink has the higher proportion of mango.","th":"3/7 มากกว่า ดังนั้นแก้วแรกมีสัดส่วนมะม่วงมากกว่า"}]},{"type":"tryit","title":{"en":"Try it yourself","th":"ลองทำด้วยตัวเอง"},"body":[{"en":"Simplify 15 : 12. Look for the largest number that divides both.","th":"ลดรูป 15 : 12 หาจำนวนที่มากที่สุดที่หารทั้งสองลงตัว"},{"en":"Then try 60 : 96 : 48 — all three parts share a factor.","th":"แล้วลอง 60 : 96 : 48 — ทั้งสามส่วนมีตัวประกอบร่วม"}]},{"type":"check","title":{"en":"Quick check","th":"ตรวจความเข้าใจ"},"body":[{"en":"Answer the questions below. You get a hint after a wrong attempt, then a full explanation.","th":"ตอบคำถามด้านล่าง หากตอบผิดจะได้คำใบ้ แล้วจึงเห็นคำอธิบายเต็ม"}]},{"type":"challenge","title":{"en":"Challenge","th":"โจทย์ท้าทาย"},"body":[{"en":"A shelf holds novels, comics and atlases in the ratio 18 : 24 : 30. Write it in its simplest form, then say what fraction of the shelf is comics.","th":"ชั้นหนังสือมีนิยาย การ์ตูน และแผนที่ ในอัตราส่วน 18 : 24 : 30 จงเขียนในรูปอย่างต่ำ แล้วบอกว่าการ์ตูนเป็นเศษส่วนเท่าใดของทั้งชั้น"},{"en":"Answer: divide by 6 → 3 : 4 : 5. Total parts = 12, so comics are 4/12 = 1/3 of the shelf.","th":"คำตอบ: หารด้วย 6 → 3 : 4 : 5 จำนวนส่วนทั้งหมด = 12 ดังนั้นการ์ตูนเป็น 4/12 = 1/3 ของทั้งชั้น"}]}]},{"id":2,"code":"2","title":{"en":"Sharing in a Ratio","th":"การแบ่งตามอัตราส่วน"},"tagline":{"en":"Split any amount fairly using parts — and always check the total.","th":"แบ่งปริมาณใด ๆ อย่างยุติธรรมด้วยจำนวนส่วน และตรวจผลรวมทุกครั้ง"},"icon":"split","keywords":[{"term":{"en":"share","th":"แบ่ง"},"def":{"en":"To split an amount into parts given by a ratio.","th":"การแบ่งปริมาณออกเป็นส่วนตามอัตราส่วนที่กำหนด"}},{"term":{"en":"one part","th":"หนึ่งส่วน"},"def":{"en":"The amount ÷ the total number of parts.","th":"ปริมาณ ÷ จำนวนส่วนทั้งหมด"}},{"term":{"en":"total parts","th":"จำนวนส่วนทั้งหมด"},"def":{"en":"Add every number in the ratio.","th":"บวกทุกจำนวนในอัตราส่วน"}},{"term":{"en":"conjecture","th":"การคาดการณ์"},"def":{"en":"A sensible guess made before calculating.","th":"การคาดคะเนอย่างมีเหตุผลก่อนคำนวณ"}}],"blocks":[{"type":"concept","title":{"en":"Parts, not halves","th":"คิดเป็นส่วน ไม่ใช่ครึ่ง"},"body":[{"en":"Sharing $48 in the ratio 1 : 3 does not mean \"one person gets a bit less\".","th":"การแบ่ง $48 ในอัตราส่วน 1 : 3 ไม่ได้หมายถึง \"คนหนึ่งได้น้อยกว่าเล็กน้อย\""},{"en":"It means the money is cut into 1 + 3 = 4 equal parts.","th":"หมายถึงเงินถูกแบ่งเป็น 1 + 3 = 4 ส่วนเท่ากัน"},{"en":"One part = $48 ÷ 4 = $12. So the shares are 1 × $12 = $12 and 3 × $12 = $36.","th":"หนึ่งส่วน = $48 ÷ 4 = $12 ส่วนแบ่งจึงเป็น 1 × $12 = $12 และ 3 × $12 = $36"}],"visual":{"kind":"sharebar","a":1,"b":3,"labels":[{"en":"Nira","th":"นิรา"},{"en":"Kiet","th":"เกียรติ"}]}},{"type":"example","title":{"en":"The three-line method","th":"วิธีสามบรรทัด"},"body":[{"en":"Share 60 kg of rice between two shops in the ratio 2 : 3.","th":"แบ่งข้าว 60 กิโลกรัม ให้ร้านสองร้าน ในอัตราส่วน 2 : 3"},{"en":"Line 1 — total parts: 2 + 3 = 5.","th":"บรรทัด 1 — จำนวนส่วนทั้งหมด: 2 + 3 = 5"},{"en":"Line 2 — one part: 60 ÷ 5 = 12 kg.","th":"บรรทัด 2 — หนึ่งส่วน: 60 ÷ 5 = 12 กิโลกรัม"},{"en":"Line 3 — shares: 2 × 12 = 24 kg and 3 × 12 = 36 kg. Check 24 + 36 = 60 ✓","th":"บรรทัด 3 — ส่วนแบ่ง: 2 × 12 = 24 และ 3 × 12 = 36 กิโลกรัม ตรวจ 24 + 36 = 60 ✓"}],"visual":{"kind":"sharebar","a":2,"b":3,"labels":[{"en":"Shop A","th":"ร้าน A"},{"en":"Shop B","th":"ร้าน B"}]}},{"type":"concept","title":{"en":"Working backwards","th":"การย้อนกลับ"},"body":[{"en":"Sometimes you know one share, not the total. Two friends share money 2 : 5 and the first gets $18.","th":"บางครั้งเรารู้ส่วนแบ่งหนึ่ง แต่ไม่รู้ผลรวม เพื่อนสองคนแบ่งเงิน 2 : 5 คนแรกได้ $18"},{"en":"That $18 is 2 parts, so one part = $18 ÷ 2 = $9.","th":"$18 นั้นคือ 2 ส่วน ดังนั้นหนึ่งส่วน = $18 ÷ 2 = $9"},{"en":"Total = 7 parts = 7 × $9 = $63. Check: $18 + $45 = $63 ✓","th":"ผลรวม = 7 ส่วน = 7 × $9 = $63 ตรวจ: $18 + $45 = $63 ✓"}]},{"type":"tip","title":{"en":"Shortcut for \"how much more?\"","th":"ทางลัดสำหรับ \"มากกว่าเท่าใด\""},"body":[{"en":"Shares in 5 : 3 differ by 5 − 3 = 2 parts.","th":"ส่วนแบ่งในอัตราส่วน 5 : 3 ต่างกัน 5 − 3 = 2 ส่วน"},{"en":"If one part is $9, the difference is 2 × $9 = $18 — no need to find both shares.","th":"ถ้าหนึ่งส่วนคือ $9 ผลต่างคือ 2 × $9 = $18 — ไม่ต้องหาส่วนแบ่งทั้งสอง"}]},{"type":"mistake","title":{"en":"Watch out: dividing by the wrong number","th":"ระวัง: หารด้วยจำนวนที่ผิด"},"body":[{"en":"Sharing $90 in 2 : 3 : 4, a common slip is $90 ÷ 3 = $30 because there are three people.","th":"แบ่ง $90 ในอัตราส่วน 2 : 3 : 4 ข้อผิดพลาดที่พบบ่อยคือ $90 ÷ 3 = $30 เพราะมีสามคน"},{"en":"Divide by the total PARTS, not the number of people: 2 + 3 + 4 = 9, so one part = $10.","th":"ต้องหารด้วยจำนวนส่วนทั้งหมด ไม่ใช่จำนวนคน: 2 + 3 + 4 = 9 ดังนั้นหนึ่งส่วน = $10"},{"en":"Shares: $20, $30, $40. Check $20 + $30 + $40 = $90 ✓","th":"ส่วนแบ่ง: $20, $30, $40 ตรวจ $20 + $30 + $40 = $90 ✓"}]},{"type":"tryit","title":{"en":"Try it yourself","th":"ลองทำด้วยตัวเอง"},"body":[{"en":"Share $64 in the ratio 3 : 5. Write all three lines, then check the total.","th":"แบ่ง $64 ในอัตราส่วน 3 : 5 เขียนทั้งสามบรรทัด แล้วตรวจผลรวม"},{"en":"Then: a crate of 35 fruits holds oranges and apples 4 : 3. How many oranges?","th":"แล้ว: ลังผลไม้ 35 ชิ้น มีส้มกับแอปเปิล 4 : 3 มีส้มกี่ชิ้น"}]},{"type":"check","title":{"en":"Quick check","th":"ตรวจความเข้าใจ"},"body":[{"en":"Every answer here can be checked by adding the shares back to the total.","th":"ทุกคำตอบตรวจได้โดยบวกส่วนแบ่งกลับให้เท่าผลรวม"}]},{"type":"challenge","title":{"en":"Challenge","th":"โจทย์ท้าทาย"},"body":[{"en":"A collector has 72 coins. The 5-cent and 10-cent coins are in the ratio 5 : 3. Is the total value just over $5?","th":"นักสะสมมีเหรียญ 72 เหรียญ เหรียญ 5 เซนต์ ต่อ 10 เซนต์ อยู่ในอัตราส่วน 5 : 3 มูลค่ารวมมากกว่า $5 เล็กน้อยจริงหรือ"},{"en":"One part = 72 ÷ 8 = 9 coins. So 45 five-cent coins (225c) and 27 ten-cent coins (270c) → 495c = $4.95. Just UNDER $5.","th":"หนึ่งส่วน = 72 ÷ 8 = 9 เหรียญ ได้เหรียญ 5 เซนต์ 45 เหรียญ (225 เซนต์) และ 10 เซนต์ 27 เหรียญ (270 เซนต์) → 495 เซนต์ = $4.95 ซึ่งน้อยกว่า $5 เล็กน้อย"}]}]},{"id":3,"code":"3","title":{"en":"Using Direct Proportion","th":"การใช้สัดส่วนตรง"},"tagline":{"en":"Find the value of one, then scale to any quantity you need.","th":"หาค่าของหนึ่งหน่วย แล้วขยายไปยังจำนวนที่ต้องการ"},"icon":"trend","keywords":[{"term":{"en":"direct proportion","th":"สัดส่วนตรง"},"def":{"en":"When one amount doubles, the other doubles too.","th":"เมื่อปริมาณหนึ่งเป็นสองเท่า อีกปริมาณก็เป็นสองเท่า"}},{"term":{"en":"unitary method","th":"วิธีหนึ่งหน่วย"},"def":{"en":"Find the value of one item, then multiply.","th":"หาค่าของหนึ่งชิ้น แล้วคูณ"}},{"term":{"en":"rate","th":"อัตรา"},"def":{"en":"A value per one unit, such as $1.20 per bag.","th":"ค่าต่อหนึ่งหน่วย เช่น $1.20 ต่อถุง"}},{"term":{"en":"best value","th":"คุ้มค่าที่สุด"},"def":{"en":"The offer with the lowest cost per item.","th":"ข้อเสนอที่ราคาต่อชิ้นต่ำสุด"}}],"blocks":[{"type":"concept","title":{"en":"What direct proportion means","th":"สัดส่วนตรงคืออะไร"},"body":[{"en":"One bag of dried mango costs $1.20. Two bags cost $2.40. Three bags cost $3.60.","th":"มะม่วงอบแห้ง 1 ถุง ราคา $1.20 สองถุง $2.40 สามถุง $3.60"},{"en":"As the number of bags grows, the cost grows in the same proportion. Cost ÷ bags is always 1.20.","th":"เมื่อจำนวนถุงเพิ่มขึ้น ราคาเพิ่มขึ้นในสัดส่วนเดียวกัน ราคา ÷ จำนวนถุง เท่ากับ 1.20 เสมอ"},{"en":"That constant value is the rate. Direct proportion always has a constant rate.","th":"ค่าคงที่นั้นคืออัตรา สัดส่วนตรงมีอัตราคงที่เสมอ"}],"visual":{"kind":"proportion","n":1,"value":1.2,"m":3,"ans":3.6,"isMoney":true}},{"type":"example","title":{"en":"The unitary method in two steps","th":"วิธีหนึ่งหน่วย สองขั้นตอน"},"body":[{"en":"Two water bottles have a mass of 600 g. What is the mass of five bottles?","th":"ขวดน้ำ 2 ขวด มีมวล 600 กรัม แล้ว 5 ขวด มีมวลเท่าใด"},{"en":"Step 1 — one bottle: 600 ÷ 2 = 300 g.","th":"ขั้นที่ 1 — หนึ่งขวด: 600 ÷ 2 = 300 กรัม"},{"en":"Step 2 — five bottles: 300 × 5 = 1500 g. Check: 1500 ÷ 5 = 300 ✓","th":"ขั้นที่ 2 — ห้าขวด: 300 × 5 = 1500 กรัม ตรวจ: 1500 ÷ 5 = 300 ✓"}],"visual":{"kind":"proportion","n":2,"value":600,"m":5,"ans":1500,"isMoney":false,"unit":"g"}},{"type":"mistake","title":{"en":"Watch out: adding instead of scaling","th":"ระวัง: บวกเพิ่มแทนการคูณ"},"body":[{"en":"\"A recipe for 4 people uses 280 g of potato. For 10 people…\" — a student writes 4 + 6 = 10, then 280 + 140 = 420 g.","th":"\"สูตรสำหรับ 4 คน ใช้มันฝรั่ง 280 กรัม ถ้า 10 คน…\" — นักเรียนเขียน 4 + 6 = 10 แล้ว 280 + 140 = 420 กรัม"},{"en":"That adds the amount for 2 people, not 6. Use the rate instead: 280 ÷ 4 = 70 g per person.","th":"นั่นคือบวกปริมาณของ 2 คน ไม่ใช่ 6 คน ให้ใช้อัตราแทน: 280 ÷ 4 = 70 กรัมต่อคน"},{"en":"10 × 70 = 700 g. Check: 700 ÷ 10 = 70 ✓","th":"10 × 70 = 700 กรัม ตรวจ: 700 ÷ 10 = 70 ✓"}]},{"type":"tip","title":{"en":"Comparing offers fairly","th":"การเทียบข้อเสนออย่างเป็นธรรม"},"body":[{"en":"Offer A: 3 bags for 85 cents. Offer B: 7 bags for $1.75. Offer C: 15 bags for $3.90.","th":"ข้อเสนอ A: 3 ถุง 85 เซนต์ ข้อเสนอ B: 7 ถุง $1.75 ข้อเสนอ C: 15 ถุง $3.90"},{"en":"Per bag: 28.33c, 25c, 26c. Offer B is the best value.","th":"ต่อถุง: 28.33, 25, 26 เซนต์ ข้อเสนอ B คุ้มค่าที่สุด"},{"en":"Bigger packs are not automatically cheaper — always divide.","th":"แพ็กใหญ่ไม่ได้ถูกกว่าโดยอัตโนมัติ ต้องหารเสมอ"}]},{"type":"concept","title":{"en":"Two-step problems","th":"โจทย์สองขั้นตอน"},"body":[{"en":"Some questions use proportion AND sharing. A machine is plastic : metal = 4 : 5, and 5 machines weigh 360 kg.","th":"บางโจทย์ใช้ทั้งสัดส่วนและการแบ่ง เครื่องจักรมีพลาสติก : โลหะ = 4 : 5 และเครื่องจักร 5 เครื่องหนัก 360 กิโลกรัม"},{"en":"Proportion first: 1 machine = 72 kg, so 8 machines = 576 kg.","th":"ใช้สัดส่วนก่อน: 1 เครื่อง = 72 กิโลกรัม ดังนั้น 8 เครื่อง = 576 กิโลกรัม"},{"en":"Then share 576 kg in 4 : 5 → one part 64 kg → metal = 5 × 64 = 320 kg.","th":"แล้วแบ่ง 576 กิโลกรัม ในอัตราส่วน 4 : 5 → หนึ่งส่วน 64 กิโลกรัม → โลหะ = 5 × 64 = 320 กิโลกรัม"}]},{"type":"tryit","title":{"en":"Try it yourself","th":"ลองทำด้วยตัวเอง"},"body":[{"en":"Five pieces of dried fish have a mass of 900 g. Find the mass of seven pieces.","th":"ปลาแห้ง 5 ชิ้น มีมวล 900 กรัม จงหามวลของ 7 ชิ้น"},{"en":"A trader pays $22.50 for five bowling games. What do seven games cost?","th":"พ่อค้าจ่าย $22.50 สำหรับโบว์ลิ่ง 5 เกม แล้ว 7 เกม ราคาเท่าใด"}]},{"type":"check","title":{"en":"Quick check","th":"ตรวจความเข้าใจ"},"body":[{"en":"Use \"value per unit × quantity\" and check your answer by dividing back.","th":"ใช้ \"ค่าต่อหนึ่งหน่วย × จำนวน\" และตรวจคำตอบด้วยการหารกลับ"}]},{"type":"challenge","title":{"en":"Challenge","th":"โจทย์ท้าทาย"},"body":[{"en":"A trader buys 3 tonnes of rice for $3600 and sells it at $1.60 per kg. What is the profit per kilogram?","th":"พ่อค้าซื้อข้าว 3 ตัน ราคา $3600 และขายกิโลกรัมละ $1.60 กำไรต่อกิโลกรัมเป็นเท่าใด"},{"en":"3 tonnes = 3000 kg. Cost per kg = 3600 ÷ 3000 = $1.20. Profit = $1.60 − $1.20 = $0.40 per kg.","th":"3 ตัน = 3000 กิโลกรัม ต้นทุนต่อกิโลกรัม = 3600 ÷ 3000 = $1.20 กำไร = $1.60 − $1.20 = $0.40 ต่อกิโลกรัม"}]}]}],"tests":[{"n":1,"title":{"en":"Mock Test 1 · Foundations","th":"ข้อสอบเสมือนชุดที่ 1 · พื้นฐาน"},"questions":[{"id":"mt1-1","type":"mcq","lesson":1,"skill":"simplify","diff":1,"stem":{"en":"Write the ratio 2 : 8 in its simplest form.","th":"จงเขียนอัตราส่วน 2 : 8 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 2 and 8.","th":"หาจำนวนที่มากที่สุดที่หาร 2 และ 8 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 2 and 8 is 2.","th":"ห.ร.ม. ของ 2 และ 8 คือ 2"},{"en":"2 ÷ 2 = 1 and 8 ÷ 2 = 4.","th":"2 ÷ 2 = 1 และ 8 ÷ 2 = 4"},{"en":"So 2 : 8 = 1 : 4.","th":"ดังนั้น 2 : 8 = 1 : 4"}],"check":{"en":"1 and 4 share no common factor except 1 — fully simplified.","th":"1 และ 4 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":2,"b":8,"correct":"1 : 4"},"options":[{"en":"1 : 4","th":"1 : 4"},{"en":"4 : 1","th":"4 : 1"},{"en":"2 : 8","th":"2 : 8"},{"en":"2 : 4","th":"2 : 4"}]},{"id":"mt1-2","type":"mcq","lesson":1,"skill":"simplify","diff":1,"stem":{"en":"Write the ratio 15 : 12 in its simplest form.","th":"จงเขียนอัตราส่วน 15 : 12 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 15 and 12.","th":"หาจำนวนที่มากที่สุดที่หาร 15 และ 12 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 15 and 12 is 3.","th":"ห.ร.ม. ของ 15 และ 12 คือ 3"},{"en":"15 ÷ 3 = 5 and 12 ÷ 3 = 4.","th":"15 ÷ 3 = 5 และ 12 ÷ 3 = 4"},{"en":"So 15 : 12 = 5 : 4.","th":"ดังนั้น 15 : 12 = 5 : 4"}],"check":{"en":"5 and 4 share no common factor except 1 — fully simplified.","th":"5 และ 4 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":15,"b":12,"correct":"5 : 4"},"options":[{"en":"5 : 4","th":"5 : 4"},{"en":"4 : 5","th":"4 : 5"},{"en":"15 : 12","th":"15 : 12"},{"en":"6 : 4","th":"6 : 4"}]},{"id":"mt1-3","type":"mcq","lesson":1,"skill":"visual-ratio","diff":1,"stem":{"en":"Look at the diagram. Write the ratio of black squares : white squares in its simplest form.","th":"พิจารณาแผนภาพ จงเขียนอัตราส่วนของ สี่เหลี่ยมสีเข้ม : สี่เหลี่ยมสีขาว ในรูปอย่างต่ำ"},"hint":{"en":"Count carefully, then write the numbers in the order the question asks.","th":"นับให้รอบคอบ แล้วเขียนตัวเลขตามลำดับที่โจทย์ถาม"},"explain":[{"en":"There are 3 dark squares and 9 white squares.","th":"มีสี่เหลี่ยมสีเข้ม 3 รูป และสีขาว 9 รูป"},{"en":"The question asks for black squares : white squares, so start with 3 : 9.","th":"โจทย์ถาม สี่เหลี่ยมสีเข้ม : สี่เหลี่ยมสีขาว จึงเริ่มจาก 3 : 9"},{"en":"Divide both by 3 to get 1 : 3.","th":"หารทั้งสองด้วย 3 ได้ 1 : 3"}],"check":{"en":"Order matters: black squares : white squares is not the same as the reverse.","th":"ลำดับสำคัญ: สี่เหลี่ยมสีเข้ม : สี่เหลี่ยมสีขาว ไม่เหมือนกับสลับที่กัน"},"verify":{"kind":"visualRatio","black":3,"white":9,"order":"bw","correct":"1 : 3"},"visual":{"kind":"squares","black":3,"white":9},"options":[{"en":"1 : 3","th":"1 : 3"},{"en":"3 : 1","th":"3 : 1"},{"en":"3 : 9","th":"3 : 9"},{"en":"9 : 3","th":"9 : 3"}]},{"id":"mt1-4","type":"mcq","lesson":1,"skill":"visual-ratio","diff":2,"stem":{"en":"Look at the diagram. Write the ratio of white squares : black squares in its simplest form.","th":"พิจารณาแผนภาพ จงเขียนอัตราส่วนของ สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม ในรูปอย่างต่ำ"},"hint":{"en":"Count carefully, then write the numbers in the order the question asks.","th":"นับให้รอบคอบ แล้วเขียนตัวเลขตามลำดับที่โจทย์ถาม"},"explain":[{"en":"There are 4 dark squares and 6 white squares.","th":"มีสี่เหลี่ยมสีเข้ม 4 รูป และสีขาว 6 รูป"},{"en":"The question asks for white squares : black squares, so start with 6 : 4.","th":"โจทย์ถาม สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม จึงเริ่มจาก 6 : 4"},{"en":"Divide both by 2 to get 3 : 2.","th":"หารทั้งสองด้วย 2 ได้ 3 : 2"}],"check":{"en":"Order matters: white squares : black squares is not the same as the reverse.","th":"ลำดับสำคัญ: สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม ไม่เหมือนกับสลับที่กัน"},"verify":{"kind":"visualRatio","black":4,"white":6,"order":"wb","correct":"3 : 2"},"visual":{"kind":"squares","black":4,"white":6},"options":[{"en":"3 : 2","th":"3 : 2"},{"en":"2 : 3","th":"2 : 3"},{"en":"6 : 4","th":"6 : 4"},{"en":"4 : 6","th":"4 : 6"}]},{"id":"mt1-5","type":"mcq","lesson":1,"skill":"units","diff":1,"stem":{"en":"Write 4 L : 16 L in its simplest form.","th":"จงเขียน 4 ลิตร : 16 ลิตร ในรูปอย่างต่ำ"},"hint":{"en":"Both amounts use the same unit, so the unit cancels out.","th":"ทั้งสองปริมาณใช้หน่วยเดียวกัน หน่วยจึงตัดกันหมด"},"explain":[{"en":"The units match (L and L), so compare the numbers only.","th":"หน่วยตรงกัน (ลิตร) จึงเทียบเฉพาะตัวเลข"},{"en":"4 ÷ 4 = 1, 16 ÷ 4 = 4.","th":"4 ÷ 4 = 1, 16 ÷ 4 = 4"},{"en":"A ratio has no units, so the answer is 1 : 4.","th":"อัตราส่วนไม่มีหน่วย คำตอบคือ 1 : 4"}],"check":{"en":"Never write units inside a ratio.","th":"ไม่ต้องเขียนหน่วยในอัตราส่วน"},"verify":{"kind":"simplify","a":4,"b":16,"correct":"1 : 4"},"options":[{"en":"1 : 4","th":"1 : 4"},{"en":"4 L : 16 L","th":"4 L : 16 L"},{"en":"4 : 1","th":"4 : 1"},{"en":"4 : 16","th":"4 : 16"}]},{"id":"mt1-6","type":"mcq","lesson":1,"skill":"fraction-of-total","diff":2,"stem":{"en":"A box holds apples and pears in the ratio 3 : 5. What fraction of the box is apples?","th":"กล่องหนึ่งมีแอปเปิลและสาลี่ ในอัตราส่วน 3 : 5 แอปเปิลคิดเป็นเศษส่วนเท่าใดของทั้งกล่อง"},"hint":{"en":"The denominator is the TOTAL number of parts.","th":"ตัวส่วนคือจำนวนส่วนทั้งหมด"},"explain":[{"en":"Total parts = 3 + 5 = 8.","th":"จำนวนส่วนทั้งหมด = 3 + 5 = 8"},{"en":"apples is 3 of those 8 parts.","th":"แอปเปิล คิดเป็น 3 จาก 8 ส่วน"},{"en":"Fraction = 3/8 = 3/8.","th":"เศษส่วน = 3/8 = 3/8"}],"check":{"en":"A ratio part over the total gives a fraction of the whole.","th":"ส่วนของอัตราส่วนหารด้วยผลรวม ได้เศษส่วนของทั้งหมด"},"verify":{"kind":"fraction","part":3,"total":8,"correct":"3/8"},"options":[{"en":"3/8","th":"3/8"},{"en":"5/8","th":"5/8"},{"en":"3/5","th":"3/5"},{"en":"5/3","th":"5/3"}]},{"id":"mt1-7","type":"mcq","lesson":1,"skill":"chart-ratio","diff":2,"stem":{"en":"The bar chart shows sales for one week. Write the ratio red : green : blue in its simplest form.","th":"แผนภูมิแท่งแสดงยอดขายในหนึ่งสัปดาห์ จงเขียนอัตราส่วน สีแดง : สีเขียว : สีน้ำเงิน ในรูปอย่างต่ำ"},"hint":{"en":"Read each bar against the scale before simplifying.","th":"อ่านค่าของแต่ละแท่งจากสเกลก่อนลดรูป"},"explain":[{"en":"From the chart: red = 24, green = 36, blue = 18.","th":"จากแผนภูมิ: สีแดง = 24, สีเขียว = 36, สีน้ำเงิน = 18"},{"en":"So the ratio is 24 : 36 : 18.","th":"อัตราส่วนคือ 24 : 36 : 18"},{"en":"Divide every part by 6 → 4 : 6 : 3.","th":"หารทุกส่วนด้วย 6 → 4 : 6 : 3"}],"check":{"en":"Keep the parts in the order the question lists them.","th":"เรียงส่วนตามลำดับที่โจทย์ระบุ"},"verify":{"kind":"chart","vals":[24,36,18],"correct":"4 : 6 : 3"},"visual":{"kind":"bar","items":[{"label":{"en":"red","th":"สีแดง"},"value":24},{"label":{"en":"green","th":"สีเขียว"},"value":36},{"label":{"en":"blue","th":"สีน้ำเงิน"},"value":18}]},"options":[{"en":"4 : 6 : 3","th":"4 : 6 : 3"},{"en":"24 : 36 : 18","th":"24 : 36 : 18"},{"en":"3 : 6 : 4","th":"3 : 6 : 4"},{"en":"5 : 6 : 3","th":"5 : 6 : 3"}]},{"id":"mt1-8","type":"mcq","lesson":1,"skill":"error-analysis","diff":2,"stem":{"en":"A student simplified 18 : 24 and wrote 9 : 12. What is the correct simplest form?","th":"นักเรียนคนหนึ่งลดรูป 18 : 24 แล้วตอบ 9 : 12 รูปอย่างต่ำที่ถูกต้องคือข้อใด"},"hint":{"en":"Check what number was actually divided out.","th":"ตรวจว่าหารด้วยจำนวนใดจริง ๆ"},"explain":[{"en":"The highest common factor of 18 and 24 is 6, not something smaller.","th":"ห.ร.ม. ของ 18 และ 24 คือ 6 ไม่ใช่จำนวนที่เล็กกว่านั้น"},{"en":"Dividing both by 6 gives 3 : 4.","th":"หารทั้งสองด้วย 6 ได้ 3 : 4"},{"en":"9 : 12 is not fully simplified or the parts were swapped.","th":"9 : 12 ยังไม่อย่างต่ำ หรือสลับที่กัน"}],"check":{"en":"Always ask: can both parts still be divided by the same number?","th":"ถามตัวเองเสมอ: ทั้งสองส่วนยังหารด้วยจำนวนเดียวกันได้อีกไหม"},"verify":{"kind":"simplify","a":18,"b":24,"correct":"3 : 4"},"options":[{"en":"3 : 4","th":"3 : 4"},{"en":"9 : 12","th":"9 : 12"},{"en":"4 : 3","th":"4 : 3"},{"en":"18 : 24","th":"18 : 24"}]},{"id":"mt1-9","type":"mcq","lesson":2,"skill":"share-one","diff":1,"stem":{"en":"Nira and Kiet share $24 in the ratio 1 : 3. How much does Nira get?","th":"นิรา และ เกียรติ แบ่ง $24 ในอัตราส่วน 1 : 3 นิรา ได้เท่าใด"},"hint":{"en":"Total parts = 1 + 3. Divide the amount by that first.","th":"จำนวนส่วนทั้งหมด = 1 + 3 หารจำนวนเงินด้วยค่านี้ก่อน"},"explain":[{"en":"Total parts = 1 + 3 = 4.","th":"จำนวนส่วนทั้งหมด = 1 + 3 = 4"},{"en":"One part = $24 ÷ 4 = $6.","th":"หนึ่งส่วน = $24 ÷ 4 = $6"},{"en":"Nira gets 1 × $6 = $6.","th":"นิรา ได้ 1 × $6 = $6"}],"check":{"en":"Check: $6 + $18 = $24 ✓","th":"ตรวจ: $6 + $ type":"mcq","lesson":3,"skill":"proportion-table","diff":2,"stem":{"en":"The table shows how the mass of tiles grows in direct proportion. What is the missing value for 10 tiles?","th":"ตารางแสดงมวลของแผ่นกระเบื้องที่เพิ่มขึ้นตามสัดส่วนตรง ค่าที่หายไปสำหรับ 10 ชิ้น คือเท่าใด"},"hint":{"en":"Each row is the row above scaled by the same multiplier.","th":"แต่ละแถวคือแถวก่อนหน้าคูณด้วยตัวคูณเดียวกัน"},"explain":[{"en":"One tile = 21 ÷ 6 = 3.5 kg.","th":"หนึ่งชิ้น = 3.5 กิโลกรัม"},{"en":"10 × 3.5 = 35 kg.","th":"10 × 3.5 = 35 kg"}],"check":{"en":"Check: 35 kg ÷ 10 = 3.5 kg ✓ (same unit value)","th":"ตรวจ: 35 kg ÷ 10 = 3.5 ✓"},"verify":{"kind":"proportion","n":6,"value":21,"m":10,"ans":35,"correct":"35 kg"},"visual":{"kind":"table","rows":[{"k":1,"v":3.5},{"k":6,"v":21},{"k":10,"v":35}],"unit":"kg","n2":10,"thing":{"en":"tiles","th":"แผ่นกระเบื้อง"}},"options":[{"en":"35 kg","th":"35 kg"},{"en":"3.5 kg","th":"3.5 kg"},{"en":"31 kg","th":"31 kg"},{"en":"38.5 kg","th":"38.5 kg"}]},{"id":"mt1-24","type":"mcq","lesson":3,"skill":"best-value","diff":3,"stem":{"en":"A shop sells bags of dried mango in three deals: Offer 1 — 3 for $0.90; Offer 2 — 7 for $1.75; Offer 3 — 15 for $4.05. Which offer is the best value for money?","th":"ร้านค้าขายถุงมะม่วงอบแห้ง สามแบบ: ข้อเสนอ 1 — 3 ชิ้น ราคา $0.90; ข้อเสนอ 2 — 7 ชิ้น ราคา $1.75; ข้อเสนอ 3 — 15 ชิ้น ราคา $4.05 ข้อเสนอใดคุ้มค่าที่สุด"},"hint":{"en":"Work out the cost of one item for each offer.","th":"คิดราคาต่อหนึ่งชิ้นของแต่ละข้อเสนอ"},"explain":[{"en":"Offer 1: $0.90 ÷ 3 = 30.00 cents each.","th":"ข้อเสนอ 1: $0.90 ÷ 3 = 30.00 เซนต์ต่อชิ้น"},{"en":"Offer 2: $1.75 ÷ 7 = 25.00 cents each.","th":"ข้อเสนอ 2: $1.75 ÷ 7 = 25.00 เซนต์ต่อชิ้น"},{"en":"Offer 3: $4.05 ÷ 15 = 27.00 cents each.","th":"ข้อเสนอ 3: $4.05 ÷ 15 = 27.00 เซนต์ต่อชิ้น"},{"en":"The lowest cost per item is Offer 2, so it is the best value.","th":"ราคาต่อชิ้นต่ำสุดคือข้อเสนอ 2 จึงคุ้มค่าที่สุด"}],"check":{"en":"Comparing per-item cost is the only fair comparison.","th":"การเทียบราคาต่อชิ้นเท่านั้นที่เป็นธรรม"},"verify":{"kind":"bestValue","rates":[0.3,0.25,0.26999999999999996],"idx":1},"options":[{"en":"Offer 2: 7 for $1.75","th":"ข้อเสนอ 2: 7 ชิ้น ราคา $1.75"},{"en":"Offer 1: 3 for $0.90","th":"ข้อเสนอ 1: 3 ชิ้น ราคา $0.90"},{"en":"Offer 3: 15 for $4.05","th":"ข้อเสนอ 3: 15 ชิ้น ราคา $4.05"},{"en":"They are all the same value","th":"ทุกข้อเสนอคุ้มค่าเท่ากัน"}]},{"id":"mt1-25","type":"mcq","lesson":3,"skill":"error-analysis","diff":3,"stem":{"en":"A recipe for 4 people needs 280 g of potatoes. A student writes: \"4 + 6 = 10, so 280 + 140 = 420 g.\" What is the correct amount for 10 people?","th":"สูตรสำหรับ 4 คน ใช้มันฝรั่ง 280 กรัม นักเรียนเขียนว่า \"4 + 6 = 10 ดังนั้น 280 + 140 = 420 กรัม\" ปริมาณที่ถูกต้องสำหรับ 10 คนคือเท่าใด"},"hint":{"en":"Direct proportion multiplies — it does not add on a fixed extra.","th":"สัดส่วนตรงใช้การคูณ ไม่ใช่บวกเพิ่มแบบคงที่"},"explain":[{"en":"Find one person's share: 280 ÷ 4 = 70 g.","th":"หาปริมาณต่อ 1 คน: 70 กรัม"},{"en":"Multiply by 10: 70 × 10 = 700 g.","th":"คูณด้วย 10: 700 g"},{"en":"The student's mistake was adding an amount instead of scaling by the same multiplier.","th":"ข้อผิดพลาดคือการบวกเพิ่ม แทนที่จะคูณด้วยตัวคูณเดียวกัน"}],"check":{"en":"Check: 70 × 4 = 280 ✓ so the rate is right.","th":"ตรวจ: 70 × 4 = 280 ✓"},"verify":{"kind":"proportion","n":4,"value":280,"m":10,"ans":700,"correct":"700 g"},"options":[{"en":"700 g","th":"700 g"},{"en":"420 g","th":"420 g"},{"en":"286 g","th":"286 g"},{"en":"70 g","th":"70 g"}]}]},{"n":2,"title":{"en":"Mock Test 2 · Building Fluency","th":"ข้อสอบเสมือนชุดที่ 2 · เพิ่มความคล่อง"},"questions":[{"id":"mt2-1","type":"mcq","lesson":1,"skill":"simplify","diff":1,"stem":{"en":"Write the ratio 24 : 4 in its simplest form.","th":"จงเขียนอัตราส่วน 24 : 4 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 24 and 4.","th":"หาจำนวนที่มากที่สุดที่หาร 24 และ 4 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 24 and 4 is 4.","th":"ห.ร.ม. ของ 24 และ 4 คือ 4"},{"en":"24 ÷ 4 = 6 and 4 ÷ 4 = 1.","th":"24 ÷ 4 = 6 และ 4 ÷ 4 = 1"},{"en":"So 24 : 4 = 6 : 1.","th":"ดังนั้น 24 : 4 = 6 : 1"}],"check":{"en":"6 and 1 share no common factor except 1 — fully simplified.","th":"6 และ 1 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":24,"b":4,"correct":"6 : 1"},"options":[{"en":"6 : 1","th":"6 : 1"},{"en":"1 : 6","th":"1 : 6"},{"en":"12 : 2","th":"12 : 2"},{"en":"24 : 4","th":"24 : 4"}]},{"id":"mt2-2","type":"mcq","lesson":1,"skill":"simplify","diff":1,"stem":{"en":"Write the ratio 16 : 18 in its simplest form.","th":"จงเขียนอัตราส่วน 16 : 18 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 16 and 18.","th":"หาจำนวนที่มากที่สุดที่หาร 16 และ 18 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 16 and 18 is 2.","th":"ห.ร.ม. ของ 16 และ 18 คือ 2"},{"en":"16 ÷ 2 = 8 and 18 ÷ 2 = 9.","th":"16 ÷ 2 = 8 และ 18 ÷ 2 = 9"},{"en":"So 16 : 18 = 8 : 9.","th":"ดังนั้น 16 : 18 = 8 : 9"}],"check":{"en":"8 and 9 share no common factor except 1 — fully simplified.","th":"8 และ 9 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":16,"b":18,"correct":"8 : 9"},"options":[{"en":"8 : 9","th":"8 : 9"},{"en":"9 : 8","th":"9 : 8"},{"en":"16 : 18","th":"16 : 18"},{"en":"9 : 9","th":"9 : 9"}]},{"id":"mt2-3","type":"mcq","lesson":1,"skill":"visual-ratio","diff":1,"stem":{"en":"Look at the diagram. Write the ratio of black squares : white squares in its simplest form.","th":"พิจารณาแผนภาพ จงเขียนอัตราส่วนของ สี่เหลี่ยมสีเข้ม : สี่เหลี่ยมสีขาว ในรูปอย่างต่ำ"},"hint":{"en":"Count carefully, then write the numbers in the order the question asks.","th":"นับให้รอบคอบ แล้วเขียนตัวเลขตามลำดับที่โจทย์ถาม"},"explain":[{"en":"There are 2 dark squares and 10 white squares.","th":"มีสี่เหลี่ยมสีเข้ม 2 รูป และสีขาว 10 รูป"},{"en":"The question asks for black squares : white squares, so start with 2 : 10.","th":"โจทย์ถาม สี่เหลี่ยมสีเข้ม : สี่เหลี่ยมสีขาว จึงเริ่มจาก 2 : 10"},{"en":"Divide both by 2 to get 1 : 5.","th":"หารทั้งสองด้วย 2 ได้ 1 : 5"}],"check":{"en":"Order matters: black squares : white squares is not the same as the reverse.","th":"ลำดับสำคัญ: สี่เหลี่ยมสีเข้ม : สี่เหลี่ยมสีขาว ไม่เหมือนกับสลับที่กัน"},"verify":{"kind":"visualRatio","black":2,"white":10,"order":"bw","correct":"1 : 5"},"visual":{"kind":"squares","black":2,"white":10},"options":[{"en":"1 : 5","th":"1 : 5"},{"en":"5 : 1","th":"5 : 1"},{"en":"2 : 10","th":"2 : 10"},{"en":"10 : 2","th":"10 : 2"}]},{"id":"mt2-4","type":"mcq","lesson":1,"skill":"units","diff":1,"stem":{"en":"Write 21 kg : 7 kg in its simplest form.","th":"จงเขียน 21 กิโลกรัม : 7 กิโลกรัม ในรูปอย่างต่ำ"},"hint":{"en":"Both amounts use the same unit, so the unit cancels out.","th":"ทั้งสองปริมาณใช้หน่วยเดียวกัน หน่วยจึงตัดกันหมด"},"explain":[{"en":"The units match (kg and kg), so compare the numbers only.","th":"หน่วยตรงกัน (กิโลกรัม) จึงเทียบเฉพาะตัวเลข"},{"en":"21 ÷ 7 = 3, 7 ÷ 7 = 1.","th":"21 ÷ 7 = 3, 7 ÷ 7 = 1"},{"en":"A ratio has no units, so the answer is 3 : 1.","th":"อัตราส่วนไม่มีหน่วย คำตอบคือ 3 : 1"}],"check":{"en":"Never write units inside a ratio.","th":"ไม่ต้องเขียนหน่วยในอัตราส่วน"},"verify":{"kind":"simplify","a":21,"b":7,"correct":"3 : 1"},"options":[{"en":"3 : 1","th":"3 : 1"},{"en":"21 kg : 7 kg","th":"21 kg : 7 kg"},{"en":"1 : 3","th":"1 : 3"},{"en":"21 : 7","th":"21 : 7"}]},{"id":"mt2-5","type":"mcq","lesson":1,"skill":"simplify3","diff":2,"stem":{"en":"Write the ratio 15 : 10 : 20 in its simplest form.","th":"จงเขียนอัตราส่วน 15 : 10 : 20 ในรูปอย่างต่ำ"},"hint":{"en":"Divide all three numbers by the same common factor.","th":"หารทั้งสามจำนวนด้วยตัวประกอบร่วมเดียวกัน"},"explain":[{"en":"The highest common factor of 15, 10 and 20 is 5.","th":"ห.ร.ม. ของ 15, 10 และ 20 คือ 5"},{"en":"Divide every part by 5: 15÷5=3, 10÷5=2, 20÷5=4.","th":"หารทุกส่วนด้วย 5: 15÷5=3, 10÷5=2, 20÷5=4"},{"en":"So the simplest form is 3 : 2 : 4.","th":"ดังนั้นรูปอย่างต่ำคือ 3 : 2 : 4"}],"check":{"en":"All three parts were divided by the same number, so the ratio is unchanged.","th":"ทั้งสามส่วนถูกหารด้วยจำนวนเดียวกัน อัตราส่วนจึงไม่เปลี่ยน"},"verify":{"kind":"simplify3","a":15,"b":10,"c":20,"correct":"3 : 2 : 4"},"options":[{"en":"3 : 2 : 4","th":"3 : 2 : 4"},{"en":"15 : 10 : 20","th":"15 : 10 : 20"},{"en":"4 : 2 : 3","th":"4 : 2 : 3"},{"en":"3 : 4 : 2","th":"3 : 4 : 2"}]},{"id":"mt2-6","type":"mcq","lesson":1,"skill":"compare-proportion","diff":3,"stem":{"en":"Tawan mixes mango juice and water in the ratio 3 : 4. Dao mixes mango juice and water in the ratio 2 : 3. Who has the higher proportion of mango juice?","th":"ตะวัน ผสมน้ำมะม่วงกับน้ำเปล่า ในอัตราส่วน 3 : 4 ส่วน ดาว ผสมในอัตราส่วน 2 : 3 ใครมีสัดส่วนของน้ำมะม่วงมากกว่า"},"hint":{"en":"Turn each ratio into a fraction of the whole mixture.","th":"เปลี่ยนแต่ละอัตราส่วนเป็นเศษส่วนของทั้งหมด"},"explain":[{"en":"Tawan: 3 parts out of 7 → 3/7 = 0.43.","th":"ตะวัน: 3 ส่วนจาก 7 → 3/7 = 0.43"},{"en":"Dao: 2 parts out of 5 → 2/5 = 0.4.","th":"ดาว: 2 ส่วนจาก 5 → 2/5 = 0.4"},{"en":"0.43 > 0.4, so Tawan has more mango juice.","th":"ดังนั้น ตะวัน มีน้ำมะม่วงสัดส่วนมากกว่า"}],"check":{"en":"Compare fractions of the TOTAL, not the first numbers of the ratios.","th":"ต้องเทียบเศษส่วนของทั้งหมด ไม่ใช่เทียบตัวเลขตัวแรก"},"verify":{"kind":"compare","p1":0.42857142857142855,"p2":0.4,"correct":"Tawan","n1":"Tawan","n2":"Dao"},"options":[{"en":"Tawan","th":"ตะวัน"},{"en":"Dao","th":"ดาว"},{"en":"They are the same","th":"เท่ากันทั้งสอง"},{"en":"It is impossible to tell","th":"บอกไม่ได้"}]},{"id":"mt2-7","type":"mcq","lesson":1,"skill":"scale-ratio","diff":2,"stem":{"en":"A tower is 550 cm tall. A scale model of it is 66 cm tall. Write the ratio of tower height to model height in its simplest form.","th":"หอคอยสูง 550 เซนติเมตร แบบจำลองสูง 66 เซนติเมตร จงเขียนอัตราส่วนความสูงหอคอยต่อแบบจำลองในรูปอย่างต่ำ"},"hint":{"en":"Tower first, model second — the order in the question.","th":"หอคอยก่อน แบบจำลองหลัง ตามลำดับในโจทย์"},"explain":[{"en":"Ratio = 550 : 66.","th":"อัตราส่วน = 550 : 66"},{"en":"HCF of 550 and 66 is 22.","th":"ห.ร.ม. ของ 550 และ 66 คือ 22"},{"en":"550÷22 : 66÷22 = 25 : 3.","th":"ได้ 25 : 3"}],"check":{"en":"The tower is larger, so its part of the ratio must be larger.","th":"หอคอยใหญ่กว่า ส่วนของหอคอยจึงต้องมากกว่า"},"verify":{"kind":"simplify","a":550,"b":66,"correct":"25 : 3"},"options":[{"en":"25 : 3","th":"25 : 3"},{"en":"3 : 25","th":"3 : 25"},{"en":"550 : 66","th":"550 : 66"},{"en":"26 : 3","th":"26 : 3"}]},{"id":"mt2-8","type":"mcq","lesson":1,"skill":"algebra-ratio","diff":3,"stem":{"en":"Write the ratio 12y : 15y in its simplest form.","th":"จงเขียนอัตราส่วน 12y : 15y ในรูปอย่างต่ำ"},"hint":{"en":"Divide both parts by 3y.","th":"หารทั้งสองส่วนด้วย 3y"},"explain":[{"en":"Both parts contain y, so y is a common factor.","th":"ทั้งสองส่วนมี y ดังนั้น y เป็นตัวประกอบร่วม"},{"en":"Divide both by 3y: 12y ÷ 3y = 4, 15y ÷ 3y = 5.","th":"หารทั้งสองด้วย 3y: ได้ 4 และ 5"},{"en":"So the simplest form is 4 : 5.","th":"รูปอย่างต่ำคือ 4 : 5"}],"check":{"en":"The letter cancels completely — a simplified ratio is just numbers.","th":"ตัวอักษรตัดกันหมด อัตราส่วนอย่างต่ำมีแต่ตัวเลข"},"verify":{"kind":"simplify","a":12,"b":15,"correct":"4 : 5"},"options":[{"en":"4 : 5","th":"4 : 5"},{"en":"12y : 15y","th":"12y : 15y"},{"en":"5 : 4","th":"5 : 4"},{"en":"12 : 15","th":"12 : 15"}]},{"id":"mt2-9","type":"mcq","lesson":2,"skill":"share-one","diff":1,"stem":{"en":"Som and Ton share $36 in the ratio 5 : 1. How much does Som get?","th":"ส้ม และ ต้น แบ่ง $36 ในอัตราส่วน 5 : 1 ส้ม ได้เท่าใด"},"hint":{"en":"Total parts = 5 + 1. Divide the amount by that first.","th":"จำนวนส่วนทั้งหมด = 5 + 1 หารจำนวนเงินด้วยค่านี้ก่อน"},"explain":[{"en":"Total parts = 5 + 1 = 6.","th":"จำนวนส่วนทั้งหมด = 5 + 1 = 6"},{"en":"One part = $36 ÷ 6 = $6.","th":"หนึ่งส่วน = $36 ÷ 6 = $6"},{"en":"Som gets 5 × $6 = $30.","th":"ส้ม ได้ 5 × $6 = $30"}],"check":{"en":"Check: $30 + $6 = $36 ✓","th":"ตรวจ: $  250 = €415.","th":"£250 → €415"}],"check":{"en":"Check: rate × amount = 1.66 × 250 = 415 ✓","th":"ตรวจ: อัตรา × จำนวน = 415 ✓"},"verify":{"kind":"proportion","n":100,"value":166,"m":250,"ans":415,"correct":"€415"},"options":[{"en":"€415","th":"€415"},{"en":"€150.6","th":"€150.6"},{"en":"€1.66","th":"€1.66"},{"en":"€316","th":"€316"}]},{"id":"mt2-21","type":"mcq","lesson":3,"skill":"recipe-scale","diff":2,"stem":{"en":"A recipe for 4 people uses 320 g of flour. How much flour is needed for 7 people?","th":"สูตรอาหารสำหรับ 4 คน ใช้แป้ง 320 กรัม ถ้าทำให้ 7 คน ต้องใช้แป้งเท่าใด"},"hint":{"en":"Find the amount for ONE person first.","th":"หาปริมาณสำหรับ 1 คนก่อน"},"explain":[{"en":"4 people → 320 g.","th":"4 คน → 320 กรัม"},{"en":"1 person → 320 ÷ 4 = 80 g.","th":"1 คน → 80 กรัม"},{"en":"7 people → 80 × 7 = 560 g.","th":"7 คน → 560 g"}],"check":{"en":"Check: 80 g per person × 7 = 560 g ✓","th":"ตรวจ: 80 กรัม/คน × 7 = 560 g ✓"},"verify":{"kind":"proportion","n":4,"value":320,"m":7,"ans":560,"correct":"560 g"},"visual":{"kind":"proportion","n":4,"value":320,"m":7,"ans":560,"isMoney":false,"unit":"g"},"options":[{"en":"560 g","th":"560 g"},{"en":"323 g","th":"323 g"},{"en":"80 g","th":"80 g"},{"en":"182.86 g","th":"182.86 g"}]},{"id":"mt2-22","type":"mcq","lesson":3,"skill":"identify-proportion","diff":2,"stem":{"en":"A table records 2 items → $5, 4 items → $10, 6 items → $15. Are the number of items and the cost in direct proportion?","th":"ตารางบันทึกว่า 2 ชิ้น → $5, 4 ชิ้น → $10, 6 ชิ้น → $15 จำนวนชิ้นกับราคาเป็นสัดส่วนตรงหรือไม่"},"hint":{"en":"Divide cost by quantity for every row and compare.","th":"หารราคาด้วยจำนวนทุกแถว แล้วเทียบกัน"},"explain":[{"en":"Unit values: 5 ÷ 2 = 2.5; 10 ÷ 4 = 2.5; 15 ÷ 6 = 2.5.","th":"ค่าต่อหน่วย: 5 ÷ 2 = 2.5; 10 ÷ 4 = 2.5; 15 ÷ 6 = 2.5"},{"en":"Every row gives the same unit value, so the quantities ARE in direct proportion.","th":"ทุกแถวได้ค่าต่อหน่วยเท่ากัน จึงเป็นสัดส่วนตรง"}],"check":{"en":"Direct proportion means cost ÷ quantity is constant.","th":"สัดส่วนตรงหมายถึง ราคา ÷ จำนวน คงที่"},"verify":{"kind":"isProportion","pairs":[[2,5],[4,10],[6,15]],"isProp":true},"options":[{"en":"Yes — the two quantities are in direct proportion","th":"ใช่ — ทั้งสองปริมาณเป็นสัดส่วนตรง"},{"en":"No — the two quantities are not in direct proportion","th":"ไม่ใช่ — ทั้งสองปริมาณไม่เป็นสัดส่วนตรง"},{"en":"It is impossible to decide without more rows","th":"ตัดสินไม่ได้ถ้าไม่มีข้อมูลเพิ่ม"},{"en":"Only the first two rows are in proportion","th":"เฉพาะสองแถวแรกที่เป็นสัดส่วน"}]},{"id":"mt2-23","type":"numeric","lesson":3,"skill":"unitary","diff":2,"stem":{"en":"5 pieces of salted fish have a mass of 900 g. What is the mass of 7 pieces of salted fish, in g? (Give the number only.)","th":"ปลาเค็ม 5 ชิ้น มีมวล 900 กรัม แล้ว 7 ชิ้น มีมวลเท่าใด (ตอบเป็นตัวเลข หน่วย กรัม)"},"hint":{"en":"Divide to find one, then multiply.","th":"หารเพื่อหาหนึ่งชิ้น แล้วคูณ"},"explain":[{"en":"1 pieces of salted fish = 900 ÷ 5 = 180 g.","th":"1 ชิ้น = 180 กรัม"},{"en":"7 pieces of salted fish = 180 × 7 = 1260 g.","th":"7 ชิ้น = 1260 กรัม"}],"check":{"en":"Check: 180 × 7 = 1260 ✓","th":"ตรวจ: 180 × 7 = 1260 ✓"},"verify":{"kind":"proportion","n":5,"value":900,"m":7,"ans":1260,"correct":"1260"},"visual":{"kind":"proportion","n":5,"value":900,"m":7,"ans":1260,"isMoney":false,"unit":"g"},"answerValue":1260,"unit":"g"},{"id":"mt2-24","type":"mcq","lesson":3,"skill":"rate-profit","diff":3,"stem":{"en":"A trader buys 3 tonnes of rice for $3600 and sells it for $1.60 per kilogram. How much profit is made per kilogram?","th":"พ่อค้าซื้อข้าว 3 ตัน ราคา $3600 และขายกิโลกรัมละ $1.60 ได้กำไรกิโลกรัมละเท่าใด"},"hint":{"en":"1 tonne = 1000 kg. Find the cost of 1 kg first.","th":"1 ตัน = 1000 กิโลกรัม หาต้นทุนต่อกิโลกรัมก่อน"},"explain":[{"en":"3 tonnes = 3000 kg.","th":"3 ตัน = 3000 กิโลกรัม"},{"en":"Cost per kg = $3600 ÷ 3000 = $1.20.","th":"ต้นทุนต่อกิโลกรัม = $1.20"},{"en":"Profit per kg = $1.60 − $1.20 = $0.40.","th":"กำไรต่อกิโลกรัม = $0.40"}],"check":{"en":"Check: $1.20 × 3000 = $3600 ✓","th":"ตรวจ: $1.20 × 3000 = $3600 ✓"},"verify":{"kind":"profit","kg":3000,"costPerKg":1.2,"profit":0.40000000000000013,"correct":"$0.40"},"options":[{"en":"$0.40","th":"$0.40"},{"en":"$1.20","th":"$1.20"},{"en":"$1.60","th":"$1.60"},{"en":"$0.80","th":"$0.80"}]},{"id":"mt2-25","type":"mcq","lesson":3,"skill":"ratio-and-proportion","diff":3,"stem":{"en":"A machine is built from plastic and metal in the ratio 4 : 5. The total mass of 5 machines is 360 kg. What is the mass of metal in 8 machines?","th":"เครื่องจักรทำจากพลาสติกและโลหะ ในอัตราส่วน 4 : 5 เครื่องจักร 5 เครื่อง มีมวลรวม 360 กิโลกรัม แล้วโลหะในเครื่องจักร 8 เครื่อง มีมวลเท่าใด"},"hint":{"en":"Two steps: proportion for total mass, then share in the ratio.","th":"สองขั้น: ใช้สัดส่วนหามวลรวม แล้วแบ่งตามอัตราส่วน"},"explain":[{"en":"1 machine = 360 ÷ 5 = 72 kg.","th":"1 เครื่อง = 72 กิโลกรัม"},{"en":"8 machines = 72 × 8 = 576 kg.","th":"8 เครื่อง = 576 กิโลกรัม"},{"en":"Share 576 kg in 4 : 5: one part = 64 kg, so metal = 5 × 64 = 320 kg.","th":"แบ่ง 576 กิโลกรัม ในอัตราส่วน 4 : 5: หนึ่งส่วน = 64 กิโลกรัม ดังนั้นโลหะ = 320 kg"}],"check":{"en":"Check: 256 + 320 = 576 kg ✓","th":"ตรวจ: 256 + 320 = 576 ✓"},"verify":{"kind":"combined","perItem":72,"massM":576,"one":64,"target":320,"correct":"320 kg"},"options":[{"en":"320 kg","th":"320 kg"},{"en":"256 kg","th":"256 kg"},{"en":"576 kg","th":"576 kg"},{"en":"72 kg","th":"72 kg"}]}]},{"n":3,"title":{"en":"Mock Test 3 · Mixed Skills","th":"ข้อสอบเสมือนชุดที่ 3 · ทักษะผสม"},"questions":[{"id":"mt3-1","type":"mcq","lesson":1,"skill":"simplify","diff":1,"stem":{"en":"Write the ratio 60 : 10 in its simplest form.","th":"จงเขียนอัตราส่วน 60 : 10 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 60 and 10.","th":"หาจำนวนที่มากที่สุดที่หาร 60 และ 10 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 60 and 10 is 10.","th":"ห.ร.ม. ของ 60 และ 10 คือ 10"},{"en":"60 ÷ 10 = 6 and 10 ÷ 10 = 1.","th":"60 ÷ 10 = 6 และ 10 ÷ 10 = 1"},{"en":"So 60 : 10 = 6 : 1.","th":"ดังนั้น 60 : 10 = 6 : 1"}],"check":{"en":"6 and 1 share no common factor except 1 — fully simplified.","th":"6 และ 1 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":60,"b":10,"correct":"6 : 1"},"options":[{"en":"6 : 1","th":"6 : 1"},{"en":"1 : 6","th":"1 : 6"},{"en":"12 : 2","th":"12 : 2"},{"en":"60 : 10","th":"60 : 10"}]},{"id":"mt3-2","type":"mcq","lesson":1,"skill":"simplify","diff":2,"stem":{"en":"Write the ratio 55 : 10 in its simplest form.","th":"จงเขียนอัตราส่วน 55 : 10 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 55 and 10.","th":"หาจำนวนที่มากที่สุดที่หาร 55 และ 10 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 55 and 10 is 5.","th":"ห.ร.ม. ของ 55 และ 10 คือ 5"},{"en":"55 ÷ 5 = 11 and 10 ÷ 5 = 2.","th":"55 ÷ 5 = 11 และ 10 ÷ 5 = 2"},{"en":"So 55 : 10 = 11 : 2.","th":"ดังนั้น 55 : 10 = 11 : 2"}],"check":{"en":"11 and 2 share no common factor except 1 — fully simplified.","th":"11 และ 2 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":55,"b":10,"correct":"11 : 2"},"options":[{"en":"11 : 2","th":"11 : 2"},{"en":"2 : 11","th":"2 : 11"},{"en":"55 : 10","th":"55 : 10"},{"en":"12 : 2","th":"12 : 2"}]},{"id":"mt3-3","type":"mcq","lesson":1,"skill":"visual-ratio","diff":2,"stem":{"en":"Look at the diagram. Write the ratio of white squares : black squares in its simplest form.","th":"พิจารณาแผนภาพ จงเขียนอัตราส่วนของ สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม ในรูปอย่างต่ำ"},"hint":{"en":"Count carefully, then write the numbers in the order the question asks.","th":"นับให้รอบคอบ แล้วเขียนตัวเลขตามลำดับที่โจทย์ถาม"},"explain":[{"en":"There are 6 dark squares and 10 white squares.","th":"มีสี่เหลี่ยมสีเข้ม 6 รูป และสีขาว 10 รูป"},{"en":"The question asks for white squares : black squares, so start with 10 : 6.","th":"โจทย์ถาม สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม จึงเริ่มจาก 10 : 6"},{"en":"Divide both by 2 to get 5 : 3.","th":"หารทั้งสองด้วย 2 ได้ 5 : 3"}],"check":{"en":"Order matters: white squares : black squares is not the same as the reverse.","th":"ลำดับสำคัญ: สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม ไม่เหมือนกับสลับที่กัน"},"verify":{"kind":"visualRatio","black":6,"white":10,"order":"wb","correct":"5 : 3"},"visual":{"kind":"squares","black":6,"white":10},"options":[{"en":"5 : 3","th":"5 : 3"},{"en":"3 : 5","th":"3 : 5"},{"en":"10 : 6","th":"10 : 6"},{"en":"6 : 10","th":"6 : 10"}]},{"id":"mt3-4","type":"mcq","lesson":1,"skill":"units","diff":1,"stem":{"en":"Write 40 t : 8 t in its simplest form.","th":"จงเขียน 40 ตัน : 8 ตัน ในรูปอย่างต่ำ"},"hint":{"en":"Both amounts use the same unit, so the unit cancels out.","th":"ทั้งสองปริมาณใช้หน่วยเดียวกัน หน่วยจึงตัดกันหมด"},"explain":[{"en":"The units match (t and t), so compare the numbers only.","th":"หน่วยตรงกัน (ตัน) จึงเทียบเฉพาะตัวเลข"},{"en":"40 ÷ 8 = 5, 8 ÷ 8 = 1.","th":"40 ÷ 8 = 5, 8 ÷ 8 = 1"},{"en":"A ratio has no units, so the answer is 5 : 1.","th":"อัตราส่วนไม่มีหน่วย คำตอบคือ 5 : 1"}],"check":{"en":"Never write units inside a ratio.","th":"ไม่ต้องเขียนหน่วยในอัตราส่วน"},"verify":{"kind":"simplify","a":40,"b":8,"correct":"5 : 1"},"options":[{"en":"5 : 1","th":"5 : 1"},{"en":"40 t : 8 t","th":"40 t : 8 t"},{"en":"1 : 5","th":"1 : 5"},{"en":"40 : 8","th":"40 : 8"}]},{"id":"mt3-5","type":"mcq","lesson":1,"skill":"simplify3","diff":2,"stem":{"en":"Write the ratio 6 : 9 : 12 in its simplest form.","th":"จงเขียนอัตราส่วน 6 : 9 : 12 ในรูปอย่างต่ำ"},"hint":{"en":"Divide all three numbers by the same common factor.","th":"หารทั้งสามจำนวนด้วยตัวประกอบร่วมเดียวกัน"},"explain":[{"en":"The highest common factor of 6, 9 and 12 is 3.","th":"ห.ร.ม. ของ 6, 9 และ 12 คือ 3"},{"en":"Divide every part by 3: 6÷3=2, 9÷3=3, 12÷3=4.","th":"หารทุกส่วนด้วย 3: 6÷3=2, 9÷3=3, 12÷3=4"},{"en":"So the simplest form is 2 : 3 : 4.","th":"ดังนั้นรูปอย่างต่ำคือ 2 : 3 : 4"}],"check":{"en":"All three parts were divided by the same number, so the ratio is uncha ัดส่วนตรง"}],"check":{"en":"Direct proportion means cost ÷ quantity is constant.","th":"สัดส่วนตรงหมายถึง ราคา ÷ จำนวน คงที่"},"verify":{"kind":"isProportion","pairs":[[3,7.5],[5,12.5],[8,21]],"isProp":false},"options":[{"en":"No — the two quantities are not in direct proportion","th":"ไม่ใช่ — ทั้งสองปริมาณไม่เป็นสัดส่วนตรง"},{"en":"Yes — the two quantities are in direct proportion","th":"ใช่ — ทั้งสองปริมาณเป็นสัดส่วนตรง"},{"en":"It is impossible to decide without more rows","th":"ตัดสินไม่ได้ถ้าไม่มีข้อมูลเพิ่ม"},{"en":"Only the first two rows are in proportion","th":"เฉพาะสองแถวแรกที่เป็นสัดส่วน"}]},{"id":"mt4-23","type":"mcq","lesson":3,"skill":"error-analysis","diff":3,"stem":{"en":"A recipe for 5 people needs 350 g of butter. A student writes: \"5 + 7 = 12, so 350 + 175 = 525 g.\" What is the correct amount for 12 people?","th":"สูตรสำหรับ 5 คน ใช้เนย 350 กรัม นักเรียนเขียนว่า \"5 + 7 = 12 ดังนั้น 350 + 175 = 525 กรัม\" ปริมาณที่ถูกต้องสำหรับ 12 คนคือเท่าใด"},"hint":{"en":"Direct proportion multiplies — it does not add on a fixed extra.","th":"สัดส่วนตรงใช้การคูณ ไม่ใช่บวกเพิ่มแบบคงที่"},"explain":[{"en":"Find one person's share: 350 ÷ 5 = 70 g.","th":"หาปริมาณต่อ 1 คน: 70 กรัม"},{"en":"Multiply by 12: 70 × 12 = 840 g.","th":"คูณด้วย 12: 840 g"},{"en":"The student's mistake was adding an amount instead of scaling by the same multiplier.","th":"ข้อผิดพลาดคือการบวกเพิ่ม แทนที่จะคูณด้วยตัวคูณเดียวกัน"}],"check":{"en":"Check: 70 × 5 = 350 ✓ so the rate is right.","th":"ตรวจ: 70 × 5 = 350 ✓"},"verify":{"kind":"proportion","n":5,"value":350,"m":12,"ans":840,"correct":"840 g"},"options":[{"en":"840 g","th":"840 g"},{"en":"525 g","th":"525 g"},{"en":"357 g","th":"357 g"},{"en":"70 g","th":"70 g"}]},{"id":"mt4-24","type":"mcq","lesson":3,"skill":"rate-profit","diff":3,"stem":{"en":"A trader buys 2 tonnes of rice for $2400 and sells it for $1.45 per kilogram. How much profit is made per kilogram?","th":"พ่อค้าซื้อข้าว 2 ตัน ราคา $2400 และขายกิโลกรัมละ $1.45 ได้กำไรกิโลกรัมละเท่าใด"},"hint":{"en":"1 tonne = 1000 kg. Find the cost of 1 kg first.","th":"1 ตัน = 1000 กิโลกรัม หาต้นทุนต่อกิโลกรัมก่อน"},"explain":[{"en":"2 tonnes = 2000 kg.","th":"2 ตัน = 2000 กิโลกรัม"},{"en":"Cost per kg = $2400 ÷ 2000 = $1.20.","th":"ต้นทุนต่อกิโลกรัม = $1.20"},{"en":"Profit per kg = $1.45 − $1.20 = $0.25.","th":"กำไรต่อกิโลกรัม = $0.25"}],"check":{"en":"Check: $1.20 × 2000 = $2400 ✓","th":"ตรวจ: $1.20 × 2000 = $2400 ✓"},"verify":{"kind":"profit","kg":2000,"costPerKg":1.2,"profit":0.25,"correct":"$0.25"},"options":[{"en":"$0.25","th":"$0.25"},{"en":"$1.20","th":"$1.20"},{"en":"$1.45","th":"$1.45"},{"en":"$0.50","th":"$0.50"}]},{"id":"mt4-25","type":"mcq","lesson":3,"skill":"best-value","diff":3,"stem":{"en":"A shop sells exercise books in three deals: Offer 1 — 5 for $2; Offer 2 — 8 for $3.04; Offer 3 — 20 for $7.80. Which offer is the best value for money?","th":"ร้านค้าขายสมุดแบบฝึกหัด สามแบบ: ข้อเสนอ 1 — 5 ชิ้น ราคา $2; ข้อเสนอ 2 — 8 ชิ้น ราคา $3.04; ข้อเสนอ 3 — 20 ชิ้น ราคา $7.80 ข้อเสนอใดคุ้มค่าที่สุด"},"hint":{"en":"Work out the cost of one item for each offer.","th":"คิดราคาต่อหนึ่งชิ้นของแต่ละข้อเสนอ"},"explain":[{"en":"Offer 1: $2 ÷ 5 = 40.00 cents each.","th":"ข้อเสนอ 1: $2 ÷ 5 = 40.00 เซนต์ต่อชิ้น"},{"en":"Offer 2: $3.04 ÷ 8 = 38.00 cents each.","th":"ข้อเสนอ 2: $3.04 ÷ 8 = 38.00 เซนต์ต่อชิ้น"},{"en":"Offer 3: $7.80 ÷ 20 = 39.00 cents each.","th":"ข้อเสนอ 3: $7.80 ÷ 20 = 39.00 เซนต์ต่อชิ้น"},{"en":"The lowest cost per item is Offer 2, so it is the best value.","th":"ราคาต่อชิ้นต่ำสุดคือข้อเสนอ 2 จึงคุ้มค่าที่สุด"}],"check":{"en":"Comparing per-item cost is the only fair comparison.","th":"การเทียบราคาต่อชิ้นเท่านั้นที่เป็นธรรม"},"verify":{"kind":"bestValue","rates":[0.4,0.38,0.39],"idx":1},"options":[{"en":"Offer 2: 8 for $3.04","th":"ข้อเสนอ 2: 8 ชิ้น ราคา $3.04"},{"en":"Offer 1: 5 for $2","th":"ข้อเสนอ 1: 5 ชิ้น ราคา $2"},{"en":"Offer 3: 20 for $7.80","th":"ข้อเสนอ 3: 20 ชิ้น ราคา $7.80"},{"en":"They are all the same value","th":"ทุกข้อเสนอคุ้มค่าเท่ากัน"}]}]},{"n":5,"title":{"en":"Mock Test 5 · Challenge Paper","th":"ข้อสอบเสมือนชุดที่ 5 · ชุดท้าทาย"},"questions":[{"id":"mt5-1","type":"mcq","lesson":1,"skill":"simplify","diff":2,"stem":{"en":"Write the ratio 32 : 12 in its simplest form.","th":"จงเขียนอัตราส่วน 32 : 12 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 32 and 12.","th":"หาจำนวนที่มากที่สุดที่หาร 32 และ 12 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 32 and 12 is 4.","th":"ห.ร.ม. ของ 32 และ 12 คือ 4"},{"en":"32 ÷ 4 = 8 and 12 ÷ 4 = 3.","th":"32 ÷ 4 = 8 และ 12 ÷ 4 = 3"},{"en":"So 32 : 12 = 8 : 3.","th":"ดังนั้น 32 : 12 = 8 : 3"}],"check":{"en":"8 and 3 share no common factor except 1 — fully simplified.","th":"8 และ 3 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":32,"b":12,"correct":"8 : 3"},"options":[{"en":"8 : 3","th":"8 : 3"},{"en":"3 : 8","th":"3 : 8"},{"en":"16 : 6","th":"16 : 6"},{"en":"32 : 12","th":"32 : 12"}]},{"id":"mt5-2","type":"mcq","lesson":1,"skill":"simplify","diff":2,"stem":{"en":"Write the ratio 63 : 27 in its simplest form.","th":"จงเขียนอัตราส่วน 63 : 27 ในรูปอย่างต่ำ"},"hint":{"en":"Find the largest number that divides into both 63 and 27.","th":"หาจำนวนที่มากที่สุดที่หาร 63 และ 27 ลงตัวทั้งคู่"},"explain":[{"en":"The highest common factor of 63 and 27 is 9.","th":"ห.ร.ม. ของ 63 และ 27 คือ 9"},{"en":"63 ÷ 9 = 7 and 27 ÷ 9 = 3.","th":"63 ÷ 9 = 7 และ 27 ÷ 9 = 3"},{"en":"So 63 : 27 = 7 : 3.","th":"ดังนั้น 63 : 27 = 7 : 3"}],"check":{"en":"7 and 3 share no common factor except 1 — fully simplified.","th":"7 และ 3 ไม่มีตัวประกอบร่วมอื่นนอกจาก 1 — อย่างต่ำแล้ว"},"verify":{"kind":"simplify","a":63,"b":27,"correct":"7 : 3"},"options":[{"en":"7 : 3","th":"7 : 3"},{"en":"3 : 7","th":"3 : 7"},{"en":"21 : 9","th":"21 : 9"},{"en":"63 : 27","th":"63 : 27"}]},{"id":"mt5-3","type":"mcq","lesson":1,"skill":"visual-ratio","diff":2,"stem":{"en":"Look at the diagram. Write the ratio of white squares : black squares in its simplest form.","th":"พิจารณาแผนภาพ จงเขียนอัตราส่วนของ สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม ในรูปอย่างต่ำ"},"hint":{"en":"Count carefully, then write the numbers in the order the question asks.","th":"นับให้รอบคอบ แล้วเขียนตัวเลขตามลำดับที่โจทย์ถาม"},"explain":[{"en":"There are 8 dark squares and 12 white squares.","th":"มีสี่เหลี่ยมสีเข้ม 8 รูป และสีขาว 12 รูป"},{"en":"The question asks for white squares : black squares, so start with 12 : 8.","th":"โจทย์ถาม สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม จึงเริ่มจาก 12 : 8"},{"en":"Divide both by 4 to get 3 : 2.","th":"หารทั้งสองด้วย 4 ได้ 3 : 2"}],"check":{"en":"Order matters: white squares : black squares is not the same as the reverse.","th":"ลำดับสำคัญ: สี่เหลี่ยมสีขาว : สี่เหลี่ยมสีเข้ม ไม่เหมือนกับสลับที่กัน"},"verify":{"kind":"visualRatio","black":8,"white":12,"order":"wb","correct":"3 : 2"},"visual":{"kind":"squares","black":8,"white":12},"options":[{"en":"3 : 2","th":"3 : 2"},{"en":"2 : 3","th":"2 : 3"},{"en":"12 : 8","th":"12 : 8"},{"en":"8 : 12","th":"8 : 12"}]},{"id":"mt5-4","type":"mcq","lesson":1,"skill":"units","diff":1,"stem":{"en":"Write 16 days : 10 days in its simplest form.","th":"จงเขียน 16 วัน : 10 วัน ในรูปอย่างต่ำ"},"hint":{"en":"Both amounts use the same unit, so the unit cancels out.","th":"ทั้งสองปริมาณใช้หน่วยเดียวกัน หน่วยจึงตัดกันหมด"},"explain":[{"en":"The units match (days and days), so compare the numbers only.","th":"หน่วยตรงกัน (วัน) จึงเทียบเฉพาะตัวเลข"},{"en":"16 ÷ 2 = 8, 10 ÷ 2 = 5.","th":"16 ÷ 2 = 8, 10 ÷ 2 = 5"},{"en":"A ratio has no units, so the answer is 8 : 5.","th":"อัตราส่วนไม่มีหน่วย คำตอบคือ 8 : 5"}],"check":{"en":"Never write units inside a ratio.","th":"ไม่ต้องเขียนหน่วยในอัตราส่วน"},"verify":{"kind":"simplify","a":16,"b":10,"correct":"8 : 5"},"options":[{"en":"8 : 5","th":"8 : 5"},{"en":"16 days : 10 days","th":"16 days : 10 days"},{"en":"5 : 8","th":"5 : 8"},{"en":"16 : 10","th":"16 : 10"}]},{"id":"mt5-5","type":"mcq","lesson":1,"skill":"simplify3","diff":3,"stem":{"en":"Write the ratio 20 : 8 : 32 in its simplest form.","th":"จงเขียนอัตราส่วน 20 : 8 : 32 ในรูปอย่างต่ำ"},"hint":{"en":"Divide all three numbers by the same common factor.","th":"หารทั้งสามจำนวนด้วยตัวประกอบร่วมเดียวกัน"},"explain":[{"en":"The highest common factor of 20, 8 and 32 is 4.","th":"ห.ร.ม. ของ 20, 8 และ 32 คือ 4"},{"en":"Divide every part by 4: 20÷4=5, 8÷4=2, 32÷4=8.","th":"หารทุกส่วนด้วย 4: 20÷4=5, 8÷4=2, 32÷4=8"},{"en":"So the simplest form is 5 : 2 : 8.","th":"ดังนั้นรูปอย่างต่ำคือ 5 : 2 : 8"}],"check":{"en":"All three parts were divided by the same number, so the ratio is unchanged.","th":"ทั้งสามส่วนถูกหารด้วยจำนวนเดียวกัน อัตราส่วนจึงไม่เปลี่ยน"},"verify":{"kind":"simplify3","a":20,"b":8,"c":32,"correct":"5 : 2 : 8"},"options":[{"en":"5 : 2 : 8","th":"5 : 2 : 8"},{"en":"10 : 4 : 16","th":"10 : 4 : 16"},{"en":"20 : 8 : 32","th":"20 : 8 : 32"},{"en":"8 : 2 : 5","th":"8 : 2 : 5"}]},{"id":"mt5-6","type":"mcq","lesson":1,"skill":"units-convert","diff":3,"stem":{"en":"Write 3 kg : 750 g in its simplest form.","th":"จงเขียน 3 กิโลกรัม : 750 กรัม ในรูปอย่างต่ำ"},"hint":{"en":"Change both amounts into the same unit first.","th":"เปลี่ยนทั้งสองปริมาณให้เป็นหน่วยเดียวกันก่อน"},"explain":[{"en":"Convert: 3 kg = 3000 g.","th":"แปลงหน่วย: 3 กิโลกรัม = 3000 กรัม"},{"en":"Now the ratio is 3000 : 750.","th":"ตอนนี้อัตราส่วนเป็น 3000 : 750"},{"en":"Divide both by 750 to get 4 : 1.","th":"หารทั้งสองด้วย 750 ได้ 4 : 1"}],"check":{"en":"Simplifying before converting gives a different — and wrong — answer.","th":"ถ้าลดรูปก่อนแปลงหน่วย จะได้คำตอบที่ผิด"},"verify":{"kind":"simplify","a":3000,"b":750,"correct":"4 : 1"},"options":[{"en":"4 : 1","th":"4 : 1"},{"en":"1 : 250","th":"1 : 250"},{"en":"1 : 4","th":"1 : 4"},{"en":"3000 : 750","th":"3000 : 750"}]},{"id":"mt5-7","type":"mcq","lesson":1,"skill":"sequence-ratio","diff":3,"stem":{"en":"Two numbers are missing from this sequence: 12, 19, 26, □, 40, 47, 54, □, 68. Write the ratio of the first missing number to the second missing number, in its simplest form.","th":"ลำดับนี้มีสองจำนวนหายไป: 12, 19, 26, □, 40, 47, 54, □, 68 จงเขียนอัตราส่วนของจำนวนที่หายไปตัวแรกต่อตัวที่สอง ในรูปอย่างต่ำ"},"hint":{"en":"Work out the step of the sequence first.","th":"หาผลต่างของลำดับก่อน"},"explain":[{"en":"The sequence changes by 7 each time.","th":"ลำดับเปลี่ยนทีละ 7"},{"en":"The missing numbers are 33 and 61.","th":"จำนวนที่หายไปคือ 33 และ 61"},{"en":"33 : 61 = 33 : 61 after dividing by 1.","th":"33 : 61 = 33 : 61 เมื่อหารด้วย 1"}],"check":{"en":"Check both missing numbers fit the pattern before writing the ratio.","th":"ตรวจว่าจำนวนที่หายไปทั้งสองเข้ากับแบบรูปก่อนเขียนอัตราส่วน"},"verify":{"kind":"simplify","a":33,"b":61,"correct":"33 : 61"},"options":[{"en":"33 : 61","th":"33 : 61"},{"en":"61 : 33","th":"61 : 33"},{"en":"34 : 61","th":"34 : 61"},{"en":"33 : 62","th":"33 : 62"}]},{"id":"mt5-8","type":"mcq","lesson":1,"skill":"error-analysis","diff":3,"stem":{"en":"A student simplified 48 : 30 and wrote 24 : 15. What is the correct simplest form?","th":"นักเรียนคนหนึ่งลดรูป 48 : 30 แล้วตอบ 24 : 15 รูปอย่างต่ำที่ถูกต้องคือข้อใด"},"hint":{"en":"Check what number was actually divided out.","th":"ตรวจว่าหารด้วยจำนวนใดจริง ๆ"},"explain":[{"en":"The highest common factor of 48 and 30 is 6, not something smaller.","th":"ห.ร.ม. ของ 48 และ 30 คือ 6 ไม่ใช่จำนวนที่เล็กกว่านั้น"},{"en":"Dividing both by 6 gives 8 : 5.","th":"หารทั้งสองด้วย 6 ได้ 8 : 5"},{"en":"24 : 15 is not fully simplified or the parts were swapped.","th":"24 : 15 ยังไม่อย่างต่ำ หรือสลับที่กัน"}],"check":{"en":"Always ask: can both parts still be divided by the same number?","th":"ถามตัวเองเสมอ: ทั้งสองส่วนยังหารด้วยจำนวนเดียวกันได้อีกไหม"},"verify":{"kind":"simplify","a":48,"b":30,"correct":"8 : 5"},"options":[{"en":"8 : 5","th":"8 : 5"},{"en":"24 : 15","th":"24 : 15"},{"en":"5 : 8","th":"5 : 8"},{"en":"48 : 30","th":"48 : 30"}]},{"id":"mt5-9","type":"mcq","lesson":2,"skill":"share-one","diff":2,"stem":{"en":"Lek and Mint share $1

/* Integer Elevator — Art Deco Skyscraper theme */
:root {
  --navy-900: #0c1322; --navy-800: #121c31; --navy-700: #1a2742; --navy-600: #243659; --navy-500: #2f4573;
  --brass: #d9b35c; --brass-2: #f1d78d; --brass-dk: #a07d2f; --brass-dim: rgba(217, 179, 92, .22);
  --ivory: #f7f0dd; --ivory-2: #ece2c6; --ivory-3: #ddd1b0; --ink: #16213a; --ink-2: #4a5472;
  --ok: #7cc48c; --ok-dk: #2f7a44; --ok-bg: #e4f2e5; --bad: #e8826a; --bad-dk: #a8412b; --bad-bg: #fbe6df;
  --earth: #2a2119; --earth-2: #35291e;
  --fh: 26px;
  --chamfer: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
  --chamfer-s: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
  --head: 'Josefin Sans', 'Futura', 'Avenir Next', 'Gill Sans', 'Trebuchet MS', sans-serif;
  --body: 'DM Sans', 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--body); font-size: 18px; line-height: 1.5; color: var(--ivory);
  background: var(--navy-900);
  background-image: linear-gradient(180deg, #152038 0, var(--navy-900) 520px);
}
button { font: inherit; }
b, strong { font-weight: 700; }
#app { max-width: 1120px; margin: 0 auto; padding: 0 16px 24px; }
.sr { position: absolute; left: -9999px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 10px 26px; border: 0; cursor: pointer; user-select: none; -webkit-user-select: none;
  font-family: var(--head); font-weight: 700; font-size: 19px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(180deg, var(--brass-2), var(--brass) 55%, #c69c3e);
  clip-path: var(--chamfer-s); transition: transform .12s ease, filter .12s ease; touch-action: manipulation;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { cursor: not-allowed; filter: grayscale(.6) brightness(.8); opacity: .55; }
.btn:focus-visible { outline: 3px solid var(--ivory); outline-offset: 2px; }
.btn.big { min-height: 66px; font-size: 22px; padding: 12px 36px; }
.btn.small { min-height: 44px; font-size: 15px; padding: 6px 16px; }
.btn.ghost { background: transparent; color: var(--brass-2); box-shadow: inset 0 0 0 2px var(--brass); }
.btn.ghost:hover { background: var(--brass-dim); }
.qcard .btn.ghost, .actions .btn.ghost { color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.qcard .btn.ghost:hover, .actions .btn.ghost:hover { background: rgba(22, 33, 58, .08); }
.btn.ctl { min-height: 52px; font-size: 17px; padding: 8px 14px; background: var(--navy-600); color: var(--brass-2); box-shadow: inset 0 0 0 2px var(--brass); flex: 1; }
.btn.ctl:hover { background: var(--navy-500); }
.btn.link, .link { background: none; border: 0; color: var(--brass); text-decoration: underline; cursor: pointer; font: inherit; font-size: 15px; padding: 6px; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.btn-row.wrap .btn { flex: 1 1 auto; }

/* ---------- top bar ---------- */
.topbar {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px 0 12px;
  border-bottom: 1px solid var(--brass); position: relative; margin-bottom: 14px;
}
.topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -5px; height: 1px; background: var(--brass-dim); }
.top-title { font-family: var(--head); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 16px; color: var(--brass-2); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top-right { font-family: var(--head); font-weight: 700; font-size: 22px; color: var(--ivory); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.timer { color: var(--brass-2); }
.dots { display: flex; gap: 6px; justify-content: center; margin: 0 0 14px; }
.dots i { width: 14px; height: 14px; background: var(--navy-600); box-shadow: inset 0 0 0 1px var(--brass-dim); transform: rotate(45deg) scale(.8); }
.dots i.cur { background: var(--brass); box-shadow: 0 0 0 2px var(--navy-900), 0 0 0 4px var(--brass); }
.dots i.ok { background: var(--ok); }
.dots i.bad { background: var(--bad); }
.dots.big i { width: 18px; height: 18px; }

/* ---------- layout ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: 'q stage' 'act stage'; gap: 20px 28px; align-items: start; }
.play > .qcard { grid-area: q; }
.play > .stage { grid-area: stage; }
.play > .actions { grid-area: act; }
.mode-line { grid-template-columns: 1fr; grid-template-areas: 'q' 'stage' 'act'; }
.mode-type { grid-template-columns: minmax(0, 1fr) 320px; }
.stage { min-width: 0; }

/* ---------- ivory card ---------- */
.qcard, .actions, .intro-card, .result-card {
  background: var(--ivory); color: var(--ink); padding: 26px 28px; clip-path: var(--chamfer);
}
.actions { padding: 18px 22px;
  box-shadow: inset 0 0 0 2px var(--brass), inset 0 0 0 7px var(--ivory), inset 0 0 0 8px var(--brass);
}
.q-kicker { font-family: var(--head); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 14px; color: var(--brass-dk); margin-bottom: 10px; }
.q-expr { font-family: var(--head); font-weight: 700; font-size: 54px; line-height: 1.1; letter-spacing: .02em; font-variant-numeric: tabular-nums; margin: 6px 0 10px; color: var(--ink); }
.q-expr .eq { color: var(--ink-2); margin: 0 4px; }
.unknown { display: inline-block; min-width: 1.2em; text-align: center; color: var(--brass-dk); border-bottom: 4px solid var(--brass); }
.unknown.shown { color: var(--ok-dk); border-color: var(--ok-dk); }
.q-text { font-size: 24px; line-height: 1.45; margin: 4px 0 12px; }
.q-hint { color: var(--ink-2); font-size: 17px; margin: 0; }
.q-body { font-size: 19px; margin: 8px 0 0; }
.q-body.small { font-size: 16px; color: var(--ink-2); }
.answer-row { font-size: 18px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.answer-row b { font-family: var(--head); font-size: 34px; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4em; }
.actions .btn-row { margin-top: 12px; }
.actions .btn.primary { flex: 1 1 auto; }

/* feedback */
.feedback { margin-top: 18px; padding: 16px 18px; border-left: 8px solid var(--ok); background: var(--ok-bg); }
.feedback.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.fb-head { font-family: var(--head); font-weight: 700; font-size: 24px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; color: var(--ok-dk); letter-spacing: .02em; }
.feedback.bad .fb-head { color: var(--bad-dk); }
.fb-head .mark { font-size: 26px; }
.fb-ans { font-size: 19px; font-family: var(--body); font-weight: 500; color: var(--ink); }
.fb-work { font-family: var(--head); font-weight: 700; font-size: 26px; margin: 10px 0 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.fb-explain { margin: 8px 0 0; font-size: 18px; }
.feedback .btn-row { margin-top: 14px; }

/* flip card: − (−4) → + 4 */
.flip { display: flex; align-items: center; gap: 14px; margin: 12px 0 6px; font-family: var(--head); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; perspective: 800px; }
.flip-card { position: relative; width: 150px; height: 64px; transform-style: preserve-3d; animation: flip 1.1s cubic-bezier(.5, 0, .2, 1) .7s forwards; }
.flip-card .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; clip-path: var(--chamfer-s); font-size: 30px; }
.face.front { background: var(--bad-bg); color: var(--bad-dk); box-shadow: inset 0 0 0 2px var(--bad); }
.face.back { background: var(--ok-bg); color: var(--ok-dk); box-shadow: inset 0 0 0 2px var(--ok); transform: rotateX(180deg); }
.flip-eq { color: var(--ink-2); }
@keyframes flip { to { transform: rotateX(180deg); } }

/* rules board */
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.rule { padding: 14px 16px; clip-path: var(--chamfer-s); font-family: var(--head); font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.rule b { font-size: 24px; }
.rule span { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
.rule.up { background: var(--ok-bg); color: var(--ok-dk); box-shadow: inset 0 0 0 2px var(--ok); }
.rule.down { background: var(--bad-bg); color: var(--bad-dk); box-shadow: inset 0 0 0 2px var(--bad); }
.rule.up span::before { content: '▲ '; }
.rule.down span::before { content: '▼ '; }

/* ---------- the building ---------- */
.bldg { width: 100%; max-width: 360px; margin: 0 auto; outline: none; user-select: none; -webkit-user-select: none; }
.bldg:focus-visible .shaft { box-shadow: 0 0 0 3px var(--ivory); }
.crown { display: flex; flex-direction: column; align-items: center; }
.crown i { display: block; height: 10px; background: linear-gradient(90deg, var(--brass-dk), var(--brass-2), var(--brass-dk)); }
.crown i:nth-child(1) { width: 4px; height: 26px; }
.crown i:nth-child(2) { width: 24%; }
.crown i:nth-child(3) { width: 52%; margin-top: 3px; }
.crown i:nth-child(4) { width: 78%; margin-top: 3px; }
.dial { position: relative; background: var(--navy-700); box-shadow: inset 0 0 0 2px var(--brass); padding: 10px 14px 8px; }
.dial-svg { display: block; width: 100%; height: auto; }
.dial .arc { fill: none; stroke: var(--brass); stroke-width: 3; }
.dial .tk { stroke: var(--ivory-3); stroke-width: 2; }
.dial .tk.big { stroke: var(--brass-2); stroke-width: 3; }
.dial .tl { fill: var(--brass-2); font-family: var(--head); font-weight: 700; font-size: 13px; }
.dial .needle line { stroke: var(--bad); stroke-width: 4; stroke-linecap: round; }
.dial .needle circle { fill: var(--brass-2); }
.dial .needle { transition: transform .35s ease; }
.readout { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--brass-dim); text-align: center; font-family: var(--head); line-height: 1; }
.readout small { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
.readout b { display: block; font-size: 30px; font-weight: 700; color: var(--ivory); font-variant-numeric: tabular-nums; }
.shaft { position: relative; background: var(--navy-800); box-shadow: inset 0 0 0 2px var(--brass); overflow: hidden; }
.floors { position: relative; }
.floor { position: relative; height: var(--fh); display: grid; grid-template-columns: 56px 1fr 64px; align-items: center; border-bottom: 1px solid rgba(217, 179, 92, .16); cursor: pointer; background: var(--navy-700); }
.floor:nth-child(even) { background: var(--navy-800); }
.floor.below { background: var(--earth-2); }
.floor.below:nth-child(even) { background: var(--earth); }
.floor.ground { border-top: 3px solid var(--brass); }
.fnum { font-family: var(--head); font-weight: 700; font-size: 15px; color: var(--brass-2); text-align: center; font-variant-numeric: tabular-nums; }
.fmark { height: 100%; border-left: 1px dashed rgba(247, 240, 221, .18); border-right: 1px dashed rgba(247, 240, 221, .18); }
.ftag { font-family: var(--head); font-weight: 600; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ivory-3); text-align: center; line-height: 1; }
.floor:hover .fnum { color: var(--ivory); }
.bldg.locked .floor { cursor: default; }
.floor.cur .fnum { color: var(--ivory); text-shadow: 0 0 10px var(--brass); }
.floor.start { box-shadow: inset 0 0 0 2px var(--brass); }
.floor.start .ftag { color: var(--brass-2); }
.floor.good { background: rgba(124, 196, 140, .32) !important; box-shadow: inset 0 0 0 2px var(--ok); }
.floor.good .ftag, .floor.good .fnum { color: #d8f5dd; }
.floor.wrong { background: rgba(232, 130, 106, .3) !important; box-shadow: inset 0 0 0 2px var(--bad); }
.floor.wrong .ftag { color: #ffd9cf; }
.car {
  position: absolute; top: 0; left: 62px; right: 70px; height: var(--fh); z-index: 3; cursor: grab; touch-action: none;
  transform: translateY(calc(var(--i, 10) * var(--fh))); transition: transform 0ms cubic-bezier(.4, 0, .2, 1);
  background: linear-gradient(180deg, var(--brass-2), var(--brass)); box-shadow: 0 2px 0 var(--brass-dk), 0 0 0 1px var(--navy-900);
  display: flex; padding: 3px; gap: 2px;
}
.car .door { flex: 1; background: var(--navy-800); box-shadow: inset 0 0 0 1px var(--brass-dk); }
.car::before { content: ''; position: absolute; left: 50%; bottom: 100%; width: 2px; height: 1200px; background: var(--brass-dk); margin-left: -1px; pointer-events: none; }
.bldg.moving .car { box-shadow: 0 2px 0 var(--brass-dk), 0 0 18px 2px rgba(241, 215, 141, .55); }
.bldg.dragging .car { cursor: grabbing; filter: brightness(1.1); }
.bldg.locked .car { cursor: default; }
.trip { position: absolute; right: 64px; width: 8px; z-index: 2; top: calc(var(--top) * var(--fh) + var(--fh) / 2); height: calc(var(--n) * var(--fh)); background: var(--brass-2); box-shadow: 0 0 10px rgba(241, 215, 141, .6); }
.trip::before { content: ''; position: absolute; left: 50%; border: 9px solid transparent; margin-left: -9px; }
.trip.up::before { top: -14px; border-bottom-color: var(--brass-2); }
.trip.down::before { bottom: -14px; border-top-color: var(--brass-2); }
.trip-label { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); z-index: 4; background: var(--ivory); color: var(--ink); font-family: var(--head); font-weight: 700; font-size: 15px; padding: 4px 8px; white-space: nowrap; clip-path: var(--chamfer-s); }
.bldg-ctl { display: flex; gap: 10px; margin-top: 10px; }
.bldg.locked .bldg-ctl { visibility: hidden; }

/* ---------- number line ---------- */
.nline { outline: none; }
.nline:focus-visible .nl-svg { outline: 3px solid var(--ivory); }
.nl-svg { display: block; width: 100%; height: auto; touch-action: none; background: var(--navy-700); box-shadow: inset 0 0 0 2px var(--brass); }
.nl-svg .axis { stroke: var(--ivory); stroke-width: 4; }
.nl-svg #nl-arrow path { fill: var(--ivory); }
.nl-svg .tick line { stroke: var(--brass-2); stroke-width: 3; }
.nl-svg .tick text { fill: var(--ivory-2); font-family: var(--head); font-weight: 700; font-size: 24px; }
.nl-svg .tick.neg text { fill: #f0c9b7; }
.nl-svg .tick.zero text { fill: var(--brass-2); }
.nl-svg .tick .hit { fill: transparent; cursor: pointer; }
.nl-svg .marker circle { fill: var(--brass); stroke: var(--navy-900); stroke-width: 3; }
.nl-svg .marker text { fill: var(--ink); font-family: var(--head); font-weight: 700; font-size: 22px; }
.nl-svg .marker.good circle { fill: var(--ok); }
.nl-svg .marker.wrong circle { fill: var(--bad); }
.nl-svg .start-mark circle { fill: none; stroke: var(--brass-2); stroke-width: 3; stroke-dasharray: 6 5; }
.nl-svg .start-mark text { fill: var(--brass-2); font-family: var(--head); font-weight: 700; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }
.nl-svg .ans-mark circle { fill: none; stroke: var(--ok); stroke-width: 4; }
.nl-svg .jump { fill: none; stroke: var(--brass-2); stroke-width: 6; stroke-linecap: round; marker-end: url(#nl-arrow); }
.nl-svg .jump-label { fill: var(--ivory); font-family: var(--head); font-weight: 700; font-size: 26px; }
.nline.locked .nl-svg { cursor: default; }
.nl-ctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.nl-val { text-align: center; font-family: var(--head); line-height: 1; min-width: 90px; }
.nl-val small { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
.nl-val b { display: block; font-size: 30px; color: var(--ivory); margin-top: 3px; font-variant-numeric: tabular-nums; }
.nline.locked .nl-ctl .btn { visibility: hidden; }

/* ---------- keypad ---------- */
.pad { max-width: 320px; margin: 0 auto; }
.pad-display { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--navy-700); box-shadow: inset 0 0 0 2px var(--brass); padding: 10px 14px; font-family: var(--head); font-weight: 700; font-size: 40px; color: var(--ivory); min-height: 76px; }
.pad-pre, .pad-post { color: var(--brass-2); font-size: 26px; }
.pad-input { width: 4ch; background: transparent; border: 0; border-bottom: 3px solid var(--brass); color: var(--ivory); font: inherit; text-align: center; outline: none; padding: 0; min-width: 2.5ch; }
.pad-input::placeholder { color: var(--brass-dk); }
.pad-input:focus { border-bottom-color: var(--ivory); }
.pad-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.btn.key { min-height: 62px; font-size: 26px; padding: 0; background: var(--navy-600); color: var(--ivory); box-shadow: inset 0 0 0 2px var(--brass-dim); letter-spacing: 0; }
.btn.key:hover { background: var(--navy-500); }
.btn.key.sign { font-size: 20px; color: var(--brass-2); box-shadow: inset 0 0 0 2px var(--brass); }
.btn.key.del { font-size: 24px; }
.pad.locked .pad-keys { visibility: hidden; }
.pad.ok .pad-display { box-shadow: inset 0 0 0 3px var(--ok); }
.pad.bad .pad-display { box-shadow: inset 0 0 0 3px var(--bad); }
.pad.bad .pad-input { text-decoration: line-through; color: #f0c9b7; }
.pad-result { margin-top: 12px; text-align: center; font-family: var(--head); line-height: 1.1; }
.pad-result small { display: block; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
.pad-result b { display: block; font-size: 36px; color: var(--ok); }
.pad-result.bad b { color: var(--bad); }

/* ---------- intro / results ---------- */
.intro, .results { display: grid; place-items: start center; }
.intro-card, .result-card { width: 100%; max-width: 720px; }
.intro-title { font-family: var(--head); font-weight: 700; font-size: 40px; line-height: 1.1; letter-spacing: .02em; margin: 0 0 8px; text-transform: uppercase; }
.intro-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--brass); color: var(--ink-2); font-size: 16px; }
.test-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.test-facts span { background: var(--ivory-2); padding: 12px; text-align: center; clip-path: var(--chamfer-s); font-size: 15px; }
.test-facts b { display: block; font-family: var(--head); font-size: 26px; }
.score { font-family: var(--head); font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.score b { font-size: 96px; color: var(--ink); }
.score span { font-size: 36px; color: var(--ink-2); }
.score-sub { font-family: var(--head); font-weight: 600; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass-dk); margin-top: 2px; }
.score-sub em { font-style: normal; color: var(--ok-dk); }
.verdict { font-size: 22px; margin: 10px 0 14px; }
.breakdown { margin-top: 18px; border-top: 1px solid var(--brass); padding-top: 12px; }
.bd-head { font-family: var(--head); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--brass-dk); margin: 8px 0 8px; }
.bd-row { display: grid; grid-template-columns: 1fr 160px 56px; align-items: center; gap: 12px; padding: 6px 0; font-size: 17px; }
.bd-row i { height: 12px; background: var(--ivory-3); display: block; }
.bd-row i b { display: block; height: 100%; background: var(--ok-dk); }
.bd-row.weak i b { background: var(--bad); }
.bd-row span:last-child { text-align: right; font-family: var(--head); font-weight: 700; font-variant-numeric: tabular-nums; }
.review { display: flex; flex-wrap: wrap; gap: 10px; }
.review .btn { text-transform: none; letter-spacing: .02em; font-family: var(--body); font-weight: 600; }
.missed { font-family: var(--head); font-weight: 700; font-size: 22px; padding: 6px 0; border-bottom: 1px dashed var(--ivory-3); font-variant-numeric: tabular-nums; }

/* ---------- home ---------- */
.home { padding-top: 10px; }
.hero { position: relative; text-align: center; padding: 56px 16px 36px; overflow: hidden; }
.sunburst { position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-conic-gradient(from -90deg at 50% 118%, rgba(217, 179, 92, .11) 0 2deg, transparent 2deg 8deg);
  -webkit-mask-image: radial-gradient(ellipse at 50% 110%, #000 20%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 110%, #000 20%, transparent 72%); }
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; z-index: 0; pointer-events: none; opacity: .9; }
.skyline i { display: block; width: 44px; background: var(--navy-600); box-shadow: inset 0 0 0 1px var(--brass-dim); clip-path: polygon(0 100%, 0 30%, 25% 30%, 25% 12%, 50% 12%, 50% 0, 75% 0, 75% 12%, 100% 12%, 100% 100%); }
.skyline i:nth-child(1) { height: 40px; } .skyline i:nth-child(2) { height: 70px; } .skyline i:nth-child(3) { height: 54px; }
.skyline i:nth-child(4) { height: 110px; background: var(--navy-500); } .skyline i:nth-child(5) { height: 62px; } .skyline i:nth-child(6) { height: 84px; } .skyline i:nth-child(7) { height: 46px; }
.hero > *:not(.sunburst):not(.skyline) { position: relative; z-index: 1; }
.wordmark { font-family: var(--head); font-weight: 600; letter-spacing: .32em; text-transform: uppercase; font-size: 14px; color: var(--brass); }
.wordmark::before, .wordmark::after { content: ''; display: inline-block; width: 40px; height: 1px; background: var(--brass); vertical-align: middle; margin: 0 14px; }
.title { font-family: var(--head); text-transform: uppercase; line-height: .95; margin: 18px 0 10px; display: flex; flex-direction: column; align-items: center; }
.title span:first-child { font-weight: 600; font-size: clamp(26px, 5vw, 44px); letter-spacing: .34em; color: var(--ivory-2); padding-left: .34em; }
.title span:last-child { font-weight: 700; font-size: clamp(60px, 12vw, 128px); letter-spacing: .06em; padding-left: .06em; color: var(--brass-2);
  background: linear-gradient(180deg, var(--brass-2) 0, var(--brass) 60%, var(--brass-dk)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.tagline { font-family: var(--head); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; font-size: 16px; color: var(--ivory); margin: 0; }
.tagline::before, .tagline::after { content: '◆'; color: var(--brass); font-size: 10px; vertical-align: middle; margin: 0 12px; }
.lede { max-width: 620px; margin: 16px auto 24px; color: var(--ivory-2); font-size: 19px; }
.directory { max-width: 820px; margin: 10px auto 0; background: var(--navy-800); box-shadow: inset 0 0 0 2px var(--brass), inset 0 0 0 6px var(--navy-800), inset 0 0 0 7px var(--brass-dim); padding: 22px 24px; clip-path: var(--chamfer); }
.dir-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; font-family: var(--head); font-weight: 700; letter-spacing: .24em; text-transform: uppercase; font-size: 15px; color: var(--brass-2); padding: 4px 6px 14px; border-bottom: 1px solid var(--brass); }
.dir-prog { height: 8px; background: var(--navy-600); box-shadow: inset 0 0 0 1px var(--brass-dim); }
.dir-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass-dk), var(--brass-2)); transition: width .4s ease; }
.dir-row { display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px dashed var(--brass-dim); padding: 14px 6px; cursor: pointer; color: var(--ivory); transition: background .12s ease; }
.dir-row:hover, .dir-row:focus-visible { background: rgba(217, 179, 92, .1); outline: none; }
.dir-row:last-of-type { border-bottom: 0; }
.dir-n { font-family: var(--head); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: var(--brass); }
.dir-t { display: flex; flex-direction: column; min-width: 0; }

<body>
<div id="app"><noscript>Integer Elevator needs JavaScript turned on.</noscript></div>
<script>
/* Integer Elevator — question generators.
   Every answer is computed by code, never hand-typed. Elevator / number-line
   questions keep every start floor and every answer inside the building
   (−10 … +10). Numbers-only and word problems may go a little further. */
(function (root) {
  'use strict';
  const MIN = -10, MAX = 10;          // floors in the building
  const NUM_MIN = -20, NUM_MAX = 20;  // numbers-only mode
  const MINUS = '−';

  // --- tiny seeded RNG so a run can be reproduced in tests ---------------
  function mulberry32(seed) {
    let t = seed >>> 0;
    return function () {
      t = (t + 0x6D2B79F5) >>> 0;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rangeInt = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  function shuffle(rng, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // --- formatting ---------------------------------------------------------
  const fmt = (n) => (n < 0 ? MINUS + (-n) : String(n));          // −3, 0, 5
  const signed = (n) => (n < 0 ? MINUS + (-n) : '+' + n);          // −3, +5
  const term = (n) => (n < 0 ? '(' + fmt(n) + ')' : fmt(n));       // (−3), 5
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const floorWord = (n) => (n === 0 ? 'floor 0 (Ground)' : 'floor ' + fmt(n));
  const money = (n) => (n < 0 ? MINUS + '$' + (-n) : '$' + n);

  // --- single-operation questions ----------------------------------------
  // type: add (a + b, b may be negative), sub (a − b, b > 0), subneg (a − (−k))
  function expression(op, a, b) {
    return fmt(a) + ' ' + (op === '+' ? '+' : MINUS) + ' ' + term(b);
  }
  function explain(type, a, b, ans) {
    if (type === 'add' && b > 0)
      return `Start at ${floorWord(a)}. Adding ${b} means going UP ${plural(b, 'floor')}. You arrive at ${fmt(ans)}.`;
    if (type === 'add')
      return `Start at ${floorWord(a)}. Adding ${term(b)} means going DOWN ${plural(-b, 'floor')}. You arrive at ${fmt(ans)}.`;
    if (type === 'sub')
      return `Start at ${floorWord(a)}. Subtracting ${b} means going DOWN ${plural(b, 'floor')}. You arrive at ${fmt(ans)}.`;
    // subneg: a − (−k) = a + k
    return `Subtracting a negative is the same as adding: ${fmt(a)} ${MINUS} (${fmt(b)}) = ${fmt(a)} + ${-b}. Start at ${floorWord(a)} and go UP ${plural(-b, 'floor')}. You arrive at ${fmt(ans)}.`;
  }
  function make(type, a, b) {
    const op = type === 'add' ? '+' : '-';
    const ans = op === '+' ? a + b : a - b;
    const rewrite = type === 'subneg' ? `${fmt(a)} + ${-b}` : null;
    return { type, op, a, b, start: a, answer: ans, expr: expression(op, a, b), rewrite, explain: explain(type, a, b, ans) };
  }
  // keeps start and answer inside lo..hi
  function genAdd(rng, lo, hi, big) {
    for (;;) {
      const a = rangeInt(rng, lo + 1, hi - 1);
      const b = rangeInt(rng, big ? -12 : -9, big ? 12 : 9);
      if (b === 0 || (Math.abs(b) === 1 && rng() < 0.7)) continue;
      const q = make('add', a, b);
      if (q.answer < lo || q.answer > hi) continue;
      return q;
    }
  }
  function genSub(rng, lo, hi, big) {
    for (;;) {
      const a = rangeInt(rng, lo + 2, hi);
      const b = rangeInt(rng, 2, big ? 12 : 9);
      const q = make('sub', a, b);
      if (q.answer < lo || q.answer > hi) continue;
      return q;
    }
  }
  function genSubNeg(rng, lo, hi, big) {
    for (;;) {
      const a = rangeInt(rng, lo, hi - 2);
      const b = -rangeInt(rng, 2, big ? 12 : 9);
      const q = make('subneg', a, b);
      if (q.answer < lo || q.answer > hi) continue;
      return q;
    }
  }
  function genMixed(rng, lo, hi, big) {
    const r = rng();
    return r < 0.4 ? genAdd(rng, lo, hi, big) : r < 0.7 ? genSub(rng, lo, hi, big) : genSubNeg(rng, lo, hi, big);
  }

  // --- word problems --------------------------------------------------------
  // Each template returns {text, answer, unit, work, explain}; `work` is the
  // one-line calculation shown with the answer.
  const WORD = [
    { kind: 'temp', make(rng) {
      const a = rangeInt(rng, -9, -2), b = rangeInt(rng, 3, 12), ans = a + b;
      return { text: `At 6 a.m. the temperature in Oslo was ${fmt(a)} °C. By noon it had risen by ${b} °C. What was the temperature at noon?`,
        answer: ans, unit: '°C', work: `${fmt(a)} + ${b} = ${fmt(ans)}`, explain: `A rise means add. Start at ${fmt(a)} and go up ${b}: ${fmt(a)} + ${b} = ${fmt(ans)} °C.` }; } },
    { kind: 'temp', make(rng) {
      const a = rangeInt(rng, -3, 6), b = rangeInt(rng, 4, 12), ans = a - b;
      return { text: `At sunset it was ${fmt(a)} °C in Harbin. Overnight the temperature dropped ${b} °C. What was the temperature by morning?`,
        answer: ans, unit: '°C', work: `${fmt(a)} ${MINUS} ${b} = ${fmt(ans)}`, explain: `A drop means subtract. Start at ${fmt(a)} and go down ${b}: ${fmt(a)} ${MINUS} ${b} = ${fmt(ans)} °C.` }; } },
    { kind: 'temp', make(rng) {
      const a = rangeInt(rng, -9, -1), b = rangeInt(rng, 2, 12), ans = b - a;
      return { text: `Yesterday's low was ${fmt(a)} °C. Today's high is ${b} °C. How many degrees warmer is today's high than yesterday's low?`,
        answer: ans, unit: '°C', work: `${b} ${MINUS} (${fmt(a)}) = ${b} + ${-a} = ${ans}`, explain: `Difference = high ${MINUS} low = ${b} ${MINUS} (${fmt(a)}). Subtracting a negative is adding: ${b} + ${-a} = ${ans} °C.` }; } },
    { kind: 'temp', make(rng) {
      const a = rangeInt(rng, -18, -10), b = rangeInt(rng, 18, 25), ans = b - a;
      return { text: `A freezer is kept at ${fmt(a)} °C. The kitchen is ${b} °C. What is the difference between the two temperatures?`,
        answer: ans, unit: '°C', work: `${b} ${MINUS} (${fmt(a)}) = ${b} + ${-a} = ${ans}`, explain: `From ${fmt(a)} up to 0 is ${-a} degrees, then up to ${b} is ${b} more: ${-a} + ${b} = ${ans} °C.` }; } },
    { kind: 'sea', make(rng) {
      const a = rangeInt(rng, -10, -4), b = rangeInt(rng, 2, -a - 1), ans = a + b;
      return { text: `A diver is at ${fmt(a)} m, that is ${-a} m below sea level. She swims up ${b} m. What is her position now?`,
        answer: ans, unit: 'm', work: `${fmt(a)} + ${b} = ${fmt(ans)}`, explain: `Going up means add: ${fmt(a)} + ${b} = ${fmt(ans)} m. She is still ${-ans} m below the surface.` }; } },
    { kind: 'sea', make(rng) {
      const a = rangeInt(rng, -8, -1), b = rangeInt(rng, 2, 10), ans = a - b;
      return { text: `A submarine is at ${fmt(a)} m. It dives ${b} m deeper. What is its position now?`,
        answer: ans, unit: 'm', work: `${fmt(a)} ${MINUS} ${b} = ${fmt(ans)}`, explain: `Deeper means subtract: ${fmt(a)} ${MINUS} ${b} = ${fmt(ans)} m.` }; } },
    { kind: 'sea', make(rng) {
      const a = rangeInt(rng, -9, -2), b = rangeInt(rng, 3, 12), ans = b - a;
      return { text: `A seagull flies ${b} m above sea level. Directly below it, a fish swims at ${fmt(a)} m. How far apart are the seagull and the fish?`,
        answer: ans, unit: 'm', work: `${b} ${MINUS} (${fmt(a)}) = ${b} + ${-a} = ${ans}`, explain: `Distance = higher ${MINUS} lower = ${b} ${MINUS} (${fmt(a)}) = ${b} + ${-a} = ${ans} m.` }; } },
    { kind: 'sea', make(rng) {
      const a = rangeInt(rng, -9, -2), b = rangeInt(rng, 5, 15), ans = a + b;
      return { text: `A hiker starts in a valley at ${fmt(a)} m (below sea level) and climbs ${b} m. What is her height above sea level now?`,
        answer: ans, unit: 'm', work: `${fmt(a)} + ${b} = ${fmt(ans)}`, explain: `Climbing means add: ${fmt(a)} + ${b} = ${fmt(ans)} m.` }; } },
    { kind: 'money', make(rng) {
      const a = -rangeInt(rng, 2, 9), b = rangeInt(rng, 3, 15), ans = a + b;
      return { text: `Mia's bank balance is ${money(a)}, so she is overdrawn. She deposits $${b}. What is her balance now?`,
        answer: ans, unit: '$', work: `${fmt(a)} + ${b} = ${fmt(ans)}`, explain: `A deposit means add: ${fmt(a)} + ${b} = ${fmt(ans)}, so her balance is ${money(ans)}.` }; } },
    { kind: 'money', make(rng) {
      const a = rangeInt(rng, 2, 9), b = rangeInt(rng, a + 1, 15), ans = a - b;
      return { text: `Leo has $${a} in his account. He withdraws $${b}. What is his balance now?`,
        answer: ans, unit: '$', work: `${a} ${MINUS} ${b} = ${fmt(ans)}`, explain: `A withdrawal means subtract: ${a} ${MINUS} ${b} = ${fmt(ans)}. He is overdrawn by $${-ans}.` }; } },
    { kind: 'money', make(rng) {
      const a = -rangeInt(rng, 1, 8), b = rangeInt(rng, 2, 10), ans = a - b;
      return { text: `Ava's balance was ${money(a)}. She withdrew another $${b}. What is her balance now?`,
        answer: ans, unit: '$', work: `${fmt(a)} ${MINUS} ${b} = ${fmt(ans)}`, explain: `Another withdrawal means subtract again: ${fmt(a)} ${MINUS} ${b} = ${fmt(ans)}, so she owes $${-ans}.` }; } },
    { kind: 'lift', make(rng) {
      const a = -rangeInt(rng, 1, 6), b = rangeInt(rng, 2, 12), ans = a + b;
      return { text: `An elevator is parked at basement floor ${fmt(a)}. It goes up ${b} floors. Which floor does it reach?`,
        answer: ans, unit: 'floor', work: `${fmt(a)} + ${b} = ${fmt(ans)}`, explain: `Up means add: ${fmt(a)} + ${b} = ${fmt(ans)}.` }; } },
  ];
  function genWord(rng, template) {
    const w = template.make(rng);
    return Object.assign({ type: 'word', kind: template.kind, mode: 'type', topic: 'word' }, w);
  }

  // --- sets ------------------------------------------------------------------
  // topic keys drive the dashboard
  const TOPICS = {
    lesson: { label: 'Lesson checkpoint', short: 'Lesson' },
    add: { label: 'Practice 1 · Adding with the elevator', short: 'Adding' },
    sub: { label: 'Practice 2 · Subtracting with the elevator', short: 'Subtracting' },
    subneg: { label: 'Practice 3 · Subtracting a negative', short: 'Subtracting a negative' },
    line: { label: 'Practice 4 · The number line', short: 'Number line' },
    num: { label: 'Practice 5 · Numbers only', short: 'Numbers only' },
    word: { label: 'Word problems', short: 'Word problems' },
    test: { label: 'Mixed test', short: 'Test' },
  };

  function tag(q, topic, mode) { q.topic = topic; q.mode = mode; return q; }
  function uniqueSet(rng, n, maker, seen) {
    const out = []; seen = seen || new Set();
    let guard = 0;
    while (out.length < n && guard++ < 500) {
      const q = maker();
      const key = q.expr || q.text;
      if (seen.has(key)) continue;
      seen.add(key); out.push(q);
    }
    return out;
  }

  const SETS = {
    lesson(rng) {
      // one of each idea, in teaching order
      const qs = [
        genAdd(rng, MIN, MAX), genAdd(rng, MIN, MAX), genSub(rng, MIN, MAX), genSubNeg(rng, MIN, MAX), genMixed(rng, MIN, MAX),
      ];
      // make sure q1 adds a positive and q2 adds a negative
      while (qs[0].b < 0) qs[0] = genAdd(rng, MIN, MAX);
      while (qs[1].b > 0) qs[1] = genAdd(rng, MIN, MAX);
      return qs.map((q) => tag(q, 'lesson', 'elevator'));
    },
    add(rng) {
      // 3 adding a positive + 3 adding a negative, shuffled
      const pos = uniqueSet(rng, 3, () => { let q; do q = genAdd(rng, MIN, MAX); while (q.b < 0); return q; });
      const neg = uniqueSet(rng, 3, () => { let q; do q = genAdd(rng, MIN, MAX); while (q.b > 0); return q; });
      return shuffle(rng, pos.concat(neg)).map((q) => tag(q, 'add', 'elevator'));
    },
    sub(rng) { return uniqueSet(rng, 6, () => genSub(rng, MIN, MAX)).map((q) => tag(q, 'sub', 'elevator')); },
    subneg(rng) { return uniqueSet(rng, 6, () => genSubNeg(rng, MIN, MAX)).map((q) => tag(q, 'subneg', 'elevator')); },
    line(rng) { return uniqueSet(rng, 6, () => genMixed(rng, MIN, MAX)).map((q) => tag(q, 'line', 'line')); },
    num(rng) { return uniqueSet(rng, 6, () => genMixed(rng, NUM_MIN, NUM_MAX, true)).map((q) => tag(q, 'num', 'type')); },
    word(rng) {
      // two temperature, two sea-level, two money — new numbers every time
      const byKind = (k) => shuffle(rng, WORD.filter((t) => t.kind === k)).slice(0, 2);
      const picked = shuffle(rng, byKind('temp').concat(byKind('sea'), byKind('money')));
      return picked.map((t) => genWord(rng, t));
    },
    test(rng) {
      const qs = [], seen = new Set(); // one `seen` across groups: no repeated expression anywhere in the test
      qs.push(...uniqueSet(rng, 2, () => genAdd(rng, MIN, MAX), seen).map((q) => tag(q, 'add', 'elevator')));
      qs.push(...uniqueSet(rng, 2, () => genSub(rng, MIN, MAX), seen).map((q) => tag(q, 'sub', 'elevator')));
      qs.push(...uniqueSet(rng, 2, () => genSubNeg(rng, MIN, MAX), seen).map((q) => tag(q, 'subneg', 'elevator')));
      qs.push(...uniqueSet(rng, 2, () => genMixed(rng, MIN, MAX), seen).map((q) => tag(q, 'line', 'line')));
      qs.push(...uniqueSet(rng, 4, () => genMixed(rng, NUM_MIN, NUM_MAX, true), seen).map((q) => tag(q, 'num', 'type')));
      qs.push(...shuffle(rng, WORD).slice(0, 3).map((t) => genWord(rng, t)));
      return qs; // keeps the easy→hard order; question text differs every run
    },
  };
  const SET_SIZE = { lesson: 5, add: 6, sub: 6, subneg: 6, line: 6, num: 6, word: 6, test: 15 };

  function buildSet(key, seed) {
    const rng = mulberry32(seed == null ? (Math.random() * 2 ** 32) >>> 0 : seed);
    return SETS[key](rng).map((q, i) => Object.assign({ n: i + 1 }, q));
  }

  // --- answer parsing ----------------------------------------------------------
  // accepts "-", "−" (U+2212), "–" (en dash) and stray "+"; returns null if not an integer
  function parseAnswer(raw) {
    if (raw == null) return null;
    let s = String(raw).trim().replace(/[−–—]/g, '-').replace(/[$\s°C,m]/g, '').replace(/^\+/, '');
    if (!/^-?\d{1,3}$/.test(s)) return null;
    return parseInt(s, 10);
  }

  root.IE_DATA = { MIN, MAX, NUM_MIN, NUM_MAX, MINUS, fmt, signed, term, money, mulberry32, buildSet, SET_SIZE, TOPICS, WORD, parseAnswer };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Integer Elevator — app logic (vanilla JS, no dependencies). */
(function () {
  'use strict';
  const D = window.IE_DATA;
  const { fmt, signed, term, MINUS } = D;
  const app = document.getElementById('app');
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STORE_KEY = 'bright-engmath-integer-elevator-v1';
  const h = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------------------------------------------------------------- storage
  let store = (function () {
    try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.best) return s; } catch (e) { /* ignore */ }
    return { best: {} };
  })();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } }
  function best(topic) { return store.best[topic] || null; }
  function recordBest(topic, score, total, time) {
    const cur = best(topic);
    const better = !cur || score > cur.score || (score === cur.score && time != null && time < cur.time);
    if (better) { store.best[topic] = { score, total, time: time == null ? undefined : time }; save(); }
    return better;
  }

  // ----------------------------------------------------------------- levels
  const LEVELS = [
    { key: 'lesson', n: 'Lesson', title: 'The Integer Building', sub: 'Floors, basements and four elevator rules', mode: 'elevator' },
    { key: 'add', n: 'Practice 1', title: 'Adding with the Elevator', sub: 'Add a positive: go up. Add a negative: go down.', mode: 'elevator',
      intro: 'The elevator starts on the first number. <b>Adding a positive</b> number sends it <b>up</b>. <b>Adding a negative</b> number sends it <b>down</b>. Drag the car, tap a floor, or use the Up / Down buttons to park on the answer, then press <b>Check answer</b>.' },
    { key: 'sub', n: 'Practice 2', title: 'Subtracting with the Elevator', sub: 'Subtract a positive: go down.', mode: 'elevator',
      intro: '<b>Subtracting a positive</b> number always sends the elevator <b>down</b>, even when you start in the basement. 2 ' + MINUS + ' 7 means start at 2 and go down 7 floors.' },
    { key: 'subneg', n: 'Practice 3', title: 'Subtracting a Negative', sub: 'Taking away a trip down is a trip up.', mode: 'elevator',
      intro: 'A negative number is a trip <b>down</b>. <b>Subtracting</b> that trip means taking it away, so the elevator goes <b>up</b> instead. That is why 3 ' + MINUS + ' (' + MINUS + '4) is the same as 3 + 4.', visual: true },
    { key: 'line', n: 'Practice 4', title: 'The Number Line', sub: 'The building turned on its side.', mode: 'line',
      intro: 'Same rules, new picture. The number line is the building lying down: <b>right</b> is up, <b>left</b> is down. Drag the marker to the answer and press <b>Check answer</b>.' },
    { key: 'num', n: 'Practice 5', title: 'Numbers Only', sub: 'No building, no line. Just the rules.', mode: 'type',
      intro: 'Now the numbers go a little past the building (' + MINUS + '20 to 20). Picture the elevator in your head: add a positive or subtract a negative to go up; add a negative or subtract a positive to go down. Type the answer. You can type the minus as <b>-</b> or <b>' + MINUS + '</b>.' },
    { key: 'word', n: 'Word Problems', title: 'Temperature, Sea Level & Money', sub: 'Real situations with negatives', mode: 'type',
      intro: 'Each story hides an integer sum. Decide whether the change goes <b>up</b> or <b>down</b>, write the calculation, and type the answer with its sign.' },
    { key: 'test', n: 'Test', title: 'Mixed Test', sub: '15 questions · timed · new questions every time', mode: 'mixed',
      intro: 'Fifteen questions from every level, with the clock running. You still see the answer after each question. At the end you get a score, the topics to review, and a button for a brand-new test.' },
  ];
  const LEVEL = Object.fromEntries(LEVELS.map((l) => [l.key, l]));

  // -------------------------------------------------------------- routing
  const state = { screen: 'home', set: null, timer: null };
  let active = null; // component currently on stage (for cleanup)
  function go(screen, arg) {
    stopTimer();
    if (active && active.destroy) active.destroy();
    active = null;
    state.screen = screen;
    window.scrollTo(0, 0);
    if (screen === 'home') renderHome();
    else if (screen === 'lesson') renderLesson(arg || 0);
    else if (screen === 'intro') renderIntro(arg);
    else if (screen === 'play') startSet(arg);
    else if (screen === 'results') renderResults();
  }

  const FOOT = `<footer class="foot"><span class="brand-mark"><i></i>Bright EngMath</span><span>Integer Elevator · Adding &amp; Subtracting Integers · Grades 6–7</span></footer>`;

  // ------------------------------------------------------------------ home
  function renderHome() {
    const totals = LEVELS.map((l) => D.SET_SIZE[l.key]);
    const sumTotal = totals.reduce((a, b) => a + b, 0);
    const sumBest = LEVELS.reduce((s, l) => s + (best(l.key) ? best(l.key).score : 0), 0);
    const pct = Math.round((sumBest / sumTotal) * 100);
    const rows = LEVELS.map((l, i) => {
      const b = best(l.key);
      const full = b && b.score === b.total;
      const bestTxt = b ? `${b.score}/${b.total}${l.key === 'test' && b.time != null ? ' · ' + mmss(b.time) : ''}` : '—';
      return `<button class="dir-row${full ? ' done' : ''}" data-go="${l.key}">
        <span class="dir-n">${h(l.n)}</span>
        <span class="dir-t"><b>${h(l.title)}</b><small>${h(l.sub)}</small></span>
        <span class="dir-best"><small>Best</small><b>${bestTxt}</b></span>
      </button>`;
    }).join('');
    app.innerHTML = `
      <div class="home">
        <div class="hero">
          <div class="sunburst"></div>
          <div class="skyline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="wordmark">Bright EngMath</div>
          <h1 class="title"><span>Integer</span><span>Elevator</span></h1>
          <p class="tagline">Adding &amp; Subtracting Integers · Grades 6–7</p>
          <p class="lede">Ride between floor +10 and basement ${MINUS}10. Every sum is a trip: up for adding a positive, down for subtracting one, and up again when you subtract a negative.</p>
          <button class="btn primary big" data-go="lesson">Start the lesson</button>
        </div>
        <section class="directory">
          <div class="dir-head"><span>Directory</span><span class="dir-prog"><i style="width:${pct}%"></i></span><span>${pct}% complete</span></div>
          ${rows}
          <div class="dir-foot"><span>Best scores are saved on this device.</span><button class="link" id="reset">Reset progress</button></div>
        </section>
        ${FOOT}
      </div>`;
    app.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.go;
      if (k === 'lesson') go('lesson', 0); else go('intro', k);
    }));
    app.querySelector('#reset').addEventListener('click', () => {
      if (confirm('Clear all best scores on this device?')) { store = { best: {} }; save(); renderHome(); }
    });
  }

  // ---------------------------------------------------------------- lesson
  const LESSON_STEPS = [
    { title: 'Welcome to the Integer Building', body: `This building has <b>21 floors</b>. Floor <b>0</b> is the ground floor. Above it the floors are <b>positive</b> (+1 to +10). Below it the basement floors are <b>negative</b> (${MINUS}1 to ${MINUS}10).<br><br><b>Try it:</b> tap any floor, drag the car, or use the Up and Down buttons. Watch the dial.`, free: true },
    { title: 'Rule 1 · Adding a positive = going up', expr: ['add', -3, 5], body: `${MINUS}3 + 5 means: start on floor ${MINUS}3, then ride <b>up 5 floors</b>. Press <b>Ride</b> to watch.` },
    { title: 'Rule 2 · Adding a negative = going down', expr: ['add', 4, -6], body: `4 + (${MINUS}6) means: start on floor 4, then ride <b>down 6 floors</b>. Adding a negative number is a trip down.` },
    { title: 'Rule 3 · Subtracting a positive = going down', expr: ['sub', 2, 7], body: `2 ${MINUS} 7 means: start on floor 2, then ride <b>down 7 floors</b>. You pass the ground floor and land in the basement.` },
    { title: 'Rule 4 · Subtracting a negative = going up', expr: ['subneg', 3, -4], body: `3 ${MINUS} (${MINUS}4). The ${MINUS}4 is a trip <b>down 4</b>. Subtracting it means <b>taking that trip away</b>, so the car goes <b>up 4</b> instead. That is why 3 ${MINUS} (${MINUS}4) = 3 + 4.`, flip: true },
    { title: 'The four rules', rules: true, body: 'Keep these in your head for every question in the building, on the number line, and with plain numbers.' },
  ];
  function renderLesson(step) {
    const s = LESSON_STEPS[step];
    const last = step === LESSON_STEPS.length - 1;
    app.innerHTML = `
      ${topbar('Lesson · The Integer Building', `Step ${step + 1} of ${LESSON_STEPS.length}`)}
      <main class="play mode-elevator">
        <section class="qcard lesson-card">
          <div class="q-kicker">${h(s.title)}</div>
          ${s.expr ? `<div class="q-expr" id="lexpr"></div>` : ''}
          ${s.flip ? flipHtml(3, -4) : ''}
          <p class="q-body">${s.body}</p>
          ${s.rules ? rulesHtml() : ''}
        </section>
        <aside class="stage" id="stage"></aside>
        <section class="actions">
          <div class="btn-row">
            ${step > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}
            ${s.expr ? '<button class="btn primary" id="ride">Ride</button>' : ''}
            ${last ? '<button class="btn primary" id="next">Start the checkpoint</button>' : `<button class="btn ${s.expr ? 'ghost' : 'primary'}" id="next">Next</button>`}
          </div>
        </section>
      </main>${FOOT}`;
    const stage = app.querySelector('#stage');
    const ev = Elevator({ interactive: true });
    stage.appendChild(ev.el);
    active = ev;
    let q = null;
    if (s.expr) {
      const [type, a, b] = s.expr;
      q = { type, a, b, start: a, answer: type === 'add' ? a + b : a - b, expr: fmtExpr(type, a, b) };
      app.querySelector('#lexpr').innerHTML = `${h(q.expr)} <span class="eq">=</span> <span class="unknown" id="lans">?</span>`;
      ev.setFloor(a, { animate: false });
      ev.markStart(a);
      ev.setInteractive(false);
      app.querySelector('#ride').addEventListener('click', () => {
        const btn = app.querySelector('#ride');
        btn.disabled = true;
        ev.setFloor(a, { animate: false });
        ev.showTrip(a, q.answer);
        ev.setFloor(q.answer, { animate: true, onDone: () => {
          app.querySelector('#lans').textContent = fmt(q.answer);
          app.querySelector('#lans').classList.add('shown');
          ev.markResult(q.answer, q.answer);
          btn.disabled = false; btn.textContent = 'Ride again';
          app.querySelector('#next').classList.replace('ghost', 'primary');
        } });
      });
    } else {
      ev.setFloor(0, { animate: false });
      if (s.rules) ev.setInteractive(false);
    }
    app.querySelector('#next').addEventListener('click', () => { if (last) go('play', 'lesson'); else go('lesson', step + 1); });
    const back = app.querySelector('#back'); if (back) back.addEventListener('click', () => go('lesson', step - 1));
    bindTop();
  }
  function fmtExpr(type, a, b) { return fmt(a) + ' ' + (type === 'add' ? '+' : MINUS) + ' ' + term(b); }
  function flipHtml(a, b) {
    return `<div class="flip" aria-label="${h(fmt(a))} minus negative ${-b} becomes ${h(fmt(a))} plus ${-b}">
      <span class="flip-a">${h(fmt(a))}</span>
      <span class="flip-card"><span class="face front">${MINUS} (${MINUS}${-b})</span><span class="face back">+ ${-b}</span></span>
      <span class="flip-eq">= ${h(fmt(a - b))}</span>
    </div>`;
  }
  function rulesHtml() {
    return `<div class="rules">
      <div class="rule up"><b>+ positive</b><span>go up</span></div>
      <div class="rule down"><b>+ negative</b><span>go down</span></div>
      <div class="rule down"><b>${MINUS} positive</b><span>go down</span></div>
      <div class="rule up"><b>${MINUS} negative</b><span>go up</span></div>
    </div>`;
  }

  // ----------------------------------------------------------------- intro
  function renderIntro(key) {
    const l = LEVEL[key];
    const b = best(key);
    app.innerHTML = `
      ${topbar(`${l.n} · ${l.title}`, '')}
      <main class="intro">
        <section class="qcard intro-card">
          <div class="q-kicker">${h(l.n)}</div>
          <h2 class="intro-title">${h(l.title)}</h2>
          <p class="q-body">${l.intro}</p>
          ${l.visual ? flipHtml(3, -4) + `<p class="q-body small">The card flips: ${MINUS} (${MINUS}4) becomes + 4. Same floor either way.</p>` : ''}
          ${key === 'test' ? `<div class="test-facts"><span><b>15</b> questions</span><span><b>Timed</b> count-up clock</span><span><b>New</b> questions each run</span></div>` : ''}
          <div class="intro-meta">
            <span>${D.SET_SIZE[key]} questions${key === 'test' ? ' · timed' : ' · not timed'}</span>
            <span>Best: <b>${b ? b.score + '/' + b.total + (b.time != null ? ' · ' + mmss(b.time) : '') : '—'}</b></span>
          </div>
          <div class="btn-row"><button class="btn primary big" id="start">${key === 'test' ? 'Start the test' : 'Start'}</button></div>
        </section>
      </main>${FOOT}`;
    app.querySelector('#start').addEventListener('click', () => go('play', key));
    bindTop();
  }

  // ------------------------------------------------------------------ play
  function startSet(key) {
    const qs = D.buildSet(key);
    state.set = { key, qs, i: 0, score: 0, results: [], startedAt: Date.now(), elapsed: 0, timed: key === 'test' };
    if (state.set.timed) startTimer();
    renderQuestion();
  }
  function topbar(title, right) {
    return `<header class="topbar">
      <button class="btn ghost small" id="home">Directory</button>
      <span class="top-title">${h(title)}</span>
      <span class="top-right">${right}</span>
    </header>`;
  }
  function bindTop() {
    const hb = app.querySelector('#home');
    if (hb) hb.addEventListener('click', () => {
      if (state.screen === 'play' && !confirm('Leave this set? Your progress in it will not be saved.')) return;
      go('home');
    });
  }
  function modeHint(q) {
    if (q.mode === 'elevator') return 'Move the elevator to the answer floor, then press Check answer.';
    if (q.mode === 'line') return 'Drag the marker to the answer, then press Check answer.';
    if (q.type === 'word') return `Type the answer with its sign${q.unit === '$' ? ' (dollars)' : q.unit === 'floor' ? '' : ' in ' + q.unit}, then press Check answer.`;
    return 'Type the answer, then press Check answer.';
  }
  function kickerFor(q) {
    if (q.type === 'word') return { temp: 'Temperature', sea: 'Sea level', money: 'Money', lift: 'Elevator' }[q.kind] || 'Word problem';
    if (q.type === 'add') return q.b > 0 ? 'Adding a positive' : 'Adding a negative';
    if (q.type === 'sub') return 'Subtracting a positive';
    return 'Subtracting a negative';
  }
  function renderQuestion() {
    const S = state.set, q = S.qs[S.i], l = LEVEL[S.key];
    const total = S.qs.length;
    const dots = S.qs.map((_, i) => `<i class="${i < S.i ? (S.results[i] ? 'ok' : 'bad') : i === S.i ? 'cur' : ''}"></i>`).join('');
    app.innerHTML = `
      ${topbar(`${l.n} · ${l.title}`, S.timed ? `<span class="timer" id="timer">0:00</span>` : `<span class="count">${S.i + 1} / ${total}</span>`)}
      <div class="dots" aria-hidden="true">${dots}</div>
      <main class="play mode-${q.mode}">
        <section class="qcard">
          <div class="q-kicker">Question ${S.i + 1} of ${total} · ${h(kickerFor(q))}</div>
          ${q.type === 'word'
            ? `<p class="q-text">${h(q.text)}</p>`
            : `<div class="q-expr">${h(q.expr)} <span class="eq">=</span> <span class="unknown" id="unknown">?</span></div>`}
          <p class="q-hint">${modeHint(q)}</p>
        </section>
        <aside class="stage" id="stage"></aside>
        <section class="actions">
          <div class="btn-row">
            ${q.mode === 'type' ? '' : `<div class="answer-row">Your answer: <b id="ans">—</b></div>`}
            <button class="btn primary" id="check" disabled>Check answer</button>
          </div>
          <div class="feedback" id="feedback" hidden></div>
        </section>
      </main>${FOOT}`;
    const stage = app.querySelector('#stage');
    const checkBtn = app.querySelector('#check');
    const ansEl = app.querySelector('#ans');
    let getAnswer, comp;
    if (q.mode === 'elevator') {
      comp = Elevator({ interactive: true, onChange: (f) => { ansEl.textContent = fmt(f); checkBtn.disabled = f === q.start; } });
      comp.setFloor(q.start, { animate: false });
      comp.markStart(q.start);
      getAnswer = () => comp.getFloor();
    } else if (q.mode === 'line') {
      comp = NumberLine({ onChange: (v) => { ansEl.textContent = fmt(v); checkBtn.disabled = v === q.start; } });
      comp.setValue(q.start, false);
      comp.markStart(q.start);
      getAnswer = () => comp.getValue();
    } else {
      comp = Keypad({ unit: q.unit || '', onChange: (raw) => { checkBtn.disabled = D.parseAnswer(raw) == null; }, onEnter: () => { if (!checkBtn.disabled) checkBtn.click(); } });
      getAnswer = () => D.parseAnswer(comp.getRaw());
    }
    stage.appendChild(comp.el);
    active = comp;
    if (comp.focus) comp.focus();

    checkBtn.addEventListener('click', () => {
      const chosen = getAnswer();
      if (chosen == null) return;
      const ok = chosen === q.answer;
      S.results[S.i] = ok;
      if (ok) S.score++;
      checkBtn.disabled = true;
      checkBtn.hidden = true;
      if (comp.setInteractive) comp.setInteractive(false);
      if (comp.lock) comp.lock();
      const u = app.querySelector('#unknown');
      if (u) { u.textContent = fmt(q.answer); u.classList.add('shown'); }
      // show the trip on the stage
      if (q.mode === 'elevator') {
        comp.markResult(q.answer, chosen);
        comp.setFloor(q.start, { animate: false });
        comp.showTrip(q.start, q.answer);
        setTimeout(() => comp.setFloor(q.answer, { animate: true }), RM ? 0 : 150);
      } else if (q.mode === 'line') {
        comp.markResult(q.answer, chosen);
        comp.showJump(q.start, q.answer);
      } else {
        comp.showResult(q.answer, ok);
      }
      const fb = app.querySelector('#feedback');
      const unit = q.type === 'word' ? ' ' + (q.unit === '$' ? '' : q.unit) : '';
      const ansTxt = q.type === 'word' && q.unit === '$' ? D.money(q.answer) : fmt(q.answer) + unit;
      const chosenTxt = q.type === 'word' && q.unit === '$' ? D.money(chosen) : fmt(chosen) + unit;
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
      fb.innerHTML = `
        <div class="fb-head">${ok ? '<span class="mark">✓</span> Correct' : '<span class="mark">✗</span> Not quite'}<span class="fb-ans">${ok ? ansTxt : 'Answer: ' + ansTxt + ' · you chose ' + chosenTxt}</span></div>
        ${q.type === 'word' ? `<div class="fb-work">${h(q.work)}</div>` : ''}
        ${q.type === 'subneg' ? flipHtml(q.a, q.b) : ''}
        <p class="fb-explain">${h(q.explain)}</p>
        <div class="btn-row"><button class="btn primary" id="next">${S.i + 1 < total ? 'Next question' : 'See results'}</button></div>`;
      fb.hidden = false;
      const nb = fb.querySelector('#next');
      nb.addEventListener('click', () => {
        if (S.i + 1 < total) { S.i++; if (active && active.destroy) active.destroy(); active = null; renderQuestion(); }
        else finishSet();
      });
      // keep the Next button in view on phones
      setTimeout(() => fb.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' }), 50);
    });
    bindTop();
    if (S.timed) paintTimer();
  }
  function finishSet() {
    const S = state.set;
    stopTimer();
    S.elapsed = Math.round((Date.now() - S.startedAt) / 1000);
    S.isBest = recordBest(S.key, S.score, S.qs.length, S.timed ? S.elapsed : null);
    go('results');
  }

  // --------------------------------------------------------------- results
  function renderResults() {
    const S = state.set, l = LEVEL[S.key], total = S.qs.length;
    const pct = Math.round((S.score / total) * 100);
    const b = best(S.key);
    const idx = LEVELS.findIndex((x) => x.key === S.key);
    const nextLevel = LEVELS[idx + 1];
    const verdict = pct === 100 ? 'Perfect ride.' : pct >= 80 ? 'Top floor is in sight.' : pct >= 50 ? 'Good progress. One more ride.' : 'Keep riding. The rules will stick.';
    // per-topic breakdown (test) + review list
    let review = '';
    if (S.key === 'test') {
      const byTopic = {};
      S.qs.forEach((q, i) => { const t = q.topic; byTopic[t] = byTopic[t] || { ok: 0, n: 0 }; byTopic[t].n++; if (S.results[i]) byTopic[t].ok++; });
      const rows = Object.keys(byTopic).map((t) => ({ t, ...byTopic[t] }));
      const weak = rows.filter((r) => r.ok < r.n).sort((x, y) => (x.ok / x.n) - (y.ok / y.n));
      review = `<div class="breakdown">
        <div class="bd-head">By topic</div>
        ${rows.map((r) => `<div class="bd-row${r.ok < r.n ? ' weak' : ''}"><span>${h(D.TOPICS[r.t].short)}</span><i><b style="width:${(r.ok / r.n) * 100}%"></b></i><span>${r.ok}/${r.n}</span></div>`).join('')}
        ${weak.length ? `<div class="bd-head">Review next</div><div class="review">${weak.map((r) => `<button class="btn ghost small" data-go="${r.t}">${h(D.TOPICS[r.t].label)}</button>`).join('')}</div>` : `<p class="q-body small">Nothing to review. Every topic was perfect.</p>`}
      </div>`;
    } else {
      const missed = S.qs.filter((q, i) => !S.results[i]);
      if (missed.length) review = `<div class="breakdown"><div class="bd-head">Look again</div>${missed.map((q) => `<div class="missed"><span>${h(q.type === 'word' ? q.work : q.expr + ' = ' + fmt(q.answer))}</span></div>`).join('')}</div>`;
    }
    app.innerHTML = `
      ${topbar(`${l.n} · ${l.title}`, '')}
      <main class="results">
        <section class="qcard result-card">
          <div class="q-kicker">${S.key === 'test' ? 'Test complete' : 'Set complete'}</div>
          <div class="score"><b>${S.score}</b><span>/ ${total}</span></div>
          <div class="score-sub">${pct}%${S.timed ? ' · ' + mmss(S.elapsed) : ''}${S.isBest ? ' · <em>New best</em>' : b ? ' · Best ' + b.score + '/' + b.total : ''}</div>
          <p class="verdict">${verdict}</p>
          <div class="dots big" aria-hidden="true">${S.qs.map((_, i) => `<i class="${S.results[i] ? 'ok' : 'bad'}"></i>`).join('')}</div>
          ${review}
          <div class="btn-row wrap">
            <button class="btn primary" id="again">${S.key === 'test' ? 'New test (new questions)' : 'Play again (new questions)'}</button>
            ${nextLevel && S.key !== 'test' ? `<button class="btn ghost" id="nextlvl">${h(nextLevel.n)}: ${h(nextLevel.title)}</button>` : ''}
            <button class="btn ghost" id="dir">Directory</button>
          </div>
        </section>
      </main>${FOOT}`;
    app.querySelector('#again').addEventListener('click', () => go('play', S.key));
    app.querySelector('#dir').addEventListener('click', () => go('home'));
    const nl = app.querySelector('#nextlvl'); if (nl) nl.addEventListener('click', () => go('intro', nextLevel.key));
    app.querySelectorAll('[data-go]').forEach((bt) => bt.addEventListener('click', () => go('intro', bt.dataset.go)));
    bindTop();
  }

  // ----------------------------------------------------------------- timer
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function paintTimer() { const t = app.querySelector('#timer'); if (t && state.set) t.textContent = mmss((Date.now() - state.set.startedAt) / 1000); }
  function startTimer() { stopTimer(); state.timer = setInterval(paintTimer, 500); }
  function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

  // ================================================================ Elevator
  function Elevator(opts) {
    const N = D.MAX - D.MIN + 1;
    const el = document.createElement('div');
    el.className = 'bldg';
    el.tabIndex = 0;
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', 'Integer building. Use the arrow keys to move the elevator.');
    let floorsHtml = '';
    for (let f = D.MAX; f >= D.MIN; f--) {
      floorsHtml += `<div class="floor${f < 0 ? ' below' : f === 0 ? ' ground' : ''}" data-f="${f}"><span class="fnum">${f === 0 ? '0' : signed(f)}</span><span class="fmark"></span><span class="ftag">${f === 0 ? 'Ground' : ''}</span></div>`;
    }
    el.innerHTML = `
      <div class="crown" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="dial">${dialSvg()}<div class="readout"><small>Floor</small><b class="rd">0</b></div></div>
      <div class="shaft">
        <div class="floors">${floorsHtml}</div>
        <div class="trip" hidden><span class="trip-label"></span></div>
        <div class="car" aria-hidden="true"><i class="door"></i><i class="door"></i></div>
      </div>
      <div class="bldg-ctl"><button class="btn ctl" data-d="1" aria-label="Up one floor">▲ Up</button><button class="btn ctl" data-d="-1" aria-label="Down one floor">▼ Down</button></div>`;
    const car = el.querySelector('.car'), rd = el.querySelector('.rd'), needle = el.querySelector('.needle'), trip = el.querySelector('.trip');
    const floorsEl = el.querySelector('.floors');
    let cur = 0, interactive = !!opts.interactive, counter = null, doneT = null;
    const fh = () => parseFloat(getComputedStyle(el).getPropertyValue('--fh')) || 24;
    function paint(f) {
      rd.textContent = fmt(f);
      needle.setAttribute('transform', `rotate(${(f / D.MAX) * 80} 100 96)`);
      el.querySelectorAll('.floor.cur').forEach((x) => x.classList.remove('cur'));
      const row = floorsEl.querySelector(`.floor[data-f="${f}"]`); if (row) row.classList.add('cur');
    }
    function setFloor(f, o = {}) {
      f = Math.max(D.MIN, Math.min(D.MAX, f));
      const from = cur; cur = f;
      clearInterval(counter); clearTimeout(doneT);
      const dist = Math.abs(f - from);
      const dur = o.animate && !RM ? Math.min(1800, 220 + dist * 110) : 0;
      car.style.transitionDuration = dur + 'ms';
      car.style.setProperty('--i', D.MAX - f);
      if (dur > 0 && dist > 0) {
        el.classList.add('moving');
        let step = 0; const dir = Math.sign(f - from);
        counter = setInterval(() => { step++; paint(from + dir * Math.min(step, dist)); if (step >= dist) clearInterval(counter); }, dur / dist);
        doneT = setTimeout(() => { el.classList.remove('moving'); paint(f); if (o.onDone) o.onDone(); }, dur + 30);
      } else { paint(f); if (o.onDone) o.onDone(); }
      if (o.user && opts.onChange) opts.onChange(f);
    }
    function clearMarks() { el.querySelectorAll('.floor').forEach((x) => { x.classList.remove('start', 'good', 'wrong'); x.querySelector('.ftag').textContent = x.dataset.f === '0' ? 'Ground' : ''; }); trip.hidden = true; }
    function markStart(f) { clearMarks(); const r = floorsEl.querySelector(`.floor[data-f="${f}"]`); r.classList.add('start'); r.querySelector('.ftag').textContent = 'Start'; }
    function markResult(ans, chosen) {
      const r = floorsEl.querySelector(`.floor[data-f="${ans}"]`); r.classList.add('good'); r.querySelector('.ftag').textContent = 'Answer';
      if (chosen !== ans) { const w = floorsEl.querySelector(`.floor[data-f="${chosen}"]`); if (w) { w.classList.add('wrong'); w.querySelector('.ftag').textContent = 'Yours'; } }
    }
    function showTrip(from, to) {
      const top = D.MAX - Math.max(from, to), n = Math.abs(to - from);
      trip.hidden = false;
      trip.className = 'trip ' + (to > from ? 'up' : 'down');
      trip.style.setProperty('--top', top); trip.style.setProperty('--n', n);
      trip.querySelector('.trip-label').textContent = (to > from ? '+' : MINUS) + n + (to > from ? ' ▲' : ' ▼');
    }
    function setInteractive(v) { interactive = v; el.classList.toggle('locked', !v); }
    // tap a floor
    floorsEl.addEventListener('click', (e) => {
      if (!interactive) return;
      const row = e.target.closest('.floor'); if (!row) return;
      setFloor(+row.dataset.f, { animate: true, user: true });
    });
    // drag the car with a finger or mouse
    let dragging = false;
    car.addEventListener('pointerdown', (e) => {
      if (!interactive) return;
      dragging = true; car.setPointerCapture(e.pointerId); el.classList.add('dragging'); e.preventDefault();
    });
    car.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = floorsEl.getBoundingClientRect();
      const idx = Math.max(0, Math.min(N - 1, Math.floor((e.clientY - rect.top) / fh())));
      const f = D.MAX - idx;
      if (f !== cur) setFloor(f, { animate: false, user: true });
    });
    const endDrag = () => { if (!dragging) return; dragging = false; el.classList.remove('dragging'); };
    car.addEventListener('pointerup', endDrag); car.addEventListener('pointercancel', endDrag);
    // buttons + keys
    el.querySelectorAll('.ctl').forEach((b) => b.addEventListener('click', () => { if (interactive) setFloor(cur + (+b.dataset.d), { animate: true, user: true }); }));
    el.addEventListener('keydown', (e) => {
      if (!interactive) return;
      if (e.key === 'ArrowUp') { e.preventDefault(); setFloor(cur + 1, { animate: true, user: true }); }
      if (e.key === 'ArrowDown') { e.preventDefault(); setFloor(cur - 1, { animate: true, user: true }); }
    });
    setInteractive(interactive);
    return { el, setFloor, getFloor: () => cur, markStart, markResult, showTrip, clearMarks, setInteractive, destroy() { clearInterval(counter); clearTimeout(doneT); } };
  }
  function dialSvg() {
    let ticks = '';
    for (let f = D.MIN; f <= D.MAX; f++) {
      const a = (f / D.MAX) * 80, big = f % 5 === 0;
      ticks += `<line x1="100" y1="${big ? 22 : 26}" x2="100" y2="32" transform="rotate(${a} 100 96)" class="${big ? 'tk big' : 'tk'}"/>`;
      if (big) {
        const rad = (a - 90) * Math.PI / 180, r = 84, x = 100 + r * Math.cos(rad), y = 96 + r * Math.sin(rad);
        ticks += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" class="tl">${fmt(f)}</text>`;
      }
    }
    return `<svg class="dial-svg" viewBox="0 0 200 104" aria-hidden="true">
      <path d="M12 96 A88 88 0 0 1 188 96" class="arc"/>
      ${ticks}
      <g class="needle" transform="rotate(0 100 96)"><line x1="100" y1="96" x2="100" y2="34"/><circle cx="100" cy="96" r="6"/></g>
    </svg>`;
  }

  // ============================================================== NumberLine
  function NumberLine(opts) {
    const el = document.createElement('div');
    el.className = 'nline';
    const W = 1000, H = 190, X0 = 50, STEP = (W - 2 * X0) / (D.MAX - D.MIN), Y = 110;
    const x = (v) => X0 + (v - D.MIN) * STEP;
    let ticks = '';
    for (let v = D.MIN; v <= D.MAX; v++) {
      ticks += `<g class="tick${v === 0 ? ' zero' : v < 0 ? ' neg' : ''}" data-v="${v}"><rect x="${x(v) - STEP / 2}" y="${Y - 40}" width="${STEP}" height="80" class="hit"/><line x1="${x(v)}" y1="${Y - (v % 5 === 0 ? 16 : 10)}" x2="${x(v)}" y2="${Y + (v % 5 === 0 ? 16 : 10)}"/><text x="${x(v)}" y="${Y + 44}" text-anchor="middle">${fmt(v)}</text></g>`;
    }
    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" class="nl-svg" aria-hidden="true">
        <defs><marker id="nl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>
        <line x1="${X0 - 30}" y1="${Y}" x2="${W - X0 + 30}" y2="${Y}" class="axis" marker-end="url(#nl-arrow)" marker-start="url(#nl-arrow)"/>
        ${ticks}
        <path class="jump" d="" hidden/>
        <text class="jump-label" x="0" y="0" text-anchor="middle" hidden></text>
        <g class="start-mark" hidden><circle r="13" cy="${Y}"/><text y="${Y - 26}" text-anchor="middle">Start</text></g>
        <g class="ans-mark" hidden><circle r="13" cy="${Y}"/></g>
        <g class="marker"><circle r="20" cy="${Y}"/><text y="${Y + 7}" text-anchor="middle"></text></g>
      </svg>
      <div class="nl-ctl"><button class="btn ctl" data-d="-1" aria-label="Left one">◀ Left</button><span class="nl-val"><small>Value</small><b class="rd">0</b></span><button class="btn ctl" data-d="1" aria-label="Right one">Right ▶</button></div>`;
    const svg = el.querySelector('svg'), marker = el.querySelector('.marker'), rd = el.querySelector('.rd');
    let cur = 0, locked = false;
    function setValue(v, user) {
      v = Math.max(D.MIN, Math.min(D.MAX, v)); cur = v;
      marker.setAttribute('transform', `translate(${x(v)} 0)`);
      marker.querySelector('text').textContent = fmt(v);
      rd.textContent = fmt(v);
      if (user && opts.onChange) opts.onChange(v);
    }
    function markStart(v) { const g = el.querySelector('.start-mark'); g.hidden = false; g.setAttribute('transform', `translate(${x(v)} 0)`); }
    function markResult(ans, chosen) {
      const g = el.querySelector('.ans-mark'); g.hidden = false; g.setAttribute('transform', `translate(${x(ans)} 0)`);
      marker.classList.add(chosen === ans ? 'good' : 'wrong');
    }
    function showJump(from, to) {
      const p = el.querySelector('.jump'), lab = el.querySelector('.jump-label');
      const x1 = x(from), x2 = x(to), lift = Math.min(70, 24 + Math.abs(to - from) * 5);
      p.setAttribute('d', `M${x1} ${Y - 22} Q ${(x1 + x2) / 2} ${Y - 22 - lift * 1.6} ${x2} ${Y - 22}`);
      p.hidden = false; p.classList.toggle('left', to < from);
      lab.setAttribute('x', (x1 + x2) / 2); lab.setAttribute('y', Y - 30 - lift * 0.8);
      lab.textContent = (to > from ? '+' : MINUS) + Math.abs(to - from) + (to > from ? ' ▶' : ' ◀');
      lab.hidden = false;
      if (!RM) { const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; requestAnimationFrame(() => { p.style.transition = 'stroke-dashoffset .9s ease-out'; p.style.strokeDashoffset = 0; }); }
      // slide the marker to the answer so the student sees the trip
      marker.style.transition = RM ? 'none' : 'transform .9s cubic-bezier(.3,.7,.2,1)';
      setTimeout(() => { marker.setAttribute('transform', `translate(${x(to)} 0)`); marker.querySelector('text').textContent = fmt(to); rd.textContent = fmt(to); }, 120);
    }
    let dragging = false;
    const valueAt = (clientX) => {
      const r = svg.getBoundingClientRect();
      const vx = ((clientX - r.left) / r.width) * W;
      return Math.round((vx - X0) / STEP) + D.MIN;
    };
    svg.addEventListener('pointerdown', (e) => { if (locked) return; dragging = true; svg.setPointerCapture(e.pointerId); setValue(valueAt(e.clientX), true); e.preventDefault(); });
    svg.addEventListener('pointermove', (e) => { if (dragging) { const v = valueAt(e.clientX); if (v !== cur) setValue(v, true); } });
    const end = () => { dragging = false; };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    el.querySelectorAll('.ctl').forEach((b) => b.addEventListener('click', () => { if (!locked) setValue(cur + (+b.dataset.d), true); }));
    el.tabIndex = 0;
    el.addEventListener('keydown', (e) => { if (locked) return; if (e.key === 'ArrowRight') { e.preventDefault(); setValue(cur + 1, true); } if (e.key === 'ArrowLeft') { e.preventDefault(); setValue(cur - 1, true); } });
    return { el, setValue, getValue: () => cur, markStart, markResult, showJump, lock() { locked = true; el.classList.add('locked'); }, setInteractive(v) { locked = !v; el.classList.toggle('locked', !v); } };
  }

  // ================================================================== Keypad
  function Keypad(opts) {
    const el = document.createElement('div');
    el.className = 'pad';
    const unit = opts.unit || '';
    const pre = unit === '$' ? '$' : '', post = unit && unit !== '$' ? (unit === 'floor' ? '' : ' ' + unit) : '';
    el.innerHTML = `
      <label class="pad-display"><span class="pad-pre">${h(pre)}</span><input class="pad-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="?" aria-label="Your answer"><span class="pad-post">${h(post)}</span></label>
      <div class="pad-keys">
        ${[7, 8, 9, 4, 5, 6, 1, 2, 3].map((k) => `<button class="btn key" data-k="${k}">${k}</button>`).join('')}
        <button class="btn key sign" data-k="sign" aria-label="Change sign">+ / ${MINUS}</button>
        <button class="btn key" data-k="0">0</button>
        <button class="btn key del" data-k="del" aria-label="Delete">⌫</button>
      </div>
      <div class="pad-result" hidden></div>`;
    const input = el.querySelector('.pad-input');
    let locked = false;
    const emit = () => { if (opts.onChange) opts.onChange(input.value); };
    el.querySelectorAll('.key').forEach((b) => b.addEventListener('click', () => {
      if (locked) return;
      const k = b.dataset.k;
      let v = input.value.replace(/[−–]/g, '-');
      if (k === 'del') v = v.slice(0, -1);
      else if (k === 'sign') v = v.startsWith('-') ? v.slice(1) : '-' + v;
      else if (v.replace('-', '').length < 3) v += k;
      input.value = v.replace(/-/g, MINUS);
      emit();
    }));
    input.addEventListener('input', emit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (opts.onEnter) opts.onEnter(); } });
    function showResult(ans, ok) {
      const r = el.querySelector('.pad-result');
      r.hidden = false; r.className = 'pad-result ' + (ok ? 'ok' : 'bad');
      r.innerHTML = `<small>${ok ? 'Correct' : 'Correct answer'}</small><b>${h(pre + fmt(ans) + post)}</b>`;
      el.classList.add(ok ? 'ok' : 'bad');
    }
    return { el, getRaw: () => input.value, lock() { locked = true; input.readOnly = true; el.classList.add('locked'); }, showResult,
      focus() { if (!('ontouchstart' in window)) input.focus(); } };
  }

  // ---------------------------------------------------------------- expose
  window.__IE = { state, store: () => store, go, LEVELS, best };
  go('home');
})();

</script>

:root {
  --paper: #ECE2CC; --paper-2: #E1D3B4; --sheet: #FBF7EE; --board: #F4EBD8;
  --ink: #2A251F; --ink-2: #574B3D; --ink-3: #85776A; --rule: rgba(42, 37, 31, .09);
  --one: #F3C531; --one-d: #7A5C00; --one-l: #FBEDB8;
  --ten: #D7563C; --ten-d: #8A2B17; --ten-l: #F6D6CC;
  --hun: #2F6CA6; --hun-d: #173E66; --hun-l: #D3E2F1;
  --tho: #3F7B50; --tho-d: #1E4A2B; --tho-l: #D5E8DA;
  --hi: #E8771E; --ok: #2C7845; --ok-l: #DCEFE1; --bad: #B23A26; --bad-l: #F8DED6;
  --slab: 'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif;
  --sans: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --u: 14px; --r: 10px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--sans); font-size: 18px; line-height: 1.5; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 28px 28px; display: flex; flex-direction: column;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--slab); font-weight: 700; line-height: 1.1; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { background: var(--ink); color: var(--sheet); position: relative; z-index: 5; }
.top .in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; min-height: 64px; }
.top .brand { font-family: var(--slab); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--one); white-space: nowrap; }
.top .ttl { font-family: var(--slab); font-weight: 600; font-size: 22px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.nums { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 6px; padding: 6px 6px 0; }

<script>// Pure mat logic: no DOM. Shared by the app and the Node verification scripts.
var BT_ENGINE = (function () {
  var PLACES = ['th', 'h', 't', 'o'];
  var VAL = { th: 1000, h: 100, t: 10, o: 1 };
  var UP = { o: 't', t: 'h', h: 'th' };
  var DOWN = { th: 'h', h: 't', t: 'o' };
  var NAME = { th: ['thousand', 'thousands'], h: ['hundred', 'hundreds'], t: ['ten', 'tens'], o: ['one', 'ones'] };
  var CAP = { th: 9, h: 20, t: 30, o: 30 };
  var nextId = 1;

  function empty() { return { th: [], h: [], t: [], o: [] }; }
  function blk() { return { id: 'b' + (nextId++), rot: 0 }; }
  function fromCounts(c) {
    var s = empty();
    PLACES.forEach(function (p) { for (var i = 0; i < (c[p] || 0); i++) s[p].push(blk()); });
    return s;
  }
  function counts(s) { return { th: s.th.length, h: s.h.length, t: s.t.length, o: s.o.length }; }
  function value(s) { return s.th.length * 1000 + s.h.length * 100 + s.t.length * 10 + s.o.length; }
  function isStandard(s) { return PLACES.every(function (p) { return s[p].length <= 9; }); }
  function clone(s) {
    var c = empty();
    PLACES.forEach(function (p) { c[p] = s[p].map(function (b) { return { id: b.id, rot: b.rot }; }); });
    return c;
  }
  function digitsOf(n) {
    return { th: Math.floor(n / 1000), h: Math.floor(n / 100) % 10, t: Math.floor(n / 10) % 10, o: n % 10 };
  }
  // Standard (fewest-blocks) counts for a number
  function standardCounts(n) { return digitsOf(n); }

  function canAdd(s, p) { return s[p].length < CAP[p]; }
  function add(s, p) { if (!canAdd(s, p)) return null; var b = blk(); s[p].push(b); return b; }
  function removeId(s, id) {
    for (var i = 0; i < PLACES.length; i++) {
      var p = PLACES[i], k = s[p].findIndex(function (b) { return b.id === id; });
      if (k >= 0) { s[p].splice(k, 1); return p; }
    }
    return null;
  }
  function placeOf(s, id) {
    for (var i = 0; i < PLACES.length; i++) if (s[PLACES[i]].some(function (b) { return b.id === id; })) return PLACES[i];
    return null;
  }
  // 10 of place p -> 1 of next place up. Returns {removed:[ids], added:id} or null.
  function tradeUp(s, p) {
    var q = UP[p];
    if (!q || s[p].length < 10) return null;
    var removed = s[p].splice(s[p].length - 10, 10).map(function (b) { return b.id; });
    var b = blk(); s[q].push(b);
    return { removed: removed, added: b.id, from: p, to: q };
  }
  // 1 block (id, or the last one) of place p -> 10 of the next place down.
  function breakDown(s, p, id) {
    var q = DOWN[p];
    if (!q || !s[p].length || s[q].length + 10 > CAP[q]) return null;
    var k = id ? s[p].findIndex(function (b) { return b.id === id; }) : s[p].length - 1;
    if (k < 0) return null;
    var gone = s[p].splice(k, 1)[0];
    var added = [];
    for (var i = 0; i < 10; i++) { var b = blk(); s[q].push(b); added.push(b.id); }
    return { removed: gone.id, added: added, from: p, to: q };
  }

  function countsText(c, skipZero) {
    var parts = [];
    PLACES.forEach(function (p) {
      var n = c[p] || 0;
      if (skipZero && !n) return;
      if (p === 'th' && !n) return;
      parts.push(n + ' ' + NAME[p][n === 1 ? 0 : 1]);
    });
    return parts.join(', ');
  }
  function fmt(n) { return n >= 1000 ? Math.floor(n / 1000) + ',' + String(n % 1000).padStart(3, '0') : String(n); }
  function expandedParts(n) {
    var d = digitsOf(n), out = [];
    if (d.th) out.push(d.th * 1000);
    if (d.h) out.push(d.h * 100);
    if (d.t) out.push(d.t * 10);
    if (d.o) out.push(d.o);
    return out;
  }
  function expandedText(n) { return expandedParts(n).map(fmt).join(' + '); }

  // ---- constraint checks for a single mat ----
  // rule: {n, std?, h?, t?, o?, th?, noH?, noTh?}
  function ruleText(r) {
    if (r.std) return 'the fewest blocks (9 or fewer in every place)';
    var bits = [];
    if (r.noTh) bits.push('no thousands');
    if (r.noH) bits.push('no hundreds');
    PLACES.forEach(function (p) { if (r[p] != null) bits.push('exactly ' + r[p] + ' ' + NAME[p][r[p] === 1 ? 0 : 1]); });
    return bits.join(' and ');
  }
  function ruleOk(s, r) {
    var c = counts(s);
    if (value(s) !== r.n) return false;
    if (r.std && !isStandard(s)) return false;
    if (r.noTh && c.th) return false;
    if (r.noH && c.h) return false;
    for (var i = 0; i < PLACES.length; i++) { var p = PLACES[i]; if (r[p] != null && c[p] !== r[p]) return false; }
    return true;
  }
  // ---- column arithmetic (used by Learn panel + verification) ----
  function columnAdd(a, b) {
    var da = digitsOf(a), db = digitsOf(b), carry = 0, res = {}, carries = {};
    ['o', 't', 'h', 'th'].forEach(function (p) {
      var s = da[p] + db[p] + carry;
      res[p] = s % 10; carry = s >= 10 ? 1 : 0;
      if (carry && UP[p]) carries[UP[p]] = 1;
    });
    return { result: a + b, digits: res, carries: carries };
  }
  function columnSub(a, b) {
    var d = digitsOf(a), db = digitsOf(b), work = { th: d.th, h: d.h, t: d.t, o: d.o }, trades = [];
    var order = ['o', 't', 'h', 'th'];
    order.forEach(function (p, i) {
      if (work[p] < db[p]) {
        // borrow from the nearest non-zero place to the left
        var j = i + 1;
        while (j < order.length && work[order[j]] === 0) j++;
        for (var k = j; k > i; k--) { work[order[k]] -= 1; work[order[k - 1]] += 10; trades.push(order[k]); }
      }
    });
    var res = {};
    order.forEach(function (p) { res[p] = work[p] - db[p]; });
    return { result: a - b, after: work, digits: res, trades: trades };
  }

  return {
    PLACES: PLACES, VAL: VAL, UP: UP, DOWN: DOWN, NAME: NAME, CAP: CAP,
    empty: empty, fromCounts: fromCounts, counts: counts, value: value, isStandard: isStandard, clone: clone,
    digitsOf: digitsOf, standardCounts: standardCounts, canAdd: canAdd, add: add, removeId: removeId, placeOf: placeOf,
    tradeUp: tradeUp, breakDown: breakDown, countsText: countsText, fmt: fmt, expandedParts: expandedParts, expandedText: expandedText,
    ruleText: ruleText, ruleOk: ruleOk, columnAdd: columnAdd, columnSub: columnSub
  };
})();
if (typeof module !== 'undefined') module.exports = BT_ENGINE;
</script>

<script>// Guided lessons. Each step: say (HTML), optional setup(ctx), hl (what to spotlight),

<script>// Mission setup, answer checking and test generation. Pure functions (no DOM).
// Mats are passed as {c: counts, take: {o,t,h,th,value}} so checks always use the real blocks.
var BT_CHECK = (function (E) {
  var fmt = E.fmt;
  function sum(c) { return (c.th || 0) * 1000 + (c.h || 0) * 100 + (c.t || 0) * 10 + (c.o || 0); }
  function same(a, b) { return E.PLACES.every(function (p) { return (a[p] || 0) === (b[p] || 0); }); }
  function needTh(m) { return !!m.thousands; }

  // What the screen needs: prompt text, mats, answer input type, numbers readout mode.
  function setup(m, mode) {
    var test = mode === 'test';
    var s = { mats: [], input: 'none', prompt: '', sub: '', label: '' };
    var th = needTh(m);
    switch (m.type) {
      case 'build':
        s.prompt = m.prompt || ('Build ' + fmt(m.n) + '.');
        s.sub = m.pre ? '' : 'Use the fewest blocks: 9 or fewer in every place.';
        s.mats = [{ pre: m.pre || {}, th: th, nums: test ? 'none' : 'counts' }];
        break;
      case 'read':
        s.prompt = 'What number do these blocks show?';
        s.sub = 'Trade blocks if it helps. Then type the number.';
        s.mats = [{ pre: m.pre, th: th, nums: 'none' }];
        s.input = 'num';
        break;
      case 'two':
        s.prompt = 'Show ' + fmt(m.n) + ' two different ways.';
        s.sub = 'Each mat must show ' + fmt(m.n) + '.';
        s.mats = m.rules.map(function (r, i) {
          return { pre: {}, th: th, nums: 'counts', label: 'Mat ' + (i + 1), rule: 'Use ' + E.ruleText(r) + '.' };
        });
        break;
      case 'way':
        s.prompt = 'Show ' + fmt(m.n) + ' using ' + E.ruleText(m.rule) + '.';
        s.sub = 'The mat must still show ' + fmt(m.n) + '.';
        s.mats = [{ pre: {}, th: th, nums: test ? 'none' : 'counts' }];
        break;
      case 'xbuild':
        s.prompt = 'Build ' + m.expr + '.';
        s.sub = 'Then write the number.';
        s.mats = [{ pre: {}, th: th, nums: 'none' }];
        s.input = 'num';
        break;
      case 'xtype':
        s.prompt = 'Write these blocks in expanded form.';
        s.sub = 'Trade first if a place has 10 or more.';
        s.mats = [{ pre: m.pre, th: th, nums: 'none' }];
        s.input = 'x3';
        break;
      case 'add':
        s.prompt = fmt(m.a) + ' + ' + fmt(m.b) + ' = ?';
        s.sub = 'The mat shows ' + fmt(m.a) + '. Add ' + fmt(m.b) + ' with blocks, trade, then type the answer.';
        s.mats = [{ pre: E.digitsOf(m.a), th: th, nums: 'none' }];
        s.input = 'num'; s.eq = fmt(m.a) + ' + ' + fmt(m.b) + ' =';
        break;
      case 'sub':
        s.prompt = fmt(m.a) + ' − ' + fmt(m.b) + ' = ?';
        s.sub = 'The mat shows ' + fmt(m.a) + '. Take away ' + fmt(m.b) + ' by dragging blocks off the mat. Break a block if you need more.';
        s.mats = [{ pre: E.digitsOf(m.a), th: th, nums: 'none', take: true }];
        s.input = 'num'; s.eq = fmt(m.a) + ' − ' + fmt(m.b) + ' =';
        break;
    }
    // Grade 1 tasks (everything under 100) use a tens-and-ones mat
    var top = Math.max(m.n || 0, m.answer || 0, m.a || 0, (m.a || 0) + (m.b || 0), m.pre && m.pre.h ? 100 : 0, m.type === 'xtype' || m.type === 'xbuild' ? 100 : 0);
    s.mats.forEach(function (mt) { mt.hund = top >= 100; });
    return s;
  }

  function answerOf(m) {
    switch (m.type) {
      case 'build': return m.n;
      case 'read': return m.answer;
      case 'two': case 'way': return m.n;
      case 'xbuild': return m.n;
      case 'xtype': return E.digitsOf(m.n);
      case 'add': return m.a + m.b;
      case 'sub': return m.a - m.b;
    }
  }
  // One correct final state (mat counts + input), used by "Show answer" and the tests.
  function solution(m) {
    var std = function (n) { return E.digitsOf(n); };
    switch (m.type) {
      case 'build': return { mats: [std(m.n)] };
      case 'read': return { mats: [m.pre], num: m.answer };
      case 'two': return { mats: m.sols };
      case 'way': return { mats: [m.sol] };
      case 'xbuild': return { mats: [std(m.n)], num: m.n };
      case 'xtype': { var d = std(m.n); return { mats: [d], x3: [d.h * 100, d.t * 10, d.o] }; }
      case 'add': return { mats: [std(m.a + m.b)], num: m.a + m.b };
      case 'sub': return { mats: [std(m.a - m.b)], num: m.a - m.b, take: m.b };
    }
  }

  function parseNum(v) {
    if (v == null) return NaN;
    var t = String(v).replace(/[,\s]/g, '');
    return /^\d+$/.test(t) ? parseInt(t, 10) : NaN;
  }

  // mats: [{c, take}], input: {num, x3:[a,b,c]}. Returns {ok, msg}
  function check(m, mats, input) {
    input = input || {};
    var c0 = mats[0] && mats[0].c, v0 = c0 ? sum(c0) : 0;
    function stdOk(c) { return E.PLACES.every(function (p) { return (c[p] || 0) <= 9; }); }
    function matMsg(v, n) { return 'Your mat shows ' + fmt(v) + '. It needs to show ' + fmt(n) + '.'; }
    switch (m.type) {
      case 'build':
        if (v0 !== m.n) return { ok: false, msg: matMsg(v0, m.n) };
        if (!stdOk(c0)) return { ok: false, msg: 'Your mat shows ' + fmt(m.n) + ', but a place has 10 or more blocks. Trade 10 for 1 to use fewer blocks.' };
        return { ok: true };
      case 'read': {
        var a = parseNum(input.num);
        if (isNaN(a)) return { ok: false, msg: 'Type a number in the box.', empty: true };
        return a === m.answer ? { ok: true } : { ok: false, msg: fmt(a) + ' is not quite right. Count each place again.' };
      }
      case 'two': {
        for (var i = 0; i < m.rules.length; i++) {
          var c = mats[i].c, r = Object.assign({ n: m.n }, m.rules[i]);
          if (!E.ruleOk({ th: Array(c.th || 0), h: Array(c.h || 0), t: Array(c.t || 0), o: Array(c.o || 0) }, r)) {
            var vi = sum(c);
            return { ok: false, msg: 'Mat ' + (i + 1) + ': ' + (vi !== m.n ? matMsg(vi, m.n) : 'it shows ' + fmt(m.n) + ', but it must use ' + E.ruleText(m.rules[i]) + '.') };
          }
        }
        if (same(mats[0].c, mats[1].c)) return { ok: false, msg: 'Both mats are the same. Show a different way on Mat 2.' };
        return { ok: true };
      }
      case 'way': {
        var rr = Object.assign({ n: m.n }, m.rule);
        if (v0 !== m.n) return { ok: false, msg: matMsg(v0, m.n) };
        if (!E.ruleOk({ th: Array(c0.th || 0), h: Array(c0.h || 0), t: Array(c0.t || 0), o: Array(c0.o || 0) }, rr))
          return { ok: false, msg: 'Your mat shows ' + fmt(m.n) + ', but it must use ' + E.ruleText(m.rule) + '.' };
        return { ok: true };
      }
      case 'xbuild': {
        if (v0 !== m.n) return { ok: false, msg: matMsg(v0, m.n) };
        var b = parseNum(input.num);
        if (isNaN(b)) return { ok: false, msg: 'Now type the number in the box.', empty: true };
        return b === m.n ? { ok: true } : { ok: false, msg: 'The blocks are right, but ' + fmt(b) + ' is not the number they show.' };
      }
      case 'xtype': {
        var d = E.digitsOf(m.n), want = [d.h * 100, d.t * 10, d.o], got = (input.x3 || []).map(parseNum);
        if (got.length < 3 || got.some(isNaN)) return { ok: false, msg: 'Fill in all three boxes. Type 0 if a place is empty.', empty: true };
        if (got[0] === want[0] && got[1] === want[1] && got[2] === want[2]) return { ok: true };
        if (got[0] + got[1] + got[2] === m.n) return { ok: false, msg: 'Those parts add up to ' + fmt(m.n) + ', but each box should hold one place: hundreds, then tens, then ones.' };
        return { ok: false, msg: 'Not quite. Trade first, then count each place.' };
      }
      case 'add': case 'sub': {
        var ans = m.type === 'add' ? m.a + m.b : m.a - m.b;
        if (m.type === 'sub') {
          var took = mats[0].take ? mats[0].take.value : 0;
          if (v0 !== ans || took !== m.b) {
            if (took !== m.b) return { ok: false, msg: 'You took away ' + fmt(took) + '. Take away exactly ' + fmt(m.b) + '.' };
            return { ok: false, msg: matMsg(v0, ans) };
          }
        } else if (v0 !== ans) {
          return { ok: false, msg: 'Your mat shows ' + fmt(v0) + '. Add all of ' + fmt(m.b) + ' with blocks first.' };
        }
        var n = parseNum(input.num);
        if (isNaN(n)) return { ok: false, msg: 'Type your answer in the box.', empty: true };
        if (n !== ans) return { ok: false, msg: 'Your blocks are right. Read them again: trade so each place has 9 or fewer, then count.' };
        return { ok: true };
      }
    }
    return { ok: false, msg: 'Unknown mission.' };
  }

  // Short explanation for generated test items (practice missions have hand-written ones).
  function explain(m) {
    if (m.why) return m.why;
    var d;
    switch (m.type) {
      case 'build': d = E.digitsOf(m.n); return fmt(m.n) + ' = ' + E.countsText(d) + '.';
      case 'read': return E.countsText(m.pre) + ' = ' + fmt(m.answer) + '.';
      case 'way': return fmt(m.n) + ' = ' + E.countsText(m.sol) + '.';

      var d = E.digitsOf(st.n);
      var parts = ['h', 't', 'o'].filter(function (p) { return d[p]; }).map(function (p) { return [p, d[p] * E.VAL[p]]; });
      var html = '<div class="xform"><span>' + fmt(st.n) + '</span><span>=</span>' + parts.map(function (x) {
        var on = st.shown && st.shown[x[0]];

      }).join('<span>+</span>') + '</div>';
      box.innerHTML = html; return box;
    }
    var res = st.op === '+' ? st.a + st.b : st.a - st.b;
    var len = Math.max(String(st.a).length, String(st.b).length, String(res).length);
    var places = ['th', 'h', 't', 'o'].slice(4 - len);
    function dig(n, p) { var s = String(n); var k = s.length - (places.length - places.indexOf(p)); return k >= 0 ? s[k] : ''; }
    function cell(p, inner, extra) { return '<td class="' + (st.hl === p ? 'hl-' + p : '') + (extra ? ' ' + extra : '') + '">' + inner + '</td>'; }
    var h = '<table aria-label="Written ' + (st.op === '+' ? 'addition' : 'subtraction') + '">';
    h += '<tr class="head"><td class="op"></td>' + places.map(function (p) { return cell(p, NM[p][1]); }).join('') + '</tr>';
    h += '<tr class="cr"><td class="op"></td>' + places.map(function (p) { return cell(p, st.op === '+' && st.carry && st.carry[p] ? st.carry[p] : ''); }).join('') + '</tr>';
    h += '<tr><td class="op"></td>' + places.map(function (p) {
      var dd = dig(st.a, p);
      if (st.cross && st.cross[p] != null) return cell(p, '<s>' + (dd || '0') + '</s><span class="nw">' + st.cross[p] + '</span>');
      return cell(p, dd);
    }).join('') + '</tr>';
    h += '<tr><td class="op">' + st.op + '</td>' + places.map(function (p) { return cell(p, dig(st.b, p)); }).join('') + '</tr>';
    h += '<tr class="ln"><td class="op"></td>' + places.map(function () { return '<td></td>'; }).join('') + '</tr>';
    h += '<tr><td class="op"></td>' + places.map(function (p) { return cell(p, st.res && st.res[p] != null ? st.res[p] : ''); }).join('') + '</tr>';
    box.innerHTML = h + '</table>';

      onResult: function (ok) {
        var rec = S.practice[m.id] || { tries: 0 };
        rec.tries = (rec.tries || 0) + 1; if (rec.first == null) rec.first = ok; if (ok) rec.done = true;
        S.practice[m.id] = rec; save();
      }
    });
    main.appendChild(v.el);
    window.__mission = v;
  }

  // ---------------- TEST ----------------
  var TEST_N = 15, TEST_SECS = 15 * 60;
  function pageTest() {
    setTop('Test', '#/');
    if (FREE) return lockPage('The test');
    var last = S.tests[S.tests.length - 1];
    var c = el('div', 'card'); c.style.maxWidth = '720px'; c.style.margin = '10px auto';
    c.innerHTML = '<span class="tape">Timed test</span><h2 style="font-size:40px;margin:12px 0 8px">Show what you know</h2>' +
      '<p class="say">' + TEST_N + ' questions · ' + (TEST_SECS / 60) + ' minutes · new questions every time.</p>' +
      '<p class="muted">You will use the blocks for every question. You will see your score and the topics to review at the end. Answers are not shown during the test.</p>' +
      (last ? '<p class="std">Last test: ' + last.score + ' / ' + last.total + '</p>' : '') +
      '<div class="row" style="margin-top:16px"><button class="btn pri" type="button" id="startT">' + I.clock + 'Start the test</button><button class="btn sm" data-go="#/progress">My progress</button></div>';
    main.appendChild(c);
    $('#startT').onclick = function () { runTest(C.makeTest()); };
  }
  function runTest(items) {
    main.textContent = '';
    var T = { items: items, i: 0, ok: [], t0: Date.now(), left: TEST_SECS, over: false };
    window.__test = T;
    var bar = el('div', 'tbar'); main.appendChild(bar);
    var host = el('div'); main.appendChild(host);
    var tm = setInterval(function () { T.left--; drawBar(); if (T.left <= 0) finish(); }, 1000); timers.push(tm);
    function drawBar() {
      var mm = Math.max(0, Math.floor(T.left / 60)), ss = Math.max(0, T.left % 60);
      bar.innerHTML = '<div class="qdots" aria-label="Question ' + (T.i + 1) + ' of ' + items.length + '">' + items.map(function (x, k) { return '<i class="' + (k < T.i ? 'done' : k === T.i ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="row"><span class="timer' + (T.left <= 60 ? ' low' : '') + '" role="timer">' + I.clock + mm + ':' + String(ss).padStart(2, '0') + '</span><button class="btn sm" type="button" id="endT">Finish now</button></div>';
      $('#endT').onclick = function () { if (confirm('Finish the test now? Questions you have not answered will count as wrong.')) finish(); };
    }
    function show() {
      MATS.forEach(function (m) { if (m.ro) m.ro.disconnect(); }); MATS = []; HIST.clear(); host.textContent = '';
      var m = items[T.i];
      var v = missionView(m, { mode: 'test', num: (T.i + 1) + ' of ' + items.length, last: T.i === items.length - 1, onResult: function (ok) { T.ok[T.i] = !!ok; T.i++; if (T.i >= items.length) finish(); else { drawBar(); show(); window.scrollTo(0, 0); } } });
      window.__mission = v;
      host.appendChild(v.el);
    }
    function finish() {
      if (T.over) return; T.over = true; clearInterval(tm);
      var secs = Math.min(TEST_SECS, Math.round((Date.now() - T.t0) / 1000));
      var by = {}; Object.keys(D.topics).forEach(function (k) { by[k] = [0, 0]; });
      items.forEach(function (it, k) { by[it.topic][1]++; if (T.ok[k]) by[it.topic][0]++; });
      var score = items.filter(function (x, k) { return T.ok[k]; }).length;
      S.tests.push({ d: Date.now(), score: score, total: items.length, secs: secs, by: by }); if (S.tests.length > 30) S.tests.shift(); save();
      testResults(items, T, by, score, secs);
    }
    drawBar(); show();
  }
  function testResults(items, T, by, score, secs) {
    cleanupMats(); main.textContent = ''; window.scrollTo(0, 0);
    var weak = Object.keys(by).filter(function (k) { return by[k][1] && by[k][0] < by[k][1]; });
    var c = el('div', 'card');
    var h = '<span class="tape">Test results</span><div class="row" style="align-items:flex-end;gap:22px;margin:12px 0"><span class="score">' + score + ' / ' + items.length + '</span>' +
      '<span class="say">' + (score === items.length ? 'Every question right. Excellent work!' : score >= 12 ? 'Strong work.' : score >= 8 ? 'Good start. Review the topics below.' : 'Keep practicing. Start with the topics below.') + '<br><span class="std">Time used: ' + Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s</span></span></div>';
    h += '<div class="tops">' + Object.keys(by).map(function (k) {
      var x = by[k], pc = x[1] ? Math.round(x[0] / x[1] * 100) : 0;
      return '<div class="top-card"><h3>' + esc(D.topics[k].name) + '</h3><div class="kv"><span>Score</span><b>' + x[0] + ' / ' + x[1] + '</b></div><div class="bar t"><i style="width:' + pc + '%"></i></div>' +
        (x[0] < x[1] ? '<button class="btn sm" data-go="#/learn/' + D.topics[k].lesson + '">Review: Lesson ' + D.topics[k].lesson + '</button>' : '<span class="badge ok">' + I.check + 'All correct</span>') + '</div>';
    }).join('') + '</div>';
    if (weak.length) h += '<p class="say" style="margin-top:16px"><b>Review next:</b> ' + weak.map(function (k) { return esc(D.topics[k].name); }).join(', ') + '.</p>';
    h += '<div class="row" style="margin-top:16px"><button class="btn pri" type="button" id="againT">' + I.reset + 'New test</button><button class="btn" data-go="#/progress">My progress</button><button class="btn sm" data-go="#/">Home</button></div>';
    c.innerHTML = h; main.appendChild(c);
    var rv = el('div', 'card'); rv.style.marginTop = '18px';
    rv.innerHTML = '<h3 style="font-size:24px;margin-bottom:10px">Question by question</h3><table class="hist"><tr><th>#</th><th>Question</th><th>Result</th><th>Answer</th></tr>' + items.map(function (it, k) {
      var su = C.setup(it, 'test');
      return '<tr><td>' + (k + 1) + '</td><td>' + esc(su.prompt) + (it.type === 'read' || it.type === 'xtype' ? ' <span class="std">(' + esc(E.countsText(it.pre, true)) + ')</span>' : '') + '</td><td>' + (T.ok[k] ? '<span class="badge ok">' + I.check + 'Right</span>' : '<span class="badge no">' + I.x + 'Wrong</span>') + '</td><td>' + esc(answerText(it)) + '</td></tr>';
    }).join('') + '</table>';
    main.appendChild(rv);
    $('#againT').onclick = function () { cleanupMats(); runTest(C.makeTest()); };
  }
  function cleanupMats() { MATS.forEach(function (m) { if (m.ro) m.ro.disconnect(); }); MATS = []; HIST.clear(); timers.forEach(clearInterval); timers = []; }

  // ---------------- PROGRESS ----------------
  function pageProgress() {
    setTop('My progress', '#/');
    var ms = D.missions, done = ms.filter(function (m) { return S.practice[m.id] && S.practice[m.id].done; }).length;
    var ls = Object.keys(S.lessons).length, best = S.tests.reduce(function (b, t) { return Math.max(b, Math.round(t.score / t.total * 100)); }, 0);
    var hd = el('div');
    hd.innerHTML = '<span class="tape">Dashboard</span><h2 style="font-size:38px;margin:12px 0 14px">My progress</h2>' +
      '<div class="tops" style="margin-bottom:18px">' +
      '<div class="top-card"><span class="std">Lessons finished</span><span class="score" style="font-size:52px">' + ls + ' / ' + L.length + '</span></div>' +
      '<div class="top-card"><span class="std">Practice missions done</span><span class="score" style="font-size:52px">' + done + ' / ' + ms.length + '</span></div>' +
      '<div class="top-card"><span class="std">Tests taken · best score</span><span class="score" style="font-size:52px">' + S.tests.length + (S.tests.length ? ' · ' + best + '%' : '') + '</span></div></div>';
    main.appendChild(hd);
    var h = '<h3 style="font-size:26px;margin:6px 0 12px">By topic</h3><div class="tops">';
    Object.keys(D.topics).forEach(function (k) {
      var tp = D.topics[k], tm = ms.filter(function (m) { return D.sets.find(function (s) { return s.id === m.id[0]; }).topic === k; });
      var dn = tm.filter(function (m) { return S.practice[m.id] && S.practice[m.id].done; }).length;
      var tried = tm.filter(function (m) { return S.practice[m.id]; }), first = tried.filter(function (m) { return S.practice[m.id].first; }).length;
      var tests = S.tests.filter(function (t) { return t.by && t.by[k] && t.by[k][1]; });
      var lt = tests[tests.length - 1], ltp = lt ? Math.round(lt.by[k][0] / lt.by[k][1] * 100) : null;
      var bt = tests.reduce(function (b, t) { return Math.max(b, Math.round(t.by[k][0] / t.by[k][1] * 100)); }, 0);
      var weak = (lt && ltp < 67) || (tried.length >= 2 && first / tried.length < .5);
      h += '<div class="top-card"><h3>' + esc(tp.name) + '</h3>' +
        '<div class="kv"><span>Practice done</span><b>' + dn + ' / ' + tm.length + '</b></div><div class="bar p"><i style="width:' + Math.round(dn / tm.length * 100) + '%"></i></div>' +
        '<div class="kv"><span>Right on first try</span><b>' + (tried.length ? first + ' / ' + tried.length : '—') + '</b></div>' +
        '<div class="kv"><span>Last test</span><b>' + (lt ? lt.by[k][0] + ' / ' + lt.by[k][1] + ' (' + ltp + '%)' : '—') + '</b></div><div class="bar t"><i style="width:' + (ltp || 0) + '%"></i></div>' +
        '<div class="kv"><span>Best test</span><b>' + (tests.length ? bt + '%' : '—') + '</b></div>' +
        (weak ? '<button class="btn sm" data-go="#/learn/' + tp.lesson + '">Review: Lesson ' + tp.lesson + '</button>' : '') + '</div>';
    });
    h += '</div>';
    var sec = el('div'); sec.innerHTML = h; main.appendChild(sec);
    var ls2 = el('div'); ls2.style.marginTop = '22px';
    ls2.innerHTML = '<h3 style="font-size:26px;margin:0 0 12px">Lessons</h3><div class="chips">' + L.map(function (x) {
      var d = S.lessons[x.id]; return '<button class="chip' + (d ? ' ok' : '') + '" type="button" data-go="#/learn/' + x.id + '">' + x.id + '<small>' + (d ? 'done' : 'not yet') + '</small></button>';
    }).join('') + '</div>';
    main.appendChild(ls2);
    if (S.tests.length) {
      var th = el('div'); th.style.marginTop = '22px';
      th.innerHTML = '<h3 style="font-size:26px;margin:0 0 12px">Recent tests</h3><table class="hist"><tr><th>Date</th><th>Score</th><th>Time</th></tr>' +
        S.tests.slice(-8).reverse().map(function (t) { var d = new Date(t.d); return '<tr><td>' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + '</td><td>' + t.score + ' / ' + t.total + '</td><td>' + Math.floor(t.secs / 60) + ':' + String(t.secs % 60).padStart(2, '0') + '</td></tr>'; }).join('') + '</table>';
      main.appendChild(th);
    }
    var rs = el('div', 'row'); rs.style.marginTop = '24px';
    rs.innerHTML = '<button class="btn sm" type="button" id="resetP">' + I.trash + 'Clear my progress</button><span class="std">Scores are saved only in this browser on this device.</span>';
    main.appendChild(rs);
    $('#resetP').onclick = function () { if (confirm('Clear all lessons, practice and test scores on this device?')) { S = { v: 1, lessons: {}, practice: {}, tests: [] }; save(); route(); } };
  }

  // ---------------- boot ----------------
  function boot() {
    main = $('#main'); ttl = $('#ttl'); backBtn = $('#back');
    backBtn.innerHTML = I.back + '<span>Back</span>';
    window.addEventListener('hashchange', route);
    window.addEventListener('resize', function () { closePop(); MATS.forEach(function (m) { m.size(); }); });
    route();
  }
  // test hooks (used by the automated checks)
  window.BT = { mats: function () { return MATS; }, hist: HIST, store: function () { return S; }, go: go, E: E, C: C, setProj: setProj };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>

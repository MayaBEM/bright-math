:root{
  --bg:#FAF3E7; --paper:#FFFDF8; --ink:#2A3347; --ink2:#4B566C; --line:#2A3347;
  --coral:#C4532F; --coral-d:#A5421F; --teal:#2F7D78; --teal-d:#256560; --sun:#F2C945; --sun-l:#FBEAAE;
  --sage:#DCEBDD; --sky:#DCEBF2; --peach:#F9DFCB; --ok:#2E7D4F; --ok-bg:#E3F3E6; --bad:#A83A2A; --bad-bg:#FBE6DF;
  --r:1.1rem; --shadow:0 .28rem 0 rgba(42,51,71,.14);
}
*{box-sizing:border-box}
html{font-size:clamp(15px,min(1.3vw,2.15vh),24px);-webkit-text-size-adjust:100%}
html[data-big="1"]{font-size:clamp(17px,min(1.65vw,2.7vh),30px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Andika','Trebuchet MS','Segoe UI',system-ui,sans-serif;font-size:1.08rem;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(42,51,71,.07) 1.2px,transparent 1.4px);background-size:1.6rem 1.6rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:.22rem solid #1B5FB5;outline-offset:.18rem;border-radius:.4rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em}
#app{min-height:100vh;display:flex;flex-direction:column}
.main{width:100%;max-width:92rem;margin:0 auto;padding:1rem 1.2rem 2.5rem;flex:1;outline:none}

/* top bar */
.top{display:flex;align-items:center;gap:.5rem .9rem;flex-wrap:wrap;padding:.5rem 1.2rem;background:var(--paper);border-bottom:.2rem solid var(--ink);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:.55rem;background:none;border:0;font-weight:700;font-size:1.1rem;padding:.2rem .3rem;color:var(--ink)}
.sunmark{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--sun);border:.17rem solid var(--ink);position:relative}
.sunmark:after{content:"";position:absolute;inset:-.5rem;border-radius:50%;border:.17rem dotted var(--ink);opacity:.55}
.stepnav{display:flex;align-items:center;gap:.4rem;margin:0 auto 0 .6rem}
.stepdot{width:2.6rem;height:2.6rem;border-radius:50%;border:.17rem solid var(--ink);background:var(--paper);font-weight:700;font-size:1.05rem;display:grid;place-items:center;padding:0}
.stepdot b{font-weight:700}
.stepdot.on{background:var(--coral);color:#fff}
.tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-left:auto}
.seg{display:inline-flex;border:.17rem solid var(--ink);border-radius:2rem;overflow:hidden;background:var(--paper)}
.lvlab{font-weight:700;font-size:.9rem;color:var(--ink2);margin-right:-.3rem}
.seg button{border:0;background:none;padding:.3rem .95rem;min-height:2.6rem;font-weight:700;font-size:1rem}
.seg button+button{border-left:.17rem solid var(--ink)}
.seg button.on{background:var(--teal);color:#fff}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:.17rem solid var(--ink);border-radius:2rem;background:var(--paper);padding:.2rem .8rem;min-height:2.6rem;font-weight:700}
button.chip:hover{background:var(--sun-l)}
.chip .nm{max-width:6.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.stars{background:var(--sun-l)}
.chip.stars .ic{color:#C99A00}
.iconbtn{width:2.6rem;height:2.6rem;border-radius:50%;border:.17rem solid var(--ink);background:var(--paper);display:inline-grid;place-items:center;padding:0;flex:none}
.iconbtn:hover{background:var(--sun-l)}
.iconbtn.sm{width:2.4rem;height:2.4rem}
.iconbtn[aria-pressed="false"]{background:#EFE9DC;color:var(--ink2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:.17rem solid var(--ink);border-radius:1rem;padding:.55rem 1.1rem;min-height:3.1rem;font-weight:700;background:var(--paper);box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(.2rem);box-shadow:0 .08rem 0 rgba(42,51,71,.14)}
.btn.primary{background:var(--coral);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:var(--paper)}
.btn.big{font-size:1.2rem;min-height:3.6rem;padding:.7rem 1.5rem}
.btn.sm{min-height:2.5rem;padding:.25rem .8rem;font-size:.9rem;box-shadow:none}
.btn:disabled{opacity:.45;box-shadow:none}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
.row.center{justify-content:center}
.spk{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;border:.17rem solid var(--ink);background:var(--teal);color:#fff;display:inline-grid;place-items:center;padding:0}
.spk:hover{background:var(--teal-d)}
.spk.big{width:3.4rem;height:3.4rem}

/* cards */
.card{background:var(--paper);border:.17rem solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:1.1rem 1.2rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;border:.15rem solid var(--ink);border-radius:2rem;background:var(--paper);padding:.2rem .85rem;font-weight:700}
.pill .ic{color:#C99A00}
.sec{font-size:1.5rem;margin:1.6rem 0 .8rem}
.sec2{font-size:1.25rem;margin:1.6rem 0 .6rem}

/* HOME */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:1.6rem;align-items:center;margin-top:.6rem}
.eyebrow{display:inline-block;background:var(--teal);color:#fff;font-weight:700;border-radius:2rem;padding:.2rem .9rem;font-size:.95rem;border:.15rem solid var(--ink)}
.hero h1{font-size:clamp(2.4rem,4.6vw,4.4rem);line-height:1.05;margin:.7rem 0 .6rem;letter-spacing:-.01em}
.hero h1 .amp{color:var(--coral)}
.lead{font-size:1.35rem;max-width:34rem;color:var(--ink2)}
.hero-cta{display:flex;gap:.8rem;flex-wrap:wrap;margin:1.3rem 0 1rem}
.trust{list-style:none;padding:0;margin:0;display:flex;gap:.5rem .6rem;flex-wrap:wrap}
.trust li{display:inline-flex;align-items:center;gap:.35rem;background:var(--sage);border:.13rem solid var(--ink);border-radius:2rem;padding:.12rem .8rem;font-size:.95rem;font-weight:700}
.trust .ic{color:var(--ok)}
.byline{margin-top:.9rem;color:var(--ink2)}
.hero-faces{padding:1rem;background:var(--sky)}
.hfgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
.hf{background:var(--paper);border:.15rem solid var(--ink);border-radius:1rem;padding:.4rem .2rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-weight:700;font-size:.9rem}
.hf:hover{outline:.2rem solid var(--coral)}
.hf .face{width:100%;max-width:5.2rem;height:auto}
.home-meter{margin-top:1.4rem;padding:1.1rem 1.2rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:.9rem}
.stepcard{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;text-align:left;background:var(--paper);border:.17rem solid var(--ink);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);position:relative}
.stepcard:hover{background:var(--sun-l)}
.stepcard.next{background:var(--peach);outline:.2rem dashed var(--coral);outline-offset:.25rem}
.stepcard .num,.num{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--coral);color:#fff;border:.15rem solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.num.sm{width:1.9rem;height:1.9rem;font-size:1rem}
.stx{display:flex;flex-direction:column;gap:.2rem;flex:1}
.stx b{font-size:1.15rem;line-height:1.2}
.stx span{font-size:.95rem;color:var(--ink2);line-height:1.35}
.sprog{width:100%;display:flex;flex-direction:column;gap:.2rem}
.sprog em,.dmid em{font-style:normal;font-size:.85rem;color:var(--ink2);font-weight:700}
.bar{display:block;height:.7rem;border-radius:1rem;border:.13rem solid var(--ink);background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}

/* meter */
.meter-bar{display:flex;height:1.2rem;border:.17rem solid var(--ink);border-radius:1rem;overflow:hidden}
.meter-bar i{flex:1}
.meter-faces{display:grid;grid-template-columns:repeat(16,1fr);gap:.2rem;margin-top:.5rem}
.mf{background:none;border:.14rem solid transparent;border-radius:.7rem;padding:.15rem .05rem;display:flex;flex-direction:column;align-items:center;font-size:.72rem;font-weight:700;line-height:1.15}
.mf:hover{border-color:var(--ink)}
.mf.on{border-color:var(--coral);box-shadow:0 0 0 .13rem var(--coral)}
.mf .face{width:100%;height:auto}
.mf span{word-break:break-word;text-align:center}
.meter-lab{display:flex;justify-content:space-between;font-weight:700;color:var(--ink2);margin-top:.4rem;font-size:.9rem}
.meter-card{margin-top:1.2rem}

/* step head & tabs */
.stephead{display:flex;gap:.9rem;align-items:center;margin:.4rem 0 .9rem}
.stepnum{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--coral);color:#fff;border:.17rem solid var(--ink);display:grid;place-items:center;font-size:1.7rem;font-weight:700;flex:none}
.stephead h2{font-size:2rem;line-height:1.1}
.stephead p{color:var(--ink2);font-size:1.1rem}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}
.tabs button{border:.17rem solid var(--ink);background:var(--paper);border-radius:1rem 1rem .4rem .4rem;padding:.5rem 1.1rem;min-height:3rem;font-weight:700}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button:not(.on):hover{background:var(--sun-l)}

/* face tiles */
.facegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem}
.facegrid.ci .fw{font-size:.92rem}
.facegrid.ci .face{max-width:4.6rem}
.facegrid.n2{grid-template-columns:repeat(2,minmax(0,13rem));justify-content:center}
.facegrid.n3{grid-template-columns:repeat(3,1fr)}
.facegrid.n4{grid-template-columns:repeat(4,1fr)}
.facegrid.n6{grid-template-columns:repeat(3,1fr)}
.facegrid.n8{grid-template-columns:repeat(4,1fr)}
.facegrid.n16{grid-template-columns:repeat(8,1fr)}
.ftile{position:relative;background:var(--paper);border:.17rem solid var(--ink);border-radius:var(--r);padding:.4rem .3rem .35rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;box-shadow:var(--shadow);min-height:5rem}
.ftile:hover:not(:disabled){transform:translateY(-.15rem)}
img.face{display:block;width:100%;height:auto;margin:0 auto;mix-blend-mode:multiply;user-select:none;-webkit-user-drag:none}
img.scene{display:block;user-select:none;-webkit-user-drag:none}
.ftile .face{width:100%;max-width:6rem;height:auto}
.ftile .fw{font-weight:700;font-size:1.12rem;line-height:1.2}
.ftile.on{outline:.25rem solid var(--coral);outline-offset:.1rem}
.ftile.right{border-color:var(--ok);box-shadow:0 0 0 .22rem var(--ok)}
.ftile.wrong{border-color:var(--bad);opacity:.55}
.ftile.seen .fw:after{content:""}
.seenmark{position:absolute;top:.25rem;right:.25rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;border:.12rem solid var(--ink)}
.seenmark .ic{width:.95rem;height:.95rem}
.mark{position:absolute;top:.3rem;right:.3rem;display:inline-flex;align-items:center;gap:.3rem;border-radius:2rem;padding:.12rem .35rem;color:#fff;border:.12rem solid var(--ink);font-style:normal;font-size:.85rem;font-weight:700}
.mark i{font-style:normal}
.mark.right{background:var(--ok)}
.mark.wrong{background:var(--bad)}
.mark .ic{width:1rem;height:1rem}
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:1.2rem;align-items:start}
.split.how{grid-template-columns:1fr 1.15fr}
.split.calm{grid-template-columns:1.1fr 1fr}
.split.ci2{grid-template-columns:1fr 1.1fr;margin-top:1rem}
.detail{position:sticky;top:5.5rem;display:flex;flex-direction:column;gap:.8rem}
.dface .face{width:min(100%,9rem);display:block;margin:0 auto}
.dword{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.dword h3{font-size:2.3rem;line-height:1}
.dline b{display:block;font-size:.95rem;color:var(--ink2);margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em}
.onmeter{font-size:.95rem;color:var(--ink2);display:flex;align-items:center;gap:.5rem}
.swatch{width:1.4rem;height:1.4rem;border-radius:.4rem;border:.13rem solid var(--ink);display:inline-block}

/* speech bubble */
.bubble{position:relative;display:flex;align-items:center;gap:.8rem;background:#fff;border:.2rem solid var(--ink);border-radius:1.4rem;padding:.8rem 1rem;box-shadow:var(--shadow);margin-bottom:.7rem}
.bubble:after{content:"";position:absolute;left:2rem;bottom:-.85rem;width:1.3rem;height:1.3rem;background:#fff;border-right:.2rem solid var(--ink);border-bottom:.2rem solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.bubble .btxt{flex:1;font-size:1.28rem;line-height:1.5}
.bubble.plain{box-shadow:none;background:var(--sun-l)}
.bubble.plain:after{background:var(--sun-l)}
.bubble.big{padding:1.1rem 1.3rem;margin-bottom:1.1rem}
.bubble.big .btxt{font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1.5}
.bubble mark{-webkit-box-decoration-break:clone;box-decoration-break:clone;background:var(--sun);color:var(--ink);border-radius:.5rem;padding:.02em .35em;font-weight:700;border-bottom:.15rem solid var(--ink)}
.blank{display:inline-block;min-width:3.4em;border-bottom:.2rem dashed var(--ink2);margin:0 .1em;line-height:1.1;vertical-align:baseline}
.bubble.ghostb{background:#FBF7EE;border-style:dashed}
.bubble.ghostb:after{background:#FBF7EE}
.frame{margin-top:1.4rem}
.frame.dim{opacity:.9}
.flabel{font-weight:700;color:var(--ink2);margin-bottom:.5rem;font-size:1rem;text-transform:uppercase;letter-spacing:.05em}
.clue{margin-top:.6rem;font-weight:700;background:var(--sage);border:.13rem solid var(--ink);border-radius:.8rem;padding:.4rem .8rem;display:inline-block}

/* feedback */
.fb{margin-top:.9rem;display:flex;gap:.6rem;align-items:flex-start;border:.17rem solid var(--ink);border-radius:1rem;padding:.65rem .9rem;font-size:1.12rem;font-weight:700;min-height:0}
.fb:empty{display:none}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:#1B5736}
.fb.try{background:var(--bad-bg);border-color:var(--bad);color:#7D2A1E}
.fb .ic{margin-top:.15rem;width:1.5rem;height:1.5rem;flex:none}
.fb span{flex:1}
.spk.sm{width:2.3rem;height:2.3rem;margin-left:auto}
.spk.sm .ic{width:1.1rem;height:1.1rem;margin:0}
.fb b{font-weight:700}

/* games */
.gamehead{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.prompt{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.prompt .ptxt{display:flex;flex-direction:column;gap:.1rem;font-size:1.4rem}
.prompt .word{font-size:2.4rem;font-weight:700;color:var(--coral)}
.prompt .hint{font-size:1rem;color:var(--ink2)}
.prompt .mean{font-size:1.6rem;line-height:1.4}
.prompt.calmq .face{width:6rem;flex:none}
.matchboard{display:grid;grid-template-columns:minmax(10rem,1fr) 2fr;gap:1.2rem;align-items:start}
.mcol.words{display:flex;flex-direction:column;gap:.7rem}
.mcol.facesc{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.wbtn{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:1.5rem;font-weight:700;border:.17rem solid var(--ink);background:var(--paper);border-radius:1rem;min-height:4.2rem;padding:.3rem 1rem;box-shadow:var(--shadow)}
.wbtn.on{background:var(--sun);}
.wbtn.done{background:var(--ok-bg);border-color:var(--ok);color:#1B5736}
.wbtn.done .ic{color:var(--ok)}
.summary{text-align:center;max-width:36rem;margin:1rem auto}
.summary.left{text-align:left;max-width:none;margin:0}
.bigscore{font-size:4rem;font-weight:700;line-height:1.1;color:var(--coral)}
.bigscore small{font-size:1.6rem;color:var(--ink2)}
.starrow{display:flex;gap:.3rem;justify-content:center;margin:.4rem 0}
.starrow span{color:#D9D2C1}.starrow span.on{color:#E0A800}
.starrow .ic{width:3rem;height:3rem}
.bigstars{display:flex;align-items:center;gap:.5rem;font-size:1.6rem}
.bigstars .ic{color:#E0A800;width:2rem;height:2rem}
.ladder{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1rem}
.lrung{display:flex;flex-direction:column;align-items:center;font-weight:700}
.lrung .face{width:5.5rem}
.larrow{flex:0 1 10rem;height:1rem;border-radius:1rem;border:.15rem solid var(--ink);background:linear-gradient(90deg,#8CC27A,#F2C945,#C23F3F)}

/* decks */
.deckbar{display:flex;align-items:center;gap:.8rem;margin:.2rem 0 1rem;flex-wrap:wrap}
.dmid{flex:1;display:flex;flex-direction:column;gap:.2rem;min-width:9rem}
.dmid b{font-size:1.15rem}
.scenecard{display:flex;flex-direction:row;gap:1rem;align-items:center}
.scenecard .scene{width:9rem;height:auto;flex:none}
.story{display:flex;align-items:center;gap:.8rem}
.story{flex:1}
.story p{flex:1;font-size:1.3rem;line-height:1.45}
.choices .q{display:flex;align-items:center;gap:.7rem;font-size:1.5rem;margin-bottom:.8rem;line-height:1.25}
.q.big{font-size:1.9rem;margin:.4rem 0 .8rem}
.how .facegrid.n4{grid-template-columns:repeat(4,1fr)}
.how .ftile .face{max-width:5rem}
.how .ftile .fw{font-size:1rem}
.how .facegrid.n6{grid-template-columns:repeat(3,1fr)}
.opts{display:flex;flex-direction:column;gap:.7rem}
.optrow{display:flex;gap:.6rem;align-items:center}
.opt{flex:1;display:flex;align-items:center;justify-content:space-between;gap:.8rem;text-align:left;background:var(--paper);border:.17rem solid var(--ink);border-radius:1rem;padding:.75rem 1rem;min-height:3.8rem;font-size:1.25rem;font-weight:700;box-shadow:var(--shadow);line-height:1.35}
.opt:hover:not(:disabled){background:var(--sun-l)}
.optrow.right .opt{background:var(--ok-bg);border-color:var(--ok)}
.optrow.wrong .opt{background:var(--bad-bg);border-color:var(--bad);opacity:.85}
.opt .mark{position:static;flex:none}
.safebanner{display:flex;gap:.8rem;align-items:flex-start;background:#FFF1C9;border:.17rem solid var(--ink);border-radius:var(--r);padding:.8rem 1rem;margin:0 0 1rem}
.safebanner .ic{width:2rem;height:2rem;flex:none;color:var(--ink)}
.safebanner div{display:flex;flex-direction:column}
.safebanner b{font-size:1.2rem}
.safebanner.small{margin:.8rem 0 0}
.phrasegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.phrase{position:relative;display:flex;flex-direction:column;gap:.5rem;padding-bottom:3.6rem}
.phrase .pt{font-size:1.4rem;font-weight:700;line-height:1.25}
.phrase .pw{color:var(--ink2);font-size:.95rem}
.phrase .spk{position:absolute;left:1.2rem;bottom:.9rem}
.modal .cardgrid,.cardgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:.6rem}
.mini{position:relative;background:var(--paper);border:.15rem solid var(--ink);border-radius:.9rem;padding:.3rem;display:flex;flex-direction:column;align-items:center}
.mini .scene{width:100%;height:auto}
.mini b{font-size:1rem}
.mini.on{outline:.2rem solid var(--coral);outline-offset:.1rem}
.mini.done{background:var(--ok-bg)}
.mini .mark{top:.15rem;right:.15rem;padding:.05rem}

/* calm */
.stratrow{display:grid;grid-template-columns:repeat(6,1fr);gap:.6rem;margin-bottom:1rem}
.strat{position:relative;display:flex;flex-direction:row;align-items:center;gap:.5rem;background:var(--paper);border:.17rem solid var(--ink);border-radius:var(--r);padding:.4rem .6rem;font-weight:700;font-size:.92rem;line-height:1.2;box-shadow:var(--shadow);text-align:left;min-height:3.6rem}
.strat.on{background:var(--sun);}
.strat:hover:not(.on){background:var(--sun-l)}
.sico{width:2.5rem;height:2.5rem;flex:none}
.stagecard h3{font-size:1.5rem;margin-bottom:.6rem}
.stage{min-height:16rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;background:var(--sky);border:.17rem solid var(--ink);border-radius:var(--r);padding:1rem;overflow:hidden}
.breath{position:relative;width:min(100%,13rem);aspect-ratio:1;display:grid;place-items:center}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#BFE0F2 30%,#7DBBE0 100%);border:.2rem solid var(--ink);transform:scale(.7);will-change:transform}
.bcenter{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
.bnum{font-size:2.8rem;font-weight:700;line-height:1}
.bnum.small{font-size:2.6rem;min-height:3rem}
.bword{font-size:1.5rem;font-weight:700;text-align:center;min-height:2rem}
.bdots{display:flex;gap:.6rem}
.bdots i{width:1.2rem;height:1.2rem;border-radius:50%;border:.15rem solid var(--ink);background:#fff}
.bdots i.on{background:var(--coral)}
.bcount{font-weight:700;color:var(--ink2);text-align:center}
.ring{position:relative;width:12.4rem;height:12.4rem}
.ring i{position:absolute;left:50%;top:50%;width:2.3rem;height:2.3rem;margin:-1.15rem;border-radius:50%;background:#fff;border:.16rem solid var(--ink);transform:rotate(var(--a)) translateY(-4.9rem);font-style:normal;transition:background .3s}
.ring i b{display:block;transform:rotate(calc(var(--a) * -1));font-size:1rem;line-height:2.2rem;text-align:center}
.ring i.on{background:var(--sun)}
.rcenter{position:absolute;inset:0;display:grid;place-items:center}
.sqwrap{width:10rem;height:10rem;display:grid;place-items:center}
.sqball{width:100%;height:100%;overflow:visible;transform-origin:center}
.sqball circle{transition:fill .4s}
.glass{width:8.5rem;height:auto}
#water{transition:transform 1.2s ease-in-out}
.chat{display:flex;flex-direction:column;gap:.7rem;width:100%;max-width:27rem}
.chatidle{text-align:center;font-size:1.25rem;font-weight:700;color:var(--ink2)}
.cb{max-width:85%;padding:.7rem 1rem;border:.17rem solid var(--ink);border-radius:1.2rem;font-size:1.2rem;font-weight:700;animation:pop .35s ease-out both}
.cb.a{align-self:flex-start;background:#fff}
.cb.b{align-self:flex-end;background:var(--teal);color:#fff}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(.5rem)}to{opacity:1;transform:none}}
.calmside{display:flex;flex-direction:column;gap:1rem}
.calmside h4{font-size:1.1rem;margin-bottom:.5rem}
.howto{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:.35rem;font-size:1.12rem}
.fchips{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.9rem}
.fchip{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:.14rem solid var(--ink);border-radius:.8rem;padding:.2rem;font-size:.8rem;font-weight:700;line-height:1.1}
.fchip .face{width:100%;max-width:3.2rem;height:auto}
.fchip.on{border-color:var(--coral);box-shadow:0 0 0 .15rem var(--coral)}
.fchip:hover:not(.on){border-color:var(--ink);transform:translateY(-.1rem)}

/* check-in */
.reasons{margin-bottom:1rem}
.rchip{margin:0 .4rem .5rem 0;border:.15rem solid var(--ink);background:var(--paper);border-radius:2rem;padding:.4rem 1rem;min-height:2.8rem;font-weight:700}
.rchip.on{background:var(--teal);color:#fff}
.rchip:hover:not(.on){background:var(--sun-l)}
.own{display:flex;flex-direction:column;gap:.3rem;font-weight:700;margin-top:.4rem}
input[type=text],select{border:.17rem solid var(--ink);border-radius:.8rem;padding:.5rem .8rem;min-height:3rem;background:#fff;width:100%}
.recbox{margin:1rem 0 0;padding:.8rem;border:.17rem dashed var(--ink);border-radius:var(--r);background:#FBF7EE}
.priv{display:inline-flex;align-items:center;gap:.3rem;text-transform:none;letter-spacing:0;font-size:.85rem;background:var(--sage);border-radius:2rem;padding:0 .6rem;margin-left:.4rem}
.recdot{margin-left:.8rem;font-weight:700;color:var(--bad)}
.aud{width:100%;max-width:26rem}
.log{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.log li{display:flex;align-items:center;gap:.7rem;background:var(--paper);border:.15rem solid var(--ink);border-radius:1rem;padding:.4rem .7rem}
.log .face{width:3.4rem;flex:none}
.log div{display:flex;flex-direction:column;flex:1;line-height:1.3}
.log span{color:var(--ink2);font-size:.95rem}
.stl{list-style:none;padding:0;margin:.6rem 0;display:flex;flex-direction:column;gap:.4rem}
.stl li{display:flex;align-items:center;gap:.6rem}
.stl em{margin-left:auto;font-style:normal;color:var(--ink2);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem}
.badge{background:var(--paper);border:.17rem solid var(--ink);border-radius:var(--r);padding:.8rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.badge .badge-svg{width:5.5rem}
.badge span{font-size:.9rem;color:var(--ink2);line-height:1.3}
.badge em{font-style:normal;font-weight:700;font-size:.85rem}
.badge.locked{opacity:.75}
.badgebig{display:flex;flex-direction:column;align-items:center}
.badgebig .badge-svg{width:7rem}

/* footer, toast, modal */
.foot{display:flex;gap:.4rem 1.2rem;flex-wrap:wrap;justify-content:center;padding:1rem 1.2rem;border-top:.17rem solid var(--ink);background:var(--paper);font-size:.9rem;color:var(--ink2)}
.foot .wm{font-weight:700;color:var(--ink)}
.foot .warn{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,2rem);background:var(--ink);color:#fff;padding:.7rem 1.3rem;border-radius:2rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--ok)} .toast.bad{background:var(--bad)}
.modal-back{position:fixed;inset:0;background:rgba(42,51,71,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.modal-card{background:var(--bg);border:.2rem solid var(--ink);border-radius:var(--r);padding:1rem 1.2rem 1.2rem;width:min(100%,38rem);max-height:92vh;overflow:auto;box-shadow:0 .6rem 0 rgba(0,0,0,.2)}
.modal-card.wide{width:min(100%,64rem)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem}
.mhead h3{font-size:1.5rem}
.plist{list-style:none;margin:0 0 1rem;padding:0;display:flex;flex-direction:column;gap:.5rem}
.prow{width:100%;display:flex;align-items:center;gap:.7rem;background:var(--paper);border:.17rem solid var(--ink);border-radius:1rem;padding:.6rem .9rem;min-height:3.4rem;text-align:left}
.plist li.on .prow{background:var(--sun-l)}
.prow b{flex:1}
.prow span{color:var(--ink2);display:flex;align-items:center;gap:.3rem;font-size:.95rem}
.addp{display:flex;gap:.7rem;align-items:flex-end;flex-wrap:wrap}
.addp label{flex:1;min-width:10rem;display:flex;flex-direction:column;font-weight:700;gap:.3rem}
.note{color:var(--ink2);font-size:.95rem;margin-top:.8rem;display:flex;gap:.4rem;align-items:center}
.note.warn{color:var(--bad);font-weight:700}
.mbody .lesson{background:var(--paper);border:.15rem solid var(--ink);border-radius:var(--r);padding:.9rem 1.1rem;margin-bottom:.9rem}
.lesson h4{font-size:1.2rem;margin-bottom:.5rem}
.lesson ul,.lesson ol{padding-left:1.3rem;margin:.4rem 0}
.lesson li{margin:.25rem 0}
.blocks{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:.5rem}
.blocks li{display:flex;gap:.8rem;align-items:flex-start;margin:0}
.blocks .mins{flex:none;background:var(--teal);color:#fff;border-radius:.7rem;padding:.2rem .6rem;font-weight:700;min-width:5.4rem;text-align:center;font-size:.95rem}
.blocks p{margin:.1rem 0}
.blocks em{font-style:normal;color:var(--ink2);font-size:.9rem}
.std{list-style:none;padding:0!important}
.tablewrap{overflow:auto}
.tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{border-bottom:.1rem solid #D9D2C1;padding:.4rem .5rem;text-align:left;white-space:nowrap}
.tbl tr.on td{background:var(--sun-l)}
.fld{display:flex;flex-direction:column;gap:.3rem;font-weight:700;margin-bottom:.7rem;max-width:30rem}
.toggle{display:flex;gap:.8rem;align-items:flex-start;margin:.5rem 0;cursor:pointer}
.toggle input{position:absolute;opacity:0}
.toggle .sw{flex:none;width:3.2rem;height:1.8rem;border-radius:2rem;background:#CFC8B8;border:.15rem solid var(--ink);position:relative;transition:background .2s;margin-top:.15rem}
.toggle .sw:after{content:"";position:absolute;top:.12rem;left:.14rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;border:.13rem solid var(--ink);transition:left .2s}
.toggle input:checked+.sw{background:var(--teal)}
.toggle input:checked+.sw:after{left:1.5rem}
.toggle input:focus-visible+.sw{outline:.22rem solid #1B5FB5;outline-offset:.15rem}
.toggle em{display:block;font-style:normal;color:var(--ink2);font-size:.92rem;font-weight:400}
.filebtn{position:relative;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* certificate */
.cert{background:#FFFDF8;border:.4rem double var(--ink);border-radius:.6rem;padding:1.2rem;aspect-ratio:1.414;display:grid;place-items:center;text-align:center;max-width:44rem;margin:0 auto}
.cert-in{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.cert h2{font-size:2.2rem;line-height:1.15}
.cert .c1{font-weight:700;color:var(--coral);letter-spacing:.08em;text-transform:uppercase}
.cert .cname{font-size:2.6rem;font-weight:700;border-bottom:.2rem solid var(--ink);padding:0 2rem}
.cert .c2{color:var(--ink2);font-size:1.1rem;max-width:30rem}
.cert .c3{font-weight:700}
.cfaces{display:flex;gap:.6rem}
.cfaces .face{width:4.2rem}
.cert-wrap{width:min(100%,52rem)}

/* motion */
html[data-reduce="1"] *,html[data-reduce="1"] *:before,html[data-reduce="1"] *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* responsive */
@media (max-width:1100px){
  .hero{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
  .stratrow{grid-template-columns:repeat(3,1fr)}
  .phrasegrid{grid-template-columns:repeat(3,1fr)}
  .badges{grid-template-columns:repeat(3,1fr)}
  .meter-faces{grid-template-columns:repeat(8,1fr)}
  .mf{font-size:.8rem}
}
@media (max-width:860px){
  .split,.split.how,.split.calm,.split.ci2{grid-template-columns:1fr}
  .detail{position:static}
  .matchboard{grid-template-columns:1fr}
  .mcol.words{display:grid;grid-template-columns:repeat(2,1fr)}
  .facegrid.n16{grid-template-columns:repeat(4,1fr)}
  .log{grid-template-columns:1fr}
  .cardgrid{grid-template-columns:repeat(5,1fr)}
  .phrasegrid{grid-template-columns:repeat(2,1fr)}
  .stepnav{order:3;width:100%;margin:0;justify-content:center}
}
@media (max-width:560px){
  html{font-size:15px}
  .scenecard{flex-direction:column;align-items:stretch}
  .scenecard .scene{align-self:center}
  .main{padding:.8rem .8rem 2rem}
  .top{padding:.5rem .7rem}
  .steps,.badges{grid-template-columns:1fr}
  .stratrow{grid-template-columns:repeat(2,1fr)}
  .facegrid,.facegrid.n4,.facegrid.n8{grid-template-columns:repeat(3,1fr)}
  .facegrid.n16{grid-template-columns:repeat(3,1fr)}
  .how .facegrid.n6,.how .facegrid.n4{grid-template-columns:repeat(2,1fr)}
  .meter-faces{grid-template-columns:repeat(4,1fr)}
  .hfgrid{grid-template-columns:repeat(4,1fr);gap:.3rem}
  .hf{font-size:.7rem}
  .phrasegrid{grid-template-columns:1fr}
  .chip .nm{max-width:5rem}
  .seg button{padding:.3rem .55rem;font-size:.85rem}
  .fchips{grid-template-columns:repeat(4,1fr)}
  .stephead h2{font-size:1.5rem}
  .tbl{font-size:.85rem}
}

/* print */
@media print{
  @page{size:landscape;margin:12mm}
  body{background:#fff!important;background-image:none!important}
  body.print-cert #app,body.print-cert .toast,body.print-modal #app,body.print-modal .toast{display:none!important}
  body.print-cert .modal-back,body.print-modal .modal-back{position:static;background:none;padding:0}
  body.print-cert .modal-card,body.print-modal .modal-card{border:0;box-shadow:none;max-height:none;overflow:visible;width:100%}
  .noprint,.mhead .row,.tabs.mt{display:none!important}
  body:not(.print-cert):not(.print-modal) #modal{display:none}
}
</style>

function blobToB64(b) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(String(r.result)); }; r.onerror = function () { res(''); }; r.readAsDataURL(b); }); }

  var p = withRec ? recAll() : Promise.resolve([]);

    S.ans = el.dataset.k; if (S.ans === right) { S.score++; addStars(1); } else Snd.play('try'); sayAuto((S.ans === right ? 'Yes! ' : 'Not quite. ') + q.l.line); render(true);
  },
  snext: function () { var S = V.strong; S.i++; S.ans = null; if (S.i >= 6) { S.done = true; me().studio.strong++; save(); } render(); },
  ssay: function () { var S = V.strong, q = S.qs[S.i]; say('Which feeling is ' + (q.ask === 'big' ? 'a lot?' : 'a little?') + ' ' + q.opts[0] + ' or ' + q.opts[1] + '?'); },
  strongagain: function () { V.strong = newStrong(); render(); },
  /* decks */
  dprev: function (el) { var k = el.dataset.k, D = V[k]; D.idx = (D.idx + SIT.length - 1) % SIT.length; V.nav++; loadCard(k); render(); },
  dnext: function (el) { var k = el.dataset.k, D = V[k]; D.idx = (D.idx + 1) % SIT.length; V.nav++; loadCard(k); render(); },
  dgrid: function (el) { V.grid = el.dataset.k; renderModal(); },
  dgo: function (el) { var k = V.grid; V.grid = false; V[k].idx = +el.dataset.i; V.nav++; loadCard(k); render(); },
  hchoose: function (el) {
    var D = V.how, s = SIT[D.idx], x = el.dataset.k; if (D.solved) return;
    if (x === s.f || s.ok.indexOf(x) >= 0) {
      D.solved = true; D.sel = x; D.kind = 'ok'; Snd.play('ok');
      D.msg = x === s.f ? 'Yes! ' + s.n + ' feels <b>' + s.f + '</b>.' : 'Good thinking! <b>' + x + '</b> is possible, too. The best word here is <b>' + s.f + '</b>.';
      saySeqAuto([x === s.f ? 'Yes! ' + s.f + '.' : 'Good thinking. The best word here is ' + s.f + '.', frameText(s)]);
    } else { D.wrong[x] = true; D.kind = 'try'; Snd.play('try'); D.msg = 'Not quite. Read the story again. ' + (Object.keys(D.wrong).length >= 2 ? '' : 'Look for the clue.'); sayAuto('Not quite. Try again.'); }
    render(true);
  },
  hsaid: function () { var D = V.how, s = SIT[D.idx]; if (mark(me().how, s.id, 1)) addStars(0); Snd.play('star'); toast('Great speaking! +1 star', 'good'); D.idx = (D.idx + 1) % SIT.length; V.nav++; loadCard('how'); render(); },
  schoose: function (el) {
    var D = V.say, s = SIT[D.idx], o = D.opts[+el.dataset.i]; if (D.solved) return;
    if (o.good) { D.solved = true; D.kind = 'ok'; D.msg = '<b>Yes!</b> ' + esc(o.why); Snd.play('ok'); saySeqAuto(['Yes! ' + o.why]); }
    else { D.wrong[+el.dataset.i] = true; D.kind = 'try'; D.msg = '<b>Think again.</b> ' + esc(o.why); Snd.play('try'); sayAuto('Think again. ' + o.why); }
    render(true);
  },
  ssaid: function () { var D = V.say, s = SIT[D.idx]; mark(me().say, s.id, 1); Snd.play('star'); toast('Kind words! +1 star', 'good'); D.idx = (D.idx + 1) % SIT.length; V.nav++; loadCard('say'); render(); },
  /* calm */
  strat: function (el) { V.calm.key = el.dataset.k; Speech.stop(); V.nav++; render(true); },
  cfeel: function (el) { V.calm.feeling = el.dataset.k; render(true); },
  cstart: function () { Snd.ensure(); calmRun(); },
  ctried: function () { var c = me().calm, k = V.calm.key; var first = !c[k]; c[k] = Date.now(); if (first) { addStars(1); } save(); checkBadges(); Snd.play('ok'); toast(first ? 'Nice! +1 star' : 'Great job!', 'good'); render(true); },
  /* check-in */
  cifeel: function (el) { V.ci.feeling = el.dataset.k; Snd.play('tap'); sayAuto(el.dataset.k); render(true); },
  cireason: function (el) { V.ci.because = el.dataset.r; V.ci.typed = ''; Snd.play('tap'); render(true); },
  ciwill: function (el) { V.ci.will = el.dataset.r; Snd.play('tap'); render(true); },
  rec: function () { if (Rec.state === 'recording') { try { Rec.mr.stop(); } catch (e) { } } else { Speech.stop(); startRec(); } },
  recdel: function () { if (Rec.url) URL.revokeObjectURL(Rec.url); Rec.blob = null; Rec.url = ''; Rec.state = 'idle'; render(true); },
  cisave: function () {
    var C = V.ci, p = me(), l = lvl(), f = C.feeling; if (!f) return;
    var because = C.typed || C.because, text = l === 1 ? 'I feel ' + f + '.' : l === 2 ? 'Today I feel ' + f + (because ? ' because ' + because : '') + '.' : 'Today I feel ' + f + (because ? ' because ' + because : '') + (C.will ? ', so I will ' + C.will : '') + '.';
    var entry = { t: Date.now(), f: f, text: text }, finish = function () { p.checkins.push(entry); addStars(2); save(); checkBadges(); V.ci = { feeling: '', because: '', will: '', typed: '' }; Rec.blob = null; Rec.url = ''; Rec.state = 'idle'; toast('Check-in saved. +2 stars', 'good'); render(true); };
    if (Rec.blob) { var id = 'r' + Date.now().toString(36); entry.rec = id; recPut({ id: id, profileId: p.id, date: entry.t, blob: Rec.blob }).then(finish); } else finish();
  },
  playrec: function (el) { recGet(el.dataset.id).then(function (r) { if (!r) return toast('That recording is no longer on this device.'); var a = new Audio(URL.createObjectURL(r.blob)); a.play().catch(function () { toast('Could not play the recording.'); }); }); },
  qans: function (el) {
    var Q = V.quiz, q = Q.qs[Q.i]; if (Q.ans) return; var a = el.dataset.a; Q.ans = a;
    var good = a === q.answer || (q.ok && q.ok.indexOf(a) >= 0);
    if (good) { Q.score++; Snd.play('ok'); } else Snd.play('try');
    sayAuto((good ? 'Yes! ' : 'Not quite. ') + q.why); render(true);
  },
  qnext: function () {
    var Q = V.quiz; Q.i++; Q.ans = null;
    if (Q.i >= 8) { Q.done = true; var p = me(); p.quiz.push({ t: Date.now(), score: Q.score }); addStars(Q.score); save(); checkBadges(); }
    render();
  },
  quizagain: function () { V.quiz = newQuiz(); render(); }
};
function saySeqNow(a) { Speech.stop(); Speech.seq(a); }
function matchCheck() {
  var M = V.match; if (!(M.selW && M.selF)) { render(true); return; }
  if (M.selW === M.selF) {
    M.done[M.selW] = true; M.msg = 'Yes! <b>' + M.selW + '</b>.'; Snd.play('ok'); M.total += 1; sayAuto('Yes! ' + M.selW + '.'); M.selW = M.selF = null;
    if (Object.keys(M.done).length === M.keys.length) {
      addStars(1);
      after(function () {
        if (M.round >= 3) { M.over = true; me().studio.match++; save(); render(); return; }
        var n = M.keys.length, keys = shuffle(Object.keys(FEEL)).slice(0, n); M.round++; M.keys = keys; M.faces = shuffle(keys); M.done = {}; M.msg = ''; render();
      }, 1400);
    }
  } else { M.msg = 'Not a match. Try again.'; M.miss++; Snd.play('try'); M.selW = M.selF = null; }
  render(true);
}

/* ---------- events + boot ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var a = ACT[el.dataset.act]; if (!a) return;
  if (el.dataset.act === 'closemodal' || el.dataset.act === 'closegrid' || el.dataset.act === 'closecert') { a(el, e); return; }
  Snd.ensure(); a(el, e);
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.bind) { V.ci[t.dataset.bind] = t.value; if (t.dataset.bind === 'typed') V.ci.because = ''; }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.set) { store.settings[t.dataset.set] = t.checked; save(); applySettings(); if (t.dataset.set === 'sound' && t.checked) Snd.play('ok'); render(true); }
  else if (t.dataset.setsel) { var k = t.dataset.setsel; store.settings[k] = k === 'rate' ? parseFloat(t.value) : t.value; save(); Speech.pick(); }
  else if (t.dataset.file === 'import' && t.files && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
});
document.addEventListener('submit', function (e) {
  var f = e.target; if (f.dataset.form === 'addp') {
    e.preventDefault(); var inp = f.querySelector('input'), n = inp.value.trim();
    if (!n) { inp.focus(); return; }
    var p = newProfile(n.slice(0, 24)); store.profiles.push(p); store.current = p.id; save(); V.how = V.say = V.quiz = null; V.listen = V.match = V.strong = null; if (V.view === 'how' || V.view === 'say') initDeck(V.view); V.modal = V.modal === 'profile' ? null : V.modal; render(true); toast('Welcome, ' + p.name + '!', 'good');
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (V.cert) { V.cert = false; renderModal(); } else if (V.grid) { V.grid = false; renderModal(); } else if (V.modal) { V.modal = null; renderModal(); } }
});
document.addEventListener('fullscreenchange', function () { });
(function boot() {
  store = load(); Speech.init(); applySettings();
  window.addEventListener('beforeunload', function () { try { speechSynthesis.cancel(); } catch (e) { } });
  render();
})();
</script>
</body>

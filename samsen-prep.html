ลี่ยมที่ตัดออก (x√2 ≈ 5.7 ซม.) แทนที่จะเป็นความยาวด้านประกอบมุมฉาก x ที่โจทย์ถาม`},D:{en:`Forgets to multiply by 4 corners when setting up the equation, solving \\frac{x²}{2} = 32 (treating the total removed area as if it came from just one triangle), giving x² = 64 and x = 8.`,th:`ลืมคูณด้วย 4 มุมตอนตั้งสมการ แก้ \\frac{x²}{2} = 32 (เสมือนพื้นที่ที่ตัดออกทั้งหมดมาจากสามเหลี่ยมมุมเดียว) ทำให้ได้ x² = 64 และ x = 8`}},hints:[{en:`How much total area was removed from the original square?`,th:`พื้นที่ที่ถูกตัดออกไปทั้งหมดจากสี่เหลี่ยมจัตุรัสเดิมมีเท่าใด`},{en:`Each corner triangle has legs of length x, so its area is \\frac{x²}{2}. There are 4 identical corners removed.`,th:`สามเหลี่ยมมุมหนึ่งมีด้านประกอบมุมฉากยาว x ทั้งสองด้าน จึงมีพื้นที่ \\frac{x²}{2} และมีมุมแบบเดียวกันถูกตัดออก 4 มุม`},{en:`Set up: (side)² − 4×(\\frac{x²}{2}) = remaining area. Substitute 16² and 224, then solve for x.`,th:`ตั้งสมการ: (ด้าน)² − 4×(\\frac{x²}{2}) = พื้นที่ที่เหลือ แทนค่า 16² และ 224 แล้วแก้หาค่า x`}],visual:{kind:`geometryFigure`,width:160,height:160,segments:[{x1:0,y1:0,x2:40,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:40,style:`dashed`},{x1:160,y1:0,x2:120,y2:0,style:`dashed`},{x1:160,y1:0,x2:160,y2:40,style:`dashed`},{x1:160,y1:160,x2:120,y2:160,style:`dashed`},{x1:160,y1:160,x2:160,y2:120,style:`dashed`},{x1:0,y1:160,x2:40,y2:160,style:`dashed`},{x1:0,y1:160,x2:0,y2:120,style:`dashed`}],polygons:[{points:[[40,0],[120,0],[160,40],[160,120],[120,160],[40,160],[0,120],[0,40]],fill:`shaded`}],labels:[{x:14,y:6,text:`x`},{x:5,y:24,text:`x`},{x:80,y:-6,text:`16 cm`,bold:!0},{x:80,y:82,text:`224 cm²`,bold:!0}],alt:{en:`A 16 cm square with a small right-triangle of legs x cut from each of the 4 corners, leaving a shaded octagon of area 224 square centimetres.`,th:`สี่เหลี่ยมจัตุรัสด้าน 16 ซม. ถูกตัดมุมทั้ง 4 มุมด้วยสามเหลี่ยมมุมฉากด้านประกอบมุมฉาก x เหลือเป็นรูปแปดเหลี่ยมแรเงาพื้นที่ 224 ตารางเซนติเมตร`}},estimatedSeconds:135},{id:`C-17`,testId:`samsen-mock-c`,number:17,skill:`Graphs & Data`,topic:{en:`Reading a Bar Chart`,th:`การอ่านกราฟแท่ง`},difficulty:I(17),prompt:{en:`The bar chart shows the number of units produced by Workshop A and Workshop B over 4 days. Which of the following statements is INCORRECT?`,th:`กราฟแท่งแสดงจำนวนชิ้นงานที่โรงงาน A และโรงงาน B ผลิตได้ในช่วง 4 วัน ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Workshop A's highest production day was Day 2.`,th:`วันที่โรงงาน A ผลิตได้มากที่สุดคือวันที่ 2`}},{id:`B`,label:{en:`Over the 4 days, the two workshops' totals were equal.`,th:`ตลอด 4 วัน ยอดผลิตรวมของโรงงานทั้งสองเท่ากัน`}},{id:`C`,label:{en:`Workshop B produced fewer units than Workshop A on Day 1.`,th:`วันที่ 1 โรงงาน B ผลิตได้น้อยกว่าโรงงาน A`}},{id:`D`,label:{en:`Workshop B produced more units than Workshop A on Day 3.`,th:`วันที่ 3 โรงงาน B ผลิตได้มากกว่าโรงงาน A`}}],correctOptionId:`C`,explanation:{en:`On Day 1, Workshop A made 45 units and Workshop B made 50 units — so B actually produced MORE than A, not fewer. Statement C is the incorrect one. (Check the others: A's max is 60 on Day 2 ✓; totals are both 190 ✓; on Day 3, B=65 > A=30 ✓.)`,th:`วันที่ 1 โรงงาน A ผลิตได้ 45 ชิ้น ส่วนโรงงาน B ผลิตได้ 50 ชิ้น ซึ่งหมายความว่า B ผลิตได้มากกว่า A ไม่ใช่น้อยกว่า ข้อความ C จึงไม่ถูกต้อง (ตรวจสอบข้ออื่น: A ผลิตสูงสุด 60 ในวันที่ 2 ✓ ยอดรวมทั้งสองโรงงานเท่ากันคือ 190 ✓ วันที่ 3 B=65 มากกว่า A=30 ✓)`},distractorNotes:{A:{en:`This statement is actually true (Workshop A's values are 45, 60, 30, 55 — the peak is 60 on Day 2). A student might misjudge bar heights visually and wrongly flag this as false.`,th:`ข้อความนี้เป็นจริง (ค่าของโรงงาน A คือ 45, 60, 30, 55 จุดสูงสุดคือ 60 ในวันที่ 2) นักเรียนอาจกะระดับแท่งกราฟผิดด้วยสายตาแล้วเข้าใจผิดว่าข้อความนี้ไม่ถูกต้อง`},B:{en:`This statement is actually true (both totals are 45+60+30+55=190 and 50+40+65+35=190). A student who mis-adds one of the totals might wrongly flag this as false.`,th:`ข้อความนี้เป็นจริง (ยอดรวมทั้งสองเท่ากันคือ 45+60+30+55=190 และ 50+40+65+35=190) นักเรียนที่บวกเลขผิดพลาดในข้อใดข้อหนึ่งอาจเข้าใจผิดว่าข้อความนี้ไม่ถูกต้อง`},D:{en:`This statement is actually true (Day 3: B=65, A=30, so B is indeed higher). A student who confuses which color/series belongs to which workshop might wrongly flag this as false.`,th:`ข้อความนี้เป็นจริง (วันที่ 3: B=65, A=30 ดังนั้น B สูงกว่าจริง) นักเรียนที่สับสนว่าสีใดแทนโรงงานใดอาจเข้าใจผิดว่าข้อความนี้ไม่ถูกต้อง`}},hints:[{en:`Check each statement against the chart one at a time — three are true and one is false.`,th:`ตรวจสอบข้อความแต่ละข้อกับกราฟทีละข้อ สามข้อเป็นจริงและหนึ่งข้อเป็นเท็จ`},{en:`Pay close attention to which bar (color) belongs to Workshop A and which belongs to Workshop B on each day.`,th:`สังเกตให้ดีว่าแท่งกราฟ (สี) ใดเป็นของโรงงาน A และสีใดเป็นของโรงงาน B ในแต่ละวัน`},{en:`Read the exact values for Day 1: Workshop A = 45, Workshop B = 50. Compare that to what statement C claims.`,th:`อ่านค่าที่แน่นอนของวันที่ 1: โรงงาน A = 45, โรงงาน B = 50 นำมาเทียบกับข้อความ C ว่าตรงกันหรือไม่`}],visual:{kind:`barChart`,categories:[`1`,`2`,`3`,`4`],series:[{name:{en:`Workshop A`,th:`โรงงาน A`},color:`coral`,values:[45,60,30,55]},{name:{en:`Workshop B`,th:`โรงงาน B`},color:`teal`,values:[50,40,65,35]}],yStep:10,yMax:70,alt:{en:`Grouped bar chart comparing units produced by Workshop A (coral) and Workshop B (teal) over Day 1 to Day 4.`,th:`กราฟแท่งเปรียบเทียบจำนวนชิ้นงานที่ผลิตโดยโรงงาน A (สีส้ม) และโรงงาน B (สีเขียวอมฟ้า) ตั้งแต่วันที่ 1 ถึงวันที่ 4`}},estimatedSeconds:150},{id:`C-18`,testId:`samsen-mock-c`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Chart Proportions`,th:`สัดส่วนแผนภูมิวงกลม`},difficulty:I(18),prompt:{en:`A city council surveyed residents on their favourite workshop activity at the community centre. The pie chart shows the results in degrees: Woodworking 120°, Robotics 90°, Sewing 90°, and Pottery 60°. If 45 residents chose Robotics, how many residents chose Woodworking?`,th:`เทศบาลสำรวจความคิดเห็นของผู้อยู่อาศัยเรื่องกิจกรรมเวิร์กช็อปที่ชื่นชอบที่สุดในศูนย์ชุมชน แผนภูมิวงกลมแสดงผลเป็นองศาดังนี้ งานไม้ 120° หุ่นยนต์ 90° งานเย็บปักถักร้อย 90° และงานปั้นดิน 60° ถ้ามีผู้เลือกหุ่นยนต์ 45 คน จะมีผู้เลือกงานไม้กี่คน`},options:[{id:`A`,label:{en:`60 residents`,th:`60 คน`}},{id:`B`,label:{en:`45 residents`,th:`45 คน`}},{id:`C`,label:{en:`30 residents`,th:`30 คน`}},{id:`D`,label:{en:`120 residents`,th:`120 คน`}}],correctOptionId:`A`,explanation:{en:`Robotics (90°) corresponds to 45 residents, so each degree represents 45 ÷ 90 = 0.5 residents. Woodworking (120°) therefore represents 120 × 0.5 = 60 residents.`,th:`หุ่นยนต์ (90°) มีผู้เลือก 45 คน ดังนั้น 1 องศา แทนคน 45 ÷ 90 = 0.5 คน งานไม้ (120°) จึงมีผู้เลือก 120 × 0.5 = 60 คน`},distractorNotes:{B:{en:`Wrongly assumes the residents are split equally among all 4 categories, using the total (180) divided by 4 = 45 for every slice.`,th:`เข้าใจผิดว่าผู้เลือกแบ่งเท่าๆ กันในทั้ง 4 หมวด จึงใช้ยอดรวม (180) หารด้วย 4 = 45 สำหรับทุกหมวด`},C:{en:`Reads the wrong row of the chart and reports Pottery's count (60° × 0.5 = 30) instead of Woodworking's.`,th:`อ่านแถวผิดในแผนภูมิ แล้วตอบจำนวนของงานปั้นดิน (60° × 0.5 = 30) แทนที่จะเป็นงานไม้`},D:{en:`Confuses the degree measurement itself with the number of residents, reporting 120 (Woodworking's degrees) directly as the answer.`,th:`สับสนระหว่างค่าองศากับจำนวนคน จึงตอบ 120 (องศาของงานไม้) เป็นคำตอบตรงๆ`}},hints:[{en:`You are given one category's degrees AND its number of people — use that to find a conversion rate.`,th:`โจทย์ให้ทั้งจำนวนองศาและจำนวนคนของหมวดหนึ่งมาแล้ว ใช้ข้อมูลนี้หาอัตราส่วนแปลงค่า`},{en:`Find how many residents 1 degree represents by dividing Robotics' residents (45) by Robotics' degrees (90).`,th:`หาว่า 1 องศา แทนคนกี่คน โดยนำจำนวนคนที่เลือกหุ่นยนต์ (45) หารด้วยจำนวนองศาของหุ่นยนต์ (90)`},{en:`Multiply that rate (residents per degree) by Woodworking's 120°.`,th:`นำอัตรานั้น (จำนวนคนต่อ 1 องศา) ไปคูณกับ 120° ของงานไม้`}],visual:{kind:`pieChart`,slices:[{label:`Wood`,degrees:120,color:`coral`},{label:`Robot`,degrees:90,color:`teal`},{label:`Sew`,degrees:90,color:`gold`},{label:`Pottery`,degrees:60,color:`sage`}],alt:{en:`Pie chart of favourite workshop activity: Woodworking 120 degrees, Robotics 90 degrees, Sewing 90 degrees, Pottery 60 degrees.`,th:`แผนภูมิวงกลมของกิจกรรมเวิร์กช็อปที่ชื่นชอบ: งานไม้ 120 องศา หุ่นยนต์ 90 องศา งานเย็บปักถักร้อย 90 องศา งานปั้นดิน 60 องศา`}},estimatedSeconds:140},{id:`C-19`,testId:`samsen-mock-c`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Profit and Markup`,th:`กำไรและการตั้งราคา`},difficulty:I(19),prompt:{en:`A hardware store buys a power drill for 1,200 baht. The owner marks up the price so as to make a 25% profit if it sells at the marked price. During a clearance sale, the drill is sold for 180 baht less than the marked price. What is the store's actual profit on this sale?`,th:`ร้านฮาร์ดแวร์ซื้อสว่านไฟฟ้ามาในราคา 1,200 บาท เจ้าของร้านตั้งราคาขายเพื่อให้ได้กำไร 25% หากขายในราคาที่ตั้งไว้ แต่ในช่วงลดราคาล้างสต็อก สว่านถูกขายในราคาต่ำกว่าราคาที่ตั้งไว้ 180 บาท ร้านได้กำไรจริงเท่าใดจากการขายครั้งนี้`},options:[{id:`A`,label:{en:`Profit of 120 baht`,th:`กำไร 120 บาท`}},{id:`B`,label:{en:`Loss of 120 baht`,th:`ขาดทุน 120 บาท`}},{id:`C`,label:{en:`Profit of 180 baht`,th:`กำไร 180 บาท`}},{id:`D`,label:{en:`Profit of 300 baht`,th:`กำไร 300 บาท`}}],correctOptionId:`A`,explanation:{en:`Marked price = 1,200 × 1.25 = 1,500 baht. Actual sale price = 1,500 − 180 = 1,320 baht. Profit = 1,320 − 1,200 = 120 baht.`,th:`ราคาที่ตั้งไว้ = 1,200 × 1.25 = 1,500 บาท ราคาขายจริง = 1,500 − 180 = 1,320 บาท กำไร = 1,320 − 1,200 = 120 บาท`},distractorNotes:{B:{en:`Calculates the correct magnitude (120) but gets the direction wrong, mistakenly calling it a loss even though the sale price (1,320) is still above the cost (1,200).`,th:`คำนวณขนาดถูกต้อง (120) แต่ทิศทางผิด เข้าใจผิดว่าเป็นการขาดทุน ทั้งที่ราคาขาย (1,320) ยังสูงกว่าต้นทุน (1,200)`},C:{en:`Mistakes the 180-baht markdown itself for the profit amount, without actually comparing the sale price to the cost.`,th:`เข้าใจผิดว่าส่วนลด 180 บาท คือกำไร โดยไม่ได้นำราคาขายจริงไปเทียบกับต้นทุน`},D:{en:`Uses the marked price (1,500) as if it were the actual sale price, forgetting to apply the 180-baht clearance discount: 1,500 − 1,200 = 300.`,th:`ใช้ราคาที่ตั้งไว้ (1,500) เสมือนเป็นราคาขายจริง โดยลืมหักส่วนลดล้างสต็อก 180 บาท: 1,500 − 1,200 = 300`}},hints:[{en:`This is a two-step problem: first find the marked price, then find the actual sale price.`,th:`โจทย์นี้มีสองขั้นตอน: หาราคาที่ตั้งไว้ก่อน แล้วจึงหาราคาขายจริง`},{en:`Marked price = cost + 25% of cost = cost × 1.25. The actual sale price is 180 baht less than that.`,th:`ราคาที่ตั้งไว้ = ต้นทุน + 25% ของต้นทุน = ต้นทุน × 1.25 ราคาขายจริงต่ำกว่าราคานี้อยู่ 180 บาท`},{en:`Compare the actual sale price to the original cost (1,200 baht) to find the real profit or loss.`,th:`นำราคาขายจริงไปเทียบกับต้นทุนเดิม (1,200 บาท) เพื่อหากำไรหรือขาดทุนที่แท้จริง`}],visual:null,estimatedSeconds:130},{id:`C-20`,testId:`samsen-mock-c`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Chained Percentages`,th:`ร้อยละต่อเนื่องกัน`},difficulty:I(20),prompt:{en:`Three site supervisors, Arun, Benz, and Chai, together oversee a total construction budget of 74,000 baht. Benz's budget is 150% of Arun's budget. Chai's budget is 80% of Benz's budget. How much is Chai's budget?`,th:`หัวหน้าไซต์งานสามคน คือ อรุณ เบนซ์ และชัย ดูแลงบประมาณก่อสร้างรวมกัน 74,000 บาท งบของเบนซ์เท่ากับ 150% ของงบอรุณ งบของชัยเท่ากับ 80% ของงบเบนซ์ งบประมาณของชัยเป็นเท่าใด`},options:[{id:`A`,label:{en:`30,000 baht`,th:`30,000 บาท`}},{id:`B`,label:{en:`16,000 baht`,th:`16,000 บาท`}},{id:`C`,label:{en:`20,000 baht`,th:`20,000 บาท`}},{id:`D`,label:{en:`24,000 baht`,th:`24,000 บาท`}}],correctOptionId:`D`,explanation:{en:`Let Arun's budget = a. Benz = 1.5a, and Chai = 0.8 × 1.5a = 1.2a. The sum: a + 1.5a + 1.2a = 3.7a = 74,000, so a = 20,000. Benz = 30,000 and Chai = 1.2 × 20,000 = 24,000 baht. (Check: 20,000 + 30,000 + 24,000 = 74,000 ✓)`,th:`ให้งบของอรุณ = a งบของเบนซ์ = 1.5a และงบของชัย = 0.8 × 1.5a = 1.2a ผลรวม: a + 1.5a + 1.2a = 3.7a = 74,000 จะได้ a = 20,000 เบนซ์ = 30,000 และชัย = 1.2 × 20,000 = 24,000 บาท (ตรวจสอบ: 20,000 + 30,000 + 24,000 = 74,000 ✓)`},distractorNotes:{A:{en:`Correctly finds Benz's budget (30,000 baht) but stops one step early, reporting it instead of continuing on to find Chai's budget.`,th:`หางบของเบนซ์ได้ถูกต้อง (30,000 บาท) แต่หยุดก่อนครบขั้นตอน ตอบค่านี้แทนที่จะคำนวณต่อไปหางบของชัย`},B:{en:`Mistakenly computes Chai's budget as 80% of Arun's budget instead of 80% of Benz's: 0.8 × 20,000 = 16,000.`,th:`คำนวณงบของชัยผิดเป็น 80% ของงบอรุณ แทนที่จะเป็น 80% ของงบเบนซ์: 0.8 × 20,000 = 16,000`},C:{en:`Reports Arun's budget instead of Chai's, mixing up which person the question is asking about.`,th:`ตอบงบของอรุณแทนที่จะเป็นงบของชัย สับสนว่าโจทย์ถามงบของใคร`}},hints:[{en:`Express all three budgets in terms of a single variable, using Arun's budget as the base.`,th:`เขียนงบทั้งสามคนให้อยู่ในรูปตัวแปรเดียวกัน โดยใช้งบของอรุณเป็นฐาน`},{en:`If Arun = a, then Benz = 1.5a. Chai's budget is 80% of BENZ'S budget (not Arun's), so Chai = 0.8 × 1.5a.`,th:`ถ้าอรุณ = a เบนซ์ = 1.5a งบของชัยเป็น 80% ของงบเบนซ์ (ไม่ใช่ของอรุณ) ดังนั้นชัย = 0.8 × 1.5a`},{en:`Add all three expressions together, set the sum equal to 74,000, solve for a, then substitute back to find Chai's budget.`,th:`นำนิพจน์ทั้งสามมาบวกกัน ให้ผลรวมเท่ากับ 74,000 แก้หาค่า a แล้วแทนกลับเพื่อหางบของชัย`}],visual:null,estimatedSeconds:160}]},{id:`samsen-mock-d`,title:{en:`Mock Test D`,th:`ข้อสอบชุด D`},subtitle:{en:`Science & Hobby Paper`,th:`ชุดวิทยาศาสตร์และงานอดิเรก`},recommendedMinutes:40,questions:[{id:`D-01`,testId:`samsen-mock-d`,number:1,skill:`Number & Operations`,topic:{en:`Digit Arrangement`,th:`การจัดเรียงตัวเลข`},difficulty:`Easy`,prompt:{en:`Using each of the digit cards 0, 3, 5, 7, and 8 at most once, what is the largest possible 4-digit EVEN number you can form?`,th:`ถ้ามีบัตรตัวเลข 0, 3, 5, 7 และ 8 อย่างละ 1 ใบ นำมาเรียงเป็นจำนวน 4 หลักโดยใช้แต่ละหลักไม่เกิน 1 ครั้ง จำนวนคู่ที่มีค่ามากที่สุดที่เรียงได้คือข้อใด`},options:[{id:`A`,label:{en:`8,750`,th:`8,750`}},{id:`B`,label:{en:`8,753`,th:`8,753`}},{id:`C`,label:{en:`7,538`,th:`7,538`}},{id:`D`,label:{en:`8,570`,th:`8,570`}}],correctOptionId:`A`,explanation:{en:`For the number to be even, the last digit must be 0 or 8. Using 0 last lets the first three digits be the largest remaining ones, 8, 7, 5, giving 8750, which beats using 8 last (7538). So the answer is 8,750.`,th:`จำนวนจะเป็นจำนวนคู่ได้ก็ต่อเมื่อหลักหน่วยเป็น 0 หรือ 8 เท่านั้น ถ้าให้หลักหน่วยเป็น 0 จะสามารถนำเลขที่เหลือที่มากที่สุดสามตัวคือ 8, 7, 5 มาเรียงไว้ข้างหน้าได้เป็น 8750 ซึ่งมากกว่ากรณีให้หลักหน่วยเป็น 8 (ได้ 7538) ดังนั้นคำตอบคือ 8,750`},distractorNotes:{B:{en:`This is the largest 4-digit number using the digits, but it ends in 3 (odd) — the even requirement was ignored.`,th:`8,753 เป็นจำนวน 4 หลักที่มากที่สุดจากตัวเลขที่มี แต่ลงท้ายด้วย 3 ซึ่งเป็นเลขคี่ — ลืมเงื่อนไขว่าต้องเป็นจำนวนคู่`},C:{en:`This assumes 8 must be the last digit, then arranges the rest in descending order — but placing 0 last actually gives a larger number.`,th:`สมมติว่าต้องใช้ 8 เป็นหลักหน่วยแล้วเรียงเลขที่เหลือจากมากไปน้อย แต่จริง ๆ แล้วการให้ 0 เป็นหลักหน่วยจะได้จำนวนที่มากกว่า`},D:{en:`The correct digits were chosen (8, 7, 5, 0) but arranged out of descending order.`,th:`เลือกตัวเลขถูกต้อง (8, 7, 5, 0) แต่เรียงลำดับผิด ไม่ได้เรียงจากมากไปน้อย`}},hints:[{en:`Think about what digit an even number must end in.`,th:`ลองคิดดูว่าจำนวนคู่ต้องลงท้ายด้วยเลขอะไร`},{en:`Among the digits given, only 0 and 8 can be the last digit of an even number.`,th:`ในบรรดาตัวเลขที่ให้มา มีเพียง 0 และ 8 เท่านั้นที่เป็นหลักหน่วยของจำนวนคู่ได้`},{en:`Try both cases — last digit 0, and last digit 8 — arrange the rest in descending order each time, then compare.`,th:`ลองทั้งสองกรณี คือ หลักหน่วยเป็น 0 และหลักหน่วยเป็น 8 แล้วเรียงเลขที่เหลือจากมากไปน้อยในแต่ละกรณี จากนั้นเปรียบเทียบกัน`}],visual:null,estimatedSeconds:50},{id:`D-02`,testId:`samsen-mock-d`,number:2,skill:`Word Problems & Logic`,topic:{en:`Price & Quantity Puzzle`,th:`โจทย์ราคาและจำนวน`},difficulty:`Easy`,prompt:{en:`Ploy has saved enough money to buy science-fair poster boards at 8 baht each, with 14 baht left over. If the boards had cost 6 baht each instead, she could have bought 5 more boards and still had 2 baht left over. How much money has Ploy saved?`,th:`พลอยมีเงินเก็บพอซื้อกระดาษป้ายนิทรรศการวิทยาศาสตร์ราคาแผ่นละ 8 บาท โดยเหลือเงิน 14 บาท แต่ถ้ากระดาษราคาแผ่นละ 6 บาท เธอจะซื้อได้เพิ่มอีก 5 แผ่น และยังเหลือเงิน 2 บาท พลอยมีเงินเก็บทั้งหมดกี่บาท`},options:[{id:`A`,label:{en:`78 baht`,th:`78 บาท`}},{id:`B`,label:{en:`86 baht`,th:`86 บาท`}},{id:`C`,label:{en:`84 baht`,th:`84 บาท`}},{id:`D`,label:{en:`72 baht`,th:`72 บาท`}}],correctOptionId:`B`,explanation:{en:`Let N be the number of boards bought at 8 baht. Money = 8N + 14. At 6 baht each she buys N+5 boards: Money = 6(N+5) + 2 = 6N + 32. Setting these equal: 8N + 14 = 6N + 32, so 2N = 18, N = 9. Money = 8(9) + 14 = 86 baht.`,th:`ให้ N เป็นจำนวนแผ่นที่ซื้อได้เมื่อราคาแผ่นละ 8 บาท จะได้เงินทั้งหมด = 8N + 14 เมื่อราคาแผ่นละ 6 บาท จะซื้อได้ N+5 แผ่น เงินทั้งหมด = 6(N+5) + 2 = 6N + 32 นำสองสมการมาเท่ากัน: 8N + 14 = 6N + 32 ได้ 2N = 18 ดังนั้น N = 9 เงินทั้งหมด = 8(9) + 14 = 86 บาท`},distractorNotes:{A:{en:`This comes from an arithmetic slip while solving the equation, leading to the wrong value of N.`,th:`เกิดจากความผิดพลาดในการคำนวณขณะแก้สมการ ทำให้ได้ค่า N ผิด`},C:{en:`This only multiplies 6 baht by the new quantity (14 boards) without adding back the 2 baht left over.`,th:`คำนวณเพียง 6 คูณจำนวนแผ่นใหม่ (14 แผ่น) โดยลืมบวกเงินที่เหลือ 2 บาทกลับเข้าไป`},D:{en:`This only multiplies 8 baht by the original quantity (9 boards) without adding back the 14 baht left over.`,th:`คำนวณเพียง 8 คูณจำนวนแผ่นเดิม (9 แผ่น) โดยลืมบวกเงินที่เหลือ 14 บาทกลับเข้าไป`}},hints:[{en:`Let N be the number of boards Ploy can buy at 8 baht each, and write her total money in terms of N.`,th:`ให้ N เป็นจำนวนแผ่นที่พลอยซื้อได้เมื่อราคาแผ่นละ 8 บาท แล้วเขียนเงินทั้งหมดในรูปของ N`},{en:`At the lower price she buys N+5 boards — write a second expression for the same total money.`,th:`เมื่อราคาถูกลง เธอซื้อได้ N+5 แผ่น — เขียนเงินทั้งหมดอีกสมการหนึ่งในรูปเดียวกัน`},{en:`Set the two money expressions equal to each other and solve for N, then substitute back to find the total money.`,th:`ให้สมการเงินทั้งสองเท่ากัน แก้หาค่า N แล้วแทนกลับเพื่อหาจำนวนเงินทั้งหมด`}],visual:null,estimatedSeconds:65},{id:`D-03`,testId:`samsen-mock-d`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:`Easy`,prompt:{en:`Arrange these fractions from largest to smallest: \frac{3}{4}, \frac{5}{8}, \frac{7}{12}, \frac{2}{3}, \frac{5}{6}, \frac{4}{9}, \frac{7}{10}. Which fraction is the 4th largest?`,th:`เรียงเศษส่วนต่อไปนี้จากมากไปน้อย: \frac{3}{4}, \frac{5}{8}, \frac{7}{12}, \frac{2}{3}, \frac{5}{6}, \frac{4}{9}, \frac{7}{10} เศษส่วนใดมีค่ามากเป็นอันดับที่ 4`},options:[{id:`A`,label:{en:`\frac{5}{8}`,th:`\frac{5}{8}`}},{id:`B`,label:{en:`\frac{4}{9}`,th:`\frac{4}{9}`}},{id:`C`,label:{en:`\frac{2}{3}`,th:`\frac{2}{3}`}},{id:`D`,label:{en:`\frac{7}{10}`,th:`\frac{7}{10}`}}],correctOptionId:`C`,explanation:{en:`Converting to decimals: \frac{5}{6}≈0.833, \frac{3}{4}=0.75, \frac{7}{10}=0.7, \frac{2}{3}≈0.667, \frac{5}{8}=0.625, \frac{7}{12}≈0.583, \frac{4}{9}≈0.444. Ordered largest to smallest: \frac{5}{6}, \frac{3}{4}, \frac{7}{10}, \frac{2}{3}, \frac{5}{8}, \frac{7}{12}, \frac{4}{9}. The 4th largest is \frac{2}{3}.`,th:`แปลงเป็นทศนิยม: \frac{5}{6}≈0.833, \frac{3}{4}=0.75, \frac{7}{10}=0.7, \frac{2}{3}≈0.667, \frac{5}{8}=0.625, \frac{7}{12}≈0.583, \frac{4}{9}≈0.444 เรียงจากมากไปน้อยได้: \frac{5}{6}, \frac{3}{4}, \frac{7}{10}, \frac{2}{3}, \frac{5}{8}, \frac{7}{12}, \frac{4}{9} ดังนั้นอันดับที่ 4 คือ \frac{2}{3}`},distractorNotes:{A:{en:`\frac{5}{8} is actually the 5th largest, one rank too low.`,th:`\frac{5}{8} จริง ๆ แล้วอยู่อันดับที่ 5 ซึ่งต่ำกว่าที่โจทย์ถามไปหนึ่งอันดับ`},B:{en:`\frac{4}{9} is the smallest of all seven fractions, not the 4th largest.`,th:`\frac{4}{9} เป็นเศษส่วนที่มีค่าน้อยที่สุดในทั้งเจ็ดจำนวน ไม่ใช่อันดับที่ 4`},D:{en:`\frac{7}{10} is actually the 3rd largest, one rank too high.`,th:`\frac{7}{10} จริง ๆ แล้วอยู่อันดับที่ 3 ซึ่งสูงกว่าที่โจทย์ถามไปหนึ่งอันดับ`}},hints:[{en:`Convert every fraction to a decimal so they are easy to compare.`,th:`แปลงเศษส่วนทุกตัวเป็นทศนิยมเพื่อให้เปรียบเทียบได้ง่าย`},{en:`Line the decimals up from largest to smallest before counting ranks.`,th:`เรียงทศนิยมจากมากไปน้อยก่อน แล้วค่อยนับอันดับ`},{en:`After ordering, count carefully: 1st, 2nd, 3rd, 4th — double-check you have not shifted by one place.`,th:`หลังจากเรียงแล้ว นับอันดับอย่างละเอียด 1, 2, 3, 4 — ตรวจสอบว่าไม่ได้เลื่อนอันดับผิดไปหนึ่งตำแหน่ง`}],visual:null,estimatedSeconds:55},{id:`D-04`,testId:`samsen-mock-d`,number:4,skill:`Number & Operations`,topic:{en:`Mixed Operations with Brackets`,th:`การดำเนินการผสมและวงเล็บ`},difficulty:`Easy`,prompt:{en:`A = (7 + 3) × 4 − 15 and B = (20 ÷ 4 + 3) × 2 − 6. Find the value of 2 × (A ÷ B).`,th:`กำหนดให้ A = (7 + 3) × 4 − 15 และ B = (20 ÷ 4 + 3) × 2 − 6 จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`2.5`,th:`2.5`}},{id:`B`,label:{en:`0.8`,th:`0.8`}},{id:`C`,label:{en:`8`,th:`8`}},{id:`D`,label:{en:`5`,th:`5`}}],correctOptionId:`D`,explanation:{en:`A = (7+3)×4−15 = 10×4−15 = 40−15 = 25. B = (20÷4+3)×2−6 = (5+3)×2−6 = 8×2−6 = 16−6 = 10. So 2×(A÷B) = 2×(25÷10) = 2×2.5 = 5.`,th:`A = (7+3)×4−15 = 10×4−15 = 40−15 = 25 และ B = (20÷4+3)×2−6 = (5+3)×2−6 = 8×2−6 = 16−6 = 10 ดังนั้น 2×(A÷B) = 2×(25÷10) = 2×2.5 = 5`},distractorNotes:{A:{en:`This is just A÷B (2.5) — the final multiplication by 2 was forgotten.`,th:`นี่คือค่า A÷B (2.5) เพียงอย่างเดียว — ลืมคูณด้วย 2 ในขั้นตอนสุดท้าย`},B:{en:`This comes from computing 2×(B÷A) — the fractions A and B were swapped.`,th:`ได้จากการคำนวณ 2×(B÷A) — สลับตำแหน่งของ A และ B กัน`},C:{en:`This comes from using A = 40 (forgetting to subtract 15), giving 2×(40÷10) = 8.`,th:`ได้จากการใช้ A = 40 (ลืมลบ 15 ออก) ทำให้ได้ 2×(40÷10) = 8`}},hints:[{en:`Work out A and B separately first, following the order of operations inside each bracket.`,th:`หาค่า A และ B แยกกันก่อน โดยทำตามลำดับการดำเนินการในวงเล็บแต่ละอัน`},{en:`Remember: brackets first, then multiplication/division, then addition/subtraction.`,th:`จำไว้ว่า ทำในวงเล็บก่อน แล้วจึงคูณหรือหาร จากนั้นจึงบวกหรือลบ`},{en:`Once you have A = 25 and B = 10, compute A ÷ B first, then multiply the result by 2.`,th:`เมื่อได้ A = 25 และ B = 10 แล้ว ให้หาค่า A ÷ B ก่อน แล้วจึงนำผลลัพธ์ไปคูณด้วย 2`}],visual:null,estimatedSeconds:60},{id:`D-05`,testId:`samsen-mock-d`,number:5,skill:`Number & Operations`,topic:{en:`Division with Remainder`,th:`การหารที่มีเศษ`},difficulty:`Easy`,prompt:{en:`At a school science fair, two display boxes together hold 58 rock samples. The number of rocks in the larger box, divided by the number in the smaller box, gives a quotient of 3 and a remainder of 6. Find the product of the numbers of rocks in the two boxes.`,th:`ในงานนิทรรศการวิทยาศาสตร์ กล่องแสดงหินตัวอย่างสองกล่องมีหินรวมกัน 58 ก้อน เมื่อนำจำนวนหินในกล่องที่มีมากกว่าไปหารด้วยจำนวนหินในกล่องที่มีน้อยกว่า จะได้ผลหาร 3 เศษ 6 จงหาผลคูณของจำนวนหินในกล่องทั้งสอง`},options:[{id:`A`,label:{en:`585`,th:`585`}},{id:`B`,label:{en:`495`,th:`495`}},{id:`C`,label:{en:`58`,th:`58`}},{id:`D`,label:{en:`32`,th:`32`}}],correctOptionId:`A`,explanation:{en:`Let the smaller box have b rocks; the larger has a = 3b + 6. Since a + b = 58: 3b + 6 + b = 58, so 4b = 52, b = 13, and a = 45. Check: 45 ÷ 13 = 3 remainder 6. The product is 13 × 45 = 585.`,th:`ให้กล่องที่มีน้อยกว่ามีหิน b ก้อน กล่องที่มีมากกว่ามี a = 3b + 6 ก้อน เนื่องจาก a + b = 58 จะได้ 3b + 6 + b = 58 ดังนั้น 4b = 52 นั่นคือ b = 13 และ a = 45 ตรวจสอบ: 45 ÷ 13 = 3 เศษ 6 ผลคูณคือ 13 × 45 = 585`},distractorNotes:{B:{en:`This comes from a multiplication slip when working out 45 × 13, such as adding 450 + 45 instead of 450 + 135.`,th:`เกิดจากการคูณผิดพลาดตอนหา 45 × 13 เช่น บวก 450 + 45 แทนที่จะเป็น 450 + 135`},C:{en:`This is just the total number of rocks (58), not the product of the two amounts.`,th:`นี่คือจำนวนหินรวมทั้งหมด (58) เท่านั้น ไม่ใช่ผลคูณของจำนวนหินทั้งสองกล่อง`},D:{en:`This is the difference between the two amounts (45 − 13 = 32), not their product.`,th:`นี่คือผลต่างระหว่างจำนวนหินทั้งสองกล่อง (45 − 13 = 32) ไม่ใช่ผลคูณ`}},hints:[{en:`Let the smaller box hold b rocks, and write the larger box in terms of b using the quotient and remainder.`,th:`ให้กล่องที่มีน้อยกว่ามีหิน b ก้อน แล้วเขียนจำนวนหินในกล่องที่มากกว่าในรูปของ b โดยใช้ผลหารและเศษ`},{en:`A division with quotient 3 and remainder 6 means: larger = 3 × smaller + 6.`,th:`การหารที่ได้ผลหาร 3 เศษ 6 หมายความว่า จำนวนที่มากกว่า = 3 × จำนวนที่น้อยกว่า + 6`},{en:`Substitute this into the sum equation (a + b = 58) to find b and a, then multiply them together.`,th:`แทนค่านี้ลงในสมการผลรวม (a + b = 58) เพื่อหา b และ a จากนั้นนำมาคูณกัน`}],visual:null,estimatedSeconds:70},{id:`D-06`,testId:`samsen-mock-d`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing Number Patterns`,th:`แบบรูปที่เพิ่มขึ้น`},difficulty:`Medium`,prompt:{en:`The picture shows Figure 3 of a growing pattern of shaded squares. Each new figure adds one more row than the row before it: Figure 1 has 1 square, Figure 2 has 3 squares, and Figure 3 (shown) has 6 squares. How many squares will Figure 8 have?`,th:`ภาพแสดงรูปที่ 3 ของแบบรูปสี่เหลี่ยมแรเงาที่เพิ่มขึ้นเรื่อย ๆ โดยแต่ละรูปใหม่จะเพิ่มแถวที่มีจำนวนสี่เหลี่ยมมากกว่าแถวก่อนหน้าอยู่ 1 ช่อง: รูปที่ 1 มี 1 ช่อง รูปที่ 2 มี 3 ช่อง และรูปที่ 3 (ในภาพ) มี 6 ช่อง รูปที่ 8 จะมีสี่เหลี่ยมกี่ช่อง`},options:[{id:`A`,label:{en:`21`,th:`21`}},{id:`B`,label:{en:`36`,th:`36`}},{id:`C`,label:{en:`28`,th:`28`}},{id:`D`,label:{en:`45`,th:`45`}}],correctOptionId:`B`,explanation:{en:`This is the pattern of triangular numbers: Figure n has n(n+1)/2 squares (1, 3, 6, 10, 15, 21, 28, 36, ...). Figure 8 has 8×\frac{9}{2} = 36 squares.`,th:`แบบรูปนี้คือจำนวนสามเหลี่ยม โดยรูปที่ n จะมีจำนวนช่อง n(n+1)/2 (คือ 1, 3, 6, 10, 15, 21, 28, 36, ...) ดังนั้นรูปที่ 8 จะมี 8×\frac{9}{2} = 36 ช่อง`},distractorNotes:{A:{en:`This assumes the pattern grows by a constant 3 squares each time (from Figure 3's value), giving 6 + 3×5 = 21, but the growth amount itself increases each time.`,th:`สมมติผิดว่าแบบรูปเพิ่มขึ้นครั้งละ 3 ช่องคงที่ (จากค่าของรูปที่ 3) จึงได้ 6 + 3×5 = 21 แต่จริง ๆ แล้วจำนวนที่เพิ่มขึ้นในแต่ละครั้งไม่คงที่`},C:{en:`28 is the count for Figure 7, one figure too early.`,th:`28 คือจำนวนช่องของรูปที่ 7 ซึ่งเร็วไปหนึ่งรูป`},D:{en:`45 is the count for Figure 9, one figure too late.`,th:`45 คือจำนวนช่องของรูปที่ 9 ซึ่งช้าไปหนึ่งรูป`}},hints:[{en:`Look at how many squares are added each time you move to the next figure.`,th:`สังเกตว่าจำนวนช่องที่เพิ่มขึ้นในแต่ละรูปถัดไปเป็นเท่าไร`},{en:`The number of squares added each time itself increases by 1 (add 2, then add 3, then add 4, ...).`,th:`จำนวนที่เพิ่มขึ้นในแต่ละครั้งเองก็เพิ่มขึ้นทีละ 1 (เพิ่ม 2 แล้วเพิ่ม 3 แล้วเพิ่ม 4 ...)`},{en:`Continue the sequence 1, 3, 6, 10, 15, ... up to the 8th term, or use the formula n(n+1)/2 with n = 8.`,th:`ไล่ลำดับ 1, 3, 6, 10, 15, ... ต่อไปจนถึงพจน์ที่ 8 หรือใช้สูตร n(n+1)/2 แทน n = 8`}],visual:{kind:`gridPattern`,gridSize:3,cells:[{row:0,col:0},{row:1,col:0},{row:1,col:1},{row:2,col:0},{row:2,col:1},{row:2,col:2}],alt:{en:`Figure 3 of the growing triangular pattern, showing 6 shaded squares arranged in three rows of 1, 2, and 3 squares.`,th:`รูปที่ 3 ของแบบรูปสามเหลี่ยมที่เพิ่มขึ้น แสดงสี่เหลี่ยมแรเงา 6 ช่อง เรียงเป็นสามแถว แถวละ 1, 2 และ 3 ช่อง`}},estimatedSeconds:70},{id:`D-07`,testId:`samsen-mock-d`,number:7,skill:`Word Problems & Logic`,topic:{en:`Speed, Distance & Time`,th:`อัตราเร็ว ระยะทาง และเวลา`},difficulty:`Medium`,prompt:{en:`Gift starts jogging along a straight trail at 150 m/min. Four minutes later, her friend Ann starts jogging from the same point along the same trail at 210 m/min to catch up with her. How far from the starting point will Ann be when she catches up with Gift?`,th:`กิฟท์เริ่มวิ่งจ๊อกกิ้งไปตามเส้นทางตรงด้วยความเร็ว 150 เมตรต่อนาที ผ่านไป 4 นาที แอนเพื่อนของเธอเริ่มวิ่งจากจุดเดียวกันไปตามเส้นทางเดียวกันด้วยความเร็ว 210 เมตรต่อนาทีเพื่อวิ่งไล่ตามให้ทัน แอนจะอยู่ห่างจากจุดเริ่มต้นกี่เมตรตอนที่ไล่ทันกิฟท์`},options:[{id:`A`,label:{en:`840 m`,th:`840 เมตร`}},{id:`B`,label:{en:`600 m`,th:`600 เมตร`}},{id:`C`,label:{en:`2,100 m`,th:`2,100 เมตร`}},{id:`D`,label:{en:`1,500 m`,th:`1,500 เมตร`}}],correctOptionId:`C`,explanation:{en:`Gift's head start distance = 150 × 4 = 600 m. Ann closes this gap at a relative speed of 210 − 150 = 60 m/min, taking 600 ÷ 60 = 10 minutes. In that time Ann travels 210 × 10 = 2,100 m from the start.`,th:`ระยะที่กิฟท์วิ่งนำไปก่อน = 150 × 4 = 600 เมตร แอนไล่ตามทันด้วยอัตราเร็วสัมพัทธ์ 210 − 150 = 60 เมตรต่อนาที ใช้เวลา 600 ÷ 60 = 10 นาที ในเวลานั้นแอนวิ่งไปได้ 210 × 10 = 2,100 เมตรจากจุดเริ่มต้น`},distractorNotes:{A:{en:`This mistakenly multiplies Ann's speed by the 4-minute head start time instead of finding the actual catch-up time.`,th:`นำความเร็วของแอนไปคูณกับเวลาที่กิฟท์ออกตัวก่อน 4 นาทีโดยผิดพลาด แทนที่จะหาเวลาไล่ทันจริง`},B:{en:`This stops after finding only the head-start distance and gives it as the final answer, without working out the catch-up.`,th:`หยุดคำนวณแค่ระยะที่กิฟท์วิ่งนำไปก่อนแล้วตอบเป็นคำตอบสุดท้ายเลย โดยไม่ได้คำนวณระยะไล่ทันต่อ`},D:{en:`This uses the correct 10-minute catch-up time but multiplies by Gift's speed (150) instead of Ann's speed (210).`,th:`ใช้เวลาไล่ทัน 10 นาทีถูกต้อง แต่คูณด้วยความเร็วของกิฟท์ (150) แทนที่จะเป็นความเร็วของแอน (210)`}},hints:[{en:`First find how far ahead Gift already is when Ann starts running.`,th:`หาก่อนว่ากิฟท์วิ่งนำไปไกลแค่ไหนแล้วตอนที่แอนเริ่มวิ่ง`},{en:`Ann gains on Gift at a rate equal to the difference in their speeds each minute.`,th:`แอนไล่ตามกิฟท์ทันขึ้นในอัตราเท่ากับผลต่างของความเร็วทั้งสองในแต่ละนาที`},{en:`Divide the head-start distance by the speed difference to get the catch-up time, then multiply that time by Ann's own speed.`,th:`นำระยะที่กิฟท์นำไปก่อนหารด้วยผลต่างความเร็ว จะได้เวลาไล่ทัน แล้วนำเวลานั้นไปคูณกับความเร็วของแอนเอง`}],visual:null,estimatedSeconds:90},{id:`D-08`,testId:`samsen-mock-d`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing in a Ratio`,th:`การแบ่งตามอัตราส่วน`},difficulty:`Medium`,prompt:{en:`Beam, Kwang, and Fai shared a budget for the school science fair in the ratio 3 : 4 : 5. Fai received 300 baht more than Beam. Kwang then spent his share buying magnifying glasses at 45 baht each. How many magnifying glasses could Kwang buy, and how much money was left over?`,th:`บีม กวาง และฝ้าย แบ่งงบประมาณสำหรับงานนิทรรศการวิทยาศาสตร์ตามอัตราส่วน 3 : 4 : 5 ฝ้ายได้รับเงินมากกว่าบีมอยู่ 300 บาท จากนั้นกวางนำเงินส่วนของตนไปซื้อแว่นขยายราคาชิ้นละ 45 บาท กวางซื้อแว่นขยายได้กี่ชิ้น และเหลือเงินเท่าไร`},options:[{id:`A`,label:{en:`10 magnifying glasses, with 0 baht left over`,th:`แว่นขยาย 10 ชิ้น เหลือเงิน 0 บาท`}},{id:`B`,label:{en:`16 magnifying glasses, with 30 baht left over`,th:`แว่นขยาย 16 ชิ้น เหลือเงิน 30 บาท`}},{id:`C`,label:{en:`26 magnifying glasses, with 30 baht left over`,th:`แว่นขยาย 26 ชิ้น เหลือเงิน 30 บาท`}},{id:`D`,label:{en:`13 magnifying glasses, with 15 baht left over`,th:`แว่นขยาย 13 ชิ้น เหลือเงิน 15 บาท`}}],correctOptionId:`D`,explanation:{en:`Fai − Beam = 5 parts − 3 parts = 2 parts = 300 baht, so 1 part = 150 baht. Kwang's share = 4 parts = 4 × 150 = 600 baht. 600 ÷ 45 = 13 remainder 15, so Kwang can buy 13 magnifying glasses with 15 baht left over.`,th:`ฝ้าย − บีม = 5 ส่วน − 3 ส่วน = 2 ส่วน = 300 บาท ดังนั้น 1 ส่วน = 150 บาท เงินส่วนของกวาง = 4 ส่วน = 4 × 150 = 600 บาท นำ 600 ÷ 45 = 13 เศษ 15 ดังนั้นกวางซื้อแว่นขยายได้ 13 ชิ้น เหลือเงิน 15 บาท`},distractorNotes:{A:{en:`This uses Beam's share (3 parts = 450 baht) instead of Kwang's share.`,th:`ใช้ส่วนของบีม (3 ส่วน = 450 บาท) แทนที่จะเป็นส่วนของกวาง`},B:{en:`This uses Fai's share (5 parts = 750 baht) instead of Kwang's share.`,th:`ใช้ส่วนของฝ้าย (5 ส่วน = 750 บาท) แทนที่จะเป็นส่วนของกวาง`},C:{en:`This treats the 300-baht difference as equal to 1 ratio part instead of 2 parts, making Kwang's share too large (4 × 300 = 1,200 baht).`,th:`เข้าใจผิดว่าผลต่าง 300 บาทเท่ากับ 1 ส่วนของอัตราส่วน แทนที่จะเป็น 2 ส่วน ทำให้คำนวณเงินของกวางมากเกินไป (4 × 300 = 1,200 บาท)`}},hints:[{en:`Work out how many ratio parts separate Fai and Beam, and what one part is worth in baht.`,th:`หาว่าฝ้ายกับบีมห่างกันกี่ส่วนของอัตราส่วน แล้วหาว่า 1 ส่วนมีค่ากี่บาท`},{en:`Fai has 5 parts and Beam has 3 parts, so the gap between them is 2 parts, not 1.`,th:`ฝ้ายมี 5 ส่วน บีมมี 3 ส่วน ดังนั้นผลต่างระหว่างทั้งสองคือ 2 ส่วน ไม่ใช่ 1 ส่วน`},{en:`Once you know the baht value of 1 part, find Kwang's share (4 parts), then divide by 45 to see how many magnifying glasses he can buy and what remains.`,th:`เมื่อรู้ค่าของ 1 ส่วนเป็นบาทแล้ว หาส่วนของกวาง (4 ส่วน) แล้วนำไปหารด้วย 45 เพื่อดูว่าซื้อแว่นขยายได้กี่ชิ้นและเหลือเงินเท่าไร`}],visual:null,estimatedSeconds:85},{id:`D-09`,testId:`samsen-mock-d`,number:9,skill:`Geometry & Angles`,topic:{en:`Angles Between Parallel Lines`,th:`มุมระหว่างเส้นขนาน`},difficulty:`Medium`,prompt:{en:`In the figure, lines l₁ and l₂ are parallel. A bent path starts at point A on l₁, bends at point C between the two lines, and ends at point B on l₂. The angle between l₁ and AC is 38°, and the angle between l₂ and BC is 47°. Find the size of angle ACB (marked x).`,th:`จากรูป เส้น l₁ และ l₂ ขนานกัน มีเส้นหักมุมเริ่มจากจุด A บน l₁ หักมุมที่จุด C ซึ่งอยู่ระหว่างเส้นทั้งสอง แล้วไปสิ้นสุดที่จุด B บน l₂ มุมระหว่าง l₁ กับ AC เท่ากับ 38° และมุมระหว่าง l₂ กับ BC เท่ากับ 47° จงหาขนาดของมุม ACB (มุม x)`},options:[{id:`A`,label:{en:`85°`,th:`85°`}},{id:`B`,label:{en:`9°`,th:`9°`}},{id:`C`,label:{en:`95°`,th:`95°`}},{id:`D`,label:{en:`142°`,th:`142°`}}],correctOptionId:`A`,explanation:{en:`Draw an auxiliary line through C parallel to l₁ and l₂. By alternate angles, this splits angle ACB into two parts equal to the two given angles: 38° and 47°. So angle ACB = 38° + 47° = 85°.`,th:`ลากเส้นเสริมผ่านจุด C ให้ขนานกับ l₁ และ l₂ โดยใช้สมบัติมุมแย้ง เส้นเสริมนี้จะแบ่งมุม ACB ออกเป็นสองส่วนเท่ากับมุมที่กำหนดให้ทั้งสองมุม คือ 38° และ 47° ดังนั้นมุม ACB = 38° + 47° = 85°`},distractorNotes:{B:{en:`This subtracts the two given angles (47° − 38°) instead of adding them.`,th:`นำมุมทั้งสองมาลบกัน (47° − 38°) แทนที่จะบวกกัน`},C:{en:`This takes the supplement of the correct answer (180° − 85°) instead of the angle itself.`,th:`หาส่วนเติมเต็ม 180 องศาของคำตอบที่ถูกต้อง (180° − 85°) แทนที่จะเป็นมุมนั้นโดยตรง`},D:{en:`This finds the supplement of only one given angle (180° − 38°) and ignores the other angle.`,th:`หาส่วนเติมเต็ม 180 องศาของมุมที่กำหนดเพียงมุมเดียว (180° − 38°) โดยไม่ได้ใช้มุมอีกมุมหนึ่งเลย`}},hints:[{en:`Try drawing an extra line through C that runs parallel to l₁ and l₂.`,th:`ลองลากเส้นเพิ่มผ่านจุด C ให้ขนานกับ l₁ และ l₂`},{en:`This auxiliary line creates alternate angles equal to the two given angles at A and B.`,th:`เส้นเสริมนี้จะทำให้เกิดมุมแย้งที่มีขนาดเท่ากับมุมที่กำหนดไว้ที่จุด A และจุด B`},{en:`The two alternate angles sit right next to each other inside angle ACB, so angle ACB is simply their sum: 38° + 47°.`,th:`มุมแย้งทั้งสองอยู่ติดกันภายในมุม ACB ดังนั้นมุม ACB จึงเป็นผลบวกของทั้งสองมุมนั้น คือ 38° + 47°`}],visual:{kind:`geometryFigure`,width:260,height:200,segments:[{x1:20,y1:30,x2:240,y2:30,ticks:1},{x1:20,y1:170,x2:240,y2:170,ticks:1},{x1:220,y1:30,x2:130,y2:100},{x1:130,y1:100,x2:195,y2:170},{x1:90,y1:100,x2:170,y2:100,style:`dashed`}],points:[{x:220,y:30,label:`A`,labelOffset:[6,-8]},{x:195,y:170,label:`B`,labelOffset:[8,14]},{x:130,y:100,label:`C`,labelOffset:[-20,20]}],angleMarks:[{x:220,y:30,fromDeg:180,toDeg:218,radius:18,label:`38°`,color:`var(--coral)`},{x:195,y:170,fromDeg:133,toDeg:180,radius:18,label:`47°`,color:`var(--navy)`},{x:130,y:100,fromDeg:-47,toDeg:38,radius:36,label:`x`,color:`var(--gold)`}],labels:[{x:30,y:24,text:`l₁`},{x:30,y:164,text:`l₂`}],alt:{en:`Two parallel lines l1 and l2 with a bent path from A on l1 to B on l2, bending at point C between them, with the 38° and 47° angles marked at A and B and angle x marked at C.`,th:`เส้นขนานสองเส้น l1 และ l2 พร้อมเส้นหักมุมจาก A บน l1 ไปยัง B บน l2 โดยหักมุมที่จุด C ระหว่างเส้นทั้งสอง มีมุม 38° และ 47° กำกับที่จุด A และ B และมุม x กำกับที่จุด C`}},estimatedSeconds:80},{id:`D-10`,testId:`samsen-mock-d`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Volume of a Cylinder`,th:`ปริมาตรทรงกระบอก`},difficulty:`Medium`,prompt:{en:`Tank A is a cylinder with base radius 4 cm, filled with water to a height of 36 cm. Tank B is a cylinder that holds the same volume of water, filled to a height of 16 cm. What is the base radius of Tank B?`,th:`ถังน้ำ A เป็นทรงกระบอกรัศมีฐาน 4 เซนติเมตร มีน้ำสูง 36 เซนติเมตร ถังน้ำ B เป็นทรงกระบอกที่มีปริมาตรน้ำเท่ากับถัง A แต่มีน้ำสูง 16 เซนติเมตร ถังน้ำ B มีรัศมีฐานเท่าใด`},options:[{id:`A`,label:{en:`3 cm`,th:`3 เซนติเมตร`}},{id:`B`,label:{en:`6 cm`,th:`6 เซนติเมตร`}},{id:`C`,label:{en:`9 cm`,th:`9 เซนติเมตร`}},{id:`D`,label:{en:`36 cm`,th:`36 เซนติเมตร`}}],correctOptionId:`B`,explanation:{en:`Equal volumes mean r₁²h₁ = r₂²h₂. So 4² × 36 = r₂² × 16, giving 576 = 16r₂², so r₂² = 36, and r₂ = 6 cm.`,th:`ปริมาตรเท่ากันหมายความว่า r₁²h₁ = r₂²h₂ จะได้ 4² × 36 = r₂² × 16 นั่นคือ 576 = 16r₂² ดังนั้น r₂² = 36 และ r₂ = 6 เซนติเมตร`},distractorNotes:{A:{en:`This forgets to square the radius when computing Tank A's volume (using 4 × 36 instead of 4² × 36), leading to a much smaller answer.`,th:`ลืมยกกำลังสองรัศมีตอนคำนวณปริมาตรของถัง A (ใช้ 4 × 36 แทนที่จะเป็น 4² × 36) ทำให้ได้คำตอบที่เล็กเกินไปมาก`},C:{en:`This scales the radius directly by the height ratio (r₂ = 4 × \frac{36}{16} = 9), but volume depends on the square of the radius, not a simple linear scaling.`,th:`ปรับรัศมีตามอัตราส่วนความสูงโดยตรง (r₂ = 4 × \frac{36}{16} = 9) แต่ปริมาตรขึ้นอยู่กับรัศมียกกำลังสอง ไม่ใช่การปรับแบบเชิงเส้นตรง ๆ`},D:{en:`This correctly finds r₂² = 36 but forgets to take the square root to get the actual radius.`,th:`หาค่า r₂² = 36 ได้ถูกต้อง แต่ลืมถอดรากที่สองเพื่อหาค่ารัศมีจริง`}},hints:[{en:`Write the volume of each cylinder using the formula π × radius² × height.`,th:`เขียนปริมาตรของทรงกระบอกแต่ละถังโดยใช้สูตร π × รัศมี² × ความสูง`},{en:`Since the two volumes are equal, you can cancel π from both sides and set radius²×height equal for both tanks.`,th:`เนื่องจากปริมาตรทั้งสองเท่ากัน จึงตัด π ออกจากทั้งสองข้างได้ แล้วให้รัศมี²×ความสูงของถังทั้งสองเท่ากัน`},{en:`Solve 4² × 36 = r₂² × 16 for r₂² first, then remember to take the square root at the very end.`,th:`แก้สมการ 4² × 36 = r₂² × 16 เพื่อหา r₂² ก่อน แล้วอย่าลืมถอดรากที่สองในขั้นตอนสุดท้าย`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:8,height:36,label:`Tank A`},{baseSide:12,height:16,label:`Tank B`}],alt:{en:`Two cylindrical tanks, Tank A with base radius 4 cm filled to height 36 cm, and Tank B with an unknown base radius filled to height 16 cm, holding the same volume of water.`,th:`ถังทรงกระบอกสองถัง ถัง A มีรัศมีฐาน 4 เซนติเมตร มีน้ำสูง 36 เซนติเมตร และถัง B มีรัศมีฐานที่ไม่ทราบค่า มีน้ำสูง 16 เซนติเมตร โดยมีปริมาตรน้ำเท่ากัน`}},estimatedSeconds:95},{id:`D-11`,testId:`samsen-mock-d`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area`,th:`พื้นที่รูปประกอบ`},difficulty:`Hard`,prompt:{en:`A rectangular sheet of paper measures 20 cm by 14 cm. A right-triangle corner with legs 6 cm and 4 cm is cut from one corner, and a right-triangle corner with legs 8 cm and 5 cm is cut from the opposite corner, as shown. What is the area of the remaining shaded piece?`,th:`กระดาษรูปสี่เหลี่ยมผืนผ้าขนาด 20 × 14 เซนติเมตร ถูกตัดมุมสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว 6 ซม. และ 4 ซม. ออกจากมุมหนึ่ง และตัดมุมสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว 8 ซม. และ 5 ซม. ออกจากมุมตรงข้าม ดังภาพ ชิ้นส่วนที่แรเงาที่เหลืออยู่มีพื้นที่เท่าใด`},options:[{id:`A`,label:{en:`260 cm²`,th:`260 ตร.ซม.`}},{id:`B`,label:{en:`216 cm²`,th:`216 ตร.ซม.`}},{id:`C`,label:{en:`248 cm²`,th:`248 ตร.ซม.`}},{id:`D`,label:{en:`268 cm²`,th:`268 ตร.ซม.`}}],correctOptionId:`C`,explanation:{en:`Rectangle area = 20×14 = 280 cm². The two triangle corners have areas ½×6×4 = 12 cm² and ½×8×5 = 20 cm². Remaining area = 280 − 12 − 20 = 248 cm².`,th:`พื้นที่สี่เหลี่ยมผืนผ้า = 20×14 = 280 ตร.ซม. มุมสามเหลี่ยมทั้งสองมีพื้นที่ ½×6×4 = 12 ตร.ซม. และ ½×8×5 = 20 ตร.ซม. พื้นที่ที่เหลือ = 280 − 12 − 20 = 248 ตร.ซม.`},distractorNotes:{A:{en:`This forgets to subtract the first triangle (6 cm by 4 cm): 280 − 20 = 260.`,th:`ลืมลบสามเหลี่ยมมุมแรก (6 ซม. และ 4 ซม.) ออก: 280 − 20 = 260`},B:{en:`This uses base × height instead of ½ × base × height for both triangle areas: 280 − 24 − 40 = 216.`,th:`ใช้ฐาน × สูง แทนที่จะเป็น ½ × ฐาน × สูง สำหรับพื้นที่สามเหลี่ยมทั้งสองรูป: 280 − 24 − 40 = 216`},D:{en:`This forgets to subtract the second triangle (8 cm by 5 cm): 280 − 12 = 268.`,th:`ลืมลบสามเหลี่ยมมุมที่สอง (8 ซม. และ 5 ซม.) ออก: 280 − 12 = 268`}},hints:[{en:`First find the area of the full rectangle before any corners are cut.`,th:`หาพื้นที่ของสี่เหลี่ยมผืนผ้าทั้งแผ่นก่อนที่จะตัดมุมออก`},{en:`Each cut-off corner is a right triangle — its area is half the product of its two legs.`,th:`มุมที่ถูกตัดออกแต่ละมุมเป็นรูปสามเหลี่ยมมุมฉาก พื้นที่ของมันคือครึ่งหนึ่งของผลคูณด้านประกอบมุมฉากทั้งสองด้าน`},{en:`Subtract both triangle areas from the rectangle's area to get the shaded region.`,th:`นำพื้นที่สามเหลี่ยมทั้งสองรูปไปลบออกจากพื้นที่สี่เหลี่ยมผืนผ้า จะได้พื้นที่ส่วนที่แรเงา`}],visual:{kind:`geometryFigure`,width:200,height:140,showGrid:!0,gridStep:20,polygons:[{points:[[60,0],[200,0],[200,90],[120,140],[0,140],[0,40]],fill:`shaded`}],segments:[{x1:0,y1:0,x2:60,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:40,style:`dashed`},{x1:200,y1:90,x2:200,y2:140,style:`dashed`},{x1:120,y1:140,x2:200,y2:140,style:`dashed`}],labels:[{x:30,y:12,text:`6 cm`},{x:8,y:32,text:`4 cm`},{x:160,y:132,text:`8 cm`},{x:190,y:118,text:`5 cm`}],alt:{en:`A 20 cm by 14 cm rectangle with a right-triangle corner (6 cm by 4 cm) cut from the top-left and a right-triangle corner (8 cm by 5 cm) cut from the bottom-right, leaving a shaded hexagon.`,th:`สี่เหลี่ยมผืนผ้าขนาด 20 x 14 เซนติเมตร ถูกตัดมุมสามเหลี่ยมมุมฉาก (6 x 4 ซม.) ออกจากมุมบนซ้าย และตัดมุมสามเหลี่ยมมุมฉาก (8 x 5 ซม.) ออกจากมุมล่างขวา เหลือเป็นรูปหกเหลี่ยมที่แรเงา`}},estimatedSeconds:100},{id:`D-12`,testId:`samsen-mock-d`,number:12,skill:`Geometry & Angles`,topic:{en:`Angle Chasing with Algebra`,th:`การหามุมด้วยพีชคณิต`},difficulty:`Hard`,prompt:{en:`In the figure, l₁ ∥ l₂. A bent path meets l₁ at A and l₂ at B, bending at point C between the lines. The angle between l₁ and AC is (2x + 10)°, the angle between l₂ and BC is (3x − 5)°, and angle ACB = 145°. Find the angle between l₂ and BC.`,th:`จากรูป l₁ ขนานกับ l₂ มีเส้นหักมุมผ่านจุด A บน l₁ และจุด B บน l₂ โดยหักมุมที่จุด C ซึ่งอยู่ระหว่างเส้นทั้งสอง มุมระหว่าง l₁ กับ AC เท่ากับ (2x + 10)° มุมระหว่าง l₂ กับ BC เท่ากับ (3x − 5)° และมุม ACB เท่ากับ 145° จงหาขนาดของมุมระหว่าง l₂ กับ BC`},options:[{id:`A`,label:{en:`66°`,th:`66°`}},{id:`B`,label:{en:`28°`,th:`28°`}},{id:`C`,label:{en:`73°`,th:`73°`}},{id:`D`,label:{en:`79°`,th:`79°`}}],correctOptionId:`D`,explanation:{en:`Using the auxiliary parallel line through C, angle ACB equals the sum of the two given angles: (2x+10) + (3x−5) = 145, so 5x + 5 = 145, 5x = 140, x = 28. The angle between l₂ and BC is 3(28) − 5 = 79°.`,th:`โดยใช้เส้นเสริมขนานผ่านจุด C มุม ACB จะเท่ากับผลบวกของมุมที่กำหนดทั้งสองมุม: (2x+10) + (3x−5) = 145 จะได้ 5x + 5 = 145 นั่นคือ 5x = 140 ดังนั้น x = 28 มุมระหว่าง l₂ กับ BC คือ 3(28) − 5 = 79°`},distractorNotes:{A:{en:`This finds the angle at A, (2×28+10) = 66°, instead of the angle at B that was asked for.`,th:`หามุมที่จุด A ได้ (2×28+10) = 66° แต่โจทย์ถามหามุมที่จุด B ไม่ใช่มุมที่จุด A`},B:{en:`This gives the value of x (28) itself, not the angle measure that was asked for.`,th:`ตอบเป็นค่า x (28) เฉย ๆ ไม่ใช่ขนาดของมุมที่โจทย์ถาม`},C:{en:`This comes from a sign slip while combining the equation (treating −5 as +5), giving 5x + 15 = 145, x = 26, and 3(26) − 5 = 73°.`,th:`เกิดจากผิดพลาดเรื่องเครื่องหมายตอนรวมสมการ (ใช้ −5 เป็น +5) ทำให้ได้ 5x + 15 = 145, x = 26 และ 3(26) − 5 = 73°`}},hints:[{en:`As before, angle ACB equals the sum of the angle at A and the angle at B.`,th:`เช่นเดียวกับก่อนหน้านี้ มุม ACB เท่ากับผลบวกของมุมที่ A และมุมที่ B`},{en:`Write the equation (2x+10) + (3x−5) = 145 and simplify to solve for x.`,th:`เขียนสมการ (2x+10) + (3x−5) = 145 แล้วจัดรูปเพื่อหาค่า x`},{en:`After finding x = 28, substitute it back into the expression (3x − 5), not (2x + 10) — read carefully which angle is being asked for.`,th:`เมื่อหา x = 28 ได้แล้ว ให้แทนกลับในนิพจน์ (3x − 5) ไม่ใช่ (2x + 10) — อ่านโจทย์ให้ดีว่าถามมุมไหน`}],visual:{kind:`geometryFigure`,width:260,height:200,segments:[{x1:20,y1:30,x2:240,y2:30,ticks:1},{x1:20,y1:170,x2:240,y2:170,ticks:1},{x1:121,y1:30,x2:90,y2:100},{x1:90,y1:100,x2:104,y2:170},{x1:60,y1:100,x2:130,y2:100,style:`dashed`}],points:[{x:121,y:30,label:`A`,labelOffset:[6,-8]},{x:104,y:170,label:`B`,labelOffset:[8,14]},{x:90,y:100,label:`C`,labelOffset:[-20,20]}],angleMarks:[{x:121,y:30,fromDeg:180,toDeg:246,radius:18,label:`(2x+10)°`,color:`var(--coral)`},{x:104,y:170,fromDeg:101,toDeg:180,radius:18,label:`(3x-5)°`,color:`var(--navy)`},{x:90,y:100,fromDeg:-79,toDeg:66,radius:42,label:`145°`,color:`var(--gold)`}],labels:[{x:30,y:24,text:`l₁`},{x:30,y:164,text:`l₂`}],alt:{en:`Two parallel lines l1 and l2 with a bent path from A on l1 to B on l2 through bend point C, with angles (2x+10)° and (3x-5)° marked at A and B, and angle ACB marked as 145° at C.`,th:`เส้นขนานสองเส้น l1 และ l2 พร้อมเส้นหักมุมจาก A บน l1 ไปยัง B บน l2 ผ่านจุดหักมุม C มีมุม (2x+10)° และ (3x-5)° กำกับที่จุด A และ B และมุม ACB กำกับเป็น 145° ที่จุด C`}},estimatedSeconds:130},{id:`D-13`,testId:`samsen-mock-d`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Concentric Circles`,th:`วงกลมร่วมศูนย์กลาง`},difficulty:`Hard`,prompt:{en:`Two circles share the same centre. The area of the shaded ring between them is 3 times the area of the inner circle. Find the ratio of the outer radius to the inner radius.`,th:`วงกลมสองวงมีจุดศูนย์กลางร่วมกัน พื้นที่วงแหวนที่แรเงาระหว่างวงกลมทั้งสองมีค่าเป็น 3 เท่าของพื้นที่วงกลมวงใน จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน`},options:[{id:`A`,label:{en:`2 : 1`,th:`2 : 1`}},{id:`B`,label:{en:`3 : 1`,th:`3 : 1`}},{id:`C`,label:{en:`4 : 1`,th:`4 : 1`}},{id:`D`,label:{en:`1 : 2`,th:`1 : 2`}}],correctOptionId:`A`,explanation:{en:`Let the inner radius be r and outer radius R. Ring area = πR² − πr² = 3×πr², so R² − r² = 3r², giving R² = 4r². Taking the square root, R = 2r, so R : r = 2 : 1.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R พื้นที่วงแหวน = πR² − πr² = 3×πr² จะได้ R² − r² = 3r² ดังนั้น R² = 4r² ถอดรากที่สอง จะได้ R = 2r ดังนั้น R : r = 2 : 1`},distractorNotes:{B:{en:`This uses the area ratio (3) directly as the radius ratio, skipping the "+1" step and the square root entirely.`,th:`นำอัตราส่วนพื้นที่ (3) มาใช้เป็นอัตราส่วนรัศมีโดยตรง โดยข้ามขั้นตอนการบวก 1 และการถอดรากที่สองไปเลย`},C:{en:`This correctly finds R² : r² = 4 : 1 but forgets to take the square root to get the actual radius ratio.`,th:`หา R² : r² = 4 : 1 ได้ถูกต้อง แต่ลืมถอดรากที่สองเพื่อหาอัตราส่วนรัศมีที่แท้จริง`},D:{en:`This finds the correct numbers but writes the ratio backwards — inner to outer instead of outer to inner.`,th:`หาค่าได้ถูกต้องแต่เขียนอัตราส่วนกลับด้าน คือรัศมีวงในต่อวงนอก แทนที่จะเป็นวงนอกต่อวงใน`}},hints:[{en:`Write the ring's area as (outer circle area) − (inner circle area).`,th:`เขียนพื้นที่วงแหวนเป็น (พื้นที่วงกลมวงนอก) − (พื้นที่วงกลมวงใน)`},{en:`Since ring area = 3 × inner area, the outer circle's area must be 4 times the inner circle's area (ring + inner = outer).`,th:`เนื่องจากพื้นที่วงแหวน = 3 × พื้นที่วงใน พื้นที่วงกลมวงนอกจึงต้องเป็น 4 เท่าของพื้นที่วงใน (วงแหวน + วงใน = วงนอก)`},{en:`Area scales with the square of the radius, so if the area ratio is 4 : 1, the radius ratio is the square root of that: 2 : 1.`,th:`พื้นที่แปรผันตามรัศมียกกำลังสอง ดังนั้นถ้าอัตราส่วนพื้นที่เป็น 4 : 1 อัตราส่วนรัศมีคือรากที่สองของค่านั้น คือ 2 : 1`}],visual:{kind:`concentricCircles`,outerRadius:8,innerRadius:4,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles, outer radius R and inner radius r, with the ring between them shaded.`,th:`วงกลมร่วมศูนย์กลางสองวง รัศมีวงนอก R และรัศมีวงใน r โดยวงแหวนระหว่างวงกลมทั้งสองถูกแรเงา`}},estimatedSeconds:110},{id:`D-14`,testId:`samsen-mock-d`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Arc-Shaded Area`,th:`พื้นที่ที่แรเงาด้วยส่วนโค้ง`},difficulty:`Hard`,prompt:{en:`A square sheet has side length 14 cm. Two quarter-circle arcs, each with radius equal to the side length, are drawn inside the square from opposite corners, creating the shaded leaf shape shown. Using π ≈ \frac{22}{7}, find the area of the shaded leaf.`,th:`แผ่นกระดาษรูปสี่เหลี่ยมจัตุรัสยาวด้านละ 14 เซนติเมตร มีการลากส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้น แต่ละเส้นมีรัศมีเท่ากับความยาวด้าน จากมุมตรงข้ามกันภายในสี่เหลี่ยมจัตุรัส เกิดเป็นรูปใบไม้ที่แรเงาดังภาพ กำหนด π ≈ \frac{22}{7} จงหาพื้นที่รูปใบไม้ที่แรเงา`},options:[{id:`A`,label:{en:`308 cm²`,th:`308 ตร.ซม.`}},{id:`B`,label:{en:`112 cm²`,th:`112 ตร.ซม.`}},{id:`C`,label:{en:`154 cm²`,th:`154 ตร.ซม.`}},{id:`D`,label:{en:`42 cm²`,th:`42 ตร.ซม.`}}],correctOptionId:`B`,explanation:{en:`Each quarter circle has area ¼ × \frac{22}{7} × 14² = 154 cm². The two quarter circles together cover the square once plus the leaf shape a second time, so leaf area = 154 + 154 − 196 = 112 cm².`,th:`ส่วนโค้งหนึ่งในสี่ของวงกลมแต่ละเส้นมีพื้นที่ ¼ × \frac{22}{7} × 14² = 154 ตร.ซม. เมื่อรวมพื้นที่ของทั้งสองส่วนโค้งเข้าด้วยกัน จะครอบคลุมพื้นที่สี่เหลี่ยมจัตุรัสหนึ่งครั้ง บวกกับพื้นที่รูปใบไม้อีกครั้งหนึ่ง ดังนั้นพื้นที่ใบไม้ = 154 + 154 − 196 = 112 ตร.ซม.`},distractorNotes:{A:{en:`This adds the two quarter-circle areas (154 + 154 = 308) but forgets to subtract the square's area.`,th:`นำพื้นที่ส่วนโค้งทั้งสองมาบวกกัน (154 + 154 = 308) แต่ลืมลบด้วยพื้นที่สี่เหลี่ยมจัตุรัส`},C:{en:`This is the area of just one quarter circle (154 cm²), not the combined leaf shape.`,th:`นี่คือพื้นที่ของส่วนโค้งหนึ่งในสี่ของวงกลมเพียงเส้นเดียว (154 ตร.ซม.) ไม่ใช่พื้นที่รูปใบไม้ที่รวมกัน`},D:{en:`This subtracts one quarter-circle area from the square (196 − 154 = 42) instead of combining both quarter-circles and subtracting the square once.`,th:`นำพื้นที่ส่วนโค้งหนึ่งในสี่ไปลบออกจากสี่เหลี่ยมจัตุรัส (196 − 154 = 42) แทนที่จะรวมพื้นที่ส่วนโค้งทั้งสองแล้วลบด้วยพื้นที่สี่เหลี่ยมจัตุรัสเพียงครั้งเดียว`}},hints:[{en:`Start by finding the area of one quarter circle with radius 14 cm.`,th:`เริ่มจากหาพื้นที่ของส่วนโค้งหนึ่งในสี่ของวงกลมที่มีรัศมี 14 ซม.`},{en:`The two quarter circles overlap exactly in the leaf shape, and together they cover the whole square plus the leaf a second time.`,th:`ส่วนโค้งทั้งสองซ้อนทับกันพอดีตรงบริเวณรูปใบไม้ และเมื่อรวมกันจะครอบคลุมสี่เหลี่ยมจัตุรัสทั้งหมดบวกกับรูปใบไม้อีกครั้งหนึ่ง`},{en:`Leaf area = (quarter circle 1) + (quarter circle 2) − (square area).`,th:`พื้นที่ใบไม้ = (ส่วนโค้งที่ 1) + (ส่วนโค้งที่ 2) − (พื้นที่สี่เหลี่ยมจัตุรัส)`}],visual:{kind:`leafShape`,width:14,height:14,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A 14 cm square with two quarter-circle arcs from opposite corners creating a shaded leaf shape in the middle.`,th:`สี่เหลี่ยมจัตุรัสด้านละ 14 เซนติเมตร มีส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้นจากมุมตรงข้ามกัน เกิดเป็นรูปใบไม้แรเงาตรงกลาง`}},estimatedSeconds:120},{id:`D-15`,testId:`samsen-mock-d`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fraction of a Remainder`,th:`เศษส่วนของส่วนที่เหลือ`},difficulty:`Hard`,prompt:{en:`A tank holds 180 litres of water for a science experiment. On Monday, \frac{2}{5} of the water is used. On Tuesday, \frac{1}{3} of the remaining water is used. What is the difference between the amount of water used on Monday and the amount used on Tuesday?`,th:`ถังใส่น้ำสำหรับการทดลองวิทยาศาสตร์มีน้ำอยู่ 180 ลิตร วันจันทร์ใช้น้ำไป \frac{2}{5} ของน้ำทั้งหมด วันอังคารใช้น้ำที่เหลืออยู่ไปอีก \frac{1}{3} ของน้ำที่เหลือ น้ำที่ใช้ในวันจันทร์มากกว่าน้ำที่ใช้ในวันอังคารอยู่กี่ลิตร`},options:[{id:`A`,label:{en:`12 litres`,th:`12 ลิตร`}},{id:`B`,label:{en:`144 litres`,th:`144 ลิตร`}},{id:`C`,label:{en:`36 litres`,th:`36 ลิตร`}},{id:`D`,label:{en:`72 litres`,th:`72 ลิตร`}}],correctOptionId:`C`,explanation:{en:`Monday's use = \frac{2}{5} × 180 = 72 litres, leaving 180 − 72 = 108 litres. Tuesday's use = \frac{1}{3} × 108 = 36 litres. The difference is 72 − 36 = 36 litres.`,th:`น้ำที่ใช้วันจันทร์ = \frac{2}{5} × 180 = 72 ลิตร เหลือน้ำ 180 − 72 = 108 ลิตร น้ำที่ใช้วันอังคาร = \frac{1}{3} × 108 = 36 ลิตร ผลต่างคือ 72 − 36 = 36 ลิตร`},distractorNotes:{A:{en:`This mistakenly takes Tuesday's use as \frac{1}{3} of the original 180 litres (60 litres) instead of \frac{1}{3} of the 108 litres remaining, giving a difference of 72 − 60 = 12.`,th:`เข้าใจผิดว่าน้ำที่ใช้วันอังคารคือ \frac{1}{3} ของน้ำเดิม 180 ลิตร (60 ลิตร) แทนที่จะเป็น \frac{1}{3} ของน้ำที่เหลือ 108 ลิตร ทำให้ได้ผลต่าง 72 − 60 = 12`},B:{en:`This adds the two amounts used (72 + 36) instead of finding the difference between them.`,th:`นำปริมาณน้ำที่ใช้ทั้งสองวันมาบวกกัน (72 + 36) แทนที่จะหาผลต่างระหว่างสองจำนวนนั้น`},D:{en:`This gives only Monday's usage (72 litres) and forgets to subtract Tuesday's usage.`,th:`ตอบแค่น้ำที่ใช้ในวันจันทร์ (72 ลิตร) โดยลืมนำน้ำที่ใช้วันอังคารมาลบออก`}},hints:[{en:`Work out how much water is used on Monday, and how much is left after Monday.`,th:`หาว่าใช้น้ำไปเท่าไรในวันจันทร์ และเหลือน้ำเท่าไรหลังจากวันจันทร์`},{en:`Tuesday's fraction (\frac{1}{3}) applies to what is LEFT after Monday, not to the original 180 litres.`,th:`เศษส่วนของวันอังคาร (\frac{1}{3}) ใช้กับน้ำที่เหลืออยู่หลังวันจันทร์ ไม่ใช่น้ำเดิม 180 ลิตร`},{en:`Find Tuesday's amount, then subtract it from Monday's amount to get the difference.`,th:`หาปริมาณน้ำที่ใช้วันอังคาร แล้วนำไปลบออกจากปริมาณน้ำที่ใช้วันจันทร์ เพื่อหาผลต่าง`}],visual:null,estimatedSeconds:95},{id:`D-16`,testId:`samsen-mock-d`,number:16,skill:`Algebra & Patterns`,topic:{en:`Area Equations`,th:`สมการพื้นที่`},difficulty:`Hard`,prompt:{en:`A square sheet of cardboard has side length 30 cm. A small square of side x cm is cut from each of its four corners so it can be folded into an open box. The remaining cross-shaped area (before folding) is 756 cm². Find x.`,th:`แผ่นกระดาษแข็งรูปสี่เหลี่ยมจัตุรัสยาวด้านละ 30 เซนติเมตร ถูกตัดสี่เหลี่ยมจัตุรัสเล็กด้านยาว x เซนติเมตรออกจากทั้งสี่มุม เพื่อพับเป็นกล่องแบบเปิดฝา พื้นที่รูปกากบาทที่เหลืออยู่ (ก่อนพับ) เท่ากับ 756 ตารางเซนติเมตร จงหาค่าของ x`},options:[{id:`A`,label:{en:`12 cm`,th:`12 เซนติเมตร`}},{id:`B`,label:{en:`36 cm`,th:`36 เซนติเมตร`}},{id:`C`,label:{en:`24 cm`,th:`24 เซนติเมตร`}},{id:`D`,label:{en:`6 cm`,th:`6 เซนติเมตร`}}],correctOptionId:`D`,explanation:{en:`Remaining area = (side)² − 4x² = 900 − 4x² = 756. So 4x² = 144, x² = 36, and x = 6 cm.`,th:`พื้นที่ที่เหลือ = (ด้าน)² − 4x² = 900 − 4x² = 756 จะได้ 4x² = 144 นั่นคือ x² = 36 ดังนั้น x = 6 เซนติเมตร`},distractorNotes:{A:{en:`This forgets to divide by 4 before taking the square root, computing √144 = 12 directly instead of √36.`,th:`ลืมหารด้วย 4 ก่อนถอดรากที่สอง คำนวณ √144 = 12 โดยตรง แทนที่จะเป็น √36`},B:{en:`This correctly finds x² = 36 but forgets to take the square root, giving x² instead of x.`,th:`หา x² = 36 ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงตอบเป็น x² แทนที่จะเป็น x`},C:{en:`This comes from a division slip, such as dividing 144 by 6 instead of by 4.`,th:`เกิดจากการหารผิดพลาด เช่น นำ 144 ไปหารด้วย 6 แทนที่จะหารด้วย 4`}},hints:[{en:`Write the remaining cross-shaped area as the big square's area minus the four small corner squares.`,th:`เขียนพื้นที่รูปกากบาทที่เหลือเป็นพื้นที่สี่เหลี่ยมจัตุรัสใหญ่ลบด้วยสี่เหลี่ยมจัตุรัสเล็กทั้งสี่มุม`},{en:`Each corner square has area x², and there are 4 of them, so the total removed is 4x².`,th:`สี่เหลี่ยมจัตุรัสเล็กแต่ละมุมมีพื้นที่ x² และมีทั้งหมด 4 มุม ดังนั้นพื้นที่ที่ถูกตัดออกทั้งหมดคือ 4x²`},{en:`Solve 900 − 4x² = 756 for x², then remember to take the square root at the end to find x.`,th:`แก้สมการ 900 − 4x² = 756 เพื่อหา x² แล้วอย่าลืมถอดรากที่สองในขั้นตอนสุดท้ายเพื่อหาค่า x`}],visual:{kind:`geometryFigure`,width:180,height:180,polygons:[{points:[[36,0],[144,0],[144,36],[180,36],[180,144],[144,144],[144,180],[36,180],[36,144],[0,144],[0,36],[36,36]],fill:`shaded`}],labels:[{x:90,y:-4,text:`30 cm`,bold:!0},{x:14,y:50,text:`x`}],alt:{en:`A 30 cm square with a small square of side x cut from each corner, leaving a shaded cross shape.`,th:`สี่เหลี่ยมจัตุรัสด้านละ 30 เซนติเมตร ถูกตัดสี่เหลี่ยมจัตุรัสเล็กด้านยาว x ออกจากทุกมุม เหลือเป็นรูปกากบาทที่แรเงา`}},estimatedSeconds:135},{id:`D-17`,testId:`samsen-mock-d`,number:17,skill:`Graphs & Data`,topic:{en:`Reading Grouped Bar Charts`,th:`การอ่านกราฟแท่งกลุ่ม`},difficulty:`VeryHard`,prompt:{en:`The bar chart shows the number of students who attended the school's Science Fair workshop each week, split into Morning and Afternoon sessions. Which of these statements is INCORRECT?`,th:`แผนภูมิแท่งแสดงจำนวนนักเรียนที่เข้าร่วมกิจกรรมนิทรรศการวิทยาศาสตร์ของโรงเรียนในแต่ละสัปดาห์ แบ่งเป็นรอบเช้าและรอบบ่าย ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Morning attendance was higher than afternoon attendance in Week 3.`,th:`จำนวนผู้เข้าร่วมรอบเช้ามากกว่ารอบบ่ายในสัปดาห์ที่ 3`}},{id:`B`,label:{en:`Week 4 had the highest combined (morning + afternoon) attendance of all four weeks.`,th:`สัปดาห์ที่ 4 มีจำนวนผู้เข้าร่วมรวม (เช้า + บ่าย) มากที่สุดในทั้งสี่สัปดาห์`}},{id:`C`,label:{en:`The total morning attendance across all four weeks was 108 students.`,th:`จำนวนผู้เข้าร่วมรอบเช้ารวมทั้งสี่สัปดาห์เท่ากับ 108 คน`}},{id:`D`,label:{en:`The average afternoon attendance per week was 24 students.`,th:`จำนวนผู้เข้าร่วมรอบบ่ายเฉลี่ยต่อสัปดาห์เท่ากับ 24 คน`}}],correctOptionId:`A`,explanation:{en:`In Week 3, Morning attendance was 18 and Afternoon was 22, so Afternoon was actually higher, not Morning. This makes statement A the incorrect one; the other three statements all match the chart's data.`,th:`ในสัปดาห์ที่ 3 จำนวนผู้เข้าร่วมรอบเช้าเท่ากับ 18 คน และรอบบ่ายเท่ากับ 22 คน ดังนั้นรอบบ่ายจึงมากกว่ารอบเช้า ไม่ใช่ตรงกันข้าม ทำให้ข้อความ A ไม่ถูกต้อง ส่วนข้อความอีกสามข้อสอดคล้องกับข้อมูลในแผนภูมิทั้งหมด`},distractorNotes:{B:{en:`This statement is actually true — Week 4's combined total (36+28=64) is the highest of all four weeks, so it is not the answer.`,th:`ข้อความนี้เป็นจริง เพราะยอดรวมของสัปดาห์ที่ 4 (36+28=64) มากที่สุดในทั้งสี่สัปดาห์ จึงไม่ใช่คำตอบที่ถูกต้อง`},C:{en:`This statement is actually true — 24+30+18+36 = 108, so it is not the answer.`,th:`ข้อความนี้เป็นจริง เพราะ 24+30+18+36 = 108 จึงไม่ใช่คำตอบที่ถูกต้อง`},D:{en:`This statement is actually true — 96 ÷ 4 = 24, so it is not the answer.`,th:`ข้อความนี้เป็นจริง เพราะ 96 ÷ 4 = 24 จึงไม่ใช่คำตอบที่ถูกต้อง`}},hints:[{en:`Check each statement against the chart one at a time, starting with the easiest to verify.`,th:`ตรวจสอบข้อความแต่ละข้อเทียบกับแผนภูมิทีละข้อ เริ่มจากข้อที่ตรวจสอบง่ายที่สุดก่อน`},{en:`Pay close attention to Week 3 — compare the two bars carefully.`,th:`สังเกตสัปดาห์ที่ 3 ให้ดี เปรียบเทียบแท่งทั้งสองอย่างละเอียด`},{en:`In Week 3, read the exact height of the Morning bar and the Afternoon bar and compare which is really taller.`,th:`ในสัปดาห์ที่ 3 อ่านความสูงที่แท้จริงของแท่งรอบเช้าและรอบบ่าย แล้วเปรียบเทียบว่าแท่งใดสูงกว่ากันจริง ๆ`}],visual:{kind:`barChart`,categories:[`Week 1`,`Week 2`,`Week 3`,`Week 4`],series:[{name:{en:`Morning`,th:`รอบเช้า`},color:`coral`,values:[24,30,18,36]},{name:{en:`Afternoon`,th:`รอบบ่าย`},color:`teal`,values:[20,26,22,28]}],yStep:10,yMax:40,alt:{en:`Grouped bar chart of Morning and Afternoon workshop attendance across four weeks.`,th:`แผนภูมิแท่งกลุ่มแสดงจำนวนผู้เข้าร่วมกิจกรรมรอบเช้าและรอบบ่ายตลอดสี่สัปดาห์`}},estimatedSeconds:140},{id:`D-18`,testId:`samsen-mock-d`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Charts in Degrees`,th:`แผนภูมิวงกลมเป็นองศา`},difficulty:`VeryHard`,prompt:{en:`In a survey, students at a school science fair were asked to name their favourite hobby. The pie chart shows the results by angle. If 30 students chose Painting, how many students chose Astronomy?`,th:`ในการสำรวจ นักเรียนในงานนิทรรศการวิทยาศาสตร์ของโรงเรียนถูกถามถึงงานอดิเรกที่ชื่นชอบ แผนภูมิวงกลมแสดงผลเป็นมุมองศา ถ้ามีนักเรียน 30 คนเลือกงานวาดภาพ จะมีนักเรียนกี่คนที่เลือกดาราศาสตร์`},options:[{id:`A`,label:{en:`12 students`,th:`12 คน`}},{id:`B`,label:{en:`42 students`,th:`42 คน`}},{id:`C`,label:{en:`36 students`,th:`36 คน`}},{id:`D`,label:{en:`126 students`,th:`126 คน`}}],correctOptionId:`B`,explanation:{en:`Painting's slice is 90° and represents 30 students, so 90° = 30 students, meaning 1° = \frac{1}{3} student. Astronomy's slice is 126°, so it represents 126 × \frac{1}{3} = 42 students.`,th:`มุมของงานวาดภาพเท่ากับ 90° แทนนักเรียน 30 คน ดังนั้น 90° = 30 คน หมายความว่า 1° = \frac{1}{3} คน มุมของดาราศาสตร์เท่ากับ 126° ดังนั้นมีนักเรียน 126 × \frac{1}{3} = 42 คน`},distractorNotes:{A:{en:`This is the count for Gardening (120 × \frac{36}{360} = 12), from confusing Astronomy's 126° with Gardening's 36°.`,th:`นี่คือจำนวนนักเรียนของการทำสวน (120 × \frac{36}{360} = 12) ซึ่งเกิดจากสับสนระหว่างมุม 126° ของดาราศาสตร์กับมุม 36° ของการทำสวน`},C:{en:`This is the count for Robotics (120 × \frac{108}{360} = 36), from reading the wrong slice's angle by mistake.`,th:`นี่คือจำนวนนักเรียนของหุ่นยนต์ (120 × \frac{108}{360} = 36) ซึ่งเกิดจากอ่านมุมของสไลซ์ผิดโดยไม่ตั้งใจ`},D:{en:`This uses the degree value itself (126) as the number of students, without converting degrees into a count at all.`,th:`นำค่าองศา (126) มาใช้เป็นจำนวนนักเรียนโดยตรง โดยไม่ได้แปลงจากองศาเป็นจำนวนคนเลย`}},hints:[{en:`Use Painting's angle and count together to find how many students correspond to one degree.`,th:`ใช้มุมและจำนวนคนของงานวาดภาพเพื่อหาว่า 1 องศาแทนนักเรียนกี่คน`},{en:`Once you know the value of 1 degree in students, or the total number of students, you can convert any slice's angle into a count.`,th:`เมื่อรู้ค่าของ 1 องศาเป็นจำนวนคน หรือรู้จำนวนนักเรียนทั้งหมดแล้ว ก็สามารถแปลงมุมของสไลซ์ใดก็ได้ให้เป็นจำนวนคน`},{en:`Astronomy's angle is 126°. Multiply 126 by the "students per degree" value you found from the Painting slice.`,th:`มุมของดาราศาสตร์คือ 126° นำ 126 ไปคูณกับค่า "จำนวนคนต่อ 1 องศา" ที่หาได้จากสไลซ์งานวาดภาพ`}],visual:{kind:`pieChart`,slices:[{label:`Robotics`,degrees:108,color:`coral`},{label:`Painting`,degrees:90,color:`sage`},{label:`Astronomy`,degrees:126,color:`teal`},{label:`Gardening`,degrees:36,color:`gold`}],alt:{en:`Pie chart of favourite hobby survey results: Robotics 108°, Painting 90°, Astronomy 126°, Gardening 36°.`,th:`แผนภูมิวงกลมแสดงผลสำรวจงานอดิเรกที่ชื่นชอบ: หุ่นยนต์ 108°, วาดภาพ 90°, ดาราศาสตร์ 126°, ทำสวน 36°`}},estimatedSeconds:160},{id:`D-19`,testId:`samsen-mock-d`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Profit & Loss Percentage`,th:`ร้อยละกำไรขาดทุน`},difficulty:`VeryHard`,prompt:{en:`A shop bought a telescope kit for a school science fair for 800 baht. The owner marked up the price to make a profit of 35%, but had to sell it at a 10% discount off the marked price during a sale. Find the actual profit.`,th:`ร้านค้าซื้อชุดกล้องโทรทรรศน์สำหรับงานนิทรรศการวิทยาศาสตร์มาในราคา 800 บาท เจ้าของร้านตั้งราคาขายเพื่อให้ได้กำไร 35% แต่ต้องลดราคา 10% จากราคาที่ตั้งไว้ในช่วงลดราคา จงหากำไรที่ได้จริง`},options:[{id:`A`,label:{en:`972 baht`,th:`972 บาท`}},{id:`B`,label:{en:`200 baht`,th:`200 บาท`}},{id:`C`,label:{en:`172 baht`,th:`172 บาท`}},{id:`D`,label:{en:`280 baht`,th:`280 บาท`}}],correctOptionId:`C`,explanation:{en:`Marked price = 800 × 1.35 = 1,080 baht. Selling price after a 10% discount = 1,080 × 0.9 = 972 baht. Actual profit = 972 − 800 = 172 baht.`,th:`ราคาที่ตั้งไว้ = 800 × 1.35 = 1,080 บาท ราคาขายหลังลด 10% = 1,080 × 0.9 = 972 บาท กำไรที่ได้จริง = 972 − 800 = 172 บาท`},distractorNotes:{A:{en:`This gives the final selling price itself (972 baht) as the answer, forgetting to subtract the 800-baht cost price to find the profit.`,th:`ตอบเป็นราคาขายสุดท้าย (972 บาท) โดยตรง โดยลืมลบราคาทุน 800 บาทออกเพื่อหากำไรที่แท้จริง`},B:{en:`This combines the percentages by simple subtraction (35% − 10% = 25%) and applies that directly to the cost price (25% of 800 = 200), instead of applying the two percentage changes one after another.`,th:`รวมร้อยละโดยการลบกันตรง ๆ (35% − 10% = 25%) แล้วนำไปคิดกับราคาทุนโดยตรง (25% ของ 800 = 200) แทนที่จะคำนวณการเปลี่ยนแปลงร้อยละทั้งสองครั้งตามลำดับ`},D:{en:`This only computes the intended 35% profit on the cost price (35% of 800 = 280), ignoring the later 10% discount entirely.`,th:`คำนวณเพียงกำไร 35% ที่ตั้งใจไว้จากราคาทุน (35% ของ 800 = 280) โดยไม่ได้นำส่วนลด 10% ในภายหลังมาคิดเลย`}},hints:[{en:`First find the marked price after adding the intended 35% profit to the cost price.`,th:`หาราคาที่ตั้งไว้ก่อน โดยบวกกำไรที่ตั้งใจไว้ 35% เข้ากับราคาทุน`},{en:`The 10% discount is taken off the MARKED price, not off the original cost price — apply the two percentages one after the other.`,th:`ส่วนลด 10% หักออกจาก "ราคาที่ตั้งไว้" ไม่ใช่จากราคาทุนเดิม — คำนวณร้อยละทั้งสองทีละขั้นตอนตามลำดับ`},{en:`Find the actual selling price after the discount, then subtract the 800-baht cost price to get the real profit.`,th:`หาราคาขายจริงหลังหักส่วนลด แล้วนำไปลบด้วยราคาทุน 800 บาท จะได้กำไรที่แท้จริง`}],visual:null,estimatedSeconds:150},{id:`D-20`,testId:`samsen-mock-d`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Percentage Chains`,th:`ร้อยละต่อเนื่อง`},difficulty:`VeryHard`,prompt:{en:`Three students collected seashells for a science project: Mild collected 20% more than Bank, and Pang collected 25% fewer than Mild. Together the three of them collected 310 shells. How many shells did Pang collect?`,th:`นักเรียนสามคนเก็บเปลือกหอยสำหรับโครงงานวิทยาศาสตร์: มายด์เก็บได้มากกว่าแบงค์อยู่ 20% และแป้งเก็บได้น้อยกว่ามายด์อยู่ 25% ทั้งสามคนเก็บเปลือกหอยรวมกันได้ 310 ชิ้น แป้งเก็บเปลือกหอยได้กี่ชิ้น`},options:[{id:`A`,label:{en:`120 shells`,th:`120 ชิ้น`}},{id:`B`,label:{en:`100 shells`,th:`100 ชิ้น`}},{id:`C`,label:{en:`95 shells`,th:`95 ชิ้น`}},{id:`D`,label:{en:`90 shells`,th:`90 ชิ้น`}}],correctOptionId:`D`,explanation:{en:`Let Bank = b. Mild = 1.2b, Pang = 0.75 × 1.2b = 0.9b. Sum: b + 1.2b + 0.9b = 3.1b = 310, so b = 100. Then Mild = 120 and Pang = 0.9 × 100 = 90 shells.`,th:`ให้แบงค์เก็บได้ b ชิ้น มายด์เก็บได้ 1.2b ชิ้น แป้งเก็บได้ 0.75 × 1.2b = 0.9b ชิ้น รวมกัน: b + 1.2b + 0.9b = 3.1b = 310 จะได้ b = 100 ดังนั้นมายด์เก็บได้ 120 ชิ้น และแป้งเก็บได้ 0.9 × 100 = 90 ชิ้น`},distractorNotes:{A:{en:`This gives Mild's total (120 shells) instead of Pang's.`,th:`ตอบเป็นจำนวนของมายด์ (120 ชิ้น) แทนที่จะเป็นของแป้ง`},B:{en:`This gives Bank's total (100 shells) instead of Pang's.`,th:`ตอบเป็นจำนวนของแบงค์ (100 ชิ้น) แทนที่จะเป็นของแป้ง`},C:{en:`This mistakenly subtracts 25% of Bank's amount from Mild's amount (120 − 25 = 95) instead of subtracting 25% of Mild's own amount.`,th:`เข้าใจผิดว่าต้องลบ 25% ของแบงค์ออกจากจำนวนของมายด์ (120 − 25 = 95) แทนที่จะลบ 25% ของมายด์เอง`}},hints:[{en:`Let Bank's amount be b, and write Mild's and Pang's amounts in terms of b, one step at a time.`,th:`ให้แบงค์เก็บได้ b ชิ้น แล้วเขียนจำนวนของมายด์และแป้งในรูปของ b ทีละขั้นตอน`},{en:`"25% fewer than Mild" means Pang = Mild × (1 − 0.25), using Mild's own amount as the base, not Bank's.`,th:`"น้อยกว่ามายด์ 25%" หมายความว่า แป้ง = มายด์ × (1 − 0.25) โดยใช้จำนวนของมายด์เองเป็นฐาน ไม่ใช่ของแบงค์`},{en:`Add all three expressions in terms of b, set the sum equal to 310, solve for b, then work out Pang's amount.`,th:`นำนิพจน์ทั้งสามในรูปของ b มาบวกกัน ให้เท่ากับ 310 แก้หาค่า b แล้วจึงคำนวณจำนวนของแป้ง`}],visual:null,estimatedSeconds:170}]},{id:`samsen-mock-e`,title:{en:`Mock Test E`,th:`ข้อสอบชุด E`},subtitle:{en:`Final Countdown Paper`,th:`ชุดสุดท้ายก่อนสอบจริง`},recommendedMinutes:40,questions:[{id:`E-01`,testId:`samsen-mock-e`,number:1,skill:`Number & Operations`,topic:{en:`Digit Arrangement`,th:`การจัดเรียงตัวเลข`},difficulty:I(1),prompt:{en:`On exam day, Nan is assigned a 4-digit locker code made from the digit cards 0, 2, 4, 6, and 9, using each digit at most once. For luck, she wants the code to be the SMALLEST possible ODD number. What is her locker code?`,th:`ในวันสอบ หนานได้รับรหัสล็อกเกอร์ 4 หลัก ซึ่งต้องสร้างจากบัตรตัวเลข 0, 2, 4, 6 และ 9 โดยใช้แต่ละหลักไม่เกิน 1 ครั้ง เธออยากให้รหัสเป็นจำนวนคี่ที่มีค่าน้อยที่สุดเพื่อความเป็นสิริมงคล รหัสล็อกเกอร์ของเธอคือข้อใด`},options:[{id:`A`,label:{en:`2,046`,th:`2,046`}},{id:`B`,label:{en:`2,049`,th:`2,049`}},{id:`C`,label:{en:`4,209`,th:`4,209`}},{id:`D`,label:{en:`2,069`,th:`2,069`}}],correctOptionId:`B`,explanation:{en:`For the number to be odd, the last digit must be 9 (the only odd digit available). To make the whole number as small as possible, the first three digits should be the three SMALLEST remaining digits (0, 2, 4), arranged with the smallest non-zero digit leading: 2, then 0, then 4, giving 204. So the code is 2,049.`,th:`จำนวนจะเป็นจำนวนคี่ได้ก็ต่อเมื่อหลักหน่วยเป็น 9 (เลขคี่ตัวเดียวที่มี) เพื่อให้จำนวนทั้งหมดมีค่าน้อยที่สุด สามหลักแรกควรเป็นเลขที่เหลือที่น้อยที่สุดสามตัว (0, 2, 4) โดยเรียงให้หลักแรกเป็นเลขที่ไม่ใช่ 0 ที่น้อยที่สุดคือ 2 แล้วตามด้วย 0 และ 4 ได้เป็น 204 ดังนั้นรหัสคือ 2,049`},distractorNotes:{A:{en:`This is the smallest 4-digit number possible from the digits, but it ends in 6 (even) — the odd requirement was ignored.`,th:`2,046 เป็นจำนวน 4 หลักที่น้อยที่สุดที่เรียงได้จากตัวเลขที่มี แต่ลงท้ายด้วย 6 ซึ่งเป็นเลขคู่ — ลืมเงื่อนไขว่าต้องเป็นจำนวนคี่`},C:{en:`This correctly fixes 9 as the last digit but then arranges the remaining digits (2, 0, 4) in descending order instead of ascending, giving the largest possible prefix instead of the smallest.`,th:`2,069 กำหนดให้หลักหน่วยเป็น 9 ถูกต้อง แต่นำเลขที่เหลือ (2, 0, 4) มาเรียงจากมากไปน้อยแทนที่จะเรียงจากน้อยไปมาก ทำให้ได้ส่วนหน้าที่มากที่สุดแทนที่จะเป็นน้อยที่สุด`},D:{en:`This uses digit 6 in the prefix instead of 4, forgetting to pick the three smallest remaining digits (0, 2, 4) for the smallest possible number.`,th:`2,069 ใช้เลข 6 ในส่วนหน้าแทนที่จะเป็น 4 ลืมเลือกเลขที่เหลือที่น้อยที่สุดสามตัว (0, 2, 4) เพื่อให้ได้จำนวนที่น้อยที่สุด`}},hints:[{en:`Think about which digit an odd number must end in.`,th:`ลองคิดดูว่าจำนวนคี่ต้องลงท้ายด้วยเลขอะไร`},{en:`Among the digits given, only 9 can be the last digit of an odd number.`,th:`ในบรรดาตัวเลขที่ให้มา มีเพียง 9 เท่านั้นที่เป็นหลักหน่วยของจำนวนคี่ได้`},{en:`With 9 fixed as the last digit, pick the three smallest remaining digits and arrange them in ascending order (smallest non-zero digit first) to make the front part as small as possible.`,th:`เมื่อกำหนดให้ 9 เป็นหลักหน่วยแล้ว ให้เลือกเลขที่เหลือที่น้อยที่สุดสามตัว แล้วเรียงจากน้อยไปมาก (โดยให้หลักแรกไม่ใช่ 0) เพื่อให้ส่วนหน้าน้อยที่สุด`}],visual:null,estimatedSeconds:55},{id:`E-02`,testId:`samsen-mock-e`,number:2,skill:`Word Problems & Logic`,topic:{en:`Price & Quantity Puzzle`,th:`โจทย์ราคาและจำนวน`},difficulty:I(2),prompt:{en:`On the morning of the exam, Tan has just enough money to buy pencils at 9 baht each, with 12 baht left over. If pencils had cost 7 baht each instead, he could have bought 4 more pencils and still had 6 baht left over. How much money does Tan have?`,th:`เช้าวันสอบ แทนมีเงินพอดีสำหรับซื้อดินสอราคาแท่งละ 9 บาท โดยเหลือเงิน 12 บาท แต่ถ้าดินสอราคาแท่งละ 7 บาท เขาจะซื้อได้เพิ่มอีก 4 แท่ง และยังเหลือเงิน 6 บาท แทนมีเงินทั้งหมดกี่บาท`},options:[{id:`A`,label:{en:`105 baht`,th:`105 บาท`}},{id:`B`,label:{en:`99 baht`,th:`99 บาท`}},{id:`C`,label:{en:`111 baht`,th:`111 บาท`}},{id:`D`,label:{en:`120 baht`,th:`120 บาท`}}],correctOptionId:`C`,explanation:{en:`Let N be the number of pencils bought at 9 baht. Money = 9N + 12. At 7 baht each, he buys N + 4 pencils: Money = 7(N + 4) + 6 = 7N + 34. Setting these equal: 9N + 12 = 7N + 34, so 2N = 22, N = 11. Money = 9(11) + 12 = 111 baht.`,th:`ให้ N เป็นจำนวนดินสอที่ซื้อได้เมื่อราคาแท่งละ 9 บาท จะได้เงินทั้งหมด = 9N + 12 เมื่อราคาแท่งละ 7 บาท จะซื้อได้ N+4 แท่ง เงินทั้งหมด = 7(N+4) + 6 = 7N + 34 นำสองสมการมาเท่ากัน: 9N + 12 = 7N + 34 ได้ 2N = 22 ดังนั้น N = 11 เงินทั้งหมด = 9(11) + 12 = 111 บาท`},distractorNotes:{A:{en:`This only multiplies 7 baht by the new quantity (15 pencils) without adding back the 6 baht left over.`,th:`105 บาท คำนวณเพียง 7 คูณจำนวนแท่งใหม่ (15 แท่ง) โดยลืมบวกเงินที่เหลือ 6 บาทกลับเข้าไป`},B:{en:`This only multiplies 9 baht by the original quantity (11 pencils) without adding back the 12 baht left over.`,th:`99 บาท คำนวณเพียง 9 คูณจำนวนแท่งเดิม (11 แท่ง) โดยลืมบวกเงินที่เหลือ 12 บาทกลับเข้าไป`},D:{en:`This comes from an arithmetic slip while solving the equation, leading to the wrong value of N (12 instead of 11).`,th:`120 บาท เกิดจากความผิดพลาดในการคำนวณขณะแก้สมการ ทำให้ได้ค่า N ผิด (12 แทนที่จะเป็น 11)`}},hints:[{en:`Let N be the number of pencils Tan can buy at 9 baht each, and write his total money in terms of N.`,th:`ให้ N เป็นจำนวนดินสอที่แทนซื้อได้เมื่อราคาแท่งละ 9 บาท แล้วเขียนเงินทั้งหมดในรูปของ N`},{en:`At the lower price he buys N+4 pencils — write a second expression for the same total money.`,th:`เมื่อราคาถูกลง เขาซื้อได้ N+4 แท่ง — เขียนเงินทั้งหมดอีกสมการหนึ่งในรูปเดียวกัน`},{en:`Set the two money expressions equal to each other and solve for N, then substitute back to find the total money.`,th:`ให้สมการเงินทั้งสองเท่ากัน แก้หาค่า N แล้วแทนกลับเพื่อหาจำนวนเงินทั้งหมด`}],visual:null,estimatedSeconds:65},{id:`E-03`,testId:`samsen-mock-e`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:I(3),prompt:{en:`In the week before the SAMSEN exam, seven students compared the fraction of questions they answered correctly on their final mock test: \\frac{5}{9}, \\frac{3}{5}, \\frac{7}{15}, \\frac{4}{7}, \\frac{11}{18}, \\frac{2}{3}, and \\frac{13}{20}. Which of these fractions is the 5th HIGHEST score?`,th:`ในสัปดาห์สุดท้ายก่อนสอบ นักเรียนเจ็ดคนเปรียบเทียบสัดส่วนข้อที่ตอบถูกในข้อสอบจำลองชุดสุดท้ายของตน ได้แก่ \\frac{5}{9}, \\frac{3}{5}, \\frac{7}{15}, \\frac{4}{7}, \\frac{11}{18}, \\frac{2}{3} และ \\frac{13}{20} เศษส่วนใดคือคะแนนที่มากเป็นอันดับที่ 5`},options:[{id:`A`,label:{en:`\\frac{3}{5}`,th:`\\frac{3}{5}`}},{id:`B`,label:{en:`\\frac{5}{9}`,th:`\\frac{5}{9}`}},{id:`C`,label:{en:`\\frac{7}{15}`,th:`\\frac{7}{15}`}},{id:`D`,label:{en:`\\frac{4}{7}`,th:`\\frac{4}{7}`}}],correctOptionId:`D`,explanation:{en:`Converting to decimals: \\frac{2}{3}≈0.667, \\frac{13}{20}=0.65, \\frac{11}{18}≈0.611, \\frac{3}{5}=0.6, \\frac{4}{7}≈0.571, \\frac{5}{9}≈0.556, \\frac{7}{15}≈0.467. Ordered highest to lowest: \\frac{2}{3}, \\frac{13}{20}, \\frac{11}{18}, \\frac{3}{5}, \\frac{4}{7}, \\frac{5}{9}, \\frac{7}{15}. The 5th highest is \\frac{4}{7}.`,th:`แปลงเป็นทศนิยม: \\frac{2}{3}≈0.667, \\frac{13}{20}=0.65, \\frac{11}{18}≈0.611, \\frac{3}{5}=0.6, \\frac{4}{7}≈0.571, \\frac{5}{9}≈0.556, \\frac{7}{15}≈0.467 เรียงจากมากไปน้อยได้: \\frac{2}{3}, \\frac{13}{20}, \\frac{11}{18}, \\frac{3}{5}, \\frac{4}{7}, \\frac{5}{9}, \\frac{7}{15} ดังนั้นอันดับที่ 5 คือ \\frac{4}{7}`},distractorNotes:{A:{en:`\\frac{3}{5} is actually the 4th highest, one rank too high.`,th:`\\frac{3}{5} จริง ๆ แล้วอยู่อันดับที่ 4 ซึ่งสูงกว่าที่โจทย์ถามไปหนึ่งอันดับ`},B:{en:`\\frac{5}{9} is actually the 6th highest, one rank too low.`,th:`\\frac{5}{9} จริง ๆ แล้วอยู่อันดับที่ 6 ซึ่งต่ำกว่าที่โจทย์ถามไปหนึ่งอันดับ`},C:{en:`\\frac{7}{15} is the lowest of all seven fractions, not the 5th highest.`,th:`\\frac{7}{15} เป็นเศษส่วนที่มีค่าน้อยที่สุดในทั้งเจ็ดจำนวน ไม่ใช่อันดับที่ 5`}},hints:[{en:`Convert every fraction to a decimal so they are easy to compare.`,th:`แปลงเศษส่วนทุกตัวเป็นทศนิยมเพื่อให้เปรียบเทียบได้ง่าย`},{en:`Line the decimals up from highest to lowest before counting ranks.`,th:`เรียงทศนิยมจากมากไปน้อยก่อน แล้วค่อยนับอันดับ`},{en:`After ordering, count carefully: 1st, 2nd, 3rd, 4th, 5th — double-check you have not shifted by one place.`,th:`หลังจากเรียงแล้ว นับอันดับอย่างละเอียด 1, 2, 3, 4, 5 — ตรวจสอบว่าไม่ได้เลื่อนอันดับผิดไปหนึ่งตำแหน่ง`}],visual:null,estimatedSeconds:55},{id:`E-04`,testId:`samsen-mock-e`,number:4,skill:`Number & Operations`,topic:{en:`Mixed Operations with Brackets`,th:`การดำเนินการผสมและวงเล็บ`},difficulty:I(4),prompt:{en:`While drilling order-of-operations questions for the exam, Toon writes A = (12 + 8) × 3 − 40 and B = (24 ÷ 6 + 5) × 2 − 8. Find the value of 3 × (A ÷ B).`,th:`ขณะฝึกโจทย์การดำเนินการผสมก่อนสอบ ตูนเขียน A = (12 + 8) × 3 − 40 และ B = (24 ÷ 6 + 5) × 2 − 8 จงหาค่าของ 3 × (A ÷ B)`},options:[{id:`A`,label:{en:`6`,th:`6`}},{id:`B`,label:{en:`2`,th:`2`}},{id:`C`,label:{en:`1.5`,th:`1.5`}},{id:`D`,label:{en:`18`,th:`18`}}],correctOptionId:`A`,explanation:{en:`A = (12+8)×3−40 = 20×3−40 = 60−40 = 20. B = (24÷6+5)×2−8 = (4+5)×2−8 = 9×2−8 = 18−8 = 10. So 3×(A÷B) = 3×(20÷10) = 3×2 = 6.`,th:`A = (12+8)×3−40 = 20×3−40 = 60−40 = 20 และ B = (24÷6+5)×2−8 = (4+5)×2−8 = 9×2−8 = 18−8 = 10 ดังนั้น 3×(A÷B) = 3×(20÷10) = 3×2 = 6`},distractorNotes:{B:{en:`This is just A÷B (2) — the final multiplication by 3 was forgotten.`,th:`นี่คือค่า A÷B (2) เพียงอย่างเดียว — ลืมคูณด้วย 3 ในขั้นตอนสุดท้าย`},C:{en:`This comes from computing 3×(B÷A) — the fractions A and B were swapped.`,th:`ได้จากการคำนวณ 3×(B÷A) — สลับตำแหน่งของ A และ B กัน`},D:{en:`This comes from using A = 60 (forgetting to subtract 40), giving 3×(60÷10) = 18.`,th:`ได้จากการใช้ A = 60 (ลืมลบ 40 ออก) ทำให้ได้ 3×(60÷10) = 18`}},hints:[{en:`Work out A and B separately first, following the order of operations inside each bracket.`,th:`หาค่า A และ B แยกกันก่อน โดยทำตามลำดับการดำเนินการในวงเล็บแต่ละอัน`},{en:`Remember: brackets first, then multiplication/division, then addition/subtraction.`,th:`จำไว้ว่า ทำในวงเล็บก่อน แล้วจึงคูณหรือหาร จากนั้นจึงบวกหรือลบ`},{en:`Once you have A = 20 and B = 10, compute A ÷ B first, then multiply the result by 3.`,th:`เมื่อได้ A = 20 และ B = 10 แล้ว ให้หาค่า A ÷ B ก่อน แล้วจึงนำผลลัพธ์ไปคูณด้วย 3`}],visual:null,estimatedSeconds:60},{id:`E-05`,testId:`samsen-mock-e`,number:5,skill:`Number & Operations`,topic:{en:`Division with Remainder (GCF)`,th:`การหารที่มีเศษ (ห.ร.ม.)`},difficulty:I(5),prompt:{en:`Before the exam, two study groups completed a combined 96 practice questions. The number Group A completed, divided by the number Group B completed, gives a quotient of 4 and a remainder of 6. Find the GCF (greatest common factor) of the two groups’ question counts.`,th:`ก่อนสอบ นักเรียนสองกลุ่มทำโจทย์ฝึกฝนรวมกันได้ 96 ข้อ เมื่อนำจำนวนข้อที่กลุ่ม A ทำได้ไปหารด้วยจำนวนข้อที่กลุ่ม B ทำได้ จะได้ผลหาร 4 เศษ 6 จงหา ห.ร.ม. (ตัวหารร่วมมาก) ของจำนวนข้อที่ทั้งสองกลุ่มทำได้`},options:[{id:`A`,label:{en:`18`,th:`18`}},{id:`B`,label:{en:`6`,th:`6`}},{id:`C`,label:{en:`234`,th:`234`}},{id:`D`,label:{en:`3`,th:`3`}}],correctOptionId:`B`,explanation:{en:`Let Group B complete b questions; Group A completes a = 4b + 6. Since a + b = 96: 4b + 6 + b = 96, so 5b = 90, b = 18, and a = 78. Factors of 78: 1, 2, 3, 6, 13, 26, 39, 78. Factors of 18: 1, 2, 3, 6, 9, 18. The greatest common factor is 6.`,th:`ให้กลุ่ม B ทำได้ b ข้อ กลุ่ม A ทำได้ a = 4b + 6 ข้อ เนื่องจาก a + b = 96 จะได้ 4b + 6 + b = 96 ดังนั้น 5b = 90 นั่นคือ b = 18 และ a = 78 ตัวประกอบของ 78 คือ 1, 2, 3, 6, 13, 26, 39, 78 ตัวประกอบของ 18 คือ 1, 2, 3, 6, 9, 18 ตัวหารร่วมมากคือ 6`},distractorNotes:{A:{en:`This mistakes Group B’s own question count (18) for the greatest common factor of the two counts.`,th:`18 คือจำนวนข้อของกลุ่ม B เอง ไม่ใช่ตัวหารร่วมมากของจำนวนข้อทั้งสองกลุ่ม`},C:{en:`This computes the LCM (lowest common multiple) of 78 and 18 instead of the GCF.`,th:`234 คือ ค.ร.น. (ตัวคูณร่วมน้อย) ของ 78 และ 18 ไม่ใช่ ห.ร.ม.`},D:{en:`This stops at a common factor of 3 without checking that 6 also divides both numbers, so it is not the GREATEST common factor.`,th:`3 เป็นเพียงตัวหารร่วมตัวหนึ่ง แต่ยังไม่ได้ตรวจสอบว่า 6 ก็หารทั้งสองจำนวนลงตัวเช่นกัน จึงยังไม่ใช่ตัวหารร่วม "มาก" ที่สุด`}},hints:[{en:`Let Group B’s count be b, and write Group A’s count in terms of b using the quotient and remainder.`,th:`ให้จำนวนข้อของกลุ่ม B เป็น b แล้วเขียนจำนวนข้อของกลุ่ม A ในรูปของ b โดยใช้ผลหารและเศษ`},{en:`A division with quotient 4 and remainder 6 means: Group A = 4 × Group B + 6.`,th:`การหารที่ได้ผลหาร

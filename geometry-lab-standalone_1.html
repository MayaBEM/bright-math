— the outer scale.`],explanation:`Correct! Reading the outer scale from the left-hand 0 gives 145°, which matches the wide opening you can see.`,reteach:`The arm on the baseline points left, so the outer scale is the one starting at 0 on your arm: 145°. The inner scale reads 35 at the same mark, but a 35° angle would be a narrow sliver, not this wide opening.`,tags:[`outer-scale`]},{id:`l3-31`,lesson:`l3`,skill:`estimate`,difficulty:3,type:`error-analysis`,context:`Mia looks at a door standing open and estimates the angle between the door and the wall.`,prompt:`Mia says, "That is about 60°." Is her estimate sensible?`,figure:{kind:`reallife`,variant:`door`,degrees:150},options:[{id:`a`,text:`No. The door has opened well past a square corner, so a sensible estimate is about 150°.`},{id:`b`,text:`Yes, 60° looks about right.`,why:`A 60° opening is narrower than a square corner, but this door has swung far past that.`},{id:`c`,text:`No — it must be exactly 90°, because doors always open to a right angle.`,why:`Doors can stop at any angle. This one is clearly wider than a square corner.`},{id:`d`,text:`No — it is more than 180°.`,why:`More than 180° would mean the door had folded back past the flat wall, which it has not.`}],answer:{kind:`choice`,correct:`a`},hints:[`Compare the opening with a square corner and with a straight line.`,`Is the door nearer to a square corner, or nearer to lying flat against the wall?`],explanation:`Correct! The door has swung well past a right angle and is getting close to flat, so about 150° is a sensible estimate. Mia's 60° would be a narrow opening.`,reteach:`A good estimate always starts by comparing with 90° and 180°. This opening is bigger than a square corner but smaller than a straight line, so the estimate must be between 90° and 180°. Anything like 60° can be ruled out straight away.`,tags:[`estimation`,`real-life`]},{id:`l3-32`,lesson:`l3`,skill:`estimate`,difficulty:3,type:`figure-choice`,prompt:`Which of these angles is the largest?`,options:[{id:`a`,figure:{kind:`angle`,degrees:35,rotation:0,armLengths:[110,110]},why:`Its arms are the longest ones drawn, but the opening at the vertex is the narrowest of the three.`},{id:`b`,figure:{kind:`angle`,degrees:70,rotation:0,armLengths:[52,52]}},{id:`c`,figure:{kind:`angle`,degrees:50,rotation:0,armLengths:[92,92]},why:`Close, but the opening between these arms is smaller than the opening in the correct answer.`}],answer:{kind:`choice`,correct:`b`},hints:[`Do not compare how long the arms look. Compare how far open the corner is.`,`Imagine closing each angle like a pair of scissors. Which needs the biggest turn?`],explanation:`Correct! That angle is 70°, the widest opening of the three — even though its arms are the shortest ones drawn. The other two measure 35° and 50°.`,reteach:`Size of an angle = amount of turn at the vertex, never the length of the arms. Look only at how far apart the arms swing from the corner.`,tags:[`estimation`,`arm-length`]},{id:`l3-33`,lesson:`l3`,skill:`classify-measure`,difficulty:3,type:`mcq`,context:`An angle is bigger than a right angle but smaller than a straight angle.`,prompt:`Which measurement could this angle be?`,options:[{id:`a`,text:`90°`,why:`Exactly 90° IS the right angle, so it is not bigger than one.`},{id:`b`,text:`95°`},{id:`c`,text:`180°`,why:`Exactly 180° IS the straight angle, so it is not smaller than one.`},{id:`d`,text:`185°`,why:`185° has gone past a straight line. That is a reflex angle.`}],answer:{kind:`choice`,correct:`b`},hints:[`Write the two fences down: bigger than 90, smaller than 180.`,`The words "bigger than" and "smaller than" do not include the fence numbers themselves.`],explanation:`Correct! 95° sits strictly between 90° and 180°, so it is an obtuse angle.`,reteach:`An obtuse angle satisfies 90 < angle < 180. The fence values 90 and 180 are not included: 90° is a right angle and 180° is a straight angle. Only 95° lies properly between them.`,tags:[`ranges`]},{id:`l3-34`,lesson:`l3`,skill:`classify-measure`,difficulty:3,type:`error-analysis`,context:`Sam measures an angle carefully and gets exactly 90°.`,prompt:`Sam writes, "It is acute, because 90 is less than 180." What is the mistake?`,figure:{kind:`angle`,degrees:90,rotation:0,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`Acute means less than 90°, not less than 180°. Exactly 90° has its own name: a right angle.`},{id:`b`,text:`The measurement is wrong — this angle is not really 90°.`,why:`The small square mark shows the angle really is 90°. The measuring was fine; the naming was not.`},{id:`c`,text:`It should be called obtuse, because 90 is not tiny.`,why:`Obtuse angles are strictly bigger than 90°. 90° itself is not obtuse either.`},{id:`d`,text:`Sam is right, because acute covers everything up to a straight angle.`,why:`If that were true there would be no need for the words "right" or "obtuse" at all.`}],answer:{kind:`choice`,correct:`a`},hints:[`Which number is the fence for acute angles: 90 or 180?`,`Exactly 90° has a special name of its own.`],explanation:`Correct! The fence for acute is 90°, not 180°. An angle of exactly 90° is a right angle — it is not acute and it is not obtuse.`,reteach:`Learn the boundaries carefully: acute is 0 < a < 90, right is exactly 90, obtuse is 90 < a < 180, straight is exactly 180. 90° sits on the fence, so it gets the name "right angle".`,tags:[`ranges`]},{id:`l3-35`,lesson:`l3`,skill:`angle-facts`,difficulty:3,type:`numeric`,context:`The clock shows half past three.`,prompt:`What is the angle between the hour hand and the minute hand?`,figure:{kind:`clock`,hour:3,minute:30},answer:{kind:`numeric`,value:75},unit:`°`,placeholder:`?`,hints:[`The minute hand points straight down at the 6, which is 180° round from the 12.`,`The hour hand does not sit on the 3 any more — in half an hour it creeps half way towards the 4.`],explanation:`Correct! The minute hand is at 180° and the hour hand has moved from 90° to 105° (half of one 30° step). The gap is 180 − 105 = 75°.`,reteach:`The hour hand moves all the time: 30° per hour, which is 0.5° every minute. After 30 minutes it has crept 15° past the 3, so it sits at 105°. The minute hand is at 180°, so the angle is 180 − 105 = 75°.`,tags:[`clock`]},{id:`l3-36`,lesson:`l3`,skill:`angle-facts`,difficulty:3,type:`numeric`,context:`P, O and S lie on one straight line. Rays OQ and OR both start at O.`,prompt:`Angle POQ is 40° and angle QOR is 65°. How many degrees is angle ROS?`,figure:{kind:`multi-angle`,vertex:`O`,rays:[{name:`P`,deg:0},{name:`Q`,deg:40},{name:`R`,deg:105},{name:`S`,deg:180}]},answer:{kind:`numeric`,value:75},unit:`°`,placeholder:`?`,hints:[`All three angles sit on the straight line from P to S.`,`Add the two angles you know, then take the total away from 180.`],explanation:`Correct! 40 + 65 = 105, and angles on a straight line add to 180, so angle ROS = 180 − 105 = 75°.`,reteach:`However many angles sit side by side on a straight line, they always add to 180°. Add the known ones first: 40 + 65 = 105. Then 180 − 105 = 75°.`,tags:[`straight-line`]},{id:`l3-37`,lesson:`l3`,skill:`angle-facts`,difficulty:3,type:`build-angle`,context:`A complete turn all the way round is 360°.`,prompt:`Drag the moving arm to build an angle that is exactly a quarter of a complete turn.`,answer:{kind:`build`,target:90,tolerance:2},hints:[`A quarter means one of four equal parts.`,`Work out 360 ÷ 4 before you drag anything.`],explanation:`Correct! 360 ÷ 4 = 90, so a quarter turn is a right angle of 90°.`,reteach:`Split the complete turn of 360° into four equal parts: 360 ÷ 4 = 90. A quarter turn and a right angle are two names for the same 90° angle.`,tags:[`turns`]},{id:`l3-38`,lesson:`l3`,skill:`angle-facts`,difficulty:3,type:`build-angle`,context:`Two angles sit side by side on a straight line. One of them measures 55°.`,prompt:`Build the second angle so that the two of them together make the straight line.`,answer:{kind:`build`,target:125,tolerance:2},hints:[`Angles on a straight line always add up to 180°.`,`Take 55 away from 180 before you drag the arm.`],explanation:`Correct! 180 − 55 = 125, so the second angle must be 125° for the pair to make a straight line.`,reteach:`A straight line is a 180° angle. If one piece is 55°, the rest of the line is what is left over: 180 − 55 = 125°.`,tags:[`straight-line`]}]})),Ua,Wa=o((()=>{Ua=[{id:`l4-01`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`mcq`,prompt:`You are about to draw an angle of 70°. What is the very first thing you do?`,figure:{kind:`basic`,variant:`ray`,labels:[`B`,`A`]},options:[{id:`a`,text:`Draw one straight ray and mark its endpoint as the vertex.`},{id:`b`,text:`Put the protractor down and look for the 70 mark.`,why:`The protractor needs something to sit on. Without a ray there is nothing to line it up with.`},{id:`c`,text:`Make a dot at 70° somewhere on the paper.`,why:`A single dot on its own does not tell you where the angle opens from.`},{id:`d`,text:`Draw both rays roughly, then tidy them up.`,why:`If you draw the second ray by eye, the angle will not measure 70° when you check it.`}],answer:{kind:`choice`,correct:`a`},hints:[`Every angle is made of two rays that meet. Which one can you draw without measuring anything?`,`The protractor has to rest on something.`],explanation:`Correct! You start with one ray. Its endpoint becomes the vertex, and everything else is measured from it.`,reteach:`Start with one ray drawn with a ruler. The endpoint of that ray is the vertex of your angle, and the protractor will sit on it.`,tags:[`steps`]},{id:`l4-02`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`mcq`,prompt:`Which part of the protractor must sit exactly on the vertex?`,figure:{kind:`protractor`,degrees:55},options:[{id:`a`,text:`The small centre mark in the middle of the straight edge.`},{id:`b`,text:`The bottom edge of the plastic.`,why:`The plastic edge is a few millimetres below the centre mark, so your angle would come out wrong.`},{id:`c`,text:`The corner where 0 is printed.`,why:`The 0 mark shows you where to start counting, but the angle turns around the centre.`},{id:`d`,text:`The curved edge where the numbers are.`,why:`The curved edge is where you read the size, not where the angle turns.`}],answer:{kind:`choice`,correct:`a`},hints:[`The vertex is the point everything turns around.`,`Look for the tiny cross, hole or arrow in the middle of the straight edge.`],explanation:`Correct! The centre mark is the point the whole scale turns around, so it has to sit right on the vertex.`,reteach:`Find the little centre mark in the middle of the straight edge. Place it on the vertex, not on the plastic edge below it.`,tags:[`protractor`]},{id:`l4-03`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`build-angle`,prompt:`Create an angle measuring 40°.`,answer:{kind:`build`,target:40,tolerance:3},hints:[`40° is less than a right angle, so keep the second arm well below the upright position.`,`A right angle is 90°. You need under half of that.`],explanation:`Correct! 40° is an acute angle — a small, sharp opening well under a square corner.`,reteach:`Think of 90° as straight up. 40° is a little less than half of that, so the second arm stays quite low.`,tags:[`build`,`acute`]},{id:`l4-04`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`build-angle`,context:`A picture frame is being fitted into the corner of a wall.`,prompt:`Create an angle measuring 90°.`,answer:{kind:`build`,target:90,tolerance:3},hints:[`A 90° angle is a square corner, like the corner of this screen.`,`The second arm should point straight up from the first one.`],explanation:`Correct! 90° is a right angle. The two arms make a perfect square corner.`,reteach:`A right angle is exactly 90°. Turn the second arm until it points straight up and a small square appears at the vertex.`,tags:[`build`,`right`]},{id:`l4-05`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`mcq`,prompt:`You have marked a small dot next to the 70 mark on the protractor. What do you do last?`,options:[{id:`a`,text:`Lift the protractor and join the vertex to the dot with a ruler.`},{id:`b`,text:`Join the 0 mark to the dot with a ruler.`,why:`The second arm must start at the vertex, not at the 0 printed on the protractor.`},{id:`c`,text:`Rub out the first ray so only the dot is left.`,why:`The first ray is one of the two arms — you need it to make the angle.`},{id:`d`,text:`Draw a curved arc from the dot to the paper edge.`,why:`An arc is only a label for the angle. The angle itself is made by the second straight arm.`}],answer:{kind:`choice`,correct:`a`},hints:[`An angle is made of two straight arms meeting at a point.`,`Where must the second arm begin?`],explanation:`Correct! The dot only shows the direction. You finish by ruling a straight line from the vertex through that dot.`,reteach:`The last step is always the same: take the protractor away and rule a straight arm from the vertex to your dot.`,tags:[`steps`]},{id:`l4-06`,lesson:`l4`,skill:`reason-angle`,difficulty:1,type:`numeric`,prompt:`A quarter turn is 90°. If you draw an angle exactly half that size, how many degrees is it?`,answer:{kind:`numeric`,value:45},unit:`°`,placeholder:`?`,hints:[`Half of a quarter turn is one eighth of a full turn.`,`Halve 90.`],explanation:`Correct! Half of 90° is 45°, so you would draw a 45° angle. It is acute, exactly half a square corner.`,reteach:`A quarter turn measures 90°. Half of 90 is 45, so the angle you draw is 45°.`,tags:[`reasoning`]},{id:`l4-07`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`figure-choice`,prompt:`Which drawing shows a correctly drawn 60° angle?`,options:[{id:`a`,figure:{kind:`angle`,degrees:30,showArc:!0},why:`This opening is only half the size it should be — it is 30°, not 60°.`},{id:`b`,figure:{kind:`angle`,degrees:60,showArc:!0}},{id:`c`,figure:{kind:`angle`,degrees:90,showArc:!0},why:`The square mark shows a right angle of 90°, which is much wider than 60°.`},{id:`d`,figure:{kind:`angle`,degrees:120,showArc:!0},why:`This one is wider than a square corner, so it is obtuse — 60° must be acute.`}],answer:{kind:`choice`,correct:`b`},hints:[`60° is acute, so it must be narrower than a square corner.`,`Two thirds of a right angle is 60°.`],explanation:`Correct! 60° is comfortably less than a square corner but clearly wider than a thin 30° opening.`,reteach:`Compare each drawing with a right angle. 60° is acute, so the correct one is narrower than 90° but not as thin as 30°.`,tags:[`estimate`]},{id:`l4-08`,lesson:`l4`,skill:`reason-angle`,difficulty:1,type:`sort`,prompt:`Before you draw each of these angles, decide whether it will be acute or obtuse.`,buckets:[{id:`acute`,label:`Acute (under 90°)`},{id:`obtuse`,label:`Obtuse (over 90°)`}],items:[{id:`i1`,label:`Draw 35°`,bucket:`acute`},{id:`i2`,label:`Draw 100°`,bucket:`obtuse`},{id:`i3`,label:`Draw 72°`,bucket:`acute`},{id:`i4`,label:`Draw 125°`,bucket:`obtuse`},{id:`i5`,label:`Draw 89°`,bucket:`acute`},{id:`i6`,label:`Draw 150°`,bucket:`obtuse`}],answer:{kind:`sort`},hints:[`Compare each number with 90.`,`Smaller than 90 is acute. Bigger than 90 (but under 180) is obtuse.`],explanation:`Correct! 35°, 72° and 89° are all under 90°, so they are acute. 100°, 125° and 150° are all over 90°, so they are obtuse. Knowing this before you draw helps you spot a wrong reading.`,reteach:`Only the number matters here. Under 90° is acute, over 90° is obtuse. 89° is still acute even though it is very close to a right angle.`,tags:[`classify`]},{id:`l4-09`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`build-angle`,context:`A ramp is being drawn at 30° to the ground.`,prompt:`Create an angle measuring 30°.`,answer:{kind:`build`,target:30,tolerance:3},hints:[`30° is one third of a right angle.`,`Keep the moving arm low — a gentle slope, not a steep one.`],explanation:`Correct! 30° is a small acute angle, which is why ramps at 30° feel like a gentle slope.`,reteach:`30° is one third of 90°. Slide the arm up only a small way from the ground line.`,tags:[`build`,`acute`,`real-life`]},{id:`l4-10`,lesson:`l4`,skill:`reason-angle`,difficulty:1,type:`numeric`,prompt:`You have drawn an angle of 30°. How many more degrees must you add to make a right angle?`,figure:{kind:`angle`,degrees:30,showArc:!0,showValue:!0,vertex:`B`,arms:[`A`,`C`]},answer:{kind:`numeric`,value:60},unit:`°`,placeholder:`?`,hints:[`A right angle is 90°.`,`Take 30 away from 90.`],explanation:`Correct! 90° − 30° = 60°, so 60 more degrees turns your 30° angle into a right angle.`,reteach:`A right angle measures 90°. You already have 30°, so you still need 90 − 30 = 60°.`,tags:[`reasoning`]},{id:`l4-11`,lesson:`l4`,skill:`draw-angle`,difficulty:1,type:`build-angle`,context:`A pizza is cut into six equal slices, so each slice has a 60° corner.`,prompt:`Create an angle measuring 60°.`,answer:{kind:`build`,target:60,tolerance:3},hints:[`60° is two thirds of a right angle.`,`Stop before the arm points straight up.`],explanation:`Correct! 60° is acute. Six of these angles fit around a point, which is why a pizza cut this way has six equal slices.`,reteach:`60° is two thirds of 90°. Move the arm most of the way to upright, then stop short of it.`,tags:[`build`,`acute`,`real-life`]},{id:`l4-12`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`build-angle`,prompt:`Create an angle measuring 110°.`,answer:{kind:`build`,target:110,tolerance:2},hints:[`110° is obtuse, so it must be wider than a square corner.`,`Go past 90°, then add 20° more.`],explanation:`Correct! 110° is obtuse — 20° more than a right angle.`,reteach:`Move the arm past the upright 90° position, then keep going by another 20° to reach 110°.`,tags:[`build`,`obtuse`]},{id:`l4-13`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`build-angle`,prompt:`Create an angle measuring 135°.`,answer:{kind:`build`,target:135,tolerance:2},hints:[`135° is halfway between a right angle and a straight angle.`,`90 + 45 = 135.`],explanation:`Correct! 135° is obtuse. It sits exactly halfway between 90° and 180°.`,reteach:`A straight angle is 180° and a right angle is 90°. 135° is right in the middle of those two.`,tags:[`build`,`obtuse`]},{id:`l4-14`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`build-angle`,context:`A kite string makes a 75° angle with the flat ground.`,prompt:`Create an angle measuring 75°.`,answer:{kind:`build`,target:75,tolerance:2},hints:[`75° is still acute, but only just.`,`It is 15° short of a right angle.`],explanation:`Correct! 75° is acute, sitting 15° below a right angle — a steep kite string but not upright.`,reteach:`75° is close to 90° but not quite there. Take the arm almost upright, then bring it back by about 15°.`,tags:[`build`,`acute`,`real-life`]},{id:`l4-15`,lesson:`l4`,skill:`reason-angle`,difficulty:2,type:`numeric`,prompt:`You want to draw an angle 20° bigger than a right angle. What size will you draw?`,answer:{kind:`numeric`,value:110},unit:`°`,placeholder:`?`,hints:[`Start from the size of a right angle.`,`Add 20 to 90.`],explanation:`Correct! 90° + 20° = 110°. Because it is over 90° but under 180°, the angle you draw is obtuse.`,reteach:`A right angle is 90°. Twenty degrees bigger than that is 90 + 20 = 110°.`,tags:[`reasoning`]},{id:`l4-16`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`error-analysis`,prompt:`Leo rests the bottom plastic edge of his protractor on the vertex instead of the centre mark, then draws 65°. What goes wrong?`,options:[{id:`a`,text:`The whole scale is shifted a few millimetres off the vertex, so the angle he draws is not really 65°.`},{id:`b`,text:`Nothing goes wrong — the edge and the centre mark are the same place.`,why:`They are not. On most protractors the centre mark sits a little way above the plastic edge.`},{id:`c`,text:`The angle comes out as a reflex angle.`,why:`A small slip does not turn an acute angle into a reflex one — it just makes the size slightly wrong.`},{id:`d`,text:`He will read the outer scale by mistake.`,why:`Which scale you read is a different mistake. This one is about where the protractor sits.`}],answer:{kind:`choice`,correct:`a`},hints:[`Look closely at a real protractor: is the centre mark on the very edge?`,`The angle turns around the centre mark, so that mark must be on the vertex.`],explanation:`Correct! The scale is built around the centre mark. If that mark is not on the vertex, every degree you count is measured from the wrong point.`,reteach:`The centre mark is usually a small cross, hole or arrow set slightly inside the straight edge. Line that mark up with the vertex, not the plastic edge.`,tags:[`error`,`protractor`]},{id:`l4-17`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`mcq`,prompt:`Every mark on a protractor has two numbers. When you are drawing an angle, which number do you use?`,figure:{kind:`protractor`,degrees:50,showReading:!0},options:[{id:`a`,text:`The number on the scale that reads 0 along the ray you have already drawn.`},{id:`b`,text:`Always the outside numbers.`,why:`The outside scale only starts at 0 when your ray points one particular way.`},{id:`c`,text:`Always the inside numbers.`,why:`The inside scale is right only some of the time — it depends which way your ray points.`},{id:`d`,text:`The larger of the two numbers.`,why:`Choosing the larger number would turn every acute angle into an obtuse one.`}],answer:{kind:`choice`,correct:`a`},hints:[`Put your finger on your drawn ray. Which scale shows 0 there?`,`Counting must always start at zero.`],explanation:`Correct! You follow the scale that starts at 0 on your own ray, then count up along that same scale until you reach the size you want.`,reteach:`Neither scale is "the right one" all the time. Find the 0 that sits on your drawn ray and stay on that scale.`,tags:[`scale`]},{id:`l4-18`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`sort`,prompt:`Sort these habits into the right group for drawing an accurate angle.`,buckets:[{id:`do`,label:`Do this`},{id:`dont`,label:`Do not do this`}],items:[{id:`i1`,label:`Put the centre mark exactly on the vertex`,bucket:`do`},{id:`i2`,label:`Lay the straight edge along the ray you drew`,bucket:`do`},{id:`i3`,label:`Count up from the 0 that sits on your own ray`,bucket:`do`},{id:`i4`,label:`Rest the bottom plastic edge on the vertex`,bucket:`dont`},{id:`i5`,label:`Always use the outside numbers, whichever way the ray points`,bucket:`dont`},{id:`i6`,label:`Guess where 70° is instead of finding the mark`,bucket:`dont`}],answer:{kind:`sort`},hints:[`Three of these keep the protractor in the right place and on the right scale.`,`Anything that involves guessing or the wrong edge belongs in "Do not do this".`],explanation:`Correct! Centre mark on the vertex, straight edge along your ray, and counting from your own 0 are the three habits that make angles accurate. The plastic edge, a fixed favourite scale and guessing all cause errors.`,reteach:`Accurate drawing comes down to three checks: right place (centre on vertex), right line (edge along your ray), right scale (start at your own 0).`,tags:[`habits`]},{id:`l4-19`,lesson:`l4`,skill:`reason-angle`,difficulty:2,type:`numeric`,prompt:`What angle must be added to 55° to make a straight angle?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:55},{name:`D`,deg:180}],highlightPair:[`A`,`C`],showValue:!0},answer:{kind:`numeric`,value:125},unit:`°`,placeholder:`?`,hints:[`A straight angle measures 180°.`,`Subtract 55 from 180.`],explanation:`Correct! 180° − 55° = 125°. The two angles sit side by side on the straight line BD and together they make 180°.`,reteach:`Angles on a straight line always add up to 180°. One is 55°, so the other must be 180 − 55 = 125°.`,tags:[`reasoning`,`straight-line`]},{id:`l4-20`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`figure-choice`,prompt:`Which drawing shows a correctly drawn 135° angle?`,options:[{id:`a`,figure:{kind:`angle`,degrees:45,showArc:!0},why:`45° is acute. This is the angle you get if you count from the wrong 0 (180 − 135 = 45).`},{id:`b`,figure:{kind:`angle`,degrees:90,showArc:!0},why:`The square mark means exactly 90°, and 135° is wider than a right angle.`},{id:`c`,figure:{kind:`angle`,degrees:135,showArc:!0}},{id:`d`,figure:{kind:`angle`,degrees:115,showArc:!0},why:`This one is obtuse but too narrow. It is about 20° short of 135°.`}],answer:{kind:`choice`,correct:`c`},hints:[`135° is obtuse, so cross out anything narrower than a square corner.`,`135° is halfway between 90° and 180°, so the arms are almost, but not quite, a straight line.`],explanation:`Correct! 135° sits exactly halfway between a right angle and a straight line, which is what this drawing shows.`,reteach:`First check obtuse or acute, then compare with halfway. 135° is midway between 90° and 180°, so it should look nearly flat but not flat.`,tags:[`estimate`]},{id:`l4-21`,lesson:`l4`,skill:`reason-angle`,difficulty:2,type:`mcq`,context:`Sam was asked to draw an angle of 65°.`,prompt:`His finished angle is clearly wider than a square corner. What most likely went wrong?`,figure:{kind:`angle`,degrees:115,showArc:!0,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`He counted on the wrong scale, so he drew 180 − 65 = 115° instead.`},{id:`b`,text:`He drew the first ray too long.`,why:`Arm length never changes the size of an angle, so this cannot be the cause.`},{id:`c`,text:`He used a blunt pencil.`,why:`A blunt pencil makes a thick line, but it would not add 50° to the angle.`},{id:`d`,text:`He turned the paper round before drawing.`,why:`Turning the paper turns the whole drawing. The angle between the arms stays the same.`}],answer:{kind:`choice`,correct:`a`},hints:[`65° should be acute, so something made the angle much bigger.`,`What do you get if you subtract 65 from 180?`],explanation:`Correct! The two scales are partners: 65 on one scale sits opposite 115 on the other, because 65 + 115 = 180. Counting on the wrong one gives the "partner" angle.`,reteach:`When an angle comes out as 180 minus the size you wanted, you counted on the wrong scale. Always start from the 0 that lies on your own ray.`,tags:[`scale`,`reasoning`]},{id:`l4-22`,lesson:`l4`,skill:`draw-angle`,difficulty:2,type:`build-angle`,prompt:`Create an angle measuring 155°.`,answer:{kind:`build`,target:155,tolerance:2},hints:[`155° is obtuse and very wide — nearly a straight line.`,`A straight angle is 180°, so stop 25° before the arms line up.`],explanation:`Correct! 155° is a wide obtuse angle, just 25° away from a straight line.`,reteach:`Open the arm almost all the way to flat. 180° would be a straight line, so 155° stops 25° short of that.`,tags:[`build`,`obtuse`]},{id:`l4-23`,lesson:`l4`,skill:`draw-angle`,difficulty:3,type:`build-angle`,context:`A roof beam meets the wall at 125°.`,prompt:`Create an angle measuring 125°.`,answer:{kind:`build`,target:125,tolerance:2},hints:[`125° is obtuse. Pass the right angle first.`,`It is 35° past 90°, and 55° short of a straight line.`],explanation:`Correct! 125° is obtuse: 35° more than a right angle and 55° less than a straight angle.`,reteach:`Take the arm past upright (90°), then add another 35°. Check it: 125 is between 90 and 180, so it must look obtuse.`,tags:[`build`,`obtuse`,`real-life`]},{id:`l4-24`,lesson:`l4`,skill:`draw-angle`,difficulty:3,type:`build-angle`,prompt:`Create an angle measuring 170°.`,answer:{kind:`build`,target:170,tolerance:2},hints:[`170° is only 10° away from a straight line.`,`The two arms should look almost, but not quite, opposite each other.`],explanation:`Correct! 170° is obtuse. It is very close to 180°, so the arms nearly form a straight line — but a small bend is still visible.`,reteach:`A straight angle is 180°. 170° is 10° less, so the arms must show a slight bend rather than lying flat.`,tags:[`build`,`obtuse`]},{id:`l4-25`,lesson:`l4`,skill:`reason-angle`,difficulty:3,type:`build-angle`,context:`A diagonal cut splits a square corner into two equal parts.`,prompt:`Create an angle the same size as one of those two equal parts.`,answer:{kind:`build`,target:45,tolerance:2},hints:[`A square corner is a right angle. How many degrees is that?`,`Split 90° into two equal pieces.`],explanation:`Correct! A square corner is 90°, and half of 90° is 45°. Two 45° angles side by side rebuild the right angle.`,reteach:`Work it out before you build: a square corner is 90°, and cutting it into two equal parts gives 90 ÷ 2 = 45° each.`,tags:[`build`,`reasoning`]},{id:`l4-26`,lesson:`l4`,skill:`draw-angle`,difficulty:3,type:`error-analysis`,context:`Ravi was asked to draw an angle of 50°. This is what he produced.`,prompt:`Ravi marked his dot next to the 130 on the protractor. Which explanation is right?`,figure:{kind:`angle`,degrees:130,showArc:!0,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`He read the scale that does not start at 0 on his ray. Because 50 + 130 = 180, he drew 130° instead of 50°.`},{id:`b`,text:`He should have marked 230, because you add 180 to every reading.`,why:`There is no rule about adding 180. The two numbers on a mark always add to 180 — they are not made by adding 180.`},{id:`c`,text:`His protractor is broken.`,why:`The protractor is fine. Both scales are printed on purpose so it works whichever way your ray points.`},{id:`d`,text:`He drew the first ray at the wrong angle to the page.`,why:`The direction of the first ray does not matter. You measure from that ray, wherever it points.`}],answer:{kind:`choice`,correct:`a`},hints:[`50° is acute, but the finished drawing is obtuse.`,`Add the two numbers 50 and 130 together. What do you notice?`],explanation:`Correct! The 50 and the 130 sit on the very same mark, one on each scale. Ravi followed the scale that did not start at 0 on his own ray, so he drew the partner angle instead.`,reteach:`Before you mark the dot, check the scale: run your finger back along it to the 0 and make sure that 0 lies on the ray you drew.`,tags:[`error`,`scale`]},{id:`l4-27`,lesson:`l4`,skill:`draw-angle`,difficulty:3,type:`error-analysis`,context:`Mia drew the segment PQ first, then put the protractor centre on P to draw a 40° angle. When she joined the mark she started her new arm at Q.`,prompt:`Why is Mia’s drawing wrong?`,options:[{id:`a`,text:`The second arm must start at the vertex P. Starting it at Q makes a different figure, and the angle at P is not 40°.`},{id:`b`,text:`She should have measured 140° instead.`,why:`The size she wanted was fine. The problem is where her second arm begins.`},{id:`c`,text:`A 40° angle cannot be drawn from a segment, only from a ray.`,why:`You can draw an angle from a segment. The endpoint simply becomes the vertex.`},{id:`d`,text:`She should have put the protractor centre on Q from the start.`,why:`Either end could be the vertex — but the centre and the second arm must then agree. Here they did not.`}],answer:{kind:`choice`,correct:`a`},hints:[`The vertex is the point where the two arms meet.`,`Where did she put the protractor centre? The new arm must start from that same point.`],explanation:`Correct! The centre of the protractor and the start of the second arm must be the same point — the vertex. Mia measured from P but drew from Q, so the arms never met at the measured point.`,reteach:`Pick your vertex first. The protractor centre goes there, and the second arm is ruled from there too. If the two are different points, the angle is not the one you measured.`,tags:[`error`,`steps`]},{id:`l4-28`,lesson:`l4`,skill:`reason-angle`,difficulty:3,type:`numeric`,context:`You draw a straight line, then draw one ray up from a point on it, making an angle of 118° on the left.`,prompt:`What is the size of the angle on the right of your new ray?`,figure:{kind:`multi-angle`,vertex:`O`,rays:[{name:`A`,deg:0},{name:`C`,deg:62},{name:`B`,deg:180}],highlightPair:[`C`,`B`],showValue:!0},answer:{kind:`numeric`,value:62},unit:`°`,placeholder:`?`,hints:[`The two angles together sit on a straight line.`,`Angles on a straight line add up to 180°.`],explanation:`Correct! 180° − 118° = 62°. The highlighted 118° angle and your 62° angle sit on the straight line AB, so together they make 180°.`,reteach:`A straight line is a 180° angle. If one part is 118°, the other part must be 180 − 118 = 62°.`,tags:[`reasoning`,`straight-line`]},{id:`l4-29`,lesson:`l4`,skill:`reason-angle`,difficulty:3,type:`mcq`,context:`Tom draws a 50° angle with arms 4 cm long. Ana draws a 50° angle with arms 9 cm long.`,prompt:`Which sentence is true?`,options:[{id:`a`,text:`Both angles are exactly the same size: 50°.`},{id:`b`,text:`Ana’s angle is bigger because her arms are longer.`,why:`Longer arms only make the drawing bigger on the page. The amount of turn between them has not changed.`},{id:`c`,text:`Tom’s angle is bigger because it looks sharper.`,why:`A short drawing can look sharper, but sharpness is about the turn, not the length of the arms.`},{id:`d`,text:`You cannot compare them until both arms are the same length.`,why:`You can. An angle measures the turn between the arms, and both students turned by 50°.`}],answer:{kind:`choice`,correct:`a`},hints:[`What does an angle actually measure?`,`If you made the arms twice as long, would the opening between them change?`],explanation:`Correct! An angle measures the amount of turn between two arms. Arms can be any length — 50° is 50° either way. That is why you can rule the arms as long or short as you like when you draw.`,reteach:`Arm length is not part of the measurement. Both students turned the second arm 50° from the first, so both angles measure 50°.`,tags:[`reasoning`,`arm-length`]},{id:`l4-30`,lesson:`l4`,skill:`reason-angle`,difficulty:3,type:`numeric`,context:`From ray BA you draw ray BC at 35°. Then, turning the same way, you draw ray BD 40° further round from BC.`,prompt:`What is the size of angle ABD?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:35},{name:`D`,deg:75}],highlightPair:[`A`,`C`],showValue:!0},answer:{kind:`numeric`,value:75},unit:`°`,placeholder:`?`,hints:[`Both turns go the same way, so they stack up.`,`Add the two turns together.`],explanation:`Correct! 35° + 40° = 75°. Because both turns go the same way, angle ABD is the two smaller angles joined together — and 75° is still acute.`,reteach:`When two angles sit next to each other at the same vertex and turn the same way, you add them: 35 + 40 = 75°.`,tags:[`reasoning`,`adding-angles`]},{id:`l4-31`,lesson:`l4`,skill:`reason-angle`,difficulty:3,type:`figure-choice`,prompt:`Which drawing shows an angle exactly half the size of a right angle?`,options:[{id:`a`,figure:{kind:`angle`,degrees:30,showArc:!0},why:`30° is one third of a right angle, not one half.`},{id:`b`,figure:{kind:`angle`,degrees:90,showArc:!0},why:`The square mark shows this is the whole right angle, 90°, not half of it.`},{id:`c`,figure:{kind:`angle`,degrees:45,showArc:!0}},{id:`d`,figure:{kind:`angle`,degrees:60,showArc:!0},why:`60° is two thirds of a right angle — a bit too wide for half.`}],answer:{kind:`choice`,correct:`c`},hints:[`A right angle is 90°.`,`Half of 90 is the number you are looking for.`],explanation:`Correct! Half of 90° is 45°, and this drawing shows a 45° angle — the opening you get when you cut a square corner exactly in two.`,reteach:`Work out the number first: half of 90° is 45°. Then pick the drawing that is clearly acute and sits midway between a thin 30° and a wide 60°.`,tags:[`reasoning`,`estimate`]},{id:`l4-32`,lesson:`l4`,skill:`draw-angle`,difficulty:3,type:`mcq`,prompt:`Which list gives the six drawing steps in the correct order?`,options:[{id:`a`,text:`Draw a ray → centre on the vertex → baseline along the ray → find the degree mark → make a mark → join vertex to mark.`},{id:`b`,text:`Centre on the vertex → draw a ray → baseline along the ray → make a mark → find the degree mark → join vertex to mark.`,why:`You cannot place the centre on a vertex before the vertex exists. The ray comes first.`},{id:`c`,text:`Draw a ray → find the degree mark → make a mark → centre on the vertex → baseline along the ray → join vertex to mark.`,why:`The degree mark only means something once the protractor is placed and lined up.`},{id:`d`,text:`Draw a ray → baseline along the ray → make a mark → centre on the vertex → find the degree mark → join vertex to mark.`,why:`Lining up the baseline and placing the centre happen together, before any mark is made.`}],answer:{kind:`choice`,correct:`a`},hints:[`Nothing can be measured until there is a ray and a vertex to measure from.`,`The pencil mark comes after the protractor is in place, and the ruled arm comes last.`],explanation:`Correct! Ray first, then place and line up the protractor, then find the number, mark it, and finally rule the second arm from the vertex.`,reteach:`Remember the order as three pairs: draw and label the ray, place and line up the protractor, mark and join. Each pair must be finished before the next one starts.`,tags:[`steps`]}]})),Ga,Ka=o((()=>{Ga=[{id:`l5-01`,lesson:`l5`,skill:`turns`,difficulty:1,type:`numeric`,prompt:`How many degrees are there in a quarter turn?`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`cw`,showResult:!0,animate:!0,caption:`The arrow makes a quarter turn clockwise.`},answer:{kind:`numeric`,value:90},unit:`°`,hints:[`A complete turn all the way round is 360°.`,`A quarter turn is one quarter of 360°. Try 360 ÷ 4.`],explanation:`Correct! One quarter of 360° is 90°, so a quarter turn is 90° — a right angle.`,reteach:`Start from a complete turn, which is 360°. A quarter turn is one of the four equal parts: 360° ÷ 4 = 90°.`,tags:[`definition`]},{id:`l5-02`,lesson:`l5`,skill:`directions`,difficulty:1,type:`mcq`,prompt:`An arrow points North and makes a quarter turn clockwise. Which direction does it face now?`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`cw`,showResult:!1,caption:`The arrow starts pointing North.`},options:[{id:`a`,text:`East`},{id:`b`,text:`West`,why:`West is a quarter turn the other way — anticlockwise.`},{id:`c`,text:`South`,why:`South is a half turn from North, not a quarter turn.`},{id:`d`,text:`North`,why:`The arrow has moved, so it cannot still be facing North.`}],answer:{kind:`choice`,correct:`a`},hints:[`Clockwise follows the hands of a clock: North, then East, then South, then West.`,`One quarter turn moves you on to the next main direction.`],explanation:`Correct! Going clockwise the order is North → East → South → West, so one quarter turn from North lands on East.`,reteach:`Clockwise from North goes to East. Say the order out loud — North, East, South, West — and take one step for each quarter turn.`,tags:[`compass`]},{id:`l5-03`,lesson:`l5`,skill:`turns`,difficulty:1,type:`numeric`,prompt:`How many degrees are there in a half turn?`,figure:{kind:`turn`,object:`pencil`,startBearing:0,turn:180,direction:`cw`,showResult:!0,animate:!0,caption:`The pencil makes a half turn.`},answer:{kind:`numeric`,value:180},unit:`°`,hints:[`A complete turn is 360°.`,`Half of 360° — try 360 ÷ 2.`],explanation:`Correct! Half of 360° is 180°, so a half turn is 180°. It leaves you facing the opposite way.`,reteach:`A half turn is one half of a complete turn: 360° ÷ 2 = 180°.`,tags:[`definition`]},{id:`l5-04`,lesson:`l5`,skill:`directions`,difficulty:1,type:`mcq`,context:`A compass needle is pointing East.`,prompt:`The needle makes a quarter turn clockwise. Which direction does it point now?`,figure:{kind:`turn`,object:`compass`,startBearing:90,turn:90,direction:`cw`,showResult:!1,caption:`The needle starts pointing East.`},options:[{id:`a`,text:`South`},{id:`b`,text:`North`,why:`North is a quarter turn anticlockwise from East, not clockwise.`},{id:`c`,text:`West`,why:`West is a half turn from East — that is twice as far.`},{id:`d`,text:`East`,why:`A quarter turn always changes the direction you face.`}],answer:{kind:`choice`,correct:`a`},hints:[`Clockwise order: North → East → South → West.`,`Take one step along that list, starting from East.`],explanation:`Correct! One quarter turn clockwise from East is South.`,reteach:`Follow the clockwise order North → East → South → West. From East, the very next direction going clockwise is South.`,tags:[`compass`]},{id:`l5-05`,lesson:`l5`,skill:`turns`,difficulty:1,type:`mcq`,prompt:`What is the turn shown in this picture called?`,figure:{kind:`turn`,object:`car`,startBearing:90,turn:180,direction:`cw`,showResult:!0,animate:!0,caption:`The faded car shows where it started.`},options:[{id:`a`,text:`A quarter turn`,why:`A quarter turn covers only one of the four parts of the circle.`},{id:`b`,text:`A half turn`},{id:`c`,text:`A three-quarter turn`,why:`A three-quarter turn goes three parts of the way round — much further than this.`},{id:`d`,text:`A complete turn`,why:`A complete turn would bring the car back to exactly where it started.`}],answer:{kind:`choice`,correct:`b`},hints:[`Compare the faded car with the solid car.`,`The car finishes facing the opposite way. How much of the circle is that?`],explanation:`Correct! The car finishes facing the opposite way, which is half of a full circle — a half turn of 180°.`,reteach:`Look at how much of the circle the curved arrow covers. Half the circle means a half turn, and a half turn is 180°.`,tags:[`naming`]},{id:`l5-06`,lesson:`l5`,skill:`turns`,difficulty:1,type:`numeric`,prompt:`How many right angles are there in a complete turn?`,answer:{kind:`numeric`,value:4},hints:[`One right angle is 90°.`,`A complete turn is 360°. How many 90s fit into 360?`],explanation:`Correct! A complete turn is 360° and each right angle is 90°, so 360 ÷ 90 = 4 right angles.`,reteach:`Picture the four square corners around a point. Each one is 90°, and 90 + 90 + 90 + 90 = 360°, so a complete turn holds 4 right angles.`,tags:[`right-angle`]},{id:`l5-07`,lesson:`l5`,skill:`directions`,difficulty:1,type:`mcq`,context:`Amira is standing in the playground facing South.`,prompt:`She makes a half turn. Which direction is she facing now?`,figure:{kind:`turn`,object:`robot`,startBearing:180,turn:180,direction:`cw`,showResult:!1,caption:`She starts facing South.`},options:[{id:`a`,text:`North`},{id:`b`,text:`South`,why:`She would only stay facing South after a complete turn.`},{id:`c`,text:`East`,why:`East is a quarter turn anticlockwise from South, not a half turn.`},{id:`d`,text:`West`,why:`West is a quarter turn clockwise from South, not a half turn.`}],answer:{kind:`choice`,correct:`a`},hints:[`A half turn always leaves you facing the opposite direction.`,`What is the opposite of South?`],explanation:`Correct! A half turn is 180°, so Amira ends up facing the opposite direction: North.`,reteach:`A half turn is 180° and always points you the opposite way. North and South are opposites, so from South a half turn takes her to North.`,tags:[`compass`]},{id:`l5-08`,lesson:`l5`,skill:`clock-turns`,difficulty:1,type:`mcq`,context:`The long minute hand of a clock starts at the 12 and travels round to the 6.`,prompt:`What kind of turn has the minute hand made?`,figure:{kind:`clock`,hour:12,minute:30,caption:`The minute hand has arrived at the 6.`},options:[{id:`a`,text:`A quarter turn`,why:`A quarter turn would take the minute hand from the 12 only as far as the 3.`},{id:`b`,text:`A half turn`},{id:`c`,text:`A three-quarter turn`,why:`A three-quarter turn would take the minute hand round to the 9.`},{id:`d`,text:`A complete turn`,why:`A complete turn would bring the hand back to the 12 again.`}],answer:{kind:`choice`,correct:`b`},hints:[`The 6 is exactly opposite the 12 on a clock face.`,`The hand has gone half way round the circle.`],explanation:`Correct! The 6 is directly opposite the 12, so the minute hand has gone half way round — a half turn of 180°.`,reteach:`Split the clock face into halves. From the 12 down to the 6 is one half of the circle, so the minute hand has made a half turn (180°).`,tags:[`clock`]},{id:`l5-09`,lesson:`l5`,skill:`turns`,difficulty:1,type:`sort`,prompt:`Sort each card into the group that shows the size of the turn.`,buckets:[{id:`b90`,label:`90°`},{id:`b180`,label:`180°`},{id:`b270`,label:`270°`},{id:`b360`,label:`360°`}],items:[{id:`i1`,label:`Quarter turn`,bucket:`b90`},{id:`i2`,label:`Half turn`,bucket:`b180`},{id:`i3`,label:`Three-quarter turn`,bucket:`b270`},{id:`i4`,label:`Complete turn`,bucket:`b360`},{id:`i5`,label:`Minute hand from 12 to 3`,bucket:`b90`},{id:`i6`,label:`A wheel spins right round once`,bucket:`b360`}],answer:{kind:`sort`},hints:[`Start with the complete turn: all the way round is 360°.`,`Then share 360° into four equal quarters of 90° each.`],explanation:`Correct! A quarter turn is 90°, a half turn 180°, a three-quarter turn 270° and a complete turn 360°. From the 12 to the 3 is one quarter of the clock face, and a wheel going right round once is a complete turn.`,reteach:`Count in quarters of a circle: one quarter 90°, two quarters 180°, three quarters 270°, four quarters 360°. Match each card to how much of the circle it covers.`,tags:[`definition`]},{id:`l5-10`,lesson:`l5`,skill:`turns`,difficulty:1,type:`click-target`,context:`A robot stands at point O. The four rays show North, East, South and West.`,prompt:`The robot faces North and makes a quarter turn clockwise. Click the ray it faces now.`,figure:{kind:`multi-angle`,vertex:`O`,rays:[{name:`N`,deg:90},{name:`E`,deg:0},{name:`S`,deg:270},{name:`W`,deg:180}]},clickTargets:[{id:`ray-N`,label:`the ray pointing North`},{id:`ray-E`,label:`the ray pointing East`},{id:`ray-S`,label:`the ray pointing South`},{id:`ray-W`,label:`the ray pointing West`}],answer:{kind:`click`,correct:`ray-E`},hints:[`Clockwise is the way the hands of a clock go round.`,`From North, clockwise moves towards the right-hand side of the diagram.`],explanation:`Correct! A quarter turn clockwise from North lands on East, the ray pointing to the right.`,reteach:`Put your finger on the North ray and sweep it the same way a clock hand moves. After one quarter of the circle you reach East.`,tags:[`compass`]},{id:`l5-11`,lesson:`l5`,skill:`turns`,difficulty:1,type:`numeric`,prompt:`How many degrees is a three-quarter turn?`,answer:{kind:`numeric`,value:270},unit:`°`,hints:[`One quarter turn is 90°.`,`A three-quarter turn is three of those quarters: 90 + 90 + 90.`],explanation:`Correct! Three quarters of 360° is 270°, because 90 + 90 + 90 = 270.`,reteach:`Work in quarters. Each quarter turn is 90°, so three quarters is 3 × 90° = 270°. You can also do 3/4 × 360° = 270°.`,tags:[`definition`]},{id:`l5-12`,lesson:`l5`,skill:`directions`,difficulty:1,type:`mcq`,prompt:`An arrow points North and makes a quarter turn anticlockwise. Which direction does it face now?`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`ccw`,showResult:!1,caption:`The arrow starts pointing North.`},options:[{id:`a`,text:`West`},{id:`b`,text:`East`,why:`East is a quarter turn clockwise. Anticlockwise goes the opposite way round.`},{id:`c`,text:`South`,why:`South is a half turn from North, whichever way you go.`},{id:`d`,text:`North-West`,why:`North-West is only half of a quarter turn — that is 45°, not 90°.`}],answer:{kind:`choice`,correct:`a`},hints:[`Anticlockwise is the opposite way to the hands of a clock.`,`Anticlockwise from North goes towards the left of the compass.`],explanation:`Correct! Anticlockwise runs North → West → South → East, so a quarter turn anticlockwise from North gives West.`,reteach:`Clockwise from North gives East, so anticlockwise must give the opposite side: West. Learn the anticlockwise order North → West → South → East.`,tags:[`compass`]},{id:`l5-13`,lesson:`l5`,skill:`directions`,difficulty:2,type:`mcq`,context:`A car is driving East along a straight road and reaches a junction.`,prompt:`It makes a quarter turn anticlockwise at the junction. Which direction is it driving now?`,figure:{kind:`turn`,object:`car`,startBearing:90,turn:90,direction:`ccw`,showResult:!1,caption:`The car reaches the junction driving East.`},options:[{id:`a`,text:`North`},{id:`b`,text:`South`,why:`South would be a quarter turn clockwise — the driver turned the other way.`},{id:`c`,text:`West`,why:`West is a half turn from East; the car would have to turn right round.`},{id:`d`,text:`East`,why:`The car has turned, so its direction must change.`}],answer:{kind:`choice`,correct:`a`},hints:[`Anticlockwise order: North → West → South → East.`,`Going anticlockwise, which direction comes after East?`],explanation:`Correct! A quarter turn anticlockwise from East brings the car round to North.`,reteach:`Turning anticlockwise from East means turning left. Follow the anticlockwise order East → North → West → South and take one step: North.`,tags:[`real-life`]},{id:`l5-14`,lesson:`l5`,skill:`turns`,difficulty:2,type:`mcq`,context:`A robot is facing South-West.`,prompt:`It makes a half turn. Which direction is it facing now?`,figure:{kind:`turn`,object:`robot`,startBearing:225,turn:180,direction:`cw`,showResult:!1,caption:`The robot starts facing South-West.`},options:[{id:`a`,text:`North-East`},{id:`b`,text:`South-East`,why:`South-East is only a quarter turn anticlockwise from South-West.`},{id:`c`,text:`North-West`,why:`North-West is only a quarter turn clockwise from South-West.`},{id:`d`,text:`South-West`,why:`That is where the robot started, which needs a complete turn.`}],answer:{kind:`choice`,correct:`a`},hints:[`A half turn always ends on the opposite side of the compass.`,`Look straight across the compass from South-West. What is written there?`],explanation:`Correct! A half turn is 180°, so the robot ends up facing the opposite direction: North-East.`,reteach:`For a half turn, find the direction directly opposite on the compass rose. Opposite South-West is North-East.`,tags:[`compass`]},{id:`l5-15`,lesson:`l5`,skill:`turns`,difficulty:2,type:`figure-choice`,prompt:`Which picture shows a three-quarter turn clockwise, starting from North?`,options:[{id:`a`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:90,direction:`cw`,showResult:!0},why:`This arrow has only made a quarter turn (90°).`},{id:`b`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:270,direction:`cw`,showResult:!0}},{id:`c`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:270,direction:`ccw`,showResult:!0},why:`The size of the turn is right, but the curved arrow goes anticlockwise.`},{id:`d`,figure:{kind:`turn`,object:`arrow`,startBearing:0,turn:180,direction:`cw`,showResult:!0},why:`This is a half turn (180°), not a three-quarter turn.`}],answer:{kind:`choice`,correct:`b`},hints:[`Check two things: how far the curved arrow travels, and which way it sweeps.`,`Three quarters of the circle is 270°, and clockwise sweeps the way clock hands move.`],explanation:`Correct! The curved arrow sweeps three quarters of the circle in the clockwise direction, so the arrow finishes pointing West.`,reteach:`A three-quarter turn covers 270°, which is three of the four quarters. Then check the sweep: clockwise goes North → East → South → West.`,tags:[`naming`]},{id:`l5-16`,lesson:`l5`,skill:`clock-turns`,difficulty:2,type:`numeric`,context:`The minute hand of this clock is pointing at the 3.`,prompt:`It then moves round to the 6. Through how many degrees has it turned?`,figure:{kind:`clock`,hour:12,minute:15,caption:`The minute hand starts at the 3.`},answer:{kind:`numeric`,value:90},unit:`°`,hints:[`Going from one number to the next on a clock is 30°, because 360 ÷ 12 = 30.`,`From the 3 to the 6 is three of those steps, and it is also a quarter of the clock face.`],explanation:`Correct! From the 3 to the 6 is a quarter of the way round the clock, which is 90°.`,reteach:`The clock face is 360° shared between 12 numbers, so each number is 30°. From 3 to 6 is three steps: 3 × 30° = 90°, a quarter turn.`,tags:[`clock`]},{id:`l5-17`,lesson:`l5`,skill:`turns`,difficulty:2,type:`error-analysis`,prompt:`Maya says: "A half turn clockwise and a half turn anticlockwise must leave you facing different ways." What is the mistake?`,options:[{id:`a`,text:`Both turns are 180°, so both finish facing the opposite direction — the finishing direction is the same either way.`},{id:`b`,text:`Maya is right, because clockwise always finishes further round than anticlockwise.`,why:`For most turns the two directions do finish differently, but a half turn is the special case where they meet in the same place.`},{id:`c`,text:`Maya is wrong because a half turn is 90°.`,why:`A half turn is 180°. It is a quarter turn that measures 90°.`},{id:`d`,text:`Maya is wrong because you always finish facing the way you started.`,why:`That happens after a complete turn of 360°, not after a half turn.`}],answer:{kind:`choice`,correct:`a`},hints:[`Try it out: face North and turn 180° one way, then 180° the other way.`,`Half of the circle is the same amount of circle whichever way you travel.`],explanation:`Correct! A half turn is 180° either way, and 180° from any direction lands on the opposite direction. From North both routes finish at South.`,reteach:`Draw a circle and mark North. Sweep 180° clockwise and you reach South. Sweep 180° anticlockwise and you reach South again. Only the route is different, not the finish.`,tags:[`reasoning`]},{id:`l5-18`,lesson:`l5`,skill:`clock-turns`,difficulty:2,type:`mcq`,context:`This clock shows 3 o’clock. The minute hand is at the 12 and the hour hand is at the 3.`,prompt:`What turn would move the minute hand round to where the hour hand is pointing?`,figure:{kind:`clock`,hour:3,minute:0},options:[{id:`a`,text:`A quarter turn clockwise (90°)`},{id:`b`,text:`A half turn clockwise (180°)`,why:`A half turn would take the minute hand all the way to the 6.`},{id:`c`,text:`A three-quarter turn clockwise (270°)`,why:`A three-quarter turn would take the minute hand round to the 9.`},{id:`d`,text:`A complete turn (360°)`,why:`A complete turn would bring the minute hand back to the 12.`}],answer:{kind:`choice`,correct:`a`},hints:[`The 3 is one quarter of the way round from the 12.`,`The two hands make a square corner at 3 o’clock.`],explanation:`Correct! From the 12 to the 3 is one quarter of the clock face, so the minute hand needs a quarter turn clockwise of 90°. That is why the hands make a right angle at 3 o’clock.`,reteach:`Split the clock into quarters at the 12, 3, 6 and 9. Moving from the 12 to the 3 crosses one quarter, which is a quarter turn of 90°.`,tags:[`clock`,`right-angle`]},{id:`l5-19`,lesson:`l5`,skill:`directions`,difficulty:2,type:`sort`,prompt:`Each card shows a quarter turn. Sort them by which way the turn goes.`,buckets:[{id:`cw`,label:`Clockwise`},{id:`ccw`,label:`Anticlockwise`}],items:[{id:`i1`,label:`North to East`,bucket:`cw`},{id:`i2`,label:`East to North`,bucket:`ccw`},{id:`i3`,label:`South to West`,bucket:`cw`},{id:`i4`,label:`West to South`,bucket:`ccw`},{id:`i5`,label:`East to South`,bucket:`cw`},{id:`i6`,label:`North to West`,bucket:`ccw`}],answer:{kind:`sort`},hints:[`Clockwise order: North → East → South → West → North.`,`If the card follows that order it is clockwise. If it runs backwards along it, it is anticlockwise.`],explanation:`Correct! Clockwise follows North → East → South → West, so North to East, South to West and East to South are all clockwise. The other three run backwards along that list, so they are anticlockwise.`,reteach:`Write the clockwise order down: N, E, S, W, then back to N. Reading forwards is clockwise; reading backwards is anticlockwise.`,tags:[`compass`]},{id:`l5-20`,lesson:`l5`,skill:`directions`,difficulty:2,type:`click-target`,context:`The eight rays from O show the eight compass directions.`,prompt:`A fish is swimming North-East. It makes a quarter turn clockwise. Click the ray showing its new direction.`,figure:{kind:`multi-angle`,vertex:`O`,rays:[{name:`N`,deg:90},{name:`NE`,deg:45},{name:`E`,deg:0},{name:`SE`,deg:315},{name:`S`,deg:270},{name:`SW`,deg:225},{name:`W`,deg:180},{name:`NW`,deg:135}]},clickTargets:[{id:`ray-N`,label:`the ray pointing North`},{id:`ray-NE`,label:`the ray pointing North-East`},{id:`ray-E`,label:`the ray pointing East`},{id:`ray-SE`,label:`the ray pointing South-East`},{id:`ray-S`,label:`the ray pointing South`},{id:`ray-SW`,label:`the ray pointing South-West`},{id:`ray-W`,label:`the ray pointing West`},{id:`ray-NW`,label:`the ray pointing North-West`}],answer:{kind:`click`,correct:`ray-SE`},hints:[`A quarter turn is 90°, which is two of the small 45° steps on this diagram.`,`Start at North-East and sweep clockwise past East.`],explanation:`Correct! Sweeping 90° clockwise from North-East passes East and stops at South-East.`,reteach:`Each neighbouring pair of rays here is 45° apart, so a quarter turn (90°) skips over one ray. From North-East, going clockwise, you pass East and land on South-East.`,tags:[`compass`]},{id:`l5-21`,lesson:`l5`,skill:`clock-turns`,difficulty:2,type:`numeric`,context:`A fan blade makes a three-quarter turn, and then it makes another quarter turn the same way.`,prompt:`Through how many degrees has the blade turned altogether?`,answer:{kind:`numeric`,value:360},unit:`°`,hints:[`A three-quarter turn is 270° and a quarter turn is 90°.`,`Add the two turns together.`],explanation:`Correct! 270° + 90° = 360°, so the blade has made one complete turn and is back where it started.`,reteach:`Change each turn into degrees first: three-quarter turn = 270°, quarter turn = 90°. Then add: 270 + 90 = 360°, a complete turn.`,tags:[`real-life`]},{id:`l5-22`,lesson:`l5`,skill:`directions`,difficulty:2,type:`mcq`,context:`A pencil is lying on a desk pointing West.`,prompt:`It is turned three quarters of a turn clockwise. Which direction does it point now?`,figure:{kind:`turn`,object:`pencil`,startBearing:270,turn:270,direction:`cw`,showResult:!1,caption:`The pencil starts pointing West.`},options:[{id:`a`,text:`South`},{id:`b`,text:`North`,why:`North is only a quarter turn clockwise from West.`},{id:`c`,text:`East`,why:`East is a half turn from West, which is 180°, not 270°.`},{id:`d`,text:`West`,why:`The pencil would need a complete turn of 360° to point West again.`}],answer:{kind:`choice`,correct:`a`},hints:[`Take it one quarter at a time: West → North → East → South.`,`Three quarter turns clockwise means three steps around that list.`],explanation:`Correct! Three quarter turns clockwise from West go West → North → East → South, so the pencil finishes pointing South.`,reteach:`Break a three-quarter turn into three quarter turns. Clockwise from West: first step North, second step East, third step South.`,tags:[`compass`]},{id:`l5-23`,lesson:`l5`,skill:`clock-turns`,difficulty:2,type:`mcq`,context:`The minute hand of a clock travels clockwise from the 12 all the way round to the 9.`,prompt:`Which description of that turn is correct?`,figure:{kind:`clock`,hour:12,minute:45,caption:`The minute hand has arrived at the 9.`},options:[{id:`a`,text:`A three-quarter turn, 270°`},{id:`b`,text:`A quarter turn, 90°`,why:`A quarter turn would stop at the 3, after only 15 minutes.`},{id:`c`,text:`A half turn, 180°`,why:`A half turn would stop at the 6, half way round the clock.`},{id:`d`,text:`A three-quarter turn, 90°`,why:`The name is right, but a three-quarter turn measures 270°, not 90°.`}],answer:{kind:`choice`,correct:`a`},hints:[`Split the clock face into four quarters: 12, 3, 6 and 9.`,`Count how many of those quarters the hand crosses, then multiply by 90°.`],explanation:`Correct! From the 12 the hand crosses three quarters of the clock face to reach the 9, and 3 × 90° = 270°. That takes 45 minutes.`,reteach:`Each quarter of the clock face is 90°. Going from the 12 to the 9 the clockwise way crosses three quarters, so the turn is a three-quarter turn of 270°.`,tags:[`clock`]},{id:`l5-24`,lesson:`l5`,skill:`directions`,difficulty:2,type:`figure-choice`,prompt:`An arrow points South. Which picture shows it after a quarter turn anticlockwise?`,options:[{id:`a`,figure:{kind:`turn`,object:`arrow`,startBearing:180,turn:90,direction:`ccw`,showResult:!0}},{id:`b`,figure:{kind:`turn`,object:`arrow`,startBearing:180,turn:90,direction:`cw`,showResult:!0},why:`The turn is the right size, but it sweeps clockwise and finishes at West.`},{id:`c`,figure:{kind:`turn`,object:`arrow`,startBearing:180,turn:180,direction:`ccw`,showResult:!0},why:`This is a half turn (180°), so the arrow finishes at North.`},{id:`d`,figure:{kind:`turn`,object:`arrow`,startBearing:180,turn:45,direction:`ccw`,showResult:!0},why:`This is only 45°, an eighth of a turn, so the arrow stops at South-East.`}],answer:{kind:`choice`,correct:`a`},hints:[`First find the pictures where the curved arrow covers exactly one quarter of the circle.`,`Then choose the one that sweeps the opposite way to a clock hand.`],explanation:`Correct! A quarter turn anticlockwise from South takes the arrow to East, and the curved arrow sweeps backwards compared with a clock.`,reteach:`Check the size first: a quarter of the circle. Then check the direction: anticlockwise runs South → East → North → West, so the arrow ends at East.`,tags:[`compass`]},{id:`l5-25`,lesson:`l5`,skill:`directions`,difficulty:3,type:`error-analysis`,context:`Sam is facing East and makes a quarter turn anticlockwise. He says: "Anticlockwise goes East, South, West, North, so I am now facing South."`,prompt:`What has Sam done wrong?`,options:[{id:`a`,text:`He has used the clockwise order. Anticlockwise runs the other way — East → North → West → South — so he finishes facing North.`},{id:`b`,text:`Nothing. His list and his answer are both correct.`,why:`His list is the clockwise order, so it gives the wrong answer for an anticlockwise turn.`},{id:`c`,text:`He should have finished facing West.`,why:`West is a half turn (180°) from East. Sam only made a quarter turn.`},{id:`d`,text:`A quarter turn is 45°, so he only reached North-East.`,why:`A quarter turn is 90°. A 45° turn is an eighth of a turn.`}],answer:{kind:`choice`,correct:`a`},hints:[`Write the clockwise order out: North → East → South → West.`,`Anticlockwise is the same list read backwards.`],explanation:`Correct! East → South → West → North is the clockwise order. Reading it backwards gives the anticlockwise order, so a quarter turn anticlockwise from East finishes at North.`,reteach:`Learn one order — clockwise: North, East, South, West. To turn anticlockwise, step backwards along it. One step back from East is North.`,tags:[`reasoning`,`compass`]},{id:`l5-26`,lesson:`l5`,skill:`turns`,difficulty:3,type:`mcq`,context:`A robot is facing West. It is given two instructions: first a half turn clockwise, then a quarter turn anticlockwise.`,prompt:`Which direction is the robot facing after both instructions?`,figure:{kind:`turn`,object:`robot`,startBearing:270,turn:0,direction:`cw`,showResult:!1,caption:`The robot starts facing West.`},options:[{id:`a`,text:`North`},{id:`b`,text:`South`,why:`That happens if the second turn is made clockwise instead of anticlockwise.`},{id:`c`,text:`East`,why:`East is where the robot stands after the first instruction only — the second turn still has to happen.`},{id:`d`,text:`West`,why:`That is the starting direction, before any instruction is carried out.`}],answer:{kind:`choice`,correct:`a`},hints:[`Do one instruction at a time and write down the direction after each one.`,`A half turn clockwise from West lands on East. Now turn a quarter turn anticlockwise from there.`],explanation:`Correct! The half turn takes the robot from West to East. A quarter turn anticlockwise from East then gives North.`,reteach:`Two-step turns are safest done in order. Step 1: half turn from West → East. Step 2: quarter turn anticlockwise from East → North.`,tags:[`reasoning`]},{id:`l5-27`,lesson:`l5`,skill:`clock-turns`,difficulty:3,type:`numeric`,context:`A gymnast spins through 1080° in the air.`,prompt:`How many complete turns is that?`,answer:{kind:`numeric`,value:3},hints:[`One complete turn is 360°.`,`Work out how many lots of 360 there are in 1080.`],explanation:`Correct! 1080 ÷ 360 = 3, so the gymnast makes 3 complete turns and lands facing the way she started.`,reteach:`Count in complete turns: 360°, 720°, 1080°. That is three lots of 360°, so 1080° is 3 complete turns.`,tags:[`real-life`]},{id:`l5-28`,lesson:`l5`,skill:`directions`,difficulty:3,type:`mcq`,context:`A key in a lock is pointing North-West. It is turned through an eighth of a turn (45°) clockwise.`,prompt:`Which direction does the key point now?`,figure:{kind:`turn`,object:`key`,startBearing:315,turn:45,direction:`cw`,showResult:!1,caption:`The key starts pointing North-West.`},options:[{id:`a`,text:`North`},{id:`b`,text:`West`,why:`West is 45° the other way — that is an eighth of a turn anticlockwise.`},{id:`c`,text:`North-East`,why:`North-East needs a 90° turn clockwise, which is a whole quarter turn.`},{id:`d`,text:`South-East`,why:`South-East is a half turn (180°) from North-West.`}],answer:{kind:`choice`,correct:`a`},hints:[`The eight compass directions are 45° apart, so an eighth of a turn moves you on by exactly one direction.`,`Which direction comes after North-West when you go clockwise?`],explanation:`Correct! The compass directions sit 45° apart, and clockwise from North-West the next one is North.`,reteach:`List the eight directions in clockwise order: N, NE, E, SE, S, SW, W, NW, and then back to N. A 45° turn moves you exactly one place along the list, so North-West goes to North.`,tags:[`compass`]},{id:`l5-29`,lesson:`l5`,skill:`directions`,difficulty:3,type:`click-target`,context:`This map has North at the top. Ben is at the park, P. The library is L, the shop is S, the museum is M and the café is C.`,prompt:`Ben faces North, makes a three-quarter turn anticlockwise, then walks straight ahead. Click the place he reaches.`,figure:{kind:`points`,points:[{name:`P`,x:50,y:50},{name:`L`,x:50,y:12},{name:`S`,x:88,y:50},{name:`M`,x:50,y:88},{name:`C`,x:12,y:50}]},clickTargets:[{id:`point-L`,label:`the library, L`},{id:`point-S`,label:`the shop, S`},{id:`point-M`,label:`the museum, M`},{id:`point-C`,label:`the café, C`}],answer:{kind:`click`,correct:`point-S`},hints:[`Three quarter turns anticlockwise means three steps: North → West → South → East.`,`North is at the top of the map, so East is to the right.`],explanation:`Correct! Anticlockwise from North the steps are West, South, then East, so Ben ends up facing East and walks to the shop, S.`,reteach:`Take the three quarter turns one at a time, going anticlockwise: North → West, West → South, South → East. Facing East on this map means walking to the right, towards S.`,tags:[`reasoning`,`real-life`]},{id:`l5-30`,lesson:`l5`,skill:`clock-turns`,difficulty:3,type:`error-analysis`,prompt:`Leo says: "In one hour, both hands of a clock make a complete turn." What is wrong with that?`,figure:{kind:`clock`,hour:1,minute:0},options:[{id:`a`,text:`Only the minute hand makes a complete turn in an hour. The hour hand moves just 30°, one twelfth of a turn, and needs 12 hours to go right round.`},{id:`b`,text:`Leo is right — both hands go right round every hour.`,why:`Watch the hour hand at 1 o’clock and again at 2 o’clock: it has only crept from the 1 to the 2.`},{id:`c`,text:`Only the hour hand makes a complete turn in an hour.`,why:`It is the other way round. The minute hand is the fast one.`},{id:`d`,text:`Neither hand makes a complete turn in an hour.`,why:`The minute hand does: it leaves the 12 and comes back to the 12 after 60 minutes.`}],answer:{kind:`choice`,correct:`a`},hints:[`Think about where each hand is at 1 o’clock and where it is at 2 o’clock.`,`The clock face is 360° shared between 12 numbers, so one number is 30°.`],explanation:`Correct! The minute hand goes right round once an hour, but the hour hand only slides on by one number, which is 30° — a twelfth of a complete turn.`,reteach:`The two hands turn at very different speeds. The minute hand does 360° in an hour; the hour hand does 360° in 12 hours, so in one hour it turns only 360 ÷ 12 = 30°.`,tags:[`clock`,`reasoning`]},{id:`l5-31`,lesson:`l5`,skill:`turns`,difficulty:3,type:`sort`,prompt:`Each card gives a starting direction and a turn. Sort the cards by the direction you finish facing.`,buckets:[{id:`east`,label:`Finishes facing East`},{id:`west`,label:`Finishes facing West`}],items:[{id:`i1`,label:`North, quarter turn clockwise`,bucket:`east`},{id:`i2`,label:`North, quarter turn anticlockwise`,bucket:`west`},{id:`i3`,label:`South, quarter turn clockwise`,bucket:`west`},{id:`i4`,label:`South, quarter turn anticlockwise`,bucket:`east`},{id:`i5`,label:`West, half turn`,bucket:`east`},{id:`i6`,label:`North, three-quarter turn clockwise`,bucket:`west`}],answer:{kind:`sort`},hints:[`Say the clockwise order as you turn: North → East → South → West.`,`For each card, take one step per quarter turn in the direction the card tells you.`],explanation:`Correct! From North a quarter turn clockwise gives East, and from South a quarter turn anticlockwise also gives East, as does a half turn from West. The other three all finish at West.`,reteach:`Work each card out separately with the clockwise order N → E → S → W. Count one step for a quarter turn, two steps for a half turn and three steps for a three-quarter turn, going backwards along the list if the turn is anticlockwise.`,tags:[`reasoning`,`compass`]},{id:`l5-32`,lesson:`l5`,skill:`clock-turns`,difficulty:3,type:`mcq`,context:`A lesson starts at 2 o’clock and the class looks at the clock again at half past 2.`,prompt:`How far has the minute hand turned in that time?`,figure:{kind:`clock`,hour:2,minute:30,caption:`The clock at half past 2.`},options:[{id:`a`,text:`180° — a half turn`},{id:`b`,text:`90° — a quarter turn`,why:`A quarter turn of the minute hand takes only 15 minutes, not 30.`},{id:`c`,text:`360° — a complete turn`,why:`A complete turn of the minute hand takes a whole hour.`},{id:`d`,text:`30° — a twelfth of a turn`,why:`That is how far the hour hand creeps in half an hour, not the minute hand.`}],answer:{kind:`choice`,correct:`a`},hints:[`The minute hand takes 60 minutes to go right round, which is 360°.`,`Half an hour is half of that trip.`],explanation:`Correct! The minute hand takes an hour to turn 360°, so in 30 minutes it turns half of that: 180°, a half turn from the 12 to the 6.`,reteach:`Match the time to the fraction of a turn: 15 minutes is a quarter turn (90°), 30 minutes is a half turn (180°), 45 minutes is a three-quarter turn (270°) and 60 minutes is a complete turn (360°).`,tags:[`clock`]},{id:`l5-33`,lesson:`l5`,skill:`clock-turns`,difficulty:3,type:`figure-choice`,prompt:`On which clock has the long minute hand made exactly a three-quarter turn clockwise from the 12?`,options:[{id:`a`,figure:{kind:`clock`,hour:2,minute:15},why:`This minute hand has only made a quarter turn, from the 12 to the 3.`},{id:`b`,figure:{kind:`clock`,hour:8,minute:30},why:`This minute hand is at the 6, which is a half turn from the 12.`},{id:`c`,figure:{kind:`clock`,hour:4,minute:45}},{id:`d`,figure:{kind:`clock`,hour:11,minute:0},why:`This minute hand is still at the 12, so it has not turned at all.`}],answer:{kind:`choice`,correct:`c`},hints:[`The minute hand is the long thin one; ignore the short hour hand.`,`A three-quarter turn clockwise from the 12 passes the 3 and the 6 and stops at the 9.`],explanation:`Correct! A three-quarter turn is 270°, which takes the minute hand from the 12 round to the 9 — the clock showing quarter to five.`,reteach:`Count the quarters of the clock face from the 12: one quarter to the 3, two to the 6, three to the 9. So a three-quarter turn puts the minute hand on the 9.`,tags:[`clock`]},{id:`l5-34`,lesson:`l5`,skill:`turns`,difficulty:3,type:`mcq`,context:`A programmer writes the instruction "quarter turn clockwise" four times in a row for a robot.`,prompt:`Which single instruction would leave the robot facing exactly the same way?`,options:[{id:`a`,text:`A complete turn (360°)`},{id:`b`,text:`A three-quarter turn (270°)`,why:`That is only three of the four quarter turns, so the robot would stop one quarter short.`},{id:`c`,text:`A half turn (180°)`,why:`A half turn matches only two quarter turns.`},{id:`d`,text:`A quarter turn (90°)`,why:`That is just one of the four instructions.`}],answer:{kind:`choice`,correct:`a`},hints:[`Each quarter turn is 90°. Add four of them together.`,`90 + 90 + 90 + 90 = ?`],explanation:`Correct! Four quarter turns are 4 × 90° = 360°, which is one complete turn, so the robot finishes facing exactly the way it started.`,reteach:`Turn the instructions into degrees and add them up: 90 + 90 + 90 + 90 = 360°. A 360° turn is a complete turn and always returns you to your starting direction.`,tags:[`reasoning`]}]}));function qa(e){return io.find(t=>t.id===e)}function Ja(e){let t=e>>>0||1;return()=>(t^=t<<13,t^=t>>>17,t^=t<<5,t>>>=0,t/4294967296)}function Ya(e,t){let n=[...e];for(let e=n.length-1;e>0;--e){let r=Math.floor(t()*(e+1));[n[e],n[r]]=[n[r],n[e]]}return n}function Xa(e,t,n){let r=new Map;for(let t of Ya(e,n)){let e=r.get(t.skill)??[];e.push(t),r.set(t.skill,e)}let i=Ya([...r.values()],n),a=[],o=0;for(;a.length<t&&i.some(e=>e.length);){let e=i[o%i.length].shift();e&&a.push(e),o+=1}return a.slice(0,t)}function Za(e,t,n,r,i){let a=t===1?[1,2,3]:t===2?[2,1,3]:[3,2,1],o=[];for(let t of a){if(o.length>=n)break;let a=e.filter(e=>e.difficulty===t&&!i.has(e.id));for(let e of Xa(a,n-o.length,r))o.push(e),i.add(e.id)}return o}function Qa(e,t,n){let r=Ja(n+t*977),i=ro[e];return Ya(Za(i,t,12,r,new Set),r)}function $a(e,t){let n=Ja(t+31),r=ro[e],i=new Set,a=Za(r,1,5,n,i),o=Za(r,2,7,n,i),s=Za(r,3,3,n,i);return[...a,...o,...s]}function eo(e){let t=Ja(e+7919),n=[];for(let e of oo){let r=ro[e.lesson],i=new Set,a=Za(r,1,Math.ceil(e.count/3),t,i),o=Za(r,2,Math.ceil(e.count/3),t,i),s=Za(r,3,e.count-a.length-o.length,t,i);n.push(...a,...o,...s)}return n}function to(e,t){if(t?.tryItIds?.length){let e=t.tryItIds.map(qa).filter(Boolean);if(e.length)return e}let n=Ja(e.charCodeAt(1)*101+5);return Xa(ro[e].filter(e=>e.difficulty===1),3,n)}function no(e,t,n){if(n?.quickCheckIds?.length){let e=n.quickCheckIds.map(qa).filter(Boolean);if(e.length===5)return e

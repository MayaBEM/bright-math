°.",hint2:"The angle at P is the one missing from that total of 360°.",hint3:"Add 58°, 101° and 78°, then subtract the answer from 360°.",explanation:[{text:"PQRS is a quadrilateral, so its four interior angles total 360°.",highlight:["x","58","101","78"]},{text:"Add the three angles at Q, R and S.",math:"58° + 101° + 78° = 237°",highlight:["58","101","78"]},{text:"The angle at P is the rest of the 360°.",math:["x = 360° − 237°","x = 123°"],highlight:["x"]}]},{id:"s1q7",set:1,topic:"straight-line",skills:["straight-line"],difficulty:1,type:"numeric",prompt:"Work out the size of angle a.",given:"Three angles meet at the point M on the straight line KL.",diagram:{kind:"straightLine",angles:[{deg:47},{deg:71,label:"a"},{deg:62}],endLabels:["K","L"],vertexLabel:"M"},correctAnswer:71,hint1:"There are three angles here, but they still share one straight line.",hint2:"That means 47°, angle a and 62° must total 180°.",hint3:"Add the two outer angles, then subtract their total from 180°.",explanation:[{text:"All three angles are above the straight line KL, so together they total 180°.",highlight:["47","a","62"]},{text:"Add the two angles either side of a.",math:"47° + 62° = 109°",highlight:["47","62"]},{text:"Angle a is the gap that is left.",math:["a = 180° − 109°","a = 71°"],highlight:["a"]}]},{id:"s1q8",set:1,topic:"around-point",skills:["around-point"],difficulty:1,type:"mc",prompt:"Select the size of angle q.",given:"Three angles meet at a point, and one of them is a right angle.",diagram:{kind:"aroundPoint",angles:[{deg:90},{deg:163},{deg:107,label:"q"}],rotation:90},options:["107°","197°","253°","270°"],correctAnswer:0,answerValue:107,hint1:"One of the three angles is a right angle, and all of them share a full turn.",hint2:"A full turn is 360°, so 90°, 163° and q add to 360°.",hint3:"Work out 90° + 163°, then subtract that from 360°.",explanation:[{text:"The three angles complete a full turn, so they total 360°.",highlight:["90","163","q"]},{text:"Add the right angle and the obtuse angle.",math:"90° + 163° = 253°",highlight:["90","163"]},{text:"Subtract from the full turn.",math:["q = 360° − 253°","q = 107°"],highlight:["q"]},{text:"253° is only the total of the other two angles, while 197° and 270° come from forgetting one of them altogether."}]},{id:"s1q9",set:1,topic:"quadrilateral",skills:["quadrilateral"],difficulty:1,type:"mc",prompt:"Choose the size of angle x.",given:"EFGH is a quadrilateral.",diagram:{kind:"quad",angles:[{deg:85},{deg:97},{deg:63,label:"x"},{deg:115}],shape:"generic",rotation:-12,vertexLabels:["E","F","G","H"]},options:["63°","83°","117°","297°"],correctAnswer:0,answerValue:63,hint1:"Use the angle sum of a quadrilateral.",hint2:"The four corners E, F, G and H total 360°.",hint3:"Add 85°, 97° and 115°, then subtract the total from 360°.",explanation:[{text:"The four interior angles of EFGH total 360°.",highlight:["85","97","x","115"]},{text:"Add the three angles that are given as numbers.",math:"85° + 97° + 115° = 297°",highlight:["85","97","115"]},{text:"Take that away from 360°.",math:["x = 360° − 297°","x = 63°"],highlight:["x"]},{text:"297° is the answer of someone who added and then stopped, and 117° comes from using 180° as the total for a quadrilateral."}]},{id:"s1q10",set:1,topic:"straight-line",skills:["straight-line"],difficulty:1,type:"numeric",prompt:"Work out the size of angle p.",given:"The straight line VW has been tilted. Three angles meet at the point U.",diagram:{kind:"straightLine",angles:[{deg:38},{deg:96},{deg:46,label:"p"}],rotation:156,endLabels:["V","W"],vertexLabel:"U"},correctAnswer:46,hint1:"Ignore the slope of the line and look at the rule: the angles resting on it total 180°.",hint2:"The three angles at U share the line VW, so 38°, 96° and p make 180°.",hint3:"Add 38° and 96° first, then subtract that total from 180°.",explanation:[{text:"The line VW has been rotated, but the three angles still rest on a straight line, so they total 180°.",highlight:["38","96","p"]},{text:"Add the two known angles.",math:"38° + 96° = 134°",highlight:["38","96"]},{text:"Angle p makes up the rest of the 180°.",math:["p = 180° − 134°","p = 46°"],highlight:["p"]}]},{id:"s1q11",set:1,topic:"around-point",skills:["around-point"],difficulty:2,type:"numeric",prompt:"Work out the size of the reflex angle r.",given:"Three angles meet at a point. Angle r is reflex.",diagram:{kind:"aroundPoint",angles:[{deg:68},{deg:54},{deg:238,label:"r"}],rotation:20},correctAnswer:238,hint1:"A reflex angle is still simply part of the turn round the point.",hint2:"The two small angles and the reflex angle r together make one full turn of 360°.",hint3:"Add 68° and 54°, then subtract the total from 360°.",explanation:[{text:"All three angles meet at the same point, so they total 360°.",highlight:["68","54","r"]},{text:"Add the two acute angles.",math:"68° + 54° = 122°",highlight:["68","54"]},{text:"The reflex angle is the rest of the turn.",math:["r = 360° − 122°","r = 238°"],highlight:["r"]},{text:"Check the answer looks sensible: 238° is bigger than 180°, so it really is reflex."}]},{id:"s1q12",set:1,topic:"quadrilateral",skills:["quadrilateral"],difficulty:1,type:"numeric",prompt:"Find the size of angle x.",given:"WXYZ is a quadrilateral.",diagram:{kind:"quad",angles:[{deg:118},{deg:86,key:"k1"},{deg:70,label:"x"},{deg:86,key:"k2"}],shape:"kite",rotation:0,vertexLabels:["W","X","Y","Z"]},correctAnswer:70,hint1:"Two corners here are the same size, but the angle sum is the same as for any quadrilateral.",hint2:"The angles at W, X, Y and Z total 360°, and three of them are marked.",hint3:"Add 118°, 86° and 86°, then subtract that total from 360°.",explanation:[{text:"WXYZ is a quadrilateral, so its four angles total 360°.",highlight:["118","k1","k2","x"]},{text:"Add the three marked angles, remembering that 86° appears twice.",math:"118° + 86° + 86° = 290°",highlight:["118","k1","k2"]},{text:"The angle at Y is what remains.",math:["x = 360° − 290°","x = 70°"],highlight:["x"]}]},{id:"s1q13",set:1,topic:"straight-line",skills:["straight-line"],difficulty:2,type:"multi",prompt:"Work out the sizes of angles a and b.",given:"AB is a straight line. PC and QR are rays drawn from points on AB.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0,labelDir:180},{name:"P",x:120,y:0,labelDir:270},{name:"C",x:36.98194618,y:72.16649319,labelDir:130},{name:"Q",x:300,y:0,labelDir:270},{name:"R",x:341.2067253,y:101.990224,labelDir:70},{name:"B",x:420,y:0,labelDir:0}],segments:[{a:"A",b:"B"},{a:"P",b:"C"},{a:"Q",b:"R"}],arcs:[{at:"P",from:"A",to:"C",key:"41"},{at:"P",from:"C",to:"B",label:"a"},{at:"Q",from:"R",to:"B",key:"68"},{at:"Q",from:"A",to:"R",label:"b"}]},correctAnswer:[139,112],answerLabels:["a","b"],hint1:"Deal with each ray on its own. At any point on a straight line the angles above the line total 180°.",hint2:"At P the 41° angle and angle a share the line, and at Q the 68° angle and angle b do the same.",hint3:"Work out 180° − 41° for angle a, then 180° − 68° for angle b.",explanation:[{text:"At P the two marked angles lie on the straight line AB, so they total 180°.",highlight:["41","a"]},{text:"Subtract to find a.",math:["a = 180° − 41°","a = 139°"],highlight:["a"]},{text:"The angles at Q rest on the same straight line, so exactly the same rule applies there.",highlight:["68","b"]},{text:"Subtract to find b.",math:["b = 180° − 68°","b = 112°"],highlight:["b"]}]},{id:"s1q14",set:1,topic:"around-point",skills:["around-point"],difficulty:2,type:"multi",prompt:"Work out the sizes of angles c and d.",given:"Four angles meet at a point. Angle d is twice the size of angle c.",diagram:{kind:"aroundPoint",angles:[{deg:143},{deg:46,label:"c"},{deg:79},{deg:92,label:"d"}],rotation:100},correctAnswer:[46,92],answerLabels:["c","d"],hint1:"Start with the full turn: all four angles at the point total 360°.",hint2:"Take the two known angles away from 360° to see how much c and d share between them.",hint3:"Angles c and d share 138°. Since d is twice c, split that 138° into three equal parts.",explanation:[{text:"The four angles make a complete turn, so they total 360°.",highlight:["143","79","c","d"]},{text:"Take away the two angles that are given.",math:["143° + 79° = 222°","360° − 222° = 138°"],highlight:["143","79"]},{text:"Angle d is twice angle c, so the 138° is made of three equal parts: one part for c and two for d.",math:"138° ÷ 3 = 46°"},{text:"Now write down both angles.",math:["c = 46°","d = 46° + 46° = 92°"],highlight:["c","d"]}]},{id:"s1q15",set:1,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"numeric",prompt:"Work out the size of the reflex angle x.",given:"JKLM is a quadrilateral with a dent in it, so the interior angle at L is reflex.",diagram:{kind:"quad",angles:[{deg:56},{deg:34},{deg:212,label:"x"},{deg:58}],shape:"generic",rotation:15,vertexLabels:["J","K","L","M"]},correctAnswer:212,hint1:"The angle sum of a quadrilateral is 360°, even when one corner points inwards.",hint2:"So 56°, 34°, angle x and 58° together must make 360°.",hint3:"Add the three angles you can see, then subtract that total from 360°.",explanation:[{text:"Every quadrilateral has interior angles totalling 360°, including this arrowhead shape.",highlight:["56","34","58","x"]},{text:"Add the three angles at J, K and M.",math:"56° + 34° + 58° = 148°",highlight:["56","34","58"]},{text:"The angle at L takes up the rest.",math:["x = 360° − 148°","x = 212°"],highlight:["x"]},{text:"The answer is more than 180°, which agrees with the dent you can see in the diagram."}]},{id:"s1q16",set:1,topic:"straight-line",skills:["straight-line"],difficulty:2,type:"truefalse",prompt:"Is Leo correct?",given:"S, R and T lie on a straight line. Leo looks at the diagram and says, “Angle k is obtuse.”",diagram:{kind:"straightLine",angles:[{deg:116},{deg:64,label:"k"}],rotation:168,endLabels:["S","T"],vertexLabel:"R"},options:["True","False"],correctAnswer:1,reasonPrompt:"Choose the reason for your answer.",reasonOptions:["Angles on a straight line total 180°, so k = 64°, which is acute.","Angles on a straight line total 180°, so k = 64°, and any angle that is not a right angle is obtuse.","Angles at a point total 360°, so k = 244°, which is reflex.","Angle k is the same size as the angle beside it, so k = 116° and it is obtuse."],reasonAnswer:0,hint1:"You cannot decide this from the picture alone — work the angle out first.",hint2:"The two angles rest on the straight line ST, so they total 180°.",hint3:"Find 180° − 116°, then compare your answer with 90°.",explanation:[{text:"The two angles are on the straight line ST, so they total 180°.",highlight:["116","k"]},{text:"Work out angle k.",math:["k = 180° − 116°","k = 64°"],highlight:["k"]},{text:"An obtuse angle lies between 90° and 180°. Since 64° is smaller than 90°, angle k is acute, so Leo is wrong."}]},{id:"s1q17",set:1,topic:"around-point",skills:["around-point","straight-line"],difficulty:2,type:"numeric",prompt:"Work out the size of angle y.",given:"Four rays meet at a point, and two of them lie along the same straight line.",diagram:{kind:"aroundPoint",angles:[{deg:47},{deg:133},{deg:124,label:"y"},{deg:56}],rotation:33},correctAnswer:124,hint1:"There are two ways in here: the full turn of 360°, or the straight line hiding in the diagram.",hint2:"Notice that 47° + 133° = 180°, so those two rays really do make a straight line, and angle y rests on that line beside the 56° angle.",hint3:"Either work out 360° − (47° + 133° + 56°), or simply work out 180° − 56°.",explanation:[{text:"All four angles meet at one point, so they total 360°.",highlight:["47","133","56","y"]},{text:"Add the three angles that are given.",math:"47° + 133° + 56° = 236°",highlight:["47","133","56"]},{text:"Subtract from the full turn.",math:["y = 360° − 236°","y = 124°"],highlight:["y"]},{text:"The quick route: 47° + 133° = 180°, so those two rays form a straight line, and angle y sits on it next to the 56° angle. That gives 180° − 56° instead."}]},{id:"s1q18",set:1,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"reasoning",prompt:"Which calculation gives the size of the fourth angle?",given:"Three angles of quadrilateral BCDE are 72°, 143° and 68°.",diagram:{kind:"quad",angles:[{deg:72},{deg:143},{deg:68},{deg:77,label:"x"}],shape:"generic",rotation:40,vertexLabels:["B","C","D","E"]},options:["360° − (72° + 143° + 68°)","180° − (72° + 143° + 68°)","72° + 143° + 68°","360° − 143°"],correctAnswer:0,hint1:"Think about what the four angles of a quadrilateral come to altogether.",hint2:"The missing angle is whatever is left of that total once the other three have been used up.",hint3:"Decide which total to start from, 180° or 360°, and which angles must be taken away from it.",explanation:[{text:"The four interior angles of a quadrilateral total 360°, so the calculation must start from 360°.",highlight:["72","143","68","x"]},{text:"All three known angles have to be removed from that total, not just the largest one.",math:"x = 360° − (72° + 143° + 68°)"},{text:"Carrying out that calculation gives the fourth angle.",math:["x = 360° − 283°","x = 77°"],highlight:["x"]},{text:"Starting from 180° would give a negative angle, which is impossible, and simply adding the three angles gives their total rather than the missing one."}]},{id:"s1q19",set:1,topic:"straight-line",skills:["straight-line"],difficulty:1,type:"numeric",prompt:"Work out the size of angle v.",given:"PQ is a straight line, and one of the three angles at R is a right angle.",diagram:{kind:"straightLine",angles:[{deg:90},{deg:29},{deg:61,label:"v"}],endLabels:["P","Q"],vertexLabel:"R"},correctAnswer:61,hint1:"The right angle counts as one of the angles on the line.",hint2:"So 90°, 29° and angle v together total 180°.",hint3:"Take 90° and 29° away from 180°.",explanation:[{text:"The right angle, the 29° angle and angle v all rest on the straight line PQ, so they total 180°.",highlight:["90","29","v"]},{text:"Add the two known angles.",math:"90° + 29° = 119°",highlight:["90","29"]},{text:"Subtract from 180°.",math:["v = 180° − 119°","v = 61°"],highlight:["v"]}]},{id:"s1q20",set:1,topic:"around-point",skills:["around-point"],difficulty:2,type:"truefalse",prompt:"Sara says the fourth angle must be reflex. Is she right?",given:"Four angles meet at a point. Three of them are 62°, 148° and 51°.",diagram:{kind:"aroundPoint",angles:[{deg:62},{deg:148},{deg:51},{deg:99,label:"n"}],rotation:65},options:["True","False"],correctAnswer:1,reasonPrompt:"Choose the best reason.",reasonOptions:["The three given angles total 261°, so the fourth angle is 99°, which is less than 180°.","The fourth angle is 261°, and that is more than 180°.","The fourth angle is 99°, and every angle bigger than 90° is reflex.","The three given angles already total more than 360°, so no fourth angle is possible."],reasonAnswer:0,hint1:"A reflex angle is one bigger than 180°, so you need its actual size before you can decide.",hint2:"The four angles make a full turn of 360°, so add the three you are told.",hint3:"Work out 62° + 148° + 51°, subtract that from 360°, then compare the result with 180°.",explanation:[{text:"The four angles fill a complete turn, so they total 360°.",highlight:["62","148","51","n"]},{text:"Add the three angles you are given.",math:"62° + 148° + 51° = 261°",highlight:["62","148","51"]},{text:"Subtract from the full turn.",math:["n = 360° − 261°","n = 99°"],highlight:["n"]},{text:"99° is obtuse rather than reflex, because it is smaller than 180°. Sara is wrong."}]},{id:"s1q21",set:1,topic:"quadrilateral",skills:["quadrilateral"],difficulty:1,type:"numeric",prompt:"Calculate the size of angle s.",given:"RSTU is a quadrilateral drawn on its side.",diagram:{kind:"quad",angles:[{deg:102},{deg:69,label:"s"},{deg:131},{deg:58}],shape:"generic",rotation:200,vertexLabels:["R","S","T","U"]},correctAnswer:69,hint1:"Turning a shape round does not change any of its angles.",hint2:"The four corners still total 360°, and the one at S is the missing one.",hint3:"Add 102°, 131° and 58°, then subtract the total from 360°.",explanation:[{text:"However the quadrilateral is turned, its four interior angles total 360°.",highlight:["102","131","58","s"]},{text:"Add the three angles at R, T and U.",math:"102° + 131° + 58° = 291°",highlight:["102","131","58"]},{text:"The angle at S is what is left.",math:["s = 360° − 291°","s = 69°"],highlight:["s"]}]},{id:"s1q22",set:1,topic:"straight-line",skills:["straight-line"],difficulty:1,type:"mc",prompt:"Which of these is the size of angle g?",given:"JK is a straight line.",diagram:{kind:"straightLine",angles:[{deg:147},{deg:33,label:"g"}],rotation:208,endLabels:["J","K"]},options:["33°","47°","147°","213°"],correctAnswer:0,answerValue:33,hint1:"The two angles share the straight line JK.",hint2:"Angles on a straight line total 180°, so 147° and g add to 180°.",hint3:"Work out 180° − 147°, taking care with the regrouping.",explanation:[{text:"The 147° angle and angle g rest on the straight line JK, so they total 180°.",highlight:["147","g"]},{text:"Subtract the angle you are given.",math:["g = 180° − 147°","g = 33°"],highlight:["g"]},{text:"213° would be the answer if a full turn of 360° had been used by mistake, and 47° is what a careless subtraction produces."}]},{id:"s1q23",set:1,topic:"around-point",skills:["around-point"],difficulty:1,type:"mc",prompt:"Select the size of angle t.",given:"Two rays meet at a point. The reflex angle between them is 247°.",diagram:{kind:"aroundPoint",angles:[{deg:247},{deg:113,label:"t"}],rotation:250},options:["67°","113°","123°","247°"],correctAnswer:1,answerValue:113,hint1:"The reflex angle and angle t are the only two angles at this point.",hint2:"Together they make one complete turn, so they total 360°.",hint3:"Work out 360° − 247°.",explanation:[{text:"The two rays split the turn round the point into just two angles, so those angles total 360°.",highlight:["247","t"]},{text:"Subtract the reflex angle from the full turn.",math:["t = 360° − 247°","t = 113°"],highlight:["t"]},{text:"67° comes from taking 180° away from 247° instead, which would only be right if the two angles sat on a straight line."}]},{id:"s1q24",set:1,topic:"quadrilateral",skills:["quadrilateral"],difficulty:1,type:"mc",prompt:"What is the size of angle x?",given:"TUVW is a quadrilateral.",diagram:{kind:"quad",angles:[{deg:88,label:"x"},{deg:47},{deg:133},{deg:92}],shape:"generic",rotation:165,vertexLabels:["T","U","V","W"]},options:["88°","92°","133°","272°"],correctAnswer:0,answerValue:88,hint1:"The angle sum of a quadrilateral is the fact you need here.",hint2:"The angles at T, U, V and W total 360°, and only the one at T is unknown.",hint3:"Add 47°, 133° and 92°, then subtract that total from 360°.",explanation:[{text:"The four interior angles of TUVW total 360°.",highlight:["x","47","133","92"]},{text:"Add the three known angles.",math:"47° + 133° + 92° = 272°",highlight:["47","133","92"]},{text:"Subtract from 360° to reach the angle at T.",math:["x = 360° − 272°","x = 88°"],highlight:["x"]},{text:"Someone using 180° as the quadrilateral total would reach 92°, and 272° is just the sum of the three given angles."}]},{id:"s1q25",set:1,topic:"straight-line",skills:["straight-line","around-point"],difficulty:2,type:"reasoning",prompt:"Which statement about Mia’s method is correct?",given:"CD is a straight line. To find the missing angle, Mia writes 360° − (57° + 48°).",diagram:{kind:"straightLine",angles:[{deg:57},{deg:48},{deg:75,label:"x"}],rotation:-10,endLabels:["C","D"],vertexLabel:"E"},options:["She should subtract from 180°, because the three angles rest on a straight line.","She is right, because angles that meet at a point always total 360°.","She should add the three angles instead, because that gives the missing angle.","She should subtract from 90°, because a straight line is built from two right angles."],correctAnswer:0,hint1:"Ask yourself which total belongs to this diagram: a straight line or a complete turn?",hint2:"The three angles all sit above the line CD, so they do not go the whole way round the point E.",hint3:"Try Mia’s calculation, then compare the result with the largest angle that can fit above a straight line.",explanation:[{text:"The three angles all rest above the straight line CD, so they total 180°, not 360°.",highlight:["57","48","x"]},{text:"Add the two known angles.",math:"57° + 48° = 105°",highlight:["57","48"]},{text:"Subtract from 180° to get the correct answer.",math:["x = 180° − 105°","x = 75°"],highlight:["x"]},{text:"Mia’s method gives 255°, a reflex angle that could never fit above a straight line. She has used the rule for angles round a point."}]}],ep=[{id:"s2q1",set:2,topic:"quadrilateral",skills:["quadrilateral","parallel"],difficulty:2,type:"multi",prompt:"Work out the sizes of angles x, y and z.",given:"ABCD is a parallelogram. The chevrons show which sides are parallel.",diagram:{kind:"quad",angles:[{deg:78},{deg:102,label:"x"},{deg:78,label:"y"},{deg:102,label:"z"}],shape:"parallelogram",rotation:8,vertexLabels:["A","B","C","D"],sideArrows:[1,2,1,2]},correctAnswer:[102,78,102],answerLabels:["x","y","z"],hint1:"A parallelogram has two useful angle facts: opposite angles are equal, and angles next to each other add to 180°.",hint2:"Angle y is opposite the 78°, while x and z are each next to it.",hint3:"Copy 78° across to the opposite corner, then work out 180° − 78° for each of the other two.",explanation:[{text:"Angle y sits opposite the 78° angle, and opposite angles of a parallelogram are equal.",math:"y = 78°",highlight:["78","y"]},{text:"Angle x is next to the 78° angle. The two sides through them are parallel, so this pair adds to 180°.",math:["x = 180° − 78°","x = 102°"],highlight:["78","x"]},{text:"Angle z is opposite x, so it matches x. Check that the four angles total 360°.",math:"78° + 102° + 78° + 102° = 360°",highlight:["z"]}]},{id:"s2q2",set:2,topic:"quadrilateral",skills:["quadrilateral","parallel"],difficulty:2,type:"numeric",prompt:"Calculate the size of angle x.",given:"KLMN is a parallelogram.",diagram:{kind:"custom",points:[{name:"K",x:0,y:0},{name:"L",x:180,y:0},{name:"M",x:268.659787,y:95.075981},{name:"N",x:88.659787,y:95.075981}],segments:[{a:"K",b:"L",arrows:1},{a:"L",b:"M",arrows:2},{a:"M",b:"N",arrows:1},{a:"N",b:"K",arrows:2}],arcs:[{at:"K",from:"L",to:"N"},{at:"L",from:"M",to:"K",label:"x"}]},correctAnswer:133,hint1:"Angles K and L lie between the same pair of parallel sides.",hint2:"A pair of angles like that, at the two ends of one side, must total 180°.",hint3:"Take 47° away from 180°.",explanation:[{text:"KN and LM are parallel, and the side KL crosses both of them.",highlight:["47"]},{text:"Angles K and L are next to each other in the parallelogram, so they add to 180°.",math:"47° + x = 180°",highlight:["47","x"]},{text:"Subtract to find x.",math:["x = 180° − 47°","x = 133°"],highlight:["x"]}]},{id:"s2q3",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"error",prompt:"What mistake has Marcus made?",given:'PQRS is a parallelogram. Marcus writes: "y = 180° − 96° = 84°, because the opposite angles of a parallelogram add up to 180°."',diagram:{kind:"quad",angles:[{deg:96},{deg:84},{deg:96,label:"y"},{deg:84}],shape:"parallelogram",rotation:-6,vertexLabels:["P","Q","R","S"],sideArrows:[1,2,1,2]},options:["The four angles of a parallelogram are all equal, so y should be 90°.","He should have subtracted from 360° rather than 180°, giving y = 264°.","Opposite angles of a parallelogram are equal, not supplementary, so y = 96°.","He should have shared the rest of the turn out evenly, giving y = (360° − 96°) ÷ 2 = 132°."],correctAnswer:2,hint1:"Check which pair of angles in a parallelogram really adds to 180°.",hint2:"Angles P and R are at opposite corners; angles P and Q are neighbours.",hint3:"Decide which of the two parallelogram rules applies to a pair of opposite corners, then apply it to 96°.",explanation:[{text:"Marcus has swapped the two parallelogram rules over. The pair that adds to 180° is a pair of neighbouring angles, such as P and Q.",highlight:["96","84"]},{text:"Angle y is at R, which is opposite P, and opposite angles of a parallelogram are equal.",math:"y = 96°",highlight:["96","y"]},{text:"His calculation would only have been right for the angle at Q or at S.",math:"180° − 96° = 84°",highlight:["84"]}]},{id:"s2q4",set:2,topic:"quadrilateral",skills:["quadrilateral","parallel"],difficulty:3,type:"numeric",prompt:"Work out the size of angle x.",given:"ABCD is a parallelogram and AC is a diagonal.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:191.480018,y:0},{name:"C",x:209.90873,y:116.354309},{name:"D",x:18.428712,y:116.354309}],segments:[{a:"A",b:"B",arrows:1},{a:"B",b:"C",arrows:2},{a:"C",b:"D",arrows:1},{a:"D",b:"A",arrows:2},{a:"A",b:"C",dashed:!0,muted:!0}],arcs:[{at:"A",from:"B",to:"C"},{at:"A",from:"C",to:"D"},{at:"B",from:"C",to:"A",label:"x"}]},correctAnswer:99,hint1:"The diagonal has split the corner at A into two parts. Put them back together first.",hint2:"Once you know the whole angle at A, use the fact that angles A and B are neighbours in the parallelogram.",hint3:"Add 29° and 52°, then take that total away from 180°.",explanation:[{text:"The diagonal AC splits angle A into 29° and 52°, so the whole angle at A is their sum.",math:"29° + 52° = 81°",highlight:["29","52"]},{text:"AD and BC are parallel, so angles A and B lie at the two ends of AB and add to 180°.",math:"81° + x = 180°",highlight:["x"]},{text:"Subtract to finish.",math:["x = 180° − 81°","x = 99°"],highlight:["x"]}]},{id:"s2q5",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"truefalse",prompt:"Is Ravi right?",given:"WXYZ is a parallelogram with angle W = 63°. Ravi says that angle p must also be 63°, because opposite angles of a parallelogram are equal.",diagram:{kind:"quad",angles:[{deg:63},{deg:117,label:"p"},{deg:63,label:"q"},{deg:117,label:"r"}],shape:"parallelogram",rotation:4,vertexLabels:["W","X","Y","Z"],sideArrows:[1,2,1,2]},options:["True","False"],correctAnswer:1,reasonPrompt:"Choose the reason.",reasonOptions:["Angle p is next to angle W, not opposite it, so p = 180° − 63° = 117°.","Opposite angles of a parallelogram add up to 180°, so p = 117°.","All four angles of a parallelogram are equal, so p = 90°.","There is not enough information: the angles of a parallelogram can be anything that totals 360°."],reasonAnswer:0,hint1:"Walk round the parallelogram in order: W, X, Y, Z. Which corner is really opposite W?",hint2:"Angle p is at X, and X comes straight after W, so those two are neighbours.",hint3:"Decide which rule applies to a pair of neighbouring angles, then apply it to 63°.",explanation:[{text:"Going round in order W, X, Y, Z, the corner opposite W is Y — the one marked q. That is the angle equal to 63°.",highlight:["63","q"]},{text:"Angle p is at X, which is next to W. Sides WZ and XY are parallel, so W and X add to 180°.",math:"63° + p = 180°",highlight:["63","p"]},{text:"So Ravi has used a real rule, but on the wrong pair of angles.",math:["p = 180° − 63°","p = 117°"],highlight:["p"]}]},{id:"s2q6",set:2,topic:"quadrilateral",skills:["quadrilateral","straight-line"],difficulty:3,type:"mc",prompt:"Work out the size of angle CBE, marked x.",given:"ABCD is a parallelogram. Side AB has been extended to the point E.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:180,y:0,labelDir:250},{name:"C",x:219.068178,y:113.46223},{name:"D",x:39.068178,y:113.46223},{name:"E",x:250,y:0}],segments:[{a:"A",b:"B",arrows:1},{a:"B",b:"C",arrows:2},{a:"C",b:"D",arrows:1},{a:"D",b:"A",arrows:2},{a:"B",b:"E"}],arcs:[{at:"A",from:"B",to:"D"},{at:"B",from:"C",to:"E",label:"x"}]},options:["19°","71°","109°","142°"],correctAnswer:1,answerValue:71,hint1:"Find the interior angle ABC first, using a parallelogram rule.",hint2:"AE is a straight line, so angle ABC and angle x sit together on that line.",hint3:"Work out 180° − 71° to get angle ABC, then subtract your result from 180° again.",explanation:[{text:"Angles A and B are neighbours in the parallelogram, so they add to 180°.",math:["angle ABC = 180° − 71°","angle ABC = 109°"],highlight:["71"]},{text:"A, B and E lie on a straight line, so angle ABC and angle x add to 180°.",math:"109° + x = 180°",highlight:["x"]},{text:"Subtract to finish. Notice that x has come out equal to angle A.",math:["x = 180° − 109°","x = 71°"],highlight:["x"]}]},{id:"s2q7",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"multi",prompt:"Work out the sizes of angles x and y.",given:"ABCD is a kite with AB = AD and CB = CD. Its line of symmetry runs through A and C.",diagram:{kind:"quad",angles:[{deg:104},{deg:86,label:"x"},{deg:84},{deg:86,label:"y"}],shape:"kite",vertexLabels:["A","B","C","D"],sideTicks:[1,2,2,1]},correctAnswer:[86,86],answerLabels:["x","y"],hint1:"The mirror line through A and C sends B to D, so angles x and y are the same size.",hint2:"The four angles still have to total 360°, so x and y share whatever is left over.",hint3:"Work out 360° − 104° − 84°, then split that remainder into two equal parts.",explanation:[{text:"Start with the total for any quadrilateral and take off the two angles you know.",math:["104° + 84° = 188°","360° − 188° = 172°"],highlight:["104","84"]},{text:"Reflecting in the line AC swaps B and D, so the two remaining angles are equal.",math:"x = y",highlight:["x","y"]},{text:"Share the 172° equally between them.",math:["x = 172° ÷ 2 = 86°","y = 86°"],highlight:["x","y"]}]},{id:"s2q8",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"numeric",prompt:"Calculate the size of angle x.",given:"PQRS is a kite with PQ = PS and RQ = RS. The dashed line PR is its only line of symmetry.",diagram:{kind:"custom",points:[{name:"P",x:0,y:240},{name:"Q",x:82.469654,y:45.713676},{name:"R",x:0,y:0},{name:"S",x:-82.469654,y:45.713676}],segments:[{a:"P",b:"Q",ticks:1},{a:"Q",b:"R",ticks:2},{a:"R",b:"S",ticks:2},{a:"S",b:"P",ticks:1},{a:"P",b:"R",dashed:!0,muted:!0}],arcs:[{at:"P",from:"Q",to:"S"},{at:"R",from:"S",to:"Q"},{at:"Q",from:"P",to:"R",label:"x"}]},correctAnswer:96,hint1:"The angles at Q and S are the pair that the mirror line swaps, so they are equal.",hint2:"The angles at P and R are the ones the mirror line passes through, and those two are already given.",hint3:"Take 46° and 122° away from 360°, then halve what is left.",explanation:[{text:"The four angles of the kite total 360°. Take off the two given angles.",math:["46° + 122° = 168°","360° − 168° = 192°"],highlight:["46","122"]},{text:"PR is a line of symmetry, so the angle at Q is a mirror image of the angle at S. They must be equal.",highlight:["x"]},{text:"Halve the 192° that is left.",math:["x = 192° ÷ 2","x = 96°"],highlight:["x"]}]},{id:"s2q9",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"mc",prompt:"Which statement about the kite must be true?",given:"ABCD is a kite. The dashed line AC is its line of symmetry, and the angle at B is 74°.",diagram:{kind:"custom",points:[{name:"A",x:0,y:230},{name:"B",x:150.792702,y:94.225736},{name:"C",x:0,y:0},{name:"D",x:-150.792702,y:94.225736}],segments:[{a:"A",b:"B",ticks:1},{a:"B",b:"C",ticks:2},{a:"C",b:"D",ticks:2},{a:"D",b:"A",ticks:1},{a:"A",b:"C",dashed:!0,muted:!0}],arcs:[{at:"B",from:"A",to:"C"}]},options:["Angle A = 74°, because A and B share the side AB.","Angle C = 74°, because the line of symmetry passes through A and C.","Angle D = 74°, because B and D are mirror images in the line of symmetry.","Angle D = 106°, because B and D are next to each other and add to 180°."],correctAnswer:2,hint1:"A kite has exactly one line of symmetry. Ask what that reflection does to each corner.",hint2:"The reflection keeps A and C where they are, and swaps B with D.",hint3:"Decide which single pair of angles the reflection forces to be equal.",explanation:[{text:"Reflecting in AC maps B onto D, so angle B and angle D are copies of each other.",math:"angle D = angle B = 74°",highlight:["74"]},{text:"A and C lie on the mirror line, so the reflection leaves them fixed. It says nothing about making them equal to each other or to 74°."},{text:"Neighbouring angles of a kite do not have to add to 180° — that rule belongs to parallelograms and trapeziums."}]},{id:"s2q10",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"mc",prompt:"Which list could give the angles at K, L, M and N, in that order?",given:"KLMN is a kite whose line of symmetry passes through K and M.",diagram:{kind:"custom",points:[{name:"K",x:0,y:220},{name:"L",x:120,y:80},{name:"M",x:0,y:0},{name:"N",x:-120,y:80}],segments:[{a:"K",b:"L",ticks:1},{a:"L",b:"M",ticks:2},{a:"M",b:"N",ticks:2},{a:"N",b:"K",ticks:1},{a:"K",b:"M",dashed:!0,muted:!0}]},options:["48°, 128°, 128°, 56°","60°, 116°, 70°, 116°","48°, 128°, 56°, 128°","70°, 115°, 70°, 105°"],correctAnswer:2,hint1:"Two things must happen at once: the four angles total 360°, and the right pair must be equal.",hint2:"The mirror line passes through K and M, so it is the angles at L and N that must match.",hint3:"Add each list up first, then check whether the 2nd and 4th numbers are the same.",explanation:[{text:"Because the mirror line runs through K and M, the reflection swaps L and N. So the second and fourth angles in the list have to be equal."},{text:"Check the totals as well: 48° + 128° + 56° + 128° = 360°.",math:"48° + 128° + 56° + 128° = 360°"},{text:"The other lists fail one test or the other: 60°, 116°, 70°, 116° totals 362°; 48°, 128°, 128°, 56° puts the equal pair in the wrong places; 70°, 115°, 70°, 105° makes K and M equal instead of L and N."}]},{id:"s2q11",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"error",prompt:"What has gone wrong in Jonah’s reasoning?",given:'EFGH is a kite with EF = EH and GF = GH. Jonah writes: "A kite has two equal angles, so angle G = angle F = 137°."',diagram:{kind:"custom",points:[{name:"E",x:0,y:300},{name:"F",x:56.378731,y:184.406448},{name:"G",x:0,y:0},{name:"H",x:-56.378731,y:184.406448}],segments:[{a:"E",b:"F",ticks:1},{a:"F",b:"G",ticks:2},{a:"G",b:"H",ticks:2},{a:"H",b:"E",ticks:1},{a:"E",b:"G",dashed:!0,muted:!0}],arcs:[{at:"E",from:"F",to:"H"},{at:"F",from:"E",to:"G"}]},options:["A kite has two pairs of equal angles, so angle G should equal angle E, which is 52°.","The equal pair here is F and H, not F and G, so angle G = 360° − 52° − 137° − 137° = 34°.","He should have halved what was left of the turn, giving angle G = (360° − 52°) ÷ 2 = 154°.","Angles E and F are next to each other, so they add to 180° and angle F cannot be 137°."],correctAnswer:1,hint1:"A kite has one line of symmetry, and it decides which two angles are equal.",hint2:"The mirror line EG keeps E and G fixed and swaps F with H, so F and H are the equal pair.",hint3:"Take 52°, 137° and the angle equal to it away from 360°.",explanation:[{text:"The line of symmetry EG swaps F and H, so it is angle H that equals 137°, not angle G.",math:"angle H = 137°",highlight:["137"]},{text:"Now three angles are known, so subtract them from the quadrilateral total.",math:["52° + 137° + 137° = 326°","angle G = 360° − 326°"],highlight:["52"]},{text:"That leaves a sharp angle at the tail of the kite.",math:"angle G = 34°"}]},{id:"s2q12",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"numeric",prompt:"Work out the size of angle x.",given:"Three angles of this quadrilateral are equal. Each is marked x.",diagram:{kind:"quad",angles:[{deg:156},{deg:68,label:"x"},{deg:68,label:"x"},{deg:68,label:"x"}],shape:"generic",rotation:14,vertexLabels:["A","B","C","D"]},correctAnswer:68,hint1:"Every quadrilateral has angles that total 360°.",hint2:"Take the 156° off the total first; the rest is shared equally between the three angles marked x.",hint3:"Work out 360° − 156°, then divide that by 3.",explanation:[{text:"The four angles total 360°, and one of them is 156°.",math:"156° + x + x + x = 360°",highlight:["156","x"]},{text:"Subtract to find what the three equal angles share between them.",math:"3x = 360° − 156° = 204°",highlight:["x"]},{text:"Divide by 3.",math:["x = 204° ÷ 3","x = 68°"],highlight:["x"]}]},{id:"s2q13",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"numeric",prompt:"Work out the size of angle y.",given:"In quadrilateral EFGH the three angles marked with the same letter are equal, and the fourth angle y is twice the size of one of them.",diagram:{kind:"quad",angles:[{deg:72,label:"x"},{deg:72,label:"x"},{deg:144,label:"y"},{deg:72,label:"x"}],shape:"generic",rotation:-10,vertexLabels:["E","F","G","H"]},correctAnswer:144,hint1:"Write the total of the four angles in terms of the smaller repeated angle.",hint2:"Three of them are one lot each and the fourth is worth two lots, so there are five equal lots altogether.",hint3:"Divide 360° by 5 to find one lot, then double it.",explanation:[{text:'Call the repeated angle one "lot". Three angles are one lot each, and y is worth two lots.',math:"lot + lot + lot + 2 lots = 5 lots",highlight:["x","y"]},{text:"All five lots together make the quadrilateral total.",math:["5 lots = 360°","1 lot = 72°"],highlight:["x"]},{text:"Angle y is two of those lots.",math:["y = 2 × 72°","y = 144°"],highlight:["y"]}]},{id:"s2q14",set:2,topic:"quadrilateral",skills:["quadrilateral","parallel"],difficulty:3,type:"multi",prompt:"Work out the sizes of angles x, y and z.",given:"ABCD is a trapezium with AB parallel to DC. The ticks show that AD and BC are the same length, so the trapezium is symmetrical.",diagram:{kind:"quad",angles:[{deg:63},{deg:63,label:"x"},{deg:117,label:"y"},{deg:117,label:"z"}],shape:"generic",rotation:0,vertexLabels:["A","B","C","D"],sideArrows:[1,0,1,0],sideTicks:[0,1,0,1]},correctAnswer:[63,117,117],answerLabels:["x","y","z"],hint1:"The trapezium has a vertical mirror line, and AB and DC are parallel.",hint2:"The mirror line swaps A with B and D with C, so angle x matches the 63°.",hint3:"After finding x, use the fact that A and D lie at the two ends of the side AD, between the parallel lines, so they total 180°.",explanation:[{text:"The trapezium is symmetrical, so the angle at B is a mirror image of the angle at A.",math:"x = 63°",highlight:["63","x"]},{text:"AB and DC are parallel and AD crosses them, so angles A and D add to 180°.",math:["z = 180° − 63°","z = 117°"],highlight:["z"]},{text:"By symmetry angle C matches angle D. Check the total.",math:["y = 117°","63° + 63° + 117° + 117° = 360°"],highlight:["y"]}]},{id:"s2q15",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"numeric",prompt:"Work out the size of angle ADE, marked x.",given:"ABCD is a square. Triangle ABE is equilateral and sits inside the square. The ticks show the sides that are equal.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:140,y:0},{name:"C",x:140,y:140},{name:"D",x:0,y:140},{name:"E",x:70,y:121.243557,labelDir:300}],segments:[{a:"A",b:"B",ticks:1},{a:"B",b:"C"},{a:"C",b:"D"},{a:"D",b:"A"},{a:"A",b:"E",ticks:1},{a:"B",b:"E",ticks:1},{a:"D",b:"E"}],arcs:[{at:"A",from:"E",to:"B"},{at:"B",from:"A",to:"C",right:!0},{at:"C",from:"B",to:"D",right:!0},{at:"D",from:"A",to:"E",label:"x"}]},correctAnswer:75,hint1:"Look at triangle ADE on its own. What do you know about the lengths AD and AE?",hint2:"AD is a side of the square and AE is a side of the equilateral triangle, and both are the same length, so triangle ADE is isosceles.",hint3:"First find angle DAE by taking 60° from the right angle at A, then share what is left of 180° between the two equal base angles.",explanation:[{text:"The corner of the square at A is 90°, and the equilateral triangle uses 60° of it.",math:["angle DAE = 90° − 60°","angle DAE = 30°"],highlight:["60"]},{text:"AD and AE are both equal to the side of the square, so triangle ADE is isosceles and its two base angles are equal.",highlight:["x"]},{text:"The angles of the triangle total 180°, so share the rest between the two base angles.",math:["x = (180° − 30°) ÷ 2","x = 75°"],highlight:["x"]}]},{id:"s2q16",set:2,topic:"quadrilateral",skills:["quadrilateral","parallel"],difficulty:3,type:"numeric",prompt:"Work out the size of angle BDC, marked x.",given:"ABCD is a rectangle and BD is a diagonal.",diagram:{kind:"custom",points:[{name:"A",x:0,y:100},{name:"B",x:196.26105,y:100},{name:"C",x:196.26105,y:0},{name:"D",x:0,y:0}],segments:[{a:"A",b:"B",arrows:1},{a:"B",b:"C",arrows:2},{a:"C",b:"D",arrows:1},{a:"D",b:"A",arrows:2},{a:"B",b:"D",dashed:!0,muted:!0}],arcs:[{at:"A",from:"B",to:"D",right:!0},{at:"C",from:"D",to:"B",right:!0},{at:"B",from:"A",to:"D"},{at:"D",from:"B",to:"C",label:"x"}]},correctAnswer:27,hint1:"AB and DC are the two parallel sides, and the diagonal BD crosses both of them.",hint2:"The 27° and angle x sit on opposite sides of BD, tucked between the two parallel lines — they are alternate angles.",hint3:"Decide whether alternate angles are equal or add to 180°, then apply that to 27°.",explanation:[{text:"AB is parallel to DC, and the diagonal BD is a line crossing both of them.",highlight:["27"]},{text:"Angle ABD and angle x form a Z shape between the parallel sides, so they are alternate angles and therefore equal.",math:"x = 27°",highlight:["27","x"]},{text:"You can check it with the right angle at C: angle DBC = 90° − 27° = 63°, and 63° + 27° + 90° = 180° in triangle BCD.",math:"27° + 63° + 90° = 180°"}]},{id:"s2q17",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"numeric",prompt:"Calculate the size of angle BAC, marked x.",given:"ABCD is a rhombus, so all four sides are the same length. AC is a diagonal.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:150,y:0},{name:"C",x:215.755672,y:134.819108},{name:"D",x:65.755672,y:134.819108}],segments:[{a:"A",b:"B",ticks:1},{a:"B",b:"C",ticks:1},{a:"C",b:"D",ticks:1},{a:"D",b:"A",ticks:1},{a:"A",b:"C",dashed:!0,muted:!0}],arcs:[{at:"B",from:"A",to:"C"},{at:"A",from:"C",to:"B",label:"x"}]},correctAnswer:32,hint1:"The diagonal AC cuts the rhombus into two triangles. Look at triangle ABC.",hint2:"AB and BC are sides of the rhombus, so they are equal and triangle ABC is isosceles.",hint3:"Take 116° away from 180°, then halve what is left.",explanation:[{text:"All four sides of a rhombus are equal, so AB = BC and triangle ABC is isosceles.",highlight:["116"]},{text:"The angles at A and C in that triangle are the two equal base angles, and the three angles total 180°.",math:"x + x + 116° = 180°",highlight:["x"]},{text:"Subtract, then halve.",math:["2x = 64°","x = 32°"],highlight:["x"]}]},{id:"s2q18",set:2,topic:"quadrilateral",skills:["quadrilateral","construction"],difficulty:3,type:"reasoning",prompt:"Which statement about Rafi’s drawing is correct?",given:"Rafi is drawing rhombus ABCD. So far he has drawn AB = 7 cm and the arm AD at 68° to AB.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:175,y:0},{name:"D",x:65.556153,y:162.257174}],segments:[{a:"A",b:"B",length:"7 cm"},{a:"A",b:"D"}],arcs:[{at:"A",from:"B",to:"D"}]},options:["He needs the length of the diagonal AC before he can finish the rhombus.","He cannot finish yet, because the size of angle B could be anything.","He has enough: every side must be 7 cm, and angle B = 180° − 68° = 112°.","He has enough, but only because all four angles of a rhombus are 90°."],correctAnswer:2,hint1:'Write down everything the word "rhombus" tells you for free.',hint2:"A rhombus is a parallelogram with four equal sides, so the side lengths are already fixed by AB.",hint3:"Use the parallelogram rule for two angles that are next to each other to test whether angle B is forced.",explanation:[{text:"A rhombus has four equal sides, so AD, BC and CD must all be 7 cm as soon as AB = 7 cm is drawn.",highlight:["68"]},{text:"A rhombus is also a parallelogram, so angles A and B are neighbours and add to 180°.",math:["angle B = 180° − 68°","angle B = 112°"]},{text:"Every measurement is now decided, so no extra information is needed. Only a square has all four angles equal to 90°, and this rhombus is not a square."}]},{id:"s2q19",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"reasoning",prompt:"Could these four angles be the angles of a quadrilateral?",given:"A puzzle book lists four angles: 88°, 97°, 64° and 111°.",options:["Yes, because they total 360°, which is the angle sum of every quadrilateral.","No, because a quadrilateral must contain at least one right angle.","No, because they total 360° but the angles of a quadrilateral must total 180°.","Yes, but only because two of the four angles happen to be obtuse."],correctAnswer:0,hint1:"There is only one test that every set of quadrilateral angles has to pass.",hint2:"That test is about the total of the four angles, not about their individual sizes.",hint3:"Add 88°, 97°, 64° and 111° and compare your total with 360°.",explanation:[{text:"A quadrilateral splits into two triangles, so its angles always total 2 × 180° = 360°.",math:"2 × 180° = 360°"},{text:"Add the four listed angles.",math:"88° + 97° + 64° + 111° = 360°"},{text:"The total is exactly 360°, so a quadrilateral with these angles can be drawn. No right angle is needed, and nothing depends on how many angles are obtuse."}]},{id:"s2q20",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"reasoning",prompt:"Which statement about Hana’s four angles is correct?",given:"Hana claims she has drawn a quadrilateral with angles 132°, 108°, 79° and 46°.",options:["She is right: any four angles that are each smaller than 180° will fit together as a quadrilateral.","She cannot be right: the four angles total 365°, but they must total exactly 360°.","She cannot be right: 46° is too small, because every angle of a quadrilateral must be at least 60°.","She is right: the total is 365°, which is close enough to 360° once the shape is drawn."],correctAnswer:1,hint1:"Test the four angles against the angle sum of a quadrilateral.",hint2:"Add them carefully and compare your answer with 360°.",hint3:"Work out 132° + 108° + 79° + 46° and see how far it is from 360°.",explanation:[{text:"Add the four angles Hana has listed.",math:"132° + 108° + 79° + 46° = 365°"},{text:"Every quadrilateral has angles totalling exactly 360°, so 365° is 5° too much and the sides could never close up.",math:"365° − 360° = 5°"},{text:'There is no rule about a smallest angle, and "close enough" is not allowed: the shape either closes or it does not.'}]},{id:"s2q21",set:2,topic:"quadrilateral",skills:["quadrilateral","around-point"],difficulty:3,type:"numeric",prompt:"Work out the size of the reflex angle x.",given:"ABCD is an arrowhead. The angle inside it at C is reflex.",diagram:{kind:"quad",angles:[{deg:38},{deg:65},{deg:192,label:"x"},{deg:65}],shape:"generic",vertexLabels:["A","B","C","D"]},correctAnswer:192,hint1:"An arrowhead is still a quadrilateral, so the same angle-sum rule applies.",hint2:"The four angles inside it total 360°, even though one of them is bigger than 180°.",hint3:"Add 38°, 65° and 65°, then subtract that total from 360°.",explanation:[{text:"An arrowhead has four sides and four corners, so its interior angles total 360° just like any other quadrilateral.",highlight:["38","65"]},{text:"Add the three angles you can see.",math:"38° + 65° + 65° = 168°"},{text:'Subtract from 360°. The answer is more than 180°, which is exactly what "reflex" means and why the corner at C caves inwards.',math:["x = 360° − 168°","x = 192°"],highlight:["x"]}]},{id:"s2q22",set:2,topic:"quadrilateral",skills:["quadrilateral","intersecting","straight-line"],difficulty:2,type:"mc",prompt:"Work out the size of angle BXC, marked x.",given:"The diagonals of quadrilateral ABCD cross at X.",diagram:{kind:"custom",points:[{name:"A",x:-106.920782,y:54.47886},{name:"B",x:133.650978,y:68.098575},{name:"C",x:115.830848,y:-59.018765},{name:"D",x:-98.010717,y:-49.938955},{name:"X",x:0,y:0,labelDir:235}],segments:[{a:"A",b:"B"},{a:"B",b:"C"},{a:"C",b:"D"},{a:"D",b:"A"},{a:"A",b:"C",dashed:!0,muted:!0},{a:"B",b:"D",dashed:!0,muted:!0}],arcs:[{at:"X",from:"A",to:"B"},{at:"X",from:"B",to:"C",label:"x"}]},options:["27°","54°","63°","126°"],correctAnswer:1,answerValue:54,hint1:"A and C are the two ends of one diagonal, so AXC is a straight line.",hint2:"Angle AXB and angle x sit next to each other on that straight line.",hint3:"Take 126° away from 180°.",explanation:[{text:"The diagonal AC is a straight line through X, so the angles AXB and BXC together make a half turn.",math:"126° + x = 180°",highlight:["126","x"]},{text:"Subtract to find x.",math:["x = 180° − 126°","x = 54°"],highlight:["x"]},{text:"Angle DXA is also 54°, because it is vertically opposite angle x, and the four angles at X total 360°.",math:"126° + 54° + 126° + 54° = 360°"}]},{id:"s2q23",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:2,type:"mc",prompt:"Work out the size of the fourth angle, x.",given:"Three angles of quadrilateral JKLM are each 87°.",diagram:{kind:"quad",angles:[{deg:87},{deg:87},{deg:87},{deg:99,label:"x"}],shape:"generic",rotation:6,vertexLabels:["J","K","L","M"]},options:["93°","99°","119°","273°"],correctAnswer:1,answerValue:99,hint1:"Use the angle sum of a quadrilateral, not of a triangle.",hint2:"Add all three of the 87° angles before you subtract.",hint3:"Work out 3 × 87°, then take that away from 360°.",explanation:[{text:"Add the three equal angles.",math:"3 × 87° = 261°",highlight:["87"]},{text:"The four angles of a quadrilateral total 360°, so subtract.",math:["x = 360° − 261°","x = 99°"],highlight:["x"]},{text:"Watch out for two traps: 180° − 87° = 93° uses the wrong total, and 360° − 87° = 273° forgets the other two 87° angles."}]},{id:"s2q24",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"mc",prompt:"Calculate the size of angle AEB, marked x.",given:"ABCD is a square. Triangle BCE is equilateral and is drawn on the outside of the square.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:120,y:0,labelDir:250},{name:"C",x:120,y:120,labelDir:110},{name:"D",x:0,y:120},{name:"E",x:223.923048,y:60}],segments:[{a:"A",b:"B",ticks:1},{a:"B",b:"C",ticks:1},{a:"C",b:"D",ticks:1},{a:"D",b:"A",ticks:1},{a:"B",b:"E",ticks:1},{a:"C",b:"E",ticks:1},{a:"A",b:"E"}],arcs:[{at:"A",from:"B",to:"D",right:!0},{at:"E",from:"B",to:"C"},{at:"E",from:"A",to:"B",label:"x"}]},options:["15°","30°","45°","75°"],correctAnswer:0,answerValue:15,hint1:"Work out the whole angle ABE first, by adding the square corner to the triangle corner.",hint2:"AB and BE are both equal to the side of the square, so triangle ABE is isosceles.",hint3:"Add 90° and 60° to get angle ABE, then share the rest of 180° between the two equal base angles.",explanation:[{text:"At B the square contributes 90° and the equilateral triangle contributes 60°.",math:["angle ABE = 90° + 60°","angle ABE = 150°"],highlight:["60"]},{text:"AB is a side of the square and BE is a side of the equilateral triangle, so AB = BE and triangle ABE is isosceles.",highlight:["x"]},{text:"The two base angles are equal and the triangle totals 180°.",math:["x = (180° − 150°) ÷ 2","x = 15°"],highlight:["x"]}]},{id:"s2q25",set:2,topic:"quadrilateral",skills:["quadrilateral"],difficulty:3,type:"multi",prompt:"Work out the sizes of angles a and b.",given:"The diagonal AC splits quadrilateral ABCD into two triangles.",diagram:{kind:"custom",points:[{name:"A",x:0,y:0},{name:"B",x:170.198383,y:176.245585},{name:"C",x:260,y:0},{name:"D",x:130,y:-101.567132}],segments:[{a:"A",b:"B"},{a:"B",b:"C"},{a:"C",b:"D"},{a:"D",b:"A"},{a:"A",b:"C",dashed:!0,muted:!0}],arcs:[{at:"A",from:"C",to:"B"},{at:"A",from:"D",to:"C"},{at:"B",from:"A",to:"C"},{at:"D",from:"C",to:"A"},{at:"C",from:"B",to:"A",label:"a"},{at:"C",from:"A",to:"D",label:"b"}]},correctAnswer:[63,38],answerLabels:["a","b"],hint1:"Treat the two triangles separately: ABC first, then ACD.",hint2:"In each triangle the three angles total 180°, and you already know two of them.",hint3:"For a work out 180° − 46° − 71°, and for b work out 180° − 38° − 104°.",explanation:[{text:"In triangle ABC the angles at A and B are 46° and 71°, and the three angles total 180°.",math:["a = 180° − 46° − 71°","a = 63°"],highlight:["46","71","a"]},{text:"In triangle ACD the angles at A and D are 38° and 104°.",math:["b = 180° − 38° − 104°","b = 38°"],highlight:["38","104","b"]},{text:"Check with the quadrilateral: angle A = 46° + 38° = 84° and angle C = 63° + 38° = 101°, so the four angles total 360°.",math:"84° + 71° + 101° + 104° = 360°"}]}],tp=[{id:"s3q1",set:3,topic:"intersecting",skills:["intersecting"],difficulty:2,type:"numeric",prompt:"Work out the size of angle x.",given:"AB and CD are straight lines that cross each other.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,0],dir:8,ends:["A","B"]},{id:"cd",through:[0,0],dir:62,ends:["C","D"]}],marks:[{at:["ab","cd"],sector:1,label:null,key:"given"},{at:["ab","cd"],sector:3,label:"x"}]},correctAnswer:126,hint1:"The two marked angles sit on opposite sides of the crossing point.",hint2:"Angles that face each other across a crossing are called vertically opposite angles.",hint3:"Vertically opposite angles are equal, so compare x with the 126° angle directly.",explanation:[{text:"The 126° angle and angle x face each other across the crossing point, so they are vertically opposite.",highlight:["given","x"]},{text:"Vertically opposite angles are always equal, so no calculation is needed.",math:"x = 126°",highlight:["x"]}]},{id:"s3q2",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:2,type:"mc",prompt:"Work out the size of angle y.",given:"PQ and RS are straight lines crossing at one point.",diagram:{kind:"lines",lines:[{id:"pq",through:[0,0],dir:165,ends:["P","Q"]},{id:"rs",through:[0,0],dir:47,ends:["R","S"]}],marks:[{at:["pq","rs"],sector:1,label:null,key:"given"},{at:["pq","rs"],sector:0,label:"y"}]},options:["28°","62°","118°","242°"],correctAnswer:1,answerValue:62,hint1:"Angle y and the 118° angle sit side by side along one of the straight lines.",hint2:"Angles that lie next to each other on a straight line total 180°.",hint3:"Work out 180° − 118°.",explanation:[{text:"Angle y and the 118° angle are next to each other along the straight line PQ.",highlight:["given","y"]},{text:"Adjacent angles on a straight line total 180°.",math:["y = 180° − 118°","y = 62°"],highlight:["y"]},{text:"A common slip is to answer 118°. That would only be right if the two angles were vertically opposite, and here they are side by side."}]},{id:"s3q3",set:3,topic:"straight-line",skills:["straight-line"],difficulty:2,type:"numeric",prompt:"Calculate the size of angle x.",given:"AB is a straight line and two rays are drawn from the point P.",diagram:{kind:"straightLine",angles:[{deg:57},{deg:44,label:"x"},{deg:79}],rotation:-9,endLabels:["A","B"],vertexLabel:"P"},correctAnswer:44,hint1:"All three angles sit above the straight line AB.",hint2:"Angles on a straight line total 180°, so 57°, x and 79° must add to 180°.",hint3:"Add the two angles you know, then take that total away from 180°.",explanation:[{text:"The three angles lie along the straight line AB, so they total 180°.",highlight:["57","79","x"]},{text:"Add the two known angles first.",math:"57° + 79° = 136°",highlight:["57","79"]},{text:"Subtract that total from 180°.",math:["x = 180° − 136°","x = 44°"],highlight:["x"]}]},{id:"s3q4",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:3,type:"numeric",prompt:"Angle x is the largest of the four angles at the crossing. Work out the size of angle x.",given:"JK and LM are straight lines. One of the four angles they make is 39°.",diagram:{kind:"lines",lines:[{id:"jk",through:[0,0],dir:100,ends:["J","K"]},{id:"lm",through:[0,0],dir:139,ends:["L","M"]}],marks:[{at:["jk","lm"],sector:0,label:null,key:"given"},{at:["jk","lm"],sector:3,label:"x"}]},correctAnswer:141,hint1:"Two straight lines crossing make two small angles and two large ones.",hint2:"Each large angle sits next to the 39° angle on a straight line.",hint3:"Work out 180° − 39°.",explanation:[{text:"Where two lines cross there are only two different sizes: the 39° angle appears twice, and the larger angle appears twice.",highlight:["given"]},{text:"Angle x lies next to the 39° angle along the line JK, so the pair totals 180°.",math:["x = 180° − 39°","x = 141°"],highlight:["x"]},{text:"Check: 39° + 141° + 39° + 141° = 360°, a full turn about the crossing point."}]},{id:"s3q5",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:3,type:"multi",prompt:"Work out the sizes of angles a, b and c.",given:"EF and GH are straight lines crossing at one point.",diagram:{kind:"lines",lines:[{id:"ef",through:[0,0],dir:22,ends:["E","F"]},{id:"gh",through:[0,0],dir:105,ends:["G","H"]}],marks:[{at:["ef","gh"],sector:0,label:null,key:"given"},{at:["ef","gh"],sector:1,label:"a"},{at:["ef","gh"],sector:2,label:"b"},{at:["ef","gh"],sector:3,label:"c"}]},answerLabels:["a","b","c"],correctAnswer:[97,83,97],hint1:"Start with the angle that sits next to 83° on a straight line.",hint2:"Angle a is adjacent to 83°, angle b faces 83° across the point, and angle c faces a.",hint3:"Find a from 180° − 83°, then use vertically opposite angles for b and c.",explanation:[{text:"Angle a is next to the 83° angle along the line EF, so the two total 180°.",math:["a = 180° − 83°","a = 97°"],highlight:["given","a"]},{text:"Angle b faces the 83° angle across the crossing point, so they are vertically opposite and equal.",math:"b = 83°",highlight:["b"]},{text:"Angle c faces angle a across the crossing point, so it is vertically opposite a.",math:"c = 97°",highlight:["c"]},{text:"The four angles check out: 83° + 97° + 83° + 97° = 360°."}]},{id:"s3q6",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:3,type:"truefalse",prompt:"True or false: angle p is 48°.",given:"UV and WZ are straight lines crossing at one point.",diagram:{kind:"lines",lines:[{id:"uv",through:[0,0],dir:130,ends:["U","V"]},{id:"wz",through:[0,0],dir:178,ends:["W","Z"]}],marks:[{at:["uv","wz"],sector:0,label:null,key:"given"},{at:["uv","wz"],sector:1,label:"p"}]},options:["True","False"],correctAnswer:1,reasonPrompt:"Which reason explains your answer?",reasonOptions:["The two angles are vertically opposite, so they are equal.","The two angles are next to each other on a straight line, so they total 180°.","The two angles are the only angles at the point, so they total 360°.","The two lines are perpendicular, so every angle at the crossing is 90°."],reasonAnswer:1,hint1:"Look at where the two marked angles sit: do they face each other, or sit side by side?",hint2:"They share a ray and lie on the same straight line, so they are adjacent, not vertically opposite.",hint3:"Adjacent angles on a straight line total 180°, so compare p with 180° − 48°.",explanation:[{text:"Angle p and the 48° angle share the ray towards W, so they are next to each other rather than opposite each other.",highlight:["given","p"]},{text:"Adjacent angles on a straight line total 180°.",math:["p = 180° − 48°","p = 132°"],highlight:["p"]},{text:"So the statement is false. The angle that really is 48° is the one directly facing it across the crossing point."}]},{id:"s3q7",set:3,topic:"intersecting",skills:["intersecting"],difficulty:3,type:"mc",prompt:"Which angle is vertically opposite angle CMB?",given:"AB and CD are straight lines crossing at M.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,0],dir:152,ends:["A","B"]},{id:"cd",through:[0,0],dir:25,ends:["C","D"]}],marks:[{at:["ab","cd"],sector:0,label:null,key:"cmb"}],pointLabels:[{at:["ab","cd"],text:"M"}]},options:["Angle AMB","Angle AMC","Angle AMD","Angle BMD"],correctAnswer:2,hint1:"Angle CMB is made by the ray MC and the ray MB.",hint2:"The vertically opposite angle is made by the two rays pointing the other way: the opposite of MC and the opposite of MB.",hint3:"The opposite of ray MC is ray MD, and the opposite of ray MB is ray MA. Put those two letters together.",explanation:[{text:"Angle CMB is formed by ray MC and ray MB.",highlight:["cmb"]},{text:"Carry each ray straight on through M. Ray MC continues as ray MD, and ray MB continues as ray MA."},{text:"So the angle facing CMB across the point is angle AMD, and the two are equal.",math:"angle AMD = angle CMB = 53°"},{text:"Angles AMC and BMD are next to angle CMB on a straight line, so they are supplementary to it, not equal to it."}]},{id:"s3q8",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:3,type:"numeric",prompt:"Work out the size of angle x.",given:"Three straight lines pass through the same point.",diagram:{kind:"lines",lines:[{id:"p",through:[0,0],dir:20},{id:"q",through:[0,0],dir:105},{id:"r",through:[0,0],dir:141}],marks:[{at:["p","q"],sector:0,label:null,key:"a1"},{at:["q","r"],sector:0,label:null,key:"a2"},{at:["r","p"],sector:0,label:"x"}]},correctAnswer:59,hint1:"The three marked angles all sit on the same side of one of the straight lines.",hint2:"They lie in a row along that line, so together they make a straight angle of 180°.",hint3:"Add 85° and 36°, then subtract the result from 180°.",explanation:[{text:"The angles 85°, 36° and x follow one another round the point from one end of a line to the other, so they make a straight angle.",highlight:["a1","a2","x"]},{text:"Add the two known angles.",math:"85° + 36° = 121°",highlight:["a1","a2"]},{text:"Angles on a straight line total 180°.",math:["x = 180° − 121°","x = 59°"],highlight:["x"]}]},{id:"s3q9",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:3,type:"multi",prompt:"Find the sizes of the three angles marked a, b and c.",given:"Three straight lines meet at a single point.",diagram:{kind:"lines",lines:[{id:"p",through:[0,0],dir:18},{id:"q",through:[0,0],dir:45},{id:"r",through:[0,0],dir:133}],marks:[{at:["p","q"],sector:0,label:null, m one ray and sweeping through w, x, y and z brings you back to where you started.",hint3:"Decide which fact that sweep demonstrates: a full turn, a straight line, or a shape rule.",explanation:[{text:"Begin on one ray and sweep anticlockwise through w, then x, then y, then z.",highlight:["w","x"]},{text:"That sweep returns you to the ray you started from, so the four angles together make one complete turn about the point.",highlight:["y","z"]},{text:"Angles at a point total 360°, which is exactly what the four marked angles must do.",math:"w + x + y + z = 360°"},{text:"The other explanations fail: equal vertically opposite angles say nothing about the total, no quadrilateral is drawn here, and the angles are only 90° each if the lines happen to be perpendicular."}]},{id:"s3q11",set:3,topic:"intersecting",skills:["intersecting","around-point"],difficulty:3,type:"mc",prompt:"Calculate the size of angle x.",given:"Three straight lines pass through one point. Two of them are perpendicular.",diagram:{kind:"lines",lines:[{id:"g",through:[0,0],dir:22},{id:"h",through:[0,0],dir:112},{id:"k",through:[0,0],dir:57}],marks:[{at:["g","k"],sector:0,label:null,key:"g1"},{at:["k","h"],sector:0,label:"x"}],rightAngles:[["h","g"]]},options:["35°","55°","125°","145°"],correctAnswer:1,answerValue:55,hint1:"The small square shows that two of the lines meet at a right angle.",hint2:"The 35° angle and angle x sit side by side inside that right angle.",hint3:"Work out 90° − 35°.",explanation:[{text:"The square marker means the two lines it sits between are perpendicular, so the angle they make is 90°."},{text:"The third line splits that right angle into the 35° angle and angle x.",math:"35° + x = 90°",highlight:["g1","x"]},{text:"Subtract to find x.",math:["x = 90° − 35°","x = 55°"],highlight:["x"]},{text:"Answering 145° would mean subtracting from 180°, but the two angles only fill a right angle here."}]},{id:"s3q12",set:3,topic:"intersecting",skills:["intersecting","straight-line"],diff he point, and those partners sit in the same row as x.",hint3:"Copy 76° and 63° across the point, then work out 180° − (76° + 63°).",explanation:[{text:"Copy each known angle across the crossing point. Vertically opposite angles are equal, so the angle facing 76° is also 76°, and the angle facing 63° is also 63°.",highlight:["g1","g2"]},{text:"Those two copies sit alongside angle x in a row on the other side of the point, and that row lies on a straight line.",math:"x + 76° + 63° = 180°",highlight:["x"]},{text:"Add the two known angles, then subtract from 180°.",math:["x = 180° − 139°","x = 41°"],highlight:["x"]}]},{id:"s3q14",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:3,type:"error",prompt:"What mistake has Ravi made?",given:"EF, GH and JK are straight lines. Ravi wrote: “x = 121°, because vertically opposite angles are equal.”",diagram:{kind:"lines",lines:[{id:"ef",through:[-110,-50],dir:0},{id:"gh",through:[-110,-50],dir:47},{id:"jk",through:[110,-50],dir:121}],marks:[{at:["ef","jk"],sector:0,label:null,key:"g1"},{at:["ef","jk"],sector:1,label:"x"}],pointLabels:[{at:["ef","jk"],text:"Q"}]},options:["The 121° angle and x sit next to each other on the line EF, so they total 180° instead of being equal.","He should have taken 121° away from 360° rather than quoting it.","He measured the angle at the wrong crossing point of the diagram.","Vertically opposite angles are only equal when the two lines are perpendicular."],correctAnswer:0,hint1:"Check whether the two angles really do face each other across the point Q.",hint2:"They share the ray from Q along the line JK, so they are side by side, not opposite.",hint3:"Angles side by side on a straight line total 180°, so calculate 180° − 121°.",explanation:[{text:"At Q the 121° angle and angle x share a ray, so they are adjacent angles, not a vertically opposite pair.",highlight:["g1","x"]},{text:"Adjacent angles on the straight line EF total 180°.",math:["x = 180° − 121°","x = 59°"],hi ces the triangle’s angle at Q across the crossing point, so vertically opposite angles make that angle 28° too.",math:"angle at Q = 28°",highlight:["e2"]},{text:"Angle x is the angle of the triangle at R, and the three angles of a triangle total 180°.",math:["x = 180° − (72° + 28°)","x = 180° − 100°","x = 80°"],highlight:["x"]}]},{id:"s3q23",set:3,topic:"around-point",skills:["around-point","intersecting"],difficulty:3,type:"reasoning",prompt:"Which statement about angle x is correct?",given:"Four rays are drawn from one point. Only one of the four angles is known.",diagram:{kind:"aroundPoint",angles:[{deg:74},{deg:77,label:"x"},{deg:88,label:"p"},{deg:121,label:"q"}],rotation:145},options:["There is not enough information to work out x.","x = 74°, because vertically opposite angles are equal.","x = 106°, because angles on a straight line total 180°.","x = 286°, because angles at a point total 360°."],correctAnswer:0,hint1:"Check whether any of the rays continue straight through the point to form a full line.",hint2:"Without a straight line or a second known angle, x could be many different sizes.",hint3:"Count how many unknown angles share the 360° that is left once 74° is taken away.",explanation:[{text:"None of the rays continue straight through the point, so there is no straight line and no vertically opposite pair to use.",highlight:["74"]},{text:"Angles at a point do total 360°, so x, p and q together must make 286°.",math:"x + p + q = 360° − 74° = 286°",highlight:["x","p","q"]},{text:"That single equation has three unknowns, so x on its own cannot be pinned down. One more measured angle would be enough to make progress."}]},{id:"s3q24",set:3,topic:"intersecting",skills:["intersecting","straight-line"],difficulty:4,type:"mc",prompt:"Find the size of angle x at P.",given:"Three straight lines cross each other at P, Q and R.",diagram:{kind:"lines",lines:[{id:"m1",through:[-70,-55],dir:0},{id:"m2",through:[-70,-55],dir:63},{id:"m3",through:[70,-55],dir:109}],mark eft for the two equal angles.",math:["122° + 100° = 222°","360° − 222° = 138°"],highlight:["122","100"]},{text:"That 138° is shared equally between the two angles marked x, so halve it.",math:["x = 138° ÷ 2","x = 69°"],highlight:["x"]}]}],np=[{id:"s4q1",set:4,topic:"parallel",skills:["parallel"],difficulty:3,type:"numeric",prompt:"Work out the size of angle x.",given:"AB and CD are parallel. The straight line EF crosses both of them.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,85],dir:0,arrows:1,ends:["A","B"]},{id:"cd",through:[0,-75],dir:0,arrows:1,ends:["C","D"]},{id:"ef",through:[0,0],dir:64,ends:["E","F"]}],marks:[{at:["ab","ef"],sector:3,label:null,key:"given"},{at:["cd","ef"],sector:3,label:"x"}]},correctAnswer:116,hint1:"The chevron arrows tell you that AB and CD are parallel.",hint2:"Both marked angles sit below their own line and on the same side of EF, so they are in matching positions.",hint3:"Angles in matching positions at the two crossings are called corresponding angles. Decide whether they are equal or add to 180°.",explanation:[{text:"Angle x and the 116° angle sit in matching positions: each is below its own line and to the right of the transversal EF.",highlight:["given","x"]},{text:"Matching positions at a pair of parallel lines means the angles are corresponding, and corresponding angles are equal.",math:"x = 116°",highlight:["x"]},{text:"Answering 64° would mean treating the pair as co-interior. Co-interior angles both lie between the parallel lines on the same side of the transversal, and these two do not."}]},{id:"s4q2",set:4,topic:"parallel",skills:["parallel"],difficulty:3,type:"mc",prompt:"Calculate the size of angle y.",given:"PQ and RS are parallel straight lines. TU is a transversal.",diagram:{kind:"lines",lines:[{id:"pq",through:[0,80],dir:0,arrows:1,ends:["P","Q"]},{id:"rs",through:[0,-80],dir:0,arrows:1,ends:["R","S"]},{id:"tu",through:[10,0],dir:71,ends:["T","U"]}],marks:[{at:["pq","tu"],sector:2,label:null,key:"given"},{at:["rs","tu"],sector:0,label:"y"}]},options:["19°","71°","109°","161°"],correctAnswer:1,answerValue:71,hint1:"Both marked angles lie in the space between the two parallel lines.",hint2:"They are on opposite sides of the transversal TU, so together they trace a Z shape.",hint3:"Angles in a Z shape between parallel lines are alternate angles. Decide what alternate angles do to each other.",explanation:[{text:"Both marked angles are between the parallel lines, and they lie on opposite sides of the transversal TU. Trace the Z: in along PQ, down TU, then out along RS.",highlight:["given","y"]},{text:"Alternate angles between parallel lines are equal.",math:"y = 71°",highlight:["y"]},{text:"The answer 109° comes from using the co-interior rule by mistake. Co-interior angles sit on the same side of the transversal, and these two do not."}]},{id:"s4q3",set:4,topic:"parallel",skills:["parallel"],difficulty:3,type:"numeric",prompt:"Work out the size of angle c.",given:"GH and JK are parallel. LM is a straight line crossing both of them.",diagram:{kind:"lines",lines:[{id:"gh",through:[0,90],dir:0,arrows:1,ends:["G","H"]},{id:"jk",through:[0,-70],dir:0,arrows:1,ends:["J","K"]},{id:"lm",through:[-15,0],dir:105,ends:["L","M"]}],marks:[{at:["gh","lm"],sector:3,label:null,key:"given"},{at:["jk","lm"],sector:0,label:"c"}]},correctAnswer:105,hint1:"Both marked angles sit between the two parallel lines.",hint2:"This time they are on the same side of the transversal LM, making a C shape.",hint3:"Angles in a C shape between parallel lines are co-interior and total 180°. Work out 180° − 75°.",explanation:[{text:"Angle c and the 75° angle are both between the parallel lines GH and JK, and both lie to the right of the transversal LM.",highlight:["given","c"]},{text:"Angles in that position are co-interior (sometimes called allied), and co-interior angles between parallel lines total 180°.",math:"75° + c = 180°",highlight:["given","c"]},{text:"Subtract to finish.",math:["c = 180° − 75°","c = 105°"],highlight:["c"]}]},{id:"s4q4",set:4,topic:"parallel",skills:["parallel"],difficulty:3,type:"mc",prompt:"Which words describe the pair of angles marked in the diagram?",given:"The two lines carrying chevron arrows are parallel.",diagram:{kind:"lines",lines:[{id:"top",through:[0,82],dir:0,arrows:1,ends:["A","B"]},{id:"bot",through:[0,-78],dir:0,arrows:1,ends:["C","D"]},{id:"tr",through:[0,0],dir:143,ends:["E","F"]}],marks:[{at:["top","tr"],sector:2,label:null,key:"u1"},{at:["bot","tr"],sector:1,label:null,key:"u2"}]},options:["Alternate angles","Co-interior angles","Corresponding angles","Vertically opposite angles"],correctAnswer:1,hint1:"First check whether the two angles are inside the space between the parallel lines or outside it.",hint2:"Then check whether they are on the same side of the transversal or on opposite sides.",hint3:"Both are inside and both are on the same side of EF. Add the two printed values and let the total point you to the name.",explanation:[{text:"Both marked angles lie between the two parallel lines, so they are interior angles.",highlight:["u1","u2"]},{text:"Both also lie on the same side of the transversal EF, tracing a C shape. That makes them co-interior angles.",highlight:["u1","u2"]},{text:"The printed values confirm it, because co-interior angles between parallel lines total 180°.",math:"143° + 37° = 180°"},{text:"Alternate angles would sit on opposite sides of the transversal, corresponding angles would sit in matching positions with one inside the strip and one outside it, and vertically opposite angles would share a single crossing point."}]},{id:"s4q5",set:4,topic:"parallel",skills:["parallel"],difficulty:3,type:"numeric",prompt:"Find the size of angle p.",given:"WX and YZ are parallel. MN crosses both lines.",diagram:{kind:"lines",lines:[{id:"wx",through:[0,88],dir:353,arrows:1,ends:["W","X"]},{id:"yz",through:[0,-72],dir:353,arrows:1,ends:["Y","Z"]},{id:"mn",through:[0,0],dir:110,ends:["M","N"]}],marks:[{at:["yz","mn"],sector:1,label:null,key:"given"},{at:["wx","mn"],sector:3,label:"p"}]},correctAnswer:63,hint1:"The whole diagram is tilted, but the arrows still show that WX and YZ are parallel.",hint2:"Both marked angles lie between the two parallel lines, on opposite sides of MN.",hint3:"That is the Z shape, so the angles are alternate. Decide whether alternate angles are equal or supplementary.",explanation:[{text:"Ignore the tilt and look only at the positions. Both marked angles are inside the strip between WX and YZ.",highlight:["given","p"]},{text:"They lie on opposite sides of the transversal MN, so they are alternate angles.",highlight:["given","p"]},{text:"Alternate angles between parallel lines are equal, so no subtraction is needed.",math:"p = 63°",highlight:["p"]}]},{id:"s4q6",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:4,type:"numeric",prompt:"Work out the size of angle x at the lower crossing.",given:"EF and GH are parallel. RS is a transversal.",diagram:{kind:"lines",lines:[{id:"ef",through:[0,85],dir:0,arrows:1,ends:["E","F"]},{id:"gh",through:[0,-75],dir:0,arrows:1,ends:["G","H"]},{id:"rs",through:[20,0],dir:128,ends:["R","S"]}],marks:[{at:["ef","rs"],sector:0,label:null,key:"given"},{at:["gh","rs"],sector:1,label:"x"}]},correctAnswer:52,hint1:"The 128° angle and angle x are not a matching pair, so you need a stepping stone at the upper crossing first.",hint2:"Above the line EF there is a second angle beside the 128° one; find that angle before travelling down the transversal.",hint3:"Work out 180° − 128° at the upper crossing, then carry that angle down to GH using corresponding angles.",explanation:[{text:"At the upper crossing the 128° angle and the angle beside it lie along the straight line EF, so together they make 180°.",math:["angle above EF, left of RS = 180° − 128°","= 52°"],highlight:["given"]},{text:"That 52° angle is above EF and to the left of the transversal. Angle x is above GH and to the left of the transversal, so the two are in matching positions.",highlight:["x"]},{text:"Corresponding angles at a pair of parallel lines are equal.",math:"x = 52°",highlight:["x"]}]},{id:"s4q7",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:3,type:"mc",prompt:"Calculate the value of y.",given:"JK is parallel to LM. The line NP crosses both of them.",diagram:{kind:"lines",lines:[{id:"jk",through:[0,88],dir:0,arrows:1,ends:["J","K"]},{id:"lm",through:[0,-72],dir:0,arrows:1,ends:["L","M"]},{id:"np",through:[-25,0],dir:34,ends:["N","P"]}],marks:[{at:["jk","np"],sector:1,label:null,key:"given"},{at:["lm","np"],sector:0,label:"y"}]},options:["34°","56°","146°","214°"],correctAnswer:0,answerValue:34,hint1:"Angle y is measured above LM on the right of the transversal; the 146° angle is above JK on the left.",hint2:"Find the angle above JK on the right first — it sits beside 146° on the straight line JK.",hint3:"Work out 180° − 146°, then copy that angle down to LM using corresponding angles.",explanation:[{text:"The 146° angle and the angle to its right lie together on the straight line JK.",math:["angle above JK, right of NP = 180° − 146°","= 34°"],highlight:["given"]},{text:"That angle and angle y are in matching positions — each is above its own line and to the right of the transversal — so they are corresponding angles.",highlight:["y"]},{text:"Corresponding angles between parallel lines are equal.",math:"y = 34°",highlight:["y"]},{text:"Choosing 146° means quoting the given angle as though it were the corresponding one, and 214° comes from subtracting from 360° instead of 180°."}]},{id:"s4q8",set:4,topic:"parallel",skills:["parallel","intersecting"],difficulty:4,type:"numeric",prompt:"Work out the size of angle x, where the two transversals cross each other.",given:"PQ and RS are parallel. The transversals TU and VW cross each other between them.",diagram:{kind:"lines",lines:[{id:"pq",through:[0,100],dir:0,arrows:1,ends:["P","Q"]},{id:"rs",through:[0,-80],dir:0,arrows:1,ends:["R","S"]},{id:"tu",through:[0,0],dir:59,ends:["T","U"]},{id:"vw",through:[0,0],dir:138,ends:["V","W"]}],marks:[{at:["rs","tu"],sector:0,label:null,key:"g1"},{at:["rs","vw"],sector:1,label:null,key:"g2"},{at:["tu","vw"],sector:0,label:"x"}]},correctAnswer:79,hint1:"The two transversals and the line PQ enclose a triangle whose base lies along PQ.",hint2:"Move each angle marked on RS up to PQ using alternate angles, so that both become angles of that triangle.",hint3:"Once the triangle has base angles of 59° and 42°, use 180° − (59° + 42°).",explanation:[{text:"The 59° angle on RS and the angle of the triangle where TU meets PQ are alternate angles between the parallel lines, so that angle of the triangle is 59° as well.",math:"base angle on TU = 59°",highlight:["g1"]},{text:"In the same way the 42° angle on RS is alternate to the angle of the triangle where VW meets PQ.",math:"base angle on VW = 42°",highlight:["g2"]},{text:"Angle x is the third angle of that triangle, and the angles of a triangle total 180°.",math:["x = 180° − (59° + 42°)","x = 180° − 101°","x = 79°"],highlight:["x"]}]},{id:"s4q9",set:4,topic:"parallel",skills:["parallel","straight-line"],difficulty:3,type:"multi",prompt:"Work out the sizes of angles a, b and c.",given:"AB and CD are parallel and EF is a transversal. Only one angle is given.",diagram:{kind:"lines",lines:[{id:"ab",through:[0,80],dir:0,arrows:1,ends:["A","B"]},{id:"cd",through:[0,-80],dir:0,arrows:1,ends:["C","D"]},{id:"ef",through:[-10,0],dir:113,ends:["E","F"]}],marks:[{at:["ab","ef"],sector:2,label:null,key:"given"},{at:["ab","ef"],sector:3,label:"a"},{at:["cd","ef"],sector:0,label:"b"},{at:["cd","ef"],sector:1,label:"c"}]},answerLabels:["a","b","c"],correctAnswer:[67,113,67],hint1:"Deal with the upper crossing first: angle a shares the line AB with the 113° angle.",hint2:"Angle b is between the parallels on the opposite side of EF from 113°; angle c is between the parallels on the same side as 113°.",hint3:"Use 180° − 113° for a, then

:root{--ink:#121A3A;--ink2:#0A1028;--muted:#4F5874;--bg:#F3F4F8;--pink:#FF8FB8;--pinkd:#F0679A;--gold:#F7C548;--line:#D3D8E2;--ok:#17834A;--okbg:#E2F3E8;--no:#C03A2B;--nobg:#FBE4E1;--brand:#FF914D;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 Lexend,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.btn,.title,.pagetitle{font-family:Poppins,system-ui,sans-serif}
button{font:inherit;color:inherit}
.app-head{background:#fff;color:var(--ink);position:sticky;top:0;z-index:20;border-bottom:3px solid var(--ink)}
.head-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brandlogo{height:58px;width:auto;display:block;margin:-4px 0}
.brand{font:600 14px Poppins,sans-serif;letter-spacing:.2px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:2px;background:var(--brand);display:inline-block}
.apptitle{font:700 17px Poppins,sans-serif;margin-left:6px;padding-left:14px;border-left:2px solid var(--line);display:flex;align-items:center;gap:8px}
.apptitle svg{width:34px;height:31px}
.head-sp{flex:1}
#who{font-size:15px;display:flex;align-items:center;gap:7px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-dot{width:10px;height:10px;border-radius:50%;background:var(--pink);flex:none;border:2px solid var(--ink)}
#homeBtn{background:var(--pink);border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:6px 14px;font:600 15px Poppins,sans-serif;cursor:pointer;min-height:40px}
#homeBtn:hover{background:var(--gold)}
.stripe{display:flex;height:6px}.stripe span{flex:1}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:26px 20px 40px}
footer{text-align:center;font-size:14px;color:var(--muted);padding:18px 20px 26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:2px;padding:10px 22px;min-height:52px;font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;transition:transform .12s,background .12s}
.btn:hover{background:var(--ink2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.big{min-height:60px;font-size:18px;padding:12px 26px;background:var(--pink);color:var(--ink)}
.btn.big:hover{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:#FFF7FA;border-color:var(--c,var(--ink));color:var(--c,var(--ink))}
.btn.danger{background:var(--no);border-color:var(--no)}
.link{background:none;border:0;padding:4px 2px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
.link.danger{color:var(--no)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:28px}
/* HOME */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;margin-bottom:26px}
.eyebrow-line{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.eyebrow-line{gap:0!important;font-size:16px;font-weight:600;color:var(--muted)}
.eyebrow-line span+span:before{content:", "}
.title .ifw{background:var(--pink);padding:0 .14em;border:4px solid var(--ink);border-radius:2px;display:inline-block;margin-right:.12em}
.title{font-size:clamp(52px,9vw,92px);line-height:1;margin:10px 0 8px;font-weight:800;letter-spacing:-2px}
.sub{font-size:20px;margin:0 0 18px;color:var(--muted);max-width:30ch}
.hello{font-size:20px;margin:0}
.nameform label{display:block;font-weight:600;margin-bottom:6px}
.nameform input{font:inherit;font-size:19px;padding:10px 14px;border:3px solid var(--ink);border-radius:2px;min-height:52px;width:min(320px,100%);background:#fff}
.heroart{justify-self:end;position:relative;width:100%;max-width:330px}
.heroart .iffy{width:100%;height:auto;display:block}
.heroart .say{position:absolute;right:-6px;top:-8px;background:var(--gold);border:3px solid var(--ink);border-radius:2px;padding:6px 14px;font:700 20px Poppins;}
.heroart .dots{display:flex;gap:10px;justify-content:center;margin-top:6px}
.heroart .dots i{width:40px;height:40px;border-radius:2px;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font:800 17px Poppins;font-style:normal}
.lineart{width:100%;max-width:340px;justify-self:end}
.lineart path{fill:none;stroke-width:9;stroke-linecap:round}
.lineart text{font:800 17px Poppins,sans-serif;fill:var(--ink)}
.lineart .iftxt{font-size:44px;font-weight:800}
.route{position:relative;display:flex;flex-direction:column;gap:16px}
.route:before{content:"";position:absolute;left:31px;top:30px;bottom:30px;width:8px;background:var(--ink);border-radius:2px}
.route{gap:20px}
.stop{position:relative;display:grid;grid-template-columns:70px 1fr auto;gap:18px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:2px;padding:16px 20px 16px 0;margin-left:0}
.stop-node{width:50px;height:50px;border-radius:2px;background:var(--gold);border:4px solid var(--ink);display:grid;place-items:center;font:800 19px Poppins,sans-serif;justify-self:center;position:relative;z-index:1}
.stop h2{margin:0;font-size:24px}
.stop p{margin:2px 0 0;color:var(--muted);font-size:16px}
.stop .prog{color:var(--ink);font-weight:500;font-size:15px;margin-top:4px}
.bar{height:14px;background:#FFE3EE;border:2px solid var(--ink);border-radius:2px;overflow:hidden;margin-top:8px;max-width:340px}
.bar span{display:block;height:100%;background:var(--pink);border-right:2px solid var(--ink)}
.bar span[style="width:0%"]{border:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:24px;font-size:15px}
.lg{display:flex;align-items:center;gap:8px}
.lg i{width:30px;height:30px;border-radius:2px;color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font:800 14px Poppins;font-style:normal}
.resetrow{margin-top:26px;text-align:right}
/* common page */
.crumbs{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:8px;color:var(--muted)}
.crumbs .link{font-size:15px}
.pagetitle{font-size:clamp(32px,5vw,44px);margin:4px 0 6px;line-height:1.1}
.lead{font-size:19px;color:var(--muted);margin:0 0 22px;max-width:62ch}
.kick{margin:0;font:600 15px Poppins,sans-serif;color:var(--muted)}
.chal{font-style:normal;background:#BC2B4B;color:#fff;border-radius:2px;padding:1px 8px;font:600 13px Poppins,sans-serif;vertical-align:2px;margin-left:4px}
.card{background:#fff;border:3px solid var(--ink);border-radius:2px;padding:24px}
/* learn list */
.lessonlist{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.lrow{width:100%;display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--ink);border-radius:2px;padding:14px 18px;cursor:pointer;text-align:left;min-height:72px}
.lrow:hover{background:#FFF7FA;transform:translateY(-2px)}
.lrow{transition:transform .12s}
.lrow .iffy{width:52px;height:48px;flex:none}
.lnum{width:44px;height:44px;flex:none;border-radius:2px;display:grid;place-items:center;font:800 19px Poppins;border:3px solid var(--c)}
.ltext{flex:1;display:flex;flex-direction:column}
.lkick{font-size:14px;color:var(--muted)}
.ltitle{font:700 20px Poppins}
.lstate{font-size:15px;font-weight:500;border:2px solid var(--line);border-radius:2px;padding:3px 12px;white-space:nowrap}
.lstate.done{border-color:var(--ink);color:var(--ink);background:var(--gold)}
/* lesson */
.lesson{background:#fff;border:3px solid var(--ink);border-top:14px solid var(--c);border-radius:2px;padding:26px clamp(18px,4vw,36px) 30px}
.lhead{display:flex;gap:16px;align-items:center}
.lhead h1{margin:0;font-size:clamp(28px,4.4vw,40px);line-height:1.1}
.lhead .iffy{width:86px;height:79px;flex:none}
.badge{flex:none;min-width:62px;height:62px;padding:0 10px;border-radius:2px;color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font:800 26px Poppins}
.badge:not(:empty){font-size:clamp(14px,3vw,26px)}
.use{font-size:20px;margin:18px 0 6px;max-width:64ch}
.block{margin-top:24px}
.block h3,.qc h3{font-size:16px;margin:0 0 10px;color:var(--muted);font-weight:600}
.formula{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-bottom:10px}
.fbk{font:600 clamp(16px,2.4vw,20px) Poppins;padding:12px 18px;border-radius:2px;border:3px solid var(--c)}
.fbk.if{background:var(--tint);color:var(--ink)}
.fbk.res{background:var(--c);color:#fff}
.fcomma{font:800 40px/1 Poppins;color:var(--c);align-self:flex-end;margin:0 -2px}
.fnote{margin:6px 0 0;font-size:17px;color:var(--muted)}
.examples{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.examples li{font-size:20px;padding:10px 16px;border:2px solid var(--ink);border-left:8px solid var(--c);background:#fff;border-radius:2px}
.hl{color:var(--c);font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.tl{width:100%;max-width:640px;display:block}
.tl .ax{font:600 14px Lexend;fill:#566079}
.tl .vt{font:700 17px Poppins}

function mkTest(v, mc, typed, err, tr) {
  const items = [];
  mc.forEach(x => items.push(Object.assign({ kind: 'mc', part: 'A' }, x)));
  typed.forEach(x => items.push(Object.assign({ kind: 'typed', part: 'B' }, x)));
  err.forEach(x => items.push(Object.assign({ kind: 'errorL', part: 'C' }, x)));
  tr.forEach(x => items.push(Object.assign({ kind: 'mc', part: 'D' }, x)));
  items.forEach((x, i) => x.id = v + (i + 1));
  return items;
}

  if (kind === 'possible') return svg(axis + '<path d="M300 70 Q400 10 480 52" fill="none" stroke="' + c + '" stroke-width="5"/><polygon points="472,40 492,56 468,60" fill="' + c + '"/><circle cx="490" cy="70" r="11" fill="#fff" stroke="' + c + '" stroke-width="5"/><text x="400" y="22" text-anchor="middle" class="vt" fill="' + c + '">maybe it will happen</text>') + '<p class="vcap">From now into the future: it can really happen.</p>';
  if (kind === 'imaginary') return svg(axis + '<rect x="250" y="20" width="300" height="70" rx="35" fill="none" stroke="' + c + '" stroke-width="4" stroke-dasharray="12 8"/><text x="400" y="45" text-anchor="middle" class="vt" fill="' + c + '">imaginary world</text><text x="400" y="62" text-anchor="middle" class="vs" fill="' + c + '">not true now</text>') + '<p class="vcap">Now or the future, but only in your imagination.</p>';
  if (kind === 'past') return svg(axis + '<rect x="40" y="20" width="230" height="70" rx="35" fill="none" stroke="' + c + '" stroke-width="4" stroke-dasharray="12 8"/><text x="155" y="45" text-anchor="middle" class="vt" fill="' + c + '">imaginary past</text><text x="155" y="62" text-anchor="middle" class="vs" fill="' + c + '">it didn’t happen</text>') + '<p class="vcap">The past is finished. We imagine a different past.</p>';
  if (kind === 'swap') return '<div class="order">' +
    '<div class="orow"><h4><span>Order 1</span>If clause first: use a comma</h4><div class="oline"><span class="p ifc">If it rains<small>if clause</small></span><span class="cm">,</span><span class="p res">we stay inside.<small>main clause</small></span></div></div>' +
    '<div class="orow"><h4><span>Order 2</span>Main clause first: no comma</h4><div class="oline"><span class="p res">We stay inside<small>main clause</small></span><span class="gap"></span><span class="p ifc">if it rains.<small>if clause</small></span></div></div></div><p class="vcap">Same meaning. Only the order and the comma change.</p>';
  if (kind === 'unless') return '<div class="eq"><span class="eqb u">unless</span><span class="eqs">=</span><span class="eqb">if</span><span class="eqs">+</span><span class="eqb">not</span></div><p class="vcap">Unless you hurry … = If you don’t hurry …</p>';
  if (kind === 'question') return '<div class="qa"><div class="qline"><span class="ql">Q</span><span>What would you do if you won a prize?</span></div><div class="qline a"><span class="ql">A</span><span>I would share it with my friends.</span></div></div><p class="vcap">Would in the question, would in the answer.</p>';
  return '';
}

/* ---------- RUNNER (quick checks + practice + test retry) ---------- */
function startRunner(cfg) {
  R = Object.assign({ idx: 0, results: [], answered: false }, cfg);
  if (R.mode === 'check') drawCheck(); else drawQ();
}
function drawCheck() {
  const box = $(R.box); if (!box) return;
  if (R.idx >= R.items.length) {
    const ok = R.results.filter(x => x.ok).length;
    const l = LESSONS[R.lessonIdx];
    S.lessons[l.id] = true; save();
    confetti(40);
    box.innerHTML = '<div class="qcdone pop">' + iffy(ok === R.items.length ? 'wow' : 'happy') + '<p><b>' + ok + ' / ' + R.items.length + '</b> correct. Lesson complete ✓</p><button class="btn ghost" data-act="redoCheck">Try the quick check again</button></div>';
    return;
  }
  const it = R.items[R.idx];
  box.innerHTML = '<p class="qcount">Question ' + (R.idx + 1) + ' of ' + R.items.length + '</p>' + qBody(it) + '<div id="fb"></div>';
}
function setById(id) { return SETS.find(s => s.id === id); }
function drawQ() {
  const box = main().querySelector('#qArea'); if (!box) return;
  const it = R.items[R.idx];
  const segs = R.flat.map((r, i) => '<span class="seg ' + (r === true ? 'ok' : r === false ? 'no' : '') + (i === R.pos ? ' cur' : '') + '"></span>').join('');
  $('#segs').innerHTML = segs;
  $('#qnum').textContent = 'Question ' + Math.min(R.pos + 1, R.flat.length) + ' of ' + R.flat.length;
  box.innerHTML = qBody(it) + '<div id="fb"></div>';
  const inp = box.querySelector('input.typed,textarea.typed'); if (inp && !isTouch()) inp.focus();
}
function isTouch() { return window.matchMedia && window.matchMedia('(pointer:coarse)').matches; }

function qBody(it) {
  switch (it.kind) {
    case 'type':
      return '<p class="q">' + esc(it.q) + '</p><div class="typegrid">' + ['zero', 'first', 'second', 'third'].map(t => '<button class="opt topt" data-act="pickType" data-arg="' + t + '" style="--c:' + TYPES[t].color + '"><span class="tnum" style="background:' + TYPES[t].color + '">' + TYPES[t].num + '</span>' + TYPES[t].short + '</button>').join('') + '</div>';
    case 'mc':
      return (it.part ? '' : '') + '<p class="q">' + fmt(it.q) + '</p><div class="opts">' + it.opts.map((o, i) => '<button class="opt" data-act="pickMC" data-arg="' + i + '"><span class="ol">' + L(i) + '</span><span class="ot">' + esc(o) + '</span></button>').join('') + '</div>';
    case 'typed':
      return '<form class="typedform" data-form="typed"><p class="q">' + typedSentence(it) + '</p><div class="row"><button class="btn" type="submit">Check answer</button></div></form>';
    case 'rewrite':
      return '<form class="typedform" data-form="typed"><p class="q src">' + esc(it.q) + (it.challenge ? ' <em class="chal">Challenge</em>' : '') + '</p><label class="startlbl" for="rw">Start with: <b>' + it.start + '</b></label><textarea id="rw" class="typed rw" rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="false">' + '</textarea><div class="row"><button class="btn" type="submit">Check answer</button></div></form>';
    case 'error': case 'errorL':
      return '<p class="q errq">' + parseErr(it.s).map(p => p.idx === undefined ? esc(p.text) : '<button class="ul" data-act="pickErr" data-arg="' + p.idx + '"><span class="ulx">' + esc(p.text) + '</span><sub>' + L(p.idx) + '</sub></button>').join('') + '</p><p class="hint">' + (it.kind === 'error' ? 'Step 1: Tap the part with the mistake.' : 'Tap the wrong part.') + '</p><div id="fixArea"></div>';
    case 'match': return matchHTML(it);
  }
}
function typedSentence(it) {
  const m = it.q.match(/^(.*?)___\s*\(([^)]+)\)(.*)$/);
  return esc(m[1]) + '<input class="typed inl" aria-label="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false"> <span class="hintw">(' + esc(m[2]) + ')</span>' + esc(m[3]);
}

/* match boards */
function matchHTML(it) {
  if (!it._order) { it._order = shuffle(it.pairs.map((_, i) => i), rng(hash(JSON.stringify(it.pairs) + 'r'))); }
  const st = it._st || (it._st = { sel: null, done: {}, miss: {} });
  return '<p class="hint">Tap an if clause on the left, then tap its result on the right.</p><div class="match"><div class="mcol">' +
    it.pairs.map((p, i) => '<button class="mi left ' + (st.done[i] ? 'locked' : '') + (st.sel === i ? ' sel' : '') + '" data-act="mLeft" data-arg="' + i + '" ' + (st.done[i] ? 'disabled style="--c:' + TYPES[p[2]].color + '"' : '') + '>' + esc(p[0]) + '</button>').join('') +
    '</div><div class="mcol">' + it._order.map(i => { const p = it.pairs[i]; return '<button class="mi right ' + (st.done[i] ? 'locked' : '') + '" data-act="mRight" data-arg="' + i + '" ' + (st.done[i] ? 'disabled style="--c:' + TYPES[p[2]].color + '"' : '') + '>' + esc(p[1]) + '</button>'; }).join('') + '</div></div>';
}

const PRAISE = ['Correct! Nice work.', 'Yes, that’s right!', 'Exactly right.', 'Great, you got it!', 'Correct. Well done!'];
const OOPS = ['Not quite. Here’s why:', 'Almost. Look at this:', 'Not this time. Check the rule:'];
function fbHTML(ok, it, correctText, extra) {
  const T = TYPES[it.t || 'mixed'];
  const k = (R.pos || 0) + R.idx;
  const msg = ok ? PRAISE[k % PRAISE.length] : OOPS[k % OOPS.length];
  const last = R.mode === 'check' ? R.idx >= R.items.length - 1 : R.pos >= R.flat.length - 1;
  return '<div class="fb pop ' + (ok ? 'good' : 'bad') + '" style="--c:' + T.color + ';--tint:' + T.tint + '" role="status"><div class="fbface">' + iffy(ok ? 'happy' : 'oops', ok ? '#FF8FB8' : '#F7C548') + '</div>' +
    '<p class="fbh"><span class="mark ' + (ok ? 'yes' : 'no') + '">' + (ok ? '✓' : '✗') + '</span>' + msg + '</p>' +
    (!ok && correctText ? '<p class="fbc">Answer: <b>' + esc(correctText) + '</b></p>' : '') +
    (extra ? '<p class="fbn">' + esc(extra) + '</p>' : '') +
    '<p class="fbx"><span class="tpill" style="background:' + T.color + '">' + T.short + '</span>' + esc(it.ex) + '</p>' +
    '<button class="btn" data-act="nextQ" id="nextBtn">' + (last ? (R.mode === 'check' ? 'Finish quick check' : 'See my score') : 'Next →') + '</button></div>';
}
function showFB(html) { const f = $('#fb'); f.innerHTML = html; const b = $('#nextBtn'); if (b) b.focus({ preventScroll: true }); f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
function record(ok) {
  const it = R.items[R.idx];
  R.results.push({ id: it.id, ok, item: it });
  if (R.flat) { R.flat[R.pos] = ok; R.pos++; const s = $('#segs'); if (s) s.children[R.pos - 1].className = 'seg ' + (ok ? 'ok' : 'no'); }
  R.answered = true;
}
function lockOpts() { main().querySelectorAll('.opt,.ul').forEach(b => b.disabled = true); }

/* ---------- PRACTICE MAP ---------- */
function practice() {
  return crumbs('Practice') + '<h1 class="pagetitle">Practice</h1><p class="lead">6 sets of 10 questions. You get feedback after every answer. Score 9 or 10 to earn 3 stars.</p>' +
    '<div class="setgrid">' + SETS.map((s, i) => {
      const r = S.sets[s.id];
      return '<button class="setcard" data-act="openSet" data-arg="' + s.id + '"><span class="setn">Set ' + (i + 1) + '</span><span class="sett">' + s.title + '</span><span class="setd">' + s.desc + '</span><span class="setf">' + starRow(starsOf(s.id)) + '<span class="setb">' + (r ? 'Best: ' + r.best + ' / 10' : 'Not started') + '</span></span></button>';
    }).join('') + '</div>';
}
function flatCount(items) { return items.reduce((a, it) => a + (it.kind === 'match' ? it.pairs.length : 1), 0); }
function runSet() {
  const s = setById(view.id);
  return crumbs('Practice', 'practice') + '<section class="runner"><div class="rtop"><div><p class="kick">' + (view.retry ? 'Retry wrong answers' : 'Set ' + (SETS.indexOf(s) + 1)) + '</p><h1 class="rtitle">' + s.title + '</h1><p class="rdesc">' + s.desc + '</p></div><p class="qnum" id="qnum"></p></div>' +
    '<div class="segs" id="segs"></div><div class="card qcard" id="qArea"></div></section>';
}
function openSet(id, retryItems) {
  const s = setById(id);
  const items = (retryItems || s.items).map(it => Object.assign({ kind: s.kind }, it, { _st: null }));
  view = { name: 'set', id, retry: !!retryItems }; render();
  startRunner({ mode: retryItems ? 'retry' : 'practice', setId: id, items, flat: new Array(flatCount(items)).fill(null), pos: 0 });
  window.scrollTo(0, 0);
}
function setDone() {
  const s = setById(view.id), r = view.res;
  const score = r.filter(x => x.ok).length, total = r.length;
  if (score / total >= 0.7) afterFns.push(() => confetti());
  const wrong = r.filter(x => !x.ok);
  let h = crumbs('Practice', 'practice') + '<section class="donebox"><p class="kick">' + (view.retry ? 'Retry finished' : 'Set complete') + '</p><h1 class="pagetitle">' + s.title + '</h1>' +
    '<div class="scorerow"><div><p class="bigscore"><b>' + score + '</b><span>/ ' + total + '</span></p>' + (view.retry ? '' : starRow(starsFor(score, total), 40)) + '</div>' + iffy(score / total >= 0.9 ? 'wow' : score / total >= 0.6 ? 'happy' : 'think') + '</div>' +
    '<p class="lead">' + (score === total ? 'Perfect! Every answer is correct.' : score / total >= 0.7 ? 'Good work. Look at the ones you missed, then try them again.' : 'Keep going. Read the lesson again, then retry the ones you missed.') + '</p>';
  if (wrong.length) h += '<h3 class="mt">Review what you missed</h3><ul class="misslist">' + wrong.map(w => '<li style="--c:' + TYPES[w.item.t || 'mixed'].color + '"><span class="tpill" style="background:' + TYPES[w.item.t || 'mixed'].color + '">' + TYPES[w.item.t || 'mixed'].short + '</span>' + esc(w.label || w.item.q || w.item.full || '') + '<br><span class="fix">' + esc(w.answer || '') + '</span></li>').join('') + '</ul>';
  h += '<div class="btnrow">' + (wrong.length ? '<button class="btn" data-act="retrySet">Retry wrong answers (' + wrong.length + ')</button>' : '') +
    '<button class="btn ghost" data-act="openSet" data-arg="' + s.id + '">Do the whole set again</button><button class="btn ghost" data-act="practice">All sets</button></div></section>';
  return h;
}
function finishRunner() {
  if (R.mode === 'check') { R.idx++; drawCheck(); return; }
  if (R.mode === 'testretry') { go('testDone', { v: R.v, retryRes: R.results }); return; }
  const res = R.results;
  if (R.mode === 'practice') {
    const score = res.filter(x => x.ok).length;
    const prev = S.sets[R.setId] || { best: 0, stars: 0 };
    S.sets[R.setId] = { best: Math.max(prev.best, score), stars: Math.max(prev.stars, starsFor(score, res.length)) };
    save();
  }
  go('setDone', { id: R.setId, res, retry: R.mode === 'retry' });
}
function nextQ() {
  R.answered = false;
  R.idx++;
  if (R.mode === 'check') { drawCheck(); return; }
  if (R.idx >= R.items.length) finishRunner(); else drawQ();
}

/* ---------- answer handlers ---------- */
function correctLabel(it) {
  if (it.kind === 'mc') return it.opts[it.ci];
  if (it.kind === 'type') return TYPES[it.t].name;
  if (it.kind === 'typed') return it.ans[0].replace(/^(I|they) would have/, '$1 would have').replace('does not', 'doesn’t');
  if (it.kind === 'rewrite') return it.ans[0];
  return it.full;
}
function pickMC(i) {
  if (R.answered) return; const it = R.items[R.idx]; const ok = i === it.ci;
  const bs = main().querySelectorAll('#' + (R.mode === 'check' ? 'qcBox' : 'qArea') + ' .opt');
  bs[it.ci].classList.add('right'); if (!ok) bs[i].classList.add('wrong'); lockOpts();
  record(ok); lastLabel(it, it.opts[i]);
  showFB(fbHTML(ok, it, it.opts[it.ci]));
  if (R.mode === 'check' && R.idx >= R.items.length - 1) { /* mark done on last */ }
}
function lastLabel(it, given) { const r = R.results[R.results.length - 1]; r.label = it.q || it.s.replace(/[{}]/g, ''); r.answer = 'Answer: ' + correctLabel(it); r.given = given; }
function pickType(t) {
  if (R.answered) return; const it = R.items[R.idx]; const ok = t === it.t;
  main().querySelectorAll('.topt').forEach(b => { if (b.dataset.arg === it.t) b.classList.add('right'); if (b.dataset.arg === t && !ok) b.classList.add('wrong'); b.disabled = true; });
  record(ok); lastLabel(it, t);
  showFB(fbHTML(ok, it, TYPES[it.t].name));
}
function submitTyped() {
  if (R.answered) return; const it = R.items[R.idx];
  const inp = main().querySelector('#qArea .typed'); const val = inp.value;
  const r = checkTyped(val, it);
  if (r.empty) { inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 400); inp.focus(); return; }
  inp.readOnly = true; inp.classList.add(r.ok ? 'right' : 'wrong');
  main().querySelector('#qArea button[type=submit]').disabled = true;
  record(r.ok); lastLabel(it, val);
  let note = r.note || '';
  if (it.kind === 'rewrite' && r.ok) note = (note ? note + ' ' : '') + commaNote(val);
  showFB(fbHTML(r.ok, it, correctLabel(it), note));
}
function pickErr(k) {
  if (R.answered) return; const it = R.items[R.idx];
  const uls = main().querySelectorAll('#qArea .ul');
  if (it.kind === 'error' && it._step === 2) return;
  const ok = k === it.w;
  if (!ok || it.kind === 'errorL') {
    uls.forEach(u => u.disabled = true); uls[it.w].classList.add('right'); if (!ok) uls[k].classList.add('wrong');
    record(ok); lastLabel(it, L(k));
    showFB(fbHTML(ok, it, 'Part ' + L(it.w) + '. ' + it.full));
    return;
  }
  it._step = 2; uls.forEach(u => u.disabled = true); uls[k].classList.add('picked');
  main().querySelector('#qArea .hint').textContent = 'Good! Step 2: Choose the correction for part ' + L(k) + '.';
  $('#fixArea').innerHTML = '<div class="opts">' + it.fix.opts.map((o, i) => '<button class="opt" data-act="pickFix" data-arg="' + i + '"><span class="ol">' + L(i) + '</span><span class="ot">' + esc(o) + '</span></button>').join('') + '</div>';
}
function pickFix(i) {
  if (R.answered) return; const it = R.items[R.idx]; const ok = i === it.fix.ci;
  const bs = main().querySelectorAll('#fixArea .opt'); bs[it.fix.ci].classList.add('right'); if (!ok) bs[i].classList.add('wrong'); bs.forEach(b => b.disabled = true);
  main().querySelectorAll('#qArea .ul')[it.w].classList.add('right');
  record(ok); lastLabel(it, it.fix.opts[i]);
  showFB(fbHTML(ok, it, it.full));
}
function mLeft(i) { const it = R.items[R.idx]; if (it._st.done[i]) return; it._st.sel = it._st.sel === i ? null : i; redrawMatch(); }
function mRight(j) {
  const it = R.items[R.idx], st = it._st; if (st.sel === null || st.done[j]) { flashHint(); return; }
  const i = st.sel, p = it.pairs[i];
  if (i === j) {
    st.done[i] = true; st.sel = null;
    const ok = !st.miss[i];
    R.results.push({ id: it.id + '|' + p[0], ok, item: { t: p[2], ex: p[3], q: p[0] + ' ' + p[1] }, label: p[0] + ' …', answer: 'Answer: ' + p[0] + ' ' + p[1] });
    R.flat[R.pos] = ok; R.pos++;
    redrawMatch(); segsRefresh();
    const allDone = it.pairs.every((_, k) => st.done[k]);
    const T = TYPES[p[2]];
    const lastBoard = R.idx >= R.items.length - 1;
    $('#fb').innerHTML = '<div class="fb ' + (ok ? 'good' : 'bad') + '" style="--c:' + T.color + ';--tint:' + T.tint + '" role="status"><p class="fbh"><span class="mark ' + (ok ? 'yes' : 'no') + '">' + (ok ? '✓' : '✗') + '</span>' + (ok ? 'Match!' : 'Matched on the second try.') + '</p><p class="fbx"><span class="tpill" style="background:' + T.color + '">' + T.short + '</span>' + esc(p[0] + ' ' + p[1]) + ' ' + esc(p[3]) + '</p>' + (allDone ? '<button class="btn" data-act="nextQ" id="nextBtn">' + (lastBoard ? 'See my score' : 'Next board →') + '</button>' : '') + '</div>';
    if (allDone) { R.answered = true; $('#nextBtn').focus({ preventScroll: true }); }
  } else {
    st.miss[i] = true; st.sel = null; redrawMatch();
    const T = TYPES[p[2]];
    $('#fb').innerHTML = '<div class="fb bad" style="--c:' + T.color + ';--tint:' + T.tint + '" role="status"><p class="fbh"><span class="mark no">✗</span>Not a match. Try again.</p><p class="fbx"><span class="tpill" style="background:' + T.color + '">' + T.short + '</span>“' + esc(p[0]) + '” needs a result for: ' + esc(T.pattern) + '.</p></div>';
    const btn = main().querySelector('.mi.right[data-arg="' + j + '"]'); if (btn) { btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 400); }
  }
}
function flashHint() { const h = main().querySelector('#qArea .hint'); if (h) { h.classList.add('flash'); setTimeout(() => h.classList.remove('flash'), 600); } }
function redrawMatch() { const it = R.items[R.idx]; const area = main().querySelector('#qArea'); const fb = $('#fb').innerHTML; area.innerHTML = matchHTML(it) + '<div id="fb">' + fb + '</div>'; }
function segsRefresh() { const s = $('#segs'); if (!s) return; s.innerHTML = R.flat.map((r, i) => '<span class="seg ' + (r === true ? 'ok' : r === false ? 'no' : '') + (i === R.pos ? ' cur' : '') + '"></span>').join(''); $('#qnum').textContent = 'Question ' + Math.min(R.pos + 1, R.flat.length) + ' of ' + R.flat.length; }

/* ---------- TESTS ---------- */
function testIntro() {
  return crumbs('Test') + '<h1 class="pagetitle">Exam-Style Test</h1><p class="lead">30 questions in 4 parts, like a Grade 7 entrance exam. No feedback until the end. You will see your score, the answers with explanations, and which conditional to review.</p>' +
    '<div class="testgrid">' + ['A', 'B'].map(v => { const r = S.tests[v]; return '<div class="testcard"><h2>Test ' + v + '</h2><ul class="tparts"><li>Part A: 12 multiple choice</li><li>Part B: 8 fill in the verb</li><li>Part C: 5 find the error</li><li>Part D: 5 same meaning</li></ul><p class="tbest">' + (r ? 'Best score: <b>' + r.best + ' / 30</b>' : 'Not taken yet') + '</p><div class="btnrow"><button class="btn big" data-act="startTest" data-arg="' + v + '">Start Test ' + v + '</button>' + (r && r.last ? '<button class="btn ghost" data-act="lastResult" data-arg="' + v + '">Last result</button>' : '') + '</div></div>'; }).join('') + '</div>' +
    '<div class="timerset"><label class="switch"><input type="checkbox" id="timerToggle" ' + (S.timer ? 'checked' : '') + ' data-change="timer"><span class="slider"></span></label><label for="timerToggle"><b>30-minute timer</b> ' + (S.timer ? 'is on' : 'is off') + '</label></div>';
}
function startTest(v) {
  TT = { v, items: TESTS[v], ans: {}, idx: 0, left: TEST_SECONDS, timer: S.timer, start: Date.now() };
  go('test');
  if (TT.timer) startClock();
}
function startClock() {
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => { TT.left--; drawClock(); if (TT.left <= 0) { clearInterval(timerId); timerId = null; submitTest(true); } }, 1000);
}
function clockText() { const m = Math.floor(TT.left / 60), s = TT.left % 60; return m + ':' + String(s).padStart(2, '0'); }
function drawClock() { const c = $('#clock'); if (c) { c.textContent = TT.timer ? clockText() : 'Timer off'; c.classList.toggle('low', TT.timer && TT.left <= 300); } }
function testView() {
  const it = TT.items[TT.idx];
  const answered = Object.keys(TT.ans).length;
  let h = '<section class="testrun"><div class="tbar"><div><p class="kick">Test ' + TT.v + '</p><p class="tq">Question ' + (TT.idx + 1) + ' of 30</p></div>' +
    '<div class="tclock"><span id="clock" class="clock" aria-live="off"></span><button class="link" data-act="toggleClock">' + (TT.timer ? 'Turn timer off' : 'Turn timer on') + '</button></div></div>' +
    '<div class="nav30" aria-label="Question map">' + TT.items.map((x, i) => '<button class="n ' + (TT.ans[x.id] !== undefined && TT.ans[x.id] !== '' ? 'filled' : '') + (i === TT.idx ? ' cur' : '') + '" data-act="jump" data-arg="' + i + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + '</button>').join('') + '</div>' +
    '<div class="card qcard"><p class="part">' + PARTS[it.part] + '</p><p class="tqn">' + (TT.idx + 1) + '.</p>' + testQ(it) + '</div>' +
    '<nav class="pager"><button class="btn ghost" data-act="tPrev" ' + (TT.idx === 0 ? 'disabled' : '') + '>← Back</button>' +
    (TT.idx < 29 ? '<button class="btn" data-act="tNext">Next →</button>' : '<button class="btn" data-act="askSubmit">Finish test</button>') + '</nav>' +
    '<p class="tfoot">' + answered + ' of 30 answered. <button class="link" data-act="askSubmit">Finish and see my score</button></p></section>';
  afterFns.push(drawClock);
  afterFns.push(() => { const inp = main().querySelector('.typed'); if (inp) { inp.value = TT.ans[it.id] || ''; inp.addEventListener('input', () => { TT.ans[it.id] = inp.value; markNav(); }); } });
  return h;
}
function markNav() { const it = TT.items[TT.idx]; const b = main().querySelectorAll('.nav30 .n')[TT.idx]; if (b) b.classList.toggle('filled', !!(TT.ans[it.id] !== undefined && TT.ans[it.id] !== '')); const f = main().querySelector('.tfoot'); if (f) f.firstChild.textContent = Object.values(TT.ans).filter(x => x !== '').length + ' of 30 answered. '; }
function testQ(it) {
  const a = TT.ans[it.id];
  if (it.kind === 'mc') return '<p class="q">' + fmt(it.q) + '</p><div class="opts">' + it.opts.map((o, i) => '<button class="opt ' + (a === i ? 'chosen' : '') + '" data-act="tPick" data-arg="' + i + '" aria-pressed="' + (a === i) + '"><span class="ol">' + L(i) + '</span><span class="ot">' + esc(o) + '</span></button>').join('') + '</div>';
  if (it.kind === 'typed') return '<form data-form="tTyped"><p class="q">' + typedSentence(it) + '</p></form><p class="hint">Your answer saves as you type. You can use short forms like I’ll.</p>';
  if (it.kind === 'errorL') return '<p class="q errq">' + parseErr(it.s).map(p => p.idx === undefined ? esc(p.text) : '<button class="ul ' + (a === p.idx ? 'chosen' : '') + '" data-act="tPick" data-arg="' + p.idx + '" aria-pressed="' + (a === p.idx) + '"><span class="ulx">' + esc(p.text) + '</span><sub>' + L(p.idx) + '</sub></button>').join('') + '</p>';
}
function gradeTest(v, ans) {
  const items = TESTS[v]; const per = {}; let score = 0;
  const rows = items.map(it => {
    const a = ans[it.id]; let ok = false, note = '';
    if (it.kind === 'mc') ok = a === it.ci;
    else if (it.kind === 'errorL') ok = a === it.w;
    else { const r = checkTyped(a || '', it); ok = !!r.ok; note = r.note || ''; }
    per[it.t] = per[it.t] || { ok: 0, n: 0 }; per[it.t].n++; if (ok) { per[it.t].ok++; score++; }
    return { id: it.id, ok, note };
  });
  return { score, per, rows };
}
function submitTest(auto) {
  if (timerId) { clearInterval(timerId); timerId = null; }
  const g = gradeTest(TT.v, TT.ans);
  const prev = S.tests[TT.v];
  S.tests[TT.v] = { best: Math.max(prev ? prev.best : 0, g.score), last: { ans: TT.ans, score: g.score, date: new Date().toISOString(), time: Math.round((Date.now() - TT.start) / 1000), auto: !!auto } };
  save();
  go('testDone', { v: TT.v, auto });
}
function testDone() {
  const v = view.v, rec = S.tests[v].last, g = gradeTest(v, rec.ans);
  const pct = Math.round(g.score / 30 * 100);
  if (pct >= 80 && !view.retryRes) afterFns.push(() => confetti(90));
  const d = new Date(rec.date);
  const order = ['zero', 'first', 'second', 'third', 'mixed'];
  const weak = order.filter(t => g.per[t] && g.per[t].ok / g.per[t].n < 0.8);
  const lessonFor = { zero: 1, first: 2, second: 3, third: 5, mixed: 6 };
  let h = crumbs('Test', 'tests') + '<section class="report"><div class="rephead"><div><p class="kick">Test ' + v + ' result' + (view.auto ? ' (time is up)' : '') + '</p><h1 class="pagetitle">' + (S.name ? esc(S.name) + '’s score' : 'Your score') + '</h1><p class="meta">' + d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) + (rec.time ? '. Time used: ' + Math.floor(rec.time / 60) + ' min ' + (rec.time % 60) + ' s' : '') + '</p></div>' +
    '<div class="scorerow"><p class="bigscore"><b>' + g.score + '</b><span>/ 30</span><em>' + pct + '%</em></p>' + iffy(pct >= 80 ? 'wow' : pct >= 50 ? 'happy' : 'think') + '</div></div>' +
    '<h3>Score by type</h3><div class="breakdown">' + order.filter(t => g.per[t]).map(t => { const p = g.per[t], f = p.ok / p.n; return '<div class="brow"><span class="bname"><i style="background:' + TYPES[t].color + '">' + TYPES[t].num + '</i>' + TYPES[t].name + '</span><span class="bbar"><span style="width:' + Math.round(f * 100) + '%;background:' + TYPES[t].color + '"></span></span><span class="bnum">' + p.ok + ' / ' + p.n + '</span></div>'; }).join('') + '</div>' +
    '<div class="advice">' + (weak.length ? '<p><b>Review next:</b></p><div class="btnrow">' + weak.map(t => '<button class="btn ghost" style="--c:' + TYPES[t].color + '" data-act="lesson" data-arg="' + lessonFor[t] + '">' + TYPES[t].name + ' lesson</button>').join('') + '</div>' : '<p><b>Excellent!</b> You scored 80% or more in every type. You are ready for the exam.</p>') + '</div>';
  if (view.retryRes) { const ok = view.retryRes.filter(x => x.ok).length; h += '<p class="retrynote">Retry practice: <b>' + ok + ' / ' + view.retryRes.length + '</b> correct this time.</p>'; }
  const wrongN = g.rows.filter(r => !r.ok).length;
  h += '<div class="btnrow">' + '<button class="btn" data-act="review" data-arg="' + v + '">See all answers</button>' + (wrongN ? '<button class="btn ghost" data-act="retryTest" data-arg="' + v + '">Retry wrong answers (' + wrongN + ')</button>' : '') + '<button class="btn ghost" data-act="tests">Back to tests</button></div></section>';
  return h;
}
function review() {
  const v = view.v, rec = S.tests[v].last, g = gradeTest(v, rec.ans);
  let part = '';
  let h = crumbs('Test', 'tests') + '<h1 class="pagetitle">Test ' + v + ': Answers</h1><p class="lead">' + g.score + ' / 30 correct. Each answer has a short explanation.</p><ol class="revlist">';
  TESTS[v].forEach((it, i) => {
    if (it.part !== part) { part = it.part; h += '<li class="revpart">' + PARTS[part] + '</li>'; }
    const row = g.rows[i], a = rec.ans[it.id], T = TYPES[it.t];
    let q, yours, right;
    if (it.kind === 'mc') { q = fmt(it.q); yours = a === undefined ? '(no answer)' : L(a) + '. ' + it.opts[a]; right = L(it.ci) + '. ' + it.opts[it.ci]; }
    else if (it.kind === 'errorL') { const ps = parseErr(it.s); q = ps.map(p => p.idx === undefined ? esc(p.text) : '<u>' + esc(p.text) + '</u><sub>' + L(p.idx) + '</sub>').join(''); yours = a === undefined ? '(no answer)' : 'Part ' + L(a); right = 'Part ' + L(it.w) + '. ' + it.full; }
    else { q = fmt(it.q); yours = a ? a : '(no answer)'; right = correctLabel(it) + (/would have|will/.test(it.ans[0]) && /^(I|they) /.test(it.ans[0]) ? '  (or ' + it.ans[0].replace(/^I will/, 'I’ll').replace(/^I would/, 'I’d').replace(/^they would/, 'they’d') + ')' : ''); }
    h += '<li class="rev ' + (row.ok ? 'ok' : 'no') + '" style="--c:' + T.color + '"><div class="revq"><span class="revn">' + (i + 1) + '</span><span>' + q + '</span></div>' +
      '<p class="revy"><span class="mark ' + (row.ok ? 'yes' : 'no') + '">' + (row.ok ? '✓' : '✗') + '</span>Your answer: ' + esc(yours) + '</p>' +
      (row.ok ? '' : '<p class="revr">Correct answer: <b>' + esc(right) + '</b></p>') + (row.note ? '<p class="revnote">' + esc(row.note) + '</p>' : '') +
      '<p class="revx"><span class="tpill" style="background:' + T.color + '">' + T.short + '</span>' + esc(it.ex) + '</p></li>';
  });
  return h + '</ol><div class="btnrow"><button class="btn" data-act="lastResult" data-arg="' + v + '">Back to score</button><button class="btn ghost" data-act="tests">All tests</button></div>';
}
function retryTest(v) {
  const rec = S.tests[v].last, g = gradeTest(v, rec.ans);
  const items = TESTS[v].filter((it, i) => !g.rows[i].ok).map(it => Object.assign({}, it));
  view = { name: 'set', id: 's1', retry: true }; render();
  main().querySelector('.rtitle').textContent = 'Test ' + v + ': Retry Wrong Answers';
  main().querySelector('.rdesc').textContent = 'Practice mode: you get feedback after each answer.';
  main().querySelector('.kick').textContent = 'Retry';
  startRunner({ mode: 'testretry', v, items, flat: new Array(items.length).fill(null), pos: 0 });
  window.scrollTo(0, 0);
}

/* ---------- modal ---------- */
function modal(html) { const m = $('#modal'); m.innerHTML = '<div class="mbox" role="dialog" aria-modal="true">' + html + '</div>'; m.hidden = false; const b = m.querySelector('button'); if (b) b.focus(); }
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }

/* ---------- events ---------- */
const ACT = {
  home: () => { if (view.name === 'test') { modal('<h2>Leave the test?</h2><p>Your answers for this test will not be saved.</p><div class="btnrow"><button class="btn danger" data-act="leaveTest">Leave test</button><button class="btn ghost" data-act="closeModal">Stay</button></div>'); return; } go('home'); },
  leaveTest: () => { closeModal(); go('home'); }, learn: () => go('learn'), practice: () => go('practice'), tests: () => go('testIntro'),
  lesson: a => go('lesson', { i: +a }),
  redoCheck: () => { const i = view.i; startRunner({ mode: 'check', lessonIdx: i, items: LESSONS[i].check.map(c => Object.assign({ kind: 'mc' }, c)), box: '#qcBox' }); },
  openSet: a => openSet(a),
  retrySet: () => {
    const s = setById(view.id), wrongIds = view.res.filter(x => !x.ok).map(x => x.id);
    let items = [];
    if (s.kind === 'match') {
      s.items.forEach((b, bi) => {
        const miss = b.pairs.map((p, k) => wrongIds.includes(b.id + '|' + b.pairs[k][0]) ? k : -1).filter(k => k >= 0);
        if (!miss.length) return;
        const keep = miss.slice(); b.pairs.forEach((_, k) => { if (keep.length < 3 && !keep.includes(k)) keep.push(k); });
        items.push(Object.assign({}, b, { pairs: keep.sort().map(k => b.pairs[k]), _order: null }));
      });
    } else items = s.items.filter(it => wrongIds.includes(it.id));
    openSet(s.id, items);
  },
  pickMC: a => pickMC(+a), pickType: a => pickType(a), pickErr: a => pickErr(+a), pickFix: a => pickFix(+a),
  mLeft: a => mLeft(+a), mRight: a => mRight(+a),
  nextQ: () => { if (R && R.answered) nextQ(); },
  startTest: a => startTest(a),
  tPick: a => { TT.ans[TT.items[TT.idx].id] = +a; main().querySelectorAll('.qcard .opt,.qcard .ul').forEach(b => { const on = +b.dataset.arg === +a; b.classList.toggle('chosen', on); b.setAttribute('aria-pressed', on); }); markNav(); },
  tNext: () => { if (TT.idx < 29) { TT.idx++; render(); } },
  tPrev: () => { if (TT.idx > 0) { TT.idx--; render(); } },
  jump: a => { TT.idx = +a; render(); },
  toggleClock: () => { TT.timer = !TT.timer; S.timer = TT.timer; save(); if (TT.timer) startClock(); else if (timerId) { clearInterval(timerId); timerId = null; } render(); },
  askSubmit: () => { const n = 30 - Object.values(TT.ans).filter(x => x !== '').length; modal('<h2>Finish the test?</h2><p>' + (n ? 'You have <b>' + n + '</b> unanswered question' + (n > 1 ? 's' : '') + '.' : 'You answered all 30 questions.') + '</p><div class="btnrow"><button class="btn" data-act="doSubmit">Yes, finish</button><button class="btn ghost" data-act="closeModal">Keep working</button></div>'); },
  doSubmit: () => { closeModal(); submitTest(false); },
  closeModal: () => closeModal(),
  lastResult: a => go('testDone', { v: a }),
  review: a => go('review', { v: a }),
  retryTest: a => retryTest(a),
  editName: () => { S.name = ''; save(); render(); setTimeout(() => { const i = $('#nameIn'); if (i) i.focus(); }, 0); },
  askReset: () => modal('<h2>Reset all progress?</h2><p>This clears your name, lessons, stars and test scores on this device.</p><div class="btnrow"><button class="btn danger" data-act="doReset">Yes, reset</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>'),
  doReset: () => { S = blank(); try { localStorage.removeItem(KEY); } catch (e) { } closeModal(); go('home'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset.arg); }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; e.preventDefault();
  if (f === 'name') { const v = $('#nameIn').value.trim(); if (!v) { $('#nameIn').focus(); return; } S.name = v; save(); render(); }
  if (f === 'typed') submitTyped();
  if (f === 'tTyped') ACT.tNext();
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'timer') { S.timer = e.target.checked; save(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('rw') && !e.shiftKey) { e.preventDefault(); submitTyped(); }
});

/* test hook for automated checks */
window.__IF = { TYPES, LESSONS, SETS, TESTS, checkTyped, gradeTest, get R() { return R; }, get TT() { return TT; }, get S() { return S; } };

render();
})();

</script>

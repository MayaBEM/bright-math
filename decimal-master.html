40, which has 4 tenths — more than the 2 tenths in 8.27. So 8.4 > 8.27. Treating "27" and "4" as whole numbers ignores that they represent different place values.`,misconception:`More digits after the decimal point does not mean a bigger number — compare tenths, then hundredths, then thousandths.`,hints:[`Try writing both numbers with the same number of decimal places.`,`8.4 padded to 2 decimal places is 8.40 — compare that with 8.27.`]}),I({skill:`equivalent-decimals`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student says "0.340 = 0.304 because they use the same digits." What went wrong?`,choices:[{id:`a`,label:`They are not equal — 0.340 has 4 hundredths, but 0.304 has 0 hundredths`,correct:!0},{id:`b`,label:`Adding a zero to the end of a number always changes its value`,correct:!1},{id:`c`,label:`They forgot the numbers need a whole-number part`,correct:!1},{id:`d`,label:`0.304 is actually the bigger number`,correct:!1}],answer:`They are not equal — 0.340 has 4 hundredths, but 0.304 has 0 hundredths`,explanation:`Using the same digits is not the same as having the same value — the position of each digit matters. 0.340 = 3 tenths + 4 hundredths, while 0.304 = 3 tenths + 0 hundredths + 4 thousandths.`,misconception:`Same digits in a different order almost always means a different value — only trailing zeros can be added or removed without changing the value.`,hints:[`Write out the place value of every digit in both numbers.`,`Compare hundredths: one number has 4, the other has 0.`]}),I({skill:`placeholder-zeros`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student orders 4.23, 4.6 and 4.179, and says the order from smallest to largest is 4.23, 4.6, 4.179 — reasoning that 4.179 has the most digits so it must be biggest.`,choices:[{id:`a`,label:`They compared the decimal digits as whole numbers (179 vs 6) instead of by place value`,correct:!0},{id:`b`,label:`They compared the whole-number parts incorrectly`,correct:!1},{id:`c`,label:`They forgot these are decimal numbers`,correct:!1},{id:`d`,label:`Their order is actually correct`,correct:!1}],answer:`They compared the decimal digits as whole numbers (179 vs 6) instead of by place value`,explanation:`Padding to 3 decimal places: 4.230, 4.600, 4.179. Comparing tenths first, the correct order is 4.179, 4.23, 4.6 — the exact opposite of the student's answer.`,misconception:`A longer decimal part does not mean a bigger number — always compare tenths first, then hundredths, then thousandths.`,hints:[`Give all three numbers 3 decimal places: 4.230, 4.600, 4.179.`,`Compare the tenths digit of each number first.`]}),I({skill:`units-ordering`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student compares 725 mm and 7.3 cm, and says "725 mm is smaller, because 7.3 has fewer digits before the decimal point."`,choices:[{id:`a`,label:`They compared the numbers without converting to the same unit first`,correct:!0},{id:`b`,label:`725 mm really is smaller than 7.3 cm`,correct:!1},{id:`c`,label:`They should have compared the number of digits after the point`,correct:!1},{id:`d`,label:`mm and cm cannot be compared at all`,correct:!1}],answer:`They compared the numbers without converting to the same unit first`,explanation:`7.3 cm = 73 mm, which is much smaller than 725 mm. You must convert to the same unit before comparing the numbers.`,misconception:`You can never compare two measurements' digits directly unless they're in the same unit.`,hints:[`Convert 7.3 cm into millimetres first.`,`1 cm = 10 mm.`]}),I({skill:`compare-symbols`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student says "9.2 < 9.01 because 9.01 has two decimal digits, so it looks more precise and bigger."`,choices:[{id:`a`,label:`They assumed more decimal digits means a bigger number`,correct:!0},{id:`b`,label:`They compared the whole-number parts incorrectly`,correct:!1},{id:`c`,label:`Their answer happens to be correct`,correct:!1},{id:`d`,label:`You cannot compare 9.2 and 9.01 at all`,correct:!1}],answer:`They assumed more decimal digits means a bigger number`,explanation:`9.2 = 9.20, which has 2 tenths — much more than the 0 tenths in 9.01. So 9.2 > 9.01, the opposite of the student's claim.`,misconception:`More decimal digits (more "precision") does not mean a bigger value — compare place by place, starting with tenths.`,hints:[`Write 9.2 with 2 decimal places: 9.20.`,`Compare the tenths digit of each number.`]})],addsub:[I({skill:`written-add`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student adds 27.52 + 4.8 and gets 28.00. What went wrong?`,choices:[{id:`a`,label:`They did not line up the decimal points, so tenths were added to hundredths`,correct:!0},{id:`b`,label:`They forgot to carry a digit`,correct:!1},{id:`c`,label:`They rounded too early`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They did not line up the decimal points, so tenths were added to hundredths`,explanation:`Written correctly with the decimal points aligned (27.52 + 4.80), the answer is 32.32 — not 28.00.`,misconception:`Always write decimal addition/subtraction in columns with the decimal points lined up exactly, adding placeholder zeros if needed.`,hints:[`Rewrite the calculation in columns with the decimal points aligned.`,`Give 4.8 a placeholder zero so it reads 4.80.`]}),I({skill:`written-sub`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 43.60 − 5.45 and gets 38.25. What went wrong?`,choices:[{id:`a`,label:`They made a borrowing (regrouping) error in the hundredths column`,correct:!0},{id:`b`,label:`They subtracted the numbers in the wrong order`,correct:!1},{id:`c`,label:`They forgot to line up the decimal points`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They made a borrowing (regrouping) error in the hundredths column`,explanation:`The correct answer is 38.15. Borrowing from the tenths column to work out 0 − 5 in the hundredths column must be done carefully — the student's working slipped somewhere in that step.`,misconception:`A single mistake in one borrowing step throws off the rest of the answer — check each column carefully, especially after borrowing.`,hints:[`Check the hundredths column: 0 − 5 needs a borrow from the tenths.`,`Redo the subtraction column by column from the right.`]}),I({skill:`sub-from-whole`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 10 − 4.83 and gets 6.83. What went wrong?`,choices:[{id:`a`,label:`They subtracted the whole numbers (10 − 4 = 6) but just attached the decimal part instead of subtracting it`,correct:!0},{id:`b`,label:`They forgot to convert 10 into a decimal`,correct:!1},{id:`c`,label:`They subtracted in the wrong order`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They subtracted the whole numbers (10 − 4 = 6) but just attached the decimal part instead of subtracting it`,explanation:`The correct answer is 5.17. Writing 10 as 9 + 0.99 + 0.01 (or 10.00 with borrowing) shows why: 10.00 − 4.83 = 5.17, not 6.83.`,misconception:`When subtracting a decimal from a whole number, you must borrow across every place, not just handle the whole-number part.`,hints:[`Try rewriting 10 as 9 whole + 9 tenths + 10 hundredths.`,`Check: does 6.83 + 4.83 give back 10? (It gives 11.66, so it is wrong.)`]}),I({skill:`negative-answers`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 4.6 − 8.21 and writes the answer as 3.61 (no negative sign). What went wrong?`,choices:[{id:`a`,label:`They forgot that since 4.6 < 8.21, the answer must be negative`,correct:!0},{id:`b`,label:`They should have added the numbers instead`,correct:!1},{id:`c`,label:`They should not have swapped the numbers at all`,correct:!1},{id:`d`,label:`The answer is correct as it stands`,correct:!1}],answer:`They forgot that since 4.6 < 8.21, the answer must be negative`,explanation:`Working out 8.21 − 4.6 = 3.61 is a valid first step, but because 4.6 is smaller than 8.21, the true answer to 4.6 − 8.21 is −3.61, not 3.61.`,misconception:`When subtracting a bigger number from a smaller one, always check the sign of the final answer — it should be negative.`,hints:[`Compare 4.6 and 8.21 — which is bigger?`,`When you subtract a bigger number from a smaller one, the result is negative.`]}),I({skill:`sub-from-one`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 1 − 0.34 and gets 0.76. What went wrong?`,choices:[{id:`a`,label:`They made a borrowing error working from the ones column into the tenths`,correct:!0},{id:`b`,label:`They added the numbers instead of subtracting`,correct:!1},{id:`c`,label:`They forgot to write 1 as a decimal at all`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They made a borrowing error working from the ones column into the tenths`,explanation:`The correct answer is 0.66. Writing 1 as 0.99 + 0.01 (or 1.00 with borrowing) makes the subtraction 1.00 − 0.34 = 0.66 much clearer.`,misconception:`When subtracting from 1, it helps to think of 1 as 0 ones, 9 tenths, 9 hundredths (and so on), then add the last 1 hundredth back at the very end.`,hints:[`Try writing 1.00 − 0.34 in columns.`,`Check: does 0.76 + 0.34 give back 1? (It gives 1.10, so it is wrong.)`]})],multiply:[I({skill:`mult-written`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`Anna works out 47.35 × 18 using a grid, correctly getting 4735 × 18 = 85 230, and writes the final answer as 85.23. Without checking her grid, how can you tell she is wrong?`,choices:[{id:`a`,label:`Estimating 47 × 18 ≈ 850 shows the real answer should be close to 850, not 85.23`,correct:!0},{id:`b`,label:`47.35 × 18 should always be smaller than 47.35`,correct:!1},{id:`c`,label:`Grid method can never be used for decimals`,correct:!1},{id:`d`,label:`Her answer is actually correct`,correct:!1}],answer:`Estimating 47 × 18 ≈ 850 shows the real answer should be close to 850, not 85.23`,explanation:`The estimate 47 × 18 ≈ 850 tells us straight away that 85.23 is roughly 10 times too small — the correct answer is 852.30.`,misconception:`Always sanity-check a multiplication answer against a quick estimate before trusting the exact decimal placement.`,hints:[`Round 47.35 to 50 and 18 to 20, then estimate.`,`Compare the size of your estimate with the given answer.`]}),I({skill:`decimal-point-detective`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`Given that 521 × 53 = 27 613, a student says 5.21 × 53 = 2.7613. What went wrong?`,choices:[{id:`a`,label:`They moved the decimal point too many places — 5.21 is only 100 times smaller than 521, not 10 000 times`,correct:!0},{id:`b`,label:`They should have multiplied 53 by 10 instead`,correct:!1},{id:`c`,label:`27 613 was calculated incorrectly to begin with`,correct:!1},{id:`d`,label:`Their answer is correct`,correct:!1}],answer:`They moved the decimal point too many places — 5.21 is only 100 times smaller than 521, not 10 000 times`,explanation:`5.21 = 521 ÷ 100, so 5.21 × 53 = 27 613 ÷ 100 = 276.13, not 2.7613.`,misconception:`Count decimal places carefully — moving the point too many (or too few) places is one of the most common decimal-multiplication errors.`,hints:[`How many times smaller is 5.21 than 521?`,`521 ÷ 100 = 5.21, so divide the product by 100 too.`]}),I({skill:`mult-concept`,difficulty:1,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student says 0.002 × 4 = 0.8. What went wrong?`,choices:[{id:`a`,label:`They put the decimal point in the wrong position — 0.002 has 3 decimal places, so the answer needs 3 as well`,correct:!0},{id:`b`,label:`2 × 4 was calculated incorrectly`,correct:!1},{id:`c`,label:`Multiplying by 4 should make the number smaller`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They put the decimal point in the wrong position — 0.002 has 3 decimal places, so the answer needs 3 as well`,explanation:`2 × 4 = 8, and since 0.002 has 3 decimal places, the answer must too: 0.008, not 0.8.`,misconception:`The number of decimal places in the answer must match the number of decimal places in the question, not just "look about right".`,hints:[`Work out 2 × 4 first, ignoring the decimal point.`,`Count how many digits come after the decimal point in 0.002.`]}),I({skill:`mult-estimation`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student says "0.9 × 212 is about 20, because 0.9 is such a small number."`,choices:[{id:`a`,label:`They forgot 0.9 is close to 1, so the answer should be close to 212, not tiny`,correct:!0},{id:`b`,label:`0.9 really does make numbers much smaller`,correct:!1},{id:`c`,label:`212 was too large to estimate with`,correct:!1},{id:`d`,label:`Their estimate is reasonable`,correct:!1}],answer:`They forgot 0.9 is close to 1, so the answer should be close to 212, not tiny`,explanation:`Since 0.9 is close to 1, 0.9 × 212 should be close to 1 × 212 = 212. The actual answer, 190.8, is nowhere near 20.`,misconception:`A decimal close to 1 barely changes the size of the number it multiplies — only decimals much less than 1 shrink the answer a lot.`,hints:[`How close is 0.9 to 1?`,`Try estimating with 1 × 212 first.`]}),I({skill:`mult-written`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student correctly works out 45 × 372 = 16 740, but then writes 0.45 × 372 = 1.674. What went wrong?`,choices:[{id:`a`,label:`The decimal point was placed using the wrong number of digits — 0.45 has 2 decimal places, so the answer needs exactly 2`,correct:!0},{id:`b`,label:`45 × 372 was worked out incorrectly`,correct:!1},{id:`c`,label:`0.45 × 372 should be bigger than 372`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`The decimal point was placed using the wrong number of digits — 0.45 has 2 decimal places, so the answer needs exactly 2`,explanation:`0.45 has 2 decimal places, so the answer needs exactly 2 decimal places: 16 740 becomes 167.40, not 1.674.`,misconception:`Count the decimal places in the original number carefully — that count decides exactly where the point goes in the answer.`,hints:[`How many digits come after the point in 0.45?`,`Move the decimal point in 16740 that many places from the right.`]})],divide:[I({skill:`division-adding-zeros`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 112.4 ÷ 16 and writes the answer as 7.25. What went wrong?`,choices:[{id:`a`,label:`They skipped a placeholder zero, shifting the later digits one place to the left`,correct:!0},{id:`b`,label:`112 ÷ 16 was worked out incorrectly`,correct:!1},{id:`c`,label:`They should have rounded the answer`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They skipped a placeholder zero, shifting the later digits one place to the left`,explanation:`112.4 ÷ 16 = 7.025. Dividing the tenths digit 4 by 16 gives 0 with a remainder, so a placeholder 0 must be written before continuing — skipping it shifts every later digit.`,misconception:`When a digit divides to give 0, you must still write that 0 in the answer before carrying the remainder on.`,hints:[`After 112 ÷ 16 = 7, divide the 4 tenths by 16 — what do you get?`,`Don't skip writing a 0 just because the digit divides to nothing.`]}),I({skill:`division-adding-zeros`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 251.55 ÷ 26 and stops at "9.67 remainder 13" instead of finishing. What should they have done?`,choices:[{id:`a`,label:`Added a zero after the last digit and kept dividing instead of stopping at the remainder`,correct:!0},{id:`b`,label:`Rounded 9.67 up to 10`,correct:!1},{id:`c`,label:`Stopped even earlier, at "9.6 remainder 15"`,correct:!1},{id:`d`,label:`Their working is already complete`,correct:!1}],answer:`Added a zero after the last digit and kept dividing instead of stopping at the remainder`,explanation:`A decimal division does not have to stop at a whole-number remainder — add a zero after the decimal digits and keep dividing to continue the answer.`,misconception:`A remainder in a decimal division is not the end of the calculation — it is a sign to add another zero and continue.`,hints:[`A whole-number "remainder" in a decimal division means you can keep going.`,`Add a 0 after the last digit of the dividend and continue dividing.`]}),I({skill:`division-checking`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student says 8.6 ÷ 13 = 6.6. What went wrong?`,choices:[{id:`a`,label:`The decimal point is misplaced — since 13 is bigger than 8.6, the answer must be less than 1`,correct:!0},{id:`b`,label:`8.6 was too small a number to divide by 13`,correct:!1},{id:`c`,label:`13 should have been rounded first`,correct:!1},{id:`d`,label:`The answer is reasonable`,correct:!1}],answer:`The decimal point is misplaced — since 13 is bigger than 8.6, the answer must be less than 1`,explanation:`Dividing a number by something bigger than itself always gives an answer less than 1. 8.6 ÷ 13 ≈ 0.66, not 6.6.`,misconception:`If the divisor is bigger than the dividend, the quotient must be less than 1 — a quick check that catches many misplaced decimal points.`,hints:[`Is 13 bigger or smaller than 8.6?`,`When you divide by a bigger number, the answer should be less than 1.`]}),I({skill:`division-rounding`,difficulty:3,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`Asked to round 8.46 ÷ 7 to 2 decimal places, a student divides only as far as 2 decimal places (getting 1.20) and stops there. What is wrong with this approach?`,choices:[{id:`a`,label:`They should have worked out one extra decimal place first, then rounded`,correct:!0},{id:`b`,label:`8.46 ÷ 7 cannot be rounded to 2 decimal places`,correct:!1},{id:`c`,label:`They should have rounded 7 first`,correct:!1},{id:`d`,label:`Stopping at exactly 2 decimal places is always correct`,correct:!1}],answer:`They should have worked out one extra decimal place first, then rounded`,explanation:`8.46 ÷ 7 = 1.2085..., so to round correctly to 2 d.p. you need the third decimal digit (8), which rounds 1.20 up to 1.21 — not 1.20.`,misconception:`To round a division answer correctly, always calculate at least one decimal place beyond the level of accuracy you need.`,hints:[`Work the division out to 3 decimal places: 8.46 ÷ 7 = 1.208...`,`Use the third decimal digit to decide whether to round up.`]}),I({skill:`division-larger-divisor`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student divides 41.481 ÷ 18 and, after finding a remainder partway through, writes the final answer as "2.3 remainder 9". What is missing?`,choices:[{id:`a`,label:`They should have continued dividing (adding zeros if needed) instead of stopping at a remainder`,correct:!0},{id:`b`,label:`41.481 was copied down incorrectly`,correct:!1},{id:`c`,label:`18 is too large a divisor for this method`,correct:!1},{id:`d`,label:`Writing a remainder is always the correct way to finish a decimal division`,correct:!1}],answer:`They should have continued dividing (adding zeros if needed) instead of stopping at a remainder`,explanation:`The full division continues to give 41.481 ÷ 18 = 2.3045 exactly — every digit of the dividend (and any needed extra zeros) should be used before stopping.`,misconception:`Unlike whole-number division, decimal division should be carried on (with extra zeros) rather than left with a "remainder".`,hints:[`Keep dividing using every digit of 41.481.`,`Carry each remainder onto the next digit, adding zeros if you run out.`]})],strategies:[I({skill:`strategy-choice`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student insists "the only correct way to work out 8.4 × 9 is long multiplication."`,choices:[{id:`a`,label:`There isn't one correct method — ×10 − ×1 gives the exact same answer, much faster`,correct:!0},{id:`b`,label:`Long multiplication actually gives a different (wrong) answer`,correct:!1},{id:`c`,label:`8.4 × 9 cannot be worked out mentally at all`,correct:!1},{id:`d`,label:`They are right — there is only one valid method`,correct:!1}],answer:`There isn't one correct method — ×10 − ×1 gives the exact same answer, much faster`,explanation:`8.4 × 9 = 8.4 × 10 − 8.4 = 84 − 8.4 = 75.6, exactly matching long multiplication — just faster and with less room for error.`,misconception:`Different valid strategies always agree on the answer — choosing an efficient one is about speed and reliability, not "correctness".`,hints:[`Try the ×10 − ×1 method and compare the answer with long multiplication.`]}),I({skill:`simplify-division`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`To simplify 12.56 ÷ 40, a student divides only the 40 by 10, getting 12.56 ÷ 4. What went wrong?`,choices:[{id:`a`,label:`Both numbers must be divided by the same factor, not just one of them`,correct:!0},{id:`b`,label:`40 should have been divided by 100 instead`,correct:!1},{id:`c`,label:`12.56 cannot be simplified at all`,correct:!1},{id:`d`,label:`Their working is correct`,correct:!1}],answer:`Both numbers must be divided by the same factor, not just one of them`,explanation:`Dividing only one number changes the value of the whole calculation. The correct simplification is 12.56 ÷ 10 = 1.256 and 40 ÷ 10 = 4, giving 1.256 ÷ 4 = 0.314.`,misconception:`Simplifying a division only works if you divide (or multiply) both the dividend and the divisor by the same amount.`,hints:[`If you divide the divisor by 10, you must divide the dividend by 10 too.`]}),I({skill:`place-value-fractions`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 0.06 × 3500 by removing the decimal point to get 6 × 3500 = 21 000. What went wrong?`,choices:[{id:`a`,label:`They forgot to divide by 100 (the place value of 0.06) after removing the decimal point`,correct:!0},{id:`b`,label:`6 × 3500 was calculated incorrectly`,correct:!1},{id:`c`,label:`3500 needed to be divided by 6 instead`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They forgot to divide by 100 (the place value of 0.06) after removing the decimal point`,explanation:`0.06 = 6 ÷ 100, so 0.06 × 3500 = 6 × 3500 ÷ 100 = 21 000 ÷ 100 = 210, not 21 000.`,misconception:`Removing a decimal point from one number in a multiplication is only step one — you must also divide the final answer by the same place-value factor.`,hints:[`0.06 is 6 divided by 100 — that division has to happen somewhere in the calculation.`]}),I({skill:`partition-decimals`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`To work out 7.6 × 8 by partitioning, a student writes: 7 × 8 = 56, and 6 × 8 = 48, so the answer is 56 + 48 = 104. What went wrong?`,choices:[{id:`a`,label:`They used 6 instead of 0.6 for the decimal part of 7.6`,correct:!0},{id:`b`,label:`7 × 8 was worked out incorrectly`,correct:!1},{id:`c`,label:`They should have partitioned the 8 instead`,correct:!1},{id:`d`,label:`The answer is correct`,correct:!1}],answer:`They used 6 instead of 0.6 for the decimal part of 7.6`,explanation:`7.6 = 7 + 0.6, not 7 + 6. So the second part should be 0.6 × 8 = 4.8, giving 56 + 4.8 = 60.8, not 104.`,misconception:`When partitioning a decimal, the fractional part keeps its decimal value (0.6, not 6) throughout the calculation.`,hints:[`7.6 = 7 + 0.6 — keep the 0.6 as a decimal, not a whole number.`]}),I({skill:`times9-shortcut`,difficulty:2,stage:`spot-mistake`,type:`multiple-choice`,reasoning:!0,prompt:`A student works out 4.6 × 9 as "4.6 × 10 + 4.6 = 50.6". What went wrong?`,choices:[{id:`a`,label:` ecimal Duel: < > = ≠`,learn:[`< means "is less than", > means "is greater than", = means "is equal to", and ≠ means "is not equal to".`,`Compare place by place — whole number, then tenths, then hundredths — to decide which symbol fits.`],tryIt:z(Qr,5)},{id:`ord-placeholder`,skill:`placeholder-zeros`,title:`Ordering with placeholder zeros`,learn:[`A quick trick: give every number in a set the SAME number of decimal places by adding end zeros, then compare the digits like whole numbers.`,`For example: 4.23, 4.6, 4.179 become 4.230, 4.600, 4.179 — now just compare 230, 600 and 179.`,`This trick works because it's really the same place-value comparison, just written differently — understanding place value still matters more than memorising the trick.`],tryIt:z($r,4)},{id:`ord-units`,skill:`units-ordering`,title:`Ordering with measurement units`,learn:[`Some problems mix units — like mm, cm, m and km, or mL, cL and L. Convert everything to the SAME unit before comparing.`,`Once every measurement is in the same unit, order them exactly as you would any other decimals.`],visual:{kind:`unit-convert`,props:{family:`length`}},tryIt:z(ti,4)}],addsub:[{id:`as-partition-add`,skill:`mental-add-partition`,title:`Mental addition: partition`,learn:[`Split each number into its whole-number and decimal parts, add the whole numbers, add the decimal parts, then combine.`,`Example: 2.3 + 7.8 → (2 + 7) + (0.3 + 0.8) = 9 + 1.1 = 10.1`],visual:{kind:`column-calc`,props:{a:2.3,b:7.8,op:`+`}},tryIt:z(ii,4)},{id:`as-round-add`,skill:`mental-add-round-adjust`,title:`Mental addition: round and adjust`,learn:[`If a number is close to a whole number, round it, add, then adjust your answer back.`,`Example: 6.9 + 12.4 → round 6.9 up to 7 → 7 + 12.4 = 19.4 → subtract the extra 0.1 → 19.3`],tryIt:z(ai,4)},{id:`as-decompose-sub`,skill:`mental-sub-decompose`,title:`Mental subtraction: decompose`,learn:[`Subtract the whole-number parts first, then the decimal parts — the decimal part can come out negative, that's fine, just combine at the end.`,`Example: 14.4 − 6.5 → (14 − 6) + (0.4 − 0.5) = 8 + (−0.1) = 7.9`],visual:{kind:`column-calc`,props:{a:14.4,b:6.5,op:`-`}},tryIt:z(oi,4)},{id:`as-round-sub`,skill:`mental-sub-round-adjust`,title:`Mental subtraction: round and adjust`,learn:[`Round the number you are subtracting up to a whole number, subtract, then add the extra back.`,`Example: 5.4 − 1.9 → round 1.9 up to 2 → 5.4 − 2 = 3.4 → add back 0.1 → 3.5`],tryIt:z(si,4)},{id:`as-from-one`,skill:`sub-from-one`,title:`Subtracting decimals from 1`,learn:[`Write 1 as 1.0000 (matching the decimal places you need), then subtract as normal, borrowing across the columns.`,`Example: 1 − 0.34 → 1.00 − 0.34 = 0.66`],tryIt:z(ci,4)},{id:`as-written-add`,skill:`written-add`,title:`Written addition`,learn:[`Line up the decimal points exactly in columns, filling gaps with placeholder zeros, then add as normal.`,`Example: 27.52 + 4.80 = 32.32 — always keep the decimal point aligned straight down the page.`],visual:{kind:`column-calc`,props:{a:27.52,b:4.8,op:`+`}},tryIt:z(li,4)},{id:`as-written-sub`,skill:`written-sub`,title:`Written subtraction`,learn:[`Line up the decimal points, then subtract column by column, borrowing from the column on the left whenever a digit is too small.`,`Example: 43.60 − 5.45 = 38.15`],visual:{kind:`column-calc`,props:{a:43.6,b:5.45,op:`-`}},tryIt:z(ui,4)},{id:`as-from-whole`,skill:`sub-from-whole`,title:`Subtracting from whole numbers`,learn:[`Rewrite the whole number with the matching decimal places (e.g. 10 as 10.00), then subtract, borrowing as needed.`,`Or decompose: 10 − 4.83 → (10 − 4) = 6, then 6.0 − 0.8 = 5.2, then 5.20 − 0.03 = 5.17.`],visual:{kind:`column-calc`,props:{a:10,b:4.83,op:`-`}},tryIt:z(di,4)},{id:`as-negative`,skill:`negative-answers`,title:`Negative answers`,learn:[`If the number you start with is smaller than the number you subtract, the answer is negative.`,`Example: 4.6 − 8.21 → since 4.6 < 8.21, work out 8.21 − 4.6 = 3.61, then wri

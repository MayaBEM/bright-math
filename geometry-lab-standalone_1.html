`point-D`,label:`point D`}],answer:{kind:`click`,correct:`point-D`},hints:[`Collinear means "sitting on the same straight line".`,`Three of the points are on the drawn line. One is not.`],explanation:`Correct! A, B and C all lie on the straight line, so they are collinear. Point D sits below it.`,reteach:`Follow the straight line with your finger. Every point it passes through is collinear with the others. D is off the line, so D is the odd one out.`},{id:`l1-18`,lesson:`l1`,skill:`plane-collinear`,difficulty:1,type:`mcq`,context:`Think about the flat top of a table.`,prompt:`A tabletop is flat and you can draw in any direction across it. Which geometry idea does it model best?`,figure:{kind:`plane`,name:`P`},options:[{id:`a`,text:`A plane`},{id:`b`,text:`A point`,why:`A point marks one single spot. A tabletop is much more than one spot.`},{id:`c`,text:`A line`,why:`A line is straight and thin. A tabletop spreads out sideways as well.`},{id:`d`,text:`A ray`,why:`A ray is straight and thin too, and it travels in one direction only.`}],answer:{kind:`choice`,correct:`a`},hints:[`Is a tabletop long and thin, or flat and wide?`,`A plane is a flat surface that has no thickness.`],explanation:`Correct! A plane is a flat surface with no thickness that spreads out forever, and a tabletop is a good picture of one.`,reteach:`A point is one spot, a line is straight and thin, and a plane is a flat surface you can draw all over. A tabletop is flat, so it models a plane.`,tags:[`real-life`]},{id:`l1-19`,lesson:`l1`,skill:`figures`,difficulty:2,type:`click-target`,prompt:`Click the end of this ray that shows it carries on forever.`,figure:{kind:`basic`,variant:`ray`,labels:[`S`,`T`],rotation:-18},clickTargets:[{id:`arrow`,label:`the arrow end`},{id:`endpoint`,label:`the endpoint at S`}],answer:{kind:`click`,correct:`arrow`},hints:[`One end stops. The other end never does.`,`An arrow in geometry always means "this keeps going".`],explanation:`Correct! The arrow end shows the ray never stops. The ray begins at its endpoint S and travels past T forever.`,reteach:`The dot at S is the endpoint — that end stops. The arrow past T is the end that carries on forever.`},{id:`l1-20`,lesson:`l1`,skill:`figures`,difficulty:2,type:`sort`,prompt:`Sort each real-life object into the figure that models it best.`,buckets:[{id:`seg`,label:`Best modelled by a segment`},{id:`ray`,label:`Best modelled by a ray`}],items:[{id:`i1`,label:`A pencil`,bucket:`seg`},{id:`i2`,label:`A torch beam shining into the night sky`,bucket:`ray`},{id:`i3`,label:`The straight road between two towns`,bucket:`seg`},{id:`i4`,label:`Sunlight travelling out from the Sun`,bucket:`ray`},{id:`i5`,label:`One side of a window frame`,bucket:`seg`},{id:`i6`,label:`A laser pointed at the stars`,bucket:`ray`}],answer:{kind:`sort`},hints:[`Ask: can you point to both ends of the object?`,`If it starts somewhere and then travels away without stopping, it models a ray.`],explanation:`Correct! Pencils, roads and window frames stop at both ends, so they model segments. Torch beams, sunlight and lasers start at one place and shoot away, so they model rays.`,reteach:`Two ends you can touch = segment. One starting place and then away it goes = ray.`,tags:[`real-life`]},{id:`l1-21`,lesson:`l1`,skill:`notation`,difficulty:2,type:`figure-choice`,prompt:`Which diagram shows ray BA?`,options:[{id:`a`,figure:{kind:`basic`,variant:`ray`,labels:[`A`,`B`]},why:`This ray starts at A and travels past B, so it is ray AB.`},{id:`b`,figure:{kind:`basic`,variant:`ray`,labels:[`B`,`A`]}},{id:`c`,figure:{kind:`basic`,variant:`segment`,labels:[`B`,`A`]},why:`There is no arrow, so this figure stops at both ends. It is a segment.`},{id:`d`,figure:{kind:`basic`,variant:`line`,labels:[`B`,`A`]},why:`Arrows at both ends make this a line, not a ray.`}],answer:{kind:`choice`,correct:`b`},hints:[`For a ray, the first letter is always the endpoint.`,`Ray BA must begin at B.`],explanation:`Correct! Ray BA begins at endpoint B and travels forever past A, and it needs exactly one arrow.`,reteach:`Read the name from left to right: the first letter is where the ray starts. Ray BA starts at B, so the dot must be at B and the arrow on the other side.`,tags:[`symbols`]},{id:`l1-22`,lesson:`l1`,skill:`notation`,difficulty:2,type:`mcq`,context:`A straight line passes through points P and Q.`,prompt:`Sam calls it "line PQ". Mia calls it "line QP". Who has named it correctly?`,figure:{kind:`basic`,variant:`line`,labels:[`P`,`Q`]},options:[{id:`a`,text:`Only Sam`,why:`A line has no starting point, so PQ and QP are both fine.`},{id:`b`,text:`Only Mia`,why:`A line has no starting point, so PQ and QP are both fine.`},{id:`c`,text:`Both of them`},{id:`d`,text:`Neither of them`,why:`Two points on a line are enough to name it.`}],answer:{kind:`choice`,correct:`c`},hints:[`Does a line have a starting point?`,`Try reading the figure from left to right, then from right to left.`],explanation:`Correct! A line has no endpoint, so the order of the letters does not matter. Line PQ and line QP are the same line.`,reteach:`Order matters only for rays, because a ray has a starting point. Lines and segments can be named either way round.`,tags:[`symbols`]},{id:`l1-23`,lesson:`l1`,skill:`notation`,difficulty:2,type:`numeric`,context:`A line segment has endpoints P and Q.`,prompt:`Using only the letters P and Q, how many correct names can you write for this segment?`,figure:{kind:`basic`,variant:`segment`,labels:[`P`,`Q`]},answer:{kind:`numeric`,value:2},hints:[`Try writing the two letters in both orders.`,`Does a segment have a starting end and a finishing end?`],explanation:`Correct! Both PQ‾ and QP‾ name the same segment, so there are 2 correct names.`,reteach:`A segment has no direction, so you may write the letters either way round. That gives 2 names: PQ‾ and QP‾.`,tags:[`symbols`]},{id:`l1-24`,lesson:`l1`,skill:`relations`,difficulty:2,type:`figure-choice`,context:`A town planner wants two roads that are perpendicular.`,prompt:`Which picture shows what the planner wants?`,options:[{id:`a`,figure:{kind:`reallife`,variant:`road`,degrees:90,showArc:!1}},{id:`b`,figure:{kind:`reallife`,variant:`road`,degrees:55,showArc:!1},why:`These roads do cross, but the corner is not square, so they are not perpendicular.`},{id:`c`,figure:{kind:`relation`,variant:`parallel`,rotation:0},why:`These roads never meet at all, so they are parallel, not perpendicular.`}],answer:{kind:`choice`,correct:`a`},hints:[`Perpendicular means crossing at exactly 90°.`,`Look for a square corner, like the corner of a book.`],explanation:`Correct! Perpendicular roads cross and make a square corner of 90° at the junction.`,reteach:`Perpendicular lines must do two things: meet, and meet at exactly 90°. A slanted crossing is intersecting but not perpendicular.`,tags:[`real-life`]},{id:`l1-25`,lesson:`l1`,skill:`plane-collinear`,difficulty:2,type:`figure-choice`,prompt:`In which diagram are the three points collinear?`,options:[{id:`a`,figure:{kind:`points`,points:[{name:`P`,x:15,y:72},{name:`Q`,x:50,y:48},{name:`R`,x:85,y:24}]}},{id:`b`,figure:{kind:`points`,points:[{name:`P`,x:15,y:35},{name:`Q`,x:50,y:70},{name:`R`,x:85,y:30}]},why:`Q dips well below P and R, so one straight line cannot pass through all three.`},{id:`c`,figure:{kind:`points`,points:[{name:`P`,x:18,y:30},{name:`Q`,x:50,y:72},{name:`R`,x:82,y:34}]},why:`These three points make a V shape. A straight line cannot bend.`}],answer:{kind:`choice`,correct:`a`},hints:[`Hold a ruler or the edge of a card against the screen.`,`Collinear points climb or fall by the same amount each step.`],explanation:`Correct! In that diagram each point steps the same amount across and the same amount up, so one straight line passes through all three.`,reteach:`Collinear points lie on one straight line. If you have to bend to reach the third point, the points are not collinear.`},{id:`l1-26`,lesson:`l1`,skill:`figures`,difficulty:3,type:`error-analysis`,prompt:`A student says, "This figure must be a ray, because it has a dot at one end." What is the mistake?`,figure:{kind:`basic`,variant:`segment`,labels:[`R`,`S`]},options:[{id:`a`,text:`A dot is not enough. A ray also needs an arrow at the other end, but this figure stops at both R and S, so it is a segment.`},{id:`b`,text:`The figure is a line, because it is perfectly straight.`,why:`A line needs arrows at both ends. This figure stops, so it is not a line.`},{id:`c`,text:`The student is right — one dot always means a ray.`,why:`A segment has a dot at each end, so a dot on its own proves nothing.`},{id:`d`,text:`The figure is really a point.`,why:`A point has no length. This figure joins two different points.`}],answer:{kind:`choice`,correct:`a`},hints:[`Check BOTH ends before you decide on a name.`,`What does a ray have that a segment does not?`],explanation:`Correct! A ray needs one dot AND one arrow. This figure has a dot at each end and no arrow, so it is segment RS.`,reteach:`Never name a figure from one end only. Look at both ends: dot + dot = segment, dot + arrow = ray, arrow + arrow = line.`},{id:`l1-27`,lesson:`l1`,skill:`figures`,difficulty:3,type:`numeric`,context:`Points A, B and C all lie on one straight line, in that order.`,prompt:`How many different line segments can you name, using two of these points as the endpoints?`,figure:{kind:`points`,points:[{name:`A`,x:15,y:70},{name:`B`,x:45,y:50},{name:`C`,x:75,y:30}],lineThrough:[`A`,`C`]},answer:{kind:`numeric`,value:3},hints:[`List them carefully. Start every segment at A, then start at B.`,`AB‾ and BA‾ are the same segment, so count that pair only once.`],explanation:`Correct! The segments are AB‾, BC‾ and AC‾ — that makes 3 different segments.`,reteach:`Pair up the points: A with B, B with C, and A with C. That is 3 pairs, so 3 segments. Do not count AB‾ and BA‾ twice, because they are the same segment.`},{id:`l1-28`,lesson:`l1`,skill:`notation`,difficulty:3,type:`error-analysis`,prompt:`A student names this figure "ray NM". What is the mistake?`,figure:{kind:`basic`,variant:`ray`,labels:[`M`,`N`]},options:[{id:`a`,text:`The endpoint must be named first. The ray starts at M, so the correct name is ray MN.`},{id:`b`,text:`There is no mistake — ray NM and ray MN mean the same thing.`,why:`Order matters for rays. Ray NM would start at N and travel the opposite way.`},{id:`c`,text:`The figure should be called segment MN instead.`,why:`The arrow shows the figure never stops on that side, so it is not a segment.`},{id:`d`,text:`A ray can never be named with two letters.`,why:`A ray does use two letters: the endpoint, then any other point it passes through.`}],answer:{kind:`choice`,correct:`a`},hints:[`Find the dot first. That is where the ray begins.`,`The first letter of a ray name is always its endpoint.`],explanation:`Correct! The dot is at M, so M is the endpoint and must come first. The figure is ray MN, written MN→.`,reteach:`Ray names are read like a journey: start, then travel. This ray starts at M, so write MN→. Ray NM→ would be a different ray, pointing the other way.`,tags:[`symbols`]},{id:`l1-29`,lesson:`l1`,skill:`notation`,difficulty:3,type:`mcq`,prompt:`Which pair of names describes exactly the same figure?`,options:[{id:`a`,text:`Ray AB and ray BA`,why:`They have different endpoints, so they point in opposite directions.`},{id:`b`,text:`Segment AB and segment BA`},{id:`c`,text:`Ray AB and segment AB`,why:`The ray never stops past B, but the segment stops there.`},{id:`d`,text:`Line AB and ray AB`,why:`A line has no endpoint at all; a ray has one.`}],answer:{kind:`choice`,correct:`b`},hints:[`Only one of these figures has a starting point that the name has to show.`,`Which figures may be named either way round?`],explanation:`Correct! A segment has no direction, so AB‾ and BA‾ are the same segment. Rays are the only ones where swapping the letters changes the figure.`,reteach:`Swap the letters and ask what changes. For a line or a segment, nothing changes. For a ray, the endpoint changes, so you get a different ray.`,tags:[`symbols`]},{id:`l1-30`,lesson:`l1`,skill:`relations`,difficulty:3,type:`error-analysis`,prompt:`A student says, "These two lines are parallel, because they do not touch anywhere on the page." What is the mistake?`,figure:{kind:`relation`,variant:`not-parallel`,rotation:0},options:[{id:`a`,text:`Lines carry on forever. These two are getting closer and closer, so they would meet outside the page — they are not parallel.`},{id:`b`,text:`There is no mistake, because parallel lines only have to stay apart on the page.`,why:`Parallel lines must stay the same distance apart forever, not just on the paper.`},{id:`c`,text:`The mistake is that the two lines are not straight.`,why:`Both lines are perfectly straight. The problem is the gap between them.`},{id:`d`,text:`The mistake is that the lines are perpendicular.`,why:`Perpendicular lines meet at a square corner. These lines do not.`}],answer:{kind:`choice`,correct:`a`},hints:[`Measure the gap at the left, then at the right. Is it the same?`,`Imagine stretching both lines far off the page.`],explanation:`Correct! The gap shrinks from left to right, so the lines are heading towards each other. Parallel lines keep exactly the same gap forever.`,reteach:`Do not judge parallel lines by the page alone. Check the gap: if it grows or shrinks, the lines will meet somewhere, so they are not parallel.`},{id:`l1-31`,lesson:`l1`,skill:`relations`,difficulty:3,type:`sort`,prompt:`Sort each real-life example into the right group.`,buckets:[{id:`par`,label:`Parallel`},{id:`perp`,label:`Perpendicular`},{id:`cross`,label:`Cross, but not at 90°`}],items:[{id:`i1`,label:`Two railway tracks`,bucket:`par`},{id:`i2`,label:`The two slanted strokes of a capital X`,bucket:`cross`},{id:`i3`,label:`The corner of a window frame`,bucket:`perp`},{id:`i4`,label:`The ruled lines on a page of writing`,bucket:`par`},{id:`i5`,label:`The two strokes of a capital T`,bucket:`perp`},{id:`i6`,label:`The blades of a pair of open scissors`,bucket:`cross`}],answer:{kind:`sort`},hints:[`First ask: do the two lines meet at all? If not, they are parallel.`,`If they do meet, ask: is the corner square? Square means perpendicular.`],explanation:`Correct! Railway tracks and ruled lines never meet, so they are parallel. A window corner and a capital T make square corners, so they are perpendicular. A capital X and open scissors cross at a slant instead.`,reteach:`Use two questions in order. 1) Do they meet? No → parallel. 2) If yes, is the corner square? Yes → perpendicular. No → they simply intersect.`,tags:[`real-life`]},{id:`l1-32`,lesson:`l1`,skill:`relations`,difficulty:3,type:`mcq`,context:`Two straight lines are drawn on the same flat surface, and they are not parallel.`,prompt:`What must be true about these two lines?`,options:[{id:`a`,text:`They meet at exactly one point, if you follow them far enough.`},{id:`b`,text:`They meet at exactly two points.`,why:`Once two straight lines have met, they move apart forever. They cannot come back and cross again.`},{id:`c`,text:`They never meet.`,why:`Lines that never meet are exactly the ones we call parallel.`},{id:`d`,text:`They must be perpendicular.`,why:`They do cross, but the corner does not have to be 90°.`}],answer:{kind:`choice`,correct:`a`},hints:[`Lines never stop, so "off the page" still counts.`,`Can two straight lines cross, separate, and then cross again?`],explanation:`Correct! On one flat surface, two straight lines either stay parallel forever or cross at exactly one point — the point of intersection.`,reteach:`Straight lines cannot bend, so after crossing once they keep moving apart. On a flat surface the only two possibilities are "parallel" or "cross exactly once".`},{id:`l1-33`,lesson:`l1`,skill:`plane-collinear`,difficulty:3,type:`error-analysis`,prompt:`A student says, "Points A, B and C are collinear, because they are all on the same flat surface." What is the mistake?`,figure:{kind:`plane`,name:`P`,points:[{name:`A`,x:20,y:30},{name:`B`,x:62,y:24},{name:`C`,x:45,y:76}]},options:[{id:`a`,text:`Being on the same flat surface is not enough. Points are collinear only when one straight line passes through all of them, and no straight line goes through A, B and C.`},{id:`b`,text:`There is no mistake — any three points on a plane are collinear.`,why:`You can mark three points on a plane that make a triangle, and a triangle is not straight.`},{id:`c`,text:`The mistake is that the points are not really on the plane.`,why:`All three points are marked on plane P, so that part is fine.`},{id:`d`,text:`The mistake is that a plane cannot hold three points.`,why:`A plane holds as many points as you like.`}],answer:{kind:`choice`,correct:`a`},hints:[`Try to lay a ruler across all three points at once.`,`Collinear = "on one line". Coplanar = "on one flat surface".`],explanation:`Correct! A, B and C are all on plane P, but they form a triangle shape, so no single straight line passes through them. They are not collinear.`,reteach:`Points on the same flat surface share a plane, but that does not make them straight. Collinear points must sit on one straight line.`},{id:`l1-34`,lesson:`l1`,skill:`plane-collinear`,difficulty:3,type:`mcq`,context:`Two different points, A and B, are marked on a flat tabletop.`,prompt:`How many straight lines can be drawn that pass through both points?`,figure:{kind:`plane`,name:`P`,points:[{name:`A`,x:24,y:62},{name:`B`,x:70,y:34}],lineThrough:[`A`,`B`]},options:[{id:`a`,text:`Exactly one`},{id:`b`,text:`Exactly two`,why:`There is no second straight route from A to B — a line cannot bend.`},{id:`c`,text:`None`,why:`You can always join two points with a straight line and carry on past both ends.`},{id:`d`,text:`As many as you like`,why:`That is true through ONE point, but a second point locks the direction.`}],answer:{kind:`choice`,correct:`a`},hints:[`Put two dots on paper and try to draw a second, different straight line through both.`,`Through one point you can draw many lines. What does the second point do?`],explanation:`Correct! Two different points fix the direction of the line, so exactly one straight line passes through both of them.`,reteach:`Through a single point you can draw as many lines as you like. Add a second point and the direction is decided, so only one line fits.`}]})),za,Ba=o((()=>{za=[{id:`l2-01`,lesson:`l2`,skill:`angle-parts`,difficulty:1,type:`mcq`,prompt:`Which of these makes an angle?`,figure:{kind:`angle`,degrees:55,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`Two rays that start from the same point.`},{id:`b`,text:`Two rays that point the same way and never touch.`,why:`Rays that never meet make no corner, so there is nothing to open or close.`},{id:`c`,text:`One ray on its own.`,why:`One ray has nothing to open away from. You always need a second ray.`},{id:`d`,text:`Two points with nothing joining them.`,why:`Points have no direction. An angle is made of two rays, not two dots.`}],answer:{kind:`choice`,correct:`a`},hints:[`Look at the picture. Where do the two straight parts meet?`,`An angle needs a shared starting point — a corner.`],explanation:`Correct! An angle is made when two rays start from the same point. That shared point is the corner of the angle.`,reteach:`An angle needs two rays and one shared starting point. Two rays that never meet, or a single ray, cannot make an angle.`,tags:[`definition`]},{id:`l2-02`,lesson:`l2`,skill:`angle-parts`,difficulty:1,type:`click-target`,prompt:`Click the vertex of this angle.`,figure:{kind:`angle`,degrees:65,rotation:10,vertex:`B`,arms:[`A`,`C`]},clickTargets:[{id:`vertex`,label:`the corner at B`},{id:`arm1`,label:`the arm through A`},{id:`arm2`,label:`the arm through C`}],answer:{kind:`click`,correct:`vertex`},hints:[`The vertex is the point where the two rays meet.`,`It is the sharp corner, not the long straight part.`],explanation:`Correct! The vertex is point B, where the two rays meet. It is the corner of the angle.`,reteach:`The long straight parts are the arms. The point where they join is the vertex — here that is point B.`,tags:[`vertex`]},{id:`l2-03`,lesson:`l2`,skill:`angle-parts`,difficulty:1,type:`mcq`,prompt:`The two rays that make an angle have a special name. What are they called?`,figure:{kind:`angle`,degrees:60,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`The arms (they are also called the sides).`},{id:`b`,text:`The vertices.`,why:`An angle has only one vertex — the corner where the rays meet.`},{id:`c`,text:`The degrees.`,why:`Degrees measure how far open the angle is. They are not parts you can draw.`},{id:`d`,text:`The arcs.`,why:`The arc is the small curve we draw to show which angle we mean.`}],answer:{kind:`choice`,correct:`a`},hints:[`Think of your own arms opening out from your shoulder.`,`They are the two straight parts of the angle.`],explanation:`Correct! The two rays are called the arms of the angle. Some books call them the sides. They both start at the vertex.`,reteach:`An angle has two parts you can draw: the vertex (the corner) and the two arms (the straight rays leaving that corner).`,tags:[`vocabulary`]},{id:`l2-04`,lesson:`l2`,skill:`angle-naming`,difficulty:1,type:`mcq`,prompt:`In the name ∠ABC, which point is the vertex?`,figure:{kind:`angle`,degrees:50,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`Point A`,why:`A is written first, but the first letter sits out on one arm.`},{id:`b`,text:`Point B`},{id:`c`,text:`Point C`,why:`C is written last, so it sits out on the other arm.`},{id:`d`,text:`You cannot tell without measuring.`,why:`You never need to measure. The name itself tells you where the vertex is.`}],answer:{kind:`choice`,correct:`b`},hints:[`Say the name slowly: A – B – C. Which letter is in the middle?`,`The middle letter is always the corner.`],explanation:`Correct! In ∠ABC the middle letter is B, so B is the vertex. A and C are points on the two arms.`,reteach:`The middle letter of a three-letter angle name is always the vertex. In ∠ABC that is B, so the corner is at B.`,tags:[`three-letter`]},{id:`l2-05`,lesson:`l2`,skill:`angle-types`,difficulty:1,type:`figure-choice`,prompt:`Which diagram shows a right angle?`,options:[{id:`a`,figure:{kind:`angle`,degrees:50},why:`This corner is narrower than a square corner, so it is acute.`},{id:`b`,figure:{kind:`angle`,degrees:90}},{id:`c`,figure:{kind:`angle`,degrees:140},why:`This corner is wider than a square corner, so it is obtuse.`}],answer:{kind:`choice`,correct:`b`},hints:[`A right angle is exactly 90° — a perfect square corner.`,`Look for the small square drawn at the vertex.`],explanation:`Correct! A right angle measures exactly 90°. We mark it with a small square instead of a curved arc, so you can spot it straight away.`,reteach:`A right angle is a square corner, like the corner of a book or a window. It is drawn with a small square at the vertex.`,tags:[`right-angle`]},{id:`l2-06`,lesson:`l2`,skill:`angle-types`,difficulty:1,type:`mcq`,context:`A skateboard ramp leans up from flat ground.`,prompt:`What type of angle does the ramp make with the ground?`,figure:{kind:`reallife`,variant:`ramp`,degrees:30},options:[{id:`a`,text:`Acute`},{id:`b`,text:`Right`,why:`A right angle is a square corner. This corner is much narrower than that.`},{id:`c`,text:`Obtuse`,why:`Obtuse angles are wider than a square corner. This one is far narrower.`},{id:`d`,text:`Straight`,why:`A straight angle would lie flat along the ground, with no ramp at all.`}],answer:{kind:`choice`,correct:`a`},hints:[`Compare the corner with the corner of a book.`,`Is the marked angle smaller or larger than a square corner?`],explanation:`Correct! The ramp makes a narrow corner with the ground — much less than 90° — so it is an acute angle. Gentle ramps are easier to roll up.`,reteach:`Any angle smaller than a square corner (less than 90°) is acute. The ramp opens only a little way from the ground, so it is acute.`,tags:[`real-life`,`acute`]},{id:`l2-07`,lesson:`l2`,skill:`angle-types`,difficulty:1,type:`mcq`,prompt:`What type of angle is shown here?`,figure:{kind:`angle`,degrees:140,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`Acute`,why:`Acute angles are narrower than a square corner. This one is much wider.`},{id:`b`,text:`Right`,why:`A right angle is exactly a square corner. This one has opened past that.`},{id:`c`,text:`Obtuse`},{id:`d`,text:`Straight`,why:`A straight angle makes one straight line. These two arms are not in line.`}],answer:{kind:`choice`,correct:`c`},hints:[`Imagine a square corner sitting inside this angle.`,`The angle is wider than a square corner but the arms are not in a straight line.`],explanation:`Correct! The angle has opened past a square corner but has not flattened into a straight line, so it is obtuse (between 90° and 180°).`,reteach:`Obtuse angles sit between 90° and 180°: wider than a square corner, but not yet a straight line.`,tags:[`obtuse`]},{id:`l2-08`,lesson:`l2`,skill:`angle-types`,difficulty:1,type:`numeric`,prompt:`How many degrees are there in a right angle?`,unit:`°`,placeholder:`?`,answer:{kind:`numeric`,value:90},hints:[`A right angle is the square corner of a page.`,`Four of them fit exactly around a point, and a full turn is 360°.`],explanation:`Correct! A right angle is exactly 90°. Four right angles make a full turn of 360°.`,reteach:`A right angle is exactly 90°. It is the corner of a book, a door frame or a piece of paper.`,tags:[`right-angle`]},{id:`l2-09`,lesson:`l2`,skill:`angle-naming`,difficulty:1,type:`mcq`,prompt:`Only one angle is drawn at point P. Which short name can we use for it?`,figure:{kind:`angle`,degrees:60,vertex:`P`,arms:[`Q`,`R`]},options:[{id:`a`,text:`∠P`},{id:`b`,text:`∠Q`,why:`Q sits out on an arm. A one-letter name must be the vertex.`},{id:`c`,text:`∠R`,why:`R sits out on the other arm, not at the corner.`},{id:`d`,text:`∠QR`,why:`An angle is never named with exactly two letters.`}],answer:{kind:`choice`,correct:`a`},hints:[`A one-letter name always uses the vertex.`,`Which point is the corner of this angle?`],explanation:`Correct! The corner is at P, and no other angle sits at P, so ∠P is clear. You could also call it ∠QPR or ∠RPQ.`,reteach:`A one-letter name uses the vertex letter. Here the vertex is P, so the short name is ∠P — never ∠Q or ∠R.`,tags:[`one-letter`]},{id:`l2-10`,lesson:`l2`,skill:`angle-parts`,difficulty:1,type:`click-target`,prompt:`Click the point where the two rays meet.`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:55}]},clickTargets:[{id:`vertex`,label:`the shared starting point B`},{id:`ray-A`,label:`the ray towards A`},{id:`ray-C`,label:`the ray towards C`}],answer:{kind:`click`,correct:`vertex`},hints:[`Both rays start from the same point.`,`That shared point has a special name: the vertex.`],explanation:`Correct! Ray BA and ray BC both start at B. That shared endpoint is the vertex of the angle.`,reteach:`Follow each ray back to where it begins. Both rays begin at B, so B is the shared endpoint — the vertex.`,tags:[`vertex`]},{id:`l2-11`,lesson:`l2`,skill:`angle-types`,difficulty:1,type:`mcq`,context:`Points P, Q and R lie on one straight line, and Q is between P and R.`,prompt:`What type of angle is ∠PQR?`,figure:{kind:`angle`,degrees:180,vertex:`Q`,arms:[`P`,`R`]},options:[{id:`a`,text:`A right angle`,why:`A right angle is a square corner of 90°. This angle has opened twice as far.`},{id:`b`,text:`An obtuse angle`,why:`Obtuse angles stop before 180°. This one has reached 180° exactly.`},{id:`c`,text:`A straight angle`},{id:`d`,text:`A reflex angle`,why:`A reflex angle is more than 180°. This one is exactly 180°.`}],answer:{kind:`choice`,correct:`c`},hints:[`The two arms point in opposite directions.`,`A half turn is 180°.`],explanation:`Correct! Ray QP and ray QR point in opposite directions, so together they make a straight line. That is a straight angle: exactly 180°.`,reteach:`When the two arms of an angle point in opposite directions they form a straight line. That angle is called a straight angle and measures 180°.`,tags:[`straight-angle`]},{id:`l2-12`,lesson:`l2`,skill:`angle-types`,difficulty:1,type:`mcq`,context:`The classroom clock shows exactly 3 o’clock.`,prompt:`What type of angle do the two hands make?`,figure:{kind:`clock`,hour:3,minute:0},options:[{id:`a`,text:`Acute`,why:`Acute angles are narrower than a square corner. These hands make a perfect square corner.`},{id:`b`,text:`Right`},{id:`c`,text:`Obtuse`,why:`Obtuse angles are wider than a square corner. The hands have not opened that far.`},{id:`d`,text:`Straight`,why:`The hands would have to point in opposite directions, as they do at 6 o’clock.`}],answer:{kind:`choice`,correct:`b`},hints:[`One hand points straight up and the other points straight to the right.`,`A quarter of a full turn is 90°.`],explanation:`Correct! At 3 o’clock the minute hand points at 12 and the hour hand points at 3. That is a quarter turn, so the hands make a right angle of 90°.`,reteach:`Straight up and straight to the right make a square corner. A square corner is a right angle, 90°.`,tags:[`real-life`,`clock`,`right-angle`]},{id:`l2-13`,lesson:`l2`,skill:`angle-naming`,difficulty:2,type:`mcq`,context:`Three rays leave point B: ray BA, ray BC and ray BD.`,prompt:`Which name describes the shaded angle?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}],highlightPair:[`A`,`C`]},options:[{id:`a`,text:`∠ABC`},{id:`b`,text:`∠BAC`,why:`This puts the vertex at A, but all three rays meet at B.`},{id:`c`,text:`∠ABD`,why:`That is the wider angle, from ray BA all the way round to ray BD.`},{id:`d`,text:`∠B`,why:`Three different angles sit at B, so ∠B does not say which one you mean.`}],answer:{kind:`choice`,correct:`a`},hints:[`The vertex letter always goes in the middle.`,`Name the two arms of the shaded angle: they run towards A and towards C.`],explanation:`Correct! The shaded angle sits between ray BA and ray BC, and the vertex is B, so it is ∠ABC. You could also write ∠CBA.`,reteach:`Write the arm point, then the vertex, then the other arm point. Here that is A, then B, then C, giving ∠ABC.`,tags:[`three-letter`]},{id:`l2-14`,lesson:`l2`,skill:`angle-naming`,difficulty:2,type:`mcq`,context:`The same three rays leave point B.`,prompt:`Which name describes the shaded angle now?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}],highlightPair:[`C`,`D`]},options:[{id:`a`,text:`∠CBD`},{id:`b`,text:`∠CDB`,why:`The middle letter must be the vertex, and the rays meet at B, not at D.`},{id:`c`,text:`∠ABC`,why:`That is the angle on the other side of ray BC, next to ray BA.`},{id:`d`,text:`∠BCD`,why:`This puts the vertex at C, but C is a point out on an arm.`}],answer:{kind:`choice`,correct:`a`},hints:[`Which two rays touch the shaded region?`,`The vertex letter goes between the two arm letters.`],explanation:`Correct! The shaded angle is between ray BC and ray BD, with vertex B, so it is ∠CBD (or ∠DBC).`,reteach:`Read the shaded region: it is held between ray BC and ray BD. Put the vertex B in the middle to get ∠CBD.`,tags:[`three-letter`]},{id:`l2-15`,lesson:`l2`,skill:`angle-naming`,difficulty:2,type:`mcq`,context:`The same three rays leave point B once more.`,prompt:`Which name describes this larger shaded angle?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}],highlightPair:[`A`,`D`]},options:[{id:`a`,text:`∠ABD`},{id:`b`,text:`∠ABC`,why:`That is only the first part of the shaded region, up as far as ray BC.`},{id:`c`,text:`∠ADB`,why:`The middle letter must be the vertex. The rays meet at B, not at D.`},{id:`d`,text:`∠CBD`,why:`That is the second part of the shaded region, from ray BC onwards.`}],answer:{kind:`choice`,correct:`a`},hints:[`The shaded region stretches from one outside ray to the other.`,`Ray BC lies inside the shaded angle, so it is not one of its arms.`],explanation:`Correct! The outside arms are ray BA and ray BD, so the whole shaded angle is ∠ABD. Ray BC simply lies inside it.`,reteach:`Use only the two arms on the outside edges of the shaded region: ray BA and ray BD. With vertex B in the middle that gives ∠ABD.`,tags:[`three-letter`]},{id:`l2-16`,lesson:`l2`,skill:`angle-parts`,difficulty:2,type:`click-target`,context:`The shaded angle is ∠ABC.`,prompt:`Click the ray that is NOT one of the arms of ∠ABC.`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}],highlightPair:[`A`,`C`]},clickTargets:[{id:`ray-A`,label:`the ray towards A`},{id:`ray-C`,label:`the ray towards C`},{id:`ray-D`,label:`the ray towards D`}],answer:{kind:`click`,correct:`ray-D`},hints:[`The arms of ∠ABC are named by the outside letters, A and C.`,`One ray does not touch the shaded region at all.`],explanation:`Correct! The arms of ∠ABC are ray BA and ray BC. Ray BD belongs to other angles at B, such as ∠CBD and ∠ABD.`,reteach:`The outside letters of the name tell you the arms. In ∠ABC those are A and C, so ray BD is not part of this angle.`,tags:[`arms`]},{id:`l2-17`,lesson:`l2`,skill:`angle-types`,difficulty:2,type:`sort`,prompt:`Sort each measurement into the right group.`,buckets:[{id:`acute`,label:`Acute (less than 90°)`},{id:`right`,label:`Right (exactly 90°)`},{id:`obtuse`,label:`Obtuse (between 90° and 180°)`}],items:[{id:`i1`,label:`35°`,bucket:`acute`},{id:`i2`,label:`89°`,bucket:`acute`},{id:`i3`,label:`90°`,bucket:`right`},{id:`i4`,label:`91°`,bucket:`obtuse`},{id:`i5`,label:`145°`,bucket:`obtuse`},{id:`i6`,label:`178°`,bucket:`obtuse`}],answer:{kind:`sort`},hints:[`Compare every measurement with 90°.`,`Only exactly 90° counts as a right angle — 89° and 91° do not.`],explanation:`Correct! 35° and 89° are below 90°, so they are acute. Only 90° itself is a right angle. 91°, 145° and 178° are all above 90° but below 180°, so they are obtuse.`,reteach:`The boundary is sharp. Below 90° is acute, exactly 90° is right, and anything between 90° and 180° is obtuse — even 91°.`,tags:[`classify`]},{id:`l2-18`,lesson:`l2`,skill:`angle-types`,difficulty:2,type:`mcq`,context:`A pizza is shared into three equal slices. One slice is shaded.`,prompt:`What type of angle is at the pointed tip of the shaded slice?`,figure:{kind:`reallife`,variant:`pizza`,degrees:120},options:[{id:`a`,text:`Acute`,why:`A thin slice would be acute, but this slice is a full third of the pizza.`},{id:`b`,text:`Right`,why:`A right angle tip would give four equal slices, not three.`},{id:`c`,text:`Obtuse`},{id:`d`,text:`Reflex`,why:`A reflex tip would be more than half the pizza. One slice of three is less than half.`}],answer:{kind:`choice`,correct:`c`},hints:[`A whole pizza is a full turn of 360°.`,`Share 360° between three equal slices, then compare your answer with 90°.`],explanation:`Correct! Three equal slices means each tip is 360° ÷ 3 = 120°. That is more than 90° but less than 180°, so it is an obtuse angle.`,reteach:`A full turn is 360°. Three equal slices give 360° ÷ 3 = 120° each, and 120° sits between 90° and 180°, so the tip is obtuse.`,tags:[`real-life`,`obtuse`]},{id:`l2-19`,lesson:`l2`,skill:`angle-parts`,difficulty:2,type:`click-target`,prompt:`Click the arm that ray BA lies along.`,figure:{kind:`angle`,degrees:70,rotation:25,vertex:`B`,arms:[`A`,`C`]},clickTargets:[{id:`vertex`,label:`the vertex B`},{id:`arm1`,label:`the arm from B towards A`},{id:`arm2`,label:`the arm from B towards C`}],answer:{kind:`click`,correct:`arm1`},hints:[`Ray BA starts at B and travels towards A.`,`Find the letter A, then follow that arm back to the vertex.`],explanation:`Correct! Ray BA leaves the vertex B and passes through A, so it lies along the arm labelled A.`,reteach:`A ray is named endpoint first. Ray BA starts at B and heads towards A, so it is the arm that reaches point A.`,tags:[`arms`]},{id:`l2-20`,lesson:`l2`,skill:`angle-naming`,difficulty:2,type:`numeric`,prompt:`Several different angles share the same vertex. How many letters do you need in the name so everyone knows exactly which angle you mean?`,placeholder:`?`,answer:{kind:`numeric`,value:3},hints:[`One letter only names the corner, not which pair of arms you chose.`,`Think of names like ∠ABC and ∠CBD.`],explanation:`Correct! You need 3 letters: one point on each arm, with the vertex letter in the middle. That is the only way to say exactly which angle you mean.`,reteach:`When more than one angle sits at a vertex, a single letter is not enough. Use 3 letters — arm, vertex, arm — such as ∠ABC.`,tags:[`three-letter`]},{id:`l2-21`,lesson:`l2`,skill:`angle-types`,difficulty:2,type:`mcq`,context:`A door has been pushed open until it sticks straight out from the wall.`,prompt:`What type of angle has the door turned through?`,figure:{kind:`reallife`,variant:`door`,degrees:90},options:[{id:`a`,text:`Acute`,why:`A door only slightly ajar would make an acute angle. This one has opened much further.`},{id:`b`,text:`Right`},{id:`c`,text:`Obtuse`,why:`The door would have to swing past the square corner, back towards the other wall.`},{id:`d`,text:`Straight`,why:`A straight angle would fold the door flat against the wall on the far side.`}],answer:{kind:`choice`,correct:`b`},hints:[`Compare the door and the wall with the corner of a book.`,`Sticking straight out means a square corner.`],explanation:`Correct! The door and the wall make a perfect square corner, so the door has turned through a right angle of 90°.`,reteach:`When a door sticks straight out from the wall it makes a square corner with it. A square corner is a right angle, 90°.`,tags:[`real-life`,`right-angle`]},{id:`l2-22`,lesson:`l2`,skill:`angle-types`,difficulty:2,type:`mcq`,context:`A pair of scissors is opened a little way to snip some paper.`,prompt:`What type of angle do the two blades make?`,figure:{kind:`reallife`,variant:`scissors`,degrees:35},options:[{id:`a`,text:`Acute`},{id:`b`,text:`Right`,why:`The blades would have to open to a full square corner, which scissors rarely do.`},{id:`c`,text:`Obtuse`,why:`Obtuse means wider than a square corner. These blades are barely open.`},{id:`d`,text:`Reflex`,why:`A reflex angle is more than a half turn. Scissors cannot open that far.`}],answer:{kind:`choice`,correct:`a`},hints:[`The pivot of the scissors is the vertex, and the blades are the arms.`,`Is the opening narrower or wider than a square corner?`],explanation:`Correct! The blades open only a small way, so the angle at the pivot is less than 90°. That makes it an acute angle.`,reteach:`The screw of the scissors is the vertex and the blades are the arms. Opened just a little, they make an acute angle, less than 90°.`,tags:[`real-life`,`acute`]},{id:`l2-23`,lesson:`l2`,skill:`angle-naming`,difficulty:2,type:`figure-choice`,prompt:`Which diagram shows ∠XYZ?`,options:[{id:`a`,figure:{kind:`angle`,degrees:65,vertex:`X`,arms:[`Y`,`Z`]},why:`Here the arms meet at X, so this diagram shows ∠YXZ.`},{id:`b`,figure:{kind:`angle`,degrees:65,vertex:`Y`,arms:[`X`,`Z`]}},{id:`c`,figure:{kind:`angle`,degrees:65,vertex:`Z`,arms:[`X`,`Y`]},why:`Here the arms meet at Z, so this diagram shows ∠XZY.`}],answer:{kind:`choice`,correct:`b`},hints:[`The middle letter of the name must be at the corner.`,`Find the diagram whose vertex is labelled Y.`],explanation:`Correct! In ∠XYZ the middle letter is Y, so the corner must be at Y with X and Z out on the arms.`,reteach:`Match the middle letter to the vertex. ∠XYZ needs its corner at Y — not at X and not at Z.`,tags:[`three-letter`]},{id:`l2-24`,lesson:`l2`,skill:`angle-types`,difficulty:2,type:`mcq`,context:`A clock shows exactly 6 o’clock.`,prompt:`What type of angle do the hands make?`,figure:{kind:`clock`,hour:6,minute:0},options:[{id:`a`,text:`Right`,why:`A right angle needs a quarter turn, as the hands make at 3 o’clock.`},{id:`b`,text:`Obtuse`,why:`Obtuse angles stop before 180°, but these hands have opened the whole way.`},{id:`c`,text:`Straight`},{id:`d`,text:`Acute`,why:`Acute angles are narrow. These two hands point in opposite directions.`}],answer:{kind:`choice`,correct:`c`},hints:[`The minute hand points at 12 and the hour hand points at 6.`,`The two hands lie in one straight line.`],explanation:`Correct! At 6 o’clock the hands point in exactly opposite directions and make one straight line, so the angle is a straight angle of 180°.`,reteach:`Opposite directions from the same centre give a straight line. That is a straight angle: exactly 180°, or half a full turn.`,tags:[`real-life`,`clock`,`straight-angle`]},{id:`l2-25`,lesson:`l2`,skill:`angle-parts`,difficulty:3,type:`error-analysis`,prompt:`A student looks at this angle and says, "It is called ∠ABC, so the vertex must be at point A." What is the mistake?`,figure:{kind:`angle`,degrees:60,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`The vertex is the middle letter, so the vertex of ∠ABC is B — the corner where the two arms meet.`},{id:`b`,text:`The angle should have been called ∠BAC instead.`,why:`∠BAC would put the corner at A, but the diagram clearly shows the arms meeting at B.`},{id:`c`,text:`The vertex is C, because C is written last.`,why:`The last letter names a point out on an arm, just as the first letter does.`},{id:`d`,text:`The student is right — the first letter always shows the vertex.`,why:`Look at the diagram: the two arms meet at B, so B must be the vertex.`}],answer:{kind:`choice`,correct:`a`},hints:[`Check the diagram first: which point is the corner?`,`In every three-letter angle name, the middle letter has a special job.`],explanation:`Correct! In a three-letter name the middle letter is always the vertex. The outside letters, A and C, are just points on the two arms.`,reteach:`Read ∠ABC as "the angle at B, between ray BA and ray BC". The middle letter is the corner every single time.`,tags:[`vertex`,`misconception`]},{id:`l2-26`,lesson:`l2`,skill:`angle-naming`,difficulty:3,type:`error-analysis`,context:`Rays BA, BC and BD all leave the point B.`,prompt:`A student names the shaded angle "∠B". Why is that not good enough here?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}],highlightPair:[`C`,`D`]},options:[{id:`a`,text:`Three different angles sit at B, so ∠B does not say which one is meant. The shaded angle must be called ∠CBD.`},{id:`b`,text:`A single letter can never be used to name an angle.`,why:`A single letter is perfectly fine when only one angle sits at that vertex.`},{id:`c`,text:`∠B is wrong because B is not the vertex.`,why:`B really is the vertex — every ray starts there. The trouble is that several angles share it.`},{id:`d`,text:`Nothing is wrong; ∠B is a good name.`,why:`∠B could mean ∠ABC, ∠CBD or ∠ABD. A name must point to exactly one angle.`}],answer:{kind:`choice`,correct:`a`},hints:[`Count how many different angles you can find with their corner at B.`,`A good name must describe one angle only.`],explanation:`Correct! At B you can find ∠ABC, ∠CBD and ∠ABD. Because ∠B could mean any of them, you must use three letters — here, ∠CBD.`,reteach:`One letter is only safe when a vertex has a single angle. With three rays at B there are three angles, so three-letter names are needed.`,tags:[`three-letter`,`misconception`]},{id:`l2-27`,lesson:`l2`,skill:`angle-types`,difficulty:3,type:`error-analysis`,context:`Ali measures an angle carefully and gets 91°.`,prompt:`He writes: "It is a right angle, because 91° is nearly 90°." What is the mistake?`,options:[{id:`a`,text:`A right angle is exactly 90°. Because 91° is greater than 90° and less than 180°, the angle is obtuse.`},{id:`b`,text:`He should have written acute.`,why:`Acute angles are less than 90°, but 91° is above 90°.`},{id:`c`,text:`He should have written straight.`,why:`A straight angle is exactly 180°, which is far bigger than 91°.`},{id:`d`,text:`He is right, because 91° is close enough to 90°.`,why:`Angle types are decided by exact rules, not by how close the number looks.`}],answer:{kind:`choice`,correct:`a`},hints:[`Write down the exact rule for a right angle.`,`Is 91° below 90°, exactly 90°, or above 90°?`],explanation:`Correct! The rule for a right angle has no "nearly" in it: it must be exactly 90°. At 91° the angle has already passed 90°, so it is obtuse.`,reteach:`Angle types follow exact rules: below 90° is acute, exactly 90° is right, and above 90° but below 180° is obtuse. 91° is obtuse.`,tags:[`classify`,`misconception`]},{id:`l2-28`,lesson:`l2`,skill:`angle-types`,difficulty:3,type:`error-analysis`,prompt:`A student says, "This is not really an angle — it is just a straight line." What is the mistake?`,figure:{kind:`angle`,degrees:180,vertex:`Q`,arms:[`P`,`R`]},options:[{id:`a`,text:`It is still an angle: two rays leave Q in opposite directions, so there is a vertex and two arms. It measures 180° and is called a straight angle.`},{id:`b`,text:`The student is right — with no corner there is no angle.`,why:`An angle does not need a pointy corner. It needs two rays that share one endpoint, and this figure has them.`},{id:`c`,text:`It should be called a reflex angle.`,why:`Reflex angles are more than 180° but less than 360°. This one is exactly 180°.`},{id:`d`,text:`It should be called two right angles.`,why:`Two right angles do add up to 180°, but this figure shows one single angle, and its name is a straight angle.`}],answer:{kind:`choice`,correct:`a`},hints:[`Go back to the definition: what exactly do you need to make an angle?`,`Look for the vertex dot in the middle of the figure.`],explanation:`Correct! Ray QP and ray QR share the endpoint Q, so this is a real angle. Because the arms point in opposite directions it has opened all the way to 180° — a straight angle.`,reteach:`Any two rays sharing an endpoint make an angle, even when they end up in a straight line. That special case is the straight angle, 180°.`,tags:[`straight-angle`,`misconception`]},{id:`l2-29`,lesson:`l2`,skill:`angle-naming`,difficulty:3,type:`sort`,context:`Rays BA, BC and BD leave point B. The shaded angle is the one between ray BA and ray BC.`,prompt:`Sort each name into the right group.`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}],highlightPair:[`A`,`C`]},buckets:[{id:`ok`,label:`Names the shaded angle`},{id:`no`,label:`Does not name the shaded angle`}],items:[{id:`n1`,label:`∠ABC`,bucket:`ok`},{id:`n2`,label:`∠CBA`,bucket:`ok`},{id:`n3`,label:`∠B`,bucket:`no`},{id:`n4`,label:`∠BAC`,bucket:`no`},{id:`n5`,label:`∠ABD`,bucket:`no`},{id:`n6`,label:`∠CBD`,bucket:`no`}],answer:{kind:`sort`},hints:[`The vertex letter must sit in the middle, and it must be B.`,`The two outside letters must be A and C, in either order.`],explanation:`Correct! ∠ABC and ∠CBA both describe the shaded angle, because you may read the arms in either order. ∠B is unclear with three rays at B, ∠BAC puts the vertex at A, and ∠ABD and ∠CBD are different angles.`,reteach:`Check two things for every name: is the middle letter B, and are the outside letters A and C? Only ∠ABC and ∠CBA pass both tests.`,tags:[`three-letter`]},{id:`l2-30`,lesson:`l2`,skill:`angle-types`,difficulty:3,type:`mcq`,context:`The arc shows which angle we mean. It sweeps the long way round, past the straight-line position.`,prompt:`What type of angle is marked here?`,figure:{kind:`angle`,degrees:240,vertex:`B`,arms:[`A`,`C`]},options:[{id:`a`,text:`Obtuse`,why:`Obtuse angles stop before 180°. This arc has already swept past a straight line.`},{id:`b`,text:`Straight`,why:`A straight angle is exactly 180°, so its arc would stop half way round.`},{id:`c`,text:`Reflex`},{id:`d`,text:`A complete turn`,why:`A complete turn is 360°, where the arc comes right back to where it started.`}],answer:{kind:`choice`,correct:`c`},hints:[`Follow the arc with your finger. Does it pass the half-way, straight-line position?`,`Reflex angles are bigger than 180° but smaller than 360°.`],explanation:`Correct! The arc travels more than half way round but not all the way, so the marked angle is between 180° and 360°. That is a reflex angle.`,reteach:`A reflex angle is the big angle on the outside — more than 180° but less than 360°. The arc tells you which of the two angles is meant.`,tags:[`reflex`]},{id:`l2-31`,lesson:`l2`,skill:`angle-parts`,difficulty:3,type:`numeric`,context:`Rays BA, BC and BD leave point B. ∠ABC measures 40° and ∠CBD measures 55°.`,prompt:`How many degrees is ∠ABD?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:40},{name:`D`,deg:95}]},unit:`°`,placeholder:`?`,answer:{kind:`numeric`,value:95},hints:[`The arms of ∠ABD are ray BA and ray BD, and ray BC lies inside it.`,`The two smaller angles sit side by side with no gap and no overlap.`],explanation:`Correct! Ray BC splits ∠ABD into ∠ABC and ∠CBD, so 40° + 55° = 95°.`,reteach:`Ray BC lies between ray BA and ray BD, so ∠ABC and ∠CBD join together to make ∠ABD. Add them: 40° + 55° = 95°.`,tags:[`arms`,`reasoning`]},{id:`l2-32`,lesson:`l2`,skill:`angle-types`,difficulty:3,type:`figure-choice`,prompt:`Which picture shows an obtuse angle?`,options:[{id:`a`,figure:{kind:`reallife`,variant:`ramp`,degrees:35},why:`The ramp meets the ground at less than 90°, so that angle is acute.`},{id:`b`,figure:{kind:`reallife`,variant:`road`,degrees:125}},{id:`c`,figure:{kind:`reallife`,variant:`scissors`,degrees:80},why:`The blades are still inside a square corner, so that angle is acute too.`}],answer:{kind:`choice`,correct:`b`},hints:[`Picture a square corner sitting inside each marked angle.`,`Obtuse means the angle has opened past a square corner but has not become a straight line.`],explanation:`Correct! At the road junction the marked angle has opened past a square corner but is not yet a straight line, so it is obtuse. The ramp and the scissors both make acute angles.`,reteach:`Compare each marked angle with a square corner. Only the road junction opens wider than 90°, so only it is obtuse.`,tags:[`real-life`,`obtuse`]},{id:`l2-33`,lesson:`l2`,skill:`angle-parts`,difficulty:3,type:`click-target`,context:`This angle is called ∠MON.`,prompt:`Click the arm that ray ON lies along.`,figure:{kind:`angle`,degrees:90,rotation:35,vertex:`O`,arms:[`M`,`N`]},clickTargets:[{id:`vertex`,label:`the vertex O`},{id:`arm1`,label:`the arm from O towards M`},{id:`arm2`,label:`the arm from O towards N`}],answer:{kind:`click`,correct:`arm2`},hints:[`A ray is named endpoint first, so ray ON starts at O.`,`Find the letter N, then follow that arm back to the corner.`],explanation:`Correct! Ray ON starts at the vertex O and travels towards N, so it is the arm labelled N. The small square also tells you ∠MON is exactly 90°.`,reteach:`Do not be fooled by the tilt. Ray ON always begins at O and heads for N, so it lies along the arm that reaches point N.`,tags:[`arms`]},{id:`l2-34`,lesson:`l2`,skill:`angle-naming`,difficulty:3,type:`mcq`,context:`Three paths leave a signpost at point J: one to the Kiosk (K), one to the Lake (L) and one to the Museum (M). The shaded angle is the one walkers turn through to go from the Kiosk path to the Lake path.`,prompt:`Which name describes the shaded angle exactly?`,figure:{kind:`multi-angle`,vertex:`J`,rays:[{name:`K`,deg:0},{name:`L`,deg:70},{name:`M`,deg:135}],highlightPair:[`K`,`L`]},options:[{id:`a`,text:`∠KJL`},{id:`b`,text:`∠JKL`,why:`This puts the vertex at K, but all three paths meet at the signpost J.`},{id:`c`,text:`∠J`,why:`Three paths meet at J, so ∠J could mean ∠KJL, ∠LJM or ∠KJM.`},{id:`d`,text:`∠KLJ`,why:`The middle letter must be the vertex, and here that letter is L, not J.`}],answer:{kind:`choice`,correct:`a`},hints:[`The signpost is the vertex, so its letter belongs in the middle.`,`The two arms of the shaded angle head towards K and towards L.`],explanation:`Correct! The vertex J goes in the middle and the two arm points go outside, giving ∠KJL (or ∠LJK). A one-letter name will not work, because three paths meet at J.`,reteach:`Build the name in order: arm point, vertex, arm point. Here that is K, then J, then L, so the angle is ∠KJL.`,tags:[`real-life`,`three-letter`]}]})),Va,Ha=o((()=>{Va=[{id:`l3-01`,lesson:`l3`,skill:`protractor-read`,difficulty:1,type:`mcq`,prompt:`What unit do we use to measure the size of an angle?`,options:[{id:`a`,text:`Degrees, written with a small circle like this: 45°`},{id:`b`,text:`Centimetres, written cm`,why:`Centimetres measure length, not how far something has turned.`},{id:`c`,text:`Grams, written g`,why:`Grams measure mass. An angle has no weight.`},{id:`d`,text:`Litres, written l`,why:`Litres measure how much liquid fits in a container.`}],answer:{kind:`choice`,correct:`a`},hints:[`An angle tells you how far one arm has turned away from the other.`,`The unit has a tiny raised circle as its symbol.`],explanation:`Correct! Angles are measured in degrees, and we write the degree symbol ° after the number, like 45°.`,reteach:`Length uses centimetres, mass uses grams, but the amount of turn in an angle uses degrees. The symbol ° is written just after the number: 45°.`,tags:[`vocabulary`]},{id:`l3-02`,lesson:`l3`,skill:`protractor-read`,difficulty:1,type:`mcq`,prompt:`Which part of the protractor must sit exactly on the vertex of the angle?`,options:[{id:`a`,text:`The centre point — the small cross in the middle of the straight edge`},{id:`b`,text:`The 90° mark at the top`,why:`The 90° mark is only a number on the scale. It is not the part you line up.`},{id:`c`,text:`The curved outside edge`,why:`The curved edge carries the numbers. The vertex belongs at the centre instead.`},{id:`d`,text:`The left-hand end of the baseline`,why:`The end of the baseline is where a scale starts at 0, not where the vertex goes.`}],answer:{kind:`choice`,correct:`a`},hints:[`The vertex is the corner where the two arms meet.`,`Look for the little cross in the middle of the flat edge of the protractor.`],explanation:`Correct! The centre point goes on the vertex. If the centre is even slightly off the corner, every reading afterwards will be wrong.`,reteach:`A protractor has three key parts: the centre point in the middle of the flat edge, the baseline (the flat edge itself) and the two scales of numbers. The centre point always sits on the vertex.`,tags:[`protractor-parts`]},{id:`l3-03`,lesson:`l3`,skill:`protractor-read`,difficulty:1,type:`numeric`,prompt:`The lower arm lies along the baseline at the 0 of the inner scale. What is the measure of this angle?`,figure:{kind:`protractor`,degrees:40,rotation:0},answer:{kind:`numeric`,value:40},unit:`°`,placeholder:`?`,hints:[`Start at the 0 on the arm that lies along the baseline, then count round to the other arm.`,`The angle is smaller than a right angle, so your answer must be less than 90.`],explanation:`Correct! The arm crosses the inner scale at 40, so the angle measures 40°.`,reteach:`Find the scale that starts at 0 on the arm lying along the baseline. Here that is the inner scale, so follow the inner numbers round to the second arm: 40°.`,tags:[`inner-scale`]},{id:`l3-04`,lesson:`l3`,skill:`protractor-read`,difficulty:1,type:`numeric`,prompt:`The lower arm lies along the baseline at the 0 of the inner scale. What is the measure of this angle?`,figure:{kind:`protractor`,degrees:115,rotation:0},answer:{kind:`numeric`,value:115},unit:`°`,placeholder:`?`,hints:[`The arm has passed the 90 mark, so the answer is bigger than 90.`,`Keep counting up the inner scale in tens after 90: 100, 110 …`],explanation:`Correct! The arm crosses the inner scale at 115, so the angle measures 115°.`,reteach:`The arm is past the top of the protractor, so the angle is obtuse. Carry on up the inner scale past 90 until you reach the arm: 115°.`,tags:[`inner-scale`]},{id:`l3-05`,lesson:`l3`,skill:`protractor-read`,difficulty:1,type:`click-target`,prompt:`You are about to measure this angle. Click the place where the centre point of the protractor must sit.`,figure:{kind:`angle`,degrees:55,rotation:14,vertex:`B`,arms:[`A`,`C`]},clickTargets:[{id:`vertex`,label:`the vertex at B`},{id:`arm1`,label:`the arm towards A`},{id:`arm2`,label:`the arm towards C`}],answer:{kind:`click`,correct:`vertex`},hints:[`The centre point of a protractor is the tiny cross in the middle of its flat edge.`,`It has to sit on the corner where the two arms meet.`],explanation:`Correct! The centre point sits on the vertex B, and then the baseline is turned to lie along one arm.`,reteach:`The arms tell you where to point the protractor, but the centre point always goes on the vertex — the corner where the arms meet.`,tags:[`protractor-parts`]},{id:`l3-06`,lesson:`l3`,skill:`estimate`,difficulty:1,type:`mcq`,prompt:`Estimate first: is this angle closer to 30° or to 80°?`,figure:{kind:`angle`,degrees:30,rotation:8,vertex:`V`},options:[{id:`a`,text:`Closer to 30°`},{id:`b`,text:`Closer to 80°`,why:`An 80° angle is almost a square corner. This opening is much narrower than that.`}],answer:{kind:`choice`,correct:`a`},hints:[`Picture a right angle (a square corner). 80° is nearly a square corner.`,`This opening is only about a third of a right angle.`],explanation:`Correct! The opening is narrow — nowhere near a square corner — so 30° is the sensible estimate.`,reteach:`Compare every angle with 90° first. This one is far smaller than a square corner, so an estimate of 80° would be much too big. 30° fits.`,tags:[`estimation`]},{id:`l3-07`,lesson:`l3`,skill:`estimate`,difficulty:1,type:`mcq`,prompt:`Compare this angle with a right angle. What can you say about it?`,figure:{kind:`angle`,degrees:110,rotation:0,vertex:`V`},options:[{id:`a`,text:`It is smaller than a right angle.`,why:`A right angle is a square corner. This opening is wider than that, not narrower.`},{id:`b`,text:`It is exactly a right angle.`,why:`A right angle would be drawn with a small square, and the arms would make a perfect corner.`},{id:`c`,text:`It is bigger than a right angle.`}],answer:{kind:`choice`,correct:`c`},hints:[`Hold up the corner of a page or a book. That corner is exactly 90°.`,`Does this angle open wider than that corner, or less?`],explanation:`Correct! The arms open wider than a square corner, so the angle is more than 90°. It is an obtuse angle.`,reteach:`Use 90° as your ruler for the eyes. If the opening is wider than a square corner the angle is more than 90°; if it is narrower it is less than 90°.`,tags:[`estimation`]},{id:`l3-08`,lesson:`l3`,skill:`classify-measure`,difficulty:1,type:`mcq`,prompt:`An angle measures 132°. What type of angle is it?`,options:[{id:`a`,text:`Acute`,why:`Acute angles are smaller than 90°, and 132 is bigger than 90.`},{id:`b`,text:`Right`,why:`A right angle is exactly 90°, not 132°.`},{id:`c`,text:`Obtuse`},{id:`d`,text:`Straight`,why:`A straight angle is exactly 180°. 132° has not opened that far.`}],answer:{kind:`choice`,correct:`c`},hints:[`Check the two fences first: 90° and 180°.`,`Is 132 between 90 and 180?`],explanation:`Correct! 132° is greater than 90° and less than 180°, so it is an obtuse angle.`,reteach:`Sort every measurement with the same two fences. Less than 90° is acute, exactly 90° is right, between 90° and 180° is obtuse, exactly 180° is straight. 132 sits between 90 and 180, so it is obtuse.`,tags:[`classify`]},{id:`l3-09`,lesson:`l3`,skill:`classify-measure`,difficulty:1,type:`mcq`,prompt:`An angle measures 47°. What type of angle is it?`,options:[{id:`a`,text:`Acute`},{id:`b`,text:`Right`,why:`A right angle is exactly 90°. 47° is only about half of that.`},{id:`c`,text:`Obtuse`,why:`Obtuse angles are bigger than 90°, but 47 is smaller than 90.`},{id:`d`,text:`Straight`,why:`A straight angle is exactly 180°, which is a flat line.`}],answer:{kind:`choice`,correct:`a`},hints:[`Compare 47 with 90.`,`Angles smaller than a right angle have a special name.`],explanation:`Correct! 47° is greater than 0° and less than 90°, so it is an acute angle.`,reteach:`Acute angles are the narrow ones: bigger than 0° but smaller than 90°. 47° is well under 90°, so it is acute.`,tags:[`classify`]},{id:`l3-10`,lesson:`l3`,skill:`classify-measure`,difficulty:1,type:`numeric`,prompt:`How many degrees are there in a straight angle?`,figure:{kind:`angle`,degrees:180,rotation:0,vertex:`B`,arms:[`A`,`C`]},answer:{kind:`numeric`,value:180},unit:`°`,placeholder:`?`,hints:[`The two arms make one flat straight line.`,`It is the same as two right angles put together.`],explanation:`Correct! A straight angle is 180°, which is exactly two right angles side by side.`,reteach:`When the arms open until they form a straight line, the angle is 180°. Two right angles of 90° join to make it: 90 + 90 = 180.`,tags:[`ranges`]},{id:`l3-11`,lesson:`l3`,skill:`classify-measure`,difficulty:1,type:`sort`,prompt:`Sort each measurement into the right group.`,buckets:[{id:`acute`,label:`Acute (less than 90°)`},{id:`right`,label:`Right (exactly 90°)`},{id:`obtuse`,label:`Obtuse (more than 90°, less than 180°)`}],items:[{id:`i1`,label:`30°`,bucket:`acute`},{id:`i2`,label:`90°`,bucket:`right`},{id:`i3`,label:`115°`,bucket:`obtuse`},{id:`i4`,label:`65°`,bucket:`acute`},{id:`i5`,label:`175°`,bucket:`obtuse`}],answer:{kind:`sort`},hints:[`Compare every number with 90 first.`,`Only a measurement of exactly 90 goes in the right-angle group.`],explanation:`Correct! 30° and 65° are below 90°, 90° is exactly a right angle, and 115° and 175° are between 90° and 180°.`,reteach:`Say the number out loud and ask two questions: Is it under 90? Then acute. Is it exactly 90? Then right. Is it between 90 and 180? Then obtuse.`,tags:[`classify`]},{id:`l3-12`,lesson:`l3`,skill:`angle-facts`,difficulty:1,type:`numeric`,prompt:`How many right angles fit into one complete turn?`,answer:{kind:`numeric`,value:4},placeholder:`?`,hints:[`A complete turn is 360°, and a right angle is 90°.`,`Count in 90s: 90, 180, 270 …`],explanation:`Correct! Four right angles make a complete turn, because 90 + 90 + 90 + 90 = 360.`,reteach:`Think of the corners where two walls meet the floor of a square room. Going all the way round takes four square corners: 4 × 90° = 360°.`,tags:[`turns`]},{id:`l3-13`,lesson:`l3`,skill:`angle-facts`,difficulty:1,type:`mcq`,prompt:`A right angle is what part of a complete turn?`,options:[{id:`a`,text:`A quarter of a complete turn`},{id:`b`,text:`A half of a complete turn`,why:`Half a complete turn is 180°, which is a straight angle, not a right angle.`},{id:`c`,text:`A third of a complete turn`,why:`A third of 360° is 120°, which is obtuse.`},{id:`d`,text:`The whole turn`,why:`A whole turn is 360° — all the way round back to the start.`}],answer:{kind:`choice`,correct:`a`},hints:[`A complete turn is 360°.`,`What do you get when you share 360 into four equal parts?`],explanation:`Correct! 360 ÷ 4 = 90, so a right angle is a quarter of a complete turn.`,reteach:`A complete turn is 360°. Split it into four equal parts and each part is 90°, a right angle. That is why a quarter turn and a right angle are the same size.`,tags:[`turns`]},{id:`l3-14`,lesson:`l3`,skill:`protractor-read`,difficulty:2,type:`numeric`,prompt:`This time one arm points LEFT along the baseline. What is the measure of the angle?`,figure:{kind:`protractor`,degrees:50,rotation:180},answer:{kind:`numeric`,value:50},unit:`°`,placeholder:`?`,hints:[`Find the scale that shows 0 at the left-hand end of the baseline — that is the outer scale.`,`The angle is narrower than a square corner, so your answer must be less than 90.`],explanation:`Correct! The arm lying on the baseline points left, so you read the outer scale, which gives 50°.`,reteach:`Always start counting from the 0 that sits on your own arm. Here the arm points left, so the outer scale starts at 0 there and gives 50°. The inner scale would say 130°, which is far too big for such a narrow opening.`,tags:[`outer-scale`]},{id:`l3-15`,lesson:`l3`,skill:`protractor-read`,difficulty:2,type:`numeric`,prompt:`One arm points LEFT along the baseline. What is the measure of the angle?`,figure:{kind:`protractor`,degrees:125,rotation:180},answer:{kind:`numeric`,value:125},unit:`°`,placeholder:`?`,hints:[`Read the scale that starts at 0 on the left-hand end of the baseline.`,`The opening is wider than a square corner, so the answer is more than 90.`],explanation:`Correct! Reading the outer scale from the left-hand 0 gives 125°.`,reteach:`Estimate first: this opening is clearly wider than a right angle. Now read from the 0 that sits on your arm — the outer scale — and you get 125°, which matches the estimate.`,tags:[`outer-scale`]},{id:`l3-16`,lesson:`l3`,skill:`protractor-read`,difficulty:2,type:`numeric`,prompt:`One arm lies along the baseline at the 0 of the inner scale. What is the measure of the angle?`,figure:{kind:`protractor`,degrees:155,rotation:0},answer:{kind:`numeric`,value:155},unit:`°`,placeholder:`?`,hints:[`The opening is almost a straight line, so expect an answer close to 180.`,`Follow the inner numbers past 90, 100, 110 … until you reach the arm.`],explanation:`Correct! The arm crosses the inner scale at 155, so the angle measures 155°.`,reteach:`The two arms are nearly in a straight line, so the angle must be a little under 180°. Counting up the inner scale gives 155°. Reading 25° from the other scale would describe a very narrow angle instead.`,tags:[`inner-scale`]},{id:`l3-17`,lesson:`l3`,skill:`protractor-read`,difficulty:2,type:`mcq`,context:`The second arm crosses the curved edge where the inner scale says 110 and the outer scale says 70.`,prompt:`Which number is the true measure of this angle?`,figure:{kind:`protractor`,degrees:70,rotation:180},options:[{id:`a`,text:`110°, from the inner scale`,why:`The inner scale starts at 0 on the RIGHT, but the arm on the baseline points left, so its numbers do not start on your arm.`},{id:`b`,text:`70°, from the outer scale`},{id:`c`,text:`180°, because the baseline is straight`,why:`180° would mean the two arms form one straight line, but here they clearly make a corner.`},{id:`d`,text:`Either one — both scales are correct`,why:`Only one scale starts at 0 on your arm, so only one reading measures this angle.`}],answer:{kind:`choice`,correct:`b`},hints:[`Look at the arm resting on the baseline. Which scale shows 0 exactly there?`,`Estimate: the opening is narrower than a square corner, so the answer should be under 90.`],explanation:`Correct! The arm on the baseline points left, so the outer scale is the one starting at 0 on that arm. The measure is 70°, and the estimate agrees because the opening is narrower than a right angle.`,reteach:`A protractor has two scales so it works from either end. Follow this rule: use the scale whose 0 sits on the arm you lined up with the baseline. Here that is the outer scale, giving 70°.`,tags:[`choose-scale`]},{id:`l3-18`,lesson:`l3`,skill:`protractor-read`,difficulty:2,type:`mcq`,prompt:`Which is the FIRST thing you should do when measuring an angle with a protractor?`,options:[{id:`a`,text:`Put the centre point of the protractor exactly on the vertex.`},{id:`b`,text:`Read the number where the second arm crosses the curved edge.`,why:`That is the last step. Reading before the protractor is lined up gives a random number.`},{id:`c`,text:`Decide whether to use the inner scale or the outer scale.`,why:`You can only choose a scale after the baseline is lying along one arm.`},{id:`d`,text:`Draw an arc between the two arms.`,why:`An arc is only a label for the angle. It does not help you measure it.`}],answer:{kind:`choice`,correct:`a`},hints:[`Think about what must be in the right place before any number can be trusted.`,`The corner comes first, the numbers come last.`],explanation:`Correct! Centre point on the vertex first, then baseline along one arm, then find where the other arm crosses, then choose the scale that starts at 0 on your arm, then read the number.`,reteach:`The order matters: (1) centre on the vertex, (2) baseline along one arm, (3) find where the other arm crosses the curved edge, (4) choose the scale that starts at 0 on your arm, (5) read the number. Reading first is the most common way to get a wrong answer.`,tags:[`steps`]},{id:`l3-19`,lesson:`l3`,skill:`estimate`,difficulty:2,type:`mcq`,prompt:`Estimate the size of this angle without measuring. Which estimate is best?`,figure:{kind:`angle`,degrees:160,rotation:0,vertex:`V`},options:[{id:`a`,text:`About 90°`,why:`A 90° angle makes a square corner. These arms are far more open than that.`},{id:`b`,text:`About 130°`,why:`Closer, but the arms are nearly in a straight line, so the angle is bigger than this.`},{id:`c`,text:`About 160°`}],answer:{kind:`choice`,correct:`c`},hints:[`The arms are almost, but not quite, in a straight line.`,`A straight line is 180°. How far short of straight is this?`],explanation:`Correct! The arms are just short of a straight line, so an estimate of about 160° is the best fit.`,reteach:`Use landmarks you know: 90° is a square corner and 180° is a straight line. This angle is much nearer to straight than to a square corner, so estimate around 160°.`,tags:[`estimation`]},{id:`l3-20`,lesson:`l3`,skill:`estimate`,difficulty:2,type:`figure-choice`,prompt:`Which diagram shows the angle that is closest to a right angle?`,options:[{id:`a`,figure:{kind:`angle`,degrees:45,rotation:0},why:`This opening is only about half a square corner — it is 45° away from 90°.`},{id:`b`,figure:{kind:`angle`,degrees:85,rotation:0}},{id:`c`,figure:{kind:`angle`,degrees:135,rotation:0},why:`This one is well past a square corner, so it is 45° away from 90° on the other side.`}],answer:{kind:`choice`,correct:`b`},hints:[`Picture the corner of a book laid on each diagram.`,`The best answer almost matches that corner, but not quite.`],explanation:`Correct! The middle angle is 85°, only 5° away from a square corner, so it is the closest to a right angle.`,reteach:`Compare each opening with a square corner. One is far too narrow, one is far too wide, and one sits almost exactly on the square corner — that is the closest to 90°.`,tags:[`estimation`]},{id:`l3-21`,lesson:`l3`,skill:`estimate`,difficulty:2,type:`mcq`,context:`A skateboard ramp rises gently from flat ground.`,prompt:`Estimate the angle between the ramp and the ground. Which estimate is best?`,figure:{kind:`reallife`,variant:`ramp`,degrees:20},options:[{id:`a`,text:`About 20°`},{id:`b`,text:`About 45°`,why:`45° is half a right angle — the ramp would be far steeper than the one drawn.`},{id:`c`,text:`About 70°`,why:`At 70° the ramp would be almost as steep as a wall, which nobody could skate up.`},{id:`d`,text:`About 90°`,why:`90° would make the ramp stand straight up like a wall.`}],answer:{kind:`choice`,correct:`a`},hints:[`A right angle would make the ramp stand straight up.`,`This slope is only a small fraction of a right angle.`],explanation:`Correct! The slope is shallow — only about a fifth of a right angle — so about 20° is the sensible estimate.`,reteach:`Estimating starts with 90°. A ramp you can walk up must be far shallower than a square corner, so the estimate has to be well under 45°. About 20° fits this drawing.`,tags:[`estimation`,`real-life`]},{id:`l3-22`,lesson:`l3`,skill:`classify-measure`,difficulty:2,type:`figure-choice`,prompt:`Which diagram shows an obtuse angle?`,options:[{id:`a`,figure:{kind:`angle`,degrees:55,rotation:0},why:`This opening is narrower than a square corner, so it is acute.`},{id:`b`,figure:{kind:`angle`,degrees:90,rotation:0},why:`The small square shows exactly 90°, which is a right angle, not an obtuse one.`},{id:`c`,figure:{kind:`angle`,degrees:130,rotation:0}}],answer:{kind:`choice`,correct:`c`},hints:[`Obtuse angles are wider than a square corner but not yet a straight line.`,`Rule out the one with the small square first — that mark always means 90°.`],explanation:`Correct! That angle is 130°: wider than 90° but still less than 180°, so it is obtuse.`,reteach:`Obtuse means "more than a right angle, less than a straight line". Check each diagram against a square corner: narrower is acute, exactly matching is right, wider is obtuse.`,tags:[`classify`]},{id:`l3-23`,lesson:`l3`,skill:`classify-measure`,difficulty:2,type:`sort`,context:`Each angle below was measured with a protractor in a real place.`,prompt:`Sort each measured angle into the right group.`,buckets:[{id:`acute`,label:`Acute`},{id:`right`,label:`Right`},{id:`obtuse`,label:`Obtuse`}],items:[{id:`i1`,label:`Open scissors: 35°`,bucket:`acute`},{id:`i2`,label:`Door in a corner: 90°`,bucket:`right`},{id:`i3`,label:`Deckchair back: 120°`,bucket:`obtuse`},{id:`i4`,label:`Ladder against a wall: 78°`,bucket:`acute`},{id:`i5`,label:`Road junction: 145°`,bucket:`obtuse`},{id:`i6`,label:`Laptop lid: 89°`,bucket:`acute`}],answer:{kind:`sort`},hints:[`Ignore the object and look only at the number of degrees.`,`Be careful with 89° and 90° — one degree changes the group.`],explanation:`Correct! 35°, 78° and 89° are all under 90° so they are acute; only the 90° door is a right angle; 120° and 145° are between 90° and 180° so they are obtuse.`,reteach:`The object does not matter — only the measurement does. 89° is still acute, because acute means anything below 90°. Only exactly 90° counts as a right angle.`,tags:[`classify`,`real-life`]},{id:`l3-24`,lesson:`l3`,skill:`angle-facts`,difficulty:2,type:`numeric`,context:`A, B and D lie on one straight line, and ray BC starts at B.`,prompt:`Angle ABC is 60°. How many degrees is angle CBD?`,figure:{kind:`multi-angle`,vertex:`B`,rays:[{name:`A`,deg:0},{name:`C`,deg:60},{name:`D`,deg:180}],highlightPair:[`A`,`C`],showValue:!0},answer:{kind:`numeric`,value:120},unit:`°`,placeholder:`?`,hints:[`The two angles together fill the straight line from A to D.`,`Angles on a straight line always add up to 180°.`],explanation:`Correct! Angles on a straight line add to 180°, so angle CBD = 180 − 60 = 120°.`,reteach:`A straight line is a 180° angle. Ray BC cuts it into two pieces, so the two pieces must add to 180. Take the piece you know away from 180: 180 − 60 = 120°.`,tags:[`straight-line`]},{id:`l3-25`,lesson:`l3`,skill:`angle-facts`,difficulty:2,type:`numeric`,context:`The clock shows exactly 3 o'clock.`,prompt:`What is the angle between the hour hand and the minute hand?`,figure:{kind:`clock`,hour:3,minute:0},answer:{kind:`numeric`,value:90},unit:`°`,placeholder:`?`,hints:[`A whole clock face is 360°, split into 12 equal hour steps.`,`Each hour step is 360 ÷ 12 = 30°. How many steps between the hands?`],explanation:`Correct! The hands are three hour-steps apart, and 3 × 30 = 90°, so the hands make a right angle.`,reteach:`Every hour mark on a clock is 30° from the next one, because 360 ÷ 12 = 30. At 3 o'clock the hands are 3 marks apart: 3 × 30 = 90°.`,tags:[`clock`]},{id:`l3-26`,lesson:`l3`,skill:`angle-facts`,difficulty:2,type:`numeric`,context:`The clock shows exactly 4 o'clock.`,prompt:`What is the angle between the hour hand and the minute hand?`,figure:{kind:`clock`,hour:4,minute:0},answer:{kind:`numeric`,value:120},unit:`°`,placeholder:`?`,hints:[`One hour step on a clock face is 30°.`,`Count the hour steps from 12 round to 4.`],explanation:`Correct! The hands are four hour-steps apart, and 4 × 30 = 120°, which is an obtuse angle.`,reteach:`Count the hour marks between the two hands, then multiply by 30. From 12 to 4 is 4 marks, so 4 × 30 = 120°.`,tags:[`clock`]},{id:`l3-27`,lesson:`l3`,skill:`angle-facts`,difficulty:2,type:`mcq`,context:`The clock shows exactly 6 o'clock.`,prompt:`What type of angle do the two hands make?`,figure:{kind:`clock`,hour:6,minute:0},options:[{id:`a`,text:`An acute angle`,why:`Acute angles are under 90°, but these hands are as far apart as they can be.`},{id:`b`,text:`A right angle of 90°`,why:`A right angle happens at 3 o'clock and 9 o'clock, when the hands are three marks apart.`},{id:`c`,text:`A straight angle of 180°`},{id:`d`,text:`A complete turn of 360°`,why:`A complete turn brings a hand back to where it started, which would put both hands together.`}],answer:{kind:`choice`,correct:`c`},hints:[`Look at the shape the two hands make together.`,`Six hour steps of 30° each is how many degrees?`],explanation:`Correct! The hands point in exactly opposite directions and form one straight line: 6 × 30 = 180°, a straight angle.`,reteach:`At 6 o'clock the minute hand points at 12 and the hour hand points at 6, so they lie in a straight line. That is a straight angle of 180°.`,tags:[`clock`]},{id:`l3-28`,lesson:`l3`,skill:`protractor-read`,difficulty:3,type:`error-analysis`,context:`Leo lined the baseline up along the lower arm and then wrote down 130°.`,prompt:`What went wrong with Leo's measurement?`,figure:{kind:`protractor`,degrees:50,rotation:0},options:[{id:`a`,text:`He read the wrong scale. His arm starts at 0 on the inner scale, so the correct measure is 50°.`},{id:`b`,text:`He should have put the centre point on the end of the baseline instead of the vertex.`,why:`The centre point already belongs on the vertex — that part was done correctly.`},{id:`c`,text:`Nothing is wrong. 130° is correct.`,why:`The opening is clearly narrower than a square corner, so it cannot be 130°.`},{id:`d`,text:`He should have measured the arms with a ruler first.`,why:`The length of the arms has nothing to do with the size of the angle.`}],answer:{kind:`choice`,correct:`a`},hints:[`Estimate the angle by eye. Is it bigger or smaller than a square corner?`,`Both numbers sit at the same mark: one scale reads 50 and the other reads 130.`],explanation:`Correct! Leo used the scale that starts at the far end of the baseline. His own arm sits on the 0 of the inner scale, so the true measure is 50°. Notice that 50 + 130 = 180 — the two scales always add to 180 at the same mark.`,reteach:`Estimating first catches this mistake every time. The opening is much narrower than a square corner, so 130° is impossible. Use the scale whose 0 lies on your own arm: that gives 50°.`,tags:[`wrong-scale`]},{id:`l3-29`,lesson:`l3`,skill:`protractor-read`,difficulty:3,type:`error-analysis`,context:`This angle measures 50°. One arm has been drawn much longer than the other.`,prompt:`Priya says, "If we made arm PR as long as arm PQ, the angle would grow bigger than 50°." What is the mistake?`,figure:{kind:`angle`,degrees:50,rotation:10,vertex:`P`,arms:[`Q`,`R`],armLengths:[98,46]},options:[{id:`a`,text:`The length of the arms never changes the angle. An angle measures how far one arm has turned from the other, so it would still be 50°.`},{id:`b`,text:`She is right — longer arms always make a bigger angle.`,why:`Arms are rays, so they could be drawn forever. If length changed the angle, no angle would have a fixed size.`},{id:`c`,text:`The angle would become 100°, because the arm is twice as long.`,why:`Doubling a length does not double an angle. The two measurements are not connected at all.`},{id:`d`,text:`The angle cannot be measured until both arms are the same length.`,why:`You can measure this angle straight away — just extend the short arm on paper if it does not reach the scale.`}],answer:{kind:`choice`,correct:`a`},hints:[`Think about what an angle actually measures: turn, or length?`,`The arms of an angle are rays — they could go on forever without changing the corner.`],explanation:`Correct! An angle measures the amount of turn between the arms. Stretching an arm moves its end further away but leaves the opening at the vertex exactly the same, so it stays 50°.`,reteach:`Arm length and angle size are completely separate. If a short arm does not reach the protractor scale, just extend it with a ruler — the measurement will not change, because the turn at the vertex has not changed.`,tags:[`arm-length`]},{id:`l3-30`,lesson:`l3`,skill:`protractor-read`,difficulty:3,type:`numeric`,prompt:`One arm points LEFT along the baseline. Read the correct scale and give the measure of the angle.`,figure:{kind:`protractor`,degrees:145,rotation:180},answer:{kind:`numeric`,value:145},unit:`°`,placeholder:`?`,hints:[`Estimate first: the arms are close to a straight line, so expect an answer near 180.`,`Read from the 0 that sits on the arm along the baseline

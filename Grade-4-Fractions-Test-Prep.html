:root{--ink:#3B2418;--bg:#CDEFE3;--bg2:#B6E4D3;--paper:#fff;--butter:#FFC93C;--blue:#3D7DD8;--straw:#F06A9B;--tang:#FF8A3D;--ok:#138A36;--bad:#B3001B;--amber:#FFB000;--soft:#6b5446;--sh:5px 5px 0 var(--ink)}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,.ttl{font-family:Poppins,Lexend,sans-serif;font-weight:800;line-height:1.15;margin:0}
button,input{font:inherit;color:inherit}
#app{min-height:100vh;display:flex;flex-direction:column}
.awning{height:22px;background:repeating-linear-gradient(90deg,var(--straw) 0 44px,#fff 44px 88px);border-bottom:3px solid var(--ink)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--bg2);border-bottom:3px solid var(--ink)}
.topbar .logo-sm{height:40px;width:auto;display:block;cursor:pointer}
.crumb{flex:1;font-family:Poppins;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px}
.ibtn{border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);height:42px;min-width:42px;padding:0 10px;font-family:Poppins;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ibtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ibtn svg{width:20px;height:20px}
.ibtn.off{background:#eee;color:#8a6f5f}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:22px 18px 30px}
footer{text-align:center;font-size:13px;padding:10px;border-top:3px solid var(--ink);background:var(--bg2)}
.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--sh);padding:20px}
.btn{border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 18px;min-height:50px;font-family:Poppins;font-weight:700;font-size:17px;cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.y{background:var(--butter)}.btn.b{background:var(--blue);color:#fff}.btn.p{background:var(--straw)}.btn.k{background:var(--ink);color:#fff}.btn.o{background:var(--tang)}
.btn.big{font-size:22px;padding:14px 30px;min-height:62px}
.btn.sm{font-size:14px;min-height:40px;padding:6px 12px;box-shadow:3px 3px 0 var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.th{font-family:system-ui,'Leelawadee UI','Thonburi',sans-serif;color:#7a3e12;font-size:.86em;display:block;margin-top:2px}
.hidden{display:none!important}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.05;font-weight:600}
.fr>.nu{border-bottom:.09em solid currentColor;padding:0 .18em .04em;min-width:.9em;text-align:center}
.fr>.de{padding:.04em .18em 0;text-align:center}
.mx{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}
.mx>.mw{font-size:1.45em;font-weight:700;margin-right:.04em;line-height:1}
.qb{display:inline-block;min-width:1.3em;height:1.25em;border:.1em solid var(--ink);background:#FFF3C4;text-align:center;line-height:1.1;font-weight:700;color:var(--bad);vertical-align:middle}
.fr .qb{min-width:1.1em;height:1.1em;font-size:.95em;line-height:1}
.nowrap{white-space:nowrap}
/* start */
.start{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center}
.start .logo-big{width:min(330px,80%);height:auto;display:block;margin-bottom:12px}
.start h1{font-size:clamp(34px,5vw,58px)}
.start .sub{font-family:Poppins;font-weight:700;font-size:22px;background:var(--butter);display:inline-block;border:3px solid var(--ink);padding:4px 12px;margin:12px 0 18px;box-shadow:3px 3px 0 var(--ink)}
.start label{font-weight:600;display:block;margin-bottom:6px}
.txt{border:3px solid var(--ink);padding:10px 12px;font-size:20px;width:100%;max-width:340px;background:#fff}
.hero{background:#fff;border:3px solid var(--ink);box-shadow:var(--sh);padding:12px}
.hero svg{display:block;width:100%;height:auto}
/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h2{font-size:clamp(26px,3.4vw,38px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tile{background:#fff;border:3px solid var(--ink);box-shadow:var(--sh);display:flex;flex-direction:column}
.tile .hd{padding:10px 14px;border-bottom:3px solid var(--ink);display:flex;gap:10px;align-items:center;min-height:74px}
.tile .num{font-family:Poppins;font-weight:800;font-size:30px;line-height:1;min-width:36px}
.tile .nm{font-family:Poppins;font-weight:700;font-size:17px;line-height:1.2}
.tile .bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.meter{height:14px;border:2.5px solid var(--ink);background:#fff;position:relative}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.tile .st{font-size:14px;color:var(--soft)}
.tile .acts{display:flex;gap:10px;margin-top:auto}
.tile .acts .btn{flex:1;min-height:46px;font-size:16px;padding:8px}
.sect{font-size:24px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sect:before{content:"";width:18px;height:18px;background:var(--straw);border:3px solid var(--ink)}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.ex{border:3px solid var(--ink);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;background:#fff;font:inherit}
.ex:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.ex:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.ex b{font-family:Poppins;font-size:21px;font-weight:800}
.ex span{font-size:14px}
/* learn */
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dots{display:flex;gap:6px}.dots i{width:16px;height:16px;border:2.5px solid var(--ink);background:#fff}.dots i.on{background:var(--ink)}
.lcard{display:grid;grid-template-columns:1fr 1.45fr;gap:26px;align-items:start;min-height:420px}
.lcard h2{font-size:32px;margin-bottom:12px}
.lcard p{font-size:23px;margin:0 0 12px;line-height:1.6}
.picbox{background:#fff;border:3px solid var(--ink);padding:14px;min-height:120px}
.picbox svg{width:100%;height:auto;display:block}
.picbox+.picbox{margin-top:12px}
.rule{background:var(--butter);border:3px solid var(--ink);box-shadow:var(--sh);padding:18px 22px;position:relative}
.rule .tag{position:absolute;top:-16px;left:16px;background:var(--ink);color:#fff;font-family:Poppins;font-weight:700;font-size:14px;padding:3px 10px;letter-spacing:.04em}
.rule ul{margin:6px 0 0;padding-left:22px}.rule li{font-size:20px;margin:6px 0}
.wsteps{list-style:none;padding:0;margin:0;counter-reset:s}
.wsteps li{border:2.5px solid var(--ink);background:#fff;padding:10px 12px 10px 54px;margin:0 0 10px;position:relative;counter-increment:s;font-size:18px}
.wsteps li:before{content:counter(s);position:absolute;left:0;top:0;bottom:0;width:42px;background:var(--butter);border-right:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:Poppins;font-weight:800;font-size:20px}
.wsteps li b{font-family:Poppins;display:block;font-size:16px}
.wsteps li.ans{background:#E7F6EC}.wsteps li.ans:before{background:var(--ok);color:#fff}
/* question */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qtop .prog{font-family:Poppins;font-weight:700}
.pbar{display:flex;gap:4px;flex:1;min-width:180px;max-width:520px}
.pbar i{flex:1;height:14px;border:2px solid var(--ink);background:#fff}
.pbar i.ok{background:var(--ok)}.pbar i.no{background:var(--bad)}.pbar i.cur{background:var(--butter)}
.qcard{background:#fff;border:3px solid var(--ink);box-shadow:var(--sh);padding:20px 22px}
.qnum{display:inline-block;background:var(--ink);color:#fff;font-family:Poppins;font-weight:800;padding:2px 12px;font-size:18px;margin-bottom:10px}
.qtxt{font-size:22px;margin:0 0 6px}
.qeq{font-size:34px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:8px 0 6px}
.qeq .fr{font-size:.92em}
.ansrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.ansrow .lbl{font-family:Poppins;font-weight:700;font-size:20px}
.fbox{display:inline-flex;align-items:center;gap:8px}
.fbox input{border:3px solid var(--ink);background:#fff;text-align:center;font-weight:700;font-family:Lexend;outline:none;padding:0;caret-color:var(--blue)}
.fbox input.w{width:66px;height:82px;font-size:44px}
.fbox .stk{display:flex;flex-direction:column;align-items:center;gap:6px}
.fbox .stk input{width:66px;height:52px;font-size:28px}
.fbox .stk .ln{width:76px;height:4px;background:var(--ink)}
.fbox input.single{width:96px;height:62px;font-size:32px}
.fbox input:focus,.fbox input.act{background:#FFF3C4;box-shadow:inset 0 0 0 3px var(--blue)}
.fbox .unit{font-size:20px;font-weight:600}
.fbox.locked input{background:#f4f1ee}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.opt{border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;min-height:70px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;cursor:pointer;text-align:left}
.opt .k{font-family:Poppins;font-weight:800;font-size:16px;width:32px;height:32px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none;background:var(--butter)}
.opt:hover{transform:translate(-1px,-1px)}
.opt.sel{background:#DCE9FB;box-shadow:inset 0 0 0 3px var(--blue),4px 4px 0 var(--ink)}
.opt.right{background:#E7F6EC;box-shadow:inset 0 0 0 4px var(--ok),4px 4px 0 var(--ink)}
.opt.wrong{background:#FBE3E7;box-shadow:inset 0 0 0 4px var(--bad),4px 4px 0 var(--ink)}
.opt .mk{margin-left:auto;font-family:Poppins;font-size:14px;font-weight:800;padding:2px 8px;color:#fff}
.opt.right .mk{background:var(--ok)}.opt.wrong .mk{background:var(--bad)}
.opt[disabled]{cursor:default}
.tfrow .opt{justify-content:center;font-family:Poppins;font-weight:800;font-size:26px}
.qacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.qacts .sp{flex:1}
.hintbox{margin-top:14px;border:3px solid var(--ink);background:#FFF3C4;padding:12px 14px;font-size:19px}
.hintbox b{font-family:Poppins}
.fb{margin-top:18px;border:3px solid var(--ink);padding:0;background:#fff}
.fb .lab{display:flex;align-items:center;gap:12px;padding:10px 14px;font-family:Poppins;font-weight:800;font-size:22px;color:#fff;border-bottom:3px solid var(--ink)}
.fb.ok .lab{background:var(--ok)}.fb.no .lab{background:var(--bad)}.fb.retry .lab{background:var(--amber);color:var(--ink)}
.fb .body{padding:14px}
.fb .cmp{display:flex;gap:28px;flex-wrap:wrap;font-size:22px;margin-bottom:12px;align-items:center}
.fb .cmp b{font-family:Poppins;font-size:15px;display:block}
.near{background:#FFF3C4;border:2px solid var(--ink);padding:6px 10px;margin-bottom:10px;font-size:17px}
/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;max-width:420px}
.pad button{border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);min-height:56px;font-family:Poppins;font-weight:800;font-size:24px;cursor:pointer}
.pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pad .go{background:var(--butter);grid-column:span 2;font-size:20px}
.pad .gr{background:#E9E2DB;font-size:18px}
/* exam */
.exbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.timer{font-family:Poppins;font-weight:800;font-size:24px;border:3px solid var(--ink);background:#fff;padding:4px 12px;min-width:110px;text-align:center}
.timer.low{background:var(--bad);color:#fff}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.sheet button{border:2.5px solid var(--ink);background:#fff;min-height:50px;font-family:Poppins;font-weight:800;font-size:18px;cursor:pointer;position:relative}
.sheet button.done{background:#DCE9FB}
.sheet button.cur{outline:4px solid var(--ink);outline-offset:-7px}
.sheet button.flag:after{content:"";position:absolute;top:3px;right:3px;width:0;height:0;border-left:12px solid transparent;border-top:12px solid var(--tang)}
.flagbtn.on{background:var(--tang)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:10px 0}
.legend i{display:inline-block;width:16px;height:16px;border:2px solid var(--ink);vertical-align:-3px;margin-right:4px}
/* results */
.score{display:flex;gap:20px;flex-wrap:wrap;align-items:stretch}
.score .big{font-family:Poppins;font-weight:800;font-size:64px;line-height:1}
.stat{border:3px solid var(--ink);background:#fff;padding:12px 18px;min-width:150px}
.stat b{font-family:Poppins;font-size:14px;display:block}
.trow{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid #e2d8d0}
.trow .lvl{font-family:Poppins;font-weight:800;font-size:13px;padding:3px 8px;border:2px solid var(--ink);white-space:nowrap}
.lvl.s{background:var(--ok);color:#fff}.lvl.m{background:var(--butter)}.lvl.w{background:var(--bad);color:#fff}
.rev{border:3px solid var(--ink);background:#fff;margin-bottom:14px}
.rev summary{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;font-size:19px;list-style:none;flex-wrap:wrap}
.rev summary::-webkit-details-marker{display:none}
.rev .mark{font-family:Poppins;font-weight:800;color:#fff;padding:2px 10px;font-size:14px}
.rev .mark.ok{background:var(--ok)}.rev .mark.no{background:var(--bad)}
.rev .inner{padding:4px 14px 14px;border-top:2px solid var(--ink)}
.stars{display:flex;gap:6px;justify-content:center;margin:8px 0}
.stars svg{width:54px;height:54px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(59,36,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal .panel{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.pinrow{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pinrow i{width:44px;height:52px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:28px;font-style:normal;font-weight:800}
/* teacher */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs .btn.on{background:var(--ink);color:#fff}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:3px solid var(--ink);width:max-content;max-width:100%}
.seg button{border:0;border-right:2.5px solid var(--ink);background:#fff;padding:8px 12px;font-family:Poppins;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--butter)}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-size:17px}

const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };

const V = (n, d) => ({ n, d });

const sub = (a, b) => V(a.n * b.d - b.n * a.d, a.d * b.d);

const DENS = [2, 3, 4, 5, 6, 8, 10, 12];
const pieceName = d => ({ 2: 'halves', 3: 'thirds', 4: 'quarters', 5: 'fifths', 6: 'sixths', 7: 'sevenths', 8: 'eighths', 9: 'ninths', 10: 'tenths', 12: 'twelfths', 14: 'fourteenths', 15: 'fifteenths', 16: 'sixteenths', 18: 'eighteenths', 20: 'twentieths', 24: 'twenty-fourths', 30: 'thirtieths', 36: 'thirty-sixths', 40: 'fortieths' }[d] || (d + 'ths'));

/* ---------- step builders ---------- */
function simplifySteps(v, steps, label) {
  // v = fraction part (proper) possibly reducible; push a simplify step if needed
  const g = gcd(v.n, v.d);

function finalStep(steps, v, unit) { steps.push(st('Answer', S(v) + (unit ? ' ' + unit : ''))); }

/* Add / subtract (any denominators; mixed numbers by wholes-and-parts) */
function solveAddSub(A, B, op) {

    let why;
    if (D === dA || D === dB) { const small = D === dA ? dB : dA; why = 'The denominators are different (' + dA + ' and ' + dB + '). ' + D + ' is a multiple of ' + small + ' (' + small + ' × ' + (D / small) + ' = ' + D + '), so we change to ' + pieceName(D) + '.'; }
    else { const mult = x => { const a = []; for (let m = x; m <= D; m += x) a.push(m); return a.join(', '); }; why = 'The denominators are different (' + dA + ' and ' + dB + '), and neither is a multiple of the other. Find the LCM: the smallest number that both ' + dA + ' and ' + dB + ' go into. Multiples of ' + dA + ': ' + mult(dA) + '. Multiples of ' + dB + ': ' + mult(dB) + '. The LCM of ' + dA + ' and ' + dB + ' is ' + D + ', so we change both to ' + pieceName(D) + '.'; }

    } else if (a.n < B2.n) {

function solveMulWhole(k, A, unit) {
  const steps = [];
  const v = improperStep(A, steps);
  const P = k * v.n;
  steps.push(st('Multiply the numerator', k + ' × ' + T(v) + ' means ' + k + ' groups of ' + T(v) + '. Multiply the numerator by ' + k + ': ' + k + ' × ' + v.n + ' = ' + P + '. Keep the denominator: ' + T(V(P, v.d)) + '. The piece size stays the same, we just have more pieces.'));

function solve(A, op, B) {

// input: {w,n,d} strings for frac; {v} for num
function judge(q, inp, set, exam) {

  if (q.type === 'tf') return inp.choice === q.truth ? { ok: true } : { ok: false };

    const v = String(inp.v || '').trim();

    return +v === q.ans.n ? { ok: true } : { ok: false };
  }

  if ((ns && !ds) || (!ns && ds)) return { empty: true, msg: 'Fill in both the top and the bottom of the fraction.' };
  if ((ws && !/^\d+$/.test(ws)) || (ns && !/^\d+$/.test(ns)) || (ds && !/^\d+$/.test(ds))) return { empty: true, msg: 'Use numbers only.' };
  const w = ws ? +ws : 0, n = ns ? +ns : 0, d = ds ? +ds : 1;
  if (ds && d === 0) return { empty: true, msg: 'The denominator cannot be 0.' };
  const given = V(w * d + n, d);
  if (!same(given, q.ans)) return { ok: false };
  const hasFrac = !!ns;
  const simplest = !hasFrac || gcd(n, d) === 1;
  const improper = hasFrac && n >= d;           // includes 4/4, 1 5/4
  const ans = q.ans; const ansWhole = ans.n % ans.d === 0;
  const form = q.form || 'std';
  const ask = (msg, key) => exam ? { ok: false, near: msg } : { retry: true, msg, key };
  if (form === 'any') return { ok: true };
  if (form === 'improper') {
    if (w > 0 && hasFrac) return { ok: false, near: 'That is a mixed number. The question asks for an improper fraction.' };
    if (!hasFrac) return { ok: false, near: 'Write it as a fraction (top and bottom).' };
    return { ok: true };
  }
  if (form === 'mixed') {
    if (improper || (w === 0 && !ansWhole && ans.n > ans.d)) return ask('Correct value! Now write it as a mixed number (whole number + fraction).', 'mixed');
    if (!simplest) { if (set.simplest === 'wrong') return { ok: false, near: 'Correct value, but not in simplest form.' }; if (set.simplest === 'ask') return ask('Correct value! Can you simplify the fraction part?', 'simplest'); }
    return { ok: true };
  }
  if (form === 'simplest') {
    if (!simplest) return ask('Correct value! Can you simplify it?', 'simplest');
    if (improper) { if (set.mixed === 'wrong') return { ok: false, near: 'Correct value, but not written as a mixed number.' }; if (set.mixed === 'ask') return ask('Correct value! Can you change it to a mixed number?', 'mixed'); }
    return { ok: true };
  }
  // std
  if (!simplest) {
    if (set.simplest === 'wrong') return { ok: false, near: 'Correct value, but not in simplest form.' };
    if (set.simplest === 'ask') return ask('Correct value! Can you simplify it?', 'simplest');
  }
  if (improper) {
    if (set.mixed === 'wrong') return { ok: false, near: ansWhole ? 'Correct value, but write it as a whole number.' : 'Correct value, but not written as a mixed number.' };
    if (set.mixed === 'ask') return ask(ansWhole ? 'Correct value! Can you write it as a whole number?' : 'Correct value! Can you change it to a mixed number?', 'mixed');
  }
  return { ok: true };
}

/* ===== Topic 4: related denominators ===== */

def('t4-mc', 't4', r => {

    view().innerHTML = h;

      '<div class="panel"><div class="fld"><b>Practice questions per topic</b>' + seg('pN', [[10, '10'], [15, '15'], [20, '20']], s.pN) + '</div>' +
      '<div class="fld"><b>Mock test length</b>' + seg('mockN', [[20, '20'], [30, '30']], s.mockN) + '</div>' +
      '<div class="fld"><b>Default timer</b>' + seg('timer', [[0, 'Off'], [30, '30 min'], [45, '45 min'], [60, '60 min']], s.timer) + '</div>' +
      '<div class="fld"><b>Correct value, not in simplest form (e.g. [4/8] for [1/2])</b>' + seg('simplest', [['accept', 'Accept'], ['ask', 'Ask to simplify'], ['wrong', 'Mark wrong']], s.simplest) + '</div>' +
      '<div class="fld"><b>Correct value, improper not mixed (e.g. [5/4] for [1 1/4])</b>' + seg('mixed', [['accept', 'Accept'], ['ask', 'Ask to change'], ['wrong', 'Mark wrong']], s.mixed) + '<div class="note">In exam mode, "Ask" answers count as wrong, with a note in the review.</div></div>' +
      '<div class="fld"><b>Thai help (for your own Thai students; turn off for the TPT version)</b>' + seg('thai', [[false, 'Off'], [true, 'On']], s.thai) + '</div>' +
      '<div class="fld"><b>Sound effects</b>' + seg('sound', [[true, 'On'], [false, 'Off']], s.sound) + '</div>' +
      '<div class="fld"><b>Change PIN</b><div class="row"><input class="txt" id="npin" maxlength="4" inputmode="numeric" style="max-width:120px" placeholder="1234"><button class="btn sm" id="spin">Save PIN</button><span id="pm" class="note"></span></div></div>' +
      '<div class="fld"><b>Reset</b><button class="btn sm p" id="rst">Reset all student progress</button></div></div></div>';
    $$('.seg', tb).forEach(g => $$('button', g).forEach(b => b.onclick = () => { const k = g.dataset.s; let v = b.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (/^\d+$/.test(v)) v = +v; s[k] = v; save(); $$('button', g).forEach(x => x.classList.toggle('on', x === b)); }));
    $$('[data-tp]', tb).forEach(c => c.onchange = () => { s.topics[c.dataset.tp] = c.checked; save(); });
    $('#spin').onclick = () => { const v = $('#npin').value.trim(); if (/^\d{4}$/.test(v)) { s.pin = v; save(); $('#pm').textContent = 'Saved.'; } else $('#pm').textContent = 'Use 4 digits.'; };
    $('#rst').onclick = () => confirmBox('Reset all progress, mistakes and test results on this device?', 'Reset', () => { ST.prog = {}; ST.mist = []; ST.mocks = {}; ST.last = null; ST.book = {}; save(); go(vTeacher, 'set'); });
    tb.querySelectorAll('.fld b').forEach(b => b.innerHTML = fx(b.textContent));
  } else if (tab === 'board') {
    tb.innerHTML = '<div class="panel"><div class="board-in"><input class="txt" id="bx" placeholder="e.g. 2 1/3 - 1 2/3" value="3/8 + 7/8"><button class="btn y" id="bs">Show</button></div><div class="row" style="margin-top:10px">' + ['+', '−', '×', '÷', 'of'].map(o => '<button class="btn sm" data-o="' + o + '">' + o + '</button>').join('') + '<span class="note">Examples:</span>' + ['1/2 + 3/8', '3 1/5 - 1 3/5', '3 x 2/5', '3/4 of 20', '4/5 ÷ 2', '3 ÷ 1/4', '2/3 x 3/4'].map(e => '<button class="btn sm" data-e="' + e + '">' + e + '</button>').join('') + '</div><p class="note">Write fractions with a slash (3/4) and mixed numbers with a space (2 1/3). Use x or × to multiply, ÷ or : to divide.</p><div id="bo"></div></div>';
    const show = () => {
      const p = FXm.parseExpr($('#bx').value); const bo = $('#bo');
      if (p.error) { bo.innerHTML = '<div class="hintbox">' + esc(p.error) + '</div>'; return; }
      const r = solve(p.A, p.op, p.B); if (r.error) { bo.innerHTML = '<div class="hintbox">' + esc(r.error) + '</div>'; return; }
      let up = 1;
      const draw = () => { bo.innerHTML = '<div class="board-eq">' + fx(FXm.ot(p.A) + ' ' + p.op + ' ' + FXm.ot(p.B) + ' = ' + (up >= r.steps.length ? S(r.ans) : '?')) + '</div>' + picHTML(r.pics, up === 1) + '<div style="margin-top:16px;font-size:22px">' + stepsHTML(r.steps, up) + '</div><div class="row">' + (up < r.steps.length ? '<button class="btn y" id="bn">Next step</button><button class="btn sm" id="ba">Show all steps</button>' : '') + '</div>'; const bn = $('#bn'); if (bn) bn.onclick = () => { up++; play('pop'); draw(); }; const ba = $('#ba'); if (ba) ba.onclick = () => { up = r.steps.length; draw(); }; };
      draw(); popLater(r.pics);
    };
    $('#bs').onclick = show; $('#bx').onkeydown = e => { if (e.key === 'Enter') show(); };
    $$('[data-o]', tb).forEach(b => b.onclick = () => { const x = $('#bx'); x.value = x.value.trim() + ' ' + b.dataset.o + ' '; x.focus(); });
    $$('[data-e]', tb).forEach(b => b.onclick = () => { $('#bx').value = b.dataset.e; show(); });
    show();
  } else if (tab === 'res') {
    const L = ST.last;
    if (!L) tb.innerHTML = '<div class="panel"><p>No mock test has been finished on this device yet.</p></div>';
    else tb.innerHTML = '<div class="panel"><h3>Mock Test ' + L.n + ': ' + esc(L.name || 'Student') + '</h3><p class="note">' + esc(L.date) + ', ' + esc(L.mode) + '</p><div class="score" style="margin:12px 0"><div class="stat"><b>SCORE</b><span class="big">' + L.sc + '</span> / ' + L.N + '</div><div class="stat"><b>TIME</b><span style="font-size:26px;font-family:Poppins;font-weight:800">' + Math.floor(L.secs / 60) + ' min ' + (L.secs % 60) + ' s</span></div></div>' +
      TOPICS.filter(t => L.by[t.id]).map(t => { const b = L.by[t.id]; const p = b.ok / b.n; return '<div class="trow"><b>' + esc(t.short) + '</b><div class="meter"><i style="width:' + Math.round(p * 100) + '%"></i></div><span>' + b.ok + ' / ' + b.n + '</span><span class="lvl ' + (p >= 0.8 ? 's">Strong' : p >= 0.5 ? 'm">OK' : 'w">Needs practice') + '</span></div>'; }).join('') +
      '<p style="margin-top:14px"><b>Wrong questions:</b> ' + (L.wrong.length ? L.wrong.join(', ') : 'none') + '</p><p class="note">Saved mistakes waiting in Fix my mistakes: ' + ST.mist.length + '</p></div>';
  } else {
    tb.innerHTML = TOPICS.map(t => '<div class="tip"><h3>' + esc(t.name) + '</h3><ul>' + TIPS[t.id].map(x => '<li>' + fx(x) + '</li>').join('') + '</ul></div>').join('');
  }
}

function shell() {
  const ic = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 11 12 3l9 8M5 10v11h14V10"/></svg>',
    snd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
    mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>',
    full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="10" width="16" height="11"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
  };
  $('#tools').innerHTML = '<button class="ibtn" id="bh" aria-label="Home">' + ic.home + '<span class="tx">Home</span></button><button class="ibtn" id="bm" aria-label="Sound"></button><button class="ibtn" id="bf" aria-label="Full screen">' + ic.full + '</button><button class="ibtn" id="bt" aria-label="Teacher mode">' + ic.lock + '<span class="tx">Teacher</span></button>';
  const snd = () => { const b = $('#bm'); b.innerHTML = ST.set.sound ? ic.snd + '<span class="tx">Sound</span>' : ic.mute + '<span class="tx">Muted</span>'; b.classList.toggle('off', !ST.set.sound); };
  snd();
  $('#bm').onclick = () => { ST.set.sound = !ST.set.sound; save(); snd(); if (ST.set.sound) play('pop'); };
  $('#bh').onclick = () => { if ($('#tmr')) confirmBox('Leave the test? Your answers will be lost.', 'Leave', () => go(vHome)); else go(vHome); };
  $('.logo-sm').onclick = () => $('#bh').click();
  $('#bf').onclick = () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } };
  $('#bt').onclick = () => { if ($('#tmr')) return; askPin(); };
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#tmr')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}
window.APP = { runRush, vBook, go, vHome, vStart, vLearn, startPractice, runQuiz, vMockIntro, runExam, vTeacher, BANK, ST: () => ST, buildMock, topicSet };
shell();
fitCheck(); window.addEventListener('resize', fitCheck);
go(vStart);
})();

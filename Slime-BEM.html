  --lilac: var(--sky); --lilac-d: var(--sky-d); --lilac-l: var(--sky-l); --aqua: var(--mint); --aqua-d: var(--mint-d); --aqua-l: var(--mint-l); --peach: var(--coral); --peach-l: var(--coral-l);
  --r: 22px; --bw: 3px; --sh: 0 5px 0 var(--ink); --fs: 20px; --hdr: 70px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Andika, 'Trebuchet MS', sans-serif; font-size: var(--fs); color: var(--ink); line-height: 1.35; -webkit-tap-highlight-color: transparent; overflow: hidden;
  background-color: var(--bg); background-image: radial-gradient(rgba(38, 48, 59, .07) 1.3px, transparent 1.6px); background-size: 22px 22px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:where(button, a, input, [tabindex]):focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; border-radius: 14px; }
.ic { width: 1.1em; height: 1.1em; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#frame { height: 100%; } body.scaled #frame { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- buttons ---------- */
.btn { --c: var(--pink); --t: #fff; display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 54px; padding: 8px 22px; border-radius: 18px; font-weight: 700; font-size: 1.05em;
  color: var(--t); background: var(--c); border: var(--bw) solid var(--ink); box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: 0 2px 0 var(--ink); }
.btn.lilac, .btn.sky { --c: var(--sky); } .btn.aqua, .btn.mint { --c: var(--mint); } .btn.lemon { --c: var(--lemon); --t: var(--ink); } .btn.white { --c: #fff; --t: var(--ink); } .btn.coral { --c: var(--coral); }
.btn.sm { min-height: 46px; padding: 6px 14px; font-size: .92em; border-radius: 14px; }
.btn.round { width: 54px; padding: 0; } .btn.sm.round { width: 46px; }
.chip { display: inline-flex; align-items: center; gap: .4em; min-height: 46px; padding: 6px 16px; border-radius: 999px; background: #fff; border: 2.5px solid var(--ink); font-weight: 700; box-shadow: 0 3px 0 var(--ink); }
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.chip[aria-pressed="true"], .opt[aria-pressed="true"] { background: var(--lemon-l); outline: 3px solid var(--lemon); outline-offset: -6px; }

/* ---------- header ---------- */
.hdr { position: relative; z-index: 20; height: var(--hdr); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--cream); border-bottom: var(--bw) solid var(--ink); }
.logo { display: flex; align-items: center; gap: 10px; white-space: nowrap; min-height: 46px; min-width: 46px; }
.logo img { height: 56px; width: auto; display: block; margin: -4px 0; }
.logo .wm { font-weight: 700; font-size: 1.35em; letter-spacing: -.01em; color: var(--ink); line-height: 1; }
.logo .wm b { color: #fff; background: var(--pink); border: 2.5px solid var(--ink); border-radius: 10px; padding: 1px 7px 2px; margin-left: 4px; box-shadow: 0 3px 0 var(--ink); display: inline-block; transform: rotate(-3deg); }
.hdr .sp { flex: 1; }
.lvl { display: flex; border: 2.5px solid var(--ink); border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 3px 0 var(--ink); }
.lvl button { min-height: 44px; padding: 2px 12px; font-weight: 700; font-size: .86em; line-height: 1.05; color: var(--ink2); border-left: 2px solid var(--line); }
.lvl button:first-child { border-left: 0; }
.lvl button small { display: block; font-size: .78em; font-weight: 400; }
.lvl button[aria-pressed="true"] { background: var(--lemon); color: var(--ink); }
.hbtn { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); border: 2.5px solid transparent; }
.hbtn:hover { background: #fff; border-color: var(--ink); }
.hbtn .ic { width: 26px; height: 26px; }
.who { display: flex; align-items: center; gap: 6px; font-weight: 700; padding: 3px 12px 3px 3px; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; max-width: 180px; }
.who svg { width: 34px; height: 34px; flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { flex: 1; min-height: 0; position: relative; }
.scroll { height: 100%; overflow: auto; padding: 26px 22px 30px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.foot { text-align: center; color: var(--ink3); font-size: .8em; padding: 16px 0 0; }

/* ---------- start ---------- */
.start { display: grid; grid-template-columns: 1fr 1.05fr; gap: 34px; align-items: center; min-height: 100%; max-width: 1240px; margin: 0 auto; }
.brandlogo { height: 92px; width: auto; display: block; }
.title { font-size: clamp(60px, 8vw, 118px); line-height: .9; margin: 12px 0 6px; font-weight: 700; letter-spacing: -.03em; color: var(--pink); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
.title span { color: var(--mint); margin-left: .15em; }
.drip { display: block; width: min(420px, 90%); height: 34px; margin: -4px 0 8px; }
.lead { font-size: 1.25em; color: var(--ink2); margin: 0 0 18px; max-width: 30ch; }
.card { background: #fff; border-radius: var(--r); border: var(--bw) solid var(--ink); box-shadow: var(--sh); padding: 20px; position: relative; }
.tape { position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; transform: translateX(-50%) rotate(-3deg); background: repeating-linear-gradient(45deg, rgba(255, 79, 139, .55) 0 8px, rgba(255, 255, 255, .55) 8px 16px); border-left: 2px dashed rgba(255, 255, 255, .7); border-right: 2px dashed rgba(255, 255, 255, .7); }
.profiles { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 14px; }
.prof { display: flex; align-items: center; gap: 8px; min-height: 58px; padding: 6px 16px 6px 6px; border-radius: 999px; background: #fff; font-weight: 700; border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.prof svg { width: 44px; height: 44px; }
.prof[aria-pressed="true"] { background: var(--lemon-l); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.inp { min-height: 54px; border-radius: 14px; border: 2.5px solid var(--ink); padding: 8px 14px; font-size: 1.05em; background: #fff; min-width: 0; flex: 1; }
.inp:focus { outline: 4px solid var(--lemon); outline-offset: 0; }
.demo { position: relative; height: min(64vh, 560px); }
.floaty { position: absolute; width: 74px; height: 74px; animation: bob 4s ease-in-out infinite; z-index: 4; pointer-events: none; filter: drop-shadow(0 3px 0 rgba(38, 48, 59, .25)); }
@keyframes bob { 50% { transform: translateY(-12px) rotate(8deg); } }

/* cutting mat (slime stage) */
.mat { position: relative; border-radius: 28px; border: var(--bw) solid var(--ink); box-shadow: var(--sh); overflow: hidden; background-color: #DDF3EA;
  background-image: linear-gradient(rgba(19, 135, 104, .16) 2px, transparent 2px), linear-gradient(90deg, rgba(19, 135, 104, .16) 2px, transparent 2px), linear-gradient(rgba(19, 135, 104, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(19, 135, 104, .08) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: -2px -2px; }
.mat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 16px; background: repeating-linear-gradient(90deg, rgba(38, 48, 59, .35) 0 2px, transparent 2px 24px), repeating-linear-gradient(90deg, rgba(38, 48, 59, .5) 0 2px, transparent 2px 120px); background-size: 100% 8px, 100% 16px; background-repeat: no-repeat; pointer-events: none; z-index: 2; }
.mat::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: repeating-linear-gradient(180deg, rgba(38, 48, 59, .35) 0 2px, transparent 2px 24px), repeating-linear-gradient(180deg, rgba(38, 48, 59, .5) 0 2px, transparent 2px 120px); background-size: 8px 100%, 16px 100%; background-repeat: no-repeat; pointer-events: none; z-index: 2; }
.demo.mat { height: min(64vh, 560px); }
.demo .hint, .stagehint { position: absolute; z-index: 3; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 16px; font-weight: 700; color: var(--ink); font-size: .86em; display: flex; align-items: center; gap: 8px; box-shadow: 0 3px 0 var(--ink); pointer-events: none; }
.demo .hint { left: 50%; bottom: 16px; transform: translateX(-50%); white-space: nowrap; }

/* ---------- home ---------- */
.hello { font-size: 1.9em; margin: 0 0 4px; } .sub { color: var(--ink2); margin: 0 0 20px; }
.tiles { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-auto-rows: minmax(150px, auto); gap: 18px; }
.tile { position: relative; border-radius: 26px; padding: 20px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; min-height: 160px; overflow: hidden; background: var(--tc, var(--pink-l)); border: var(--bw) solid var(--ink); box-shadow: var(--sh); transition: transform .15s; }
.tile:hover { transform: translateY(-3px) rotate(-.6deg); } .tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.tile b { font-size: 1.35em; position: relative; z-index: 1; } .tile span { color: var(--ink2); position: relative; z-index: 1; font-size: .92em; }
.tile.big { grid-row: span 2; --tc: #DDF3EA; background-image: linear-gradient(rgba(255, 255, 255, .5) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 255, 255, .5) 2px, transparent 2px); background-size: 60px 60px; }
.tile.big b { font-size: 2.1em; }
.tile .art { position: absolute; right: 10px; top: 10px; width: 46%; max-width: 170px; transition: transform .25s; }
.tile:hover .art { transform: scale(1.06) rotate(3deg); }
.tile.big .art { width: 72%; max-width: 380px; right: 50%; transform: translateX(50%); top: 14px; }
.tile.big:hover .art { transform: translateX(50%) scale(1.04); }
.tile .art img, .tile .art svg { width: 100%; height: auto; display: block; }

/* ---------- studio ---------- */
.studio { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.steps { display: flex; gap: 6px; padding: 12px 14px 8px; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.stp { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; border-radius: 999px; background: #fff; border: 2.5px solid var(--ink); font-weight: 700; font-size: .84em; color: var(--ink2); white-space: nowrap; min-height: 44px; }
.stp:disabled { opacity: .55; border-style: dashed; }
.stp i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--cream); font-style: normal; color: var(--ink); border: 2px solid var(--ink); }
.stp.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 var(--ink); } .stp.on i { background: #fff; color: var(--ink); }
.stp.done i { background: var(--mint); color: #fff; }
.stp .ic { width: 18px; height: 18px; }
.sbody { display: grid; grid-template-columns: minmax(0, 1.22fr) minmax(340px, 1fr); gap: 16px; padding: 4px 14px 10px; min-height: 0; }
.stagewrap { min-height: 260px; }
.stage-cv { position: absolute; inset: 0; }
.stage-cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage-top { touch-action: none; cursor: grab; }
.stage-top[data-tool="stir"] { cursor: none; } .stage-top[data-tool="poke"], .stage-top[data-tool="charm"] { cursor: pointer; } .stage-top[data-tool="none"] { cursor: default; }
.tools { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; background: #fff; padding: 6px; border-radius: 24px; border: var(--bw) solid var(--ink); box-shadow: 0 4px 0 var(--ink); z-index: 3; align-items: stretch; }
.tool { width: 78px; min-height: 80px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: .78em; gap: 0; color: var(--ink); border: 2.5px solid transparent; position: relative; }
.tool svg { width: 46px; height: 46px; transition: transform .2s; }
.tool:hover svg { transform: scale(1.1) rotate(-6deg); }
.tool[aria-pressed="true"] { background: var(--lemon-l); border-color: var(--ink); }
.tool.run svg { animation: wig .5s ease-in-out infinite; } @keyframes wig { 50% { transform: rotate(-12deg) scale(1.1); } }
.tool .auto { position: absolute; top: -9px; right: -6px; background: var(--mint); color: #fff; font-size: .78em; border: 2px solid var(--ink); border-radius: 999px; padding: 0 6px; line-height: 1.5; }
.tool.all { background: var(--pink); color: #fff; border-color: var(--ink); width: 88px; }
.tool.all svg { width: 34px; height: 34px; }
.stagehint { top: 24px; left: 26px; max-width: calc(100% - 270px); line-height: 1.2; }
.colorname { position: absolute; top: 24px; right: 14px; z-index: 3; background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 5px 12px 5px 5px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 3px 0 var(--ink); }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); flex: none; display: inline-block; }
/* word pops on the stage */
.pops { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.pop { position: absolute; transform: translate(-50%, -50%); text-align: center; animation: popin 2.2s cubic-bezier(.2, 1.4, .4, 1) forwards; }
.pop b { display: inline-block; font-size: clamp(30px, 3.6vw, 56px); color: #fff; background: var(--pc, var(--pink)); border: var(--bw) solid var(--ink); border-radius: 18px; padding: 2px 18px 6px; box-shadow: 0 5px 0 var(--ink); transform: rotate(var(--rot, -4deg)); letter-spacing: .01em; }
.pop span { display: block; margin-top: 8px; font-size: clamp(18px, 1.8vw, 26px); font-weight: 700; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 14px; box-shadow: 0 3px 0 var(--ink); }
.pop.small b { font-size: clamp(20px, 2.2vw, 32px); padding: 1px 12px 3px; border-radius: 12px; }
@keyframes popin { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.3); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; transform: translate(-50%, -62%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.92); } }
.panel { background: #fff; border-radius: 26px; border: var(--bw) solid var(--ink); box-shadow: var(--sh); padding: 16px 18px; overflow: auto; min-height: 0; }
.panel > * { animation: slidein .35s ease-out both; } .panel > *:nth-child(2) { animation-delay: .04s; } .panel > *:nth-child(3) { animation-delay: .08s; } .panel > *:nth-child(n+4) { animation-delay: .12s; }
@keyframes slidein { from { opacity: 0; transform: translateY(10px); } }
.panel.still > * { animation: none; }
.panel h2 { margin: 0 0 2px; font-size: 1.45em; } .panel .how { color: var(--ink2); margin: 0 0 12px; font-size: .95em; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.opts.big { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.opt { border: 2.5px solid var(--ink); border-radius: 20px; background: #fff; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; text-align: center; min-height: 64px; box-shadow: 0 3px 0 var(--ink); transition: transform .12s; }
.opt img { width: 100%; max-width: 150px; height: auto; transition: transform .2s; } .opt small { font-weight: 400; color: var(--ink2); font-size: .78em; line-height: 1.2; }
.opt:hover { transform: translateY(-2px); } .opt:hover img { transform: scale(1.05); } .opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.bottles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.bottlebtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 8px; border-radius: 16px; border: 2.5px solid transparent; font-weight: 700; font-size: .86em; }
.bottlebtn:hover { background: var(--cream); border-color: var(--ink); } .bottlebtn:hover .bottle { transform: rotate(-8deg); } .bottlebtn:active .bottle { transform: rotate(-24deg) translateY(6px); }
.bottle { width: 44px; height: 74px; transition: transform .15s; }
.seg { display: inline-flex; border: 2.5px solid var(--ink); border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 3px 0 var(--ink); }
.seg button { min-height: 44px; padding: 4px 16px; font-weight: 700; color: var(--ink2); display: flex; align-items: center; gap: 6px; border-left: 2px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--lemon); color: var(--ink); }
.sec { margin: 14px 0 6px; font-weight: 700; color: var(--ink); font-size: .9em; display: flex; align-items: center; gap: 8px; }
.sec::after { content: ""; flex: 1; height: 0; border-top: 2.5px dashed var(--line); }
.charms { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.charmbtn { display: flex; flex-direction: column; align-items: center; padding: 6px 2px 4px; border-radius: 16px; font-size: .74em; font-weight: 700; color: var(--ink2); touch-action: none; user-select: none; -webkit-user-select: none; border: 2.5px solid transparent; position: relative; }
.charmbtn:hover { background: var(--cream); border-color: var(--ink); } .charmbtn:hover .charm { transform: rotate(-8deg) scale(1.08); }
.charmbtn .charm { width: 54px; height: 54px; pointer-events: none; transition: transform .2s; }
.charmbtn em { position: absolute; top: 2px; right: 6px; font-style: normal; background: var(--pink); color: #fff; border: 2px solid var(--ink); border-radius: 999px; font-size: .9em; min-width: 24px; height: 24px; display: grid; place-items: center; }
.ghost { position: fixed; z-index: 100; width: 84px; height: 84px; pointer-events: none; transform: translate(-50%, -50%) scale(1.15) rotate(-6deg); filter: drop-shadow(0 8px 0 rgba(38, 48, 59, .25)); }
.sparkopts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.sparkopts .opt { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 8px 10px; text-align: left; }
.sparkopts .opt svg { width: 46px; height: 46px; flex: none; }

/* step 5 action cards */
.acts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.actcard { border: 2.5px solid var(--ink); border-radius: 18px; background: #fff; box-shadow: 0 3px 0 var(--ink); padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; font-weight: 700; position: relative; transition: transform .12s; }
.actcard:hover { transform: translateY(-2px); } .actcard:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.actcard svg.pic { width: 100%; max-width: 84px; height: auto; }
.actcard b { font-size: 1.05em; } .actcard small { font-weight: 400; color: var(--ink2); font-size: .74em; }
.actcard .ck { position: absolute; top: -8px; right: -6px; width: 26px; height: 26px; border-radius: 50%; background: var(--mint); color: #fff; border: 2px solid var(--ink); display: grid; place-items: center; }
.actcard .ck .ic { width: 16px; height: 16px; }
.actcard.on { background: var(--lemon-l); }
@media (max-width: 600px) { .acts { grid-template-columns: repeat(3, 1fr); } }
/* speak bar */
.speak { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 14px 12px; }
.bubble { position: relative; background: #fff; border: var(--bw) solid var(--ink); border-radius: 26px; padding: 12px 18px 10px 20px; box-shadow: var(--sh); display: flex; align-items: center; gap: 14px; min-height: 92px; }
.bubble::before { content: ""; position: absolute; left: 40px; top: -15px; width: 24px; height: 24px; background: #fff; border-left: var(--bw) solid var(--ink); border-top: var(--bw) solid var(--ink); transform: rotate(45deg); border-radius: 5px 0 0 0; }
.bubble.pop2 { animation: bub .45s cubic-bezier(.2, 1.6, .4, 1); } @keyframes bub { from { transform: scale(.94); } }
.bubble .q { position: absolute; top: -16px; left: 82px; background: var(--ink); color: #fff; font-weight: 700; padding: 3px 14px; border-radius: 999px; font-size: .8em; max-width: calc(100% - 100px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say { font-size: clamp(24px, 2.4vw, 38px); font-weight: 700; line-height: 1.2; flex: 1; }
.say .slot { background: var(--lemon-l); border-radius: 10px; padding: 0 8px; box-shadow: inset 0 -5px 0 var(--lemon); white-space: nowrap; }
.say .blank { display: inline-block; min-width: 3.2em; border-bottom: 4px dashed var(--ink3); height: .9em; vertical-align: baseline; }
.say .swd { display: inline-block; width: .62em; height: .62em; border-radius: 50%; margin-right: .18em; border: 2px solid var(--ink); vertical-align: .02em; }
.speaking { animation: glow 1s ease-in-out infinite; } @keyframes glow { 50% { box-shadow: 0 5px 0 var(--ink), 0 0 0 6px var(--lemon-l); } }
.sbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.heard { font-size: .82em; color: var(--ink2); margin-top: 6px; }
.recdot { animation: blink 1s infinite; color: var(--bad); } @keyframes blink { 50% { opacity: .3; } }
.next { min-width: 150px; }

/* jar step */
.jarcv { position: absolute; inset: 0; width: 100%; height: 100%; }
.helpers { display: flex; flex-wrap: wrap; gap: 6px; }

.ticket.hint { display: block; line-height: 1.4; } .ticket.hint .ic { vertical-align: -3px; }
.order3 .otext { font-size: 1.22em; }
/* quick check fills the screen */
.qgame { height: 100%; display: flex; flex-direction: column; } .qgame > .card { flex: 1; display: flex; flex-direction: column; justify-content: center; }
body.scaled .qgame .qpic img, body.scaled .qgame .qpic svg { width: 340px; height: 250px; }
body.scaled .qgame .ansbtn { min-height: 96px; font-size: 1.35em; }
.game .gtop + .sub { margin-bottom: 10px; }
.qgame > .card { justify-content: space-evenly; }
.cards.fit .wcard span { line-height: 1.1; }

/* bigger touch targets when the frame is scaled down (tablets, 720p projectors) */
body.scaled { --hdr: 78px; } body.scaled .lvl button { min-height: 54px; padding: 2px 14px; } body.scaled .hbtn { width: 56px; height: 56px; } body.scaled .logo { min-height: 58px; }
body.scaled .stp { min-height: 52px; } body.scaled .steps { padding-top: 10px; padding-bottom: 6px; }
body.scaled .btn.sm { min-height: 54px; } body.scaled .btn.sm.round { width: 54px; } body.scaled .seg button { min-height: 52px; }
body.scaled .charmbtn .charm { width: 48px; height: 48px; } body.scaled .charmbtn { padding: 3px 2px 2px; }
body.scaled .start .title { margin-top: 4px; } body.scaled .brandlogo { height: 80px; }
body.scaled .order3 .seg button { min-height: 40px; }
</style>

  acts.ogadd = function (el) { var r = S.og.r; r[el.dataset.v] = !r[el.dataset.v]; SS.snd.play('pop', 0.5); ogChanged(); };
  acts.ogcharm = function (el) { var r = S.og.r; if (r.charms.length >= 10) return U.toast('That’s enough charms!'); var k = r.charms.length, ang = k * 2.4, rad = 0.18 + 0.12 * (k % 4); r.charms.push({ id: el.dataset.v, u: +(Math.cos(ang) * rad * 1.6).toFixed(3), v: +(Math.sin(ang) * rad * 0.8).toFixed(3), rot: (k % 3 - 1) * 0.25 }); SS.snd.play('plop'); ogChanged(); };
  acts.ogcundo = function () { S.og.r.charms.pop(); ogChanged(); };
  acts.ogreset = function () { S.og.r = blank(); ogChanged(); };
  acts.ogcheck = function () { var og = S.og; og.checked = E.checkOrder(og.o, og.r); var okk = og.checked.every(function (x) { return x.ok; }); setTimeout(function () { U.wordPop(okk ? 'Perfect!' : 'Almost!', okk ? 'It matches the order.' : 'Look at the ticket.', { col: okk ? '#22BF98' : '#FF7A45' }); }, 60); var ok = og.checked.every(function (x) { return x.ok; }); if (og.res.length === og.n) og.firstTry = ok; SS.snd.play(ok ? 'win' : 'oops'); if (ok) { addStars(2); U.confetti(); } U.render(); };
  acts.ognext = function () { var og = S.og; var ok = og.checked && og.checked.every(function (x) { return x.ok; }); og.res.push(!!ok); og.n++; og.o = E.order(og.level); og.r = blank(); og.checked = null; U.render(); };
  acts.ogagain = function () { S.og = null; U.render(); };

  // ======================================================== TEXTURE MATCH =============================================
  SCREENS.texture = function () {
    var L = U.level(), tm = S.tm; if (!tm) { tm = S.tm = { n: 0, res: [], words: E.shuffle(D.textureWords.slice()).slice(0, 8), q: null }; }
    var h = '<div class="scroll fitpage"><div class="game"><div class="gtop"><h1>Texture Match</h1>' + back() + '</div>';
    if (tm.n >= tm.words.length) { var sc = tm.res.filter(Boolean).length; return { html: h + '<div class="endcard card"><h2>You got ' + sc + ' of 8!</h2>' + stars(sc, 8) + '<button class="btn" data-act="tmagain">' + ic('refresh') + ' Play again</button></div></div></div>' }; }
    var w = tm.words[tm.n]; if (!tm.q || tm.q.w !== w) { var others = E.shuffle(D.textureWords.filter(function (x) { return x !== w && (D.textureNear[w] || []).indexOf(x) < 0 && (D.textureNear[x] || []).indexOf(w) < 0; })).slice(0, 2); tm.q = { w: w, opts: E.shuffle(others.concat([w])), wrong: [], done: false }; setTimeout(function () { U.cue(w); }, 350); }
    var q = tm.q;
    h += '<p class="sub">Read the word together. Tap the slime that matches.</p><div class="bigq">' + prog(tm.res.concat(new Array(8 - tm.res.length)), tm.n) + '<span style="background:var(--lemon-l);border:2.5px solid var(--ink);border-radius:14px;padding:0 16px;font-size:1.3em">' + w + '</span><button class="btn white sm round" data-act="tmsay" aria-label="Play the word">' + ic('speaker') + '</button></div>' +
      '<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + q.opts.map(function (o) { var cls = q.done && o === w ? 'ok' : q.wrong.indexOf(o) >= 0 ? 'no' : ''; return '<button class="wcard ' + cls + '" data-act="tmpick" data-v="' + o + '" aria-label="' + (cls ? o : 'Slime choice') + '"><img alt="" src="' + U.texPic(o, 260) + '"><span>' + (q.done || cls === 'no' ? o : '&nbsp;') + '</span></button>'; }).join('') + '</div>' +
      (q.done ? '<div class="fb ok">' + ic('check') + '<span data-act="listen" data-text="' + D.textureSentence[w] + '">Yes! ' + D.textureSentence[w] + '</span></div><div class="row" style="margin-top:12px"><button class="btn mint" data-act="tmnext">' + ic('right') + ' Next</button></div>' : '');
    return { html: h + '</div></div>', after: function () { U.fitCards(document.querySelector('.game .cards'), 300); } };
  };
  acts.tmsay = function () { SS.say(S.tm.q.w); };
  acts.tmpick = function (el) { var tm = S.tm, q = tm.q, v = el.dataset.v; if (q.done) return; if (v === q.w) { q.done = true; tm.res.push(!q.wrong.length); if (!q.wrong.length) addStars(1); SS.snd.play('good'); U.cue(D.textureSentence[v]); } else { if (q.wrong.indexOf(v) < 0) q.wrong.push(v); SS.snd.play('oops'); U.cue(v); } U.render(); };
  acts.tmnext = function () { S.tm.n++; if (S.tm.n >= 8) SS.snd.play('win'); U.render(); };
  acts.tmagain = function () { S.tm = null; U.render(); };

  // ======================================================== QUICK CHECK ===============================================
  function qpic(p) {
    if (!p) return '';
    if (p.kind === 'texture') return '<img alt="" src="' + U.texPic(p.id, 220) + '">';
    if (p.kind === 'verb') return A.pic('verb', p.id);
    if (p.kind === 'charm') return A.charmSVG(p.id);
    if (p.kind === 'color') return A.colorPic(D.colorWords.filter(function (c) { return c.id === p.id; })[0]);
    return '';
  }
  function optLabel(q, o) {
    if (q.optKind === 'charm') return A.charmSVG(o) + '<span class="sr">' + D.charm(o).name + '</span>';
    if (q.optKind === 'color') return A.colorPic({ id: 'q' + o, hex: D.colorWords.filter(function (c) { return c.id === o; })[0].hex }) + esc(o);
    if (q.optKind === 'colortext') return esc(D.colorWords.filter(function (c) { return c.id === o; })[0].w);
    if (q.optKind === 'texture') return '<img alt="" src="' + U.texPic(o, 140) + '" style="width:120px"><span class="sr">' + o + '</span>';
    return esc(o);
  }
  function rightText(q) { if (q.optKind === 'charm') return D.charm(q.right).name; if (q.optKind === 'colortext') return D.colorWords.filter(function (c) { return c.id === q.right; })[0].w; return q.right; }
  SCREENS.quick = function () {
    var qc = S.qc; if (!qc || qc.level !== U.level()) qc = S.qc = { level: U.level(), qs: E.quick(U.level()), i: 0, res: [], picked: null, wrong: [] };
    var h = '<div class="scroll fitpage"><div class="game qgame"><div class="gtop"><h1>Quick Check</h1>' + back() + '</div>';
    if (qc.i >= qc.qs.length) {
      var sc = qc.res.filter(Boolean).length, p = U.P(), master = sc >= 7;
      if (master && p && !qc.saved) { p.badges = p.badges || []; if (p.badges.indexOf('master') < 0) p.badges.push('master'); addStars(sc); qc.saved = true; U.confetti(); }
      return { html: h + '<div class="endcard card"><h2>' + sc + ' of 8 correct</h2>' + stars(sc, 8) + (master ? '<div class="badge">' + badgeSVG() + '</div><h2>You are a Slime Master!</h2><button class="btn lemon" data-act="cert">' + ic('print') + ' Print certificate</button> ' : '<p>Get 7 or 8 right to earn the Slime Master badge. You can do it!</p>') + '<button class="btn" data-act="qcagain">' + ic('refresh') + ' Try again</button></div></div></div>' };
    }
    var q = qc.qs[qc.i], done = qc.picked != null;
    h += '<div class="card"><div class="bigq">' + prog(qc.res.concat(new Array(qc.qs.length - qc.res.length)), qc.i) + '</div>' +
      '<div class="bigq"><span data-act="listen" data-text="' + esc(q.prompt.replace(/_+/g, 'blank')) + '" style="cursor:pointer">' + esc(q.prompt) + '</span><button class="btn white sm round" data-act="' + (q.say ? 'qcsay' : 'listen') + '" data-text="' + esc(q.prompt.replace(/_+/g, 'blank')) + '" aria-label="Listen">' + ic('speaker') + '</button></div>' +
      (q.pic ? '<div class="qpic">' + qpic(q.pic) + '</div>' : '') + (q.pics ? '<div class="qpic" style="gap:20px">' + q.pics.map(function (b) { return '<figure style="margin:0;text-align:center"><img alt="" src="' + U.basePic(b) + '" style="width:170px;height:auto"><figcaption><b>' + D.base(b).name + '</b></figcaption></figure>'; }).join('') + '</div>' : '') +
      (q.mix ? '<div class="qpic" style="gap:10px;align-items:center;font-size:2em;font-weight:700">' + A.bottleSVG(D.bottle(q.mix[0])).replace('class="bottle"', 'style="width:60px;height:100px"') + '+' + A.bottleSVG(D.bottle(q.mix[1])).replace('class="bottle"', 'style="width:60px;height:100px"') + '= ?</div>' : '') +
      '<div class="optrow">' + q.options.map(function (o) { var cls = done && o === q.right ? 'ok' : qc.wrong.indexOf(o) >= 0 ? 'no' : ''; return '<button class="ansbtn ' + cls + '" data-act="qcpick" data-v="' + esc(o) + '">' + optLabel(q, o) + '</button>'; }).join('') + '</div>' +
      (done ? '<div class="fb ' + (qc.res[qc.i] ? 'ok' : 'no') + '">' + ic(qc.res[qc.i] ? 'check' : 'refresh') + '<span>' + (qc.res[qc.i] ? 'Correct! ' : 'Good try! The answer is ') + '<b>' + esc(rightText(q)) + '</b>.</span></div><div class="row" style="margin-top:12px"><button class="btn mint" data-act="qcnext">' + ic('right') + (qc.i === qc.qs.length - 1 ? ' See my stars' : ' Next') + '</button></div>' : '') + '</div>';
    return { html: h + '</div></div>', after: function () { if (q.say && !done && qc.saidI !== qc.i) { qc.saidI = qc.i; setTimeout(function () { U.cue(q.say); }, 300); } } };
  };
  function badgeSVG() { return '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="#FFE0EF" stroke="#FF5BA7" stroke-width="8"/><circle cx="100" cy="100" r="70" fill="#fff" stroke="#FFC2DE" stroke-width="4" stroke-dasharray="8 8"/>' + A.charmSVG('crown').replace('<svg class="charm" viewBox="0 0 100 100"', '<svg x="55" y="34" width="90" height="90" viewBox="0 0 100 100"') + '<text x="100" y="152" text-anchor="middle" font-family="Andika" font-weight="700" font-size="22" fill="#D9307F">Slime Master</text></svg>'; }
  acts.qcsay = function () { var q = S.qc.qs[S.qc.i]; SS.say(q.say); };
  acts.qcpick = function (el) { var qc = S.qc, q = qc.qs[qc.i], v = el.dataset.v; if (qc.picked != null) return; if (v === q.right) { qc.picked = v; qc.res[qc.i] = qc.wrong.length === 0; SS.snd.play('good'); U.cue(rightText(q)); } else { qc.wrong.push(v); SS.snd.play('oops'); if (qc.wrong.length >= 1) { qc.picked = v; qc.res[qc.i] = false; } } U.render(); };
  acts.qcnext = function () { var qc = S.qc; qc.i++; qc.picked = null; qc.wrong = []; if (qc.i >= qc.qs.length) SS.snd.play('win'); U.render(); };
  acts.qcagain = function () { S.qc = null; U.render(); };
  acts.cert = function () { U.printCert(); };
  U.onLevel = function () { if (S.screen === 'texture') { U.render(); return true; } if (S.screen === 'word') { S.ws.li = null; S.ws.mi = null; } return false; };
})(window.SS);

/* Slime Shop: shelves, prices (Levels 2 and 3), role-play dialogue with roles, and paying with dollar bills. */
(function (SS) {
  var D = SS.D, C = SS.C, A = SS.A, E = SS.E, SL = SS.S, U = SS.ui, S = U.S, acts = U.acts, SCREENS = U.screens, esc = U.esc, ic = A.icon;
  function shelfSlimes() { var p = U.P(), mine = p ? p.slimes.filter(function (s) { return s.shelf !== false; }) : []; var list = mine.slice(-6); if (list.length < 3) list = list.concat(U.samples.slice(0, 3 - list.length)); return list; }
  SCREENS.shop = function () {
    var L = U.level(), list = shelfSlimes(), sh = S.sh = S.sh || { line: 0, me: 'Seller', paid: 0 };
    if (S.shopSel && list.filter(function (s) { return s.id === S.shopSel; }).length) { sh.sel = S.shopSel; S.shopSel = null; sh.line = 0; sh.paid = 0; }
    if (!sh.sel || !list.filter(function (s) { return s.id === sh.sel; }).length) sh.sel = list[0].id;
    var sel = list.filter(function (s) { return s.id === sh.sel; })[0], other = list.filter(function (s) { return s.id !== sel.id; })[0];
    var price = Math.max(1, Math.min(10, sel.price || 3)), lines = E.shop(L, sel, other, price);
    var rows = []; for (var i = 0; i < list.length; i += 3) rows.push(list.slice(i, i + 3));
    var shelves = rows.map(function (row) { return '<div class="shelf">' + row.map(function (s) { return '<button class="jarbtn" data-act="shopSel" data-v="' + s.id + '" aria-pressed="' + (s.id === sel.id) + '" aria-label="' + esc(s.name) + (L > 1 ? ', $' + (s.price || 3) : '') + '"><img alt="" src="' + SL.jarImage(s, 150) + '">' + (L > 1 ? '<span class="ptag">$' + (s.price || 3) + '</span>' : '') + '</button>'; }).join('') + '</div>'; }).join('');
    var store = '<div class="storefront"><div class="awning"><b>Slime Shop</b></div>' + shelves + '<p class="how" style="text-align:center">' + (U.P() && U.P().slimes.length ? 'Your slimes are on the shelf. Tap one to sell it.' : 'Make slimes in the Studio to put them on the shelf.') + '</p><div class="sec">Shop words</div><div class="helpers">' + (L === 1 ? ['I want this one, please.', 'Here you are.', 'Thank you!', 'Bye-bye!'] : ['Can I help you?', 'How much is it?', 'It\u2019s $' + price + '.', 'Here you are.', 'Thank you!', 'I\u2019ll take it.']).map(function (w) { return '<button class="chip" data-act="listen" data-text="' + esc(w) + '">' + ic('speaker') + esc(w) + '</button>'; }).join('') + '</div></div>';
    var priceBox = L > 1 ? (sel.sample ? '<span class="how" style="margin:0">Price: <b>$' + price + '</b></span>' : '<span class="row" style="gap:6px"><b>Price</b><button class="btn white sm round" data-act="price" data-v="-1" aria-label="Lower price">' + ic('minus') + '</button><span class="ptag" style="position:static;transform:none;font-size:1.3em;padding:2px 14px">$' + price + '</span><button class="btn white sm round" data-act="price" data-v="1" aria-label="Higher price">' + ic('plus') + '</button></span>') : '';
    var dlg = '<div class="row" style="margin-top:10px;justify-content:space-between">' + priceBox + '<span class="row" style="gap:6px"><span class="how" style="margin:0">You are the</span><div class="seg"><button data-act="role" data-v="Seller" aria-pressed="' + (sh.me === 'Seller') + '">Seller</button><button data-act="role" data-v="Customer" aria-pressed="' + (sh.me === 'Customer') + '">Customer</button></div></span></div><div class="sec">Role-play</div><div class="dlg">' +
      lines.map(function (l, k) { var txt = E.plain(l[1]); return '<div class="line ' + l[0].toLowerCase() + (k === sh.line ? ' cur' : '') + (l[0] === sh.me ? ' me' : '') + '"><span class="who2">' + l[0] + '</span><span class="t" data-act="listen" data-text="' + esc(txt) + '">' + U.fmt(l[1]) + '</span><button class="btn white sm round" data-act="listen" data-text="' + esc(txt) + '" aria-label="Listen">' + ic('speaker') + '</button></div>'; }).join('') + '</div>' +
      '<div class="row"><button class="btn mint" data-act="shopLine">' + ic('check') + (sh.line >= lines.length - 1 ? ' Start again' : ' Next line') + '</button><button class="btn white sm" data-act="role" data-v="' + (sh.me === 'Seller' ? 'Customer' : 'Seller') + '">' + ic('shuffle') + ' Switch roles</button></div>';
    var pay = L > 1 ? '<div class="sec">Pay</div><div class="bills">' + [1, 5].map(function (v) { return '<button class="bill" data-act="bill" data-v="' + v + '">$' + v + '</button>'; }).join('') + '<button class="btn white sm round" data-act="bill" data-v="0" aria-label="Clear">' + ic('undo') + '</button><span class="how" style="margin:0" aria-live="polite">Paid <b>$' + sh.paid + '</b> of $' + price + '. ' + (sh.paid === price ? '<b style="color:var(--mint-d)">That’s right! Thank you!</b>' : sh.paid > price ? '<b style="color:var(--bad)">That’s too much.</b>' : '') + '</span></div>' : '';
    var panel = '<section class="panel"><div class="row" style="align-items:center"><img alt="" src="' + SL.slimeImage(sel, 150) + '" style="width:84px"><div><h2 style="margin:0">' + esc(sel.name) + '</h2><div class="how" style="margin:0">' + esc(C.recipeName(sel).text) + ' ' + esc(D.base(sel.base).name) + '</div></div></div>' + dlg + pay + '</section>';
    return { html: '<div class="shop">' + store + panel + '</div>' };
  };
  acts.shopSel = function (el) { S.sh.sel = el.dataset.v; S.sh.line = 0; S.sh.paid = 0; SS.snd.play('jar'); var s = U.findSlime(el.dataset.v); if (s) U.cue(s.name); U.render(); };
  acts.price = function (el) { var s = U.findSlime(S.sh.sel); if (!s || s.sample) return; s.price = Math.max(1, Math.min(10, (s.price || 3) + +el.dataset.v)); U.save(); S.sh.paid = 0; SS.snd.play('coin'); U.cue('It’s $' + s.price + '.'); U.render(); };
  acts.role = function (el) { S.sh.me = el.dataset.v; S.sh.line = 0; U.cue('You are the ' + el.dataset.v.toLowerCase() + '.'); U.render(); };
  acts.shopLine = function () { var list = document.querySelectorAll('.dlg .line'); var sh = S.sh; if (sh.line >= list.length - 1) { sh.line = 0; sh.paid = 0; } else { sh.line++; } U.render(); var cur = document.querySelector('.dlg .line.cur .t'); if (cur && !cur.closest('.me')) U.cue(cur.dataset.text); };
  acts.bill = function (el) { var v = +el.dataset.v; if (!v) S.sh.paid = 0; else { S.sh.paid += v; SS.snd.play('coin'); } var s = U.findSlime(S.sh.sel), price = Math.max(1, Math.min(10, (s && s.price) || 3)); if (S.sh.paid === price) { SS.snd.play('good'); var p = U.P(); if (p) { p.stars = (p.stars || 0) + 1; U.save(); } } U.render(); };
})(window.SS);

SS.ui.boot();
</script>

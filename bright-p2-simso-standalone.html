, or count on from the bigger number.`,marks:5},{id:`mock-01-q02`,testId:1,number:2,topic:`Word Problems and Reasoning`,subtopic:`Subtraction Word Problems`,difficulty:`Accessible`,question:`A toy shop has 27 balloons. It sells 9 balloons. How many balloons are left?`,diagram:null,choices:[{id:`A`,text:`16`},{id:`B`,text:`17`},{id:`C`,text:`18`},{id:`D`,text:`19`}],correctAnswer:`C`,explanationSteps:[`Start with 27 balloons.`,`Take away the 9 balloons that were sold: 27 - 9 = 18.`,`So 18 balloons are left. The answer is C.`],commonMistake:`Choosing B) 17 often happens when subtracting 10 instead of 9 and forgetting to add 1 back.`,quickTip:`Break 27 into 20 + 7, subtract 9 from the 7 by borrowing, or count back from 27.`,marks:5},{id:`mock-01-q03`,testId:1,number:3,topic:`Patterns and Operations`,subtopic:`Number Sequences`,difficulty:`Accessible`,question:`What number comes next? 4, 8, 12, 16, ____`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`19`},{id:`C`,text:`20`},{id:`D`,text:`21`}],correctAnswer:`C`,explanationSteps:[`Look at how much the numbers grow each time: 8-4=4, 12-8=4, 16-12=4.`,`The pattern adds 4 each time.`,`16 + 4 = 20, so the next number is 20. The answer is C.`],commonMistake:`Choosing A) 18 comes from adding only 2 instead of checking the real jump of 4 between each pair of numbers.`,quickTip:`Always check the difference between at least two pairs of numbers before deciding the pattern.`,marks:5},{id:`mock-01-q04`,testId:1,number:4,topic:`Number Skills`,subtopic:`Multiplication as Repeated Addition`,difficulty:`Accessible`,question:`Each box has 5 crayons. There are 4 boxes. How many crayons are there altogether?`,diagram:null,choices:[{id:`A`,text:`15`},{id:`B`,text:`18`},{id:`C`,text:`20`},{id:`D`,text:`25`}],correctAnswer:`C`,explanationSteps:[`Each box has 5 crayons and there are 4 boxes.`,`Add 5 four times: 5+5+5+5 = 20, which is the same as 4 x 5.`,`So there are 20 crayons altogether. The answer is C.`],commonMistake:`Choosing A) 15 usually means only 3 boxes were counted instead of all 4.`,quickTip:`For equal groups, multiply the number in each group by the number of groups.`,marks:5},{id:`mock-01-q05`,testId:1,number:5,topic:`Word Problems and Reasoning`,subtopic:`Multi-Step Word Problems`,difficulty:`Accessible`,question:`Mina has 10 stickers. Her friend gives her 6 more stickers. Then she loses 3 stickers. How many stickers does she have now?`,diagram:null,choices:[{id:`A`,text:`12`},{id:`B`,text:`13`},{id:`C`,text:`14`},{id:`D`,text:`15`}],correctAnswer:`B`,explanationSteps:[`Mina starts with 10 stickers.`,`Her friend gives her 6 more: 10 + 6 = 16.`,`She loses 3 stickers: 16 - 3 = 13.`,`So Mina has 13 stickers now. The answer is B.`],commonMistake:`Choosing C) 14 happens when a student only subtracts 2 instead of 3 at the last step.`,quickTip:`In multi-step problems, do one action at a time and write down the new total after each step.`,marks:5},{id:`mock-01-q06`,testId:1,number:6,topic:`Word Problems and Reasoning`,subtopic:`Addition Word Problems`,difficulty:`Accessible`,question:`There are 11 ducks in the pond and 7 more ducks arrive. How many ducks are there now?`,diagram:null,choices:[{id:`A`,text:`17`},{id:`B`,text:`18`},{id:`C`,text:`19`},{id:`D`,text:`20`}],correctAnswer:`B`,explanationSteps:[`Start with 11 ducks in the pond.`,`7 more ducks arrive, so add: 11 + 7 = 18.`,`There are 18 ducks now. The answer is B.`],commonMistake:`Choosing C) 19 often comes from adding 8 instead of 7 by mistake.`,quickTip:`Count on from 11: 12, 13, 14, 15, 16, 17, 18 - that's 7 counts forward.`,marks:5},{id:`mock-01-q07`,testId:1,number:7,topic:`Geometry and Measurement`,subtopic:`Properties of Polygons`,difficulty:`Accessible`,question:`How many sides does a pentagon have?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`B`,explanationSteps:[`A pentagon is a shape with straight sides.`,`The word 'penta' means five.`,`A pentagon has 5 sides. The answer is B.`],commonMistake:`Choosing C) 6 confuses a pentagon (5 sides) with a hexagon (6 sides).`,quickTip:`Remember: pentagon starts like 'penta,' which sounds like five.`,marks:5},{id:`mock-01-q08`,testId:1,number:8,topic:`Geometry and Measurement`,subtopic:`Properties of Polygons`,difficulty:`Accessible`,question:`Which shape has 3 sides?`,diagram:null,choices:[{id:`A`,text:`Rectangle`},{id:`B`,text:`Triangle`},{id:`C`,text:`Pentagon`},{id:`D`,text:`Circle`}],correctAnswer:`B`,explanationSteps:[`Look at each shape and count its sides.`,`A rectangle has 4 sides, a pentagon has 5 sides, and a circle has no straight sides.`,`A triangle has exactly 3 sides. The answer is B.`],commonMistake:`Choosing A) Rectangle mixes up the shape with 4 sides instead of 3.`,quickTip:`The word 'tri' means three, just like a tricycle has three wheels.`,marks:5},{id:`mock-01-q09`,testId:1,number:9,topic:`Geometry and Measurement`,subtopic:`Properties of Quadrilaterals`,difficulty:`Moderate`,question:`Which 2D shape has 4 equal sides?`,diagram:null,choices:[{id:`A`,text:`Triangle`},{id:`B`,text:`Rectangle`},{id:`C`,text:`Square`},{id:`D`,text:`Oval`}],correctAnswer:`C`,explanationSteps:[`A rectangle has 4 sides, but they are not all equal.`,`A triangle has only 3 sides, and an oval has no straight sides at all.`,`A square has 4 sides that are all the same length. The answer is C.`],commonMistake:`Choosing B) Rectangle forgets that a rectangle's sides are not all equal - only opposite sides match.`,quickTip:`A square is a special rectangle where every side is exactly the same length.`,marks:5},{id:`mock-01-q10`,testId:1,number:10,topic:`Geometry and Measurement`,subtopic:`Perimeter of Squares`,difficulty:`Moderate`,question:`What is the perimeter of a square with side length 4 cm?`,diagram:null,choices:[{id:`A`,text:`8 cm`},{id:`B`,text:`12 cm`},{id:`C`,text:`16 cm`},{id:`D`,text:`20 cm`}],correctAnswer:`C`,explanationSteps:[`A square has 4 equal sides, and each side is 4 cm.`,`Add all 4 sides together: 4+4+4+4 = 16, or multiply 4 x 4 = 16.`,`The perimeter is 16 cm. The answer is C.`],commonMistake:`Choosing B) 12 cm happens when only 3 sides are added instead of all 4.`,quickTip:`For a square's perimeter, just multiply the side length by 4.`,marks:5},{id:`mock-01-q11`,testId:1,number:11,topic:`Word Problems and Reasoning`,subtopic:`Multi-Step Word Problems`,difficulty:`Moderate`,question:`The temperature was 22°C in the morning. It went up by 6°C in the afternoon and then down by 5°C at night. What was the final temperature?`,diagram:null,choices:[{id:`A`,text:`21°C`},{id:`B`,text:`22°C`},{id:`C`,text:`23°C`},{id:`D`,text:`24°C`}],correctAnswer:`C`,explanationSteps:[`The morning temperature is 22°C.`,`It goes up by 6°C: 22 + 6 = 28°C.`,`Then it goes down by 5°C: 28 - 5 = 23°C.`,`The final temperature is 23°C. The answer is C.`],commonMistake:`Choosing B) 22°C comes from adding 6 and then subtracting 6 instead of 5, cancelling out the change completely.`,quickTip:`Do the 'up' step first, then the 'down' step, checking your new number each time.`,marks:5},{id:`mock-01-q12`,testId:1,number:12,topic:`Geometry and Measurement`,subtopic:`Perimeter of Rectangles`,difficulty:`Moderate`,question:`A rectangle has length 7 m and width 3 m. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`10 m`},{id:`B`,text:`14 m`},{id:`C`,text:`20 m`},{id:`D`,text:`21 m`}],correctAnswer:`C`,explanationSteps:[`A rectangle has two lengths and two widths.`,`Add the length and width first: 7 + 3 = 10.`,`Since there are two of each side, multiply by 2: 10 x 2 = 20.`,`The perimeter is 20 m. The answer is C.`],commonMistake:`Choosing B) 14 m happens when only one length and one width are added, forgetting the rectangle has two of each.`,quickTip:`Remember the rule: perimeter of a rectangle = 2 x (length + width).`,marks:5},{id:`mock-01-q13`,testId:1,number:13,topic:`Word Problems and Reasoning`,subtopic:`Set Reasoning`,difficulty:`Moderate`,question:`There are 6 red marbles and 4 green marbles. If all green marbles are changed into red marbles, how many red marbles will there be?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`10`},{id:`D`,text:`12`}],correctAnswer:`C`,explanationSteps:[`There are 6 red marbles and 4 green marbles to start.`,`All the green marbles change color to red, so they join the red group.`,`Add them together: 6 + 4 = 10.`,`There will be 10 red marbles. The answer is C.`],commonMistake:`Choosing B) 8 comes from only counting some of the green marbles instead of all 4 of them.`,quickTip:`When one group joins another, just add the two group sizes together.`,marks:5},{id:`mock-01-q14`,testId:1,number:14,topic:`Number Skills`,subtopic:`Multiplication Word Problems`,difficulty:`Moderate`,question:`Each tricycle has 3 wheels. If there are 5 tricycles, how many wheels are there in total?`,diagram:null,choices:[{id:`A`,text:`10`},{id:`B`,text:`12`},{id:`C`,text:`15`},{id:`D`,text:`18`}],correctAnswer:`C`,explanationSteps:[`Each tricycle has 3 wheels.`,`There are 5 tricycles, so add 3 five times, or multiply: 5 x 3 = 15.`,`There are 15 wheels in total. The answer is C.`],commonMistake:`Choosing B) 12 comes from multiplying 4 x 3 instead of 5 x 3, miscounting the number of tricycles.`,quickTip:`Think of tricycles like groups of 3 wheels, and multiply by how many tricycles there are.`,marks:5},{id:`mock-01-q15`,testId:1,number:15,topic:`Patterns and Operations`,subtopic:`Number Sequences (Doubling)`,difficulty:`Moderate`,question:`What comes next in the pattern? 3, 6, 12, 24, ____`,diagram:null,choices:[{id:`A`,text:`36`},{id:`B`,text:`42`},{id:`C`,text:`48`},{id:`D`,text:`52`}],correctAnswer:`C`,explanationSteps:[`Compare each number to the one before it: 6 is 3x2, 12 is 6x2, 24 is 12x2.`,`The pattern doubles the number each time.`,`24 x 2 = 48, so the next number is 48. The answer is C.`],commonMistake:`Choosing A) 36 comes from adding 12 each time instead of doubling, mixing up an adding pattern with a doubling pattern.`,quickTip:`Check whether a pattern is adding the same amount or multiplying by the same amount before choosing the next number.`,marks:5},{id:`mock-01-q16`,testId:1,number:16,topic:`Word Problems and Reasoning`,subtopic:`Multi-Step Word Problems`,difficulty:`Moderate`,question:`Tom has 9 apples. He eats 2 and then buys 5 more. How many apples does he have now?`,diagram:null,choices:[{id:`A`,text:`10`},{id:`B`,text:`11`},{id:`C`,text:`12`},{id:`D`,text:`13`}],correctAnswer:`C`,explanationSteps:[`Tom starts with 9 apples.`,`He eats 2 apples: 9 - 2 = 7.`,`Then he buys 5 more: 7 + 5 = 12.`,`Tom now has 12 apples. The answer is C.`],commonMistake:`Choosing D) 13 comes from adding 5 to the original 9 without first subtracting the 2 he ate.`,quickTip:`Follow the story in order: figure out what happens first, then what happens next.`,marks:5},{id:`mock-01-q17`,testId:1,number:17,topic:`Challenge Problems`,subtopic:`Two-Variable Logic (Heads and Legs)`,difficulty:`Moderate`,question:`In a farm, there are chickens and rabbits. There are 8 heads and 22 legs. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`2`},{id:`B`,text:`3`},{id:`C`,text:`4`},{id:`D`,text:`5`}],correctAnswer:`B`,explanationSteps:[`There are 8 animals in total, since each animal has 1 head.`,`Chickens have 2 legs and rabbits have 4 legs.`,`Try 3 rabbits and 5 chickens: 3 x 4 = 12 legs from rabbits, 5 x 2 = 10 legs from chickens, and 12 + 10 = 22 legs, which matches.`,`So there are 3 rabbits. The answer is B.`],commonMistake:`Choosing A) 2 comes from guessing too low and not checking that the total legs actually add up to 22.`,quickTip:`Try a guess for the number of rabbits, then check if the total legs match before moving on.`,marks:5},{id:`mock-01-q18`,testId:1,number:18,topic:`Word Problems and Reasoning`,subtopic:`Distance Word Problems`,difficulty:`Moderate`,question:`The distance from A to B is 2 km. The distance from B to C is 6 km. How far is it from A to C through B?`,diagram:null,choices:[{id:`A`,text:`6 km`},{id:`B`,text:`7 km`},{id:`C`,text:`8 km`},{id:`D`,text:`9 km`}],correctAnswer:`C`,explanationSteps:[`The distance from A to B is 2 km.`,`The distance from B to C is 6 km.`,`Since the trip goes through B, add both distances: 2 + 6 = 8.`,`The total distance from A to C is 8 km. The answer is C.`],commonMistake:`Choosing B) 7 km comes from a small addition slip instead of carefully adding 2 and 6.`,quickTip:`When a trip has two parts, add the distances of each part together.`,marks:5},{id:`mock-01-q19`,testId:1,number:19,topic:`Number Skills`,subtopic:`Division with Remainders`,difficulty:`Challenging`,question:`Lila gives 7 candies equally to her 2 friends. How many candies are left over?`,diagram:null,choices:[{id:`A`,text:`No leftover`},{id:`B`,text:`Yes, 1`},{id:`C`,text:`Yes, 2`},{id:`D`,text:`Yes, 3`}],correctAnswer:`B`,explanationSteps:[`Lila has 7 candies to share equally between 2 friends.`,`Give out candies one at a time: 2 friends get 3 candies each, using up 6 candies.`,`7 - 6 = 1 candy is left over.`,`So yes, there is 1 leftover candy. The answer is B.`],commonMistake:`Choosing A) No leftover comes from thinking 7 divides evenly by 2, forgetting that 7 is an odd number.`,quickTip:`Share the candies one at a time between the friends and see how many are left at the end.`,marks:5},{id:`mock-01-q20`,testId:1,number:20,topic:`Patterns and Operations`,subtopic:`Number Sequences`,difficulty:`Challenging`,question:`Which number should come next? 10, 20, 30, 40, ____`,diagram:null,choices:[{id:`A`,text:`45`},{id:`B`,text:`50`},{id:`C`,text:`55`},{id:`D`,text:`60`}],correctAnswer:`B`,explanationSteps:[`Look at the difference between each number: 20-10=10, 30-20=10, 40-30=10.`,`The pattern adds 10 each time.`,`40 + 10 = 50, so the next number is 50. The answer is B.`],commonMistake:`Choosing A) 45 comes from adding only 5 instead of the correct jump of 10.`,quickTip:`Check the difference between at least two pairs of numbers before you decide what to add.`,marks:5},{id:`mock-01-q21`,testId:1,number:21,topic:`Number Skills`,subtopic:`Multiples`,difficulty:`Challenging`,question:`What is the smallest 2-digit number divisible by 5?`,diagram:null,choices:[{id:`A`,text:`10`},{id:`B`,text:`11`},{id:`C`,text:`12`},{id:`D`,text:`15`}],correctAnswer:`A`,explanationSteps:[`A 2-digit number is any number from 10 to 99.`,`List multiples of 5: 5, 10, 15, 20...`,`The smallest one that is also a 2-digit number is 10. The answer is A.`],commonMistake:`Choosing D) 15 skips over 10, forgetting that 10 itself is already a 2-digit multiple of 5.`,quickTip:`Remember that 10 is both the smallest 2-digit number and a multiple of 5.`,marks:5},{id:`mock-01-q22`,testId:1,number:22,topic:`Number Skills`,subtopic:`Divisibility Rules`,difficulty:`Challenging`,question:`If a number ends in 0, what is it always divisible by?`,diagram:null,choices:[{id:`A`,text:`2 and 5`},{id:`B`,text:`3 only`},{id:`C`,text:`4 only`},{id:`D`,text:`9 only`}],correctAnswer:`A`,explanationSteps:[`A number that ends in 0 can always be split into equal groups of 2, since it is an even number.`,`It can also always be split into equal groups of 5, since 10, 20, 30... are all multiples of 5.`,`So a number ending in 0 is always divisible by both 2 and 5. The answer is A.`],commonMistake:`Choosing C) 4 only forgets that being divisible by 4 is not guaranteed just because a number ends in 0 (for example, 30 is not divisible by 4).`,quickTip:`Numbers ending in 0 are multiples of 10, and 10 = 2 x 5, so both 2 and 5 always divide them evenly.`,marks:5},{id:`mock-01-q23`,testId:1,number:23,topic:`Number Skills`,subtopic:`Rounding`,difficulty:`Challenging`,question:`Round 4,261 to the nearest hundred.`,diagram:null,choices:[{id:`A`,text:`4,200`},{id:`B`,text:`4,250`},{id:`C`,text:`4,300`},{id:`D`,text:`4,400`}],correctAnswer:`C`,explanationSteps:[`Look at the tens digit of 4,261, which is 6.`,`Since 6 is 5 or more, round the hundreds digit up.`,`4,261 rounds up to 4,300. The answer is C.`],commonMistake:`Choosing A) 4,200 comes from rounding down instead of checking that the tens digit (6) means you should round up.`,quickTip:`Look at the digit right after the place you are rounding to: 5 or more means round up.`,marks:5},{id:`mock-01-q24`,testId:1,number:24,topic:`Challenge Problems`,subtopic:`Permutations`,difficulty:`Challenging`,question:`How many different ways can the letters in CAT be arranged?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`CAT has 3 different letters: C, A, T.`,`For the first letter, there are 3 choices; for the second, 2 choices are left; for the last, only 1 choice remains.`,`Multiply: 3 x 2 x 1 = 6.`,`There are 6 different arrangements. The answer is D.`],commonMistake:`Choosing A) 3 comes from only counting which letter goes first, forgetting to also count the different orders for the remaining letters.`,quickTip:`Try listing a few arrangements by hand, like CAT, CTA, ACT, to see the pattern before multiplying.`,marks:5},{id:`mock-01-q25`,testId:1,number:25,topic:`Challenge Problems`,subtopic:`Pigeonhole Principle`,difficulty:`Challenging`,question:`A drawer has only black socks and white socks. What is the smallest number of socks you must take out without looking to be sure you get a matching pair?`,diagram:null,choices:[{id:`A`,text:`2`},{id:`B`,text:`3`},{id:`C`,text:`4`},{id:`D`,text:`5`}],correctAnswer:`B`,explanationSteps:[`There are only 2 colors of socks: black and white.`,`In the worst case, the first sock could be black and the second could be white - still no matching pair.`,`The third sock must match one of the first two colors, since there are only 2 colors.`,`So you need to take out 3 socks to be sure of a matching pair. The answer is B.`],commonMistake:`Choosing A) 2 assumes the first two socks picked will always match, but in the worst case they could be different colors.`,quickTip:`Think about the worst possible luck first - that tells you the smallest number you can always count on.`,marks:5},{id:`mock-01-q26`,testId:1,number:26,topic:`Challenge Problems`,subtopic:`Probability`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling an odd number?`,diagram:null,choices:[{id:`A`,text:`1 out of 2`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 6`},{id:`D`,text:`2 out of 3`}],correctAnswer:`A`,explanationSteps:[`A die has the numbers 1, 2, 3, 4, 5, 6.`,`The odd numbers are 1, 3, and 5, which is 3 out of 6 numbers.`,`3 out of 6 is the same as 1 out of 2.`,`The chance of rolling an odd number is 1 out of 2. The answer is A.`],commonMistake:`Choosing C) 1 out of 6 comes from thinking of just one single odd number instead of counting all three odd numbers.`,quickTip:`Count the favorable outcomes first, then compare them to the total number of outcomes.`,marks:5},{id:`mock-01-q27`,testId:1,number:27,topic:`Challenge Problems`,subtopic:`Counting Choices`,difficulty:`Olympiad`,question:`In a pet store, there are 3 kittens, 2 puppies, and 1 rabbit. How many choices are there if you choose one pet?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`C`,explanationSteps:[`There are 3 kittens, 2 puppies, and 1 rabbit to choose from.`,`Since you are choosing just one pet, add up all the animals: 3 + 2 + 1 = 6.`,`There are 6 possible choices. The answer is C.`],commonMistake:`Choosing A) 4 comes from forgetting to include one of the groups, such as leaving out the puppies or the rabbit.`,quickTip:`When choosing one item from several different groups, add the group sizes together.`,marks:5},{id:`mock-01-q28`,testId:1,number:28,topic:`Challenge Problems`,subtopic:`Permutations`,difficulty:`Olympiad`,question:`How many different 3-digit codes can be made using 1, 2, and 3 exactly once?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`The code uses the digits 1, 2, and 3, each exactly once.`,`For the first digit, there are 3 choices; for the second digit, 2 choices remain; for the last digit, only 1 choice is left.`,`Multiply: 3 x 2 x 1 = 6.`,`There are 6 different 3-digit codes. The answer is D.`],commonMistake:`Choosing A) 3 comes from only thinking about which digit goes first, forgetting the different orders for the remaining two digits.`,quickTip:`Try writing out a few codes, like 123, 132, 213, to check the pattern before multiplying.`,marks:5},{id:`mock-01-q29`,testId:1,number:29,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Olympiad`,question:`You have 4 flavors of juice: apple, orange, grape, and lemon. How many different ways can you choose 2 flavors?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`8`}],correctAnswer:`C`,explanationSteps:[`There are 4 flavors: apple, orange, grape, and lemon.`,`List every possible pair without repeating: apple-orange, apple-grape, apple-lemon, orange-grape, orange-lemon, grape-lemon.`,`Counting the pairs gives 6 different combinations. The answer is C.`],commonMistake:`Choosing A) 4 comes from only counting each flavor once instead of counting every possible pair of flavors.`,quickTip:`When order does not matter, try listing the pairs systematically so you do not count any twice or miss any.`,marks:5},{id:`mock-01-q30`,testId:1,number:30,topic:`Patterns and Operations`,subtopic:`Number Sequences`,difficulty:`Olympiad`,question:`Which number line answer is correct? 15, 20, 25, 30, ____, 40`,diagram:null,choices:[{id:`A`,text:`32`},{id:`B`,text:`33`},{id:`C`,text:`35`},{id:`D`,text:`36`}],correctAnswer:`C`,explanationSteps:[`Look at the difference between each number: 20-15=5, 25-20=5, 30-25=5.`,`The pattern adds 5 each time.`,`30 + 5 = 35, so the missing number is 35.`,`Check the next number too: 35 + 5 = 40, which matches. The answer is C.`],commonMistake:`Choosing A) 32 comes from guessing a number close to 30 instead of carefully checking the constant jump of 5.`,quickTip:`Use both the number before and after the blank to check that your answer keeps the same pattern.`,marks:5}],2:[{id:`mock-02-q01`,testId:2,number:1,topic:`Word Problems and Reasoning`,subtopic:`Addition within 100`,difficulty:`Accessible`,question:`There are 18 mangoes in one basket and 17 mangoes in another basket. How many mangoes are there in total?`,diagram:null,choices:[{id:`A`,text:`34`},{id:`B`,text:`35`},{id:`C`,text:`36`},{id:`D`,text:`37`}],correctAnswer:`B`,explanationSteps:[`We need to add the two baskets together: 18 + 17.`,`Add the ones: 8 + 7 = 15. Write down 5 and carry the 1 ten.`,`Add the tens: 1 + 1 + 1 (carried) = 3.`,`Put them together: 35. Therefore the answer is B.`],commonMistake:`Choosing A) 34 happens if you forget to carry the ten when adding 8 + 7 in the ones place.`,quickTip:`Line up the tens and ones, add the ones first, and carry over if needed.`,marks:5},{id:`mock-02-q02`,testId:2,number:2,topic:`Word Problems and Reasoning`,subtopic:`Subtraction within 100`,difficulty:`Accessible`,question:`A box has 40 crayons. 16 crayons are used. How many crayons are left?`,diagram:null,choices:[{id:`A`,text:`22`},{id:`B`,text:`23`},{id:`C`,text:`24`},{id:`D`,text:`25`}],correctAnswer:`C`,explanationSteps:[`We start with 40 crayons and take away 16.`,`Subtract the ones: 0 - 6 needs borrowing, so borrow a ten: 10 - 6 = 4.`,`Subtract the tens: 3 (after borrowing) - 1 = 2.`,`So 40 - 16 = 24. Therefore the answer is C.`],commonMistake:`Choosing B) 23 happens if you borrow from the tens place incorrectly and end up one less than the correct answer.`,quickTip:`Count up from 16 to 40 in tens and ones to double-check your subtraction.`,marks:5},{id:`mock-02-q03`,testId:2,number:3,topic:`Patterns and Operations`,subtopic:`Number patterns - skip counting by 7`,difficulty:`Accessible`,question:`What number should come next? 7, 14, 21, 28, ____`,diagram:null,choices:[{id:`A`,text:`32`},{id:`B`,text:`35`},{id:`C`,text:`36`},{id:`D`,text:`42`}],correctAnswer:`B`,explanationSteps:[`Look at how the numbers change: 14 - 7 = 7, 21 - 14 = 7, 28 - 21 = 7.`,`So the pattern rule is 'add 7 each time'.`,`Add 7 to 28: 28 + 7 = 35. Therefore the answer is B.`],commonMistake:`Choosing C) 36 happens if you accidentally add 8 instead of 7.`,quickTip:`Find the pattern rule first by checking the gap between each pair of numbers.`,marks:5},{id:`mock-02-q04`,testId:2,number:4,topic:`Word Problems and Reasoning`,subtopic:`Multiplication as repeated addition`,difficulty:`Accessible`,question:`Each bag has 6 marbles. There are 5 bags. How many marbles are there altogether?`,diagram:null,choices:[{id:`A`,text:`28`},{id:`B`,text:`29`},{id:`C`,text:`30`},{id:`D`,text:`31`}],correctAnswer:`C`,explanationSteps:[`Each bag has 6 marbles and there are 5 bags.`,`We can add 6 five times: 6 + 6 + 6 + 6 + 6, or multiply 6 x 5.`,`6 x 5 = 30. Therefore the answer is C.`],commonMistake:`Choosing A) 28 happens if you only count marbles from 4 bags instead of 5.`,quickTip:`Skip count by 6s five times: 6, 12, 18, 24, 30.`,marks:5},{id:`mock-02-q05`,testId:2,number:5,topic:`Word Problems and Reasoning`,subtopic:`Multi-step addition and subtraction`,difficulty:`Accessible`,question:`Nina has 15 stickers. Her teacher gives her 8 more stickers. Then she gives 6 stickers to her friend. How many stickers does she have now?`,diagram:null,choices:[{id:`A`,text:`15`},{id:`B`,text:`16`},{id:`C`,text:`17`},{id:`D`,text:`18`}],correctAnswer:`C`,explanationSteps:[`Start with 15 stickers.`,`Her teacher gives 8 more: 15 + 8 = 23.`,`She gives away 6: 23 - 6 = 17. Therefore the answer is C.`],commonMistake:`Choosing A) 15 happens if you forget to add the 8 stickers from the teacher and only think about the stickers she gave away.`,quickTip:`Do the steps in the order they happen: add first, then subtract.`,marks:5},{id:`mock-02-q06`,testId:2,number:6,topic:`Word Problems and Reasoning`,subtopic:`Addition within 100`,difficulty:`Accessible`,question:`There are 19 birds on one tree and 13 birds on another tree. How many birds are there in total?`,diagram:null,choices:[{id:`A`,text:`30`},{id:`B`,text:`31`},{id:`C`,text:`32`},{id:`D`,text:`33`}],correctAnswer:`C`,explanationSteps:[`Add the two groups of birds: 19 + 13.`,`Add the ones: 9 + 3 = 12. Write 2 and carry the 1 ten.`,`Add the tens: 1 + 1 + 1 (carried) = 3.`,`So 19 + 13 = 32. Therefore the answer is C.`],commonMistake:`Choosing B) 31 happens if you forget to carry the ten when adding 9 + 3 in the ones column.`,quickTip:`Add the ones first (9 + 3 = 12), write down 2, and carry the 1 ten.`,marks:5},{id:`mock-02-q07`,testId:2,number:7,topic:`Geometry and Measurement`,subtopic:`Names of polygons`,difficulty:`Accessible`,question:`Which shape has 8 sides?`,diagram:null,choices:[{id:`A`,text:`Hexagon`},{id:`B`,text:`Heptagon`},{id:`C`,text:`Octagon`},{id:`D`,text:`Pentagon`}],correctAnswer:`C`,explanationSteps:[`A hexagon has 6 sides, a heptagon has 7 sides, and a pentagon has 5 sides.`,`An octagon has 8 sides.`,`Therefore the answer is C.`],commonMistake:`Choosing B) Heptagon happens if you mix up hepta- (7) with octa- (8).`,quickTip:`Remember: an octopus has 8 legs, and an octagon has 8 sides!`,marks:5},{id:`mock-02-q08`,testId:2,number:8,topic:`Geometry and Measurement`,subtopic:`Properties of quadrilaterals`,difficulty:`Accessible`,question:`Which shape has 4 sides, and all sides are equal?`,diagram:null,choices:[{id:`A`,text:`Rectangle`},{id:`B`,text:`Square`},{id:`C`,text:`Triangle`},{id:`D`,text:`Oval`}],correctAnswer:`B`,explanationSteps:[`A triangle has only 3 sides, so it is not the answer.`,`An oval has no straight sides.`,`A rectangle has 4 sides, but they are not all equal (length and width differ).`,`A square has 4 sides that are all the same length. Therefore the answer is B.`],commonMistake:`Choosing A) Rectangle happens if you forget that a rectangle's sides are not all equal length.`,quickTip:`A square is special because all 4 of its sides are the same length.`,marks:5},{id:`mock-02-q09`,testId:2,number:9,topic:`Geometry and Measurement`,subtopic:`Properties of rectangles`,difficulty:`Moderate`,question:`How many corners does a rectangle have?`,diagram:null,choices:[{id:`A`,text:`2`},{id:`B`,text:`3`},{id:`C`,text:`4`},{id:`D`,text:`5`}],correctAnswer:`C`,explanationSteps:[`Picture a rectangle shape, like a door or a book cover.`,`Trace around the shape and count each corner where two sides meet.`,`A rectangle has 4 corners. Therefore the answer is C.`],commonMistake:`Choosing B) 3 happens if you miss counting one corner while going around the shape.`,quickTip:`Trace each corner with your finger and count as you go: 1, 2, 3, 4.`,marks:5},{id:`mock-02-q10`,testId:2,number:10,topic:`Geometry and Measurement`,subtopic:`Perimeter of a square`,difficulty:`Moderate`,question:`What is the perimeter of a square with side length 6 cm?`,diagram:null,choices:[{id:`A`,text:`12 cm`},{id:`B`,text:`18 cm`},{id:`C`,text:`24 cm`},{id:`D`,text:`36 cm`}],correctAnswer:`C`,explanationSteps:[`A square has 4 equal sides, each 6 cm long.`,`Perimeter means the distance all the way around, so we add all 4 sides: 6 + 6 + 6 + 6, or multiply 4 x 6.`,`4 x 6 = 24 cm. Therefore the answer is C.`],commonMistake:`Choosing B) 18 cm happens if you only add three sides (6 + 6 + 6) instead of all four.`,quickTip:`For a square, perimeter = 4 x side length.`,marks:5},{id:`mock-02-q11`,testId:2,number:11,topic:`Geometry and Measurement`,subtopic:`Perimeter of a rectangle`,difficulty:`Moderate`,question:`What is the perimeter of a rectangle with length 9 cm and width 4 cm?`,diagram:null,choices:[{id:`A`,text:`13 cm`},{id:`B`,text:`18 cm`},{id:`C`,text:`22 cm`},{id:`D`,text:`26 cm`}],correctAnswer:`D`,explanationSteps:[`A rectangle has two lengths and two widths.`,`Add length and width once: 9 + 4 = 13.`,`Double it because there are two of each side: 13 x 2 = 26 cm. Therefore the answer is D.`],commonMistake:`Choosing A) 13 cm happens if you add the length and width once but forget to double it for all four sides.`,quickTip:`Perimeter of a rectangle = 2 x (length + width).`,marks:5},{id:`mock-02-q12`,testId:2,number:12,topic:`Word Problems and Reasoning`,subtopic:`Multi-step temperature changes`,difficulty:`Moderate`,question:`The temperature was 18°C in the morning. It increased by 9°C in the afternoon and dropped by 7°C at night. What was the final temperature?`,diagram:null,choices:[{id:`A`,text:`18°C`},{id:`B`,text:`19°C`},{id:`C`,text:`20°C`},{id:`D`,text:`21°C`}],correctAnswer:`C`,explanationSteps:[`Start at 18°C in the morning.`,`It increases by 9°C: 18 + 9 = 27°C in the afternoon.`,`It drops by 7°C at night: 27 - 7 = 20°C. Therefore the answer is C.`],commonMistake:`Choosing B) 19°C happens if you subtract 8 instead of 7 when finding the night temperature.`,quickTip:`Work step by step: first add the increase, then subtract the drop.`,marks:5},{id:`mock-02-q13`,testId:2,number:13,topic:`Word Problems and Reasoning`,subtopic:`Combining quantities`,difficulty:`Moderate`,question:`There are 7 blue marbles and 9 red marbles. If all the red marbles are changed into blue marbles, how many blue marbles will there be?`,diagram:null,choices:[{id:`A`,text:`14`},{id:`B`,text:`15`},{id:`C`,text:`16`},{id:`D`,text:`17`}],correctAnswer:`C`,explanationSteps:[`There are 7 blue marbles to start with.`,`All 9 red marbles become blue too, so we add them: 7 + 9.`,`7 + 9 = 16. Therefore the answer is C.`],commonMistake:`Choosing B) 15 happens if you think there are only 6 blue marbles instead of 7.`,quickTip:`Since all the marbles end up blue, just add the two groups together: 7 + 9.`,marks:5},{id:`mock-02-q14`,testId:2,number:14,topic:`Word Problems and Reasoning`,subtopic:`Multiplication and addition combined`,difficulty:`Moderate`,question:`Every bicycle has 2 wheels. Every tricycle has 3 wheels. If there are 3 bicycles and 4 tricycles, how many wheels are there in total?`,diagram:null,choices:[{id:`A`,text:`16`},{id:`B`,text:`17`},{id:`C`,text:`18`},{id:`D`,text:`19`}],correctAnswer:`C`,explanationSteps:[`3 bicycles have 3 x 2 = 6 wheels.`,`4 tricycles have 4 x 3 = 12 wheels.`,`Add both totals: 6 + 12 = 18. Therefore the answer is C.`],commonMistake:`Choosing A) 16 happens if you multiply 4 tricycles by 2 wheels instead of 3, getting 8 instead of 12.`,quickTip:`Find the wheels for bikes and trikes separately, then add the two totals together.`,marks:5},{id:`mock-02-q15`,testId:2,number:15,topic:`Patterns and Operations`,subtopic:`Number patterns - doubling`,difficulty:`Moderate`,question:`What number comes next in the pattern? 5, 10, 20, 40, ____`,diagram:null,choices:[{id:`A`,text:`50`},{id:`B`,text:`60`},{id:`C`,text:`70`},{id:`D`,text:`80`}],correctAnswer:`D`,explanationSteps:[`Look at how each number changes: 10 is double 5, 20 is double 10, 40 is double 20.`,`The pattern rule is 'double the number each time'.`,`Double 40: 40 x 2 = 80. Therefore the answer is D.`],commonMistake:`Choosing A) 50 happens if you add 10 each time instead of noticing the numbers double.`,quickTip:`Check the pattern rule carefully: each number here is double the one before it, not just bigger by a fixed amount.`,marks:5},{id:`mock-02-q16`,testId:2,number:16,topic:`Word Problems and Reasoning`,subtopic:`Multi-step addition and subtraction`,difficulty:`Moderate`,question:`Ben has 14 apples. He gives away 5 apples and then gets 9 more apples. How many apples does he have now?`,diagram:null,choices:[{id:`A`,text:`17`},{id:`B`,text:`18`},{id:`C`,text:`19`},{id:`D`,text:`20`}],correctAnswer:`B`,explanationSteps:[`Start with 14 apples.`,`He gives away 5: 14 - 5 = 9.`,`He gets 9 more: 9 + 9 = 18. Therefore the answer is B.`],commonMistake:`Choosing C) 19 happens if you add 9 + 9 incorrectly and get one too many.`,quickTip:`Do the steps in order: subtract first, then add.`,marks:5},{id:`mock-02-q17`,testId:2,number:17,topic:`Word Problems and Reasoning`,subtopic:`Logical reasoning with two variables`,difficulty:`Moderate`,question:`On a farm, there are chickens and rabbits. There are 9 heads and 26 legs. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`B`,explanationSteps:[`Every animal has 1 head, so there are 9 animals in total.`,`Try 4 rabbits (4 legs each) and 5 chickens (2 legs each): 9 heads total.`,`Check the legs: 4 x 4 = 16 rabbit legs, 5 x 2 = 10 chicken legs, 16 + 10 = 26 legs. This matches!`,`Therefore the answer is B, 4 rabbits.`],commonMistake:`Choosing A) 3 happens if you guess 3 rabbits and 6 chickens without checking that the legs actually add up to 26.`,quickTip:`Guess a number of rabbits, then check: rabbits have 4 legs and chickens have 2 legs, and the total must match.`,marks:5},{id:`mock-02-q18`,testId:2,number:18,topic:`Word Problems and Reasoning`,subtopic:`Adding distances`,difficulty:`Moderate`,question:`The distance from A to B is 4 km. The distance from B to C is 7 km. How far is it from A to C through B?`,diagram:null,choices:[{id:`A`,text:`9 km`},{id:`B`,text:`10 km`},{id:`C`,text:`11 km`},{id:`D`,text:`12 km`}],correctAnswer:`C`,explanationSteps:[`Travelling from A to C through B means going A to B, then B to C.`,`Add the two distances: 4 + 7.`,`4 + 7 = 11 km. Therefore the answer is C.`],commonMistake:`Choosing B) 10 km happens if you miscount and add 4 + 6 instead of 4 + 7.`,quickTip:`Since the trip passes through B, just add the two separate distances together.`,marks:5},{id:`mock-02-q19`,testId:2,number:19,topic:`Number Skills`,subtopic:`Division with remainder`,difficulty:`Challenging`,question:`A teacher has 11 cookies. She shares them equally among 2 children. How many cookies are left over?`,diagram:null,choices:[{id:`A`,text:`0`},{id:`B`,text:`1`},{id:`C`,text:`2`},{id:`D`,text:`3`}],correctAnswer:`B`,explanationSteps:[`Share 11 cookies between 2 children as evenly as possible.`,`Each child can get 5 cookies: 2 x 5 = 10 cookies given out.`,`Cookies left over: 11 - 10 = 1. Therefore the answer is B.`],commonMistake:`Choosing A) 0 happens if you assume 11 cookies always split evenly with no leftovers.`,quickTip:`Share the cookies one at a time between the 2 children and see how many are left at the end.`,marks:5},{id:`mock-02-q20`,testId:2,number:20,topic:`Patterns and Operations`,subtopic:`Number patterns - skip counting by 3`,difficulty:`Challenging`,question:`Which number should come next? 12, 15, 18, 21, ____`,diagram:null,choices:[{id:`A`,text:`22`},{id:`B`,text:`23`},{id:`C`,text:`24`},{id:`D`,text:`25`}],correctAnswer:`C`,explanationSteps:[`Check the gap between the numbers: 15 - 12 = 3, 18 - 15 = 3, 21 - 18 = 3.`,`The pattern rule is 'add 3 each time'.`,`Add 3 to 21: 21 + 3 = 24. Therefore the answer is C.`],commonMistake:`Choosing B) 23 happens if you add 2 instead of 3 to get the next number.`,quickTip:`Check the gap between numbers each time to find the true pattern rule.`,marks:5},{id:`mock-02-q21`,testId:2,number:21,topic:`Number Skills`,subtopic:`Divisibility by 4`,difficulty:`Challenging`,question:`What is the smallest 2-digit number divisible by 4?`,diagram:null,choices:[{id:`A`,text:`10`},{id:`B`,text:`11`},{id:`C`,text:`12`},{id:`D`,text:`14`}],correctAnswer:`C`,explanationSteps:[`The smallest 2-digit numbers are 10, 11, 12, 13...`,`Check each one: 10 ÷ 4 = 2 remainder 2 (no), 11 ÷ 4 = 2 remainder 3 (no), 12 ÷ 4 = 3 exactly (yes!).`,`So the smallest 2-digit number divisible by 4 is 12. Therefore the answer is C.`],commonMistake:`Choosing A) 10 happens if you think being an even number is enough, forgetting it must divide evenly by 4.`,quickTip:`Skip count by 4s: 4, 8, 12... the first one with two digits is 12.`,marks:5},{id:`mock-02-q22`,testId:2,number:22,topic:`Number Skills`,subtopic:`Divisibility rules`,difficulty:`Challenging`,question:`If a number ends in 0, which of the following is always true?`,diagram:null,choices:[{id:`A`,text:`It is divisible by 2 and 5`},{id:`B`,text:`It is divisible by 3 only`},{id:`C`,text:`It is divisible by 9 only`},{id:`D`,text:`It is an odd number`}],correctAnswer:`A`,explanationSteps:[`A number ending in 0 is the same as a multiple of 10, like 10, 20, 30, 100.`,`Every multiple of 10 can be split evenly into groups of 2 (it is even) and into groups of 5.`,`So it is always divisible by both 2 and 5. Therefore the answer is A.`],commonMistake:`Choosing B) It is divisible by 3 only happens if you confuse the ends-in-0 rule with the different rule for divisibility by 3.`,quickTip:`Any number ending in 0 can always be split evenly into groups of 2 or groups of 5.`,marks:5},{id:`mock-02-q23`,testId:2,number:23,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Challenging`,question:`Round 5,349 to the nearest hundred.`,diagram:null,choices:[{id:`A`,text:`5,300`},{id:`B`,text:`5,350`},{id:`C`,text:`5,400`},{id:`D`,text:`5,500`}],correctAnswer:`A`,explanationSteps:[`5,349 is between 5,300 and 5,400.`,`To round to the nearest hundred, look at the tens digit, which is 4.`,`Since 4 is less than 5, round down, keeping the hundreds digit the same.`,`So 5,349 rounds to 5,300. Therefore the answer is A.`],commonMistake:`Choosing C) 5,400 happens if you round up even though the tens digit (4) is less than 5, which actually means you should round down.`,quickTip:`Look only at the tens digit to decide: if it's 0-4, round down; if it's 5-9, round up.`,marks:5},{id:`mock-02-q24`,testId:2,number:24,topic:`Challenge Problems`,subtopic:`Permutations of letters`,difficulty:`Challenging`,question:`How many different ways can the letters in "SUN" be arranged?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`There are 3 different letters: S, U, N.`,`For the first spot, there are 3 letter choices. For the second spot, 2 letters remain. For the last spot, only 1 letter is left.`,`Multiply the choices: 3 x 2 x 1 = 6. Therefore the answer is D.`],commonMistake:`Choosing A) 3 happens if you only count one arrangement for each starting letter and forget there are 2 ways to arrange the remaining two letters.`,quickTip:`Multiply the choices for each position: 3 x 2 x 1 = 6.`,marks:5},{id:`mock-02-q25`,testId:2,number:25,topic:`Challenge Problems`,subtopic:`Pigeonhole principle`,difficulty:`Challenging`,question:`A drawer has only red socks and blue socks. What is the smallest number of socks you must take out without looking to be sure you get a matching pair?`,diagram:null,choices:[{id:`A`,text:`2`},{id:`B`,text:`3`},{id:`C`,text:`4`},{id:`D`,text:`5`}],correctAnswer:`B`,explanationSteps:[`Think of the worst possible case: what if the socks you pick keep being different colors?`,`With only 2 colors, the first 2 socks could be one red and one blue (no match yet).`,`The 3rd sock must be either red or blue, so it will match one of the first two.`,`So you need 3 socks to guarantee a matching pair. Therefore the answer is B.`],commonMistake:`Choosing A) 2 happens if you assume the first two socks pulled out must match, but they could be one red and one blue.`,quickTip:`Always think of the worst case first: what is the unluckiest way the socks could come out?`,marks:5},{id:`mock-02-q26`,testId:2,number:26,topic:`Challenge Problems`,subtopic:`Basic probability`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number greater than 4?`,diagram:null,choices:[{id:`A`,text:`1 out of 2`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 4`},{id:`D`,text:`2 out of 3`}],correctAnswer:`B`,explanationSteps:[`Numbers greater than 4 on the die are 5 and 6. That is 2 numbers.`,`There are 6 numbers in total on the die.`,`The chance is 2 out of 6, which simplifies to 1 out of 3. Therefore the answer is B.`],commonMistake:`Choosing A) 1 out of 2 happens if you think 3 out of 6 numbers are greater than 4, but only 5 and 6 actually qualify.`,quickTip:`List the numbers greater than 4 first (5 and 6), then compare that count to all 6 possible numbers.`,marks:5},{id:`mock-02-q27`,testId:2,number:27,topic:`Challenge Problems`,subtopic:`Counting principle (addition rule)`,difficulty:`Olympiad`,question:`In a pet store, there are 2 kittens, 3 puppies, and 4 rabbits. How many choices are there if you choose one pet?`,diagram:null,choices:[{id:`A`,text:`7`},{id:`B`,text:`8`},{id:`C`,text:`9`},{id:`D`,text:`10`}],correctAnswer:`C`,explanationSteps:[`Since you are choosing just one pet, add up all the different pets available.`,`2 kittens + 3 puppies + 4 rabbits.`,`2 + 3 + 4 = 9. Therefore the answer is C.`],commonMistake:`Choosing B) 8 happens if you forget to include one of the rabbits when adding all the pets together.`,quickTip:`When choosing just one item from separate groups, simply add all the group totals together.`,marks:5},{id:`mock-02-q28`,testId:2,number:28,topic:`Challenge Problems`,subtopic:`Permutations of digits`,difficulty:`Olympiad`,question:`How many different 3-digit codes can be made using 2, 4, and 6 exactly once each?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`D`,explanationSteps:[`There are 3 choices for the first digit.`,`Once the first digit is used, there are 2 choices left for the second digit.`,`Only 1 digit remains for the last spot.`,`Multiply: 3 x 2 x 1 = 6. Therefore the answer is D.`],commonMistake:`Choosing A) 3 happens if you only count one arrangement for each first digit instead of the 2 ways to arrange the remaining digits.`,quickTip:`Multiply the choices for each position: 3 x 2 x 1 = 6.`,marks:5},{id:`mock-02-q29`,testId:2,number:29,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Olympiad`,question:`You have 5 flavors of juice: apple, orange, grape, lemon, and mango. How many different ways can you choose 2 flavors?`,diagram:null,choices:[{id:`A`,text:`8`},{id:`B`,text:`9`},{id:`C`,text:`10`},{id:`D`,text:`12`}],correctAnswer:`C`,explanationSteps:[`List all pairs carefully: apple can pair with orange, grape, lemon, mango (4 pairs).`,`Orange (without repeating apple) can pair with grape, lemon, mango (3 more pairs).`,`Grape can pair with lemon, mango (2 more pairs). Lemon can pair with mango (1 more pair).`,`Add them all: 4 + 3 + 2 + 1 = 10. Therefore the answer is C.`],commonMistake:`Choosing A) 8 happens if you forget some of the pairs while listing them out by hand.`,quickTip:`List all pairs systematically, starting with one flavor paired with every other flavor, without repeating a pair twice.`,marks:5},{id:`mock-02-q30`,testId:2,number:30,topic:`Patterns and Operations`,subtopic:`Number patterns on a number line`,difficulty:`Olympiad`,question:`Which number line answer is correct? 20, 25, 30, 35, ____, 45`,diagram:null,choices:[{id:`A`,text:`36`},{id:`B`,text:`38`},{id:`C`,text:`40`},{id:`D`,text:`42`}],correctAnswer:`C`,explanationSteps:[`Check the gap between each pair of numbers: 25 - 20 = 5, 30 - 25 = 5, 35 - 30 = 5.`,`The pattern rule is 'add 5 each time'.`,`Add 5 to 35: 35 + 5 = 40. Check it also works going to 45: 40 + 5 = 45. Correct!`,`Therefore the answer is C.`],commonMistake:`Choosing B) 38 happens if you guess a number without checking that the pattern must add exactly 5 each time.`,quickTip:`Check the jump between each pair of numbers first, then use that same jump to find the missing number.`,marks:5}],3:[{id:`mock-03-q01`,testId:3,number:1,topic:`Word Problems and Reasoning`,subtopic:`Multi-step Addition and Subtraction`,difficulty:`Accessible`,question:`Emma has 18 stickers. Her friend gives her 7 more stickers. Then Emma gives 9 stickers to her cousin. After that, she finds 4 more stickers in her bag. How many stickers does Emma have now?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`19`},{id:`C`,text:`20`},{id:`D`,text:`21`}],correctAnswer:`C`,explanationSteps:[`Start with 18 stickers and add 7: 18 + 7 = 25.`,`Emma gives away 9 stickers: 25 - 9 = 16.`,`She finds 4 more stickers: 16 + 4 = 20.`],commonMistake:`Choosing B) 19 by miscalculating 25 - 9 as 15 instead of 16, then adding 4 to get 19.`,quickTip:`Work through the story one step at a time, in the order it happens.`,marks:5},{id:`mock-03-q02`,testId:3,number:2,topic:`Patterns and Operations`,subtopic:`Number Sequences`,difficulty:`Accessible`,question:`What number should come next? 4, 9, 19, 39, ____`,diagram:null,choices:[{id:`A`,text:`59`},{id:`B`,text:`69`},{id:`C`,text:`79`},{id:`D`,text:`89`}],correctAnswer:`C`,explanationSteps:[`Check how each number is made from the one before: 4 x 2 + 1 = 9, 9 x 2 + 1 = 19, 19 x 2 + 1 = 39.`,`Use the same rule on 39: 39 x 2 + 1 = 79.`],commonMistake:`Choosing A) 59 by assuming the gap just adds 20 each time (like 39 + 20), instead of noticing the gap doubles.`,quickTip:`For tricky sequences, try 'multiply then add' rules, not just 'add the same amount'.`,marks:5},{id:`mock-03-q03`,testId:3,number:3,topic:`Geometry and Measurement`,subtopic:`Perimeter`,difficulty:`Accessible`,question:`A rectangle has length 9 cm and width 6 cm. A square has side length 7 cm. How much greater is the perimeter of the rectangle than the perimeter of the square?`,diagram:null,choices:[{id:`A`,text:`1 cm`},{id:`B`,text:`2 cm`},{id:`C`,text:`3 cm`},{id:`D`,text:`4 cm`}],correctAnswer:`B`,explanationSteps:[`Rectangle perimeter = 2 x (9 + 6) = 30 cm.`,`Square perimeter = 4 x 7 = 28 cm.`,`Difference = 30 - 28 = 2 cm.`],commonMistake:`Choosing D) 4 cm after doubling only the length of the rectangle (2 x 9 + 6 = 24) instead of doubling the whole length-plus-width sum.`,quickTip:`Perimeter of a rectangle is always 2 x (length + width) - don't forget to double the whole sum.`,marks:5},{id:`mock-03-q04`,testId:3,number:4,topic:`Word Problems and Reasoning`,subtopic:`Heads and Legs Reasoning`,difficulty:`Accessible`,question:`There are chickens and rabbits in a pen. There are 11 heads and 30 legs in total. How many chickens are there?`,diagram:null,choices:[{id:`A`,text:`5`},{id:`B`,text:`6`},{id:`C`,text:`7`},{id:`D`,text:`8`}],correctAnswer:`C`,explanationSteps:[`If all 11 animals were chickens, there would be 11 x 2 = 22 legs.`,`There are 30 - 22 = 8 extra legs, and each rabbit adds 2 extra legs, so there are 8 / 2 = 4 rabbits.`,`So chickens = 11 - 4 = 7.`],commonMistake:`Choosing A) 5 by guessing an answer close to 30 divided by 11 instead of using the 'all chickens first' method.`,quickTip:`Pretend every animal is a chicken first, then trade some for rabbits to match the extra legs.`,marks:5},{id:`mock-03-q05`,testId:3,number:5,topic:`Number Skills`,subtopic:`Division with Remainders`,difficulty:`Accessible`,question:`A teacher shares 17 pencils equally among 4 students. How many pencils are left over?`,diagram:null,choices:[{id:`A`,text:`0`},{id:`B`,text:`1`},{id:`C`,text:`2`},{id:`D`,text:`3`}],correctAnswer:`B`,explanationSteps:[`4 x 4 = 16, which is the closest multiple of 4 without going over 17.`,`17 - 16 = 1 pencil left over.`],commonMistake:`Choosing C) 2 by mistakenly thinking 4 x 4 = 15, which gives the wrong remainder.`,quickTip:`Find the biggest multiple of the sharing number that doesn't go over the total, then subtract.`,marks:5},{id:`mock-03-q06`,testId:3,number:6,topic:`Number Skills`,subtopic:`Rounding Numbers`,difficulty:`Accessible`,question:`Round 6,451 to the nearest hundred.`,diagram:null,choices:[{id:`A`,text:`6,400`},{id:`B`,text:`6,500`},{id:`C`,text:`6,450`},{id:`D`,text:`6,600`}],correctAnswer:`B`,explanationSteps:[`6,451 is between 6,400 and 6,500.`,`The amount past 6,400 is 51, and since 51 is 50 or more, round up to 6,500.`],commonMistake:`Choosing A) 6,400 by only looking at the last digit (1) and thinking it's small, instead of checking the full 51.`,quickTip:`Look at the tens and ones together, not just the very last digit, when rounding to the nearest hundred.`,marks:5},{id:`mock-03-q07`,testId:3,number:7,topic:`Number Skills`,subtopic:`Divisibility Rules`,difficulty:`Accessible`,question:`Which of the following numbers is divisible by both 2 and 5?`,diagram:null,choices:[{id:`A`,text:`24`},{id:`B`,text:`35`},{id:`C`,text:`40`},{id:`D`,text:`45`}],correctAnswer:`C`,explanationSteps:[`A number divisible by both 2 and 5 must end in 0.`,`Only 40 ends in 0, so it is the answer.`],commonMistake:`Choosing B) 35 because it is divisible by 5, while forgetting to check that it must also be even.`,quickTip:`Numbers divisible by both 2 and 5 always end in 0 - it's a quick way to spot them.`,marks:5},{id:`mock-03-q08`,testId:3,number:8,topic:`Challenge Problems`,subtopic:`Permutations with Repeated Letters`,difficulty:`Accessible`,question:`How many different ways can the letters in "BOOK" be arranged if the two O's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`12`},{id:`D`,text:`24`}],correctAnswer:`C`,explanationSteps:[`If all 4 letters were different, there would be 4! = 24 arrangements.`,`Since the two O's look the same, we divide by 2: 24 / 2 = 12.`],commonMistake:`Choosing D) 24 by forgetting that the two O's are identical and not dividing by 2.`,quickTip:`When a word has repeated letters, always divide by 2 for every pair of matching letters.`,marks:5},{id:`mock-03-q09`,testId:3,number:9,topic:`Challenge Problems`,subtopic:`Probability`,difficulty:`Moderate`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number greater than 2 but less than 6?`,diagram:null,choices:[{id:`A`,text:`1 out of 3`},{id:`B`,text:`1 out of 2`},{id:`C`,text:`2 out of 3`},{id:`D`,text:`3 out of 4`}],correctAnswer:`B`,explanationSteps:[`Numbers greater than 2 and less than 6 are 3, 4, and 5 - that is 3 numbers.`,`The chance is 3 out of 6, which simplifies to 1 out of 2.`],commonMistake:`Choosing C) 2 out of 3 by mistakenly including 6, forgetting that 'less than 6' does not count 6 itself.`,quickTip:`List the winning numbers first, then count them carefully before writing the chance.`,marks:5},{id:`mock-03-q10`,testId:3,number:10,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Moderate`,question:`You have 5 flavors of ice cream: chocolate, vanilla, strawberry, mango, and lemon. How many different ways can you choose 3 flavors?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`8`},{id:`C`,text:`10`},{id:`D`,text:`12`}],correctAnswer:`C`,explanationSteps:[`Choosing 3 flavors out of 5 is the same as choosing which 2 flavors to leave out.`,`There are 10 different ways to do this.`],commonMistake:`Choosing B) 8 by listing combinations quickly and accidentally missing or repeating some.`,quickTip:`List combinations in an organized order (like alphabetical) so you don't miss or repeat any.`,marks:5},{id:`mock-03-q11`,testId:3,number:11,topic:`Word Problems and Reasoning`,subtopic:`Multi-step Addition and Subtraction`,difficulty:`Moderate`,question:`Tom has 25 marbles. He loses 8 marbles, then wins 11 more marbles, and finally gives 6 marbles to his brother. How many marbles does Tom have now?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`21`},{id:`C`,text:`22`},{id:`D`,text:`23`}],correctAnswer:`C`,explanationSteps:[`25 - 8 = 17.`,`17 + 11 = 28.`,`28 - 6 = 22.`],commonMistake:`Choosing B) 21 by making a small subtraction slip on 28 - 6 and getting 21 instead of 22.`,quickTip:`Do each action one at a time in order, and double-check your subtraction at every step.`,marks:5},{id:`mock-03-q12`,testId:3,number:12,topic:`Patterns and Operations`,subtopic:`Number Sequences`,difficulty:`Moderate`,question:`What number comes next? 3, 7, 15, 31, ____`,diagram:null,choices:[{id:`A`,text:`47`},{id:`B`,text:`57`},{id:`C`,text:`63`},{id:`D`,text:`64`}],correctAnswer:`C`,explanationSteps:[`Each number follows the rule: previous number x 2 + 1 (3 to 7 to 15 to 31).`,`Apply the rule to 31: 31 x 2 + 1 = 63.`],commonMistake:`Choosing D) 64 by doubling 31 to get 62 and then adding 2 instead of 1.`,quickTip:`Once you find the rule, test it on two pairs of numbers before using it to find the next term.`,marks:5},{id:`mock-03-q13`,testId:3,number:13,topic:`Geometry and Measurement`,subtopic:`Perimeter`,difficulty:`Moderate`,question:`A square has side length 9 cm. A rectangle has length 10 cm and width 8 cm. How much greater is the perimeter of the rectangle than the perimeter of the square?`,diagram:null,choices:[{id:`A`,text:`0 cm`},{id:`B`,text:`1 cm`},{id:`C`,text:`2 cm`},{id:`D`,text:`3 cm`}],correctAnswer:`A`,explanationSteps:[`Square perimeter = 4 x 9 = 36 cm.`,`Rectangle perimeter = 2 x (10 + 8) = 36 cm.`,`Both perimeters are equal, so the difference is 0 cm.`],commonMistake:`Choosing C) 2 cm by assuming the two shapes cannot have the same perimeter and miscalculating one of them, such as using 2 x 10 + 8 = 28 for the rectangle.`,quickTip:`Different shapes can still have the same perimeter - always calculate both fully before comparing.`,marks:5},{id:`mock-03-q14`,testId:3,number:14,topic:`Word Problems and Reasoning`,subtopic:`Heads and Legs Reasoning`,difficulty:`Moderate`,question:`There are chickens and rabbits in a cage. There are 9 heads and 28 legs in total. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`B`,explanationSteps:[`If all 9 animals were chickens, there would be 9 x 2 = 18 legs.`,`There are 28 - 18 = 10 extra legs, and each rabbit adds 2 extra legs, so 10 / 2 = 5 rabbits.`],commonMistake:`Choosing A) 4 by dividing the extra legs by 4 instead of 2, mixing up a rabbit's total legs with its extra legs.`,quickTip:`Each rabbit only adds 2 EXTRA legs compared to a chicken (4 - 2 = 2), so always divide the extra legs by 2.`,marks:5},{id:`mock-03-q15`,testId:3,number:15,topic:`Number Skills`,subtopic:`Division with Remainders`,difficulty:`Moderate`,question:`A baker shares 23 cookies equally among 5 children. How many cookies are left over?`,diagram:null,choices:[{id:`A`,text:`2`},{id:`B`,text:`3`},{id:`C`,text:`4`},{id:`D`,text:`5`}],correctAnswer:`B`,explanationSteps:[`5 x 4 = 20, the closest multiple of 5 without going over 23.`,`23 - 20 = 3 cookies left over.`],commonMistake:`Choosing C) 4 by mistakenly thinking 5 x 4 = 19 instead of 20, which gives the wrong remainder.`,quickTip:`Check your multiplication facts carefully before subtracting to find the remainder.`,marks:5},{id:`mock-03-q16`,testId:3,number:16,topic:`Number Skills`,subtopic:`Rounding Numbers`,difficulty:`Moderate`,question:`Round 8,749 to the nearest hundred.`,diagram:null,choices:[{id:`A`,text:`8,700`},{id:`B`,text:`8,750`},{id:`C`,text:`8,800`},{id:`D`,text:`9,000`}],correctAnswer:`A`,explanationSteps:[`8,749 is between 8,700 and 8,800.`,`The amount past 8,700 is 49, and since 49 is less than 50, round down to 8,700.`],commonMistake:`Choosing C) 8,800 by assuming a number this close to a new hundred should always round up, without checking that 49 is less than 50.`,quickTip:`50 or more rounds up, less than 50 rounds down - check the exact amount, not just the feeling of 'close'.`,marks:5},{id:`mock-03-q17`,testId:3,number:17,topic:`Number Skills`,subtopic:`Divisibility Rules`,difficulty:`Moderate`,question:`Which number is divisible by both 2 and 5?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`25`},{id:`C`,text:`30`},{id:`D`,text:`42`}],correctAnswer:`C`,explanationSteps:[`A number divisible by both 2 and 5 must end in 0.`,`Only 30 ends in 0, so it is the answer.`],commonMistake:`Choosing B) 25 because it is divisible by 5, while forgetting that it must also be even to be divisible by 2.`,quickTip:`Ending in 0 is the fastest way to check for divisibility by both 2 and 5 at once.`,marks:5},{id:`mock-03-q18`,testId:3,number:18,topic:`Challenge Problems`,subtopic:`Permutations with Repeated Letters`,difficulty:`Moderate`,question:`How many different ways can the letters in "MOON" be arranged if the two O's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`12`},{id:`C`,text:`18`},{id:`D`,text:`24`}],correctAnswer:`B`,explanationSteps:[`If all 4 letters were different, there would be 4! = 24 arrangements.`,`Since the two O's look the same, we divide by 2: 24 / 2 = 12.`],commonMistake:`Choosing D) 24 by forgetting that the two O's are identical and not dividing by 2.`,quickTip:`Always check a word for repeated letters first - each repeated pair means dividing by 2.`,marks:5},{id:`mock-03-q19`,testId:3,number:19,topic:`Challenge Problems`,subtopic:`Probability`,difficulty:`Challenging`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number less than 5?`,diagram:null,choices:[{id:`A`,text:`1 out of 3`},{id:`B`,text:`1 out of 2`},{id:`C`,text:`2 out of 3`},{id:`D`,text:`5 out of 6`}],correctAnswer:`C`,explanationSteps:[`Numbers less than 5 are 1, 2, 3, and 4 - that is 4 numbers.`,`The chance is 4 out of 6, which simplifies to 2 out of 3.`],commonMistake:`Choosing B) 1 out of 2 by miscounting only 3 favorable numbers instead of 4.`,quickTip:`Write out every winning number before counting - it's easy to miss one when counting in your head.`,marks:5},{id:`mock-03-q20`,testId:3,number:20,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Challenging`,question:`You have 4 kinds of fruit: apple, banana, orange, and grape. How many different ways can you choose 3 fruits?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`B`,explanationSteps:[`Choosing 3 fruits out of 4 is the same as choosing which 1 fruit to leave out.`,`There are 4 fruits, so there are 4 ways to leave one out, which means 4 ways to choose 3.`],commonMistake:`Choosing D) 6 by confusing this with choosing 2 out of 4 fruits, which does equal 6.`,quickTip:`When choosing almost all the items, it's easier to count how many ways to leave the rest out.`,marks:5},{id:`mock-03-q21`,testId:3,number:21,topic:`Word Problems and Reasoning`,subtopic:`Multi-step Addition and Subtraction`,difficulty:`Challenging`,question:`Lily has 30 beads. She uses 12 beads to make a bracelet, then buys 9 more beads, and then loses 5 beads. How many beads does she have now?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`21`},{id:`C`,text:`22`},{id:`D`,text:`23`}],correctAnswer:`C`,explanationSteps:[`30 - 12 = 18.`,`18 + 9 = 27.`,`27 - 5 = 22.`],commonMistake:`Choosing B) 21 by making a subtraction slip on 27 - 5 and getting 21 instead of 22.`,quickTip:`Recompute each step separately, and check the final subtraction twice before choosing an answer.`,marks:5},{id:`mock-03-q22`,testId:3,number:22,topic:`Patterns and Operations`,subtopic:`Number Sequences`,difficulty:`Challenging`,question:`What number should come next? 2, 6, 14, 30, ____`,diagram:null,choices:[{id:`A`,text:`46`},{id:`B`,text:`52`},{id:`C`,text:`60`},{id:`D`,text:`62`}],correctAnswer:`D`,explanationSteps:[`Each number follows the rule: previous number x 2 + 2 (2 to 6 to 14 to 30).`,`Apply the rule to 30: 30 x 2 + 2 = 62.`],commonMistake:`Choosing C) 60 by doubling 30 to get 60 but forgetting to add the extra 2.`,quickTip:`After doubling, check if there is also a small number being added or subtracted each time.`,marks:5},{id:`mock-03-q23`,testId:3,number:23,topic:`Geometry and Measurement`,subtopic:`Perimeter`,difficulty:`Challenging`,question:`What is the perimeter of a rectangle with length 11 cm and width 4 cm?`,diagram:null,choices:[{id:`A`,text:`26 cm`},{id:`B`,text:`28 cm`},{id:`C`,text:`30 cm`},{id:`D`,text:`32 cm`}],correctAnswer:`C`,explanationSteps:[`Add length and width: 11 + 4 = 15.`,`Double this sum for the perimeter: 15 x 2 = 30 cm.`],commonMistake:`Choosing A) 26 cm by doubling only the length and adding the width once (2 x 11 + 4 = 26) instead of doubling the whole sum.`,quickTip:`Perimeter of a rectangle = 2 x (length + width) - always double the total sum, not just one side.`,marks:5},{id:`mock-03-q24`,testId:3,number:24,topic:`Word Problems and Reasoning`,subtopic:`Heads and Legs Reasoning`,difficulty:`Challenging`,question:`There are chickens and rabbits in a yard. There are 12 heads and 38 legs in total. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`7`},{id:`C`,text:`8`},{id:`D`,text:`9`}],correctAnswer:`B`,explanationSteps:[`If all 12 animals were chickens, there would be 12 x 2 = 24 legs.`,`There are 38 - 24 = 14 extra legs, and each rabbit adds 2 extra legs, so 14 / 2 = 7 rabbits.`],commonMistake:`Choosing A) 6 by making a subtraction slip on 38 - 24, getting 12 instead of 14, then dividing by 2.`,quickTip:`Double-check the subtraction step (total legs minus 'all chicken' legs) before dividing by 2.`,marks:5},{id:`mock-03-q25`,testId:3,number:25,topic:`Number Skills`,subtopic:`Division with Remainders`,difficulty:`Challenging`,question:`A teacher shares 29 pencils equally among 6 students. How many pencils are left over?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`C`,explanationSteps:[`6 x 4 = 24, the closest multiple of 6 without going over 29.`,`29 - 24 = 5 pencils left over.`],commonMistake:`Choosing B) 4 by mistakenly thinking 6 x 4 = 25 instead of 24, which gives the wrong remainder.`,quickTip:`Try multiplying up from the sharing number until you get as close as possible without going over.`,marks:5},{id:`mock-03-q26`,testId:3,number:26,topic:`Number Skills`,subtopic:`Rounding Numbers`,difficulty:`Challenging`,question:`Round 3,251 to the nearest hundred.`,diagram:null,choices:[{id:`A`,text:`3,200`},{id:`B`,text:`3,300`},{id:`C`,text:`3,250`},{id:`D`,text:`3,400`}],correctAnswer:`B`,explanationSteps:[`3,251 is between 3,200 and 3,300.`,`The amount past 3,200 is 51, and since 51 is 50 or more, round up to 3,300.`],commonMistake:`Choosing A) 3,200 by only looking at the last digit (1) and thinking it's small, instead of checking the full 51.`,quickTip:`Always compare the full amount past the hundred (like 51) to 50, not just the ones digit.`,marks:5},{id:`mock-03-q27`,testId:3,number:27,topic:`Number Skills`,subtopic:`Divisibility Rules`,difficulty:`Olympiad`,question:`Which of the following numbers is divisible by 5 but not divisible by 2?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`35`},{id:`C`,text:`40`},{id:`D`,text:`50`}],correctAnswer:`B`,explanationSteps:[`Numbers divisible by 5 end in 0 or 5.`,`A number divisible by 2 is even, so we need one that is odd - it must end in 5.`,`Only 35 ends in 5 and is odd, so it fits both conditions.`],commonMistake:`Choosing C) 40 because it is divisible by 5, without checking that it is also even and so does NOT meet the 'not divisible by 2' condition.`,quickTip:`Numbers ending in 5 are divisible by 5 but odd; numbers ending in 0 are divisible by both 2 and 5.`,marks:5},{id:`mock-03-q28`,testId:3,number:28,topic:`Challenge Problems`,subtopic:`Permutations with Repeated Letters`,difficulty:`Olympiad`,question:`How many different ways can the letters in "BALL" be arranged if the two L's are the same?`,diagram:null,choices:[{id:`A`,text:`6`},{id:`B`,text:`12`},{id:`C`,text:`18`},{id:`D`,text:`24`}],correctAnswer:`B`,explanationSteps:[`If all 4 letters were different, there would be 4! = 24 arrangements.`,`Since the two L's look the same, we divide by 2: 24 / 2 = 12.`],commonMistake:`Choosing D) 24 by forgetting that the two L's are identical and not dividing by 2.`,quickTip:`Count the total letters first, find 4!, then divide by 2 for every pair of identical letters.`,marks:5},{id:`mock-03-q29`,testId:3,number:29,topic:`Challenge Problems`,subtopic:`Probability`,difficulty:`Olympiad`,question:`A fair die has numbers 1 to 6. What is the chance of rolling an even number greater than 2?`,diagram:null,choices:[{id:`A`,text:`1 out of 6`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`1 out of 2`},{id:`D`,text:`2 out of 3`}],correctAnswer:`B`,explanationSteps:[`Even numbers greater than 2 are 4 and 6 - that is 2 numbers.`,`The chance is 2 out of 6, which simplifies to 1 out of 3.`],commonMistake:`Choosing D) 2 out of 3 by mistakenly including 2 as a favorable outcome, even though 2 is not greater than 2.`,quickTip:`Check both conditions carefully - 'even' AND 'greater than 2' must both be true for a number to count.`,marks:5},{id:`mock-03-q30`,testId:3,number:30,topic:`Challenge Problems`,subtopic:`Combinations`,difficulty:`Olympiad`,question:`You have 6 toy animals: lion, tiger, bear, rabbit, panda, and fox. How many different ways can you choose 2 animals?`,diagram:null,choices:[{id:`A`,text:`12`},{id:`B`,text:`15`},{id:`C`,text:`18`},{id:`D`,text:`30`}],correctAnswer:`B`,explanationSteps:[`Pair each animal with every other animal exactly once.`,`Using the combination pattern for choosing 2 from 6: (6 x 5) / 2 = 15.`],commonMistake:`Choosing A) 12 by listing pairs quickly without a system and missing some combinations.`,quickTip:`List pairs in a fixed order (like lion-tiger, lion-bear, lion-rabbit...) so none are missed or repeated.`,marks:5}],4:[{id:`mock-04-q01`,testId:4,number:1,topic:`Word Problems and Reasoning`,subtopic:`Multi-step addition and subtraction`,difficulty:`Accessible`,question:`Leo has 24 marbles. He gives 7 marbles to his friend, then wins 9 more marbles, and finally loses 4 marbles. How many marbles does he have now?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`21`},{id:`C`,text:`22`},{id:`D`,text:`23`}],correctAnswer:`C`,explanationSteps:[`Start with 24 marbles. Take away the 7 he gives away: 24 - 7 = 17.`,`Add the 9 marbles he wins: 17 + 9 = 26.`,`Subtract the 4 marbles he loses: 26 - 4 = 22.`],commonMistake:`Choosing B) 21 by making a small slip in the last step, computing 26 - 4 as 21 instead of 22.`,quickTip:`Do one step at a time and write down each result before moving to the next.`,marks:5},{id:`mock-04-q02`,testId:4,number:2,topic:`Patterns and Operations`,subtopic:`Number patterns (double and add 1)`,difficulty:`Accessible`,question:`What number comes next? 5, 11, 23, 47, ____`,diagram:null,choices:[{id:`A`,text:`71`},{id:`B`,text:`85`},{id:`C`,text:`95`},{id:`D`,text:`99`}],correctAnswer:`C`,explanationSteps:[`Check the rule: each number is doubled, then 1 is added. 5 x 2 + 1 = 11, 11 x 2 + 1 = 23, 23 x 2 + 1 = 47.`,`Apply the same rule to 47: 47 x 2 + 1 = 95.`],commonMistake:`Choosing A) 71 by adding the same gap as before (24) instead of realizing the gap doubles each time.`,quickTip:`Check the pattern with more than one pair of numbers before using it to find the next term.`,marks:5},{id:`mock-04-q03`,testId:4,number:3,topic:`Geometry and Measurement`,subtopic:`Perimeter of a square`,difficulty:`Accessible`,question:`A square has side length 8 cm. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`16 cm`},{id:`B`,text:`24 cm`},{id:`C`,text:`32 cm`},{id:`D`,text:`64 cm`}],correctAnswer:`C`,explanationSteps:[`A square has 4 equal sides.`,`Perimeter = 4 x side length = 4 x 8 = 32 cm.`],commonMistake:`Choosing B) 24 cm by adding only 3 sides (3 x 8) instead of all 4 sides of the square.`,quickTip:`Remember a square always has 4 equal sides, so perimeter = 4 x side length.`,marks:5},{id:`mock-04-q04`,testId:4,number:4,topic:`Geometry and Measurement`,subtopic:`Perimeter of a rectangle`,difficulty:`Accessible`,question:`A rectangle has length 9 cm and width 5 cm. What is its perimeter?`,diagram:null,choices:[{id:`A`,text:`14 cm`},{id:`B`,text:`28 cm`},{id:`C`,text:`30 cm`},{id:`D`,text:`45 cm`}],correctAnswer:`B`,explanationSteps:[`Add the length and width: 9 + 5 = 14.`,`A rectangle has two pairs of equal sides, so double this total: 14 x 2 = 28 cm.`],commonMistake:`Choosing A) 14 cm by adding the length and width but forgetting to double the total to count all four sides.`,quickTip:`For a rectangle, perimeter = 2 x (length + width).`,marks:5},{id:`mock-04-q05`,testId:4,number:5,topic:`Geometry and Measurement`,subtopic:`Comparing perimeters`,difficulty:`Accessible`,question:`A square has side length 6 cm. A rectangle has length 8 cm and width 5 cm. How much greater is the perimeter of the rectangle than the perimeter of the square?`,diagram:null,choices:[{id:`A`,text:`0 cm`},{id:`B`,text:`1 cm`},{id:`C`,text:`2 cm`},{id:`D`,text:`4 cm`}],correctAnswer:`C`,explanationSteps:[`Square perimeter: 4 x 6 = 24 cm.`,`Rectangle perimeter: 2 x (8 + 5) = 2 x 13 = 26 cm.`,`Difference: 26 - 24 = 2 cm.`],commonMistake:`Choosing D) 4 cm by mixing up the rectangle's width with the square's side, calculating 2 x (8 + 6) = 28 instead of 26.`,quickTip:`Work out each perimeter fully and label it before subtracting, so the numbers don't get mixed up.`,marks:5},{id:`mock-04-q06`,testId:4,number:6,topic:`Word Problems and Reasoning`,subtopic:`Heads and legs problems`,difficulty:`Accessible`,question:`There are chickens and rabbits in a pen. There are 10 heads and 28 legs in total. How many rabbits are there?`,diagram:null,choices:[{id:`A`,text:`3`},{id:`B`,text:`4`},{id:`C`,text:`5`},{id:`D`,text:`6`}],correctAnswer:`B`,explanationSteps:[`If all 10 animals were chickens, there would be 10 x 2 = 20 legs.`,`There are 28 - 20 = 8 extra legs. Each rabbit adds 2 extra legs (4 - 2), so there are 8 / 2 = 4 rabbits.`,`Check: 4 rabbits and 6 chickens give 16 + 12 = 28 legs and 10 heads. It works.`],commonMistake:`Choosing D) 6 by giving the number of chickens (6) instead of the number of rabbits (4) - the two values got swapped.`,quickTip:`Assume all animals are the type with fewer legs first, then share out the extra legs among the other type.`,marks:5},{id:`mock-04-q07`,testId:4,number:7,topic:`Word Problems and Reasoning`,subtopic:`Heads and legs problems`,difficulty:`Accessible`,question:`There are chickens and rabbits in a cage. There are 9 heads and 24 legs in total. How many chickens are there?`,diagram:null,choices:[{id:`A`,text:`4`},{id:`B`,text:`5`},{id:`C`,text:`6`},{id:`D`,text:`7`}],correctAnswer:`C`,explanationSteps:[`If all 9 animals were chickens, there would be 9 x 2 = 18 legs.`,`There are 24 - 18 = 6 extra legs, so there are 6 / 2 = 3 rabbits.`,`That leaves 9 - 3 = 6 chickens. Check: 6 chickens + 3 rabbits = 12 + 12 = 24 legs and 9 heads.`],commonMistake:`Choosing B) 5 by making an arithmetic slip while solving for chickens, instead of carefully finding rabbits (3) first and subtracting from 9.`,quickTip:`Find the number of rabbits first using the extra legs, then subtract from the total heads to get chickens.`,marks:5},{id:`mock-04-q08`,testId:4,number:8,topic:`Number Skills`,subtopic:`Division with remainders`,difficulty:`Accessible`,question:`Mia shares 19 cookies equally among 4 children. How many cookies are left over?`,diagram:null,choices:[{id:`A`,text:`1`},{id:`B`,text:`2`},{id:`C`,text:`3`},{id:`D`,text:`4`}],correctAnswer:`C`,explanationSteps:[`Find the largest multiple of 4 that is not more than 19: 4 x 4 = 16.`,`Subtract: 19 - 16 = 3 cookies left over.`],commonMistake:`Choosing A) 1 by mistakenly using 4 x 5 = 20 as the amount shared, instead of 4 x 4 = 16.`,quickTip:`The remainder must always be smaller than the number of children you are sharing among.`,marks:5},{id:`mock-04-q09`,testId:4,number:9,topic:`Number Skills`,subtopic:`Division with remainders`,difficulty:`Moderate`,question:`A teacher shares 26 pencils equally among 5 students. How many pencils are left over?`,diagram:null,choices:[{id:`A`,text:`0`},{id:`B`,text:`1`},{id:`C`,text:`2`},{id:`D`,text:`3`}],correctAnswer:`B`,explanationSteps:[`Find the largest multiple of 5 that is not more than 26: 5 x 5 = 25.`,`Subtract: 26 - 25 = 1 pencil left over.`],commonMistake:`Choosing C) 2 by mis-multiplying 5 x 5 as 24 instead of 25, which gives the wrong remainder.`,quickTip:`Double check your multiplication fact before subtracting to find the remainder.`,marks:5},{id:`mock-04-q10`,testId:4,number:10,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Moderate`,question:`Round 4,351 to the nearest hundred.`,diagram:null,choices:[{id:`A`,text:`4,300`},{id:`B`,text:`4,400`},{id:`C`,text:`4,350`},{id:`D`,text:`4,500`}],correctAnswer:`B`,explanationSteps:[`4,351 is between 4,300 and 4,400.`,`Look at the tens digit: 5. Since it is 5 or more, round up.`,`4,351 rounds to 4,400.`],commonMistake:`Choosing A) 4,300 by rounding down, forgetting that a tens digit of 5 or more rounds the hundreds digit up.`,quickTip:`Look at the tens digit to decide whether to round the hundreds up or down.`,marks:5},{id:`mock-04-q11`,testId:4,number:11,topic:`Number Skills`,subtopic:`Rounding to the nearest hundred`,difficulty:`Moderate`,question:`Round 7,849 to the nearest hundred.`,diagram:null,choices:[{id:`A`,text:`7,800`},{id:`B`,text:`7,850`},{id:`C`,text:`7,900`},{id:`D`,text:`8,000`}],correctAnswer:`A`,explanationSteps:[`7,849 is between 7,800 and 7,900.`,`Look at the tens digit: 4. Since it is less than 5, round down.`,`7,849 rounds to 7,800.`],commonMistake:`Choosing C) 7,900 by rounding up even though the tens digit is 4, which should round down.`,quickTip:`A tens digit of 0-4 rounds down; a tens digit of 5-9 rounds up.`,marks:5},{id:`mock-04-q12`,testId:4,number:12,topic:`Number Skills`,subtopic:`Divisibility rules`,difficulty:`Moderate`,question:`Which number is divisible by both 2 and 5?`,diagram:null,choices:[{id:`A`,text:`18`},{id:`B`,text:`25`},{id:`C`,text:`30`},{id:`D`,text:`45`}],correctAnswer:`C`,explanationSteps:[`Numbers divisible by both 2 and 5 always end in 0.`,`30 ends in 0, so it is divisible by both 2 and 5.`],commonMistake:`Choosing B) 25 because it is divisible by 5, but forgetting to check that it must also be even to be divisible by 2.`,quickTip:`A number divisible by both 2 and 5 must end in 0.`,marks:5},{id:`mock-04-q13`,testId:4,number:13,topic:`Number Skills`,subtopic:`Divisibility rules`,difficulty:`Moderate`,question:`Which number is divisible by 5 but not divisible by 2?`,diagram:null,choices:[{id:`A`,text:`20`},{id:`B`,text:`35`},{id:`C`,text:`40`},{id:`D`,text:`50`}],correctAnswer:`B`,explanationSteps:[`A number divisible by 5 ends in 0 or 5.`,`35 ends in 5 and is odd, so it is divisible by 5 but not by 2.`],commonMistake:`Choosing A) 20 by forgetting that it is also divisible by 2 (it is even), so it does not fit 'divisible by 5 but not by 2.'`,quickTip:`Numbers ending in 5 (and not 0) are divisible by 5 but never by 2.`,marks:5},{id:`mock-04-q14`,testId:4,number:14,topic:`Patterns and Operations`,subtopic:`Number patterns (double and add 1)`,difficulty:`Moderate`,question:`What number should come next? 2, 5, 11, 23, ____`,diagram:null,choices:[{id:`A`,text:`35`},{id:`B`,text:`41`},{id:`C`,text:`47`},{id:`D`,text:`51`}],correctAnswer:`C`,explanationSteps:[`Check the rule: 2 x 2 + 1 = 5, 5 x 2 + 1 = 11, 11 x 2 + 1 = 23.`,`Apply the same rule to 23: 23 x 2 + 1 = 47.`],commonMistake:`Choosing A) 35 by adding the same gap as before (12) again instead of doubling the gap to 24.`,quickTip:`Find the rule using two pairs of numbers before applying it to the last number.`,marks:5},{id:`mock-04-q15`,testId:4,number:15,topic:`Patterns and Operations`,subtopic:`Number patterns (double and add 2)`,difficulty:`Moderate`,question:`What number should come next? 3, 8, 18, 38, ____`,diagram:null,choices:[{id:`A`,text:`58`},{id:`B`,text:`68`},{id:`C`,text:`76`},{id:`D`,text:`78`}],correctAnswer:`D`,explanationSteps:[`Check the rule: 3 x 2 + 2 = 8, 8 x 2 + 2 = 18, 18 x 2 + 2 = 38.`,`Apply the same rule to 38: 38 x 2 + 2 = 78.`],commonMistake:`Choosing A) 58 by adding the same gap as before (20) instead of doubling the gap to 40.`,quickTip:`In doubling patterns, the gap between numbers grows too - check how the gap changes each time.`,marks:5},{id:`mock-04-q16`,testId:4,number:16,topic:`Challenge Problems`,subtopic:`Probability with a die`,difficulty:`Moderate`,question:`A fair die has numbers 1 to 6. What is the chance of rolling an even number?`,diagram:null,choices:[{id:`A`,text:`1 out of 2`},{id:`B`,text:`1 out of 3`},{id:`C`,text:`2 out of 3`},{id:`D`,text:`1 out of 6`}],correctAnswer:`A`,explanationSteps:[`The even numbers on a die are 2, 4, and 6 - that is 3 numbers.`,`There are 6 numbers in total, so the chance is 3 out of 6, which simplifies to 1 out of 2.`],commonMistake:`Choosing D) 1 out of 6 by counting only one even number (like 2) instead of all three even numbers (2, 4, 6).`,quickTip:`List all the favorable outcomes first, then compare that count to all 6 possible outcomes.`,marks:5},{id:`mock-04-q17`,testId:4,number:17,topic:`Challenge Problems`,subtopic:`Probability with a die`,difficulty:`Moderate`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number greater than 3?`,diagram:null,choices:[{id:`A`,text:`1 out of 3`},{id:`B`,text:`1 out of 2`},{id:`C`,text:`2 out of 3`},{id:`D`,text:`3 out of 4`}],correctAnswer:`B`,explanationSteps:[`Numbers greater than 3 are 4, 5, and 6 - that is 3 numbers.`,`There are 6 numbers in total, so the chance is 3 out of 6, which simplifies to 1 out of 2.`],commonMistake:`Choosing A) 1 out of 3 by forgetting to include 6 as one of the numbers greater than 3 (only counting 4 and 5).`,quickTip:`Write out the exact list of numbers that fit the rule before counting them.`,marks:5},{id:`mock-04-q18`,testId:4,number:18,topic:`Challenge Problems`,subtopic:`Probability with a die`,difficulty:`Moderate`,question:`A fair die has numbers 1 to 6. What is the chance of rolling a number less than 4?`,diagram:null,choices:[{id:`A`,text:`1 out of 3`},{id:`B`,text:`1 out of 2`},{id:`C`,text:`2 out of 3`},{id:`D`,text:`3 out of 4`}],correctAnswer:`B`,explanationSteps:[`Numbers less than 4 are 1, 2, and 3 - that is 3 numbers.`,`There are 6 numbers in total, so the chance is 3 out of 6, which simplifies to 1 out of 2.`],commonMistake:`Choosing A) 1 out of 3 by forgetting to include one of the numbers 1, 2, or 3 when counting outcomes.`,quickTip:`Double-check your list of favor

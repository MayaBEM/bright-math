k`,prompt:n,kind:`choice`,answer:0,choices:r,correctIndex:i,explanation:a,diagram:o}}var zr=[{id:`circumference`,number:1,title:`Circumference of a Circle`,subtitle:`The distance all the way round`,goal:`Name the parts of a circle, understand π, and find the circumference of circles, semicircles and quadrants.`,steps:[{id:`parts`,title:`Parts of a circle`,body:[`Every circle has a **centre**. In the figure, the centre is O.`,`A **radius** is a straight line from the centre to any point on the circle, like OA or OB. All radii of a circle are the same length.`,`A **diameter** is a straight line that passes through the centre and touches the circle at both ends, like BC. A diameter is twice as long as a radius: [[d = 2r]].`,`The **circumference** is the distance all the way round the circle. It is the perimeter of the circle.`],th:`รัศมี (radius) คือเส้นจากจุดศูนย์กลางไปถึงเส้นรอบวง เส้นผ่านศูนย์กลาง (diameter) ยาวเป็น 2 เท่าของรัศมี และเส้นรอบวง (circumference) คือความยาวรอบวงกลมทั้งหมด`,keyIdea:`d = 2 × r   and   r = d ÷ 2`,diagram:{type:`parts`},check:Lr(`c1-check`,`circumference`,`The radius of a circle is 9 cm. What is its diameter?`,18,`cm`,`Diameter [[= 2 \\times r = 2 \\times 9 = 18]] cm`)},{id:`pi`,title:`Meet π (pi)`,body:[`Try the circle explorer. Change the radius and watch the circumference. No matter how big or small the circle is, **circumference ÷ diameter is always the same number**.`,`This special number is called **π** (pi). It is about 3.14159… and it goes on forever.`,`In Primary 6 we use two handy approximations: [[\\pi \\approx 3.14]] or [[\\pi \\approx \\frac{22}{7}]]. The question will always tell you which one to use.`,`Tip: when the radius or diameter is a multiple of 7, [[\\frac{22}{7}]] cancels nicely and gives a whole number.`],th:`π (พาย) คืออัตราส่วนระหว่างเส้นรอบวงกับเส้นผ่านศูนย์กลาง มีค่าประมาณ 3.14 หรือ 22/7 ถ้ารัศมีหรือเส้นผ่านศูนย์กลางเป็นพหุคูณของ 7 ใช้ 22/7 จะคำนวณง่าย`,keyIdea:`Circumference ÷ diameter = π ≈ 3.14`,interactive:`explorer`,check:Rr(`c2-check`,`circumference`,`Which number is the best approximation of π?`,[`3.14`,`3.41`,`31.4`,`1.34`],0,`π is approximately 3.14 (or 22/7). Circumference ÷ diameter is always close to 3.14.`)},{id:`formula`,title:`The circumference formula`,body:[`Because circumference ÷ diameter = π, we can write:`,`[[\\text{Circumference} = \\pi \\times d]]`,`or [[\\text{Circumference} = 2 \\times \\pi \\times r]]`,`Use [[\\pi d]] when you are given the diameter and [[2 \\pi r]] when you are given the radius. Both give the same answer because [[d = 2r]].`],th:`สูตรเส้นรอบวง: C = πd หรือ C = 2πr เลือกสูตรตามว่าโจทย์ให้เส้นผ่านศูนย์กลางหรือรัศมี`,keyIdea:`C = π × d = 2 × π × r`,example:{problem:`A circle has a diameter of 10 cm. Find its circumference. (Take π = 3.14)`,steps:[`Circumference [[= \\pi \\times d]]`,`[[= 3.14 \\times 10]]`,`[[= 31.4]] cm`],answer:`31.4 cm`},diagram:{type:`circle`,label:`d`,value:`10 cm`},check:Lr(`c3-check`,`circumference`,`A circle has a radius of 7 cm. Find its circumference. (Take [[\\pi = \\frac{22}{7}]])`,44,`cm`,`Circumference [[= 2 \\times \\pi \\times r = 2 \\times \\frac{22}{7} \\times 7 = 44]] cm`,{type:`circle`,label:`r`,value:`7 cm`})},{id:`half-quarter`,title:`Semicircles and quadrants`,body:[`A **semicircle** is half a circle. A **quadrant** is a quarter of a circle.`,`The perimeter of a semicircle is **half the circumference plus the diameter**. Do not forget the straight edge – perimeter means all the way round!`,`[[\\text{Perimeter of semicircle} = \\tfrac{1}{2} \\times \\pi \\times d + d]]`,`The perimeter of a quadrant is a quarter of the circumference plus two radii:`,`[[\\text{Perimeter of quadrant} = \\tfrac{1}{4} \\times 2 \\times \\pi \\times r + 2r]]`],th:`ครึ่งวงกลม: เส้นรอบรูป = ครึ่งหนึ่งของเส้นรอบวง + เส้นผ่านศูนย์กลาง (อย่าลืมด้านตรง!) เสี้ยววงกลม (quadrant): เส้นรอบรูป = 1/4 ของเส้นรอบวง + รัศมี 2 เส้น`,keyIdea:`Perimeter = curved part + straight part(s)`,example:{problem:`Find the perimeter of a semicircle with diameter 14 cm. (Take π = 22/7)`,steps:[`Curved part [[= \\tfrac{1}{2} \\times \\frac{22}{7} \\times 14 = 22]] cm`,`Straight part [[= 14]] cm`,`Perimeter [[= 22 + 14 = 36]] cm`],answer:`36 cm`},diagram:{type:`semicircle`,label:`d`,value:`14 cm`},check:Lr(`c4-check`,`circumference`,`Find the perimeter of a quadrant of radius 10 cm. (Take [[\\pi = 3.14]])`,35.7,`cm`,`Curved part [[= \\tfrac{1}{4} \\times 2 \\times 3.14 \\times 10 = 15.7]] cm

]. Its length is half of the circumference, which is [[\\tfrac{1}{2} \\times 2 \\pi r = \\pi r]].`,`So the area of the circle is [[\\pi r \\times r = \\pi r^2]].`],th:`ตัดวงกลมเป็นชิ้นเท่า ๆ กันแล้วเรียงสลับหัวท้าย จะได้รูปใกล้เคียงสี่เหลี่ยมผืนผ้า สูง = r และยาว = ครึ่งหนึ่งของเส้นรอบวง = πr ดังนั้น พื้นที่ = πr × r = πr²`,keyIdea:`Length πr × height r = πr²`,interactive:`derivation`,check:Rr(`a2-check`,`area`,`When the sectors are rearranged into a rectangle, what is the length of the rectangle?`,[`Half the circumference, πr`,`The whole circumference, 2πr`,`The diameter, 2r`,`The radius, r`],0,`Half the slices point up and half point down, so the top and bottom edges each make up half the circumference: [[\\pi r]].`)},{id:`formula`,title:`The area formula`,body:[`[[\\text{Area of circle} = \\pi \\times r \\times r = \\pi r^2]]`,`Be careful: [[r^2]] means [[r \\times r]], **not** [[2 \\times r]]. A radius of 5 cm gives [[5 \\times 5 = 25]], not 10.`,`If you are given the diameter, halve it first to get the radius.`],th:`พื้นที่วงกลม = π × r × r (r² คือ r คูณ r ไม่ใช่ 2r) ถ้าโจทย์ให้เส้นผ่านศูนย์กลาง ต้องหารด้วย 2 ก่อนเพื่อหารัศมี`,keyIdea:`A = π × r × r`,example:{problem:`A circle has a diameter of 14 cm. Find its area. (Take π = 22/7)`,steps:[`Radius [[= 14 \\div 2 = 7]] cm`,`Area [[= \\frac{22}{7} \\times 7 \\times 7]]`,`[[= 154]] cm²`],answer:`154 cm²`},diagram:{type:`circle`,label:`d`,value:`14 cm`},check:Lr(`a3-check`,`area`,`Find the area of a circle with radius 4 cm. (Take [[\\pi = 3.14]])`,50.24,`cm²`,`Area [[= 3.14 \\times 4 \\times 4 = 50.24]] cm²`,{type:`circle`,label:`r`,value:`4 cm`})},{id:`half-quarter`,title:`Semicircles and quadrants`,body:[`A semicircle has **half** the area of the full circle. A quadrant has a **quarter** of the area.`,`[[\\text{Area of semicircle} = \\tfrac{1}{2} \\times \\pi r^2]]`,`[[\\text{Area of quadrant} = \\tfrac{1}{4} \\times \\pi r^2]]`,`A good habit: find the area of the whole circle first, then take the fraction you need.`],th:`พื้นที่ครึ่งวงกลม = ½ × πr² และพื้นที่เสี้ยววงกลม = ¼ × πr² หาพื้นที่วงกลมเต็มก่อน แล้วค่อยคูณเศษส่วน`,keyIdea:`Whole circle first, then ½ or ¼`,example:{problem:`Find the area of a semicircle with diameter 20 cm. (Take π = 3.14)`,steps:[`Radius [[= 20 \\div 2 = 10]] cm`,`Area of whole circle [[= 3.14 \\times 10 \\times 10 = 314]] cm²`,`Area of semicircle [[= \\tfrac{1}{2} \\times 314 = 157]] cm²`],answer:`157 cm²`},diagram:{type:`semicircle`,label:`d`,value:`20 cm`},check:Lr(`a4-check`,`area`,`Find the area of a quadrant of radius 14 cm. (Take [[\\pi = \\frac{22}{7}]])`,154,`cm²`,`Whole circle [[= \\frac{22}{7} \\times 14 \\times 14 = 616]] cm²

igit raffle number they can form?`,th:`ชมรมงานฝีมือทำบัตรตัวเลขสำหรับสลากรางวัลในวันตลาดนัดโรงเรียน โดยใช้บัตรตัวเลข 4, 7, 2 และ 9 อย่างละหนึ่งครั้ง จำนวนสลาก 4 หลักที่เป็นจำนวนคี่และมีค่ามากที่สุดที่สร้างได้คือข้อใด`},options:[{id:`A`,label:{en:`9,742`,th:`9,742`}},{id:`B`,label:{en:`2,479`,th:`2,479`}},{id:`C`,label:{en:`9,427`,th:`9,427`}},{id:`D`,label:{en:`7,429`,th:`7,429`}}],correctOptionId:`C`,explanation:{en:`To make the greatest odd number, put 9 (the largest digit) in the thousands place. The units digit must be odd, and only 7 is left odd, so 7 goes in the units place. The remaining digits 4 and 2 go in descending order in the middle: 9, 4, 2, 7 = 9,427.`,th:`การจะได้จำนวนคี่ที่มากที่สุด ต้องนำเลข 9 (หลักมากที่สุด) ไปไว้หลักพัน ส่วนหลักหน่วยต้องเป็นเลขคี่ ซึ่งเหลือเพียง 7 เท่านั้นที่เป็นคี่ จึงนำ 7 ไปไว้หลักหน่วย ส่วนเลข 4 และ 2 ที่เหลือให้เรียงจากมากไปน้อยในหลักร้อยและหลักสิบ จะได้ 9, 4, 2, 7 คือ 9,427`},distractorNotes:{A:{en:`Arranged all four digits from greatest to least without checking the "must be odd" rule, giving an even number instead.`,th:`เรียงตัวเลขทั้งสี่จากมากไปน้อยโดยไม่ได้ตรวจสอบเงื่อนไข "ต้องเป็นจำนวนคี่" จึงได้จำนวนคู่แทน`},B:{en:`Arranged the digits from least to greatest, forming the smallest possible number instead of the greatest.`,th:`เรียงตัวเลขจากน้อยไปมาก ได้จำนวนที่น้อยที่สุดแทนที่จะเป็นมากที่สุด`},D:{en:`Placed the larger odd digit (9) in the units place and the smaller odd digit (7) in the thousands place — the opposite of what maximizes the number.`,th:`นำเลขคี่ที่มากกว่า (9) ไปไว้หลักหน่วย และเลขคี่ที่น้อยกว่า (7) ไปไว้หลักพัน ซึ่งตรงข้ามกับวิธีที่จะทำให้จำนวนมีค่ามากที่สุด`}},hints:[{en:`Think about which place value affects the number's size the most.`,th:`ลองคิดดูว่าหลักไหนมีผลต่อค่าของจำนวนมากที่สุด`},{en:`The number must be odd, so the units digit is restricted to the odd digits available.`,th:`จำนวนต้องเป็นเลขคี่ ดังนั้นหลักหน่วยจึงเลือกได้จากตัวเลขคี่ที่มีอยู่เท่านั้น`},{en:`Fix the largest digit in the thousands place first, then choose the smallest usable odd digit for the units place, and arrange what is left in descending order.`,th:`กำหนดเลขที่มากที่สุดไว้ที่หลักพันก่อน จากนั้นเลือกเลขคี่ที่เล็กที่สุดที่เหลือไปไว้หลักหน่วย แล้วเรียงเลขที่เหลือจากมากไปน้อยในหลักที่เหลือ`}],visual:null,estimatedSeconds:50},{id:`A-02`,testId:`samsen-mock-a`,number:2,skill:`Word Problems & Logic`,topic:{en:`Price & Quantity Puzzles`,th:`โจทย์ราคาและจำนวน`},difficulty:I(2),prompt:{en:`Fah has enough money to buy notebooks priced 15 baht each for the Stationery Club stall, with 10 baht left over. If the notebooks were priced 20 baht each instead, she could buy exactly 3 fewer notebooks and spend all her money with nothing left. How much money does Fah have?`,th:`ฟ้ามีเงินพอซื้อสมุดราคาเล่มละ 15 บาท สำหรับร้านค้าชมรมเครื่องเขียน โดยเหลือเงิน 10 บาท ถ้าสมุดราคาเล่มละ 20 บาทแทน เธอจะซื้อได้น้อยกว่าเดิม 3 เล่มพอดี และใช้เงินหมดพอดีไม่มีเหลือ ฟ้ามีเงินทั้งหมดกี่บาท`},options:[{id:`A`,label:{en:`220 baht`,th:`220 บาท`}},{id:`B`,label:{en:`210 baht`,th:`210 บาท`}},{id:`C`,label:{en:`180 baht`,th:`180 บาท`}},{id:`D`,label:{en:`280 baht`,th:`280 บาท`}}],correctOptionId:`A`,explanation:{en:`Let n be the number bought at 15 baht. Her money is 15n + 10. At 20 baht she buys (n − 3) notebooks with nothing left: 15n + 10 = 20(n − 3). Solving: 15n + 10 = 20n − 60, so 70 = 5n, n = 14. Her money = 15(14) + 10 = 220 baht. Check: 20 × 11 = 220. ✓`,th:`ให้ n คือจำนวนสมุดที่ซื้อได้ราคาเล่มละ 15 บาท เงินที่มี = 15n + 10 เมื่อราคาเป็น 20 บาท ซื้อได้ (n − 3) เล่มพอดีไม่มีเหลือ: 15n + 10 = 20(n − 3) แก้สมการได้ 15n + 10 = 20n − 60 ดังนั้น 70 = 5n จึง n = 14 เงินที่มี = 15(14) + 10 = 220 บาท ตรวจสอบ: 20 × 11 = 220 บาท ✓`},distractorNotes:{B:{en:`Found the correct count (14 notebooks) but forgot to add the 10-baht leftover: 15 × 14 = 210.`,th:`หาจำนวนสมุดได้ถูกต้อง (14 เล่ม) แต่ลืมบวกเงินที่เหลือ 10 บาท: 15 × 14 = 210`},C:{en:`Solved the equation without the leftover term (15n = 20(n − 3)), getting n = 12 and money = 15 × 12 = 180.`,th:`ตั้งสมการโดยไม่ใส่เงินที่เหลือ (15n = 20(n − 3)) ได้ n = 12 และเงิน = 15 × 12 = 180`},D:{en:`Multiplied the original count (14) by the new price (20) instead of solving for the actual amount of money.`,th:`นำจำนวนเดิม (14) ไปคูณกับราคาใหม่ (20) แทนที่จะแก้หาจำนวนเงินจริง`}},hints:[{en:`Let n be the number of notebooks bought at the first price, and write her total money in terms of n.`,th:`ให้ n เป็นจำนวนสมุดที่ซื้อได้ในราคาแรก แล้วเขียนจำนวนเงินทั้งหมดในรูปของ n`},{en:`This is a two-scenario equation: her money is the same both times, so set the two expressions equal.`,th:`นี่คือโจทย์สองสถานการณ์ที่เงินทั้งหมดเท่ากัน จึงตั้งสองนิพจน์ให้เท่ากัน`},{en:`Write 15n + 10 = 20(n − 3), solve for n, then substitute back to find the money.`,th:`เขียนสมการ 15n + 10 = 20(n − 3) แก้หาค่า n แล้วแทนกลับเพื่อหาจำนวนเงิน`}],visual:null,estimatedSeconds:60},{id:`A-03`,testId:`samsen-mock-a`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:I(3),prompt:{en:`Seven stalls at the school market day sold these fractions of their stock by lunchtime: \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{4}{9}, \\frac{7}{10}. Ranking the stalls from the highest fraction sold to the lowest, which fraction is 4th?`,th:`ร้านค้า 7 ร้านในวันตลาดนัดโรงเรียนขายสินค้าได้เป็นเศษส่วนของที่มีทั้งหมดภายในเวลาพักเที่ยง ดังนี้ \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{4}{9}, \\frac{7}{10} เมื่อเรียงลำดับจากร้านที่ขายได้เศษส่วนมากที่สุดไปน้อยที่สุด เศษส่วนใดอยู่ในอันดับที่ 4`},options:[{id:`A`,label:{en:`\\frac{7}{10}`,th:`\\frac{7}{10}`}},{id:`B`,label:{en:`\\frac{5}{8}`,th:`\\frac{5}{8}`}},{id:`C`,label:{en:`\\frac{7}{12}`,th:`\\frac{7}{12}`}},{id:`D`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}}],correctOptionId:`D`,explanation:{en:`Converting to decimals: \\frac{5}{6} ≈ 0.833, \\frac{3}{4} = 0.75, \\frac{7}{10} = 0.7, \\frac{2}{3} ≈ 0.667, \\frac{5}{8} = 0.625, \\frac{7}{12} ≈ 0.583, \\frac{4}{9} ≈ 0.444. Ranked from largest: \\frac{5}{6} (1st), \\frac{3}{4} (2nd), \\frac{7}{10} (3rd), \\frac{2}{3} (4th). So the 4th-largest fraction is \\frac{2}{3}.`,th:`แปลงเป็นทศนิยม: \\frac{5}{6} ≈ 0.833, \\frac{3}{4} = 0.75, \\frac{7}{10} = 0.7, \\frac{2}{3} ≈ 0.667, \\frac{5}{8} = 0.625, \\frac{7}{12} ≈ 0.583, \\frac{4}{9} ≈ 0.444 เรียงจากมากไปน้อย: \\frac{5}{6} (อันดับ 1), \\frac{3}{4} (อันดับ 2), \\frac{7}{10} (อันดับ 3), \\frac{2}{3} (อันดับ 4) ดังนั้นเศษส่วนอันดับที่ 4 คือ \\frac{2}{3}`},distractorNotes:{A:{en:`Picked the 3rd-largest fraction (\\frac{7}{10}) instead of the 4th, off by one rank.`,th:`เลือกเศษส่วนอันดับที่ 3 (\\frac{7}{10}) แทนที่จะเป็นอันดับที่ 4 นับอันดับคลาดเคลื่อนไปหนึ่งตำแหน่ง`},B:{en:`Picked the 5th-largest fraction (\\frac{5}{8}) instead of the 4th, off by one rank in the other direction.`,th:`เลือกเศษส่วนอันดับที่ 5 (\\frac{5}{8}) แทนที่จะเป็นอันดับที่ 4 นับอันดับคลาดเคลื่อนไปอีกทาง`},C:{en:`Misjudged the size of \\frac{7}{12} due to its unlike denominator, ranking it much higher than its true position (6th).`,th:`ประเมินขนาดของ \\frac{7}{12} ผิดพลาดเพราะตัวส่วนไม่เท่ากับตัวอื่น จึงจัดอันดับให้สูงเกินความเป็นจริง (ที่จริงอยู่อันดับ 6)`}},hints:[{en:`Unlike fractions are hard to compare directly — convert them all to a common form first.`,th:`เศษส่วนที่ตัวส่วนไม่เท่ากันเปรียบเทียบกันตรงๆ ได้ยาก ให้แปลงเป็นรูปแบบเดียวกันก่อน`},{en:`Converting each fraction to a decimal makes ranking them straightforward.`,th:`การแปลงแต่ละเศษส่วนเป็นทศนิยมจะทำให้จัดอันดับได้ง่ายขึ้น`},{en:`List all seven decimals, sort from largest to smallest, then count down to the 4th position.`,th:`เขียนทศนิยมทั้งเจ็ดค่า เรียงจากมากไปน้อย แล้วนับลงมาถึงตำแหน่งที่ 4`}],visual:null,estimatedSeconds:65},{id:`A-04`,testId:`samsen-mock-a`,number:4,skill:`Number & Operations`,topic:{en:`Order of Operations`,th:`ลำดับการดำเนินการ`},difficulty:I(4),prompt:{en:`Let A = (24 ÷ 4 + 3) × 2 and B = \\frac{1}{2} + (\\frac{1}{3} × 3). Find the value of 2 × (A ÷ B).`,th:`กำหนดให้ A = (24 ÷ 4 + 3) × 2 และ B = \\frac{1}{2} + (\\frac{1}{3} × 3) จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`12`,th:`12`}},{id:`B`,label:{en:`24`,th:`24`}},{id:`C`,label:{en:`14.4`,th:`14.4`}},{id:`D`,label:{en:`7.2`,th:`7.2`}}],correctOptionId:`B`,explanation:{en:`A = (24 ÷ 4 + 3) × 2 = (6 + 3) × 2 = 9 × 2 = 18. B = \\frac{1}{2} + (\\frac{1}{3} × 3) = \\frac{1}{2} + 1 = \\frac{3}{2} = 1.5. So A ÷ B = 18 ÷ 1.5 = 12, and 2 × 12 = 24.`,th:`A = (24 ÷ 4 + 3) × 2 = (6 + 3) × 2 = 9 × 2 = 18. B = \\frac{1}{2} + (\\frac{1}{3} × 3) = \\frac{1}{2} + 1 = \\frac{3}{2} = 1.5 ดังนั้น A ÷ B = 18 ÷ 1.5 = 12 และ 2 × 12 = 24`},distractorNotes:{A:{en:`Correctly computed A ÷ B = 12 but forgot to multiply the result by the final 2.`,th:`คำนวณ A ÷ B = 12 ได้ถูกต้อง แต่ลืมคูณผลลัพธ์ด้วย 2 ตัวสุดท้าย`},C:{en:`Miscalculated B by adding before multiplying — (\\frac{1}{2} + \\frac{1}{3}) × 3 = 2.5 instead of following the correct order of operations, giving 18 ÷ 2.5 × 2 = 14.4.`,th:`คำนวณ B ผิดโดยบวกก่อนคูณ — (\\frac{1}{2} + \\frac{1}{3}) × 3 = 2.5 แทนที่จะทำตามลำดับการดำเนินการที่ถูกต้อง ทำให้ได้ 18 ÷ 2.5 × 2 = 14.4`},D:{en:`Made the same order-of-operations error on B (getting 2.5) and also forgot the final multiplication by 2, giving just 18 ÷ 2.5 = 7.2.`,th:`คำนวณ B ผิดแบบเดียวกัน (ได้ 2.5) และลืมคูณด้วย 2 ตัวสุดท้ายด้วย ทำให้ได้เพียง 18 ÷ 2.5 = 7.2`}},hints:[{en:`Work out A and B separately first, following the order of operations carefully.`,th:`หาค่า A และ B แยกกันก่อน โดยทำตามลำดับการดำเนินการอย่างระมัดระวัง`},{en:`Inside B, multiplication must be done before addition — do not add 1/2 and 1/3 first.`,th:`ภายใน B ต้องคูณก่อนบวก อย่าเพิ่งนำ 1/2 กับ 1/3 มาบวกกันก่อน`},{en:`Once you have A = 18 and B = 1.5, compute A ÷ B, then remember to multiply that result by 2.`,th:`เมื่อได้ A = 18 และ B = 1.5 แล้ว ให้หา A ÷ B จากนั้นอย่าลืมคูณผลลัพธ์นั้นด้วย 2`}],visual:null,estimatedSeconds:70},{id:`A-05`,testId:`samsen-mock-a`,number:5,skill:`Number & Operations`,topic:{en:`LCM & GCF`,th:`ค.ร.น. และ ห.ร.ม.`},difficulty:I(5),prompt:{en:`Room 6/1 and Room 6/2 have 60 students in total. When the larger class size is divided by the smaller, the quotient is 3 and the remainder is 4. Find the LCM of the two class sizes.`,th:`ห้อง 6/1 และห้อง 6/2 มีนักเรียนรวมกัน 60 คน เมื่อนำจำนวนนักเรียนห้องที่มากกว่าไปหารด้วยห้องที่น้อยกว่า จะได้ผลหาร 3 เศษ 4 จงหา ค.ร.น. ของจำนวนนักเรียนทั้งสองห้อง`},options:[{id:`A`,label:{en:`644`,th:`644`}},{id:`B`,label:{en:`45`,th:`45`}},{id:`C`,label:{en:`322`,th:`322`}},{id:`D`,label:{en:`161`,th:`161`}}],correctOptionId:`C`,explanation:{en:`Let the smaller class = s and larger = l = 3s + 4. Since s + l = 60: s + 3s + 4 = 60, so 4s = 56, s = 14 and l = 46. The GCF of 14 and 46 is 2 (46 = 3×14 + 4, 14 = 3×4 + 2, 4 = 2×2 + 0). LCM = (14 × 46) ÷ 2 = 644 ÷ 2 = 322.`,th:`ให้ห้องที่น้อยกว่า = s และห้องที่มากกว่า = l = 3s + 4 เนื่องจาก s + l = 60: s + 3s + 4 = 60 ดังนั้น 4s = 56 จึง s = 14 และ l = 46 ห.ร.ม. ของ 14 และ 46 คือ 2 (46 = 3×14 + 4, 14 = 3×4 + 2, 4 = 2×2 + 0) ค.ร.น. = (14 × 46) ÷ 2 = 644 ÷ 2 = 322`},distractorNotes:{A:{en:`Forgot to divide the product of the two numbers by their GCF, using the product itself (14 × 46 = 644) as the LCM.`,th:`ลืมนำผลคูณของสองจำนวนไปหารด้วย ห.ร.ม. จึงใช้ผลคูณ (14 × 46 = 644) เป็น ค.ร.น. โดยตรง`},B:{en:`Ignored the remainder of 4, treating the larger class as exactly 3 times the smaller, giving s = 15, l = 45, and LCM(15, 45) = 45.`,th:`ละเลยเศษ 4 โดยคิดว่าห้องที่มากกว่าเป็น 3 เท่าของห้องที่น้อยกว่าพอดี ได้ s = 15, l = 45 และ ค.ร.น.(15, 45) = 45`},D:{en:`Misused the remainder value (4) directly as the GCF instead of correctly computing it as 2, giving LCM = 644 ÷ 4 = 161.`,th:`นำค่าเศษ (4) มาใช้เป็น ห.ร.ม. โดยตรงแทนที่จะคำนวณให้ถูกต้องว่าเป็น 2 ทำให้ได้ ค.ร.น. = 644 ÷ 4 = 161`}},hints:[{en:`Set up two unknowns for the two class sizes, using the division relationship given.`,th:`ตั้งตัวไม่ทราบค่าสองตัวแทนจำนวนนักเรียนสองห้อง โดยใช้ความสัมพันธ์การหารที่โจทย์กำหนด`},{en:`Remember: dividend = divisor × quotient + remainder. Combine this with the sum to solve for both class sizes.`,th:`จำไว้ว่า ตัวตั้ง = ตัวหาร × ผลหาร + เศษ นำมารวมกับผลรวมเพื่อหาจำนวนนักเรียนทั้งสองห้อง`},{en:`Once you have both numbers, find their GCF using repeated division, then use LCM × GCF = product of the two numbers.`,th:`เมื่อได้จำนวนทั้งสองแล้ว หา ห.ร.ม. ด้วยการหารซ้ำ แล้วใช้ ค.ร.น. × ห.ร.ม. = ผลคูณของสองจำนวน`}],visual:null,estimatedSeconds:70},{id:`A-06`,testId:`samsen-mock-a`,number:6,skill:`Algebra & Patterns`,topic:{en:`Growing Patterns`,th:`แบบรูปที่เพิ่มขึ้น`},difficulty:I(6),prompt:{en:`The Craft Club arranges bottle-cap counters into a plus-sign pattern to decorate their market-day stall, adding one more counter to each of the four arms every time they build a bigger figure. The picture shows Figure 3. Figure 1 uses 5 counters, Figure 2 uses 9, and Figure 3 (shown) uses 13. If the pattern continues, how many counters will Figure 30 use?`,th:`ชมรมงานฝีมือจัดเรียงฝาขวดเป็นรูปเครื่องหมายบวกเพื่อตกแต่งร้านค้าในวันตลาดนัด โดยเพิ่มฝาขวดอีก 1 ชิ้นในแต่ละแขนทั้งสี่ด้านทุกครั้งที่สร้างรูปที่ใหญ่ขึ้น ภาพที่แสดงคือรูปที่ 3 รูปที่ 1 ใช้ฝาขวด 5 ชิ้น รูปที่ 2 ใช้ 9 ชิ้น และรูปที่ 3 (ในภาพ) ใช้ 13 ชิ้น ถ้าแบบรูปดำเนินต่อไปเรื่อยๆ รูปที่ 30 จะใช้ฝาขวดกี่ชิ้น`},options:[{id:`A`,label:{en:`120`,th:`120`}},{id:`B`,label:{en:`117`,th:`117`}},{id:`C`,label:{en:`151`,th:`151`}},{id:`D`,label:{en:`121`,th:`121`}}],correctOptionId:`D`,explanation:{en:`Each figure adds 4 counters (one per arm) to the previous one, so the counter count follows Figure(n) = 4n + 1. Check: Figure 1 = 5, Figure 2 = 9, Figure 3 = 13. ✓ For Figure 30: 4 × 30 + 1 = 121.`,th:`แต่ละรูปจะเพิ่มฝาขวด 4 ชิ้น (แขนละ 1 ชิ้น) จากรูปก่อนหน้า ดังนั้นจำนวนฝาขวด = 4n + 1 ตรวจสอบ: รูปที่ 1 = 5, รูปที่ 2 = 9, รูปที่ 3 = 13 ✓ สำหรับรูปที่ 30: 4 × 30 + 1 = 121`},distractorNotes:{A:{en:`Forgot the "+1" for the center counter, computing only 4 × 30 = 120.`,th:`ลืมบวก "+1" สำหรับฝาขวดตรงกลาง คำนวณเพียง 4 × 30 = 120`},B:{en:`Used figure number 29 instead of 30, an off-by-one counting error: 4 × 29 + 1 = 117.`,th:`ใช้หมายเลขรูปที่ 29 แทนที่จะเป็น 30 นับคลาดเคลื่อนไปหนึ่งรูป: 4 × 29 + 1 = 117`},C:{en:`Used a common difference of 5 between figures instead of the correct 4: 5 × 30 + 1 = 151.`,th:`ใช้ผลต่างระหว่างรูป 5 แทนที่จะเป็น 4 ที่ถูกต้อง: 5 × 30 + 1 = 151`}},hints:[{en:`Look at how many more counters each figure has compared to the one before it.`,th:`ลองสังเกตว่าแต่ละรูปมีฝาขวดมากกว่ารูปก่อนหน้ากี่ชิ้น`},{en:`The counter count increases by a fixed amount each time — write a general formula in terms of the figure number n.`,th:`จำนวนฝาขวดเพิ่มขึ้นคงที่ทุกครั้ง ลองเขียนสูตรทั่วไปในรูปของหมายเลขรูป n`},{en:`Since the pattern adds 4 counters per figure and Figure 1 starts at 5, the formula is 4n + 1. Substitute n = 30.`,th:`เนื่องจากแบบรูปเพิ่มฝาขวด 4 ชิ้นต่อรูป และรูปที่ 1 เริ่มที่ 5 สูตรคือ 4n + 1 แทน n = 30`}],visual:{kind:`gridPattern`,gridSize:7,cells:[{row:3,col:3},{row:0,col:3},{row:1,col:3},{row:2,col:3},{row:4,col:3},{row:5,col:3},{row:6,col:3},{row:3,col:0},{row:3,col:1},{row:3,col:2},{row:3,col:4},{row:3,col:5},{row:3,col:6}],alt:{en:`A plus-sign shaped arrangement of 13 shaded cells in a 7-by-7 grid, showing Figure 3 of the counter pattern.`,th:`รูปเครื่องหมายบวกจากช่องแรเงา 13 ช่องในตารางขนาด 7 คูณ 7 แสดงรูปที่ 3 ของแบบรูปฝาขวด`}},estimatedSeconds:75},{id:`A-07`,testId:`samsen-mock-a`,number:7,skill:`Word Problems & Logic`,topic:{en:`Speed, Distance & Time`,th:`อัตราเร็ว ระยะทาง และเวลา`},difficulty:I(7),prompt:{en:`At 7:00, Mint leaves the clubhouse jogging along a straight trail at 150 m/min. At 7:08, Nam leaves the same clubhouse cycling along the same trail at 250 m/min, chasing after Mint. At what time does Nam catch up to Mint?`,th:`เวลา 7:00 น. มิ้นท์ออกจากชมรมวิ่งจ๊อกกิ้งไปตามเส้นทางตรงด้วยความเร็ว 150 เมตร/นาที เวลา 7:08 น. น้ำออกจากชมรมเดียวกันขี่จักรยานตามเส้นทางเดียวกันด้วยความเร็ว 250 เมตร/นาที เพื่อตามมิ้นท์ น้ำจะตามมิ้นท์ทันเวลาใด`},options:[{id:`A`,label:{en:`7:20`,th:`7:20 น.`}},{id:`B`,label:{en:`7:12`,th:`7:12 น.`}},{id:`C`,label:{en:`7:28`,th:`7:28 น.`}},{id:`D`,label:{en:`7:11`,th:`7:11 น.`}}],correctOptionId:`A`,explanation:{en:`By the time Nam starts (7:08), Mint has a head start of 150 × 8 = 1,200 m. Nam closes this gap at a rate of 250 − 150 = 100 m/min, so it takes 1,200 ÷ 100 = 12 minutes after Nam starts. 7:08 + 12 min = 7:20.`,th:`ก่อนน้ำจะออกตัว (7:08 น.) มิ้นท์มีระยะนำอยู่ 150 × 8 = 1,200 เมตร น้ำไล่ตามด้วยอัตราปิดช่องว่าง 250 − 150 = 100 เมตร/นาที จึงใช้เวลา 1,200 ÷ 100 = 12 นาที นับจากที่น้ำออกตัว 7:08 น. + 12 นาที = 7:20 น.`},distractorNotes:{B:{en:`Added the 12-minute catch-up time to Mint's start time (7:00) instead of Nam's start time (7:08).`,th:`นำเวลาไล่ทัน 12 นาที ไปบวกกับเวลาที่มิ้นท์ออกตัว (7:00 น.) แทนที่จะเป็นเวลาที่น้ำออกตัว (7:08 น.)`},C:{en:`Used Nam's speed instead of Mint's to compute the head-start distance (250 × 8 = 2,000 m), then divided by 100 to get 20 minutes, added to 7:08.`,th:`ใช้ความเร็วของน้ำแทนความเร็วของมิ้นท์ในการหาระยะนำ (250 × 8 = 2,000 เมตร) แล้วหารด้วย 100 ได้ 20 นาที นำไปบวกกับ 7:08 น.`},D:{en:`Added the two speeds instead of subtracting them, as if Mint and Nam were moving toward each other: 1,200 ÷ 400 = 3 min, added to 7:08.`,th:`นำความเร็วทั้งสองมาบวกกันแทนที่จะลบกัน ราวกับมิ้นท์และน้ำเคลื่อนที่เข้าหากัน: 1,200 ÷ 400 = 3 นาที นำไปบวกกับ 7:08 น.`}},hints:[{en:`Mint already has a head start by the time Nam begins — figure out how far ahead Mint is at 7:08.`,th:`มิ้นท์มีระยะนำไปแล้วก่อนที่น้ำจะเริ่ม ลองหาว่าเมื่อถึงเวลา 7:08 น. มิ้นท์อยู่ห่างไปเท่าใด`},{en:`Since both move the same direction, use the difference in their speeds to find how fast the gap closes.`,th:`เนื่องจากทั้งสองเคลื่อนที่ไปทิศทางเดียวกัน ให้ใช้ผลต่างของความเร็วเพื่อหาว่าช่องว่างปิดเร็วเพียงใด`},{en:`Divide the head-start distance by the closing speed to get the minutes after Nam starts, then add that to 7:08.`,th:`นำระยะนำไปหารด้วยอัตราการปิดช่องว่าง จะได้จำนวนนาทีหลังจากน้ำเริ่มออกตัว แล้วนำไปบวกกับ 7:08 น.`}],visual:null,estimatedSeconds:85},{id:`A-08`,testId:`samsen-mock-a`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing in a Ratio`,th:`การแบ่งตามอัตราส่วน`},difficulty:I(8),prompt:{en:`A sponsor donates 3,600 baht to the Book Fair, split between Fah, Gift and Ohm in the ratio 5:4:3. Fah uses \\frac{2}{5} of her share to buy notebooks priced 40 baht each for the club's stall. How much money does Fah have left after buying the notebooks?`,th:`ผู้สนับสนุนบริจาคเงิน 3,600 บาท ให้กับงานหนังสือ แบ่งให้ฟ้า กิ๊ฟต์ และโอห์ม ตามอัตราส่วน 5:4:3 ฟ้านำเงิน \\frac{2}{5} ของส่วนแบ่งของเธอไปซื้อสมุดราคาเล่มละ 40 บาท สำหรับร้านค้าของชมรม หลังซื้อสมุดแล้วฟ้าเหลือเงินกี่บาท`},options:[{id:`A`,label:{en:`600 baht`,th:`600 บาท`}},{id:`B`,label:{en:`900 baht`,th:`900 บาท`}},{id:`C`,label:{en:`1,200 baht`,th:`1,200 บาท`}},{id:`D`,label:{en:`720 baht`,th:`720 บาท`}}],correctOptionId:`B`,explanation:{en:`There are 5+4+3 = 12 parts, so each part = 3,600 ÷ 12 = 300 baht. Fah's share = 5 × 300 = 1,500 baht. She spends \\frac{2}{5} × 1,500 = 600 baht on notebooks, leaving 1,500 − 600 = 900 baht.`,th:`รวมทั้งหมด 5+4+3 = 12 ส่วน แต่ละส่วน = 3,600 ÷ 12 = 300 บาท ส่วนแบ่งของฟ้า = 5 × 300 = 1,500 บาท เธอใช้เงิน \\frac{2}{5} × 1,500 = 600 บาท ซื้อสมุด เหลือเงิน 1,500 − 600 = 900 บาท`},distractorNotes:{A:{en:`Reported the amount spent (600 baht) instead of the amount left over.`,th:`รายงานจำนวนเงินที่ใช้ไป (600 บาท) แทนที่จะเป็นจำนวนเงินที่เหลือ`},C:{en:`Used \\frac{1}{5} of Fah's share as the amount spent instead of \\frac{2}{5}, giving a spent amount of 300 and leftover of 1,200.`,th:`ใช้ \\frac{1}{5} ของส่วนแบ่งฟ้าเป็นจำนวนที่ใช้จ่ายแทนที่จะเป็น \\frac{2}{5} ทำให้ใช้ไป 300 บาท และเหลือ 1,200 บาท`},D:{en:`Used Gift's share (4 parts = 1,200 baht) instead of Fah's share (5 parts) for the calculation.`,th:`ใช้ส่วนแบ่งของกิ๊ฟต์ (4 ส่วน = 1,200 บาท) แทนที่จะเป็นส่วนแบ่งของฟ้า (5 ส่วน) ในการคำนวณ`}},hints:[{en:`First find the value of one part of the ratio.`,th:`หาค่าของหนึ่งส่วนในอัตราส่วนก่อน`},{en:`Use the number of parts belonging to Fah specifically to find her share, then apply the fraction she spends.`,th:`ใช้จำนวนส่วนที่เป็นของฟ้าโดยเฉพาะเพื่อหาส่วนแบ่งของเธอ แล้วจึงคำนวณเศษส่วนที่เธอใช้จ่าย`},{en:`Total parts = 12, so each part = 3,600 ÷ 12. Fah gets 5 parts; find 2/5 of that share for the spending, then subtract from her total.`,th:`รวมทั้งหมด 12 ส่วน แต่ละส่วน = 3,600 ÷ 12 ฟ้าได้ 5 ส่วน หา 2/5 ของส่วนแบ่งนั้นสำหรับการใช้จ่าย แล้วลบออกจากยอดรวมของเธอ`}],visual:null,estimatedSeconds:90},{id:`A-09`,testId:`samsen-mock-a`,number:9,skill:`Geometry & Angles`,topic:{en:`Parallel Lines & Triangles`,th:`เส้นขนานและสามเหลี่ยม`},difficulty:I(9),prompt:{en:`In the figure, line l₁ is parallel to line l₂. Points A and C lie on l₁, and point B lies on l₂, forming triangle ABC. The exterior angle at A (between the extension of CA and side AB) is 118°, and the angle at C (angle ACB) is 35°. Find angle x, the angle at B.`,th:`จากรูป เส้น l₁ ขนานกับเส้น l₂ จุด A และ C อยู่บนเส้น l₁ ส่วนจุด B อยู่บนเส้น l₂ เกิดเป็นสามเหลี่ยม ABC มุมภายนอกที่จุด A (ระหว่างส่วนต่อของ CA กับด้าน AB) มีขนาด 118° และมุมที่จุด C (มุม ACB) มีขนาด 35° จงหามุม x ซึ่งเป็นมุมที่จุด B`},options:[{id:`A`,label:{en:`62°`,th:`62°`}},{id:`B`,label:{en:`97°`,th:`97°`}},{id:`C`,label:{en:`145°`,th:`145°`}},{id:`D`,label:{en:`83°`,th:`83°`}}],correctOptionId:`D`,explanation:{en:`Since A lies on straight line l₁, the interior angle BAC = 180° − 118° = 62°. Using the angle sum of triangle ABC: x = 180° − 62° − 35° = 83°.`,th:`เนื่องจากจุด A อยู่บนเส้นตรง l₁ มุมภายใน BAC = 180° − 118° = 62° เมื่อใช้ผลรวมมุมภายในสามเหลี่ยม ABC: x = 180° − 62° − 35° = 83°`},distractorNotes:{A:{en:`Wrongly treated x as supplementary to the 118° exterior angle (180° − 118°), confusing it with the interior angle at A.`,th:`เข้าใจผิดว่า x เป็นมุมประกอบ (supplementary) กับมุมภายนอก 118° (180° − 118°) สับสนกับมุมภายในที่จุด A`},B:{en:`Made a sign error combining the angles: computed 180° − 118° + 35° = 97° instead of correctly finding the interior angle at A first.`,th:`คำนวณเครื่องหมายผิดพลาดขณะรวมมุม: คำนวณ 180° − 118° + 35° = 97° แทนที่จะหามุมภายในที่จุด A ให้ถูกต้องก่อน`},C:{en:`Ignored the angle at A entirely and only used 180° − 35° = 145°.`,th:`ละเลยมุมที่จุด A ไปทั้งหมด และใช้เพียง 180° − 35° = 145°`}},hints:[{en:`The exterior angle at A and the interior angle at A lie on the same straight line.`,th:`มุมภายนอกที่จุด A และมุมภายในที่จุด A อยู่บนเส้นตรงเดียวกัน`},{en:`Angles on a straight line add up to 180° — use this to find the interior angle at A first.`,th:`มุมบนเส้นตรงรวมกันได้ 180° ใช้หลักนี้หามุมภายในที่จุด A ก่อน`},{en:`Once you know the interior angle at A, use the fact that the three angles of triangle ABC add up to 180° to find x.`,th:`เมื่อทราบมุมภายในที่จุด A แล้ว ใช้หลักที่ว่ามุมทั้งสามของสามเหลี่ยม ABC รวมกันได้ 180° เพื่อหา x`}],visual:{kind:`geometryFigure`,width:260,height:170,segments:[{x1:20,y1:51,x2:250,y2:51,ticks:1},{x1:20,y1:128,x2:250,y2:128,ticks:1},{x1:70,y1:51,x2:111,y2:128},{x1:220,y1:51,x2:111,y2:128}],points:[{x:70,y:51,label:`A`,labelOffset:[-14,-8]},{x:220,y:51,label:`C`,labelOffset:[6,-8]},{x:111,y:128,label:`B`,labelOffset:[-4,18]}],angleMarks:[{x:70,y:51,fromDeg:180,toDeg:298,radius:22,label:`118°`,color:`var(--coral)`},{x:220,y:51,fromDeg:180,toDeg:215,radius:20,label:`35°`,color:`var(--teal)`},{x:111,y:128,fromDeg:35,toDeg:118,radius:24,label:`x°`,color:`var(--navy)`}],alt:{en:`Two parallel horizontal lines with a triangle formed between them: a 118° exterior angle at A, a 35° angle at C, and an unknown angle x at B.`,th:`เส้นขนานแนวนอนสองเส้นกับสามเหลี่ยมที่เกิดขึ้นระหว่างเส้นทั้งสอง มุมภายนอก 118° ที่ A มุม 35° ที่ C และมุม x ที่ยังไม่ทราบค่าที่ B`}},estimatedSeconds:95},{id:`A-10`,testId:`samsen-mock-a`,number:10,skill:`Area, Perimeter & Circles`,topic:{en:`Cylinder Volume`,th:`ปริมาตรทรงกระบอก`},difficulty:I(10),prompt:{en:`The Gardening Club fills two cylindrical water tanks for the market-day plant stall. Tank A has a circular base of radius 5 m and a height of 36 m. Tank B has a height of 25 m and holds the exact same volume of water as Tank A when full. What is the radius of Tank B's base?`,th:`ชมรมสวนพฤกษศาสตร์เติมน้ำในถังทรงกระบอกสองถังสำหรับร้านขายต้นไม้ในวันตลาดนัด ถัง A มีฐานวงกลมรัศมี 5 เมตร สูง 36 เมตร ถัง B สูง 25 เมตร และบรรจุน้ำได้ปริมาตรเท่ากับถัง A พอดีเมื่อเต็มถัง รัศมีฐานของถัง B มีค่าเท่าใด`},options:[{id:`A`,label:{en:`7.2 m`,th:`7.2 ม.`}},{id:`B`,label:{en:`5 m`,th:`5 ม.`}},{id:`C`,label:{en:`6 m`,th:`6 ม.`}},{id:`D`,label:{en:`36 m`,th:`36 ม.`}}],correctOptionId:`C`,explanation:{en:`Volume of Tank A = π × 5² × 36 = 900π. For Tank B: π × r² × 25 = 900π, so r² = 900 ÷ 25 = 36, giving r = 6 m.`,th:`ปริมาตรถัง A = π × 5² × 36 = 900π สำหรับถัง B: π × r² × 25 = 900π ดังนั้น r² = 900 ÷ 25 = 36 จึง r = 6 เมตร`},distractorNotes:{A:{en:`Used a straight linear ratio of the heights (5 × \\frac{36}{25} = 7.2) instead of the correct radius–area relationship, which requires a square root.`,th:`ใช้อัตราส่วนความสูงแบบเชิงเส้นตรง (5 × \\frac{36}{25} = 7.2) แทนที่จะใช้ความสัมพันธ์ที่ถูกต้องระหว่างรัศมีกับพื้นที่ ซึ่งต้องใช้รากที่สอง`},B:{en:`Assumed Tank B has the same radius as Tank A, overlooking that a shorter tank needs a wider base to hold the same volume.`,th:`สันนิษฐานว่าถัง B มีรัศมีเท่ากับถัง A โดยมองข้ามว่าถังที่เตี้ยกว่าต้องมีฐานกว้างกว่าจึงจะจุน้ำได้เท่ากัน`},D:{en:`Correctly found r² = 36 but forgot to take the square root to find r itself.`,th:`หา r² = 36 ได้ถูกต้อง แต่ลืมถอดรากที่สองเพื่อหาค่า r`}},hints:[{en:`Start by finding the volume of Tank A using its known radius and height.`,th:`เริ่มจากการหาปริมาตรของถัง A โดยใช้รัศมีและความสูงที่ทราบ`},{en:`The two tanks have equal volume — set up an equation for Tank B using its known height and unknown radius.`,th:`ถังทั้งสองมีปริมาตรเท่ากัน ตั้งสมการสำหรับถัง B โดยใช้ความสูงที่ทราบและรัศมีที่ยังไม่ทราบค่า`},{en:`After finding r², remember the final step is to take the square root to get the radius r.`,th:`หลังจากหา r² ได้แล้ว อย่าลืมขั้นตอนสุดท้ายคือการถอดรากที่สองเพื่อหารัศมี r`}],visual:{kind:`cylinderPair`,cylinders:[{baseSide:10,height:36,label:`Tank A`},{baseSide:12,height:25,label:`Tank B`}],alt:{en:`Two cylindrical tanks side by side: Tank A with height 36 m, Tank B with height 25 m, both holding the same volume of water.`,th:`ถังทรงกระบอกสองถังวางเรียงกัน ถัง A สูง 36 เมตร ถัง B สูง 25 เมตร ทั้งสองบรรจุน้ำปริมาตรเท่ากัน`}},estimatedSeconds:100},{id:`A-11`,testId:`samsen-mock-a`,number:11,skill:`Area, Perimeter & Circles`,topic:{en:`Composite Area`,th:`พื้นที่รูปประกอบ`},difficulty:I(11),prompt:{en:`The Woodwork Club cuts a rectangular board measuring 16 cm by 10 cm. They saw off two triangular corners to make a hexagonal nameplate: a right triangle with legs 4 cm and 3 cm from one corner, and a right triangle with legs 5 cm and 4 cm from the opposite corner. Find the area of the remaining hexagonal nameplate (the shaded region shown).`,th:`ชมรมงานไม้ตัดแผ่นไม้สี่เหลี่ยมผืนผ้าขนาด 16 ซม. คูณ 10 ซม. โดยตัดมุมสามเหลี่ยมสองมุมออกเพื่อทำเป็นป้ายชื่อรูปหกเหลี่ยม คือ สามเหลี่ยมมุมฉากด้านประกอบมุมฉาก 4 ซม. และ 3 ซม. จากมุมหนึ่ง และสามเหลี่ยมมุมฉากด้านประกอบมุมฉาก 5 ซม. และ 4 ซม. จากมุมตรงข้าม พื้นที่ของป้ายชื่อรูปหกเหลี่ยมที่เหลืออยู่ (ส่วนที่แรเงาในภาพ) มีค่าเท่าใด`},options:[{id:`A`,label:{en:`144 cm²`,th:`144 ตร.ซม.`}},{id:`B`,label:{en:`154 cm²`,th:`154 ตร.ซม.`}},{id:`C`,label:{en:`128 cm²`,th:`128 ตร.ซม.`}},{id:`D`,label:{en:`176 cm²`,th:`176 ตร.ซม.`}}],correctOptionId:`A`,explanation:{en:`The rectangle has area 16 × 10 = 160 cm². The two triangles removed have areas (4 × 3) ÷ 2 = 6 cm² and (5 × 4) ÷ 2 = 10 cm². Remaining area = 160 − 6 − 10 = 144 cm².`,th:`สี่เหลี่ยมผืนผ้ามีพื้นที่ 16 × 10 = 160 ตร.ซม. สามเหลี่ยมสองรูปที่ตัดออกมีพื้นที่ (4 × 3) ÷ 2 = 6 ตร.ซม. และ (5 × 4) ÷ 2 = 10 ตร.ซม. พื้นที่ที่เหลือ = 160 − 6 − 10 = 144 ตร.ซม.`},distractorNotes:{B:{en:`Only subtracted one of the two triangles (the 4 cm × 3 cm one): 160 − 6 = 154 cm².`,th:`ลบสามเหลี่ยมออกเพียงรูปเดียว (รูปที่มีด้าน 4 ซม. และ 3 ซม.): 160 − 6 = 154 ตร.ซม.`},C:{en:`Forgot to halve the triangle areas, treating each cut corner as a full small rectangle instead of a triangle: 160 − 12 − 20 = 128 cm².`,th:`ลืมหารครึ่งพื้นที่สามเหลี่ยม โดยคิดว่าแต่ละมุมที่ตัดเป็นสี่เหลี่ยมผืนผ้าเล็กทั้งรูปแทนที่จะเป็นสามเหลี่ยม: 160 − 12 − 20 = 128 ตร.ซม.`},D:{en:`Added the triangle areas to the rectangle instead of subtracting them: 160 + 6 + 10 = 176 cm².`,th:`นำพื้นที่สามเหลี่ยมไปบวกเข้ากับสี่เหลี่ยมผืนผ้าแทนที่จะลบออก: 160 + 6 + 10 = 176 ตร.ซม.`}},hints:[{en:`Start with the area of the full rectangle before any corners are cut off.`,th:`เริ่มจากหาพื้นที่ของสี่เหลี่ยมผืนผ้าทั้งแผ่นก่อนที่จะตัดมุมออก`},{en:`Each cut-off corner is a right triangle — remember the area of a triangle is half of base times height.`,th:`แต่ละมุมที่ตัดออกเป็นสามเหลี่ยมมุมฉาก อย่าลืมว่าพื้นที่สามเหลี่ยมคือครึ่งหนึ่งของฐานคูณสูง`},{en:`Subtract the areas of both triangles from the rectangle’s area to get the remaining shaded region.`,th:`ลบพื้นที่ของสามเหลี่ยมทั้งสองรูปออกจากพื้นที่สี่เหลี่ยมผืนผ้า จะได้พื้นที่ส่วนที่แรเงาที่เหลืออยู่`}],visual:{kind:`geometryFigure`,width:320,height:200,showGrid:!0,gridStep:20,segments:[{x1:0,y1:0,x2:80,y2:0,style:`dashed`},{x1:0,y1:0,x2:0,y2:60,style:`dashed`},{x1:320,y1:200,x2:220,y2:200,style:`dashed`},{x1:320,y1:200,x2:320,y2:120,style:`dashed`}],polygons:[{points:[[80,0],[320,0],[320,120],[220,200],[0,200],[0,60]],fill:`shaded`}],labels:[{x:40,y:-6,text:`4 cm`},{x:-8,y:30,text:`3 cm`},{x:330,y:160,text:`4 cm`},{x:270,y:210,text:`5 cm`}],alt:{en:`A 16 by 10 cm rectangle with two corner triangles cut off, leaving a shaded hexagonal nameplate.`,th:`สี่เหลี่ยมผืนผ้าขนาด 16 คูณ 10 ซม. ที่ถูกตัดมุมสามเหลี่ยมออกสองมุม เหลือเป็นป้ายชื่อรูปหกเหลี่ยมที่แรเงา`}},estimatedSeconds:100},{id:`A-12`,testId:`samsen-mock-a`,number:12,skill:`Geometry & Angles`,topic:{en:`Algebraic Angles`,th:`มุมในรูปพีชคณิต`},difficulty:I(12),prompt:{en:`Line l₁ is parallel to line l₂. A bent (zig-zag) line goes from point A on l₁, bends at point V between the lines, and continues to point B on l₂. The angle between l₁ and AV at A is (2x + 10)°, and the angle between l₂ and VB at B is (3x − 5)°. If the bend angle AVB = 95°, find the value of the angle at B.`,th:`เส้น l₁ ขนานกับเส้น l₂ เส้นหักมุมเริ่มจากจุด A บนเส้น l₁ หักมุมที่จุด V ระหว่างเส้นทั้งสอง แล้วไปถึงจุด B บนเส้น l₂ มุมระหว่างเส้น l₁ กับ AV ที่จุด A มีขนาด (2x + 10)° และมุมระหว่างเส้น l₂ กับ VB ที่จุด B มีขนาด (3x − 5)° ถ้ามุมหักที่จุด V (มุม AVB) มีขนาด 95° จงหาขนาดของมุมที่จุด B`},options:[{id:`A`,label:{en:`46°`,th:`46°`}},{id:`B`,label:{en:`49°`,th:`49°`}},{id:`C`,label:{en:`18°`,th:`18°`}},{id:`D`,label:{en:`52°`,th:`52°`}}],correctOptionId:`B`,explanation:{en:`Drawing a line through V parallel to l₁ and l₂ splits angle AVB into two alternate angles equal to the angles at A and B. So (2x + 10) + (3x − 5) = 95, giving 5x + 5 = 95, so x = 18. The angle at B = 3(18) − 5 = 49°.`,th:`เมื่อลากเส้นผ่านจุด V ขนานกับเส้น l₁ และ l₂ จะแบ่งมุม AVB ออกเป็นมุมแทรกสองมุมที่เท่ากับมุมที่จุด A และจุด B ดังนั้น (2x + 10) + (3x − 5) = 95 จะได้ 5x + 5 = 95 จึง x = 18 มุมที่จุด B = 3(18) − 5 = 49°`},distractorNotes:{A:{en:`Gave the angle at A instead of the angle at B that was asked for: 2(18) + 10 = 46°.`,th:`ให้คำตอบเป็นมุมที่จุด A แทนที่จะเป็นมุมที่จุด B ตามที่โจทย์ถาม: 2(18) + 10 = 46°`},C:{en:`Gave the value of x (18) itself instead of substituting it back into the expression for the angle at B.`,th:`ให้คำตอบเป็นค่า x (18) เอง แทนที่จะแทนกลับเข้าไปในนิพจน์ของมุมที่จุด B`},D:{en:`Dropped the constant terms (+10 and −5) when setting up the equation, solving 2x + 3x = 95 instead: x = 19, giving 3(19) − 5 = 52°.`,th:`ตัดพจน์คงที่ (+10 และ −5) ทิ้งขณะตั้งสมการ โดยแก้ 2x + 3x = 95 แทน: ได้ x = 19 ทำให้ 3(19) − 5 = 52°`}},hints:[{en:`The bend angle at V can be split into two parts using a helper line parallel to both l₁ and l₂.`,th:`มุมหักที่จุด V สามารถแบ่งออกเป็นสองส่วนได้โดยใช้เส้นช่วยที่ขนานกับทั้ง l₁ และ l₂`},{en:`Each part of the bend angle equals one of the two given algebraic angles (alternate angle property).`,th:`แต่ละส่วนของมุมหักจะเท่ากับหนึ่งในสองมุมพีชคณิตที่กำหนดให้ (สมบัติมุมแทรก)`},{en:`Add the two expressions and set them equal to 95° to solve for x, then substitute x back into the expression for the angle at B.`,th:`นำนิพจน์ทั้งสองมาบวกกันและให้เท่ากับ 95° เพื่อแก้หาค่า x จากนั้นแทนค่า x กลับเข้าไปในนิพจน์ของมุมที่จุด B`}],visual:{kind:`geometryFigure`,width:260,height:190,segments:[{x1:20,y1:30,x2:240,y2:30,ticks:1},{x1:20,y1:170,x2:240,y2:170,ticks:1},{x1:92,y1:30,x2:140,y2:80},{x1:140,y1:80,x2:62,y2:170}],points:[{x:92,y:30,label:`A`,labelOffset:[-14,-8]},{x:140,y:80,label:`V`,labelOffset:[8,-6]},{x:62,y:170,label:`B`,labelOffset:[8,14]}],angleMarks:[{x:92,y:30,fromDeg:314,toDeg:360,radius:18,label:`(2x+10)°`,color:`var(--coral)`},{x:62,y:170,fromDeg:0,toDeg:49,radius:18,label:`(3x-5)°`,color:`var(--teal)`},{x:140,y:80,fromDeg:134,toDeg:229,radius:16,label:`95°`,color:`var(--navy)`}],alt:{en:`Two parallel lines with a zig-zag line bending at point V between them; algebraic angles are marked at A and B, and 95° is marked at the bend.`,th:`เส้นขนานสองเส้นกับเส้นหักมุมที่หักที่จุด V ระหว่างเส้นทั้งสอง มีการทำเครื่องหมายมุมพีชคณิตที่ A และ B และมุม 95° ที่จุดหัก`}},estimatedSeconds:115},{id:`A-13`,testId:`samsen-mock-a`,number:13,skill:`Area, Perimeter & Circles`,topic:{en:`Circles & Ratio`,th:`วงกลมและอัตราส่วน`},difficulty:I(13),prompt:{en:`Two concentric circles share the same center. The area of the ring (annulus) between them is 8 times the area of the smaller (inner) circle. Find the ratio of the outer radius to the inner radius.`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกัน พื้นที่วงแหวนระหว่างวงกลมทั้งสองมีค่าเป็น 8 เท่าของพื้นที่วงกลมวงเล็ก (วงใน) จงหาอัตราส่วนของรัศมีวงนอกต่อรัศมีวงใน`},options:[{id:`A`,label:{en:`9 : 1`,th:`9 : 1`}},{id:`B`,label:{en:`8 : 1`,th:`8 : 1`}},{id:`C`,label:{en:`4.5 : 1`,th:`4.5 : 1`}},{id:`D`,label:{en:`3 : 1`,th:`3 : 1`}}],correctOptionId:`D`,explanation:{en:`Let inner radius = r and outer radius = R. The ring area = πR² − πr² = 8πr², so R² = 9r², giving R = 3r. The ratio R : r = 3 : 1.`,th:`ให้รัศมีวงใน = r และรัศมีวงนอก = R พื้นที่วงแหวน = πR² − πr² = 8πr² ดังนั้น R² = 9r² จะได้ R = 3r อัตราส่วน R : r = 3 : 1`},distractorNotes:{A:{en:`Correctly found R² = 9r² but forgot to take the square root, giving the squared ratio instead of the radius ratio.`,th:`หา R² = 9r² ได้ถูกต้อง แต่ลืมถอดรากที่สอง จึงได้อัตราส่วนกำลังสองแทนที่จะเป็นอัตราส่วนของรัศมี`},B:{en:`Used the multiple (8) directly as the radius ratio instead of solving R² = (8 + 1)r² first.`,th:`ใช้ตัวคูณ (8) เป็นอัตราส่วนของรัศมีโดยตรง แทนที่จะแก้สมการ R² = (8 + 1)r² ก่อน`},C:{en:`Mistakenly "square-rooted" 9 by dividing it by 2 instead of computing the true square root.`,th:`ถอดรากที่สองของ 9 ผิดพลาดโดยการหารด้วย 2 แทนที่จะคำนวณรากที่สองที่แท้จริง`}},hints:[{en:`Let the inner radius be r and the outer radius be R, and write the ring area in terms of both.`,th:`ให้รัศมีวงในเป็น r และรัศมีวงนอกเป็น R แล้วเขียนพื้นที่วงแหวนในรูปของทั้งสองค่า`},{en:`The ring area equals the outer circle area minus the inner circle area — set this equal to 8 times the inner circle area.`,th:`พื้นที่วงแหวนเท่ากับพื้นที่วงกลมวงนอกลบด้วยพื้นที่วงกลมวงใน ให้ตั้งค่านี้เท่ากับ 8 เท่าของพื้นที่วงกลมวงใน`},{en:`Solve πR² − πr² = 8πr² for R² in terms of r², then take the square root to find the ratio R : r.`,th:`แก้สมการ πR² − πr² = 8πr² เพื่อหา R² ในรูปของ r² แล้วถอดรากที่สองเพื่อหาอัตราส่วน R : r`}],visual:{kind:`concentricCircles`,outerRadius:126,innerRadius:42,outerLabel:`R`,innerLabel:`r`,alt:{en:`Two concentric circles with outer radius R and inner radius r, with the ring between them shaded.`,th:`วงกลมสองวงที่มีจุดศูนย์กลางร่วมกัน รัศมีวงนอก R และรัศมีวงใน r โดยวงแหวนระหว่างวงกลมทั้งสองถูกแรเงา`}},estimatedSeconds:120},{id:`A-14`,testId:`samsen-mock-a`,number:14,skill:`Area, Perimeter & Circles`,topic:{en:`Arcs & Composite Area`,th:`พื้นที่ส่วนโค้งและรูปประกอบ`},difficulty:I(14),prompt:{en:`The Craft Club designs a square gift card of side 14 cm to sell at the market-day stall, with two quarter-circle arcs drawn from opposite corners, each with radius equal to the side of the square, as shown. Find the area of the shaded leaf-shaped region between the arcs. (Use π = \\frac{22}{7}.)`,th:`ชมรมงานฝีมือออกแบบการ์ดของขวัญรูปสี่เหลี่ยมจัตุรัสด้านยาว 14 ซม. เพื่อขายที่ร้านค้าในวันตลาดนัด โดยลากส่วนโค้งหนึ่งในสี่ของวงกลมสองเส้นจากมุมตรงข้ามกัน แต่ละเส้นมีรัศมีเท่ากับความยาวด้านของสี่เหลี่ยมจัตุรัส ดังภาพ พื้นที่ส่วนที่แรเงารูปใบไม้ระหว่างส่วนโค้งทั้งสองมีค่าเท่าใด (กำหนด π = \\frac{22}{7})`},options:[{id:`A`,label:{en:`308 cm²`,th:`308 ตร.ซม.`}},{id:`B`,label:{en:`196 cm²`,th:`196 ตร.ซม.`}},{id:`C`,label:{en:`112 cm²`,th:`112 ตร.ซม.`}},{id:`D`,label:{en:`84 cm²`,th:`84 ตร.ซม.`}}],correctOptionId:`C`,explanation:{en:`Each quarter circle has area (\\frac{1}{4}) × (\\frac{22}{7}) × 14² = (\\frac{1}{4}) × \\frac{22}{7} × 196 = 154 cm². The two quarter circles together = 308 cm². The leaf area = 308 − 196 (the square) = 112 cm².`,th:`พื้นที่หนึ่งในสี่วงกลมแต่ละเส้น = (\\frac{1}{4}) × (\\frac{22}{7}) × 14² = (\\frac{1}{4}) × \\frac{22}{7} × 196 = 154 ตร.ซม. รวมสองเส้น = 308 ตร.ซม. พื้นที่รูปใบไม้ = 308 − 196 (พื้นที่สี่เหลี่ยมจัตุรัส) = 112 ตร.ซม.`},distractorNotes:{A:{en:`Forgot to subtract the square’s area, leaving just the combined area of the two quarter circles (308 cm²).`,th:`ลืมลบพื้นที่สี่เหลี่ยมจัตุรัสออก เหลือเพียงผลรวมพื้นที่ของหนึ่งในสี่วงกลมทั้งสองเส้น (308 ตร.ซม.)`},B:{en:`Used the whole square’s area, misidentifying which region of the figure is shaded.`,th:`ใช้พื้นที่สี่เหลี่ยมจัตุรัสทั้งรูป ระบุส่วนที่แรเงาของรูปผิดพลาด`},D:{en:`Computed the two unshaded corner segments instead of the shaded leaf: 196 − 112 = 84 cm².`,th:`คำนวณส่วนโค้งมุมที่ไม่ได้แรเงาแทนที่จะเป็นรูปใบไม้ที่แรเงา: 196 − 112 = 84 ตร.ซม.`}},hints:[{en:`Find the area of one quarter circle first, using the side of the square as its radius.`,th:`หาพื้นที่ของหนึ่งในสี่วงกลมเส้นเดียวก่อน โดยใช้ความยาวด้านของสี่เหลี่ยมจัตุรัสเป็นรัศมี`},{en:`The two quarter circles overlap inside the square — the leaf shape is where both arcs cover the same region.`,th:`หนึ่งในสี่วงกลมทั้งสองเส้นซ้อนทับกันภายในสี่เหลี่ยมจัตุรัส รูปใบไม้คือบริเวณที่ส่วนโค้งทั้งสองคลุมพื้นที่เดียวกัน`},{en:`Add the two quarter-circle areas together, then subtract the area of the square to isolate the overlapping leaf shape.`,th:`นำพื้นที่ของหนึ่งในสี่วงกลมทั้งสองเส้นมาบวกกัน แล้วลบด้วยพื้นที่สี่เหลี่ยมจัตุรัส เพื่อแยกส่วนที่ซ้อนทับเป็นรูปใบไม้`}],visual:{kind:`leafShape`,width:14,height:14,corners:`topLeft-bottomRight`,sideLabel:`14 cm`,alt:{en:`A square of side 14 cm with two quarter-circle arcs from opposite corners, forming a shaded leaf shape in the middle.`,th:`สี่เหลี่ยมจัตุรัสด้านยาว 14 ซม. ที่มีส่วนโค้งหนึ่งในสี่วงกลมสองเส้นจากมุมตรงข้ามกัน เกิดเป็นรูปใบไม้ที่แรเงาตรงกลาง`}},estimatedSeconds:110},{id:`A-15`,testId:`samsen-mock-a`,number:15,skill:`Fractions & Decimals`,topic:{en:`Fractions of a Remainder`,th:`เศษส่วนของส่วนที่เหลือ`},difficulty:I(15),prompt:{en:`A water tank holds 360 liters when full. On Monday, the Science Club used \\frac{2}{5} of the water for an experiment. On Tuesday, they used \\frac{3}{8} of the remaining water for another experiment. How many liters of water are left in the tank after Tuesday?`,th:`ถังน้ำจุน้ำได้ 360 ลิตรเมื่อเต็มถัง วันจันทร์ชมรมวิทยาศาสตร์ใช้น้ำไป \\frac{2}{5} ของทั้งหมดสำหรับการทดลอง วันอังคารใช้น้ำที่เหลือไปอีก \\frac{3}{8} สำหรับการทดลองอีกครั้ง หลังวันอังคารเหลือน้ำในถังกี่ลิตร`},options:[{id:`A`,label:{en:`135 liters`,th:`135 ลิตร`}},{id:`B`,label:{en:`216 liters`,th:`216 ลิตร`}},{id:`C`,label:{en:`144 liters`,th:`144 ลิตร`}},{id:`D`,label:{en:`81 liters`,th:`81 ลิตร`}}],correctOptionId:`A`,explanation:{en:`Monday: used \\frac{2}{5} × 360 = 144 L, leaving 360 − 144 = 216 L. Tuesday: used \\frac{3}{8} × 216 = 81 L, leaving 216 − 81 = 135 L.`,th:`วันจันทร์: ใช้น้ำ \\frac{2}{5} × 360 = 144 ลิตร เหลือ 360 − 144 = 216 ลิตร วันอังคาร: ใช้น้ำ \\frac{3}{8} × 216 = 81 ลิตร เหลือ 216 − 81 = 135 ลิตร`},distractorNotes:{B:{en:`Only subtracted Monday's usage and forgot to also subtract Tuesday's usage, stopping at 216 L.`,th:`ลบเฉพาะน้ำที่ใช้วันจันทร์ แต่ลืมลบน้ำที่ใช้วันอังคารด้วย จึงหยุดอยู่ที่ 216 ลิตร`},C:{en:`Reported the amount used on Monday (144 L) instead of the amount left after Tuesday.`,th:`รายงานจำนวนน้ำที่ใช้ไปวันจันทร์ (144 ลิตร) แทนที่จะเป็นจำนวนที่เหลือหลังวันอังคาร`},D:{en:`Reported the amount used on Tuesday (81 L) instead of the amount remaining afterward.`,th:`รายงานจำนวนน้ำที่ใช้ไปวันอังคาร (81 ลิตร) แทนที่จะเป็นจำนวนที่เหลืออยู่หลังจากนั้น`}},hints:[{en:`The second fraction applies to what's left after Monday, not to the original full tank.`,th:`เศษส่วนที่สองใช้กับน้ำที่เหลือหลังวันจันทร์ ไม่ใช่กับน้ำเต็มถังตั้งแต่แรก`},{en:`Work step by step: find how much is used and left after Monday first, then apply Tuesday’s fraction to that new amount.`,th:`ทำทีละขั้นตอน: หาว่าใช้ไปและเหลือเท่าใดหลังวันจันทร์ก่อน แล้วจึงนำเศษส่วนของวันอังคารไปใช้กับจำนวนใหม่นั้น`},{en:`After finding 216 L left on Monday night, find 3/8 of 216 for Tuesday’s usage, then subtract that from 216.`,th:`หลังจากหาได้ว่าเหลือน้ำ 216 ลิตรในคืนวันจันทร์ ให้หา 3/8 ของ 216 สำหรับน้ำที่ใช้วันอังคาร แล้วลบออกจาก 216`}],visual:null,estimatedSeconds:100},{id:`A-16`,testId:`samsen-mock-a`,number:16,skill:`Algebra & Patterns`,topic:{en:`Area & Algebra`,th:`พื้นที่และพีชคณิต`},difficulty:I(16),prompt:{en:`A square sheet of card has side length 20 cm and area 400 cm². The Craft Club cuts a congruent right-triangle piece from each of the 4 corners, with both legs of each triangle equal to x cm, as shown. After cutting, the remaining octagonal piece has an area of 328 cm². Find x.`,th:`แผ่นกระดาษแข็งรูปสี่เหลี่ยมจัตุรัสด้านยาว 20 ซม. มีพื้นที่ 400 ตร.ซม. ชมรมงานฝีมือตัดสามเหลี่ยมมุมฉากที่เท่ากันทุกประการออกจากมุมทั้ง 4 มุม โดยด้านประกอบมุมฉากแต่ละด้านยาว x ซม. ดังภาพ หลังตัดแล้วชิ้นส่วนรูปแปดเหลี่ยมที่เหลือมีพื้นที่ 328 ตร.ซม. จงหาค่า x`},options:[{id:`A`,label:{en:`12 cm`,th:`12 ซม.`}},{id:`B`,label:{en:`6 cm`,th:`6 ซม.`}},{id:`C`,label:{en:`18 cm`,th:`18 ซม.`}},{id:`D`,label:{en:`36 cm`,th:`36 ซม.`}}],correctOptionId:`B`,explanation:{en:`Each corner triangle has area x²/2, and there are 4 corners, so total area removed = 4 × (x²/2) = 2x². The equation is 400 − 2x² = 328, so 2x² = 72, x² = 36, giving x = 6 cm.`,th:`สามเหลี่ยมแต่ละมุมมีพื้นที่ x²/2 และมีทั้งหมด 4 มุม ดังนั้นพื้นที่ที่ตัดออกทั้งหมด = 4 × (x²/2) = 2x² สมการคือ 400 − 2x² = 328 ดังนั้น 2x² = 72 จึง x² = 36 ได้ x = 6 ซม.`},distractorNotes:{A:{en:`Only accounted for one corner triangle instead of all four in the area equation: 400 − x²/2 = 328, giving x² = 144 and x = 12.`,th:`คิดคำนวณสามเหลี่ยมเพียงมุมเดียวแทนที่จะเป็นทั้งสี่มุมในสมการพื้นที่: 400 − x²/2 = 328 ทำให้ x² = 144 และ x = 12`},C:{en:`Divided the total area removed by 4 corners directly without applying the triangle-area formula: (400 − 328) ÷ 4 = 18.`,th:`นำพื้นที่ที่ตัดออกทั้งหมดไปหารด้วย 4 มุมโดยตรงโดยไม่ใช้สูตรพื้นที่สามเหลี่ยม: (400 − 328) ÷ 4 = 18`},D:{en:`Correctly found x² = 36 but forgot to take the square root to find x itself.`,th:`หา x² = 36 ได้ถูกต้อง แต่ลืมถอดรากที่สองเพื่อหาค่า x`}},hints:[{en:`Each corner cut is a right triangle with both legs equal to x — write its area in terms of x.`,th:`มุมที่ตัดแต่ละมุมเป็นสามเหลี่ยมมุมฉากที่มีด้านประกอบมุมฉากยาว x ทั้งคู่ เขียนพื้นที่ของมันในรูปของ x`},{en:`There are 4 identical corners cut off — multiply one triangle’s area by 4 for the total area removed.`,th:`มีมุมที่เหมือนกัน 4 มุมถูกตัดออก นำพื้นที่ของสามเหลี่ยมหนึ่งรูปคูณด้วย 4 เพื่อหาพื้นที่ที่ตัดออกทั้งหมด`},{en:`Set up the equation: original square area − total area removed = remaining area. Solve for x² first, then take the square root.`,th:`ตั้งสมการ: พื้นที่สี่เหลี่ยมจัตุรัสเดิม − พื้นที่ที่ตัดออกทั้งหมด = พื้นที่ที่เหลือ แก้หา x² ก่อน แล้วจึงถอดรากที่สอง`}],visual:{kind:`geometryFigure`,width:200,height:200,segments:[{x1:0,y1:0,x2:200,y2:0,style:`dashed`},{x1:200,y1:0,x2:200,y2:200,style:`dashed`},{x1:200,y1:200,x2:0,y2:200,style:`dashed`},{x1:0,y1:200,x2:0,y2:0,style:`dashed`}],polygons:[{points:[[60,0],[140,0],[200,60],[200,140],[140,200],[60,200],[0,140],[0,60]],fill:`shaded`}],labels:[{x:22,y:10,text:`x`},{x:8,y:38,text:`x`}],alt:{en:`A 20 by 20 cm square with a congruent right-triangle corner of leg x cut from each of the 4 corners, leaving a shaded octagon.`,th:`สี่เหลี่ยมจัตุรัสขนาด 20 คูณ 20 ซม. ที่ถูกตัดมุมสามเหลี่ยมมุมฉากซึ่งมีด้าน x เท่ากันทุกประการออกทั้ง 4 มุม เหลือเป็นรูปแปดเหลี่ยมที่แรเงา`}},estimatedSeconds:130},{id:`A-17`,testId:`samsen-mock-a`,number:17,skill:`Graphs & Data`,topic:{en:`Bar Charts`,th:`แผนภูมิแท่ง`},difficulty:I(17),prompt:{en:`The bar chart shows Fiction and Non-fiction book sales at the Book Fair over four days. Which of the following statements is INCORRECT?`,th:`แผนภูมิแท่งแสดงยอดขายหนังสือนวนิยายและหนังสือสารคดีในงานหนังสือตลอดสี่วัน ข้อความใดต่อไปนี้ไม่ถูกต้อง`},options:[{id:`A`,label:{en:`Thursday had the highest combined sales of both genres.`,th:`วันพฤหัสบดีมียอดขายรวมของทั้งสองประเภทสูงที่สุด`}},{id:`B`,label:{en:`Total Fiction sales across the four days were 54 books.`,th:`ยอดขายหนังสือนวนิยายรวมทั้งสี่วันเท่ากับ 54 เล่ม`}},{id:`C`,label:{en:`Fiction outsold Non-fiction on Wednesday.`,th:`วันพุธหนังสือนวนิยายขายได้มากกว่าหนังสือสารคดี`}},{id:`D`,label:{en:`Tuesday's combined sales were 25 books.`,th:`ยอดขายรวมวันอังคารเท่ากับ 25 เล่ม`}}],correctOptionId:`C`,explanation:{en:`On Wednesday, Fiction sold 9 books while Non-fiction sold 14 books — so Non-fiction outsold Fiction, not the other way around. This makes statement C the incorrect one. (Check the others: Thursday total = 18 + 11 = 29, the highest; Fiction total = 12 + 15 + 9 + 18 = 54; Tuesday total = 15 + 10 = 25 — all true.)`,th:`ในวันพุธ หนังสือนวนิยายขายได้ 9 เล่ม ในขณะที่หนังสือสารคดีขายได้ 14 เล่ม แสดงว่าสารคดีขายได้มากกว่านวนิยาย ไม่ใช่ในทางกลับกัน ดังนั้นข้อความ C จึงไม่ถูกต้อง (ตรวจสอบข้ออื่น: ยอดรวมวันพฤหัสบดี = 18 + 11 = 29 สูงที่สุด; ยอดรวมนวนิยาย = 12 + 15 + 9 + 18 = 54; ยอดรวมวันอังคาร = 15 + 10 = 25 ล้วนถูกต้อง)`},distractorNotes:{A:{en:`This statement is actually true — Thursday's combined total (18 + 11 = 29) is higher than every other day, so picking this suggests a mis-comparison of the day totals.`,th:`ข้อความนี้ถูกต้อง เพราะยอดรวมวันพฤหัสบดี (18 + 11 = 29) สูงกว่าทุกวัน การเลือกข้อนี้แสดงว่าเปรียบเทียบยอดรวมแต่ละวันผิดพลาด`},B:{en:`This statement is actually true (12 + 15 + 9 + 18 = 54); picking this suggests an addition error when totaling the Fiction bars.`,th:`ข้อความนี้ถูกต้อง (12 + 15 + 9 + 18 = 54) การเลือกข้อนี้แสดงว่าบวกยอดแท่งนวนิยายผิดพลาด`},D:{en:`This statement is actually true (15 + 10 = 25); picking this suggests confusing Tuesday's bars with another day's.`,th:`ข้อความนี้ถูกต้อง (15 + 10 = 25) การเลือกข้อนี้แสดงว่าสับสนแท่งของวันอังคารกับวันอื่น`}},hints:[{en:`Check each statement against the chart one at a time — three of them are true and one is false.`,th:`ตรวจสอบแต่ละข้อความกับแผนภูมิทีละข้อ สามข้อถูกต้องและหนึ่งข้อไม่ถูกต้อง`},{en:`Pay close attention to statements comparing the two genres on a single day, not just totals.`,th:`สังเกตข้อความที่เปรียบเทียบหนังสือสองประเภทในวันเดียวกันให้ดี ไม่ใช่แค่ยอดรวม`},{en:`Read the Wednesday bars for both Fiction and Non-fiction carefully and compare their heights directly.`,th:`อ่านแท่งของวันพุธทั้งนวนิยายและสารคดีอย่างละเอียด แล้วเปรียบเทียบความสูงของแท่งโดยตรง`}],visual:{kind:`barChart`,categories:[`Mon`,`Tue`,`Wed`,`Thu`],series:[{name:{en:`Fiction`,th:`นวนิยาย`},color:`coral`,values:[12,15,9,18]},{name:{en:`Non-fiction`,th:`สารคดี`},color:`teal`,values:[8,10,14,11]}],yStep:5,yMax:20,alt:{en:`Grouped bar chart of Fiction and Non-fiction book sales at the Book Fair from Monday to Thursday.`,th:`แผนภูมิแท่งเปรียบเทียบยอดขายหนังสือนวนิยายและสารคดีในงานหนังสือ ตั้งแต่วันจันทร์ถึงวันพฤหัสบดี`}},estimatedSeconds:150},{id:`A-18`,testId:`samsen-mock-a`,number:18,skill:`Graphs & Data`,topic:{en:`Pie Charts`,th:`แผนภูมิวงกลม`},difficulty:I(18),prompt:{en:`In a survey of students about their favorite school club, results are shown in the pie chart: Art 108°, Sports 126°, Music 72°, Science 54°. If 36 students chose Science, how many students chose Sports?`,th:`จากการสำรวจนักเรียนเรื่องชมรมที่ชื่นชอบ ผลสำรวจแสดงในแผนภูมิวงกลม ดังนี้ ชมรมศิลปะ 108°, ชมรมกีฬา 126°, ชมรมดนตรี 72°, ชมรมวิทยาศาสตร์ 54° ถ้ามีนักเรียน 36 คนเลือกชมรมวิทยาศาสตร์ จะมีนักเรียนกี่คนที่เลือกชมรมกีฬา`},options:[{id:`A`,label:{en:`63 students`,th:`63 คน`}},{id:`B`,label:{en:`48 students`,th:`48 คน`}},{id:`C`,label:{en:`126 students`,th:`126 คน`}},{id:`D`,label:{en:`84 students`,th:`84 คน`}}],correctOptionId:`D`,explanation:{en:`Since degrees are proportional to the number of students, 54° corresponds to 36 students, meaning 1° corresponds to 36 ÷ 54 = \\frac{2}{3} of a student. Sports (126°) corresponds to 126 × \\frac{2}{3} = 84 students.`,th:`เนื่องจากจำนวนองศาแปรผันตรงกับจำนวนนักเรียน 54° เทียบเท่ากับ 36 คน หมายความว่า 1° เทียบเท่ากับ 36 ÷ 54 = \\frac{2}{3} คน ชมรมกีฬา (126°) จึงเทียบเท่ากับ 126 × \\frac{2}{3} = 84 คน`},distractorNotes:{A:{en:`Mixed up Science's angle with Music's angle when setting up the proportion, using 72° instead of 54°: 36 × \\frac{126}{72} = 63.`,th:`สับสนมุมของชมรมวิทยาศาสตร์กับชมรมดนตรีขณะตั้งสัดส่วน โดยใช้ 72° แทนที่จะเป็น 54°: 36 × \\frac{126}{72} = 63`},B:{en:`Mismatched the Sports count with Music's actual student count instead of computing it directly.`,th:`จับคู่จำนวนนักเรียนชมรมกีฬาผิดพลาดกับจำนวนนักเรียนชมรมดนตรีจริง แทนที่จะคำนวณโดยตรง`},C:{en:`Used the Sports slice's degree measure (126) directly as the number of students, ignoring the given Science ratio entirely.`,th:`ใช้ขนาดมุมของชมรมกีฬา (126) เป็นจำนวนนักเรียนโดยตรง โดยไม่ได้ใช้อัตราส่วนของชมรมวิทยาศาสตร์ที่โจทย์กำหนดให้เลย`}},hints:[{en:`In a pie chart, the size of each angle is proportional to the number of items it represents.`,th:`ในแผนภูมิวงกลม ขนาดของแต่ละมุมแปรผันตรงกับจำนวนสิ่งที่มุมนั้นแทน`},{en:`Use the Science slice to find how many students correspond to each degree.`,th:`ใช้ส่วนของชมรมวิทยาศาสตร์เพื่อหาว่าแต่ละองศาเทียบเท่ากับนักเรียนกี่คน`},{en:`Find students per degree using 36 ÷ 54, then multiply that by 126 (the Sports angle) to get the Sports count.`,th:`หาจำนวนนักเรียนต่อองศาโดยใช้ 36 ÷ 54 แล้วนำไปคูณกับ 126 (มุมของชมรมกีฬา) เพื่อหาจำนวนนักเรียนชมรมกีฬา`}],visual:{kind:`pieChart`,slices:[{label:`Art`,degrees:108,color:`coral`},{label:`Sports`,degrees:126,color:`teal`},{label:`Music`,degrees:72,color:`gold`},{label:`Science`,degrees:54,color:`sage`}],alt:{en:`Pie chart of favorite school clubs: Art 108°, Sports 126°, Music 72°, Science 54°.`,th:`แผนภูมิวงกลมแสดงชมรมที่ชื่นชอบ: ศิลปะ 108°, กีฬา 126°, ดนตรี 72°, วิทยาศาสตร์ 54°`}},estimatedSeconds:160},{id:`A-19`,testId:`samsen-mock-a`,number:19,skill:`Ratio, Percentage & Average`,topic:{en:`Profit & Loss`,th:`กำไรและขาดทุน`},difficulty:I(19),prompt:{en:`A student stallholder buys a calculator for 480 baht to sell at the school market day. She marks up the price so that, if sold at the marked price, she would make a 25% profit. At closing time, she actually sells it for 100 baht less than the marked price. Find her actual profit.`,th:`นักเรียนเจ้าของร้านค้าซื้อเครื่องคิดเลขมาในราคา 480 บาท เพื่อขายในวันตลาดนัดโรงเรียน เธอตั้งราคาขายไว้สูงกว่าทุนโดยคาดว่าถ้าขายได้ตามราคาที่ตั้งไว้จะได้กำไร 25% แต่พอใกล้เลิกงาน เธอขายเครื่องคิดเลขไปในราคาต่ำกว่าราคาที่ตั้งไว้ 100 บาท เธอได้กำไรจริงเท่าใด`},options:[{id:`A`,label:{en:`20 baht profit`,th:`กำไร 20 บาท`}},{id:`B`,label:{en:`120 baht profit`,th:`กำไร 120 บาท`}},{id:`C`,label:{en:`5 baht loss`,th:`ขาดทุน 5 บาท`}},{id:`D`,label:{en:`60 baht profit`,th:`กำไร 60 บาท`}}],correctOptionId:`A`,explanation:{en:`The marked price = cost × 1.25 = 480 × 1.25 = 600 baht. The actual selling price = 600 − 100 = 500 baht. Actual profit = 500 − 480 = 20 baht.`,th:`ราคาที่ตั้งไว้ = ทุน × 1.25 = 480 × 1.25 = 600 บาท ราคาขายจริง = 600 − 100 = 500 บาท กำไรจริง = 500 − 480 = 20 บาท`},distractorNotes:{B:{en:`Forgot to subtract the 100-baht discount, treating the marked price itself as the actual selling price: 600 − 480 = 120.`,th:`ลืมลบส่วนลด 100 บาท โดยใช้ราคาที่ตั้งไว้เป็นราคาขายจริงเลย: 600 − 480 = 120`},C:{en:`Subtracted the 100 baht before applying the 25% markup instead of after, changing the order of operations: (480 − 100) × 1.25 = 475, giving 475 − 480 = a 5-baht loss.`,th:`ลบ 100 บาทก่อนคิดกำไร 25% แทนที่จะลบทีหลัง สลับลำดับขั้นตอนการคำนวณ: (480 − 100) × 1.25 = 475 ทำให้ 475 − 480 = ขาดทุน 5 บาท`},D:{en:`Treated the 25% profit as a percentage of the selling price rather than the cost price (a markup-vs-margin mix-up), giving a marked price of 480 ÷ 0.75 = 640 and a different profit.`,th:`คิดว่ากำไร 25% เป็นร้อยละของราคาขายแทนที่จะเป็นร้อยละของราคาทุน (สับสนระหว่างการบวกกำไรจากทุนกับจากราคาขาย) ทำให้ได้ราคาที่ตั้งไว้ = 480 ÷ 0.75 = 640 และกำไรที่ต่างออกไป`}},hints:[{en:`First find the marked price using the 25% profit target based on the cost price.`,th:`หาราคาที่ตั้งไว้ก่อน โดยใช้เป้าหมายกำไร 25% จากราคาทุน`},{en:`The actual selling price is different from the marked price — apply the 100-baht reduction to the marked price, not the cost.`,th:`ราคาขายจริงต่างจากราคาที่ตั้งไว้ ให้ลบ 100 บาทออกจากราคาที่ตั้งไว้ ไม่ใช่จากราคาทุน`},{en:`Marked price = 480 × 1.25. Actual selling price = marked price − 100. Actual profit = actual selling price − cost price (480).`,th:`ราคาที่ตั้งไว้ = 480 × 1.25 ราคาขายจริง = ราคาที่ตั้งไว้ − 100 กำไรจริง = ราคาขายจริง − ราคาทุน (480)`}],visual:null,estimatedSeconds:140},{id:`A-20`,testId:`samsen-mock-a`,number:20,skill:`Ratio, Percentage & Average`,topic:{en:`Percentage Relationships`,th:`ความสัมพันธ์ร้อยละ`},difficulty:I(20),prompt:{en:`Nara, Ploy and Tan together have saved 740 baht for a class trip. Ploy has saved 150% of what Nara has saved, and Tan has saved 80% of what Ploy has saved. How much more money has Ploy saved than Tan?`,th:`นารา พลอย และตาล เก็บเงินรวมกันได้ 740 บาท สำหรับทัศนศึกษาของห้อง พลอยเก็บเงินได้ 150% ของที่นาราเก็บได้ และตาลเก็บเงินได้ 80% ของที่พลอยเก็บได้ พลอยเก็บเงินได้มากกว่าตาลกี่บาท`},options:[{id:`A`,label:{en:`140 baht`,th:`140 บาท`}},{id:`B`,label:{en:`60 baht`,th:`60 บาท`}},{id:`C`,label:{en:`40 baht`,th:`40 บาท`}},{id:`D`,label:{en:`20 baht`,th:`20 บาท`}}],correctOptionId:`B`,explanation:{en:`Let Nara = N. Then Ploy = 1.5N and Tan = 0.8 × 1.5N = 1.2N. Sum: N + 1.5N + 1.2N = 3.7N = 740, so N = 200. Ploy = 300, Tan = 240. Ploy − Tan = 300 − 240 = 60 baht.`,th:`ให้นารา = N ดังนั้นพลอย = 1.5N และตาล = 0.8 × 1.5N = 1.2N ผลรวม: N + 1.5N + 1.2N = 3.7N = 740 จึง N = 200 พลอย = 300 ตาล = 240 พลอย − ตาล = 300 − 240 = 60 บาท`},distractorNotes:{A:{en:`Computed Tan as 80% of Nara's savings instead of 80% of Ploy's savings: 0.8 × 200 = 160, giving 300 − 160 = 140.`,th:`คำนวณเงินของตาลเป็น 80% ของนาราแทนที่จะเป็น 80% ของพลอย: 0.8 × 200 = 160 ทำให้ 300 − 160 = 140`},C:{en:`Found the difference between Nara and Tan instead of the difference between Ploy and Tan that was asked for: 240 − 200 = 40.`,th:`หาผลต่างระหว่างนาราและตาลแทนที่จะเป็นผลต่างระหว่างพลอยและตาลตามที่โจทย์ถาม: 240 − 200 = 40`},D:{en:`Misread "80% of Ploy" as "20 baht less than Ploy" instead of a percentage relationship.`,th:`อ่านผิดว่า "80% ของพลอย" หมายถึง "น้อยกว่าพลอย 20 บาท" แทนที่จะเป็นความสัมพันธ์ร้อยละ`}},hints:[{en:`Let Nara's savings be N, and express Ploy's and Tan's savings in terms of N.`,th:`ให้เงินของนาราเป็น N แล้วเขียนเงินของพลอยและตาลในรูปของ N`},{en:`Tan's amount depends on Ploy's amount, not directly on Nara's — chain the two percentages together.`,th:`เงินของตาลขึ้นอยู่กับเงินของพลอย ไม่ใช่ขึ้นอยู่กับเงินของนาราโดยตรง ให้ต่อเปอร์เซ็นต์ทั้งสองเข้าด้วยกัน`},{en:`Add N + 1.5N + 1.2N and set it equal to 740 to find N, then compute Ploy and Tan individually before subtracting.`,th:`นำ N + 1.5N + 1.2N มาบวกกันแล้วให้เท่ากับ 740 เพื่อหา N จากนั้นคำนวณเงินของพลอยและตาลแยกกันก่อนนำมาลบกัน`}],visual:null,estimatedSeconds:170}]},{id:`samsen-mock-b`,title:{en:`Mock Test B`,th:`ข้อสอบชุด B`},subtitle:{en:`Market & Travel Paper`,th:`ชุดตลาดและการเดินทาง`},recommendedMinutes:40,questions:[{id:`B-01`,testId:`samsen-mock-b`,number:1,skill:`Number & Operations`,topic:{en:`Digit Arrangement`,th:`การจัดเรียงตัวเลข`},difficulty:`Easy`,prompt:{en:`For the night-market lucky draw, Mrs. Somsri has six number tiles: 0, 2, 4, 7, 8, and 9. She wants to arrange five of them, using each tile at most once, to form the largest possible 5-digit ticket number that is odd. What is the ticket number?`,th:`สำหรับการจับฉลากที่ตลาดนัดกลางคืน คุณครูสมศรีมีป้ายตัวเลข 6 แผ่น ได้แก่ 0, 2, 4, 7, 8 และ 9 เธอต้องการนำ 5 แผ่นมาเรียงกัน โดยใช้แผ่นละไม่เกิน 1 ครั้ง เพื่อให้ได้เลขสลาก 5 หลักที่มากที่สุดและเป็นเลขคี่ เลขสลากนั้นคือข้อใด`},options:[{id:`A`,label:{en:`98,427`,th:`98,427`}},{id:`B`,label:{en:`87,429`,th:`87,429`}},{id:`C`,label:{en:`98,742`,th:`98,742`}},{id:`D`,label:{en:`89,427`,th:`89,427`}}],correctOptionId:`A`,explanation:{en:`The number must end in an odd digit (7 or 9). To make the front of the number as large as possible, sacrifice the smaller odd digit (7) at the end, keeping 9 free for the leading place. The remaining four digits, placed in descending order, are 9, 8, 4, 2 — giving 98,427.`,th:`เลขนี้ต้องลงท้ายด้วยเลขคี่ (7 หรือ 9) เพื่อให้ตัวเลขด้านหน้ามีค่ามากที่สุด ควรเสียเลขคี่ตัวเล็กกว่า (7) ไว้ท้ายสุด เพื่อเก็บเลข 9 ไว้เป็นหลักหน้าสุด เมื่อนำเลขที่เหลือ 9, 8, 4, 2 มาเรียงจากมากไปน้อย จะได้ 98,427`},distractorNotes:{B:{en:`This uses 9 as the last digit and 7 in front, wasting the largest digit at the end instead of keeping it in the leading (ten-thousands) place.`,th:`ตัวเลือกนี้นำเลข 9 ไปไว้ท้ายสุดและใช้ 7 นำหน้า ทำให้เสียเลขที่มากที่สุดไปอยู่ตำแหน่งท้าย แทนที่จะเก็บไว้เป็นหลักหมื่น`},C:{en:`This is the largest arrangement of the top five digits (9, 8, 7, 4, 2) but ignores the requirement that the ticket number must be odd — it ends in the even digit 2.`,th:`ตัวเลือกนี้คือการเรียงเลข 5 ตัวที่มากที่สุด (9, 8, 7, 4, 2) แต่ลืมเงื่อนไขว่าต้องเป็นเลขคี่ เพราะลงท้ายด้วยเลข 2 ซึ่งเป็นเลขคู่`},D:{en:`This swaps the first two digits by mistake, giving a smaller ten-thousands-place value than the correct arrangement.`,th:`ตัวเลือกนี้สลับตัวเลขสองหลักแรกโดยไม่ตั้งใจ ทำให้ค่าประจำหลักหมื่นน้อยกว่าคำตอบที่ถูกต้อง`}},hints:[{en:`The final digit must be odd — list which of the six tiles are odd first.`,th:`หลักสุดท้ายต้องเป็นเลขคี่ ให้หาก่อนว่าในแผ่นทั้ง 6 แผ่นมีเลขคี่ตัวใดบ้าง`},{en:`To maximize the whole number, keep the largest digits toward the front. Ask which odd digit is "cheaper" to give up at the end.`,th:`เพื่อให้ค่าตัวเลขมากที่สุด ควรเก็บเลขที่มากไว้ด้านหน้า ลองคิดว่าเลขคี่ตัวไหนเสียไปไว้ท้ายสุดแล้ว "คุ้ม" กว่ากัน`},{en:`Place the smaller odd digit (7) last, then arrange the remaining four digits 9, 8, 4, 2 in descending order in front of it.`,th:`ให้นำเลขคี่ตัวเล็กกว่า (7) ไปไว้ท้ายสุด แล้วเรียงเลขที่เหลืออีก 4 ตัว คือ 9, 8, 4, 2 จากมากไปน้อยไว้ด้านหน้า`}],visual:null,estimatedSeconds:55},{id:`B-02`,testId:`samsen-mock-b`,number:2,skill:`Word Problems & Logic`,topic:{en:`Two-Scenario Pricing`,th:`โจทย์ราคาสองสถานการณ์`},difficulty:`Easy`,prompt:{en:`At a weekend market stall, if rambutans cost 6 baht each, Ploy can buy a certain number of them and have 15 baht left over. If rambutans instead cost 9 baht each, she can buy 5 fewer rambutans and have exactly 3 baht left over. How much money does Ploy have?`,th:`ที่แผงผลไม้ในตลาดนัดวันหยุด ถ้าเงาะราคาลูกละ 6 บาท พลอยจะซื้อเงาะได้จำนวนหนึ่งและมีเงินเหลือ 15 บาท แต่ถ้าเงาะราคาลูกละ 9 บาท พลอยจะซื้อได้น้อยกว่าเดิม 5 ลูก และมีเงินเหลือพอดี 3 บาท พลอยมีเงินทั้งหมดกี่บาท`},options:[{id:`A`,label:{en:`117 baht`,th:`117 บาท`}},{id:`B`,label:{en:`129 baht`,th:`129 บาท`}},{id:`C`,label:{en:`114 baht`,th:`114 บาท`}},{id:`D`,label:{en:`69 baht`,th:`69 บาท`}}],correctOptionId:`B`,explanation:{en:`Let n be the number of rambutans at 6 baht. Then money = 6n + 15 = 9(n − 5) + 3. Solving: 6n + 15 = 9n − 42, so 3n = 57 and n = 19. Money = 6(19) + 15 = 129 baht (check: 9 × 14 + 3 = 129 too).`,th:`ให้ n เป็นจำนวนเงาะที่ราคาลูกละ 6 บาท จะได้เงิน = 6n + 15 = 9(n − 5) + 3 แก้สมการ: 6n + 15 = 9n − 42 ดังนั้น 3n = 57 และ n = 19 เงินทั้งหมด = 6(19) + 15 = 129 บาท (ตรวจสอบ: 9 × 14 + 3 = 129 บาทเช่นกัน)`},distractorNotes:{A:{en:`This comes from dividing 57 by 3 incorrectly to get n = 17 instead of n = 19, then computing 6 × 17 + 15.`,th:`ตัวเลือกนี้เกิดจากการหาร 57 ด้วย 3 ผิดพลาด ได้ n = 17 แทนที่จะเป็น 19 แล้วคำนวณ 6 × 17 + 15`},C:{en:`This is 6 × 19, the cost of the rambutans alone — it leaves out the 15 baht Ploy still had left over.`,th:`ตัวเลือกนี้คือ 6 × 19 ซึ่งเป็นค่าเงาะเพียงอย่างเดียว โดยลืมบวกเงิน 15 บาทที่เหลืออยู่`},D:{en:`This comes from swapping the two leftover amounts between the scenarios (3 baht left at the 6-baht price and 15 baht left at the 9-baht price), which flips the equation and gives the wrong quantity.`,th:`ตัวเลือกนี้เกิดจากการสลับเงินที่เหลือของสองสถานการณ์ (ใช้เงินเหลือ 3 บาทกับราคา 6 บาท และ 15 บาทกับราคา 9 บาท) ทำให้สมการผิดและได้จำนวนที่ไม่ถูกต้อง`}},hints:[{en:`Let the number of rambutans at the 6-baht price be a variable, n.`,th:`ให้จำนวนเงาะที่ราคาลูกละ 6 บาท เป็นตัวแปร n`},{en:`Write Ploy's total money two ways — once using the 6-baht price and n, once using the 9-baht price and (n − 5) — and set them equal.`,th:`เขียนจำนวนเงินทั้งหมดของพลอยสองแบบ แบบแรกใช้ราคา 6 บาทกับ n แบบที่สองใช้ราคา 9 บาทกับ (n − 5) แล้วให้เท่ากัน`},{en:`Solve 6n + 15 = 9(n − 5) + 3 for n, then substitute back into either expression to find the total money.`,th:`แก้สมการ 6n + 15 = 9(n − 5) + 3 หาค่า n แล้วแทนกลับในสมการใดสมการหนึ่งเพื่อหาเงินทั้งหมด`}],visual:null,estimatedSeconds:65},{id:`B-03`,testId:`samsen-mock-b`,number:3,skill:`Fractions & Decimals`,topic:{en:`Ordering Fractions`,th:`การเรียงลำดับเศษส่วน`},difficulty:`Easy`,prompt:{en:`Seven fruit stalls sold these fractions of their stock by noon: \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{9}{10}, and \\frac{4}{9}. If the fractions are arranged from greatest to least, which one is 4th in the list?`,th:`แผงผลไม้ 7 แผงขายผลไม้ได้เป็นเศษส่วนของสต๊อกทั้งหมด ณ เที่ยงวัน ดังนี้ \\frac{3}{4}, \\frac{5}{8}, \\frac{7}{12}, \\frac{2}{3}, \\frac{5}{6}, \\frac{9}{10} และ \\frac{4}{9} ถ้าเรียงเศษส่วนเหล่านี้จากมากไปน้อย เศษส่วนใดอยู่ในลำดับที่ 4`},options:[{id:`A`,label:{en:`\\frac{3}{4}`,th:`\\frac{3}{4}`}},{id:`B`,label:{en:`\\frac{7}{12}`,th:`\\frac{7}{12}`}},{id:`C`,label:{en:`\\frac{2}{3}`,th:`\\frac{2}{3}`}},{id:`D`,label:{en:`\\frac{5}{8}`,th:`\\frac{5}{8}`}}],correctOptionId:`C`,explanation:{en:`Converting each to a decimal: \\frac{9}{10}=0.90, \\frac{5}{6}≈0.833, \\frac{3}{4}=0.75, \\frac{2}{3}≈0.667, \\frac{5}{8}=0.625, \\frac{7}{12}≈0.583, \\frac{4}{9}≈0.444. Sorted from greatest to least: \\frac{9}{10}, \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{4}{9}. The 4th fraction is \\frac{2}{3}.`,th:`แปลงแต่ละเศษส่วนเป็นทศนิยม: \\frac{9}{10}=0.90, \\frac{5}{6}≈0.833, \\frac{3}{4}=0.75, \\frac{2}{3}≈0.667, \\frac{5}{8}=0.625, \\frac{7}{12}≈0.583, \\frac{4}{9}≈0.444 เรียงจากมากไปน้อยได้: \\frac{9}{10}, \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{4}{9} ลำดับที่ 4 คือ \\frac{2}{3}`},distractorNotes:{A:{en:`\\frac{3}{4} is actually 3rd in the list — this comes from stopping the count one place too early.`,th:`\\frac{3}{4} อยู่ในลำดับที่ 3 จริง ๆ ตัวเลือกนี้เกิดจากการนับตำแหน่งช้าไปหนึ่งตำแหน่ง`},B:{en:`\\frac{7}{12} is actually 6th in the list — it is easy to confuse with \\frac{2}{3} since \\frac{2}{3} = \\frac{8}{12}, and the two look similar once given the common denominator 12.`,th:`\\frac{7}{12} อยู่ในลำดับที่ 6 จริง ๆ มักสับสนกับ \\frac{2}{3} เพราะ \\frac{2}{3} = \\frac{8}{12} ซึ่งดูใกล้เคียงกันเมื่อแปลงตัวส่วนเป็น 12 เหมือนกัน`},D:{en:`\\frac{5}{8} is actually 5th in the list — its decimal value (0.625) is close to \\frac{2}{3} (0.667), which can cause the two to be swapped in the ranking.`,th:`\\frac{5}{8} อยู่ในลำดับที่ 5 จริง ๆ ค่าทศนิยมของมัน (0.625) ใกล้เคียงกับ \\frac{2}{3} (0.667) จึงมักถูกสลับตำแหน่งกัน`}},hints:[{en:`Turn each fraction into a decimal so they are easy to compare directly.`,th:`แปลงเศษส่วนแต่ละตัวเป็นทศนิยมเพื่อให้เปรียบเทียบกันได้ง่าย`},{en:`List all seven decimal values, then sort them from largest to smallest before counting positions.`,th:`เขียนค่าทศนิยมทั้ง 7 ค่า แล้วเรียงจากมากไปน้อยก่อนนับตำแหน่ง`},{en:`After sorting you should get \\frac{9}{10}, \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{4}{9} — count carefully to the 4th one.`,th:`เมื่อเรียงแล้วจะได้ \\frac{9}{10}, \\frac{5}{6}, \\frac{3}{4}, \\frac{2}{3}, \\frac{5}{8}, \\frac{7}{12}, \\frac{4}{9} นับให้ถูกต้องไปจนถึงลำดับที่ 4`}],visual:null,estimatedSeconds:60},{id:`B-04`,testId:`samsen-mock-b`,number:4,skill:`Number & Operations`,topic:{en:`Mixed Operations`,th:`การดำเนินการผสม`},difficulty:`Easy`,prompt:{en:`A market clerk is checking two calculations on her receipt pad: A = (\\frac{2}{3} + \\frac{1}{6}) × 12 − 4 and B = (9 − 3) × 2 ÷ 4 + 1. Work out 2 × (A ÷ B).`,th:`เสมียนที่ตลาดกำลังตรวจการคำนวณสองแบบในสมุดใบเสร็จ: A = (\\frac{2}{3} + \\frac{1}{6}) × 12 − 4 และ B = (9 − 3) × 2 ÷ 4 + 1 จงหาค่าของ 2 × (A ÷ B)`},options:[{id:`A`,label:{en:`\\frac{3}{2}`,th:`\\frac{3}{2}`}},{id:`B`,label:{en:`48`,th:`48`}},{id:`C`,label:{en:`\\frac{4}{3}`,th:`\\frac{4}{3}`}},{id:`D`,label:{en:`3`,th:`3`}}],correctOptionId:`D`,explanation:{en:`A: \\frac{2}{3} + \\frac{1}{6} = \\frac{5}{6}, then \\frac{5}{6} × 12 = 10, then 10 − 4 = 6, so A = 6. B: 9 − 3 = 6, then 6 × 2 = 12, then 12 ÷ 4 = 3, then 3 + 1 = 4, so B = 4. Finally, 2 × (A ÷ B) = 2 × (6 ÷ 4) = 2 × 1.5 = 3.`,th:`A: \\frac{2}{3} + \\frac{1}{6} = \\frac{5}{6} จากนั้น \\frac{5}{6} × 12 = 10 แล้ว 10 − 4 = 6 ดังนั้น A = 6 ส่วน B: 9 − 3 = 6 จากนั้น 6 × 2 = 12 แล้ว 12 ÷ 4 = 3 แล้ว 3 + 1 = 4 ดังนั้น B = 4 สุดท้าย 2 × (A ÷ B) = 2 × (6 ÷ 4) = 2 × 1.5 = 3`},distractorNotes:{A:{en:`This stops after finding A ÷ B = \\frac{6}{4} = \\frac{3}{2} and forgets to multiply the result by 2.`,th:`ตัวเลือกนี้หยุดหลังจากได้ A ÷ B = \\frac{6}{4} = \\frac{3}{2} แล้วลืมคูณผลลัพธ์ด้วย 2`},B:{en:`This mixes up ÷ with ×, computing 2 × (A × B) = 2 × (6 × 4) = 48 instead of 2 × (A ÷ B).`,th:`ตัวเลือกนี้สับสนเครื่องหมาย ÷ กับ × โดยคำนวณ 2 × (A × B) = 2 × (6 × 4) = 48 แทนที่จะเป็น 2 × (A ÷ B)`},C:{en:`This flips the division and works out B ÷ A instead of A ÷ B, giving 2 × (\\frac{4}{6}) = \\frac{4}{3}.`,th:`ตัวเลือกนี้กลับด้านการหาร โดยคำนวณ B ÷ A แทนที่จะเป็น A ÷ B ทำให้ได้ 2 × (\\frac{4}{6}) = \\frac{4}{3}`}},hints:[{en:`Work out A and B separately first, following the brackets in each expression.`,th:`หาค่า A และ B แยกกันก่อน โดยคำนวณตามวงเล็บในแต่ละสมการ`},{en:`For A, add the fraction inside the brackets first; for B, subtract inside the brackets first, then follow the order of operations left to right.`,th:`สำหรับ A ให้บวกเศษส่วนในวงเล็บก่อน ส่วน B ให้ลบในวงเล็บก่อน แล้วคำนวณจากซ้ายไปขวาตามลำดับ`},{en:`Once you have A = 6 and B = 4, compute A ÷ B first, then multiply that result by 2.`,th:`เมื่อได้ A = 6 และ B = 4 แล้ว ให้หา A ÷ B ก่อน แล้วจึงนำผลลัพธ์ไปคูณด้วย 2`}],visual:null,estimatedSeconds:60},{id:`B-05`,testId:`samsen-mock-b`,number:5,skill:`Number & Operations`,topic:{en:`LCM & GCF`,th:`ค.ร.น. และ ห.ร.ม.`},difficulty:`Easy`,prompt:{en:`At the market, the number of mangoes in the big basket divided by the number in the small basket gives a quotient of 3 and a remainder of 4. The two baskets together hold 44 mangoes. Find the LCM of the two basket counts.`,th:`ที่ตลาด จำนวนมะม่วงในตะกร้าใบใหญ่หารด้วยจำนวนมะม่วงในตะกร้าใบเล็ก ได้ผลหาร 3 เศษ 4 และตะกร้าทั้งสองใบรวมกันมีมะม่วงทั้งหมด 44 ลูก จงหา ค.ร.น. ของจำนวนมะม่วงในตะกร้าทั้งสองใบ`},options:[{id:`A`,label:{en:`170`,th:`170`}},{id:`B`,label:{en:`340`,th:`340`}},{id:`C`,label:{en:`2`,th:`2`}},{id:`D`,label:{en:`85`,th:`85`}}],correctOptionId:`A`,explanation:{en:`Let the small basket hold s mangoes; the big basket holds 3s + 4. Their sum is 4s + 4 = 44, so s = 10 and the big basket holds 34. GCF(10, 34) = 2, so LCM = (10 × 34) ÷ 2 = 170.`,th:`ให้ตะกร้าใบเล็กมีมะม่วง s ลูก ตะกร้าใบใหญ่จะมี 3s + 4 ลูก รวมกันได้ 4s + 4 = 44 ดังนั้น s = 10 และตะกร้าใบใหญ่มี 34 ลูก ห.ร.ม. ของ 10 และ 34 คือ 2 ดังนั้น ค.ร.น. = (10 × 34) ÷ 2 = 170`},distractorNotes:{B:{en:`This is simply 10 × 34, the product of the two numbers — it forgets that the LCM must be divided by their greatest common factor (2).`,th:`ตัวเลือกนี้คือผลคูณ 10 × 34 เฉยๆ โดยลืมว่า ค.ร.น. ต้องหารด้วย ห.ร.ม. (ซึ่งเท่ากับ 2) ก่อน`},C:{en:`This is the greatest common factor (GCF) of 10 and 34, not the least common multiple.`,th:`ตัวเลือกนี้คือ ห.ร.ม. ของ 10 และ 34 ไม่ใช่ ค.ร.น.`},D:{en:`This comes from dividing the product 340 by 4 instead of the correct GCF of 2.`,th:`ตัวเลือกนี้เกิดจากการนำผลคูณ 340 ไปหารด้วย 4 แทนที่จะหารด้วย ห.ร.ม. ที่ถูกต้องคือ 2`}},hints:[{en:`Let the small basket count be a variable s, and write the big basket count in terms of s using the quotient-and-remainder rule.`,th:`ให้จำนวนมะม่วงในตะกร้าเล็กเป็นตัวแปร s แล้วเขียนจำนวนในตะกร้าใหญ่ในรูปของ s โดยใช้กฎผลหารและเศษ`},{en:`Big basket = 3 × s + 4. Use the total 44 to form and solve an equation for s.`,th:`ตะกร้าใหญ่ = 3 × s + 4 ใช้ผลรวม 44 ตั้งสมการและแก้หา s`},{en:`Once you know both basket counts (10 and 34), find their GCF first, then LCM = product ÷ GCF.`,th:`เมื่อทราบจำนวนมะม่วงทั้งสองตะกร้า (10 และ 34) แล้ว ให้หา ห.ร.ม. ก่อน แล้วจึงหา ค.ร.น. = ผลคูณ ÷ ห.ร.ม.`}],visual:null,estimatedSeconds:65},{id:`B-06`,testId:`samsen-mock-b`,number:6,skill:`Algebra & Patterns`,topic:{en:`Number Patterns`,th:`แบบรูปตัวเลข`},difficulty:`Medium`,prompt:{en:`Nid is arranging cushions in a triangular display at her stall. Figure 1 has 1 cushion, Figure 2 has 3, Figure 3 has 6, Figure 4 has 10 (shown in the diagram), and Figure 5 has 15. If the pattern continues, how many cushions are in Figure 12?`,th:`นิดกำลังจัดเรียงหมอนอิงเป็นรูปสามเหลี่ยมที่แผงขายของ รูปที่ 1 มีหมอน 1 ใบ รูปที่ 2 มี 3 ใบ รูปที่ 3 มี 6 ใบ รูปที่ 4 มี 10 ใบ (ดังภาพ) และรูปที่ 5 มี 15 ใบ ถ้าแบบรูปนี้เป็นเช่นนี้ต่อไป รูปที่ 12 จะมีหมอนกี่ใบ`},options:[{id:`A`,label:{en:`144`,th:`144`}},{id:`B`,label:{en:`78`,th:`78`}},{id:`C`,label:{en:`66`,th:`66`}},{id:`D`,label:{en:`91`,th:`91`}}],correctOptionId:`B`,explanation:{en:`Each figure number n has n(n + 1) ÷ 2 cushions (1, 3, 6, 10, 15, ... — the triangular numbers, adding one more row each time). For Figure 12: 12 × 13 ÷ 2 = 78.`,th:`แต่ละรูปที่ n จะมีหมอน n(n + 1) ÷ 2 ใบ (1, 3, 6, 10, 15, ... คือจำนวนสามเหลี่ยม ที่เพิ่มขึ้นทีละแถว) สำหรับรูปที่ 12: 12 × 13 ÷ 2 = 78`},distractorNotes:{A:{en:`This treats the pattern as growing by n² (a perfect square arrangement) rather than the actual triangular growth n(n + 1) ÷ 2, giving 12 × 12 = 144.`,th:`ตัวเลือกนี้คิดว่ารูปแบบเติบโตแบบ n² (จัดเป็นรูปสี่เหลี่ยมจัตุรัส) แทนที่จะเป็นแบบจำนวนสามเหลี่ยม n(n + 1) ÷ 2 จึงได้ 12 × 12 = 144`},C:{en:`This is the count for Figure 11 (11 × 12 ÷ 2 = 66), one figure too early.`,th:`ตัวเลือกนี้คือจำนวนของรูปที่ 11 (11 × 12 ÷ 2 = 66) ซึ่งช้าไปหนึ่งรูป`},D:{en:`This is the count for Figure 13 (13 × 14 ÷ 2 = 91), one figure too late.`,th:`ตัวเลือกนี้คือจำนวนของรูปที่ 13 (13 × 14 ÷ 2 = 91) ซึ่งเลยไปหนึ่งรูป`}},hints:[{en:`Look at how many more cushions are added each time you move to the next figure.`,th:`ลองสังเกตว่าจำนวนหมอนที่เพิ่มขึ้นในแต่ละรูปเป็นเท่าใด`},{en:`These are triangular numbers: Figure n has 1 + 2 + 3 + ... + n cushions.`,th:`นี่คือจำนวนสามเหลี่ยม รูปที่ n จะมีหมอนเท่ากับ 1 + 2 + 3 + ... + n`},{en:`Use the shortcut formula n(n + 1) ÷ 2 with n = 12.`,th:`ใช้สูตรลัด n(n + 1) ÷ 2 โดยแทน n = 12`}],visual:{kind:`gridPattern`,gridSize:4,cells:[{row:0,col:0},{row:1,col:0},{row:1,col:1},{row:2,col:0},{row:2,col:1},{row:2,col:2},{row:3,col:0},{row:3,col:1},{row:3,col:2},{row:3,col:3}],alt:{en:`Figure 4 of the cushion pattern: a staircase of shaded squares with 1, 2, 3, then 4 squares per row, totaling 10 squares.`,th:`รูปที่ 4 ของแบบรูปหมอนอิง: ช่องสี่เหลี่ยมสีเรียงเป็นขั้นบันได แถวละ 1, 2, 3 แล้ว 4 ช่อง รวม 10 ช่อง`}},estimatedSeconds:70},{id:`B-07`,testId:`samsen-mock-b`,number:7,skill:`Word Problems & Logic`,topic:{en:`Speed, Distance & Time`,th:`อัตราเร็ว ระยะทาง เวลา`},difficulty:`Medium`,prompt:{en:`During Sports Day, Ben and Somchai start cycling from the same point on a circular track at the same time, in opposite directions. Ben cycles at 250 m/min and Somchai at 200 m/min. They meet again after 4 minutes. What is the length of the track?`,th:`ในวันกีฬาสี เบนและสมชายเริ่มปั่นจักรยานจากจุดเดียวกันบนลู่วิ่งวงกลมในเวลาเดียวกัน แต่ปั่นไปคนละทิศทาง เบนปั่นด้วยอัตราเร็ว 250 เมตร/นาที และสมชายปั่นด้วยอัตราเร็ว 200 เมตร/นาที พวกเขาปั่นมาพบกันอีกครั้งหลังจากผ่านไป 4 นาที ลู่วิ่งวงกลมนี้มีความยาวเท่าใด`},options:[{id:`A`,label:{en:`200 m`,th:`200 เมตร`}},{id:`B`,label:{en:`3,600 m`,th:`3,600 เมตร`}},{id:`C`,label:{en:`1,800 m`,th:`1,800 เมตร`}},{id:`D`,label:{en:`1,000 m`,th:`1,000 เมตร`}}],correctOptionId:`C`,explanation:{en:`Since they cycle in opposite directions from the same point, together they cover the whole track by the time they meet. Combined speed = 250 + 200 = 450 m/min. Track length = 450 × 4 = 1,800 m.`,th:`เนื่องจากทั้งสองปั่นไปคนละทิศทางจากจุดเดียวกัน เมื่อมาพบกันแสดงว่าทั้งคู่ปั่นรวมกันครบรอบลู่วิ่งพอดี อัตราเร็วรวม = 250 + 200 = 450 เมตร/นาที ความยาวลู่วิ่ง = 450 × 4 = 1,800 เมตร`},distractorNotes:{A:{en:`This uses the difference of the two speeds (250 − 200) × 4 = 200, which is the method for one cyclist catching up to another moving the same direction, not for two moving toward each other from opposite directions.`,th:`ตัวเลือกนี้ใช้ผลต่างของอัตราเร็ว (250 − 200) × 4 = 200 ซึ่งเป็นวิธีคิดสำหรับกรณีไล่ตามในทิศทางเดียวกัน ไม่ใช่กรณีปั่นสวนทางกันมาพบกัน`},B:{en:`This correctly finds 1,800 m but then doubles it, mistakenly counting a full round trip instead of the single lap where they first meet.`,th:`ตัวเลือกนี้หา 1,800 เมตรได้ถูกต้อง แต่นำไปคูณสองอีกครั้งโดยเข้าใจผิดว่าต้องนับสองรอบ ทั้งที่โจทย์ถามแค่รอบแรกที่มาพบกัน`},D:{en:`This is 250 × 4, using only Ben's distance and forgetting to include Somchai's contribution to the total track length.`,th:`ตัวเลือกนี้คือ 250 × 4 ซึ่งใช้ระยะทางของเบนเพียงคนเดียว โดยลืมรวมระยะทางของสมชายด้วย`}},hints:[{en:`Think about how much of the track each cyclist has covered by the time they meet.`,th:`ลองคิดว่าแต่ละคนปั่นไปได้ระยะทางเท่าใดก่อนจะมาพบกัน`},{en:`Since they move in opposite directions from the same starting point, the two distances they cover together add up to exactly one full lap.`,th:`เพราะทั้งสองปั่นสวนทางกันจากจุดเริ่มต้นเดียวกัน ระยะทางที่ทั้งคู่ปั่นรวมกันจะเท่ากับความยาวลู่วิ่งพอดี 1 รอบ`},{en:`Add the two speeds to get a combined speed, then multiply by the time (4 minutes) to get the track length.`,th:`บวกอัตราเร็วทั้งสองเข้าด้วยกันเพื่อหาอัตราเร็วรวม แล้วคูณด้วยเวลา (4 นาที) เพื่อหาความยาวลู่วิ่ง`}],visual:null,estimatedSeconds:85},{id:`B-08`,testId:`samsen-mock-b`,number:8,skill:`Ratio, Percentage & Average`,topic:{en:`Sharing in a Ratio`,th:`การแบ่งตามอัตราส่วน`},difficulty:`Medium`,prompt:{en:`Three friends pooled money for a Sports Day snack budget in the ratio 3 : 4 : 5. The friend with the smallest share contributed 90 baht. They spend all the pooled money buying grilled sausage sticks at 7 baht each. How many sticks can they buy in total, and how much money is left over?`,th:`เพื่อนสามคนรวบรวมเงินเป็นงบซื้อของกินในวันกีฬาสี ตามอัตราส่วน 3 : 4 : 5 คนที่ได้ส่วนน้อยที่สุดออกเงิน 90 บาท พวกเขานำเงินทั้งหมดไปซื้อไส้กรอกปิ้งไม้ละ 7 บาท จะซื้อได้ทั้งหมดกี่ไม้ และเหลือเงินกี่บาท`},options:[{id:`A`,label:{en:`45 sticks, 0 baht left over`,th:`45 ไม้ เหลือเงิน 0 บาท`}},{id:`B`,label:{en:`38 sticks, 4 baht left over`,th:`38 ไม้ เหลือเงิน 4 บาท`}},{id:`C`,label:{en:`40 sticks, 0 baht left over`,th:`40 ไม้ เหลือเงิน 0 บาท`}},{id:`D`,label:{en:`51 sticks, 3 baht left over`,th:`51 ไม้ เหลือเงิน 3 บาท`}}],correctOptionId:`D`,explanation:{en:`The smallest share (3 parts) = 90 baht, so 1 part = 30 baht. Total = (3+4+5) × 30 = 360 baht. Dividing by 7 baht per stick: 360 ÷ 7 = 51 remainder 3, so they buy 51 sticks and have 3 baht left over.`,th:`ส่วนน้อยที่สุด (3 ส่วน) = 90 บาท ดังนั้น 1 ส่วน = 30 บาท เงินรวม = (3+4+5) × 30 = 360 บาท เมื่อหารด้วยราคาไม้ละ 7 บาท: 360 ÷ 7 = 51 เศษ 3 จึงซื้อได้ 51 ไม้ และเหลือเงิน 3 บาท`},distractorNotes:{A:{en:`This finds the correct total (360 baht) but divides by 8 baht per stick instead of the actual price of 7 baht.`,th:`ตัวเลือกนี้หาเงินรวมได้ถูกต้อง (360 บาท) แต่นำไปหารด้วยราคาไม้ละ 8 บาท แทนที่จะเป็นราคาจริงคือ 7 บาท`},B:{en:`This mistakenly treats the total pooled money as 90 × 3 = 270 baht (multiplying the smallest share by its own number of parts again) instead of first finding that 1 part = 30 baht and then multiplying by all 12 parts to get 360 baht.`,th:`ตัวเลือกนี้เข้าใจผิดว่าเงินรวมคือ 90 × 3 = 270 บาท (นำส่วนน้อยที่สุดไปคูณด้วยจำนวนส่วนของตัวเองซ้ำ) แทนที่จะหาว่า 1 ส่วน = 30 บาทก่อน แล้วคูณด้วย 12 ส่วนเพื่อให้ได้ 360 บาท`},C:{en:`This finds the correct total (360 baht) but divides by 9 baht per stick instead of the actual price of 7 baht.`,th:`ตัวเลือกนี้หาเงินรวมได้ถูกต้อง (360 บาท) แต่นำไปหารด้วยราคาไม้ละ 9 บาท แทนที่จะเป็นราคาจริงคือ 7 บาท`}},hints:[{en:`First find the value of "1 part" of the ratio using the smallest share.`,th:`หาค่าของ "1 ส่วน" ในอัตราส่วนก่อน โดยใช้ส่วนที่น้อยที่สุด`},{en:`Add up all the parts of the ratio (3+4+5=12) and multiply by the value of 1 part to get the total money.`,th:`บวกจำนวนส่วนทั้งหมดในอัตราส่วน (3+4+5=12) แล้วคูณด้วยค่า 1 ส่วน เพื่อหาเงินรวม`},{en:`Divide the total money by 7 baht — the whole-number part of the answer is how many sticks, and the remainder is the money left over.`,th:`นำเงินรวมไปหารด้วย 7 บาท ผลหารที่เป็นจำนวนเต็มคือจำนวนไม้ที่ซื้อได้ และเศษที่เหลือคือเงินที่เหลือ`}],visual:null,estimatedSeconds:95},{id:`B-09`,testId:`samsen-mock-b`,number:9,skill:`Geometry & Angles`,topic:{en:`Parallel Lines & Triangle Angles`,th:`เส้นขนานและมุมในสามเหลี่ยม`},difficulty:`Medium`,prompt:{en:`In the figure, line PQ passes through vertex A of triangle ABC and is parallel to BC (shown by the tick marks). Angle PAB = 52° and angle QAC = 61°. Find the size of angle BAC.`,th:`จากรูป เส้น PQ ลากผ่านจุดยอด A ของสามเหลี่ยม ABC และขนานกับ BC (แสดงด้วยเครื่องหมายขีด) มุม PAB = 52° และมุม QAC = 61° จงหาขนาดของมุม BAC`},options:[{id:`A`,label:{en:`67°`,th:`67°`}},{id:`B`,label:{en:`52°`,th:`52°`}},{id:`C`,label:{en:`61°`,th:`61°`}},{id:`D`,label:{en:`113°`,th:`113°`}}],correctOptionId:`A`,explanation:{en:`Since PQ ∥ BC, alternate angles give angle PAB = angle ABC = 52° and angle QAC = angle ACB = 61°. Because P, A, and Q lie on a straight line, angle PAB + angle BAC + angle QAC = 180°, so angle BAC = 180° − 52° − 61° = 67°.`,th:`เนื่องจาก PQ ขนานกับ BC มุมแย้งจึงให้มุม PAB = มุม ABC = 52° และมุม QAC = มุม ACB = 61° เพราะจุด P, A, Q อยู่บนเส้นตรงเดียวกัน มุม PAB + มุม BAC + มุม QAC = 180° ดังนั้นมุม BAC = 180° − 52° − 61° = 67°`},distractorNotes:{B:{en:`This just repeats the given angle PAB instead of finding angle BAC.`,th:`ตัวเลือกนี้เพียงคัดลอกมุม PAB ที่โจทย์กำหนดให้ ไม่ได้หาค่ามุม BAC จริง ๆ`},C:{en:`This just repeats the given angle QAC instead of finding angle BAC.`,th:`ตัวเลือกนี้เพียงคัดลอกมุม QAC ที่โจทย์กำหนดให้ ไม่ได้หาค่ามุม BAC จริง ๆ`},D:{en:`This adds the two given angles (52° + 61° = 113°) but forgets that P, A, and Q lie on a straight line, so all three angles together — not just two — must total 180°.`,th:`ตัวเลือกนี้บวกมุมที่กำหนดให้ทั้งสอง (52° + 61° = 113°) แต่ลืมว่า P, A, Q อยู่บนเส้นตรงเดียวกัน มุมทั้งสามมุมรวมกันต้องเท่ากับ 180° ไม่ใช่แค่สองมุม`}},hints:[{en:`PQ is parallel to BC — think about which pairs of angles become equal because of this.`,th:`PQ ขนานกับ BC ลองคิดว่ามุมคู่ใดบ้างที่มีขนาดเท่ากันเพราะเหตุนี้`},{en:`By alternate angles, angle PAB equals one base angle of the triangle, and angle QAC equals the other base angle.`,th:`ด้วยมุมแย้ง มุม PAB จะเท่ากับมุมที่ฐานมุมหนึ่งของสามเหลี่ยม และมุม QAC จะเท่ากับมุมที่ฐานอีกมุมหนึ่ง`},{en:`P, A, and Q lie on a straight line, so a

id":"pr1-11","type":"mcq","lesson":1,"skill":"units","diff":2,"stem":{"en":"Write 8 °C : 30 °C in its simplest form.","th":"จงเขียน 8 องศาเซลเซียส : 30 องศาเซลเซียส ในรูปอย่างต่ำ"},"hint":{"en":"Both amounts use the same unit, so the unit cancels out.","th":"ทั้งสองปริมาณใช้หน่วยเดียวกัน หน่วยจึงตัดกันหมด"},"explain":[{"en":"The units match (°C and °C), so compare the numbers only.","th":"หน่วยตรงกัน (องศาเซลเซียส) จึงเทียบเฉพาะตัวเลข"},{"en":"8 ÷ 2 = 4, 30 ÷ 2 = 15.","th":"8 ÷ 2 = 4, 30 ÷ 2 = 15"},{"en":"A ratio has no units, so the answer is 4 : 15.","th":"อัตราส่วนไม่มีหน่วย คำตอบคือ 4 : 15"}],"check":{"en":"Never write units inside a ratio.","th":"ไม่ต้องเขียนหน่วยในอัตราส่วน"},"verify":{"kind":"simplify","a":8,"b":30,"correct":"4 : 15"},"options":[{"en":"4 : 15","th":"4 : 15"},{"en":"8 °C : 30 °C","th":"8 °C : 30 °C"},{"en":"15 : 4","th":"15 : 4"},{"en":"8 : 30","th":"8 : 30"}]},{"id":"pr1-12","type":"mcq","lesson":1,"skill":"units","diff":2,"stem":{"en":"Write 6 h : 15 h in its simplest form.","th":"จงเขียน 6 ชั่วโมง : 15 ชั่วโมง ในรูปอย่างต่ำ"},"hint":{"en":"Both amounts use the same unit, so the unit cancels out.","th":"ทั้งสองปริมาณใช้หน่วยเดียวกัน หน่วยจึงตัดกันหมด"},"explain":[{"en":"The units match (h and h), so compare the numbers only.","th":"หน่วยตรงกัน (ชั่วโมง) จึงเทียบเฉพาะตัวเลข"},{"en":"6 ÷ 3 = 2, 15 ÷ 3 = 5.","th":"6 ÷ 3 = 2, 15 ÷ 3 = 5"},{"en":"A ratio has no units, so the answer is 2 : 5.","th":"อัตราส่วนไม่มีหน่วย คำตอบคือ 2 : 5"}],"check":{"en":"Never write units inside a ratio.","th":"ไม่ต้องเขียนหน่วยในอัตราส่วน"},"verify":{"kind":"simplify","a":6,"b":15,"correct":"2 : 5"},"options":[{"en":"2 : 5","th":"2 : 5"},{"en":"6 h : 15 h","th":"6 h : 15 h"},{"en":"5 : 2","th":"5 : 2"},{"en":"6 : 15","th":"6 : 15"}]},{"id":"pr1-13","type":"mcq","lesson":1,"skill":"simplify3","diff":2,"stem":{"en":"Write the ratio 12 : 8 : 10 in its simplest form.","th":"จงเขียนอัตราส่วน 12 : 8 : 10 ในรูปอย่างต่ำ"},"hint":{"en":"Divide all three numbers by the same common factor.","th":"หารทั้งสามจำนวนด้วยตัวประกอบร่วมเดียวกัน"},"explain":[{"en":"The highest common factor of 12, 8 and 10 is 2.","th":"ห.ร.ม. ของ 12, 8 และ 10 คือ 2"},{"en":"Divide every part by 2: 12÷2=6, 8÷2=4, 10÷2=5.","th":"หารทุกส่วนด้วย 2: 12÷2=6, 8÷2=4, 10÷2=5"},{"en":"So the simplest form is 6 : 4 : 5.","th":"ดังนั้นรูปอย่างต่ำคือ 6 : 4 : 5"}],"check":{"en":"All three parts were divided by the same number, so the ratio is unchanged.","th":"ทั้งสามส่วนถูกหารด้วยจำนวนเดียวกัน อัตราส่วนจึงไม่เปลี่ยน"},"verify":{"kind":"simplify3","a":12,"b":8,"c":10,"correct":"6 : 4 : 5"},"options":[{"en":"6 : 4 : 5","th":"6 : 4 : 5"},{"en":"12 : 8 : 10","th":"12 : 8 : 10"},{"en":"5 : 4 : 6","th":"5 : 4 : 6"},{"en":"6 : 5 : 4","th":"6 : 5 : 4"}]},{"id":"pr1-14","type":"mcq","lesson":1,"skill":"simplify3","diff":3,"stem":{"en":"Write the ratio 21 : 14 : 35 in its simplest form.","th":"จงเขียนอัตราส่วน 21 : 14 : 35 ในรูปอย่างต่ำ"},"hint":{"en":"Divide all three numbers by the same common factor.","th":"หารทั้งสามจำนวนด้วยตัวประกอบร่วมเดียวกัน"},"explain":[{"en":"The highest common factor of 21, 14 and 35 is 7.","th":"ห.ร.ม. ของ 21, 14 และ 35 คือ 7"},{"en":"Divide every part by 7: 21÷7=3, 14÷7=2, 35÷7=5.","th":"หารทุกส่วนด้วย 7: 21÷7=3, 14÷7=2, 35÷7=5"},{"en":"So the simplest form is 3 : 2 : 5.","th":"ดังนั้นรูปอย่างต่ำคือ 3 : 2 : 5"}],"check":{"en":"All three parts were divided by the same number, so the ratio is unchanged.","th":"ทั้งสามส่วนถูกหารด้วยจำนวนเดียวกัน อัตราส่วนจึงไม่เปลี่ยน"},"verify":{"kind":"simplify3","a":21,"b":14,"c":35,"correct":"3 : 2 : 5"},"options":[{"en":"3 : 2 : 5","th":"3 : 2 : 5"},{"en":"21 : 14 : 35","th":"21 : 14 : 35"},{"en":"5 : 2 : 3","th":"5 : 2 : 3"},{"en":"3 : 5 : 2","th":"3 : 5 : 2"}]},{"id":"pr1-15","type":"mcq","lesson":1,"skill":"fraction-of-total","diff":2,"stem":{"en":"A box holds black beads and white beads in the ratio 2 : 3. What fraction of the box is white beads?","th":"กล่องหนึ่งมีลูกปัดดำและลูกปัดขาว ในอัตราส่วน 2 : 3 ลูกปัดขาวคิด },{"en":"Profit per kg = $1.60 − $1.20 = $0.40.","th":"กำไรต่อกิโลกรัม = $0.40"}],"check":{"en":"Check: $1.20 × 3000 = $3600 ✓","th":"ตรวจ: $1.20 × 3000 = $3600 ✓"},"verify":{"kind":"profit","kg":3000,"costPerKg":1.2,"profit":0.40000000000000013,"correct":"$0.40"},"options":[{"en":"$0.40","th":"$0.40"},{"en":"$1.20","th":"$1.20"},{"en":"$1.60","th":"$1.60"},{"en":"$0.80","th":"$0.80"}]},{"id":"pr3-20","type":"mcq","lesson":3,"skill":"ratio-and-proportion","diff":3,"stem":{"en":"A machine is built from plastic and metal in the ratio 4 : 5. The total mass of 5 machines is 360 kg. What is the mass of metal in 8 machines?","th":"เครื่องจักรทำจากพลาสติกและโลหะ ในอัตราส่วน 4 : 5 เครื่องจักร 5 เครื่อง มีมวลรวม 360 กิโลกรัม แล้วโลหะในเครื่องจักร 8 เครื่อง มีมวลเท่าใด"},"hint":{"en":"Two steps: proportion for total mass, then share in the ratio.","th":"สองขั้น: ใช้สัดส่วนหามวลรวม แล้วแบ่งตามอัตราส่วน"},"explain":[{"en":"1 machine = 360 ÷ 5 = 72 kg.","th":"1 เครื่อง = 72 กิโลกรัม"},{"en":"8 machines = 72 × 8 = 576 kg.","th":"8 เครื่อง = 576 กิโลกรัม"},{"en":"Share 576 kg in 4 : 5: one part = 64 kg, so metal = 5 × 64 = 320 kg.","th":"แบ่ง 576 กิโลกรัม ในอัตราส่วน 4 : 5: หนึ่งส่วน = 64 กิโลกรัม ดังนั้นโลหะ = 320 kg"}],"check":{"en":"Check: 256 + 320 = 576 kg ✓","th":"ตรวจ: 256 + 320 = 576 ✓"},"verify":{"kind":"combined","perItem":72,"massM":576,"one":64,"target":320,"correct":"320 kg"},"options":[{"en":"320 kg","th":"320 kg"},{"en":"256 kg","th":"256 kg"},{"en":"576 kg","th":"576 kg"},{"en":"72 kg","th":"72 kg"}]}]},"mistakes":[{"title":{"en":"Writing the ratio in the wrong order","th":"เขียนอัตราส่วนสลับลำดับ"},"wrong":{"en":"For 3 dark and 7 cream tiles, writing dark : cream = 7 : 3","th":"มีกระเบื้องเข้ม 3 ครีม 7 แต่เขียน เข้ม : ครีม = 7 : 3"},"right":{"en":"Read the labels in the question left to right: dark : cream = 3 : 7","th":"อ่านฉลากในโจทย์จากซ้ายไปขวา: เข้ม : ครีม = 3 : 7"}},{"title":{"en":"Stopping before the ratio is simplest","th":"หยุดก่อนที่อัตราส่วนจะอย่างต่ำ"} ัมต่อคน ดังนั้น 10 × 70 = 700 กรัม"}},{"title":{"en":"Assuming the biggest pack is cheapest","th":"คิดว่าแพ็กใหญ่สุดถูกสุด"},"wrong":{"en":"Choosing 15 bags for $3.90 without dividing","th":"เลือก 15 ถุง $3.90 โดยไม่หาร"},"right":{"en":"26c per bag beats neither 25c — divide every offer first","th":"26 เซนต์ต่อถุง แพ้ 25 เซนต์ — ต้องหารทุกข้อเสนอก่อน"}},{"title":{"en":"Mixing tonnes and kilograms","th":"สับสนตันกับกิโลกรัม"},"wrong":{"en":"3 tonnes ÷ $3600 treated as 3 units","th":"คิดว่า 3 ตัน คือ 3 หน่วย"},"right":{"en":"3 tonnes = 3000 kg, so cost per kg = $1.20","th":"3 ตัน = 3000 กิโลกรัม ต้นทุนต่อกิโลกรัม = $1.20"}}],"badges":[{"id":"first-steps","name":{"en":"First Steps","th":"ก้าวแรก"},"desc":{"en":"Answer your first practice question correctly","th":"ตอบคำถามฝึกหัดข้อแรกถูก"}},{"id":"lesson-1","name":{"en":"Ratio Reader","th":"อ่านอัตราส่วนได้"},"desc":{"en":"Finish the Simplifying Ratios lesson","th":"เรียนบทลดรูปอัตราส่วนจบ"}},{"id":"lesson-2","name":{"en":"Fair Sharer","th":"แบ่งอย่างยุติธรรม"},"desc":{"en":"Finish the Sharing in a Ratio lesson","th":"เรียนบทการแบ่งตามอัตราส่วนจบ"}},{"id":"lesson-3","name":{"en":"Rate Finder","th":"หาอัตราได้"},"desc":{"en":"Finish the Direct Proportion lesson","th":"เรียนบทสัดส่วนตรงจบ"}},{"id":"lab-explorer","name":{"en":"Lab Explorer","th":"นักสำรวจแล็บ"},"desc":{"en":"Use every tool in the Ratio Lab","th":"ใช้เครื่องมือทุกชิ้นในแล็บอัตราส่วน"}},{"id":"streak-10","name":{"en":"Ten in a Row","th":"สิบข้อติด"},"desc":{"en":"Get 10 practice questions right in a row","th":"ตอบถูกติดกัน 10 ข้อ"}},{"id":"test-pass","name":{"en":"Test Ready","th":"พร้อมสอบ"},"desc":{"en":"Score 60% or more on any mock test","th":"ทำคะแนนมอคเทสได้ 60% ขึ้นไป"}},{"id":"test-ace","name":{"en":"Test Ace","th":"เก่งข้อสอบ"},"desc":{"en":"Score 90% or more on any mock test","th":"ทำคะแนนมอคเทสได้ 90% ขึ้นไป"}},{"id":"all-tests","name":{"en":"Five Papers Done","th":"ครบห้าชุด"},"desc":{"en":"Complete all five mock tests","th":"ทำมอคเทสครบทั้งห้าชุ /* ── QuestionCard ── */
function questionCard(q, opt) {
  opt = opt || {};
  var seed = opt.seed || 1;
  var box = el('div', 'card anim-rise');
  var head = el('div', 'qhead');
  var meta = el('div', 'qcount', (opt.label || '') + (opt.label ? ' · ' : '') + T('lessonLabel') + ' ' + q.lesson);
  head.appendChild(meta);
  if (opt.right) head.appendChild(opt.right);
  box.appendChild(head);
  var stem = el('p', 'qstem'); stem.textContent = L(q.stem); box.appendChild(stem);
  if (q.visual) { var f = el('div'); f.innerHTML = A.visual(q.visual); box.appendChild(f.firstChild); }

  var state = { chosen: null, tries: 0, resolved: false, correct: false };
  var body = el('div'); box.appendChild(body);
  var fbHost = el('div'); box.appendChild(fbHost);
  var actions = el('div', 'btnrow'); box.appendChild(actions);

  var pm = q.type === 'mcq' ? perm(seed) : null;
  var correctDisplay = pm ? pm.indexOf(0) : -1;
  var buttons = [];

  if (q.type === 'mcq') {
    var group = el('div', 'opts'); group.setAttribute('role', 'radiogroup');
    group.setAttribute('aria-label', L(q.stem));
    pm.forEach(function (orig, i) {
      var b = el('button', 'opt'); b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
      b.innerHTML = '<span class="ltr" aria-hidden="true">' + LTR[i] + '</span><span class="lbl"></span>';
      b.querySelector('.lbl').textContent = L(q.options[orig]);
      b.addEventListener('click', function () { if (state.resolved && !opt.instant) return; if (state.resolved) return; choose(i); });
      b.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 0);
        if (d) { e.preventDefault(); var n = (i + d + 4) % 4; buttons[n].focus(); }
      });
      buttons.push(b); group.appendChild(b);
    });
    body.appendChild(group);
  } else {
    var wrap = el('div', 'numin');
    var inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off';
    inp.setAttribute('aria-label', L(q.stem));
    inp.addEventListener('input', function () { state.chosen = inp.value.trim() === '' ? null : inp.value.trim(); syncPrimary(); if (opt.onChange) opt.onChange(state); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); primary.click(); } });
    wrap.appendChild(inp);
    if (q.unit) wrap.appendChild(el('span', 'unit', q.unit));
    body.appendChild(wrap);
    state.input = inp;
  }

  function choose(i) {
    state.chosen = i;
    buttons.forEach(function (b, k) { b.setAttribute('aria-checked', k === i ? 'true' : 'false'); });
    syncPrimary();
    if (opt.onChange) opt.onChange(state);
  }

  var hintBtn = null, primary = null;
  function syncPrimary() { if (primary) primary.disabled = state.chosen === null; }

  if (opt.mode === 'graded') {
    hintBtn = el('button', 'btn btn-s'); hintBtn.type = 'button'; hintBtn.innerHTML = '💡 ' + esc(T('hint'));
    hintBtn.addEventListener('click', function () { showHint(); hintBtn.disabled = true; });
    primary = el('button', 'btn btn-p', T('check')); primary.type = 'button'; primary.disabled = true;
    primary.addEventListener('click', function () { grade(); });
    actions.appendChild(primary); actions.appendChild(hintBtn);
  }

  function showHint() {
    if (fbHost.querySelector('.hintbox')) return;
    var h = el('div', 'hintbox anim-rise'); h.setAttribute('role', 'note');
    h.innerHTML = '<strong>' + esc(S.lang === 'th' ? 'คำใบ้' : 'Hint') + ':</strong> ' + esc(L(q.hint));
    fbHost.appendChild(h);
  }

  function evaluate() {
    if (q.type === 'mcq') return state.chosen === correctDisplay;
    var v = parseFloat(String(state.chosen).replace(/[^0-9.\-]/g, ''));
    return isFinite(v) && isNumClose(v, q.answerValue);
  }

  function grade() {
    if (state.resolved) return;
    state.tries++;
    var ok = evaluate();
    if (ok) { resolve(true); return; }
    if (state.tries === 1) {
      if (q.type === 'mcq' && buttons[state.chosen]) { buttons[state.chosen].classList.add('anim-shake'); setTimeout(function () { buttons[state.chosen] && buttons[state.chosen].classList.remove('anim-shake'); }, 450); }
      showHint();
      var m = el('div', 'fb bad anim-rise');
      m.innerHTML = '<div class="fbh">' + icon('x') + '<span>' + esc(T('wrong')) + '</span></div><p style="margin:0">' + esc(S.lang === 'th' ? 'ลองอีกครั้งโดยใช้คำใบ้ด้านล่าง' : 'Try once more using the hint below.') + '</p>';
      var prev = fbHost.querySelector('.fb'); if (prev) prev.remove();
      fbHost.insertBefore(m, fbHost.firstChild);
      primary.textContent = T('retry');
      return;
    }
    resolve(false);
  }

  function resolve(ok) {
    state.resolved = true; state.correct = ok;
    if (q.type === 'mcq') {
      buttons.forEach(function (b, k) {
        b.disabled = true;
        if (k === correctDisplay) { b.classList.add('ok'); b.querySelector('.mark') || b.insertAdjacentHTML('beforeend', '<span class="mark">' + icon('check') + esc(T('correct')) + '</span>'); }
        else if (k === state.chosen && !ok) { b.classList.add('bad'); b.insertAdjacentHTML('beforeend', '<span class="mark">' + icon('x') + esc(T('yourAns')) + '</span>'); }
      });
      if (ok) buttons[correctDisplay].classList.add('anim-pulse');
    } else if (state.input) {
      state.input.disabled = true;
      state.input.style.background = ok ? 'var(--green-soft)' : 'var(--red-soft)';
    }
    var prev = fbHost.querySelector('.fb'); if (prev) prev.remove();
    fbHost.insertBefore(feedbackPanel(q, ok, correctDisplay), fbHost.firstChild);
    if (primary) primary.remove(); if (hintBtn) hintBtn.remove();
    if (opt.onResolve) opt.onResolve(ok, actions);
  }

  box.__resolveNow = function () { if (!state.resolved) { state.tries = 2; if (state.chosen === null) { state.resolved = true; resolveUnanswered(); } else grade(); } };
  function resolveUnanswered() {
    if (q.type === 'mcq') buttons.forEach(function (b, k) { b.disabled = true; if (k === correctDisplay) b.classList.add('ok'); });
    fbHost.insertBefore(feedbackPanel(q, false, correctDisplay), fbHost.firstChild);
    if (primary) primary.remove(); if (hintBtn) hintBtn.remove();
    if (opt.onResolve) opt.onResolve(false, actions);
  }
  box.__state = state;
  box.__correctDisplay = correctDisplay;
  return box;
}

function feedbackPanel(q, ok, correctDisplay) {
  var f = el('div', 'fb ' + (ok ? 'ok' : 'bad') + ' anim-rise');
  var right = q.type === 'mcq' ? LTR[correctDisplay] + '. ' + L(q.options[0]) : String(q.answerValue) + (q.unit ? ' ' + q.unit : '');
  var h = '<div class="fbh">' + icon(ok ? 'check' : 'x') + '<span>' + esc(ok ? T('correct') : T('wrong')) + '</span></div>';
  if (!ok) h += '<p style="margin:.2rem 0 .6rem"><strong>' + esc(T('rightAns')) + ':</strong> ' + esc(right) + '</p>';
  h += '<details' + (ok ? '' : ' open') + '><summary style="cursor:pointer;font-weight:800;color:var(--ink)">' + esc(T('explain')) + '</summary><ol class="steps">';
  q.explain.forEach(function (s) { h += '<li>' + esc(L(s)) + '</li>'; });
  h += '</ol><p class="checkline">✓ ' + esc(L(q.check)) + '</p></details>';
  f.innerHTML = h;
  return f;
}

  function paint() {
    vis.innerHTML = A.visual({ kind: 'sharebar', a: st.a, b: st.b, labels: [{ en: 'Share A', th: 'ส่วน A' }, { en: 'Share B', th: 'ส่วน B' }] });
    var parts = st.a + st.b, one = st.total / parts;
    var sa = st.a * one, sb = st.b * one;
    out.innerHTML = '<p class="big">' + (Math.round(sa * 100) / 100) + '  /  ' + (Math.round(sb * 100) / 100) + '</p>' +
      '<table class="dt"><tbody>' +
      '<tr><th>' + esc(T('totalParts')) + '</th><td>' + st.a + ' + ' + st.b + ' = ' + parts + '</td></tr>' +
      '<tr><th>' + esc(T('onePart')) + '</th><td>' + st.total + ' ÷ ' + parts + ' = ' + (Math.round(one * 100) / 100) + '</td></tr>' +
      '<tr><th>' + esc(S.lang === 'th' ? 'ตรวจผลรวม' : 'Check total') + '</th><td>' + (Math.round(sa * 100) / 100) + ' + ' + (Math.round(sb * 100) / 100) + ' = ' + (Math.round((sa + sb) * 100) / 100) + ' ✓</td></tr>' +
      '</tbody></table>';
    markLab('share');
  }
  c.appendChild(slider(T('amount'), 10, 240, st.total, function (v) { st.total = v; paint(); }));
  c.appendChild(slider(S.lang === 'th' ? 'ส่วน A' : 'Parts A', 1, 9, st.a, function (v) { st.a = v; paint(); }));
  c.appendChild(slider(S.lang === 'th' ? 'ส่วน B' : 'Parts B', 1, 9, st.b, function (v) { st.b = v; paint(); }));
  c.appendChild(vis); c.appendChild(out); paint();
  return c;
}
function labProp() {
  var c = el('section', 'card');
  c.innerHTML = '<h3>' + icon('trend') + ' ' + esc(T('labProp')) + '</h3>';
  var st = { n: 4, value: 500, m: 7 };
  var vis = el('div'), out = el('div');
  function paint() {
    var per = st.value / st.n, ans = per * st.m;
    vis.innerHTML = A.visual({ kind: 'proportion', n: st.n, value: st.value, m: st.m, ans: ans, isMoney: false, unit: 'g' });
    out.innerHTML = '<p class="big">' + (Math.round(ans * 100) / 100) + ' g</p>' +
      '<p style="margin:0;color:var(--muted)">' + esc(T('perUnit')) + ' = ' + (Math.round(per * 1000) / 1000) + ' g · ' +
      (Math.round(per * 1000) / 1000) + ' × ' + st.m + ' = ' + (Math.round(ans * 100) / 100) + ' ✓</p>';
    markLab('prop');
  }
  c.appendChild(slider(S.lang === 'th' ? 'จำนวนที่รู้' : 'Known quantity', 1, 12, st.n, function (v) { st.n = v; paint(); }));
  c.appendChild(slider(S.lang === 'th' ? 'ค่ารวม (g)' : 'Known total (g)', 20, 1200, st.value, function (v) { st.value = v; paint(); }));
  c.appendChild(slider(T('target'), 1, 20, st.m, function (v) { st.m = v; paint(); }));
  c.appendChild(vis); c.appendChild(out); paint();
  return c;
}
function labCompare() {
  var c = el('section', 'card');
  c.innerHTML = '<h3>' + icon('chart') + ' ' + esc(T('labCompare')) + '</h3>';
  var st = { a1: 3, b1: 4, a2: 2, b2: 3 };
  var out = el('div');
  function paint() {
    var p1 = st.a1 / (st.a1 + st.b1), p2 = st.a2 / (st.a2 + st.b2);
    var W = 320, bar = function (p, col) {
      return '<svg viewBox="-2 0 ' + (W + 4) + ' 28" role="img" aria-label="' + Math.round(p * 100) + '%"><rect x="0" y="4" width="' + W + '" height="20" rx="3" fill="#FFFCF4" stroke="#48301F" stroke-width="2.5"/><rect class="grow" x="3" y="7" width="' + Math.max(0, (W - 6) * p) + '" height="14" rx="2" fill="' + col + '"/></svg>';
    };
    var msg = Math.abs(p1 - p2) < 1e-9 ? T('equalProp') : ((p1 > p2 ? 'A' : 'B') + ' ' + T('higher'));
    out.innerHTML = '<div class="vis"><div class="metarow"><span>A = ' + st.a1 + ' : ' + st.b1 + '</span><span>' + (Math.round(p1 * 1000) / 1000) + '</span></div>' + bar(p1, '#4FB3A5') +
      '<div class="metarow" style="margin-top:.5rem"><span>B = ' + st.a2 + ' : ' + st.b2 + '</span><span>' + (Math.round(p2 * 1000) / 1000) + '</span></div>' + bar(p2, '#E8B84B') + '</div>' +
      '<p class="big" style="font-size:1.25rem">' + esc(msg) + '</p>' +
      '<p style="color:var(--muted);margin:0">' + st.a1 + '/' + (st.a1 + st.b1) + ' ' + (p1 > p2 ? '>' : p1 < p2 ? '<' : '=') + ' ' + st.a2 + '/' + (st.a2 + st.b2) + '</p>';
    markLab('compare');
  }
  c.appendChild(slider('A ' + (S.lang === 'th' ? 'ส่วนแรก' : 'first part'), 1, 9, st.a1, function (v) { st.a1 = v; paint(); }));
  c.appendChild(slider('A ' + (S.lang === 'th' ? 'ส่วนที่สอง' : 'second part'), 1, 9, st.b1, function (v) { st.b1 = v; paint(); }));
  c.appendChild(slider('B ' + (S.lang === 'th' ? 'ส่วนแรก' : 'first part'), 1, 9, st.a2, function (v) { st.a2 = v; paint(); }));
  c.appendChild(slider('B ' + (S.lang === 'th' ? 'ส่วนที่สอง' : 'second part'), 1, 9, st.b2, function (v) { st.b2 = v; paint(); }));
  c.appendChild(out); paint();
  return c;
}

/* ── PROGRESS ── */
function pageProgress() {
  var w = el('div', 'wrap'); w.appendChild(crumb(T('progress')));
  var m = A.mastery();
  var hero = el('section', 'hero anim-rise');
  hero.innerHTML = '<div class="eyebrow">' + esc(T('mastery')) + '</div><h1>' + m.total + '%</h1>' +
    '<div class="pbar" style="max-width:420px"><i style="width:' + m.total + '%"></i></div>' +
    '<p>' + esc(S.lang === 'th' ? 'คิดจากบทเรียนที่จบ (20%) แบบฝึกหัดที่ตอบถูก (30%) และคะแนนข้อสอบเสมือนที่ดีที่สุด (50%)' : 'Built from lessons completed (20%), correct practice answers (30%) and your best mock-test scores (50%).') + '</p>';
  w.appendChild(hero);
  var tiles = el('div', 'tiles'); tiles.style.margin = '1rem 0';
  [[T('learn'), m.learn + '%'], [T('practice'), m.prac + '%'], [T('tests'), m.test + '%'],
   [T('accuracy'), m.pAcc + '%'], [T('attempts'), String(m.pAns)], [T('best') + ' ' + T('streak'), String(S.bestStreak)]].forEach(function (t) {
    var d = el('div', 'tile'); d.innerHTML = '<div class="k">' + esc(t[0]) + '</div><div class="v">' + esc(t[1]) + '</div>'; tiles.appendChild(d);
  });
  w.appendChild(tiles);

  var ts = el('section', 'card'); ts.innerHTML = '<h3>' + esc(T('tests')) + '</h3>';
  D.tests.forEach(function (t) {
    var r = S.tests[t.n];
    var d = el('div'); d.style.marginBottom = '.7rem';
    var bp = r ? A.pct(r.best) : 0;
    d.innerHTML = '<div class="metarow"><span>' + esc(L(t.title)) + '</span><span>' + (r ? bp + '% · ' + r.attempts + 'x' : esc(T('notStarted'))) + '</span></div>' +
      '<div class="meter ' + (bp >= 80 ? 'g' : bp >= 50 ? 'm' : '') + '"><i style="width:' + bp + '%"></i></div>';
    ts.appendChild(d);
  });
  w.appendChild(ts);

  var bg = el('section', 'card'); bg.innerHTML = '<h3>' + esc(T('badges')) + ' (' + S.badges.length + '/' + D.badges.length + ')</h3>';
  var bl = el('div', 'bgrid');
  D.badges.forEach(function (b) {
    var on = S.badges.indexOf(b.id) >= 0;
    var d = el('div', 'badge' + (on ? ' on' : ''));
    d.innerHTML = '<div class="bn">' + (on ? '★ ' : '☆ ') + esc(L(b.name)) + '</div><div class="bd">' + esc(L(b.desc)) + '</div>';
    bl.appendChild(d);
  });
  bg.appendChild(bl); w.appendChild(bg);

  var mk = el('section', 'card'); mk.innerHTML = '<h3>' + esc(S.lang === 'th' ? 'ข้อผิดพลาดที่พบบ่อย' : 'Common mistakes to watch') + '</h3>';
  D.mistakes.forEach(function (x) {
    var d = el('details', 'blk');
    d.innerHTML = '<summary><span class="tag t-mistake">' + esc(tag('mistake')) + '</span><span>' + esc(L(x.title)) + '</span><span class="cara">' + icon('chev') + '</span></summary>' +
      '<div class="body"><p style="color:var(--red-d)"><strong>✗</strong> ' + esc(L(x.wrong)) + '</p><p style="color:var(--green-d)"><strong>✓</strong> ' + esc(L(x.right)) + '</p></div>';
    mk.appendChild(d);
  });
  w.appendChild(mk);
  return w;
}
function tag(t) { return L({ mistake: { en: 'Watch out', th: 'ระวัง' } }[t]); }

/* ── SETTINGS ── */
function pageSettings() {
  var w = el('div', 'wrap'); w.appendChild(crumb(T('settings')));
  w.appendChild(el('h1', null, T('settings')));

  var lc = el('section', 'card');
  lc.innerHTML = '<h3>' + esc(T('langLabel')) + '</h3>';
  var lr = el('div', 'btnrow');
  [['en', 'English'], ['th', 'ภาษาไทย']].forEach(function (x) {
    var b = el('button', 'btn ' + (S.lang === x[0] ? 'btn-p' : 'btn-s'), x[1]); b.type = 'button';
    b.addEventListener('click', function () { S.lang = x[0]; save(); document.body.className = 'lang-' + S.lang; document.documentElement.lang = S.lang === 'th' ? 'th' : 'en'; window.__render(); });
    lr.appendChild(b);
  });
  lc.appendChild(lr); w.appendChild(lc);

  var bc = el('section', 'card');
  bc.innerHTML = '<h3>' + esc(S.lang === 'th' ? 'แบรนด์ของคุณ' : 'Your brand') + '</h3>';
  function field(labelTxt, val, key, max) {
    var d = el('div'); d.style.marginBottom = '.7rem';
    var id = 'f-' + key;
    var lb = el('label', null, labelTxt); lb.setAttribute('for', id); lb.style.display = 'block'; lb.style.fontWeight = '700'; lb.style.fontSize = '.9rem'; lb.style.color = 'var(--ink)';
    var i = el('input'); i.id = id; i.type = 'text'; i.value = val; if (max) i.maxLength = max;
    i.style.cssText = 'width:100%;min-height:48px;padding:.5rem .7rem;border:2px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);background:var(--white);font-size:1rem;margin-top:.35rem;color:var(--ink)';
    i.dataset.key = key;
    d.appendChild(lb); d.appendChild(i); return d;
  }
  bc.appendChild(field(T('brandLabel'), S.brand.name, 'name', 40));
  bc.appendChild(field(T('teacherLabel'), S.brand.teacher, 'teacher', 60));
  bc.appendChild(field(T('initialsLabel'), S.brand.initials, 'initials', 3));
  var sb = el('button', 'btn btn-p', T('save')); sb.type = 'button';
  sb.addEventListener('click', function () {
    bc.querySelectorAll('input[data-key]').forEach(function (i) { S.brand[i.dataset.key] = i.value.trim() || S.brand[i.dataset.key]; });
    save(); A.toast(T('saved')); window.__render();
  });
  var r1 = el('div', 'btnrow'); r1.appendChild(sb); bc.appendChild(r1); w.appendChild(bc);

  var ac = el('section', 'card');
  ac.innerHTML = '<h3>' + esc(S.lang === 'th' ? 'ตรวจสอบเนื้อหา' : 'Content audit') + '</h3>' +
    '<p style="color:var(--muted)">' + esc(S.lang === 'th'
      ? 'ตรวจทุกข้อในเครื่องของคุณ: การคำนวณ ผลรวมของส่วนแบ่ง สัดส่วนตรง การลดรูป และตัวเลือกที่ซ้ำกัน'
      : 'Re-checks every question in your browser: arithmetic, share totals, direct proportion, simplification and duplicate options.') + '</p>';
  var ab = el('button', 'btn btn-s', T('audit')); ab.type = 'button';
  var ao = el('div'); ao.style.marginTop = '.7rem';
  ab.addEventListener('click', function () {
    var r = window.__audit();
    ao.innerHTML = '<div class="fb ' + (r.errors.length ? 'bad' : 'ok') + '"><div class="fbh">' + icon(r.errors.length ? 'x' : 'check') +
      '<span>' + esc(T('auditRun')) + '</span></div><p style="margin:0">' + r.checked + ' ' + esc(S.lang === 'th' ? 'ข้อที่ตรวจ' : 'questions checked') +
      ' · ' + r.errors.length + ' ' + esc(S.lang === 'th' ? 'ข้อผิดพลาด' : 'errors') + '</p>' +
      (r.errors.length ? '<ul>' + r.errors.slice(0, 10).map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
  });
  var r2 = el('div', 'btnrow'); r2.appendChild(ab); ac.appendChild(r2); ac.appendChild(ao); w.appendChild(ac);

  var rc = el('section', 'card');
  rc.innerHTML = '<h3>' + esc(T('resetTitle')) + '</h3><p style="color:var(--muted)">' + esc(T('resetBody')) + '</p>';
  var rb = el('button', 'btn btn-d', T('resetGo')); rb.type = 'button';
  rb.addEventListener('click', function () {
    var m = el('div', 'modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    var box = el('div', 'box');
    box.innerHTML = '<h3>' + esc(T('resetTitle')) + '</h3><p>' + esc(T('resetBody')) + '</p>';
    var row = el('div', 'btnrow');
    var yes = el('button', 'btn btn-d', T('resetGo')); yes.type = 'button';
    yes.addEventListener('click', function () {
      try { localStorage.removeItem('rps.v1'); } catch (e) {}
      location.reload();
    });
    var no = el('button', 'btn btn-s', T('cancel')); no.type = 'button';
    no.addEventListener('click', function () { m.remove(); });
    row.appendChild(yes); row.appendChild(no); box.appendChild(row); m.appendChild(box); document.body.appendChild(m); no.focus();
    m.addEventListener('keydown', function (e) { if (e.key === 'Escape') m.remove(); });
  });
  var r3 = el('div', 'btnrow'); r3.appendChild(rb); rc.appendChild(r3); w.appendChild(rc);
  return w;
}

/* ── render ── */
function render() {
  var r = route();
  var root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(U.header());
  var main = el('main'); main.id = 'main';
  var page;
  switch (r.name) {
    case 'lesson': page = U.pageLesson(); break;
    case 'practicehub': page = U.pagePracticeHub(); break;
    case 'practice': page = U.pagePractice(); break;
    case 'challenge': page = U.pageChallenge(); break;
    case 'tests': page = pageTests(); break;
    case 'test': page = pageTest(); break;
    case 'mistakes': page = pageMistakes(); break;
    case 'lab': page = pageLab(); break;
    case 'progress': page = pageProgress(); break;
    case 'settings': page = pageSettings(); break;
    default: page = U.pageHome();
  }
  main.appendChild(page);
  root.appendChild(main);
  var f = el('footer', 'foot');
  f.innerHTML = '<div>' + esc(S.brand.name) + ' · ' + esc(S.brand.teacher) + '</div><div style="margin-top:.35rem">' + esc(T('disclaimer')) + '</div>';
  root.appendChild(f);
}
window.__render = render;
U.bindRender(render);
document.body.className = 'lang-' + S.lang;
document.documentElement.lang = S.lang === 'th' ? 'th' : 'en';
render();
})();
</script>
</body>
</html>

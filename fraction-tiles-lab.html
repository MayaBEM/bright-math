    const score = res.filter((r) => r.ok).length;
    const secs = Math.min(T.limit, Math.round((Date.now() - T.start) / 1000));
    store.tests.push({ when: Date.now(), score, total: res.length, secs, byTopic }); if (store.tests.length > 30) store.tests.shift(); save();
    T.result = { res, score, secs, byTopic, timeUp };
    window.__FTL.lastResult = T.result;
    go('results');
  }
  function results() {
    if (!T || !T.result) return test();
    const { res, score, secs, byTopic, timeUp } = T.result;
    const weak = D.TOPICS.filter((t) => byTopic[t.id] && byTopic[t.id][0] < byTopic[t.id][1]);
    const pct = Math.round(score / res.length * 100);
    const shown = (r) => {
      const q = r.q, a = r.a;
      if (q.kind === 'build') return isBlank(q, a) ? 'no answer' : (() => { const t = D.rowTotal(a.board.rows[0]); return `row 1 was ${fracTok(t)} long`; })();
      return isBlank(q, a) ? 'no answer' : gotText(asInput(q), a);
    };
    const right = (q) => q.kind === 'build' ? `${fracTok(q.answer)} with ${q.answer[0]} {1/${q.answer[1]}} tile${q.answer[0] > 1 ? 's' : ''}` : answerText(asInput(q));
    app.innerHTML = shell('test-results', `<section class="results">
      <div class="score"><p class="big">${score}<span>/${res.length}</span></p><div><h2>${pct >= 90 ? 'Excellent work.' : pct >= 70 ? 'Good work.' : pct >= 50 ? 'Getting there.' : 'Keep building.'}</h2><p>${timeUp ? 'Time ran out. ' : ''}Time used: ${Math.floor(secs / 60)} min ${secs % 60} s</p></div></div>
      <h3>By topic</h3><div class="topics">${D.TOPICS.filter((t) => byTopic[t.id]).map((t) => { const [c, n] = byTopic[t.id]; return `<div class="tp${c < n ? ' weak' : ''}"><span>${esc(t.name)}</span><span class="meter"><i style="width:${c / n * 100}%"></i></span><b>${c}/${n}</b></div>`; }).join('')}</div>
      ${weak.length ? `<h3>Review these</h3><div class="review">${weak.map((t) => `<button class="row-item" data-go="lesson" data-arg="${t.lesson}"><span class="ri-main"><b>${esc(t.name)}</b><small>Go back to Lesson ${t.lesson.slice(1)}</small></span><span class="ri-state">Review →</span></button>`).join('')}</div>` : '<p class="allgood">Every topic correct. Nothing to review.</p>'}
      <div class="btns"><button class="primary" data-t="again">Try a new test</button><button class="ghost" data-go="progress">Progress dashboard</button></div>
      <h3>Answers</h3><ol class="answers-list">${res.map((r) => `<li class="${r.ok ? 'good' : 'bad'}"><p class="q">${fx(r.q.prompt)}${r.q.kind === 'sym' ? ` ${fx(r.q.a)} ○ ${fx(r.q.b)}` : ''}</p><p><b>${r.ok ? '✓' : '✗'}</b> Your answer: ${fx(shown(r))}${r.ok ? '' : ` · Correct: ${fx(right(r.q))}`}</p>${r.ok ? '' : `<p class="ex">${fx(r.q.explain)}</p>`}</li>`).join('')}</ol>
    </section>`);
    app.querySelector('[data-t="again"]').addEventListener('click', startTest);
  }

  // ── Progress dashboard ──
  function progress() {
    const tests = store.tests;
    const rows = D.TOPICS.map((t) => {
      const ms = D.MISSIONS.filter((m) => m.topic === t.id && !missionLocked(m));
      const won = ms.filter((m) => store.practice[m.id] && store.practice[m.id].first).length;
      const tried = ms.filter((m) => store.practice[m.id]).length;
      let c = 0, n = 0, best = null;
      tests.forEach((x) => { const v = x.byTopic[t.id]; if (v) { c += v[0]; n += v[1]; const p = v[0] / v[1]; best = best == null ? p : Math.max(best, p); } });
      const lessonDone = store.lessons[t.lesson];
      return `<tr><th scope="row">${esc(t.name)}</th><td class="c">${lessonDone ? '<span class="ok">✓</span>' : '–'}</td>
        <td><span class="meter"><i style="width:${ms.length ? won / ms.length * 100 : 0}%"></i></span><small>${won}/${ms.length} first try${tried > won ? ` · ${tried} tried` : ''}</small></td>
        <td><span class="meter t"><i style="width:${n ? c / n * 100 : 0}%"></i></span><small>${n ? `${c}/${n} across tests` : 'no test yet'}</small></td></tr>`;
    }).join('');
    const best = tests.length ? Math.max(...tests.map((x) => x.score)) : null;
    const lessonsN = FREE ? 1 : D.LESSONS.length; const missionsN = FREE ? D.FREE_MISSIONS.length : D.MISSIONS.length;
    app.innerHTML = shell('progress', `<section class="pagehead"><h2>Progress</h2><p>Scores are saved on this device only. Nothing is sent anywhere.</p></section>
      <div class="stats"><div><b>${Object.keys(store.lessons).length}<span>/${lessonsN}</span></b><small>lessons done</small></div><div><b>${Object.values(store.practice).filter((x) => x.first).length}<span>/${missionsN}</span></b><small>missions right first try</small></div><div><b>${tests.length}</b><small>tests taken</small></div><div><b>${best == null ? '–' : best}<span>${best == null ? '' : '/15'}</span></b><small>best test score</small></div></div>
      <div class="tablewrap"><table class="dash"><thead><tr><th>Topic</th><th class="c">Lesson</th><th>Practice</th><th>Tests</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${tests.length ? `<h3>Recent tests</h3><div class="spark">${tests.slice(-10).map((x) => `<div class="sp" title="${x.score}/${x.total}"><i style="height:${x.score / x.total * 100}%"></i><small>${x.score}</small></div>`).join('')}</div>` : ''}
      <div class="btns"><button class="ghost danger" data-t="wipe">Reset progress</button></div><p class="confirm" hidden>Clear all lessons, missions and test scores on this device? <button class="primary sm" data-t="wipe-yes">Yes, clear</button> <button class="ghost sm" data-t="wipe-no">Cancel</button></p>`);
    app.querySelector('main').addEventListener('click', (e) => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      if (b.dataset.t === 'wipe') app.querySelector('.confirm').hidden = false;
      if (b.dataset.t === 'wipe-no') app.querySelector('.confirm').hidden = true;
      if (b.dataset.t === 'wipe-yes') { store = blank(); save(); progress(); }
    });
  }

  window.__FTL = { D, go, get store() { return store; }, board: null, Board, FREE };
  home();
})();

</script>
</body>
</html>

ssonCompleted,onClick:()=>c(e.id)},e.id))})]})}var Si={foundations:{module:`foundations`,goal:`I can describe what a percentage represents and read percentages from grids, bars and circles.`,starter:{prompt:`A progress ring is divided into 20 equal sections. 15 of them are filled in.`,visual:{kind:`sectors`,total:20,filled:15},question:`What percentage of the ring is complete?`,answer:`75`},learn:[{heading:`Percent means out of 100`,paragraphs:[`The word percent comes from a Latin phrase meaning 'out of a hundred'. Whenever you see a % sign, imagine a whole cut into exactly 100 equal parts.`,`If 40 of those 100 parts are shaded, then 40% is shaded — the number of shaded parts and the percentage are the very same number.`],keyFact:`Percent = out of 100.`},{heading:`Part and whole`,paragraphs:[`Every percentage compares a part to a whole. The whole is always treated as 100%, no matter how large or small the real quantity actually is.`,`A model such as a hundred grid, a bar, or a circle of sectors is just a way of picturing that whole, split into 100 equal-value parts.`],keyFact:`The whole is always 100%, however large the real amount is.`}],watchChange:{heading:`From sectors to percent`,description:`A circle of 20 sectors fills in one at a time. Each sector is worth 5%, so the total climbs in steps of 5 as more sectors are shaded.`,from:`0% (0 of 20 sectors)`,to:`100% (20 of 20 sectors)`},workedExample:{prompt:`A 10 × 10 grid has 68 squares shaded. What percentage is shaded, and what fraction of the grid is NOT shaded?`,methodA:{title:`Read the grid directly`,steps:[{step:`Count the shaded squares.`,explain:`68 of the 100 squares are shaded.`},{step:`Match the count to a percentage.`,explain:`Because the grid has exactly 100 squares, 68 shaded squares is simply 68%.`},{step:`Find the unshaded percentage.`,explain:`100% − 68% = 32%, so 32% is not shaded — the fraction 32/100, which simplifies to 8/25.`}]},answer:`68% shaded; 8/25 not shaded`},tryTogether:[{question:`A bar is shaded up to the 45 mark out of 100. What percentage is shaded?`,hint:`The bar already shows parts out of 100.`,answer:`45`},{question:`A circle of 10 equal sectors has 4 shaded. What percentage is shaded?`,hint:`Work out what one sector is worth first.`,answer:`40`},{question:`90 squares out of a 10 × 10 grid are shaded. What percentage is NOT shaded?`,hint:`Find the shaded percentage, then subtract from 100%.`,answer:`10`}],commonMistake:{wrong:`A learner says a grid with 30 shaded squares out of 100 shows '30 percent, out of 30'.`,why:`They have confused the shaded count with a brand new 'whole', instead of keeping 100 as the whole throughout.`,correct:`The whole is always the full grid of 100 squares. 30 shaded squares out of that fixed 100 is 30%.`},recap:{keyRule:`Percent always means 'out of 100'.`,shortcut:`On a 10 × 10 grid, the number of shaded squares IS the percentage.`,warning:`Never change what counts as the whole partway through a question — it always stays 100%.`}},conversions:{module:`conversions`,goal:`I can convert confidently between fractions, decimals and percentages.`,starter:{prompt:`This bar is shaded up to the 60 mark out of 100.`,visual:{kind:`bar`,total:100,filled:60},question:`Write 60% as a fraction in its simplest form.`,answer:`3/5`},learn:[{heading:`Three forms, one value`,paragraphs:[`A percentage, a decimal and a fraction can all describe exactly the same amount — they are just different ways of writing it down.`,`For example, 60% = 60/100 = 0.6 = 3/5. Whichever form is easiest to work with in a problem is the one you should choose.`],keyFact:`Percentage ÷ 100 = decimal. Decimal × 100 = percentage.`},{heading:`Simplifying carefully`,paragraphs:[`To turn a percentage into a fraction, write it over 100, then divide the numerator and denominator by their highest common factor.`,`Percentages with a decimal part, like 37.5%, need an extra step: multiply top and bottom by 10 first to clear the decimal point, then simplify.`],keyFact:`Always check a fraction is in its simplest form by looking for a common factor.`}],watchChange:{heading:`3/4 becomes 0.75 becomes 75%`,description:`Watch the fraction 3/4 transform step by step: first into the decimal 0.75, then into the percentage 75%, with each stage highlighted.`,from:`3/4`,to:`75%`},workedExample:{prompt:`Write 62.5% as a decimal and as a fraction in its simplest form.`,methodA:{title:`Convert to a decimal`,steps:[{step:`Divide by 100.`,explain:`62.5 ÷ 100 = 0.625.`}]},methodB:{title:`Convert to a fraction`,steps:[{step:`Write over 100.`,explain:`62.5% = 62.5/100.`},{step:`Clear the decimal point.`,explain:`Multiply top and bottom by 10: 625/1000.`},{step:`Simplify using common factors.`,explain:`Dividing by 125 gives 5/8, which cannot be simplified further.`}]},answer:`0.625 = 5/8`},tryTogether:[{question:`Write 90% as a decimal.`,hint:`Divide by 100.`,answer:`0.9`},{question:`Write 0.35 as a percentage.`,hint:`Multiply by 100.`,answer:`35`},{question:`Write 7% as a decimal.`,hint:`Percent means out of 100 — watch the zeros.`,answer:`0.07`}],commonMistake:{wrong:`A learner writes 8% = 0.8.`,why:`They divided by 10 instead of by 100, treating percent as if it meant 'out of ten'.`,correct:`8% = 8 ÷ 100 = 0.08.`},recap:{keyRule:`Fractions, decimals and percentages are three names for the same value.`,shortcut:`To go from a decimal to a percentage, just move the decimal point two places to the right.`,warning:`Small percentages often need extra zeros when written as decimals — 4% is 0.04, not 0.4.`}},quantity:{module:`quantity`,goal:`I can find a percentage of a quantity using a method that suits the numbers.`,starter:{prompt:`A bar highlights 25% next to an amount of ฿160.`,visual:{kind:`bar`,total:100,filled:25},question:`What is 25% of ฿160?`,answer:`40`},learn:[{heading:`Choose a method that fits`,paragraphs:[`There is more than one correct way to find a percentage of an amount. You can convert the percentage to a fraction, convert it to a decimal, or build it from easier benchmark percentages.`,`For 25% of ฿160, you could calculate 1/4 × 160, or 0.25 × 160 — both give exactly the same answer, 40.`],keyFact:`Different correct methods always lead to the same answer.`},{heading:`Benchmarks make it fast`,paragraphs:[`Some percentages are so useful that it helps to know them by heart: 50% (half), 25% (a quarter), 10% (divide by 10), and 1% (divide by 100).`,`Once you know 10% and 1%, you can build almost any other percentage by adding or subtracting easier pieces — for example, 15% = 10% + 5%.`],keyFact:`10% of an amount is always the amount divided by 10.`}],watchChange:{heading:`Building 45% from benchmarks`,description:`45% is built as 50% minus 5%, with each benchmark bar appearing and combining into the final answer.`,from:`50% − 5%`,to:`45%`},workedExample:{prompt:`Find 35% of ฿420 using two different methods.`,methodA:{title:`Decimal method`,steps:[{step:`Convert 35% to a decimal.`,explain:`35% = 0.35.`},{step:`Multiply.`,explain:`0.35 × 420 = 147.`}]},methodB:{title:`Break it apart`,steps:[{step:`Find 10% of 420.`,explain:`420 ÷ 10 = 42.`},{step:`Find 30% and 5%.`,explain:`30% = 3 × 42 = 126, and 5% = half of 42 = 21.`},{step:`Add the parts.`,explain:`126 + 21 = 147.`}]},answer:`฿147`},tryTogether:[{question:`Find 10% of ฿250.`,hint:`Divide by 10.`,answer:`25`},{question:`Find 20% of 55 students.`,hint:`20% is one fifth.`,answer:`11`},{question:`Use 10% + 5% to find 15% of ฿180.`,hint:`Find 10%, then half of that for 5%, then add.`,answer:`27`}],commonMistake:{wrong:`A learner finds 20% of ฿150 by working out 150 ÷ 20 = 7.5.`,why:`Dividing the amount by the percentage number is not the same as finding that percentage — the percentage must first be written as a fraction or decimal of the whole.`,correct:`20% of ฿150 = 0.2 × 150 = ฿30 (or 150 ÷ 5, since 20% = 1/5).`},recap:{keyRule:`To find a percentage of an amount, convert it to a fraction or decimal, then multiply.`,shortcut:`Find 10% by dividing by 10, then build up other percentages from it.`,warning:`Never divide the amount by the percentage number itself — that does not give a percentage of anything.`}},small:{module:`small`,goal:`I can work confidently with percentages that are less than 1%.`,starter:{prompt:`A bar has 1 highlighted part out of 200 equal parts.`,visual:{kind:`bar`,total:200,filled:1},question:`What percentage does this represent?`,answer:`0.5`},learn:[{heading:`Percentages can be tiny`,paragraphs:[`Not every percentage is a whole number of hundredths. Percentages such as 0.5%, 0.2% or 0.1% describe an amount far smaller than 1%.`,`0.5% means half of one percent — you can find it by first finding 1%, then halving the result.`],keyFact:`0.5% is half of 1%.`},{heading:`Careful with the decimal point`,paragraphs:[`Converting a percentage below 1% to a decimal often creates extra zeros. For example, 0.5% = 0.005, and 0.1% = 0.001.`,`As a fraction, 0.5% = 0.5/100. Multiplying top and bottom by 10 first (to clear the decimal) gives 5/1000, which simplifies to 1/200.`],keyFact:`Dividing by 100 always shifts the decimal point two places, even when the percentage already contains a decimal.`}],watchChange:{heading:`Zooming into one grid square`,description:`A single 1% square from a hundred-grid zooms in and splits into ten smaller strips, each worth 0.1% — showing how far below 1% a percentage can go.`,from:`1% (one full square)`,to:`0.1% (one tenth of that square)`},workedExample:{prompt:`Find 0.5% of 640, and write 0.2% as a fraction in its simplest form.`,methodA:{title:`Find 0.5% of 640`,steps:[{step:`Find 1% first.`,explain:`1% of 640 = 6.4.`},{step:`Halve it for 0.5%.`,explain:`6.4 ÷ 2 = 3.2.`}]},methodB:{title:`Write 0.2% as a fraction`,steps:[{step:`Write over 100.`,explain:`0.2% = 0.2/100.`},{step:`Clear the decimal.`,explain:`Multiply top and bottom by 10: 2/1000.`},{step:`Simplify.`,explain:`Divide by 2: 1/500.`}]},answer:`0.5% of 640 = 3.2; 0.2% = 1/500`},tryTogether:[{question:`Write 0.3% as a decimal.`,hint:`Divide by 100.`,answer:`0.003`},{question:`1% of 900 is 9. Find 0.5% of 900.`,hint:`Halve the value of 1%.`,answer:`4.5`},{question:`Write 0.8% as a fraction in its simplest form.`,hint:`Write over 100, then clear the decimal point.`,answer:`1/125`}],commonMistake:{wrong:`A learner converts 0.5% to the decimal 0.05.`,why:`They divided by 10 instead of by 100 — forgetting that percent always means dividing by 100, whatever the percentage looks like.`,correct:`0.5% = 0.5 ÷ 100 = 0.005.`},recap:{keyRule:`A percentage below 1% is smaller than one hundredth of the whole.`,shortcut:`Find 1% first, then scale it down — halve it for 0.5%, or find a tenth of it for 0.1%.`,warning:`Watch the zeros — percentages below 1% usually need extra zeros after the decimal point.`}},large:{module:`large`,goal:`I can understand and calculate percentages greater than 100%.`,starter:{prompt:`A bar shows a new amount that is 140% of the original.`,visual:{kind:`bar`,total:100,filled:140},question:`What is the percentage increase from the original?`,answer:`40`},learn:[{heading:`More than the whole`,paragraphs:[`A percentage can be greater than 100% whenever a new amount is larger than the original whole. 100% is just the starting point, not a ceiling.`,`If a price grows to 150% of its old value, the new price is one and a half times the old one — 50% more than the original.`],keyFact:`100% + increase% = the new amount as a percentage of the original.`},{heading:`Increase by, not 'is a percentage of'`,paragraphs:[`There is an important difference between 'increased by 75%' and 'is 75% of the original'. An increase of 75% means the new amount is 100% + 75% = 175% of the original.`,`Always check which phrase a question uses before deciding whether to add to 100% or simply take a percentage of the original.`],keyFact:`'Increased by 75%' means the new amount is 175% of the original.`}],watchChange:{heading:`Stacking on top of 100%`,description:`A bar grows from 100% up to 175%, with the extra 75% stacking visibly on top of the original whole.`,from:`100%`,to:`175%`},workedExample:{prompt:`A plant was 40 cm tall. It is now 165% of that height. How tall is the plant now, and what is the percentage increase?`,methodA:{title:`Decimal method`,steps:[{step:`Convert 165% to a decimal.`,explain:`165% = 1.65.`},{step:`Multiply by the original height.`,explain:`1.65 × 40 = 66 cm.`},{step:`Find the increase.`,explain:`165% − 100% = a 65% increase.`}]},answer:`66 cm; a 65% increase`},tryTogether:[{question:`Write 130% as a decimal.`,hint:`Divide by 100.`,answer:`1.3`},{question:`An amount increases from 100% to 220%. What is the percentage increase?`,hint:`Subtract 100% from the new percentage.`,answer:`120`},{question:`A price increases by 400%. The new price is how many times the original?`,hint:`Add the increase to 100%, then convert to a multiplier.`,answer:`5`}],commonMistake:{wrong:`A learner says an increase of 60% means the new amount is 60% of the original.`,why:`They have mixed up the increase itself with the final total — the increase is added ON TOP of the original 100%.`,correct:`An increase of 60% means the new amount is 100% + 60% = 160% of the original.`},recap:{keyRule:`Percentages above 100% represent an amount larger than the whole.`,shortcut:`New amount % = 100% + increase %.`,warning:`'Increased by' and 'is a percentage of' mean different things — read the wording carefully.`}},reallife:{module:`reallife`,goal:`I can identify the part and the whole to solve real-life percentage problems.`,starter:{prompt:`Two shops each make ฿20 more profit than yesterday. One started from ฿40, the other from ฿200.`,visual:{kind:`bar`,total:100,filled:50},question:`Which shop had the bigger percentage increase in profit?`,answer:`The shop that started from ฿40`},learn:[{heading:`Percentage = part ÷ whole × 100`,paragraphs:[`Most real-life percentage problems ask what percentage one value is of another. The rule is always the same: percentage = part ÷ whole × 100.`,`Identifying which value is the whole is the most important step — get it the wrong way round and the answer changes completely.`],keyFact:`Percentage = part ÷ whole × 100.`},{heading:`Above or below 100%?`,paragraphs:[`If the part is smaller than the whole, the percentage will be below 100%. If the part is larger than the whole — for example, when a new price is compared to an old, lower price — the percentage will be above 100%.`,`Checking whether your answer should be above or below 100% is a fast way to catch a mistake.`],keyFact:`If the part is bigger than the whole, expect an answer above 100%.`}],watchChange:{heading:`Reversing part and whole`,description:`The same two numbers, 40 and 50, swap roles as part and whole — producing 80% one way and 125% the other.`,from:`40 as a % of 50 → 80%`,to:`50 as a % of 40 → 125%`},workedExample:{prompt:`A bookshop had 240 books. It sold 180 of them. What percentage did it sell, and what is the percentage increase if the shop then restocks up to 300 books?`,methodA:{title:`Percentage sold`,steps:[{step:`Identify the part and the whole.`,explain:`Part = 180 sold, whole = 240 books originally.`},{step:`Divide and multiply by 100.`,explain:`180 ÷ 240 × 100 = 75%.`}]},methodB:{title:`Percentage increase after restocking`,steps:[{step:`Find the increase.`,explain:`300 − 240 = 60 more books than the original stock.`},{step:`Divide by the original amount.`,explain:`60 ÷ 240 × 100 = a 25% increase.`}]},answer:`75% sold; a 25% increase after restocking`},tryTogether:[{question:`12 out of 48 tickets remain unsold. What percentage remain unsold?`,hint:`Percentage = part ÷ whole × 100.`,answer:`25`},{question:`A journey time falls from 60 minutes to 45 minutes. What is the percentage decrease?`,hint:`Find the decrease, then divide by the original time.`,answer:`25`},{question:`฿70 is what percentage of ฿56?`,hint:`Divide the first amount by the second, then multiply by 100.`,answer:`125`}],commonMistake:{wrong:`A learner calculates '20 out of 80' as 80 ÷ 20 × 100 = 400%.`,why:`They divided the whole by the part instead of the part by the whole, inverting the calculation.`,correct:`Percentage = part ÷ whole × 100 = 20 ÷ 80 × 100 = 25%.`},recap:{keyRule:`Percentage = part ÷ whole × 100 — always identify the whole first.`,shortcut:`If the part is bigger than the whole, expect an answer greater than 100%.`,warning:`Reversing the part and the whole gives a completely different (and usually wrong) answer.`}}},Ci=[{id:`q1-01`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`mcq`,question:`What does the word 'percent' mean?`,options:[`Out of 10`,`Out of 100`,`Out of 1000`,`Out of 1`],correctAnswer:`Out of 100`,explanation:`'Per cent' comes from the Latin for 'out of 100'. Every percentage compares an amount to a whole split into 100 equal parts.`,misconception:`It is easy to confuse percent with per-ten (as in a 1-to-10 scale) — but the word specifically means hundredths.`,hint:`Look at the word itself: "cent" appears in words like century (100 years).`,tags:[`meaning`,`vocabulary`]},{id:`q1-02`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`number`,question:`This 10 × 10 grid has 47 squares shaded. What percentage of the grid is shaded?`,visualData:{kind:`grid`,total:100,filled:47},correctAnswer:`47`,explanation:`A 10 × 10 grid has exactly 100 squares, so the number of shaded squares is the percentage directly: 47 shaded squares = 47%.`,hint:`Count the shaded squares — the grid always has 100 in total.`,tags:[`grid model`]},{id:`q1-03`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`number`,question:`In a class of 100 students, 63 own a bicycle. What percentage of the class owns a bicycle?`,correctAnswer:`63`,explanation:`Because the whole class is 100 students, 63 students out of 100 is simply 63%.`,hint:`When the whole is 100, the part and the percentage are the same number.`,tags:[`part-whole`]},{id:`q1-04`,quizSet:1,module:`foundations`,difficulty:`medium`,type:`number`,question:`A circle is divided into 20 equal sectors. 5 sectors are coloured green. What percentage of the circle is green?`,visualData:{kind:`sectors`,total:20,filled:5},correctAnswer:`25`,explanation:`5 out of 20 sectors is the fraction 5/20, which simplifies to 1/4. Since 1/4 = 25/100, the green part is 25%.`,hint:`First write 5 out of 20 as a fraction, then convert it to a fraction out of 100.`,tags:[`sectors`,`circle model`]},{id:`q1-05`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`mcq`,question:`50% of a whole is the same as...`,options:[`One half`,`One third`,`One quarter`,`One fifth`],correctAnswer:`One half`,explanation:`50% means 50 out of 100, which simplifies to 1/2 — exactly half of the whole.`,tags:[`benchmark`]},{id:`q1-06`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`mcq`,question:`Which fraction is equivalent to 25%?`,options:[`1/4`,`1/3`,`1/5`,`1/2`],correctAnswer:`1/4`,explanation:`25% = 25/100, and dividing the numerator and denominator by 25 gives 1/4.`,misconception:`Some learners guess 1/5 because 25 "looks like" it should relate to 5 — always simplify the fraction 25/100 to check.`,tags:[`benchmark`,`equivalence`]},{id:`q1-07`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`mcq`,question:`Which decimal is equivalent to 10%?`,options:[`1.0`,`0.1`,`0.01`,`10.0`],correctAnswer:`0.1`,explanation:`10% = 10/100 = 0.1. Dividing a percentage by 100 always gives the equivalent decimal.`,tags:[`benchmark`,`decimal`]},{id:`q1-08`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`number`,question:`A percentage bar is shaded up to the 80 mark out of 100. What percentage does this represent?`,visualData:{kind:`bar`,total:100,filled:80},correctAnswer:`80`,explanation:`The bar represents parts out of 100, so a shaded length reaching the 80 mark is 80%.`,tags:[`bar model`]},{id:`q1-09`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`number`,question:`Write '9 out of 100' as a percentage.`,correctAnswer:`9`,explanation:`9 out of 100 is written directly as 9%, since percent already means "out of 100".`,tags:[`meaning`]},{id:`q1-10`,quizSet:1,module:`foundations`,difficulty:`medium`,type:`number`,question:`In a survey of 100 learners, 18 prefer tea and the rest prefer coffee. What percentage prefer coffee?`,correctAnswer:`82`,explanation:`The whole survey is 100%. If 18% prefer tea, the remaining 100 − 18 = 82% must prefer coffee.`,hint:`The two groups together must add up to 100%.`,tags:[`part-whole`,`complement`]},{id:`q1-11`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`truefalse`,question:`True or false: 1% means 1 out of 10.`,options:[`True`,`False`],correctAnswer:`False`,explanation:`1% means 1 out of 100, not 1 out of 10. 1 out of 10 is actually 10%.`,misconception:`Mixing up "per cent" (hundredths) with "per ten" is a very common early mistake.`,tags:[`meaning`]},{id:`q1-12`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`number`,question:`60 squares out of a 10 × 10 grid are shaded. What percentage is shaded?`,visualData:{kind:`grid`,total:100,filled:60},correctAnswer:`60`,explanation:`A 10 × 10 grid always has 100 squares, so 60 shaded squares represent 60%.`,tags:[`grid model`]},{id:`q1-13`,quizSet:1,module:`foundations`,difficulty:`medium`,type:`mcq`,question:`5% is the same as...`,options:[`One half`,`One tenth`,`One twentieth`,`One fifth`],correctAnswer:`One twentieth`,explanation:`5% = 5/100, which simplifies to 1/20 — one twentieth of the whole.`,tags:[`benchmark`]},{id:`q1-14`,quizSet:1,module:`foundations`,difficulty:`easy`,type:`number`,question:`A rectangle is divided into 4 equal parts. 1 part is shaded. What percentage is shaded?`,correctAnswer:`25`,explanation:`1 out of 4 equal parts is the fraction 1/4. Since 1/4 = 25/100, the shaded part is 25%.`,tags:[`part-whole strip`]},{id:`q1-15`,quizSet:1,module:`foundations`,difficulty:`medium`,type:`number`,question:`20 equal sectors make a full circle (100%). How many sectors make 35% of the circle?`,correctAnswer:`7`,explanation:`Each sector is worth 100% ÷ 20 = 5%. To make 35%, you need 35 ÷ 5 = 7 sectors.`,hint:`Work out what percentage one single sector is worth first.`,tags:[`sectors`,`circle model`]}],wi=[{id:`q2-01`,quizSet:2,module:`conversions`,difficulty:`easy`,type:`number`,question:`Write 32% as a decimal.`,correctAnswer:`0.32`,explanation:`To change a percentage into a decimal, divide by 100: 32 ÷ 100 = 0.32.`,hint:`Percentage to decimal: divide by 100.`,tags:[`percent-to-decimal`]},{id:`q2-02`,quizSet:2,module:`conversions`,difficulty:`easy`,type:`number`,question:`Write 0.6 as a percentage.`,correctAnswer:`60`,explanation:`To change a decimal into a percentage, multiply by 100: 0.6 × 100 = 60%.`,hint:`Decimal to percentage: multiply by 100.`,tags:[`decimal-to-percent`]},{id:`q2-03`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`fraction`,question:`Write 75% as a fraction in its simplest form.`,correctAnswer:`3/4`,explanation:`75% = 75/100. Dividing the numerator and denominator by 25 gives 3/4.`,hint:`Write the percentage over 100, then simplify using a common factor.`,tags:[`percent-to-fraction`,`simplifying`]},{id:`q2-04`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`number`,question:`Write 3/5 as a percentage.`,correctAnswer:`60`,explanation:`Create an equivalent fraction with denominator 100: 3/5 = 60/100, which is 60%.`,hint:`Find an equivalent fraction with 100 as the denominator.`,tags:[`fraction-to-percent`]},{id:`q2-05`,quizSet:2,module:`conversions`,difficulty:`easy`,type:`number`,question:`Write 0.08 as a percentage.`,correctAnswer:`8`,explanation:`0.08 × 100 = 8, so 0.08 is equivalent to 8%.`,misconception:`It is tempting to say 0.08 = 80% by moving the point the wrong way — multiplying by 100 moves it two places right, giving 8, not 80.`,tags:[`decimal-to-percent`]},{id:`q2-06`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`number`,question:`Write 4% as a decimal.`,correctAnswer:`0.04`,explanation:`4% = 4 ÷ 100 = 0.04. Because 4 is less than 100, the decimal starts with two zeros after the point.`,misconception:`A common mistake is writing 4% as 0.4. Percent means out of 100, so 4% = 4/100 = 0.04, not 4/10.`,hint:`Divide by 100 — for small percentages this often means extra zeros after the decimal point.`,tags:[`percent-to-decimal`,`common mistake`]},{id:`q2-07`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`fraction`,question:`Simplify 45/100 as a fraction in its simplest form.`,correctAnswer:`9/20`,explanation:`The highest common factor of 45 and 100 is 5. Dividing both by 5 gives 9/20.`,hint:`Find the highest common factor of the numerator and denominator.`,tags:[`simplifying`]},{id:`q2-08`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`mcq`,question:`Which of these is NOT equivalent to 40%?`,options:[`0.4`,`2/5`,`4/25`,`40/100`],correctAnswer:`4/25`,explanation:`4/25 = 16/100 = 16%, not 40%. The other three options — 0.4, 2/5 and 40/100 — all equal 40%.`,hint:`Convert each option to a percentage out of 100 and compare.`,tags:[`equivalence`,`error detective`]},{id:`q2-09`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`fraction`,question:`Write 37.5% as a fraction in its simplest form.`,correctAnswer:`3/8`,explanation:`37.5% = 37.5/100. Multiply top and bottom by 10 to get 375/1000, then divide by 125 to get 3/8.`,hint:`Multiply the numerator and denominator by 10 first to clear the decimal point.`,tags:[`percent-to-fraction`,`decimal percentage`]},{id:`q2-10`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`number`,question:`Write 5/8 as a percentage.`,correctAnswer:`62.5`,explanation:`5 ÷ 8 = 0.625, and 0.625 × 100 = 62.5%.`,hint:`Convert the fraction to a decimal first, then multiply by 100.`,tags:[`fraction-to-percent`]},{id:`q2-11`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`mcq`,question:`Which of these values is the smallest: 77%, 0.8, 7/10, 0.71?`,options:[`77%`,`0.8`,`7/10`,`0.71`],correctAnswer:`7/10`,explanation:`Converting everything to a percentage: 77%, 80%, 70%, 71%. The smallest is 7/10 = 70%.`,hint:`Convert every value into a percentage before comparing.`,tags:[`ordering`]},{id:`q2-12`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`mcq`,question:`Which of these is NOT equal to 3/4?`,options:[`75%`,`0.75`,`7/4`,`75/100`],correctAnswer:`7/4`,explanation:`7/4 is an improper fraction equal to 1.75, or 175% — not 3/4. The others are all equal to 3/4.`,tags:[`equivalence`,`error detective`]},{id:`q2-13`,quizSet:2,module:`conversions`,difficulty:`easy`,type:`number`,question:`A student wrote 0.5 = 5%. What is the correct percentage for the decimal 0.5?`,correctAnswer:`50`,explanation:`To convert a decimal to a percentage, multiply by 100: 0.5 × 100 = 50%, not 5%.`,misconception:`Moving the decimal point only one place instead of two is a frequent slip when converting decimals to percentages.`,tags:[`error detective`,`decimal-to-percent`]},{id:`q2-14`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`number`,question:`Write 1/8 as a percentage.`,correctAnswer:`12.5`,explanation:`1 ÷ 8 = 0.125, and 0.125 × 100 = 12.5%.`,tags:[`fraction-to-percent`]},{id:`q2-15`,quizSet:2,module:`conversions`,difficulty:`medium`,type:`mcq`,question:`Which list correctly shows the same value written as a decimal, a percentage and a fraction?`,options:[`0.45, 45%, 9/20`,`0.45, 4.5%, 9/20`,`0.45, 45%, 4/5`,`4.5, 45%, 9/20`],correctAnswer:`0.45, 45%, 9/20`,explanation:`0.45 × 100 = 45%, and 45/100 simplifies to 9/20 — all three forms match.`,tags:[`equivalent triples`]}],Ti=[{id:`q3-01`,quizSet:3,module:`quantity`,difficulty:`easy`,type:`number`,question:`Find 10% of ฿450.`,correctAnswer:`45`,explanation:`To find 10%, divide by 10: 450 ÷ 10 = 45.`,hint:`10% means dividing by 10.`,tags:[`benchmark`,`money`]},{id:`q3-02`,quizSet:3,module:`quantity`,difficulty:`easy`,type:`number`,question:`Find 20% of 65 students.`,correctAnswer:`13`,explanation:`20% = 1/5, and 65 ÷ 5 = 13.`,hint:`20% is the same as one fifth.`,tags:[`benchmark`,`people`]},{id:`q3-03`,quizSet:3,module:`quantity`,difficulty:`easy`,type:`number`,question:`Find 25% of ฿960.`,correctAnswer:`240`,explanation:`25% = 1/4, and 960 ÷ 4 = 240.`,hint:`25% is one quarter of the amount.`,tags:[`benchmark`,`money`]},{id:`q3-04`,quizSet:3,module:`quantity`,difficulty:`easy`,type:`number`,question:`Find 50% of 84 kg.`,correctAnswer:`42`,explanation:`50% is half: 84 ÷ 2 = 42.`,tags:[`benchmark`,`mass`]},{id:`q3-05`,quizSet:3,module:`quantity`,difficulty:`easy`,type:`number`,question:`Find 5% of ฿700.`,correctAnswer:`35`,explanation:`First find 10% (700 ÷ 10 = 70), then halve it: 70 ÷ 2 = 35.`,hint:`5% is half of 10%.`,tags:[`benchmark`,`money`]},{id:`q3-06`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`Use 10% + 5% to find 15% of ฿300.`,correctAnswer:`45`,explanation:`10% of 300 = 30, and 5% of 300 = 15. Adding these easier parts together: 30 + 15 = 45.`,hint:`Break 15% into 10% plus 5%, then add the results.`,tags:[`break it apart`,`money`]},{id:`q3-07`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`Find 30% of 90 m.`,correctAnswer:`27`,explanation:`10% of 90 = 9, so 30% = 3 × 9 = 27.`,hint:`Find 10% first, then multiply by 3.`,tags:[`benchmark`,`length`]},{id:`q3-08`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`Find 45% of ฿800.`,correctAnswer:`360`,explanation:`50% of 800 = 400, and 5% of 800 = 40. Since 45% = 50% − 5%: 400 − 40 = 360.`,hint:`It can be quicker to find 50% and then subtract 5%.`,tags:[`break it apart`,`money`]},{id:`q3-09`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`Find 70% of 250 kg.`,correctAnswer:`175`,explanation:`10% of 250 = 25, so 70% = 7 × 25 = 175.`,tags:[`benchmark`,`mass`]},{id:`q3-10`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`Use 100% − 5% to find 95% of ฿1,000.`,correctAnswer:`950`,explanation:`5% of 1,000 = 50, so 95% = 1,000 − 50 = 950.`,hint:`It is often faster to subtract a small percentage from the whole amount.`,tags:[`break it apart`,`money`]},{id:`q3-11`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`1% of 900 is 9. Use this to find 3% of 900.`,correctAnswer:`27`,explanation:`If 1% is 9, then 3% is 3 × 9 = 27.`,hint:`Multiply the value of 1% by 3.`,tags:[`find 1%`]},{id:`q3-12`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`mcq`,question:`Which calculation correctly finds 40% of ฿250?`,options:[`0.4 × 250`,`250 ÷ 40`,`40 × 250`,`250 − 40`],correctAnswer:`0.4 × 250`,explanation:`Converting 40% to a decimal (0.4) and multiplying by the amount gives the correct result: 0.4 × 250 = 100.`,tags:[`method`,`decimal method`]},{id:`q3-13`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`A class has 40 students. 25% study French. How many students study French?`,correctAnswer:`10`,explanation:`25% is one quarter, and 40 ÷ 4 = 10 students.`,tags:[`word problem`,`people`]},{id:`q3-14`,quizSet:3,module:`quantity`,difficulty:`medium`,type:`number`,question:`Find 12.5% of 80 m.`,correctAnswer:`10`,explanation:`12.5% = 1/8, and 80 ÷ 8 = 10.`,hint:`12.5% is one eighth of the amount.`,tags:[`benchmark`,`length`]},{id:`q3-15`,quizSet:3,module:`quantity`,difficulty:`hard`,type:`number`,question:`Use the method 10% + 5% to find 15% of ฿640.`,correctAnswer:`96`,explanation:`10% of 640 = 64, and 5% of 640 = 32. Adding these: 64 + 32 = 96.`,tags:[`break it apart`,`money`]}],Ei=[{id:`q4-01`,quizSet:4,module:`small`,difficulty:`medium`,type:`number`,question:`Write 0.5% as a decimal.`,correctAnswer:`0.005`,explanation:`0.5% = 0.5 ÷ 100 = 0.005.`,misconception:`It is easy to write 0.05 instead of 0.005 — dividing by 100 moves the decimal point two places, even when the percentage itself already has a decimal part.`,tags:[`below 1%`,`decimal placement`]},{id:`q4-02`,quizSet:4,module:`small`,difficulty:`hard`,type:`fraction`,question:`Write 0.2% as a fraction in its simplest form.`,correctAnswer:`1/500`,explanation:`0.2% = 0.2/100. Multiplying top and bottom by 10 gives 2/1000, which simplifies to 1/500.`,hint:`Clear the decimal first by multiplying the numerator and denominator by 10.`,tags:[`below 1%`]},{id:`q4-03`,quizSet:4,module:`small`,difficulty:`medium`,type:`number`,question:`1% of 800 is 8. Use this to find 0.5% of 800.`,correctAnswer:`4`,explanation:`0.5% is half of 1%, so half of 8 is 4.`,hint:`0.5% is half of 1%.`,tags:[`below 1%`,`find 1%`]},{id:`q4-04`,quizSet:4,module:`small`,difficulty:`medium`,type:`number`,question:`Find 2.5% of 600.`,correctAnswer:`15`,explanation:`1% of 600 = 6, so 2.5% = 2.5 × 6 = 15.`,tags:[`below 1%`,`decimal percentage`]},{id:`q4-05`,quizSet:4,module:`small`,difficulty:`hard`,type:`fraction`,question:`Write 17.5% as a fraction in its simplest form.`,correctAnswer:`7/40`,explanation:`17.5% = 17.5/100 = 175/1000, which simplifies to 7/40.`,tags:[`decimal percentage`]},{id:`q4-06`,quizSet:4,module:`small`,difficulty:`medium`,type:`mcq`,question:`Which of these is smallest: 5%, 0.5%, 0.05%, 1.5%?`,options:[`5%`,`0.5%`,`0.05%`,`1.5%`],correctAnswer:`0.05%`,explanation:`0.05% is fifty times smaller than 5%. Comparing decimals (0.05, 0.5, 1.5, 5) shows 0.05% is the smallest.`,tags:[`below 1%`,`compare`]},{id:`q4-07`,quizSet:4,module:`large`,difficulty:`easy`,type:`number`,question:`Write 140% as a decimal.`,correctAnswer:`1.4`,explanation:`140% = 140 ÷ 100 = 1.4. Percentages above 100% always give a decimal greater than 1.`,tags:[`above 100%`]},{id:`q4-08`,quizSet:4,module:`large`,difficulty:`medium`,type:`text`,question:`Write 150% as a mixed number.`,correctAnswer:`1 1/2`,acceptedAnswers:[`1 1/2`,`1½`,`1 and 1/2`],explanation:`150% = 150/100 = 1 whole and 50/100 left over, which is 1 1/2.`,tags:[`above 100%`,`mixed number`]},{id:`q4-09`,quizSet:4,module:`large`,difficulty:`medium`,type:`number`,question:`Write 215% as a decimal.`,correctAnswer:`2.15`,explanation:`215% = 215 ÷ 100 = 2.15.`,tags:[`above 100%`]},{id:`q4-10`,quizSet:4,module:`large`,difficulty:`medium`,type:`number`,question:`A quantity increases from 100% to 175%. What is the percentage increase?`,correctAnswer:`75`,explanation:`The increase is the difference between the new and original percentage: 175% − 100% = 75%.`,misconception:`The new value (175%) is not the same as the increase — the increase only counts what was added on top of the original 100%.`,tags:[`increase vs of`]},{id:`q4-11`,quizSet:4,module:`large`,difficulty:`medium`,type:`mcq`,question:`Statement: "A price increases by 120%." Is this possible?`,options:[`Possible`,`Impossible`],correctAnswer:`Possible`,explanation:`A price can increase by any percentage, however large, so a 120% increase is entirely possible — the new price would be 220% of the original.`,tags:[`possible or impossible`]},{id:`q4-12`,quizSet:4,module:`large`,difficulty:`hard`,type:`mcq`,question:`Statement: "A positive length decreases by 130%." Is this possible?`,options:[`Possible`,`Impossible`],correctAnswer:`Impossible`,explanation:`A positive physical quantity cannot decrease by more than 100%, because that would make it negative. A decrease of over 100% is impossible for a length.`,tags:[`possible or impossible`]},{id:`q4-13`,quizSet:4,module:`small`,difficulty:`medium`,type:`number`,question:`Find 0.1% of 5,000.`,correctAnswer:`5`,explanation:`0.1% = 0.001, and 5,000 × 0.001 = 5.`,tags:[`below 1%`]},{id:`q4-14`,quizSet:4,module:`large`,difficulty:`medium`,type:`number`,question:`Write 1¾ as a percentage.`,correctAnswer:`175`,explanation:`1¾ = 1.75, and 1.75 × 100 = 175%.`,tags:[`mixed number`,`above 100%`]},{id:`q4-15`,quizSet:4,module:`large`,difficulty:`hard`,type:`number`,question:`An amount increases by 300%. The new amount is how many times the original?`,correctAnswer:`4`,explanation:`The original amount is 100%. Adding a 300% increase gives 100% + 300% = 400%, which is 4 times the original.`,tags:[`multiplier`,`growth`]}],Di=[{id:`q5-01`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`20 out of 80 students walk to school. What percentage is this?`,correctAnswer:`25`,explanation:`20 ÷ 80 = 0.25, and 0.25 × 100 = 25%.`,hint:`Percentage = part ÷ whole × 100.`,tags:[`part-whole`]},{id:`q5-02`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`Write ฿40 as a percentage of ฿50.`,correctAnswer:`80`,explanation:`40 ÷ 50 = 0.8, and 0.8 × 100 = 80%.`,tags:[`part-whole`,`money`]},{id:`q5-03`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`Write ฿50 as a percentage of ฿40.`,correctAnswer:`125`,explanation:`50 ÷ 40 = 1.25, and 1.25 × 100 = 125%. The answer is above 100% because the part (50) is larger than the whole (40).`,misconception:`Reversing which value is the whole changes the answer completely — this is why identifying the whole correctly matters.`,tags:[`part-whole`,`reversed`,`money`]},{id:`q5-04`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`A shop has 60 shirts. 45 are sold. What percentage are sold?`,correctAnswer:`75`,explanation:`45 ÷ 60 = 0.75, and 0.75 × 100 = 75%.`,tags:[`sold and unsold`]},{id:`q5-05`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`Using the shop in the previous question, what percentage of the shirts are NOT sold?`,correctAnswer:`25`,explanation:`Since 75% are sold, the remaining 100% − 75% = 25% are not sold.`,tags:[`sold and unsold`,`complement`]},{id:`q5-06`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`Nara has ฿500. She spends ฿375. What percentage of her money does she have left?`,correctAnswer:`25`,explanation:`She has ฿500 − ฿375 = ฿125 left. 125 ÷ 500 = 0.25, which is 25%.`,hint:`Find how much money is left first, then find what percentage that is of the original amount.`,tags:[`money spent and remaining`]},{id:`q5-07`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`A recipe uses 240 g of flour from a 400 g bag. What percentage of the flour is used?`,correctAnswer:`60`,explanation:`240 ÷ 400 = 0.6, and 0.6 × 100 = 60%.`,tags:[`recipe`]},{id:`q5-08`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`Tom sleeps for 6 hours of a 24-hour day. What percentage of the day is this?`,correctAnswer:`25`,explanation:`6 ÷ 24 = 0.25, and 0.25 × 100 = 25%.`,tags:[`time allocation`]},{id:`q5-09`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`A price rises from ฿320 to ฿480. What is the percentage increase?`,correctAnswer:`50`,explanation:`The increase is ฿480 − ฿320 = ฿160. As a percentage of the original: 160 ÷ 320 × 100 = 50%.`,hint:`Percentage increase = increase ÷ original × 100.`,tags:[`percentage increase`,`money`]},{id:`q5-10`,quizSet:5,module:`reallife`,difficulty:`hard`,type:`number`,question:`Using the price change above, what percentage of the original price is the new price?`,correctAnswer:`150`,explanation:`480 ÷ 320 × 100 = 150%. This is different from the percentage increase (50%), because it compares the new value to the original rather than just the increase.`,misconception:`The "percentage increase" and "new value as a percentage of the original" are related but different: new% = 100% + increase%.`,tags:[`increase vs of`,`money`]},{id:`q5-11`,quizSet:5,module:`reallife`,difficulty:`medium`,type:`number`,question:`Mira scores 34 out of 40 in a test. What percentage is this?`,correctAnswer:`85`,explanation:`34 ÷ 40 = 0.85, and 0.85 × 100 = 85%.`,tags:[`test scores`]},{id:`q5-12`,quizSet:5,module:`reallife`,difficulty:`hard`,type:`number`,question:`฿90 is what percentage of ฿60?`,correctAnswer:`150`,explanation:`90 ÷ 60 = 1.5, and 1.5 × 100 = 150%. This is above 100% because ฿90 is more than the whole amount, ฿60.`,tags:[`reversed`,`money`]},{id:`q5-13`,quizSet:5,module:`reallife`,difficulty:`hard`,type:`number`,question:`A survey of 250 people found 45 prefer tea. What percentage prefer something other than tea?`,correctAnswer:`82`,explanation:`The number who do not prefer tea is 250 − 45 = 205. As a percentage: 205 ÷ 250 × 100 = 82%.`,tags:[`classroom survey`,`multi-step`]},{id:`q5-14`,quizSet:5,module:`reallife`,difficulty:`hard`,type:`number`,question:`A ฿1,200 laptop is reduced by 15%. What is the new price?`,correctAnswer:`1020`,explanation:`15% of ฿1,200 is ฿180. The new price is ฿1,200 − ฿180 = ฿1,020.`,tags:[`price changes`,`multi-step`]},{id:`q5-15`,quizSet:5,module:`reallife`,difficulty:`hard`,type:`number`,question:`A population grows from 400 to 460. What is the percentage increase?`,correctAnswer:`15`,explanation:`The increase is 460 − 400 = 60. As a percentage of the original: 60 ÷ 400 × 100 = 15%.`,tags:[`percentage increase`]}],Oi=[{id:`q6-01`,quizSet:6,module:`conversions`,difficulty:`easy`,type:`number`,question:`Write 0.09 as a percentage.`,correctAnswer:`9`,explanation:`0.09 × 100 = 9%.`,tags:[`decimal-to-percent`]},{id:`q6-02`,quizSet:6,module:`conversions`,difficulty:`medium`,type:`number`,question:`Write 3/8 as a percentage.`,correctAnswer:`37.5`,explanation:`3 ÷ 8 = 0.375, and 0.375 × 100 = 37.5%.`,tags:[`fraction-to-percent`]},{id:`q6-03`,quizSet:6,module:`quantity`,difficulty:`medium`,type:`number`,question:`Find 35% of ฿240.`,correctAnswer:`84`,explanation:`10% of 240 = 24. So 30% = 72 and 5% = 12, giving 35% = 72 + 12 = 84.`,tags:[`percentage of a quantity`]},{id:`q6-04`,quizSet:6,module:`small`,difficulty:`medium`,type:`number`,question:`Find 0.5% of 1,200.`,correctAnswer:`6`,explanation:`1% of 1,200 = 12, so 0.5% (half of 1%) = 6.`,tags:[`below 1%`]},{id:`q6-05`,quizSet:6,module:`large`,difficulty:`easy`,type:`number`,question:`Write 190% as a decimal.`,correctAnswer:`1.9`,explanation:`190 ÷ 100 = 1.9.`,tags:[`above 100%`]},{id:`q6-06`,quizSet:6,module:`reallife`,difficulty:`medium`,type:`number`,question:`A price increases from ฿80 to ฿100. What is the percentage increase?`,correctAnswer:`25`,explanation:`The increase is ฿20. As a percentage of the original: 20 ÷ 80 × 100 = 25%.`,tags:[`percentage increase`]},{id:`q6-07`,quizSet:6,module:`conversions`,difficulty:`medium`,type:`mcq`,question:`A student says 6% = 0.6. What is the correct decimal for 6%?`,options:[`0.6`,`0.06`,`0.006`,`6.0`],correctAnswer:`0.06`,explanation:`6% = 6 ÷ 100 = 0.06. Percent means out of 100, so dividing by 100 shifts the decimal point two places, not one.`,misconception:`Treating 6% as 6/10 instead of 6/100 leads directly to the incorrect answer 0.6.`,tags:[`error analysis`]},{id:`q6-08`,quizSet:6,module:`large`,difficulty:`medium`,type:`mcq`,question:`Statement: "A student's test score is 140% of their friend's score." Is this possible?`,options:[`Possible`,`Impossible`],correctAnswer:`Possible`,explanation:`One score being 140% of another simply means it is 1.4 times as large — this can easily happen with test scores, so it is possible.`,tags:[`possible or impossible`]},{id:`q6-09`,quizSet:6,module:`large`,difficulty:`medium`,type:`mcq`,question:`Statement: "The mass of a parcel decreases by 150%." Is this possible?`,options:[`Possible`,`Impossible`],correctAnswer:`Impossible`,explanation:`A positive mass cannot decrease by more than 100%, since that would make the mass negative. A 150% decrease is impossible.`,tags:[`possible or impossible`]},{id:`q6-10`,quizSet:6,module:`reallife`,difficulty:`medium`,type:`number`,question:`฿36 is what percentage of ฿48?`,correctAnswer:`75`,explanation:`36 ÷ 48 = 0.75, and 0.75 × 100 = 75%.`,tags:[`part-whole`]},{id:`q6-11`,quizSet:6,module:`quantity`,difficulty:`medium`,type:`number`,question:`Find 15% of ฿480 using 10% + 5%.`,correctAnswer:`72`,explanation:`10% of 480 = 48, and 5% of 480 = 24. Adding these: 48 + 24 = 72.`,tags:[`break it apart`]},{id:`q6-12`,quizSet:6,module:`reallife`,difficulty:`hard`,type:`number`,question:`A shop had 80 items. It sold 60% on Monday, then 25% of the remaining items on Tuesday. How many items are left after Tuesday?`,correctAnswer:`24`,explanation:`60% of 80 = 48 sold on Monday, leaving 32. 25% of 32 = 8 sold on Tuesday, leaving 32 − 8 = 24 items.`,hint:`Work out how many are left after Monday before applying Tuesday's percentage.`,tags:[`multi-step`]},{id:`q6-13`,quizSet:6,module:`large`,difficulty:`medium`,type:`number`,question:`Write 2¼ as a percentage.`,correctAnswer:`225`,explanation:`2¼ = 2.25, and 2.25 × 100 = 225%.`,tags:[`mixed number`]},{id:`q6-14`,quizSet:6,module:`conversions`,difficulty:`hard`,type:`mcq`,question:`Which value is largest: 0.8, 78%, 3/4, 79%?`,options:[`0.8`,`78%`,`3/4`,`79%`],correctAnswer:`0.8`,explanation:`Converting to percentages: 80%, 78%, 75%, 79%. The largest is 0.8, which equals 80%.`,tags:[`ordering`,`compare`]},{id:`q6-15`,quizSet:6,module:`reallife`,difficulty:`hard`,type:`number`,question:`A washing machine costs ฿9,000. The price increases by 20%, then the new price decreases by 20%. What is the final price?`,correctAnswer:`8640`,explanation:`After a 20% increase: 9,000 × 1.2 = ฿10,800. A 20% decrease of this new price is 10,800 × 0.2 = ฿2,160, so the final price is 10,800 − 2,160 = ฿8,640 — not back to the original ฿9,000, because the second 20% is a different amount from the first.`,misconception:`Increasing then decreasing by the same percentage does not return to the original value, because each percentage is calculated from a different starting amount.`,tags:[`multi-step`,`challenge`]}],ki={foundations:[{id:`lc-foundations-01`,quizSet:`lesson`,module:`foundations`,difficulty:`easy`,type:`mcq`,question:`What is 100% of a whole?`,options:[`The whole amount`,`Half the amount`,`None of the amount`,`Double the amount`],correctAnswer:`The whole amount`,explanation:`100% always represents the entire whole — every part of it.`},{id:`lc-foundations-02`,quizSet:`lesson`,module:`foundations`,difficulty:`easy`,type:`number`,question:`15 squares out of a 10 × 10 grid are shaded. What percentage is this?`,visualData:{kind:`grid`,total:100,filled:15},correctAnswer:`15`,explanation:`A 10 × 10 grid has 100 squares, so 15 shaded squares is 15%.`},{id:`lc-foundations-03`,quizSet:`lesson`,module:`foundations`,difficulty:`easy`,type:`mcq`,question:`10% of a whole is the same as...`,options:[`One tenth`,`One hundredth`,`One half`,`One fifth`],correctAnswer:`One tenth`,explanation:`10% = 10/100, which simplifies to 1/10.`},{id:`lc-foundations-04`,quizSet:`lesson`,module:`foundations`,difficulty:`easy`,type:`truefalse`,question:`42 out of 100 is the same as 42%.`,options:[`True`,`False`],correctAnswer:`True`,explanation:`Percent means "out of 100", so 42 out of 100 is exactly 42%.`},{id:`lc-foundations-05`,quizSet:`lesson`,module:`foundations`,difficulty:`medium`,type:`number`,question:`A circle is split into 10 equal sectors. 3 sectors are shaded. What percentage is shaded?`,visualData:{kind:`sectors`,total:10,filled:3},correctAnswer:`30`,explanation:`3 out of 10 sectors is 3/10, which is equal to 30/100, or 30%.`}],conversions:[{id:`lc-conversions-01`,quizSet:`lesson`,module:`conversions`,difficulty:`easy`,type:`number`,question:`Write 20% as a decimal.`,correctAnswer:`0.2`,explanation:`20 ÷ 100 = 0.2.`},{id:`lc-conversions-02`,quizSet:`lesson`,module:`conversions`,difficulty:`easy`,type:`number`,question:`Write 0.9 as a percentage.`,correctAnswer:`90`,explanation:`0.9 × 100 = 90%.`},{id:`lc-conversions-03`,quizSet:`lesson`,module:`conversions`,difficulty:`medium`,type:`fraction`,question:`Write 50% as a fraction in its simplest form.`,correctAnswer:`1/2`,explanation:`50% = 50/100, which simplifies to 1/2.`},{id:`lc-conversions-04`,quizSet:`lesson`,module:`conversions`,difficulty:`medium`,type:`number`,question:`Write 1/4 as a percentage.`,correctAnswer:`25`,explanation:`1/4 = 25/100 = 25%.`},{id:`lc-conversions-05`,quizSet:`lesson`,module:`conversions`,difficulty:`medium`,type:`mcq`,question:`Which is equivalent to 0.75?`,options:[`75%`,`7.5%`,`750%`,`0.075%`],correctAnswer:`75%`,explanation:`0.75 × 100 = 75%.
